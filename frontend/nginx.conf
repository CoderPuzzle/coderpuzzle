pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://api:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Pass the edge's view through instead of this plain-HTTP hop's:
      # the API derives the session cookie's Secure flag and the login
      # throttle key from these headers. The edge terminates TLS and is
      # expected to set X-Forwarded-Proto/X-Forwarded-For; when it sends
      # none, X-Forwarded-Proto falls back to empty (the API then uses the
      # real scheme) and X-Forwarded-For degrades to the edge's address.
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      client_max_body_size 256k;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}

