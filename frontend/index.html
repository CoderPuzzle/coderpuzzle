<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1113" />
    <meta name="description" content="A focused, containerized online judge." />
    <link rel="icon" type="image/svg+xml" href="/coderpuzzle-icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("openoj:theme");
        } catch {
          // System preference remains the safe fallback.
        }
        const system = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light" ? saved : system;
      })();
    </script>
    <title>CoderPuzzle — Practice library</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
