<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>CoderPuzzle</title>
  <defs>
    <radialGradient id="badge" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#272115"/>
      <stop offset="55%" stop-color="#1a150c"/>
      <stop offset="100%" stop-color="#0d0b06"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7c76a"/>
      <stop offset="100%" stop-color="#d99433"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0%" stop-color="#35a86d"/>
      <stop offset="100%" stop-color="#70e5a5"/>
    </linearGradient>
  </defs>
  <!-- App-icon badge: warm dark radial drawn from the app's seal palette -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#badge)"/>
  <rect x="16" y="16" width="480" height="480" rx="102" fill="none" stroke="#e1a84b" stroke-opacity="0.18" stroke-width="3"/>
  <!-- Jigsaw piece with the Accepted check stamped on: a solved puzzle -->
  <g transform="rotate(-8 256 300)">
    <path d="M 134 200 L 215 200 A 44 44 0 1 1 297 200 L 379 200 L 379 445 L 302 445 A 46 46 0 0 0 210 445 L 134 445 Z"
          fill="url(#amber)"/>
    <path d="M 200 306 L 244 350 L 316 252" fill="none" stroke="#1d1710" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 200 306 L 244 350 L 316 252" fill="none" stroke="url(#green)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
