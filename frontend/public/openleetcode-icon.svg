<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>OpenLeetCode</title>
  <defs>
    <radialGradient id="badge" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#272115"/>
      <stop offset="55%" stop-color="#1a150c"/>
      <stop offset="100%" stop-color="#0d0b06"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7c76a"/>
      <stop offset="100%" stop-color="#d99433"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0%" stop-color="#35a86d"/>
      <stop offset="100%" stop-color="#70e5a5"/>
    </linearGradient>
  </defs>
  <!-- App-icon badge: warm dark radial drawn from the app's seal palette -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#badge)"/>
  <rect x="16" y="16" width="480" height="480" rx="102" fill="none" stroke="#e1a84b" stroke-opacity="0.18" stroke-width="3"/>
  <!-- Code ticks flank the Accepted check; the right tick tucks behind its sweep -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 148 204 L 96 256 L 148 308" stroke="url(#amber)" stroke-width="36"/>
    <path d="M 364 204 L 416 256 L 364 308" stroke="url(#amber)" stroke-width="36"/>
    <path d="M 168 262 L 244 336 L 356 176" stroke="url(#green)" stroke-width="50"/>
  </g>
</svg>
