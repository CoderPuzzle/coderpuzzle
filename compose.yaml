name: coderpuzzle

services:
  web:
    build:
      context: ./frontend
    ports:
      # Served directly, plain HTTP; TLS is terminated by an external edge.
      - "${CODERPUZZLE_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0750
      - /var/run:size=1m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      # web needs a non-internal network: Docker 29.x does not publish ports
      # for containers that sit only on an `internal: true` network, which
      # silently dropped the 8081 host binding below. `app` keeps it able to
      # reach api:8000; `edge` makes the published port actually bind.
      - app
      - edge

  problems-fetcher:
    # One-shot: the only component allowed to reach github.com; fills the
    # problems_cache volume before the networkless API starts. No-op when
    # CODERPUZZLE_PROBLEMS is unset or local.
    build:
      context: ./api
    entrypoint: [ "python", "-m", "app.fetch_problems" ]
    environment:
      CODERPUZZLE_PROBLEMS: ${CODERPUZZLE_PROBLEMS:-CoderPuzzle/coderpuzzle-problems}
      CODERPUZZLE_PROBLEMS_CACHE: /cache/problems
      HOME: /tmp
    volumes:
      - ${CODERPUZZLE_PROBLEMS_CACHE_DIR:-./.cache}:/cache
    # The fetcher runs as root because it is the one component that must write
    # to the host-shared ./.cache directory, which Docker creates root-owned.
    # It stays read_only with all capabilities dropped and no-new-privileges;
    # root-created clones (umask 022) remain world-readable so the unprivileged
    # API container can serve them read-only.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - edge

  api:
    build:
      context: ./api
    depends_on:
      problems-fetcher:
        condition: service_completed_successfully
    environment:
      CODERPUZZLE_PROBLEMS: ${CODERPUZZLE_PROBLEMS:-CoderPuzzle/coderpuzzle-problems}
      CODERPUZZLE_PROBLEMS_CACHE: /cache/problems
      CODERPUZZLE_PROBLEMS_DIR: /problems
      CODERPUZZLE_DATA_DIR: /data
      CODERPUZZLE_QUEUE_DIR: /queue
      CODERPUZZLE_RUNNER_TIMEOUT_SECONDS: "20"
      # Browser-facing origin for OAuth redirect_uris (web origin, not the
      # compose-internal API URL). Empty = derive from X-Forwarded-*.
      CODERPUZZLE_PUBLIC_URL: ${CODERPUZZLE_PUBLIC_URL:-}
      CODERPUZZLE_AUTH_REGISTRATION: ${CODERPUZZLE_AUTH_REGISTRATION:-closed}
      CODERPUZZLE_AUTH_GOOGLE_CLIENT_ID: ${CODERPUZZLE_AUTH_GOOGLE_CLIENT_ID:-}
      CODERPUZZLE_AUTH_GOOGLE_CLIENT_SECRET: ${CODERPUZZLE_AUTH_GOOGLE_CLIENT_SECRET:-}
      CODERPUZZLE_AUTH_GITHUB_CLIENT_ID: ${CODERPUZZLE_AUTH_GITHUB_CLIENT_ID:-}
      CODERPUZZLE_AUTH_GITHUB_CLIENT_SECRET: ${CODERPUZZLE_AUTH_GITHUB_CLIENT_SECRET:-}
      CODERPUZZLE_AUTH_X_CLIENT_ID: ${CODERPUZZLE_AUTH_X_CLIENT_ID:-}
      CODERPUZZLE_AUTH_X_CLIENT_SECRET: ${CODERPUZZLE_AUTH_X_CLIENT_SECRET:-}
      CODERPUZZLE_AUTH_OIDC_ISSUER: ${CODERPUZZLE_AUTH_OIDC_ISSUER:-}
      CODERPUZZLE_AUTH_OIDC_CLIENT_ID: ${CODERPUZZLE_AUTH_OIDC_CLIENT_ID:-}
      CODERPUZZLE_AUTH_OIDC_CLIENT_SECRET: ${CODERPUZZLE_AUTH_OIDC_CLIENT_SECRET:-}
      CODERPUZZLE_AUTH_OIDC_LABEL: ${CODERPUZZLE_AUTH_OIDC_LABEL:-}
      CODERPUZZLE_AUTH_OIDC_SCOPES: ${CODERPUZZLE_AUTH_OIDC_SCOPES:-}
      CODERPUZZLE_AUTH_EMAIL_OTP: ${CODERPUZZLE_AUTH_EMAIL_OTP:-}
      CODERPUZZLE_AUTH_SMTP_HOST: ${CODERPUZZLE_AUTH_SMTP_HOST:-}
      CODERPUZZLE_AUTH_SMTP_PORT: ${CODERPUZZLE_AUTH_SMTP_PORT:-}
      CODERPUZZLE_AUTH_SMTP_USER: ${CODERPUZZLE_AUTH_SMTP_USER:-}
      CODERPUZZLE_AUTH_SMTP_PASSWORD: ${CODERPUZZLE_AUTH_SMTP_PASSWORD:-}
      CODERPUZZLE_AUTH_SMTP_FROM: ${CODERPUZZLE_AUTH_SMTP_FROM:-}
      # Writable home; the api itself never runs git (the fetcher service
      # does), but the image ships git for it and HOME must exist for both.
      HOME: /tmp
    volumes:
      - "${CODERPUZZLE_PROBLEMS_PATH:-./problems}:/problems:ro"
      - ${CODERPUZZLE_PROBLEMS_CACHE_DIR:-./.cache}:/cache:ro
      - coderpuzzle_data:/data
      - judge_queue:/queue
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app
      # OAuth/OIDC token exchange and email OTP need outbound HTTPS. The
      # API still has no published ports; the runner stays network_mode none.
      - edge

  runner:
    build:
      context: ./runner
    environment:
      CODERPUZZLE_QUEUE_DIR: /queue
      CODERPUZZLE_POLL_INTERVAL: "0.05"
    volumes:
      - judge_queue:/queue
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
      - /work:size=384m,mode=1777,exec
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETUID
      - SETGID
    group_add:
      - "10001"
    mem_limit: 768m
    cpus: 1.5
    # Concurrency problems run a schedule of real threads, and the cgroup
    # counts every thread as a pid; the ceiling has to clear the largest
    # schedule plus the runner's own processes. Each submission is still
    # bounded individually by RLIMIT_NPROC, sized from the problem.
    pids_limit: 512
    restart: unless-stopped

volumes:
  coderpuzzle_data:
  judge_queue:

networks:
  app:
    internal: true
  # Non-internal network so the one-shot problems-fetcher can reach the
  # remote problem set; everything else lives on the internal app network.
  edge:
