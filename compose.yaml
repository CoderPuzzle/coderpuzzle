name: openoj

services:
  web:
    build:
      context: ./frontend
    ports:
      # Served directly, plain HTTP; TLS is terminated by an external edge.
      - "${OPENOJ_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,uid=101,gid=101,mode=0750
      - /var/run:size=1m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      # web needs a non-internal network: Docker 29.x does not publish ports
      # for containers that sit only on an `internal: true` network, which
      # silently dropped the 8081 host binding below. `app` keeps it able to
      # reach api:8000; `edge` makes the published port actually bind.
      - app
      - edge

  problems-fetcher:
    # One-shot: the only component allowed to reach github.com; fills the
    # problems_cache volume before the networkless API starts. No-op when
    # OPENOJ_PROBLEMS is unset or local.
    build:
      context: ./api
    entrypoint: [ "python", "-m", "app.fetch_problems" ]
    environment:
      OPENOJ_PROBLEMS: ${OPENOJ_PROBLEMS:-CoderPuzzle/coderpuzzle-problems}
      OPENOJ_PROBLEMS_CACHE: /cache/problems
      HOME: /tmp
    volumes:
      - ${OPENOJ_PROBLEMS_CACHE_DIR:-./.cache}:/cache
    # The fetcher runs as root because it is the one component that must write
    # to the host-shared ./.cache directory, which Docker creates root-owned.
    # It stays read_only with all capabilities dropped and no-new-privileges;
    # root-created clones (umask 022) remain world-readable so the unprivileged
    # API container can serve them read-only.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - edge

  api:
    build:
      context: ./api
    depends_on:
      problems-fetcher:
        condition: service_completed_successfully
    environment:
      OPENOJ_PROBLEMS: ${OPENOJ_PROBLEMS:-CoderPuzzle/coderpuzzle-problems}
      OPENOJ_PROBLEMS_CACHE: /cache/problems
      OPENOJ_PROBLEMS_DIR: /problems
      OPENOJ_DATA_DIR: /data
      OPENOJ_QUEUE_DIR: /queue
      OPENOJ_RUNNER_TIMEOUT_SECONDS: "20"
      # Writable home so git (used to fetch remote problem sets) can operate
      HOME: /tmp
    volumes:
      - "${OPENOJ_PROBLEMS_PATH:-./problems}:/problems:ro"
      - ${OPENOJ_PROBLEMS_CACHE_DIR:-./.cache}:/cache:ro
      - openoj_data:/data
      - judge_queue:/queue
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app

  runner:
    build:
      context: ./runner
    environment:
      OPENOJ_QUEUE_DIR: /queue
      OPENOJ_POLL_INTERVAL: "0.05"
    volumes:
      - judge_queue:/queue
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
      - /work:size=384m,mode=1777,exec
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETUID
      - SETGID
    group_add:
      - "10001"
    mem_limit: 768m
    cpus: 1.5
    # Concurrency problems run a schedule of real threads, and the cgroup
    # counts every thread as a pid; the ceiling has to clear the largest
    # schedule plus the runner's own processes. Each submission is still
    # bounded individually by RLIMIT_NPROC, sized from the problem.
    pids_limit: 512
    restart: unless-stopped

volumes:
  openoj_data:
  judge_queue:

networks:
  app:
    internal: true
  # Non-internal network so the one-shot problems-fetcher can reach the
  # remote problem set; everything else lives on the internal app network.
  edge:
