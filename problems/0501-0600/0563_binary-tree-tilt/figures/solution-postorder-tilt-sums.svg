<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 376" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="376" fill="#ffffff"/>
  <!-- tree [4,2,9,3,5,null,7]: 4 (330,70), 2 (200,176), 9 (460,176), 3 (120,276), 5 (270,276), 7 (530,276);
       post-order sums 3,5,10,16,7,30; tilts 0,0,2,7,0,6; total 15 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="313" y1="92" x2="217" y2="156"/>
    <line x1="347" y1="92" x2="443" y2="156"/>
    <line x1="186" y1="194" x2="134" y2="258"/>
    <line x1="214" y1="194" x2="256" y2="258"/>
    <line x1="474" y1="194" x2="517" y2="258"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="330" cy="70" r="22"/>
    <circle cx="200" cy="176" r="22"/>
    <circle cx="460" cy="176" r="22"/>
    <circle cx="120" cy="276" r="20"/>
    <circle cx="270" cy="276" r="20"/>
    <circle cx="530" cy="276" r="20"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="330" y="76">4</text>
    <text x="200" y="182">2</text>
    <text x="460" y="182">9</text>
    <text x="120" y="282">3</text>
    <text x="270" y="282">5</text>
    <text x="530" y="282">7</text>
  </g>
  <!-- per-node subtree sum and tilt -->
  <text x="330" y="24" text-anchor="middle" fill="#1a2026" font-size="13">sum 30 · tilt |10 − 16| = <tspan fill="#4169E1" font-weight="600">6</tspan></text>
  <text x="166" y="172" text-anchor="end" fill="#5c6b76" font-size="12.5">|3 − 5| = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="200" y="214" text-anchor="middle" fill="#1a2026" font-size="12.5">sum 10</text>
  <text x="494" y="172" text-anchor="start" fill="#5c6b76" font-size="12.5">|0 − 7| = <tspan fill="#4169E1" font-weight="600">7</tspan></text>
  <text x="460" y="214" text-anchor="middle" fill="#1a2026" font-size="12.5">sum 16</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="120" y="310">sum 3 · tilt 0</text>
    <text x="270" y="310">sum 5 · tilt 0</text>
    <text x="530" y="310">sum 7 · tilt 0</text>
  </g>
  <text x="330" y="344" text-anchor="middle" fill="#1a2026" font-size="13">Post-order: each visit adds |left − right| to the total and hands</text>
  <text x="330" y="362" text-anchor="middle" fill="#1a2026" font-size="13">val + left + right upward — tilts 0 + 0 + 0 + 2 + 7 + 6 = <tspan fill="#4169E1" font-weight="600">15</tspan>.</text>
</svg>
