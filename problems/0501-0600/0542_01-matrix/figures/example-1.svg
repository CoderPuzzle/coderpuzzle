<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="18">
  <rect width="460" height="250" fill="#ffffff"/>
  <!-- distances to the nearest 0; here the input already equals the output -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="36" width="62" height="62" fill="#4169E1" fill-opacity="0.15"/><rect x="132" y="36" width="62" height="62" fill="#4169E1" fill-opacity="0.15"/><rect x="194" y="36" width="62" height="62" fill="#4169E1" fill-opacity="0.15"/>
    <rect x="70" y="98" width="62" height="62" fill="#4169E1" fill-opacity="0.15"/><rect x="132" y="98" width="62" height="62" fill="#ffffff"/><rect x="194" y="98" width="62" height="62" fill="#4169E1" fill-opacity="0.15"/>
    <rect x="70" y="160" width="62" height="62" fill="#4169E1" fill-opacity="0.15"/><rect x="132" y="160" width="62" height="62" fill="#4169E1" fill-opacity="0.15"/><rect x="194" y="160" width="62" height="62" fill="#4169E1" fill-opacity="0.15"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="101" y="73">0</text><text x="163" y="73">0</text><text x="225" y="73">0</text>
    <text x="101" y="135">0</text><text x="163" y="135">1</text><text x="225" y="135">0</text>
    <text x="101" y="197">0</text><text x="163" y="197">0</text><text x="225" y="197">0</text>
  </g>
  <g font-size="14">
    <text x="300" y="106" fill="#1a2026">each cell holds its distance</text>
    <text x="300" y="130" fill="#1a2026">to the nearest 0;</text>
    <text x="300" y="160" fill="#5c6b76">here the input and the</text>
    <text x="300" y="184" fill="#5c6b76">output are identical</text>
  </g>
</svg>
