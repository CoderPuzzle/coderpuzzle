<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="348" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- pid = [1,3,10,5], ppid = [3,0,5,3], kill = 5; children map {0:[3], 3:[1,5], 5:[10]};
       nodes r=17: tree at left, BFS list boxes at (380,120); killed set = {5, 10} -->
  <text x="110" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">ppid inverted: parent → children</text>
  <!-- tree edges -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="84" y1="77" x2="84" y2="119"/>
    <line x1="75.8" y1="150.9" x2="50.2" y2="197.1"/>
    <line x1="93.8" y1="149.9" x2="128.2" y2="198.1"/>
  </g>
  <line x1="138" y1="229" x2="138" y2="261" stroke="#4169E1" stroke-width="2"/>
  <!-- nodes; the killed subtree {5, 10} accented, the untouched root muted -->
  <g stroke-width="1.5">
    <circle cx="84" cy="60" r="17" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="84" cy="136" r="17" fill="#ffffff" stroke="#42525e"/>
    <circle cx="42" cy="212" r="17" fill="#ffffff" stroke="#42525e"/>
    <circle cx="138" cy="212" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <circle cx="138" cy="278" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="84" y="65" fill="#9aa7b2">0</text>
    <text x="84" y="141" fill="#1a2026">3</text>
    <text x="42" y="217" fill="#1a2026">1</text>
    <text x="138" y="217" fill="#4169E1">5</text>
    <text x="138" y="283" fill="#4169E1">10</text>
  </g>
  <text x="162" y="216" fill="#4169E1" font-size="11">kill</text>
  <!-- the output list is the queue -->
  <text x="480" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">the output list is the queue</text>
  <text x="396" y="108" text-anchor="end" fill="#5c6b76" font-size="11">head</text>
  <path d="M 406 100 V 112" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g stroke="#4169E1" stroke-width="2">
    <rect x="380" y="120" width="52" height="44" fill="#dbe4fb"/>
    <rect x="436" y="120" width="52" height="44" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#4169E1">
    <text x="406" y="147">5</text><text x="462" y="147">10</text>
  </g>
  <text x="434" y="184" text-anchor="middle" fill="#5c6b76" font-size="11.5">killed set, BFS order</text>
  <g fill="#5c6b76" font-size="12">
    <text x="330" y="224">invert ppid → children: 3 → [1, 5], 5 → [10]</text>
    <text x="330" y="248">walk from kill = 5: the list starts [5]</text>
    <text x="330" y="272">head 5 → append 10; head 10 → leaf: done</text>
  </g>
  <text x="330" y="314" text-anchor="middle" fill="#1a2026" font-size="13">Breadth-first from kill = 5 reaches exactly its subtree {5, 10};</text>
  <text x="330" y="334" text-anchor="middle" fill="#1a2026" font-size="13">the answer <tspan fill="#4169E1" font-weight="600">[5, 10]</tspan> is the killed set in the required order.</text>
</svg>
