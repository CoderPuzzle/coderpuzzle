<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="340" fill="#ffffff"/>
  <!-- amount 5, coins [1,2,5]; seed dp[0]=1; dp cells 64x40 at x=150+64a, rows y=64/136/208; tinted cells changed on that pass -->
  <text x="150" y="30" fill="#5c6b76" font-size="12">seed: dp[0] = 1 (the empty combination)</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="182" y="56">a = 0</text><text x="246" y="56">a = 1</text><text x="310" y="56">a = 2</text>
    <text x="374" y="56">a = 3</text><text x="438" y="56">a = 4</text><text x="502" y="56">a = 5</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="140" y="89">after coin 1</text>
    <text x="140" y="161">after coin 2</text>
    <text x="140" y="233">after coin 5</text>
  </g>
  <!-- row after coin 1: dp = [1,1,1,1,1,1], cells a=1..5 changed -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="150" y="64" width="64" height="40" fill="#ffffff"/>
    <rect x="214" y="64" width="64" height="40" fill="#dbe4fb"/>
    <rect x="278" y="64" width="64" height="40" fill="#dbe4fb"/>
    <rect x="342" y="64" width="64" height="40" fill="#dbe4fb"/>
    <rect x="406" y="64" width="64" height="40" fill="#dbe4fb"/>
    <rect x="470" y="64" width="64" height="40" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="182" y="89" fill="#1a2026">1</text><text x="246" y="89" fill="#1a2026">1</text>
    <text x="310" y="89" fill="#1a2026">1</text><text x="374" y="89" fill="#1a2026">1</text>
    <text x="438" y="89" fill="#1a2026">1</text><text x="502" y="89" fill="#4169E1">1</text>
  </g>
  <!-- row after coin 2: dp = [1,1,2,2,3,3], cells a=2..5 changed -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="150" y="136" width="64" height="40" fill="#ffffff"/>
    <rect x="214" y="136" width="64" height="40" fill="#ffffff"/>
    <rect x="278" y="136" width="64" height="40" fill="#dbe4fb"/>
    <rect x="342" y="136" width="64" height="40" fill="#dbe4fb"/>
    <rect x="406" y="136" width="64" height="40" fill="#dbe4fb"/>
    <rect x="470" y="136" width="64" height="40" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="182" y="161" fill="#1a2026">1</text><text x="246" y="161" fill="#1a2026">1</text>
    <text x="310" y="161" fill="#1a2026">2</text><text x="374" y="161" fill="#1a2026">2</text>
    <text x="438" y="161" fill="#1a2026">3</text><text x="502" y="161" fill="#4169E1">3</text>
  </g>
  <!-- row after coin 5: dp = [1,1,2,2,3,4], only a=5 changes -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="150" y="208" width="64" height="40" fill="#ffffff"/>
    <rect x="214" y="208" width="64" height="40" fill="#ffffff"/>
    <rect x="278" y="208" width="64" height="40" fill="#ffffff"/>
    <rect x="342" y="208" width="64" height="40" fill="#ffffff"/>
    <rect x="406" y="208" width="64" height="40" fill="#ffffff"/>
    <rect x="470" y="208" width="64" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="182" y="233" fill="#1a2026">1</text><text x="246" y="233" fill="#1a2026">1</text>
    <text x="310" y="233" fill="#1a2026">2</text><text x="374" y="233" fill="#1a2026">2</text>
    <text x="438" y="233" fill="#1a2026">3</text><text x="502" y="233" fill="#4169E1">4</text>
  </g>
  <!-- per-pass loop bounds -->
  <g fill="#5c6b76" font-size="12">
    <text x="548" y="80">a = 1..5</text>
    <text x="548" y="98">dp[a] += dp[a - 1]</text>
    <text x="548" y="152">a = 2..5</text>
    <text x="548" y="170">dp[a] += dp[a - 2]</text>
    <text x="548" y="224">a = 5</text>
    <text x="548" y="242">dp[5] += dp[0]</text>
  </g>
  <text x="340" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Each denomination finishes its whole pass before the next starts: dp[5] grows <tspan fill="#4169E1" font-weight="600">1 → 3 → 4</tspan>.</text>
  <text x="340" y="318" text-anchor="middle" fill="#1a2026" font-size="13">One fixed coin order per combination, so the four multisets are each counted exactly once.</text>
</svg>
