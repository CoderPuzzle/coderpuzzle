      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <line x1="60" y1="250" x2="366" y2="250" stroke="#1a2026" stroke-width="1.4" marker-end="url(#ax)"/>
  <line x1="60" y1="250" x2="60" y2="52" stroke="#1a2026" stroke-width="1.4" marker-end="url(#ax)"/>
  <g fill="#5c6b76" font-size="11" text-anchor="middle">
    <text x="118" y="268">1</text><text x="176" y="268">2</text><text x="234" y="268">3</text><text x="292" y="268">4</text><text x="350" y="268">5</text>
    <text x="48" y="196">1</text><text x="48" y="138">2</text><text x="48" y="80">3</text>
  </g>
  <!-- all trees on the line y = 2 -->
  <line x1="84" y1="134" x2="342" y2="134" stroke="#4169E1" stroke-width="2"/>
  <g fill="#3f7d3a" stroke="#2c5a29" stroke-width="0.8">
    <g><polygon points="118,118 110,132 126,132"/><rect x="116.5" y="132" width="3" height="7"/></g>
    <g><polygon points="176,118 168,132 184,132"/><rect x="174.5" y="132" width="3" height="7"/></g>
    <g><polygon points="292,118 284,132 300,132"/><rect x="290.5" y="132" width="3" height="7"/></g>
  </g>
  <text x="220" y="290" text-anchor="middle" fill="#1a2026" font-size="12.5">collinear trees — the fence degenerates to a straight line through all of them</text>
</svg>
