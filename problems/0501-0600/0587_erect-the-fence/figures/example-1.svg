<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="330" x2="366" y2="330" stroke="#1a2026" stroke-width="1.4" marker-end="url(#ax)"/>
  <line x1="60" y1="330" x2="60" y2="72" stroke="#1a2026" stroke-width="1.4" marker-end="url(#ax)"/>
  <g fill="#5c6b76" font-size="11" text-anchor="middle">
    <text x="118" y="348">1</text><text x="176" y="348">2</text><text x="234" y="348">3</text><text x="292" y="348">4</text><text x="350" y="348">5</text>
    <text x="48" y="276">1</text><text x="48" y="218">2</text><text x="48" y="160">3</text><text x="48" y="102">4</text>
  </g>
  <!-- fence = convex hull through (1,1) (2,0) (4,2) (3,3) (2,4) -->
  <polygon points="118,272 176,330 292,214 234,156 176,98" fill="#4169E1" fill-opacity="0.06" stroke="#4169E1" stroke-width="2"/>
  <!-- trees: apex triangle + trunk -->
  <g fill="#3f7d3a" stroke="#2c5a29" stroke-width="0.8">
    <g><polygon points="118,256 110,270 126,270"/><rect x="116.5" y="270" width="3" height="7"/></g>
    <g><polygon points="176,198 168,212 184,212"/><rect x="174.5" y="212" width="3" height="7"/></g>
    <g><polygon points="176,314 168,328 184,328"/><rect x="174.5" y="328" width="3" height="7"/></g>
    <g><polygon points="176,82 168,96 184,96"/><rect x="174.5" y="96" width="3" height="7"/></g>
    <g><polygon points="234,140 226,154 242,154"/><rect x="232.5" y="154" width="3" height="7"/></g>
    <g><polygon points="292,198 284,212 300,212"/><rect x="290.5" y="212" width="3" height="7"/></g>
  </g>
  <text x="205" y="252" fill="#5c6b76" font-size="12.5">(2, 2) stays inside</text>
  <line x1="203" y1="238" x2="180" y2="212" stroke="#5c6b76" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="220" y="374" text-anchor="middle" fill="#1a2026" font-size="12.5">the fence is the convex hull — every tree on it is on the perimeter</text>
</svg>
