<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="139" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">1 move — 2 ways</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="none">
    <rect x="40" y="64" width="68" height="68"/>
    <line x1="74" y1="64" x2="74" y2="132"/>
    <line x1="40" y1="98" x2="108" y2="98"/>
    <rect x="170" y="64" width="68" height="68"/>
    <line x1="204" y1="64" x2="204" y2="132"/>
    <line x1="170" y1="98" x2="238" y2="98"/>
  </g>
  <circle cx="57" cy="81" r="8" fill="#1a2026"/>
  <line x1="57" y1="60" x2="57" y2="38" stroke="#4169E1" stroke-width="2" marker-end="url(#aA)"/>
  <circle cx="187" cy="81" r="8" fill="#1a2026"/>
  <line x1="166" y1="81" x2="144" y2="81" stroke="#4169E1" stroke-width="2" marker-end="url(#aA)"/>

  <text x="269" y="214" text-anchor="middle" fill="#5c6b76" font-size="12.5">2 moves — 4 ways</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="none">
    <rect x="40" y="232" width="68" height="68"/>
    <line x1="74" y1="232" x2="74" y2="300"/>
    <line x1="40" y1="266" x2="108" y2="266"/>
    <rect x="170" y="232" width="68" height="68"/>
    <line x1="204" y1="232" x2="204" y2="300"/>
    <line x1="170" y1="266" x2="238" y2="266"/>
    <rect x="300" y="232" width="68" height="68"/>
    <line x1="334" y1="232" x2="334" y2="300"/>
    <line x1="300" y1="266" x2="368" y2="266"/>
    <rect x="430" y="232" width="68" height="68"/>
    <line x1="464" y1="232" x2="464" y2="300"/>
    <line x1="430" y1="266" x2="498" y2="266"/>
  </g>
  <!-- right, then out the top -->
  <circle cx="57" cy="249" r="8" fill="#c9d2da"/>
  <line x1="63" y1="249" x2="85" y2="249" stroke="#1a2026" stroke-width="1.4" marker-end="url(#aI)"/>
  <circle cx="91" cy="249" r="8" fill="#1a2026"/>
  <line x1="91" y1="228" x2="91" y2="206" stroke="#4169E1" stroke-width="2" marker-end="url(#aA)"/>
  <!-- right, then out the right -->
  <circle cx="187" cy="249" r="8" fill="#c9d2da"/>
  <line x1="193" y1="249" x2="215" y2="249" stroke="#1a2026" stroke-width="1.4" marker-end="url(#aI)"/>
  <circle cx="221" cy="249" r="8" fill="#1a2026"/>
  <line x1="242" y1="249" x2="264" y2="249" stroke="#4169E1" stroke-width="2" marker-end="url(#aA)"/>
  <!-- down, then out the bottom -->
  <circle cx="357" cy="249" r="8" fill="#c9d2da"/>
  <line x1="357" y1="255" x2="357" y2="277" stroke="#1a2026" stroke-width="1.4" marker-end="url(#aI)"/>
  <circle cx="357" cy="283" r="8" fill="#1a2026"/>
  <line x1="357" y1="304" x2="357" y2="326" stroke="#4169E1" stroke-width="2" marker-end="url(#aA)"/>
  <!-- down, then out the left -->
  <circle cx="447" cy="249" r="8" fill="#c9d2da"/>
  <line x1="447" y1="255" x2="447" y2="277" stroke="#1a2026" stroke-width="1.4" marker-end="url(#aI)"/>
  <circle cx="447" cy="283" r="8" fill="#1a2026"/>
  <line x1="426" y1="283" x2="404" y2="283" stroke="#4169E1" stroke-width="2" marker-end="url(#aA)"/>

  <text x="270" y="356" text-anchor="middle" fill="#1a2026" font-size="12.5">2 + 4 = 6 paths leave the grid within 2 moves</text>
</svg>
