<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- m = n = 2, maxMove = 2, start (0,0); cells 78x48; pass-1 grid at (96,110), pass-2 at (406,110);
       pass 1: every corner cell = 1+1 = 2; pass 2: (0,0) = exits 1+1 + neighbors 2+2 = 6 -->
  <!-- pass 1 grid: (0,0) accented as the start cell -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="96" y="110" width="78" height="48" fill="#dbe4fb"/>
    <rect x="174" y="110" width="78" height="48" fill="#ffffff"/>
    <rect x="96" y="158" width="78" height="48" fill="#ffffff"/>
    <rect x="174" y="158" width="78" height="48" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="135" y="133" fill="#4169E1">2</text><text x="213" y="133" fill="#1a2026">2</text>
    <text x="135" y="181" fill="#1a2026">2</text><text x="213" y="181" fill="#1a2026">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="135" y="151">1 + 1</text><text x="213" y="151">1 + 1</text>
    <text x="135" y="199">1 + 1</text><text x="213" y="199">1 + 1</text>
  </g>
  <!-- the two immediate exits of start cell (0,0) -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 135 110 V 88" marker-end="url(#arrow)"/>
    <path d="M 96 134 H 72" marker-end="url(#arrow)"/>
  </g>
  <text x="174" y="236" text-anchor="middle" fill="#5c6b76" font-size="12.5">after pass 1</text>
  <!-- recompute arrow -->
  <path d="M 260 158 H 396" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="328" y="148" text-anchor="middle" fill="#5c6b76" font-size="11.5">recompute from pass 1</text>
  <!-- pass 2 grid: all cells symmetric at 6 -->
  <text x="445" y="104" text-anchor="middle" fill="#5c6b76" font-size="10.5">start (0,0)</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="406" y="110" width="78" height="48" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <rect x="484" y="110" width="78" height="48" fill="#ffffff"/>
    <rect x="406" y="158" width="78" height="48" fill="#ffffff"/>
    <rect x="484" y="158" width="78" height="48" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="445" y="133" fill="#4169E1">6</text><text x="523" y="133" fill="#1a2026">6</text>
    <text x="445" y="181" fill="#1a2026">6</text><text x="523" y="181" fill="#1a2026">6</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="445" y="151">1 + 1 + 2 + 2</text><text x="523" y="151">1 + 1 + 2 + 2</text>
    <text x="445" y="199">1 + 1 + 2 + 2</text><text x="523" y="199">1 + 1 + 2 + 2</text>
  </g>
  <text x="484" y="236" text-anchor="middle" fill="#5c6b76" font-size="12.5">after pass 2</text>
  <text x="330" y="286" text-anchor="middle" fill="#1a2026" font-size="13">Every 2 x 2 cell is a corner, so pass 1 sets all four to 1 + 1 = 2;</text>
  <text x="330" y="308" text-anchor="middle" fill="#1a2026" font-size="13">pass 2 recomputes (0,0) as exits 1 + 1 plus neighbors' 2 + 2 = <tspan fill="#4169E1" font-weight="600">6</tspan> — the answer.</text>
</svg>
