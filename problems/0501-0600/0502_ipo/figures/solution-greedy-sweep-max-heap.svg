<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- projects sorted by capital: (idx 0: cap 0, p 1), (idx 1: cap 1, p 2), (idx 2: cap 1, p 3)
       round 1 (w=0): heap [1], pop 1 -> w=1;  round 2 (w=1): heap [2,3], pop 3 -> w=4 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="205" y="34">idx 0</text><text x="323" y="34">idx 1</text><text x="441" y="34">idx 2</text>
  </g>
  <!-- project cards -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="150" y="42" width="110" height="48" fill="#dbe4fb"/>
    <rect x="268" y="42" width="110" height="48" fill="#ffffff"/>
    <rect x="386" y="42" width="110" height="48" fill="#ffffff"/>
  </g>
  <g text-anchor="middle">
    <text x="205" y="63" font-weight="600" font-size="14">profit 1</text>
    <text x="205" y="80" fill="#5c6b76" font-size="12">needs cap 0</text>
    <text x="323" y="63" font-weight="600" font-size="14">profit 2</text>
    <text x="323" y="80" fill="#5c6b76" font-size="12">needs cap 1</text>
    <text x="441" y="63" font-weight="600" font-size="14">profit 3</text>
    <text x="441" y="80" fill="#5c6b76" font-size="12">needs cap 1</text>
  </g>
  <!-- round 1 -->
  <text x="40" y="166" font-weight="600" font-size="13.5" fill="#1a2026">round 1</text>
  <text x="40" y="184" fill="#5c6b76" font-size="12.5">w = 0</text>
  <rect x="150" y="146" width="52" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <text x="176" y="172" text-anchor="middle" font-weight="600" font-size="15" fill="#4169E1">1</text>
  <text x="176" y="202" text-anchor="middle" fill="#5c6b76" font-size="11">max-heap</text>
  <path d="M 200 94 Q 190 116 178 142" fill="none" stroke="#5c6b76" stroke-width="1.6" marker-end="url(#arrowg)"/>
  <text x="224" y="124" fill="#5c6b76" font-size="11.5">push 1</text>
  <path d="M 202 166 L 242 166" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="222" y="138" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">pop 1</text>
  <rect x="244" y="146" width="86" height="40" fill="#dbe4fb"/>
  <text x="287" y="172" text-anchor="middle" font-size="15" fill="#1a2026">w = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <!-- round 2 -->
  <text x="40" y="262" font-weight="600" font-size="13.5" fill="#1a2026">round 2</text>
  <text x="40" y="280" fill="#5c6b76" font-size="12.5">w = 1</text>
  <text x="150" y="262" fill="#5c6b76" font-size="12">every project whose cap &lt;= w</text>
  <text x="150" y="280" fill="#5c6b76" font-size="12">joins the heap first</text>
  <rect x="430" y="242" width="76" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <text x="452" y="268" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">2</text>
  <text x="484" y="268" text-anchor="middle" font-weight="600" font-size="15" fill="#4169E1">3</text>
  <text x="468" y="298" text-anchor="middle" fill="#5c6b76" font-size="11">max-heap</text>
  <path d="M 323 96 Q 350 180 440 238" fill="none" stroke="#5c6b76" stroke-width="1.6" marker-end="url(#arrowg)"/>
  <text x="368" y="212" fill="#5c6b76" font-size="11.5">push 2</text>
  <path d="M 441 96 Q 470 170 488 238" fill="none" stroke="#5c6b76" stroke-width="1.6" marker-end="url(#arrowg)"/>
  <text x="505" y="174" fill="#5c6b76" font-size="11.5">push 3</text>
  <path d="M 506 262 L 542 262" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="524" y="236" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">pop 3</text>
  <rect x="546" y="242" width="76" height="40" fill="#dbe4fb"/>
  <text x="584" y="268" text-anchor="middle" font-size="15" fill="#1a2026">w = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  <text x="320" y="322" text-anchor="middle" fill="#1a2026" font-size="13">k = 2 picks: pop max 1, then max 3 — capital w climbs <tspan fill="#4169E1" font-weight="600">0 → 1 → 4</tspan>.</text>
</svg>
