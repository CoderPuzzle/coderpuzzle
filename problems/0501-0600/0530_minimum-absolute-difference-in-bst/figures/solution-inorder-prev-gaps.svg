<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- BST [4,2,6,1,3]: inorder visits 1, 2, 3, 4, 6; gaps to previous: 1, 1, 1, 2; min = 1; dashed thread = visit order; table columns at x = 352/420/484/542/606 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="170" y1="70" x2="100" y2="150"/>
    <line x1="170" y1="70" x2="250" y2="150"/>
    <line x1="100" y1="150" x2="60" y2="240"/>
    <line x1="100" y1="150" x2="150" y2="240"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <path d="M 47 226 Q 18 178 81 142" marker-end="url(#arrow)"/>
    <path d="M 108 168 Q 158 190 168 232" marker-end="url(#arrow)"/>
    <path d="M 154 221 Q 205 168 170 90" marker-end="url(#arrow)"/>
    <path d="M 186 82 Q 224 92 250 130" marker-end="url(#arrow)"/>
  </g>
  <circle cx="47" cy="226" r="3.5" fill="#4169E1"/>
  <text x="10" y="268" text-anchor="start" fill="#4169E1" font-size="12" font-weight="600">start</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <circle cx="170" cy="70" r="20"/><circle cx="100" cy="150" r="20"/><circle cx="250" cy="150" r="20"/>
    <circle cx="60" cy="240" r="20"/><circle cx="150" cy="240" r="20"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="170" y="75">4</text><text x="100" y="155">2</text><text x="250" y="155">6</text>
    <text x="60" y="245">1</text><text x="150" y="245">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="360" y="96">visit</text><text x="420" y="96">value</text><text x="484" y="96">prev</text><text x="542" y="96">gap</text><text x="606" y="96">min</text>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="360" y="124" fill="#5c6b76">1st</text><text x="420" y="124" fill="#1a2026">1</text><text x="484" y="124" fill="#9aa7b2">—</text><text x="542" y="124" fill="#9aa7b2">—</text><text x="606" y="124" fill="#9aa7b2">—</text>
    <text x="360" y="152" fill="#5c6b76">2nd</text><text x="420" y="152" fill="#1a2026">2</text><text x="484" y="152" fill="#5c6b76">1</text><text x="542" y="152" fill="#1a2026">1</text><text x="606" y="152" fill="#1a2026">1</text>
    <text x="360" y="180" fill="#5c6b76">3rd</text><text x="420" y="180" fill="#1a2026">3</text><text x="484" y="180" fill="#5c6b76">2</text><text x="542" y="180" fill="#1a2026">1</text><text x="606" y="180" fill="#1a2026">1</text>
    <text x="360" y="208" fill="#5c6b76">4th</text><text x="420" y="208" fill="#1a2026">4</text><text x="484" y="208" fill="#5c6b76">3</text><text x="542" y="208" fill="#1a2026">1</text><text x="606" y="208" fill="#1a2026">1</text>
    <text x="360" y="236" fill="#5c6b76">5th</text><text x="420" y="236" fill="#1a2026">6</text><text x="484" y="236" fill="#5c6b76">4</text><text x="542" y="236" fill="#9aa7b2">2</text><text x="606" y="236" fill="#4169E1" font-weight="600">1</text>
  </g>
  <text x="352" y="272" text-anchor="start" fill="#5c6b76" font-size="12">the walk stores only the previous value</text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Inorder emits the keys already sorted — 1, 2, 3, 4, 6 — so the closest pair is</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">always two walk neighbors: the candidate gaps 1, 1, 1, 2 give the minimum <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
