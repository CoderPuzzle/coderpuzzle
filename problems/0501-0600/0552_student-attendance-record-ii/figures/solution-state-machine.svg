<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 256" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <g stroke="#1a2026" fill="#ffffff" stroke-width="1.5">
    <rect x="60" y="40" width="110" height="46" rx="6"/><rect x="205" y="40" width="110" height="46" rx="6"/><rect x="350" y="40" width="110" height="46" rx="6"/>
    <rect x="60" y="170" width="110" height="46" rx="6"/><rect x="205" y="170" width="110" height="46" rx="6"/><rect x="350" y="170" width="110" height="46" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="115" y="68" font-weight="600">(0, 0)</text><text x="260" y="68" font-weight="600">(0, 1)</text><text x="405" y="68" font-weight="600">(0, 2)</text>
    <text x="115" y="198" font-weight="600">(1, 0)</text><text x="260" y="198" font-weight="600">(1, 1)</text><text x="405" y="198" font-weight="600">(1, 2)</text>
    <text x="115" y="26" fill="#5c6b76">a = 0</text><text x="115" y="240" fill="#5c6b76">a = 1</text>
    <text x="28" y="68" fill="#5c6b76">l = 0</text><text x="180" y="26" fill="#5c6b76" text-anchor="start" font-size="12">trailing lates &#8594;</text>
  </g>
  <g stroke="#42525e" fill="none" stroke-width="1.5">
    <line x1="228" y1="63" x2="247" y2="63" marker-end="url(#arrow)"/>  <!-- P: (0,1)->(0,0) -->
    <line x1="247" y1="49" x2="228" y2="49"/>                            <!-- back edge hint -->
    <line x1="373" y1="63" x2="392" y2="63" marker-end="url(#arrow)"/>  <!-- P: (0,2)->(0,0) approx to (0,0)? keep simple: to previous col -->
    <line x1="228" y1="193" x2="247" y2="193" marker-end="url(#arrow)"/>
    <line x1="373" y1="193" x2="392" y2="193" marker-end="url(#arrow)"/>
    <line x1="228" y1="179" x2="247" y2="179"/>
    <line x1="115" y1="86" x2="115" y2="170" stroke="#4169E1" marker-end="url(#arrowB)"/>
    <line x1="260" y1="86" x2="260" y2="170" stroke="#4169E1" stroke-dasharray="4 3" marker-end="url(#arrowB)"/>
    <line x1="405" y1="86" x2="405" y2="170" stroke="#4169E1" stroke-dasharray="4 3" marker-end="url(#arrowB)"/>
  </g>
  <g font-size="11.5" fill="#5c6b76">
    <text x="222" y="82">+L</text><text x="367" y="82">+L</text><text x="222" y="212">+L</text><text x="367" y="212">+L</text>
    <text x="124" y="133" fill="#4169E1">+A</text>
    <text x="268" y="133" fill="#4169E1">+A (via (0,1)&#8594;(0,0)&#8594;(1,0))</text>
  </g>
  <g font-size="11.5" fill="#5c6b76">
    <text x="480" y="40">Appending 'P' from any state returns to (a, 0).</text>
    <text x="480" y="58">The +L arrows above only show one hop; each also</text>
    <text x="480" y="76">has the returning 'P' transition to (a, 0).</text>
    <text x="480" y="102">Blue +A edges exist only out of the a = 0 row;</text>
    <text x="480" y="120">no edge leaves (0, 2) or (1, 2) with another 'L'.</text>
  </g>
</svg>
