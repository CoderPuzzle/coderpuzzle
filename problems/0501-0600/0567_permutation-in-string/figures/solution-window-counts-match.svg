<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- s2 = "eidbaooo", cells 40x36 at x = 130 + 52j, y 36; j=3,4 ("ba") accented; window rows at y centres 168/224/280/336 -->
  <text x="118" y="59" text-anchor="end" fill="#5c6b76" font-size="12.5">s2</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="130" y="36" width="40" height="36"/><rect x="182" y="36" width="40" height="36"/>
    <rect x="234" y="36" width="40" height="36"/>
    <rect x="286" y="36" width="40" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="338" y="36" width="40" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="390" y="36" width="40" height="36"/><rect x="442" y="36" width="40" height="36"/>
    <rect x="494" y="36" width="40" height="36"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="150" y="59">e</text><text x="202" y="59">i</text><text x="254" y="59">d</text>
    <text x="306" y="59">b</text><text x="358" y="59">a</text><text x="410" y="59">o</text>
    <text x="462" y="59">o</text><text x="514" y="59">o</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="150" y="88">0</text><text x="202" y="88">1</text><text x="254" y="88">2</text>
    <text x="306" y="88">3</text><text x="358" y="88">4</text><text x="410" y="88">5</text>
    <text x="462" y="88">6</text><text x="514" y="88">7</text>
  </g>
  <text x="332" y="108" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">s2[3..4] = "ba"</text>
  <text x="130" y="134" fill="#5c6b76" font-size="12.5">need for s1 = "ab":&#160;&#160;a:1,&#160;&#160;b:1</text>
  <!-- window rows: letters, slide note, counts, verdict -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="140" y="153" width="36" height="30"/><rect x="180" y="153" width="36" height="30"/>
    <rect x="140" y="209" width="36" height="30"/><rect x="180" y="209" width="36" height="30"/>
    <rect x="140" y="265" width="36" height="30"/><rect x="180" y="265" width="36" height="30"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="140" y="321" width="36" height="30"/><rect x="180" y="321" width="36" height="30"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="158" y="173">e</text><text x="198" y="173">i</text>
    <text x="158" y="229">i</text><text x="198" y="229">d</text>
    <text x="158" y="285">d</text><text x="198" y="285">b</text>
    <text x="158" y="341" font-weight="600">b</text><text x="198" y="341" font-weight="600">a</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <path d="M 120 186 V 202" marker-end="url(#arrowG)"/>
    <path d="M 120 242 V 258" marker-end="url(#arrowG)"/>
    <path d="M 120 298 V 314" marker-end="url(#arrowG)"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="240" y="173">first window</text>
    <text x="240" y="229">enter d, leave e</text>
    <text x="240" y="285">enter b, leave i</text>
    <text x="240" y="341" fill="#4169E1">enter a, leave d</text>
  </g>
  <g font-size="14" font-weight="600" fill="#1a2026">
    <text x="410" y="173">e:1&#160;&#160;i:1</text>
    <text x="410" y="229">i:1&#160;&#160;d:1</text>
    <text x="410" y="285">d:1&#160;&#160;b:1</text>
    <text x="410" y="341" fill="#4169E1">b:1&#160;&#160;a:1</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#5c6b76">
    <text x="548" y="173">&#8800; need</text>
    <text x="548" y="229">&#8800; need</text>
    <text x="548" y="285">&#8800; need</text>
    <text x="548" y="341" fill="#4169E1" font-weight="600">= need &#8594; true</text>
  </g>
  <text x="320" y="386" text-anchor="middle" fill="#1a2026" font-size="13">Each slide enters one letter and leaves one, so the counts update in O(1); the</text>
  <text x="320" y="408" text-anchor="middle" fill="#1a2026" font-size="13">window "<tspan fill="#4169E1" font-weight="600">ba</tspan>" at s2[3..4] is the first whose counts equal need &#8212; return <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
