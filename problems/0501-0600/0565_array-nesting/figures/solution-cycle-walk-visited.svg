<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums = [5,4,0,3,1,6,2]; cells 56x38 at x = 106 + 62i, y 40; node rows: walk1 y165 x 130/230/330/430, walk2 y255, walk3 y335 -->
  <text x="98" y="64" text-anchor="end" fill="#5c6b76" font-size="12.5">nums</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="106" y="40" width="56" height="38"/><rect x="168" y="40" width="56" height="38"/>
    <rect x="230" y="40" width="56" height="38"/><rect x="292" y="40" width="56" height="38"/>
    <rect x="354" y="40" width="56" height="38"/><rect x="416" y="40" width="56" height="38"/>
    <rect x="478" y="40" width="56" height="38"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="134" y="64">5</text><text x="196" y="64">4</text><text x="258" y="64">0</text>
    <text x="320" y="64">3</text><text x="382" y="64">1</text><text x="444" y="64">6</text>
    <text x="506" y="64">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="134" y="94">i=0</text><text x="196" y="94">i=1</text><text x="258" y="94">i=2</text>
    <text x="320" y="94">i=3</text><text x="382" y="94">i=4</text><text x="444" y="94">i=5</text>
    <text x="506" y="94">i=6</text>
  </g>
  <text x="320" y="126" text-anchor="middle" fill="#5c6b76" font-size="12">each arrow is i &#8594; nums[i]</text>
  <!-- walk 1: 0 -> 5 -> 6 -> 2 -> 0, badges = visit order -->
  <text x="40" y="170" fill="#5c6b76" font-size="12.5">walk 1</text>
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <circle cx="130" cy="165" r="17"/><circle cx="230" cy="165" r="17"/>
    <circle cx="330" cy="165" r="17"/><circle cx="430" cy="165" r="17"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="130" y="170">0</text><text x="230" y="170">5</text>
    <text x="330" y="170">6</text><text x="430" y="170">2</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 150 165 H 207" marker-end="url(#arrow)"/>
    <path d="M 250 165 H 307" marker-end="url(#arrow)"/>
    <path d="M 350 165 H 407" marker-end="url(#arrow)"/>
    <path d="M 430 185 Q 280 240 133 182" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1">
    <circle cx="143" cy="152" r="8"/><circle cx="243" cy="152" r="8"/>
    <circle cx="343" cy="152" r="8"/><circle cx="443" cy="152" r="8"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">
    <text x="143" y="156">1</text><text x="243" y="156">2</text>
    <text x="343" y="156">3</text><text x="443" y="156">4</text>
  </g>
  <text x="500" y="170" text-anchor="middle" fill="#4169E1" font-weight="600">count 4</text>
  <!-- walk 2: 1 -> 4 -> 1 -->
  <text x="40" y="260" fill="#5c6b76" font-size="12.5">walk 2</text>
  <g stroke="#5c6b76" stroke-width="1.8" fill="#ffffff">
    <circle cx="130" cy="255" r="17"/><circle cx="230" cy="255" r="17"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="130" y="260">1</text><text x="230" y="260">4</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.8" fill="none">
    <path d="M 150 255 H 207" marker-end="url(#arrowG)"/>
    <path d="M 230 275 Q 180 310 133 272" marker-end="url(#arrowG)"/>
  </g>
  <g fill="#5c6b76">
    <circle cx="143" cy="242" r="8"/><circle cx="243" cy="242" r="8"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">
    <text x="143" y="246">1</text><text x="243" y="246">2</text>
  </g>
  <text x="300" y="260" text-anchor="middle" fill="#5c6b76" font-weight="600">count 2</text>
  <!-- walk 3: 3 -> 3 -->
  <text x="40" y="340" fill="#5c6b76" font-size="12.5">walk 3</text>
  <circle cx="130" cy="335" r="17" fill="#ffffff" stroke="#5c6b76" stroke-width="1.8"/>
  <text x="130" y="340" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <path d="M 117 323 C 105 296 155 296 143 323" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <circle cx="143" cy="348" r="8" fill="#5c6b76"/>
  <text x="143" y="352" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">1</text>
  <text x="190" y="340" text-anchor="middle" fill="#5c6b76" font-weight="600">count 1</text>
  <text x="320" y="396" text-anchor="middle" fill="#1a2026" font-size="13">Each unvisited index opens one walk that marks its whole cycle &#8212; every s[k]</text>
  <text x="320" y="418" text-anchor="middle" fill="#1a2026" font-size="13">is that cycle. The longest, 0 &#8594; 5 &#8594; 6 &#8594; 2, has length <tspan fill="#4169E1" font-weight="600">4</tspan> &#8212; the answer.</text>
</svg>
