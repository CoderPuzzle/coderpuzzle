<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="444" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- root = 3(4(1,2),5) drawn left; subRoot = 4(1,2) right; anchor rows: 3 vs 4 fail, 5 vs 4 fail, 4 vs subRoot all agree -->
  <text x="110" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">root</text>
  <text x="470" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">subRoot</text>
  <g stroke="#42525e" stroke-width="1.5">
    <path d="M 110 80 L 70 140 M 110 80 L 150 140 M 70 140 L 50 200 M 70 140 L 90 200"/>
    <path d="M 470 80 L 430 140 M 470 80 L 510 140"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="110" cy="80" r="16"/><circle cx="150" cy="140" r="16"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <circle cx="70" cy="140" r="16"/><circle cx="50" cy="200" r="16"/><circle cx="90" cy="200" r="16"/>
    <circle cx="470" cy="80" r="16"/><circle cx="430" cy="140" r="16"/><circle cx="510" cy="140" r="16"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="110" y="85">3</text><text x="70" y="145">4</text><text x="150" y="145">5</text>
    <text x="50" y="205">1</text><text x="90" y="205">2</text>
    <text x="470" y="85">4</text><text x="430" y="145">1</text><text x="510" y="145">2</text>
  </g>
  <path d="M 200 115 H 400" stroke="#5c6b76" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="100" text-anchor="middle" fill="#5c6b76" font-size="12">same_tree(node, subRoot)</text>
  <text x="60" y="238" fill="#5c6b76" font-size="12.5">Anchors tried in walk order &#8212; 3, then 5, then 4:</text>
  <!-- anchor rows -->
  <text x="60" y="275" fill="#5c6b76" font-size="12.5">anchor 3</text>
  <g fill="#ffffff" stroke="#5c6b76" stroke-width="1.5">
    <circle cx="160" cy="270" r="12"/><circle cx="206" cy="270" r="12"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="160" y="275" fill="#1a2026">3</text><text x="183" y="275" fill="#5c6b76">&#8800;</text>
    <text x="206" y="275" fill="#1a2026">4</text>
  </g>
  <text x="280" y="275" fill="#5c6b76" font-size="12.5">first pair already disagrees &#8212; fail</text>
  <text x="60" y="325" fill="#5c6b76" font-size="12.5">anchor 5</text>
  <g fill="#ffffff" stroke="#5c6b76" stroke-width="1.5">
    <circle cx="160" cy="320" r="12"/><circle cx="206" cy="320" r="12"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="160" y="325" fill="#1a2026">5</text><text x="183" y="325" fill="#5c6b76">&#8800;</text>
    <text x="206" y="325" fill="#1a2026">4</text>
  </g>
  <text x="280" y="325" fill="#5c6b76" font-size="12.5">same first-pair mismatch &#8212; fail</text>
  <text x="60" y="375" fill="#4169E1" font-size="12.5" font-weight="600">anchor 4</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <circle cx="160" cy="370" r="12"/><circle cx="206" cy="370" r="12"/>
    <circle cx="252" cy="370" r="12"/><circle cx="298" cy="370" r="12"/>
    <circle cx="344" cy="370" r="12"/><circle cx="390" cy="370" r="12"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="160" y="375">4</text><text x="206" y="375">4</text>
    <text x="252" y="375">1</text><text x="298" y="375">1</text>
    <text x="344" y="375">2</text><text x="390" y="375">2</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#4169E1">
    <text x="183" y="375">=</text><text x="229" y="375">=</text><text x="275" y="375">=</text>
    <text x="321" y="375">=</text><text x="367" y="375">=</text>
  </g>
  <text x="420" y="375" fill="#1a2026" font-size="12.5">every pair agrees &#8212; return <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="320" y="406" text-anchor="middle" fill="#1a2026" font-size="13">Anchors 3 and 5 fail fast &#8212; each stops at its first compared pair &#8212; and the</text>
  <text x="320" y="426" text-anchor="middle" fill="#1a2026" font-size="13">anchor at 4 matches all of subRoot, 4=4, 1=1, 2=2, so the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
