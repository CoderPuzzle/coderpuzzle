<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#1a2026" stroke-width="1.6">
    <!-- edges: 1-2, 1-3, 2-4, 2-5 -->
    <line x1="220" y1="46" x2="140" y2="112" stroke="#4169E1" stroke-width="3"/>
    <line x1="220" y1="46" x2="300" y2="112"/>
    <line x1="140" y1="134" x2="84" y2="196" stroke="#4169E1" stroke-width="3"/>
    <line x1="140" y1="134" x2="196" y2="196"/>
  </g>
  <!-- diameter path nodes: 4,2,1,3 -->
  <g font-weight="600" text-anchor="middle">
    <circle cx="220" cy="40" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="220" y="45" fill="#1a2026">1</text>
    <circle cx="140" cy="120" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="140" y="125" fill="#1a2026">2</text>
    <circle cx="300" cy="120" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="300" y="125" fill="#1a2026">3</text>
    <circle cx="84" cy="210" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="84" y="215" fill="#1a2026">4</text>
    <circle cx="196" cy="210" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="196" y="215" fill="#1a2026">5</text>
  </g>
  <text x="360" y="150" fill="#4169E1" font-size="12.5">path [4,2,1,3]</text>
  <text x="360" y="168" fill="#4169E1" font-size="12.5">3 edges</text>
</svg>
