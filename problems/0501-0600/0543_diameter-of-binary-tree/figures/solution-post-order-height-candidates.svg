<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="360" fill="#ffffff"/>
  <!-- tree [1,2,3,4,5]: root 1, children 2 and 3, 2's children 4 and 5;
       post-order ret/cand: 4 -> ret 1 cand 0, 5 -> ret 1 cand 0, 2 -> ret 2 cand 2,
       3 -> ret 1 cand 0, 1 -> ret 3 cand 3; diameter = 3 = path 4-2-1-3 (accent edges) -->
  <!-- edges: the three diameter-path edges accent, the 2-5 edge muted -->
  <g stroke="#4169E1" stroke-width="2.4">
    <line x1="325" y1="86" x2="250" y2="143"/>
    <line x1="355" y1="86" x2="430" y2="143"/>
    <line x1="221" y1="175" x2="184" y2="233"/>
  </g>
  <line x1="249" y1="175" x2="286" y2="233" stroke="#9aa7b2" stroke-width="1.6"/>
  <!-- nodes -->
  <circle cx="340" cy="70" r="20" fill="#4169E1"/>
  <text x="340" y="75" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <circle cx="235" cy="160" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="235" y="165" text-anchor="middle" fill="#1a2026">2</text>
  <circle cx="445" cy="160" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="445" y="165" text-anchor="middle" fill="#1a2026">3</text>
  <circle cx="170" cy="250" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="170" y="255" text-anchor="middle" fill="#1a2026">4</text>
  <circle cx="300" cy="250" r="20" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <text x="300" y="255" text-anchor="middle" fill="#9aa7b2">5</text>
  <!-- per-node ret/cand annotations -->
  <g font-size="12.5" text-anchor="middle">
    <text x="340" y="32"><tspan fill="#4169E1" font-weight="600">cand 3</tspan><tspan fill="#5c6b76"> · ret 3</tspan></text>
    <text x="192" y="165" text-anchor="end" fill="#1a2026">ret 2 · cand 2</text>
    <text x="477" y="165" text-anchor="start" fill="#1a2026">ret 1 · cand 0</text>
    <text x="170" y="292" fill="#1a2026">ret 1 · cand 0</text>
    <text x="300" y="292" fill="#9aa7b2">ret 1 · cand 0</text>
  </g>
  <!-- recurrence legend -->
  <g font-size="12.5">
    <text x="40" y="60" fill="#5c6b76">each node returns its</text>
    <text x="40" y="76" fill="#5c6b76">height and records one</text>
    <text x="40" y="92" fill="#5c6b76">candidate on the way up:</text>
    <text x="40" y="116" fill="#1a2026">cand = ret(L) + ret(R)</text>
    <text x="40" y="132" fill="#1a2026">ret = 1 + max(L, R)</text>
  </g>
  <!-- root arithmetic -->
  <g font-size="12.5" text-anchor="end">
    <text x="660" y="60" fill="#5c6b76">root: cand = 2 + 1 = 3</text>
    <text x="660" y="76" fill="#5c6b76">ret 3 = 1 + max(2, 1)</text>
  </g>
  <text x="340" y="326" text-anchor="middle" fill="#1a2026" font-size="13">Candidates recorded: 0, 0, 2, 0, and at the root 2 + 1 = 3 — the path 4-2-1-3.</text>
  <text x="340" y="344" text-anchor="middle" fill="#1a2026" font-size="13">The largest left + right is <tspan fill="#4169E1" font-weight="600">3</tspan>, so the diameter is 3.</text>
</svg>
