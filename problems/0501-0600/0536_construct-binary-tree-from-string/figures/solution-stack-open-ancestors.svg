<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="448" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s = "4(2(3)(1))(6(5))"; trace: digits push, each ) pops to the parent's left-then-right slot; result [4,2,6,3,1,5]; string cells 26x26 at (90,40); table rows y=130 step 25; tree nodes r=18 -->
  <text x="78" y="58" text-anchor="end" fill="#5c6b76" font-size="12.5">s =</text>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="90" y="40" width="26" height="26" fill="#dbe4fb"/>
    <rect x="116" y="40" width="26" height="26" fill="#ffffff"/>
    <rect x="142" y="40" width="26" height="26" fill="#dbe4fb"/>
    <rect x="168" y="40" width="26" height="26" fill="#ffffff"/>
    <rect x="194" y="40" width="26" height="26" fill="#dbe4fb"/>
    <rect x="220" y="40" width="26" height="26" fill="#f0f3f7"/>
    <rect x="246" y="40" width="26" height="26" fill="#ffffff"/>
    <rect x="272" y="40" width="26" height="26" fill="#dbe4fb"/>
    <rect x="298" y="40" width="26" height="26" fill="#f0f3f7"/>
    <rect x="324" y="40" width="26" height="26" fill="#f0f3f7"/>
    <rect x="350" y="40" width="26" height="26" fill="#ffffff"/>
    <rect x="376" y="40" width="26" height="26" fill="#dbe4fb"/>
    <rect x="402" y="40" width="26" height="26" fill="#ffffff"/>
    <rect x="428" y="40" width="26" height="26" fill="#dbe4fb"/>
    <rect x="454" y="40" width="26" height="26" fill="#f0f3f7"/>
    <rect x="480" y="40" width="26" height="26" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="103" y="58" font-weight="600">4</text><text x="129" y="58" fill="#9aa7b2">(</text><text x="155" y="58" font-weight="600">2</text><text x="181" y="58" fill="#9aa7b2">(</text><text x="207" y="58" font-weight="600">3</text><text x="233" y="58">)</text><text x="259" y="58" fill="#9aa7b2">(</text><text x="285" y="58" font-weight="600">1</text><text x="311" y="58">)</text><text x="337" y="58">)</text><text x="363" y="58" fill="#9aa7b2">(</text><text x="389" y="58" font-weight="600">6</text><text x="415" y="58" fill="#9aa7b2">(</text><text x="441" y="58" font-weight="600">5</text><text x="467" y="58">)</text><text x="493" y="58">)</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="80" y="104">read</text><text x="185" y="104">stack (bottom → top)</text>
  </g>
  <text x="260" y="104" text-anchor="start" fill="#5c6b76" font-size="12">pop goes to</text>
  <line x1="60" y1="112" x2="420" y2="112" stroke="#dbe4fb" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="13">
    <text x="80" y="130" fill="#1a2026">4</text><text x="185" y="130" fill="#1a2026" font-weight="600">[4]</text><text x="260" y="130" text-anchor="start" fill="#5c6b76" font-size="12.5">push — nothing beneath: the root</text>
    <text x="80" y="155" fill="#1a2026">2</text><text x="185" y="155" fill="#1a2026" font-weight="600">[4, 2]</text><text x="260" y="155" text-anchor="start" fill="#5c6b76" font-size="12.5">push</text>
    <text x="80" y="180" fill="#1a2026">3</text><text x="185" y="180" fill="#1a2026" font-weight="600">[4, 2, 3]</text><text x="260" y="180" text-anchor="start" fill="#5c6b76" font-size="12.5">push</text>
    <text x="80" y="205" fill="#1a2026">)</text><text x="185" y="205" fill="#1a2026" font-weight="600">[4, 2]</text><text x="260" y="205" text-anchor="start" fill="#1a2026" font-size="12.5">3 → left slot of 2</text>
    <text x="80" y="230" fill="#1a2026">1</text><text x="185" y="230" fill="#1a2026" font-weight="600">[4, 2, 1]</text><text x="260" y="230" text-anchor="start" fill="#5c6b76" font-size="12.5">push</text>
    <text x="80" y="255" fill="#1a2026">)</text><text x="185" y="255" fill="#1a2026" font-weight="600">[4, 2]</text><text x="260" y="255" text-anchor="start" fill="#4169E1" font-size="12.5" font-weight="600">1 → right slot of 2</text>
    <text x="80" y="280" fill="#1a2026">)</text><text x="185" y="280" fill="#1a2026" font-weight="600">[4]</text><text x="260" y="280" text-anchor="start" fill="#1a2026" font-size="12.5">2 → left slot of 4</text>
    <text x="80" y="305" fill="#1a2026">6</text><text x="185" y="305" fill="#1a2026" font-weight="600">[4, 6]</text><text x="260" y="305" text-anchor="start" fill="#5c6b76" font-size="12.5">push</text>
    <text x="80" y="330" fill="#1a2026">5</text><text x="185" y="330" fill="#1a2026" font-weight="600">[4, 6, 5]</text><text x="260" y="330" text-anchor="start" fill="#5c6b76" font-size="12.5">push</text>
    <text x="80" y="355" fill="#1a2026">)</text><text x="185" y="355" fill="#1a2026" font-weight="600">[4, 6]</text><text x="260" y="355" text-anchor="start" fill="#1a2026" font-size="12.5">5 → left slot of 6</text>
    <text x="80" y="380" fill="#1a2026">)</text><text x="185" y="380" fill="#1a2026" font-weight="600">[4]</text><text x="260" y="380" text-anchor="start" fill="#4169E1" font-size="12.5" font-weight="600">6 → right slot of 4 — scan ends, root 4</text>
  </g>
  <text x="552" y="84" text-anchor="middle" fill="#5c6b76" font-size="12">the finished tree</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="560" y1="120" x2="490" y2="190"/>
    <line x1="560" y1="120" x2="632" y2="190"/>
    <line x1="490" y1="190" x2="455" y2="260"/>
    <line x1="490" y1="190" x2="525" y2="260"/>
    <line x1="632" y1="190" x2="600" y2="260"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <circle cx="560" cy="120" r="18"/><circle cx="490" cy="190" r="18"/><circle cx="632" cy="190" r="18"/>
    <circle cx="455" cy="260" r="18"/><circle cx="525" cy="260" r="18"/><circle cx="600" cy="260" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="560" y="125">4</text><text x="490" y="195">2</text><text x="632" y="195">6</text>
    <text x="455" y="265">3</text><text x="525" y="265">1</text><text x="600" y="265">5</text>
  </g>
  <text x="552" y="315" text-anchor="middle" fill="#4169E1" font-size="15" font-weight="600">[4, 2, 6, 3, 1, 5]</text>
  <text x="340" y="414" text-anchor="middle" fill="#1a2026" font-size="13">Every ) pops the finished subtree into the parent underneath — left slot first,</text>
  <text x="340" y="432" text-anchor="middle" fill="#1a2026" font-size="13">right only once the left is taken; the scan ends with root 4 over <tspan fill="#4169E1" font-weight="600">[4, 2, 6, 3, 1, 5]</tspan>.</text>
</svg>
