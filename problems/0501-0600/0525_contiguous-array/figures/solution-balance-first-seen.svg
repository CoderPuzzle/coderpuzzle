<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="306" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [0,1,1,1,1,1,0,0,0]; cells 56x40 at x=88+56i, nums y=38, balance y=110; balance steps -1,0,1,2,3,4,3,2,1; blue values = first sightings (bal 0's is the seed at i=-1) -->
  <text x="340" y="24" text-anchor="middle" fill="#1a2026" font-weight="600">nums = [0, 1, 1, 1, 1, 1, 0, 0, 0]</text>
  <text x="80" y="63" text-anchor="end" fill="#5c6b76" font-size="12">nums</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="88" y="38" width="56" height="40" fill="#ffffff"/><rect x="144" y="38" width="56" height="40" fill="#ffffff"/>
    <rect x="200" y="38" width="56" height="40" fill="#ffffff"/><rect x="256" y="38" width="56" height="40" fill="#ffffff"/>
    <rect x="312" y="38" width="56" height="40" fill="#ffffff"/><rect x="368" y="38" width="56" height="40" fill="#ffffff"/>
    <rect x="424" y="38" width="56" height="40" fill="#ffffff"/><rect x="480" y="38" width="56" height="40" fill="#ffffff"/>
    <rect x="536" y="38" width="56" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="116" y="63">0</text><text x="172" y="63">1</text><text x="228" y="63">1</text>
    <text x="284" y="63">1</text><text x="340" y="63">1</text><text x="396" y="63">1</text>
    <text x="452" y="63">0</text><text x="508" y="63">0</text><text x="564" y="63">0</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="116" y="94">0</text><text x="172" y="94">1</text><text x="228" y="94">2</text>
    <text x="284" y="94">3</text><text x="340" y="94">4</text><text x="396" y="94">5</text>
    <text x="452" y="94">6</text><text x="508" y="94">7</text><text x="564" y="94">8</text>
  </g>
  <text x="80" y="135" text-anchor="end" fill="#5c6b76" font-size="12">balance</text>
  <text x="592" y="107" text-anchor="end" fill="#5c6b76" font-size="11">blue value = first sighting of that balance</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="88" y="110" width="56" height="40" fill="#ffffff"/><rect x="144" y="110" width="56" height="40" fill="#ffffff"/>
    <rect x="200" y="110" width="56" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <rect x="256" y="110" width="56" height="40" fill="#ffffff"/><rect x="312" y="110" width="56" height="40" fill="#ffffff"/>
    <rect x="368" y="110" width="56" height="40" fill="#ffffff"/><rect x="424" y="110" width="56" height="40" fill="#ffffff"/>
    <rect x="480" y="110" width="56" height="40" fill="#ffffff"/>
    <rect x="536" y="110" width="56" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="116" y="135" fill="#4169E1">-1</text><text x="172" y="135" fill="#1a2026">0</text>
    <text x="228" y="135" fill="#4169E1">1</text><text x="284" y="135" fill="#4169E1">2</text>
    <text x="340" y="135" fill="#4169E1">3</text><text x="396" y="135" fill="#4169E1">4</text>
    <text x="452" y="135" fill="#1a2026">3</text><text x="508" y="135" fill="#1a2026">2</text>
    <text x="564" y="135" fill="#1a2026">1</text>
  </g>
  <!-- longest stretch: balance 1 from i=2 to i=8 -->
  <path d="M 228 156 Q 396 224 564 156" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396" y="224" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">balance 1 repeats: length 8 - 2 = 6</text>
  <!-- span measured at each repeat -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="172" y="200">span 2</text><text x="452" y="200">span 2</text>
    <text x="508" y="200">span 4</text>
  </g>
  <text x="564" y="201" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">span 6</text>
  <text x="340" y="254" text-anchor="middle" fill="#1a2026" font-size="13">Every repeat is measured against its balance's first sighting (balance 0's is the</text>
  <text x="340" y="276" text-anchor="middle" fill="#1a2026" font-size="13">seed at i = -1), so the widest equal-count run ends at i = 8: <tspan fill="#4169E1" font-weight="600">[1, 1, 1, 0, 0, 0]</tspan>, length <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
