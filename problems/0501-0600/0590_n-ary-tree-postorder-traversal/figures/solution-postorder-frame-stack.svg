<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="414" fill="#ffffff"/>
  <!-- tree = [1,null,3,2,4,null,5,6]: 1 has children [3,2,4], 3 has children [5,6];
       a frame is node·childrenEntered; frame boxes 34x22 at x = 262 + 36k (bottom-to-top),
       rows y = 68 + 24i, each row showing the stack after the step; top frame accented;
       a frame emits only when its count reaches its number of children; output [5,6,3,2,4,1] -->
  <g fill="#5c6b76" font-size="11">
    <text x="48" y="56">step</text>
    <text x="262" y="56">frames: node · children entered</text>
    <text x="448" y="56">emitted so far</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="48" y="84">push root 1</text>
    <text x="48" y="108">1 enters child 3</text>
    <text x="48" y="132">3 enters child 5</text>
    <text x="48" y="156">5 has no children → emit 5</text>
    <text x="48" y="180">3 enters child 6</text>
    <text x="48" y="204">6 has no children → emit 6</text>
    <text x="48" y="228">3 entered 2/2 → emit 3</text>
    <text x="48" y="252">1 enters child 2</text>
    <text x="48" y="276">2 has no children → emit 2</text>
    <text x="48" y="300">1 enters child 4</text>
    <text x="48" y="324">4 has no children → emit 4</text>
    <text x="48" y="348">1 entered 3/3 → emit 1</text>
  </g>
  <!-- frames: plain boxes below, accented top frame -->
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#f0f3f7">
    <rect x="262" y="92" width="34" height="22"/>
    <rect x="262" y="116" width="34" height="22"/><rect x="298" y="116" width="34" height="22"/>
    <rect x="262" y="140" width="34" height="22"/>
    <rect x="262" y="164" width="34" height="22"/><rect x="298" y="164" width="34" height="22"/>
    <rect x="262" y="188" width="34" height="22"/>
    <rect x="262" y="236" width="34" height="22"/>
    <rect x="262" y="284" width="34" height="22"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="262" y="68" width="34" height="22"/>
    <rect x="298" y="92" width="34" height="22"/>
    <rect x="334" y="116" width="34" height="22"/>
    <rect x="298" y="140" width="34" height="22"/>
    <rect x="334" y="164" width="34" height="22"/>
    <rect x="298" y="188" width="34" height="22"/>
    <rect x="262" y="212" width="34" height="22"/>
    <rect x="298" y="236" width="34" height="22"/>
    <rect x="262" y="260" width="34" height="22"/>
    <rect x="298" y="284" width="34" height="22"/>
    <rect x="262" y="308" width="34" height="22"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#1a2026">
    <text x="279" y="84" fill="#4169E1" font-weight="600">1·0</text>
    <text x="279" y="108">1·1</text><text x="315" y="108" fill="#4169E1" font-weight="600">3·0</text>
    <text x="279" y="132">1·1</text><text x="315" y="132">3·1</text><text x="351" y="132" fill="#4169E1" font-weight="600">5·0</text>
    <text x="279" y="156">1·1</text><text x="315" y="156" fill="#4169E1" font-weight="600">3·1</text>
    <text x="279" y="180">1·1</text><text x="315" y="180">3·2</text><text x="351" y="180" fill="#4169E1" font-weight="600">6·0</text>
    <text x="279" y="204">1·1</text><text x="315" y="204" fill="#4169E1" font-weight="600">3·2</text>
    <text x="279" y="228" fill="#4169E1" font-weight="600">1·1</text>
    <text x="279" y="252">1·2</text><text x="315" y="252" fill="#4169E1" font-weight="600">2·0</text>
    <text x="279" y="276" fill="#4169E1" font-weight="600">1·2</text>
    <text x="279" y="300">1·3</text><text x="315" y="300" fill="#4169E1" font-weight="600">4·0</text>
    <text x="279" y="324" fill="#4169E1" font-weight="600">1·3</text>
  </g>
  <text x="262" y="348" fill="#9aa7b2" font-size="11">empty</text>
  <!-- emitted so far; the newest value accented -->
  <g font-size="12.5" fill="#1a2026">
    <text x="448" y="84" fill="#9aa7b2">[]</text>
    <text x="448" y="108" fill="#9aa7b2">[]</text>
    <text x="448" y="132" fill="#9aa7b2">[]</text>
    <text x="448" y="156">[<tspan fill="#4169E1" font-weight="600">5</tspan>]</text>
    <text x="448" y="180">[5]</text>
    <text x="448" y="204">[5, <tspan fill="#4169E1" font-weight="600">6</tspan>]</text>
    <text x="448" y="228">[5, 6, <tspan fill="#4169E1" font-weight="600">3</tspan>]</text>
    <text x="448" y="252">[5, 6, 3]</text>
    <text x="448" y="276">[5, 6, 3, <tspan fill="#4169E1" font-weight="600">2</tspan>]</text>
    <text x="448" y="300">[5, 6, 3, 2]</text>
    <text x="448" y="324">[5, 6, 3, 2, <tspan fill="#4169E1" font-weight="600">4</tspan>]</text>
    <text x="448" y="348" font-weight="600">[5, 6, 3, 2, 4, <tspan fill="#4169E1">1</tspan>]</text>
  </g>
  <text x="320" y="380" text-anchor="middle" fill="#1a2026" font-size="13">A frame emits only when every child is entered — 3 closes at <tspan fill="#4169E1" font-weight="600">2/2</tspan> right after [5, 6];</text>
  <text x="320" y="400" text-anchor="middle" fill="#1a2026" font-size="13">1 closes at 3/3 last, so the emission climbs bottom-up: <tspan fill="#4169E1" font-weight="600">[5, 6, 3, 2, 4, 1]</tspan>.</text>
</svg>
