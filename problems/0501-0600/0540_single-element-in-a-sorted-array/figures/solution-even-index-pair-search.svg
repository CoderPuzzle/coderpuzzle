<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="334" fill="#ffffff"/>
  <!-- nums = [1,1,2,3,3,4,4,8,8]; cells 64x40 at (52,56), center x = 84+64i;
       probes: mid=4 pair (4,5), mid=2 pair (2,3), mid=1 shifted to 0 pair (0,1);
       step underlines mark the compared pair, digits match the table rows -->
  <!-- intact-pair arcs above the cells -->
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 84 50 Q 116 28 148 50"/>
    <path d="M 276 50 Q 308 28 340 50"/>
    <path d="M 404 50 Q 436 28 468 50"/>
    <path d="M 532 50 Q 564 28 596 50"/>
  </g>
  <!-- array cells -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="52" y="56" width="64" height="40"/><rect x="116" y="56" width="64" height="40"/>
    <rect x="244" y="56" width="64" height="40"/><rect x="308" y="56" width="64" height="40"/>
    <rect x="372" y="56" width="64" height="40"/><rect x="436" y="56" width="64" height="40"/>
    <rect x="500" y="56" width="64" height="40"/><rect x="564" y="56" width="64" height="40"/>
  </g>
  <rect x="180" y="56" width="64" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="15">
    <text x="84" y="82">1</text><text x="148" y="82">1</text>
    <text x="212" y="82" fill="#4169E1" font-weight="600">2</text>
    <text x="276" y="82">3</text><text x="340" y="82">3</text><text x="404" y="82">4</text>
    <text x="468" y="82">4</text><text x="532" y="82">8</text><text x="596" y="82">8</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="84" y="116">0</text><text x="148" y="116">1</text><text x="212" y="116">2</text>
    <text x="276" y="116">3</text><text x="340" y="116">4</text><text x="404" y="116">5</text>
    <text x="468" y="116">6</text><text x="532" y="116">7</text><text x="596" y="116">8</text>
  </g>
  <!-- compared-pair underlines, one per step -->
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="340" y1="128" x2="404" y2="128"/>
    <line x1="212" y1="141" x2="276" y2="141"/>
    <line x1="84" y1="154" x2="148" y2="154"/>
  </g>
  <g fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="452" y="132">1</text>
    <text x="292" y="145">2</text>
    <text x="164" y="158">3</text>
  </g>
  <!-- probe table -->
  <g fill="#5c6b76" font-size="11.5">
    <text x="44" y="182">step</text>
    <text x="88" y="182">range</text>
    <text x="210" y="182">probe</text>
    <text x="320" y="182">pair</text>
    <text x="500" y="182">action</text>
  </g>
  <g font-size="13">
    <g fill="#4169E1" font-weight="600">
      <text x="44" y="205">1</text><text x="44" y="235">2</text><text x="44" y="265">3</text>
    </g>
    <g fill="#1a2026">
      <text x="88" y="205">lo = 0, hi = 8</text>
      <text x="88" y="235">lo = 0, hi = 4</text>
      <text x="88" y="265">lo = 0, hi = 2</text>
      <text x="210" y="205">mid = 4</text>
      <text x="210" y="235">mid = 2</text>
      <text x="210" y="265">mid = 1 &#8594; 0</text>
    </g>
    <text x="320" y="205">3 &#8800; 4 <tspan fill="#5c6b76">broken</tspan></text>
    <text x="320" y="235">2 &#8800; 3 <tspan fill="#5c6b76">broken</tspan></text>
    <text x="320" y="265">1 = 1 <tspan fill="#4169E1" font-weight="600">intact</tspan></text>
    <g fill="#1a2026">
      <text x="500" y="205">&#8594; hi = 4</text>
      <text x="500" y="235">&#8594; hi = 2</text>
      <text x="500" y="265">&#8594; lo = 2</text>
    </g>
  </g>
  <text x="340" y="303" text-anchor="middle" fill="#1a2026" font-size="13">Left of the single element every pair starts on an even index; right of it, every pair starts odd.</text>
  <text x="340" y="321" text-anchor="middle" fill="#1a2026" font-size="13">Three even-index probes close lo onto index 2: nums[2] = <tspan fill="#4169E1" font-weight="600">2</tspan> is the single element.</text>
</svg>
