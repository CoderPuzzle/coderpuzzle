<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 408" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="408" fill="#ffffff"/>
  <!-- BST [4,1,6,0,2,5,7,null,null,null,3,null,null,null,8]; reverse inorder 8,7,6,5,4,3,2,1,0; accumulator 8,15,21,26,30,33,35,36,36; each circle: old key small gray above, new value bold; visit badges under circles; table columns x = 432/505/600 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="160" y1="80" x2="90" y2="160"/>
    <line x1="160" y1="80" x2="240" y2="160"/>
    <line x1="90" y1="160" x2="50" y2="240"/>
    <line x1="90" y1="160" x2="135" y2="240"/>
    <line x1="240" y1="160" x2="195" y2="240"/>
    <line x1="240" y1="160" x2="295" y2="240"/>
    <line x1="135" y1="240" x2="190" y2="320"/>
    <line x1="295" y1="240" x2="345" y2="320"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <circle cx="160" cy="80" r="21"/><circle cx="90" cy="160" r="21"/><circle cx="240" cy="160" r="21"/>
    <circle cx="50" cy="240" r="21"/><circle cx="135" cy="240" r="21"/><circle cx="195" cy="240" r="21"/>
    <circle cx="295" cy="240" r="21"/><circle cx="190" cy="320" r="21"/><circle cx="345" cy="320" r="21"/>
  </g>
  <g text-anchor="middle">
    <text x="160" y="80" fill="#5c6b76" font-size="10">4</text><text x="160" y="95" fill="#4169E1" font-weight="600" font-size="14">30</text>
    <text x="90" y="160" fill="#5c6b76" font-size="10">1</text><text x="90" y="175" fill="#4169E1" font-weight="600" font-size="14">36</text>
    <text x="240" y="160" fill="#5c6b76" font-size="10">6</text><text x="240" y="175" fill="#4169E1" font-weight="600" font-size="14">21</text>
    <text x="50" y="240" fill="#5c6b76" font-size="10">0</text><text x="50" y="255" fill="#4169E1" font-weight="600" font-size="14">36</text>
    <text x="135" y="240" fill="#5c6b76" font-size="10">2</text><text x="135" y="255" fill="#4169E1" font-weight="600" font-size="14">35</text>
    <text x="195" y="240" fill="#5c6b76" font-size="10">5</text><text x="195" y="255" fill="#4169E1" font-weight="600" font-size="14">26</text>
    <text x="295" y="240" fill="#5c6b76" font-size="10">7</text><text x="295" y="255" fill="#4169E1" font-weight="600" font-size="14">15</text>
    <text x="190" y="320" fill="#5c6b76" font-size="10">3</text><text x="190" y="335" fill="#4169E1" font-weight="600" font-size="14">33</text>
    <text x="345" y="320" fill="#5c6b76" font-size="10">8</text><text x="345" y="335" fill="#4169E1" font-weight="600" font-size="14">8</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="345" y="356">1st</text><text x="295" y="276">2nd</text><text x="240" y="196">3rd</text><text x="195" y="276">4th</text><text x="160" y="116">5th</text><text x="190" y="356">6th</text><text x="135" y="276">7th</text><text x="90" y="196">8th</text><text x="50" y="276">9th</text>
  </g>
  <rect x="400" y="206" width="260" height="24" fill="#dbe4fb"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="432" y="88">visit</text><text x="505" y="88">key</text><text x="600" y="88">acc = new value</text>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="432" y="116" fill="#5c6b76">1st</text><text x="505" y="116" fill="#1a2026">8</text><text x="600" y="116" fill="#1a2026" font-weight="600">8</text>
    <text x="432" y="142" fill="#5c6b76">2nd</text><text x="505" y="142" fill="#1a2026">7</text><text x="600" y="142" fill="#1a2026" font-weight="600">15</text>
    <text x="432" y="168" fill="#5c6b76">3rd</text><text x="505" y="168" fill="#1a2026">6</text><text x="600" y="168" fill="#1a2026" font-weight="600">21</text>
    <text x="432" y="194" fill="#5c6b76">4th</text><text x="505" y="194" fill="#1a2026">5</text><text x="600" y="194" fill="#1a2026" font-weight="600">26</text>
    <text x="432" y="220" fill="#5c6b76">5th</text><text x="505" y="220" fill="#1a2026" font-weight="600">4</text><text x="600" y="220" fill="#4169E1" font-weight="600">30</text>
    <text x="432" y="246" fill="#5c6b76">6th</text><text x="505" y="246" fill="#1a2026">3</text><text x="600" y="246" fill="#1a2026" font-weight="600">33</text>
    <text x="432" y="272" fill="#5c6b76">7th</text><text x="505" y="272" fill="#1a2026">2</text><text x="600" y="272" fill="#1a2026" font-weight="600">35</text>
    <text x="432" y="298" fill="#5c6b76">8th</text><text x="505" y="298" fill="#1a2026">1</text><text x="600" y="298" fill="#1a2026" font-weight="600">36</text>
    <text x="432" y="324" fill="#5c6b76">9th</text><text x="505" y="324" fill="#1a2026">0</text><text x="600" y="324" fill="#1a2026" font-weight="600">36</text>
  </g>
  <text x="340" y="378" text-anchor="middle" fill="#1a2026" font-size="13">Right-first, the walk visits 8, 7, 6, 5, 4, 3, 2, 1, 0 while the accumulator climbs</text>
  <text x="340" y="396" text-anchor="middle" fill="#1a2026" font-size="13">8, 15, 21, 26, <tspan fill="#4169E1" font-weight="600">30</tspan>, 33, 35, 36, 36 — every key becomes key + sum of greater keys.</text>
</svg>
