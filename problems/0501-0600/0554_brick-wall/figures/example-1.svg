<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- wall: width 6 units, 6 rows; 1 unit = 56px; origin at (70,50) -->
  <g stroke="#1a2026" stroke-width="1.4">
    <!-- row 0: [1,2,2,1] -->
    <rect x="70"  y="50" width="56"  height="32" fill="#f1ede6"/>
    <rect x="126" y="50" width="112" height="32" fill="#f1ede6"/>
    <rect x="238" y="50" width="112" height="32" fill="#e9c9a4"/>
    <rect x="350" y="50" width="56"  height="32" fill="#f1ede6"/>
    <!-- row 1: [3,1,2] -->
    <rect x="70"  y="82" width="168" height="32" fill="#f1ede6"/>
    <rect x="238" y="82" width="56"  height="32" fill="#f1ede6"/>
    <rect x="294" y="82" width="112" height="32" fill="#f1ede6"/>
    <!-- row 2: [1,3,2] -->
    <rect x="70"  y="114" width="56"  height="32" fill="#f1ede6"/>
    <rect x="126" y="114" width="168" height="32" fill="#f1ede6"/>
    <rect x="294" y="114" width="112" height="32" fill="#f1ede6"/>
    <!-- row 3: [2,4] -->
    <rect x="70"  y="146" width="112" height="32" fill="#f1ede6"/>
    <rect x="182" y="146" width="224" height="32" fill="#e9c9a4"/>
    <!-- row 4: [3,1,2] -->
    <rect x="70"  y="178" width="168" height="32" fill="#f1ede6"/>
    <rect x="238" y="178" width="56"  height="32" fill="#f1ede6"/>
    <rect x="294" y="178" width="112" height="32" fill="#f1ede6"/>
    <!-- row 5: [1,3,1,1] -->
    <rect x="70"  y="210" width="56"  height="32" fill="#f1ede6"/>
    <rect x="126" y="210" width="168" height="32" fill="#f1ede6"/>
    <rect x="294" y="210" width="56"  height="32" fill="#f1ede6"/>
    <rect x="350" y="210" width="56"  height="32" fill="#f1ede6"/>
  </g>
  <!-- vertical line at position 4 (px 70 + 4*56 = 294), crossing rows 0 and 3 -->
  <line x1="294" y1="34" x2="294" y2="258" stroke="#4169E1" stroke-width="2.6" stroke-dasharray="7 5"/>
  <text x="294" y="24" text-anchor="middle" fill="#4169E1" font-size="12.5">position 4</text>
  <text x="70" y="266" fill="#5c6b76" font-size="12.5">edges at position 4 in 4 of 6 rows — the line crosses only 2 bricks</text>
</svg>
