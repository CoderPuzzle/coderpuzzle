<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="440" fill="#ffffff"/>
  <!-- isConnected = [[1,1,0],[1,1,0],[0,0,1]]; cities shown 1-indexed (code i = 0,1,2).
       Scan i &lt; j: only (1,2) is a road; union roots differ so parent[0] = 1 (city 1
       under city 2) and the count drops 3 -> 2; city 3 stays its own root -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- matrix -->
  <text x="152" y="64" text-anchor="middle" fill="#5c6b76" font-size="13">isConnected</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="108" y="88">1</text><text x="152" y="88">2</text><text x="196" y="88">3</text>
    <text x="70" y="117">1</text><text x="70" y="149">2</text><text x="70" y="181">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="86" y="96" width="44" height="32" fill="#f0f3f7"/>
    <rect x="130" y="96" width="44" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <rect x="174" y="96" width="44" height="32" fill="#ffffff"/>
    <rect x="86" y="128" width="44" height="32" fill="#ffffff"/>
    <rect x="130" y="128" width="44" height="32" fill="#f0f3f7"/>
    <rect x="174" y="128" width="44" height="32" fill="#ffffff"/>
    <rect x="86" y="160" width="44" height="32" fill="#ffffff"/>
    <rect x="130" y="160" width="44" height="32" fill="#ffffff"/>
    <rect x="174" y="160" width="44" height="32" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="108" y="117" fill="#9aa7b2">1</text>
    <text x="152" y="117" fill="#4169E1" font-weight="600">1</text>
    <text x="196" y="117" fill="#9aa7b2">0</text>
    <text x="108" y="149" fill="#1a2026">1</text>
    <text x="152" y="149" fill="#9aa7b2">1</text>
    <text x="196" y="149" fill="#9aa7b2">0</text>
    <text x="108" y="181" fill="#9aa7b2">0</text>
    <text x="152" y="181" fill="#9aa7b2">0</text>
    <text x="196" y="181" fill="#9aa7b2">1</text>
  </g>
  <text x="152" y="216" text-anchor="middle" fill="#5c6b76" font-size="12">roads above the diagonal: just (1,2)</text>
  <!-- disjoint-set forest, before -->
  <text x="470" y="64" text-anchor="middle" fill="#5c6b76" font-size="13">disjoint-set forest</text>
  <text x="470" y="96" text-anchor="middle" fill="#1a2026" font-size="12.5">before &#8212; count 3</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="370" cy="140" r="20"/><circle cx="470" cy="140" r="20"/><circle cx="570" cy="140" r="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="370" y="145">1</text><text x="470" y="145">2</text><text x="570" y="145">3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="370" y="182">root</text><text x="470" y="182">root</text><text x="570" y="182">root</text>
  </g>
  <!-- the one union -->
  <line x1="470" y1="196" x2="470" y2="240" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="12.5" text-anchor="end" fill="#1a2026">
    <text x="452" y="212">road (1,2): roots differ</text>
    <text x="452" y="230">city 1 glues under city 2</text>
  </g>
  <!-- after -->
  <text x="470" y="262" text-anchor="middle" fill="#1a2026" font-size="12.5">after &#8212; <tspan fill="#4169E1" font-weight="600">count 2</tspan></text>
  <circle cx="420" cy="292" r="20" fill="#4169E1"/>
  <text x="420" y="297" text-anchor="middle" fill="#ffffff" font-weight="600">2</text>
  <text x="448" y="297" text-anchor="start" fill="#9aa7b2" font-size="11.5">root</text>
  <line x1="420" y1="334" x2="420" y2="318" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="420" cy="356" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="420" y="361" text-anchor="middle" fill="#1a2026">1</text>
  <circle cx="560" cy="292" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="560" y="297" text-anchor="middle" fill="#1a2026">3</text>
  <text x="560" y="330" text-anchor="middle" fill="#9aa7b2" font-size="11.5">root</text>
  <text x="340" y="404" text-anchor="middle" fill="#1a2026" font-size="13">The road (1,2) is the only edge above the diagonal: city 1 glues under city 2,</text>
  <text x="340" y="422" text-anchor="middle" fill="#1a2026" font-size="13">city 3 keeps its own root, and the count falls <tspan fill="#4169E1" font-weight="600">3 &#8594; 2</tspan> provinces.</text>
</svg>
