<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="400" fill="#ffffff"/>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="320" y1="82" x2="190" y2="152"/>
    <line x1="320" y1="82" x2="470" y2="152"/>
    <line x1="190" y1="186" x2="190" y2="252"/>
    <line x1="190" y1="286" x2="120" y2="342"/>
    <line x1="190" y1="286" x2="260" y2="342"/>
    <line x1="470" y1="186" x2="400" y2="342"/>
    <line x1="470" y1="186" x2="540" y2="342"/>
  </g>
  <!-- nodes -->
  <g font-weight="600" text-anchor="middle">
    <circle cx="320" cy="66" r="22" fill="#4169E1" stroke="#42525e" stroke-width="1.6"/><text x="320" y="72" fill="#ffffff">3</text>
    <circle cx="190" cy="170" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="190" y="176">5</text>
    <circle cx="470" cy="170" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="470" y="176">4</text>
    <circle cx="190" cy="270" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="190" y="276">2</text>
    <circle cx="120" cy="360" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="120" y="366">1</text>
    <circle cx="260" cy="360" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="260" y="366">0</text>
    <circle cx="400" cy="360" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="400" y="366">1</text>
    <circle cx="540" cy="360" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="540" y="366">1</text>
  </g>
  <!-- operator labels -->
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="320" y="36">AND — root</text>
    <text x="152" y="140">NOT</text>
    <text x="520" y="142">XOR</text>
    <text x="190" y="316">OR</text>
  </g>
  <!-- (t, f) badges -->
  <g font-size="12.5" text-anchor="middle" fill="#4169E1" font-weight="600">
    <text x="356" y="60">(2, 0)</text>
    <text x="130" y="172">(1, 0)</text>
    <text x="536" y="172">(1, 0)</text>
    <text x="226" y="272">(0, 1)</text>
    <text x="120" y="396">(0, 1)</text>
    <text x="260" y="396">(1, 0)</text>
    <text x="400" y="396">(0, 1)</text>
    <text x="540" y="396">(0, 1)</text>
  </g>
  <!-- narration -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="580" y="290">The root AND must</text>
    <text x="580" y="306">be true, paying</text>
    <text x="580" y="322">t(left) + t(right):</text>
    <text x="580" y="338">the NOT subtree</text>
    <text x="580" y="354">costs 1 and the XOR</text>
    <text x="580" y="370">subtree costs 1, so</text>
    <text x="580" y="386">2 flips in total.</text>
  </g>
  <text x="40" y="60" fill="#1a2026" font-size="13">Badges show (t, f) — flips to make the subtree</text>
  <text x="40" y="78" fill="#1a2026" font-size="13">true / false. Answer for result = true: <tspan fill="#4169E1" font-weight="600">t = 2</tspan>.</text>
</svg>
