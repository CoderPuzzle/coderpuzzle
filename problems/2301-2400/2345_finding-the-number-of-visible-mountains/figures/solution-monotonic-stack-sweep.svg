<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="348" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- peaks [[2,2],[6,3],[5,4]] sorted by x; plot origin (56,270), 44 px per x-unit, 30 px per y-unit; mountain (x,y) drawn as triangle base [x-y,x+y], apex (x,y) -->
  <text x="56" y="44" fill="#5c6b76" font-size="12.5">peaks sorted by x: (2,2) → (5,4) → (6,3)</text>
  <path d="M 50 116 L 50 270 L 470 270" fill="none" stroke="#9aa7b2" stroke-width="1"/>
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="46" y1="210" x2="50" y2="210"/><line x1="46" y1="180" x2="50" y2="180"/><line x1="46" y1="150" x2="50" y2="150"/>
    <line x1="144" y1="270" x2="144" y2="274"/><line x1="276" y1="270" x2="276" y2="274"/><line x1="320" y1="270" x2="320" y2="274"/>
  </g>
  <g fill="#9aa7b2" font-size="12">
    <text x="42" y="214" text-anchor="end">2</text><text x="42" y="184" text-anchor="end">3</text><text x="42" y="154" text-anchor="end">4</text>
    <text x="144" y="288" text-anchor="middle">2</text><text x="276" y="288" text-anchor="middle">5</text><text x="320" y="288" text-anchor="middle">6</text>
  </g>
  <!-- mountain 2 (5,4): survivor, accent fill -->
  <polygon points="100,270 276,150 452,270" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- mountain 0 (2,2): survivor -->
  <polygon points="56,270 144,210 232,270" fill="#ffffff" stroke="#4169E1" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- mountain 1 (6,3): covered, its apex sits on mountain 2's right slope -->
  <path d="M 188 270 L 320 180 L 452 270" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g stroke="#42525e" stroke-width="2" stroke-linecap="round">
    <line x1="313" y1="173" x2="327" y2="187"/><line x1="327" y1="173" x2="313" y2="187"/>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="128" y="192" text-anchor="middle">m0 (2,2)</text>
    <text x="276" y="138" text-anchor="middle">m2 (5,4)</text>
    <text x="352" y="192" text-anchor="start">m1 (6,3)</text>
  </g>
  <path d="M 414 150 Q 370 150 332 172" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g fill="#5c6b76" font-size="12.5">
    <text x="420" y="142">peak (6,3): |6−5| = 1</text>
    <text x="420" y="158">≤ 4−3 = 1 → covered</text>
  </g>
  <!-- stack after the sweep -->
  <text x="577" y="204" text-anchor="middle" fill="#5c6b76" font-size="12.5">stack</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="545" y="212" width="64" height="30"/><rect x="545" y="246" width="64" height="30"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="577" y="232">(5,4)</text><text x="577" y="266">(2,2)</text>
  </g>
  <text x="617" y="232" fill="#9aa7b2" font-size="12">top</text>
  <text x="577" y="296" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">2 visible</text>
  <text x="320" y="320" text-anchor="middle" fill="#1a2026" font-size="13">Mountain 1's peak (6,3) lies on mountain 2's slope (|6−5| = 1 ≤ 4−3 = 1),</text>
  <text x="320" y="338" text-anchor="middle" fill="#1a2026" font-size="13">so one stack pass leaves (2,2) and (5,4) — <tspan fill="#4169E1" font-weight="600">2</tspan> visible mountains.</text>
</svg>
