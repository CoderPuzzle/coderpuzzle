<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- root = [2,1,3,null,null,0,1]; one row per fold step;
       work pills bottom-to-top (top pill accented), shelf circles bottom-to-top (top rightmost);
       the ring marks the final answer bit in step 7 -->
  <g font-size="12" fill="#5c6b76">
    <text x="44" y="46" text-anchor="middle">step</text>
    <text x="76" y="46">action</text>
    <text x="250" y="46">work stack (bottom &#8594; top)</text>
    <text x="470" y="46">operand shelf</text>
  </g>
  <!-- step labels and actions -->
  <g text-anchor="start">
    <text x="44" y="70" text-anchor="middle" font-size="12.5" fill="#5c6b76">0</text>
    <text x="76" y="70" font-size="12.5" fill="#1a2026">push root 2</text>
    <text x="44" y="98" text-anchor="middle" font-size="12.5" fill="#5c6b76">1</text>
    <text x="76" y="98" font-size="12.5" fill="#1a2026">expand 2 (OR)</text>
    <text x="44" y="126" text-anchor="middle" font-size="12.5" fill="#5c6b76">2</text>
    <text x="76" y="126" font-size="12.5" fill="#1a2026">leaf 1 deposits 1</text>
    <text x="44" y="154" text-anchor="middle" font-size="12.5" fill="#5c6b76">3</text>
    <text x="76" y="154" font-size="12.5" fill="#1a2026">expand 3 (AND)</text>
    <text x="44" y="182" text-anchor="middle" font-size="12.5" fill="#5c6b76">4</text>
    <text x="76" y="182" font-size="12.5" fill="#1a2026">leaf 0 deposits 0</text>
    <text x="44" y="210" text-anchor="middle" font-size="12.5" fill="#5c6b76">5</text>
    <text x="76" y="210" font-size="12.5" fill="#1a2026">leaf 1 deposits 1</text>
    <text x="44" y="238" text-anchor="middle" font-size="12.5" fill="#5c6b76">6</text>
    <text x="76" y="238" font-size="12.5" fill="#1a2026">apply AND: 1 AND 0 = 0</text>
    <text x="44" y="266" text-anchor="middle" font-size="12.5" fill="#5c6b76">7</text>
    <text x="76" y="266" font-size="12.5" fill="#1a2026">apply OR: 0 OR 1 = 1</text>
  </g>
  <!-- work stack pills: operator pills light accent, node pills white, top pill solid accent -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="250" y="55" width="26" height="22" rx="5" fill="#4169E1"/>
    <rect x="250" y="83" width="40" height="22" rx="5" fill="#dbe4fb" stroke="none"/>
    <rect x="296" y="83" width="26" height="22" rx="5" fill="#ffffff"/>
    <rect x="328" y="83" width="26" height="22" rx="5" fill="#4169E1" stroke="none"/>
    <rect x="250" y="111" width="40" height="22" rx="5" fill="#dbe4fb" stroke="none"/>
    <rect x="296" y="111" width="26" height="22" rx="5" fill="#4169E1" stroke="none"/>
    <rect x="250" y="139" width="40" height="22" rx="5" fill="#dbe4fb" stroke="none"/>
    <rect x="296" y="139" width="40" height="22" rx="5" fill="#dbe4fb" stroke="none"/>
    <rect x="342" y="139" width="26" height="22" rx="5" fill="#ffffff"/>
    <rect x="374" y="139" width="26" height="22" rx="5" fill="#4169E1" stroke="none"/>
    <rect x="250" y="167" width="40" height="22" rx="5" fill="#dbe4fb" stroke="none"/>
    <rect x="296" y="167" width="40" height="22" rx="5" fill="#dbe4fb" stroke="none"/>
    <rect x="342" y="167" width="26" height="22" rx="5" fill="#4169E1" stroke="none"/>
    <rect x="250" y="195" width="40" height="22" rx="5" fill="#dbe4fb" stroke="none"/>
    <rect x="296" y="195" width="40" height="22" rx="5" fill="#4169E1" stroke="none"/>
    <rect x="250" y="223" width="40" height="22" rx="5" fill="#4169E1" stroke="none"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="263" y="70" fill="#ffffff" font-weight="600">2</text>
    <text x="270" y="98" font-size="11.5" font-weight="600">OR</text>
    <text x="309" y="98">3</text>
    <text x="341" y="98" fill="#ffffff" font-weight="600">1</text>
    <text x="270" y="126" font-size="11.5" font-weight="600">OR</text>
    <text x="309" y="126" fill="#ffffff" font-weight="600">3</text>
    <text x="270" y="154" font-size="11.5" font-weight="600">OR</text>
    <text x="316" y="154" font-size="11.5" font-weight="600">AND</text>
    <text x="355" y="154">1</text>
    <text x="387" y="154" fill="#ffffff" font-weight="600">0</text>
    <text x="270" y="182" font-size="11.5" font-weight="600">OR</text>
    <text x="316" y="182" font-size="11.5" font-weight="600">AND</text>
    <text x="355" y="182" fill="#ffffff" font-weight="600">1</text>
    <text x="270" y="210" font-size="11.5" font-weight="600">OR</text>
    <text x="316" y="210" fill="#ffffff" font-weight="600">AND</text>
    <text x="270" y="238" fill="#ffffff" font-weight="600">OR</text>
  </g>
  <text x="250" y="266" font-size="11.5" fill="#9aa7b2">empty</text>
  <!-- operand shelf: 1 = solid accent bit, 0 = white bit; ring = just-pushed result / final answer -->
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="470" y="70" font-size="11.5" fill="#9aa7b2" font-weight="400">empty</text>
    <circle cx="470" cy="122" r="10" fill="#4169E1"/>
    <text x="470" y="126" fill="#ffffff">1</text>
    <circle cx="470" cy="178" r="10" fill="#4169E1"/>
    <text x="470" y="182" fill="#ffffff">1</text>
    <circle cx="496" cy="178" r="10" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="496" y="182" fill="#1a2026">0</text>
    <circle cx="470" cy="206" r="10" fill="#4169E1"/>
    <text x="470" y="210" fill="#ffffff">1</text>
    <circle cx="496" cy="206" r="10" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="496" y="210" fill="#1a2026">0</text>
    <circle cx="522" cy="206" r="10" fill="#4169E1"/>
    <text x="522" y="210" fill="#ffffff">1</text>
    <circle cx="470" cy="234" r="10" fill="#4169E1"/>
    <text x="470" y="238" fill="#ffffff">1</text>
    <circle cx="496" cy="234" r="10" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="496" y="238" fill="#1a2026">0</text>
    <circle cx="470" cy="262" r="14" fill="none" stroke="#4169E1" stroke-width="1.2"/>
    <circle cx="470" cy="262" r="10" fill="#4169E1"/>
    <text x="470" y="266" fill="#ffffff">1</text>
  </g>
  <text x="36" y="300" font-size="13" fill="#1a2026">Numbers = nodes to expand, words = operator instructions; left child goes on top.</text>
  <text x="36" y="320" font-size="13" fill="#1a2026">The AND pops 1, 0 &#8594; 0; the OR pops 0, 1 &#8594; 1 &#8212; <tspan fill="#4169E1" font-weight="600">true</tspan> ends up alone on the shelf.</text>
</svg>
