<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums = [3,9,3]; bound starts at the last element 3; the 9 splits into k=ceil(9/3)=3 pieces -->
  <text x="338" y="24" text-anchor="middle" fill="#5c6b76" font-size="12.5">read right to left, holding a bound</text>
  <path d="M 455 36 L 228 36" fill="none" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="190" y="46" width="80" height="46"/><rect x="290" y="46" width="80" height="46"/>
    <rect x="390" y="46" width="80" height="46"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="230" y="59">i = 0</text><text x="330" y="59">i = 1</text><text x="430" y="59">i = 2</text>
  </g>
  <g text-anchor="middle" font-weight="700" font-size="16" fill="#1a2026">
    <text x="230" y="82">3</text><text x="330" y="82">9</text><text x="430" y="82">3</text>
  </g>
  <!-- per-element notes -->
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="230" y="136">3 ≤ bound 3</text>
    <text x="430" y="136">bound = 3</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="230" y="152">keep, bound stays 3</text>
    <text x="430" y="152">last element, never split</text>
  </g>
  <!-- the 9 breaks into three even pieces -->
  <path d="M 330 96 L 330 152" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="268" y="158" width="42" height="40"/><rect x="318" y="158" width="42" height="40"/>
    <rect x="368" y="158" width="42" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="700" font-size="14" fill="#1a2026">
    <text x="289" y="183">3</text><text x="339" y="183">3</text><text x="389" y="183">3</text>
  </g>
  <text x="339" y="220" text-anchor="middle" fill="#5c6b76" font-size="12.5">k = ceil(9 / 3) = 3 pieces, as even as possible</text>
  <text x="339" y="238" text-anchor="middle" fill="#1a2026" font-size="12.5">ops += k − 1 = <tspan fill="#4169E1" font-weight="700">2</tspan>; new bound = floor(9 / 3) = 3</text>
  <!-- total badge -->
  <rect x="492" y="158" width="116" height="40" fill="#dbe4fb"/>
  <text x="550" y="175" text-anchor="middle" fill="#1a2026" font-size="11.5">total operations</text>
  <text x="550" y="192" text-anchor="middle" fill="#4169E1" font-size="15" font-weight="700">2</text>
  <text x="310" y="268" text-anchor="middle" fill="#1a2026" font-size="13">9 splits into as-even-as-possible pieces 3, 3, 3 — every piece respects the bound 3,</text>
  <text x="310" y="286" text-anchor="middle" fill="#1a2026" font-size="13">so the next bound is floor(9/3) = 3 and the final 3 fits — sorting costs <tspan fill="#4169E1" font-weight="600">2</tspan> operations.</text>
</svg>
