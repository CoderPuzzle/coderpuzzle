<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 412" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="412" fill="#ffffff"/>
  <!-- nums = [1,3,4,3,1], threshold = 6; bars 64 wide, pitch 92 from x=64, baseline y=238;
       table rows stamp prev_lt / next_le / span / need k per index; index 3 anchors the answer -->
  <text x="280" y="103" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">index 3: span 3, need k = 3 &#8212; fits</text>
  <path d="M 156 117 L 156 111 L 404 111 L 404 117" fill="none" stroke="#4169E1" stroke-width="2"/>
  <!-- bars: answer window [3,4,3] accented -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="64" y="213" width="64" height="25" fill="#ffffff"/>
    <rect x="340" y="163" width="64" height="75" fill="#4169E1"/>
    <rect x="432" y="213" width="64" height="25" fill="#ffffff"/>
  </g>
  <rect x="156" y="163" width="64" height="75" fill="#4169E1" stroke="#42525e" stroke-width="1.5"/>
  <rect x="248" y="138" width="64" height="100" fill="#4169E1" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="96" y="205">1</text>
    <text x="188" y="155">3</text>
    <text x="280" y="130">4</text>
    <text x="372" y="155">3</text>
    <text x="464" y="205">1</text>
  </g>
  <line x1="48" y1="238" x2="512" y2="238" stroke="#42525e" stroke-width="1.5"/>
  <!-- stamped arrays -->
  <g text-anchor="end" font-size="12" fill="#5c6b76">
    <text x="56" y="258">i</text>
    <text x="56" y="277">prev &lt;</text>
    <text x="56" y="296">next &#8804;</text>
    <text x="56" y="315">span</text>
    <text x="56" y="334">need k</text>
    <text x="56" y="353">k &#8804; span</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="96" y="258" fill="#5c6b76">0</text><text x="188" y="258" fill="#5c6b76">1</text>
    <text x="280" y="258" fill="#5c6b76">2</text><text x="372" y="258" fill="#5c6b76">3</text>
    <text x="464" y="258" fill="#5c6b76">4</text>
    <text x="96" y="277">-1</text><text x="188" y="277">0</text><text x="280" y="277">1</text>
    <text x="372" y="277">0</text><text x="464" y="277">-1</text>
    <text x="96" y="296">4</text><text x="188" y="296">3</text><text x="280" y="296">3</text>
    <text x="372" y="296">4</text><text x="464" y="296">5</text>
    <text x="96" y="315">4</text><text x="188" y="315">2</text><text x="280" y="315">1</text>
    <text x="372" y="315" fill="#4169E1" font-weight="600">3</text><text x="464" y="315">5</text>
    <text x="96" y="334">7</text><text x="188" y="334">3</text><text x="280" y="334">2</text>
    <text x="372" y="334" fill="#4169E1" font-weight="600">3</text><text x="464" y="334">7</text>
    <text x="96" y="353">no</text><text x="188" y="353">no</text><text x="280" y="353">no</text>
    <text x="372" y="353" fill="#4169E1" font-weight="600">yes</text><text x="464" y="353">no</text>
  </g>
  <text x="36" y="380" font-size="13" fill="#1a2026">Index 3 owns the widest window <tspan fill="#4169E1" font-weight="600">[3,4,3]</tspan>: prev_lt = 0, next_le = 4, so span = 3.</text>
  <text x="36" y="398" font-size="13" fill="#1a2026">It needs k = 6 // 3 + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan>, which just fits; every other span falls short of its k.</text>
</svg>
