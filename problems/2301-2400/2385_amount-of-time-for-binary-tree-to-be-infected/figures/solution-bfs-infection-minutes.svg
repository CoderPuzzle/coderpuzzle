<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="430" fill="#ffffff"/>
  <!-- root = [1,5,3,null,4,10,6,9,2], start = 3; edges 1-5,1-3,5-4,3-10,3-6,4-9,4-2;
       BFS from 3: t0={3} t1={1,10,6} t2={5} t3={4} t4={9,2}; circles r=20 -->
  <text x="24" y="24" fill="#5c6b76" font-size="12.5">root = [1,5,3,null,4,10,6,9,2], start = 3</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="200" y1="80" x2="100" y2="165"/>
    <line x1="200" y1="80" x2="330" y2="165"/>
    <line x1="100" y1="165" x2="160" y2="250"/>
    <line x1="330" y1="165" x2="270" y2="250"/>
    <line x1="330" y1="165" x2="420" y2="250"/>
    <line x1="160" y1="250" x2="105" y2="335"/>
    <line x1="160" y1="250" x2="215" y2="335"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <circle cx="200" cy="80" r="20"/>
    <circle cx="100" cy="165" r="20"/>
    <circle cx="330" cy="165" r="20" fill="#4169E1"/>
    <circle cx="160" cy="250" r="20"/>
    <circle cx="270" cy="250" r="20"/>
    <circle cx="420" cy="250" r="20"/>
    <circle cx="105" cy="335" r="20"/>
    <circle cx="215" cy="335" r="20"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="200" y="85">1</text>
    <text x="100" y="170">5</text>
    <text x="330" y="170" fill="#ffffff">3</text>
    <text x="160" y="255">4</text>
    <text x="270" y="255">10</text>
    <text x="420" y="255">6</text>
    <text x="105" y="340">9</text>
    <text x="215" y="340">2</text>
  </g>
  <!-- infection minute stamped under each node -->
  <g text-anchor="middle" font-size="11" font-weight="600" fill="#4169E1">
    <text x="200" y="116">t = 1</text>
    <text x="100" y="201">t = 2</text>
    <text x="330" y="201">t = 0</text>
    <text x="160" y="286">t = 3</text>
    <text x="270" y="286">t = 1</text>
    <text x="420" y="286">t = 1</text>
    <text x="105" y="371">t = 4</text>
    <text x="215" y="371">t = 4</text>
  </g>
  <text x="460" y="78" fill="#5c6b76" font-size="12.5">BFS layers from 3</text>
  <g font-size="13" fill="#1a2026">
    <text x="460" y="110">minute <tspan fill="#4169E1" font-weight="600">0</tspan>: 3</text>
    <text x="460" y="146">minute <tspan fill="#4169E1" font-weight="600">1</tspan>: 1, 10, 6</text>
    <text x="460" y="182">minute <tspan fill="#4169E1" font-weight="600">2</tspan>: 5</text>
    <text x="460" y="218">minute <tspan fill="#4169E1" font-weight="600">3</tspan>: 4</text>
    <text x="460" y="254">minute <tspan fill="#4169E1" font-weight="600">4</tspan>: 9, 2</text>
  </g>
  <text x="320" y="402" text-anchor="middle" fill="#1a2026" font-size="13">The BFS frontier spreads one edge per minute; each layer peeled from start 3</text>
  <text x="320" y="420" text-anchor="middle" fill="#1a2026" font-size="13">is one more minute, so the deepest layer, <tspan fill="#4169E1" font-weight="600">minute 4</tspan> (9 and 2), gives the answer <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
