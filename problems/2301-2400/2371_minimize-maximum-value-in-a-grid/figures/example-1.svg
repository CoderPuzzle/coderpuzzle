<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 204" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- grid = [[3,1],[2,5]] -> [[2,1],[1,2]] -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="50" y="40" width="58" height="58"/>
    <rect x="108" y="40" width="58" height="58"/>
    <rect x="50" y="98" width="58" height="58"/>
    <rect x="108" y="98" width="58" height="58"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="79" y="74">3</text><text x="137" y="74">1</text>
    <text x="79" y="132">2</text><text x="137" y="132">5</text>
  </g>
  <line x1="200" y1="98" x2="256" y2="98" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.4" fill="#e6ecfb">
    <rect x="310" y="40" width="58" height="58"/>
    <rect x="368" y="40" width="58" height="58"/>
    <rect x="310" y="98" width="58" height="58"/>
    <rect x="368" y="98" width="58" height="58"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="700">
    <text x="339" y="74">2</text><text x="397" y="74">1</text>
    <text x="339" y="132">1</text><text x="397" y="132">2</text>
  </g>
  <text x="240" y="192" text-anchor="middle" fill="#1a2026" font-size="13.5">relative order kept within every row and column; the maximum is <tspan fill="#4169E1" font-weight="700">2</tspan></text>
</svg>
