<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- m=3, n=5, head=[3,0,2,6,8,1,7,9,4,2,5,5,0]; cells 74x50, pitch x 90 / y 66, origin (96,76);
       badges = write order 1-13; blue arrows = the four 90-degree turns, gray = straight moves -->
  <text x="96" y="64" font-size="12" fill="#5c6b76">write order 1-13</text>
  <text x="52" y="105" text-anchor="end" font-size="12" fill="#5c6b76">head</text>
  <line x1="58" y1="101" x2="90" y2="101" stroke="#5c6b76" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <!-- unwritten cells keep -1 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#f0f3f7">
    <rect x="276" y="142" width="74" height="50"/>
    <rect x="366" y="142" width="74" height="50"/>
  </g>
  <!-- written cells -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="96" y="76" width="74" height="50"/><rect x="186" y="76" width="74" height="50"/>
    <rect x="276" y="76" width="74" height="50"/><rect x="366" y="76" width="74" height="50"/>
    <rect x="456" y="76" width="74" height="50"/><rect x="96" y="142" width="74" height="50"/>
    <rect x="456" y="142" width="74" height="50"/><rect x="96" y="208" width="74" height="50"/>
    <rect x="186" y="208" width="74" height="50"/><rect x="276" y="208" width="74" height="50"/>
    <rect x="366" y="208" width="74" height="50"/><rect x="456" y="208" width="74" height="50"/>
    <rect x="186" y="142" width="74" height="50"/>
  </g>
  <g text-anchor="middle">
    <text x="133" y="106" font-size="15" font-weight="600" fill="#1a2026">3</text>
    <text x="223" y="106" font-size="15" font-weight="600" fill="#1a2026">0</text>
    <text x="313" y="106" font-size="15" font-weight="600" fill="#1a2026">2</text>
    <text x="403" y="106" font-size="15" font-weight="600" fill="#1a2026">6</text>
    <text x="493" y="106" font-size="15" font-weight="600" fill="#1a2026">8</text>
    <text x="493" y="172" font-size="15" font-weight="600" fill="#1a2026">1</text>
    <text x="493" y="238" font-size="15" font-weight="600" fill="#1a2026">7</text>
    <text x="403" y="238" font-size="15" font-weight="600" fill="#1a2026">9</text>
    <text x="313" y="238" font-size="15" font-weight="600" fill="#1a2026">4</text>
    <text x="223" y="238" font-size="15" font-weight="600" fill="#1a2026">2</text>
    <text x="133" y="238" font-size="15" font-weight="600" fill="#1a2026">5</text>
    <text x="133" y="172" font-size="15" font-weight="600" fill="#1a2026">5</text>
    <text x="223" y="172" font-size="15" font-weight="600" fill="#1a2026">0</text>
    <text x="313" y="172" font-size="14" fill="#9aa7b2">-1</text>
    <text x="403" y="172" font-size="14" fill="#9aa7b2">-1</text>
  </g>
  <g font-size="10.5" font-weight="600" fill="#4169E1">
    <text x="103" y="91">1</text><text x="193" y="91">2</text><text x="283" y="91">3</text>
    <text x="373" y="91">4</text><text x="463" y="91">5</text><text x="463" y="157">6</text>
    <text x="463" y="223">7</text><text x="373" y="223">8</text><text x="283" y="223">9</text>
    <text x="193" y="223">10</text><text x="103" y="223">11</text><text x="103" y="157">12</text>
    <text x="193" y="157">13</text>
  </g>
  <!-- straight moves -->
  <g stroke="#5c6b76" stroke-width="1.6" fill="none">
    <path d="M 171 101 L 185 101" marker-end="url(#arrowG)"/>
    <path d="M 261 101 L 275 101" marker-end="url(#arrowG)"/>
    <path d="M 351 101 L 365 101" marker-end="url(#arrowG)"/>
    <path d="M 441 101 L 455 101" marker-end="url(#arrowG)"/>
    <path d="M 493 193 L 493 207" marker-end="url(#arrowG)"/>
    <path d="M 365 233 L 351 233" marker-end="url(#arrowG)"/>
    <path d="M 275 233 L 261 233" marker-end="url(#arrowG)"/>
    <path d="M 185 233 L 171 233" marker-end="url(#arrowG)"/>
  </g>
  <!-- the four 90-degree turns -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 493 127 L 493 141" marker-end="url(#arrowB)"/>
    <path d="M 455 233 L 441 233" marker-end="url(#arrowB)"/>
    <path d="M 133 207 L 133 193" marker-end="url(#arrowB)"/>
    <path d="M 171 167 L 185 167" marker-end="url(#arrowB)"/>
  </g>
  <text x="40" y="298" font-size="13" fill="#1a2026">Blocked by the edge or a written cell, the cursor rotates 90&#176; clockwise and retries.</text>
  <text x="40" y="316" font-size="13" fill="#1a2026">All <tspan fill="#4169E1" font-weight="600">13</tspan> list values land after 4 turns; unwritten cells (1,2) and (1,3) keep <tspan fill="#4169E1" font-weight="600">-1</tspan>.</text>
</svg>
