<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[1,1],[3,4]]; dp = [[3,2],[2,1]]; cells 120x78 at (170,78) and (318,190);
       badge = processing order by decreasing value; arrow labels = dp flowing in from the larger neighbor -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="170" y="78" width="120" height="78"/><rect x="318" y="78" width="120" height="78"/>
    <rect x="170" y="190" width="120" height="78"/><rect x="318" y="190" width="120" height="78"/>
  </g>
  <!-- equal values never chain -->
  <text x="304" y="122" text-anchor="middle" font-size="13" fill="#9aa7b2">=</text>
  <g text-anchor="middle">
    <text x="230" y="124" font-size="20" font-weight="600" fill="#1a2026">1</text>
    <text x="378" y="124" font-size="20" font-weight="600" fill="#1a2026">1</text>
    <text x="230" y="236" font-size="20" font-weight="600" fill="#1a2026">3</text>
    <text x="378" y="236" font-size="20" font-weight="600" fill="#1a2026">4</text>
    <text x="230" y="148" font-size="13" font-weight="600" fill="#4169E1">dp = 3</text>
    <text x="378" y="148" font-size="13" font-weight="600" fill="#4169E1">dp = 2</text>
    <text x="230" y="260" font-size="13" font-weight="600" fill="#4169E1">dp = 2</text>
    <text x="378" y="260" font-size="13" font-weight="600" fill="#4169E1">dp = 1</text>
  </g>
  <g fill="#4169E1">
    <circle cx="274" cy="94" r="11"/><circle cx="422" cy="94" r="11"/>
    <circle cx="274" cy="206" r="11"/><circle cx="422" cy="206" r="11"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">
    <text x="274" y="98">4th</text><text x="422" y="98">3rd</text>
    <text x="274" y="210">2nd</text><text x="422" y="210">1st</text>
  </g>
  <!-- arrows from each cell to its strictly larger neighbors -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 230 160 L 230 186" marker-end="url(#arrowB)"/>
    <path d="M 378 160 L 378 186" marker-end="url(#arrowB)"/>
    <path d="M 294 229 L 314 229" marker-end="url(#arrowB)"/>
  </g>
  <g font-size="12" font-weight="600" fill="#4169E1">
    <text x="240" y="177">+2</text>
    <text x="388" y="177">+1</text>
    <text x="304" y="221" text-anchor="middle">+1</text>
  </g>
  <text x="30" y="298" font-size="13" fill="#1a2026">Decreasing order 4, 3, 1, 1: dp 1, then 1 + 1 = 2, then 1 + 1 = 2, then 1 + 2 <tspan fill="#4169E1" font-weight="600">= 3</tspan>.</text>
  <text x="30" y="318" font-size="13" fill="#1a2026">Larger neighbors are already final, so dp = 3 + 2 + 2 + 1 = <tspan fill="#4169E1" font-weight="600">8</tspan> increasing paths.</text>
</svg>
