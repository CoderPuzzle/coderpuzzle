<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 204" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- grid = [[1,1],[3,4]] -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="60" y="36" width="64" height="64"/>
    <rect x="124" y="36" width="64" height="64"/>
    <rect x="60" y="100" width="64" height="64"/>
    <rect x="124" y="100" width="64" height="64"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="92" y="73">1</text><text x="156" y="73">1</text>
    <text x="92" y="137">3</text><text x="156" y="137">4</text>
  </g>
  <text x="160" y="192" text-anchor="middle" fill="#1a2026" font-size="13.5">4 + 3 + 1 = <tspan fill="#4169E1" font-weight="700">8</tspan> strictly increasing paths</text>
</svg>
