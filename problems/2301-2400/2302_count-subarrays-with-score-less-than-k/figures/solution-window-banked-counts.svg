<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 398" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="398" fill="#ffffff"/>
  <!-- nums = [2,1,4,3,5], k = 10; one row per right endpoint; accented cells = current window [left..right]; score = sum x length -->
  <text x="340" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums = [2, 1, 4, 3, 5],  k = 10</text>
  <!-- right = 0 -->
  <g font-size="12">
    <text x="76" y="75" text-anchor="end" fill="#5c6b76">right = 0</text>
    <rect x="90" y="54" width="40" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <rect x="134" y="54" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="178" y="54" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="222" y="54" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="266" y="54" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <text x="110" y="75" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
    <text x="154" y="75" text-anchor="middle" fill="#9aa7b2">1</text>
    <text x="198" y="75" text-anchor="middle" fill="#9aa7b2">4</text>
    <text x="242" y="75" text-anchor="middle" fill="#9aa7b2">3</text>
    <text x="286" y="75" text-anchor="middle" fill="#9aa7b2">5</text>
    <text x="110" y="100" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">L = R</text>
    <text x="326" y="66" fill="#5c6b76">2×1 = 2 &lt; 10</text>
    <text x="326" y="83" fill="#5c6b76">bank right−left+1 = 1 → total <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  </g>
  <!-- right = 1 -->
  <g font-size="12">
    <text x="76" y="137" text-anchor="end" fill="#5c6b76">right = 1</text>
    <rect x="90" y="116" width="40" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <rect x="134" y="116" width="40" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <rect x="178" y="116" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="222" y="116" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="266" y="116" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <text x="110" y="137" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
    <text x="154" y="137" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
    <text x="198" y="137" text-anchor="middle" fill="#9aa7b2">4</text>
    <text x="242" y="137" text-anchor="middle" fill="#9aa7b2">3</text>
    <text x="286" y="137" text-anchor="middle" fill="#9aa7b2">5</text>
    <text x="110" y="162" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">L</text>
    <text x="154" y="162" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">R</text>
    <text x="326" y="128" fill="#5c6b76">3×2 = 6 &lt; 10</text>
    <text x="326" y="145" fill="#5c6b76">bank 2 → total <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  </g>
  <!-- right = 2: pops 2 then 1 -->
  <g font-size="12">
    <text x="76" y="199" text-anchor="end" fill="#5c6b76">right = 2</text>
    <rect x="90" y="178" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="134" y="178" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="178" y="178" width="40" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <rect x="222" y="178" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="266" y="178" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <text x="110" y="199" text-anchor="middle" fill="#9aa7b2">2</text>
    <text x="154" y="199" text-anchor="middle" fill="#9aa7b2">1</text>
    <text x="198" y="199" text-anchor="middle" fill="#1a2026" font-weight="600">4</text>
    <text x="242" y="199" text-anchor="middle" fill="#9aa7b2">3</text>
    <text x="286" y="199" text-anchor="middle" fill="#9aa7b2">5</text>
    <text x="198" y="224" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">L = R</text>
    <text x="326" y="190" fill="#5c6b76">7×3 = 21 ≥ 10 → drop 2; 5×2 = 10 ≥ 10 → drop 1</text>
    <text x="326" y="207" fill="#5c6b76">4×1 = 4 &lt; 10 → bank 1 → total <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  </g>
  <!-- right = 3 -->
  <g font-size="12">
    <text x="76" y="261" text-anchor="end" fill="#5c6b76">right = 3</text>
    <rect x="90" y="240" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="134" y="240" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="178" y="240" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="222" y="240" width="40" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <rect x="266" y="240" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <text x="110" y="261" text-anchor="middle" fill="#9aa7b2">2</text>
    <text x="154" y="261" text-anchor="middle" fill="#9aa7b2">1</text>
    <text x="198" y="261" text-anchor="middle" fill="#9aa7b2">4</text>
    <text x="242" y="261" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
    <text x="286" y="261" text-anchor="middle" fill="#9aa7b2">5</text>
    <text x="242" y="286" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">L = R</text>
    <text x="326" y="252" fill="#5c6b76">7×2 = 14 ≥ 10 → drop 4; 3×1 = 3 &lt; 10</text>
    <text x="326" y="269" fill="#5c6b76">bank 1 → total <tspan fill="#4169E1" font-weight="600">5</tspan></text>
  </g>
  <!-- right = 4 -->
  <g font-size="12">
    <text x="76" y="323" text-anchor="end" fill="#5c6b76">right = 4</text>
    <rect x="90" y="302" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="134" y="302" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="178" y="302" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="222" y="302" width="40" height="32" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="266" y="302" width="40" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <text x="110" y="323" text-anchor="middle" fill="#9aa7b2">2</text>
    <text x="154" y="323" text-anchor="middle" fill="#9aa7b2">1</text>
    <text x="198" y="323" text-anchor="middle" fill="#9aa7b2">4</text>
    <text x="242" y="323" text-anchor="middle" fill="#9aa7b2">3</text>
    <text x="286" y="323" text-anchor="middle" fill="#1a2026" font-weight="600">5</text>
    <text x="286" y="348" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">L = R</text>
    <text x="326" y="314" fill="#5c6b76">8×2 = 16 ≥ 10 → drop 3; 5×1 = 5 &lt; 10</text>
    <text x="326" y="331" fill="#5c6b76">bank 1 → total <tspan fill="#4169E1" font-weight="600">6</tspan></text>
  </g>
  <text x="340" y="366" text-anchor="middle" fill="#1a2026" font-size="13">The left edge never moves back: banking right − left + 1 at each step gives</text>
  <text x="340" y="384" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">1 + 2 + 1 + 1 + 1 = 6</tspan> qualifying subarrays, all with sum × length &lt; 10.</text>
</svg>
