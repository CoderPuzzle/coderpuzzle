<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 7, edges = [[0,2],[0,5],[2,4],[1,6],[5,4]] -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="160" y1="60" x2="230" y2="60"/>
    <line x1="110" y1="81" x2="110" y2="169"/>
    <line x1="250" y1="81" x2="250" y2="169"/>
    <line x1="160" y1="190" x2="230" y2="190"/>
    <line x1="321" y1="300" x2="389" y2="300"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="135" cy="60" r="21"/>
    <circle cx="255" cy="60" r="21"/>
    <circle cx="135" cy="190" r="21"/>
