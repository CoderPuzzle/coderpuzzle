<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 224" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 3, edges = [[0,1],[0,2],[1,2]] -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="200" y1="40" x2="110" y2="160"/>
    <line x1="200" y1="40" x2="290" y2="160"/>
    <line x1="110" y1="160" x2="290" y2="160"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="200" cy="40" r="21"/>
    <circle cx="110" cy="160" r="21"/>
    <circle cx="290" cy="160" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="200" y="45">2</text>
    <text x="110" y="165">0</text>
    <text x="290" y="165">1</text>
  </g>
  <text x="200" y="212" text-anchor="middle" fill="#1a2026" font-size="13.5">every node reaches every other → <tspan fill="#4169E1" font-weight="700">0</tspan> unreachable pairs</text>
</svg>
