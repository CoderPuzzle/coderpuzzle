<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[-1,-1],[0,5],[0,-6],[0,7]]; every edge touches node 0 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="240" y1="50" x2="120" y2="160"/>
    <line x1="240" y1="50" x2="240" y2="160"/>
  </g>
  <line x1="240" y1="50" x2="360" y2="160" stroke="#4169E1" stroke-width="3.2"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="240" cy="50" r="21"/>
    <circle cx="120" cy="160" r="21"/>
    <circle cx="240" cy="160" r="21"/>
  </g>
  <circle cx="360" cy="160" r="21" fill="#e6ecfb" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="240" y="55">0</text>
    <text x="120" y="165">1</text>
    <text x="240" y="165">2</text>
    <text x="360" y="165">3</text>
  </g>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <text x="162" y="94" fill="#5c6b76">5</text>
    <text x="228" y="110" fill="#5c6b76">-6</text>
    <text x="318" y="94" fill="#4169E1">7</text>
  </g>
  <text x="240" y="230" text-anchor="middle" fill="#1a2026" font-size="13.5">all edges meet at node 0, so only one can be chosen: <tspan fill="#4169E1" font-weight="700">7</tspan></text>
</svg>
