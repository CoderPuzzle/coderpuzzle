<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 202" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="202" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- Example 1 right after change(1,20): heap[10] = [1,2,3,5] with 1 stale, heap[20] = [1]; cells 52x40 at y=58, pitch 56 -->
  <text x="320" y="20" text-anchor="middle" fill="#5c6b76" font-size="12.5">Example 1, right after change(1,20):</text>
  <text x="60" y="48" fill="#5c6b76" font-size="13">heap for 10</text>
  <rect x="60" y="58" width="52" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="86" y="84" text-anchor="middle" fill="#9aa7b2" font-size="15" font-weight="600">1</text>
  <g stroke="#9aa7b2" stroke-width="2" stroke-linecap="round">
    <line x1="99" y1="63" x2="109" y2="73"/><line x1="109" y1="63" x2="99" y2="73"/>
  </g>
  <rect x="116" y="58" width="52" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="142" y="84" text-anchor="middle" fill="#1a2026" font-size="15" font-weight="600">2</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="172" y="58" width="52" height="40"/><rect x="228" y="58" width="52" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="15" font-weight="600">
    <text x="198" y="84">3</text><text x="254" y="84">5</text>
  </g>
  <path d="M 86 106 Q 111 124 136 106" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="111" y="140" text-anchor="middle" fill="#5c6b76" font-size="12">pop stale 1</text>
  <text x="420" y="48" fill="#5c6b76" font-size="13">heap for 20</text>
  <rect x="420" y="58" width="52" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="446" y="84" text-anchor="middle" fill="#1a2026" font-size="15" font-weight="600">1</text>
  <text x="446" y="140" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">still live</text>
  <text x="320" y="170" text-anchor="middle" fill="#1a2026" font-size="13">Lazy deletion: find(10) pops the stale 1 (slot 1 now holds 20) and returns</text>
  <text x="320" y="188" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">2</tspan>, the smallest index still holding 10.</text>
</svg>
