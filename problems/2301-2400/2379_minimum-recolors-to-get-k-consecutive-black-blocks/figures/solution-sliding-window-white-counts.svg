<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="338" fill="#ffffff"/>
  <!-- blocks = "WBBWWBBWBW", k = 7; whites at 0,3,4,7,9; cells 44x38 at x = 40 + 48i, y = 36;
       window spans 332 wide at x = 40 + 48s, rows y = 116 + 44r; counts 3,3,3,4 -->
  <text x="40" y="24" fill="#5c6b76" font-size="12.5">blocks = "WBBWWBBWBW", k = 7 (whites tinted)</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="40" y="36" width="44" height="38" fill="#dbe4fb"/>
    <rect x="88" y="36" width="44" height="38" fill="#ffffff"/>
    <rect x="136" y="36" width="44" height="38" fill="#ffffff"/>
    <rect x="184" y="36" width="44" height="38" fill="#dbe4fb"/>
    <rect x="232" y="36" width="44" height="38" fill="#dbe4fb"/>
    <rect x="280" y="36" width="44" height="38" fill="#ffffff"/>
    <rect x="328" y="36" width="44" height="38" fill="#ffffff"/>
    <rect x="376" y="36" width="44" height="38" fill="#dbe4fb"/>
    <rect x="424" y="36" width="44" height="38" fill="#ffffff"/>
    <rect x="472" y="36" width="44" height="38" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="62" y="61">W</text><text x="110" y="61">B</text><text x="158" y="61">B</text>
    <text x="206" y="61">W</text><text x="254" y="61">W</text><text x="302" y="61">B</text>
    <text x="350" y="61">B</text><text x="398" y="61">W</text><text x="446" y="61">B</text>
    <text x="494" y="61">W</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="62" y="92">0</text><text x="110" y="92">1</text><text x="158" y="92">2</text>
    <text x="206" y="92">3</text><text x="254" y="92">4</text><text x="302" y="92">5</text>
    <text x="350" y="92">6</text><text x="398" y="92">7</text><text x="446" y="92">8</text>
    <text x="494" y="92">9</text>
  </g>
  <!-- four length-7 windows; the three cheapest (3 whites) accent-filled, the 4-white one muted -->
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="40" y="116" width="332" height="26"/>
    <rect x="88" y="160" width="332" height="26"/>
    <rect x="136" y="204" width="332" height="26"/>
  </g>
  <rect x="184" y="248" width="332" height="26" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.5"/>
  <g font-size="12.5" fill="#1a2026">
    <text x="54" y="134">s = 0</text>
    <text x="102" y="178">s = 1</text>
    <text x="150" y="222">s = 2</text>
    <text x="198" y="266" fill="#5c6b76">s = 3</text>
  </g>
  <text x="560" y="106" text-anchor="middle" fill="#5c6b76" font-size="12">whites</text>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="560" y="134" fill="#4169E1">3</text>
    <text x="560" y="178" fill="#4169E1">3</text>
    <text x="560" y="222" fill="#4169E1">3</text>
    <text x="560" y="266" fill="#5c6b76">4</text>
  </g>
  <!-- O(1) updates at each slide: leaving/entering whites -->
  <g text-anchor="middle" font-size="11.5" font-weight="600">
    <text x="62" y="154" fill="#5c6b76">-1</text>
    <text x="398" y="154" fill="#4169E1">+1</text>
    <text x="494" y="242" fill="#4169E1">+1</text>
  </g>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">Sliding the k = 7 window one block at a time, the white count runs <tspan fill="#4169E1" font-weight="600">3, 3, 3</tspan>, 4;</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">+1/-1 mark the entering/leaving white, and the <tspan fill="#4169E1" font-weight="600">minimum 3</tspan> is the answer.</text>
</svg>
