<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- edges = [2,-1,3,1]: 0 -> 2, 2 -> 3, 3 -> 1 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="120" y1="91" x2="120" y2="187" marker-end="url(#arrowM)"/>
    <line x1="320" y1="91" x2="320" y2="187" marker-end="url(#arrowM)"/>
    <line x1="300" y1="196" x2="141" y2="85" marker-end="url(#arrowM)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="120" cy="70" r="21"/>
    <circle cx="320" cy="70" r="21"/>
    <circle cx="120" cy="210" r="21"/>
    <circle cx="320" cy="210" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="120" y="75">3</text>
    <text x="320" y="75">0</text>
    <text x="120" y="215">1</text>
    <text x="320" y="215">2</text>
  </g>
  <text x="230" y="250" text-anchor="middle" fill="#1a2026" font-size="13.5">0 → 2 → 3 → 1 ends at a sink; no cycle → <tspan fill="#4169E1" font-weight="700">-1</tspan></text>
</svg>
