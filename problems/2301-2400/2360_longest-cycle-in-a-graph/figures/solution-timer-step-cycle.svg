<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- edges = [3,3,4,2,3]: 0→3, 1→3, 2→4, 3→2, 4→3; walk from 0 stamps step 0=0, 3=1, 2=2, 4=3, then timer 4 looks at 3 (color 1) → cycle = 4 − 1 = 3 -->
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 132 93 Q 210 100 276 150" marker-end="url(#arrow)"/>
    <path d="M 322 151 L 428 105" marker-end="url(#arrow)"/>
    <path d="M 452 118 L 452 214" marker-end="url(#arrow)"/>
    <path d="M 431 229 L 323 168" stroke-width="2.4" marker-end="url(#arrow)"/>
  </g>
  <path d="M 132 227 Q 210 220 276 170" fill="none" stroke="#9aa7b2" stroke-width="1.6" marker-end="url(#arrowg)"/>
  <text x="386" y="190" fill="#4169E1" font-size="11.5" font-weight="600">revisit</text>
  <circle cx="110" cy="84" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="110" y="90" text-anchor="middle" fill="#1a2026" font-weight="600">0</text>
  <circle cx="110" cy="236" r="22" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <text x="110" y="242" text-anchor="middle" fill="#9aa7b2" font-weight="600">1</text>
  <circle cx="300" cy="160" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="300" y="166" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <circle cx="452" cy="96" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="452" y="102" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <circle cx="452" cy="240" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="452" y="246" text-anchor="middle" fill="#1a2026" font-weight="600">4</text>
  <g font-size="12" font-weight="600" fill="#5c6b76" text-anchor="middle">
    <text x="110" y="124">t=0</text><text x="300" y="204">t=1</text>
    <text x="452" y="58">t=2</text><text x="452" y="282">t=3</text>
  </g>
  <!-- color badges: 1 = on current path, 0 = unvisited -->
  <g stroke-width="1.4">
    <circle cx="128" cy="66" r="9" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="300" cy="132" r="9" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="434" cy="78" r="9" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="470" cy="222" r="9" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="128" cy="218" r="9" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g font-size="11.5" font-weight="600" text-anchor="middle">
    <text x="128" y="70" fill="#4169E1">1</text><text x="300" y="136" fill="#4169E1">1</text>
    <text x="434" y="82" fill="#4169E1">1</text><text x="470" y="226" fill="#4169E1">1</text>
    <text x="128" y="222" fill="#9aa7b2">0</text>
  </g>
  <text x="160" y="286" text-anchor="middle" fill="#9aa7b2" font-size="11.5">start 1: 1→3 hits finished nodes — skipped</text>
  <!-- three colors -->
  <text x="506" y="66" fill="#5c6b76" font-size="12.5">colors</text>
  <circle cx="516" cy="88" r="8" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="516" y="92" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">1</text>
  <text x="532" y="92" fill="#5c6b76" font-size="12">on path</text>
  <circle cx="516" cy="110" r="8" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <text x="516" y="114" text-anchor="middle" fill="#9aa7b2" font-size="11" font-weight="600">0</text>
  <text x="532" y="114" fill="#5c6b76" font-size="12">unvisited</text>
  <circle cx="516" cy="132" r="8" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="516" y="136" text-anchor="middle" fill="#1a2026" font-size="11" font-weight="600">2</text>
  <text x="532" y="136" fill="#5c6b76" font-size="12">finished</text>
  <text x="498" y="172" fill="#1a2026" font-size="12.5">revisit 3 (color 1)</text>
  <text x="498" y="192" fill="#1a2026" font-size="12.5">cycle = 4 − 1 = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="498" y="212" fill="#5c6b76" font-size="12">(timer − step[3])</text>
  <text x="320" y="312" text-anchor="middle" fill="#1a2026" font-size="13">Revisiting 3 closes cycle 3→2→4→3 of length <tspan fill="#4169E1" font-weight="600">3</tspan>, the graph's longest.</text>
  <text x="320" y="330" text-anchor="middle" fill="#1a2026" font-size="13">Every walk node then recolors to 2, so start 1 never re-walks them.</text>
</svg>
