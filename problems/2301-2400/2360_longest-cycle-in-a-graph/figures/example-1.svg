<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 254" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- edges = [3,3,4,2,3]: 0->3, 1->3, 2->4, 3->2, 4->3 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="77" y1="69" x2="205" y2="165" marker-end="url(#arrowM)"/>
    <line x1="81" y1="180" x2="204" y2="180" marker-end="url(#arrowM)"/>
  </g>
  <g stroke="#4169E1" stroke-width="3">
    <line x1="171" y1="56" x2="279" y2="56" marker-end="url(#arrowA)"/>
    <line x1="289" y1="74" x2="238" y2="159" marker-end="url(#arrowA)"/>
    <line x1="214" y1="162" x2="163" y2="77" marker-end="url(#arrowA)"/>
  </g>
  <circle cx="60" cy="56" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="60" cy="180" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#4169E1" stroke-width="1.8" fill="#e6ecfb">
    <circle cx="150" cy="56" r="21"/>
    <circle cx="300" cy="56" r="21"/>
    <circle cx="225" cy="180" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="60" y="61">1</text>
    <text x="60" y="185">0</text>
    <text x="150" y="61">2</text>
    <text x="300" y="61">4</text>
    <text x="225" y="185">3</text>
  </g>
  <text x="210" y="240" text-anchor="middle" fill="#1a2026" font-size="13.5">the cycle 2 → 4 → 3 → 2 has length <tspan fill="#4169E1" font-weight="700">3</tspan></text>
</svg>
