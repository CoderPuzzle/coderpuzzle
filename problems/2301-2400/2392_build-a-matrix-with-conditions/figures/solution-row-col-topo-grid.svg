<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- rowConditions [[1,2],[3,2]] indeg 1:0 2:2 3:0, queue peel [1,3,2]; colConditions [[2,1],[3,2]] edges 2->1, 3->2, indeg 1:1 2:1 3:0, peel [3,2,1]; grid cells 52x44 at x 253+58c, y 300+50r -->
  <text x="140" y="38" text-anchor="middle" fill="#5c6b76" font-size="12.5">row DAG · 1→2, 3→2</text>
  <text x="530" y="38" text-anchor="middle" fill="#5c6b76" font-size="12.5">col DAG · 2→1, 3→2</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="90" cy="96" r="16"/><circle cx="90" cy="166" r="16"/><circle cx="200" cy="131" r="16"/>
    <circle cx="580" cy="96" r="16"/><circle cx="525" cy="131" r="16"/><circle cx="470" cy="166" r="16"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 104 101 L 183 125" marker-end="url(#arrow)"/>
    <path d="M 104 161 L 183 137" marker-end="url(#arrow)"/>
    <path d="M 538 123 L 565 106" marker-end="url(#arrow)"/>
    <path d="M 483 158 L 510 141" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="90" y="101">1</text><text x="90" y="171">3</text><text x="200" y="136">2</text>
    <text x="580" y="101">1</text><text x="525" y="136">2</text><text x="470" y="171">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="90" y="130">in 0</text><text x="90" y="200">in 0</text><text x="200" y="165">in 2</text>
    <text x="580" y="130">in 1</text><text x="525" y="165">in 1</text><text x="470" y="200">in 0</text>
  </g>
  <!-- queue peel strips -->
  <text x="137" y="208" text-anchor="middle" fill="#5c6b76" font-size="11.5">row order</text>
  <text x="557" y="208" text-anchor="middle" fill="#5c6b76" font-size="11.5">col order</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="76" y="216" width="44" height="30"/><rect x="126" y="216" width="44" height="30"/><rect x="176" y="216" width="44" height="30"/>
    <rect x="486" y="216" width="44" height="30"/><rect x="536" y="216" width="44" height="30"/><rect x="586" y="216" width="44" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="98" y="236">1</text><text x="148" y="236">3</text><text x="198" y="236">2</text>
    <text x="508" y="236">3</text><text x="558" y="236">2</text><text x="608" y="236">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="98" y="264">pos 0</text><text x="148" y="264">pos 1</text><text x="198" y="264">pos 2</text>
    <text x="508" y="264">pos 0</text><text x="558" y="264">pos 1</text><text x="608" y="264">pos 2</text>
  </g>
  <text x="340" y="282" text-anchor="middle" fill="#5c6b76" font-size="12">(row_pos, col_pos):  1 → (0,2)  ·  2 → (2,1)  ·  3 → (1,0)</text>
  <!-- assembled 3x3 grid -->
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="279" y="294">col 0</text><text x="337" y="294">col 1</text><text x="395" y="294">col 2</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="253" y="300" width="52" height="44"/><rect x="311" y="300" width="52" height="44"/><rect x="369" y="300" width="52" height="44"/>
    <rect x="253" y="350" width="52" height="44"/><rect x="311" y="350" width="52" height="44"/><rect x="369" y="350" width="52" height="44"/>
    <rect x="253" y="400" width="52" height="44"/><rect x="311" y="400" width="52" height="44"/><rect x="369" y="400" width="52" height="44"/>
  </g>
  <g fill="#dbe4fb">
    <rect x="369" y="300" width="52" height="44"/><rect x="253" y="350" width="52" height="44"/><rect x="311" y="400" width="52" height="44"/>
  </g>
  <g fill="none" stroke="#42525e" stroke-width="1.4">
    <rect x="369" y="300" width="52" height="44"/><rect x="253" y="350" width="52" height="44"/><rect x="311" y="400" width="52" height="44"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="243" y="327" text-anchor="end">row 0</text><text x="243" y="377" text-anchor="end">row 1</text><text x="243" y="427" text-anchor="end">row 2</text>
  </g>
  <g text-anchor="middle">
    <text x="279" y="329" font-size="12.5" fill="#9aa7b2">0</text>
    <text x="337" y="329" font-size="12.5" fill="#9aa7b2">0</text>
    <text x="395" y="329" font-size="16" font-weight="600" fill="#4169E1">1</text>
    <text x="279" y="379" font-size="16" font-weight="600" fill="#4169E1">3</text>
    <text x="337" y="379" font-size="12.5" fill="#9aa7b2">0</text>
    <text x="395" y="379" font-size="12.5" fill="#9aa7b2">0</text>
    <text x="279" y="429" font-size="12.5" fill="#9aa7b2">0</text>
    <text x="337" y="429" font-size="16" font-weight="600" fill="#4169E1">2</text>
    <text x="395" y="429" font-size="12.5" fill="#9aa7b2">0</text>
  </g>
  <text x="340" y="472" text-anchor="middle" fill="#1a2026" font-size="13">Row queue peels <tspan fill="#4169E1" font-weight="600">1, 3, 2</tspan> and col queue <tspan fill="#4169E1" font-weight="600">3, 2, 1</tspan>; value v lands at (row_pos[v], col_pos[v]):</text>
  <text x="340" y="490" text-anchor="middle" fill="#1a2026" font-size="13">[[0,0,1],[3,0,0],[0,2,0]] — valid (any topo order works), not the sample's own matrix.</text>
</svg>
