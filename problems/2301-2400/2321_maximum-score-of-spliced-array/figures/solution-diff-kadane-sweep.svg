<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="318" fill="#ffffff"/>
  <!-- nums1=[60,60,60], nums2=[10,90,10]; d=[-50,30,-50]; clamped Kadane: cur 0,30,0 best 0,30,30 -> range [1,1] gain 30; 180+30=210 beats 110+70=180 -->
  <text x="400" y="38" text-anchor="middle" fill="#5c6b76" font-size="12.5">d[i] = nums2[i] - nums1[i]; the best range of d is what a swap adds to sum(nums1)</text>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="128" y="85">nums1</text><text x="128" y="129">nums2</text><text x="128" y="173">d</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="140" y="62" width="104" height="36"/><rect x="256" y="62" width="104" height="36"/><rect x="372" y="62" width="104" height="36"/>
    <rect x="140" y="106" width="104" height="36"/><rect x="256" y="106" width="104" height="36"/><rect x="372" y="106" width="104" height="36"/>
    <rect x="140" y="150" width="104" height="36"/><rect x="372" y="150" width="104" height="36"/>
  </g>
  <rect x="256" y="150" width="104" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="14.5" fill="#1a2026">
    <text x="192" y="85">60</text><text x="308" y="85">60</text><text x="424" y="85">60</text>
    <text x="192" y="129">10</text><text x="308" y="129">90</text><text x="424" y="129">10</text>
    <text x="192" y="173">-50</text><text x="424" y="173">-50</text>
  </g>
  <text x="308" y="174" text-anchor="middle" font-weight="600" font-size="15" fill="#4169E1">30</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="192" y="204">i = 0</text><text x="308" y="204">i = 1</text><text x="424" y="204">i = 2</text>
  </g>
  <text x="128" y="238" text-anchor="end" fill="#5c6b76" font-size="12.5">Kadane</text>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="192" y="238">cur 0 · best 0</text>
    <text x="308" y="238" fill="#4169E1" font-weight="600">cur 30 · best 30</text>
    <text x="424" y="238">cur 0 · best <tspan fill="#4169E1" font-weight="600">30</tspan></text>
  </g>
  <text x="340" y="276" text-anchor="middle" fill="#1a2026" font-size="13">Kadane picks the best range [1, 1] gaining 30 — the nums1 side gives 180 + 30 = <tspan fill="#4169E1" font-weight="600">210</tspan>.</text>
  <text x="340" y="298" text-anchor="middle" fill="#1a2026" font-size="13">Toward nums2 the best gain is 70: 110 + 70 = 180; the answer is max(210, 180) = <tspan fill="#4169E1" font-weight="600">210</tspan>.</text>
</svg>
