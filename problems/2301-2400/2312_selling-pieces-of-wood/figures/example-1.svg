<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- m = 3, n = 5, prices = [[1,4,2],[2,2,7],[2,1,3]]; one optimal set of cuts -->
  <g stroke="#d5dbe1" stroke-width="1">
    <line x1="96" y1="36" x2="96" y2="204"/><line x1="152" y1="36" x2="152" y2="204"/>
    <line x1="208" y1="36" x2="208" y2="204"/><line x1="264" y1="36" x2="264" y2="204"/>
    <line x1="40" y1="92" x2="320" y2="92"/><line x1="40" y1="148" x2="320" y2="148"/>
  </g>
  <rect x="40" y="36" width="280" height="168" fill="none" stroke="#42525e" stroke-width="2"/>
  <g fill="#e6ecfb" stroke="#4169E1" stroke-width="1.8">
    <rect x="40" y="36" width="112" height="112"/>
    <rect x="152" y="36" width="112" height="112"/>
  </g>
  <g fill="#f6ecd9" stroke="#b57f30" stroke-width="1.8">
    <rect x="264" y="36" width="56" height="112"/>
    <rect x="40" y="148" width="224" height="56"/>
  </g>
  <rect x="264" y="148" width="56" height="56" fill="#e8ecef" stroke="#b9c2ca" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="700">
    <text x="96" y="99" fill="#4169E1">2×2 · 7</text>
    <text x="208" y="99" fill="#4169E1">2×2 · 7</text>
    <text x="292" y="90" fill="#7a5a1e" font-size="13">2×1</text>
    <text x="292" y="110" fill="#7a5a1e" font-size="13">· 3</text>
    <text x="152" y="182" fill="#7a5a1e">1×4 · 2</text>
  </g>
  <text x="292" y="181" text-anchor="middle" fill="#8b96a0" font-size="11">1×1</text>
  <text x="180" y="232" text-anchor="middle" fill="#1a2026" font-size="13.5">2 × 7 + 3 + 2 = <tspan fill="#4169E1" font-weight="700">19</tspan><tspan fill="#5c6b76"> · the leftover 1×1 earns nothing</tspan></text>
</svg>
