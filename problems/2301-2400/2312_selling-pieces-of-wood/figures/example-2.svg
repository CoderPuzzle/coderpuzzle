  <text x="290" y="216" text-anchor="middle" fill="#8b96a0" font-size="11">1×2</text>
  <text x="190" y="252" text-anchor="middle" fill="#1a2026" font-size="13.5">3 × 10 + 2 = <tspan fill="#4169E1" font-weight="700">32</tspan><tspan fill="#5c6b76"> · the 1×4 cannot be rotated into a 4×1</tspan></text>
