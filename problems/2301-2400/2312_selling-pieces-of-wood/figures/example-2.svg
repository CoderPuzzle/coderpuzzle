<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 264" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- m = 4, n = 6, prices = [[3,2,10],[1,4,2],[4,1,3]]; one optimal set of cuts -->
  <g stroke="#d5dbe1" stroke-width="1">
    <line x1="90" y1="36" x2="90" y2="236"/><line x1="140" y1="36" x2="140" y2="236"/>
    <line x1="190" y1="36" x2="190" y2="236"/><line x1="240" y1="36" x2="240" y2="236"/>
    <line x1="290" y1="36" x2="290" y2="236"/>
    <line x1="40" y1="86" x2="340" y2="86"/><line x1="40" y1="136" x2="340" y2="136"/>
    <line x1="40" y1="186" x2="340" y2="186"/>
  </g>
  <rect x="40" y="36" width="300" height="200" fill="none" stroke="#42525e" stroke-width="2"/>
