<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="304" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n=6, delay=2, forget=4; know = [1,0,1,1,1,2]; bars 56 wide, pitch 84 from x=76, baseline y=196;
       A born day 1 shares days 3-4, forgets day 5; B born day 3 shares days 5-6 -->
  <text x="64" y="112" font-size="12" fill="#5c6b76">know[d]</text>
  <line x1="60" y1="196" x2="560" y2="196" stroke="#42525e" stroke-width="1.5"/>
  <!-- bars -->
  <g fill="#4169E1">
    <rect x="76" y="162" width="56" height="34"/>
    <rect x="244" y="162" width="56" height="34"/>
    <rect x="328" y="162" width="56" height="34"/>
    <rect x="412" y="162" width="56" height="34"/>
    <rect x="496" y="128" width="56" height="68"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="104" y="154">1</text>
    <text x="272" y="154">1</text>
    <text x="356" y="154">1</text>
    <text x="440" y="154">1</text>
    <text x="524" y="120">2</text>
  </g>
  <text x="188" y="188" text-anchor="middle" font-size="13.5" fill="#9aa7b2">0</text>
  <g text-anchor="middle" font-size="12.5" fill="#5c6b76">
    <text x="104" y="216">day 1</text><text x="188" y="216">day 2</text><text x="272" y="216">day 3</text>
    <text x="356" y="216">day 4</text><text x="440" y="216">day 5</text><text x="524" y="216">day 6</text>
  </g>
  <!-- A's active window [3,4], B's active window [5,6] -->
  <g stroke="#4169E1" stroke-width="1.5" fill="none">
    <path d="M 244 94 L 244 88 L 384 88 L 384 94"/>
    <path d="M 412 94 L 412 88 L 552 88 L 552 94"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#4169E1" font-weight="600">
    <text x="314" y="80">A shares days 3-4</text>
    <text x="482" y="80">B shares days 5-6</text>
  </g>
  <!-- A forgets on day 1 + 4 = 5 -->
  <g stroke="#9aa7b2" stroke-width="2">
    <line x1="436" y1="230" x2="444" y2="238"/>
    <line x1="444" y1="230" x2="436" y2="238"/>
  </g>
  <text x="452" y="238" font-size="12" fill="#9aa7b2">A forgets (day 1 + 4 = 5)</text>
  <text x="40" y="268" font-size="13" fill="#1a2026">New learners are a sliding-window sum: know[6] = know[3] + know[4] = 1 + 1 = <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
  <text x="40" y="288" font-size="13" fill="#1a2026">Aware at day 6 = know[3..6] = 1 + 1 + 1 + 2 = <tspan fill="#4169E1" font-weight="600">5</tspan>; A, born on day 1, forgot on day 5.</text>
</svg>
