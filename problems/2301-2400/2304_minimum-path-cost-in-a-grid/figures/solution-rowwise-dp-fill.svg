<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[5,3],[4,0],[2,1]]; moveCost[5] = [14,3], moveCost[0] = [9,8], moveCost[4] = [2,4]; dp rows 5/3, 23/8, 19/17; cells 56x36 at x=80 and x=280 -->
  <text x="138" y="52" text-anchor="middle" fill="#5c6b76" font-size="11.5">grid (cell values)</text>
  <text x="338" y="52" text-anchor="middle" fill="#5c6b76" font-size="11.5">least cost to reach each column</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="80" y="64" width="56" height="36"/><rect x="140" y="64" width="56" height="36"/>
    <rect x="80" y="120" width="56" height="36"/><rect x="140" y="120" width="56" height="36"/>
    <rect x="80" y="176" width="56" height="36"/><rect x="140" y="176" width="56" height="36"/>
  </g>
  <g fill="#1a2026" font-weight="600" font-size="11.5">
    <text x="87" y="78">5</text><text x="147" y="78">3</text>
    <text x="87" y="134">4</text><text x="147" y="134">0</text>
    <text x="87" y="190">2</text><text x="147" y="190">1</text>
  </g>
  <!-- accent path 5 -> 0 -> 1 -->
  <polyline points="112,86 168,138 168,190" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <g fill="#4169E1">
    <circle cx="112" cy="86" r="3.5"/><circle cx="168" cy="138" r="3.5"/><circle cx="168" cy="190" r="3.5"/>
  </g>
  <path d="M 138 110 H 200" stroke="#9aa7b2" stroke-width="0.8"/>
  <text x="204" y="114" fill="#4169E1" font-size="11.5" font-weight="600">+3</text>
  <path d="M 168 166 H 200" stroke="#9aa7b2" stroke-width="0.8"/>
  <text x="204" y="170" fill="#4169E1" font-size="11.5" font-weight="600">+8</text>
  <!-- grid rows feed the dp rows below them -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 214 82 H 262" marker-end="url(#arrow)"/>
    <path d="M 214 138 H 262" marker-end="url(#arrow)"/>
    <path d="M 214 194 H 262" marker-end="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="280" y="64" width="56" height="36"/><rect x="340" y="64" width="56" height="36"/>
    <rect x="280" y="120" width="56" height="36"/><rect x="340" y="120" width="56" height="36"/>
    <rect x="280" y="176" width="56" height="36"/><rect x="340" y="176" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="308" y="87" fill="#4169E1" font-size="15" font-weight="700">5</text><text x="368" y="87" fill="#1a2026" font-size="14">3</text>
    <text x="308" y="143" fill="#1a2026" font-size="14">23</text><text x="368" y="143" fill="#4169E1" font-size="15" font-weight="700">8</text>
    <text x="308" y="199" fill="#1a2026" font-size="14">19</text><text x="368" y="199" fill="#4169E1" font-size="15" font-weight="700">17</text>
  </g>
  <g fill="#9aa7b2" font-size="11">
    <text x="410" y="86">after row 0</text>
    <text x="410" y="142">after row 1</text>
    <text x="410" y="198">after row 2</text>
  </g>
  <text x="80" y="244" fill="#1a2026" font-size="12"><tspan fill="#5c6b76">Row 1:</tspan> <tspan font-weight="600">23</tspan> = 5 + moveCost[5][0] + 4;  <tspan font-weight="600">8</tspan> = 5 + moveCost[5][1] + 0</text>
  <text x="80" y="264" fill="#1a2026" font-size="12"><tspan fill="#5c6b76">Row 2:</tspan> <tspan font-weight="600">19</tspan> = 8 + moveCost[0][0] + 2;  <tspan fill="#4169E1" font-weight="600">17</tspan> = 8 + moveCost[0][1] + 1</text>
  <text x="340" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Filling row by row the array reads 5/3, then 23/8, then 19/17 — the last row bottoms out at <tspan fill="#4169E1" font-weight="600">17</tspan>:</text>
  <text x="340" y="316" text-anchor="middle" fill="#1a2026" font-size="13">the accent path 5 → 0 → 1 pays moves 3 and 8: 5 + 0 + 1 + 3 + 8 = <tspan fill="#4169E1" font-weight="600">17</tspan>.</text>
</svg>
