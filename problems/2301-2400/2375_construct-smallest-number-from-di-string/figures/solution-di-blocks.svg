<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="320" fill="#ffffff"/>
  <!-- pattern = IIIDIDDD -> output 1 2 3 5 4 9 8 7 6; slots x = 60 + 60i, w 52 -->
  <!-- pattern letters between slots -->
  <g text-anchor="middle" fill="#5c6b76" font-weight="600" font-size="14">
    <text x="116" y="52">I</text><text x="176" y="52">I</text><text x="236" y="52">I</text>
    <text x="296" y="52">D</text><text x="356" y="52">I</text><text x="416" y="52">D</text>
    <text x="476" y="52">D</text><text x="536" y="52">D</text>
  </g>
  <!-- blocks: 1 | 2 | 3 | 5 4 | 9 8 7 6 -->
  <g fill="#dbe4f6">
    <rect x="60" y="62" width="52" height="44"/>
    <rect x="120" y="62" width="52" height="44"/>
    <rect x="180" y="62" width="52" height="44"/>
    <rect x="240" y="62" width="112" height="44"/>
    <rect x="360" y="62" width="232" height="44"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <rect x="60" y="62" width="52" height="44"/><rect x="120" y="62" width="52" height="44"/>
    <rect x="180" y="62" width="52" height="44"/><rect x="240" y="62" width="52" height="44"/>
    <rect x="292" y="62" width="60" height="44"/><rect x="360" y="62" width="58" height="44"/>
    <rect x="418" y="62" width="58" height="44"/><rect x="476" y="62" width="58" height="44"/>
    <rect x="534" y="62" width="58" height="44"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <rect x="240" y="62" width="112" height="44"/>
    <rect x="360" y="62" width="232" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="16">
    <text x="86" y="90">1</text><text x="146" y="90">2</text><text x="206" y="90">3</text>
    <text x="266" y="90">5</text><text x="322" y="90">4</text><text x="389" y="90">9</text>
    <text x="447" y="90">8</text><text x="505" y="90">7</text><text x="563" y="90">6</text>
  </g>
  <!-- stack snapshots -->
  <text x="60" y="160" fill="#5c6b76" font-size="12.5">At the I after the first D, the stack holds 4 then 5:</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="172" width="44" height="30" fill="#dbe4f6" stroke="#42525e"/><text x="82" y="192">4</text>
    <rect x="60" y="202" width="44" height="30" fill="#9db4ea" stroke="#42525e"/><text x="82" y="222">5</text>
  </g>
  <text x="120" y="196" fill="#1a2026" font-size="12.5">flush pops 5 first, then 4 → the block reads "5 4"</text>
  <text x="60" y="262" fill="#5c6b76" font-size="12.5">The final D-run piles 6, 7, 8, 9 and flushes at the end:</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="274" width="44" height="30" fill="#dbe4f6" stroke="#42525e"/><text x="82" y="294">6</text>
    <rect x="104" y="274" width="44" height="30" fill="#dbe4f6" stroke="#42525e"/><text x="126" y="294">7</text>
    <rect x="148" y="274" width="44" height="30" fill="#dbe4f6" stroke="#42525e"/><text x="170" y="294">8</text>
    <rect x="192" y="274" width="44" height="30" fill="#9db4ea" stroke="#42525e"/><text x="214" y="294">9</text>
  </g>
  <text x="252" y="298" fill="#1a2026" font-size="12.5">→ emits 9, 8, 7, 6, completing 1 2 3 5 4 9 8 7 6</text>
</svg>
