<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="240" fill="#ffffff"/>
  <!-- rolls [4,2,1,2,3,3,2,4,1], k = 4; cells 52x44 at y=60, pitch 58 from x=62; window 1 = cells 0-4 ends at the second 3, window 2 = cells 5-8 ends at the last 1; the repeated 2 in window 1 is muted -->
  <text x="62" y="48" fill="#5c6b76" font-size="12.5">rolls (k = 4):</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="62" y="60" width="52" height="44"/><rect x="120" y="60" width="52" height="44"/>
    <rect x="178" y="60" width="52" height="44"/>
    <rect x="294" y="60" width="52" height="44"/><rect x="352" y="60" width="52" height="44"/>
    <rect x="410" y="60" width="52" height="44"/><rect x="468" y="60" width="52" height="44"/>
  </g>
  <rect x="236" y="60" width="52" height="44" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <rect x="294" y="60" width="52" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="526" y="60" width="52" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#1a2026" font-size="15" font-weight="600">
    <text x="88" y="88">4</text><text x="146" y="88">2</text><text x="204" y="88">1</text>
    <text x="320" y="88">3</text><text x="378" y="88">3</text><text x="436" y="88">2</text>
    <text x="494" y="88">4</text><text x="552" y="88">1</text>
  </g>
  <text x="262" y="88" text-anchor="middle" fill="#9aa7b2" font-size="15" font-weight="600">2</text>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 62 112 L 62 124 L 346 124 L 346 112"/>
    <path d="M 352 112 L 352 124 L 578 124 L 578 112"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="204" y="146">window 1: {4,2,1,3} complete</text>
    <text x="465" y="146">window 2: {3,2,4,1} complete</text>
  </g>
  <text x="320" y="196" text-anchor="middle" fill="#1a2026" font-size="13">Each window holds all 4 faces — every length-2 sequence is covered.</text>
  <text x="320" y="214" text-anchor="middle" fill="#1a2026" font-size="13">The answer is windows + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan>: a third element would need a face past them.</text>
</svg>
