<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- regular=[1,6,9,5], express=[5,2,3,10], expressCost=8; cells 96 wide at x=110+106i; reg row y66 h42, exp row y142 h42, min row y206 h44 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="158" y="52">stop 0</text><text x="264" y="52">stop 1</text><text x="370" y="52">stop 2</text>
    <text x="476" y="52">stop 3</text><text x="582" y="52">stop 4</text>
  </g>
  <!-- reg row: winners (cheapest at the stop) at stops 1, 2, 4 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="110" y="66" width="96" height="42"/>
    <rect x="216" y="66" width="96" height="42" fill="#dbe4fb"/>
    <rect x="322" y="66" width="96" height="42" fill="#dbe4fb"/>
    <rect x="428" y="66" width="96" height="42"/>
    <rect x="534" y="66" width="96" height="42" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="158" y="92">0</text>
    <text x="264" y="92" fill="#4169E1">1</text>
    <text x="370" y="92" fill="#4169E1">7</text>
    <text x="476" y="92">16</text>
    <text x="582" y="92" fill="#4169E1">19</text>
  </g>
  <!-- paid transfer arc: reg[0] = 0 boards express for +8, then express[1] = 5 -->
  <path d="M 158 108 Q 190 122 220 140" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="134" fill="#4169E1" font-size="12" font-weight="600">board express: +8</text>
  <!-- exp row -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="110" y="142" width="96" height="42"/>
    <rect x="216" y="142" width="96" height="42" stroke="#4169E1" stroke-width="2"/>
    <rect x="322" y="142" width="96" height="42"/>
    <rect x="428" y="142" width="96" height="42" fill="#dbe4fb"/>
    <rect x="534" y="142" width="96" height="42"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="158" y="169" fill="#9aa7b2">—</text>
    <text x="264" y="163">13</text>
    <text x="370" y="169">11</text>
    <text x="476" y="169" fill="#4169E1">14</text>
    <text x="582" y="169">24</text>
  </g>
  <text x="264" y="179" text-anchor="middle" fill="#4169E1" font-size="10.5">0 + 8 + 5</text>
  <text x="98" y="92" text-anchor="end" fill="#5c6b76" font-size="12.5">reg</text>
  <text x="98" y="169" text-anchor="end" fill="#5c6b76" font-size="12.5">exp</text>
  <text x="370" y="200" text-anchor="middle" fill="#5c6b76" font-size="11.5">costs[i] = min(reg[i], exp[i])</text>
  <text x="98" y="233" text-anchor="end" fill="#5c6b76" font-size="12.5">min</text>
  <!-- min row = the answer -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="110" y="206" width="96" height="44"/><rect x="216" y="206" width="96" height="44"/>
    <rect x="322" y="206" width="96" height="44"/><rect x="428" y="206" width="96" height="44"/>
    <rect x="534" y="206" width="96" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="700" font-size="15" fill="#1a2026">
    <text x="158" y="233" fill="#9aa7b2" font-weight="400">start</text>
    <text x="264" y="233">1</text><text x="370" y="233">7</text>
    <text x="476" y="233">14</text><text x="582" y="233">19</text>
  </g>
  <text x="320" y="276" text-anchor="middle" fill="#1a2026" font-size="13">reg[i] = min(reg, exp) + regular[i]; exp[i] = min(reg + 8, exp) + express[i]</text>
  <text x="320" y="294" text-anchor="middle" fill="#1a2026" font-size="13">The one paid transfer boards exp[1] = 0 + 8 + 5 = <tspan fill="#4169E1" font-weight="600">13</tspan>; the minima give [1, 7, 14, 19].</text>
</svg>
