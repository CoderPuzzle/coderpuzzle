<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="376" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums=[1,5,5,4,11], edges [[0,1],[1,2],[1,3],[3,4]] rooted at 0; sub: 4->11, 3->4^11=15, 2->5, 1->5^5^15=15, total sub[0]=1^15=14; cutting (0,1),(1,2) -> {0}:1, {2}:5, {1,3,4}:5^4^11=10, score 10-1=9 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="120" y1="66" x2="330" y2="66"/>
    <line x1="330" y1="66" x2="210" y2="176"/>
    <line x1="330" y1="66" x2="500" y2="176"/>
    <line x1="500" y1="176" x2="500" y2="272"/>
  </g>
  <!-- fold-up subtree XOR arrows -->
  <g fill="none" stroke="#4169E1" stroke-width="1.8">
    <path d="M 512 258 L 512 192" marker-end="url(#arrow)"/>
    <path d="M 486 155 Q 420 96 351 69" marker-end="url(#arrow)"/>
    <path d="M 215 155 Q 252 103 309 73" marker-end="url(#arrow)"/>
    <path d="M 310 55 L 142 58" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-weight="600" font-size="12">
    <text x="522" y="228">sub[4] = 11</text>
    <text x="436" y="90">sub[3] = 15</text>
    <text x="272" y="170" text-anchor="middle">sub[2] = 5</text>
    <text x="225" y="44" text-anchor="middle">sub[1] = 15</text>
    <text x="120" y="104" text-anchor="middle">sub[0] = 14</text>
  </g>
  <!-- nodes: {1,3,4} one component, {0} and {2} the other two -->
  <g stroke="#42525e" stroke-width="1.6">
    <circle cx="330" cy="66" r="17" fill="#dbe4fb"/><circle cx="500" cy="176" r="17" fill="#dbe4fb"/><circle cx="500" cy="272" r="17" fill="#dbe4fb"/>
    <circle cx="120" cy="66" r="17" fill="#ffffff"/><circle cx="210" cy="176" r="17" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="120" y="71">0</text><text x="330" y="71">1</text><text x="210" y="181">2</text>
    <text x="500" y="181">3</text><text x="500" y="277">4</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="98" y="60" text-anchor="end">v = 1</text>
    <text x="330" y="40" text-anchor="middle">v = 5</text>
    <text x="210" y="212" text-anchor="middle">v = 5</text>
    <text x="524" y="170">v = 4</text>
    <text x="524" y="278">v = 11</text>
  </g>
  <!-- cut markers on edges (0,1) and (1,2) -->
  <g>
    <circle cx="225" cy="66" r="7.5" fill="#ffffff"/>
    <circle cx="270" cy="121" r="7.5" fill="#ffffff"/>
  </g>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="220.5" y1="61.5" x2="229.5" y2="70.5"/><line x1="220.5" y1="70.5" x2="229.5" y2="61.5"/>
    <line x1="265.5" y1="116.5" x2="274.5" y2="125.5"/><line x1="265.5" y1="125.5" x2="274.5" y2="116.5"/>
  </g>
  <!-- component badges -->
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="120" y1="38" x2="120" y2="46"/>
    <line x1="132" y1="176" x2="190" y2="176"/>
    <line x1="564" y1="124" x2="519" y2="162"/>
  </g>
  <g>
    <rect x="76" y="14" width="88" height="24" rx="6" fill="#dbe4fb"/>
    <rect x="44" y="164" width="88" height="24" rx="6" fill="#dbe4fb"/>
    <rect x="560" y="100" width="112" height="24" rx="6" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#1a2026" font-weight="600">
    <text x="120" y="30">{0}: 1</text>
    <text x="88" y="180">{2}: 5</text>
    <text x="616" y="116">{1,3,4}: 10</text>
  </g>
  <text x="340" y="336" text-anchor="middle" fill="#1a2026" font-size="13">Subtree XORs fold up: sub[4] = 11, sub[3] = 15, sub[2] = 5, sub[1] = 15, total 14.</text>
  <text x="340" y="358" text-anchor="middle" fill="#1a2026" font-size="13">Cutting (0,1) and (1,2) splits off XORs 1, 5, 10 — score 10 - 1 = <tspan fill="#4169E1" font-weight="600">9</tspan>.</text>
</svg>
