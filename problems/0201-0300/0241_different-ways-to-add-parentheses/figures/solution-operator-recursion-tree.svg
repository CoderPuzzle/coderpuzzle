<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="324" fill="#ffffff"/>
  <!-- expression = "2-1-1"; each '-' takes a turn as the root split; boxes show subexpression and its value list -->
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="305" y1="64" x2="85" y2="110"/>
    <line x1="315" y1="64" x2="225" y2="110"/>
    <line x1="325" y1="64" x2="415" y2="110"/>
    <line x1="335" y1="64" x2="555" y2="110"/>
    <line x1="212" y1="156" x2="165" y2="210"/>
    <line x1="238" y1="156" x2="285" y2="210"/>
    <line x1="402" y1="156" x2="375" y2="210"/>
    <line x1="428" y1="156" x2="495" y2="210"/>
  </g>
  <!-- split labels -->
  <text x="140" y="78" text-anchor="middle" fill="#5c6b76" font-size="12">first '-' as root</text>
  <text x="525" y="78" text-anchor="middle" fill="#5c6b76" font-size="12">second '-' as root</text>
  <!-- root -->
  <rect x="282" y="18" width="76" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="320" y="36" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">2-1-1</text>
  <text x="320" y="55" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">→ [0, 2]</text>
  <!-- row 1 -->
  <rect x="47" y="110" width="76" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="85" y="128" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">2</text>
  <text x="85" y="147" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">→ [2]</text>
  <rect x="187" y="110" width="76" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="225" y="128" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">1-1</text>
  <text x="225" y="147" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">→ [0]</text>
  <text x="268" y="152" fill="#5c6b76" font-size="12">1-1 = 0</text>
  <rect x="377" y="110" width="76" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="415" y="128" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">2-1</text>
  <text x="415" y="147" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">→ [1]</text>
  <text x="458" y="152" fill="#5c6b76" font-size="12">2-1 = 1</text>
  <rect x="517" y="110" width="76" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="555" y="128" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">1</text>
  <text x="555" y="147" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">→ [1]</text>
  <!-- row 2 -->
  <rect x="127" y="210" width="76" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="165" y="228" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">1</text>
  <text x="165" y="247" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">→ [1]</text>
  <rect x="247" y="210" width="76" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="285" y="228" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">1</text>
  <text x="285" y="247" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">→ [1]</text>
  <rect x="337" y="210" width="76" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="375" y="228" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">2</text>
  <text x="375" y="247" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">→ [2]</text>
  <rect x="457" y="210" width="76" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="495" y="228" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">1</text>
  <text x="495" y="247" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">→ [1]</text>
  <text x="340" y="292" text-anchor="middle" fill="#1a2026" font-size="13">Each '-' takes its turn as the root split: 2 - (1 - 1) = 2 and (2 - 1) - 1 = 0;</text>
  <text x="340" y="312" text-anchor="middle" fill="#1a2026" font-size="13">collecting the two root groupings and sorting gives <tspan fill="#4169E1" font-weight="600">[0, 2]</tspan>.</text>
</svg>
