<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="292" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- insert("apple"): root -> a -> p -> p -> l -> e, end flag only on e;
       query "app" walks the accented first three edges and stops at the flagless second p node;
       node circles r 22 at y 104 (root r 14) -->
  <text x="60" y="40" fill="#5c6b76" font-size="12.5">after insert("apple")</text>
  <g fill="none" stroke="#4169E1" stroke-width="2.5">
    <path d="M 76 104 H 132" marker-end="url(#arrowB)"/>
    <path d="M 184 104 H 236" marker-end="url(#arrowB)"/>
    <path d="M 288 104 H 340" marker-end="url(#arrowB)"/>
  </g>
  <g fill="none" stroke="#42525e" stroke-width="1.5">
    <path d="M 392 104 H 444" marker-end="url(#arrow)"/>
    <path d="M 496 104 H 560" marker-end="url(#arrow)"/>
  </g>
  <circle cx="60" cy="104" r="14" fill="#f0f3f7" stroke="#42525e" stroke-width="1.5"/>
  <text x="60" y="140" text-anchor="middle" fill="#5c6b76" font-size="11.5">root</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.5">
    <circle cx="160" cy="104" r="22"/><circle cx="264" cy="104" r="22"/><circle cx="368" cy="104" r="22"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="472" cy="104" r="22"/><circle cx="588" cy="104" r="22"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600" font-size="16">
    <text x="160" y="110">a</text><text x="264" y="110">p</text><text x="368" y="110">p</text>
    <text x="472" y="110">l</text><text x="588" y="110">e</text>
  </g>
  <circle cx="543" cy="146" r="8" fill="#4169E1"/>
  <path d="M 539 146 L 542 149 L 547 143" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="556" y="150" fill="#4169E1" font-size="12" font-weight="600">end = true</text>
  <path d="M 368 130 V 154" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="368" y="176" text-anchor="middle" fill="#1a2026" font-size="12.5">search("app"): the walk stops here — node exists, end is false → <tspan fill="#4169E1" font-weight="600">false</tspan></text>
  <text x="368" y="198" text-anchor="middle" fill="#1a2026" font-size="12.5">startsWith("app"): the same walk succeeds — a live node is all a prefix needs → <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="340" y="242" text-anchor="middle" fill="#1a2026" font-size="13">insert("apple") sets end only on the final e; the query "app" stops three nodes deep:</text>
  <text x="340" y="264" text-anchor="middle" fill="#1a2026" font-size="13">no flag → search returns false, but the live walk lets startsWith return true.</text>
</svg>
