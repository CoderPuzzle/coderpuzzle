<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [4,2,5,1,3], target = 3.714286; nodes r 19; walk path 4-2-3 accented; log rows y 78/134/190 -->
  <text x="110" y="24" text-anchor="middle" fill="#5c6b76" font-size="12.5">target = 3.714286</text>
  <line x1="120" y1="64" x2="168" y2="132" stroke="#9aa7b2" stroke-width="1.4"/>
  <line x1="72" y1="132" x2="48" y2="200" stroke="#9aa7b2" stroke-width="1.4"/>
  <line x1="120" y1="64" x2="72" y2="132" stroke="#4169E1" stroke-width="2.4"/>
  <line x1="72" y1="132" x2="96" y2="200" stroke="#4169E1" stroke-width="2.4"/>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4">
    <circle cx="168" cy="132" r="19"/><circle cx="48" cy="200" r="19"/>
  </g>
  <g fill="#ffffff" stroke="#4169E1" stroke-width="2.2">
    <circle cx="120" cy="64" r="19"/><circle cx="72" cy="132" r="19"/><circle cx="96" cy="200" r="19"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14.5">
    <text x="120" y="69" fill="#1a2026">4</text><text x="72" y="137" fill="#1a2026">2</text>
    <text x="96" y="205" fill="#1a2026">3</text>
    <text x="168" y="137" fill="#9aa7b2">5</text><text x="48" y="205" fill="#9aa7b2">1</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="262" y="46" text-anchor="middle">visit</text>
    <text x="300" y="46">walk</text>
    <text x="480" y="46">best (distance, value)</text>
  </g>
  <line x1="250" y1="94" x2="620" y2="94" stroke="#dbe4fb" stroke-width="1"/>
  <line x1="250" y1="150" x2="620" y2="150" stroke="#dbe4fb" stroke-width="1"/>
  <g font-size="13">
    <text x="262" y="78" text-anchor="middle" font-weight="600" fill="#4169E1">4</text>
    <text x="300" y="78" fill="#1a2026">3.714286 &lt; 4 → left</text>
    <text x="480" y="78" fill="#4169E1" font-weight="600">(0.286, 4)</text>
    <text x="262" y="134" text-anchor="middle" font-weight="600" fill="#1a2026">2</text>
    <text x="300" y="134" fill="#1a2026">3.714286 &gt; 2 → right</text>
    <text x="480" y="134" fill="#5c6b76">dist 1.714 — no update</text>
    <text x="262" y="190" text-anchor="middle" font-weight="600" fill="#1a2026">3</text>
    <text x="300" y="190" fill="#1a2026">3.714286 &gt; 3 → right: stop</text>
    <text x="480" y="190" fill="#5c6b76">dist 0.714 — no update</text>
  </g>
  <rect x="250" y="210" width="110" height="30" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="305" y="230" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">closest <tspan fill="#4169E1">4</tspan></text>
  <text x="320" y="268" text-anchor="middle" fill="#1a2026" font-size="13">The descent 4 → 2 → 3 brackets the target between 3 and 4;</text>
  <text x="320" y="286" text-anchor="middle" fill="#1a2026" font-size="13">|4 − 3.714286| = 0.286 beats |3 − 3.714286| = 0.714, so the closest value is <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
