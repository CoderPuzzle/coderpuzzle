<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- homes (0,0), (0,4), (2,2); cells 44x40 at (64,84); median row 0 and median column 2 shaded #dbe4fb; meeting point (0,2) -->
  <rect x="64" y="84" width="220" height="40" fill="#dbe4fb"/>
  <rect x="152" y="84" width="44" height="120" fill="#dbe4fb"/>
  <g fill="none" stroke="#42525e" stroke-width="1.3">
    <rect x="64" y="84" width="44" height="40"/><rect x="108" y="84" width="44" height="40"/><rect x="152" y="84" width="44" height="40"/><rect x="196" y="84" width="44" height="40"/><rect x="240" y="84" width="44" height="40"/>
    <rect x="64" y="124" width="44" height="40"/><rect x="108" y="124" width="44" height="40"/><rect x="152" y="124" width="44" height="40"/><rect x="196" y="124" width="44" height="40"/><rect x="240" y="124" width="44" height="40"/>
    <rect x="64" y="164" width="44" height="40"/><rect x="108" y="164" width="44" height="40"/><rect x="152" y="164" width="44" height="40"/><rect x="196" y="164" width="44" height="40"/><rect x="240" y="164" width="44" height="40"/>
  </g>
  <g fill="#9aa7b2" font-size="11" text-anchor="middle">
    <text x="86" y="222">0</text><text x="130" y="222">1</text><text x="174" y="222">2</text><text x="218" y="222">3</text><text x="262" y="222">4</text>
  </g>
  <g fill="#9aa7b2" font-size="11" text-anchor="end">
    <text x="54" y="108">0</text><text x="54" y="148">1</text><text x="54" y="188">2</text>
  </g>
  <!-- travel arrows, each of length 2 -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 93 104 H 167" marker-end="url(#arrow)"/>
    <path d="M 267 104 H 181" marker-end="url(#arrow)"/>
    <path d="M 174 177 V 111" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="131" y="96">2</text>
    <text x="230" y="96">2</text>
    <text x="194" y="150">2</text>
  </g>
  <!-- homes and meeting point -->
  <g fill="#1a2026">
    <circle cx="86" cy="104" r="5"/><circle cx="262" cy="104" r="5"/><circle cx="174" cy="184" r="5"/>
  </g>
  <circle cx="174" cy="104" r="7" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
  <circle cx="174" cy="104" r="2.5" fill="#4169E1"/>
  <!-- legend -->
  <circle cx="101" cy="242" r="4" fill="#1a2026"/>
  <text x="111" y="246" fill="#5c6b76" font-size="11.5">home</text>
  <circle cx="171" cy="242" r="5" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <circle cx="171" cy="242" r="1.8" fill="#4169E1"/>
  <text x="181" y="246" fill="#5c6b76" font-size="11.5">meeting point</text>
  <!-- median derivation -->
  <g text-anchor="middle" font-size="13.5">
    <text x="480" y="100" fill="#1a2026">rows sorted: [0, <tspan fill="#4169E1" font-weight="600">0</tspan>, 2] &#8594; median row <tspan fill="#4169E1" font-weight="600">0</tspan></text>
    <text x="480" y="132" fill="#1a2026">cols sorted: [0, <tspan fill="#4169E1" font-weight="600">2</tspan>, 4] &#8594; median col <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="480" y="178" font-weight="600">meeting point = <tspan fill="#4169E1">(0, 2)</tspan></text>
  </g>
  <text x="340" y="284" text-anchor="middle" fill="#1a2026" font-size="13">The two median lines cross at the meeting point, and every home travels</text>
  <text x="340" y="304" text-anchor="middle" fill="#1a2026" font-size="13">exactly <tspan fill="#4169E1" font-weight="600">2</tspan> to reach it: 2 + 2 + 2 = <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
