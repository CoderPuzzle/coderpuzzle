<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 278" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15">
  <rect width="560" height="278" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- input grid: INF, walls (-1), gates (0) -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="38" y="42" width="46" height="46" fill="#ffffff"/><rect x="84" y="42" width="46" height="46" fill="#eef0f3"/><rect x="130" y="42" width="46" height="46" fill="#4169E1" fill-opacity="0.18"/><rect x="176" y="42" width="46" height="46" fill="#ffffff"/>
    <rect x="38" y="88" width="46" height="46" fill="#ffffff"/><rect x="84" y="88" width="46" height="46" fill="#ffffff"/><rect x="130" y="88" width="46" height="46" fill="#ffffff"/><rect x="176" y="88" width="46" height="46" fill="#eef0f3"/>
    <rect x="38" y="134" width="46" height="46" fill="#ffffff"/><rect x="84" y="134" width="46" height="46" fill="#eef0f3"/><rect x="130" y="134" width="46" height="46" fill="#ffffff"/><rect x="176" y="134" width="46" height="46" fill="#eef0f3"/>
    <rect x="38" y="180" width="46" height="46" fill="#4169E1" fill-opacity="0.18"/><rect x="84" y="180" width="46" height="46" fill="#eef0f3"/><rect x="130" y="180" width="46" height="46" fill="#ffffff"/><rect x="176" y="180" width="46" height="46" fill="#ffffff"/>
  </g>
  <g text-anchor="middle">
    <text x="61" y="70" fill="#5c6b76">∞</text><text x="107" y="70" fill="#5c6b76">-1</text><text x="153" y="70" fill="#4169E1" font-weight="600">0</text><text x="199" y="70" fill="#5c6b76">∞</text>
    <text x="61" y="116" fill="#5c6b76">∞</text><text x="107" y="116" fill="#5c6b76">∞</text><text x="153" y="116" fill="#5c6b76">∞</text><text x="199" y="116" fill="#5c6b76">-1</text>
    <text x="61" y="162" fill="#5c6b76">∞</text><text x="107" y="162" fill="#5c6b76">-1</text><text x="153" y="162" fill="#5c6b76">∞</text><text x="199" y="162" fill="#5c6b76">-1</text>
    <text x="61" y="208" fill="#4169E1" font-weight="600">0</text><text x="107" y="208" fill="#5c6b76">-1</text><text x="153" y="208" fill="#5c6b76">∞</text><text x="199" y="208" fill="#5c6b76">∞</text>
  </g>
  <text x="130" y="252" text-anchor="middle" fill="#5c6b76" font-size="12.5">rooms</text>
  <line x1="248" y1="134" x2="312" y2="134" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- result grid: distance to the nearest gate -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="336" y="42" width="46" height="46" fill="#ffffff"/><rect x="382" y="42" width="46" height="46" fill="#eef0f3"/><rect x="428" y="42" width="46" height="46" fill="#4169E1" fill-opacity="0.18"/><rect x="474" y="42" width="46" height="46" fill="#ffffff"/>
    <rect x="336" y="88" width="46" height="46" fill="#ffffff"/><rect x="382" y="88" width="46" height="46" fill="#ffffff"/><rect x="428" y="88" width="46" height="46" fill="#ffffff"/><rect x="474" y="88" width="46" height="46" fill="#eef0f3"/>
    <rect x="336" y="134" width="46" height="46" fill="#ffffff"/><rect x="382" y="134" width="46" height="46" fill="#eef0f3"/><rect x="428" y="134" width="46" height="46" fill="#ffffff"/><rect x="474" y="134" width="46" height="46" fill="#eef0f3"/>
    <rect x="336" y="180" width="46" height="46" fill="#4169E1" fill-opacity="0.18"/><rect x="382" y="180" width="46" height="46" fill="#eef0f3"/><rect x="428" y="180" width="46" height="46" fill="#ffffff"/><rect x="474" y="180" width="46" height="46" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="359" y="70">3</text><text x="405" y="70" fill="#5c6b76">-1</text><text x="451" y="70" fill="#4169E1">0</text><text x="497" y="70">1</text>
    <text x="359" y="116">2</text><text x="405" y="116">2</text><text x="451" y="116">1</text><text x="497" y="116" fill="#5c6b76">-1</text>
    <text x="359" y="162">1</text><text x="405" y="162" fill="#5c6b76">-1</text><text x="451" y="162">2</text><text x="497" y="162" fill="#5c6b76">-1</text>
    <text x="359" y="208" fill="#4169E1">0</text><text x="405" y="208" fill="#5c6b76">-1</text><text x="451" y="208">3</text><text x="497" y="208">4</text>
  </g>
  <text x="428" y="252" text-anchor="middle" fill="#5c6b76" font-size="12.5">each room filled with its distance to the nearest gate</text>
</svg>
