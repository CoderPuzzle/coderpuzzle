<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="290" fill="#ffffff"/>
  <!-- nums = [3,2,1,5,6,4], k = 2; column centres cx = 66 + 108j; stream cells 56x36 at y 22; heap root y 120, child y 160; dashed struck circle = popped minimum -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="66" y="14">i = 0</text><text x="174" y="14">i = 1</text><text x="282" y="14">i = 2</text>
    <text x="390" y="14">i = 3</text><text x="498" y="14">i = 4</text><text x="606" y="14">i = 5</text>
  </g>
  <!-- stream cells -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="38" y="22" width="56" height="36"/><rect x="146" y="22" width="56" height="36"/>
    <rect x="362" y="22" width="56" height="36"/><rect x="470" y="22" width="56" height="36"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="#f0f3f7">
    <rect x="254" y="22" width="56" height="36"/><rect x="578" y="22" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="66" y="45">3</text><text x="174" y="45">2</text><text x="282" y="45" fill="#9aa7b2">1</text>
    <text x="390" y="45" fill="#4169E1">5</text><text x="498" y="45" fill="#4169E1">6</text><text x="606" y="45" fill="#9aa7b2">4</text>
  </g>
  <!-- action labels -->
  <g text-anchor="middle" font-size="11.5" font-weight="600">
    <text x="66" y="76" fill="#5c6b76">push</text><text x="174" y="76" fill="#5c6b76">push</text>
    <text x="282" y="76" fill="#9aa7b2">skip</text><text x="390" y="76" fill="#4169E1">replace</text>
    <text x="498" y="76" fill="#4169E1">replace</text><text x="606" y="76" fill="#9aa7b2">skip</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="282" y="93">1 &lt; root 2</text><text x="390" y="93">5 &gt; root 2</text>
    <text x="498" y="93">6 &gt; root 3</text><text x="606" y="93">4 &lt; root 5</text>
  </g>
  <!-- heap states -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <line x1="165" y1="135" x2="159" y2="145"/>
    <line x1="273" y1="135" x2="267" y2="145"/>
    <line x1="381" y1="135" x2="375" y2="145"/>
    <line x1="489" y1="135" x2="483" y2="145"/>
    <line x1="597" y1="135" x2="591" y2="145"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.5">
    <circle cx="66" cy="120" r="17"/><circle cx="174" cy="120" r="17"/>
    <circle cx="282" cy="120" r="17"/><circle cx="390" cy="120" r="17"/>
    <circle cx="498" cy="120" r="17"/>
    <circle cx="150" cy="160" r="17"/><circle cx="258" cy="160" r="17"/>
    <circle cx="366" cy="160" r="17"/><circle cx="474" cy="160" r="17"/><circle cx="582" cy="160" r="17"/>
  </g>
  <circle cx="606" cy="120" r="17" fill="#4169E1" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600">
    <text x="66" y="125">3</text><text x="174" y="125">2</text><text x="282" y="125">2</text>
    <text x="390" y="125">3</text><text x="498" y="125">5</text><text x="606" y="125" fill="#ffffff">5</text>
    <text x="150" y="165">3</text><text x="258" y="165">3</text>
    <text x="366" y="165">5</text><text x="474" y="165">6</text><text x="582" y="165">6</text>
  </g>
  <!-- popped minimums -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3">
    <circle cx="420" cy="160" r="13"/><circle cx="528" cy="160" r="13"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12" font-weight="600">
    <text x="420" y="164">2</text><text x="528" y="164">3</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.4">
    <line x1="413" y1="153" x2="427" y2="167"/><line x1="427" y1="153" x2="413" y2="167"/>
    <line x1="521" y1="153" x2="535" y2="167"/><line x1="535" y1="153" x2="521" y2="167"/>
  </g>
  <text x="340" y="248" text-anchor="middle" fill="#1a2026" font-size="13">Values below the root cost one comparison and are skipped; 5 and 6 pop the root and enter.</text>
  <text x="340" y="268" text-anchor="middle" fill="#1a2026" font-size="13">The last size-2 heap holds the top 2 — {5, 6} — and its root <tspan fill="#4169E1" font-weight="600">5</tspan> is the 2nd largest.</text>
</svg>
