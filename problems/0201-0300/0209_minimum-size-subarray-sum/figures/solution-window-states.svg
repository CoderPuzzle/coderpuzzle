    <text x="436" y="76">5</text>
  </g>
  <text x="14" y="47" fill="#5c6b76" font-size="12.5">target 7:</text>
  <!-- window snapshots, aligned to the columns above -->
  <g fill="#4169E1" fill-opacity="0.14">
    <rect x="108" y="104" width="236" height="18" rx="4"/>
    <rect x="168" y="138" width="236" height="18" rx="4"/>
    <rect x="228" y="172" width="176" height="18" rx="4"/>
    <rect x="348" y="206" width="116" height="18" rx="4"/>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="108" y="131">right = 3, window sum 8 &#8805; 7 &#8594; shrink left</text>
    <text x="168" y="165">right = 4, sum 10 &#8805; 7 &#8594; shrink left</text>
    <text x="228" y="199">sum 7 &#8805; 7, length 3 &#8594; shrink again</text>
  </g>
  <text x="348" y="224" fill="#4169E1" font-size="12" font-weight="600">sum 7, length 2 = answer</text>
