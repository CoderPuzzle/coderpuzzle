<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 228" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="228" fill="#ffffff"/>
  <!-- nums = [2,3,1,2,4,3], target = 7 -->
  <g stroke="#42525e" fill="none" stroke-width="1.5">
    <rect x="110" y="24" width="52" height="36" rx="4"/>
    <rect x="170" y="24" width="52" height="36" rx="4"/>
    <rect x="230" y="24" width="52" height="36" rx="4"/>
    <rect x="290" y="24" width="52" height="36" rx="4"/>
    <rect x="350" y="24" width="52" height="36" rx="4"/>
    <rect x="410" y="24" width="52" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="136" y="47">2</text>
    <text x="196" y="47">3</text>
    <text x="256" y="47">1</text>
    <text x="316" y="47">2</text>
    <text x="376" y="47">4</text>
    <text x="436" y="47">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="136" y="76">0</text>
    <text x="196" y="76">1</text>
    <text x="256" y="76">2</text>
    <text x="316" y="76">3</text>
