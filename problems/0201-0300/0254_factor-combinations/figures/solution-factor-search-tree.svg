<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- backtracking over n = 12: node = remaining, edge = factor f tried; emits [2,6], [2,2,3], [3,4] in that order; circles r=20 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="179" y1="81" x2="131" y2="151"/>
    <line x1="204" y1="79" x2="272" y2="153"/>
    <line x1="120" y1="188" x2="120" y2="252"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="190" cy="64" r="20"/><circle cx="120" cy="168" r="20"/>
    <circle cx="285" cy="168" r="20"/><circle cx="120" cy="272" r="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="190" y="69">12</text><text x="120" y="173">6</text>
    <text x="285" y="173">4</text><text x="120" y="277">3</text>
  </g>
  <g font-size="12.5">
    <text x="140" y="104" text-anchor="end" fill="#5c6b76">f = 2</text>
    <text x="140" y="122" text-anchor="end" fill="#4169E1" font-weight="600">emit [2, 6]</text>
    <text x="246" y="104" fill="#5c6b76">f = 3</text>
    <text x="246" y="122" fill="#4169E1" font-weight="600">emit [3, 4]</text>
    <text x="132" y="226"><tspan fill="#5c6b76">f = 2 · </tspan><tspan fill="#4169E1" font-weight="600">emit [2, 2, 3]</tspan></text>
    <text x="285" y="204" text-anchor="middle" fill="#9aa7b2">f = 3: 9 &gt; 4 — stop</text>
    <text x="120" y="302" text-anchor="middle" fill="#9aa7b2">f = 2: 4 &gt; 3 — stop</text>
  </g>
  <path d="M 355 146 H 448" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <text x="402" y="136" text-anchor="middle" fill="#9aa7b2" font-size="11.5">sort</text>
  <!-- final display order: [[2,6],[3,4],[2,2,3]]; cells 34x28, gap 6, rows centred on x=540 -->
  <text x="540" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">final order — fewest factors first</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="503" y="84" width="34" height="28"/><rect x="543" y="84" width="34" height="28"/>
    <rect x="503" y="132" width="34" height="28"/><rect x="543" y="132" width="34" height="28"/>
    <rect x="483" y="180" width="34" height="28"/><rect x="523" y="180" width="34" height="28"/><rect x="563" y="180" width="34" height="28"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="520" y="103">2</text><text x="560" y="103">6</text>
    <text x="520" y="151">3</text><text x="560" y="151">4</text>
    <text x="500" y="199">2</text><text x="540" y="199">2</text><text x="580" y="199">3</text>
  </g>
  <text x="540" y="232" text-anchor="middle" fill="#9aa7b2" font-size="11.5">by (length, lexicographic)</text>
  <text x="340" y="326" text-anchor="middle" fill="#1a2026" font-size="13">Ascending factors close [2, 6] and [3, 4] at the root and split 6 into [2, 2, 3];</text>
  <text x="340" y="346" text-anchor="middle" fill="#1a2026" font-size="13">growing left to right interleaves the groups, so the final sort puts fewest factors first.</text>
</svg>
