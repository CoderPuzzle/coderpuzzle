<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- num = "123", target = 6; (current, prev) after each operand; boxes 100x48 at x=170/320/470, rows y=70 and y=176 -->
  <text x="320" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">state (current, prev) after each operand of the search</text>
  <text x="82" y="99" text-anchor="end" fill="#1a2026" font-weight="600">1+2+3</text>
  <text x="122" y="99" text-anchor="end" fill="#5c6b76" font-size="12">read 1</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="170" y="70" width="100" height="48"/><rect x="320" y="70" width="100" height="48"/>
  </g>
  <rect x="470" y="70" width="100" height="48" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="12.5">
    <text x="220" y="89">current = 1</text><text x="220" y="107" fill="#5c6b76">prev = 1</text>
    <text x="370" y="89">current = 3</text><text x="370" y="107" fill="#5c6b76">prev = 2</text>
    <text x="520" y="89" fill="#4169E1" font-weight="600">current = 6</text><text x="520" y="107" fill="#4169E1">prev = 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 270 94 H 314" marker-end="url(#arrow)"/>
    <path d="M 420 94 H 464" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="295" y="84">+ 2</text><text x="445" y="84">+ 3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="370" y="136">1 + 2</text><text x="520" y="136">3 + 3</text>
  </g>
  <text x="82" y="205" text-anchor="end" fill="#1a2026" font-weight="600">1×2×3</text>
  <text x="122" y="205" text-anchor="end" fill="#5c6b76" font-size="12">read 1</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="170" y="176" width="100" height="48"/><rect x="320" y="176" width="100" height="48"/>
  </g>
  <rect x="470" y="176" width="100" height="48" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="12.5">
    <text x="220" y="195">current = 1</text><text x="220" y="213" fill="#5c6b76">prev = 1</text>
    <text x="370" y="195">current = 2</text><text x="370" y="213" fill="#5c6b76">prev = 2</text>
    <text x="520" y="195" fill="#4169E1" font-weight="600">current = 6</text><text x="520" y="213" fill="#4169E1">prev = 6</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 270 200 H 314" marker-end="url(#arrow)"/>
    <path d="M 420 200 H 464" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="295" y="190">× 2</text><text x="445" y="190">× 3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="370" y="242">1 − 1 + 2</text><text x="520" y="242">2 − 2 + 6</text>
  </g>
  <text x="320" y="268" text-anchor="middle" fill="#5c6b76" font-size="12.5">× rewrites the tail in place: current = current − prev + prev × nxt, prev = prev × nxt</text>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">current is the whole expression's value, prev the trailing multiplicand chain;</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">1+2+3 folds straight to <tspan fill="#4169E1" font-weight="600">6</tspan>, 1×2×3 rebuilds its tail twice — both hit the target <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
