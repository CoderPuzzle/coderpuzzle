<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="404" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums sorted = [-2,0,1,3], target = 2; cells 80x44 at x=160+80k; row A y=56, row B y=228 -->
  <text x="130" y="46" text-anchor="end" fill="#5c6b76" font-size="12.5">anchor i = 0</text>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">
    <text x="200" y="30">i</text>
  </g>
  <path d="M 200 36 V 50" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="160" y="56" width="80" height="44"/><rect x="240" y="56" width="80" height="44"/>
    <rect x="320" y="56" width="80" height="44"/><rect x="400" y="56" width="80" height="44"/>
  </g>
  <rect x="160" y="56" width="80" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="200" y="78" fill="#4169E1">-2</text><text x="280" y="78">0</text>
    <text x="360" y="78">1</text><text x="440" y="78">3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="200" y="95">0</text><text x="280" y="95">1</text><text x="360" y="95">2</text><text x="440" y="95">3</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.6" fill="none">
    <path d="M 280 146 V 108" marker-end="url(#arrow)"/>
    <path d="M 440 146 V 108" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">
    <text x="280" y="164">lo</text><text x="440" y="164">hi</text>
  </g>
  <text x="536" y="82" text-anchor="middle" fill="#5c6b76" font-size="12.5">count = 0</text>
  <text x="320" y="196" text-anchor="middle" fill="#1a2026" font-size="13">0 + 3 = 3 &lt; 4 = 2 - (-2) → count += hi - lo = 2; lo advances</text>
  <!-- row B: after lo++, the pair 1 + 3 is too big, hi retreats -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="160" y="228" width="80" height="44"/><rect x="240" y="228" width="80" height="44"/>
    <rect x="320" y="228" width="80" height="44"/><rect x="400" y="228" width="80" height="44"/>
  </g>
  <rect x="160" y="228" width="80" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="200" y="250" fill="#4169E1">-2</text><text x="280" y="250">0</text>
    <text x="360" y="250">1</text><text x="440" y="250">3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="200" y="267">0</text><text x="280" y="267">1</text><text x="360" y="267">2</text><text x="440" y="267">3</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.6" fill="none">
    <path d="M 360 318 V 280" marker-end="url(#arrow)"/>
    <path d="M 440 318 V 280" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">
    <text x="360" y="336">lo</text><text x="440" y="336">hi</text>
  </g>
  <text x="536" y="254" text-anchor="middle" fill="#5c6b76" font-size="12.5">count = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="320" y="360" text-anchor="middle" fill="#1a2026" font-size="13">Now 1 + 3 = 4 ≥ 4 → hi retreats; lo = hi closes anchor 0.</text>
  <text x="320" y="384" text-anchor="middle" fill="#1a2026" font-size="13">Anchor -2 counted [-2, 0, 1] and [-2, 0, 3] in one step; anchor 1 stops: 0 + 1 + 3 = 4 ≥ 2.</text>
</svg>
