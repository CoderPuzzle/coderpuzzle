<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 2 x 2 board: the two 1s share no edge, so no 2 x 2 square exists -->
  <rect x="144" y="30" width="44" height="44" fill="#e5ebfa"/>
  <rect x="100" y="74" width="44" height="44" fill="#e5ebfa"/>
  <g stroke="#b9c4cd" stroke-width="1" fill="#ffffff">
    <rect x="100" y="30" width="44" height="44"/>
    <rect x="144" y="30" width="44" height="44"/>
    <rect x="100" y="74" width="44" height="44"/>
    <rect x="144" y="74" width="44" height="44"/>
  </g>
  <rect x="144" y="30" width="44" height="44" fill="none" stroke="#4169E1" stroke-width="2"/>
  <rect x="100" y="74" width="44" height="44" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="122" y="57">0</text><text x="166" y="57">1</text>
    <text x="122" y="101">1</text><text x="166" y="101">0</text>
  </g>
  <text x="160" y="152" text-anchor="middle" fill="#5c6b76" font-size="12.5">no 2 x 2 square: the answer is a single cell</text>
</svg>
