<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 192" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- before: 1 -> 2 -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="110" cy="36" r="17"/>
    <circle cx="230" cy="36" r="17"/>
  </g>
  <line x1="131" y1="36" x2="209" y2="36" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="110" y="41">1</text><text x="230" y="41">2</text>
  </g>
  <line x1="170" y1="60" x2="170" y2="124" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrowA)"/>
  <!-- after: 2 -> 1 -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="110" cy="150" r="17"/>
    <circle cx="230" cy="150" r="17"/>
  </g>
  <line x1="131" y1="150" x2="209" y2="150" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="110" y="155">2</text><text x="230" y="155">1</text>
  </g>
</svg>
