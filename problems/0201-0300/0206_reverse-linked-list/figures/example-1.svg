<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 192" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- before: 1 -> 2 -> 3 -> 4 -> 5 -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="60" cy="36" r="17"/>
    <circle cx="140" cy="36" r="17"/>
    <circle cx="220" cy="36" r="17"/>
    <circle cx="300" cy="36" r="17"/>
    <circle cx="380" cy="36" r="17"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="81" y1="36" x2="119" y2="36" marker-end="url(#arrow)"/>
    <line x1="161" y1="36" x2="199" y2="36" marker-end="url(#arrow)"/>
    <line x1="241" y1="36" x2="279" y2="36" marker-end="url(#arrow)"/>
    <line x1="321" y1="36" x2="359" y2="36" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="60" y="41">1</text><text x="140" y="41">2</text><text x="220" y="41">3</text><text x="300" y="41">4</text><text x="380" y="41">5</text>
  </g>
  <line x1="220" y1="60" x2="220" y2="124" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrowA)"/>
  <!-- after: 5 -> 4 -> 3 -> 2 -> 1 -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="60" cy="150" r="17"/>
    <circle cx="140" cy="150" r="17"/>
    <circle cx="220" cy="150" r="17"/>
    <circle cx="300" cy="150" r="17"/>
    <circle cx="380" cy="150" r="17"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="81" y1="150" x2="119" y2="150" marker-end="url(#arrow)"/>
    <line x1="161" y1="150" x2="199" y2="150" marker-end="url(#arrow)"/>
    <line x1="241" y1="150" x2="279" y2="150" marker-end="url(#arrow)"/>
    <line x1="321" y1="150" x2="359" y2="150" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="60" y="155">5</text><text x="140" y="155">4</text><text x="220" y="155">3</text><text x="300" y="155">2</text><text x="380" y="155">1</text>
  </g>
</svg>
