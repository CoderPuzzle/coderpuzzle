<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="220" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- before: 1 -> 2 -> 3 -> 4 -> 5 -->
  <text x="40" y="20" fill="#5c6b76" font-size="12.5">before</text>
  <g stroke="#42525e" fill="none" stroke-width="1.6">
    <rect x="40" y="28" width="46" height="34" rx="4"/>
    <rect x="126" y="28" width="46" height="34" rx="4"/>
    <rect x="212" y="28" width="46" height="34" rx="4"/>
    <rect x="298" y="28" width="46" height="34" rx="4"/>
    <rect x="384" y="28" width="46" height="34" rx="4"/>
    <line x1="86" y1="45" x2="122" y2="45" marker-end="url(#arrow)"/>
    <line x1="172" y1="45" x2="208" y2="45" marker-end="url(#arrow)"/>
    <line x1="258" y1="45" x2="294" y2="45" marker-end="url(#arrow)"/>
    <line x1="344" y1="45" x2="380" y2="45" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600" stroke="none">
    <text x="63" y="50">1</text>
    <text x="149" y="50">2</text>
    <text x="235" y="50">3</text>
    <text x="321" y="50">4</text>
    <text x="407" y="50">5</text>
  </g>
  <text x="442" y="50" fill="#5c6b76">None</text>
  <!-- mid-scan after node 3: prev = 3 -> 2 -> 1 -> None, current = 4, nxt = 5 -->
  <text x="40" y="108" fill="#5c6b76" font-size="12.5">after processing node 3</text>
  <text x="254" y="94" fill="#4169E1" font-size="12.5" font-weight="600" text-anchor="middle">prev</text>
  <text x="407" y="94" fill="#4169E1" font-size="12.5" font-weight="600" text-anchor="middle">current</text>
  <text x="490" y="94" fill="#5c6b76" font-size="12.5" text-anchor="middle">nxt</text>
  <g stroke="#42525e" fill="none" stroke-width="1.6">
    <rect x="254" y="104" width="46" height="34" rx="4"/>
    <rect x="168" y="104" width="46" height="34" rx="4"/>
    <rect x="82" y="104" width="46" height="34" rx="4"/>
    <rect x="384" y="104" width="46" height="34" rx="4"/>
    <rect x="468" y="104" width="46" height="34" rx="4"/>
    <line x1="164" y1="121" x2="132" y2="121" marker-end="url(#arrow)"/>
    <line x1="430" y1="121" x2="466" y2="121" marker-end="url(#arrow)"/>
  </g>
  <!-- the pointer just flipped: 3 now points back at 2 -->
  <line x1="250" y1="121" x2="218" y2="121" stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="277" y="126">3</text>
    <text x="191" y="126">2</text>
    <text x="105" y="126">1</text>
    <text x="407" y="126">4</text>
    <text x="491" y="126">5</text>
  </g>
  <text x="40" y="126" fill="#5c6b76">None</text>
  <text x="524" y="126" fill="#5c6b76">rest of list</text>
  <line x1="350" y1="100" x2="350" y2="146" stroke="#5c6b76" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="196" y="166" fill="#5c6b76" font-size="12.5" text-anchor="middle">already reversed</text>
  <text x="196" y="184" fill="#4169E1" font-size="12.5" text-anchor="middle">3.next = prev was just flipped</text>
  <text x="445" y="166" fill="#5c6b76" font-size="12.5" text-anchor="middle">untouched</text>
  <text x="445" y="184" fill="#5c6b76" font-size="12.5" text-anchor="middle">nxt saved 4.next first</text>
</svg>
