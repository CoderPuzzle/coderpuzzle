<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 274" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- BST [6,2,8,0,4,7,9,null,null,3,5] -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="280" y1="53" x2="190" y2="83"/>
    <line x1="280" y1="53" x2="370" y2="83"/>
    <line x1="190" y1="117" x2="130" y2="147"/>
    <line x1="190" y1="117" x2="250" y2="147"/>
    <line x1="370" y1="117" x2="330" y2="147"/>
    <line x1="370" y1="117" x2="410" y2="147"/>
    <line x1="250" y1="181" x2="210" y2="211"/>
    <line x1="250" y1="181" x2="290" y2="211"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="280" cy="36" r="17"/>
    <circle cx="130" cy="164" r="17"/>
    <circle cx="330" cy="164" r="17"/>
    <circle cx="410" cy="164" r="17"/>
    <circle cx="210" cy="228" r="17"/>
    <circle cx="290" cy="228" r="17"/>
  </g>
  <!-- q = 4 -->
  <circle cx="250" cy="164" r="17" fill="#e5ebfa" stroke="#4169E1" stroke-width="2"/>
  <!-- p = 2 is also the LCA -->
  <circle cx="190" cy="100" r="17" fill="#4169E1" stroke="#1a2026" stroke-width="1.6"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="280" y="41">6</text>
    <text x="130" y="169">0</text><text x="330" y="169">7</text><text x="410" y="169">9</text>
    <text x="210" y="233">3</text><text x="290" y="233">5</text>
  </g>
  <text x="250" y="169" text-anchor="middle" fill="#1a2026" font-weight="600">4</text>
  <text x="190" y="105" text-anchor="middle" fill="#ffffff" font-weight="600">2</text>
  <text x="280" y="262" text-anchor="middle" fill="#5c6b76" font-size="12.5">q = 4 is inside the subtree rooted at p = 2, so the LCA is 2 itself</text>
</svg>
