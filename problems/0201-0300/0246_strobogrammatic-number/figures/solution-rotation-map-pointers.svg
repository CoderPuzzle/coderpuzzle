<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 304" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="304" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- num = "69"; map = {0:0, 1:1, 8:8, 6:9, 9:6}; i = 0, j = 1; rotate('6') = '9' == num[1] -->
  <!-- rotation map -->
  <rect x="36" y="70" width="160" height="112" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="116" y="92" text-anchor="middle" fill="#5c6b76" font-size="12.5">rotation map</text>
  <g font-size="13" fill="#1a2026">
    <text x="58" y="118">0 → 0</text>
    <text x="58" y="140">1 → 1</text>
    <text x="58" y="162">8 → 8</text>
    <text x="128" y="118" fill="#4169E1" font-weight="600">6 → 9</text>
    <text x="128" y="140">9 → 6</text>
  </g>
  <!-- pointer labels -->
  <text x="301" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">left</text>
  <text x="431" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">right</text>
  <path d="M 301 52 L 301 66" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 431 52 L 431 66" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- digit cells -->
  <rect x="266" y="70" width="70" height="70" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="301" y="110" text-anchor="middle" fill="#1a2026" font-size="30" font-weight="600">6</text>
  <text x="301" y="130" text-anchor="middle" fill="#9aa7b2" font-size="10.5">i = 0</text>
  <rect x="396" y="70" width="70" height="70" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="431" y="110" text-anchor="middle" fill="#1a2026" font-size="30" font-weight="600">9</text>
  <text x="431" y="130" text-anchor="middle" fill="#9aa7b2" font-size="10.5">j = 1</text>
  <!-- rotation arc -->
  <path d="M 286 152 Q 366 198 446 154" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="366" y="214" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">rotate 180°: 6 → 9</text>
  <text x="366" y="242" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">map['6'] = '9'</tspan> == num[1] — the pair checks out</text>
  <text x="280" y="272" text-anchor="middle" fill="#1a2026" font-size="13">The pointers step inward and cross, so every mirrored pair has checked out:</text>
  <text x="280" y="292" text-anchor="middle" fill="#1a2026" font-size="13">"69" reads the same upside down — the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
