<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- example 2: numCourses = 2, prerequisites = [[1,0],[0,1]] -> edges 0->1, 1->0;
       DFS sweep from course 0: color[0]=1, color[1]=1, then edge 1->0 meets color 1 -> back edge -> false -->
  <text x="285" y="92" text-anchor="middle" fill="#5c6b76" font-size="11.5">pair [1,0] gives edge 0 → 1</text>
  <path d="M 200 104 H 368" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 360 150 H 212" fill="none" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <text x="285" y="174" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">back edge: 0 is still on-path</text>
  <circle cx="170" cy="130" r="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <circle cx="400" cy="130" r="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600" font-size="18">
    <text x="170" y="136">0</text><text x="400" y="136">1</text>
  </g>
  <g font-size="12" fill="#1a2026">
    <rect x="70" y="198" width="14" height="14" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="92" y="210">0 unvisited</text>
    <rect x="210" y="198" width="14" height="14" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
    <text x="232" y="210">1 on the current DFS path</text>
    <rect x="470" y="198" width="14" height="14" fill="#f0f3f7" stroke="#42525e" stroke-width="1.2"/>
    <text x="492" y="210">2 fully explored</text>
  </g>
  <text x="486" y="66" fill="#5c6b76" font-size="12.5">the sweep from course 0</text>
  <g fill="#5c6b76" font-size="12.5">
    <text x="486" y="94">visit 0: color 1, descend</text>
    <text x="486" y="118">visit 1: color 1, descend</text>
    <text x="486" y="142">edge 1 → 0: 0 is still 1</text>
  </g>
  <text x="486" y="166" fill="#4169E1" font-size="12.5" font-weight="600">back edge — return false</text>
  <text x="340" y="266" text-anchor="middle" fill="#1a2026" font-size="13">prerequisites [[1,0],[0,1]] draw the circle 0 → 1 → 0; DFS colors 0 then 1 gray,</text>
  <text x="340" y="288" text-anchor="middle" fill="#1a2026" font-size="13">meets the back edge into still-on-path 0, and returns <tspan fill="#4169E1" font-weight="600">false</tspan>.</text>
</svg>
