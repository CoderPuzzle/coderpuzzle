<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- graph = [[1,1,0],[0,1,0],[1,1,1]]; cells 44x34 at (70,92); highlighted (0,1)=1 drops 0, (1,2)=0 drops 2 -->
  <text x="136" y="74" text-anchor="middle" fill="#5c6b76" font-size="12.5">graph</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="92" y="86">0</text><text x="136" y="86">1</text><text x="180" y="86">2</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="58" y="114">0</text><text x="58" y="148">1</text><text x="58" y="182">2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="70" y="92" width="44" height="34"/><rect x="158" y="92" width="44" height="34"/>
    <rect x="70" y="126" width="44" height="34"/><rect x="114" y="126" width="44" height="34"/>
    <rect x="70" y="160" width="44" height="34"/><rect x="114" y="160" width="44" height="34"/><rect x="158" y="160" width="44" height="34"/>
  </g>
  <rect x="114" y="92" width="44" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="158" y="126" width="44" height="34" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <g text-anchor="middle" fill="#1a2026">
    <text x="92" y="114">1</text><text x="136" y="114" fill="#4169E1" font-weight="600">1</text><text x="180" y="114">0</text>
    <text x="92" y="148">0</text><text x="136" y="148">1</text><text x="180" y="148" fill="#9aa7b2">0</text>
    <text x="92" y="182">1</text><text x="136" y="182">1</text><text x="180" y="182">1</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 208 109 H 234" marker-end="url(#arrow)"/>
    <path d="M 208 143 H 234" marker-end="url(#arrow)"/>
  </g>
  <text x="240" y="113"><tspan fill="#5c6b76">cand = 0, i = 1:</tspan> <tspan font-weight="600">graph[0][1] = 1</tspan> → 0 knows 1: cand = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <text x="240" y="147"><tspan fill="#5c6b76">cand = 1, i = 2:</tspan> <tspan font-weight="600">graph[1][2] = 0</tspan> → 1 stays: 2 is out</text>
  <text x="240" y="187" fill="#5c6b76" font-size="12.5">one pass leaves:</text>
  <circle cx="352" cy="182" r="16" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <text x="352" y="187" text-anchor="middle" fill="#9aa7b2">0</text>
  <line x1="344" y1="174" x2="360" y2="190" stroke="#9aa7b2" stroke-width="1.5"/>
  <circle cx="398" cy="182" r="16" fill="#4169E1"/>
  <text x="398" y="187" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <circle cx="444" cy="182" r="16" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <text x="444" y="187" text-anchor="middle" fill="#9aa7b2">2</text>
  <line x1="436" y1="174" x2="452" y2="190" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="470" y="187" fill="#4169E1" font-size="12" font-weight="600">only 1 survives</text>
  <text x="70" y="228" font-size="13" font-weight="600" fill="#1a2026">verify <tspan fill="#4169E1">candidate 1</tspan>: row all 0 but self, column all 1</text>
  <text x="70" y="257" fill="#5c6b76" font-size="12.5">row 1</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="120" y="240" width="30" height="24"/><rect x="154" y="240" width="30" height="24"/><rect x="188" y="240" width="30" height="24"/>
  </g>
  <g text-anchor="middle">
    <text x="135" y="257">0</text><text x="169" y="257" fill="#9aa7b2">1</text><text x="203" y="257">0</text>
  </g>
  <text x="232" y="257" fill="#5c6b76" font-size="12.5">knows nobody — the self 1 does not count</text>
  <text x="70" y="289" fill="#5c6b76" font-size="12.5">col 1</text>
  <g stroke="#4169E1" stroke-width="1.2" fill="#dbe4fb">
    <rect x="120" y="272" width="30" height="24"/><rect x="154" y="272" width="30" height="24"/><rect x="188" y="272" width="30" height="24"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600">
    <text x="135" y="289">1</text><text x="169" y="289">1</text><text x="203" y="289">1</text>
  </g>
  <text x="232" y="289" fill="#5c6b76" font-size="12.5">known by everyone — the definition holds</text>
  <text x="320" y="322" text-anchor="middle" fill="#1a2026" font-size="13">One lookup rules out one person, so a single pass ends with <tspan fill="#4169E1" font-weight="600">candidate 1</tspan>;</text>
  <text x="320" y="340" text-anchor="middle" fill="#1a2026" font-size="13">row 1 = [0,1,0] and col 1 = [1,1,1] confirm the celebrity is <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
