<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="760" height="262" fill="#ffffff"/>
  <!-- nums = [1,3,-1,-3,5,3,6,7], k = 3 -->
  <g stroke="#42525e" fill="none" stroke-width="1.5">
    <rect x="50" y="26" width="54" height="36" rx="4"/>
    <rect x="112" y="26" width="54" height="36" rx="4"/>
    <rect x="174" y="26" width="54" height="36" rx="4"/>
    <rect x="236" y="26" width="54" height="36" rx="4"/>
    <rect x="298" y="26" width="54" height="36" rx="4"/>
    <rect x="360" y="26" width="54" height="36" rx="4"/>
    <rect x="422" y="26" width="54" height="36" rx="4"/>
    <rect x="484" y="26" width="54" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="77" y="49">1</text><text x="139" y="49">3</text><text x="201" y="49">-1</text><text x="263" y="49">-3</text>
    <text x="325" y="49">5</text><text x="387" y="49">3</text><text x="449" y="49">6</text><text x="511" y="49">7</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="77" y="78">0</text><text x="139" y="78">1</text><text x="201" y="78">2</text><text x="263" y="78">3</text>
    <text x="325" y="78">4</text><text x="387" y="78">5</text><text x="449" y="78">6</text><text x="511" y="78">7</text>
  </g>
  <text x="50" y="108" fill="#5c6b76" font-size="12.5">deque after each arrival (front in blue, values decreasing)</text>
  <!-- i = 3: deque [1, 2, 3] -> values 3, -1, -3 -->
  <g y="0">
    <rect x="116" y="118" width="46" height="24" rx="4" fill="#4169E1"/>
    <rect x="178" y="118" width="46" height="24" rx="4" fill="none" stroke="#42525e" stroke-width="1.4"/>
    <rect x="240" y="118" width="46" height="24" rx="4" fill="none" stroke="#42525e" stroke-width="1.4"/>
    <text x="139" y="135" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="13">3</text>
    <text x="201" y="135" text-anchor="middle" fill="#1a2026" font-size="13">-1</text>
    <text x="263" y="135" text-anchor="middle" fill="#1a2026" font-size="13">-3</text>
  </g>
  <text x="560" y="135" fill="#5c6b76" font-size="12.5">i = 3 &#8594; output 3</text>
  <!-- i = 4: 5 evicts everything -->
  <g>
    <rect x="302" y="158" width="46" height="24" rx="4" fill="#4169E1"/>
    <text x="325" y="175" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="13">5</text>
  </g>
  <text x="560" y="175" fill="#5c6b76" font-size="12.5">i = 4: 5 evicts -3, -1, 3 &#8594; output 5</text>
  <!-- i = 5: deque [4, 5] -->
  <g>
    <rect x="302" y="198" width="46" height="24" rx="4" fill="#4169E1"/>
    <rect x="364" y="198" width="46" height="24" rx="4" fill="none" stroke="#42525e" stroke-width="1.4"/>
    <text x="325" y="215" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="13">5</text>
    <text x="387" y="215" text-anchor="middle" fill="#1a2026" font-size="13">3</text>
  </g>
  <text x="560" y="215" fill="#5c6b76" font-size="12.5">i = 5 &#8594; output 5</text>
  <!-- i = 7: 7 evicts 6 -->
  <g>
    <rect x="488" y="238" width="46" height="24" rx="4" fill="#4169E1"/>
    <text x="511" y="255" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="13">7</text>
  </g>
  <text x="560" y="255" fill="#4169E1" font-weight="600" font-size="12.5">i = 7 &#8594; output 7</text>
</svg>
