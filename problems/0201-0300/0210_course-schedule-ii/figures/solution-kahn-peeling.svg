<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- prerequisite graph: 0 -> 1, 0 -> 2, 1 -> 3, 2 -> 3 -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="108" y1="63" x2="72" y2="122" marker-end="url(#arrow)"/>
    <line x1="132" y1="63" x2="168" y2="122" marker-end="url(#arrow)"/>
    <line x1="72" y1="157" x2="106" y2="198" marker-end="url(#arrow)"/>
    <line x1="168" y1="157" x2="134" y2="198" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="120" cy="46" r="18"/>
    <circle cx="63" cy="140" r="18"/>
    <circle cx="177" cy="140" r="18"/>
    <circle cx="120" cy="216" r="18"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="120" y="51">0</text>
    <text x="63" y="145">1</text>
    <text x="177" y="145">2</text>
    <text x="120" y="221">3</text>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="152" y="42">in 0</text>
    <text x="38" y="118">in 1</text>
    <text x="204" y="118">in 2</text>
    <text x="152" y="234">in 2</text>
  </g>
  <!-- peeling steps -->
  <g font-size="12.5">
    <text x="290" y="56" fill="#4169E1" font-weight="600">1</text>
    <text x="308" y="56" fill="#1a2026">queue = [0] &#8594; take 0; 1 and 2 drop to in 0</text>
    <text x="290" y="96" fill="#4169E1" font-weight="600">2</text>
    <text x="308" y="96" fill="#1a2026">queue = [1, 2] &#8594; take 1; 3 drops to in 1</text>
    <text x="290" y="136" fill="#4169E1" font-weight="600">3</text>
    <text x="308" y="136" fill="#1a2026">queue = [2] &#8594; take 2; 3 drops to in 0</text>
    <text x="290" y="176" fill="#4169E1" font-weight="600">4</text>
    <text x="308" y="176" fill="#1a2026">queue = [3] &#8594; take 3</text>
  </g>
  <text x="308" y="216" fill="#4169E1" font-weight="600" font-size="13">order = [0, 1, 2, 3]</text>
  <text x="308" y="238" fill="#5c6b76" font-size="12.5">all four courses taken &#8594; acyclic</text>
</svg>
