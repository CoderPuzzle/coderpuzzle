<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15">
  <rect width="400" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- current board -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="50" y="42" width="48" height="48" fill="#1a2026"/><rect x="98" y="42" width="48" height="48" fill="#1a2026"/>
    <rect x="50" y="90" width="48" height="48" fill="#1a2026"/><rect x="98" y="90" width="48" height="48" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="74" y="71" fill="#ffffff">1</text><text x="122" y="71" fill="#ffffff">1</text>
    <text x="74" y="119" fill="#ffffff">1</text><text x="122" y="119" fill="#5c6b76">0</text>
  </g>
  <text x="98" y="176" text-anchor="middle" fill="#5c6b76" font-size="12.5">board</text>
  <line x1="176" y1="90" x2="220" y2="90" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- next state: the dead cell has exactly three live neighbors -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="244" y="42" width="48" height="48" fill="#1a2026"/><rect x="292" y="42" width="48" height="48" fill="#1a2026"/>
    <rect x="244" y="90" width="48" height="48" fill="#1a2026"/><rect x="292" y="90" width="48" height="48" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="268" y="71" fill="#ffffff">1</text><text x="316" y="71" fill="#ffffff">1</text>
    <text x="268" y="119" fill="#ffffff">1</text><text x="316" y="119" fill="#1a2026">1</text>
  </g>
  <text x="316" y="176" text-anchor="middle" fill="#5c6b76" font-size="12.5">reproduction: 3 live neighbors</text>
</svg>
