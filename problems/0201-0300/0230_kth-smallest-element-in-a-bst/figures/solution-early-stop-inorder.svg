<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="340" fill="#ffffff"/>
  <!-- root = [3,1,4,null,2], k = 1; nodes r=22 at 3:(330,64) 1:(210,140) 4:(450,140) 2:(280,232); ranks show the in-order order -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="330" y1="86" x2="210" y2="118"/>
    <line x1="330" y1="86" x2="450" y2="118"/>
    <line x1="223" y1="158" x2="267" y2="214"/>
  </g>
  <!-- node 1: the kth visit, accented; 3, 4, 2: unvisited, muted -->
  <circle cx="330" cy="64" r="22" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <circle cx="210" cy="140" r="22" fill="#4169E1"/>
  <circle cx="450" cy="140" r="22" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <circle cx="280" cy="232" r="22" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <text x="330" y="70" text-anchor="middle" fill="#9aa7b2" font-weight="600">3</text>
  <text x="210" y="146" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <text x="450" y="146" text-anchor="middle" fill="#9aa7b2" font-weight="600">4</text>
  <text x="280" y="238" text-anchor="middle" fill="#9aa7b2" font-weight="600">2</text>
  <text x="180" y="145" text-anchor="end" fill="#4169E1" font-size="12.5" font-weight="600">k = 1 → 0</text>
  <g text-anchor="middle" font-size="11.5" font-weight="600">
    <text x="330" y="102" fill="#9aa7b2">#3</text>
    <text x="210" y="178" fill="#4169E1">#1</text>
    <text x="450" y="178" fill="#9aa7b2">#4</text>
    <text x="280" y="270" fill="#9aa7b2">#2</text>
  </g>
  <text x="40" y="306" fill="#1a2026" font-size="13">In-order would visit 1, 2, 3, 4 — ranks #1 to #4 — but k = 1 hits 0 at node 1.</text>
  <text x="40" y="326" fill="#1a2026" font-size="13">The recursion stops early: 2, 3, 4 are never touched; the 1st smallest is <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
