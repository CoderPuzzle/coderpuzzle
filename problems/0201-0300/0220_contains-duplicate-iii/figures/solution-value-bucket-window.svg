<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <!-- nums = [1,5,9,1,5,9], indexDiff 2, valueDiff 3; bucket width 4: box j covers [4j, 4j+4) at x = 80 + 160j, y 56; value v sits at x = 80 + 40*v on the axis y = 96; step columns cx = 66 + 108i, cells 56x36 at y 156 -->
  <text x="80" y="26" fill="#5c6b76" font-size="11.5">bucket id = x / 4 (width valueDiff + 1 = 4) — the window at i = 2:</text>
  <!-- gap brackets between live values -->
  <g stroke="#9aa7b2" stroke-width="1.2">
    <line x1="120" y1="46" x2="280" y2="46"/><line x1="280" y1="46" x2="440" y2="46"/>
    <line x1="120" y1="42" x2="120" y2="50"/><line x1="280" y1="42" x2="280" y2="50"/><line x1="440" y1="42" x2="440" y2="50"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="200" y="38">gap 4 &gt; 3</text><text x="360" y="38">gap 4 &gt; 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="80" y="56" width="160" height="40"/><rect x="240" y="56" width="160" height="40"/><rect x="400" y="56" width="160" height="40"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="160" y="72">bucket 0</text><text x="320" y="72">bucket 1</text><text x="480" y="72">bucket 2</text>
  </g>
  <g fill="#4169E1">
    <circle cx="120" cy="96" r="6"/><circle cx="280" cy="96" r="6"/><circle cx="440" cy="96" r="6"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="80" y="112">0</text><text x="240" y="112">4</text><text x="400" y="112">8</text><text x="560" y="112">12</text>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="120" y="112">1</text><text x="280" y="112">5</text><text x="440" y="112">9</text>
  </g>
  <!-- scan: one column per element -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="66" y="146">i = 0</text><text x="174" y="146">i = 1</text><text x="282" y="146">i = 2</text>
    <text x="390" y="146">i = 3</text><text x="498" y="146">i = 4</text><text x="606" y="146">i = 5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="38" y="156" width="56" height="36"/><rect x="146" y="156" width="56" height="36"/>
    <rect x="254" y="156" width="56" height="36"/><rect x="362" y="156" width="56" height="36"/>
    <rect x="470" y="156" width="56" height="36"/><rect x="578" y="156" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="66" y="179">1</text><text x="174" y="179">5</text><text x="282" y="179">9</text>
    <text x="390" y="179">1</text><text x="498" y="179">5</text><text x="606" y="179">9</text>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="66" y="212" fill="#5c6b76">insert b0</text>
    <text x="174" y="212" fill="#5c6b76">b1 empty;</text>
    <text x="174" y="226" fill="#1a2026">vs 1: 4 &gt; 3</text>
    <text x="282" y="212" fill="#5c6b76">b2 empty;</text>
    <text x="282" y="226" fill="#1a2026">vs 5: 4 &gt; 3</text>
    <text x="390" y="212" fill="#5c6b76">evict 1 (b0);</text>
    <text x="390" y="226" fill="#1a2026">vs 5: 4 &gt; 3</text>
    <text x="498" y="212" fill="#5c6b76">evict 5 (b1);</text>
    <text x="498" y="226" fill="#1a2026">vs 1, 9: 4 &gt; 3</text>
    <text x="606" y="212" fill="#5c6b76">evict 9 (b2);</text>
    <text x="606" y="226" fill="#1a2026">vs 5: 4 &gt; 3</text>
  </g>
  <text x="340" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Every nearest live value sits exactly one bucket away: gap <tspan fill="#4169E1" font-weight="600">4 &gt; valueDiff 3</tspan>, at each step.</text>
  <text x="340" y="280" text-anchor="middle" fill="#1a2026" font-size="13">The outgoing value's bucket is deleted first, so the scan ends with <tspan fill="#4169E1" font-weight="600">false</tspan>.</text>
</svg>
