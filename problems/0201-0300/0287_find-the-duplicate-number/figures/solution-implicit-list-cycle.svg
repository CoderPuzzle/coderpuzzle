<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="240" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- implicit list for nums = [1,3,4,2,2]: i -> nums[i] -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="79" y1="60" x2="149" y2="60" marker-end="url(#arrow)"/>
    <line x1="189" y1="60" x2="259" y2="60" marker-end="url(#arrow)"/>
    <line x1="292" y1="78" x2="326" y2="146" marker-end="url(#arrow)"/>
  </g>
  <!-- the cycle: 2 -> 4 -> 2 -->
  <g stroke="#4169E1" stroke-width="2.2" fill="none">
    <line x1="319" y1="170" x2="223" y2="170" marker-end="url(#arrowBlue)"/>
    <path d="M 213 153 Q 270 103 324 149" marker-end="url(#arrowBlue)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="60" cy="60" r="19"/>
    <circle cx="170" cy="60" r="19"/>
    <circle cx="280" cy="60" r="19"/>
    <circle cx="200" cy="170" r="19" stroke="#4169E1" stroke-width="2"/>
    <circle cx="340" cy="170" r="19" stroke="#4169E1" stroke-width="2"/>
  </g>
  <circle cx="340" cy="170" r="24.5" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="60" y="65">0</text>
    <text x="170" y="65">1</text>
    <text x="280" y="65">3</text>
    <text x="200" y="175">4</text>
    <text x="340" y="175">2</text>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="60" y="95">nums[0] = 1</text>
    <text x="170" y="95">nums[1] = 3</text>
    <text x="280" y="95">nums[3] = 2</text>
    <text x="200" y="205">nums[4] = 2</text>
    <text x="340" y="205">nums[2] = 4</text>
  </g>
  <text x="368" y="152" fill="#4169E1" font-weight="600" font-size="12.5">cycle entry = 2</text>
  <text x="40" y="230" fill="#5c6b76" font-size="12.5">indices 3 and 4 both point at 2 &#8212; two parents make 2 the cycle entry, and the duplicate</text>
</svg>
