<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="372" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- n = 2 digit-square chain: 2 -> 4 -> 16 -> 37 -> 58 -> 89 -> 145 -> 42 -> 20 -> 4 (8-cycle);
       ring = circle r 112 at (390,170), node circles r 24; slow starts at 4, fast at 16;
       rounds: (16,58) (37,145) (58,20) (89,16) (145,58) (42,145) (20,20) — collide on 20, round 7 -->
  <text x="120" y="26" text-anchor="middle" fill="#5c6b76" font-size="12">n = 2</text>
  <circle cx="120" cy="58" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="120" y="64" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <path d="M 146 58 H 358" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="390" y="28" text-anchor="middle" fill="#5c6b76" font-size="11.5">slow starts</text>
  <text x="469" y="60" text-anchor="middle" fill="#5c6b76" font-size="11.5">fast starts</text>
  <g fill="none" stroke="#42525e" stroke-width="1.5">
    <path d="M 415.8 68.8 A 112 112 0 0 1 443.2 80.2" marker-end="url(#arrow)"/>
    <path d="M 479.8 116.8 A 112 112 0 0 1 491.2 144.2" marker-end="url(#arrow)"/>
    <path d="M 491.2 195.8 A 112 112 0 0 1 479.8 223.2" marker-end="url(#arrow)"/>
    <path d="M 443.2 259.8 A 112 112 0 0 1 415.8 271.2" marker-end="url(#arrow)"/>
    <path d="M 364.2 271.2 A 112 112 0 0 1 336.8 259.8" marker-end="url(#arrow)"/>
    <path d="M 300.2 223.2 A 112 112 0 0 1 288.8 195.8" marker-end="url(#arrow)"/>
    <path d="M 288.8 144.2 A 112 112 0 0 1 300.2 116.8" marker-end="url(#arrow)"/>
    <path d="M 336.8 80.2 A 112 112 0 0 1 364.2 68.8" marker-end="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="390" cy="58" r="24"/>
    <circle cx="469" cy="91" r="24"/>
    <circle cx="502" cy="170" r="24"/>
    <circle cx="469" cy="249" r="24"/>
    <circle cx="390" cy="282" r="24"/>
    <circle cx="311" cy="249" r="24"/>
    <circle cx="278" cy="170" r="24"/>
  </g>
  <circle cx="311" cy="91" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="390" y="64">4</text><text x="469" y="97">16</text><text x="502" y="176">37</text>
    <text x="469" y="255">58</text><text x="390" y="288">89</text><text x="311" y="255">145</text>
    <text x="278" y="176">42</text>
  </g>
  <text x="311" y="97" text-anchor="middle" fill="#4169E1" font-weight="600">20</text>
  <path d="M 332 144 L 320 117" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="330" y="158" fill="#4169E1" font-size="12.5" font-weight="600">they meet here</text>
  <g fill="#5c6b76" font-size="12">
    <text x="40" y="104">round 1: slow 16, fast 58</text>
    <text x="40" y="124">round 2: slow 37, fast 145</text>
    <text x="40" y="144">round 3: slow 58, fast 20</text>
    <text x="40" y="164">round 4: slow 89, fast 16</text>
    <text x="40" y="184">round 5: slow 145, fast 58</text>
    <text x="40" y="204">round 6: slow 42, fast 145</text>
  </g>
  <text x="40" y="224" fill="#4169E1" font-size="12" font-weight="600">round 7: slow 20, fast 20</text>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">The chain from 2 enters the 8-cycle 4 → 16 → … → 20 → 4 and never reaches 1;</text>
  <text x="340" y="352" text-anchor="middle" fill="#1a2026" font-size="13">after 7 rounds the hare (2 steps) laps the tortoise (1): slow = fast = 20 ≠ 1 — return <tspan fill="#4169E1" font-weight="600">false</tspan>.</text>
</svg>
