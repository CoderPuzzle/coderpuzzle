<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="410" fill="#ffffff"/>
  <!-- k = 3, n = 9; DFS over ascending digits with rising start floor; root (55,185), level 1 x = 150, level 2 x = 300, leaves x = 450; dashed nodes are tried-but-dead or bound-pruned groups -->
  <!-- edges: gray = explored without success, accent = the three recorded paths -->
  <g stroke="#42525e" stroke-width="1.3" fill="none">
    <path d="M 70 192 L 134 284"/>
    <path d="M 70 196 L 134 336"/>
    <path d="M 164 73 L 285 146"/>
    <path d="M 165 196 L 286 256"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 68 174 L 137 74"/>
    <path d="M 165 70 L 285 42"/>
    <path d="M 165 72 L 285 92"/>
    <path d="M 68 182 L 135 180"/>
    <path d="M 165 190 L 285 200"/>
    <path d="M 315 35 L 435 35"/>
    <path d="M 315 95 L 435 95"/>
    <path d="M 315 200 L 435 200"/>
  </g>
  <!-- root -->
  <circle cx="55" cy="185" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="48" y="230" text-anchor="middle" fill="#5c6b76" font-size="11.5">start = 1</text>
  <!-- level 1: first digits 1, 2 succeed; 3-7 die; 8, 9 never tried -->
  <circle cx="150" cy="65" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="150" y="70" text-anchor="middle" font-weight="600">1</text>
  <circle cx="150" cy="185" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="150" y="190" text-anchor="middle" font-weight="600">2</text>
  <circle cx="150" cy="290" r="15" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="150" y="294" text-anchor="middle" fill="#9aa7b2" font-size="10.5" font-weight="600">3–7</text>
  <text x="175" y="294" fill="#9aa7b2" font-size="11">smallest completion already overshoots</text>
  <circle cx="150" cy="342" r="15" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="150" y="346" text-anchor="middle" fill="#9aa7b2" font-size="10.5" font-weight="600">8, 9</text>
  <text x="185" y="346" fill="#9aa7b2" font-size="11">loop bound d ≤ 10 − slots = 7</text>
  <!-- level 2 under 1 -->
  <circle cx="300" cy="35" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="300" y="40" text-anchor="middle" font-weight="600">2</text>
  <circle cx="300" cy="95" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="300" y="100" text-anchor="middle" font-weight="600">3</text>
  <circle cx="300" cy="155" r="15" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="300" y="159" text-anchor="middle" fill="#9aa7b2" font-size="10.5" font-weight="600">4–8</text>
  <text x="325" y="159" fill="#9aa7b2" font-size="11">floor 5 &gt; budget 4 — loop ends</text>
  <!-- level 2 under 2 -->
  <circle cx="300" cy="200" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="300" y="205" text-anchor="middle" font-weight="600">3</text>
  <circle cx="300" cy="260" r="15" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="300" y="264" text-anchor="middle" fill="#9aa7b2" font-size="10.5" font-weight="600">4–8</text>
  <text x="325" y="264" fill="#9aa7b2" font-size="11">floor 5 &gt; budget 3</text>
  <!-- leaves record the shared buffer -->
  <circle cx="450" cy="35" r="15" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="450" y="40" text-anchor="middle" font-weight="600">6</text>
  <text x="475" y="40" fill="#4169E1" font-size="12" font-weight="600">records [1, 2, 6]<tspan fill="#1a2026" font-weight="400"> — sum 9</tspan></text>
  <text x="450" y="66" text-anchor="middle" fill="#9aa7b2" font-size="10.5">then 7 &gt; budget 6: break</text>
  <circle cx="450" cy="95" r="15" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="450" y="100" text-anchor="middle" font-weight="600">5</text>
  <text x="475" y="100" fill="#4169E1" font-size="12" font-weight="600">records [1, 3, 5]<tspan fill="#1a2026" font-weight="400"> — sum 9</tspan></text>
  <circle cx="450" cy="200" r="15" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="450" y="205" text-anchor="middle" font-weight="600">4</text>
  <text x="475" y="205" fill="#4169E1" font-size="12" font-weight="600">records [2, 3, 4]<tspan fill="#1a2026" font-weight="400"> — sum 9</tspan></text>
  <text x="340" y="380" text-anchor="middle" fill="#1a2026" font-size="13">Three root-to-leaf paths survive: <tspan fill="#4169E1" font-weight="600">1+2+6, 1+3+5, 2+3+4</tspan> — emitted already sorted.</text>
  <text x="340" y="398" text-anchor="middle" fill="#1a2026" font-size="13">Every other branch dies to a loop bound: d ≤ 10 − slots, and floor &gt; budget ends the loop.</text>
</svg>
