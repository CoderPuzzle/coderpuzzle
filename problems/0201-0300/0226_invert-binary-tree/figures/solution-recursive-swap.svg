<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="326" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree = [4,2,7,1,3,6,9] mirrors into [4,7,2,9,6,3,1]; nodes r=18; swap arrows accent blue -->
  <text x="170" y="28" text-anchor="middle" fill="#5c6b76" font-size="12">input [4,2,7,1,3,6,9]</text>
  <text x="510" y="28" text-anchor="middle" fill="#5c6b76" font-size="12">inverted [4,7,2,9,6,3,1]</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="170" y1="60" x2="100" y2="130"/><line x1="170" y1="60" x2="240" y2="130"/>
    <line x1="100" y1="130" x2="65" y2="205"/><line x1="100" y1="130" x2="135" y2="205"/>
    <line x1="240" y1="130" x2="205" y2="205"/><line x1="240" y1="130" x2="275" y2="205"/>
    <line x1="510" y1="60" x2="440" y2="130"/><line x1="510" y1="60" x2="580" y2="130"/>
    <line x1="440" y1="130" x2="405" y2="205"/><line x1="440" y1="130" x2="475" y2="205"/>
    <line x1="580" y1="130" x2="545" y2="205"/><line x1="580" y1="130" x2="615" y2="205"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 122 130 H 218" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>
    <path d="M 68 226 Q 100 260 132 226" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>
    <path d="M 208 226 Q 240 260 272 226" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>
    <path d="M 312 130 H 372" stroke-width="2.4" marker-end="url(#arrowB)"/>
  </g>
  <text x="342" y="112" text-anchor="middle" fill="#4169E1" font-size="12">swap at every node</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="170" cy="60" r="18"/><circle cx="100" cy="130" r="18"/><circle cx="240" cy="130" r="18"/>
    <circle cx="65" cy="205" r="18"/><circle cx="135" cy="205" r="18"/><circle cx="205" cy="205" r="18"/><circle cx="275" cy="205" r="18"/>
  </g>
  <g fill="#dbe4fb" stroke="#1a2026" stroke-width="1.6">
    <circle cx="440" cy="130" r="18"/><circle cx="580" cy="130" r="18"/>
    <circle cx="405" cy="205" r="18"/><circle cx="475" cy="205" r="18"/>
    <circle cx="545" cy="205" r="18"/><circle cx="615" cy="205" r="18"/>
  </g>
  <circle cx="510" cy="60" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="170" y="65">4</text><text x="100" y="135">2</text><text x="240" y="135">7</text>
    <text x="65" y="210">1</text><text x="135" y="210">3</text><text x="205" y="210">6</text><text x="275" y="210">9</text>
    <text x="510" y="65">4</text><text x="440" y="135">7</text><text x="580" y="135">2</text>
    <text x="405" y="210">9</text><text x="475" y="210">6</text><text x="545" y="210">3</text><text x="615" y="210">1</text>
  </g>
  <text x="340" y="286" text-anchor="middle" fill="#1a2026" font-size="13">Each internal node swaps its two finished subtrees: 4's (2, 7), 2's (1, 3), 7's (6, 9).</text>
  <text x="340" y="308" text-anchor="middle" fill="#1a2026" font-size="13">Every child pointer is relinked once: [4,2,7,1,3,6,9] mirrors into <tspan fill="#4169E1" font-weight="600">[4,7,2,9,6,3,1]</tspan>.</text>
</svg>
