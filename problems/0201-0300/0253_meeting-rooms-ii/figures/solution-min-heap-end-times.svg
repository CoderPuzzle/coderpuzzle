<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- meetings [[0,30],[5,10],[15,20]] sorted by start; timeline t to x = 70 + 18t; bars 22 tall -->
  <rect x="70" y="48" width="540" height="22" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="340" y="63" text-anchor="middle" fill="#1a2026" font-size="12">0–30</text>
  <rect x="160" y="76" width="90" height="22" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="205" y="91" text-anchor="middle" fill="#1a2026" font-size="12">5–10</text>
  <rect x="340" y="104" width="90" height="22" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="385" y="119" text-anchor="middle" fill="#1a2026" font-size="12">15–20</text>
  <line x1="70" y1="140" x2="610" y2="140" stroke="#42525e" stroke-width="1.4"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="70" y1="140" x2="70" y2="145"/><line x1="160" y1="140" x2="160" y2="145"/>
    <line x1="250" y1="140" x2="250" y2="145"/><line x1="340" y1="140" x2="340" y2="145"/>
    <line x1="430" y1="140" x2="430" y2="145"/><line x1="520" y1="140" x2="520" y2="145"/>
    <line x1="610" y1="140" x2="610" y2="145"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="70" y="158">0</text><text x="160" y="158">5</text><text x="250" y="158">10</text>
    <text x="340" y="158">15</text><text x="430" y="158">20</text><text x="520" y="158">25</text>
    <text x="610" y="158">30</text>
  </g>
  <!-- min-heap of end times after each arrival: {30}, then {10,30}, then {20,30}; heap minimum accented -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="130" y="196">process [0, 30] — t = 0</text>
    <text x="340" y="196">process [5, 10] — t = 5</text>
    <text x="550" y="196">process [15, 20] — t = 15</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="130" y="218">heap empty → new room</text>
    <text x="340" y="218">min <tspan fill="#4169E1" font-weight="600">30</tspan> &gt; 5 → new room</text>
    <text x="550" y="218">min <tspan fill="#4169E1" font-weight="600">10</tspan> ≤ 15 → reuse room</text>
  </g>
  <rect x="110" y="236" width="40" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="130" y="255" text-anchor="middle" fill="#1a2026" font-size="13">30</text>
  <rect x="297" y="236" width="40" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="317" y="255" text-anchor="middle" fill="#1a2026" font-size="13">10</text>
  <rect x="343" y="236" width="40" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="363" y="255" text-anchor="middle" fill="#1a2026" font-size="13">30</text>
  <rect x="507" y="236" width="40" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="527" y="255" text-anchor="middle" fill="#1a2026" font-size="13">20</text>
  <rect x="553" y="236" width="40" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="573" y="255" text-anchor="middle" fill="#1a2026" font-size="13">30</text>
  <g fill="none" stroke="#9aa7b2" stroke-width="1.5">
    <path d="M 158 251 H 288" marker-end="url(#arrowM)"/>
    <path d="M 391 251 H 499" marker-end="url(#arrowM)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="130" y="290">size 1</text><text x="340" y="290">size 2</text><text x="550" y="290">size 2</text>
  </g>
  <text x="340" y="322" text-anchor="middle" fill="#1a2026" font-size="13">Each arrival checks the earliest end: {30}, then {10, 30} — 5 opens while 30 still runs,</text>
  <text x="340" y="342" text-anchor="middle" fill="#1a2026" font-size="13">then {20, 30} as 15 reuses the room ending at 10 — the peak size <tspan fill="#4169E1" font-weight="600">2</tspan> is the room count.</text>
</svg>
