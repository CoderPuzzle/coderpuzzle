<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 274" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- tree [3,5,1,6,2,0,8,null,null,7,4] -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="270" y1="53" x2="180" y2="83"/>
    <line x1="270" y1="53" x2="360" y2="83"/>
    <line x1="180" y1="117" x2="120" y2="147"/>
    <line x1="180" y1="117" x2="240" y2="147"/>
    <line x1="360" y1="117" x2="320" y2="147"/>
    <line x1="360" y1="117" x2="420" y2="147"/>
    <line x1="240" y1="181" x2="200" y2="211"/>
    <line x1="240" y1="181" x2="290" y2="211"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="120" cy="164" r="17"/>
    <circle cx="240" cy="164" r="17"/>
    <circle cx="320" cy="164" r="17"/>
    <circle cx="420" cy="164" r="17"/>
    <circle cx="200" cy="228" r="17"/>
    <circle cx="290" cy="228" r="17"/>
  </g>
  <!-- p = 5 and q = 1 -->
  <circle cx="180" cy="100" r="17" fill="#e5ebfa" stroke="#4169E1" stroke-width="2"/>
  <circle cx="360" cy="100" r="17" fill="#e5ebfa" stroke="#4169E1" stroke-width="2"/>
  <!-- LCA = 3 -->
  <circle cx="270" cy="36" r="17" fill="#4169E1" stroke="#1a2026" stroke-width="1.6"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="120" y="169">6</text><text x="240" y="169">2</text><text x="320" y="169">0</text><text x="420" y="169">8</text>
    <text x="200" y="233">7</text><text x="290" y="233">4</text>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="180" y="105">5</text><text x="360" y="105">1</text>
  </g>
  <text x="270" y="41" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <text x="270" y="262" text-anchor="middle" fill="#5c6b76" font-size="12.5">5 and 1 first meet at their ancestor 3: LCA = 3</text>
</svg>
