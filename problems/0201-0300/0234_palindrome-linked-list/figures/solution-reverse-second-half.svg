<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- head = [1,2,2,1]; node boxes 52x38 at x = 70 + 95j; row 1 y=44, row 2 y=164, compare chips y=240 -->
  <text x="70" y="30" fill="#5c6b76" font-size="12.5">1. slow and fast find the middle</text>
  <rect x="70" y="44" width="52" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="165" y="44" width="52" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="260" y="44" width="52" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="355" y="44" width="52" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600">
    <text x="96" y="68">1</text><text x="191" y="68">2</text><text x="286" y="68">2</text><text x="381" y="68">1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <line x1="124" y1="63" x2="161" y2="63" marker-end="url(#arrow)"/>
    <line x1="219" y1="63" x2="256" y2="63" marker-end="url(#arrow)"/>
    <line x1="314" y1="63" x2="351" y2="63" marker-end="url(#arrow)"/>
  </g>
  <line x1="286" y1="100" x2="286" y2="88" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="286" y="114" text-anchor="middle" fill="#4169E1" font-size="12">slow</text>
  <line x1="413" y1="56" x2="443" y2="56" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <text x="449" y="61" fill="#9aa7b2" font-size="12">fast, off the end</text>
  <text x="70" y="150" fill="#5c6b76" font-size="12.5">2. reverse the back half in place, then compare in lockstep</text>
  <rect x="70" y="164" width="52" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="165" y="164" width="52" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="260" y="164" width="52" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="355" y="164" width="52" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600">
    <text x="96" y="188">1</text><text x="191" y="188">2</text><text x="286" y="188">2</text><text x="381" y="188">1</text>
  </g>
  <line x1="124" y1="183" x2="161" y2="183" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="221" y1="183" x2="256" y2="183" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="353" y1="183" x2="318" y2="183" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="183" x2="411" y2="183" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="424" y="188" fill="#4169E1" font-size="12">second</text>
  <!-- compare chips: head side vs second side -->
  <rect x="70" y="240" width="40" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="150" y="240" width="40" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="130" y="262" text-anchor="middle" fill="#5c6b76" font-size="14">=</text>
  <rect x="280" y="240" width="40" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="360" y="240" width="40" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="340" y="262" text-anchor="middle" fill="#5c6b76" font-size="14">=</text>
  <g text-anchor="middle" font-weight="600">
    <text x="90" y="262">1</text><text x="170" y="262">1</text><text x="300" y="262">2</text><text x="380" y="262">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="90" y="290">head</text><text x="170" y="290">second</text>
  </g>
  <text x="470" y="263" font-size="15"><tspan fill="#5c6b76">→ </tspan><tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="40" y="316" fill="#1a2026" font-size="13">Reversed, the back half 2 → 1 reads 1 → 2 — the mirror of the front half 1 → 2.</text>
  <text x="40" y="336" fill="#1a2026" font-size="13">Lockstep pairs 1 = 1 and 2 = 2 all match, so 1-2-2-1 is a palindrome: <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
