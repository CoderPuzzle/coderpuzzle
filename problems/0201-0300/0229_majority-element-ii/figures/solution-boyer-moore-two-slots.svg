<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <!-- nums = [3,2,3]; slot boxes 84x46 at x = 278, 408, 538; columns = state after each element read; slot A y=164, slot B y=232 -->
  <text x="218" y="73" text-anchor="end" fill="#5c6b76" font-size="12.5">nums</text>
  <rect x="230" y="48" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="292" y="48" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="354" y="48" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="258" y="73" text-anchor="middle" font-weight="600">3</text>
  <text x="320" y="73" text-anchor="middle" font-weight="600">2</text>
  <text x="382" y="73" text-anchor="middle" font-weight="600">3</text>
  <text x="40" y="116" fill="#5c6b76" font-size="12">match raises cnt; a zero-cnt slot adopts a stranger; both full, no match → both drop.</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="320" y="150">after 3</text><text x="450" y="150">after 2</text><text x="580" y="150">after 3</text>
  </g>
  <text x="266" y="190" text-anchor="end" fill="#5c6b76" font-size="12.5">slot A</text>
  <text x="266" y="258" text-anchor="end" fill="#5c6b76" font-size="12.5">slot B</text>
  <!-- slot A row -->
  <rect x="278" y="164" width="84" height="46" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="408" y="164" width="84" height="46" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="538" y="164" width="84" height="46" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="320" y="185">3</text><text x="450" y="185">3</text><text x="580" y="185" fill="#4169E1">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="320" y="202">cnt 1</text><text x="450" y="202">cnt 1</text><text x="580" y="202" fill="#4169E1">cnt 2</text>
  </g>
  <!-- slot B row -->
  <rect x="278" y="232" width="84" height="46" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="408" y="232" width="84" height="46" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="538" y="232" width="84" height="46" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#9aa7b2">
    <text x="320" y="253">—</text><text x="450" y="253">2</text><text x="580" y="253">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="320" y="270">cnt 0</text><text x="450" y="270">cnt 1</text><text x="580" y="270">cnt 1</text>
  </g>
  <text x="40" y="304" fill="#1a2026" font-size="13">Verify pass: 3 really occurs 2 &gt; ⌊3/3⌋ = 1 and stays; 2 occurs 1, not &gt; 1, and drops.</text>
  <text x="40" y="324" fill="#1a2026" font-size="13">The survivors of the vote sort to the answer: <tspan fill="#4169E1" font-weight="600">[3]</tspan>.</text>
</svg>
