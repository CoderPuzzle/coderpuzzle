<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 266" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="266" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- currentState = "++++"; flips: i=0 (opponent wins), i=1 (no plus-pair left, opponent loses), i=2 (opponent wins); run multisets {4} → {2}, {}, {2} -->
  <text x="320" y="28" text-anchor="middle" fill="#5c6b76" font-size="11.5">first player to move</text>
  <rect x="278" y="38" width="84" height="32" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="320" y="59" text-anchor="middle" font-weight="600">++++</text>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 320 70 L 140 120" marker-end="url(#arrow)"/>
    <path d="M 320 70 L 320 120" marker-end="url(#arrow)"/>
    <path d="M 320 70 L 500 120" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11.5" fill="#5c6b76">
    <text x="210" y="97" text-anchor="end">flip 0-1</text>
    <text x="308" y="97" text-anchor="end">flip 1-2</text>
    <text x="432" y="97">flip 2-3</text>
  </g>
  <rect x="98" y="124" width="84" height="32" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="278" y="124" width="84" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="458" y="124" width="84" height="32" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600">
    <text x="140" y="145">--++</text><text x="320" y="145" fill="#4169E1">+--+</text><text x="500" y="145">++--</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="140" y="178" fill="#5c6b76">canWin = true</text>
    <text x="320" y="178" fill="#4169E1" font-weight="600">canWin = false</text>
    <text x="500" y="178" fill="#5c6b76">canWin = true</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="140" y="196" fill="#9aa7b2">opp → ---- : we lose</text>
    <text x="320" y="196" fill="#1a2026">opponent stuck — we win</text>
    <text x="500" y="196" fill="#9aa7b2">opp → ---- : we lose</text>
  </g>
  <text x="320" y="234" text-anchor="middle" fill="#1a2026" font-size="13">In run lengths {4} splits into {2}, {} and {2} — the memo treats the twins as one;</text>
  <text x="320" y="252" text-anchor="middle" fill="#1a2026" font-size="13">only the middle flip <tspan fill="#4169E1" font-weight="600">+--+ </tspan>hands the opponent a moveless position, so the first player wins.</text>
</svg>
