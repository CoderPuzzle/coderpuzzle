<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 252" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- edges [[0,1],[1,2],[2,3],[1,3],[1,4]]: the triangle 1-2-3 is a cycle -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="200" y1="58" x2="200" y2="92"/>
    <line x1="218" y1="110" x2="312" y2="110"/>
  </g>
  <g stroke="#4169E1" stroke-width="3">
    <line x1="186" y1="121" x2="124" y2="169"/>
    <line x1="128" y1="180" x2="272" y2="180"/>
    <line x1="214" y1="121" x2="276" y2="169"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="200" cy="40" r="18"/>
    <circle cx="330" cy="110" r="18"/>
  </g>
  <g fill="#e5ebfa" stroke="#4169E1" stroke-width="2">
    <circle cx="200" cy="110" r="18"/>
    <circle cx="110" cy="180" r="18"/>
    <circle cx="290" cy="180" r="18"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="200" y="45">0</text>
    <text x="330" y="115">4</text>
    <text x="200" y="115">1</text>
    <text x="110" y="185">2</text>
    <text x="290" y="185">3</text>
  </g>
  <text x="210" y="240" text-anchor="middle" fill="#5c6b76" font-size="12.5">edge 1-3 closes the cycle 1 - 2 - 3: not a tree</text>
</svg>
