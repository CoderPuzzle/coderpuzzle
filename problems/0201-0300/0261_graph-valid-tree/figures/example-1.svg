<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- edges [[0,1],[0,2],[0,3],[1,4]] -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="236" y1="61" x2="164" y2="119"/>
    <line x1="250" y1="68" x2="250" y2="112"/>
    <line x1="264" y1="61" x2="336" y2="119"/>
    <line x1="150" y1="148" x2="150" y2="192"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="250" cy="50" r="18"/>
    <circle cx="150" cy="130" r="18"/>
    <circle cx="250" cy="130" r="18"/>
    <circle cx="350" cy="130" r="18"/>
    <circle cx="150" cy="210" r="18"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="250" y="55">0</text>
    <text x="150" y="135">1</text>
    <text x="250" y="135">2</text>
    <text x="350" y="135">3</text>
    <text x="150" y="215">4</text>
  </g>
  <text x="250" y="250" text-anchor="middle" fill="#5c6b76" font-size="12.5">5 nodes, 4 edges, connected and acyclic: a valid tree</text>
</svg>
