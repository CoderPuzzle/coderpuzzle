<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums sorted = [2,3,4,5]; cells 96x48 at x = 98 + 116i, y = 110.
       Lower half feeds i, upper half feeds j starting at (n + 1) // 2 = 2.
       Match: 2 x 2 = 4 &lt;= 4 pairs (i = 0, j = 2); then 2 x 3 = 6 &gt; 5 stops.
       Answer 2 x 1 = 2. -->
  <text x="320" y="80" text-anchor="middle" fill="#9aa7b2" font-size="11">midpoint</text>
  <path d="M 320 88 L 320 106" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="146" y="100" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">i = 0</text>
  <text x="262" y="100" text-anchor="middle" fill="#9aa7b2" font-size="12.5">i = 1</text>
  <text x="378" y="100" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">j = 2</text>
  <text x="494" y="100" text-anchor="middle" fill="#9aa7b2" font-size="12.5">j = 3</text>
  <text x="18" y="120" fill="#9aa7b2" font-size="12">lower half</text>
  <text x="560" y="120" fill="#9aa7b2" font-size="12">upper half</text>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="98" y="110" width="96" height="48"/>
    <rect x="330" y="110" width="96" height="48"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="#ffffff">
    <rect x="214" y="110" width="96" height="48"/>
    <rect x="446" y="110" width="96" height="48"/>
  </g>
  <g text-anchor="middle">
    <text x="146" y="138" font-size="16" font-weight="600" fill="#1a2026">2</text>
    <text x="262" y="138" font-size="16" font-weight="600" fill="#9aa7b2">3</text>
    <text x="378" y="138" font-size="16" font-weight="600" fill="#1a2026">4</text>
    <text x="494" y="138" font-size="16" font-weight="600" fill="#9aa7b2">5</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="146" y="152">0</text><text x="262" y="152">1</text><text x="378" y="152">2</text><text x="494" y="152">3</text>
  </g>
  <path d="M 146 164 Q 262 212 378 164" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="206" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">2 &#215; 2 = 4 &#8804; 4 &#8594; match, i++</text>
  <path d="M 262 164 Q 378 194 494 164" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowmuted)"/>
  <text x="440" y="196" text-anchor="middle" fill="#9aa7b2" font-size="12.5">2 &#215; 3 = 6 &gt; 5 &#8594; stop</text>
  <text x="320" y="262" text-anchor="middle" fill="#1a2026" font-size="13">j starts at (n + 1) // 2 = 2; 2 &#215; 2 = 4 &#8804; 4 pairs 2 with 4 and i advances.</text>
  <text x="320" y="281" text-anchor="middle" fill="#1a2026" font-size="13">Then 2 &#215; 3 = 6 &gt; 5 fails, leaving 3 and 5 unmarked &#8212; answer 2 &#215; 1 = <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
