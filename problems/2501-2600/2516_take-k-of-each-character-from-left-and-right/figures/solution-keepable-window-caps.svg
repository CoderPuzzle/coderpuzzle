<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="214" fill="#ffffff"/>
  <!-- s = aabaaaacaabc, k = 2; totals a=8 b=2 c=2 give caps a<=6 b<=0 c<=0; cells 42x40 at x=68+42i, y=60; longest keepable window = indices 3..6 -->
  <text x="320" y="24" text-anchor="middle" fill="#5c6b76" font-size="13">totals from one pass: a = 8, b = 2, c = 2 → caps (total − k = 2): a ≤ 6, b ≤ 0, c ≤ 0</text>
  <path d="M 194 54 L 194 46 L 362 46 L 362 54" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="278" y="40" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">kept: aaaa (4 a's ≤ cap 6)</text>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#f0f3f7">
    <rect x="68" y="60" width="42" height="40"/><rect x="110" y="60" width="42" height="40"/><rect x="152" y="60" width="42" height="40"/>
    <rect x="362" y="60" width="42" height="40"/><rect x="404" y="60" width="42" height="40"/><rect x="446" y="60" width="42" height="40"/>
    <rect x="488" y="60" width="42" height="40"/><rect x="530" y="60" width="42" height="40"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <rect x="194" y="60" width="42" height="40"/><rect x="236" y="60" width="42" height="40"/>
    <rect x="278" y="60" width="42" height="40"/><rect x="320" y="60" width="42" height="40"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="89" y="85" fill="#9aa7b2">a</text><text x="131" y="85" fill="#9aa7b2">a</text><text x="173" y="85" fill="#9aa7b2">b</text>
    <text x="215" y="85" fill="#1a2026">a</text><text x="257" y="85" fill="#1a2026">a</text><text x="299" y="85" fill="#1a2026">a</text><text x="341" y="85" fill="#1a2026">a</text>
    <text x="383" y="85" fill="#9aa7b2">c</text><text x="425" y="85" fill="#9aa7b2">a</text><text x="467" y="85" fill="#9aa7b2">a</text>
    <text x="509" y="85" fill="#9aa7b2">b</text><text x="551" y="85" fill="#9aa7b2">c</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="89" y="118" fill="#9aa7b2">0</text><text x="131" y="118" fill="#9aa7b2">1</text><text x="173" y="118" fill="#9aa7b2">2</text>
    <text x="215" y="118" fill="#5c6b76">3</text><text x="257" y="118" fill="#5c6b76">4</text><text x="299" y="118" fill="#5c6b76">5</text><text x="341" y="118" fill="#5c6b76">6</text>
    <text x="383" y="118" fill="#9aa7b2">7</text><text x="425" y="118" fill="#9aa7b2">8</text><text x="467" y="118" fill="#9aa7b2">9</text>
    <text x="509" y="118" fill="#9aa7b2">10</text><text x="551" y="118" fill="#9aa7b2">11</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="131" y="140" fill="#5c6b76">take 3: aab (2a, 1b)</text>
    <text x="467" y="140" fill="#5c6b76">take 5: caabc (2a, 1b, 2c)</text>
  </g>
  <text x="40" y="176" fill="#1a2026" font-size="13">Longest window within caps a ≤ 6, b ≤ 0, c ≤ 0 is aaaa (indices 3-6): <tspan fill="#4169E1" font-weight="600">12 - 4 = 8</tspan>.</text>
  <text x="40" y="194" fill="#1a2026" font-size="13">Take aab from the left, caabc from the right: 3 + 5 minutes, at least k = 2 of each.</text>
</svg>
