<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="540" height="210" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- panel frames -->
  <g fill="none" stroke="#42525e" stroke-width="1.5">
    <rect x="40" y="40" width="120" height="120"/>
    <rect x="210" y="40" width="120" height="120"/>
    <rect x="380" y="40" width="120" height="120"/>
    <line x1="40" y1="80" x2="160" y2="80"/><line x1="40" y1="120" x2="160" y2="120"/>
    <line x1="80" y1="40" x2="80" y2="160"/><line x1="120" y1="40" x2="120" y2="160"/>
    <line x1="210" y1="80" x2="330" y2="80"/><line x1="210" y1="120" x2="330" y2="120"/>
    <line x1="250" y1="40" x2="250" y2="160"/><line x1="290" y1="40" x2="290" y2="160"/>
    <line x1="380" y1="80" x2="500" y2="80"/><line x1="380" y1="120" x2="500" y2="120"/>
    <line x1="420" y1="40" x2="420" y2="160"/><line x1="460" y1="40" x2="460" y2="160"/>
  </g>
  <!-- query 1 region on panel 2: rows 1-2, cols 1-2 -->
  <rect x="250" y="80" width="80" height="80" fill="#dbe4f6"/>
  <!-- query 2 region on panel 3: rows 0-1, cols 0-1 -->
  <rect x="380" y="40" width="80" height="80" fill="#dbe4f6"/>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <rect x="40" y="40" width="120" height="120"/><rect x="210" y="40" width="120" height="120"/><rect x="380" y="40" width="120" height="120"/>
  </g>
  <g font-size="13" fill="#1a2026" text-anchor="middle">
    <text x="60" y="66">0</text><text x="100" y="66">0</text><text x="140" y="66">0</text>
    <text x="60" y="106">0</text><text x="100" y="106">0</text><text x="140" y="106">0</text>
    <text x="60" y="146">0</text><text x="100" y="146">0</text><text x="140" y="146">0</text>
    <text x="230" y="66">0</text><text x="270" y="66">0</text><text x="310" y="66">0</text>
    <text x="230" y="106">0</text><text x="270" y="106" font-weight="600">1</text><text x="310" y="106" font-weight="600">1</text>
    <text x="230" y="146">0</text><text x="270" y="146" font-weight="600">1</text><text x="310" y="146" font-weight="600">1</text>
    <text x="400" y="66" font-weight="600">1</text><text x="440" y="66" font-weight="600">1</text><text x="480" y="66">0</text>
    <text x="400" y="106" font-weight="600">1</text><text x="440" y="106" font-weight="600">2</text><text x="480" y="106" font-weight="600">1</text>
    <text x="400" y="146">0</text><text x="440" y="146" font-weight="600">1</text><text x="480" y="146" font-weight="600">1</text>
  </g>
  <line x1="164" y1="100" x2="204" y2="100" stroke="#42525e" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="334" y1="100" x2="374" y2="100" stroke="#42525e" stroke-width="1.8" marker-end="url(#a1)"/>
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="100" y="180">initial</text>
    <text x="270" y="180">after [1,1,2,2]</text>
    <text x="440" y="180">after [0,0,1,1]</text>
    <text x="270" y="204">Each query adds 1 to its shaded 2x2 block; the overlapping cell reaches 2.</text>
  </g>
</svg>
