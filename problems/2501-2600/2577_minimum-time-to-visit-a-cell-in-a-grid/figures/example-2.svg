<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="550" height="250" fill="#ffffff"/>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="100" y1="40" x2="268" y2="40"/><line x1="100" y1="96" x2="268" y2="96"/><line x1="100" y1="152" x2="268" y2="152"/><line x1="100" y1="208" x2="268" y2="208"/>
    <line x1="100" y1="40" x2="100" y2="208"/><line x1="156" y1="40" x2="156" y2="208"/><line x1="212" y1="40" x2="212" y2="208"/><line x1="268" y1="40" x2="268" y2="208"/>
  </g>
  <rect x="156" y="40" width="56" height="56" fill="#f6dede"/>
  <rect x="100" y="96" width="56" height="56" fill="#f6dede"/>
  <rect x="100" y="40" width="168" height="168" fill="none" stroke="#42525e" stroke-width="1.5"/>
  <g font-size="13" fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="128" y="72">0</text><text x="184" y="72" fill="#8c4a43">2</text><text x="240" y="72">4</text>
    <text x="128" y="128" fill="#8c4a43">3</text><text x="184" y="128">2</text><text x="240" y="128">1</text>
    <text x="128" y="184">1</text><text x="184" y="184">0</text><text x="240" y="184">4</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="300" y="66">From (0,0) at t = 0 the only moves</text>
    <text x="300" y="84">arrive at t = 1, but both neighbours</text>
    <text x="300" y="102">demand 2 and 3 — and waiting in</text>
    <text x="300" y="120">place is not allowed.</text>
    <text x="300" y="148" fill="#4169E1" font-weight="600">answer: -1</text>
  </g>
</svg>
