<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="260" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid 3x4 -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="100" y1="40" x2="324" y2="40"/><line x1="100" y1="96" x2="324" y2="96"/><line x1="100" y1="152" x2="324" y2="152"/><line x1="100" y1="208" x2="324" y2="208"/>
    <line x1="100" y1="40" x2="100" y2="208"/><line x1="156" y1="40" x2="156" y2="208"/><line x1="212" y1="40" x2="212" y2="208"/><line x1="268" y1="40" x2="268" y2="208"/><line x1="324" y1="40" x2="324" y2="208"/>
  </g>
  <!-- values, small, top-left of each cell -->
  <g font-size="11.5" fill="#5c6b76">
    <text x="106" y="56">0</text><text x="162" y="56">1</text><text x="218" y="56">3</text><text x="274" y="56">2</text>
    <text x="106" y="112">5</text><text x="162" y="112">1</text><text x="218" y="112">2</text><text x="274" y="112">5</text>
    <text x="106" y="168">4</text><text x="162" y="168">3</text><text x="218" y="168">8</text><text x="274" y="168">6</text>
  </g>
  <!-- path -->
  <g stroke="#4169E1" stroke-width="2.4" fill="none">
    <line x1="128" y1="68" x2="192" y2="68" marker-end="url(#a1)"/>
    <line x1="204" y1="82" x2="204" y2="112" marker-end="url(#a1)"/>
    <line x1="218" y1="124" x2="254" y2="124" marker-end="url(#a1)"/>
    <path d="M 254 116 Q 220 102 198 116" marker-end="url(#a1)"/>
    <path d="M 178 132 Q 212 146 230 132" marker-end="url(#a1)"/>
    <line x1="248" y1="124" x2="284" y2="124" marker-end="url(#a1)"/>
    <line x1="318" y1="138" x2="318" y2="174" marker-end="url(#a1)"/>
  </g>
  <g font-size="11.5" fill="#4169E1">
    <text x="106" y="90" font-weight="600">t=0</text>
    <text x="296" y="112" font-weight="600">t=6</text>
    <text x="330" y="196" font-weight="600">t=7</text>
    <text x="286" y="112" text-anchor="end">bounce</text>
    <text x="204" y="164">t=4, t=5</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="360" y="60">Walk right, down, right — then bounce</text>
    <text x="360" y="78">between (1,1) and (1,2) to burn time</text>
    <text x="360" y="96">until grid[1][3] = 5 unlocks.</text>
    <text x="360" y="124" fill="#4169E1" font-weight="600">Earliest arrival: t = 7</text>
  </g>
</svg>
