<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="476" fill="#ffffff"/>
  <!-- prizePositions=[1,1,2,2,3,3,5] k=2; cells x=70+60i w56 y40; window [1,3]=indices 0..5 (6 prizes), [3,5]=indices 4..6 (3 prizes);
       pre=[0,1,2,3,4,5,6,6], suf=[6,5,4,3,3,2,1,0]; table rows baseline y=252+22c; accent c=6: pre+suf = 6+1 = 7 (7 also at c=4, c=5) -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="70" y="40" width="56" height="36"/><rect x="130" y="40" width="56" height="36"/><rect x="190" y="40" width="56" height="36"/>
    <rect x="250" y="40" width="56" height="36"/><rect x="310" y="40" width="56" height="36"/><rect x="370" y="40" width="56" height="36"/>
    <rect x="430" y="40" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="98" y="63">1</text><text x="158" y="63">1</text><text x="218" y="63">2</text><text x="278" y="63">2</text>
    <text x="338" y="63">3</text><text x="398" y="63">3</text><text x="458" y="63">5</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="98" y="92">0</text><text x="158" y="92">1</text><text x="218" y="92">2</text><text x="278" y="92">3</text>
    <text x="338" y="92">4</text><text x="398" y="92">5</text><text x="458" y="92">6</text>
  </g>
  <path d="M 70 100 V 114 H 426 V 100" fill="none" stroke="#4169E1" stroke-width="2"/>
  <path d="M 370 146 V 160 H 486 V 146" fill="none" stroke="#1a2026" stroke-width="1.6"/>
  <text x="248" y="134" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">window [1,3]: 6 prizes</text>
  <text x="428" y="180" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12.5">window [3,5]: 3 prizes</text>
  <text x="278" y="202" text-anchor="middle" fill="#5c6b76" font-size="12">the two brackets share indices 4, 5 (position 3)</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="100" y="232">cut c</text>
    <text x="230" y="232">pre[c]</text>
    <text x="350" y="232">suf[c]</text>
    <text x="460" y="232">pre + suf</text>
  </g>
  <rect x="28" y="368" width="624" height="26" rx="6" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="100" y="252">0</text><text x="100" y="274">1</text><text x="100" y="296">2</text><text x="100" y="318">3</text>
    <text x="100" y="340">4</text><text x="100" y="362">5</text><text x="100" y="384">6</text><text x="100" y="406">7</text>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="230" y="252">0</text><text x="230" y="274">1</text><text x="230" y="296">2</text><text x="230" y="318">3</text>
    <text x="230" y="340">4</text><text x="230" y="362">5</text><text x="230" y="384" fill="#4169E1" font-weight="600">6</text><text x="230" y="406">6</text>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="350" y="252">6</text><text x="350" y="274">5</text><text x="350" y="296">4</text><text x="350" y="318">3</text>
    <text x="350" y="340">3</text><text x="350" y="362">2</text><text x="350" y="384" fill="#4169E1" font-weight="600">1</text><text x="350" y="406">0</text>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="460" y="252" fill="#1a2026">6</text><text x="460" y="274" fill="#1a2026">6</text><text x="460" y="296" fill="#1a2026">6</text>
    <text x="460" y="318" fill="#1a2026">6</text><text x="460" y="340" fill="#4169E1" font-weight="600">7</text>
    <text x="460" y="362" fill="#4169E1" font-weight="600">7</text>
    <text x="460" y="385" fill="#4169E1" font-weight="700" font-size="15">7</text>
    <text x="460" y="406" fill="#1a2026">6</text>
  </g>
  <text x="600" y="384" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">[1,3] + [3,5] split</text>
  <text x="340" y="440" text-anchor="middle" fill="#1a2026" font-size="13">Any two segments split across some index cut: the answer is max over cuts of</text>
  <text x="340" y="458" text-anchor="middle" fill="#1a2026" font-size="13">pre[c] + suf[c] = <tspan fill="#4169E1" font-weight="600">7</tspan> — segments [1,3] and [3,5] win 6 prizes below cut 6, 1 above.</text>
</svg>
