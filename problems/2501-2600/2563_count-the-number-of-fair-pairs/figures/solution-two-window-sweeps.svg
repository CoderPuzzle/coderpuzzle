<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums sorted = [0,1,4,4,5,7]; cells 76x44 at x = 52 + 92i, y = 118.
       count(sum &lt;= 6): counting arcs lo 0 -&gt; hi 4 (+4) and lo 1 -&gt; hi 4 (+3),
       retreats 0+7, 4+5, 4+4 &gt; 6. count(sum &lt;= 2): arc lo 0 -&gt; hi 1 (+1),
       dashed arrow = hi retreating 5 -&gt; 1. 7 - 1 = 6. -->
  <text x="52" y="32" fill="#5c6b76" font-size="12.5">count(sum &#8804; 6)</text>
  <text x="588" y="32" text-anchor="end" fill="#9aa7b2" font-size="12">retreats: 0+7, 4+5, 4+4 &gt; 6 &#8594; hi--</text>
  <path d="M 90 112 Q 274 30 458 112" fill="none" stroke="#4169E1" stroke-width="2"/>
  <path d="M 182 112 Q 320 86 458 112" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="274" y="65" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">+4</text>
  <text x="320" y="93" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">+3</text>
  <text x="40" y="104" fill="#5c6b76" font-size="12.5">sorted</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="52" y="118" width="76" height="44"/><rect x="144" y="118" width="76" height="44"/>
    <rect x="236" y="118" width="76" height="44"/><rect x="328" y="118" width="76" height="44"/>
    <rect x="420" y="118" width="76" height="44"/><rect x="512" y="118" width="76" height="44"/>
  </g>
  <g text-anchor="middle">
    <text x="90" y="140" font-weight="600" font-size="15" fill="#1a2026">0</text>
    <text x="182" y="140" font-weight="600" font-size="15" fill="#1a2026">1</text>
    <text x="274" y="140" font-weight="600" font-size="15" fill="#1a2026">4</text>
    <text x="366" y="140" font-weight="600" font-size="15" fill="#1a2026">4</text>
    <text x="458" y="140" font-weight="600" font-size="15" fill="#1a2026">5</text>
    <text x="550" y="140" font-weight="600" font-size="15" fill="#1a2026">7</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="90" y="156">0</text><text x="182" y="156">1</text><text x="274" y="156">2</text>
    <text x="366" y="156">3</text><text x="458" y="156">4</text><text x="550" y="156">5</text>
  </g>
  <text x="52" y="186" fill="#5c6b76" font-size="12.5">count(sum &#8804; 2)</text>
  <path d="M 90 196 Q 136 254 182 196" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="136" y="243" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">+1</text>
  <path d="M 550 178 Q 366 244 182 178" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">Each arc joins lo to hi, banking hi &#8722; lo: 4 + 3 = 7 pairs at limit 6,</text>
  <text x="320" y="303" text-anchor="middle" fill="#1a2026" font-size="13">and 0 + 1 banks 1 pair at limit 2 &#8212; answer 7 &#8722; 1 = <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
