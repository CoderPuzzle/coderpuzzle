<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [2,4,6] sorted, k = 2; levels i=0,1,2; leaves = the subsets at dfs(3) -->
  <text x="320" y="36" text-anchor="middle" fill="#5c6b76" font-size="12.5">sorted nums = [2, 4, 6], k = 2 — take-or-skip recursion</text>
  <text x="20" y="134" fill="#5c6b76" font-size="11.5">i=0</text>
  <text x="20" y="194" fill="#5c6b76" font-size="11.5">i=1</text>
  <text x="20" y="254" fill="#5c6b76" font-size="11.5">i=2</text>
  <!-- skip edges (gray) -->
  <g stroke="#5c6b76" stroke-width="1.4" fill="none" marker-end="url(#arrowG)">
    <path d="M 336 80 L 197 122"/>
    <path d="M 176 137 L 113 181"/>
    <path d="M 94 197 L 82 234"/>
    <path d="M 261 197 L 235 234"/>
    <path d="M 495 137 L 452 181"/>
    <path d="M 431 197 L 405 234"/>
  </g>
  <!-- take edges (accent) -->
  <g stroke="#4169E1" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M 356 80 L 496 122"/>
    <path d="M 198 137 L 262 181"/>
    <path d="M 122 197 L 140 234"/>
    <path d="M 453 197 L 478 234"/>
  </g>
  <!-- pruned take edges (dashed muted) -->
  <g stroke="#9aa7b2" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowM)">
    <path d="M 283 197 L 305 234"/>
    <path d="M 517 137 L 563 176"/>
  </g>
  <!-- decision node dots -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <circle cx="346" cy="72" r="9"/>
    <circle cx="187" cy="130" r="8"/><circle cx="506" cy="130" r="8"/>
    <circle cx="103" cy="190" r="8"/><circle cx="272" cy="190" r="8"/>
    <circle cx="442" cy="190" r="8"/>
  </g>
  <!-- edge labels -->
  <g text-anchor="middle" font-size="11">
    <text x="252" y="96" fill="#5c6b76">skip</text>
    <text x="440" y="96" fill="#4169E1" font-weight="600">take 2</text>
    <text x="134" y="156" fill="#5c6b76">skip</text>
    <text x="254" y="156" fill="#4169E1" font-weight="600">take 4</text>
    <text x="58" y="222" fill="#5c6b76">skip</text>
    <text x="164" y="224" fill="#4169E1" font-weight="600">take 6</text>
    <text x="226" y="226" fill="#5c6b76">skip</text>
    <text x="330" y="224" fill="#9aa7b2">take 6</text>
    <text x="386" y="226" fill="#5c6b76">skip</text>
    <text x="500" y="224" fill="#4169E1" font-weight="600">take 6</text>
    <text x="566" y="152" fill="#9aa7b2">take 4</text>
  </g>
  <!-- leaves and pruned chips -->
  <g text-anchor="middle">
    <rect x="38" y="237" width="60" height="26" rx="6" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <text x="68" y="254" fill="#5c6b76" font-size="12">{}</text>
    <rect x="112" y="237" width="66" height="26" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="145" y="254" fill="#1a2026" font-size="12" font-weight="600">{6}</text>
    <rect x="197" y="237" width="66" height="26" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="230" y="254" fill="#1a2026" font-size="12" font-weight="600">{4}</text>
    <rect x="278" y="237" width="74" height="26" rx="6" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="315" y="254" fill="#9aa7b2" font-size="11.5">pruned</text>
    <rect x="368" y="237" width="64" height="26" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="400" y="254" fill="#1a2026" font-size="12" font-weight="600">{2}</text>
    <rect x="446" y="237" width="78" height="26" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="485" y="254" fill="#1a2026" font-size="12" font-weight="600">{2, 6}</text>
    <rect x="532" y="178" width="76" height="24" rx="6" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="570" y="194" fill="#9aa7b2" font-size="11.5">pruned</text>
  </g>
  <text x="315" y="281" text-anchor="middle" fill="#9aa7b2" font-size="11">cnt[6 − 2] = 1</text>
  <text x="570" y="219" text-anchor="middle" fill="#9aa7b2" font-size="11">cnt[4 − 2] = 1</text>
  <text x="320" y="305" text-anchor="middle" fill="#1a2026" font-size="13">Each leaf is one valid selection: 5 leaves − the empty set = <tspan fill="#4169E1" font-weight="600">4</tspan> non-empty subsets.</text>
  <text x="320" y="325" text-anchor="middle" fill="#1a2026" font-size="13">Keeping both 2 and 4 (or 4 and 6) has Δ = k = 2, so the cnt[nums[i] − k] check prunes it.</text>
</svg>
