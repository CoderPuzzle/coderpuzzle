<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="294" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- sorted nums = pool = [1,1,1,2,3,3,5]; greedy pairs pool 2->demand 1, 3->1, 3->1, 5->2; pool 1s skipped; greatness 4 -->
  <!-- demand row: cells 64x40 at x=140, y=70 -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="140" y="70" width="64" height="40" fill="#dbe4fb"/><rect x="204" y="70" width="64" height="40" fill="#dbe4fb"/>
    <rect x="268" y="70" width="64" height="40" fill="#dbe4fb"/><rect x="332" y="70" width="64" height="40" fill="#dbe4fb"/>
    <rect x="396" y="70" width="64" height="40" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="460" y="70" width="64" height="40" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="524" y="70" width="64" height="40" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="172" y="95" fill="#1a2026">1</text><text x="236" y="95" fill="#1a2026">1</text>
    <text x="300" y="95" fill="#1a2026">1</text><text x="364" y="95" fill="#1a2026">2</text>
    <text x="428" y="95" fill="#9aa7b2">3</text><text x="492" y="95" fill="#9aa7b2">3</text>
    <text x="556" y="95" fill="#9aa7b2">5</text>
  </g>
  <text x="492" y="128" text-anchor="middle" fill="#9aa7b2" font-size="11.5">pool spent &#8212; 3, 3, 5 stay unmatched</text>
  <!-- pool row: cells 64x40 at x=140, y=190 -->
  <g stroke-width="1.4">
    <rect x="140" y="190" width="64" height="40" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="204" y="190" width="64" height="40" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="268" y="190" width="64" height="40" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="332" y="190" width="64" height="40" fill="#dbe4fb" stroke="#42525e"/>
    <rect x="396" y="190" width="64" height="40" fill="#dbe4fb" stroke="#42525e"/><rect x="460" y="190" width="64" height="40" fill="#dbe4fb" stroke="#42525e"/>
    <rect x="524" y="190" width="64" height="40" fill="#dbe4fb" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="172" y="215" fill="#9aa7b2">1</text><text x="236" y="215" fill="#9aa7b2">1</text>
    <text x="300" y="215" fill="#9aa7b2">1</text><text x="364" y="215" fill="#1a2026">2</text>
    <text x="428" y="215" fill="#1a2026">3</text><text x="492" y="215" fill="#1a2026">3</text>
    <text x="556" y="215" fill="#1a2026">5</text>
  </g>
  <text x="150" y="181" fill="#9aa7b2" font-size="11.5">the three pool 1s can never win</text>
  <!-- greedy win arrows: pool value up to the demand it beats -->
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 364 186 C 364 150 172 146 172 114" marker-end="url(#arrowB)"/>
    <path d="M 428 186 C 428 155 236 148 236 114" marker-end="url(#arrowB)"/>
    <path d="M 492 186 C 492 160 300 152 300 114" marker-end="url(#arrowB)"/>
    <path d="M 556 186 C 556 165 364 156 364 114" marker-end="url(#arrowB)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="11.5">
    <text x="392" y="181">2 &#8594; 1</text><text x="456" y="181">3 &#8594; 1</text>
    <text x="520" y="181">3 &#8594; 1</text><text x="584" y="181">5 &#8594; 2</text>
  </g>
  <g text-anchor="end">
    <text x="128" y="94" fill="#1a2026" font-size="12.5">demand (sorted)</text>
    <text x="128" y="214" fill="#1a2026" font-size="12.5">pool (sorted)</text>
  </g>
  <text x="320" y="258" text-anchor="middle" fill="#1a2026" font-size="13">The pool spends its smallest value that beats each demand: 2&#8594;1, 3&#8594;1, 3&#8594;1, 5&#8594;2.</text>
  <text x="320" y="278" text-anchor="middle" fill="#1a2026" font-size="13">Pool 1s never win; demands 3, 3, 5 go unmatched &#8212; greatness <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
