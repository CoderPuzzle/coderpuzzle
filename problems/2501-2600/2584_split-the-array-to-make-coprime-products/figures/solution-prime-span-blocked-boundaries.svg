<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- nums = [4,7,8,15,3,5]; prime spans 2:[0,2] 3:[3,4] 5:[3,5], 7 single; blocked boundaries 0,1,3,4; first free boundary i=2 -->
  <!-- array cells 64x44 at x=130, y=50 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="130" y="50" width="64" height="44"/><rect x="194" y="50" width="64" height="44"/>
    <rect x="258" y="50" width="64" height="44"/><rect x="322" y="50" width="64" height="44"/>
    <rect x="386" y="50" width="64" height="44"/><rect x="450" y="50" width="64" height="44"/>
  </g>
  <g text-anchor="middle">
    <text x="162" y="72" font-weight="600">4</text><text x="226" y="72" font-weight="600">7</text>
    <text x="290" y="72" font-weight="600">8</text><text x="354" y="72" font-weight="600">15</text>
    <text x="418" y="72" font-weight="600">3</text><text x="482" y="72" font-weight="600">5</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="162" y="88">2&#183;2</text><text x="226" y="88">7</text><text x="290" y="88">2&#183;2&#183;2</text>
    <text x="354" y="88">3&#183;5</text><text x="418" y="88">3</text><text x="482" y="88">5</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="162" y="110">0</text><text x="226" y="110">1</text><text x="290" y="110">2</text>
    <text x="354" y="110">3</text><text x="418" y="110">4</text><text x="482" y="110">5</text>
  </g>
  <!-- prime occurrence spans -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4">
    <rect x="130" y="124" width="192" height="20"/>
    <rect x="322" y="152" width="128" height="20"/>
    <rect x="322" y="180" width="192" height="20"/>
  </g>
  <g text-anchor="end" font-size="12.5">
    <text x="120" y="138" fill="#1a2026">prime 2&#160;&#160;[0,2]</text>
    <text x="120" y="166" fill="#1a2026">prime 3&#160;&#160;[3,4]</text>
    <text x="120" y="194" fill="#1a2026">prime 5&#160;&#160;[3,5]</text>
    <text x="120" y="222" fill="#9aa7b2">prime 7&#160;&#160;[1,1]</text>
  </g>
  <text x="140" y="222" fill="#9aa7b2" font-size="12">first = last &#8212; straddles nothing</text>
  <!-- boundary lane: boundary i sits between cell i and i+1 -->
  <g stroke="#9aa7b2" stroke-width="2.5">
    <line x1="194" y1="244" x2="194" y2="258"/><line x1="258" y1="244" x2="258" y2="258"/>
    <line x1="386" y1="244" x2="386" y2="258"/><line x1="450" y1="244" x2="450" y2="258"/>
  </g>
  <line x1="322" y1="238" x2="322" y2="258" stroke="#4169E1" stroke-width="3.5"/>
  <g text-anchor="middle" font-size="13" fill="#9aa7b2">
    <text x="194" y="278">0</text><text x="258" y="278">1</text>
    <text x="386" y="278">3</text><text x="450" y="278">4</text>
  </g>
  <text x="322" y="279" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="15">2</text>
  <text x="320" y="304" text-anchor="middle" fill="#1a2026" font-size="13">Boundaries 0, 1 lie inside prime 2's span [0,2]; 3 and 4 inside prime 3's and 5's spans.</text>
  <text x="320" y="324" text-anchor="middle" fill="#1a2026" font-size="13">Only <tspan fill="#4169E1" font-weight="600">i = 2</tspan> is untouched: [4,7,8 | 15,3,5] gives gcd(224, 225) = 1 &#8212; output <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
