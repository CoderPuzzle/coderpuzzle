<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="292" fill="#ffffff"/>
  <!-- tasks [[2,3,1],[4,5,1],[1,5,2]]; latest-fit greedy books minute 3 then minute 5; task [1,5] already covered; on = {3,5} -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="186" y="58">1</text><text x="258" y="58">2</text><text x="330" y="58">3</text>
    <text x="402" y="58">4</text><text x="474" y="58">5</text>
  </g>
  <!-- task [2,3] dur 1: books minute 3 -->
  <rect x="222" y="70" width="144" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="294" y="70" width="72" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="330" y="87" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">3</text>
  <!-- task [4,5] dur 1: books minute 5 -->
  <rect x="366" y="110" width="144" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="438" y="110" width="72" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="474" y="127" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">5</text>
  <!-- task [1,5] dur 2: minutes 3 and 5 already on -->
  <rect x="150" y="150" width="360" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="294" y="150" width="72" height="24" fill="#dbe4fb"/>
  <rect x="438" y="150" width="72" height="24" fill="#dbe4fb"/>
  <text x="330" y="167" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12">3</text>
  <text x="474" y="167" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12">5</text>
  <!-- on lane -->
  <g stroke="#9aa7b2" stroke-width="1.3" fill="#f0f3f7">
    <rect x="150" y="198" width="72" height="28"/><rect x="222" y="198" width="72" height="28"/>
    <rect x="366" y="198" width="72" height="28"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="294" y="198" width="72" height="28"/><rect x="438" y="198" width="72" height="28"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">
    <text x="330" y="216">on</text><text x="474" y="216">on</text>
  </g>
  <g text-anchor="end">
    <text x="140" y="86" fill="#1a2026" font-size="12.5">task [2,3], dur 1</text>
    <text x="140" y="126" fill="#1a2026" font-size="12.5">task [4,5], dur 1</text>
    <text x="140" y="166" fill="#1a2026" font-size="12.5">task [1,5], dur 2</text>
    <text x="140" y="216" fill="#1a2026" font-size="12.5">computer on</text>
  </g>
  <text x="320" y="256" text-anchor="middle" fill="#1a2026" font-size="13">Each task books the latest free seconds walking back from its end: minute <tspan fill="#4169E1" font-weight="600">3</tspan>, then <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
  <text x="320" y="276" text-anchor="middle" fill="#1a2026" font-size="13">Task [1,5] finds both already on &#8212; the computer runs just minutes 3 and 5: answer <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
