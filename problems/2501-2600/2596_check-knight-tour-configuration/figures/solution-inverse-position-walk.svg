<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[0,11,16,5,20],[17,4,19,10,15],[12,1,8,21,6],[3,18,23,14,9],[24,13,2,7,22]]; cells 62x46 at (48,58); arrows hop visit v to v+1 -->
  <text x="203" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid of visit numbers</text>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="48" y="58" width="62" height="46"/><rect x="110" y="58" width="62" height="46"/><rect x="172" y="58" width="62" height="46"/><rect x="234" y="58" width="62" height="46"/><rect x="296" y="58" width="62" height="46"/>
    <rect x="48" y="104" width="62" height="46"/><rect x="110" y="104" width="62" height="46"/><rect x="172" y="104" width="62" height="46"/><rect x="234" y="104" width="62" height="46"/><rect x="296" y="104" width="62" height="46"/>
    <rect x="48" y="150" width="62" height="46"/><rect x="110" y="150" width="62" height="46"/><rect x="172" y="150" width="62" height="46"/><rect x="234" y="150" width="62" height="46"/><rect x="296" y="150" width="62" height="46"/>
    <rect x="48" y="196" width="62" height="46"/><rect x="110" y="196" width="62" height="46"/><rect x="172" y="196" width="62" height="46"/><rect x="234" y="196" width="62" height="46"/><rect x="296" y="196" width="62" height="46"/>
    <rect x="48" y="242" width="62" height="46"/><rect x="110" y="242" width="62" height="46"/><rect x="172" y="242" width="62" height="46"/><rect x="234" y="242" width="62" height="46"/><rect x="296" y="242" width="62" height="46"/>
  </g>
  <rect x="48" y="58" width="62" height="46" fill="none" stroke="#4169E1" stroke-width="2.2"/>
  <rect x="48" y="242" width="62" height="46" fill="none" stroke="#4169E1" stroke-width="2.2"/>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="79" y="86">0</text><text x="141" y="86">11</text><text x="203" y="86">16</text><text x="265" y="86">5</text><text x="327" y="86">20</text>
    <text x="79" y="132">17</text><text x="141" y="132">4</text><text x="203" y="132">19</text><text x="265" y="132">10</text><text x="327" y="132">15</text>
    <text x="79" y="178">12</text><text x="141" y="178">1</text><text x="203" y="178">8</text><text x="265" y="178">21</text><text x="327" y="178">6</text>
    <text x="79" y="224">3</text><text x="141" y="224">18</text><text x="203" y="224">23</text><text x="265" y="224">14</text><text x="327" y="224">9</text>
    <text x="79" y="270">24</text><text x="141" y="270">13</text><text x="203" y="270">2</text><text x="265" y="270">7</text><text x="327" y="270">22</text>
  </g>
  <!-- 24 hops of the inverse walk, each shifted 6px alternating so the lines skirt the cell numbers -->
  <g stroke="#42525e" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M 151.6 177.9 L 200.2 250.0"/>
    <path d="M 195.7 255.9 L 94.2 218.2"/>
    <path d="M 79.6 207.4 L 128.2 135.3"/>
    <path d="M 152.5 129.1 L 254.0 91.5"/>
    <path d="M 275.6 85.9 L 324.2 158.0"/>
    <path d="M 316.4 177.9 L 267.8 250.0"/>
    <path d="M 254.4 260.1 L 205.8 188.0"/>
    <path d="M 210.3 182.1 L 311.8 219.8"/>
    <path d="M 316.4 214.1 L 267.8 142.0"/>
    <path d="M 257.7 117.9 L 156.2 80.2"/>
    <path d="M 140.4 92.6 L 91.8 164.7"/>
    <path d="M 79.6 184.6 L 128.2 256.7"/>
    <path d="M 148.3 255.9 L 249.8 218.2"/>
    <path d="M 275.6 214.1 L 324.2 142.0"/>
    <path d="M 315.5 129.1 L 214.0 91.5"/>
    <path d="M 191.5 78.9 L 90.0 116.5"/>
    <path d="M 89.6 131.9 L 138.2 204.0"/>
    <path d="M 151.6 214.1 L 200.2 142.0"/>
    <path d="M 210.3 117.9 L 311.8 80.2"/>
    <path d="M 316.4 85.9 L 267.8 158.0"/>
    <path d="M 275.6 177.9 L 324.2 250.0"/>
    <path d="M 195.7 228.1 L 94.2 265.8"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.2" fill="none" marker-end="url(#arrowB)">
    <path d="M 79.6 92.6 L 128.2 164.7"/>
    <path d="M 319.7 255.9 L 218.2 218.2"/>
  </g>
  <!-- right panel: the arithmetic knight-delta test -->
  <text x="506" y="70" text-anchor="middle" fill="#5c6b76" font-size="12.5">inverse table: visit t maps to its cell</text>
  <rect x="392" y="84" width="232" height="64" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="506" y="110" text-anchor="middle" fill="#1a2026" font-size="12.5">hop t−1 → t passes iff the deltas</text>
  <text x="506" y="132" text-anchor="middle" fill="#1a2026" font-size="12.5">are (1, 2) or (2, 1), any signs</text>
  <rect x="392" y="164" width="232" height="64" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="506" y="190" text-anchor="middle" fill="#1a2026" font-size="12.5">hop 0 → 1: Δ(2, 1) — passes</text>
  <text x="506" y="212" text-anchor="middle" fill="#1a2026" font-size="12.5">hop 22 → 23: Δ(1, 2) — passes</text>
  <text x="506" y="262" text-anchor="middle" fill="#1a2026" font-size="13">all <tspan fill="#4169E1" font-weight="600">24 of 24</tspan> hops pass → <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">Walking visits 1…24 through the inverse table, every hop has {|dr|, |dc|} = {1, 2},</text>
  <text x="320" y="336" text-anchor="middle" fill="#1a2026" font-size="13">so the tour 0 → 1 → … → 24 is one valid knight walk and the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
