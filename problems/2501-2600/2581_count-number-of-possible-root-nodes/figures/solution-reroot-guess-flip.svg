<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- edges 0-1, 1-2, 1-3, 4-2; guesses [[1,3],[0,1],[1,0],[2,4]]; root 0 hits (1,3),(0,1),(2,4)=3; reroot to 1: lose (0,1), gain (1,0)=3 -->
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="13">
    <text x="100" y="40">root = 0</text>
    <text x="580" y="40">root = 1</text>
  </g>
  <!-- left tree oriented from root 0 -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 100 96 L 100 140" marker-end="url(#arrow)"/>
    <path d="M 90.9 173.2 L 56.3 223.5" marker-end="url(#arrow)"/>
    <path d="M 110.1 172.4 L 152.4 224.5" marker-end="url(#arrow)"/>
    <path d="M 45 256 L 45 300" marker-end="url(#arrow)"/>
  </g>
  <g stroke-width="1.7">
    <circle cx="100" cy="80" r="16" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="100" cy="160" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="45" cy="240" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="165" cy="240" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="45" cy="320" r="16" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="13.5">
    <text x="100" y="85">0</text><text x="100" y="165">1</text><text x="45" y="245">2</text>
    <text x="165" y="245">3</text><text x="45" y="325">4</text>
  </g>
  <g font-size="12.5">
    <text x="118" y="124" fill="#4169E1" font-weight="600">(0,1) hit</text>
    <text x="82" y="124" fill="#9aa7b2" text-anchor="end">(1,0) miss</text>
    <text x="150" y="210" fill="#4169E1" font-weight="600">(1,3) hit</text>
    <text x="63" y="284" fill="#4169E1" font-weight="600">(2,4) hit</text>
  </g>
  <!-- rerooting arrow -->
  <path d="M 222 200 L 498 200" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="360" y="180" text-anchor="middle" fill="#5c6b76" font-size="12.5">move the root across edge 0&#8211;1</text>
  <text x="360" y="226" text-anchor="middle" fill="#5c6b76" font-size="12.5">only edge 0&#8211;1 flips direction</text>
  <!-- right tree oriented from root 1 -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 580 144 L 580 100" marker-end="url(#arrow)"/>
    <path d="M 570.9 173.2 L 536.3 223.5" marker-end="url(#arrow)"/>
    <path d="M 590.1 172.4 L 632.4 224.5" marker-end="url(#arrow)"/>
    <path d="M 525 256 L 525 300" marker-end="url(#arrow)"/>
  </g>
  <g stroke-width="1.7">
    <circle cx="580" cy="80" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="580" cy="160" r="16" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="525" cy="240" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="645" cy="240" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="525" cy="320" r="16" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="13.5">
    <text x="580" y="85">0</text><text x="580" y="165">1</text><text x="525" y="245">2</text>
    <text x="645" y="245">3</text><text x="525" y="325">4</text>
  </g>
  <g font-size="12.5">
    <text x="598" y="124" fill="#4169E1" font-weight="600">(1,0) hit</text>
    <text x="562" y="124" fill="#9aa7b2" text-anchor="end">(0,1) miss</text>
    <text x="594" y="210" fill="#4169E1" font-weight="600" text-anchor="end">(1,3) hit</text>
    <text x="543" y="284" fill="#4169E1" font-weight="600">(2,4) hit</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="105" y="360">correct guesses: <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="585" y="360">correct guesses: <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  </g>
  <text x="340" y="396" text-anchor="middle" fill="#1a2026" font-size="13">Root 0 hits (1,3), (0,1), (2,4) &#8212; count 3. Rerooting to node 1 drops (0,1) and gains (1,0):</text>
  <text x="340" y="416" text-anchor="middle" fill="#1a2026" font-size="13">still <tspan fill="#4169E1" font-weight="600">3</tspan> &#8212; roots 0, 1, 2 reach k = 3, so the answer is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
