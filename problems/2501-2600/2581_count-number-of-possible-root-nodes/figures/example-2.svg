<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="700" height="240" fill="#ffffff"/>
  <defs>
    <marker id="g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b57f30"/>
    </marker>
  </defs>
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="119" y1="130" x2="201" y2="130"/>
    <line x1="239" y1="130" x2="321" y2="130"/>
    <line x1="359" y1="130" x2="441" y2="130"/>
    <line x1="479" y1="130" x2="561" y2="130"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <circle cx="100" cy="130" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="100" y="136" fill="#1a2026">0</text>
    <circle cx="220" cy="130" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="220" y="136" fill="#1a2026">1</text>
    <circle cx="340" cy="130" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="340" y="136" fill="#1a2026">2</text>
    <circle cx="460" cy="130" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="460" y="136" fill="#1a2026">3</text>
    <circle cx="580" cy="130" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="580" y="136" fill="#1a2026">4</text>
  </g>
  <!-- guesses [1,0] [3,4] [2,1] [3,2] as dashed arcs -->
  <g stroke="#b57f30" stroke-width="1.7" fill="none" stroke-dasharray="5 4">
    <path d="M 206 108 Q 160 74 116 106" marker-end="url(#g2)"/>
    <path d="M 446 108 Q 500 74 544 106" marker-end="url(#g2)"/>
    <path d="M 326 154 Q 280 188 236 156" marker-end="url(#g2)"/>
    <path d="M 446 154 Q 400 188 356 156" marker-end="url(#g2)"/>
  </g>
  <g font-size="11.5" fill="#b57f30" text-anchor="middle">
    <text x="160" y="66">1&#8594;0</text>
    <text x="520" y="66">3&#8594;4</text>
    <text x="280" y="196">2&#8594;1</text>
    <text x="400" y="196">3&#8594;2</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="60" y="222">Whichever node roots the chain, at least one of these four guesses holds (k = 1),</text>
    <text x="60" y="240" fill="#4169E1" font-weight="600">so all 5 nodes are valid roots.</text>
  </g>
</svg>
