<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="690" height="320" fill="#ffffff"/>
  <defs>
    <marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b57f30"/>
    </marker>
  </defs>
  <!-- undirected edges -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="320" y1="82" x2="320" y2="148"/>
    <line x1="304" y1="178" x2="228" y2="126"/>
    <line x1="192" y1="110" x2="118" y2="110"/>
    <line x1="306" y1="184" x2="234" y2="236"/>
  </g>
  <!-- nodes -->
  <g text-anchor="middle" font-weight="600">
    <circle cx="320" cy="60" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="320" y="66" fill="#1a2026">0</text>
    <circle cx="320" cy="170" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="320" y="176" fill="#1a2026">1</text>
    <circle cx="210" cy="110" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="210" y="116" fill="#1a2026">2</text>
    <circle cx="100" cy="110" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="100" y="116" fill="#1a2026">4</text>
    <circle cx="220" cy="255" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="220" y="261" fill="#1a2026">3</text>
  </g>
  <!-- guess arrows: [1,3] [0,1] [1,0] [2,4] -->
  <g stroke="#b57f30" stroke-width="1.7" fill="none" stroke-dasharray="5 4">
    <line x1="336" y1="82" x2="336" y2="144" marker-end="url(#g1)"/>
    <line x1="304" y1="152" x2="304" y2="90" marker-end="url(#g1)"/>
    <path d="M 312 188 Q 260 206 238 240" marker-end="url(#g1)"/>
    <line x1="194" y1="96" x2="116" y2="96" marker-end="url(#g1)"/>
  </g>
  <g font-size="11.5" fill="#b57f30">
    <text x="344" y="118">0&#8594;1</text>
    <text x="282" y="118" text-anchor="end">1&#8594;0</text>
    <text x="268" y="222">1&#8594;3</text>
    <text x="152" y="88">2&#8594;4</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="430" y="250">A guess (u, v) is correct when u is</text>
    <text x="430" y="268">v's parent. Roots 0, 1 and 2 each give</text>
    <text x="430" y="286">3 correct guesses (k = 3):</text>
    <text x="430" y="308" fill="#4169E1" font-weight="600">answer 3</text>
  </g>
</svg>
