<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <!-- lcp = [[4,0,2,0],[0,3,0,1],[2,0,2,0],[0,1,0,1]]; cells 64x40 at
       x = 100 + 72i, y = 54 + 48j. Positive cells fill by class:
       a = {0, 2} light, b = {1, 3} accent; zeros muted. Word = abab. -->
  <text x="40" y="44" fill="#5c6b76" font-size="12.5">lcp</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="132" y="44">0</text><text x="204" y="44">1</text><text x="276" y="44">2</text><text x="348" y="44">3</text>
    <text x="88" y="78">0</text><text x="88" y="126">1</text><text x="88" y="174">2</text><text x="88" y="222">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="100" y="54" width="64" height="40" fill="#dbe4fb"/>
    <rect x="172" y="54" width="64" height="40" fill="#ffffff"/>
    <rect x="244" y="54" width="64" height="40" fill="#dbe4fb"/>
    <rect x="316" y="54" width="64" height="40" fill="#ffffff"/>
    <rect x="100" y="102" width="64" height="40" fill="#ffffff"/>
    <rect x="172" y="102" width="64" height="40" fill="#4169E1"/>
    <rect x="244" y="102" width="64" height="40" fill="#ffffff"/>
    <rect x="316" y="102" width="64" height="40" fill="#4169E1"/>
    <rect x="100" y="150" width="64" height="40" fill="#dbe4fb"/>
    <rect x="172" y="150" width="64" height="40" fill="#ffffff"/>
    <rect x="244" y="150" width="64" height="40" fill="#dbe4fb"/>
    <rect x="316" y="150" width="64" height="40" fill="#ffffff"/>
    <rect x="100" y="198" width="64" height="40" fill="#ffffff"/>
    <rect x="172" y="198" width="64" height="40" fill="#4169E1"/>
    <rect x="244" y="198" width="64" height="40" fill="#ffffff"/>
    <rect x="316" y="198" width="64" height="40" fill="#4169E1"/>
  </g>
  <g text-anchor="middle">
    <text x="132" y="72" font-size="15" font-weight="600" fill="#4169E1">a</text>
    <text x="132" y="87" font-size="11" fill="#5c6b76">4</text>
    <text x="204" y="78" font-size="12" fill="#9aa7b2">0</text>
    <text x="276" y="72" font-size="15" font-weight="600" fill="#4169E1">a</text>
    <text x="276" y="87" font-size="11" fill="#5c6b76">2</text>
    <text x="348" y="78" font-size="12" fill="#9aa7b2">0</text>
    <text x="132" y="126" font-size="12" fill="#9aa7b2">0</text>
    <text x="204" y="120" font-size="15" font-weight="600" fill="#ffffff">b</text>
    <text x="204" y="135" font-size="11" fill="#dbe4fb">3</text>
    <text x="276" y="126" font-size="12" fill="#9aa7b2">0</text>
    <text x="348" y="120" font-size="15" font-weight="600" fill="#ffffff">b</text>
    <text x="348" y="135" font-size="11" fill="#dbe4fb">1</text>
    <text x="132" y="168" font-size="15" font-weight="600" fill="#4169E1">a</text>
    <text x="132" y="183" font-size="11" fill="#5c6b76">2</text>
    <text x="204" y="174" font-size="12" fill="#9aa7b2">0</text>
    <text x="276" y="168" font-size="15" font-weight="600" fill="#4169E1">a</text>
    <text x="276" y="183" font-size="11" fill="#5c6b76">2</text>
    <text x="348" y="174" font-size="12" fill="#9aa7b2">0</text>
    <text x="132" y="222" font-size="12" fill="#9aa7b2">0</text>
    <text x="204" y="216" font-size="15" font-weight="600" fill="#ffffff">b</text>
    <text x="204" y="231" font-size="11" fill="#dbe4fb">1</text>
    <text x="276" y="222" font-size="12" fill="#9aa7b2">0</text>
    <text x="348" y="216" font-size="15" font-weight="600" fill="#ffffff">b</text>
    <text x="348" y="231" font-size="11" fill="#dbe4fb">1</text>
  </g>
  <rect x="420" y="58" width="18" height="18" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="446" y="72" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">a</tspan> = {0, 2}</text>
  <rect x="420" y="88" width="18" height="18" fill="#4169E1"/>
  <text x="446" y="102" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">b</tspan> = {1, 3}</text>
  <text x="420" y="150" fill="#5c6b76" font-size="12.5">word</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="420" y="160" width="38" height="34" fill="#dbe4fb"/>
    <rect x="466" y="160" width="38" height="34" fill="#4169E1"/>
    <rect x="512" y="160" width="38" height="34" fill="#dbe4fb"/>
    <rect x="558" y="160" width="38" height="34" fill="#4169E1"/>
  </g>
  <g text-anchor="middle">
    <text x="439" y="182" font-size="14" font-weight="600" fill="#4169E1">a</text>
    <text x="485" y="182" font-size="14" font-weight="600" fill="#ffffff">b</text>
    <text x="531" y="182" font-size="14" font-weight="600" fill="#4169E1">a</text>
    <text x="577" y="182" font-size="14" font-weight="600" fill="#ffffff">b</text>
  </g>
  <text x="420" y="234" fill="#5c6b76" font-size="12.5">rebuild dp[i][j] =</text>
  <text x="420" y="252" fill="#5c6b76" font-size="12.5">dp[i+1][j+1] + 1</text>
  <text x="420" y="272" fill="#4169E1" font-size="12.5" font-weight="600">all 16 entries equal</text>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">Positive cells flood-fill into a = {0, 2} and b = {1, 3}, giving word = <tspan fill="#4169E1" font-weight="600">abab</tspan>,</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">and the dp[i+1][j+1] + 1 rebuild matches all 16 entries of the input.</text>
</svg>
