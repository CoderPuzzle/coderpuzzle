<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="432" fill="#ffffff"/>
  <!-- nums=[1,2,1,2,1,3,3] k=2; array cells x=90+56i w52 y44; dp[0..7]=[0,2,2,4,4,6,6,8] cells x=62+56r y116;
       r=7 sweep rows baseline y=232+22j (s=6..0); accent row j=4 = s=2: dp[2] + importance(2..6) = 2 + 6 = 8 -->
  <text x="40" y="67" fill="#5c6b76" font-size="12.5">nums</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="90" y="44" width="52" height="36"/><rect x="146" y="44" width="52" height="36"/><rect x="202" y="44" width="52" height="36"/>
    <rect x="258" y="44" width="52" height="36"/><rect x="314" y="44" width="52" height="36"/><rect x="370" y="44" width="52" height="36"/>
    <rect x="426" y="44" width="52" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="116" y="67">1</text><text x="172" y="67">2</text><text x="228" y="67">1</text><text x="284" y="67">2</text>
    <text x="340" y="67">1</text><text x="396" y="67">3</text><text x="452" y="67">3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="116" y="98">0</text><text x="172" y="98">1</text><text x="228" y="98">2</text><text x="284" y="98">3</text>
    <text x="340" y="98">4</text><text x="396" y="98">5</text><text x="452" y="98">6</text>
  </g>
  <text x="40" y="137" fill="#5c6b76" font-size="12.5">dp</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="62" y="116" width="52" height="32"/><rect x="118" y="116" width="52" height="32"/><rect x="174" y="116" width="52" height="32"/>
    <rect x="230" y="116" width="52" height="32"/><rect x="286" y="116" width="52" height="32"/><rect x="342" y="116" width="52" height="32"/>
    <rect x="398" y="116" width="52" height="32"/>
    <rect x="454" y="116" width="52" height="32" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="88" y="137">0</text><text x="144" y="137">2</text><text x="200" y="137">2</text><text x="256" y="137">4</text>
    <text x="312" y="137">4</text><text x="368" y="137">6</text><text x="424" y="137">6</text>
    <text x="480" y="137" fill="#4169E1">8</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="88" y="166">r=0</text><text x="144" y="166">r=1</text><text x="200" y="166">r=2</text><text x="256" y="166">r=3</text>
    <text x="312" y="166">r=4</text><text x="368" y="166">r=5</text><text x="424" y="166">r=6</text><text x="480" y="166">r=7</text>
  </g>
  <text x="340" y="192" text-anchor="middle" fill="#5c6b76" font-size="12.5">For r = 7, sweep s downward, pricing dp[s] + importance(s..6):</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="56" y="212">s</text>
    <text x="78" y="212" text-anchor="start">window nums[s..6]</text>
    <text x="268" y="212">delta: adding nums[s]</text>
    <text x="388" y="212">importance</text>
    <text x="490" y="212">dp[s] + imp</text>
  </g>
  <rect x="28" y="304" width="624" height="26" rx="6" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="56" y="232">6</text><text x="56" y="254">5</text><text x="56" y="276">4</text><text x="56" y="298">3</text>
    <text x="56" y="320">2</text><text x="56" y="342">1</text><text x="56" y="364">0</text>
  </g>
  <g font-size="13.5" fill="#1a2026">
    <text x="78" y="232">3</text><text x="78" y="254">3 3</text><text x="78" y="276">1 3 3</text><text x="78" y="298">2 1 3 3</text>
    <text x="78" y="320" font-weight="600">1 2 1 3 3</text><text x="78" y="342">2 1 2 1 3 3</text><text x="78" y="364">1 2 1 2 1 3 3</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#5c6b76">
    <text x="268" y="232">+0 (new)</text><text x="268" y="254">+2 (second 3)</text><text x="268" y="276">+0 (new)</text>
    <text x="268" y="298">+0 (new)</text><text x="268" y="320" fill="#4169E1" font-weight="600">+2 (second 1)</text>
    <text x="268" y="342">+2 (second 2)</text><text x="268" y="364">+1 (third 1)</text>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="388" y="232" fill="#5c6b76">2</text><text x="388" y="254" fill="#5c6b76">4</text><text x="388" y="276" fill="#5c6b76">4</text>
    <text x="388" y="298" fill="#5c6b76">4</text><text x="388" y="320" fill="#4169E1" font-weight="600">6</text>
    <text x="388" y="342" fill="#5c6b76">8</text><text x="388" y="364" fill="#5c6b76">9</text>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="490" y="232">6+2 = 8</text><text x="490" y="254">6+4 = 10</text><text x="490" y="276">4+4 = 8</text>
    <text x="490" y="298">4+4 = 8</text><text x="490" y="320" fill="#4169E1" font-weight="700">2+6 = 8</text>
    <text x="490" y="342">2+8 = 10</text><text x="490" y="364">0+9 = 9</text>
  </g>
  <text x="608" y="320" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">winning last piece</text>
  <text x="340" y="398" text-anchor="middle" fill="#1a2026" font-size="13">dp[r] = min over s &lt; r of dp[s] + importance(s..r-1); filling r = 0..7 gives</text>
  <text x="340" y="416" text-anchor="middle" fill="#1a2026" font-size="13">dp = [0,2,2,4,4,6,6,8] — split [1,2] | [1,2,1,3,3] costs dp[2] + 6 = <tspan fill="#4169E1" font-weight="600">8</tspan>.</text>
</svg>
