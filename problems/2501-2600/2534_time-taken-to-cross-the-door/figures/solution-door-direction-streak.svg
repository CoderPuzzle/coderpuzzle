<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="284" fill="#ffffff"/>
  <!-- arrival=[0,1,1,2,4], state=[0,1,0,0,1] (0=enter, 1=exit); each row: arrivals admitted by second t,
       the two queues after admission, the person crossing and their second, and the door's direction;
       rows h=34 from y=58; the accent bar marks the entry streak t=0..2 -->
  <text x="40" y="24" fill="#1a2026" font-size="13">arrival = [0, 1, 1, 2, 4], state = [0, 1, 0, 0, 1] (0 = enter, 1 = exit)</text>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="52" y="50">t</text><text x="148" y="50">enter queue</text><text x="292" y="50">exit queue</text>
    <text x="447" y="50">crosses (second)</text><text x="580" y="50">dir</text>
  </g>
  <line x1="28" y1="58" x2="616" y2="58" stroke="#42525e" stroke-width="1"/>
  <rect x="28" y="92" width="588" height="34" fill="#f0f3f7"/>
  <rect x="28" y="160" width="588" height="34" fill="#f0f3f7"/>
  <g text-anchor="middle" font-size="12.5">
    <text x="52" y="80" fill="#1a2026" font-weight="600">t = 0</text>
    <text x="52" y="114" fill="#1a2026" font-weight="600">t = 1</text>
    <text x="52" y="148" fill="#1a2026" font-weight="600">t = 2</text>
    <text x="52" y="182" fill="#1a2026" font-weight="600">t = 3</text>
    <text x="52" y="216" fill="#1a2026" font-weight="600">t = 4</text>
    <text x="148" y="80" fill="#1a2026">adds 0 → [0]</text>
    <text x="148" y="114" fill="#1a2026">adds 2 → [2]</text>
    <text x="148" y="148" fill="#1a2026">adds 3 → [3]</text>
    <text x="148" y="182" fill="#9aa7b2">—</text>
    <text x="148" y="216" fill="#9aa7b2">—</text>
    <text x="292" y="80" fill="#9aa7b2">—</text>
    <text x="292" y="114" fill="#1a2026">adds 1 → [1]</text>
    <text x="292" y="148" fill="#1a2026">holds [1]</text>
    <text x="292" y="182" fill="#1a2026">holds [1]</text>
    <text x="292" y="216" fill="#1a2026">adds 4 → [4]</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="447" y="80">only enter → P0 (<tspan fill="#4169E1" font-weight="600">0</tspan>)</text>
    <text x="447" y="114">streak enter → P2 (<tspan fill="#4169E1" font-weight="600">1</tspan>)</text>
    <text x="447" y="148">streak enter → P3 (<tspan fill="#4169E1" font-weight="600">2</tspan>)</text>
    <text x="447" y="182">exit only → P1 (<tspan fill="#4169E1" font-weight="600">3</tspan>)</text>
    <text x="447" y="216">exit only → P4 (<tspan fill="#4169E1" font-weight="600">4</tspan>)</text>
  </g>
  <g>
    <rect x="534" y="63" width="4" height="24" fill="#4169E1"/>
    <rect x="534" y="97" width="4" height="24" fill="#4169E1"/>
    <rect x="534" y="131" width="4" height="24" fill="#4169E1"/>
    <rect x="534" y="165" width="4" height="24" fill="#9aa7b2"/>
    <rect x="534" y="199" width="4" height="24" fill="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <text x="580" y="80" fill="#4169E1">enter</text>
    <text x="580" y="114" fill="#4169E1">enter</text>
    <text x="580" y="148" fill="#4169E1">enter</text>
    <text x="580" y="182" fill="#1a2026">exit</text>
    <text x="580" y="216" fill="#1a2026">exit</text>
  </g>
  <text x="40" y="248" fill="#1a2026" font-size="13">The door's entry streak runs through t = 2, so exiting person 1 waits until t = 3.</text>
  <text x="40" y="266" fill="#1a2026" font-size="13">answer = <tspan fill="#4169E1" font-weight="600">[0, 3, 1, 2, 4]</tspan> for persons 0-4.</text>
</svg>
