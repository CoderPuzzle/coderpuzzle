<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="340" fill="#ffffff"/>
  <!-- weights=[1,3,5,1] k=2; cells x=90+88i w64 y44; cut sums above gaps x=166/254/342: 1+3=4, 3+5=8, 5+1=6;
       sorted boxes centers 198/278/358 y150; k-1=1 chosen cut -> bottom [4], top [8], 6 unused; endpoints 1+1 cancel -->
  <text x="40" y="38" fill="#5c6b76" font-size="12">cut sums:</text>
  <text x="166" y="34" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="13">1+3 = 4</text>
  <text x="254" y="34" text-anchor="middle" fill="#4169E1" font-weight="700" font-size="13">3+5 = 8</text>
  <text x="342" y="34" text-anchor="middle" fill="#9aa7b2" font-weight="600" font-size="13">5+1 = 6</text>
  <g fill="none" stroke-width="1.5" stroke-dasharray="4 3">
    <path d="M 166 42 V 86" stroke="#1a2026"/>
    <path d="M 254 42 V 86" stroke="#4169E1"/>
    <path d="M 342 42 V 86" stroke="#9aa7b2"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="90" y="44" width="64" height="40"/><rect x="178" y="44" width="64" height="40"/>
    <rect x="266" y="44" width="64" height="40"/><rect x="354" y="44" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="122" y="70">1</text><text x="210" y="70">3</text><text x="298" y="70">5</text><text x="386" y="70">1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="122" y="104">0</text><text x="210" y="104">1</text><text x="298" y="104">2</text><text x="386" y="104">3</text>
  </g>
  <text x="40" y="140" fill="#5c6b76" font-size="12.5">sorted pair sums</text>
  <g stroke-width="1.6">
    <rect x="170" y="150" width="56" height="36" fill="#ffffff" stroke="#1a2026"/>
    <rect x="250" y="150" width="56" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="330" y="150" width="56" height="36" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="198" y="173" fill="#1a2026">4</text><text x="278" y="173" fill="#9aa7b2">6</text><text x="358" y="173" fill="#4169E1">8</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="198" y="202">smallest</text><text x="278" y="202">unused</text><text x="358" y="202">largest</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="198" y="220" fill="#1a2026">the min cut</text><text x="358" y="220" fill="#4169E1">the max cut</text>
  </g>
  <text x="180" y="252" text-anchor="middle" fill="#1a2026" font-size="14">max = (1 + 1) + 8 = 10</text>
  <text x="460" y="252" text-anchor="middle" fill="#1a2026" font-size="14">min = (1 + 1) + 4 = 6</text>
  <text x="330" y="294" text-anchor="middle" fill="#1a2026" font-size="13">Endpoints weights[0] + weights[3] = 2 sit in every distribution and cancel,</text>
  <text x="330" y="312" text-anchor="middle" fill="#1a2026" font-size="13">so the answer is top cut 8 minus bottom cut 4: 10 − 6 = <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
