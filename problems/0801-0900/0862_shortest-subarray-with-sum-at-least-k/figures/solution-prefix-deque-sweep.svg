<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="352" fill="#ffffff"/>
  <!-- nums = [2,-1,2], k = 3; prefix = [0,2,1,3]. One row per sweep index i
       showing the deque of candidate start indices after processing i
       (boxes: index over prefix value); a struck gray box is an entry popped
       that step (dominated tail at i=2, qualifying front at i=3). -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">
    <text x="100" y="44">nums</text>
    <text x="340" y="44">prefix[i]</text>
    <text x="470" y="66" fill="#1a2026">k = 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1" fill="#ffffff">
    <rect x="80" y="52" width="40" height="30"/><rect x="120" y="52" width="40" height="30"/><rect x="160" y="52" width="40" height="30"/>
  </g>
  <g stroke="#42525e" stroke-width="1" fill="#dbe4fb">
    <rect x="260" y="52" width="40" height="30"/><rect x="300" y="52" width="40" height="30"/><rect x="340" y="52" width="40" height="30"/><rect x="380" y="52" width="40" height="30"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="100" y="72">2</text><text x="140" y="72">-1</text><text x="180" y="72">2</text>
    <text x="280" y="72">0</text><text x="320" y="72">2</text><text x="360" y="72">1</text><text x="400" y="72">3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="100" y="96">0</text><text x="140" y="96">1</text><text x="180" y="96">2</text>
    <text x="280" y="96">0</text><text x="320" y="96">1</text><text x="360" y="96">2</text><text x="400" y="96">3</text>
  </g>
  <!-- step rows: label x=24, ghost box x=154, deque boxes x=218/282 (56x34),
       action text x=360; row centers y = 136/184/232/280 -->
  <g font-size="13" fill="#1a2026">
    <text x="24" y="140">i = 0 · p = 0</text>
    <text x="24" y="188">i = 1 · p = 2</text>
    <text x="24" y="236">i = 2 · p = 1</text>
    <text x="24" y="284">i = 3 · p = 3</text>
  </g>
  <!-- i = 0 -->
  <rect x="218" y="119" width="56" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="246" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">0</text>
  <text x="246" y="147" text-anchor="middle" font-size="11" fill="#5c6b76">p 0</text>
  <text x="360" y="140" font-size="12.5" fill="#5c6b76">deque empty — start 0 joins</text>
  <!-- i = 1 -->
  <rect x="218" y="167" width="56" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="246" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">0</text>
  <text x="246" y="195" text-anchor="middle" font-size="11" fill="#5c6b76">p 0</text>
  <rect x="282" y="167" width="56" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="310" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">1</text>
  <text x="310" y="195" text-anchor="middle" font-size="11" fill="#5c6b76">p 2</text>
  <text x="360" y="188" font-size="12.5" fill="#5c6b76">front 0 fails 0 ≤ 2-3; 1 joins</text>
  <!-- i = 2: tail entry 1 popped -->
  <rect x="154" y="215" width="56" height="34" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="160" y1="245" x2="204" y2="219" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="182" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#9aa7b2">1</text>
  <text x="182" y="243" text-anchor="middle" font-size="11" fill="#9aa7b2">p 2</text>
  <rect x="218" y="215" width="56" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="246" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">0</text>
  <text x="246" y="243" text-anchor="middle" font-size="11" fill="#5c6b76">p 0</text>
  <rect x="282" y="215" width="56" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="310" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">2</text>
  <text x="310" y="243" text-anchor="middle" font-size="11" fill="#5c6b76">p 1</text>
  <text x="360" y="236" font-size="12.5" fill="#5c6b76">tail 1 (p 2 ≥ p 1) pops — 2 joins</text>
  <!-- i = 3: front entry 0 consumed -->
  <rect x="154" y="263" width="56" height="34" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="160" y1="293" x2="204" y2="267" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="182" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#9aa7b2">0</text>
  <text x="182" y="291" text-anchor="middle" font-size="11" fill="#9aa7b2">p 0</text>
  <rect x="218" y="263" width="56" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="246" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">2</text>
  <text x="246" y="291" text-anchor="middle" font-size="11" fill="#5c6b76">p 1</text>
  <rect x="282" y="263" width="56" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="310" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">3</text>
  <text x="310" y="291" text-anchor="middle" font-size="11" fill="#5c6b76">p 3</text>
  <text x="360" y="284" font-size="12.5" fill="#5c6b76">front 0: 0 ≤ 3-3 → best = <tspan fill="#4169E1" font-weight="600">3 - 0 = 3</tspan></text>
  <text x="340" y="322" text-anchor="middle" fill="#1a2026" font-size="13">Candidate starts keep rising prefixes: dominated tails are trimmed, qualified</text>
  <text x="340" y="340" text-anchor="middle" fill="#1a2026" font-size="13">fronts are consumed — at i = 3 the front start 0 gives the answer <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
