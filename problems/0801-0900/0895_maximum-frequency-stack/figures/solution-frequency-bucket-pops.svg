<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 368" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="368" fill="#ffffff"/>
  <!-- pushes 5,7,5,7,4,5 give buckets (bottom-to-top) f=3:[5], f=2:[5,7], f=1:[5,7,4]; badge numbers 1-4 are the pop order; cells 64x40 at x=110+68k, rows y=70/130/190 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="110" y="130" width="64" height="40"/>
    <rect x="110" y="190" width="64" height="40"/><rect x="178" y="190" width="64" height="40"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="110" y="70" width="64" height="40"/>
    <rect x="110" y="130" width="64" height="40" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="178" y="130" width="64" height="40"/>
    <rect x="246" y="190" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="142" y="95">5</text>
    <text x="142" y="155">5</text><text x="210" y="155">7</text>
    <text x="142" y="215">5</text><text x="210" y="215">7</text><text x="278" y="215">4</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="13" font-weight="600">
    <text x="98" y="95">f = 3</text>
    <text x="98" y="155">f = 2</text>
    <text x="98" y="215">f = 1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="142" y="252">bottom</text>
    <text x="278" y="252">top of stack</text>
  </g>
  <!-- pop-order badges on the cell each pop drains -->
  <g>
    <circle cx="174" cy="70" r="10" fill="#4169E1"/><text x="174" y="74" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text>
    <circle cx="242" cy="130" r="10" fill="#4169E1"/><text x="242" y="134" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text>
    <circle cx="174" cy="130" r="10" fill="#4169E1"/><text x="174" y="134" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text>
    <circle cx="310" cy="190" r="10" fill="#4169E1"/><text x="310" y="194" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text>
  </g>
  <!-- pop sequence panel -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="352" y="38" font-weight="600" font-size="13">pops, in order</text>
    <text x="352" y="92">1st pop → <tspan fill="#1a2026" font-weight="600">5</tspan>  from f = 3</text>
    <text x="352" y="132">2nd pop → <tspan fill="#1a2026" font-weight="600">7</tspan>  from f = 2</text>
    <text x="352" y="172">3rd pop → <tspan fill="#1a2026" font-weight="600">5</tspan>  from f = 2</text>
    <text x="352" y="212">4th pop → <tspan fill="#1a2026" font-weight="600">4</tspan>  from f = 1</text>
    <text x="352" y="252">then 5, 7 stay under f = 1</text>
  </g>
  <text x="310" y="310" text-anchor="middle" fill="#1a2026" font-size="13">Each pop drains the top of the highest non-empty bucket: <tspan fill="#4169E1" font-weight="600">5</tspan> leaves f = 3</text>
  <text x="310" y="330" text-anchor="middle" fill="#1a2026" font-size="13">(maxfreq 3 → 2), then 7 and 5 leave f = 2 (→ 1), then 4 — output <tspan fill="#4169E1" font-weight="600">5, 7, 5, 4</tspan>.</text>
</svg>
