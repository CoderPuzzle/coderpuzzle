<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [3,5,1,6,2,0,8,null,null,7,4]; circles r=18; "h = N" is the subtree height measured on the second stack pop; the answer rises 7/4 -> 2 -> 5 -> 3 -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="340" y1="60" x2="220" y2="140"/><line x1="340" y1="60" x2="470" y2="140"/>
    <line x1="220" y1="140" x2="140" y2="225"/><line x1="220" y1="140" x2="300" y2="225"/>
    <line x1="470" y1="140" x2="420" y2="225"/><line x1="470" y1="140" x2="530" y2="225"/>
    <line x1="300" y1="225" x2="250" y2="305"/><line x1="300" y1="225" x2="355" y2="305"/>
  </g>
  <!-- deepest leaves 7 and 4 flow into node 2, the answer passes up the deeper side -->
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <line x1="262" y1="292" x2="283" y2="247" marker-end="url(#arrow)"/>
    <line x1="343" y1="292" x2="320" y2="247" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="292" y1="208" x2="242" y2="162" marker-end="url(#arrowAccent)"/>
    <line x1="238" y1="126" x2="318" y2="78" marker-end="url(#arrowAccent)"/>
  </g>
  <text x="286" y="178" fill="#4169E1" font-size="12.5" font-weight="600">answer</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="340" cy="60" r="18"/><circle cx="220" cy="140" r="18"/><circle cx="470" cy="140" r="18"/>
    <circle cx="140" cy="225" r="18"/><circle cx="420" cy="225" r="18"/><circle cx="530" cy="225" r="18"/>
  </g>
  <circle cx="300" cy="225" r="18" fill="#4169E1"/>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <circle cx="250" cy="305" r="18"/><circle cx="355" cy="305" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="340" y="65">3</text><text x="220" y="145">5</text><text x="470" y="145">1</text>
    <text x="140" y="230">6</text><text x="420" y="230">0</text><text x="530" y="230">8</text>
  </g>
  <text x="300" y="230" text-anchor="middle" font-weight="600" fill="#ffffff">2</text>
  <g text-anchor="middle" font-weight="600" fill="#4169E1">
    <text x="250" y="310">7</text><text x="355" y="310">4</text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="366" y="65">h = 4</text>
    <text x="194" y="145" text-anchor="end">h = 3</text>
    <text x="496" y="145">h = 2</text>
    <text x="166" y="230">h = 1</text>
    <text x="272" y="230" text-anchor="end">h = 2</text>
    <text x="446" y="230">h = 1</text>
    <text x="556" y="230">h = 1</text>
    <text x="276" y="310">h = 1</text>
    <text x="381" y="310">h = 1</text>
  </g>
  <text x="340" y="352" text-anchor="middle" fill="#1a2026" font-size="13">Bottom-up heights: 7 and 4 are deepest; at 2 both sides measure h = 1, a tie,</text>
  <text x="340" y="370" text-anchor="middle" fill="#1a2026" font-size="13">so the answer settles at <tspan fill="#4169E1" font-weight="600">2</tspan> — nodes 5 and 3 sit over a deeper side and pass it up.</text>
</svg>
