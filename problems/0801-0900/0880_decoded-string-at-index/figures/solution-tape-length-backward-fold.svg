<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s = "leet2code3": char boxes 36x30 at x=60+38*i, y=62; running tape length under each box; backward rows at x=60; answer badge at (470,196) -->
  <text x="320" y="28" text-anchor="middle" font-size="12.5" fill="#5c6b76">s = "leet2code3", k = 10 — find the 10th letter without building 36 letters</text>
  <text x="60" y="52" font-size="12.5" fill="#5c6b76">forward pass — tape length after each character</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="60" y="62" width="36" height="30"/><rect x="98" y="62" width="36" height="30"/><rect x="136" y="62" width="36" height="30"/><rect x="174" y="62" width="36" height="30"/>
    <rect x="250" y="62" width="36" height="30"/><rect x="288" y="62" width="36" height="30"/><rect x="326" y="62" width="36" height="30"/><rect x="364" y="62" width="36" height="30"/>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="212" y="62" width="36" height="30"/><rect x="402" y="62" width="36" height="30"/>
  </g>
  <g text-anchor="middle">
    <text x="78" y="82" fill="#1a2026">l</text><text x="116" y="82" fill="#1a2026">e</text><text x="154" y="82" fill="#1a2026">e</text><text x="192" y="82" fill="#1a2026">t</text>
    <text x="230" y="82" fill="#1a2026" font-weight="600">2</text><text x="268" y="82" fill="#1a2026">c</text><text x="306" y="82" fill="#1a2026">o</text><text x="344" y="82" fill="#1a2026">d</text><text x="382" y="82" fill="#1a2026">e</text>
    <text x="420" y="82" fill="#1a2026" font-weight="600">3</text>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <g fill="#5c6b76">
      <text x="78" y="110">1</text><text x="116" y="110">2</text><text x="154" y="110">3</text>
      <text x="268" y="110">9</text><text x="306" y="110">10</text><text x="344" y="110">11</text>
    </g>
    <g fill="#4169E1" font-weight="600">
      <text x="192" y="110">4</text><text x="230" y="110">8</text><text x="382" y="110">12</text><text x="420" y="110">36</text>
    </g>
  </g>
  <line x1="60" y1="128" x2="580" y2="128" stroke="#dbe4fb" stroke-width="1"/>
  <text x="60" y="152" font-size="12.5" fill="#5c6b76">backward pass — undo one operation per character, folding k</text>
  <g font-size="12.5" fill="#1a2026">
    <text x="60" y="178">read '3' (digit):  size 36 ÷ 3 = 12,  k = (10 − 1) % 12 + 1 = 10</text>
    <text x="60" y="202">read 'e':  k = 10 ≠ size 12  →  size 11</text>
    <text x="60" y="226">read 'd':  k = 10 ≠ size 11  →  size 10</text>
    <text x="60" y="250">read 'o':  k = 10 = size 10  —  match</text>
  </g>
  <rect x="470" y="196" width="140" height="40" rx="8" fill="#4169E1"/>
  <text x="540" y="214" text-anchor="middle" fill="#ffffff" font-weight="600">answer: 'o'</text>
  <text x="540" y="230" text-anchor="middle" fill="#ffffff" font-size="11">the 10th letter</text>
  <text x="320" y="296" text-anchor="middle" font-size="13" fill="#1a2026">The forward lengths <tspan fill="#4169E1" font-weight="600">4, 8, 12, 36</tspan> never materialize the tape; walking back, k = 10</text>
  <text x="320" y="316" text-anchor="middle" font-size="13" fill="#1a2026">folds to (10 − 1) % 12 + 1 = 10 and stops at <tspan fill="#4169E1" font-weight="600">'o'</tspan>, where k equals the length.</text>
</svg>
