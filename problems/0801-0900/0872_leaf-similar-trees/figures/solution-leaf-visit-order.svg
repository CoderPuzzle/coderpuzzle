<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="400" fill="#ffffff"/>
  <!-- root1 = [3,5,1,6,2,9,8,null,null,7,4]; root2 = [3,5,1,6,7,4,2,null,null,null,null,null,null,9,8]; circles r=18 at y=55/125/200/275; ordinal = leaf visit order in the explicit-stack DFS -->
  <text x="150" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">root1</text>
  <text x="505" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">root2</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="150" y1="55" x2="95" y2="125"/><line x1="150" y1="55" x2="215" y2="125"/>
    <line x1="95" y1="125" x2="65" y2="200"/><line x1="95" y1="125" x2="135" y2="200"/>
    <line x1="215" y1="125" x2="190" y2="200"/><line x1="215" y1="125" x2="255" y2="200"/>
    <line x1="135" y1="200" x2="105" y2="275"/><line x1="135" y1="200" x2="170" y2="275"/>
    <line x1="505" y1="55" x2="450" y2="125"/><line x1="505" y1="55" x2="570" y2="125"/>
    <line x1="450" y1="125" x2="420" y2="200"/><line x1="450" y1="125" x2="490" y2="200"/>
    <line x1="570" y1="125" x2="545" y2="200"/><line x1="570" y1="125" x2="610" y2="200"/>
    <line x1="610" y1="200" x2="580" y2="275"/><line x1="610" y1="200" x2="645" y2="275"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="150" cy="55" r="18"/><circle cx="95" cy="125" r="18"/><circle cx="215" cy="125" r="18"/>
    <circle cx="135" cy="200" r="18"/>
    <circle cx="505" cy="55" r="18"/><circle cx="450" cy="125" r="18"/><circle cx="570" cy="125" r="18"/>
    <circle cx="610" cy="200" r="18"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <circle cx="65" cy="200" r="18"/><circle cx="105" cy="275" r="18"/><circle cx="170" cy="275" r="18"/>
    <circle cx="190" cy="200" r="18"/><circle cx="255" cy="200" r="18"/>
    <circle cx="420" cy="200" r="18"/><circle cx="490" cy="200" r="18"/><circle cx="545" cy="200" r="18"/>
    <circle cx="580" cy="275" r="18"/><circle cx="645" cy="275" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="150" y="60">3</text><text x="95" y="130">5</text><text x="215" y="130">1</text>
    <text x="135" y="205">2</text>
    <text x="505" y="60">3</text><text x="450" y="130">5</text><text x="570" y="130">1</text>
    <text x="610" y="205">2</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#4169E1">
    <text x="65" y="205">6</text><text x="105" y="280">7</text><text x="170" y="280">4</text>
    <text x="190" y="205">9</text><text x="255" y="205">8</text>
    <text x="420" y="205">6</text><text x="490" y="205">7</text><text x="545" y="205">4</text>
    <text x="580" y="280">9</text><text x="645" y="280">8</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="65" y="234">1st</text><text x="105" y="309">2nd</text><text x="170" y="309">3rd</text>
    <text x="190" y="234">4th</text><text x="255" y="234">5th</text>
    <text x="420" y="234">1st</text><text x="490" y="234">2nd</text><text x="545" y="234">3rd</text>
    <text x="580" y="309">4th</text><text x="645" y="309">5th</text>
  </g>
  <!-- leaf sequences read off in visit order -->
  <text x="150" y="337" text-anchor="end" fill="#5c6b76" font-size="12.5">root1</text>
  <text x="150" y="367" text-anchor="end" fill="#5c6b76" font-size="12.5">root2</text>
  <g stroke="#4169E1" stroke-width="1.3" fill="#dbe4fb">
    <rect x="170" y="320" width="30" height="24"/><rect x="208" y="320" width="30" height="24"/>
    <rect x="246" y="320" width="30" height="24"/><rect x="284" y="320" width="30" height="24"/>
    <rect x="322" y="320" width="30" height="24"/>
    <rect x="170" y="350" width="30" height="24"/><rect x="208" y="350" width="30" height="24"/>
    <rect x="246" y="350" width="30" height="24"/><rect x="284" y="350" width="30" height="24"/>
    <rect x="322" y="350" width="30" height="24"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="185" y="337">6</text><text x="223" y="337">7</text><text x="261" y="337">4</text>
    <text x="299" y="337">9</text><text x="337" y="337">8</text>
    <text x="185" y="367">6</text><text x="223" y="367">7</text><text x="261" y="367">4</text>
    <text x="299" y="367">9</text><text x="337" y="367">8</text>
  </g>
  <text x="384" y="352" fill="#1a2026" font-size="13">Both sequences equal — leaf-similar: <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
