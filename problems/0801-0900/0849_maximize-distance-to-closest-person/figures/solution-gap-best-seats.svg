<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="252" fill="#ffffff"/>
  <!-- seats = [1,0,0,0,1,0,1]; cells 56x44 at x = 100 + 64k, y=84; people at 0, 4, 6; best seats 2 (d=2) and 5 (d=1) -->
  <text x="256" y="62" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">Alex</text>
  <polygon points="250,68 262,68 256,76" fill="#4169E1"/>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="100" y="84" width="56" height="44" fill="#dbe4fb"/>
    <rect x="164" y="84" width="56" height="44" fill="#ffffff"/>
    <rect x="292" y="84" width="56" height="44" fill="#ffffff"/>
    <rect x="356" y="84" width="56" height="44" fill="#dbe4fb"/>
    <rect x="420" y="84" width="56" height="44" fill="#ffffff"/>
    <rect x="484" y="84" width="56" height="44" fill="#dbe4fb"/>
  </g>
  <rect x="228" y="84" width="56" height="44" fill="#ffffff" stroke="#4169E1" stroke-width="2.4"/>
  <g fill="#42525e">
    <circle cx="128" cy="106" r="8"/><circle cx="384" cy="106" r="8"/><circle cx="512" cy="106" r="8"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="128" y="148">0</text><text x="192" y="148">1</text><text x="256" y="148">2</text>
    <text x="320" y="148">3</text><text x="384" y="148">4</text><text x="448" y="148">5</text><text x="512" y="148">6</text>
  </g>
  <!-- the two empty stretches close when the person at 4 (then 6) sits down -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 164 160 V 154 H 348 V 160"/>
    <path d="M 426 160 V 154 H 470 V 160"/>
  </g>
  <text x="256" y="182" text-anchor="middle" fill="#1a2026" font-size="12.5">gap 0 → 4: seat 2, d = 4/2 = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="448" y="182" text-anchor="middle" fill="#1a2026" font-size="12.5">gap 4 → 6: seat 5, d = 1</text>
  <text x="35" y="216" fill="#1a2026" font-size="13">Each empty stretch is entered at its best seat — middle seat 2 scores</text>
  <text x="35" y="234" fill="#1a2026" font-size="13">4/2 = 2, seat 5 scores 1 — and the maximum, <tspan fill="#4169E1" font-weight="600">2 at seat 2</tspan>, is the answer.</text>
</svg>
