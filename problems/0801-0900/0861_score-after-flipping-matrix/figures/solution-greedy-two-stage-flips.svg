<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[0,0,1,1],[1,0,1,0],[1,1,0,0]]; cells 34px; the three matrices
       sit at x 48/264/480, rows at y 70/104/138. 1-cells shaded #dbe4fb.
       Stage 1: row 0 (leading 0) toggled. Stage 2: cols 2, 3 (more 0s than
       1s) toggled -> rows read 15 + 9 + 15 = 39. -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">
    <text x="116" y="60">grid</text>
    <text x="332" y="60">rows toggled</text>
    <text x="548" y="60">columns toggled</text>
  </g>
  <!-- matrix 1 -->
  <g stroke="#42525e" stroke-width="1">
    <rect x="48" y="70" width="34" height="34" fill="#ffffff"/><rect x="82" y="70" width="34" height="34" fill="#ffffff"/><rect x="116" y="70" width="34" height="34" fill="#dbe4fb"/><rect x="150" y="70" width="34" height="34" fill="#dbe4fb"/>
    <rect x="48" y="104" width="34" height="34" fill="#dbe4fb"/><rect x="82" y="104" width="34" height="34" fill="#ffffff"/><rect x="116" y="104" width="34" height="34" fill="#dbe4fb"/><rect x="150" y="104" width="34" height="34" fill="#ffffff"/>
    <rect x="48" y="138" width="34" height="34" fill="#dbe4fb"/><rect x="82" y="138" width="34" height="34" fill="#dbe4fb"/><rect x="116" y="138" width="34" height="34" fill="#ffffff"/><rect x="150" y="138" width="34" height="34" fill="#ffffff"/>
  </g>
  <rect x="48" y="70" width="136" height="34" fill="none" stroke="#4169E1" stroke-width="2.2"/>
  <!-- matrix 2 -->
  <g stroke="#42525e" stroke-width="1">
    <rect x="264" y="70" width="34" height="34" fill="#dbe4fb"/><rect x="298" y="70" width="34" height="34" fill="#dbe4fb"/><rect x="332" y="70" width="34" height="34" fill="#ffffff"/><rect x="366" y="70" width="34" height="34" fill="#ffffff"/>
    <rect x="264" y="104" width="34" height="34" fill="#dbe4fb"/><rect x="298" y="104" width="34" height="34" fill="#ffffff"/><rect x="332" y="104" width="34" height="34" fill="#dbe4fb"/><rect x="366" y="104" width="34" height="34" fill="#ffffff"/>
    <rect x="264" y="138" width="34" height="34" fill="#dbe4fb"/><rect x="298" y="138" width="34" height="34" fill="#dbe4fb"/><rect x="332" y="138" width="34" height="34" fill="#ffffff"/><rect x="366" y="138" width="34" height="34" fill="#ffffff"/>
  </g>
  <rect x="332" y="70" width="34" height="102" fill="none" stroke="#4169E1" stroke-width="2.2"/>
  <rect x="366" y="70" width="34" height="102" fill="none" stroke="#4169E1" stroke-width="2.2"/>
  <!-- matrix 3 -->
  <g stroke="#42525e" stroke-width="1">
    <rect x="480" y="70" width="34" height="34" fill="#dbe4fb"/><rect x="514" y="70" width="34" height="34" fill="#dbe4fb"/><rect x="548" y="70" width="34" height="34" fill="#dbe4fb"/><rect x="582" y="70" width="34" height="34" fill="#dbe4fb"/>
    <rect x="480" y="104" width="34" height="34" fill="#dbe4fb"/><rect x="514" y="104" width="34" height="34" fill="#ffffff"/><rect x="548" y="104" width="34" height="34" fill="#ffffff"/><rect x="582" y="104" width="34" height="34" fill="#dbe4fb"/>
    <rect x="480" y="138" width="34" height="34" fill="#dbe4fb"/><rect x="514" y="138" width="34" height="34" fill="#dbe4fb"/><rect x="548" y="138" width="34" height="34" fill="#dbe4fb"/><rect x="582" y="138" width="34" height="34" fill="#dbe4fb"/>
  </g>
  <!-- cell values -->
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="65" y="92">0</text><text x="99" y="92">0</text><text x="133" y="92">1</text><text x="167" y="92">1</text>
    <text x="65" y="126">1</text><text x="99" y="126">0</text><text x="133" y="126">1</text><text x="167" y="126">0</text>
    <text x="65" y="160">1</text><text x="99" y="160">1</text><text x="133" y="160">0</text><text x="167" y="160">0</text>
    <text x="281" y="92">1</text><text x="315" y="92">1</text><text x="349" y="92">0</text><text x="383" y="92">0</text>
    <text x="281" y="126">1</text><text x="315" y="126">0</text><text x="349" y="126">1</text><text x="383" y="126">0</text>
    <text x="281" y="160">1</text><text x="315" y="160">1</text><text x="349" y="160">0</text><text x="383" y="160">0</text>
    <text x="497" y="92">1</text><text x="531" y="92">1</text><text x="565" y="92">1</text><text x="599" y="92">1</text>
    <text x="497" y="126">1</text><text x="531" y="126">0</text><text x="565" y="126">0</text><text x="599" y="126">1</text>
    <text x="497" y="160">1</text><text x="531" y="160">1</text><text x="565" y="160">1</text><text x="599" y="160">1</text>
  </g>
  <!-- stage arrows -->
  <line x1="192" y1="121" x2="256" y2="121" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="408" y1="121" x2="472" y2="121" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="224" y="112">row pass</text>
    <text x="440" y="112">column pass</text>
  </g>
  <!-- row values of the final matrix -->
  <g fill="#4169E1" font-size="13" font-weight="600">
    <text x="626" y="92">15</text>
    <text x="626" y="126">9</text>
    <text x="626" y="160">15</text>
  </g>
  <!-- stage notes -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="116" y="196">row 0 leads with 0 — flip it</text>
    <text x="332" y="196">cols 2, 3 hold more 0s</text>
    <text x="332" y="212">than 1s — flip them</text>
    <text x="548" y="196">every row now leads with 1</text>
  </g>
  <text x="340" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Leading 1s first — worth more than the rest of a row combined — then each</text>
  <text x="340" y="280" text-anchor="middle" fill="#1a2026" font-size="13">column takes its majority: the rows read 15 + 9 + 15 = <tspan fill="#4169E1" font-weight="600">39</tspan>.</text>
</svg>
