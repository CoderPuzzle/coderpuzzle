<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- grid = [[1,0,0,0],[1,1,1,0]], hits = [[1,0]]; cells 56x40, replay grid at (40,80), restored grid at (360,80) -->
  <text x="152" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">after applying the hit (1,0)</text>
  <text x="472" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">restore (1,0), re-union</text>
  <!-- replay grid: top component (0,0) accented; the hit cell sits empty -->
  <rect x="40" y="80" width="56" height="40" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="96" y="80" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="152" y="80" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="208" y="80" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="40" y="120" width="56" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="96" y="120" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="152" y="120" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="208" y="120" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle">
    <text x="68" y="105">1</text><text x="124" y="105">0</text><text x="180" y="105">0</text><text x="236" y="105">0</text>
    <text x="68" y="145" fill="#9aa7b2" font-size="11">hit</text>
    <text x="124" y="145">1</text><text x="180" y="145">1</text><text x="236" y="145">0</text>
  </g>
  <rect x="36" y="76" width="64" height="48" rx="8" fill="none" stroke="#4169E1" stroke-width="2"/>
  <!-- restored grid: the top-connected L of four bricks; ticks mark the restored brick's two new unions -->
  <rect x="360" y="80" width="56" height="40" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="416" y="80" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="472" y="80" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="528" y="80" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="360" y="120" width="56" height="40" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="416" y="120" width="56" height="40" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="472" y="120" width="56" height="40" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="528" y="120" width="56" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle">
    <text x="388" y="105">1</text><text x="444" y="105">0</text><text x="500" y="105">0</text><text x="556" y="105">0</text>
    <text x="388" y="145">1</text><text x="444" y="145">1</text><text x="500" y="145">1</text><text x="556" y="145">0</text>
  </g>
  <path d="M 356 76 L 420 76 L 420 116 L 532 116 L 532 164 L 356 164 Z" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g stroke="#4169E1" stroke-width="3" stroke-linecap="round">
    <line x1="372" y1="113" x2="372" y2="127"/>
    <line x1="409" y1="146" x2="423" y2="146"/>
  </g>
  <line x1="272" y1="120" x2="350" y2="120" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="312" y="104" text-anchor="middle" fill="#5c6b76" font-size="12">reverse time</text>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="152" y="192">before = <tspan fill="#4169E1">1</tspan></text>
    <text x="472" y="192">after = <tspan fill="#4169E1">4</tspan></text>
  </g>
  <text x="320" y="230" text-anchor="middle" fill="#1a2026" font-size="13">falls = after - before - 1 = 4 - 1 - 1 = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="320" y="252" text-anchor="middle" fill="#1a2026" font-size="13">bricks (1,1) and (1,2) are the two newly top-connected bricks that drop.</text>
</svg>
