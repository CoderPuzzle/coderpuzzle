<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="308" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- k = 2, n = 6; dp[m][e] rows m = 0..3 (y 80/116/152/188, h 36), cols e = 1,2
       (x 116/184, w 68); dp[3][2] = dp[2][1] + dp[2][2] + 1 = 2 + 3 + 1 = 6 >= 6 -->
  <text x="156" y="48" text-anchor="middle" fill="#5c6b76" font-size="12.5">floors resolvable — k = 2, n = 6</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="88" y="70">m</text><text x="150" y="70">e = 1</text><text x="218" y="70">e = 2</text>
  </g>
  <rect x="184" y="188" width="68" height="36" fill="#dbe4fb"/>
  <rect x="60" y="80" width="192" height="36" fill="#f0f3f7"/>
  <rect x="60" y="80" width="192" height="144" fill="none" stroke="#42525e" stroke-width="1.4"/>
  <g stroke="#42525e" stroke-width="1">
    <line x1="116" y1="80" x2="116" y2="224"/>
    <line x1="184" y1="80" x2="184" y2="224"/>
    <line x1="60" y1="116" x2="252" y2="116"/>
    <line x1="60" y1="152" x2="252" y2="152"/>
    <line x1="60" y1="188" x2="252" y2="188"/>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="108" y="102">m = 0</text><text x="108" y="138">m = 1</text>
    <text x="108" y="174">m = 2</text><text x="108" y="210">m = 3</text>
  </g>
  <g text-anchor="middle">
    <g fill="#9aa7b2">
      <text x="150" y="102">0</text><text x="218" y="102">0</text>
    </g>
    <g font-size="14">
      <text x="150" y="139">1</text><text x="218" y="139">1</text>
      <text x="150" y="175">2</text><text x="218" y="175">3</text>
      <text x="150" y="211">3</text>
    </g>
    <text x="218" y="212" fill="#4169E1" font-weight="700" font-size="16">6</text>
  </g>
  <!-- recurrence arrows into dp[3][2] -->
  <path d="M 174 177 L 193 195" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 252 170 C 272 170 272 206 254 206" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g>
    <text x="300" y="110" fill="#5c6b76" font-size="12.5">one drop: break → e - 1 eggs, m - 1 moves;</text>
    <text x="300" y="130" fill="#5c6b76" font-size="12.5">survive → e eggs; count the dropped floor itself.</text>
    <text x="300" y="176" font-weight="600">dp[m][e] = dp[m-1][e-1] + dp[m-1][e] + 1</text>
    <text x="300" y="206">dp[3][2] = 2 + 3 + 1 = <tspan fill="#4169E1" font-weight="700">6</tspan> ≥ n = 6</text>
    <text x="300" y="240">smallest m with dp[m][2] ≥ 6 → <tspan fill="#4169E1" font-weight="700" font-size="16">3 moves</tspan></text>
  </g>
  <text x="320" y="276" text-anchor="middle" fill="#1a2026" font-size="13">With 2 eggs the reachable floors grow 1, 3, 6 over moves 1, 2, 3;</text>
  <text x="320" y="294" text-anchor="middle" fill="#1a2026" font-size="13">dp[3][2] = 2 + 3 + 1 = <tspan fill="#4169E1" font-weight="600">6</tspan> is first to cover 6 floors — the answer is 3.</text>
</svg>
