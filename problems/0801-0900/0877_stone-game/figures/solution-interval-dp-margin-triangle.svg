<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- piles = [5,3,4,5]; dp cells 56x42 at x=110+56*j, y=74+42*i; dp[i][j] = best margin on piles[i..j]; lower triangle only -->
  <text x="320" y="30" text-anchor="middle" font-size="12.5" fill="#5c6b76">piles = [5, 3, 4, 5] — dp[i][j] = best stone margin for the mover on piles[i..j]</text>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="138" y="66">j=0</text><text x="194" y="66">j=1</text><text x="250" y="66">j=2</text><text x="306" y="66">j=3</text>
    <text x="100" y="101" text-anchor="end">i=0</text><text x="100" y="143" text-anchor="end">i=1</text><text x="100" y="185" text-anchor="end">i=2</text><text x="100" y="227" text-anchor="end">i=3</text>
  </g>
  <!-- unused upper triangle -->
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.2">
    <rect x="166" y="74" width="56" height="42"/><rect x="222" y="74" width="56" height="42"/><rect x="278" y="74" width="56" height="42"/>
    <rect x="222" y="116" width="56" height="42"/><rect x="278" y="116" width="56" height="42"/>
    <rect x="278" y="158" width="56" height="42"/>
  </g>
  <!-- base diagonal dp[i][i] = piles[i] -->
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="110" y="74" width="56" height="42"/><rect x="166" y="116" width="56" height="42"/>
    <rect x="222" y="158" width="56" height="42"/><rect x="278" y="200" width="56" height="42"/>
  </g>
  <!-- longer intervals; the two cells feeding dp[0][3] carry the accent border -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="166" y="74" width="56" height="42"/><rect x="278" y="116" width="56" height="42" stroke="#4169E1" stroke-width="2"/>
    <rect x="222" y="74" width="56" height="42" stroke="#4169E1" stroke-width="2"/><rect x="222" y="116" width="56" height="42"/>
    <rect x="166" y="158" width="56" height="42"/>
  </g>
  <!-- final answer cell dp[0][3] -->
  <rect x="278" y="74" width="56" height="42" fill="#4169E1"/>
  <g text-anchor="middle">
    <g fill="#1a2026">
      <text x="138" y="100" font-weight="600">5</text>
      <text x="194" y="142" font-weight="600">3</text>
      <text x="250" y="184" font-weight="600">4</text>
      <text x="306" y="226" font-weight="600">5</text>
      <text x="194" y="100">2</text>
      <text x="250" y="100">4</text>
      <text x="250" y="142">1</text>
      <text x="306" y="142">4</text>
      <text x="306" y="184">1</text>
    </g>
    <text x="306" y="100" fill="#ffffff" font-weight="600">1</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="392" y="92">fill by increasing interval length:</text>
    <text x="392" y="114">length 1 — base, dp[i][i] = piles[i]</text>
    <text x="392" y="136">lengths 2–3 — each open end feeds</text>
    <text x="392" y="158">the max; accent border marks the</text>
    <text x="392" y="180">two cells behind the final one</text>
  </g>
  <g font-size="13" fill="#1a2026">
    <text x="392" y="216">dp[0][3] = max(</text>
    <text x="392" y="238">5 − dp[1][3], 5 − dp[0][2])</text>
    <text x="392" y="260">= max(1, 1) = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="13" fill="#1a2026">Filled by increasing length, the whole row [5, 3, 4, 5] is worth a margin of <tspan fill="#4169E1" font-weight="600">1</tspan>:</text>
  <text x="320" y="314" text-anchor="middle" font-size="13" fill="#1a2026">Alice finishes 9 stones to Bob's 8, so dp[0][3] = 1 &gt; 0 — Alice wins.</text>
</svg>
