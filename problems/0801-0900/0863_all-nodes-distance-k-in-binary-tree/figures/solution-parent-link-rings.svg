<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 388" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="388" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [3,5,1,6,2,0,8,null,null,7,4], target = 5, k = 2.
       Solid edges are the tree; dashed accent arrows are the parent
       links the first BFS records (child -> parent). Fills show the
       walk from the target: d1 ring {3,6,2} light, d2 frontier
       {7,4,1} accent -> sorted answer [1,4,7]. -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="280" y1="56" x2="170" y2="136"/>
    <line x1="280" y1="56" x2="390" y2="136"/>
    <line x1="170" y1="136" x2="100" y2="216"/>
    <line x1="170" y1="136" x2="240" y2="216"/>
    <line x1="390" y1="136" x2="320" y2="216"/>
    <line x1="390" y1="136" x2="460" y2="216"/>
    <line x1="240" y1="216" x2="170" y2="296"/>
    <line x1="240" y1="216" x2="310" y2="296"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.4" stroke-dasharray="5 3" fill="none">
    <line x1="186.3" y1="114.2" x2="254.3" y2="64.8" marker-end="url(#arrow)"/>
    <line x1="373.7" y1="114.2" x2="305.7" y2="64.8" marker-end="url(#arrow)"/>
    <line x1="111.1" y1="191.2" x2="146.9" y2="150.3" marker-end="url(#arrow)"/>
    <line x1="228.9" y1="191.2" x2="193.1" y2="150.3" marker-end="url(#arrow)"/>
    <line x1="331.1" y1="191.2" x2="366.9" y2="150.3" marker-end="url(#arrow)"/>
    <line x1="448.9" y1="191.2" x2="413.1" y2="150.3" marker-end="url(#arrow)"/>
    <line x1="181.1" y1="271.2" x2="216.9" y2="230.3" marker-end="url(#arrow)"/>
    <line x1="298.9" y1="271.2" x2="263.1" y2="230.3" marker-end="url(#arrow)"/>
  </g>
  <circle cx="320" cy="216" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="320" y="221" text-anchor="middle" font-weight="600" fill="#1a2026">0</text>
  <circle cx="460" cy="216" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="460" y="221" text-anchor="middle" font-weight="600" fill="#1a2026">8</text>
  <circle cx="280" cy="56" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="280" y="61" text-anchor="middle" font-weight="600" fill="#1a2026">3</text>
  <circle cx="100" cy="216" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="100" y="221" text-anchor="middle" font-weight="600" fill="#1a2026">6</text>
  <circle cx="240" cy="216" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="240" y="221" text-anchor="middle" font-weight="600" fill="#1a2026">2</text>
  <circle cx="390" cy="136" r="20" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/>
  <text x="390" y="141" text-anchor="middle" font-weight="600" fill="#ffffff">1</text>
  <circle cx="170" cy="296" r="20" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/>
  <text x="170" y="301" text-anchor="middle" font-weight="600" fill="#ffffff">7</text>
  <circle cx="310" cy="296" r="20" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/>
  <text x="310" y="301" text-anchor="middle" font-weight="600" fill="#ffffff">4</text>
  <circle cx="170" cy="136" r="20" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/>
  <text x="170" y="141" text-anchor="middle" font-weight="600" fill="#ffffff">5</text>
  <circle cx="170" cy="136" r="25" fill="none" stroke="#4169E1" stroke-width="1.2"/>
  <text x="170" y="105" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">target 5</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="170" y="174">d 0</text>
    <text x="280" y="94">d 1</text>
    <text x="100" y="254">d 1</text>
    <text x="240" y="254">d 1</text>
    <text x="390" y="174">d 2</text>
    <text x="170" y="334">d 2</text>
    <text x="310" y="334">d 2</text>
  </g>
  <g font-size="12.5">
    <text x="595" y="104" text-anchor="middle" fill="#5c6b76" font-weight="600">BFS rings from target 5</text>
    <text x="520" y="136" fill="#5c6b76">ring 0: 5</text>
    <text x="520" y="160" fill="#5c6b76">ring 1: 3, 6, 2</text>
    <text x="534" y="176" fill="#9aa7b2" font-size="11">parent 3 + children 6, 2</text>
    <text x="520" y="200" fill="#4169E1" font-weight="600">ring 2: 1, 7, 4</text>
    <text x="534" y="216" fill="#9aa7b2" font-size="11">across the root, under 2</text>
    <text x="520" y="248" fill="#4169E1" font-size="13.5" font-weight="600">sorted: [1, 4, 7]</text>
    <text x="520" y="276" fill="#5c6b76" font-size="11">dashed = parent link</text>
    <text x="520" y="292" fill="#5c6b76" font-size="11">recorded by pass 1</text>
  </g>
  <text x="340" y="356" text-anchor="middle" fill="#1a2026" font-size="13">With parent links recorded, the walk spreads one edge per ring: ring 1 takes</text>
  <text x="340" y="374" text-anchor="middle" fill="#1a2026" font-size="13">parent 3 and children 6, 2; ring 2 gathers <tspan fill="#4169E1" font-weight="600">1, 7, 4</tspan> — the sorted answer.</text>
</svg>
