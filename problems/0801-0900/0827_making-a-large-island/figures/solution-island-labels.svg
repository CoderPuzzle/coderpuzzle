<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<rect x="90" y="70" width="68" height="68" fill="#e8edf8" stroke="#1a2026"/>
  <text x="124.0" y="110.0" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <text x="124.0" y="62" text-anchor="middle" fill="#4169E1" font-size="11">1</text>
  <rect x="162" y="70" width="68" height="68" fill="#ffffff" stroke="#1a2026"/>
  <text x="196.0" y="110.0" text-anchor="middle" fill="#1a2026" font-weight="600">0</text>
  <text x="196.0" y="62" text-anchor="middle" fill="#4169E1" font-size="11">A</text>
  <rect x="90" y="142" width="68" height="68" fill="#ffffff" stroke="#1a2026"/>
  <text x="124.0" y="182.0" text-anchor="middle" fill="#1a2026" font-weight="600">0</text>
  <text x="124.0" y="134" text-anchor="middle" fill="#4169E1" font-size="11">B</text>
  <rect x="162" y="142" width="68" height="68" fill="#e8edf8" stroke="#1a2026"/>
  <text x="196.0" y="182.0" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <text x="196.0" y="134" text-anchor="middle" fill="#4169E1" font-size="11">1</text>
  <text x="40" y="40" fill="#5c6b76" font-size="12">The first flood fill labels the two islands A and B (sizes 1 and 1).</text>
  <text x="40" y="240" fill="#5c6b76" font-size="12">Each water cell collects the distinct neighboring labels and scores</text>
  <text x="40" y="258" fill="#5c6b76" font-size="12">1 + size(A) + size(B) = 3 when flipped &#8212; the set is what prevents</text>
  <text x="40" y="276" fill="#5c6b76" font-size="12">an island that touches on two sides from being added twice.</text>
</svg>
