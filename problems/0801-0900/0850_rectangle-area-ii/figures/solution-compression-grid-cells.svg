<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="310" fill="#ffffff"/>
  <!-- rectangles [[0,0,2,2],[1,0,2,3],[1,0,3,1]]; xs = ys = [0,1,2,3]; cells 56x56 at (90+56i, 60+56j), row j = y-strip [2-j, 3-j); covered: (0,0),(0,1),(1,0),(1,1),(1,2),(2,0) -->
  <text x="80" y="48" text-anchor="end" fill="#9aa7b2" font-size="11">y</text>
  <text x="278" y="250" fill="#9aa7b2" font-size="11">x</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="90" y="60" width="56" height="56" fill="#ffffff"/>
    <rect x="146" y="60" width="56" height="56" fill="#dbe4fb"/>
    <rect x="202" y="60" width="56" height="56" fill="#ffffff"/>
    <rect x="90" y="116" width="56" height="56" fill="#dbe4fb"/>
    <rect x="146" y="116" width="56" height="56" fill="#dbe4fb"/>
    <rect x="202" y="116" width="56" height="56" fill="#ffffff"/>
    <rect x="90" y="172" width="56" height="56" fill="#dbe4fb"/>
    <rect x="146" y="172" width="56" height="56" fill="#dbe4fb"/>
    <rect x="202" y="172" width="56" height="56" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="174" y="94">1</text>
    <text x="118" y="150">1</text><text x="174" y="150">1</text>
    <text x="118" y="206">1</text><text x="174" y="206">1</text><text x="230" y="206">1</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="9.5">
    <text x="198" y="129">×2</text><text x="198" y="185">×3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="90" y="250">0</text><text x="146" y="250">1</text><text x="202" y="250">2</text><text x="258" y="250">3</text>
    <text x="80" y="64">3</text><text x="80" y="120">2</text><text x="80" y="176">1</text><text x="80" y="232">0</text>
  </g>
  <g fill="#1a2026" font-size="13">
    <text x="310" y="76">sorted unique xs = [0, 1, 2, 3]</text>
    <text x="310" y="98">sorted unique ys = [0, 1, 2, 3]</text>
    <text x="310" y="132" fill="#5c6b76">each rectangle marks [xi1, xi2) × [yi1, yi2)</text>
    <text x="310" y="154" fill="#5c6b76">a shaded cell's real area: Δx · Δy = 1 · 1 = 1</text>
    <text x="310" y="192">overlaps re-mark cells; they count once:</text>
    <text x="310" y="216" font-size="15" font-weight="600">total = 1+1+1+1+1+1 = <tspan fill="#4169E1">6</tspan></text>
  </g>
  <text x="320" y="274" text-anchor="middle" fill="#1a2026" font-size="13">No rectangle edge cuts a compressed cell, so each shaded cell is a real 1 × 1;</text>
  <text x="320" y="294" text-anchor="middle" fill="#1a2026" font-size="13">the <tspan fill="#4169E1" font-weight="600">6</tspan> shaded cells sum to 6, the double-marked ones counted once.</text>
</svg>
