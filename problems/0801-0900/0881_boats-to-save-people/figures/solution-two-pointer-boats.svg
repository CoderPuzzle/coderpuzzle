<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- people = [3,2,2,1] sorted to [1,2,2,3], limit = 3; cells 64x48 at x=168+80i, y=44;
       boat rows 1-3 at y=226/276/326, chips centred on x=364 -->
  <text x="320" y="28" text-anchor="middle" fill="#5c6b76" font-size="12.5">people = [3, 2, 2, 1] sorted → [1, 2, 2, 3], limit = 3</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="168" y="44" width="64" height="48"/><rect x="248" y="44" width="64" height="48"/>
    <rect x="328" y="44" width="64" height="48"/><rect x="408" y="44" width="64" height="48"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="200" y="75">1</text><text x="280" y="75">2</text><text x="360" y="75">2</text><text x="440" y="75">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="200" y="112">0</text><text x="280" y="112">1</text><text x="360" y="112">2</text><text x="440" y="112">3</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 200 172 V 124" marker-end="url(#arrow)"/>
    <path d="M 440 172 V 124" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="200" y="190">i = 0</text><text x="440" y="190">j = 3</text>
  </g>
  <!-- boat 1: 1 + 3 &gt; 3, heaviest sails alone -->
  <text x="56" y="230" fill="#5c6b76" font-size="12.5">i = 0, j = 3</text>
  <text x="196" y="230" fill="#5c6b76">1 + 3 = 4 &gt; 3</text>
  <rect x="336" y="208" width="56" height="36" rx="18" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="364" y="231" text-anchor="middle" font-weight="600">3</text>
  <text x="430" y="230" fill="#1a2026">boats = 1</text>
  <!-- boat 2: 1 + 2 = 3 fits, pair shares -->
  <text x="56" y="280" fill="#5c6b76" font-size="12.5">i = 0, j = 2</text>
  <text x="196" y="280" fill="#4169E1" font-weight="600">1 + 2 = 3 ≤ 3</text>
  <rect x="316" y="258" width="96" height="36" rx="18" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <text x="344" y="281" text-anchor="middle" font-weight="600">1</text>
  <text x="384" y="281" text-anchor="middle" font-weight="600">2</text>
  <text x="430" y="280" fill="#1a2026">boats = 2</text>
  <!-- boat 3: i = j, last person alone -->
  <text x="56" y="330" fill="#5c6b76" font-size="12.5">i = j = 1</text>
  <text x="196" y="330" fill="#5c6b76">last person boards</text>
  <rect x="336" y="308" width="56" height="36" rx="18" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="364" y="331" text-anchor="middle" font-weight="600">2</text>
  <text x="430" y="330" fill="#1a2026">boats = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="320" y="374" text-anchor="middle" fill="#1a2026" font-size="13">The heaviest boards every boat: 3 sails alone (1 + 3 &gt; 3), then (1, 2) share,</text>
  <text x="320" y="392" text-anchor="middle" fill="#1a2026" font-size="13">then the last 2 sails alone — <tspan fill="#4169E1" font-weight="600">3 boats</tspan> for [3, 2, 2, 1] with limit 3.</text>
</svg>
