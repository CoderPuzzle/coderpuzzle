<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "ab#c", t = "ad#c"; cells 46x42, s row y=58, t row y=150, x from 170;
       gray cells are deleted, accent arcs show each # spending its skip on the letter to its left -->
  <text x="40" y="50" fill="#5c6b76" font-size="12.5">s = &#8220;ab#c&#8221;</text>
  <text x="40" y="142" fill="#5c6b76" font-size="12.5">t = &#8220;ad#c&#8221;</text>
  <!-- each # banks one skip and strikes the nearest live letter left of it -->
  <g fill="none" stroke="#4169E1" stroke-width="1.6">
    <path d="M 285 52 Q 262 30 239 52" marker-end="url(#arrow)"/>
    <path d="M 285 144 Q 262 122 239 144" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">
    <text x="262" y="24">bank 1 skip, strike b</text>
    <text x="262" y="116">bank 1 skip, strike d</text>
  </g>
  <!-- s cells -->
  <g stroke-width="1.5">
    <rect x="170" y="58" width="46" height="42" fill="#ffffff" stroke="#4169E1"/>
    <rect x="216" y="58" width="46" height="42" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="262" y="58" width="46" height="42" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="308" y="58" width="46" height="42" fill="#ffffff" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="193" y="85" fill="#1a2026">a</text>
    <text x="239" y="85" fill="#9aa7b2">b</text>
    <text x="285" y="85" fill="#9aa7b2">#</text>
    <text x="331" y="85" fill="#1a2026">c</text>
  </g>
  <!-- t cells -->
  <g stroke-width="1.5">
    <rect x="170" y="150" width="46" height="42" fill="#ffffff" stroke="#4169E1"/>
    <rect x="216" y="150" width="46" height="42" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="262" y="150" width="46" height="42" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="308" y="150" width="46" height="42" fill="#ffffff" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="193" y="177" fill="#1a2026">a</text>
    <text x="239" y="177" fill="#9aa7b2">d</text>
    <text x="285" y="177" fill="#9aa7b2">#</text>
    <text x="331" y="177" fill="#1a2026">c</text>
  </g>
  <!-- survivors compared pairwise -->
  <path d="M 166 79 H 142 V 171 H 166" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <path d="M 360 79 H 384 V 171 H 360" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <text x="142" y="68" text-anchor="middle" fill="#4169E1" font-size="13.5" font-weight="600">a = a</text>
  <text x="396" y="134" fill="#4169E1" font-size="13.5" font-weight="600">c = c</text>
  <text x="340" y="240" text-anchor="middle" fill="#1a2026" font-size="13">Walking right to left, each # banks one skip and deletes the nearest live</text>
  <text x="340" y="260" text-anchor="middle" fill="#1a2026" font-size="13">letter &#8212; b and d are struck, both texts type out <tspan fill="#4169E1" font-weight="600">ac</tspan>, so the answer is true.</text>
</svg>
