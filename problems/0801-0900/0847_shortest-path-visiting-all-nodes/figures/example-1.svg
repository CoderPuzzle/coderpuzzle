<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 226" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- graph = [[1,2,3],[0],[0],[0]]: star around node 0; path 1-0-2-0-3 -->
  <g stroke="#4169E1" stroke-width="3" fill="none">
    <line x1="187.5" y1="56.9" x2="96" y2="151.5" marker-end="url(#pa)"/>
    <line x1="200" y1="62" x2="200" y2="145" marker-start="url(#pa)" marker-end="url(#pa)"/>
    <line x1="212.5" y1="56.9" x2="304" y2="151.5" marker-end="url(#pa)"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="200" cy="44" r="18"/>
    <circle cx="80" cy="168" r="18"/>
    <circle cx="200" cy="168" r="18"/>
    <circle cx="320" cy="168" r="18"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="200" y="49">0</text>
    <text x="80" y="173">1</text>
    <text x="200" y="173">2</text>
    <text x="320" y="173">3</text>
  </g>
  <!-- step order along the route -->
  <g>
    <circle cx="132" cy="98" r="9.5" fill="#4169E1"/>
    <circle cx="222" cy="96" r="9.5" fill="#4169E1"/>
    <circle cx="222" cy="126" r="9.5" fill="#4169E1"/>
    <circle cx="268" cy="98" r="9.5" fill="#4169E1"/>
    <g fill="#ffffff" text-anchor="middle" font-size="11">
      <text x="132" y="102">1</text>
      <text x="222" y="100">2</text>
      <text x="222" y="130">3</text>
      <text x="268" y="102">4</text>
    </g>
  </g>
  <text x="200" y="216" text-anchor="middle" fill="#5c6b76" font-size="12.5">route 1 &#8594; 0 &#8594; 2 &#8594; 0 &#8594; 3 visits every node in 4 moves</text>
</svg>
