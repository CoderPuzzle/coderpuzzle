<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- arr = [2,1,4,7,3,2,5]; cells 64x42 at y=128, x from 116; profile vertex y = 128 - 9*value;
       peak at index 3 (the 7), mountain cells 1..5 shaded, cursor jumps from i=3 past the right foot to i=6 -->
  <!-- value profile -->
  <path d="M 148 110 L 212 119 L 276 92 L 340 65 L 404 101 L 468 110 L 532 83" fill="none" stroke="#9aa7b2" stroke-width="1.6"/>
  <path d="M 212 119 L 276 92 L 340 65 L 404 101 L 468 110" fill="none" stroke="#4169E1" stroke-width="2.4"/>
  <circle cx="340" cy="65" r="4" fill="#4169E1"/>
  <text x="340" y="50" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">peak: 4 &lt; 7 &gt; 3</text>
  <!-- strict slope expansion arrows from the peak -->
  <path d="M 332 58 L 222 112" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 348 58 L 458 104" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="72" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">strict rise</text>
  <text x="430" y="66" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">strict fall</text>
  <!-- array cells -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="116" y="128" width="64" height="42" fill="#f0f3f7"/>
    <rect x="180" y="128" width="64" height="42" fill="#dbe4fb"/>
    <rect x="244" y="128" width="64" height="42" fill="#dbe4fb"/>
    <rect x="308" y="128" width="64" height="42" fill="#dbe4fb"/>
    <rect x="372" y="128" width="64" height="42" fill="#dbe4fb"/>
    <rect x="436" y="128" width="64" height="42" fill="#dbe4fb"/>
    <rect x="500" y="128" width="64" height="42" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="148" y="155" fill="#9aa7b2">2</text>
    <text x="212" y="155" fill="#1a2026">1</text>
    <text x="276" y="155" fill="#1a2026">4</text>
    <text x="340" y="155" fill="#1a2026">7</text>
    <text x="404" y="155" fill="#1a2026">3</text>
    <text x="468" y="155" fill="#1a2026">2</text>
    <text x="532" y="155" fill="#9aa7b2">5</text>
  </g>
  <!-- the measured mountain -->
  <path d="M 180 180 V 186 H 500 V 180" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <text x="340" y="208" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">mountain [1, 4, 7, 3, 2] &#8212; length <tspan fill="#4169E1">5</tspan></text>
  <!-- cursor jumps past the right foot -->
  <path d="M 366 224 Q 460 250 528 196" fill="none" stroke="#5c6b76" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowgray)"/>
  <text x="460" y="264" text-anchor="middle" fill="#5c6b76" font-size="11.5">scan ends at i = 6 = n - 1</text>
  <text x="340" y="300" text-anchor="middle" fill="#1a2026" font-size="13">From peak 7 the strict walks reach 1 on the left and 2 on the right &#8212;</text>
  <text x="340" y="320" text-anchor="middle" fill="#1a2026" font-size="13">mountain [1, 4, 7, 3, 2] answers <tspan fill="#4169E1" font-weight="600">5</tspan>; the trailing 5 climbs but never crests.</text>
</svg>
