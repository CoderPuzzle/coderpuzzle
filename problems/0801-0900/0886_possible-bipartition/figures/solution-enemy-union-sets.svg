<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 4, dislikes = [[1,2],[1,3],[2,4]]; left: dislike graph;
       right: person 1 unions enemies 2-&gt;3, person 2 unions 1-&gt;4 (parent[child]);
       resulting same-group sets {2,3} and {1,4} -->
  <text x="140" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">dislike graph</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="140" y1="90" x2="70" y2="190"/>
    <line x1="140" y1="90" x2="210" y2="190"/>
    <line x1="70" y1="190" x2="140" y2="290"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="140" cy="90" r="17"/><circle cx="70" cy="190" r="17"/>
    <circle cx="210" cy="190" r="17"/><circle cx="140" cy="290" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="140" y="95">1</text><text x="70" y="195">2</text>
    <text x="210" y="195">3</text><text x="140" y="295">4</text>
  </g>
  <text x="330" y="66" fill="#5c6b76" font-size="12.5">each person's enemies union into one set</text>
  <!-- step 1: person 1's enemies 2 and 3 -->
  <text x="330" y="104">person 1 dislikes 2 and 3</text>
  <circle cx="346" cy="138" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="406" cy="138" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="346" y="142">2</text><text x="406" y="142">3</text>
  </g>
  <path d="M 352 123 Q 376 103 400 123" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="376" y="135" text-anchor="middle" fill="#4169E1" font-size="11">union</text>
  <text x="440" y="143" fill="#4169E1" font-weight="600">→ {2, 3}</text>
  <!-- step 2: person 2's enemies 1 and 4 -->
  <text x="330" y="190">person 2 dislikes 1 and 4</text>
  <circle cx="346" cy="224" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="406" cy="224" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="346" y="228">1</text><text x="406" y="228">4</text>
  </g>
  <path d="M 352 209 Q 376 189 400 209" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="376" y="221" text-anchor="middle" fill="#4169E1" font-size="11">union</text>
  <text x="440" y="229" fill="#4169E1" font-weight="600">→ {1, 4}</text>
  <!-- result sets -->
  <text x="475" y="266" text-anchor="middle" fill="#5c6b76" font-size="12">same-group sets — the two sides</text>
  <rect x="340" y="278" width="88" height="34" rx="6" fill="#dbe4fb"/>
  <rect x="460" y="278" width="88" height="34" rx="6" fill="#dbe4fb"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="384" y="300">{2, 3}</text><text x="504" y="300">{1, 4}</text>
  </g>
  <text x="330" y="340">no dislike pair shares a set → <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="320" y="370" text-anchor="middle" fill="#1a2026" font-size="13">Union-find merges 1's enemies {2, 3} and 2's enemies {1, 4} — the two groups.</text>
  <text x="320" y="388" text-anchor="middle" fill="#1a2026" font-size="13">Every dislike pair (1, 2), (1, 3), (2, 4) spans the two sets, so the split is possible.</text>
</svg>
