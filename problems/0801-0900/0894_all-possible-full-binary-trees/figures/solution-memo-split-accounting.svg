<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="368" fill="#ffffff"/>
  <!-- n = 7: memo chips shapes(1)=1, shapes(3)=1, shapes(5)=2; split rows l=1,3,5 pair left/right shape counts, giving 1x2 + 1x1 + 2x1 = 5 trees -->
  <text x="56" y="54" text-anchor="end" fill="#5c6b76" font-size="12.5">memo</text>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1">
    <rect x="70" y="30" width="155" height="38" rx="6"/>
    <rect x="250" y="30" width="155" height="38" rx="6"/>
    <rect x="430" y="30" width="155" height="38" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="147.5" y="54">shapes(1) = 1</text>
    <text x="327.5" y="54">shapes(3) = 1</text>
    <text x="507.5" y="54">shapes(5) = 2</text>
  </g>
  <!-- split rows -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="105" y="108" width="155" height="44"/><rect x="305" y="108" width="165" height="44"/>
    <rect x="105" y="178" width="155" height="44"/><rect x="305" y="178" width="165" height="44"/>
    <rect x="105" y="248" width="155" height="44"/><rect x="305" y="248" width="165" height="44"/>
  </g>
  <g font-weight="600">
    <text x="48" y="135">l = 1</text>
    <text x="48" y="205">l = 3</text>
    <text x="48" y="275">l = 5</text>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="182.5" y="135">size 1 · 1 shape</text>
    <text x="387.5" y="135">size 5 · 2 shapes</text>
    <text x="182.5" y="205">size 3 · 1 shape</text>
    <text x="387.5" y="205">size 3 · 1 shape</text>
    <text x="182.5" y="275">size 5 · 2 shapes</text>
    <text x="387.5" y="275">size 1 · 1 shape</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="15">
    <text x="283" y="136">×</text>
    <text x="283" y="206">×</text>
    <text x="283" y="276">×</text>
    <text x="495" y="136">=</text>
    <text x="495" y="206">=</text>
    <text x="495" y="276">=</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#4169E1">
    <text x="560" y="135">2 trees</text>
    <text x="560" y="205">1 tree</text>
    <text x="560" y="275">2 trees</text>
  </g>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">For n = 7 the loop walks l = 1, 3, 5, spending the 6 child nodes as (l, 6 - l):</text>
  <text x="320" y="346" text-anchor="middle" fill="#1a2026" font-size="13">1×2 + 1×1 + 2×1 = <tspan fill="#4169E1" font-weight="600">5</tspan> full trees, each built once from memoized halves.</text>
</svg>
