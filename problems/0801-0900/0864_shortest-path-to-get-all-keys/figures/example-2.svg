<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- ["@..aA","..B#.","....b"]; route @ -> a -> through lock A -> b in 6 moves -->
  <g fill="#e5ebfa">
    <rect x="40" y="28" width="48" height="48"/>
    <rect x="88" y="28" width="48" height="48"/>
    <rect x="136" y="28" width="48" height="48"/>
    <rect x="184" y="28" width="48" height="48"/>
    <rect x="232" y="28" width="48" height="48"/>
    <rect x="232" y="76" width="48" height="48"/>
    <rect x="232" y="124" width="48" height="48"/>
  </g>
  <g stroke="#b9c4cd" stroke-width="1" fill="none">
    <rect x="40" y="28" width="240" height="48"/>
    <rect x="40" y="76" width="240" height="48"/>
    <rect x="40" y="124" width="240" height="48"/>
    <line x1="88" y1="28" x2="88" y2="172"/>
    <line x1="136" y1="28" x2="136" y2="172"/>
    <line x1="184" y1="28" x2="184" y2="172"/>
    <line x1="232" y1="28" x2="232" y2="172"/>
  </g>
  <rect x="184" y="76" width="48" height="48" fill="#5c6b76"/>
  <polyline points="64,52 112,52 160,52 208,52 256,52 256,100 256,142" fill="none" stroke="#4169E1" stroke-width="3" marker-end="url(#pa)"/>
  <g text-anchor="middle" font-weight="600">
    <text x="64" y="58" fill="#1a2026">@</text>
    <text x="112" y="58" fill="#b9c4cd" font-weight="400">.</text>
    <text x="160" y="58" fill="#b9c4cd" font-weight="400">.</text>
    <text x="208" y="58" fill="#2e7d43">a</text>
    <text x="256" y="58" fill="#b03030">A</text>
    <text x="64" y="106" fill="#b9c4cd" font-weight="400">.</text>
    <text x="112" y="106" fill="#b9c4cd" font-weight="400">.</text>
    <text x="160" y="106" fill="#b03030">B</text>
    <text x="256" y="106" fill="#b9c4cd" font-weight="400">.</text>
    <text x="64" y="154" fill="#b9c4cd" font-weight="400">.</text>
    <text x="112" y="154" fill="#b9c4cd" font-weight="400">.</text>
    <text x="160" y="154" fill="#b9c4cd" font-weight="400">.</text>
    <text x="208" y="154" fill="#b9c4cd" font-weight="400">.</text>
    <text x="256" y="154" fill="#2e7d43">b</text>
  </g>
  <text x="160" y="188" text-anchor="middle" fill="#5c6b76" font-size="12.5">6 moves: key a opens lock A, so the run straight down the right column reaches b</text>
</svg>
