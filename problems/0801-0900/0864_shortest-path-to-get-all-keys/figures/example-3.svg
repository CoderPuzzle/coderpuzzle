<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 118" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- ["@Aa"]: key a lies behind lock A and there is no way around -->
  <g stroke="#b9c4cd" stroke-width="1" fill="none">
    <rect x="60" y="20" width="48" height="48"/>
    <rect x="108" y="20" width="48" height="48"/>
    <rect x="156" y="20" width="48" height="48"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="84" y="50" fill="#1a2026">@</text>
    <text x="132" y="50" fill="#b03030">A</text>
    <text x="180" y="50" fill="#2e7d43">a</text>
  </g>
  <g stroke="#b03030" stroke-width="3" stroke-linecap="round">
    <line x1="108" y1="32" x2="108" y2="56"/>
    <line x1="102" y1="38" x2="114" y2="50"/>
    <line x1="102" y1="50" x2="114" y2="38"/>
  </g>
  <text x="150" y="102" text-anchor="middle" fill="#5c6b76" font-size="12.5">the only route to key a passes lock A, and its key is on the far side: -1</text>
</svg>
