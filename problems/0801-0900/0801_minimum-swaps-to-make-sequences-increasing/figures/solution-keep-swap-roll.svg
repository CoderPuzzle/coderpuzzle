<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums1 = [1,3,5,4]; nums2 = [1,2,3,7]; columns = index; the keep/swap pair rolls left to right; blue arc = natural license, gray dashed = crossed -->
  <text x="340" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">keep = i left in place, swap = i swapped (min ops through i)</text>
  <!-- value cells -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="66" y="64" width="48" height="30"/><rect x="246" y="64" width="48" height="30"/>
    <rect x="426" y="64" width="48" height="30"/><rect x="606" y="64" width="48" height="30"/>
    <rect x="66" y="100" width="48" height="30"/><rect x="246" y="100" width="48" height="30"/>
    <rect x="426" y="100" width="48" height="30"/><rect x="606" y="100" width="48" height="30"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="90" y="84">1</text><text x="270" y="84">3</text><text x="450" y="84">5</text><text x="630" y="84">4</text>
    <text x="90" y="120">1</text><text x="270" y="120">2</text><text x="450" y="120">3</text><text x="630" y="120">7</text>
  </g>
  <text x="56" y="84" text-anchor="end" fill="#5c6b76" font-size="12.5">nums1</text>
  <text x="56" y="120" text-anchor="end" fill="#5c6b76" font-size="12.5">nums2</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="90" y="148">i = 0</text><text x="270" y="148">i = 1</text>
    <text x="450" y="148">i = 2</text><text x="630" y="148">i = 3</text>
  </g>
  <!-- natural arcs (top) -->
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 128 184 Q 180 162 232 184" marker-end="url(#arrow)"/>
    <path d="M 308 184 Q 360 162 412 184" marker-end="url(#arrow)"/>
  </g>
  <path d="M 488 184 Q 540 162 592 184" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">
    <text x="180" y="154">natural</text>
    <text x="360" y="154">natural</text>
  </g>
  <text x="540" y="154" text-anchor="middle" fill="#9aa7b2" font-size="12">natural: 5 &lt; 4 fails</text>
  <!-- state pairs -->
  <g text-anchor="middle" font-size="13.5">
    <text x="90" y="200"><tspan fill="#5c6b76">keep </tspan><tspan fill="#1a2026" font-weight="700">0</tspan></text>
    <text x="90" y="224"><tspan fill="#5c6b76">swap </tspan><tspan fill="#1a2026" font-weight="700">1</tspan></text>
    <text x="270" y="200"><tspan fill="#5c6b76">keep </tspan><tspan fill="#1a2026" font-weight="700">0</tspan></text>
    <text x="270" y="224"><tspan fill="#5c6b76">swap </tspan><tspan fill="#1a2026" font-weight="700">1</tspan></text>
    <text x="450" y="200"><tspan fill="#5c6b76">keep </tspan><tspan fill="#1a2026" font-weight="700">0</tspan></text>
    <text x="450" y="224"><tspan fill="#5c6b76">swap </tspan><tspan fill="#1a2026" font-weight="700">2</tspan></text>
    <text x="630" y="200"><tspan fill="#5c6b76">keep </tspan><tspan fill="#1a2026" font-weight="700">2</tspan></text>
    <text x="630" y="224"><tspan fill="#5c6b76">swap </tspan><tspan fill="#4169E1" font-weight="700">1</tspan></text>
  </g>
  <!-- crossed arcs (bottom) -->
  <g fill="none" stroke="#5c6b76" stroke-width="2" stroke-dasharray="5 4">
    <path d="M 128 240 Q 180 262 232 240" marker-end="url(#arrowm)"/>
    <path d="M 488 240 Q 540 262 592 240" marker-end="url(#arrowm)"/>
  </g>
  <path d="M 308 240 Q 360 262 412 240" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#5c6b76">
    <text x="180" y="280">crossed</text>
    <text x="540" y="280">crossed</text>
  </g>
  <text x="360" y="280" text-anchor="middle" fill="#9aa7b2" font-size="12">crossed: 3 &lt; 3 fails</text>
  <text x="340" y="308" text-anchor="middle" fill="#1a2026" font-size="13">At i = 3 the natural order fails (5 &lt; 4 is false), so only the crossed flip</text>
  <text x="340" y="326" text-anchor="middle" fill="#1a2026" font-size="13">applies: keep = 2, swap = 1 &#8212; answer min(2, 1) = <tspan fill="#4169E1" font-weight="600">1</tspan>, the swap at index 3.</text>
</svg>
