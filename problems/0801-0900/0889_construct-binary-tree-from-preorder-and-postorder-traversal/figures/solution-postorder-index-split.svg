<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- pre = [1,2,4,5,3,6,7], post = [4,5,2,6,7,3,1]; cells 40x32 at x=100+40i,
       pre y=56, post y=112; root 1's next value 2 found at post index 2 gives
       left size 3 (post[0..3) = [4,5,2]) and right size 3 (post[3..6) = [6,7,3]);
       at node 2 child 4 is at index 0, at node 3 child 6 at index 3, both size 1 -->
  <text x="88" y="76" text-anchor="end" fill="#5c6b76" font-size="12.5">pre</text>
  <rect x="100" y="56" width="40" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="140" y="56" width="40" height="32"/><rect x="180" y="56" width="40" height="32"/>
    <rect x="220" y="56" width="40" height="32"/><rect x="260" y="56" width="40" height="32"/>
    <rect x="300" y="56" width="40" height="32"/><rect x="340" y="56" width="40" height="32"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="120" y="77">1</text><text x="160" y="77">2</text><text x="200" y="77">4</text>
    <text x="240" y="77">5</text><text x="280" y="77">3</text><text x="320" y="77">6</text><text x="360" y="77">7</text>
  </g>
  <g fill="none" stroke="#42525e" stroke-width="1.2">
    <path d="M 140 46 V 40 H 260 V 46"/>
    <path d="M 260 46 V 40 H 380 V 46"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="120" y="32">root</text>
    <text x="200" y="32">left [2, 4, 5]</text>
    <text x="320" y="32">right [3, 6, 7]</text>
  </g>
  <text x="88" y="132" text-anchor="end" fill="#5c6b76" font-size="12.5">post</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="100" y="112" width="40" height="32"/><rect x="140" y="112" width="40" height="32"/>
    <rect x="220" y="112" width="40" height="32"/><rect x="260" y="112" width="40" height="32"/>
    <rect x="300" y="112" width="40" height="32"/><rect x="340" y="112" width="40" height="32"/>
  </g>
  <rect x="180" y="112" width="40" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-size="13.5">
    <text x="120" y="133">4</text><text x="160" y="133">5</text><text x="200" y="133">2</text>
    <text x="240" y="133">6</text><text x="280" y="133">7</text><text x="320" y="133">3</text><text x="360" y="133">1</text>
  </g>
  <path d="M 167 90 C 180 96 184 104 180 110" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="196" y="104" fill="#4169E1" font-size="11.5">find 2 → post index 2</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="120" y="158">0</text><text x="160" y="158">1</text><text x="200" y="158">2</text>
    <text x="240" y="158">3</text><text x="280" y="158">4</text><text x="320" y="158">5</text><text x="360" y="158">6</text>
  </g>
  <g fill="none" stroke="#42525e" stroke-width="1.2">
    <path d="M 100 164 V 170 H 220 V 164"/>
    <path d="M 220 164 V 170 H 340 V 164"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="160" y="188">(size 3)</text>
    <text x="280" y="188">(size 3)</text>
  </g>
  <!-- assembled tree 1(2(4,5), 3(6,7)) -->
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="320" y1="252" x2="220" y2="304"/>
    <line x1="320" y1="252" x2="420" y2="304"/>
    <line x1="220" y1="304" x2="170" y2="356"/>
    <line x1="220" y1="304" x2="270" y2="356"/>
    <line x1="420" y1="304" x2="370" y2="356"/>
    <line x1="420" y1="304" x2="470" y2="356"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="220" cy="304" r="14"/><circle cx="420" cy="304" r="14"/>
    <circle cx="170" cy="356" r="14"/><circle cx="270" cy="356" r="14"/>
    <circle cx="370" cy="356" r="14"/><circle cx="470" cy="356" r="14"/>
  </g>
  <circle cx="320" cy="252" r="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="320" y="256.5">1</text>
    <text x="220" y="308.5">2</text><text x="420" y="308.5">3</text>
    <text x="170" y="360.5">4</text><text x="270" y="360.5">5</text>
    <text x="370" y="360.5">6</text><text x="470" y="360.5">7</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="196" y="308" text-anchor="end">child 4 → post 0 · size 1</text>
    <text x="444" y="308">child 6 → post 3 · size 1</text>
  </g>
  <text x="320" y="396" text-anchor="middle" fill="#1a2026" font-size="13">The next root's postorder index sizes the left span: 2 sits at index 2 → 3 + 3;</text>
  <text x="320" y="414" text-anchor="middle" fill="#1a2026" font-size="13">4 at index 0 and 6 at index 3 → 1 + 1 — building <tspan fill="#4169E1" font-weight="600">1(2(4, 5), 3(6, 7))</tspan>.</text>
</svg>
