<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- grid = [[3,0,8,4],[2,4,5,7],[9,2,6,3],[0,3,1,0]]; rowMax = [8,7,9,3], colMax = [9,4,8,7]; cells 46x34 at (64,72) and (356,72) -->
  <text x="156" y="54" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid</text>
  <text x="448" y="54" text-anchor="middle" fill="#5c6b76" font-size="12.5">gridNew = min(rowMax, colMax)</text>
  <text x="258" y="64" fill="#5c6b76" font-size="11.5">rowMax</text>
  <text x="550" y="64" fill="#5c6b76" font-size="11.5">increase</text>
  <!-- left grid, cell (2,3) highlighted; its two bracketing maxima are accented -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="64" y="72" width="46" height="34"/><rect x="110" y="72" width="46" height="34"/><rect x="156" y="72" width="46" height="34"/><rect x="202" y="72" width="46" height="34"/>
    <rect x="64" y="106" width="46" height="34"/><rect x="110" y="106" width="46" height="34"/><rect x="156" y="106" width="46" height="34"/><rect x="202" y="106" width="46" height="34"/>
    <rect x="64" y="140" width="46" height="34"/><rect x="110" y="140" width="46" height="34"/><rect x="156" y="140" width="46" height="34"/>
    <rect x="64" y="174" width="46" height="34"/><rect x="110" y="174" width="46" height="34"/><rect x="156" y="174" width="46" height="34"/><rect x="202" y="174" width="46" height="34"/>
  </g>
  <rect x="202" y="140" width="46" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" fill="#1a2026">
    <text x="87" y="94">3</text><text x="133" y="94">0</text><text x="179" y="94">8</text><text x="225" y="94">4</text>
    <text x="87" y="128">2</text><text x="133" y="128">4</text><text x="179" y="128">5</text><text x="225" y="128">7</text>
    <text x="87" y="162">9</text><text x="133" y="162">2</text><text x="179" y="162">6</text><text x="225" y="162" font-weight="600">3</text>
    <text x="87" y="196">0</text><text x="133" y="196">3</text><text x="179" y="196">1</text><text x="225" y="196">0</text>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="258" y="94">8</text><text x="258" y="128">7</text><text x="258" y="162" fill="#4169E1" font-weight="600">9</text><text x="258" y="196">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="87" y="228">9</text><text x="133" y="228">4</text><text x="179" y="228">8</text><text x="225" y="228" fill="#4169E1" font-weight="600">7</text>
  </g>
  <text x="56" y="228" text-anchor="end" fill="#5c6b76" font-size="11.5">colMax</text>
  <line x1="300" y1="157" x2="348" y2="157" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- right grid: raised heights; row increases on the right -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="356" y="72" width="46" height="34"/><rect x="402" y="72" width="46" height="34"/><rect x="448" y="72" width="46" height="34"/><rect x="494" y="72" width="46" height="34"/>
    <rect x="356" y="106" width="46" height="34"/><rect x="402" y="106" width="46" height="34"/><rect x="448" y="106" width="46" height="34"/><rect x="494" y="106" width="46" height="34"/>
    <rect x="356" y="140" width="46" height="34"/><rect x="402" y="140" width="46" height="34"/><rect x="448" y="140" width="46" height="34"/>
    <rect x="356" y="174" width="46" height="34"/><rect x="402" y="174" width="46" height="34"/><rect x="448" y="174" width="46" height="34"/><rect x="494" y="174" width="46" height="34"/>
  </g>
  <rect x="494" y="140" width="46" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" fill="#1a2026">
    <text x="379" y="94">8</text><text x="425" y="94">4</text><text x="471" y="94">8</text><text x="517" y="94">7</text>
    <text x="379" y="128">7</text><text x="425" y="128">4</text><text x="471" y="128">7</text><text x="517" y="128">7</text>
    <text x="379" y="162">9</text><text x="425" y="162">4</text><text x="471" y="162">8</text><text x="517" y="162" fill="#4169E1" font-weight="600">7</text>
    <text x="379" y="196">3</text><text x="425" y="196">3</text><text x="471" y="196">3</text><text x="517" y="196">3</text>
  </g>
  <g fill="#4169E1" font-size="13" font-weight="600">
    <text x="550" y="94">+12</text><text x="550" y="128">+7</text><text x="550" y="162">+8</text><text x="550" y="196">+8</text>
  </g>
  <text x="320" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Each cell rises to min(rowMax[r], colMax[c]) — cell (2,3): min(9, 7) = 7.</text>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">Row increases 12 + 7 + 8 + 8 = <tspan fill="#4169E1" font-weight="600">35</tspan>, all four skylines unchanged.</text>
</svg>
