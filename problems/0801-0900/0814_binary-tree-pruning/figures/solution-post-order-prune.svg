<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- root = [1,null,0,0,1]; circles r=22: root (200,70), 0-node (320,150), leaves (250,230) and (390,230); dashed = pruned -->
  <text x="295" y="36" text-anchor="middle" fill="#5c6b76" font-size="12.5">root = [1, null, 0, 0, 1]</text>
  <!-- edges -->
  <line x1="216" y1="84" x2="304" y2="136" stroke="#4169E1" stroke-width="1.6"/>
  <line x1="304" y1="164" x2="262" y2="212" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="336" y1="164" x2="378" y2="212" stroke="#4169E1" stroke-width="1.6"/>
  <!-- kept nodes: accent stroke; pruned 0 leaf: gray, dashed -->
  <circle cx="200" cy="70" r="22" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="200" y="76" text-anchor="middle" fill="#1a2026">1</text>
  <circle cx="320" cy="150" r="22" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="320" y="156" text-anchor="middle" fill="#1a2026">0</text>
  <circle cx="250" cy="230" r="22" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="250" y="236" text-anchor="middle" fill="#9aa7b2">0</text>
  <circle cx="390" cy="230" r="22" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="390" y="236" text-anchor="middle" fill="#1a2026">1</text>
  <!-- post-order verdicts -->
  <text x="250" y="274" text-anchor="middle" fill="#9aa7b2" font-size="12.5" font-weight="600">1st: prune</text>
  <text x="390" y="274" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">2nd: keep</text>
  <text x="270" y="146" text-anchor="end" fill="#4169E1" font-size="12.5" font-weight="600">3rd: keep</text>
  <text x="270" y="162" text-anchor="end" fill="#5c6b76" font-size="12">a 1 child survives</text>
  <text x="236" y="66" fill="#4169E1" font-size="12.5" font-weight="600">4th: root val 1 — keep</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">Post-order judges children first: the lone 0 leaf holds no 1, so it drops;</text>
  <text x="320" y="328" text-anchor="middle" fill="#1a2026" font-size="13">its 0 parent keeps a surviving 1 child — result [1, null, 0, null, 1].</text>
</svg>
