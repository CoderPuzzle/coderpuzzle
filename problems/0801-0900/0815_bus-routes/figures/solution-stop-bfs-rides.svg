<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- routes = [[1,2,7],[3,6,7]], source = 1, target = 6; stop circles r=22 on rows y=88 and y=184, columns x = 120, 260, 400 -->
  <text x="120" y="44" text-anchor="middle" fill="#1a2026" font-size="12.5">start, 0 rides</text>
  <line x1="120" y1="52" x2="120" y2="62" stroke="#42525e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="60" y="93" text-anchor="end" fill="#5c6b76" font-size="12.5">bus 1</text>
  <text x="60" y="189" text-anchor="end" fill="#5c6b76" font-size="12.5">bus 2</text>
  <!-- bus 1: boarded once at stop 1, lands on 2 and 7 -->
  <line x1="142" y1="88" x2="238" y2="88" stroke="#4169E1" stroke-width="2.5"/>
  <line x1="282" y1="88" x2="378" y2="88" stroke="#4169E1" stroke-width="2.5"/>
  <text x="190" y="74" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">ride 1</text>
  <circle cx="120" cy="88" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="260" cy="88" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="400" cy="88" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="120" y="93">1</text><text x="260" y="93">2</text><text x="400" y="93">7</text>
  </g>
  <!-- bus 2: boarded at the shared stop 7, reaches target 6 -->
  <line x1="142" y1="184" x2="238" y2="184" stroke="#4169E1" stroke-width="2.5"/>
  <line x1="282" y1="184" x2="378" y2="184" stroke="#4169E1" stroke-width="2.5"/>
  <text x="330" y="172" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">ride 2</text>
  <circle cx="120" cy="184" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="260" cy="184" r="22" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.5"/>
  <circle cx="400" cy="184" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="120" y="189">3</text><text x="260" y="189">6</text><text x="400" y="189">7</text>
  </g>
  <text x="260" y="230" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">target</text>
  <!-- transfer at the shared stop and dedup notes -->
  <line x1="400" y1="114" x2="400" y2="158" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="416" y="136" fill="#5c6b76" font-size="12">transfer at 7</text>
  <text x="120" y="136" text-anchor="middle" fill="#5c6b76" font-size="11.5">at stop 2: bus 1 already used</text>
  <text x="300" y="136" text-anchor="middle" fill="#5c6b76" font-size="11.5">stops 2, 7 enqueued</text>
  <text x="320" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Board bus 1 once at stop 1 (ride 1 lands on 2 and 7), then bus 2 at stop 7:</text>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">target 6 is reached on ride <tspan fill="#4169E1" font-weight="600">2</tspan> — used routes are skipped, never re-boarded.</text>
</svg>
