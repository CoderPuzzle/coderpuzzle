  <g font-size="12.5" fill="#5c6b76">
    <text x="474" y="77.5">(0,10) d9</text>
    <text x="474" y="115.5">(0,9) d4</text>
    <text x="474" y="153.5">(0,4) d2 &#183; (4,9) d2</text>
    <text x="474" y="191.5">(0,2) d1 &#183; (2,4) d1 &#183; (4,9) d2</text>
    <text x="474" y="229.5">(0,2) d1 &#183; <tspan fill="#4169E1" font-weight="600">(2,4)+(4,9) &#8594; (2,9) d3</tspan></text>
    <text x="474" y="267.5">(0,2) d1 &#183; (2,5) d1 &#183; (5,9) d2</text>
  </g>
  <text x="350" y="308" text-anchor="middle" fill="#1a2026" font-size="13">seat() serves the best gap segment &#8212; seat 0 (empty room), then 9, 4, 2;</text>
  <text x="350" y="326" text-anchor="middle" fill="#1a2026" font-size="13">leave(4) re-merges (2,4) + (4,9) into (2,9), whose midpoint seat <tspan fill="#4169E1" font-weight="600">5</tspan> wins next.</text>
</svg>
