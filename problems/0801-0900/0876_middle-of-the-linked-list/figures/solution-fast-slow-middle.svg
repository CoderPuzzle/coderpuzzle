<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="324" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- head = [1,2,3,4,5]: nodes r=22 at y=130, x = 90 + 110*i; final state slow on node 3 (accent), fast on node 5 -->
  <text x="320" y="32" text-anchor="middle" font-size="12.5" fill="#5c6b76">head = [1, 2, 3, 4, 5]</text>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="112" y1="130" x2="178" y2="130" marker-end="url(#arrow)"/>
    <line x1="222" y1="130" x2="288" y2="130" marker-end="url(#arrow)"/>
    <line x1="332" y1="130" x2="398" y2="130" marker-end="url(#arrow)"/>
    <line x1="442" y1="130" x2="508" y2="130" marker-end="url(#arrow)"/>
    <line x1="552" y1="130" x2="578" y2="130" marker-end="url(#arrow)"/>
  </g>
  <text x="586" y="135" font-size="12.5" fill="#5c6b76">null</text>
  <circle cx="90" cy="130" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="200" cy="130" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="310" cy="130" r="22" fill="#4169E1"/>
  <circle cx="420" cy="130" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="530" cy="130" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="90" y="135" fill="#1a2026">1</text>
    <text x="200" y="135" fill="#1a2026">2</text>
    <text x="310" y="135" fill="#ffffff" font-weight="600">3</text>
    <text x="420" y="135" fill="#1a2026">4</text>
    <text x="530" y="135" fill="#1a2026">5</text>
  </g>
  <!-- fast pointer on node 5, slow pointer on node 3 -->
  <text x="530" y="64" text-anchor="middle" font-weight="600" fill="#1a2026">fast</text>
  <line x1="530" y1="72" x2="530" y2="104" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="310" y1="196" x2="310" y2="158" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowA)"/>
  <text x="322" y="192" font-weight="600" fill="#4169E1">slow</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="60" y="232">both start on node 1 — each iteration: slow takes one link, fast takes two</text>
    <text x="60" y="252">after iteration 1: slow on 2, fast on 3</text>
    <text x="60" y="272">after iteration 2: slow on 3, fast on 5</text>
  </g>
  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#1a2026">Iteration 3 stops: fast.next is null after node 5, and slow stands on</text>
  <text x="320" y="318" text-anchor="middle" font-size="13" fill="#1a2026">node <tspan fill="#4169E1" font-weight="600">3</tspan> — the middle of [1, 2, 3, 4, 5], returned as [3, 4, 5].</text>
</svg>
