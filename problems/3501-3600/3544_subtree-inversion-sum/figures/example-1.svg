<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]], nums = [4,-8,-6,3,7,-2,5], k = 2; invert {0,3,4,6} -> nums = [-4,8,6,3,7,2,5], sum 27 (verified by simulation) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="270" y1="44" x2="170" y2="128"/>
    <line x1="270" y1="44" x2="370" y2="128"/>
    <line x1="170" y1="128" x2="115" y2="212"/>
    <line x1="170" y1="128" x2="225" y2="212"/>
    <line x1="370" y1="128" x2="315" y2="212"/>
    <line x1="370" y1="128" x2="425" y2="212"/>
  </g>
  <!-- inverted nodes 0, 3, 4, 6 get the accent fill -->
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="270" cy="44" r="21"/>
    <circle cx="115" cy="212" r="21"/>
    <circle cx="225" cy="212" r="21"/>
    <circle cx="425" cy="212" r="21"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="170" cy="128" r="21"/>
    <circle cx="370" cy="128" r="21"/>
    <circle cx="315" cy="212" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="270" y="49">0</text>
    <text x="170" y="133">1</text>
    <text x="370" y="133">2</text>
    <text x="115" y="217">3</text>
    <text x="225" y="217">4</text>
    <text x="315" y="217">5</text>
    <text x="425" y="217">6</text>
  </g>
  <!-- original value -> final value (accent where it changed) -->
  <g font-size="12" text-anchor="middle">
    <text x="270" y="16" fill="#4169E1" font-weight="600">4 → -4</text>
    <text x="139" y="132" fill="#4169E1" font-weight="600" text-anchor="end">-8 → 8</text>
    <text x="401" y="132" fill="#4169E1" font-weight="600">-6 → 6</text>
    <text x="115" y="252" fill="#5c6b76">3</text>
    <text x="225" y="252" fill="#5c6b76">7</text>
    <text x="315" y="252" fill="#4169E1" font-weight="600">-2 → 2</text>
    <text x="425" y="252" fill="#4169E1" font-weight="600">-5 → 5</text>
  </g>
  <text x="270" y="282" text-anchor="middle" fill="#1a2026" font-size="13.5">invert 0, 3, 4 and 6 (filled nodes): nums becomes [-4, 8, 6, 3, 7, 2, 5], sum <tspan fill="#4169E1" font-weight="700">27</tspan></text>
</svg>
