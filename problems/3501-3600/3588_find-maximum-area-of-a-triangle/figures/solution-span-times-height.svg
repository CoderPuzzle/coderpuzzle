<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- coords = [[1,1],[1,2],[3,2],[3,3]]; plot 70 px per unit, origin (80,260); base on the line y = 2 from (1,2) to (3,2), span 2, apex (3,3) at height 1, so 2*area = 2 -->
  <g stroke="#f0f3f7" stroke-width="1.5">
    <line x1="150" y1="30" x2="150" y2="260"/><line x1="220" y1="30" x2="220" y2="260"/><line x1="290" y1="30" x2="290" y2="260"/>
    <line x1="80" y1="50" x2="380" y2="50"/><line x1="80" y1="120" x2="380" y2="120"/><line x1="80" y1="190" x2="380" y2="190"/>
  </g>
  <line x1="60" y1="260" x2="390" y2="260" stroke="#42525e" stroke-width="1.5"/>
  <line x1="80" y1="260" x2="80" y2="30" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="150" y="276">1</text><text x="220" y="276">2</text><text x="290" y="276">3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="70" y="194">1</text><text x="70" y="124">2</text><text x="70" y="54">3</text>
  </g>
  <!-- the winning triangle: base on y = 2, apex (3,3) -->
  <polygon points="150,120 290,120 290,50" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <line x1="150" y1="120" x2="290" y2="120" stroke="#4169E1" stroke-width="3.5"/>
  <line x1="290" y1="113" x2="290" y2="57" stroke="#4169E1" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="220" y="144" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">span = 3 − 1 = 2</text>
  <text x="302" y="90" fill="#4169E1" font-size="12.5" font-weight="600">h = 1</text>
  <g stroke="#1a2026" stroke-width="1.6">
    <circle cx="150" cy="190" r="7" fill="#ffffff"/>
    <circle cx="150" cy="120" r="7" fill="#4169E1"/>
    <circle cx="290" cy="120" r="7" fill="#4169E1"/>
    <circle cx="290" cy="50" r="7" fill="#4169E1"/>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="150" y="212" text-anchor="middle">(1, 1)</text>
    <text x="136" y="124" text-anchor="end">(1, 2)</text>
    <text x="304" y="124">(3, 2)</text>
    <text x="304" y="54">(3, 3)</text>
  </g>
  <!-- the per-line candidate bookkeeping -->
  <g font-size="12.5" fill="#1a2026">
    <text x="410" y="40" fill="#5c6b76" font-size="12">candidates per horizontal line:</text>
    <text x="410" y="64">line y = 2: span 3 − 1 = 2</text>
    <text x="410" y="88">y_min = 1, y_max = 3 — both</text>
    <text x="410" y="108">off the line, so h = 1</text>
    <text x="410" y="136">2·area = span × h</text>
    <text x="410" y="156">→ <tspan fill="#4169E1" font-weight="600">2 × 1 = 2</tspan> (the answer)</text>
  </g>
  <text x="40" y="306" fill="#1a2026" font-size="13">Every horizontal line contributes span × (y_max − y) and span × (y − y_min) when the</text>
  <text x="40" y="324" fill="#1a2026" font-size="13">extreme is off the line; here 2 × (3 − 2) = <tspan fill="#4169E1" font-weight="600">2</tspan>, twice the maximum triangle area.</text>
</svg>
