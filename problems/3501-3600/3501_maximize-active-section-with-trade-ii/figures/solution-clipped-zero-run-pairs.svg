<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s = "0100"; zero runs starts [0,2] lens [1,2]; pair sum 1+2 = 3 -->
  <!-- queries [[0,3],[0,2],[1,3],[2,3]] -> [4,3,1,1]; cells 88x44 at x=140+100k -->
  <!-- index labels -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="184" y="44">0</text><text x="284" y="44">1</text><text x="384" y="44">2</text><text x="484" y="44">3</text>
  </g>
  <!-- cell guides -->
  <g stroke="#dbe4fb" stroke-width="1" stroke-dasharray="3 4">
    <line x1="140" y1="100" x2="140" y2="372"/>
    <line x1="240" y1="100" x2="240" y2="372"/>
    <line x1="340" y1="100" x2="340" y2="372"/>
    <line x1="440" y1="100" x2="440" y2="372"/>
    <line x1="528" y1="100" x2="528" y2="372"/>
  </g>
  <!-- the string -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="140" y="52" width="88" height="44" fill="#dbe4fb"/>
    <rect x="240" y="52" width="88" height="44" fill="#ffffff"/>
    <rect x="340" y="52" width="88" height="44" fill="#dbe4fb"/>
    <rect x="440" y="52" width="88" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="184" y="80">0</text><text x="284" y="80">1</text><text x="384" y="80">0</text><text x="484" y="80">0</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="184" y="118">run 0: len 1</text>
    <text x="284" y="118">ones = 1</text>
    <text x="434" y="118">run 1: len 2</text>
  </g>
  <text x="334" y="148" text-anchor="middle" fill="#1a2026" font-size="12.5">pair sums: lens[0] + lens[1] = 1 + 2 = 3 — the sparse table's single entry, range max 3</text>
  <!-- query [0,3]: both runs whole, interior pair -> table max -->
  <g>
    <rect x="140" y="180" width="388" height="36" rx="6" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
    <rect x="142" y="182" width="86" height="32" rx="4" fill="#dbe4fb"/>
    <rect x="342" y="182" width="184" height="32" rx="4" fill="#dbe4fb"/>
    <text x="184" y="202" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">1</text>
    <text x="434" y="202" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">2</text>
    <text x="128" y="202" text-anchor="end" fill="#1a2026" font-size="12.5">[0, 3]</text>
    <text x="542" y="202" fill="#5c6b76" font-size="12">range max 3 -&gt; <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  </g>
  <!-- query [0,2]: run 1 clipped to len 1 -->
  <g>
    <rect x="440" y="228" width="88" height="36" fill="none" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="140" y="228" width="288" height="36" rx="6" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
    <rect x="142" y="230" width="86" height="32" rx="4" fill="#dbe4fb"/>
    <rect x="342" y="230" width="84" height="32" rx="4" fill="#dbe4fb"/>
    <text x="184" y="250" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">1</text>
    <text x="384" y="250" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">1</text>
    <text x="484" y="250" text-anchor="middle" fill="#9aa7b2" font-size="11">cut</text>
    <text x="128" y="250" text-anchor="end" fill="#1a2026" font-size="12.5">[0, 2]</text>
    <text x="542" y="250" fill="#5c6b76" font-size="12">clipped 1+1 = 2 -&gt; <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  </g>
  <!-- query [1,3]: only run 1, no pair -->
  <g>
    <rect x="240" y="276" width="288" height="36" rx="6" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
    <rect x="342" y="278" width="184" height="32" rx="4" fill="#dbe4fb"/>
    <text x="434" y="298" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">2</text>
    <text x="128" y="298" text-anchor="end" fill="#1a2026" font-size="12.5">[1, 3]</text>
    <text x="542" y="298" fill="#5c6b76" font-size="12">no pair -&gt; <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  </g>
  <!-- query [2,3]: only run 1, no pair -->
  <g>
    <rect x="340" y="324" width="188" height="36" rx="6" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
    <rect x="342" y="326" width="184" height="32" rx="4" fill="#dbe4fb"/>
    <text x="434" y="346" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">2</text>
    <text x="128" y="346" text-anchor="end" fill="#1a2026" font-size="12.5">[2, 3]</text>
    <text x="542" y="346" fill="#5c6b76" font-size="12">no pair -&gt; <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  </g>
  <text x="340" y="406" text-anchor="middle" fill="#1a2026" font-size="13">Interior pair sums answer by sparse-table range max; only the pairs touching the</text>
  <text x="340" y="424" text-anchor="middle" fill="#1a2026" font-size="13">window's clipped boundary runs are repaired by hand — the answers are <tspan fill="#4169E1" font-weight="600">4, 3, 1, 1</tspan>.</text>
</svg>
