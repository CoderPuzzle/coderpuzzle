<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="344" fill="#ffffff"/>
  <!-- nums = [9,4,1,3,7], k = 4; cells 88x40 at x = 96 + 98i, y = 36; window rows y = 134 + 28j with lo = 0,1,1,1,3; pre = [0,1,2,3,5,9] at cell boundaries; dp[i+1] = 1,1,2,4,6 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="96" y="36" width="88" height="40"/><rect x="194" y="36" width="88" height="40"/><rect x="292" y="36" width="88" height="40"/><rect x="390" y="36" width="88" height="40"/><rect x="488" y="36" width="88" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="140" y="62">9</text><text x="238" y="62">4</text><text x="336" y="62">1</text><text x="434" y="62">3</text><text x="532" y="62">7</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="140" y="96">0</text><text x="238" y="96">1</text><text x="336" y="96">2</text><text x="434" y="96">3</text><text x="532" y="96">4</text>
  </g>
  <g fill="#9aa7b2" font-size="12">
    <text x="40" y="116">pre</text>
    <text x="96" y="116" text-anchor="middle">0</text><text x="194" y="116" text-anchor="middle">1</text><text x="292" y="116" text-anchor="middle">2</text><text x="390" y="116" text-anchor="middle">3</text><text x="488" y="116" text-anchor="middle">5</text><text x="576" y="116" text-anchor="middle">9</text>
  </g>
  <!-- one bracket row per right end i: the valid-start window [lo..i] -->
  <g fill="#5c6b76" font-size="12">
    <text x="36" y="138">i = 0</text>
    <text x="36" y="166">i = 1</text>
    <text x="36" y="194">i = 2</text>
    <text x="36" y="222">i = 3</text>
    <text x="36" y="250">i = 4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 96 129 L 96 139 M 96 134 L 184 134 M 184 129 L 184 139"/>
    <path d="M 194 157 L 194 167 M 194 162 L 282 162 M 282 157 L 282 167"/>
    <path d="M 194 185 L 194 195 M 194 190 L 380 190 M 380 185 L 380 195"/>
    <path d="M 194 213 L 194 223 M 194 218 L 478 218 M 478 213 L 478 223"/>
  </g>
  <path d="M 488 241 L 488 251 M 488 246 L 576 246 M 576 241 L 576 251" stroke="#4169E1" stroke-width="2" fill="none"/>
  <g fill="#5c6b76" font-size="12">
    <text x="196" y="138">lo = 0, spread 0</text>
    <text x="294" y="166">lo = 1, min 4, max 4</text>
    <text x="392" y="194">lo = 1, min 1, max 4</text>
    <text x="490" y="222">lo = 1, min 1, max 4</text>
  </g>
  <text x="476" y="250" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">lo = 3, min 3, max 7</text>
  <text x="40" y="278" fill="#5c6b76" font-size="12">dp[i + 1]</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="140" y="278">1</text><text x="238" y="278">1</text><text x="336" y="278">2</text><text x="434" y="278">4</text><text x="532" y="278" fill="#4169E1">6</text>
  </g>
  <text x="40" y="312" fill="#1a2026" font-size="13">dp[i + 1] = pre[i + 1] − pre[lo]; the last window skips [1..4] and [2..4] (7 − 1 = 6 &gt; 4)</text>
  <text x="40" y="330" fill="#1a2026" font-size="13">and settles on [3..4], so dp[5] = pre[5] − pre[3] = 9 − 3 = <tspan fill="#4169E1" font-weight="600">6</tspan>, the answer.</text>
</svg>
