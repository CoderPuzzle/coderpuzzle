<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="412" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- treap of [1,2,3,4,5] with reference LCG priorities: root 1 (xor 1); 1.right=4 (xor 0); 4.left=2 (xor 1), 4.right=5; 2.right=3;
       split(root,1)+split(rest,3) -> A=[1], mid=[2,3,4] rooted at 4 with xor 5, C=[5]; rev toggled on whole array [1,2,10,4,5] -> [5,4,10,2,1]; final xor 8 -->
  <text x="30" y="30" fill="#5c6b76" font-size="12.5">Query [2,1,3] — split(root, 1), split(rest, 3):</text>
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="80" y1="64" x2="136" y2="104"/>
    <line x1="136" y1="104" x2="94" y2="148"/>
    <line x1="136" y1="104" x2="182" y2="148"/>
    <line x1="94" y1="148" x2="136" y2="192"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="80" cy="64" r="15"/><circle cx="136" cy="104" r="15"/><circle cx="94" cy="148" r="15"/><circle cx="136" cy="192" r="15"/><circle cx="182" cy="148" r="15"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="80" y="69">1</text><text x="136" y="109">4</text><text x="94" y="153">2</text><text x="136" y="197">3</text><text x="182" y="153">5</text>
  </g>
  <g fill="#5c6b76" font-size="10.5">
    <text x="52" y="68" text-anchor="end">xor 1</text>
    <text x="158" y="97">xor 0</text>
    <text x="66" y="152" text-anchor="end">xor 1</text>
  </g>
  <path d="M 215 120 H 272" stroke="#42525e" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="247" y="92" text-anchor="middle" fill="#5c6b76" font-size="12">split(1) · split(3)</text>
  <!-- pieces -->
  <text x="324" y="80" text-anchor="middle" fill="#5c6b76" font-size="11.5">A = [1]</text>
  <circle cx="324" cy="110" r="15" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="324" y="115" text-anchor="middle" font-weight="600" font-size="13">1</text>
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="428" y1="104" x2="384" y2="148"/>
    <line x1="384" y1="148" x2="400" y2="192"/>
  </g>
  <circle cx="428" cy="104" r="16" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="384" cy="148" r="15" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="400" cy="192" r="15" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="428" y="109">4</text><text x="384" y="153">2</text><text x="400" y="197">3</text>
  </g>
  <text x="415" y="224" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">xor = 2^3^4 = 5</text>
  <text x="415" y="242" text-anchor="middle" fill="#5c6b76" font-size="11">mid = nums[1..3]</text>
  <text x="560" y="80" text-anchor="middle" fill="#5c6b76" font-size="11.5">C = [5]</text>
  <circle cx="560" cy="110" r="15" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="560" y="115" text-anchor="middle" font-weight="600" font-size="13">5</text>
  <!-- lazy reversal -->
  <text x="30" y="272" fill="#5c6b76" font-size="12.5">Query [3,0,4] — split out the whole array, toggle one lazy rev flag:</text>
  <rect x="40" y="290" width="150" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="115" y="311" text-anchor="middle" font-weight="600" font-size="13">1  2  10  4  5</text>
  <path d="M 200 307 H 296" stroke="#4169E1" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>
  <text x="249" y="295" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">rev := true</text>
  <rect x="308" y="290" width="160" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="388" y="311" text-anchor="middle" font-weight="600" font-size="13">5  4  10  2  1</text>
  <text x="551" y="282" text-anchor="middle" fill="#5c6b76" font-size="11">[2,0,4]</text>
  <rect x="492" y="290" width="118" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="551" y="311" text-anchor="middle" font-size="13">xor = <tspan fill="#4169E1" font-weight="600">8</tspan></text>
  <text x="320" y="368" text-anchor="middle" fill="#1a2026" font-size="13">Lazy rev swaps children only at push; XOR is order-independent, so subtree xors survive.</text>
  <text x="320" y="390" text-anchor="middle" fill="#1a2026" font-size="13">The split answers [2,1,3] with mid xor <tspan fill="#4169E1" font-weight="600">5</tspan>; the final query [2,0,4] reads root xor <tspan fill="#4169E1" font-weight="600">8</tspan>.</text>
</svg>
