<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="560" height="250" fill="#ffffff"/>
  <!-- string cells -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <rect x="60" y="30" width="50" height="44" rx="4"/>
    <rect x="110" y="30" width="50" height="44" rx="4"/>
    <rect x="160" y="30" width="50" height="44" rx="4"/>
    <rect x="210" y="30" width="50" height="44" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="85" y="58">b</text><text x="135" y="58">c</text><text x="185" y="58">d</text><text x="235" y="58">a</text>
  </g>
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="85" y="22">i=0</text><text x="135" y="22">1</text><text x="185" y="22">2</text><text x="235" y="22">3</text>
  </g>
  <!-- nested arcs -->
  <path d="M 110 84 Q 160 116 210 84" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <text x="160" y="120" text-anchor="middle" fill="#4169E1" font-size="12.5">“cd”: |c−d| = 1 → removable</text>
  <path d="M 60 84 Q 160 178 260 84" fill="none" stroke="#1a2026" stroke-width="1.6"/>
  <text x="160" y="182" text-anchor="middle" fill="#1a2026" font-size="12.5">“bcda”: |b−a| = 1 (circular) and inner part removable → whole string removable</text>
  <text x="160" y="212" text-anchor="middle" fill="#5c6b76" font-size="12.5">rem[i][j] recurses like matched parentheses: split into two removable parts,</text>
  <text x="160" y="230" text-anchor="middle" fill="#5c6b76" font-size="12.5">or pair the endpoints when their letters are circular neighbours.</text>
  <!-- rem table -->
  <g font-size="11.5" text-anchor="middle">
    <text x="392" y="40" fill="#5c6b76">rem[i][j]</text>
    <rect x="378" y="46" width="24" height="22" fill="#f3f5f7" stroke="#98a2ac"/>
    <rect x="402" y="46" width="24" height="22" fill="#e8edfa" stroke="#4169E1"/>
    <rect x="426" y="46" width="24" height="22" fill="#f3f5f7" stroke="#98a2ac"/>
    <rect x="450" y="46" width="24" height="22" fill="#e8edfa" stroke="#4169E1"/>
    <rect x="378" y="68" width="24" height="22" fill="#f3f5f7" stroke="#98a2ac"/>
    <rect x="402" y="68" width="24" height="22" fill="#f3f5f7" stroke="#98a2ac"/>
    <rect x="426" y="68" width="24" height="22" fill="#e8edfa" stroke="#4169E1"/>
    <rect x="450" y="68" width="24" height="22" fill="#f3f5f7" stroke="#98a2ac"/>
    <rect x="426" y="90" width="24" height="22" fill="#f3f5f7" stroke="#98a2ac"/>
    <rect x="450" y="90" width="24" height="22" fill="#f3f5f7" stroke="#98a2ac"/>
    <rect x="450" y="112" width="24" height="22" fill="#f3f5f7" stroke="#98a2ac"/>
    <text x="414" y="61" fill="#4169E1" font-weight="600">1</text>
    <text x="462" y="61" fill="#4169E1" font-weight="600">1</text>
    <text x="438" y="83" fill="#4169E1" font-weight="600">1</text>
  </g>
</svg>
