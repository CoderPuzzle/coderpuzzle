<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- chain par=[-1,0,1] vals=[5,2,7]; path xors 5,7,0; circles r=22 at x=90; boxes 34x28, own col x=230, result col x=306+40k; badges 1-3 = bottom-up finish order -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="90" y1="92" x2="90" y2="153"/>
    <line x1="90" y1="197" x2="90" y2="258"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="90" cy="70" r="22"/>
    <circle cx="90" cy="175" r="22"/>
    <circle cx="90" cy="280" r="22"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="90" y="75">5</text><text x="90" y="180">2</text><text x="90" y="285">7</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="58" y="75">node 0</text><text x="58" y="180">node 1</text><text x="58" y="285">node 2</text>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="124" y="75">xor 5</text><text x="124" y="180">xor 7</text><text x="124" y="285">xor 0</text>
  </g>
  <!-- finish-order badges -->
  <g fill="#4169E1">
    <circle cx="210" cy="70" r="10"/><circle cx="210" cy="175" r="10"/><circle cx="210" cy="280" r="10"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">
    <text x="210" y="74">3</text><text x="210" y="179">2</text><text x="210" y="284">1</text>
  </g>
  <!-- own-xor boxes -->
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="230" y="56" width="34" height="28"/>
    <rect x="230" y="161" width="34" height="28"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="247" y="75">5</text><text x="247" y="180">7</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="15">
    <text x="282" y="80">&#8746;</text><text x="282" y="185">&#8746;</text>
  </g>
  <!-- merged sorted distinct lists -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="306" y="266" width="34" height="28"/>
    <rect x="306" y="161" width="34" height="28"/><rect x="346" y="161" width="34" height="28"/>
    <rect x="306" y="56" width="34" height="28"/><rect x="346" y="56" width="34" height="28"/><rect x="386" y="56" width="34" height="28"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="323" y="285" fill="#1a2026">0</text>
    <text x="323" y="180" fill="#1a2026">0</text><text x="363" y="180" fill="#1a2026">7</text>
    <text x="323" y="75" fill="#4169E1">0</text><text x="363" y="75" fill="#4169E1">5</text><text x="403" y="75" fill="#4169E1">7</text>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 323 266 Q 323 228 292 198" marker-end="url(#arrow)"/>
    <path d="M 343 189 Q 343 138 292 106" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="350" y="232">splice {0} into {7}</text>
    <text x="360" y="138">fold {0,7} into {5}</text>
  </g>
  <!-- query answers from the final lists -->
  <text x="520" y="96" fill="#5c6b76" font-size="12.5">queries</text>
  <g font-size="13">
    <text x="520" y="126" fill="#5c6b76">[0,1] &#8594; <tspan fill="#4169E1" font-weight="600">0</tspan></text>
    <text x="520" y="154" fill="#5c6b76">[1,2] &#8594; <tspan fill="#4169E1" font-weight="600">7</tspan></text>
    <text x="520" y="182" fill="#5c6b76">[1,3] &#8594; <tspan fill="#1a2026">-1</tspan></text>
    <text x="520" y="210" fill="#5c6b76">[2,1] &#8594; <tspan fill="#4169E1" font-weight="600">0</tspan></text>
  </g>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">Merging bottom-up, node 1 builds [0, 7] and node 0 builds <tspan fill="#4169E1" font-weight="600">[0, 5, 7]</tspan>; query</text>
  <text x="340" y="348" text-anchor="middle" fill="#1a2026" font-size="13">[1,2] reads <tspan fill="#4169E1" font-weight="600">7</tspan>, [1,3] answers -1 with only two distinct values, [2,1] reads 0.</text>
</svg>
