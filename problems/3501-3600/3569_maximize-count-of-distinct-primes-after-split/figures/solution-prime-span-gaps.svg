<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="520" height="340" fill="#ffffff"/>
  <!-- nums = [2,2,3,3,2] after query 2; cells 60x46 at (130,60); split gaps k=1..4 at x=190+60(k-1); span of 2 = [1,4], span of 3 = [3,3] -->
  <text x="280" y="46" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums after query 2</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="130" y="60" width="60" height="46" fill="#dbe4fb"/>
    <rect x="190" y="60" width="60" height="46" fill="#dbe4fb"/>
    <rect x="250" y="60" width="60" height="46" fill="#ffffff"/>
    <rect x="310" y="60" width="60" height="46" fill="#ffffff"/>
    <rect x="370" y="60" width="60" height="46" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="17" font-weight="600">
    <text x="160" y="89" fill="#4169E1">2</text><text x="220" y="89" fill="#4169E1">2</text>
    <text x="280" y="89" fill="#1a2026">3</text><text x="340" y="89" fill="#1a2026">3</text>
    <text x="400" y="89" fill="#4169E1">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="160" y="126">0</text><text x="220" y="126">1</text><text x="280" y="126">2</text>
    <text x="340" y="126">3</text><text x="400" y="126">4</text>
  </g>
  <rect x="294" y="134" width="32" height="164" fill="#dbe4fb"/>
  <g stroke="#9aa7b2" stroke-width="1" stroke-dasharray="3 3">
    <line x1="190" y1="134" x2="190" y2="280"/>
    <line x1="250" y1="134" x2="250" y2="280"/>
    <line x1="310" y1="134" x2="310" y2="280"/>
    <line x1="370" y1="134" x2="370" y2="280"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="190" y="150">k=1</text><text x="250" y="150">k=2</text>
    <text x="310" y="150">k=3</text><text x="370" y="150">k=4</text>
  </g>
  <!-- lane: span of prime 2 -->
  <text x="36" y="194" fill="#5c6b76" font-size="12.5">span of 2 = [1,4]</text>
  <line x1="186" y1="184" x2="186" y2="196" stroke="#4169E1" stroke-width="2"/>
  <line x1="374" y1="184" x2="374" y2="196" stroke="#4169E1" stroke-width="2"/>
  <line x1="186" y1="190" x2="374" y2="190" stroke="#4169E1" stroke-width="3"/>
  <g fill="#4169E1">
    <circle cx="190" cy="190" r="4"/><circle cx="250" cy="190" r="4"/>
    <circle cx="310" cy="190" r="4"/><circle cx="370" cy="190" r="4"/>
  </g>
  <text x="384" y="194" fill="#5c6b76" font-size="11.5">+1 at k=1</text>
  <!-- lane: span of prime 3 -->
  <text x="36" y="244" fill="#5c6b76" font-size="12.5">span of 3 = [3,3]</text>
  <line x1="300" y1="240" x2="320" y2="240" stroke="#4169E1" stroke-width="3"/>
  <circle cx="310" cy="240" r="4" fill="#4169E1"/>
  <text x="330" y="244" fill="#5c6b76" font-size="11.5">+1 at k=3, −1 at k=4</text>
  <text x="310" y="268" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">best</text>
  <!-- coverage row -->
  <text x="36" y="294" fill="#5c6b76" font-size="12.5">coverage</text>
  <g text-anchor="middle">
    <text x="190" y="294" fill="#5c6b76" font-size="13">1</text>
    <text x="250" y="294" fill="#5c6b76" font-size="13">1</text>
    <text x="310" y="294" fill="#4169E1" font-size="16" font-weight="700">2</text>
    <text x="370" y="294" fill="#5c6b76" font-size="13">1</text>
  </g>
  <text x="260" y="314" text-anchor="middle" fill="#1a2026" font-size="13">Split k counts prime p on both sides when first(p) &lt; k &lt;= last(p):</text>
  <text x="260" y="332" text-anchor="middle" fill="#1a2026" font-size="13">2's span blankets all gaps, 3's only k=3 — answer <tspan fill="#4169E1" font-weight="600">2 + 2 = 4</tspan> at k=3.</text>
</svg>
