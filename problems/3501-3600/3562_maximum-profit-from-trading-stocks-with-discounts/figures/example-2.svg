<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 258" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- present = [4,6,8], future = [7,9,11], hierarchy = [[1,2],[1,3]], budget = 10; buy 1 and 3: cost 4 + 4 = 8, profit 3 + 7 = 10 (verified by tree DP) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <line x1="234.5" y1="64.1" x2="155.5" y2="135.9" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="265.5" y1="64.1" x2="344.5" y2="135.9" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="250" cy="50" r="21"/>
    <circle cx="360" cy="150" r="21"/>
  </g>
  <circle cx="140" cy="150" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="250" y="55">1</text>
    <text x="140" y="155">2</text>
    <text x="360" y="155">3</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="250" y="100" fill="#5c6b76">buy at 4, sell at 7</text>
    <text x="250" y="116" fill="#4169E1" font-weight="600">profit 7 - 4 = 3</text>
    <text x="140" y="192" fill="#5c6b76">buy at 6, sell at 9</text>
    <text x="140" y="208" fill="#5c6b76">not bought</text>
    <text x="360" y="192" fill="#5c6b76">half price floor(8/2) = 4</text>
    <text x="360" y="208" fill="#4169E1" font-weight="600">profit 11 - 4 = 7</text>
  </g>
  <text x="260" y="242" text-anchor="middle" fill="#1a2026" font-size="13.5">cost 4 + 4 = 8 ≤ budget 10, so total profit is 3 + 7 = <tspan fill="#4169E1" font-weight="700">10</tspan></text>
</svg>
