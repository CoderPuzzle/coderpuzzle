<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- present = [5,2,3], future = [8,5,6], hierarchy = [[1,2],[2,3]], budget = 7; buy all: cost 5 + 1 + 1 = 7, profit 3 + 4 + 5 = 12 (verified by tree DP) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <line x1="121" y1="70" x2="249" y2="70" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="301" y1="70" x2="439" y2="70" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="100" cy="70" r="21"/>
    <circle cx="280" cy="70" r="21"/>
    <circle cx="460" cy="70" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="100" y="75">1</text>
    <text x="280" y="75">2</text>
    <text x="460" y="75">3</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="100" y="116" fill="#5c6b76">buy at 5, sell at 8</text>
    <text x="100" y="133" fill="#4169E1" font-weight="600">profit 8 - 5 = 3</text>
    <text x="280" y="116" fill="#5c6b76">half price floor(2/2) = 1</text>
    <text x="280" y="133" fill="#4169E1" font-weight="600">profit 5 - 1 = 4</text>
    <text x="460" y="116" fill="#5c6b76">half price floor(3/2) = 1</text>
    <text x="460" y="133" fill="#4169E1" font-weight="600">profit 6 - 1 = 5</text>
  </g>
  <text x="280" y="172" text-anchor="middle" fill="#1a2026" font-size="13.5">cost 5 + 1 + 1 = 7 ≤ budget 7, so total profit is 3 + 4 + 5 = <tspan fill="#4169E1" font-weight="700">12</tspan></text>
</svg>
