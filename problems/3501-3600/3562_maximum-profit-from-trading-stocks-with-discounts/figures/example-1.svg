<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 192" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- present = [1,2], future = [4,3], hierarchy = [[1,2]], budget = 3; both buy: cost 1 + 1 = 2, profit 3 + 2 = 5 (verified by tree DP) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <line x1="171" y1="70" x2="359" y2="70" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="265" y="58" text-anchor="middle" fill="#5c6b76" font-size="12">direct boss</text>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="150" cy="70" r="21"/>
    <circle cx="390" cy="70" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="150" y="75">1</text>
    <text x="390" y="75">2</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="150" y="116" fill="#5c6b76">buy at 1, sell at 4</text>
    <text x="150" y="133" fill="#4169E1" font-weight="600">profit 4 - 1 = 3</text>
    <text x="390" y="116" fill="#5c6b76">half price floor(2/2) = 1</text>
    <text x="390" y="133" fill="#4169E1" font-weight="600">profit 3 - 1 = 2</text>
  </g>
  <text x="280" y="172" text-anchor="middle" fill="#1a2026" font-size="13.5">cost 1 + 1 = 2 ≤ budget 3, so total profit is 3 + 2 = <tspan fill="#4169E1" font-weight="700">5</tspan></text>
</svg>
