<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="364" fill="#ffffff"/>
  <defs>
    <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- Example 4: n=3, present=[5,2,3], future=[8,5,6], budget=7, chain 1->2->3; f/g profiles over b=0..7 -->
  <!-- cells 24x22, pitch 26, x = 210 + 26c; rows: emp1 f/g y=68/96, emp2 y=160/188, emp3 y=252/280; accented: g2[2]=9 feeds f1[7]=12 -->
  <text x="340" y="26" text-anchor="middle" font-size="12" fill="#5c6b76">f[u][b]: boss of u didn't buy (full price) · g[u][b]: boss bought (half price)</text>
  <text x="200" y="52" text-anchor="end" font-size="10.5" fill="#9aa7b2">b</text>
  <g text-anchor="middle" font-size="10.5" fill="#9aa7b2">
    <text x="222" y="52">0</text><text x="248" y="52">1</text><text x="274" y="52">2</text><text x="300" y="52">3</text>
    <text x="326" y="52">4</text><text x="352" y="52">5</text><text x="378" y="52">6</text><text x="404" y="52">7</text>
  </g>
  <!-- hierarchy chain 1 -> 2 -> 3, each edge halves the child's price -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="64" cy="93" r="16"/><circle cx="64" cy="185" r="16"/><circle cx="64" cy="277" r="16"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="64" y="98">1</text><text x="64" y="190">2</text><text x="64" y="282">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="64" y1="111" x2="64" y2="165" marker-end="url(#arrowd)"/>
    <line x1="64" y1="203" x2="64" y2="257" marker-end="url(#arrowd)"/>
  </g>
  <g font-size="10" fill="#9aa7b2">
    <text x="76" y="141">⌊p/2⌋</text>
    <text x="76" y="233">⌊p/2⌋</text>
  </g>
  <!-- employee 3 profiles -->
  <g fill="#ffffff" stroke="#dbe4fb" stroke-width="1">
    <rect x="210" y="252" width="24" height="22"/><rect x="236" y="252" width="24" height="22"/><rect x="262" y="252" width="24" height="22"/><rect x="288" y="252" width="24" height="22"/><rect x="314" y="252" width="24" height="22"/><rect x="340" y="252" width="24" height="22"/><rect x="366" y="252" width="24" height="22"/><rect x="392" y="252" width="24" height="22"/>
    <rect x="210" y="280" width="24" height="22"/><rect x="236" y="280" width="24" height="22"/><rect x="262" y="280" width="24" height="22"/><rect x="288" y="280" width="24" height="22"/><rect x="314" y="280" width="24" height="22"/><rect x="340" y="280" width="24" height="22"/><rect x="366" y="280" width="24" height="22"/><rect x="392" y="280" width="24" height="22"/>
  </g>
  <!-- employee 2 profiles; g2[2] accented -->
  <g fill="#ffffff" stroke="#dbe4fb" stroke-width="1">
    <rect x="210" y="160" width="24" height="22"/><rect x="236" y="160" width="24" height="22"/><rect x="262" y="160" width="24" height="22"/><rect x="288" y="160" width="24" height="22"/><rect x="314" y="160" width="24" height="22"/><rect x="340" y="160" width="24" height="22"/><rect x="366" y="160" width="24" height="22"/><rect x="392" y="160" width="24" height="22"/>
    <rect x="210" y="188" width="24" height="22"/><rect x="236" y="188" width="24" height="22"/><rect x="288" y="188" width="24" height="22"/><rect x="314" y="188" width="24" height="22"/><rect x="340" y="188" width="24" height="22"/><rect x="366" y="188" width="24" height="22"/><rect x="392" y="188" width="24" height="22"/>
  </g>
  <rect x="262" y="188" width="24" height="22" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <!-- employee 1 profiles; f1[7] accented -->
  <g fill="#ffffff" stroke="#dbe4fb" stroke-width="1">
    <rect x="210" y="68" width="24" height="22"/><rect x="236" y="68" width="24" height="22"/><rect x="262" y="68" width="24" height="22"/><rect x="288" y="68" width="24" height="22"/><rect x="314" y="68" width="24" height="22"/><rect x="340" y="68" width="24" height="22"/><rect x="366" y="68" width="24" height="22"/>
    <rect x="210" y="96" width="24" height="22"/><rect x="236" y="96" width="24" height="22"/><rect x="262" y="96" width="24" height="22"/><rect x="288" y="96" width="24" height="22"/><rect x="314" y="96" width="24" height="22"/><rect x="340" y="96" width="24" height="22"/><rect x="366" y="96" width="24" height="22"/><rect x="392" y="96" width="24" height="22"/>
  </g>
  <rect x="392" y="68" width="24" height="22" fill="#4169E1"/>
  <g text-anchor="end" font-size="12.5" fill="#5c6b76">
    <text x="200" y="83">f[1]</text><text x="200" y="111">g[1]</text>
    <text x="200" y="175">f[2]</text><text x="200" y="203">g[2]</text>
    <text x="200" y="267">f[3]</text><text x="200" y="295">g[3]</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <!-- f1 = 0 0 3 8 8 8 8 12 ; g1 = 0 0 6 10 15 15 15 15 -->
    <g fill="#9aa7b2"><text x="222" y="83">0</text><text x="248" y="83">0</text><text x="222" y="111">0</text><text x="248" y="111">0</text></g>
    <g fill="#1a2026" font-weight="600">
      <text x="274" y="83">3</text><text x="300" y="83">8</text><text x="326" y="83">8</text><text x="352" y="83">8</text><text x="378" y="83">8</text>
      <text x="274" y="111">6</text><text x="300" y="111">10</text><text x="326" y="111">15</text><text x="352" y="111">15</text><text x="378" y="111">15</text><text x="404" y="111">15</text>
    </g>
    <text x="404" y="83" fill="#ffffff" font-weight="700">12</text>
    <!-- f2 = 0 0 3 8 8 8 8 8 ; g2 = 0 4 9 9 9 9 9 9 -->
    <g fill="#9aa7b2"><text x="222" y="175">0</text><text x="248" y="175">0</text><text x="222" y="203">0</text></g>
    <g fill="#1a2026" font-weight="600">
      <text x="274" y="175">3</text><text x="300" y="175">8</text><text x="326" y="175">8</text><text x="352" y="175">8</text><text x="378" y="175">8</text><text x="404" y="175">8</text>
      <text x="248" y="203">4</text><text x="300" y="203">9</text><text x="326" y="203">9</text><text x="352" y="203">9</text><text x="378" y="203">9</text><text x="404" y="203">9</text>
    </g>
    <text x="274" y="203" fill="#4169E1" font-weight="600">9</text>
    <!-- f3 = 0 0 0 3 3 3 3 3 ; g3 = 0 5 5 5 5 5 5 5 -->
    <g fill="#9aa7b2"><text x="222" y="267">0</text><text x="248" y="267">0</text><text x="274" y="267">0</text><text x="222" y="295">0</text></g>
    <g fill="#1a2026" font-weight="600">
      <text x="300" y="267">3</text><text x="326" y="267">3</text><text x="352" y="267">3</text><text x="378" y="267">3</text><text x="404" y="267">3</text>
      <text x="248" y="295">5</text><text x="274" y="295">5</text><text x="300" y="295">5</text><text x="326" y="295">5</text><text x="352" y="295">5</text><text x="378" y="295">5</text><text x="404" y="295">5</text>
    </g>
  </g>
  <g font-size="11.5">
    <text x="424" y="88">buy 1 at 5: f[7] = g2[2] + 3 = <tspan fill="#4169E1" font-weight="600">12</tspan></text>
    <text x="424" y="104" fill="#5c6b76">skip 1: f2[7] = 8 — buying wins</text>
    <text x="424" y="180">buy 2 at 2: child g + 3 → f2 tops 8</text>
    <text x="424" y="196">buy 2 at ⌊2/2⌋: child g + 4 → g2 tops 9</text>
    <text x="424" y="272">buy 3 at 3: profit 3 → f3[b≥3] = 3</text>
    <text x="424" y="288">buy 3 at ⌊3/2⌋: profit 5 → g3[b≥1] = 5</text>
  </g>
  <text x="340" y="330" text-anchor="middle" font-size="13" fill="#1a2026">Bottom-up, each node keeps two budget profiles; the halved child cost enters only the g transition.</text>
  <text x="340" y="350" text-anchor="middle" font-size="13" fill="#1a2026">Example 4 buys every stock: cost 5+1+1 = 7 ≤ 7, profit 3+4+5 = f[7] = <tspan fill="#4169E1" font-weight="600">12</tspan>.</text>
</svg>
