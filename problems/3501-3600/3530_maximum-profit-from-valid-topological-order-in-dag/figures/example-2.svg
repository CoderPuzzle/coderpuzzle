<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 3, edges = [[0,1],[0,2]], score = [1,6,3]; optimal order [0,2,1] gives 1*1 + 3*2 + 6*3 = 25 (verified by brute force) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="280" y1="64" x2="170" y2="182" marker-end="url(#arrow)"/>
    <line x1="280" y1="64" x2="390" y2="182" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="280" cy="64" r="21"/>
    <circle cx="170" cy="182" r="21"/>
    <circle cx="390" cy="182" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="280" y="69">0</text>
    <text x="170" y="187">1</text>
    <text x="390" y="187">2</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="280" y="110">score 1</text>
    <text x="170" y="236">score 6</text>
    <text x="390" y="236">score 3</text>
  </g>
  <g fill="#5c6b76" font-size="12" font-weight="600" text-anchor="middle">
    <text x="280" y="130">position 1</text>
    <text x="170" y="256">position 3</text>
    <text x="390" y="256">position 2</text>
  </g>
  <text x="310" y="290" text-anchor="middle" fill="#1a2026" font-size="13.5">optimal order 0, 2, 1 gives 1·1 + 3·2 + 6·3 = <tspan fill="#4169E1" font-weight="700">25</tspan> — the largest score takes the last position</text>
</svg>
