<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 2, edges = [[0,1]], score = [2,3]; only order [0,1] gives 2*1 + 3*2 = 8 (verified by brute force) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <line x1="240" y1="90" x2="400" y2="90" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="240" cy="90" r="21"/>
    <circle cx="400" cy="90" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="240" y="95">0</text>
    <text x="400" y="95">1</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="240" y="44">score 2</text>
    <text x="400" y="44">score 3</text>
  </g>
  <g fill="#5c6b76" font-size="12" font-weight="600" text-anchor="middle">
    <text x="240" y="144">position 1</text>
    <text x="400" y="144">position 2</text>
  </g>
  <text x="310" y="184" text-anchor="middle" fill="#1a2026" font-size="13.5">the only valid order is 0, 1 — profit 2·1 + 3·2 = <tspan fill="#4169E1" font-weight="700">8</tspan></text>
</svg>
