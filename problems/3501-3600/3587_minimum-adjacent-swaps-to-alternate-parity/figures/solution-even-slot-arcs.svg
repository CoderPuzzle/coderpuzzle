<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [2,4,6,5,7]; the evens 2,4,6 (indices 0,1,2) map in order to the even slots 0,2,4 at cost 0+1+2; cells 76x42 at x = 100 + 88i, y = 56; slot row y = 206 -->
  <text x="40" y="82" fill="#5c6b76" font-size="12">nums</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="100" y="56" width="76" height="42" fill="#dbe4fb"/>
    <rect x="188" y="56" width="76" height="42" fill="#dbe4fb"/>
    <rect x="276" y="56" width="76" height="42" fill="#dbe4fb"/>
    <rect x="364" y="56" width="76" height="42" fill="#ffffff"/>
    <rect x="452" y="56" width="76" height="42" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="138" y="83" fill="#1a2026">2</text><text x="226" y="83" fill="#1a2026">4</text><text x="314" y="83" fill="#1a2026">6</text><text x="402" y="83" fill="#1a2026">5</text><text x="490" y="83" fill="#1a2026">7</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="138" y="118">0</text><text x="226" y="118">1</text><text x="314" y="118">2</text><text x="402" y="118">3</text><text x="490" y="118">4</text>
  </g>
  <!-- order-preserving arcs from the even elements down to their slots -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="122" y1="102" x2="122" y2="200" marker-end="url(#arrow)"/>
    <path d="M 226 102 Q 242 170 309 198" marker-end="url(#arrow)"/>
    <path d="M 314 102 Q 356 178 485 199" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="132" y="150">cost 0</text>
    <text x="268" y="164">cost 1</text>
    <text x="394" y="156">cost 2</text>
  </g>
  <text x="40" y="229" fill="#5c6b76" font-size="12">slots</text>
  <g stroke="#5c6b76" stroke-width="1.5" fill="#f0f3f7" stroke-dasharray="4 3">
    <rect x="100" y="206" width="76" height="36"/><rect x="188" y="206" width="76" height="36"/><rect x="276" y="206" width="76" height="36"/><rect x="364" y="206" width="76" height="36"/><rect x="452" y="206" width="76" height="36"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="13">
    <text x="138" y="229">E</text><text x="226" y="229">O</text><text x="314" y="229">E</text><text x="402" y="229">O</text><text x="490" y="229">E</text>
  </g>
  <text x="40" y="296" fill="#1a2026" font-size="13">The j-th even keeps its order: 2, 4, 6 land on slots 0, 2, 4 at cost <tspan fill="#4169E1" font-weight="600">0 + 1 + 2 = 3</tspan>,</text>
  <text x="40" y="314" fill="#1a2026" font-size="13">n = 5 forces the majority evens onto even slots; odds 5, 7 mirror onto slots 1, 3.</text>
</svg>
