<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 172" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- vals = [2,3], par = [-1,0]; maxScore = [5,3], sum 8 (verified by tree DP over digit masks) -->
  <line x1="191" y1="62" x2="309" y2="62" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="170" cy="62" r="21"/>
    <circle cx="330" cy="62" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="170" y="67">2</text>
    <text x="330" y="67">3</text>
  </g>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="170" y="34">node 0</text>
    <text x="330" y="34">node 1</text>
  </g>
  <g font-size="12" fill="#4169E1" font-weight="600" text-anchor="middle">
    <text x="170" y="108">maxScore = 5</text>
    <text x="330" y="108">maxScore = 3</text>
  </g>
  <text x="250" y="152" text-anchor="middle" fill="#1a2026" font-size="13.5">digits 2 and 3 differ, so {2, 3} is good: 2 + 3 = 5; the array sums to 5 + 3 = <tspan fill="#4169E1" font-weight="700">8</tspan></text>
</svg>
