<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="396" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- vals = [3,22,5], par = [-1,0,1]; chain 0 -> 1 -> 2; dp[2] = {0:0, {5}:5}; dp[1] inherits (22 unselectable); dp[0] merges + overlays 3; maxScore = [8,5,5] -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="80" y1="100" x2="80" y2="184"/>
    <line x1="80" y1="224" x2="80" y2="286"/>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.5">
    <circle cx="80" cy="80" r="20"/><circle cx="80" cy="204" r="20"/><circle cx="80" cy="306" r="20"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#1a2026">
    <text x="80" y="85">3</text><text x="80" y="209">22</text><text x="80" y="311">5</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="10.5">
    <text x="52" y="84">node 0</text><text x="52" y="208">node 1</text><text x="52" y="310">node 2</text>
  </g>
  <!-- dp[0] -->
  <rect x="150" y="22" width="230" height="116" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="162" y="40" fill="#5c6b76" font-size="11.5">dp[0] — value 3, digits {3}</text>
  <g font-size="13">
    <text x="162" y="64" fill="#1a2026">∅</text><text x="372" y="64" fill="#5c6b76" font-weight="600" text-anchor="end">0</text>
    <text x="162" y="86" fill="#1a2026">{5}</text><text x="372" y="86" fill="#1a2026" font-weight="600" text-anchor="end">5</text>
    <text x="162" y="108" fill="#1a2026">{3}</text><text x="372" y="108" fill="#1a2026" font-weight="600" text-anchor="end">3</text>
    <text x="162" y="130" fill="#1a2026">{3,5}</text><text x="344" y="130" fill="#5c6b76" font-size="11.5" text-anchor="end">= 5 + 3</text><text x="372" y="130" fill="#4169E1" font-weight="700" text-anchor="end">8</text>
  </g>
  <text x="398" y="84" fill="#4169E1" font-size="13" font-weight="700">maxScore[0] = 8</text>
  <!-- merge arrow: table 1 into table 0 -->
  <path d="M 240 155 L 240 141" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="151" fill="#5c6b76" font-size="10.5">merge</text>
  <!-- dp[1] -->
  <rect x="150" y="156" width="230" height="96" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="162" y="174" fill="#5c6b76" font-size="11.5">dp[1] — 22 unselectable</text>
  <g font-size="13">
    <text x="162" y="196" fill="#1a2026">∅</text><text x="372" y="196" fill="#5c6b76" font-weight="600" text-anchor="end">0</text>
    <text x="162" y="216" fill="#1a2026">{5}</text><text x="372" y="216" fill="#4169E1" font-weight="700" text-anchor="end">5</text>
  </g>
  <text x="162" y="240" fill="#9aa7b2" font-size="12">select 22 — digit 2 twice</text>
  <line x1="162" y1="236" x2="228" y2="236" stroke="#9aa7b2" stroke-width="1"/>
  <text x="398" y="208" fill="#4169E1" font-size="13" font-weight="700">maxScore[1] = 5</text>
  <!-- merge arrow: table 2 into table 1 -->
  <path d="M 240 269 L 240 255" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="265" fill="#5c6b76" font-size="10.5">merge</text>
  <!-- dp[2] -->
  <rect x="150" y="270" width="230" height="72" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="162" y="288" fill="#5c6b76" font-size="11.5">dp[2] — leaf, value 5</text>
  <g font-size="13">
    <text x="162" y="310" fill="#1a2026">∅</text><text x="372" y="310" fill="#5c6b76" font-weight="600" text-anchor="end">0</text>
    <text x="162" y="330" fill="#1a2026">{5}</text><text x="372" y="330" fill="#4169E1" font-weight="700" text-anchor="end">5</text>
  </g>
  <text x="398" y="310" fill="#4169E1" font-size="13" font-weight="700">maxScore[2] = 5</text>
  <text x="280" y="366" text-anchor="middle" fill="#1a2026" font-size="13">Node 1 only forwards {5} → 5 — picking 22 dies on the repeated digit 2.</text>
  <text x="280" y="384" text-anchor="middle" fill="#1a2026" font-size="13">Node 0 overlays 3 to reach {3,5} = <tspan fill="#4169E1" font-weight="600">8</tspan>; maxScore = [8,5,5], sum <tspan fill="#4169E1" font-weight="600">18</tspan>.</text>
</svg>
