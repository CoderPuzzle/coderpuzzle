<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 252" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- vals = [1,5,2], par = [-1,0,0]; maxScore = [8,5,2], sum 15 (verified by tree DP over digit masks) -->
  <line x1="250" y1="54" x2="150" y2="140" stroke="#42525e" stroke-width="1.6"/>
  <line x1="250" y1="54" x2="350" y2="140" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="250" cy="54" r="21"/>
    <circle cx="150" cy="140" r="21"/>
    <circle cx="350" cy="140" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="250" y="59">1</text>
    <text x="150" y="145">5</text>
    <text x="350" y="145">2</text>
  </g>
  <text x="250" y="26" text-anchor="middle" fill="#5c6b76" font-size="11.5">node 0</text>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="150" y="180">node 1</text>
    <text x="350" y="180">node 2</text>
  </g>
  <text x="284" y="52" fill="#4169E1" font-weight="600" font-size="12">maxScore = 8</text>
  <g font-size="12" fill="#4169E1" font-weight="600" text-anchor="middle">
    <text x="150" y="198">maxScore = 5</text>
    <text x="350" y="198">maxScore = 2</text>
  </g>
  <text x="250" y="238" text-anchor="middle" fill="#1a2026" font-size="13.5">digits 1, 5, 2 are all distinct, so node 0 keeps its whole subtree: 1 + 5 + 2 = 8; sum <tspan fill="#4169E1" font-weight="700">15</tspan></text>
</svg>
