<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="360" fill="#ffffff"/>
  <!-- edges [[0,4],[0,1],[1,2],[1,3]] cost=[3,4,1,1,7]; circles r=22 show cost, node id above; f = best root-to-leaf sum through the node, g = M - f with M = 10 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="140" y1="55" x2="60" y2="160"/>
    <line x1="140" y1="55" x2="220" y2="160"/>
    <line x1="220" y1="160" x2="140" y2="265"/>
    <line x1="220" y1="160" x2="300" y2="265"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="140" cy="55" r="22"/>
    <circle cx="60" cy="160" r="22"/>
    <circle cx="140" cy="265" r="22"/>
    <circle cx="300" cy="265" r="22"/>
  </g>
  <circle cx="220" cy="160" r="22" fill="#4169E1"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="140" y="60" fill="#1a2026">3</text>
    <text x="60" y="165" fill="#1a2026">7</text>
    <text x="220" y="165" fill="#ffffff">4</text>
    <text x="140" y="270" fill="#1a2026">1</text>
    <text x="300" y="270" fill="#1a2026">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="140" y="25">node 0</text>
    <text x="60" y="130">node 4</text>
    <text x="220" y="130" fill="#4169E1" font-weight="600">node 1</text>
    <text x="140" y="235">node 2</text>
    <text x="300" y="235">node 3</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="108" y="60" text-anchor="end">f 10 &#183; g 0</text>
    <text x="60" y="198" text-anchor="middle">f 10 &#183; g 0</text>
    <text x="252" y="165" fill="#4169E1" font-weight="600">f 8 &#183; g 2</text>
    <text x="140" y="303" text-anchor="middle">f 8 &#183; g 2</text>
    <text x="300" y="303" text-anchor="middle">f 8 &#183; g 2</text>
  </g>
  <!-- right panel: raw path sums and the gap-jump rule -->
  <text x="390" y="60" fill="#5c6b76" font-size="12.5">path sums (<tspan fill="#4169E1" font-weight="600">M = 10</tspan>)</text>
  <g font-size="13" fill="#5c6b76">
    <text x="390" y="90">0&#8594;4: 3 + 7 = <tspan fill="#4169E1" font-weight="600">10</tspan></text>
    <text x="390" y="115">0&#8594;1&#8594;2: 3 + 4 + 1 = 8</text>
    <text x="390" y="140">0&#8594;1&#8594;3: 3 + 4 + 1 = 8</text>
  </g>
  <text x="390" y="175" fill="#5c6b76" font-size="12.5">gap g = M &#8722; f per node:</text>
  <text x="390" y="200" fill="#4169E1" font-size="12.5" font-weight="600">node 1: g jumps 0 &#8594; 2 &#8212; charged</text>
  <text x="390" y="225" fill="#5c6b76" font-size="12.5">nodes 4, 2, 3: g equals parent's &#8212; free</text>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">Every path must reach M = 10; the gap g = M &#8722; f is 0 at nodes 0 and 4 but jumps</text>
  <text x="340" y="348" text-anchor="middle" fill="#1a2026" font-size="13">to 2 at <tspan fill="#4169E1" font-weight="600">node 1</tspan>, so only node 1's cost rises (4 &#8594; 6) &#8212; the answer is <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
