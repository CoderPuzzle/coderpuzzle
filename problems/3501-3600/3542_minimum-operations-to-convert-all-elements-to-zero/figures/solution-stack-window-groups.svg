<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="364" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [3,1,2,1]; maximal windows free of smaller values: 3:[0,0], 1:[1,3], 2:[2,2];
       sweep: read 3 push (g=1); read 1 pop 3 push 1 (g=2); read 2 push (g=3); read 1 pop 2, match (g=3).
       array cells 64x44 at (88,44); stack cells 44x26, bases at y=276 -->
  <text x="40" y="28" fill="#5c6b76" font-size="13">example 2: nums = [3,1,2,1] &#8212; count (value, maximal window) groups</text>
  <!-- array -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="88" y="44" width="64" height="44"/><rect x="160" y="44" width="64" height="44"/>
    <rect x="232" y="44" width="64" height="44"/><rect x="304" y="44" width="64" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="120" y="71">3</text><text x="192" y="71">1</text><text x="264" y="71">2</text><text x="336" y="71">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="120" y="102">i=0</text><text x="192" y="102">i=1</text><text x="264" y="102">i=2</text><text x="336" y="102">i=3</text>
  </g>
  <!-- window brackets -->
  <g fill="none" stroke="#4169E1" stroke-width="1.5">
    <path d="M 88 108 L 88 116 L 152 116 L 152 108"/>
    <path d="M 232 108 L 232 116 L 296 116 L 296 108"/>
    <path d="M 160 136 L 160 144 L 368 144 L 368 136"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="120" y="132">v=3</text>
    <text x="264" y="132">v=2</text>
    <text x="200" y="160">v=1</text>
  </g>
  <!-- group list -->
  <text x="400" y="60" fill="#5c6b76" font-size="12.5">one operation per group, zeroed smallest first:</text>
  <g fill="#1a2026" font-size="12.5">
    <text x="400" y="82">op 1: value 1, window [1,3]</text>
    <text x="400" y="102">op 2: value 2, window [2,2]</text>
    <text x="400" y="122">op 3: value 3, window [0,0]</text>
  </g>
  <!-- stack sweep -->
  <text x="88" y="192" fill="#5c6b76" font-size="12.5">monotonic-stack sweep (stack increases bottom &#8594; top)</text>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="130" y="216">read 3</text><text x="280" y="216">read 1</text>
    <text x="430" y="216">read 2</text><text x="580" y="216">read 1</text>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="108" y="250" width="44" height="26"/>
    <rect x="258" y="250" width="44" height="26"/>
    <rect x="408" y="224" width="44" height="26"/>
    <rect x="558" y="250" width="44" height="26"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="408" y="250" width="44" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="130" y="267">3</text>
    <text x="280" y="267">1</text>
    <text x="430" y="267">1</text><text x="430" y="241">2</text>
    <text x="580" y="267">1</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <path d="M 158 262 L 250 262" marker-end="url(#arrowm)"/>
    <path d="M 308 262 L 400 262" marker-end="url(#arrowm)"/>
    <path d="M 458 262 L 550 262" marker-end="url(#arrowm)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="130" y="296">push 3 &#8594; groups = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="280" y="296">pop 3, push 1 &#8594; groups = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="430" y="296">push 2 &#8594; groups = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="580" y="296">pop 2, 1 = top &#8594; <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  </g>
  <!-- caption -->
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">groups (3,[0,0]), (1,[1,3]), (2,[2,2]) need one operation each;</text>
  <text x="340" y="348" text-anchor="middle" fill="#1a2026" font-size="13">the sweep opens a group only on a push, counts <tspan fill="#4169E1" font-weight="600">3</tspan>, and the answer is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
