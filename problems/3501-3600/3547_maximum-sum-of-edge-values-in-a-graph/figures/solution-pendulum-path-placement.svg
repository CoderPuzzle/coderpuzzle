<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="280" fill="#ffffff"/>
  <!-- path 0-1-2-3 of Example 1; pendulum placement [1,3,4,2]; circles r=28 at cx 120+140i, cy 112; edge products above the gaps -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="120" y="64">node 0</text><text x="260" y="64">node 1</text>
    <text x="400" y="64">node 2</text><text x="540" y="64">node 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="148" y1="112" x2="232" y2="112"/>
    <line x1="288" y1="112" x2="372" y2="112"/>
    <line x1="428" y1="112" x2="512" y2="112"/>
  </g>
  <g>
    <circle cx="120" cy="112" r="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <circle cx="260" cy="112" r="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <circle cx="400" cy="112" r="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <circle cx="540" cy="112" r="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="17" fill="#1a2026">
    <text x="120" y="118">1</text><text x="260" y="118">3</text>
    <text x="400" y="118">4</text><text x="540" y="118">2</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#4169E1">
    <text x="190" y="92">1·3 = 3</text>
    <text x="330" y="92">3·4 = 12</text>
    <text x="470" y="92">4·2 = 8</text>
  </g>
  <text x="330" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">1·3 + 3·4 + 4·2 = 3 + 12 + 8 = <tspan fill="#4169E1">23</tspan></text>
  <text x="330" y="234" text-anchor="middle" font-size="13" fill="#1a2026">The pendulum sequence 1, 3, …, 4, 2 puts the largest values side by side and the</text>
  <text x="330" y="254" text-anchor="middle" font-size="13" fill="#1a2026">smallest at the ends; the three edge products sum to 3 + 12 + 8 = 23.</text>
</svg>
