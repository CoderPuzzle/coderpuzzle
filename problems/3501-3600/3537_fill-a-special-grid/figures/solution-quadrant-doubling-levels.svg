<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- example 3, n = 2. Level k rule: row g -> top [3*4^k+g | g], bottom [2*4^k+g | 4^k+g].
       k=0 (4^0=1): [0] -> [[3,0],[2,1]]. k=1 (4^1=4): quadrant offsets TR 0, BR 4, BL 8, TL 12. -->
  <text x="40" y="28" fill="#5c6b76" font-size="13">example 3, n = 2: bottom-up doubling from [0] to the 4x4 special grid</text>
  <text x="40" y="50" fill="#1a2026" font-size="12.5">each level k turns every old row g into a top row <tspan fill="#4169E1" font-weight="600">[3&#183;4^k + g | g]</tspan></text>
  <text x="40" y="68" fill="#1a2026" font-size="12.5">and a bottom row <tspan fill="#4169E1" font-weight="600">[2&#183;4^k + g | 4^k + g]</tspan>; quadrant offsets 0, 4^k, 2&#183;4^k, 3&#183;4^k</text>
  <!-- 1x1 grid -->
  <text x="88" y="160" text-anchor="middle" fill="#5c6b76" font-size="12">n = 0</text>
  <rect x="68" y="170" width="40" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="88" y="191" text-anchor="middle" font-weight="600" fill="#1a2026">0</text>
  <!-- 2x2 grid -->
  <text x="244" y="142" text-anchor="middle" fill="#5c6b76" font-size="12">n = 1</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="204" y="152" width="40" height="34"/><rect x="244" y="152" width="40" height="34"/>
    <rect x="204" y="186" width="40" height="34"/><rect x="244" y="186" width="40" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="224" y="173">3</text><text x="264" y="173">0</text>
    <text x="224" y="207">2</text><text x="264" y="207">1</text>
  </g>
  <!-- 4x4 grid -->
  <text x="452" y="100" text-anchor="middle" fill="#5c6b76" font-size="12">n = 2</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="376" y="112" width="38" height="30"/><rect x="414" y="112" width="38" height="30"/><rect x="452" y="112" width="38" height="30"/><rect x="490" y="112" width="38" height="30"/>
    <rect x="376" y="142" width="38" height="30"/><rect x="414" y="142" width="38" height="30"/><rect x="452" y="142" width="38" height="30"/><rect x="490" y="142" width="38" height="30"/>
    <rect x="376" y="172" width="38" height="30"/><rect x="414" y="172" width="38" height="30"/><rect x="452" y="172" width="38" height="30"/><rect x="490" y="172" width="38" height="30"/>
    <rect x="376" y="202" width="38" height="30"/><rect x="414" y="202" width="38" height="30"/><rect x="452" y="202" width="38" height="30"/><rect x="490" y="202" width="38" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="395" y="132">15</text><text x="433" y="132">12</text><text x="471" y="132">3</text><text x="509" y="132">0</text>
    <text x="395" y="162">14</text><text x="433" y="162">13</text><text x="471" y="162">2</text><text x="509" y="162">1</text>
    <text x="395" y="192">11</text><text x="433" y="192">8</text><text x="471" y="192">7</text><text x="509" y="192">4</text>
    <text x="395" y="222">10</text><text x="433" y="222">9</text><text x="471" y="222">6</text><text x="509" y="222">5</text>
  </g>
  <!-- quadrant boundary -->
  <line x1="452" y1="112" x2="452" y2="232" stroke="#4169E1" stroke-width="1"/>
  <line x1="376" y1="172" x2="528" y2="172" stroke="#4169E1" stroke-width="1"/>
  <!-- quadrant ranges -->
  <text x="546" y="110" fill="#5c6b76" font-size="11.5">quadrant ranges</text>
  <g fill="#1a2026" font-size="12">
    <text x="546" y="130">TR: 0-3</text>
    <text x="546" y="150">BR: 4-7</text>
    <text x="546" y="170">BL: 8-11</text>
    <text x="546" y="190">TL: 12-15</text>
  </g>
  <!-- level arrows -->
  <path d="M 112 178 L 200 178" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 288 178 L 372 178" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="156" y="200" text-anchor="middle" fill="#5c6b76" font-size="11.5">k = 0, 4^0 = 1</text>
  <text x="330" y="200" text-anchor="middle" fill="#5c6b76" font-size="11.5">k = 1, 4^1 = 4</text>
  <!-- caption -->
  <text x="340" y="274" text-anchor="middle" fill="#1a2026" font-size="13">two levels of the same doubling rule grow [0] into [[3,0],[2,1]] and then</text>
  <text x="340" y="292" text-anchor="middle" fill="#1a2026" font-size="13">into <tspan fill="#4169E1" font-weight="600">[[15,12,3,0],[14,13,2,1],[11,8,7,4],[10,9,6,5]]</tspan> &#8212; offsets 0, 4, 8, 12 per quadrant.</text>
</svg>
