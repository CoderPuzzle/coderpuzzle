<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[1,0,8],[0,2,7]], query [0,1,2]; minimal subtree needs both edges: 8 + 7 = 15 (verified by simulation) -->
  <line x1="191" y1="70" x2="409" y2="70" stroke="#4169E1" stroke-width="3.2"/>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="170" cy="70" r="21"/>
    <circle cx="300" cy="70" r="21"/>
    <circle cx="430" cy="70" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="170" y="75">1</text>
    <text x="300" y="75">0</text>
    <text x="430" y="75">2</text>
  </g>
  <g font-size="12" fill="#4169E1" font-weight="600" text-anchor="middle">
    <text x="235" y="56">8</text>
    <text x="365" y="56">7</text>
    <text x="170" y="116">src2</text>
    <text x="300" y="116">src1</text>
    <text x="430" y="116">dest</text>
  </g>
  <text x="300" y="160" text-anchor="middle" fill="#1a2026" font-size="13.5">a path must keep every edge: 8 + 7 = <tspan fill="#4169E1" font-weight="700">15</tspan></text>
</svg>
