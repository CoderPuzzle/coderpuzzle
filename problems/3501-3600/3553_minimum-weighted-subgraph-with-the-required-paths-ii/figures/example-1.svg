<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 318" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[0,1,2],[1,2,3],[1,3,5],[1,4,4],[2,5,6]], queries = [[2,3,4],[0,2,5]]; minimal subtrees {1-2,1-3,1-4} = 12 and {0-1,1-2,2-5} = 11 (verified by simulation) -->
  <!-- left panel: query [2,3,4] -->
  <text x="190" y="18" text-anchor="middle" fill="#5c6b76" font-size="12.5">query [2, 3, 4]</text>
  <line x1="190" y1="40" x2="190" y2="112" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="190" y1="112" x2="80" y2="190"/>
    <line x1="190" y1="112" x2="190" y2="190"/>
    <line x1="190" y1="112" x2="300" y2="190"/>
  </g>
  <line x1="80" y1="190" x2="80" y2="262" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="190" cy="40" r="21"/>
    <circle cx="190" cy="112" r="21"/>
    <circle cx="80" cy="262" r="21"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="80" cy="190" r="21"/>
    <circle cx="190" cy="190" r="21"/>
    <circle cx="300" cy="190" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="190" y="45">0</text>
    <text x="190" y="117">1</text>
    <text x="80" y="195">2</text>
    <text x="190" y="195">3</text>
    <text x="300" y="195">4</text>
    <text x="80" y="267">5</text>
  </g>
  <g font-size="12" fill="#5c6b76">
    <text x="204" y="80">2</text>
    <text x="96" y="230">6</text>
    <text x="261" y="161" fill="#4169E1" font-weight="600">4</text>
  </g>
  <text x="119" y="162" fill="#4169E1" font-weight="600" font-size="12" text-anchor="middle">3</text>
  <text x="204" y="155" fill="#4169E1" font-weight="600" font-size="12">5</text>
  <g font-size="12" fill="#4169E1" font-weight="600" text-anchor="middle">
    <text x="38" y="194">src1</text>
    <text x="190" y="224">src2</text>
    <text x="300" y="224">dest</text>
  </g>
  <text x="190" y="300" text-anchor="middle" fill="#1a2026" font-size="13">3 + 5 + 4 = <tspan fill="#4169E1" font-weight="700">12</tspan></text>
  <!-- right panel: query [0,2,5] -->
  <text x="560" y="18" text-anchor="middle" fill="#5c6b76" font-size="12.5">query [0, 2, 5]</text>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="560" y1="40" x2="560" y2="112"/>
    <line x1="560" y1="112" x2="450" y2="190"/>
    <line x1="450" y1="190" x2="450" y2="262"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="560" y1="112" x2="560" y2="190"/>
    <line x1="560" y1="112" x2="670" y2="190"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="560" cy="112" r="21"/>
    <circle cx="560" cy="190" r="21"/>
    <circle cx="670" cy="190" r="21"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="560" cy="40" r="21"/>
    <circle cx="450" cy="190" r="21"/>
    <circle cx="450" cy="262" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="560" y="45">0</text>
    <text x="560" y="117">1</text>
    <text x="450" y="195">2</text>
    <text x="560" y="195">3</text>
    <text x="670" y="195">4</text>
    <text x="450" y="267">5</text>
  </g>
  <g font-size="12" fill="#5c6b76">
    <text x="574" y="155">5</text>
    <text x="631" y="161">4</text>
  </g>
  <g font-size="12" fill="#4169E1" font-weight="600">
    <text x="574" y="80">2</text>
    <text x="489" y="162" text-anchor="middle">3</text>
    <text x="466" y="230">6</text>
  </g>
  <g font-size="12" fill="#4169E1" font-weight="600">
    <text x="590" y="44">src1</text>
    <text x="416" y="194" text-anchor="end">src2</text>
    <text x="416" y="266" text-anchor="end">dest</text>
  </g>
  <text x="560" y="300" text-anchor="middle" fill="#1a2026" font-size="13">2 + 3 + 6 = <tspan fill="#4169E1" font-weight="700">11</tspan></text>
</svg>
