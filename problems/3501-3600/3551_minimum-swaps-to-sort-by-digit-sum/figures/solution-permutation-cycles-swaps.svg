<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 3: nums [18,43,34,16], digit sums [9,7,7,7]; target [16,34,43,18]; pos = [3,2,1,0]; cycles (0 3) and (1 2); cells w=80 at x 136+96j -->
  <text x="124" y="88" text-anchor="end" fill="#5c6b76" font-size="12.5">target</text>
  <g stroke="#4169E1" stroke-width="1.4" fill="#dbe4fb">
    <rect x="136" y="60" width="80" height="44"/><rect x="232" y="60" width="80" height="44"/>
    <rect x="328" y="60" width="80" height="44"/><rect x="424" y="60" width="80" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14.5" fill="#1a2026">
    <text x="176" y="88">16</text><text x="272" y="88">34</text>
    <text x="368" y="88">43</text><text x="464" y="88">18</text>
  </g>
  <text x="124" y="126" text-anchor="end" fill="#5c6b76" font-size="11.5">position</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="176" y="126">0</text><text x="272" y="126">1</text>
    <text x="368" y="126">2</text><text x="464" y="126">3</text>
  </g>
  <text x="124" y="172" text-anchor="end" fill="#5c6b76" font-size="12.5">nums</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="136" y="140" width="80" height="56"/><rect x="232" y="140" width="80" height="56"/>
    <rect x="328" y="140" width="80" height="56"/><rect x="424" y="140" width="80" height="56"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="176" y="167">18</text><text x="272" y="167">43</text>
    <text x="368" y="167">34</text><text x="464" y="167">16</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="176" y="185">sum 9</text><text x="272" y="185">sum 7</text>
    <text x="368" y="185">sum 7</text><text x="464" y="185">sum 7</text>
  </g>
  <!-- permutation cycles: pos[1]=2, pos[2]=1, pos[0]=3, pos[3]=0 -->
  <path d="M 272 206 C 272 236, 368 236, 368 206" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 176 206 C 176 278, 464 278, 464 206" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="320" y="246">(1 2): 1 swap</text>
    <text x="320" y="284">(0 3): 1 swap</text>
  </g>
  <text x="320" y="314" text-anchor="middle" font-size="13" fill="#1a2026">Digit sums 9, 7, 7, 7 sort to [16, 34, 43, 18]; the position permutation splits</text>
  <text x="320" y="332" text-anchor="middle" font-size="13" fill="#1a2026">into cycles (0 3) and (1 2), each costing one swap — 4 - 2 = <tspan fill="#4169E1" font-weight="600">2</tspan> swaps total.</text>
</svg>
