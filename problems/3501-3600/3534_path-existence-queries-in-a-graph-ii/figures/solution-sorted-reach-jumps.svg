<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="348" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,8,3,4,2], maxDiff = 3; sorted ranks: pos0=node0(1) pos1=node4(2) pos2=node2(3)
       pos3=node3(4) pos4=node1(8); reach = [3,3,3,3,4]; cut at gap 8-4=4; cells 84x52 at (96,140) -->
  <text x="96" y="26" fill="#5c6b76" font-size="13">nums = [1, 8, 3, 4, 2], maxDiff = 3 &#8212; nodes sorted by value</text>
  <g font-size="12.5">
    <text x="96" y="48"><tspan fill="#4169E1" font-weight="600">query [0,3]</tspan><tspan fill="#1a2026"> &#8594; ranks 0, 3: one hop, reach[0] = 3</tspan></text>
    <text x="96" y="66"><tspan fill="#4169E1" font-weight="600">query [2,4]</tspan><tspan fill="#1a2026"> &#8594; ranks 1, 2: one hop, reach[1] = 3</tspan></text>
  </g>
  <!-- query hop arcs -->
  <path d="M 138 134 Q 288 44 438 134" fill="none" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 238 134 Q 288 96 338 134" fill="none" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- value-sorted cells -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="96" y="140" width="84" height="52"/><rect x="196" y="140" width="84" height="52"/>
    <rect x="296" y="140" width="84" height="52"/><rect x="396" y="140" width="84" height="52"/>
    <rect x="496" y="140" width="84" height="52"/>
  </g>
  <g text-anchor="middle">
    <text x="138" y="163" font-weight="600" fill="#1a2026">1</text>
    <text x="238" y="163" font-weight="600" fill="#1a2026">2</text>
    <text x="338" y="163" font-weight="600" fill="#1a2026">3</text>
    <text x="438" y="163" font-weight="600" fill="#1a2026">4</text>
    <text x="538" y="163" font-weight="600" fill="#1a2026">8</text>
    <text x="138" y="181" fill="#5c6b76" font-size="11">node 0</text>
    <text x="238" y="181" fill="#5c6b76" font-size="11">node 4</text>
    <text x="338" y="181" fill="#5c6b76" font-size="11">node 2</text>
    <text x="438" y="181" fill="#5c6b76" font-size="11">node 3</text>
    <text x="538" y="181" fill="#5c6b76" font-size="11">node 1</text>
  </g>
  <!-- component cut: gap 8-4=4 > 3 between pos 3 and pos 4 -->
  <line x1="488" y1="134" x2="488" y2="200" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="488" y="120" text-anchor="middle" fill="#5c6b76" font-size="11.5">gap 4 &gt; 3 &#8594; cut</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="138" y="210">pos 0</text><text x="238" y="210">pos 1</text><text x="338" y="210">pos 2</text>
    <text x="438" y="210">pos 3</text><text x="538" y="210">pos 4</text>
  </g>
  <!-- reach row -->
  <text x="96" y="224" fill="#5c6b76" font-size="11.5">reach[i] &#8212; farthest rank within maxDiff:</text>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1">
    <rect x="118" y="230" width="40" height="24"/><rect x="218" y="230" width="40" height="24"/>
    <rect x="318" y="230" width="40" height="24"/><rect x="418" y="230" width="40" height="24"/>
    <rect x="518" y="230" width="40" height="24"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="12.5">
    <text x="138" y="246">3</text><text x="238" y="246">3</text><text x="338" y="246">3</text>
    <text x="438" y="246">3</text><text x="538" y="246">4</text>
  </g>
  <!-- component brackets -->
  <path d="M 96 272 L 96 268 L 480 268 L 480 272" fill="none" stroke="#42525e" stroke-width="1.2"/>
  <path d="M 496 272 L 496 268 L 580 268 L 580 272" fill="none" stroke="#42525e" stroke-width="1.2"/>
  <text x="288" y="288" text-anchor="middle" fill="#5c6b76" font-size="11.5">comp 0 = nodes {0, 4, 2, 3}</text>
  <text x="538" y="288" text-anchor="middle" fill="#5c6b76" font-size="11.5">comp 1 = {1}</text>
  <!-- caption -->
  <text x="340" y="318" text-anchor="middle" fill="#1a2026" font-size="13">one cut: the value gap 8 - 4 = 4 exceeds maxDiff = 3, so node 1 splits off;</text>
  <text x="340" y="336" text-anchor="middle" fill="#1a2026" font-size="13">distances compose farthest-reach hops: both queries need <tspan fill="#4169E1" font-weight="600">1</tspan> hop, so both answer <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
