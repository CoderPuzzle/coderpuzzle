<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 4, edges = [[1,2,2],[2,3,1],[3,4,5]], queries = [[2,4],[2,3],[1,2,3,3],[2,2],[2,3]]; answers [8,3,2,5] (verified by simulation) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="110" y1="96" x2="260" y2="96"/>
    <line x1="260" y1="96" x2="410" y2="96"/>
    <line x1="410" y1="96" x2="560" y2="96"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="110" cy="96" r="21"/>
    <circle cx="260" cy="96" r="21"/>
    <circle cx="410" cy="96" r="21"/>
    <circle cx="560" cy="96" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="110" y="101">1</text>
    <text x="260" y="101">2</text>
    <text x="410" y="101">3</text>
    <text x="560" y="101">4</text>
  </g>
  <text x="110" y="52" text-anchor="middle" fill="#5c6b76" font-size="11.5">root</text>
  <text x="185" y="80" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">2</text>
  <text x="335" y="80" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#5c6b76">1</tspan><tspan fill="#7a5a1e"> → 3</tspan></text>
  <text x="485" y="80" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">5</text>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="110" y="142" fill="#5c6b76">d = 0</text>
    <text x="260" y="142" fill="#5c6b76">d = 2</text>
    <text x="410" y="142"><tspan fill="#5c6b76">d = 3</tspan><tspan fill="#7a5a1e"> → 5</tspan></text>
    <text x="560" y="142" fill="#5c6b76">d = 8</text>
  </g>
  <text x="320" y="194" text-anchor="middle" fill="#1a2026" font-size="13.5">answers <tspan fill="#4169E1" font-weight="700">8, 3, 2, 5</tspan> — once edge (2, 3) grows from 1 to 3, d(3) = 2 + 3 = 5</text>
</svg>
