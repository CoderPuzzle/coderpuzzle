<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 2, edges = [[1,2,7]], queries = [[2,2],[1,1,2,4],[2,2]]; answers [7,4] (verified by simulation) -->
  <line x1="220" y1="96" x2="400" y2="96" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="220" cy="96" r="21"/>
    <circle cx="400" cy="96" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="220" y="101">1</text>
    <text x="400" y="101">2</text>
  </g>
  <text x="220" y="52" text-anchor="middle" fill="#5c6b76" font-size="11.5">root</text>
  <text x="310" y="80" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">7</text>
  <text x="310" y="128" text-anchor="middle" fill="#7a5a1e" font-size="12" font-weight="600">4 after the update</text>
  <text x="310" y="172" text-anchor="middle" fill="#1a2026" font-size="13.5">distance 1 → 2 is <tspan fill="#4169E1" font-weight="700">7</tspan>, then <tspan fill="#4169E1" font-weight="700">4</tspan> once edge (1, 2) is set to weight 4</text>
</svg>
