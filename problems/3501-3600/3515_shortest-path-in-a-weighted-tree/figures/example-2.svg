<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 3, edges = [[1,2,2],[1,3,4]], queries = [[2,1],[2,3],[1,1,3,7],[2,2],[2,3]]; answers [0,4,2,7] (verified by simulation) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="280" y1="64" x2="150" y2="178"/>
    <line x1="280" y1="64" x2="410" y2="178"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="280" cy="64" r="21"/>
    <circle cx="150" cy="178" r="21"/>
    <circle cx="410" cy="178" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="280" y="69">1</text>
    <text x="150" y="183">2</text>
    <text x="410" y="183">3</text>
  </g>
  <text x="280" y="24" text-anchor="middle" fill="#5c6b76" font-size="11.5">root</text>
  <text x="198" y="112" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">2</text>
  <text x="362" y="112" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#5c6b76">4</tspan><tspan fill="#7a5a1e"> → 7</tspan></text>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="150" y="224" fill="#5c6b76">d = 2</text>
    <text x="410" y="224"><tspan fill="#5c6b76">d = 4</tspan><tspan fill="#7a5a1e"> → 7</tspan></text>
  </g>
  <text x="280" y="296" text-anchor="middle" fill="#1a2026" font-size="13.5">answers <tspan fill="#4169E1" font-weight="700">0, 4, 2, 7</tspan> — d(3) becomes 7 after edge (1, 3) changes from 4 to 7</text>
</svg>
