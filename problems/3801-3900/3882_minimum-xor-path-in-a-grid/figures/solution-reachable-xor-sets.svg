<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[1,2],[3,4]]; cells 110x78 at x=190/334, y=54/166; badge = row-major fill order;
       arrows carry the above/left reachable sets into the end cell -->
  <text x="317" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid [[1, 2], [3, 4]], reachable-XOR set per cell</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="190" y="54" width="110" height="78"/><rect x="334" y="54" width="110" height="78"/>
    <rect x="190" y="166" width="110" height="78"/><rect x="334" y="166" width="110" height="78"/>
  </g>
  <g fill="#4169E1">
    <circle cx="201" cy="65" r="9"/><circle cx="345" cy="65" r="9"/>
    <circle cx="201" cy="177" r="9"/><circle cx="345" cy="177" r="9"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">
    <text x="201" y="69">1</text><text x="345" y="69">2</text><text x="201" y="181">3</text><text x="345" y="181">4</text>
  </g>
  <g text-anchor="middle">
    <text x="245" y="86" font-weight="600" font-size="17">1</text><text x="389" y="86" font-weight="600" font-size="17">2</text>
    <text x="245" y="198" font-weight="600" font-size="17">3</text><text x="389" y="198" font-weight="600" font-size="17">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="245" y="114">{1}</text><text x="389" y="114">{3}</text>
    <text x="245" y="226">{2}</text><text x="389" y="226">{7, <tspan fill="#4169E1" font-weight="600">6</tspan>}</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 389 136 V 160" marker-end="url(#arrow)"/>
    <path d="M 304 205 H 328" marker-end="url(#arrow)"/>
  </g>
  <text x="317" y="266" text-anchor="middle" fill="#5c6b76" font-size="12.5">each neighbour's set is xored with the entering cell's value</text>
  <text x="320" y="292" text-anchor="middle" fill="#1a2026" font-size="13">The end cell's reachable set {7, 6} holds both path XORs;</text>
  <text x="320" y="310" text-anchor="middle" fill="#1a2026" font-size="13">the answer is the minimum, <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
