<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="490" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- nums = [5,4,5,6], k = 2; pref = [0,5,1,4,2]; at r = 3 the window is [0,3]; trie holds pref[0..3] = {0,5,1,4}; query pref[4] = 2 -->
  <!-- trie: 15 levels, bits 14..3 all-zero here; nodes show subtree counts, leaves show the stored prefix value -->
  <text x="70" y="36" fill="#5c6b76" font-size="12.5">nums = [5, 4, 5, 6], k = 2 — last step r = 3</text>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="70" y="48" width="54" height="36"/><rect x="130" y="48" width="54" height="36"/><rect x="190" y="48" width="54" height="36"/><rect x="250" y="48" width="54" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="97" y="71">5</text><text x="157" y="71">4</text><text x="217" y="71">5</text><text x="277" y="71">6</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="97" y="98">0</text><text x="157" y="98">1</text><text x="217" y="98">2</text><text x="277" y="98">3</text>
  </g>
  <path d="M 70 104 L 70 110 L 304 110 L 304 104" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="187" y="126" text-anchor="middle" fill="#5c6b76" font-size="11.5">legal starts l ∈ [0, 3]</text>
  <text x="70" y="152" fill="#1a2026" font-size="12.5">max deque [3] → 6;  min deque [1, 2, 3] → 4;  spread 6 − 4 = 2 ≤ k</text>
  <text x="60" y="186" text-anchor="end" fill="#5c6b76" font-size="12">pref</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#dbe4fb">
    <rect x="70" y="170" width="62" height="24"/><rect x="138" y="170" width="62" height="24"/><rect x="206" y="170" width="62" height="24"/><rect x="274" y="170" width="62" height="24"/>
  </g>
  <rect x="342" y="170" width="62" height="24" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="11" fill="#1a2026">
    <text x="101" y="186">[0] = 0</text><text x="169" y="186">[1] = 5</text><text x="237" y="186">[2] = 1</text><text x="305" y="186">[3] = 4</text><text x="373" y="186">[4] = 2</text>
  </g>
  <text x="412" y="186" fill="#4169E1" font-size="10.5" font-weight="600">query</text>
  <text x="60" y="214" fill="#5c6b76" font-size="12">trie holds the window start prefixes pref[0..3] = {0, 5, 1, 4};</text>
  <text x="60" y="232" fill="#9aa7b2" font-size="11.5">greedy walk queries pref[4] = 2 (bits 14..3 omitted)</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="110" y="304">root</text><text x="240" y="246">bit 2</text><text x="370" y="246">bit 1</text><text x="500" y="213">bit 0</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 123 324 L 228 275" marker-end="url(#arrowG)"/>
    <path d="M 254 270 L 356 270" marker-end="url(#arrowG)"/>
    <path d="M 384 267 L 485 243" marker-end="url(#arrowG)"/>
    <path d="M 384 273 L 485 297" marker-end="url(#arrowG)"/>
    <path d="M 384 385 L 485 363" marker-end="url(#arrowG)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.2" fill="none">
    <path d="M 123 336 L 228 384" marker-end="url(#arrow)"/>
    <path d="M 254 390 L 356 390" marker-end="url(#arrow)"/>
    <path d="M 384 395 L 485 415" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="170" y="290">0</text>
    <text x="305" y="258">0</text>
    <text x="430" y="246">0</text>
    <text x="432" y="300">1</text>
    <text x="430" y="366">0</text>
  </g>
  <g font-size="11.5" fill="#4169E1" font-weight="600">
    <text x="132" y="318">bit 2 → take 1</text>
    <text x="305" y="378" text-anchor="middle">bit 1 → take 0</text>
    <text x="428" y="430" text-anchor="middle">bit 0 → take 1</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <circle cx="110" cy="330" r="14"/><circle cx="240" cy="270" r="14"/><circle cx="370" cy="270" r="14"/>
    <circle cx="500" cy="240" r="15"/><circle cx="500" cy="300" r="15"/><circle cx="500" cy="360" r="15"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="2">
    <circle cx="240" cy="390" r="14"/><circle cx="370" cy="390" r="14"/><circle cx="500" cy="420" r="15"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="110" y="334">4</text><text x="240" y="274">2</text><text x="370" y="274">2</text>
    <text x="500" y="245">0</text><text x="500" y="305">1</text><text x="500" y="365">4</text>
    <text x="240" y="394">2</text><text x="370" y="394">2</text><text x="500" y="425">5</text>
  </g>
  <text x="545" y="407" fill="#5c6b76" font-size="11">= pref[4] ⊕ pref[1]</text>
  <text x="545" y="425" fill="#1a2026" font-size="13">2 ⊕ 5 = <tspan fill="#4169E1" font-weight="700">7</tspan></text>
  <text x="340" y="458" text-anchor="middle" fill="#1a2026" font-size="13">Every opposite-bit child is alive: the walk sets bits 2, 1, 0 and reads 2 ⊕ 5 = <tspan fill="#4169E1" font-weight="600">7</tspan>,</text>
  <text x="340" y="476" text-anchor="middle" fill="#1a2026" font-size="13">the value of nums[1..3] = 4 ⊕ 5 ⊕ 6 — the answer.</text>
</svg>
