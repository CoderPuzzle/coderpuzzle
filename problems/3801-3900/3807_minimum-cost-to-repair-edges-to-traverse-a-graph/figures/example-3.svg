<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 3, edges = [[0,1,1]], k = 1; answer -1 (verified: node 2 has no incident edge, so it is unreachable at any budget) -->
  <line x1="130" y1="84" x2="260" y2="84" stroke="#42525e" stroke-width="1.6"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="130" cy="84" r="21"/>
    <circle cx="260" cy="84" r="21"/>
    <circle cx="390" cy="84" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="130" y="89">0</text>
    <text x="260" y="89">1</text>
    <text x="390" y="89">2</text>
  </g>
  <g font-size="12" font-weight="600" fill="#5c6b76">
    <text x="195" y="62" text-anchor="middle">1</text>
    <text x="130" y="38" text-anchor="middle">start</text>
    <text x="390" y="38" text-anchor="middle">target</text>
    <text x="390" y="130" text-anchor="middle">unreachable</text>
  </g>
  <text x="260" y="172" text-anchor="middle" fill="#1a2026" font-size="13.5">node 2 has no incident edge: 0 → 2 is impossible at any budget → <tspan fill="#4169E1" font-weight="700">−1</tspan></text>
</svg>
