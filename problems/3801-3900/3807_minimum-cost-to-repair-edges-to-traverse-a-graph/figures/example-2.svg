<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 6, edges = [[0,2,5],[2,3,6],[3,4,7],[4,5,5],[0,1,10],[1,5,12],[0,3,9],[1,2,8],[2,4,11]], k = 2; answer 12 -->
  <!-- verified: the only path of at most 2 edges from 0 to 5 is 0-1-5 with max edge weight 12; no cheaper budget admits any such path -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="100" y1="140" x2="250" y2="80"/>
    <line x1="250" y1="80" x2="250" y2="200"/>
    <line x1="250" y1="200" x2="420" y2="80"/>
    <line x1="420" y1="80" x2="460" y2="220"/>
    <line x1="250" y1="80" x2="420" y2="80"/>
    <line x1="100" y1="140" x2="250" y2="200"/>
    <line x1="100" y1="260" x2="250" y2="80"/>
  </g>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="100" y1="140" x2="100" y2="260"/>
    <line x1="100" y1="260" x2="460" y2="220"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="100" cy="140" r="21"/>
    <circle cx="100" cy="260" r="21"/>
    <circle cx="250" cy="80" r="21"/>
    <circle cx="250" cy="200" r="21"/>
    <circle cx="420" cy="80" r="21"/>
    <circle cx="460" cy="220" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="100" y="145">0</text>
    <text x="100" y="265">1</text>
    <text x="250" y="85">2</text>
    <text x="250" y="205">3</text>
    <text x="420" y="85">4</text>
    <text x="460" y="225">5</text>
  </g>
  <g font-size="12" font-weight="600" fill="#5c6b76">
    <text x="150" y="104" text-anchor="end">5</text>
    <text x="262" y="144">6</text>
    <text x="330" y="128" text-anchor="middle">7</text>
    <text x="474" y="150">5</text>
    <text x="160" y="192" text-anchor="end">8</text>
    <text x="205" y="196">9</text>
    <text x="335" y="64" text-anchor="middle">11</text>
    <text x="100" y="106" text-anchor="middle">start</text>
    <text x="460" y="262" text-anchor="middle">target</text>
  </g>
  <g font-size="12.5" font-weight="700" fill="#4169E1">
    <text x="88" y="204" text-anchor="end">10</text>
    <text x="280" y="262" text-anchor="middle">12</text>
  </g>
  <text x="290" y="302" text-anchor="middle" fill="#1a2026" font-size="13.5">money = <tspan fill="#4169E1" font-weight="700">12</tspan> opens the 2-edge route 0 → 1 → 5 — no cheaper path uses at most 2 edges</text>
</svg>
