<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 3, edges = [[0,1,10],[1,2,10],[0,2,100]], k = 1; answer 100 (verified: with k=1 the only 0->2 route is the direct edge) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="240" y1="60" x2="130" y2="210"/>
    <line x1="130" y1="210" x2="350" y2="210"/>
  </g>
  <line x1="240" y1="60" x2="350" y2="210" stroke="#4169E1" stroke-width="3.2"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="240" cy="60" r="21"/>
    <circle cx="130" cy="210" r="21"/>
    <circle cx="350" cy="210" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="240" y="65">0</text>
    <text x="130" y="215">1</text>
    <text x="350" y="215">2</text>
  </g>
  <g font-size="12" font-weight="600" fill="#5c6b76">
    <text x="166" y="142" text-anchor="end">10</text>
    <text x="240" y="244" text-anchor="middle">10</text>
    <text x="240" y="24" text-anchor="middle">start</text>
    <text x="350" y="250" text-anchor="middle">target</text>
  </g>
  <text x="312" y="136" font-size="12.5" font-weight="700" fill="#4169E1">100</text>
  <text x="260" y="284" text-anchor="middle" fill="#1a2026" font-size="13.5">k = 1 allows one edge: only the direct 0 → 2 link works, so money = <tspan fill="#4169E1" font-weight="700">100</tspan></text>
</svg>
