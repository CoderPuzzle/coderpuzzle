<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="316" fill="#ffffff"/>
  <!-- tree [2,2,1]: root 2 at (170,80) r26, left child 2 at (95,188), right child 1 at (245,188);
       dashed edge = step refused because 2 is already in the seen set, accent edge = accepted step -->
  <text x="170" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">tree [2, 2, 1]</text>
  <line x1="155" y1="101" x2="110" y2="167" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="185" y1="101" x2="230" y2="167" stroke="#4169E1" stroke-width="2.4"/>
  <circle cx="170" cy="80" r="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="95" cy="188" r="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <circle cx="245" cy="188" r="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="170" y="86" fill="#1a2026">2</text>
    <text x="95" y="194" fill="#9aa7b2">2</text>
    <text x="245" y="194" fill="#1a2026">1</text>
  </g>
  <circle cx="77" cy="170" r="9" fill="#ffffff" stroke="#5c6b76" stroke-width="1.4"/>
  <g stroke="#5c6b76" stroke-width="1.6">
    <path d="M 73.5 166.5 L 80.5 173.5 M 80.5 166.5 L 73.5 173.5"/>
  </g>
  <text x="252" y="128" fill="#4169E1" font-size="12.5" font-weight="600">path 2 to 1</text>
  <g fill="#4169E1">
    <circle cx="354" cy="80" r="3"/><circle cx="354" cy="110" r="3"/><circle cx="354" cy="140" r="3"/>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="366" y="84">start at root 2: seen {2}, best 2</text>
    <text x="366" y="114">left child 2: refused, 2 already seen</text>
    <text x="366" y="144">right child 1: seen {2, 1}, sum 2 + 1 = 3</text>
  </g>
  <text x="320" y="282" text-anchor="middle" fill="#1a2026" font-size="13">Every node starts a DFS; from the root the equal 2 is refused,</text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">so the best valid path is 2 to 1 with sum <tspan fill="#4169E1" font-weight="600">3</tspan>, the answer.</text>
</svg>
