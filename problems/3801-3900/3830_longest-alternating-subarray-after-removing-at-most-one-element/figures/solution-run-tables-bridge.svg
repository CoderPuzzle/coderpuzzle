    <text x="93" y="172">1</text><text x="159" y="172">2</text><text x="357" y="172">1</text><text x="423" y="172">3</text><text x="489" y="172">2</text>
    <text x="93" y="228">1</text><text x="159" y="228">1</text><text x="225" y="228">2</text><text x="291" y="228">3</text><text x="357" y="228">1</text><text x="423" y="228">1</text><text x="489" y="228">1</text>
    <text x="93" y="252">2</text><text x="159" y="252">3</text><text x="225" y="252">1</text><text x="291" y="252">1</text><text x="423" y="252">2</text><text x="489" y="252">1</text>
