  <text x="290" y="318" text-anchor="middle" font-size="13" fill="#1a2026">bridge r = 3: nums[2]=1 &lt; nums[4]=3, so dec[2] + rdec[4] = 2 + 2 = 4,</text>
  <text x="290" y="338" text-anchor="middle" font-size="13" fill="#1a2026">beating every no-removal run (best 3) - the answer is <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
