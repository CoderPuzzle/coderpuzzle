<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="382" fill="#ffffff"/>
  <!-- merge tree for lists=[[1,3,5],[2,4],[6,7,8]]; boxes h=64 at y 40/160/266; leaf centers x 100/255 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="300" y1="104" x2="185" y2="160"/>
    <line x1="385" y1="104" x2="505" y2="160"/>
    <line x1="150" y1="224" x2="110" y2="266"/>
    <line x1="205" y1="224" x2="250" y2="266"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="85" y="160" width="170" height="64" rx="10"/>
    <rect x="425" y="160" width="170" height="64" rx="10"/>
    <rect x="30" y="266" width="140" height="64" rx="10"/>
    <rect x="185" y="266" width="140" height="64" rx="10"/>
  </g>
  <rect x="245" y="40" width="190" height="64" rx="10" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="340" y="61" font-weight="600" font-size="15" fill="#1a2026">{0,1,2}</text>
    <text x="340" y="80" font-size="12.5" fill="#5c6b76">merged [1..8], med 4</text>
    <text x="340" y="98" font-weight="600" font-size="13" fill="#4169E1">dp 18 = 6+0+(8+|3-7|)</text>
    <text x="170" y="181" font-weight="600" font-size="14" fill="#1a2026">{0,1}</text>
    <text x="170" y="200" font-size="12.5" fill="#5c6b76">[1,2,3,4,5] med 3</text>
    <text x="170" y="218" font-weight="600" font-size="13" fill="#4169E1">dp 6 = 5+|3-2|</text>
    <text x="510" y="181" font-weight="600" font-size="14" fill="#1a2026">{2}</text>
    <text x="510" y="200" font-size="12.5" fill="#5c6b76">[6,7,8] med 7</text>
    <text x="510" y="218" font-weight="600" font-size="13" fill="#5c6b76">dp 0</text>
    <text x="100" y="287" font-weight="600" font-size="14" fill="#1a2026">{0}</text>
    <text x="100" y="306" font-size="12.5" fill="#5c6b76">[1,3,5] med 3</text>
    <text x="100" y="324" font-weight="600" font-size="13" fill="#5c6b76">dp 0</text>
    <text x="255" y="287" font-weight="600" font-size="14" fill="#1a2026">{1}</text>
    <text x="255" y="306" font-size="12.5" fill="#5c6b76">[2,4] med 2</text>
    <text x="255" y="324" font-weight="600" font-size="13" fill="#5c6b76">dp 0</text>
  </g>
  <text x="340" y="358" text-anchor="middle" font-size="13" fill="#1a2026">Merging {0,1} first costs 3+2+|3-2| = 6; the last join pays 8+|3-7| = 12,</text>
  <text x="340" y="376" text-anchor="middle" font-size="13" fill="#1a2026">so the submask sweep folds dp[{0,1,2}] = 6 + 0 + 12 = <tspan fill="#4169E1" font-weight="600">18</tspan>.</text>
</svg>
