<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums=[3,1,1,2]; columns cx=110+140i; stack boxes 72x34 rising from baseline y=290 -->
  <g text-anchor="middle" font-size="11.5" fill="#9aa7b2">
    <text x="110" y="24">i = 0</text>
    <text x="250" y="24">i = 1</text>
    <text x="390" y="24">i = 2</text>
    <text x="530" y="24">i = 3</text>
  </g>
  <g fill="#4169E1">
    <circle cx="110" cy="52" r="16"/>
    <circle cx="250" cy="52" r="16"/>
    <circle cx="390" cy="52" r="16"/>
    <circle cx="530" cy="52" r="16"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-weight="600" font-size="15">
    <text x="110" y="57">3</text>
    <text x="250" y="57">1</text>
    <text x="390" y="57">1</text>
    <text x="530" y="57">2</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="110" y="98" fill="#5c6b76">stack empty</text>
    <text x="110" y="115" fill="#5c6b76">push 3</text>
    <text x="250" y="98" fill="#5c6b76">1 != top 3</text>
    <text x="250" y="115" fill="#5c6b76">push 1</text>
    <text x="390" y="98" fill="#5c6b76">1 = top 1</text>
    <text x="390" y="115" fill="#4169E1" font-weight="600">1+1 = 2</text>
    <text x="390" y="132" fill="#9aa7b2" font-size="11.5">3 != 2, stop</text>
    <text x="530" y="98" fill="#5c6b76">2 = top 2</text>
    <text x="530" y="115" fill="#4169E1" font-weight="600">2+2 = 4</text>
    <text x="530" y="132" fill="#9aa7b2" font-size="11.5">3 != 4, stop</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <line x1="110" y1="142" x2="110" y2="248" marker-end="url(#arrow)"/>
    <line x1="250" y1="142" x2="250" y2="214" marker-end="url(#arrow)"/>
    <line x1="390" y1="142" x2="390" y2="214" marker-end="url(#arrow)"/>
    <line x1="530" y1="142" x2="530" y2="214" marker-end="url(#arrow)"/>
  </g>
  <line x1="50" y1="290" x2="590" y2="290" stroke="#9aa7b2" stroke-width="1.2"/>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="74" y="256" width="72" height="34" fill="#ffffff"/>
    <rect x="214" y="256" width="72" height="34" fill="#ffffff"/>
    <rect x="214" y="222" width="72" height="34" fill="#ffffff"/>
    <rect x="354" y="256" width="72" height="34" fill="#ffffff"/>
    <rect x="354" y="222" width="72" height="34" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="494" y="256" width="72" height="34" fill="#ffffff"/>
    <rect x="494" y="222" width="72" height="34" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="110" y="278">3</text>
    <text x="250" y="278">3</text>
    <text x="250" y="244">1</text>
    <text x="390" y="278">3</text>
    <text x="390" y="244">2</text>
    <text x="530" y="278">3</text>
    <text x="530" y="244">4</text>
  </g>
  <text x="320" y="328" text-anchor="middle" font-size="13" fill="#1a2026">Each incoming value that meets an equal top merges leftward: 1+1 = 2, then</text>
  <text x="320" y="346" text-anchor="middle" font-size="13" fill="#1a2026">2+2 = 4 stops against 3, leaving the settled stack <tspan fill="#4169E1" font-weight="600">[3, 4]</tspan>.</text>
</svg>
