<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="520" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- keyboard rows qwertyuiop / asdfghjkl / zxcvbnm; cells 44x30, pitch 46/34, origin (30,64); typed keys accented, badge = typing order -->
  <text x="260" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">one finger types s = hello, starting from a at (1, 0)</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="30" y="64" width="44" height="30"/><rect x="76" y="64" width="44" height="30"/><rect x="168" y="64" width="44" height="30"/><rect x="214" y="64" width="44" height="30"/><rect x="260" y="64" width="44" height="30"/><rect x="306" y="64" width="44" height="30"/><rect x="352" y="64" width="44" height="30"/><rect x="444" y="64" width="44" height="30"/>
    <rect x="76" y="98" width="44" height="30"/><rect x="122" y="98" width="44" height="30"/><rect x="168" y="98" width="44" height="30"/><rect x="214" y="98" width="44" height="30"/><rect x="260" y="98" width="44" height="30"/><rect x="306" y="98" width="44" height="30"/><rect x="352" y="98" width="44" height="30"/>
    <rect x="30" y="132" width="44" height="30"/><rect x="76" y="132" width="44" height="30"/><rect x="122" y="132" width="44" height="30"/><rect x="168" y="132" width="44" height="30"/><rect x="214" y="132" width="44" height="30"/><rect x="260" y="132" width="44" height="30"/><rect x="306" y="132" width="44" height="30"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="30" y="98" width="44" height="30"/><rect x="122" y="64" width="44" height="30"/><rect x="260" y="98" width="44" height="30"/><rect x="398" y="98" width="44" height="30"/><rect x="398" y="64" width="44" height="30"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="52" y="83">q</text><text x="98" y="83">w</text><text x="144" y="83">e</text><text x="190" y="83">r</text><text x="236" y="83">t</text><text x="282" y="83">y</text><text x="328" y="83">u</text><text x="374" y="83">i</text><text x="420" y="83">o</text><text x="466" y="83">p</text>
    <text x="52" y="117">a</text><text x="98" y="117">s</text><text x="144" y="117">d</text><text x="190" y="117">f</text><text x="236" y="117">g</text><text x="282" y="117">h</text><text x="328" y="117">j</text><text x="374" y="117">k</text><text x="420" y="117">l</text>
    <text x="52" y="151">z</text><text x="98" y="151">x</text><text x="144" y="151">c</text><text x="190" y="151">v</text><text x="236" y="151">b</text><text x="282" y="151">n</text><text x="328" y="151">m</text>
  </g>
  <!-- typing-order badges on the typed keys -->
  <g fill="#4169E1">
    <circle cx="66" cy="106" r="8"/><circle cx="296" cy="106" r="8"/><circle cx="158" cy="72" r="8"/><circle cx="434" cy="106" r="9"/><circle cx="434" cy="72" r="8"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">
    <text x="66" y="110">0</text><text x="296" y="110">1</text><text x="158" y="76">2</text><text x="434" y="109">3·4</text><text x="434" y="76">5</text>
  </g>
  <!-- the walk: chips a h e l l o, arrows labeled with each leg's Manhattan distance -->
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 80 212 L 116 212" marker-end="url(#arrow)"/>
    <path d="M 160 212 L 196 212" marker-end="url(#arrow)"/>
    <path d="M 240 212 L 276 212" marker-end="url(#arrow)"/>
    <path d="M 320 212 L 356 212" marker-end="url(#arrow)"/>
    <path d="M 400 212 L 436 212" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="100" y="196">5</text><text x="180" y="196">4</text><text x="260" y="196">7</text><text x="340" y="196">0</text><text x="420" y="196">1</text>
  </g>
  <rect x="42" y="199" width="36" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="122" y="199" width="36" height="26"/><rect x="202" y="199" width="36" height="26"/><rect x="282" y="199" width="36" height="26"/><rect x="362" y="199" width="36" height="26"/><rect x="442" y="199" width="36" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="13">
    <text x="60" y="216">a</text><text x="140" y="216">h</text><text x="220" y="216">e</text><text x="300" y="216">l</text><text x="380" y="216">l</text><text x="460" y="216">o</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="60" y="243">(1,0)</text><text x="140" y="243">(1,5)</text><text x="220" y="243">(0,2)</text><text x="300" y="243">(1,8)</text><text x="380" y="243">(1,8)</text><text x="460" y="243">(0,8)</text>
  </g>
  <text x="260" y="272" text-anchor="middle" fill="#1a2026" font-size="13">a→h 5 · h→e 4 · e→l 7 · l→l 0 · l→o 1 — Manhattan |Δr| + |Δc| per leg</text>
  <text x="260" y="294" text-anchor="middle" fill="#1a2026" font-size="13">total 5 + 4 + 7 + 0 + 1 = <tspan fill="#4169E1" font-weight="600">17</tspan></text>
</svg>
