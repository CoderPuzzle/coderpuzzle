<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- points [[1,1],[1,2],[2,2]], added (1,3); grid cols x=1/2 at 140-220/220-300, rows y=3/2/1 at 40-104/104-168/168-232; circles r 14 -->
  <text x="180" y="30" text-anchor="middle" fill="#5c6b76" font-size="12">x = 1</text>
  <text x="260" y="30" text-anchor="middle" fill="#5c6b76" font-size="12">x = 2</text>
  <g fill="#5c6b76" font-size="12">
    <text x="316" y="76">y = 3</text>
    <text x="316" y="140">y = 2</text>
    <text x="316" y="204">y = 1</text>
  </g>
  <rect x="140" y="40" width="160" height="192" fill="none" stroke="#42525e" stroke-width="1.2"/>
  <line x1="220" y1="40" x2="220" y2="232" stroke="#9aa7b2" stroke-width="0.8"/>
  <line x1="140" y1="104" x2="300" y2="104" stroke="#9aa7b2" stroke-width="0.8"/>
  <line x1="140" y1="168" x2="300" y2="168" stroke="#9aa7b2" stroke-width="0.8"/>
  <!-- unions: column x = 1 and row y = 2 -->
  <line x1="180" y1="186" x2="180" y2="150" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="134" y="172" text-anchor="end" fill="#4169E1" font-size="12">share x = 1</text>
  <line x1="194" y1="136" x2="246" y2="136" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="228" y="117" text-anchor="middle" fill="#4169E1" font-size="12">share y = 2</text>
  <!-- added point and its activation arrow -->
  <text x="130" y="76" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">added (1, 3)</text>
  <line x1="180" y1="88" x2="180" y2="116" stroke="#4169E1" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <circle cx="180" cy="72" r="14" fill="#ffffff" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="180" y="76" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="11">1,3</text>
  <!-- existing points -->
  <circle cx="180" cy="200" r="14" fill="#4169E1"/>
  <text x="180" y="204" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="11">1,1</text>
  <circle cx="180" cy="136" r="14" fill="#4169E1"/>
  <text x="180" y="140" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="11">1,2</text>
  <circle cx="260" cy="136" r="14" fill="#4169E1"/>
  <text x="260" y="140" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="11">2,2</text>
  <!-- component bookkeeping -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="360" y="80">x = 1 &#8594; {(1,1), (1,2)}</text>
    <text x="360" y="102">y = 2 &#8594; {(1,2), (2,2)}</text>
  </g>
  <text x="360" y="124" fill="#1a2026" font-size="12.5">&#8594; one component of <tspan fill="#4169E1" font-weight="600">size 3</tspan></text>
  <text x="360" y="156" fill="#5c6b76" font-size="12.5">added (1, 3) is on column x = 1:</text>
  <text x="360" y="182" fill="#4169E1" font-weight="600" font-size="15">answer = 3 + 1 = 4</text>
  <text x="310" y="276" text-anchor="middle" fill="#1a2026" font-size="13">The three points close into one component of size 3, so the added point</text>
  <text x="310" y="296" text-anchor="middle" fill="#1a2026" font-size="13">extends it: (1, 3) shares column x = 1 and activates <tspan fill="#4169E1" font-weight="600">3 + 1 = 4</tspan> points.</text>
</svg>
