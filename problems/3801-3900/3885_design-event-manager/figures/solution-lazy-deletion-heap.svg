<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="326" fill="#ffffff"/>
  <!-- after updatePriority(9,7) on events [[5,7],[2,7],[9,4]]: heap entries top-first (7,5),(7,9),(4,9 stale);
       live map {5:7, 9:7}; poll 1 already popped (7,2) and returned 2 -->
  <text x="320" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">state after updatePriority(9, 7)</text>
  <text x="320" y="52" text-anchor="middle" fill="#5c6b76" font-size="12.5">poll 1 popped (7, 2), matched map[2] = 7, returned 2, smaller id wins the 7-tie</text>
  <text x="60" y="78" fill="#5c6b76" font-size="12">heap, top first</text>
  <text x="380" y="78" fill="#5c6b76" font-size="12">live-priority map</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="88" width="240" height="44"/>
    <rect x="60" y="144" width="240" height="44"/>
  </g>
  <rect x="60" y="200" width="240" height="44" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <g font-weight="600" font-size="14">
    <text x="76" y="115" fill="#1a2026">(7, 5)</text>
    <text x="76" y="171" fill="#1a2026">(7, 9)</text>
    <text x="76" y="227" fill="#9aa7b2">(4, 9)</text>
  </g>
  <g font-size="11.5">
    <text x="146" y="105" fill="#5c6b76">map[5] = 7, live</text>
    <text x="146" y="121" fill="#1a2026" font-weight="600">poll 2 returns <tspan fill="#4169E1">5</tspan></text>
    <text x="146" y="161" fill="#5c6b76">map[9] = 7, live</text>
    <text x="146" y="177" fill="#1a2026" font-weight="600">poll 3 returns <tspan fill="#4169E1">9</tspan></text>
    <text x="146" y="217" fill="#5c6b76">stale: stored 4, live 7,</text>
    <text x="146" y="233" fill="#5c6b76">dropped when popped</text>
  </g>
  <rect x="380" y="88" width="200" height="100" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="12.5">
    <text x="480" y="112" fill="#5c6b76">event: priority</text>
    <text x="480" y="136" fill="#1a2026" font-weight="600">5: 7</text>
    <text x="480" y="158" fill="#1a2026" font-weight="600">9: 7</text>
    <text x="480" y="180" fill="#5c6b76" font-size="11.5">event 2 was polled</text>
  </g>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">pollHighest pops tops until the stored priority matches the map:</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">polls return <tspan fill="#4169E1" font-weight="600">5</tspan> then <tspan fill="#4169E1" font-weight="600">9</tspan>; stale entries like (4, 9) are discarded.</text>
</svg>
