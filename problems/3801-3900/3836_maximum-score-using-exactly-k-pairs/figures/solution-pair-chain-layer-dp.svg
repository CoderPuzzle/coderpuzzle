<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- products nums1[i]*nums2[j]; nums1 = [1,3,2] rows i, nums2 = [4,5,1] cols j; cells 84x44 at x 80/164/248, y 80/124/168 -->
  <text x="186" y="48" text-anchor="middle" fill="#5c6b76" font-size="12.5">products nums1[i] × nums2[j]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="122" y="72">j=0 · 4</text><text x="206" y="72">j=1 · 5</text><text x="290" y="72">j=2 · 1</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="72" y="102">i=0 · 1</text><text x="72" y="146">i=1 · 3</text><text x="72" y="190">i=2 · 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="80" y="80" width="84" height="44"/><rect x="164" y="80" width="84" height="44"/><rect x="248" y="80" width="84" height="44"/>
    <rect x="164" y="124" width="84" height="44"/><rect x="248" y="124" width="84" height="44"/>
    <rect x="80" y="168" width="84" height="44"/><rect x="248" y="168" width="84" height="44"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="#dbe4fb">
    <rect x="80" y="124" width="84" height="44"/><rect x="164" y="168" width="84" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="122" y="107">4</text><text x="206" y="107">5</text><text x="290" y="107">1</text>
    <text x="122" y="151" fill="#4169E1" font-weight="700">12</text><text x="206" y="151">15</text><text x="290" y="151">3</text>
    <text x="122" y="195">8</text><text x="206" y="195" fill="#4169E1" font-weight="700">10</text><text x="290" y="195">2</text>
  </g>
  <!-- increasing chain: pair (1,0) then pair (2,1), both indices strictly larger -->
  <path d="M 136 160 L 180 177" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- layer t = 2 derivation at the right -->
  <text x="352" y="64" fill="#5c6b76" font-size="12.5">layer t = 2 — exactly two pairs</text>
  <g font-size="13" fill="#1a2026">
    <text x="352" y="92">dp[1][2][1] = <tspan fill="#4169E1" font-weight="700">12</tspan>  (pair (1,0): 3·4)</text>
    <text x="352" y="120">+ nums1[2]·nums2[1] = 2·5 = <tspan fill="#4169E1" font-weight="700">10</tspan>  (pair (2,1))</text>
    <text x="352" y="148">dp[2][3][2] = 12 + 10 = <tspan fill="#4169E1" font-weight="700">22</tspan></text>
    <text x="352" y="176">dp[2][3][3] = max(19, 22, 17) = <tspan fill="#4169E1" font-weight="700">22</tspan></text>
  </g>
  <g font-size="12" fill="#5c6b76">
    <text x="352" y="200">losers: skip-a gives 19 = dp[2][2][3],</text>
    <text x="352" y="218">pair-(2,2) gives 17 = dp[1][2][2] + 2·1</text>
  </g>
  <text x="320" y="266" text-anchor="middle" fill="#1a2026" font-size="13">Pairing (1, 0) then (2, 1) — both indices strictly increase — sums 12 + 10 = <tspan fill="#4169E1" font-weight="600">22</tspan>,</text>
  <text x="320" y="286" text-anchor="middle" fill="#1a2026" font-size="13">the layer-2 optimum dp[2][3][3] and the answer.</text>
</svg>
