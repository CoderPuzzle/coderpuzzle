<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="384" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- edges=[[0,1],[1,2],[2,3],[3,4],[3,5],[1,6]]; nodes r=19; accent badges mark forced edges in fold order e2, e5, e1 -->
  <text x="185" y="20" text-anchor="middle" font-size="11.5" fill="#9aa7b2">rooted at node 0</text>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="185" y1="67" x2="185" y2="97"/>
    <line x1="91" y1="264" x2="52" y2="305"/>
    <line x1="119" y1="264" x2="158" y2="305"/>
  </g>
  <g stroke="#4169E1" stroke-width="3">
    <line x1="171" y1="128" x2="119" y2="172"/>
    <line x1="105" y1="203" x2="105" y2="233"/>
    <line x1="204" y1="128" x2="261" y2="172"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#9aa7b2">
    <text x="198" y="86">0</text>
    <text x="58" y="290">3</text>
    <text x="153" y="290">4</text>
  </g>
  <g fill="#4169E1">
    <circle cx="145" cy="150" r="10"/>
    <circle cx="105" cy="218" r="10"/>
    <circle cx="232" cy="150" r="10"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">
    <text x="145" y="154">1</text>
    <text x="105" y="222">2</text>
    <text x="232" y="154">5</text>
  </g>
  <circle cx="185" cy="48" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="185" cy="116" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="105" cy="184" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="105" cy="252" r="19" fill="#4169E1"/>
  <circle cx="45" cy="320" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="165" cy="320" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="275" cy="184" r="19" fill="#4169E1"/>
  <g text-anchor="middle" font-weight="600">
    <text x="185" y="53" fill="#1a2026">0</text>
    <text x="185" y="121" fill="#1a2026">1</text>
    <text x="105" y="189" fill="#1a2026">2</text>
    <text x="105" y="257" fill="#ffffff">3</text>
    <text x="45" y="325" fill="#1a2026">4</text>
    <text x="165" y="325" fill="#1a2026">5</text>
    <text x="275" y="189" fill="#ffffff">6</text>
  </g>
  <text x="105" y="292" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4169E1">1-&gt;0</text>
  <text x="275" y="224" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4169E1">0-&gt;1</text>
  <text x="368" y="64" font-size="13" font-weight="600" fill="#1a2026">reverse-BFS fold, order 5,4,3,6,2,1,0:</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="368" y="92">nodes 5, 4: need 0, keep</text>
    <text x="368" y="116">node 3: 1 ^ 0 = 1, <tspan fill="#4169E1" font-weight="600">take e2</tspan></text>
    <text x="368" y="140">node 6: 1 ^ 0 = 1, <tspan fill="#4169E1" font-weight="600">take e5</tspan></text>
    <text x="368" y="164">node 2: 0 ^ 1 = 1, <tspan fill="#4169E1" font-weight="600">take e1</tspan></text>
    <text x="368" y="188">node 1: 0 ^ 1 ^ 1 = 0, keep</text>
    <text x="368" y="212">root 0: 0 ^ 0 = 0, feasible</text>
    <text x="368" y="308" font-size="11.5" fill="#9aa7b2">accent circles: start[x] != target[x]</text>
  </g>
  <rect x="368" y="232" width="292" height="58" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="514" y="254" text-anchor="middle" font-size="12.5" fill="#5c6b76">start 0011000 -&gt; target 0010001</text>
  <text x="514" y="276" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">marked edges ascending: <tspan fill="#4169E1">[1, 2, 5]</tspan></text>
  <text x="340" y="356" text-anchor="middle" font-size="13" fill="#1a2026">A mismatched node can only be fixed by its parent edge, so the fold forces</text>
  <text x="340" y="374" text-anchor="middle" font-size="13" fill="#1a2026">e2 at node 3, e5 at node 6, e1 at node 2, and the root's 0 keeps <tspan fill="#4169E1" font-weight="600">[1, 2, 5]</tspan>.</text>
</svg>
