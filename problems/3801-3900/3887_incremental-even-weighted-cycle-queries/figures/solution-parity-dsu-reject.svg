<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="326" fill="#ffffff"/>
  <!-- parity DSU after [[0,1,1],[1,2,1]]: root 1 at (150,90), children 0 and 2 with par[0]=par[2]=1;
       dashed arc = offer [0,2,1]: same root, 1^1^1 = 1 odd, rejected -->
  <text x="320" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">parity DSU state when offer [0, 2, 1] arrives</text>
  <text x="150" y="52" text-anchor="middle" fill="#5c6b76" font-size="11.5">root</text>
  <line x1="137" y1="113" x2="93" y2="177" stroke="#42525e" stroke-width="1.6"/>
  <line x1="163" y1="113" x2="207" y2="177" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="150" cy="90" r="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="80" cy="200" r="26" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="220" cy="200" r="26" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="150" y="96">1</text><text x="80" y="206">0</text><text x="220" y="206">2</text>
  </g>
  <text x="88" y="140" text-anchor="end" fill="#5c6b76" font-size="12">par 1</text>
  <text x="212" y="140" fill="#5c6b76" font-size="12">par 1</text>
  <path d="M 106 212 Q 150 260 194 212" fill="none" stroke="#9aa7b2" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="150" y="258" text-anchor="middle" fill="#5c6b76" font-size="12">w = 1, rejected</text>
  <circle cx="304" cy="86" r="3" fill="#4169E1"/>
  <circle cx="304" cy="126" r="3" fill="#4169E1"/>
  <g stroke="#5c6b76" stroke-width="1.6">
    <path d="M 300 162 L 308 170 M 308 162 L 300 170"/>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="316" y="90">[0,1,1] added: 0 under 1, par 0 ^ 0 ^ 1 = 1</text>
    <text x="316" y="130">[1,2,1] added: 2 under 1, par 0 ^ 0 ^ 1 = 1</text>
    <text x="316" y="170"><tspan fill="#4169E1" font-weight="600">[0,2,1] rejected:</tspan> same root, 1 ^ 1 ^ 1 = 1</text>
    <text x="316" y="195" fill="#5c6b76">existing path parity 1 ^ 1 = 0, wants w = 1</text>
  </g>
  <text x="320" y="292" text-anchor="middle" fill="#1a2026" font-size="13">Path 0 to 2 already has parity 1 ^ 1 = 0 but w = 1, so the cycle</text>
  <text x="320" y="310" text-anchor="middle" fill="#1a2026" font-size="13">would weigh 1 + 1 + 1 = 3, odd: only <tspan fill="#4169E1" font-weight="600">2</tspan> edges are added.</text>
</svg>
