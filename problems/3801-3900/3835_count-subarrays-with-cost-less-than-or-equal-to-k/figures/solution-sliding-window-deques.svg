<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 368" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="368" fill="#ffffff"/>
  <!-- nums=[1,3,2], k=4; columns cx=120/340/560; strip cells 44x36 at cx-74+52j, y=56; deque boxes 26x24 -->
  <text x="340" y="20" text-anchor="middle" font-size="11.5" fill="#9aa7b2">deque fronts hold the window's max / min</text>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="120" y="44">r = 0</text>
    <text x="340" y="44">r = 1</text>
    <text x="560" y="44">r = 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="46" y="56" width="44" height="36" fill="#dbe4fb"/>
    <rect x="98" y="56" width="44" height="36" fill="#ffffff"/>
    <rect x="150" y="56" width="44" height="36" fill="#ffffff"/>
    <rect x="266" y="56" width="44" height="36" fill="#dbe4fb"/>
    <rect x="318" y="56" width="44" height="36" fill="#dbe4fb"/>
    <rect x="370" y="56" width="44" height="36" fill="#ffffff"/>
    <rect x="486" y="56" width="44" height="36" fill="#ffffff"/>
    <rect x="538" y="56" width="44" height="36" fill="#dbe4fb"/>
    <rect x="590" y="56" width="44" height="36" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="68" y="79" fill="#1a2026">1</text>
    <text x="120" y="79" fill="#9aa7b2">3</text>
    <text x="172" y="79" fill="#9aa7b2">2</text>
    <text x="288" y="79" fill="#1a2026">1</text>
    <text x="340" y="79" fill="#1a2026">3</text>
    <text x="392" y="79" fill="#9aa7b2">2</text>
    <text x="508" y="79" fill="#9aa7b2">1</text>
    <text x="560" y="79" fill="#1a2026">3</text>
    <text x="612" y="79" fill="#1a2026">2</text>
  </g>
  <g font-size="12.5" fill="#5c6b76" text-anchor="end">
    <text x="24" y="134">max</text>
    <text x="24" y="168">min</text>
    <text x="244" y="134">max</text>
    <text x="244" y="168">min</text>
    <text x="464" y="134">max</text>
    <text x="464" y="168">min</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="32" y="118" width="26" height="24"/>
    <rect x="32" y="152" width="26" height="24"/>
    <rect x="252" y="118" width="26" height="24"/>
    <rect x="252" y="152" width="26" height="24"/>
    <rect x="282" y="152" width="26" height="24"/>
    <rect x="472" y="118" width="26" height="24"/>
    <rect x="502" y="118" width="26" height="24"/>
    <rect x="472" y="152" width="26" height="24"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="45" y="134">1</text>
    <text x="45" y="168">1</text>
    <text x="265" y="134">3</text>
    <text x="265" y="168">1</text>
    <text x="295" y="168">3</text>
    <text x="485" y="134">3</text>
    <text x="515" y="134">2</text>
    <text x="485" y="168">2</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#9aa7b2">
    <text x="120" y="200">1 enters both deques</text>
    <text x="340" y="200">3 pops 1 off max-back,</text>
    <text x="340" y="216">3 joins min-back</text>
    <text x="560" y="200">2 pops 3 off min-back,</text>
    <text x="560" y="216">left = 1 evicts min 1</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#5c6b76">
    <text x="120" y="248">(1-1)*1 = 0 &lt;= 4</text>
    <text x="340" y="248">(3-1)*2 = 4 &lt;= 4</text>
    <text x="560" y="248" fill="#4169E1" font-weight="600">(3-1)*3 = 6 &gt; 4, shrink</text>
    <text x="560" y="266">(3-2)*2 = 2 &lt;= 4</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="120" y="298">add 1 (total <tspan fill="#4169E1" font-weight="600">1</tspan>)</text>
    <text x="340" y="298">add 2 (total <tspan fill="#4169E1" font-weight="600">3</tspan>)</text>
    <text x="560" y="298">add 2 (total <tspan fill="#4169E1" font-weight="600">5</tspan>)</text>
  </g>
  <text x="340" y="332" text-anchor="middle" font-size="13" fill="#1a2026">With k = 4, window [1, 3] costs exactly 4 but [1, 3, 2] costs 6 &gt; 4;</text>
  <text x="340" y="350" text-anchor="middle" font-size="13" fill="#1a2026">after shrinking, the right ends contribute 1 + 2 + 2 = <tspan fill="#4169E1" font-weight="600">5</tspan> valid subarrays.</text>
</svg>
