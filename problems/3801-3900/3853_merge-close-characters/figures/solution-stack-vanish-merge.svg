<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = abca, k = 3; stack cells 60x46 at x=170, y = 82/136/190; incoming cell at (330,136) -->
  <text x="200" y="70" text-anchor="middle" fill="#5c6b76" font-size="12.5">stack (never holds a close pair)</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="170" y="190" width="60" height="46"/>
    <rect x="170" y="136" width="60" height="46"/>
    <rect x="170" y="82" width="60" height="46"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="200" y="219" fill="#4169E1">a</text>
    <text x="200" y="165" fill="#1a2026">b</text>
    <text x="200" y="111" fill="#1a2026">c</text>
  </g>
  <g fill="#9aa7b2" font-size="11.5" text-anchor="end">
    <text x="138" y="218">step 1</text>
    <text x="138" y="164">step 2</text>
    <text x="138" y="110">step 3</text>
  </g>
  <!-- last k = 3 survivors bracket -->
  <path d="M 160 82 L 150 82 L 150 236 L 160 236" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="200" y="262" text-anchor="middle" fill="#4169E1" font-size="12.5">last k = 3 survivors</text>
  <!-- incoming a -->
  <text x="360" y="122" text-anchor="middle" fill="#1a2026" font-size="12">step 4: incoming 'a'</text>
  <rect x="330" y="136" width="60" height="46" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <text x="360" y="165" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="15">a</text>
  <!-- merge-away arrow into the equal survivor a -->
  <path d="M 330 172 Q 300 215 236 213" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="242" text-anchor="middle" fill="#5c6b76" font-size="12.5">distance 3 &#8722; 0 = 3 &#8804; k = 3 &#8594; 'a' vanishes</text>
  <text x="300" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Incoming 'a' equals a survivor within the k = 3 window (3 &#8722; 0 = 3), so it</text>
  <text x="300" y="314" text-anchor="middle" fill="#1a2026" font-size="13">merges away; the sweep leaves a, b, c &#8212; the answer <tspan fill="#4169E1" font-weight="600">abc</tspan>.</text>
</svg>
