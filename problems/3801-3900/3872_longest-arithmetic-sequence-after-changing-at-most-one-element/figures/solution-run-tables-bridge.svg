<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="366" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [9,7,5,10,1]; cells 74x46 at x=110+74i, y=64; left=[1,2,3,2,2], right=[3,2,2,2,1]; p=3, d=-2 -->
  <text x="369" y="46" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="15">3</text>
  <line x1="369" y1="52" x2="369" y2="58" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="110" y="64" width="74" height="46"/><rect x="184" y="64" width="74" height="46"/>
    <rect x="258" y="64" width="74" height="46"/><rect x="332" y="64" width="74" height="46"/>
    <rect x="406" y="64" width="74" height="46"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="147" y="92" fill="#1a2026">9</text>
    <text x="221" y="92" fill="#1a2026">7</text>
    <text x="295" y="92" fill="#1a2026">5</text>
    <text x="369" y="92" fill="#9aa7b2">10</text>
    <text x="443" y="92" fill="#1a2026">1</text>
  </g>
  <line x1="352" y1="92" x2="386" y2="92" stroke="#9aa7b2" stroke-width="1.5"/>
  <!-- original step differences -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="184" y="124">&#8722;2</text><text x="258" y="124">&#8722;2</text>
    <text x="332" y="124">+5</text><text x="406" y="124">&#8722;9</text>
  </g>
  <!-- bridged run bracket -->
  <path d="M 110 136 L 110 144 L 480 144 L 480 136" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="295" y="166" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">after replacing nums[3]: one run, d = &#8722;2, length 5</text>
  <!-- run tables -->
  <text x="70" y="200" text-anchor="end" fill="#5c6b76" font-size="12.5">left</text>
  <text x="70" y="215" text-anchor="end" fill="#9aa7b2" font-size="11">ends at i</text>
  <g text-anchor="middle" font-size="13.5">
    <text x="147" y="200" fill="#1a2026">1</text>
    <text x="221" y="200" fill="#1a2026">2</text>
    <text x="295" y="200" fill="#4169E1" font-weight="600">3</text>
    <text x="369" y="200" fill="#1a2026">2</text>
    <text x="443" y="200" fill="#1a2026">2</text>
  </g>
  <text x="70" y="236" text-anchor="end" fill="#5c6b76" font-size="12.5">right</text>
  <text x="70" y="251" text-anchor="end" fill="#9aa7b2" font-size="11">starts at i</text>
  <g text-anchor="middle" font-size="13.5">
    <text x="147" y="236" fill="#1a2026">3</text>
    <text x="221" y="236" fill="#1a2026">2</text>
    <text x="295" y="236" fill="#1a2026">2</text>
    <text x="369" y="236" fill="#1a2026">2</text>
    <text x="443" y="236" fill="#4169E1" font-weight="600">1</text>
  </g>
  <!-- bridge arithmetic -->
  <text x="110" y="280" fill="#1a2026" font-size="12.5">p = 3: d = (nums[4] &#8722; nums[2]) / 2 = (1 &#8722; 5) / 2 = &#8722;2</text>
  <text x="110" y="302" fill="#1a2026" font-size="12.5">bridge = left[2] + right[4] + 1 = 3 + 1 + 1 = <tspan fill="#4169E1" font-weight="600">5</tspan></text>
  <text x="340" y="334" text-anchor="middle" fill="#1a2026" font-size="13">left[2] = 3 covers 9, 7, 5 and right[4] = 1 covers the lone 1; replacing</text>
  <text x="340" y="352" text-anchor="middle" fill="#1a2026" font-size="13">nums[3] with 3 (d = &#8722;2) joins them into one arithmetic run of length <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
</svg>
