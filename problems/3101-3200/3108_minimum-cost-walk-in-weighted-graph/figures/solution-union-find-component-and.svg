<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- n=5, edges [[0,1,7],[1,3,7],[1,2,1]]; merge rows y=44+26i; component box x=70..370 y=130..294; node-4 box x=470..650; union-by-size parents all point at root 0 -->
  <text x="24" y="20" font-size="12" fill="#5c6b76">each edge unions its endpoints, then ANDs its weight into the root's accumulator</text>
  <!-- per-edge merge rows -->
  <g font-size="13" font-weight="600" fill="#1a2026">
    <text x="24" y="44">edge [0, 1, 7]</text>
    <text x="24" y="70">edge [1, 3, 7]</text>
    <text x="24" y="96">edge [1, 2, 1]</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="140" y="44">union(0, 1): 1 attaches to root 0</text>
    <text x="140" y="70">union(1, 3): 3 attaches to root 0</text>
    <text x="140" y="96">union(1, 2): 2 attaches to root 0</text>
  </g>
  <g font-size="13" fill="#1a2026">
    <text x="400" y="44">AND[0] = 7</text>
    <text x="400" y="70">AND[0] = 7 &amp; 7 = 7</text>
    <text x="400" y="96">AND[0] = 7 &amp; 1 = <tspan fill="#4169E1" font-weight="700">1</tspan></text>
  </g>
  <line x1="24" y1="112" x2="656" y2="112" stroke="#dbe4fb" stroke-width="1.5"/>
  <!-- merged component -->
  <rect x="70" y="130" width="300" height="164" rx="12" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
  <text x="220" y="152" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">one component, root 0</text>
  <g stroke="#42525e" stroke-width="1.3">
    <line x1="148" y1="251" x2="203" y2="224" marker-end="url(#arrowg)"/>
    <line x1="220" y1="249" x2="220" y2="227" marker-end="url(#arrowg)"/>
    <line x1="292" y1="251" x2="237" y2="224" marker-end="url(#arrowg)"/>
  </g>
  <circle cx="220" cy="208" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="220" y="213" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">0</text>
  <circle cx="140" cy="266" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="140" y="271" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">1</text>
  <circle cx="220" cy="266" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="220" y="271" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">2</text>
  <circle cx="300" cy="266" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="300" y="271" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">3</text>
  <text x="248" y="213" font-size="13"><tspan fill="#5c6b76">AND = </tspan><tspan fill="#4169E1" font-weight="700">1</tspan></text>
  <!-- untouched singleton -->
  <rect x="470" y="130" width="180" height="164" rx="12" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="560" cy="190" r="17" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="560" y="195" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9aa7b2">4</text>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="560" y="236">its own root,</text>
    <text x="560" y="254">no edges, no AND entry</text>
  </g>
  <!-- queries -->
  <g font-size="13" fill="#1a2026">
    <text x="24" y="330">query [0, 3]: find(0) = find(3) = 0 — same root → cost <tspan fill="#4169E1" font-weight="700">1</tspan></text>
    <text x="24" y="358">query [3, 4]: find(3) = 0, find(4) = 4 — different roots → <tspan fill="#5c6b76" font-weight="600">-1</tspan></text>
  </g>
  <text x="340" y="388" text-anchor="middle" font-size="13" fill="#1a2026">Unions collapse {0, 1, 2, 3} into one component whose weights 7, 7, 1 AND down to 1,</text>
  <text x="340" y="406" text-anchor="middle" font-size="13" fill="#1a2026">so query [0, 3] costs 1, while edgeless node 4 shares no root and query [3, 4] answers -1.</text>
</svg>
