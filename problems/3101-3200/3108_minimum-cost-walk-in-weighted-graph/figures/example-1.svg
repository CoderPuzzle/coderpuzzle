<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 5, edges = [[0,1,7],[1,3,7],[1,2,1]], query = [[0,3],[3,4]]; walk 0-1-2-1-3 costs 7 &amp; 1 &amp; 1 &amp; 7 = 1; node 4 unreachable (verified) -->
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="81" y1="90" x2="179" y2="90"/>
    <line x1="221" y1="90" x2="319" y2="90"/>
    <line x1="200" y1="111" x2="200" y2="209"/>
  </g>
  <line x1="410" y1="40" x2="410" y2="140" stroke="#5c6b76" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="60" cy="90" r="21"/>
    <circle cx="340" cy="90" r="21"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="200" cy="90" r="21"/>
    <circle cx="200" cy="230" r="21"/>
    <circle cx="470" cy="90" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="60" y="95">0</text>
    <text x="200" y="95">1</text>
    <text x="340" y="95">3</text>
    <text x="200" y="235">2</text>
    <text x="470" y="95">4</text>
  </g>
  <g fill="#5c6b76" font-size="12" font-weight="600" text-anchor="middle">
    <text x="130" y="80">7</text>
    <text x="270" y="80">7</text>
    <text x="220" y="164">1</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="200" y="264">query [0,3] → 1</text>
    <text x="470" y="142">query [3,4] → −1</text>
  </g>
  <text x="280" y="292" text-anchor="middle" fill="#1a2026" font-size="13.5">walk 0 → 1 → 2 → 1 → 3 costs 7 &amp; 1 &amp; 1 &amp; 7 = <tspan fill="#4169E1" font-weight="700">1</tspan>; no walk reaches node 4, so that query returns <tspan fill="#4169E1" font-weight="700">−1</tspan></text>
</svg>
