<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 252" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 6, edges = [[0,1,4],[0,2,1],[1,3,2],[1,4,3],[1,5,1],[2,3,1],[3,5,3],[4,5,2]]; dist(0,5) = 5; true edges: 0,1,2,4,5,6 (verified by Dijkstra) -->
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="60" y1="80" x2="185" y2="80"/>
    <line x1="60" y1="80" x2="150" y2="195"/>
    <line x1="185" y1="80" x2="255" y2="195"/>
    <line x1="185" y1="80" x2="420" y2="140"/>
    <line x1="150" y1="195" x2="255" y2="195"/>
    <line x1="255" y1="195" x2="420" y2="140"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="185" y1="80" x2="305" y2="55"/>
    <line x1="305" y1="55" x2="420" y2="140"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="60" cy="80" r="21"/>
    <circle cx="420" cy="140" r="21"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="185" cy="80" r="21"/>
    <circle cx="305" cy="55" r="21"/>
    <circle cx="150" cy="195" r="21"/>
    <circle cx="255" cy="195" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="60" y="85">0</text>
    <text x="185" y="85">1</text>
    <text x="305" y="60">4</text>
    <text x="150" y="200">2</text>
    <text x="255" y="200">3</text>
    <text x="420" y="145">5</text>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="60" y="48">d 0</text>
    <text x="185" y="48">d 4</text>
    <text x="305" y="26">d 7</text>
    <text x="150" y="164">d 1</text>
    <text x="262" y="163">d 2</text>
    <text x="420" y="108">d 5</text>
  </g>
  <g fill="#5c6b76" font-size="12" font-weight="600">
    <text x="122" y="71" text-anchor="middle">4</text>
    <text x="88" y="136" text-anchor="end">1</text>
    <text x="207" y="146" text-anchor="end">2</text>
    <text x="245" y="58" text-anchor="middle">3</text>
    <text x="310" y="100">1</text>
    <text x="202" y="187" text-anchor="middle">1</text>
    <text x="330" y="154" text-anchor="end">3</text>
    <text x="348" y="112" text-anchor="end">2</text>
  </g>
  <text x="250" y="244" text-anchor="middle" fill="#1a2026" font-size="13.5">the shortest 0 → 5 distance is <tspan fill="#4169E1" font-weight="700">5</tspan>; the blue edges (d = distance from 0) lie on one of the three shortest paths, edges 1–4 and 4–5 never do</text>
</svg>
