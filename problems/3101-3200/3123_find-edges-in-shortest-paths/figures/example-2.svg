<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 262" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 4, edges = [[2,0,1],[0,1,1],[0,3,4],[3,2,2]]; dist(0,3) = 3; true edges: [2,0,1] and [3,2,2] (verified by Dijkstra) -->
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="120" y1="130" x2="330" y2="130"/>
    <line x1="330" y1="130" x2="225" y2="215"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="120" y1="130" x2="225" y2="55"/>
    <line x1="120" y1="130" x2="225" y2="215"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="120" cy="130" r="21"/>
    <circle cx="225" cy="215" r="21"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="225" cy="55" r="21"/>
    <circle cx="330" cy="130" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="120" y="135">0</text>
    <text x="225" y="60">1</text>
    <text x="330" y="135">2</text>
    <text x="225" y="220">3</text>
  </g>
  <g fill="#5c6b76" font-size="12" font-weight="600">
    <text x="225" y="121" text-anchor="middle">1</text>
    <text x="164" y="86" text-anchor="end">1</text>
    <text x="164" y="186" text-anchor="end">4</text>
    <text x="286" y="182">2</text>
  </g>
  <text x="225" y="254" text-anchor="middle" fill="#1a2026" font-size="13.5">one shortest path 0 → 2 → 3 of total weight 1 + 2 = <tspan fill="#4169E1" font-weight="700">3</tspan>; only its two blue edges are true</text>
</svg>
