<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- rooks = [[0,0],[1,0],[1,1]], n = 3; sorted x [0,1,1] vs targets 0,1,2 -> 0+0+1 = 1;
       sorted y [0,0,1] vs 0,1,2 -> 0+1+1 = 2; chips 44x28, columns at x=380,500,620 -->
  <text x="40" y="40" font-size="12.5" font-weight="600" fill="#1a2026">rooks = [[0, 0], [1, 0], [1, 1]], n = 3</text>
  <rect x="470" y="30" width="20" height="15" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="496" y="42" font-size="11.5" fill="#5c6b76">sorted</text>
  <rect x="560" y="30" width="20" height="15" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="586" y="42" font-size="11.5" fill="#5c6b76">target</text>
  <!-- x axis -->
  <text x="40" y="82" font-size="13.5" font-weight="600" fill="#1a2026">x-coordinates</text>
  <text x="40" y="100" font-size="12.5" fill="#5c6b76">[0, 1, 1] sorted</text>
  <text x="40" y="117" font-size="11.5" fill="#9aa7b2">horizontal</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="358" y="64" width="44" height="28"/><rect x="478" y="64" width="44" height="28"/><rect x="598" y="64" width="44" height="28"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="380" y="83">0</text><text x="500" y="83">1</text><text x="620" y="83">1</text>
  </g>
  <g fill="none" stroke="#9aa7b2" stroke-width="1.5">
    <path d="M 380 96 L 380 112" marker-end="url(#arrow)"/>
    <path d="M 500 96 L 500 112" marker-end="url(#arrow)"/>
    <path d="M 620 96 L 620 112" marker-end="url(#arrow)"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="358" y="116" width="44" height="28"/><rect x="478" y="116" width="44" height="28"/><rect x="598" y="116" width="44" height="28"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="380" y="135">0</text><text x="500" y="135">1</text><text x="620" y="135">2</text>
  </g>
  <g text-anchor="end" font-size="11.5" fill="#9aa7b2">
    <text x="352" y="108">|0-0|=0</text><text x="472" y="108">|1-1|=0</text>
    <text x="592" y="108" fill="#4169E1" font-weight="600">|1-2|=1</text>
  </g>
  <!-- y axis -->
  <text x="40" y="202" font-size="13.5" font-weight="600" fill="#1a2026">y-coordinates</text>
  <text x="40" y="220" font-size="12.5" fill="#5c6b76">[0, 0, 1] sorted</text>
  <text x="40" y="237" font-size="11.5" fill="#9aa7b2">vertical</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="358" y="184" width="44" height="28"/><rect x="478" y="184" width="44" height="28"/><rect x="598" y="184" width="44" height="28"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="380" y="203">0</text><text x="500" y="203">0</text><text x="620" y="203">1</text>
  </g>
  <g fill="none" stroke="#9aa7b2" stroke-width="1.5">
    <path d="M 380 216 L 380 232" marker-end="url(#arrow)"/>
    <path d="M 500 216 L 500 232" marker-end="url(#arrow)"/>
    <path d="M 620 216 L 620 232" marker-end="url(#arrow)"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="358" y="236" width="44" height="28"/><rect x="478" y="236" width="44" height="28"/><rect x="598" y="236" width="44" height="28"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="380" y="255">0</text><text x="500" y="255">1</text><text x="620" y="255">2</text>
  </g>
  <g text-anchor="end" font-size="11.5" fill="#9aa7b2">
    <text x="352" y="228">|0-0|=0</text><text x="472" y="228" fill="#4169E1" font-weight="600">|0-1|=1</text>
    <text x="592" y="228" fill="#4169E1" font-weight="600">|1-2|=1</text>
  </g>
  <!-- axis totals -->
  <text x="40" y="296" font-size="13" fill="#1a2026">horizontal moves: 0 + 0 + 1 = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <text x="360" y="296" font-size="13" fill="#1a2026">vertical moves: 0 + 1 + 1 = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="340" y="326" text-anchor="middle" font-size="13" fill="#1a2026">Sorting each axis against 0, 1, 2 minimizes its |delta| sum by the rearrangement</text>
  <text x="340" y="344" text-anchor="middle" font-size="13" fill="#1a2026">inequality; the axes never interfere, so the answer is 1 + 2 = <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
