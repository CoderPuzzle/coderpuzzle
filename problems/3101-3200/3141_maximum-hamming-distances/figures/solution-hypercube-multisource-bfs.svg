<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="720" height="548" fill="#ffffff"/>
  <!-- 4-cube, m=4: inner ring b3=0 (r=80), outer ring b3=1 (r=150), center (300,270); rings follow the gray cycle 000,001,011,010,110,111,101,100 on bits b2b1b0; chips 44x30 show value + dist; dist = multi-source BFS from seeds {1001,1100,1011} -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="24" y="40">seeds = the distinct values of nums — dist 0</text>
    <text x="24" y="64">each vertex: 4-bit value + BFS distance</text>
  </g>
  <g font-size="12.5">
    <text x="480" y="40" font-weight="600" fill="#1a2026">answer[i] = m - dist[~nums[i]]</text>
    <text x="480" y="64" fill="#5c6b76">HD(x, y) + HD(~x, y) = m</text>
  </g>
  <!-- cube edges -->
  <g stroke="#9aa7b2" stroke-width="1.2">
    <line x1="300" y1="190" x2="357" y2="213"/><line x1="357" y1="213" x2="380" y2="270"/>
    <line x1="380" y1="270" x2="357" y2="327"/><line x1="357" y1="327" x2="300" y2="350"/>
    <line x1="300" y1="350" x2="243" y2="327"/><line x1="243" y1="327" x2="220" y2="270"/>
    <line x1="220" y1="270" x2="243" y2="213"/><line x1="243" y1="213" x2="300" y2="190"/>
    <line x1="300" y1="120" x2="406" y2="164"/><line x1="406" y1="164" x2="450" y2="270"/>
    <line x1="450" y1="270" x2="406" y2="376"/><line x1="406" y1="376" x2="300" y2="420"/>
    <line x1="300" y1="420" x2="194" y2="376"/><line x1="194" y1="376" x2="150" y2="270"/>
    <line x1="150" y1="270" x2="194" y2="164"/><line x1="194" y1="164" x2="300" y2="120"/>
    <line x1="300" y1="190" x2="300" y2="120"/><line x1="357" y1="213" x2="406" y2="164"/>
    <line x1="380" y1="270" x2="450" y2="270"/><line x1="357" y1="327" x2="406" y2="376"/>
    <line x1="300" y1="350" x2="300" y2="420"/><line x1="243" y1="327" x2="194" y2="376"/>
    <line x1="220" y1="270" x2="150" y2="270"/><line x1="243" y1="213" x2="194" y2="164"/>
  </g>
  <!-- outer ring vertices -->
  <g text-anchor="middle">
    <rect x="278" y="105" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="300" y="117" font-size="11.5" font-weight="600" fill="#1a2026">1000</text>
    <text x="300" y="131" font-size="10.5" fill="#5c6b76">1</text>
    <rect x="384" y="149" width="44" height="30" rx="8" fill="#4169E1"/>
    <text x="406" y="161" font-size="11.5" font-weight="600" fill="#ffffff">1001</text>
    <text x="406" y="175" font-size="10.5" fill="#dbe4fb">0</text>
    <rect x="428" y="255" width="44" height="30" rx="8" fill="#4169E1"/>
    <text x="450" y="267" font-size="11.5" font-weight="600" fill="#ffffff">1011</text>
    <text x="450" y="281" font-size="10.5" fill="#dbe4fb">0</text>
    <rect x="384" y="361" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="406" y="373" font-size="11.5" font-weight="600" fill="#1a2026">1010</text>
    <text x="406" y="387" font-size="10.5" fill="#5c6b76">1</text>
    <rect x="278" y="405" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="300" y="417" font-size="11.5" font-weight="600" fill="#1a2026">1110</text>
    <text x="300" y="431" font-size="10.5" fill="#5c6b76">1</text>
    <rect x="172" y="361" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="194" y="373" font-size="11.5" font-weight="600" fill="#1a2026">1111</text>
    <text x="194" y="387" font-size="10.5" fill="#5c6b76">1</text>
    <rect x="128" y="255" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="150" y="267" font-size="11.5" font-weight="600" fill="#1a2026">1101</text>
    <text x="150" y="281" font-size="10.5" fill="#5c6b76">1</text>
    <rect x="172" y="149" width="44" height="30" rx="8" fill="#4169E1"/>
    <text x="194" y="161" font-size="11.5" font-weight="600" fill="#ffffff">1100</text>
    <text x="194" y="175" font-size="10.5" fill="#dbe4fb">0</text>
  </g>
  <!-- inner ring vertices -->
  <g text-anchor="middle">
    <rect x="278" y="175" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="300" y="187" font-size="11.5" font-weight="600" fill="#1a2026">0000</text>
    <text x="300" y="201" font-size="10.5" fill="#5c6b76">2</text>
    <rect x="335" y="198" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="357" y="210" font-size="11.5" font-weight="600" fill="#1a2026">0001</text>
    <text x="357" y="224" font-size="10.5" fill="#5c6b76">1</text>
    <rect x="358" y="255" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="380" y="267" font-size="11.5" font-weight="600" fill="#1a2026">0011</text>
    <text x="380" y="281" font-size="10.5" fill="#5c6b76">1</text>
    <rect x="335" y="312" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="357" y="324" font-size="11.5" font-weight="600" fill="#1a2026">0010</text>
    <text x="357" y="338" font-size="10.5" fill="#5c6b76">2</text>
    <rect x="278" y="335" width="44" height="30" rx="8" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="300" y="347" font-size="11.5" font-weight="600" fill="#1a2026">0110</text>
    <text x="300" y="361" font-size="10.5" font-weight="700" fill="#4169E1">2</text>
    <rect x="221" y="312" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="243" y="324" font-size="11.5" font-weight="600" fill="#1a2026">0111</text>
    <text x="243" y="338" font-size="10.5" fill="#5c6b76">2</text>
    <rect x="198" y="255" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="220" y="267" font-size="11.5" font-weight="600" fill="#1a2026">0101</text>
    <text x="220" y="281" font-size="10.5" fill="#5c6b76">2</text>
    <rect x="221" y="198" width="44" height="30" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="243" y="210" font-size="11.5" font-weight="600" fill="#1a2026">0100</text>
    <text x="243" y="224" font-size="10.5" fill="#5c6b76">1</text>
  </g>
  <text x="332" y="374" font-size="11.5" font-weight="600" fill="#4169E1">dist 2</text>
  <text x="360" y="496" text-anchor="middle" font-size="13" fill="#1a2026">Multi-source BFS from 1001, 1100, 1011 floods the cube; the complement 0110 of nums[0] = 1001</text>
  <text x="360" y="518" text-anchor="middle" font-size="13" fill="#1a2026">ends at dist 2, so answer[0] = <tspan fill="#4169E1" font-weight="600">4 - 2 = 2</tspan> — the same identity gives [2, 3, 2, 3] overall.</text>
</svg>
