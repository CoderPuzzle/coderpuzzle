<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="356" fill="#ffffff"/>
  <!-- days = 10; meetings [[5,7],[1,3],[9,10]] sorted to [1,3],[5,7],[9,10]; day cells 46x40 from x=70, y=96; free days 4 and 8 accented -->
  <text x="300" y="76" text-anchor="middle" fill="#5c6b76" font-size="12.5">meetings sorted: [1, 3]   [5, 7]   [9, 10]</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="96" width="46" height="40"/><rect x="116" y="96" width="46" height="40"/><rect x="162" y="96" width="46" height="40"/>
    <rect x="254" y="96" width="46" height="40"/><rect x="300" y="96" width="46" height="40"/><rect x="346" y="96" width="46" height="40"/>
    <rect x="438" y="96" width="46" height="40"/><rect x="484" y="96" width="46" height="40"/>
  </g>
  <rect x="208" y="96" width="46" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2.2"/>
  <rect x="392" y="96" width="46" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2.2"/>
  <g text-anchor="middle" font-size="14">
    <text x="93" y="121" fill="#1a2026">1</text><text x="139" y="121" fill="#1a2026">2</text><text x="185" y="121" fill="#1a2026">3</text>
    <text x="231" y="121" fill="#4169E1" font-weight="700">4</text>
    <text x="277" y="121" fill="#1a2026">5</text><text x="323" y="121" fill="#1a2026">6</text><text x="369" y="121" fill="#1a2026">7</text>
    <text x="415" y="121" fill="#4169E1" font-weight="700">8</text>
    <text x="461" y="121" fill="#1a2026">9</text><text x="507" y="121" fill="#1a2026">10</text>
  </g>
  <!-- lastEnd frontier ticks -->
  <g stroke="#42525e" stroke-width="2">
    <path d="M 70 136 V 142"/><path d="M 208 136 V 142"/><path d="M 392 136 V 142"/><path d="M 530 136 V 142"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="70" y="156">lastEnd 0</text><text x="208" y="156">lastEnd 3</text><text x="392" y="156">lastEnd 7</text><text x="530" y="156">lastEnd 10 = days</text>
  </g>
  <!-- sweep steps -->
  <g font-size="13" fill="#1a2026">
    <text x="70" y="186">start: lastEnd = 0</text>
    <text x="70" y="208">[1, 3]:  gap = 1 − 0 − 1 = 0          → lastEnd = 3</text>
    <text x="70" y="230">[5, 7]:  gap = 5 − 3 − 1 = <tspan fill="#4169E1" font-weight="600">1</tspan> (day 4 free)  → lastEnd = 7</text>
    <text x="70" y="252">[9, 10]: gap = 9 − 7 − 1 = <tspan fill="#4169E1" font-weight="600">1</tspan> (day 8 free)  → lastEnd = 10</text>
    <text x="70" y="274">tail:   10 − 10 = 0   →   total free = <tspan fill="#4169E1" font-weight="700">2</tspan></text>
  </g>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">Days strictly between lastEnd and the next meeting's start are free:</text>
  <text x="320" y="328" text-anchor="middle" fill="#1a2026" font-size="13">day <tspan fill="#4169E1" font-weight="600">4</tspan> and day <tspan fill="#4169E1" font-weight="600">8</tspan> — the answer is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
