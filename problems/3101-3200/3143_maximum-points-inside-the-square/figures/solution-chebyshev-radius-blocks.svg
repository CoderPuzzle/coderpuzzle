<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- points = [[2,2] a, [-1,-2] b, [-4,4] d, [-3,1] c, [3,-3] a]; radii 2,2,4,3,3; plot origin (210,250), 30px/unit; square = half-side 2 -->
  <!-- admissible square: half-side 2, i.e. side 4 (drawn first so axis ticks stay readable) -->
  <rect x="150" y="190" width="120" height="120" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="144" y="186" text-anchor="end" fill="#5c6b76" font-size="11.5">side 4</text>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 56 250 H 336" marker-end="url(#arrowG)"/>
    <path d="M 210 344 V 126" marker-end="url(#arrowG)"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1">
    <path d="M 90 247 V 253"/><path d="M 150 247 V 253"/><path d="M 270 247 V 253"/><path d="M 330 247 V 253"/>
    <path d="M 207 190 H 213"/><path d="M 207 130 H 213"/><path d="M 207 310 H 213"/>
  </g>
  <g fill="#9aa7b2" font-size="11">
    <text x="90" y="266" text-anchor="middle">-4</text><text x="146" y="266" text-anchor="end">-2</text>
    <text x="274" y="266" text-anchor="start">2</text><text x="330" y="266" text-anchor="middle">4</text>
    <text x="200" y="184" text-anchor="end">2</text><text x="200" y="134" text-anchor="end">4</text>
    <text x="200" y="322" text-anchor="end">-2</text><text x="202" y="262" text-anchor="end">0</text>
  </g>
  <g>
    <circle cx="270" cy="190" r="5.5" fill="#4169E1"/>
    <circle cx="180" cy="310" r="5.5" fill="#4169E1"/>
    <circle cx="120" cy="220" r="5" fill="#9aa7b2"/>
    <circle cx="300" cy="340" r="5" fill="#9aa7b2"/>
    <circle cx="90" cy="130" r="5" fill="#9aa7b2"/>
  </g>
  <g font-size="12">
    <text x="280" y="180" fill="#1a2026" font-weight="600">a (2, 2)</text>
    <text x="170" y="326" text-anchor="end" fill="#1a2026" font-weight="600">b (-1, -2)</text>
    <text x="110" y="216" text-anchor="end" fill="#5c6b76">c (-3, 1)</text>
    <text x="310" y="354" fill="#5c6b76">a (3, -3)</text>
    <text x="90" y="112" text-anchor="middle" fill="#9aa7b2">d (-4, 4)</text>
  </g>
  <!-- right panel: equal-radius blocks in sweep order -->
  <text x="380" y="100" fill="#5c6b76" font-size="12.5">blocks of equal Chebyshev radius</text>
  <text x="380" y="128" fill="#1a2026" font-size="13.5" font-weight="600">r = 2</text>
  <text x="380" y="148" fill="#1a2026" font-size="12.5">a (2, 2)    b (-1, -2)</text>
  <text x="380" y="166" fill="#4169E1" font-size="12.5">new tags → covered, count <tspan font-weight="700">2</tspan></text>
  <path d="M 388 176 V 194" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <text x="380" y="214" fill="#1a2026" font-size="13.5" font-weight="600">r = 3</text>
  <text x="380" y="234" fill="#1a2026" font-size="12.5">c (-3, 1)    a (3, -3)</text>
  <text x="380" y="252" fill="#5c6b76" font-size="12.5">tag a already seen → <tspan fill="#1a2026" font-weight="700">stop</tspan></text>
  <path d="M 388 262 V 280" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowM)"/>
  <text x="380" y="300" fill="#9aa7b2" font-size="13.5" font-weight="600">r = 4</text>
  <text x="380" y="320" fill="#9aa7b2" font-size="12.5">d (-4, 4)</text>
  <text x="380" y="338" fill="#9aa7b2" font-size="12.5">never reached</text>
  <text x="320" y="368" text-anchor="middle" fill="#1a2026" font-size="13">The radius-2 block admits tags a and b; the side-4 square covers both.</text>
  <text x="320" y="388" text-anchor="middle" fill="#1a2026" font-size="13">The next block repeats tag a, so the sweep stops — the answer is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
