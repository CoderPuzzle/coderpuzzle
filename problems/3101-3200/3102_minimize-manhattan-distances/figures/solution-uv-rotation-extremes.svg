<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 484" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="484" fill="#ffffff"/>
  <!-- points [[3,10],[5,15],[10,2],[4,4]] -> (u,v) = (x+y, x-y); table 1 rows h=34 from y=80, table 2 rows h=34 from y=288; extreme tags mark who owns each range end -->
  <text x="24" y="34" font-size="13.5" font-weight="600" fill="#1a2026">rotate each point: u = x + y, v = x - y</text>
  <!-- table 1 grid -->
  <g stroke="#42525e" stroke-width="1" fill="none">
    <rect x="24" y="54" width="430" height="162"/>
    <line x1="134" y1="54" x2="134" y2="216"/>
    <line x1="294" y1="54" x2="294" y2="216"/>
    <line x1="24" y1="80" x2="454" y2="80"/>
    <line x1="24" y1="114" x2="454" y2="114"/>
    <line x1="24" y1="148" x2="454" y2="148"/>
    <line x1="24" y1="182" x2="454" y2="182"/>
  </g>
  <rect x="25" y="149" width="428" height="31" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="79" y="71">point (x, y)</text>
    <text x="214" y="71">u = x + y</text>
    <text x="374" y="71">v = x - y</text>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="79" y="102">(3, 10)</text><text x="178" y="102">13</text><text x="338" y="102">-7</text>
    <text x="79" y="136">(5, 15)</text><text x="178" y="136">20</text><text x="338" y="136">-10</text>
    <text x="79" y="170">(10, 2)</text><text x="178" y="170">12</text><text x="338" y="170">8</text>
    <text x="79" y="204">(4, 4)</text><text x="178" y="204">8</text><text x="338" y="204">0</text>
  </g>
  <g font-size="11" font-weight="600" fill="#4169E1">
    <text x="200" y="136">u max</text>
    <text x="360" y="136">v min</text>
    <text x="360" y="170">v max</text>
    <text x="200" y="204">u min</text>
  </g>
  <text x="24" y="248" font-size="13.5" font-weight="600" fill="#1a2026">drop one point, keep max of the two ranges:</text>
  <!-- table 2 grid -->
  <g stroke="#42525e" stroke-width="1" fill="none">
    <rect x="24" y="262" width="440" height="162"/>
    <line x1="134" y1="262" x2="134" y2="424"/>
    <line x1="254" y1="262" x2="254" y2="424"/>
    <line x1="374" y1="262" x2="374" y2="424"/>
    <line x1="24" y1="288" x2="464" y2="288"/>
    <line x1="24" y1="322" x2="464" y2="322"/>
    <line x1="24" y1="356" x2="464" y2="356"/>
    <line x1="24" y1="390" x2="464" y2="390"/>
  </g>
  <rect x="25" y="357" width="438" height="31" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="79" y="279">drop</text>
    <text x="194" y="279">u-range</text>
    <text x="314" y="279">v-range</text>
    <text x="419" y="279">max</text>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="79" y="310">(3, 10)</text><text x="194" y="310">12</text><text x="314" y="310">18</text><text x="419" y="310">18</text>
    <text x="79" y="344">(5, 15)</text><text x="194" y="344">5</text><text x="314" y="344">15</text><text x="419" y="344">15</text>
    <text x="79" y="378">(10, 2)</text><text x="194" y="378">12</text><text x="314" y="378">10</text><text x="419" y="378" font-weight="700" fill="#4169E1">12</text>
    <text x="79" y="412">(4, 4)</text><text x="194" y="412">8</text><text x="314" y="412">18</text><text x="419" y="412">18</text>
  </g>
  <text x="437" y="378" font-size="11" font-weight="600" fill="#4169E1">min</text>
  <text x="330" y="452" text-anchor="middle" font-size="13" fill="#1a2026">Dropping (10, 2) — the v-maximum — relaxes the v-range 18 → 10 while the u-range stays 12,</text>
  <text x="330" y="470" text-anchor="middle" font-size="13" fill="#1a2026">so the maximum Manhattan distance left is max(12, 10) <tspan fill="#4169E1" font-weight="600">= 12</tspan>, the smallest over all drops.</text>
</svg>
