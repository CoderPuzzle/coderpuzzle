<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- nums = [0,2,1], perm = [0,2,1]; terms |0-1|=1, |2-2|=0, |1-0|=1; score = 2 (verified by brute force over all permutations) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="150" y="56">0</text>
    <text x="250" y="56">1</text>
    <text x="350" y="56">2</text>
  </g>
  <text x="58" y="86" text-anchor="end" fill="#5c6b76">nums</text>
  <text x="58" y="206" text-anchor="end" fill="#5c6b76">perm</text>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <rect x="120" y="64" width="60" height="34" rx="4"/>
    <rect x="220" y="64" width="60" height="34" rx="4"/>
    <rect x="320" y="64" width="60" height="34" rx="4"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <rect x="120" y="184" width="60" height="34" rx="4"/>
    <rect x="220" y="184" width="60" height="34" rx="4"/>
    <rect x="320" y="184" width="60" height="34" rx="4"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="150" y="86" font-size="15">0</text>
    <text x="250" y="86" font-size="15">2</text>
    <text x="350" y="86" font-size="15">1</text>
    <text x="150" y="206" font-size="15">0</text>
    <text x="250" y="206" font-size="15">2</text>
    <text x="350" y="206" font-size="15">1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 150 218 L 150 231 L 342 231 A 8 8 0 0 1 358 231 L 430 231 L 430 36 L 350 36 L 350 60" marker-end="url(#arrow)"/>
    <path d="M 250 182 L 250 98" marker-end="url(#arrow)"/>
    <path d="M 350 218 L 350 244 L 90 244 L 90 81 L 116 81" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="392" y="28">|0 − 1| = 1</text>
    <text x="262" y="146" text-anchor="start">|2 − 2| = 0</text>
    <text x="220" y="268">|1 − 0| = 1</text>
  </g>
  <text x="235" y="292" text-anchor="middle" fill="#1a2026" font-size="13.5">the optimal pairing swaps positions 1 and 2: score = 1 + 0 + 1 = <tspan fill="#4169E1" font-weight="700">2</tspan>, with perm = [0,2,1]</text>
</svg>
