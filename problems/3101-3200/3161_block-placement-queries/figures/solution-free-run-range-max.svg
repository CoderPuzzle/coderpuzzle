<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="396" fill="#ffffff"/>
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 2 after [1,7],[1,2]: obstacles at 2 and 7; d = [2,1,5,4,3,2,1]; x tick = 60 + 60i, strip rows every 18px from y=136 -->
  <g fill="#9aa7b2" font-size="11.5" text-anchor="middle">
    <text x="60" y="92">0</text><text x="120" y="92">1</text><text x="180" y="92">2</text><text x="240" y="92">3</text>
    <text x="300" y="92">4</text><text x="360" y="92">5</text><text x="420" y="92">6</text><text x="480" y="92">7</text>
  </g>
  <line x1="52" y1="105" x2="500" y2="105" stroke="#9aa7b2" stroke-width="1.2"/>
  <g stroke="#9aa7b2" stroke-width="1">
    <path d="M 60 100 V 110"/><path d="M 120 100 V 110"/><path d="M 180 100 V 110"/><path d="M 240 100 V 110"/>
    <path d="M 300 100 V 110"/><path d="M 360 100 V 110"/><path d="M 420 100 V 110"/><path d="M 480 100 V 110"/>
  </g>
  <rect x="175" y="100" width="10" height="10" fill="#1a2026"/>
  <rect x="475" y="100" width="10" height="10" fill="#1a2026"/>
  <text x="494" y="109" fill="#5c6b76" font-size="11.5">obstacles at 2 and 7</text>
  <g stroke="#9aa7b2" stroke-width="1" stroke-dasharray="4 3">
    <path d="M 180 114 V 252"/><path d="M 480 114 V 252"/>
  </g>
  <!-- free-run strips -->
  <g font-size="11" fill="#5c6b76" text-anchor="end">
    <text x="52" y="140">d[0] = 2</text><text x="52" y="158">d[1] = 1</text><text x="52" y="176" fill="#4169E1" font-weight="700">d[2] = 5</text>
    <text x="52" y="194">d[3] = 4</text><text x="52" y="212">d[4] = 3</text><text x="52" y="230">d[5] = 2</text><text x="52" y="248">d[6] = 1</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.6" fill="none">
    <path d="M 60 136 H 176" marker-end="url(#arrowM)"/>
    <path d="M 120 154 H 176" marker-end="url(#arrowM)"/>
    <path d="M 240 190 H 476" marker-end="url(#arrowM)"/>
    <path d="M 300 208 H 476" marker-end="url(#arrowM)"/>
    <path d="M 360 226 H 476" marker-end="url(#arrowM)"/>
    <path d="M 420 244 H 476" marker-end="url(#arrowM)"/>
  </g>
  <path d="M 180 172 H 476" stroke="#4169E1" stroke-width="2" fill="none" marker-end="url(#arrowA)"/>
  <g fill="#5c6b76">
    <circle cx="60" cy="136" r="2.5"/><circle cx="120" cy="154" r="2.5"/>
    <circle cx="240" cy="190" r="2.5"/><circle cx="300" cy="208" r="2.5"/>
    <circle cx="360" cy="226" r="2.5"/><circle cx="420" cy="244" r="2.5"/>
  </g>
  <circle cx="180" cy="172" r="2.5" fill="#4169E1"/>
  <!-- range-max checks -->
  <path d="M 60 262 V 270 H 180 V 262" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="190" y="274" fill="#4169E1" font-size="12.5">sz = 5: max d[0..2] = 5 ≥ 5 → <tspan font-weight="700">true</tspan></text>
  <path d="M 60 290 V 298 H 120 V 290" fill="none" stroke="#9aa7b2" stroke-width="2"/>
  <text x="130" y="302" fill="#5c6b76" font-size="12.5">sz = 6: max d[0..1] = 2 &lt; 6 → <tspan font-weight="700">false</tspan></text>
  <text x="320" y="348" text-anchor="middle" fill="#1a2026" font-size="13">Free-run d[i] = distance from start i to the next obstacle; after placing 7 then 2,</text>
  <text x="320" y="368" text-anchor="middle" fill="#1a2026" font-size="13">a block fits iff max d over [0, x − sz] ≥ sz: sz = 5 sees <tspan fill="#4169E1" font-weight="600">5</tspan>, sz = 6 sees only <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
