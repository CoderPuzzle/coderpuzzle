<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="324" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,2,4,5], k = 3; per right end r the distinct ORs of subarrays ending at r,
       top = left end l = r, bottom = l = 0; chips 76x40, columns centered at x=120,280,440,600 -->
  <text x="40" y="44" font-size="12.5" fill="#5c6b76">each column: distinct ORs of subarrays ending at r (top l = r, bottom l = 0)</text>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#5c6b76">
    <text x="120" y="72">r = 0</text><text x="280" y="72">r = 1</text>
    <text x="440" y="72">r = 2</text><text x="600" y="72">r = 3</text>
  </g>
  <!-- r = 0: {1} -->
  <rect x="82" y="86" width="76" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="120" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">1</text>
  <text x="120" y="119" text-anchor="middle" font-size="11" fill="#9aa7b2">|1-3| = 2</text>
  <!-- r = 1: {2, 3} -->
  <rect x="242" y="86" width="76" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="280" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">2</text>
  <text x="280" y="119" text-anchor="middle" font-size="11" fill="#9aa7b2">|2-3| = 1</text>
  <path d="M 280 129 L 280 141" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="242" y="144" width="76" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="280" y="161" text-anchor="middle" font-size="15" font-weight="600" fill="#4169E1">3</text>
  <text x="280" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#4169E1">|3-3| = 0</text>
  <!-- r = 2: {4, 6, 7} -->
  <rect x="402" y="86" width="76" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="440" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">4</text>
  <text x="440" y="119" text-anchor="middle" font-size="11" fill="#9aa7b2">|4-3| = 1</text>
  <path d="M 440 129 L 440 141" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="402" y="144" width="76" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="440" y="161" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">6</text>
  <text x="440" y="177" text-anchor="middle" font-size="11" fill="#9aa7b2">|6-3| = 3</text>
  <path d="M 440 187 L 440 199" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="402" y="202" width="76" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="440" y="219" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">7</text>
  <text x="440" y="235" text-anchor="middle" font-size="11" fill="#9aa7b2">|7-3| = 4</text>
  <!-- r = 3: {5, 7}; 5 | 4 = 5 collapses -->
  <rect x="562" y="86" width="76" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="600" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">5</text>
  <text x="600" y="119" text-anchor="middle" font-size="11" fill="#9aa7b2">|5-3| = 2</text>
  <path d="M 600 129 L 600 141" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="562" y="144" width="76" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="600" y="161" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">7</text>
  <text x="600" y="177" text-anchor="middle" font-size="11" fill="#9aa7b2">|7-3| = 4</text>
  <text x="600" y="252" text-anchor="middle" font-size="11" fill="#9aa7b2">5 | 4 = 5 collapses</text>
  <text x="340" y="288" text-anchor="middle" font-size="13" fill="#1a2026">ORs of subarrays ending at each r only gain bits as l moves left, so sets nest.</text>
  <text x="340" y="306" text-anchor="middle" font-size="13" fill="#1a2026">Closest to k = 3 is <tspan fill="#4169E1" font-weight="600">3</tspan> itself (nums[0..1] = 1 | 2), so the minimum |v - k| is <tspan fill="#4169E1" font-weight="600">0</tspan>.</text>
</svg>
