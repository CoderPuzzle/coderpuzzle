<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- sorted players (age, score) = (1,5) (1,5) (2,4) (2,6), original ids p1 p3 p0 p2;
       dp[i] = score[i] + max(dp[j], j<i, score[j] <= score[i]) -> 5, 10, 4, 16; cells x=90+120i, w 104 -->
  <text x="322" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">example 2 sorted by age, ties by score</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="90" y="50" width="104" height="44"/><rect x="210" y="50" width="104" height="44"/>
    <rect x="330" y="50" width="104" height="44"/><rect x="450" y="50" width="104" height="44"/>
  </g>
  <g text-anchor="middle">
    <text x="142" y="72" font-weight="600">5</text><text x="142" y="88" fill="#5c6b76" font-size="10.5">age 1 (p1)</text>
    <text x="262" y="72" font-weight="600">5</text><text x="262" y="88" fill="#5c6b76" font-size="10.5">age 1 (p3)</text>
    <text x="382" y="72" font-weight="600">4</text><text x="382" y="88" fill="#5c6b76" font-size="10.5">age 2 (p0)</text>
    <text x="502" y="72" font-weight="600">6</text><text x="502" y="88" fill="#5c6b76" font-size="10.5">age 2 (p2)</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="142" y="112">i = 0</text><text x="262" y="112">i = 1</text><text x="382" y="112">i = 2</text><text x="502" y="112">i = 3</text>
  </g>
  <!-- arrows from each player back to the predecessors with score[j] <= score[i]; accent = taken -->
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <path d="M 502 130 Q 322 250 142 130" marker-end="url(#arrow)"/>
    <path d="M 502 130 Q 442 168 382 130" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 262 130 Q 202 170 142 130" marker-end="url(#arrowB)"/>
    <path d="M 502 130 Q 382 200 262 130" marker-end="url(#arrowB)"/>
  </g>
  <text x="322" y="226" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">dp[3] = 6 + dp[1] = 16</text>
  <text x="40" y="248" fill="#5c6b76" font-size="12.5">dp</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="142" y="248">5</text><text x="262" y="248">10</text><text x="382" y="248" fill="#9aa7b2">4</text>
    <text x="502" y="248" fill="#4169E1">16</text>
  </g>
  <text x="310" y="290" text-anchor="middle" fill="#1a2026" font-size="13">dp[i] = scores[i] + the best earlier dp[j] with scores[j] &#8804; scores[i]: here 5, 10, 4, 16.</text>
  <text x="310" y="310" text-anchor="middle" fill="#1a2026" font-size="13">The accented chain 5 + 5 + 6 (players 1, 3, 2) is the statement's team 5 + 6 + 5 = <tspan fill="#4169E1" font-weight="600">16</tspan>.</text>
</svg>
