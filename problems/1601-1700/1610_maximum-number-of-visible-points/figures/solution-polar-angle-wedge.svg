<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- points [[2,1],[2,2],[3,3]] seen from location [1,1]; 1 unit = 85 px, observer at (150,300), svg y flipped; wedge radius 200 spans [-22.5 deg, 67.5 deg] -->
  <path d="M 150 300 L 334.8 376.5 A 200 200 0 0 0 226.5 115.2 Z" fill="#dbe4fb"/>
  <g stroke="#42525e" stroke-width="1.5">
    <path d="M 150 300 L 334.8 376.5"/>
    <path d="M 150 300 L 226.5 115.2"/>
  </g>
  <g stroke="#42525e" stroke-width="1.8" fill="none">
    <path d="M 150 300 H 350" marker-end="url(#arrow)"/>
    <path d="M 150 300 L 291.4 158.6" marker-end="url(#arrow)"/>
  </g>
  <path d="M 150 300 L 334.8 223.5" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <circle cx="150" cy="300" r="5" fill="#1a2026"/>
  <text x="142" y="322" text-anchor="middle" fill="#1a2026" font-size="12.5">you (1,1)</text>
  <g fill="#4169E1">
    <circle cx="225" cy="300" r="4.5"/>
    <circle cx="210" cy="240" r="4.5"/>
    <circle cx="270" cy="180" r="4.5"/>
  </g>
  <g fill="#1a2026" font-size="11.5">
    <text x="225" y="287" text-anchor="middle">[2,1]</text>
    <text x="196" y="235" text-anchor="end">[2,2]</text>
    <text x="252" y="190" text-anchor="end">[3,3]</text>
  </g>
  <g fill="#42525e" font-size="12" font-weight="600">
    <text x="360" y="304">0°</text>
    <text x="300" y="149">45°</text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="342" y="391">-22.5°</text>
    <text x="218" y="108" text-anchor="end">67.5°</text>
  </g>
  <text x="344" y="228" fill="#4169E1" font-size="12" font-weight="600">d = 22.5°</text>
  <g font-size="13">
    <text x="450" y="176" fill="#1a2026">sorted angles: 0°, 45°, 45°</text>
    <text x="450" y="202" fill="#1a2026">best window span 45° ≤ 90°</text>
    <text x="450" y="228" fill="#4169E1" font-weight="600">one view sees all 3 points</text>
  </g>
  <text x="340" y="406" text-anchor="middle" fill="#1a2026" font-size="13">Rotating to d = 22.5° gives the field [d − 45°, d + 45°] = [−22.5°, 67.5°] —</text>
  <text x="340" y="426" text-anchor="middle" fill="#1a2026" font-size="13">the rays at 0° and 45° both fall inside, so one view sees all three points.</text>
</svg>
