<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="316" fill="#ffffff"/>
  <!-- instructions = [1,5,6,2]; after inserting 1,5,6 the fenwick cells hold t[1..6] = 1,1,0,1,1,2; cells 72w at x = 80 + 78i, y 94 -->
  <text x="40" y="46" fill="#5c6b76" font-size="12.5">instructions = [1, 5, 6, 2] — tree state after inserting 1, 5, 6 (count = 3)</text>
  <!-- range each cell covers -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="116" y="86">—</text>
    <text x="194" y="86">1</text>
    <text x="272" y="86">1–2</text>
    <text x="350" y="86">3</text>
    <text x="428" y="86">1–4</text>
    <text x="506" y="86">5</text>
    <text x="584" y="86">1–6</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="80" y="94" width="72" height="44"/><rect x="158" y="94" width="72" height="44"/>
    <rect x="236" y="94" width="72" height="44"/><rect x="314" y="94" width="72" height="44"/>
    <rect x="392" y="94" width="72" height="44"/><rect x="470" y="94" width="72" height="44"/>
    <rect x="548" y="94" width="72" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="116" y="122" fill="#9aa7b2">0</text>
    <text x="194" y="122" fill="#4169E1">1</text>
    <text x="272" y="122" fill="#4169E1">1</text>
    <text x="350" y="122" fill="#1a2026">0</text>
    <text x="428" y="122" fill="#1a2026">1</text>
    <text x="506" y="122" fill="#1a2026">1</text>
    <text x="584" y="122" fill="#1a2026">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="116" y="158">0</text>
    <text x="194" y="158">1</text>
    <text x="272" y="158">2</text>
    <text x="350" y="158">3</text>
    <text x="428" y="158">4</text>
    <text x="506" y="158">5</text>
    <text x="584" y="158">6</text>
  </g>
  <text x="116" y="174" text-anchor="middle" fill="#9aa7b2" font-size="11.5">phantom</text>
  <!-- query paths touched by inserting 2 -->
  <rect x="155" y="91" width="78" height="50" fill="none" stroke="#4169E1" stroke-width="2"/>
  <rect x="233" y="91" width="78" height="50" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g fill="#1a2026" font-size="13">
    <text x="60" y="204">inserting 2: query(1) reads cell 1 — 1 element strictly below, less = 1;</text>
    <text x="60" y="224">count 3 − query(2) = 2 strictly above, greater = 2.</text>
  </g>
  <text x="60" y="252" fill="#4169E1" font-size="13" font-weight="600">cost = min(1, 2) = 1; update(2) then bumps cells 2 and 4.</text>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">The Fenwick tree over values 1–6 holds the inserted 1, 5, 6; inserting 2</text>
  <text x="320" y="302" text-anchor="middle" fill="#1a2026" font-size="13">costs <tspan fill="#4169E1" font-weight="600">min(1, 2) = 1</tspan> — the only nonzero cost, so the total is 1.</text>
</svg>
