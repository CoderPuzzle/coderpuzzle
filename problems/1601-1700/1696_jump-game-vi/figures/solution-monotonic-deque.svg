<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="350" fill="#ffffff"/>
  <!-- nums = [1,-1,-2,4,-7,3], k = 2; cells w 62, x = 96 + i*92 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="96" y="40" width="62" height="34"/><rect x="188" y="40" width="62" height="34"/>
    <rect x="280" y="40" width="62" height="34"/><rect x="372" y="40" width="62" height="34"/>
    <rect x="464" y="40" width="62" height="34"/><rect x="556" y="40" width="62" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="127" y="62">1</text><text x="219" y="62">-1</text><text x="311" y="62">-2</text>
    <text x="403" y="62">4</text><text x="495" y="62">-7</text><text x="587" y="62">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="127" y="92">0</text><text x="219" y="92">1</text><text x="311" y="92">2</text>
    <text x="403" y="92">3</text><text x="495" y="92">4</text><text x="587" y="92">5</text>
  </g>
  <!-- dp row -->
  <text x="40" y="130" fill="#5c6b76" font-size="12.5">dp:</text>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="15">
    <text x="127" y="130">1</text><text x="219" y="130">0</text><text x="311" y="130">-1</text>
    <text x="403" y="130">4</text><text x="495" y="130">-3</text><text x="587" y="130" fill="#4169E1">7</text>
  </g>
  <!-- deque states, one row per i -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="40" y="178">after i = 1:</text>
    <text x="40" y="216">after i = 2:</text>
    <text x="40" y="254">after i = 3:</text>
    <text x="40" y="292">after i = 4:</text>
    <text x="40" y="330">after i = 5:</text>
  </g>
  <!-- deque boxes: index(dp) pairs, front highlighted -->
  <g font-size="12" text-anchor="middle" font-weight="600">
    <rect x="150" y="164" width="52" height="22" fill="#4169E1"/><text x="176" y="179" fill="#ffffff">0 (1)</text>
    <rect x="202" y="164" width="52" height="22" fill="#dbe4f6" stroke="#42525e"/><text x="228" y="179">1 (0)</text>

    <rect x="150" y="202" width="52" height="22" fill="#4169E1"/><text x="176" y="217" fill="#ffffff">0 (1)</text>
    <rect x="202" y="202" width="52" height="22" fill="#dbe4f6" stroke="#42525e"/><text x="228" y="217">1 (0)</text>
    <rect x="254" y="202" width="52" height="22" fill="#dbe4f6" stroke="#42525e"/><text x="280" y="217">2 (-1)</text>

    <rect x="150" y="240" width="52" height="22" fill="#4169E1"/><text x="176" y="255" fill="#ffffff">3 (4)</text>

    <rect x="150" y="278" width="52" height="22" fill="#4169E1"/><text x="176" y="293" fill="#ffffff">3 (4)</text>
    <rect x="202" y="278" width="52" height="22" fill="#dbe4f6" stroke="#42525e"/><text x="228" y="293">4 (-3)</text>

    <rect x="150" y="316" width="52" height="22" fill="#4169E1"/><text x="176" y="331" fill="#ffffff">5 (7)</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="320" y="179">dp[1] = -1 + dp[0]</text>
    <text x="320" y="217">dp[2] = -2 + dp[0]</text>
    <text x="320" y="248">i = 3 expires index 0 (0 &lt; 3 − 2) from the front, and dp ≤ 4</text>
    <text x="320" y="264">pops 1 and 2 from the back → dp[3] = 4 + dp[1]</text>
    <text x="320" y="293">dp[4] = -7 + dp[3]</text>
    <text x="320" y="331">dp[5] = 3 + dp[3] = 7 — front is always the window max</text>
  </g>
</svg>
