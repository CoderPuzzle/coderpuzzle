<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="520" height="400" fill="#ffffff"/>
  <!-- ===== bottom cuboid (index 1): base 53 x 37, height 95 ===== -->
  <g stroke="#42525e" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="120,216 183.6,216 205.8,193.8 142.2,193.8" fill="#f4f6f8"/>
    <polygon points="183.6,216 205.8,193.8 205.8,307.8 183.6,330" fill="#cdd6dd"/>
    <rect x="120" y="216" width="63.6" height="114" fill="#e3e8ec"/>
  </g>
  <!-- ===== middle cuboid (index 0): base 45 x 20, height 50 ===== -->
  <g stroke="#42525e" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="132,146 186,146 198,134 144,134" fill="#f4f6f8"/>
    <polygon points="186,146 198,134 198,194 186,206" fill="#cdd6dd"/>
    <rect x="132" y="146" width="54" height="60" fill="#e3e8ec"/>
  </g>
  <!-- ===== top cuboid (index 2): base 23 x 12, height 45 ===== -->
  <g stroke="#42525e" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="145.2,86 172.8,86 180,78.8 152.4,78.8" fill="#f4f6f8"/>
    <polygon points="172.8,86 180,78.8 180,132.8 172.8,140" fill="#cdd6dd"/>
    <rect x="145.2" y="86" width="27.6" height="54" fill="#e3e8ec"/>
  </g>
  <!-- dimension labels: height on the front face, base sides on the top face -->
  <g fill="#c0392b" font-size="13" font-weight="600" text-anchor="middle">
    <text x="151.8" y="278">95</text>
    <text x="151.8" y="211">53</text>
    <text x="206" y="204">37</text>
    <text x="159" y="182">50</text>
    <text x="159" y="141">45</text>
    <text x="205" y="139">20</text>
    <text x="159" y="118">45</text>
    <text x="159" y="81">23</text>
    <text x="187" y="79">12</text>
  </g>
  <!-- height ruler on the left -->
  <g stroke="#9aa7b0" stroke-width="1.2">
    <line x1="88" y1="86" x2="88" y2="140"/>
    <line x1="88" y1="146" x2="88" y2="206"/>
    <line x1="88" y1="216" x2="88" y2="330"/>
    <line x1="82" y1="86" x2="94" y2="86"/><line x1="82" y1="140" x2="94" y2="140"/>
    <line x1="82" y1="146" x2="94" y2="146"/><line x1="82" y1="206" x2="94" y2="206"/>
    <line x1="82" y1="216" x2="94" y2="216"/><line x1="82" y1="330" x2="94" y2="330"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="end">
    <text x="76" y="117">45</text>
    <text x="76" y="180">50</text>
    <text x="76" y="277">95</text>
  </g>
  <text x="300" y="120" fill="#1a2026" font-weight="600" font-size="15">190</text>
  <text x="300" y="146" fill="#5c6b76" font-size="12">rotate every cuboid so its</text>
  <text x="300" y="164" fill="#5c6b76" font-size="12">largest dimension is the height:</text>
  <text x="300" y="182" fill="#5c6b76" font-size="12">95 + 50 + 45 = 190</text>
  <text x="300" y="212" fill="#5c6b76" font-size="12">bottom: cuboid 1 on its 53×37 side</text>
  <text x="300" y="230" fill="#5c6b76" font-size="12">middle: cuboid 0 on its 45×20 side</text>
  <text x="300" y="248" fill="#5c6b76" font-size="12">top: cuboid 2 on its 23×12 side</text>
  <text x="260" y="380" text-anchor="middle" fill="#1a2026" font-weight="600">each base nests inside the one below it</text>
</svg>
