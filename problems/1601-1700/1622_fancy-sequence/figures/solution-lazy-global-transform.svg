<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- trace = append 2, addAll 3, append 7, multAll 2; pair snapshots (1,0),(1,3),(1,3),(2,6);
       stored = (val-add)*mult^-1, displayed = stored*mult+add -> 10, 14 -->
  <text x="42" y="26" fill="#5c6b76" font-size="12">global (mult, add), snapshotted after each operation</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="42" y="40" width="118" height="36"/><rect x="188" y="40" width="118" height="36"/>
    <rect x="334" y="40" width="118" height="36"/><rect x="480" y="40" width="118" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="101" y="62">append 2</text><text x="247" y="62">addAll 3</text>
    <text x="393" y="62">append 7</text><text x="539" y="62">multAll 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 164 58 H 184" marker-end="url(#arrow)"/>
    <path d="M 310 58 H 330" marker-end="url(#arrow)"/>
    <path d="M 456 58 H 476" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="101" y="96">(1, 0)</text><text x="247" y="96">(1, 3)</text>
    <text x="393" y="96">(1, 3)</text><text x="539" y="96">(2, 6)</text>
  </g>
  <text x="42" y="134" fill="#5c6b76" font-size="12">state after multAll(2) — displayed = stored · mult + add</text>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="100" y="175">index 0</text><text x="100" y="265">index 1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="110" y="150" width="120" height="40" fill="#f0f3f7"/><rect x="290" y="150" width="120" height="40" fill="#dbe4fb"/>
    <rect x="470" y="150" width="120" height="40" fill="#ffffff"/>
    <rect x="110" y="240" width="120" height="40" fill="#f0f3f7"/><rect x="290" y="240" width="120" height="40" fill="#dbe4fb"/>
    <rect x="470" y="240" width="120" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle">
    <text x="170" y="166" fill="#5c6b76" font-size="10.5">appended</text><text x="170" y="183" font-weight="600">2</text>
    <text x="350" y="166" fill="#5c6b76" font-size="10.5">stored</text><text x="350" y="183" font-weight="600">2</text>
    <text x="530" y="166" fill="#5c6b76" font-size="10.5">displayed</text><text x="530" y="183" font-weight="600" fill="#4169E1">10</text>
    <text x="170" y="256" fill="#5c6b76" font-size="10.5">appended</text><text x="170" y="273" font-weight="600">7</text>
    <text x="350" y="256" fill="#5c6b76" font-size="10.5">stored</text><text x="350" y="273" font-weight="600" fill="#4169E1">4</text>
    <text x="530" y="256" fill="#5c6b76" font-size="10.5">displayed</text><text x="530" y="273" font-weight="600" fill="#4169E1">14</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="none">
    <path d="M 234 170 H 286" marker-end="url(#arrowB)"/>
    <path d="M 414 170 H 466" marker-end="url(#arrowB)"/>
    <path d="M 234 260 H 286" marker-end="url(#arrowB)"/>
    <path d="M 414 260 H 466" marker-end="url(#arrowB)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="260" y="208">(2−0)·1⁻¹</text><text x="440" y="208">·2 + 6</text>
    <text x="260" y="298">(7−3)·1⁻¹</text><text x="440" y="298">·2 + 6</text>
  </g>
  <text x="320" y="322" text-anchor="middle" fill="#1a2026" font-size="13">append(7) is stored backward as <tspan fill="#4169E1" font-weight="600">4</tspan> = (7−3)·1⁻¹, so multAll(2) folds in later: 4·2 + 6 = <tspan fill="#4169E1" font-weight="600">14</tspan>.</text>
  <text x="320" y="342" text-anchor="middle" fill="#1a2026" font-size="13">Index 0 reads 2·2 + 6 = 10 — both match the trace's getIndex answers.</text>
</svg>
