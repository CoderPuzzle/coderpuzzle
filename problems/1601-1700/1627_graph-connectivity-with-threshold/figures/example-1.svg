<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="520" height="300" fill="#ffffff"/>
  <!-- the only road: 3 - 6 -->
  <line x1="400" y1="97" x2="400" y2="193" stroke="#42525e" stroke-width="1.8"/>
  <g stroke="#42525e" stroke-width="1.7" fill="#ffffff">
    <circle cx="120" cy="80" r="20"/>
    <circle cx="260" cy="80" r="20"/>
    <circle cx="400" cy="80" r="20"/>
    <circle cx="120" cy="210" r="20"/>
    <circle cx="260" cy="210" r="20"/>
    <circle cx="400" cy="210" r="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="120" y="85">1</text><text x="260" y="85">2</text><text x="400" y="85">3</text>
    <text x="120" y="215">4</text><text x="260" y="215">5</text><text x="400" y="215">6</text>
  </g>
  <text x="260" y="272" text-anchor="middle" fill="#1a2026" font-weight="600">only 3 and 6 share a divisor above 2</text>
  <text x="260" y="292" text-anchor="middle" fill="#5c6b76" font-size="12">queries [1,4], [2,5]: false · [3,6]: true</text>
</svg>
