<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="520" height="300" fill="#ffffff"/>
  <!-- the only road: 2 - 4 -->
  <line x1="380" y1="87" x2="380" y2="173" stroke="#42525e" stroke-width="1.8"/>
  <g stroke="#42525e" stroke-width="1.7" fill="#ffffff">
    <circle cx="110" cy="70" r="20"/>
    <circle cx="380" cy="70" r="20"/>
    <circle cx="110" cy="210" r="20"/>
    <circle cx="380" cy="190" r="20"/>
    <circle cx="245" cy="255" r="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="110" y="75">1</text><text x="380" y="75">2</text><text x="110" y="215">3</text>
    <text x="380" y="195">4</text><text x="245" y="260">5</text>
  </g>
  <text x="260" y="272" text-anchor="middle" fill="#1a2026" font-weight="600">only 2 and 4 share a divisor above 1 — no query pair is connected</text>
</svg>
