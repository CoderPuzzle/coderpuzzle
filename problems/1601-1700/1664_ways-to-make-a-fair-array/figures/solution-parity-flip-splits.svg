<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <!-- nums = [2,1,6,4]; one row per candidate removal i;
       cells 34x30 at x = 170 + 38j, rows y = 64 + 52i;
       left (e · o) = sums over nums[0..i), right (e · o) = sums over nums(i..n) in original parity -->
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="30" y="46">i</text>
    <text x="112" y="46">left (e · o)</text>
    <text x="244" y="46">nums</text>
    <text x="376" y="46">right (e · o)</text>
    <text x="480" y="46">even vs odd</text>
    <text x="580" y="46">fair?</text>
  </g>
  <!-- i = 0: even 0 + 5 = 5, odd 0 + 6 = 6 -->
  <text x="30" y="84" text-anchor="middle" font-size="12" fill="#5c6b76">i = 0</text>
  <text x="112" y="84" text-anchor="middle" font-size="12.5" fill="#1a2026">0 · 0</text>
  <rect x="170" y="64" width="34" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
  <text x="187" y="84" text-anchor="middle" font-size="13.5" fill="#9aa7b2">2</text>
  <line x1="177" y1="79" x2="197" y2="79" stroke="#9aa7b2" stroke-width="1.4"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="208" y="64" width="34" height="30"/><rect x="246" y="64" width="34" height="30"/><rect x="284" y="64" width="34" height="30"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="225" y="84">1</text><text x="263" y="84">6</text><text x="301" y="84">4</text>
  </g>
  <text x="376" y="84" text-anchor="middle" font-size="12.5" fill="#1a2026">6 · 5</text>
  <text x="480" y="84" text-anchor="middle" font-size="13.5" fill="#1a2026">5 ≠ 6</text>
  <text x="580" y="84" text-anchor="middle" font-size="12.5" fill="#9aa7b2">no</text>
  <!-- i = 1: even 2 + 4 = 6, odd 0 + 6 = 6 — fair -->
  <text x="30" y="136" text-anchor="middle" font-size="12" fill="#5c6b76">i = 1</text>
  <text x="112" y="136" text-anchor="middle" font-size="12.5" fill="#1a2026">2 · 0</text>
  <rect x="170" y="116" width="34" height="30" fill="#dbe4fb" stroke="#42525e" stroke-width="1.3"/>
  <text x="187" y="136" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">2</text>
  <rect x="208" y="116" width="34" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
  <text x="225" y="136" text-anchor="middle" font-size="13.5" fill="#9aa7b2">1</text>
  <line x1="215" y1="131" x2="235" y2="131" stroke="#9aa7b2" stroke-width="1.4"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="246" y="116" width="34" height="30"/><rect x="284" y="116" width="34" height="30"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="263" y="136">6</text><text x="301" y="136">4</text>
  </g>
  <text x="376" y="136" text-anchor="middle" font-size="12.5" fill="#1a2026">6 · 4</text>
  <text x="480" y="136" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4169E1">6 = 6</text>
  <text x="580" y="136" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">yes</text>
  <!-- i = 2: even 2 + 4 = 6, odd 1 + 0 = 1 -->
  <text x="30" y="188" text-anchor="middle" font-size="12" fill="#5c6b76">i = 2</text>
  <text x="112" y="188" text-anchor="middle" font-size="12.5" fill="#1a2026">2 · 1</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.3">
    <rect x="170" y="168" width="34" height="30"/><rect x="208" y="168" width="34" height="30"/>
  </g>
  <rect x="246" y="168" width="34" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
  <text x="263" y="188" text-anchor="middle" font-size="13.5" fill="#9aa7b2">6</text>
  <line x1="253" y1="183" x2="273" y2="183" stroke="#9aa7b2" stroke-width="1.4"/>
  <rect x="284" y="168" width="34" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="187" y="188">2</text><text x="225" y="188">1</text><text x="301" y="188">4</text>
  </g>
  <text x="376" y="188" text-anchor="middle" font-size="12.5" fill="#1a2026">0 · 4</text>
  <text x="480" y="188" text-anchor="middle" font-size="13.5" fill="#1a2026">6 ≠ 1</text>
  <text x="580" y="188" text-anchor="middle" font-size="12.5" fill="#9aa7b2">no</text>
  <!-- i = 3: even 8 + 0 = 8, odd 1 + 0 = 1 -->
  <text x="30" y="240" text-anchor="middle" font-size="12" fill="#5c6b76">i = 3</text>
  <text x="112" y="240" text-anchor="middle" font-size="12.5" fill="#1a2026">8 · 1</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.3">
    <rect x="170" y="220" width="34" height="30"/><rect x="208" y="220" width="34" height="30"/><rect x="246" y="220" width="34" height="30"/>
  </g>
  <rect x="284" y="220" width="34" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
  <text x="301" y="240" text-anchor="middle" font-size="13.5" fill="#9aa7b2">4</text>
  <line x1="291" y1="235" x2="311" y2="235" stroke="#9aa7b2" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="187" y="240">2</text><text x="225" y="240">1</text><text x="263" y="240">6</text>
  </g>
  <text x="376" y="240" text-anchor="middle" font-size="12.5" fill="#1a2026">0 · 0</text>
  <text x="480" y="240" text-anchor="middle" font-size="13.5" fill="#1a2026">8 ≠ 1</text>
  <text x="580" y="240" text-anchor="middle" font-size="12.5" fill="#9aa7b2">no</text>
  <text x="320" y="268" text-anchor="middle" font-size="11" fill="#5c6b76">shaded left = already absorbed into the prefix · crossed = the removal candidate</text>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Suffix sums flip parity: new even = left_e + right_o, new odd = left_o + right_e.</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">Only removing <tspan fill="#4169E1" font-weight="600">i = 1</tspan> balances: even 2 + 4 = 6 equals odd 0 + 6 = 6.</text>
</svg>
