<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- k = 3, arrival = [1,2,3,4,5], load = [5,2,3,3,3]; time t maps to x = 90 + 60t; server rows y = 78, 148, 218, bar height 30 -->
  <g stroke="#dbe4fb" stroke-width="1">
    <path d="M 150 64 V 252"/><path d="M 210 64 V 252"/><path d="M 270 64 V 252"/><path d="M 330 64 V 252"/>
    <path d="M 390 64 V 252"/><path d="M 450 64 V 252"/><path d="M 510 64 V 252"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="150" y="272">1</text><text x="210" y="272">2</text><text x="270" y="272">3</text>
    <text x="330" y="272">4</text><text x="390" y="272">5</text><text x="450" y="272">6</text><text x="510" y="272">7</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="76" y="97">server 0</text><text x="76" y="167">server 1</text><text x="76" y="237">server 2</text>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.5">
    <rect x="150" y="78" width="300" height="30"/>
    <rect x="210" y="148" width="120" height="30"/>
    <rect x="330" y="148" width="180" height="30"/>
    <rect x="270" y="218" width="180" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="300" y="98">req 0</text><text x="270" y="168">req 1</text>
    <text x="420" y="168">req 3</text><text x="360" y="238">req 2</text>
  </g>
  <!-- request 3 arrives at t = 4: tries server 0 (busy until 6), wraps to server 1, free again at 4 -->
  <path d="M 328 110 Q 304 128 326 145" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="end" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="296" y="124">req 3 at t = 4: server 0 busy until 6,</text>
    <text x="296" y="139">wraps to server 1, free again at 4</text>
  </g>
  <!-- request 4 arrives at t = 5 over a fully busy column and is dropped -->
  <path d="M 390 58 V 252" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="382" y="52" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">req 4 at t = 5: all busy, dropped</text>
  <text x="574" y="64" text-anchor="middle" fill="#5c6b76" font-size="12">handled</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="574" y="102">1</text>
    <text x="574" y="172" fill="#4169E1" font-size="16">2</text>
    <text x="574" y="242">1</text>
  </g>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">Request 3 wraps from busy server 0 to server 1 (free at 4); request 4 at</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">time 5 is dropped — server 1 handled <tspan fill="#4169E1" font-weight="600">2</tspan> requests, the most: answer [1].</text>
</svg>
