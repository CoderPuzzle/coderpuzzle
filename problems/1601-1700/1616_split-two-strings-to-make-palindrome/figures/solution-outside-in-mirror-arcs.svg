<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- a = "ulacfd", b = "jizalu"; cells 52x44, pitch 56, from x=154, row a y=96, row b y=216; matched pairs a[i]-b[5-i] for i = 0,1,2; split at index 3 sits at x = 320 -->
  <text x="320" y="76" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">split at index 3</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.5">
    <rect x="154" y="96" width="52" height="44"/><rect x="210" y="96" width="52" height="44"/><rect x="266" y="96" width="52" height="44"/>
  </g>
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.5">
    <rect x="322" y="96" width="52" height="44"/><rect x="378" y="96" width="52" height="44"/><rect x="434" y="96" width="52" height="44"/>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.5">
    <rect x="322" y="216" width="52" height="44"/><rect x="378" y="216" width="52" height="44"/><rect x="434" y="216" width="52" height="44"/>
  </g>
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.5">
    <rect x="154" y="216" width="52" height="44"/><rect x="210" y="216" width="52" height="44"/><rect x="266" y="216" width="52" height="44"/>
  </g>
  <path d="M 320 84 V 272" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="6 4"/>
  <g text-anchor="end" fill="#5c6b76" font-size="13" font-weight="600">
    <text x="140" y="124">a</text>
    <text x="140" y="244">b</text>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="180" y="124" fill="#1a2026">u</text><text x="236" y="124" fill="#1a2026">l</text><text x="292" y="124" fill="#1a2026">a</text>
    <text x="348" y="124" fill="#9aa7b2">c</text><text x="404" y="124" fill="#9aa7b2">f</text><text x="460" y="124" fill="#9aa7b2">d</text>
    <text x="180" y="244" fill="#9aa7b2">j</text><text x="236" y="244" fill="#9aa7b2">i</text><text x="292" y="244" fill="#9aa7b2">z</text>
    <text x="348" y="244" fill="#1a2026">a</text><text x="404" y="244" fill="#1a2026">l</text><text x="460" y="244" fill="#1a2026">u</text>
  </g>
  <!-- outside-in matched pairs: a[0]-b[5], a[1]-b[4], a[2]-b[3] -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 180 140 Q 320 176 460 214" marker-end="url(#arrow)"/>
    <path d="M 236 140 Q 320 162 404 214" marker-end="url(#arrow)"/>
    <path d="M 292 140 Q 320 148 348 214" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="180" y="284">0</text><text x="236" y="284">1</text><text x="292" y="284">2</text>
    <text x="348" y="284">3</text><text x="404" y="284">4</text><text x="460" y="284">5</text>
  </g>
  <text x="320" y="316" text-anchor="middle" font-size="15"><tspan fill="#1a2026" font-weight="600">ula</tspan><tspan fill="#5c6b76"> + </tspan><tspan fill="#1a2026" font-weight="600">alu</tspan><tspan fill="#5c6b76"> = </tspan><tspan fill="#4169E1" font-weight="700">ulaalu</tspan><tspan fill="#1a2026">, a palindrome</tspan></text>
  <text x="320" y="352" text-anchor="middle" fill="#1a2026" font-size="13">Outside-in matches u-u, l-l, a-a mirror every position (the pointers</text>
  <text x="320" y="372" text-anchor="middle" fill="#1a2026" font-size="13">cross), so the split at index 3 yields ulaalu — answer true.</text>
</svg>
