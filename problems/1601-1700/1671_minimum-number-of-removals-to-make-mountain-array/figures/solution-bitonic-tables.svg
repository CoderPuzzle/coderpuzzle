<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <!-- nums = [2,1,1,5,6,2,3,1]: lis = [1,1,1,2,3,2,3,1], lds = [2,1,1,3,3,2,2,1].
       cells 56x40 at x=53+74i (centers 81,155,229,303,377,451,525,599), y=94;
       peak = index 4 (value 6, 3+3-1=5); removed indices 0,1,5 crossed out -->
  <text x="340" y="26" text-anchor="middle" fill="#1a2026" font-weight="600">nums = [2,1,1,5,6,2,3,1]</text>
  <text x="340" y="44" text-anchor="middle" fill="#5c6b76" font-size="11.5">lis[i]: longest strictly increasing run ending at i; lds[i]: longest strictly decreasing starting at i</text>
  <text x="47" y="80" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">lis[i]</text>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#4169E1">
    <text x="81" y="80">1</text><text x="155" y="80">1</text><text x="229" y="80">1</text>
    <text x="303" y="80">2</text><text x="377" y="80">3</text><text x="451" y="80">2</text>
    <text x="525" y="80">3</text><text x="599" y="80">1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="201" y="94" width="56" height="40"/>
    <rect x="275" y="94" width="56" height="40"/>
    <rect x="497" y="94" width="56" height="40"/>
    <rect x="571" y="94" width="56" height="40"/>
  </g>
  <rect x="349" y="94" width="56" height="40" fill="#4169E1" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3" fill="#f0f3f7">
    <rect x="53" y="94" width="56" height="40"/>
    <rect x="127" y="94" width="56" height="40"/>
    <rect x="423" y="94" width="56" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="81" y="119" fill="#9aa7b2">2</text><text x="155" y="119" fill="#9aa7b2">1</text>
    <text x="229" y="119">1</text><text x="303" y="119">5</text>
    <text x="377" y="119" fill="#ffffff">6</text><text x="451" y="119" fill="#9aa7b2">2</text>
    <text x="525" y="119">3</text><text x="599" y="119">1</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2">
    <line x1="62" y1="98" x2="100" y2="130"/><line x1="100" y1="98" x2="62" y2="130"/>
    <line x1="136" y1="98" x2="174" y2="130"/><line x1="174" y1="98" x2="136" y2="130"/>
    <line x1="432" y1="98" x2="470" y2="130"/><line x1="470" y1="98" x2="432" y2="130"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="81" y="156">0</text><text x="155" y="156">1</text><text x="229" y="156">2</text>
    <text x="303" y="156">3</text><text x="377" y="156">4</text><text x="451" y="156">5</text>
    <text x="525" y="156">6</text><text x="599" y="156">7</text>
  </g>
  <text x="47" y="178" text-anchor="end" fill="#5c6b76" font-size="12" font-weight="600">lds[i]</text>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#5c6b76">
    <text x="81" y="178">2</text><text x="155" y="178">1</text><text x="229" y="178">1</text>
    <text x="303" y="178">3</text><text x="377" y="178" fill="#4169E1">3</text>
    <text x="451" y="178">2</text><text x="525" y="178">2</text><text x="599" y="178">1</text>
  </g>
  <text x="340" y="202" text-anchor="middle" fill="#1a2026" font-size="13">at the peak 6 (i = 4): lis 3 + lds 3 - 1 = <tspan fill="#4169E1" font-weight="600">5</tspan> kept</text>
  <text x="340" y="252" text-anchor="middle" fill="#1a2026" font-size="13">Best valid peak is 6: 3 + 3 - 1 = 5 kept, so 8 - 5 = <tspan fill="#4169E1" font-weight="600">3</tspan> removals; the next</text>
  <text x="340" y="270" text-anchor="middle" fill="#1a2026" font-size="13">best, peak 5 or peak 3, reaches only 4. Remove indices 0, 1, 5 -&gt; [1,5,6,3,1].</text>
</svg>
