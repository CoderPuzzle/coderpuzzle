<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="320" fill="#ffffff"/>
  <!-- stones=[5,3,1,4,2]; dp[l][r] = mover's best margin; cells 56x36 at x=96+56r, y=76+36l; lower triangle r&lt;l inactive; dp[0][4]=max(10-7,13-7)=6 -->
  <text x="20" y="24" fill="#5c6b76" font-size="12.5">stones = [5,3,1,4,2] — dp[l][r] = mover's best margin on stones[l..r]</text>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="15">
    <text x="124" y="50">5</text><text x="180" y="50">3</text><text x="236" y="50">1</text><text x="292" y="50">4</text><text x="348" y="50">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="124" y="68">r=0</text><text x="180" y="68">r=1</text><text x="236" y="68">r=2</text><text x="292" y="68">r=3</text><text x="348" y="68">r=4</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="14">
    <text x="74" y="99">5</text><text x="74" y="135">3</text><text x="74" y="171">1</text><text x="74" y="207">4</text><text x="74" y="243">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="44" y="99">l=0</text><text x="44" y="135">l=1</text><text x="44" y="171">l=2</text><text x="44" y="207">l=3</text><text x="44" y="243">l=4</text>
  </g>
  <!-- inactive lower triangle (r &lt; l) -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1">
    <rect x="96" y="112" width="56" height="36"/>
    <rect x="96" y="148" width="56" height="36"/><rect x="152" y="148" width="56" height="36"/>
    <rect x="96" y="184" width="56" height="36"/><rect x="152" y="184" width="56" height="36"/><rect x="208" y="184" width="56" height="36"/>
    <rect x="96" y="220" width="56" height="36"/><rect x="152" y="220" width="56" height="36"/><rect x="208" y="220" width="56" height="36"/><rect x="264" y="220" width="56" height="36"/>
  </g>
  <!-- dp cells, spans shortest first; dp[i][i]=0 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="96" y="76" width="56" height="36"/><rect x="152" y="76" width="56" height="36"/><rect x="208" y="76" width="56" height="36"/><rect x="264" y="76" width="56" height="36"/>
    <rect x="152" y="112" width="56" height="36"/><rect x="208" y="112" width="56" height="36"/><rect x="264" y="112" width="56" height="36"/><rect x="320" y="112" width="56" height="36"/>
    <rect x="208" y="148" width="56" height="36"/><rect x="264" y="148" width="56" height="36"/><rect x="320" y="148" width="56" height="36"/>
    <rect x="264" y="184" width="56" height="36"/><rect x="320" y="184" width="56" height="36"/>
    <rect x="320" y="220" width="56" height="36"/>
  </g>
  <rect x="320" y="76" width="56" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="124" y="99">0</text><text x="180" y="99">5</text><text x="236" y="99">3</text><text x="292" y="99">7</text>
    <text x="180" y="135">0</text><text x="236" y="135">3</text><text x="292" y="135">1</text><text x="348" y="135">7</text>
    <text x="236" y="171">0</text><text x="292" y="171">4</text><text x="348" y="171">2</text>
    <text x="292" y="207">0</text><text x="348" y="207">4</text>
    <text x="348" y="243">0</text>
  </g>
  <text x="348" y="100" text-anchor="middle" font-weight="700" font-size="15" fill="#4169E1">6</text>
  <g fill="#1a2026" font-size="13">
    <text x="404" y="100">dp[0][4] = max(</text>
    <text x="404" y="124">10 − 7 = 3&#160;&#160;(take left 5),</text>
    <text x="404" y="148">13 − 7 = 6&#160;&#160;(take right 2)</text>
    <text x="404" y="172">) = <tspan fill="#4169E1" font-weight="700">6</tspan></text>
  </g>
  <text x="20" y="288" fill="#1a2026" font-size="13">Spans fill shortest first; at the top cell Alice takes the right stone 2,</text>
  <text x="20" y="306" fill="#1a2026" font-size="13">banking the 13 from the example's walkthrough — dp[0][4] = <tspan fill="#4169E1" font-weight="600">6</tspan> is the answer.</text>
</svg>
