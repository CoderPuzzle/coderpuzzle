<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="150" fill="#ffffff"/>
  <!-- chain 0 - 1 - 2 - 3 - 4 -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="78" y1="60" x2="152" y2="60"/>
    <line x1="188" y1="60" x2="262" y2="60"/>
    <line x1="298" y1="60" x2="372" y2="60"/>
  </g>
  <line x1="408" y1="60" x2="482" y2="60" stroke="#4169E1" stroke-width="2.4" stroke-dasharray="6 4"/>
  <!-- edge labels -->
  <g font-size="13" font-weight="600" fill="#1a2026" text-anchor="middle">
    <text x="115" y="52">10</text>
    <text x="225" y="52">5</text>
    <text x="335" y="52">9</text>
    <text x="445" y="52" fill="#4169E1">13</text>
  </g>
  <!-- nodes -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="60" cy="60" r="18"/>
    <circle cx="170" cy="60" r="18"/>
    <circle cx="280" cy="60" r="18"/>
    <circle cx="390" cy="60" r="18"/>
    <circle cx="500" cy="60" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="60" y="65">0</text>
    <text x="170" y="65">1</text>
    <text x="280" y="65">2</text>
    <text x="390" y="65">3</text>
    <text x="500" y="65">4</text>
  </g>
  <text x="292" y="120" text-anchor="middle" fill="#5c6b76" font-size="12.5">query [0, 4, 14]: every edge on 0 → 1 → 2 → 3 → 4 (max 13) &lt; 14 → true</text>
  <text x="292" y="138" text-anchor="middle" fill="#5c6b76" font-size="12.5">query [1, 4, 13]: the edge 3 → 4 has distance 13, not &lt; 13 → false</text>
</svg>
