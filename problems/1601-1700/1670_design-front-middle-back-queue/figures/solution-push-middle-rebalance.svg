<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- example 1 trace; pushMiddle(4) on queue [1,3,2]: front=[1,3] (ceil(3/2)), back=[2].
       Rebalance moves 3 to the front of back, then 4 is appended to front -> [1,4,3,2].
       cells 44x36: front at x=200/248, back at x=360/408; rows y=60 (before), y=180 (after) -->
  <text x="340" y="24" text-anchor="middle" fill="#1a2026" font-weight="600">trace so far: pushFront(1), pushBack(2), pushMiddle(3) - now pushMiddle(4) on [1, 3, 2]</text>
  <line x1="326" y1="44" x2="326" y2="232" stroke="#9aa7b2" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="326" y="40" text-anchor="middle" font-size="10.5" fill="#9aa7b2">seam</text>

  <text x="40" y="78" fill="#1a2026" font-size="13" font-weight="600">before</text>
  <text x="40" y="96" fill="#5c6b76" font-size="11">pushMiddle(4)</text>
  <text x="190" y="83" text-anchor="end" fill="#5c6b76" font-size="12.5">front</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="200" y="60" width="44" height="36" rx="4"/>
    <rect x="248" y="60" width="44" height="36" rx="4"/>
    <rect x="360" y="60" width="44" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="222" y="83">1</text><text x="270" y="83">3</text><text x="382" y="83">2</text>
  </g>
  <text x="414" y="83" fill="#5c6b76" font-size="12.5">back</text>

  <path d="M 270 98 C 270 140 382 140 382 176" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="258" y="142" text-anchor="end" fill="#4169E1" font-size="11" font-weight="600">3 crosses</text>
  <text x="258" y="157" text-anchor="end" fill="#4169E1" font-size="11" font-weight="600">the seam</text>

  <text x="40" y="198" fill="#1a2026" font-size="13" font-weight="600">after</text>
  <text x="40" y="216" fill="#5c6b76" font-size="11">queue [1,4,3,2]</text>
  <text x="190" y="203" text-anchor="end" fill="#5c6b76" font-size="12.5">front</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="200" y="180" width="44" height="36" rx="4"/>
    <rect x="360" y="180" width="44" height="36" rx="4" fill="#dbe4fb"/>
    <rect x="408" y="180" width="44" height="36" rx="4"/>
  </g>
  <rect x="248" y="180" width="44" height="36" rx="4" fill="#4169E1" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="222" y="203">1</text><text x="270" y="203" fill="#ffffff">4</text>
    <text x="382" y="203">3</text><text x="430" y="203">2</text>
  </g>
  <text x="462" y="203" fill="#5c6b76" font-size="12.5">back</text>
  <text x="270" y="234" text-anchor="middle" font-size="10.5" fill="#4169E1" font-weight="600">appended</text>
  <text x="382" y="234" text-anchor="middle" font-size="10.5" fill="#5c6b76">just moved</text>

  <text x="340" y="266" text-anchor="middle" fill="#1a2026" font-size="13">pushMiddle(4) rebalances first - 3 moves from the back of front to the front of back -</text>
  <text x="340" y="284" text-anchor="middle" fill="#1a2026" font-size="13">then appends 4 at the back of front: the frontmost middle of <tspan fill="#4169E1" font-weight="600">[1,4,3,2]</tspan>.</text>
</svg>
