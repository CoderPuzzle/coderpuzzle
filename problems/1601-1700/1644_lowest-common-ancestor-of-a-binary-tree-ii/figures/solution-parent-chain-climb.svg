<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="396" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <!-- tree = [3,5,1,6,2,0,8,null,null,7,4], p=5, q=4; circles r=18; muted = off both walks -->
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="320" y1="55" x2="190" y2="140"/>
    <line x1="320" y1="55" x2="450" y2="140"/>
    <line x1="190" y1="140" x2="130" y2="225"/>
    <line x1="190" y1="140" x2="250" y2="225"/>
    <line x1="450" y1="140" x2="390" y2="225"/>
    <line x1="450" y1="140" x2="510" y2="225"/>
    <line x1="250" y1="225" x2="215" y2="305"/>
    <line x1="250" y1="225" x2="285" y2="305"/>
  </g>
  <!-- p's recorded chain: 5 then 3 -->
  <path d="M 168 130 Q 214 74 292 64" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- q's climb: 4 -> 2 -> 5 -->
  <path d="M 292 292 Q 276 266 258 246" fill="none" stroke="#1a2026" stroke-width="2" marker-end="url(#arrowdark)"/>
  <path d="M 228 210 Q 202 192 194 164" fill="none" stroke="#1a2026" stroke-width="2" marker-end="url(#arrowdark)"/>
  <g stroke-width="1.6">
    <circle cx="320" cy="55" r="18" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="190" cy="140" r="18" fill="#4169E1" stroke="#4169E1"/>
    <circle cx="450" cy="140" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="130" cy="225" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="250" cy="225" r="18" fill="#ffffff" stroke="#42525e"/>
    <circle cx="390" cy="225" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="510" cy="225" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="215" cy="305" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="285" cy="305" r="18" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="320" y="60" fill="#1a2026">3</text>
    <text x="190" y="145" fill="#ffffff">5</text>
    <text x="450" y="145" fill="#9aa7b2">1</text>
    <text x="130" y="230" fill="#9aa7b2">6</text>
    <text x="250" y="230" fill="#1a2026">2</text>
    <text x="390" y="230" fill="#9aa7b2">0</text>
    <text x="510" y="230" fill="#9aa7b2">8</text>
    <text x="215" y="310" fill="#9aa7b2">7</text>
    <text x="285" y="310" fill="#1a2026">4</text>
  </g>
  <g font-size="12.5" fill="#4169E1" font-weight="600">
    <text x="42" y="92">p's climb records</text>
    <text x="42" y="110">5, then 3</text>
  </g>
  <g font-size="12.5" fill="#1a2026" font-weight="600">
    <text x="404" y="286">q climbs 4, 2, then 5 —</text>
    <text x="404" y="304">5 is already recorded,</text>
    <text x="404" y="322">so the climb stops there</text>
  </g>
  <text x="320" y="364" text-anchor="middle" fill="#1a2026" font-size="13">p's recorded chain is {5, 3}; from q, values 4 and 2 are new, but 5 is</text>
  <text x="320" y="382" text-anchor="middle" fill="#1a2026" font-size="13">already recorded — the first hit, <tspan fill="#4169E1" font-weight="600">5</tspan>, is the lowest common ancestor.</text>
</svg>
