<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="700" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s = "aabbaba"; suffix-link tree of the reference automaton build; boxes 112x66.
       Simulated states (state: rep, len, link, (len[link], len] width):
       1:"a",1,0,1  2:"aa",2,1,1  3:"aab",3,8,1  4:"aabb",4,5,3  5:"b",1,0,1
       6:"aabba",5,10,3  7:"aabbab",6,8,4  8:"ab",2,5,1  9:"aabbaba",7,10,5  10:"ba",2,1,1
       widths sum 1+1+1+3+1+3+4+1+5+1 = 21 -->
  <text x="350" y="22" text-anchor="middle" fill="#5c6b76" font-size="12.5">Suffix-link tree of the automaton built for aabbaba (11 states)</text>
  <!-- suffix-link edges, child to parent -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 190 140 L 340 102" marker-end="url(#arrow)"/>
    <path d="M 460 140 L 340 102" marker-end="url(#arrow)"/>
    <path d="M 70 244 L 190 206" marker-end="url(#arrow)"/>
    <path d="M 190 244 L 190 206" marker-end="url(#arrow)"/>
    <path d="M 410 244 L 460 206" marker-end="url(#arrow)"/>
    <path d="M 560 244 L 460 206" marker-end="url(#arrow)"/>
    <path d="M 130 348 L 190 310" marker-end="url(#arrow)"/>
    <path d="M 250 348 L 190 310" marker-end="url(#arrow)"/>
    <path d="M 490 348 L 560 310" marker-end="url(#arrow)"/>
    <path d="M 630 348 L 560 310" marker-end="url(#arrow)"/>
  </g>
  <text x="250" y="112" text-anchor="middle" fill="#5c6b76" font-size="12" font-style="italic">suffix link</text>
  <!-- state boxes: rep / (len[link], len] / width -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="284" y="36" width="112" height="66" rx="8"/>
    <rect x="134" y="140" width="112" height="66" rx="8"/>
    <rect x="404" y="140" width="112" height="66" rx="8"/>
    <rect x="14" y="244" width="112" height="66" rx="8"/>
    <rect x="134" y="244" width="112" height="66" rx="8"/>
    <rect x="354" y="244" width="112" height="66" rx="8"/>
    <rect x="504" y="244" width="112" height="66" rx="8"/>
    <rect x="74" y="348" width="112" height="66" rx="8"/>
    <rect x="194" y="348" width="112" height="66" rx="8"/>
    <rect x="434" y="348" width="112" height="66" rx="8"/>
    <rect x="574" y="348" width="112" height="66" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="340" y="56" font-weight="600" fill="#1a2026">root</text>
    <text x="340" y="74" fill="#5c6b76" font-size="11.5">len 0</text>
    <text x="340" y="92" fill="#9aa7b2" font-size="11.5">—</text>
    <text x="190" y="160"><tspan fill="#5c6b76">s1 · </tspan><tspan font-weight="600" fill="#1a2026">"a"</tspan></text>
    <text x="190" y="178" fill="#5c6b76" font-size="11.5">(0, 1]</text>
    <text x="190" y="196" fill="#4169E1" font-size="11.5" font-weight="600">1 substring</text>
    <text x="460" y="160"><tspan fill="#5c6b76">s5 · </tspan><tspan font-weight="600" fill="#1a2026">"b"</tspan></text>
    <text x="460" y="178" fill="#5c6b76" font-size="11.5">(0, 1]</text>
    <text x="460" y="196" fill="#4169E1" font-size="11.5" font-weight="600">1 substring</text>
    <text x="70" y="264"><tspan fill="#5c6b76">s2 · </tspan><tspan font-weight="600" fill="#1a2026">"aa"</tspan></text>
    <text x="70" y="282" fill="#5c6b76" font-size="11.5">(1, 2]</text>
    <text x="70" y="300" fill="#4169E1" font-size="11.5" font-weight="600">1 substring</text>
    <text x="190" y="264"><tspan fill="#5c6b76">s10 · </tspan><tspan font-weight="600" fill="#1a2026">"ba"</tspan></text>
    <text x="190" y="282" fill="#5c6b76" font-size="11.5">(1, 2]</text>
    <text x="190" y="300" fill="#4169E1" font-size="11.5" font-weight="600">1 substring</text>
    <text x="410" y="264"><tspan fill="#5c6b76">s4 · </tspan><tspan font-weight="600" fill="#1a2026">"aabb"</tspan></text>
    <text x="410" y="282" fill="#5c6b76" font-size="11.5">(1, 4]</text>
    <text x="410" y="300" fill="#4169E1" font-size="11.5" font-weight="600">3 substrings</text>
    <text x="560" y="264"><tspan fill="#5c6b76">s8 · </tspan><tspan font-weight="600" fill="#1a2026">"ab"</tspan></text>
    <text x="560" y="282" fill="#5c6b76" font-size="11.5">(1, 2]</text>
    <text x="560" y="300" fill="#4169E1" font-size="11.5" font-weight="600">1 substring</text>
    <text x="130" y="368"><tspan fill="#5c6b76">s6 · </tspan><tspan font-weight="600" fill="#1a2026">"aabba"</tspan></text>
    <text x="130" y="386" fill="#5c6b76" font-size="11.5">(2, 5]</text>
    <text x="130" y="404" fill="#4169E1" font-size="11.5" font-weight="600">3 substrings</text>
    <text x="250" y="368"><tspan fill="#5c6b76">s9 · </tspan><tspan font-weight="600" fill="#1a2026">"aabbaba"</tspan></text>
    <text x="250" y="386" fill="#5c6b76" font-size="11.5">(2, 7]</text>
    <text x="250" y="404" fill="#4169E1" font-size="11.5" font-weight="600">5 substrings</text>
    <text x="490" y="368"><tspan fill="#5c6b76">s3 · </tspan><tspan font-weight="600" fill="#1a2026">"aab"</tspan></text>
    <text x="490" y="386" fill="#5c6b76" font-size="11.5">(2, 3]</text>
    <text x="490" y="404" fill="#4169E1" font-size="11.5" font-weight="600">1 substring</text>
    <text x="630" y="368"><tspan fill="#5c6b76">s7 · </tspan><tspan font-weight="600" fill="#1a2026">"aabbab"</tspan></text>
    <text x="630" y="386" fill="#5c6b76" font-size="11.5">(2, 6]</text>
    <text x="630" y="404" fill="#4169E1" font-size="11.5" font-weight="600">4 substrings</text>
  </g>
  <text x="350" y="444" text-anchor="middle" fill="#1a2026" font-size="13">Each state owns exactly the lengths (len[link], len] printed in its box, each box's</text>
  <text x="350" y="464" text-anchor="middle" fill="#1a2026" font-size="13">longest substring on top: summing the widths, 1+1+1+3+1+3+4+1+5+1 = <tspan fill="#4169E1" font-weight="600">21</tspan> distinct substrings.</text>
</svg>
