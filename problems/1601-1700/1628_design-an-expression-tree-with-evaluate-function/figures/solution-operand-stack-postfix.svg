<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="300" fill="#ffffff"/>
  <!-- tokens = ["4","5","2","7","+","-","*"]; operand stack after each token, bottom->top;
       boxes 30px tall, stack bottom y = 220, column centers x = 58 + 92i -->
  <g stroke="#42525e" stroke-width="1.5" fill="#f0f3f7">
    <rect x="26" y="40" width="44" height="28"/><rect x="118" y="40" width="44" height="28"/>
    <rect x="210" y="40" width="44" height="28"/><rect x="302" y="40" width="44" height="28"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="394" y="40" width="44" height="28"/><rect x="486" y="40" width="44" height="28"/>
    <rect x="578" y="40" width="44" height="28"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="48" y="58">4</text><text x="140" y="58">5</text><text x="232" y="58">2</text><text x="324" y="58">7</text>
    <text x="416" y="58" fill="#4169E1">+</text><text x="508" y="58" fill="#4169E1">&#8722;</text><text x="600" y="58" fill="#4169E1">*</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="58" y="84">push</text><text x="150" y="84">push</text><text x="242" y="84">push</text><text x="334" y="84">push</text>
    <text x="416" y="80">pop 7, 2</text><text x="508" y="80">pop 9, 5</text><text x="600" y="80">pop &#8722;4, 4</text>
    <text x="416" y="93" font-weight="600" fill="#4169E1">push 2+7=9</text>
    <text x="508" y="93" font-weight="600" fill="#4169E1">push 5&#8722;9=&#8722;4</text>
    <text x="600" y="93" font-weight="600" fill="#4169E1">push 4&#183;(&#8722;4)</text>
  </g>
  <!-- column 0: [4] -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="26" y="190" width="64" height="30"/>
    <rect x="118" y="160" width="64" height="30"/><rect x="118" y="190" width="64" height="30"/>
    <rect x="210" y="130" width="64" height="30"/><rect x="210" y="160" width="64" height="30"/><rect x="210" y="190" width="64" height="30"/>
    <rect x="302" y="100" width="64" height="30"/><rect x="302" y="130" width="64" height="30"/><rect x="302" y="160" width="64" height="30"/><rect x="302" y="190" width="64" height="30"/>
    <rect x="394" y="130" width="64" height="30"/><rect x="394" y="160" width="64" height="30"/><rect x="394" y="190" width="64" height="30"/>
    <rect x="486" y="160" width="64" height="30"/><rect x="486" y="190" width="64" height="30"/>
    <rect x="578" y="190" width="64" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="58" y="210">4</text>
    <text x="150" y="180">4</text><text x="150" y="210">5</text>
    <text x="242" y="150">4</text><text x="242" y="180">5</text><text x="242" y="210">2</text>
    <text x="334" y="120">4</text><text x="334" y="150">5</text><text x="334" y="180">2</text><text x="334" y="210">7</text>
    <text x="416" y="150">4</text><text x="416" y="180">5</text><text x="416" y="210" fill="#4169E1">9</text>
    <text x="508" y="180">4</text><text x="508" y="210" fill="#4169E1">&#8722;4</text>
    <text x="610" y="210" fill="#4169E1">&#8722;16</text>
  </g>
  <text x="330" y="252" text-anchor="middle" fill="#1a2026" font-size="13">The + collapses 2 and 7 into 9, the &#8722; pops 9 then 5 and pushes 5 &#8722; 9 = <tspan fill="#4169E1" font-weight="600">&#8722;4</tspan>.</text>
  <text x="330" y="274" text-anchor="middle" fill="#1a2026" font-size="13">The final * leaves one value, 4 &#183; (&#8722;4) = <tspan fill="#4169E1" font-weight="600">&#8722;16</tspan> — the answer.</text>
</svg>
