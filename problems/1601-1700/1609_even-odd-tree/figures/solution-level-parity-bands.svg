<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- levels of [1,10,4,3,null,7,9,12,8,6,null,null,2]; bands x=30 w=580 h=56 at y=46,132,218,304; node circles r=17 -->
  <g fill="#dbe4fb">
    <rect x="30" y="46" width="580" height="56"/>
    <rect x="30" y="218" width="580" height="56"/>
  </g>
  <g fill="#f0f3f7">
    <rect x="30" y="132" width="580" height="56"/>
    <rect x="30" y="304" width="580" height="56"/>
  </g>
  <g font-size="12.5" fill="#1a2026">
    <text x="30" y="40"><tspan font-weight="600">level 0 (even index)</tspan><tspan fill="#5c6b76"> — odd values, strictly increasing</tspan></text>
    <text x="30" y="126"><tspan font-weight="600">level 1 (odd index)</tspan><tspan fill="#5c6b76"> — even values, strictly decreasing</tspan></text>
    <text x="30" y="212"><tspan font-weight="600">level 2 (even index)</tspan><tspan fill="#5c6b76"> — odd values, strictly increasing</tspan></text>
    <text x="30" y="298"><tspan font-weight="600">level 3 (odd index)</tspan><tspan fill="#5c6b76"> — even values, strictly decreasing</tspan></text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 271 160 H 369" marker-end="url(#arrow)"/>
    <path d="M 201 246 H 299" marker-end="url(#arrow)"/>
    <path d="M 341 246 H 439" marker-end="url(#arrow)"/>
    <path d="M 131 332 H 229" marker-end="url(#arrow)"/>
    <path d="M 271 332 H 369" marker-end="url(#arrow)"/>
    <path d="M 411 332 H 509" marker-end="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="320" cy="74" r="17"/>
    <circle cx="250" cy="160" r="17"/><circle cx="390" cy="160" r="17"/>
    <circle cx="180" cy="246" r="17"/><circle cx="320" cy="246" r="17"/><circle cx="460" cy="246" r="17"/>
    <circle cx="110" cy="332" r="17"/><circle cx="250" cy="332" r="17"/><circle cx="390" cy="332" r="17"/><circle cx="530" cy="332" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="320" y="79">1</text>
    <text x="250" y="165">10</text><text x="390" y="165">4</text>
    <text x="180" y="251">3</text><text x="320" y="251">7</text><text x="460" y="251">9</text>
    <text x="110" y="337">12</text><text x="250" y="337">8</text><text x="390" y="337">6</text><text x="530" y="337">2</text>
  </g>
  <text x="320" y="390" text-anchor="middle" fill="#1a2026" font-size="13">Reading each band left to right: 3 &lt; 7 &lt; 9 strictly increases (odd values)</text>
  <text x="320" y="410" text-anchor="middle" fill="#1a2026" font-size="13">and 12 &gt; 8 &gt; 6 &gt; 2 strictly decreases (even) — the tree is Even-Odd.</text>
</svg>
