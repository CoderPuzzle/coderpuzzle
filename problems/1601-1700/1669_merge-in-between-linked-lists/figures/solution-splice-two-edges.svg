<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- list1 = [10,1,13,6,9,5], a=3, b=4: nodes 64x40 at x=73+94i, y=70 (centers 105,199,293,387,481,575);
       list2 = [1000000,1000001,1000002]: nodes 84x40 at x=184/298/412, y=190.
       Removed span 6,9 muted/dashed; the two rewritten edges 13->1000000 and 1000002->5 in accent -->
  <text x="63" y="95" text-anchor="end" fill="#5c6b76" font-size="12.5">list1</text>
  <text x="434" y="52" text-anchor="middle" font-size="11" fill="#9aa7b2">span a..b (6 -&gt; 9) lifted out</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="73" y="70" width="64" height="40"/><rect x="167" y="70" width="64" height="40"/>
    <rect x="261" y="70" width="64" height="40" fill="#dbe4fb"/>
    <rect x="543" y="70" width="64" height="40" fill="#dbe4fb"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3" fill="#f0f3f7">
    <rect x="355" y="70" width="64" height="40"/><rect x="449" y="70" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="105" y="95">10</text><text x="199" y="95">1</text><text x="293" y="95">13</text>
    <text x="387" y="95" fill="#9aa7b2">6</text><text x="481" y="95" fill="#9aa7b2">9</text>
    <text x="575" y="95">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <line x1="139" y1="90" x2="161" y2="90" marker-end="url(#arrowdark)"/>
    <line x1="233" y1="90" x2="255" y2="90" marker-end="url(#arrowdark)"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <line x1="327" y1="90" x2="349" y2="90" stroke-dasharray="4 3" marker-end="url(#arrowmuted)"/>
    <line x1="421" y1="90" x2="443" y2="90" stroke-dasharray="4 3" marker-end="url(#arrowmuted)"/>
    <line x1="515" y1="90" x2="537" y2="90" stroke-dasharray="4 3" marker-end="url(#arrowmuted)"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="105" y="132">0</text><text x="199" y="132">1</text><text x="293" y="132">2</text>
    <text x="387" y="132">3</text><text x="481" y="132">4</text><text x="575" y="132">5</text>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="600">
    <text x="293" y="148" fill="#4169E1">pre</text>
    <text x="575" y="148" fill="#4169E1">after</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#9aa7b2">
    <text x="387" y="148">a = 3</text>
    <text x="481" y="148">b = 4</text>
  </g>
  <text x="150" y="215" text-anchor="end" fill="#5c6b76" font-size="12.5">list2</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="184" y="190" width="84" height="40"/><rect x="298" y="190" width="84" height="40"/>
    <rect x="412" y="190" width="84" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="226" y="215">1000000</text><text x="340" y="215">1000001</text><text x="454" y="215">1000002</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <line x1="270" y1="210" x2="292" y2="210" marker-end="url(#arrowdark)"/>
    <line x1="384" y1="210" x2="406" y2="210" marker-end="url(#arrowdark)"/>
  </g>
  <path d="M 285 112 Q 255 158 240 184" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 498 212 C 600 212 640 130 611 94" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Only <tspan fill="#4169E1" font-weight="600">two edges</tspan> change: 13's next becomes 1000000, and 1000002's next</text>
  <text x="340" y="280" text-anchor="middle" fill="#1a2026" font-size="13">becomes 5; the span 6 -&gt; 9 loses its only reference, and the answer is still head 10.</text>
</svg>
