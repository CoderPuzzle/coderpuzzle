<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "aba", t = "baba"; cell (i,j) = same-run / one-mismatch run lengths; cells 54x40 at (120,76); shaded cells are the six diff = 1 cells -->
  <text x="228" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">same[i][j] / diff[i][j] per ending pair</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="147" y="70">b</text><text x="201" y="70">a</text><text x="255" y="70">b</text><text x="309" y="70">a</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="110" y="100">a</text><text x="110" y="140">b</text><text x="110" y="180">a</text>
  </g>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="120" y="76" width="54" height="40" fill="#dbe4fb"/><rect x="174" y="76" width="54" height="40" fill="#ffffff"/><rect x="228" y="76" width="54" height="40" fill="#dbe4fb"/><rect x="282" y="76" width="54" height="40" fill="#ffffff"/>
    <rect x="120" y="116" width="54" height="40" fill="#ffffff"/><rect x="174" y="116" width="54" height="40" fill="#dbe4fb"/><rect x="228" y="116" width="54" height="40" fill="#ffffff"/><rect x="282" y="116" width="54" height="40" fill="#dbe4fb"/>
    <rect x="120" y="156" width="54" height="40" fill="#dbe4fb"/><rect x="174" y="156" width="54" height="40" fill="#ffffff"/><rect x="228" y="156" width="54" height="40" fill="#dbe4fb"/><rect x="282" y="156" width="54" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="147" y="91">0</text><text x="201" y="91">1</text><text x="255" y="91">0</text><text x="309" y="91">1</text>
    <text x="147" y="131">1</text><text x="201" y="131">0</text><text x="255" y="131">2</text><text x="309" y="131">0</text>
    <text x="147" y="171">0</text><text x="201" y="171">2</text><text x="255" y="171">0</text><text x="309" y="171">3</text>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#9aa7b2">
    <text x="201" y="109">0</text><text x="309" y="109">0</text>
    <text x="147" y="149">0</text><text x="255" y="149">0</text>
    <text x="201" y="189">0</text><text x="309" y="189">0</text>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#4169E1">
    <text x="147" y="109">1</text><text x="255" y="109">1</text>
    <text x="201" y="149">1</text><text x="309" y="149">1</text>
    <text x="147" y="189">1</text><text x="255" y="189">1</text>
  </g>
  <!-- each mismatch cell steps from the up-left same-run cell: diff[2][2] = same[1][1] + 1 (indices = s/t positions; arrow from the cell at row 1, col 1 to the cell at row 2, col 2) -->
  <path d="M 214 148 L 238 164" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="12" fill="#1a2026">
    <text x="356" y="90">match: same + 1 down the</text>
    <text x="356" y="108">diagonal, diff carried</text>
    <text x="356" y="132">mismatch: same = 0,</text>
    <text x="356" y="150">diff = same[i-1][j-1] + 1</text>
    <text x="356" y="178">e.g. diff[2][2] = same[1][1]</text>
    <text x="356" y="196">+ 1 = <tspan fill="#4169E1" font-weight="600">1</tspan> (arrow)</text>
    <text x="356" y="224">sum of all diff = <tspan fill="#4169E1" font-weight="600">6</tspan></text>
  </g>
  <text x="310" y="240" text-anchor="middle" fill="#1a2026" font-size="13">The six shaded cells are the one-mismatch pairs - six single-character</text>
  <text x="310" y="260" text-anchor="middle" fill="#1a2026" font-size="13">comparisons like s[0]='a' vs t[0]='b' - and no longer pair qualifies, so the answer is <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
