<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="330" fill="#ffffff"/>
  <!-- yellow inventory: 2 balls, top one sold -->
  <g>
    <circle cx="150" cy="96" r="15" fill="#e8b93e" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle cx="150" cy="130" r="15" fill="#e8b93e" stroke="#a8842a" stroke-width="1.5"/>
    <text x="118" y="101" text-anchor="end" fill="#1a2026" font-size="12.5">2</text>
    <text x="118" y="135" text-anchor="end" fill="#5c6b76" font-size="12.5">1</text>
    <text x="150" y="176" text-anchor="middle" fill="#1a2026" font-weight="600">yellow ×2</text>
  </g>
  <!-- blue inventory: 5 balls, top three sold -->
  <g>
    <circle cx="330" cy="66" r="15" fill="#4169E1" fill-opacity="0.85" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle cx="330" cy="100" r="15" fill="#4169E1" fill-opacity="0.85" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle cx="330" cy="134" r="15" fill="#4169E1" fill-opacity="0.85" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle cx="330" cy="168" r="15" fill="#4169E1" fill-opacity="0.85" stroke="#274db1" stroke-width="1.5"/>
    <circle cx="330" cy="202" r="15" fill="#4169E1" fill-opacity="0.85" stroke="#274db1" stroke-width="1.5"/>
    <text x="298" y="71" text-anchor="end" fill="#1a2026" font-size="12.5">5</text>
    <text x="298" y="105" text-anchor="end" fill="#1a2026" font-size="12.5">4</text>
    <text x="298" y="139" text-anchor="end" fill="#1a2026" font-size="12.5">3</text>
    <text x="298" y="173" text-anchor="end" fill="#5c6b76" font-size="12.5">2</text>
    <text x="298" y="207" text-anchor="end" fill="#5c6b76" font-size="12.5">1</text>
    <text x="330" y="248" text-anchor="middle" fill="#1a2026" font-weight="600">blue ×5</text>
  </g>
  <!-- each color's value = balls still in inventory -->
  <text x="470" y="70" text-anchor="middle" fill="#5c6b76" font-size="11.5">value = balls</text>
  <text x="470" y="86" text-anchor="middle" fill="#5c6b76" font-size="11.5">left of that color</text>
  <!-- sold bracket -->
  <path d="M 356 58 L 366 58 L 366 142 L 356 142" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 174 88 L 184 88 L 184 104 L 174 104" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="470" y="120" text-anchor="middle" fill="#c0392b" font-size="12">sold: 4 orders</text>
  <text x="470" y="140" text-anchor="middle" fill="#5c6b76" font-size="11.5">dashed ring</text>
  <text x="280" y="296" text-anchor="middle" fill="#1a2026" font-weight="600">always sell from the tallest stacks: 2 + 5 + 4 + 3 = 14</text>
</svg>
