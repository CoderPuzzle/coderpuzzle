<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="290" fill="#ffffff"/>
  <!-- nums = [1,2,4,3], limit = 4; pairs (1,3): interval [2,7], zero at t=4;
       (2,4): interval [3,8], zero at t=6. Column centers t=2..8: 148,212,276,340,404,468,532.
       Prefix-summed cost(t) = 3,2,1,2,1,2,3 - minimum 1 at t=4 and t=6 -->
  <text x="340" y="28" text-anchor="middle" fill="#1a2026" font-weight="600">nums = [1,2,4,3], limit = 4 - mirror pairs (1,3) and (2,4)</text>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="148" y="56">2</text><text x="212" y="56">3</text><text x="276" y="56">4</text>
    <text x="340" y="56">5</text><text x="404" y="56">6</text><text x="468" y="56">7</text>
    <text x="532" y="56">8</text>
  </g>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#9aa7b2">target sum t</text>

  <text x="108" y="89" text-anchor="end" fill="#1a2026" font-size="12.5" font-weight="600">(1,3)</text>
  <rect x="120" y="72" width="376" height="26" fill="#dbe4fb" rx="3"/>
  <text x="176" y="89" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">1 move</text>
  <rect x="248" y="72" width="56" height="26" fill="#4169E1"/>
  <text x="276" y="90" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">0</text>

  <text x="108" y="143" text-anchor="end" fill="#1a2026" font-size="12.5" font-weight="600">(2,4)</text>
  <rect x="184" y="126" width="376" height="26" fill="#dbe4fb" rx="3"/>
  <text x="230" y="143" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">1 move</text>
  <rect x="376" y="126" width="56" height="26" fill="#4169E1"/>
  <text x="404" y="144" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">0</text>

  <text x="108" y="212" text-anchor="end" fill="#5c6b76" font-size="12" font-weight="600">cost(t)</text>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="148" y="212">3</text><text x="212" y="212">2</text>
    <text x="276" y="212" fill="#4169E1">1</text>
    <text x="340" y="212">2</text>
    <text x="404" y="212" fill="#4169E1">1</text>
    <text x="468" y="212">2</text><text x="532" y="212">3</text>
  </g>
  <line x1="250" y1="219" x2="302" y2="219" stroke="#4169E1" stroke-width="2.5"/>
  <line x1="378" y1="219" x2="430" y2="219" stroke="#4169E1" stroke-width="2.5"/>

  <text x="340" y="252" text-anchor="middle" fill="#1a2026" font-size="13">Pair (1,3) needs 1 move across t = 2..7, zero only at 4; pair (2,4) covers 3..8,</text>
  <text x="340" y="270" text-anchor="middle" fill="#1a2026" font-size="13">zero at 6. Prefix-summing paints cost = 3, 2, 1, 2, 1, 2, 3 - bottoming at <tspan fill="#4169E1" font-weight="600">1</tspan>, first at t = 4.</text>
</svg>
