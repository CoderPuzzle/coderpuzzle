<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="326" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- number line positions 0..17; forbidden = [1,6,2,14,5,17,4], a=16, b=9, x=7;
       cells 28x46 at x = 68 + 28p, y=112; cell centre x = 82 + 28p -->
  <g font-size="11" fill="#5c6b76">
    <rect x="68" y="44" width="14" height="14" fill="#f0f3f7" stroke="#9aa7b2"/>
    <text x="88" y="55">forbidden</text>
    <rect x="158" y="44" width="14" height="14" fill="#dbe4fb" stroke="#4169E1"/>
    <text x="178" y="55">on the path</text>
  </g>
  <!-- all 18 cells, then forbidden and path overlays -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="68" y="112" width="28" height="46"/><rect x="96" y="112" width="28" height="46"/>
    <rect x="124" y="112" width="28" height="46"/><rect x="152" y="112" width="28" height="46"/>
    <rect x="180" y="112" width="28" height="46"/><rect x="208" y="112" width="28" height="46"/>
    <rect x="236" y="112" width="28" height="46"/><rect x="264" y="112" width="28" height="46"/>
    <rect x="292" y="112" width="28" height="46"/><rect x="320" y="112" width="28" height="46"/>
    <rect x="348" y="112" width="28" height="46"/><rect x="376" y="112" width="28" height="46"/>
    <rect x="404" y="112" width="28" height="46"/><rect x="432" y="112" width="28" height="46"/>
    <rect x="460" y="112" width="28" height="46"/><rect x="488" y="112" width="28" height="46"/>
    <rect x="516" y="112" width="28" height="46"/><rect x="544" y="112" width="28" height="46"/>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3">
    <rect x="96" y="112" width="28" height="46"/><rect x="124" y="112" width="28" height="46"/>
    <rect x="180" y="112" width="28" height="46"/><rect x="208" y="112" width="28" height="46"/>
    <rect x="236" y="112" width="28" height="46"/><rect x="460" y="112" width="28" height="46"/>
    <rect x="544" y="112" width="28" height="46"/>
  </g>
  <rect x="68" y="112" width="28" height="46" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
  <rect x="264" y="112" width="28" height="46" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="516" y="112" width="28" height="46" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <!-- forbidden crosses -->
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <path d="M 105 124 L 115 142 M 115 124 L 105 142"/>
    <path d="M 133 124 L 143 142 M 143 124 L 133 142"/>
    <path d="M 189 124 L 199 142 M 199 124 L 189 142"/>
    <path d="M 217 124 L 227 142 M 227 124 L 217 142"/>
    <path d="M 245 124 L 255 142 M 255 124 L 245 142"/>
    <path d="M 469 124 L 479 142 M 479 124 L 469 142"/>
    <path d="M 553 124 L 563 142 M 563 124 L 553 142"/>
  </g>
  <!-- position numbers inside the cells -->
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="82" y="152">0</text><text x="110" y="152">1</text><text x="138" y="152">2</text>
    <text x="166" y="152">3</text><text x="194" y="152">4</text><text x="222" y="152">5</text>
    <text x="250" y="152">6</text><text x="306" y="152">8</text>
    <text x="334" y="152">9</text><text x="362" y="152">10</text><text x="390" y="152">11</text>
    <text x="418" y="152">12</text><text x="446" y="152">13</text><text x="474" y="152">14</text>
    <text x="502" y="152">15</text><text x="558" y="152">17</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="82" y="133" font-size="11">start</text>
    <text x="278" y="139" font-size="12.5">7</text>
    <text x="530" y="139" font-size="12.5">16</text>
  </g>
  <!-- jump 1: forward a=16 from 0 to 16 -->
  <path d="M 82 106 Q 306 36 526 106" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="336" y="46" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">jump 1 — forward +16</text>
  <!-- jump 2: backward b=9 from 16 to 7 -->
  <path d="M 530 164 Q 404 226 284 164" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="220" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">jump 2 — backward −9</text>
  <!-- direction state callout -->
  <rect x="70" y="240" width="500" height="30" rx="6" fill="#dbe4fb"/>
  <text x="320" y="260" text-anchor="middle" fill="#1a2026" font-size="12"><tspan fill="#4169E1" font-weight="600">(7, back)</tspan>: the last jump was backward, so a second backward jump is barred</text>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Two jumps reach home: 0 →(+16)→ 16 →(−9)→ 7.</text>
  <text x="320" y="314" text-anchor="middle" fill="#1a2026" font-size="13">The first BFS level holding x = 7 is level <tspan fill="#4169E1" font-weight="600">2</tspan> — the answer.</text>
</svg>
