<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <rect width="560" height="310" fill="#ffffff"/>
  <!-- input matrix -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="40" y="50" width="64" height="44" fill="#ffffff"/><rect x="104" y="50" width="64" height="44" fill="#ffffff"/><rect x="168" y="50" width="64" height="44" fill="#ffffff"/>
    <rect x="40" y="94" width="64" height="44" fill="#ffffff"/><rect x="104" y="94" width="64" height="44" fill="#ffffff"/><rect x="168" y="94" width="64" height="44" fill="#ffffff"/>
    <rect x="40" y="138" width="64" height="44" fill="#ffffff"/><rect x="104" y="138" width="64" height="44" fill="#ffffff"/><rect x="168" y="138" width="64" height="44" fill="#ffffff"/>
    <rect x="40" y="182" width="64" height="44" fill="#ffffff"/><rect x="104" y="182" width="64" height="44" fill="#ffffff"/><rect x="168" y="182" width="64" height="44" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="72" y="77">20</text><text x="136" y="77">-21</text><text x="200" y="77">14</text>
    <text x="72" y="121">-19</text><text x="136" y="121">4</text><text x="200" y="121">19</text>
    <text x="72" y="165">22</text><text x="136" y="165">-47</text><text x="200" y="165">24</text>
    <text x="72" y="209">-19</text><text x="136" y="209">4</text><text x="200" y="209">19</text>
  </g>
  <line x1="245" y1="138" x2="287" y2="138" stroke="#42525e" stroke-width="1.7" marker-end="url(#a)"/>
  <!-- rank matrix: 1 green, 2 blue, 3 orange, 4 red, 5 purple, 6 teal -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="300" y="50" width="64" height="44" fill="#c0392b" fill-opacity="0.16"/>
    <rect x="364" y="50" width="64" height="44" fill="#4169E1" fill-opacity="0.2"/>
    <rect x="428" y="50" width="64" height="44" fill="#b57f30" fill-opacity="0.22"/>
    <rect x="300" y="94" width="64" height="44" fill="#2e9e5b" fill-opacity="0.2"/>
    <rect x="364" y="94" width="64" height="44" fill="#b57f30" fill-opacity="0.22"/>
    <rect x="428" y="94" width="64" height="44" fill="#c0392b" fill-opacity="0.16"/>
    <rect x="300" y="138" width="64" height="44" fill="#7e57a8" fill-opacity="0.2"/>
    <rect x="364" y="138" width="64" height="44" fill="#2e9e5b" fill-opacity="0.2"/>
    <rect x="428" y="138" width="64" height="44" fill="#2a7d8c" fill-opacity="0.2"/>
    <rect x="300" y="182" width="64" height="44" fill="#2e9e5b" fill-opacity="0.2"/>
    <rect x="364" y="182" width="64" height="44" fill="#b57f30" fill-opacity="0.22"/>
    <rect x="428" y="182" width="64" height="44" fill="#c0392b" fill-opacity="0.16"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="332" y="77">4</text><text x="396" y="77">2</text><text x="460" y="77">3</text>
    <text x="332" y="121">1</text><text x="396" y="121">3</text><text x="460" y="121">4</text>
    <text x="332" y="165">5</text><text x="396" y="165">1</text><text x="460" y="165">6</text>
    <text x="332" y="209">1</text><text x="396" y="209">3</text><text x="460" y="209">4</text>
  </g>
  <text x="280" y="272" text-anchor="middle" fill="#1a2026" font-weight="600">equal entries (the two -19s, the two 4s, the two 19s) share a rank</text>
  <text x="280" y="294" text-anchor="middle" fill="#5c6b76" font-size="12">each color marks one rank, 1 through 6</text>
</svg>
