<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="412" fill="#ffffff"/>
  <!-- words = ["acca","bbbb","caca"] (cells 46x32 at (64,88)); target = "aba"; counts cells 38x26 at (420,96); dp cells 40x28 at (180,232); dp[3][4] = 6 -->
  <text x="156" y="62" text-anchor="middle" fill="#5c6b76" font-size="12.5">words</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="87" y="80">col 0</text><text x="133" y="80">col 1</text><text x="179" y="80">col 2</text><text x="225" y="80">col 3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11.5">
    <text x="58" y="109">acca</text><text x="58" y="141">bbbb</text><text x="58" y="173">caca</text>
  </g>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="64" y="88" width="46" height="32"/><rect x="110" y="88" width="46" height="32"/><rect x="156" y="88" width="46" height="32"/><rect x="202" y="88" width="46" height="32"/>
    <rect x="64" y="120" width="46" height="32"/><rect x="110" y="120" width="46" height="32"/><rect x="156" y="120" width="46" height="32"/><rect x="202" y="120" width="46" height="32"/>
    <rect x="64" y="152" width="46" height="32"/><rect x="110" y="152" width="46" height="32"/><rect x="156" y="152" width="46" height="32"/><rect x="202" y="152" width="46" height="32"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#4169E1">
    <text x="87" y="109">a</text><text x="225" y="109">a</text>
    <text x="87" y="141">b</text><text x="133" y="141">b</text><text x="179" y="141">b</text><text x="225" y="141">b</text>
    <text x="133" y="173">a</text><text x="225" y="173">a</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#9aa7b2">
    <text x="133" y="109">c</text><text x="179" y="109">c</text>
    <text x="87" y="173">c</text><text x="179" y="173">c</text>
  </g>
  <text x="496" y="62" text-anchor="middle" fill="#5c6b76" font-size="12.5">counts of 'a' / 'b' per column</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="439" y="88">0</text><text x="477" y="88">1</text><text x="515" y="88">2</text><text x="553" y="88">3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11.5">
    <text x="414" y="113">a</text><text x="414" y="139">b</text>
  </g>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="420" y="96" width="38" height="26" fill="#ffffff"/><rect x="458" y="96" width="38" height="26" fill="#ffffff"/><rect x="496" y="96" width="38" height="26" fill="#ffffff"/><rect x="534" y="96" width="38" height="26" fill="#dbe4fb"/>
    <rect x="420" y="122" width="38" height="26" fill="#ffffff"/><rect x="458" y="122" width="38" height="26" fill="#ffffff"/><rect x="496" y="122" width="38" height="26" fill="#ffffff"/><rect x="534" y="122" width="38" height="26" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="439" y="113" fill="#1a2026">1</text><text x="477" y="113" fill="#1a2026">1</text><text x="515" y="113" fill="#9aa7b2">0</text><text x="553" y="113" fill="#4169E1" font-weight="600">2</text>
    <text x="439" y="139" fill="#1a2026">1</text><text x="477" y="139" fill="#1a2026">1</text><text x="515" y="139" fill="#1a2026">1</text><text x="553" y="139" fill="#1a2026">1</text>
  </g>
  <text x="280" y="212" text-anchor="middle" fill="#5c6b76" font-size="12.5">dp[i][j] - first i chars of target, first j columns</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="200" y="226">j=0</text><text x="240" y="226">1</text><text x="280" y="226">2</text><text x="320" y="226">3</text><text x="360" y="226">4</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11">
    <text x="174" y="250">i=0</text><text x="174" y="278">1</text><text x="174" y="306">2</text><text x="174" y="334">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="180" y="232" width="40" height="28"/><rect x="220" y="232" width="40" height="28"/><rect x="260" y="232" width="40" height="28"/><rect x="300" y="232" width="40" height="28"/><rect x="340" y="232" width="40" height="28"/>
    <rect x="180" y="260" width="40" height="28"/><rect x="220" y="260" width="40" height="28"/><rect x="260" y="260" width="40" height="28"/><rect x="300" y="260" width="40" height="28"/><rect x="340" y="260" width="40" height="28"/>
    <rect x="180" y="288" width="40" height="28"/><rect x="220" y="288" width="40" height="28"/><rect x="260" y="288" width="40" height="28"/><rect x="300" y="288" width="40" height="28"/><rect x="340" y="288" width="40" height="28"/>
    <rect x="180" y="316" width="40" height="28"/><rect x="220" y="316" width="40" height="28"/><rect x="260" y="316" width="40" height="28"/><rect x="300" y="316" width="40" height="28"/><rect x="340" y="316" width="40" height="28" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="200" y="250" fill="#1a2026">1</text><text x="240" y="250" fill="#1a2026">1</text><text x="280" y="250" fill="#1a2026">1</text><text x="320" y="250" fill="#1a2026">1</text><text x="360" y="250" fill="#1a2026">1</text>
    <text x="200" y="278" fill="#9aa7b2">0</text><text x="240" y="278" fill="#1a2026">1</text><text x="280" y="278" fill="#1a2026">2</text><text x="320" y="278" fill="#1a2026">2</text><text x="360" y="278" fill="#1a2026">4</text>
    <text x="200" y="306" fill="#9aa7b2">0</text><text x="240" y="306" fill="#9aa7b2">0</text><text x="280" y="306" fill="#1a2026">1</text><text x="320" y="306" fill="#1a2026">3</text><text x="360" y="306" fill="#1a2026">5</text>
    <text x="200" y="334" fill="#9aa7b2">0</text><text x="240" y="334" fill="#9aa7b2">0</text><text x="280" y="334" fill="#9aa7b2">0</text><text x="320" y="334" fill="#9aa7b2">0</text><text x="360" y="334" fill="#4169E1" font-weight="600">6</text>
  </g>
  <g font-size="12" fill="#1a2026">
    <text x="396" y="250">at each column, skip it (left</text>
    <text x="396" y="268">cell) or spend it on the next</text>
    <text x="396" y="286">target char (diagonal cell *</text>
    <text x="396" y="304">count of that char here)</text>
    <text x="396" y="330">dp[3][4] = 0 + dp[2][3] * 2</text>
    <text x="396" y="348" font-weight="600">= 0 + 3 * 2 = <tspan fill="#4169E1">6</tspan></text>
  </g>
  <text x="340" y="380" text-anchor="middle" fill="#1a2026" font-size="13">Each column is skipped or spent on the next target character; the last cell</text>
  <text x="340" y="400" text-anchor="middle" fill="#1a2026" font-size="13">counts all <tspan fill="#4169E1" font-weight="600">6</tspan> ways to place 'a', 'b', 'a' with strictly increasing columns.</text>
</svg>
