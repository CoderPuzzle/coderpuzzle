<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- expression = (let x 2 (mult x (let x 3 y 4 (add x y)))); outer env {x:2}, inner env = copy of outer, then x=3 (shadow), y=4; add reads 3+4=7, mult reads outer x=2 -> 14 -->
  <text x="280" y="28" text-anchor="middle" fill="#5c6b76" font-size="12.5">(let x 2 (mult x (let x 3 y 4 (add x y))))</text>
  <rect x="50" y="44" width="430" height="190" fill="#f0f3f7" stroke="#42525e" stroke-width="1.6"/>
  <text x="66" y="68" fill="#5c6b76" font-size="12.5">outer let env</text>
  <text x="70" y="98" font-weight="600" font-size="15" fill="#1a2026">x = 2</text>
  <rect x="100" y="116" width="360" height="98" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="116" y="136" fill="#5c6b76" font-size="12.5">inner let env — a fresh copy of the outer frame</text>
  <path d="M 84 102 Q 62 152 94 152" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="116" y="158" fill="#9aa7b2" font-size="13">copied in: x = 2</text>
  <text x="116" y="180" font-size="13" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">x = 3</tspan><tspan fill="#5c6b76" font-size="12">  (shadows the copied 2)</tspan></text>
  <text x="116" y="202" font-weight="600" font-size="13" fill="#1a2026">y = 4</text>
  <text x="280" y="262" text-anchor="middle" fill="#1a2026" font-size="13">(add x y) evaluates in the inner frame: <tspan fill="#4169E1" font-weight="600">x = 3, y = 4</tspan> → 7</text>
  <text x="280" y="286" text-anchor="middle" fill="#1a2026" font-size="13">(mult x …) reads the outer frame's x = 2, so the product is <tspan fill="#4169E1" font-weight="600">2 × 7 = 14</tspan></text>
</svg>
