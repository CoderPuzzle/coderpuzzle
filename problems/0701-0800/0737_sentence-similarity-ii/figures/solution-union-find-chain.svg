<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="384" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- sentence1 = [I, love, leetcode], sentence2 = [I, love, onepiece]; pairs in order: 1 [manga,onepiece], 2 [platform,anime], 3 [leetcode,platform], 4 [anime,manga]; tree = parent pointers after all unions, root = onepiece -->
  <text x="18" y="60" fill="#5c6b76" font-size="12">sentence1</text>
  <text x="18" y="120" fill="#5c6b76" font-size="12">sentence2</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="115" y="40" width="60" height="30"/>
    <rect x="215" y="40" width="80" height="30"/>
    <rect x="320" y="40" width="120" height="30" stroke="#4169E1" stroke-width="1.6"/>
    <rect x="115" y="100" width="60" height="30"/>
    <rect x="215" y="100" width="80" height="30"/>
    <rect x="320" y="100" width="120" height="30" stroke="#4169E1" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="145" y="60">I</text><text x="255" y="60">love</text><text x="380" y="60">leetcode</text>
    <text x="145" y="120">I</text><text x="255" y="120">love</text><text x="380" y="120">onepiece</text>
  </g>
  <g text-anchor="middle" font-size="11.5">
    <text x="145" y="88" fill="#5c6b76">identical</text>
    <text x="255" y="88" fill="#5c6b76">identical</text>
    <text x="380" y="88" fill="#4169E1" font-weight="600">same root?</text>
  </g>
  <text x="50" y="152" fill="#5c6b76" font-size="12">union-find after all four pairs — arrows point to the parent</text>
  <g fill="none" stroke="#42525e" stroke-width="1.4">
    <path d="M 90 293 L 140 268" marker-end="url(#arrow)"/>
    <path d="M 250 293 L 162 268" marker-end="url(#arrow)"/>
    <path d="M 186 234 L 388 204" marker-end="url(#arrow)"/>
    <path d="M 430 233 L 430 203" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="10.5" text-anchor="middle">
    <text x="100" y="278">3</text>
    <text x="232" y="278">2</text>
    <text x="287" y="212">4</text>
  </g>
  <text x="438" y="222" fill="#5c6b76" font-size="10.5">1</text>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="116" y="235" width="68" height="30" fill="#dbe4fb"/>
    <rect x="394" y="235" width="72" height="30" fill="#dbe4fb"/>
    <rect x="46" y="295" width="88" height="30" fill="#dbe4fb"/>
    <rect x="210" y="295" width="80" height="30" fill="#dbe4fb"/>
  </g>
  <rect x="385" y="170" width="90" height="30" fill="#4169E1" stroke="#4169E1" stroke-width="1.2"/>
  <g text-anchor="middle" font-weight="600">
    <text x="430" y="189" fill="#ffffff" font-size="13">onepiece</text>
    <text x="150" y="254" fill="#1a2026" font-size="13">anime</text>
    <text x="430" y="254" fill="#1a2026" font-size="13">manga</text>
    <text x="90" y="314" fill="#1a2026" font-size="13">leetcode</text>
    <text x="250" y="314" fill="#1a2026" font-size="13">platform</text>
  </g>
  <text x="482" y="190" fill="#4169E1" font-weight="600" font-size="12">root</text>
  <text x="320" y="352" text-anchor="middle" fill="#1a2026" font-size="13">Unioning the four pairs leaves one component rooted at <tspan fill="#4169E1" font-weight="600">onepiece</tspan>.</text>
  <text x="320" y="370" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">find(leetcode) = find(onepiece)</tspan>, so the aligned pair is similar.</text>
</svg>
