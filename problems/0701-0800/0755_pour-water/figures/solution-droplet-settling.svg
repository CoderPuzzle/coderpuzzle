<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="470" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- heights = [2,1,1,2,1,2,2]; columns 44 wide at x=62+52i, unit 28, baseline y=225; numbered water blocks show settle order -->
  <text x="62" y="40" fill="#5c6b76" font-size="12">heights = [2,1,1,2,1,2,2], volume = 4, k = 3</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="62" y="169" width="44" height="56"/><rect x="114" y="197" width="44" height="28"/>
    <rect x="166" y="197" width="44" height="28"/><rect x="218" y="169" width="44" height="56"/>
    <rect x="270" y="197" width="44" height="28"/><rect x="322" y="169" width="44" height="56"/>
    <rect x="374" y="169" width="44" height="56"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="166" y="169" width="44" height="28"/><rect x="114" y="169" width="44" height="28"/>
    <rect x="270" y="169" width="44" height="28"/><rect x="218" y="141" width="44" height="28"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#4169E1">
    <text x="136" y="188">2</text><text x="188" y="188">1</text>
    <text x="292" y="188">3</text><text x="240" y="160">4</text>
  </g>
  <line x1="50" y1="225" x2="430" y2="225" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="84" y="245">0</text><text x="140" y="245">1</text><text x="192" y="245">2</text>
    <text x="296" y="245">4</text><text x="348" y="245">5</text><text x="400" y="245">6</text>
  </g>
  <text x="244" y="245" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">3</text>
  <text x="244" y="264" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">k = 3</text>
  <path d="M 252 130 Q 220 100 190 152" fill="none" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="262" y="112" fill="#4169E1" font-size="11.5">droplet 1 probes left</text>
  <text x="235" y="288" text-anchor="middle" fill="#1a2026" font-size="13">Droplets 1-3 probe left, then right, and fill the valley cells;</text>
  <text x="235" y="308" text-anchor="middle" fill="#1a2026" font-size="13">droplet 4 falls neither way and rises at <tspan fill="#4169E1" font-weight="600">k = 3</tspan> → [2,2,2,3,2,2,2]</text>
</svg>
