<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- asteroids = [3,5,-6,2,-1,4]; column i: x0 = 90 + 86i, cells w52 h34, stack bottom y = 210; each column shows the stack after that arrival; incoming box y 34-62 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="116" y="26">i=0</text><text x="202" y="26">i=1</text><text x="288" y="26">i=2</text><text x="374" y="26">i=3</text><text x="460" y="26">i=4</text><text x="546" y="26">i=5</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <rect x="90" y="34" width="52" height="28" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <rect x="176" y="34" width="52" height="28" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <rect x="262" y="34" width="52" height="28" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <rect x="348" y="34" width="52" height="28" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <rect x="434" y="34" width="52" height="28" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="520" y="34" width="52" height="28" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="116" y="53" fill="#1a2026">3</text>
    <text x="202" y="53" fill="#1a2026">5</text>
    <text x="288" y="53" fill="#1a2026">-6</text>
    <text x="374" y="53" fill="#1a2026">2</text>
    <text x="460" y="53" fill="#9aa7b2">-1</text>
    <text x="546" y="53" fill="#1a2026">4</text>
  </g>
  <g fill="none" stroke="#42525e" stroke-width="1.4">
    <path d="M 116 64 V 170" marker-end="url(#arrow)"/>
    <path d="M 202 64 V 136" marker-end="url(#arrow)"/>
    <path d="M 288 64 V 170" marker-end="url(#arrow)"/>
    <path d="M 374 64 V 136" marker-end="url(#arrow)"/>
    <path d="M 460 64 V 136" marker-end="url(#arrow)"/>
    <path d="M 546 64 V 102" marker-end="url(#arrow)"/>
  </g>
  <!-- stack cells after each arrival: light = right-moving, accent = left-moving -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="90" y="176" width="52" height="34" fill="#dbe4fb"/>
    <rect x="176" y="176" width="52" height="34" fill="#dbe4fb"/>
    <rect x="176" y="142" width="52" height="34" fill="#dbe4fb"/>
    <rect x="262" y="176" width="52" height="34" fill="#4169E1"/>
    <rect x="348" y="176" width="52" height="34" fill="#4169E1"/>
    <rect x="348" y="142" width="52" height="34" fill="#dbe4fb"/>
    <rect x="434" y="176" width="52" height="34" fill="#4169E1"/>
    <rect x="434" y="142" width="52" height="34" fill="#dbe4fb"/>
    <rect x="520" y="176" width="52" height="34" fill="#4169E1"/>
    <rect x="520" y="142" width="52" height="34" fill="#dbe4fb"/>
    <rect x="520" y="108" width="52" height="34" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="116" y="198" fill="#1a2026">3</text>
    <text x="202" y="198" fill="#1a2026">3</text>
    <text x="202" y="164" fill="#1a2026">5</text>
    <text x="288" y="198" fill="#ffffff">-6</text>
    <text x="374" y="198" fill="#ffffff">-6</text>
    <text x="374" y="164" fill="#1a2026">2</text>
    <text x="460" y="198" fill="#ffffff">-6</text>
    <text x="460" y="164" fill="#1a2026">2</text>
    <text x="546" y="198" fill="#ffffff">-6</text>
    <text x="546" y="164" fill="#1a2026">2</text>
    <text x="546" y="130" fill="#1a2026">4</text>
  </g>
  <path d="M 80 210 H 582" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="116" y="232">push 3</text>
    <text x="202" y="232">push 5</text>
    <text x="288" y="232">pops 5, then 3</text>
    <text x="374" y="232">push 2</text>
    <text x="460" y="232">explodes on 2</text>
    <text x="546" y="232">push 4</text>
  </g>
  <rect x="150" y="286" width="14" height="14" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="170" y="298" fill="#5c6b76" font-size="12">right-moving survivor</text>
  <rect x="370" y="286" width="14" height="14" fill="#4169E1"/>
  <text x="390" y="298" fill="#5c6b76" font-size="12">left-moving survivor</text>
  <text x="330" y="326" text-anchor="middle" fill="#1a2026" font-size="13">-6 plows 5 and 3 off the stack; -1 explodes on 2; 4 stacks on a right-mover.</text>
  <text x="330" y="344" text-anchor="middle" fill="#1a2026" font-size="13">The scan ends with the survivor stack <tspan fill="#4169E1" font-weight="600">[-6, 2, 4]</tspan>, every collision resolved.</text>
</svg>
