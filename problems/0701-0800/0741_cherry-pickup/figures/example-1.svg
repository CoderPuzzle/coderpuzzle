  <polyline points="284,234 210,234 210,86 136,86" fill="none" stroke="#4169E1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aA)"/>
  <text x="70" y="82" text-anchor="end" fill="#5c6b76" font-size="12.5">start</text>
  <text x="330" y="230" fill="#5c6b76" font-size="12.5">end</text>
  <line x1="330" y1="70" x2="302" y2="70" stroke="#4169E1" stroke-width="3"/>
  <line x1="330" y1="88" x2="302" y2="88" stroke="#4169E1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="336" y="74" fill="#1a2026" font-size="12.5">trip out — 4 cherries</text>
  <text x="336" y="92" fill="#1a2026" font-size="12.5">trip back — 1 cherry</text>
  <text x="240" y="310" text-anchor="middle" fill="#1a2026" font-size="12.5">total picked = 5</text>
