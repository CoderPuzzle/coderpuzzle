<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#1a2026" stroke-width="1.4">
    <rect x="90" y="40" width="222" height="222"/>
    <line x1="164" y1="40" x2="164" y2="262"/>
    <line x1="238" y1="40" x2="238" y2="262"/>
    <line x1="90" y1="114" x2="312" y2="114"/>
    <line x1="90" y1="188" x2="312" y2="188"/>
  </g>
  <!-- cherries -->
  <g>
    <g transform="translate(201,77)"><circle cx="-7" cy="4" r="7.5" fill="#c0392b"/><circle cx="8" cy="7" r="7.5" fill="#c0392b"/><path d="M -7 -3 Q 0 -12 6 -2 M 8 0 Q 4 -10 6 -2" fill="none" stroke="#3f7d3a" stroke-width="1.6"/></g>
    <g transform="translate(127,151)"><circle cx="-7" cy="4" r="7.5" fill="#c0392b"/><circle cx="8" cy="7" r="7.5" fill="#c0392b"/><path d="M -7 -3 Q 0 -12 6 -2 M 8 0 Q 4 -10 6 -2" fill="none" stroke="#3f7d3a" stroke-width="1.6"/></g>
    <g transform="translate(127,225)"><circle cx="-7" cy="4" r="7.5" fill="#c0392b"/><circle cx="8" cy="7" r="7.5" fill="#c0392b"/><path d="M -7 -3 Q 0 -12 6 -2 M 8 0 Q 4 -10 6 -2" fill="none" stroke="#3f7d3a" stroke-width="1.6"/></g>
    <g transform="translate(201,225)"><circle cx="-7" cy="4" r="7.5" fill="#c0392b"/><circle cx="8" cy="7" r="7.5" fill="#c0392b"/><path d="M -7 -3 Q 0 -12 6 -2 M 8 0 Q 4 -10 6 -2" fill="none" stroke="#3f7d3a" stroke-width="1.6"/></g>
    <g transform="translate(275,225)"><circle cx="-7" cy="4" r="7.5" fill="#c0392b"/><circle cx="8" cy="7" r="7.5" fill="#c0392b"/><path d="M -7 -3 Q 0 -12 6 -2 M 8 0 Q 4 -10 6 -2" fill="none" stroke="#3f7d3a" stroke-width="1.6"/></g>
  </g>
  <!-- thorns -->
  <g stroke="#8a8f94" stroke-width="2.4" fill="none">
    <circle cx="275" cy="77" r="13"/><line x1="266" y1="68" x2="284" y2="86"/>
    <circle cx="275" cy="151" r="13"/><line x1="266" y1="142" x2="284" y2="160"/>
  </g>
  <!-- trip out: down, down, right, right -->
