<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="282" fill="#ffffff"/>
  <!-- Example 1: book(10,20) true, book(15,25) false, book(20,30) true;
       x(t) = 48 + (t-5)*16, bars 26 tall at y = 84 / 124 / 164; overlap of [15,25)
       with [10,20) is t in [15,20) -->
  <text x="288" y="38" text-anchor="middle" fill="#5c6b76" font-size="12.5">starts kept sorted; a new booking only meets its two neighbors</text>
  <!-- time gridlines -->
  <g stroke="#dbe4fb" stroke-width="1">
    <path d="M 128 76 V 200"/><path d="M 208 76 V 200"/><path d="M 288 76 V 200"/>
    <path d="M 368 76 V 200"/><path d="M 448 76 V 200"/>
  </g>
  <!-- lane 1: [10,20) accepted -->
  <rect x="128" y="84" width="160" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="208" y="101" text-anchor="middle" font-size="12" fill="#1a2026">book(10, 20)</text>
  <text x="300" y="101" font-size="12.5" font-weight="600" fill="#4169E1">→ true, stored</text>
  <text x="300" y="117" font-size="11.5" fill="#5c6b76">calendar empty: no prev, no next</text>
  <!-- lane 2: [15,25) rejected -->
  <rect x="208" y="124" width="160" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="248" y="141" text-anchor="middle" font-size="10.5" fill="#5c6b76">overlap 15–20</text>
  <text x="330" y="141" text-anchor="middle" font-size="12" fill="#5c6b76">book(15, 25)</text>
  <text x="380" y="141" font-size="12.5" font-weight="600" fill="#1a2026">→ false, not stored</text>
  <text x="380" y="157" font-size="11.5" fill="#5c6b76">prev [10, 20): end 20 &gt; start 15 — conflict</text>
  <!-- lane 3: [20,30) accepted -->
  <rect x="288" y="164" width="160" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="368" y="181" text-anchor="middle" font-size="12" fill="#1a2026">book(20, 30)</text>
  <text x="460" y="181" font-size="12.5" font-weight="600" fill="#4169E1">→ true, stored</text>
  <text x="460" y="197" font-size="11.5" fill="#5c6b76">20 &gt; 20 is false — allowed</text>
  <!-- axis -->
  <path d="M 48 200 H 528" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <path d="M 128 200 V 206"/><path d="M 208 200 V 206"/><path d="M 288 200 V 206"/>
    <path d="M 368 200 V 206"/><path d="M 448 200 V 206"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="128" y="220">10</text><text x="208" y="220">15</text><text x="288" y="220">20</text>
    <text x="368" y="220">25</text><text x="448" y="220">30</text>
  </g>
  <text x="320" y="252" text-anchor="middle" fill="#1a2026" font-size="13">The two neighbors decide everything: [15, 25) dies because prev.end <tspan fill="#4169E1" font-weight="600">20 &gt; start 15</tspan>,</text>
  <text x="320" y="270" text-anchor="middle" fill="#1a2026" font-size="13">while [20, 30) survives — <tspan fill="#4169E1" font-weight="600">20 &gt; 20 is false</tspan>, so merely touching [10, 20) is allowed.</text>
</svg>
