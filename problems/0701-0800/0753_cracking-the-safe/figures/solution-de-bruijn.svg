<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 252" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<circle cx="140" cy="120" r="24" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="140" y="126" text-anchor="middle" font-weight="600">0</text>
  <circle cx="400" cy="120" r="24" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="400" y="126" text-anchor="middle" font-weight="600">1</text>
  <path d="M 128 100 C 96 56, 184 56, 152 100" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="140" y="46" text-anchor="middle" fill="#5c6b76">edge &#8220;00&#8221;</text>
  <path d="M 388 100 C 356 56, 444 56, 412 100" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="400" y="46" text-anchor="middle" fill="#5c6b76">edge &#8220;11&#8221;</text>
  <path d="M 164 112 L 376 112" fill="none" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrowB)"/>
  <text x="270" y="104" text-anchor="middle" fill="#4169E1">edge &#8220;01&#8221;</text>
  <path d="M 376 132 L 164 132" fill="none" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrowB)"/>
  <text x="270" y="152" text-anchor="middle" fill="#4169E1">edge &#8220;10&#8221;</text>
  <text x="60" y="200" fill="#5c6b76" font-size="12">Nodes are the (n&#8722;1)-digit strings &#8220;0&#8221; and &#8220;1&#8221;; each edge appends one digit and</text>
  <text x="60" y="218" fill="#5c6b76" font-size="12">slides the window. The Eulerian circuit 0 &#8594; 1 &#8594; 1 &#8594; 0 &#8594; 0 uses edges 01, 11, 10, 00,</text>
  <text x="60" y="236" fill="#5c6b76" font-size="12">spelling the 5-digit sequence &#8220;01100&#8221; plus the start node&#8217;s label &#8220;0&#8221;.</text>
</svg>
