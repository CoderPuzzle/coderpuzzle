<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- accounts = John[johnsmith, john_newyork], John[johnsmith, john00], Mary[mary], John[johnnybravo]; chips show email local parts; accent chips = shared johnsmith; card1 = the merged component -->
  <text x="30" y="36" fill="#5c6b76" font-size="11.5">accounts — email local parts shown</text>
  <text x="330" y="36" fill="#5c6b76" font-size="11.5">merged accounts (components)</text>
  <g text-anchor="end" font-size="10" fill="#9aa7b2">
    <text x="20" y="65">1</text><text x="20" y="105">2</text><text x="20" y="145">3</text><text x="20" y="185">4</text>
  </g>
  <g font-size="12" font-weight="600" fill="#1a2026">
    <text x="30" y="65">John</text><text x="30" y="105">John</text><text x="30" y="145">Mary</text><text x="30" y="185">John</text>
  </g>
  <rect x="78" y="50" width="67" height="22" rx="5" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="152" y="50" width="79" height="22" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <rect x="78" y="90" width="67" height="22" rx="5" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="152" y="90" width="49" height="22" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <rect x="78" y="130" width="38" height="22" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <rect x="78" y="170" width="79" height="22" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <g text-anchor="middle" font-size="11" fill="#1a2026">
    <text x="111" y="65">johnsmith</text><text x="191" y="65">john_newyork</text>
    <text x="111" y="105">johnsmith</text><text x="176" y="105">john00</text>
    <text x="97" y="145">mary</text><text x="117" y="185">johnnybravo</text>
  </g>
  <line x1="93" y1="72" x2="93" y2="90" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="87" y="84" text-anchor="end" font-size="11" fill="#4169E1">shared</text>
  <path d="M 191 74 Q 154 88 126 75" fill="none" stroke="#4169E1" stroke-width="1.4" marker-end="url(#arrowA)"/>
  <text x="200" y="86" font-size="11" fill="#5c6b76">union</text>
  <path d="M 176 114 Q 146 128 126 115" fill="none" stroke="#4169E1" stroke-width="1.4" marker-end="url(#arrowA)"/>
  <text x="200" y="126" font-size="11" fill="#5c6b76">union</text>
  <g stroke="#42525e" stroke-width="1.3" fill="none">
    <line x1="237" y1="61" x2="322" y2="72" marker-end="url(#arrow)"/>
    <line x1="207" y1="101" x2="322" y2="90" marker-end="url(#arrow)"/>
    <line x1="122" y1="141" x2="322" y2="160" marker-end="url(#arrow)"/>
    <line x1="163" y1="181" x2="322" y2="218" marker-end="url(#arrow)"/>
  </g>
  <rect x="330" y="44" width="290" height="82" rx="8" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="346" y="66" font-size="13" font-weight="600" fill="#1a2026">John</text>
  <text x="604" y="66" text-anchor="end" font-size="11" fill="#5c6b76">root: johnsmith</text>
  <rect x="346" y="78" width="49" height="22" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <rect x="401" y="78" width="79" height="22" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <rect x="486" y="78" width="67" height="22" rx="5" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="11" fill="#1a2026">
    <text x="370" y="92">john00</text><text x="440" y="92">john_newyork</text><text x="519" y="92">johnsmith</text>
  </g>
  <text x="563" y="92" font-size="10.5" fill="#9aa7b2">sorted</text>
  <text x="346" y="116" font-size="10.5" font-weight="600" fill="#4169E1">accounts 1 + 2 merge here</text>
  <rect x="330" y="138" width="290" height="48" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="346" y="158" font-size="13" font-weight="600" fill="#1a2026">Mary</text>
  <text x="604" y="158" text-anchor="end" font-size="11" fill="#5c6b76">root: mary</text>
  <rect x="346" y="164" width="38" height="22" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="365" y="178" text-anchor="middle" font-size="11" fill="#1a2026">mary</text>
  <rect x="330" y="198" width="290" height="48" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="346" y="218" font-size="13" font-weight="600" fill="#1a2026">John</text>
  <text x="604" y="218" text-anchor="end" font-size="11" fill="#5c6b76">root: johnnybravo</text>
  <rect x="346" y="224" width="79" height="22" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="385" y="238" text-anchor="middle" font-size="11" fill="#1a2026">johnnybravo</text>
  <text x="320" y="298" text-anchor="middle" font-size="13" fill="#1a2026">Both Johns union through the shared <tspan fill="#4169E1" font-weight="600">johnsmith@mail.com</tspan> into one component;</text>
  <text x="320" y="316" text-anchor="middle" font-size="13" fill="#1a2026">three accounts emerge; John's emails print sorted: john00, john_newyork, johnsmith.</text>
</svg>
