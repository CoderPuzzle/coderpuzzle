<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="292" fill="#ffffff"/>
  <!-- schedule [[[1,2],[5,6]],[[1,3]],[[4,10]]] pooled + sorted = [1,2],[1,3],[4,10],[5,6]; x(v) = 60 + 52v; busy blocks on one timeline, axis y=170; prev_end chips 2, 3, 10 -->
  <text x="52" y="64" fill="#5c6b76" font-size="12">pooled + sorted by start:</text>
  <text x="230" y="64" fill="#1a2026" font-size="12.5">[1,2]&#160;&#160;[1,3]&#160;&#160;[4,10]&#160;&#160;[5,6]</text>
  <text x="268" y="100" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">start 4 &gt; prev_end 3 → emit [3,4]</text>
  <line x1="268" y1="108" x2="268" y2="134" stroke="#4169E1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.5">
    <rect x="112" y="136" width="104" height="34"/>
    <rect x="268" y="136" width="312" height="34"/>
  </g>
  <rect x="216" y="136" width="52" height="34" fill="#4169E1"/>
  <g stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="164" y1="136" x2="164" y2="170"/>
    <line x1="372" y1="136" x2="372" y2="170"/>
  </g>
  <text x="242" y="158" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">[3,4]</text>
  <line x1="48" y1="170" x2="600" y2="170" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="112" y="188">1</text><text x="164" y="188">2</text><text x="216" y="188">3</text>
    <text x="268" y="188">4</text><text x="320" y="188">5</text><text x="372" y="188">6</text>
    <text x="424" y="188">7</text><text x="476" y="188">8</text><text x="528" y="188">9</text>
    <text x="580" y="188">10</text>
  </g>
  <text x="52" y="217" fill="#5c6b76" font-size="11.5">prev_end:</text>
  <g fill="#ffffff" stroke="#4169E1" stroke-width="1.2">
    <rect x="140" y="202" width="48" height="22"/><rect x="192" y="202" width="48" height="22"/>
    <rect x="556" y="202" width="48" height="22"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">
    <text x="164" y="217">pe = 2</text><text x="216" y="217">pe = 3</text><text x="580" y="217">pe = 10</text>
  </g>
  <text x="320" y="260" text-anchor="middle" fill="#1a2026" font-size="13">Sweeping the sorted intervals, prev_end runs 2 → 3; [4,10] then starts</text>
  <text x="320" y="280" text-anchor="middle" fill="#1a2026" font-size="13">beyond it, exposing the one finite gap <tspan fill="#4169E1" font-weight="600">[3,4]</tspan>; [5,6] merges into prev_end 10.</text>
</svg>
