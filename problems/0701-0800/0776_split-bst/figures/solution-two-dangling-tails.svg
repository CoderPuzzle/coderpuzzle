<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- root = [4,2,6,1,3,5,7], target = 2; the walk visits 4, 2, 3;
       dashed edges 4-2 and 2-3 are the unhookings; results: small = [2,1], large = [4,3,6,null,null,5,7];
       the accent edge 4-3 in the large tree is the fresh link where 3 takes 2's old place -->
  <text x="340" y="22" text-anchor="middle" fill="#5c6b76" font-size="12.5">target = 2 — the walk visits 4, 2, 3</text>
  <!-- original tree edges -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="354.1" y1="57.5" x2="435.9" y2="100.5"/>
    <line x1="219" y1="119.6" x2="186" y2="154.4"/>
    <line x1="439" y1="119.6" x2="406" y2="154.4"/>
    <line x1="461" y1="119.6" x2="494" y2="154.4"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4">
    <line x1="325.9" y1="57.5" x2="244.1" y2="100.5"/>
    <line x1="241" y1="119.6" x2="274" y2="154.4"/>
  </g>
  <!-- original tree nodes -->
  <g stroke-width="1.6">
    <circle cx="340" cy="50" r="16" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="230" cy="108" r="16" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="450" cy="108" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="175" cy="166" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="285" cy="166" r="16" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="395" cy="166" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="505" cy="166" r="16" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="340" y="55" font-weight="600">4</text><text x="230" y="113" font-weight="600">2</text>
    <text x="450" y="113">6</text><text x="175" y="171">1</text><text x="285" y="171" font-weight="600">3</text>
    <text x="395" y="171">5</text><text x="505" y="171">7</text>
  </g>
  <text x="362" y="45" text-anchor="start" fill="#4169E1" font-size="11">→ large</text>
  <text x="204" y="113" text-anchor="end" fill="#4169E1" font-size="11">≤ 2 → small</text>
  <text x="307" y="171" text-anchor="start" fill="#4169E1" font-size="11">→ large</text>
  <!-- threading arrows to the two results -->
  <path d="M 238 122 Q 190 185 156 244" fill="none" stroke="#5c6b76" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 354 64 Q 440 150 462 240" fill="none" stroke="#5c6b76" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- small result tree -->
  <text x="150" y="262" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">small (≤ 2)</text>
  <line x1="139.2" y1="303.8" x2="105.9" y2="340.2" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="150" cy="292" r="16" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="95" cy="352" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="150" y="297" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <text x="95" y="357" text-anchor="middle" fill="#1a2026">1</text>
  <!-- large result tree -->
  <text x="470" y="262" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">large (&gt; 2)</text>
  <line x1="446.6" y1="300.7" x2="378.4" y2="345.3" stroke="#4169E1" stroke-width="1.8"/>
  <line x1="473.4" y1="300.7" x2="541.6" y2="345.3" stroke="#42525e" stroke-width="1.6"/>
  <line x1="544.7" y1="366.3" x2="515.3" y2="401.7" stroke="#42525e" stroke-width="1.6"/>
  <line x1="565.3" y1="366.3" x2="594.7" y2="401.7" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="460" cy="292" r="16" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="365" cy="354" r="16" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="555" cy="354" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="505" cy="414" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="605" cy="414" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" fill="#1a2026">
    <text x="460" y="297" font-weight="600">4</text><text x="365" y="359" font-weight="600">3</text>
    <text x="555" y="359">6</text><text x="505" y="419">5</text><text x="605" y="419">7</text>
  </g>
  <text x="320" y="470" text-anchor="middle" fill="#1a2026" font-size="13">The walk 4 → 2 → 3 unhooks each visited node to its side — 2 threads onto the small</text>
  <text x="320" y="488" text-anchor="middle" fill="#1a2026" font-size="13">spine <tspan fill="#4169E1" font-weight="600">[2,1]</tspan>, 4 and 3 onto the large spine <tspan fill="#4169E1" font-weight="600">[4,3,6,null,null,5,7]</tspan>; off-path subtrees never move.</text>
</svg>
