<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="278" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- temperatures = [73,74,75,71,69,72,76,73]; cells w54 at x = 70 + 54i, temps y 78-114, answer y 150-182; snapshot as day 6 (76) pops waiting days 5 and 2; stack bottom-to-top shown right -->
  <text x="24" y="101" fill="#5c6b76" font-size="12">temps</text>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="70" y="78" width="54" height="36" fill="#ffffff"/>
    <rect x="124" y="78" width="54" height="36" fill="#ffffff"/>
    <rect x="178" y="78" width="54" height="36" fill="#dbe4fb"/>
    <rect x="232" y="78" width="54" height="36" fill="#ffffff"/>
    <rect x="286" y="78" width="54" height="36" fill="#ffffff"/>
    <rect x="340" y="78" width="54" height="36" fill="#dbe4fb"/>
    <rect x="394" y="78" width="54" height="36" fill="#4169E1"/>
    <rect x="448" y="78" width="54" height="36" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="97" y="101" fill="#1a2026">73</text>
    <text x="151" y="101" fill="#1a2026">74</text>
    <text x="205" y="101" fill="#1a2026">75</text>
    <text x="259" y="101" fill="#1a2026">71</text>
    <text x="313" y="101" fill="#1a2026">69</text>
    <text x="367" y="101" fill="#1a2026">72</text>
    <text x="421" y="101" fill="#ffffff">76</text>
    <text x="475" y="101" fill="#1a2026">73</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="97" y="134">i=0</text><text x="151" y="134">i=1</text><text x="205" y="134">i=2</text><text x="259" y="134">i=3</text><text x="313" y="134">i=4</text><text x="367" y="134">i=5</text><text x="421" y="134">i=6</text><text x="475" y="134">i=7</text>
  </g>
  <text x="24" y="170" fill="#5c6b76" font-size="12">answer</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="70" y="150" width="54" height="32"/><rect x="124" y="150" width="54" height="32"/>
    <rect x="178" y="150" width="54" height="32"/><rect x="232" y="150" width="54" height="32"/>
    <rect x="286" y="150" width="54" height="32"/><rect x="340" y="150" width="54" height="32"/>
    <rect x="394" y="150" width="54" height="32"/><rect x="448" y="150" width="54" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="97" y="170" fill="#1a2026">1</text>
    <text x="151" y="170" fill="#1a2026">1</text>
    <text x="205" y="170" fill="#4169E1">4</text>
    <text x="259" y="170" fill="#1a2026">2</text>
    <text x="313" y="170" fill="#1a2026">1</text>
    <text x="367" y="170" fill="#4169E1">1</text>
    <text x="421" y="170" fill="#9aa7b2">0</text>
    <text x="475" y="170" fill="#9aa7b2">0</text>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="1.6">
    <path d="M 413 74 Q 394 52 375 74" marker-end="url(#arrow)"/>
    <path d="M 421 74 Q 313 10 213 74" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">
    <text x="394" y="46">6 - 5 = 1</text>
    <text x="313" y="30">6 - 2 = 4</text>
  </g>
  <text x="610" y="60" text-anchor="middle" fill="#5c6b76" font-size="12">waiting stack</text>
  <text x="610" y="84" text-anchor="middle" fill="#5c6b76" font-size="10.5">before day 6</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4" stroke-dasharray="4 3">
    <rect x="574" y="92" width="72" height="30"/>
    <rect x="574" y="124" width="72" height="30"/>
  </g>
  <g text-anchor="middle" font-size="11.5">
    <text x="610" y="111" fill="#1a2026">day 5 · 72</text>
    <text x="610" y="143" fill="#1a2026">day 2 · 75</text>
  </g>
  <text x="610" y="186" text-anchor="middle" fill="#5c6b76" font-size="10.5">after day 6</text>
  <rect x="574" y="194" width="72" height="30" fill="#4169E1"/>
  <text x="610" y="213" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">day 6 · 76</text>
  <text x="340" y="244" text-anchor="middle" fill="#1a2026" font-size="13">Day 6's 76 pops the waiting days 5 (72) and 2 (75): <tspan fill="#4169E1" font-weight="600">ans[5] = 1, ans[2] = 4</tspan>.</text>
  <text x="340" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Days 6 and 7 wait to the end — no warmer day follows, so <tspan fill="#4169E1" font-weight="600">ans[6] = ans[7] = 0</tspan>.</text>
</svg>
