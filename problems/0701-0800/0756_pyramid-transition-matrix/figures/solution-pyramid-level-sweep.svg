<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- bottom = "BCD", allowed = ["BCC","CDE","CEA","FFF"]; blocks 40x40, pyramid centred x=170; pair-mask table at x=360; alive-row sweep chips at y=250 -->
  <text x="170" y="76" text-anchor="middle" fill="#5c6b76" font-size="12">bottom = "BCD"</text>
  <g stroke="#9aa7b2" stroke-width="1.2">
    <line x1="162" y1="134" x2="148" y2="142"/><line x1="178" y1="134" x2="192" y2="142"/>
    <line x1="138" y1="182" x2="126" y2="190"/><line x1="158" y1="182" x2="170" y2="190"/>
    <line x1="182" y1="182" x2="170" y2="190"/><line x1="202" y1="182" x2="214" y2="190"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="106" y="190" width="40" height="40"/><rect x="150" y="190" width="40" height="40"/><rect x="194" y="190" width="40" height="40"/>
    <rect x="128" y="142" width="40" height="40"/><rect x="172" y="142" width="40" height="40"/>
    <rect x="150" y="94" width="40" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="126" y="215">B</text><text x="170" y="215">C</text><text x="214" y="215">D</text>
    <text x="148" y="167">C</text><text x="192" y="167">E</text>
    <text x="170" y="119">A</text>
  </g>
  <text x="360" y="86" fill="#5c6b76" font-size="12">pair masks</text>
  <g font-size="13.5" fill="#1a2026">
    <text x="360" y="120">(B,C) → <tspan fill="#4169E1" font-weight="600">C</tspan></text>
    <text x="360" y="150">(C,D) → <tspan fill="#4169E1" font-weight="600">E</tspan></text>
    <text x="360" y="180">(C,E) → <tspan fill="#4169E1" font-weight="600">A</tspan></text>
  </g>
  <text x="360" y="210" font-size="13.5" fill="#9aa7b2">(F,F) → F</text>
  <text x="452" y="210" font-size="11.5" fill="#9aa7b2">unreached — no F appears</text>
  <text x="60" y="268" fill="#5c6b76" font-size="12.5">sweep:</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="110" y="250" width="52" height="26"/><rect x="206" y="250" width="44" height="26"/>
    <rect x="294" y="250" width="36" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="136" y="268">BCD</text><text x="228" y="268">CE</text><text x="312" y="268">A</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 168 263 H 200" marker-end="url(#arrow)"/>
    <path d="M 256 263 H 288" marker-end="url(#arrow)"/>
  </g>
  <text x="376" y="268" fill="#4169E1" font-size="13.5" font-weight="600">true</text>
  <text x="310" y="304" text-anchor="middle" fill="#1a2026" font-size="13">Level two's only alive row is CE — (B,C) stacks C and (C,D) stacks E — and</text>
  <text x="310" y="324" text-anchor="middle" fill="#1a2026" font-size="13">CE lifts to the apex A; FFF is never reached, so the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
