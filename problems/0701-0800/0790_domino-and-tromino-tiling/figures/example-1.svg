<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- board template: 3 cols x 2 rows of 32px cells -->
  <!-- 1: three vertical dominoes -->
  <g stroke="#1a2026" stroke-width="1.5">
    <rect x="40" y="50" width="32" height="64" fill="#dbe4fb"/>
    <rect x="72" y="50" width="32" height="64" fill="#f6e8d3"/>
    <rect x="104" y="50" width="32" height="64" fill="#dbe4fb"/>
  </g>
  <!-- 2: vertical + two horizontals -->
  <g stroke="#1a2026" stroke-width="1.5">
    <rect x="190" y="50" width="32" height="64" fill="#dbe4fb"/>
    <rect x="222" y="50" width="64" height="32" fill="#f6e8d3"/>
    <rect x="222" y="82" width="64" height="32" fill="#ffffff"/>
  </g>
  <!-- 3: two horizontals + vertical -->
  <g stroke="#1a2026" stroke-width="1.5">
    <rect x="340" y="50" width="64" height="32" fill="#f6e8d3"/>
    <rect x="340" y="82" width="64" height="32" fill="#ffffff"/>
    <rect x="404" y="50" width="32" height="64" fill="#dbe4fb"/>
  </g>
  <!-- 4: tromino pair -->
  <g stroke="#1a2026" stroke-width="1.5">
    <path d="M 115 170 h 64 v 32 h -32 v 32 h -32 z" fill="#f6e8d3"/>
    <path d="M 179 170 H 211 V 234 H 147 V 202 H 179 Z" fill="#ffffff"/>
  </g>
  <!-- 5: mirrored tromino pair -->
  <g stroke="#1a2026" stroke-width="1.5">
    <path d="M 265 170 h 32 v 32 h 32 v 32 h -64 z" fill="#f6e8d3"/>
    <path d="M 297 170 h 64 v 64 h -32 v -32 h -32 z" fill="#ffffff"/>
  </g>
  <text x="230" y="288" text-anchor="middle" fill="#1a2026" font-size="12.5">the five tilings of a 2 x 3 board (n = 3)</text>
</svg>
