<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- domino: two unit squares -->
  <g stroke="#1a2026" stroke-width="1.6">
    <rect x="60" y="50" width="96" height="48" fill="#dbe4fb"/>
    <line x1="108" y1="50" x2="108" y2="98"/>
  </g>
  <text x="108" y="130" text-anchor="middle" fill="#1a2026" font-size="13">domino (2 x 1)</text>
  <!-- tromino: L shape -->
  <path d="M 240 50 h 96 v 48 h -48 v 48 h -48 z" fill="#f6e8d3" stroke="#1a2026" stroke-width="1.6"/>
  <text x="288" y="178" text-anchor="middle" fill="#1a2026" font-size="13">tromino (L)</text>
  <text x="210" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">both shapes may be rotated</text>
</svg>
