<text x="40" y="46" fill="#5c6b76" font-size="12">The five tilings of the 2 &#215; 3 board (n = 3): the first uses only dominoes &#8212; three</text>
  <text x="40" y="64" fill="#5c6b76" font-size="12">vertical, or a horizontal pair beside a vertical one on either side &#8212; and the last</text>
  <text x="40" y="82" fill="#5c6b76" font-size="12">two pair two trominoes in mirrored arrangements. f(0)=1, f(1)=1, f(2)=2, f(3)=5.</text>
