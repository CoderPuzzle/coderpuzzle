<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="130" y1="60" x2="330" y2="60"/>
    <line x1="330" y1="60" x2="330" y2="210"/>
    <line x1="330" y1="210" x2="130" y2="210"/>
    <line x1="130" y1="210" x2="130" y2="60"/>
  </g>
  <line x1="130" y1="60" x2="330" y2="210" stroke="#b57f30" stroke-width="2.6"/>
  <g stroke="#b57f30" stroke-width="2.2">
    <line x1="222" y1="127" x2="238" y2="143"/>
    <line x1="238" y1="127" x2="222" y2="143"/>
  </g>
  <g font-weight="600" text-anchor="middle">
    <circle cx="130" cy="60" r="19" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="130" y="65" fill="#1a2026">0</text>
    <circle cx="330" cy="60" r="19" fill="#f6e8d3" stroke="#b57f30" stroke-width="2"/>
    <text x="330" y="65" fill="#1a2026">1</text>
    <circle cx="330" cy="210" r="19" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="330" y="215" fill="#1a2026">2</text>
    <circle cx="130" cy="210" r="19" fill="#f6e8d3" stroke="#b57f30" stroke-width="2"/>
    <text x="130" y="215" fill="#1a2026">3</text>
  </g>
  <text x="230" y="256" text-anchor="middle" fill="#1a2026" font-size="12.5">edge 0–2 forces two neighbors of both 1 and 3 into one set —</text>
  <text x="230" y="274" text-anchor="middle" fill="#1a2026" font-size="12.5">the coloring cannot be completed, so the graph is not bipartite</text>
</svg>
