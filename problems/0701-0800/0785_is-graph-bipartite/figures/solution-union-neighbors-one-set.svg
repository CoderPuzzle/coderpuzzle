<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <!-- graph = [[1,2,3],[0,2],[0,1,3],[0,2]]; nodes r=16:
       0 (110,90), 1 (230,110), 2 (210,240), 3 (85,220);
       accent triangle 0-1-2 = the odd cycle; union log on the right shows the
       neighbors of 0 merging ({1,2} then {1,2,3}) and node 1's union pulling 0 in -->
  <!-- gray edges 2-3, 3-0 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="194.2" y1="237.5" x2="100.8" y2="222.5"/>
    <line x1="88" y1="204.3" x2="107" y2="98.7"/>
  </g>
  <!-- accent triangle 0-1-2 -->
  <g stroke="#4169E1" stroke-width="2.2">
    <line x1="125.8" y1="92.6" x2="214.2" y2="107.4"/>
    <line x1="227.6" y1="125.8" x2="212.4" y2="224.2"/>
    <line x1="118.9" y1="103.3" x2="201.1" y2="226.7"/>
  </g>
  <text x="170" y="76" text-anchor="middle" fill="#5c6b76" font-size="11.5">odd cycle 0-1-2</text>
  <!-- nodes -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="110" cy="90" r="16"/><circle cx="230" cy="110" r="16"/>
    <circle cx="210" cy="240" r="16"/><circle cx="85" cy="220" r="16"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="110" y="95">0</text><text x="230" y="115">1</text><text x="210" y="245">2</text><text x="85" y="225">3</text>
  </g>
  <!-- union log -->
  <text x="480" y="66" text-anchor="middle" fill="#5c6b76" font-size="12.5">union each node's neighbors</text>
  <text x="330" y="102" text-anchor="start" fill="#1a2026" font-size="13">u=0: union(1, 2)</text>
  <rect x="470" y="86" width="56" height="22" rx="5" fill="#dbe4fb"/>
  <text x="498" y="102" text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">{1,2}</text>
  <text x="330" y="142" text-anchor="start" fill="#1a2026" font-size="13">u=0: union(1, 3)</text>
  <rect x="470" y="126" width="68" height="22" rx="5" fill="#dbe4fb"/>
  <text x="504" y="142" text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">{1,2,3}</text>
  <text x="330" y="182" text-anchor="start" fill="#1a2026" font-size="13">u=1: union(0, 2)</text>
  <rect x="470" y="166" width="82" height="22" rx="5" fill="#dbe4fb"/>
  <text x="511" y="182" text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">{0,1,2,3}</text>
  <text x="330" y="208" text-anchor="start" fill="#9aa7b2" font-size="10.5">u=2 and u=3: unions find both ends already joined</text>
  <text x="480" y="246" text-anchor="middle" fill="#1a2026" font-size="13">scan: find(0) == find(1), same set → <tspan fill="#4169E1" font-weight="600">false</tspan></text>
  <text x="320" y="292" text-anchor="middle" fill="#1a2026" font-size="13">Unioning neighbors fuses {1,2,3}, then pulls 0 in — all four nodes share one set,</text>
  <text x="320" y="310" text-anchor="middle" fill="#1a2026" font-size="13">so edge 0-1 fails the scan — the triangle 0-1-2 is an odd cycle; <tspan fill="#4169E1" font-weight="600">not bipartite</tspan>.</text>
</svg>
