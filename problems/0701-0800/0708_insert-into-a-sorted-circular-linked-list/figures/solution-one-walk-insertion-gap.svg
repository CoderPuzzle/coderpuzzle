<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- ring [3,4,1] from statement Example 1, insertVal 2; nodes r24 at 3(330,56) 4(403,182) 1(257,182); arcs bulge 45px -->
  <!-- walked pairs: 3->4 and 4->1 solid, 1->3 dashed = the gap found -->
  <g fill="none" stroke="#42525e" stroke-width="1.6">
    <path d="M 345 82 Q 403 93 384 149" marker-end="url(#arrow)"/>
    <line x1="373" y1="182" x2="293" y2="182" marker-end="url(#arrow)"/>
  </g>
  <path d="M 272 156 Q 253 98 313 85" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <!-- insertion arrow: new node 2 into the 1->3 gap -->
  <line x1="178" y1="110" x2="256" y2="110" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <!-- ring nodes -->
  <circle cx="403" cy="182" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="257" cy="182" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="330" cy="56" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="330" cy="56" r="30" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="16" font-weight="600" fill="#1a2026">
    <text x="403" y="188">4</text>
    <text x="257" y="188">1</text>
    <text x="330" y="62">3</text>
  </g>
  <!-- new node 2 -->
  <circle cx="150" cy="110" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="150" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#4169E1">2</text>
  <text x="150" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">insert 2</text>
  <text x="330" y="18" text-anchor="middle" font-size="12" fill="#5c6b76">given node — the one returned</text>
  <!-- per-pair gap tests -->
  <g font-size="12" fill="#5c6b76">
    <text x="420" y="102">3→4: 3 ≤ 2 fails</text>
    <text x="330" y="224" text-anchor="middle">4→1: 2 ≥ 4? 2 ≤ 1? no</text>
    <text x="250" y="156" text-anchor="end" fill="#4169E1" font-weight="600">stop: 1 ≤ 2 ≤ 3</text>
  </g>
  <text x="330" y="262" text-anchor="middle" font-size="13" fill="#1a2026">One lap from node 3 with insertVal 2: (3,4) fails 3 ≤ 2 and wrap (4,1)</text>
  <text x="330" y="280" text-anchor="middle" font-size="13" fill="#1a2026">fails both extremes; the first fit <tspan fill="#4169E1" font-weight="600">1 ≤ 2 ≤ 3</tspan> splices 2 in, node 3 returned.</text>
</svg>
