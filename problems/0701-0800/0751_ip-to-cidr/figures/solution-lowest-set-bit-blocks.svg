<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 192" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="192" fill="#ffffff"/>
  <!-- ip = 255.0.0.7 (x = 4278190087), n = 10; cells 44x30 at (90,52), cell i shows address .(7+i); brackets mark the three emitted blocks of sizes 1, 8, 1 -->
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="112" y="34">255.0.0.7/32</text>
    <text x="310" y="34">255.0.0.8/29</text>
    <text x="508" y="34">255.0.0.16/32</text>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="1.5">
    <path d="M 90 40 V 46 H 134 V 40"/>
    <path d="M 134 40 V 46 H 486 V 40"/>
    <path d="M 486 40 V 46 H 530 V 40"/>
  </g>
  <text x="86" y="71" text-anchor="end" fill="#5c6b76" font-size="12">255.0.0</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#dbe4fb">
    <rect x="90" y="52" width="44" height="30"/><rect x="134" y="52" width="44" height="30"/>
    <rect x="178" y="52" width="44" height="30"/><rect x="222" y="52" width="44" height="30"/>
    <rect x="266" y="52" width="44" height="30"/><rect x="310" y="52" width="44" height="30"/>
    <rect x="354" y="52" width="44" height="30"/><rect x="398" y="52" width="44" height="30"/>
    <rect x="442" y="52" width="44" height="30"/><rect x="486" y="52" width="44" height="30"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="112" y="71">.7</text><text x="156" y="71">.8</text><text x="200" y="71">.9</text>
    <text x="244" y="71">.10</text><text x="288" y="71">.11</text><text x="332" y="71">.12</text>
    <text x="376" y="71">.13</text><text x="420" y="71">.14</text><text x="464" y="71">.15</text>
    <text x="508" y="71">.16</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="112" y="100">start …00000111 → low bit <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="310" y="100">start …00001000 → low bit <tspan fill="#4169E1" font-weight="600">8</tspan></text>
    <text x="508" y="100">start …00010000 → low bit <tspan fill="#4169E1" font-weight="600">16</tspan></text>
    <text x="508" y="116">16, 8, 4, 2 all exceed n = 1 → <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  </g>
  <text x="320" y="148" text-anchor="middle" fill="#1a2026" font-size="13">Each block's size = the start's lowest set bit, halved while it exceeds the owed count.</text>
  <text x="320" y="166" text-anchor="middle" fill="#1a2026" font-size="13">n = 10 splits as <tspan fill="#4169E1" font-weight="600">1 + 8 + 1</tspan>: blocks 7/32, 8/29, 16/32 cover exactly .7 – .16.</text>
</svg>
