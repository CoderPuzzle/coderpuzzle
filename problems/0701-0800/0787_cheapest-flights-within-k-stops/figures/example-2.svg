<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 0 -> 2 (500) -->
  <line x1="211" y1="66" x2="289" y2="184" stroke="#1a2026" stroke-width="1.8" marker-end="url(#aI)"/>
  <text x="272" y="112" text-anchor="middle" fill="#1a2026" font-size="12.5">500</text>
  <!-- 0 -> 1 (100), optimal leg -->
  <line x1="189" y1="66" x2="111" y2="184" stroke="#4169E1" stroke-width="3" marker-end="url(#aA)"/>
  <text x="128" y="112" text-anchor="middle" fill="#4169E1" font-size="12.5">100</text>
  <!-- 1 -> 2 (100), optimal leg -->
  <line x1="119" y1="200" x2="281" y2="200" stroke="#4169E1" stroke-width="3" marker-end="url(#aA)"/>
  <text x="200" y="222" text-anchor="middle" fill="#4169E1" font-size="12.5">100</text>
  <g font-weight="600" text-anchor="middle">
    <circle cx="200" cy="50" r="19" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="200" y="55" fill="#1a2026">0</text>
    <circle cx="100" cy="200" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
    <text x="100" y="205" fill="#1a2026">1</text>
    <circle cx="300" cy="200" r="19" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="300" y="205" fill="#1a2026">2</text>
  </g>
  <text x="200" y="266" text-anchor="middle" fill="#1a2026" font-size="12.5">0 → 1 → 2 costs 100 + 100 = 200 with 1 stop</text>
</svg>
