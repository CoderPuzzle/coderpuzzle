<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- flights = [[0,1,100],[1,2,100],[2,0,100],[1,3,600],[2,3,200]]; src 0, dst 3, k = 1; circles r 22; dashed = over budget -->
  <!-- legend -->
  <line x1="52" y1="36" x2="92" y2="36" stroke="#4169E1" stroke-width="2.5"/>
  <text x="100" y="40" fill="#5c6b76" font-size="12">within budget</text>
  <line x1="196" y1="36" x2="236" y2="36" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="244" y="40" fill="#5c6b76" font-size="12">over k = 1 budget</text>
  <!-- edges -->
  <g fill="none">
    <path d="M 114.1 160.3 L 262.1 101.1" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 314.8 97.8 L 516.4 161.0" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 290 116 L 290 259" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>
    <path d="M 313.7 274.3 L 517.6 182.3" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>
    <path d="M 267.5 272.0 L 116.0 185.0" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrowm)"/>
  </g>
  <!-- edge prices -->
  <g text-anchor="middle" font-size="12.5">
    <text x="176" y="122" fill="#1a2026">100</text>
    <text x="417.5" y="118" fill="#4169E1" font-weight="600">600</text>
    <text x="312" y="192" fill="#5c6b76">100</text>
    <text x="425.7" y="246" fill="#5c6b76">200</text>
    <text x="178" y="243" fill="#5c6b76">100</text>
  </g>
  <!-- city nodes -->
  <g stroke-width="1.5">
    <circle cx="90" cy="170" r="22" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="290" cy="90" r="22" fill="#ffffff" stroke="#42525e"/>
    <circle cx="290" cy="285" r="22" fill="#ffffff" stroke="#42525e"/>
    <circle cx="545" cy="170" r="22" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="600" fill="#1a2026">
    <text x="90" y="175.5">0</text><text x="290" y="95.5">1</text>
    <text x="290" y="290.5">2</text><text x="545" y="175.5">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="90" y="212">src</text><text x="545" y="212">dst</text>
  </g>
  <!-- bottom annotations: rejected walk and the frozen state -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="165" y="322">0&#8594;1&#8594;2&#8594;3: 100+100+200 = 400,</text>
    <text x="165" y="340">but 2 stops &gt; k = 1 &#8212; rejected</text>
    <text x="445" y="322">pop (200, 2, 2): 2 = k + 1 flights,</text>
    <text x="445" y="340">so 2&#8594;3 is never boarded</text>
  </g>
  <text x="320" y="372" text-anchor="middle" fill="#1a2026" font-size="13">In cost order the 400 walk dies at state (200, 2, 2) with no budget left,</text>
  <text x="320" y="390" text-anchor="middle" fill="#1a2026" font-size="13">so the first dst pop is (700, 3, 2) &#8212; answer 100 + 600 = <tspan fill="#4169E1" font-weight="600">700</tspan>.</text>
</svg>
