<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 2 -> 3 (200) -->
  <line x1="361" y1="200" x2="259" y2="200" stroke="#1a2026" stroke-width="1.8" marker-end="url(#aI)"/>
  <text x="310" y="192" text-anchor="middle" fill="#1a2026" font-size="12.5">200</text>
  <!-- 2 -> 0 (100), routed below node 3 -->
  <path d="M 361 212 Q 240 258 119 212" fill="none" stroke="#1a2026" stroke-width="1.8" marker-end="url(#aI)"/>
  <text x="240" y="256" text-anchor="middle" fill="#1a2026" font-size="12.5">100</text>
  <!-- 1 -> 2 (100) -->
  <line x1="253" y1="64" x2="362" y2="180" stroke="#1a2026" stroke-width="1.8" marker-end="url(#aI)"/>
  <text x="326" y="112" text-anchor="middle" fill="#1a2026" font-size="12.5">100</text>
  <!-- 0 -> 1 (100), optimal leg -->
  <line x1="113" y1="186" x2="221" y2="70" stroke="#4169E1" stroke-width="3" marker-end="url(#aA)"/>
  <text x="148" y="112" text-anchor="middle" fill="#4169E1" font-size="12.5">100</text>
  <!-- 1 -> 3 (600), optimal leg -->
  <line x1="240" y1="69" x2="240" y2="181" stroke="#4169E1" stroke-width="3" marker-end="url(#aA)"/>
  <text x="250" y="130" fill="#4169E1" font-size="12.5">600</text>
  <g font-weight="600" text-anchor="middle">
    <circle cx="100" cy="200" r="19" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="100" y="205" fill="#1a2026">0</text>
    <circle cx="240" cy="50" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
    <text x="240" y="55" fill="#1a2026">1</text>
    <circle cx="380" cy="200" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
    <text x="380" y="205" fill="#1a2026">2</text>
    <circle cx="240" cy="200" r="19" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="240" y="205" fill="#1a2026">3</text>
  </g>
  <text x="100" y="238" text-anchor="middle" fill="#5c6b76" font-size="12.5">src</text>
  <text x="240" y="238" text-anchor="middle" fill="#5c6b76" font-size="12.5">dst</text>
  <text x="240" y="296" text-anchor="middle" fill="#1a2026" font-size="12.5">0 → 1 → 3 costs 100 + 600 = 700 with 1 stop</text>
</svg>
