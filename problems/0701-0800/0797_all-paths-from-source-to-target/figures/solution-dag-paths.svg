<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<line x1="110.42295738638853" y1="77.55791145828769" x2="71.49245113633376" y2="148.93050625005478" stroke="#4169E1" stroke-width="1.6"  marker-end="url(#arrowB)"/>
  <line x1="129.57704261361147" y1="77.55791145828769" x2="168.50754886366624" y2="148.93050625005478" stroke="#4169E1" stroke-width="1.6"  marker-end="url(#arrowB)"/>
  <line x1="70.28991510855053" y1="187.1498585142509" x2="107.65210186973937" y2="249.42016978289894" stroke="#4169E1" stroke-width="1.6"  marker-end="url(#arrowB)"/>
  <line x1="169.71008489144947" y1="187.1498585142509" x2="132.34789813026063" y2="249.42016978289894" stroke="#4169E1" stroke-width="1.6"  marker-end="url(#arrowB)"/>
  <circle cx="120" cy="60" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="120" y="65" text-anchor="middle" font-weight="600">0</text>
  <circle cx="60" cy="170" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="60" y="175" text-anchor="middle" font-weight="600">1</text>
  <circle cx="180" cy="170" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="180" y="175" text-anchor="middle" font-weight="600">2</text>
  <circle cx="120" cy="270" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="120" y="275" text-anchor="middle" font-weight="600">3</text>
  <text x="230" y="150" fill="#4169E1" font-size="12">path 0 &#8594; 1 &#8594; 3</text>
  <text x="230" y="196" fill="#4169E1" font-size="12">path 0 &#8594; 2 &#8594; 3</text>
  <text x="40" y="322" fill="#5c6b76" font-size="12">DFS carries the current path in a list; arriving at node 3 snapshots a copy,</text>
  <text x="40" y="340" fill="#5c6b76" font-size="12">and backtracking pops the last node before trying the next neighbor.</text>
</svg>
