  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- path 0-1-3 -->
  <line x1="159" y1="60" x2="321" y2="60" stroke="#4169E1" stroke-width="2.6" marker-end="url(#aA)"/>
  <line x1="340" y1="79" x2="340" y2="191" stroke="#4169E1" stroke-width="2.6" marker-end="url(#aA)"/>
  <!-- path 0-2-3 -->
