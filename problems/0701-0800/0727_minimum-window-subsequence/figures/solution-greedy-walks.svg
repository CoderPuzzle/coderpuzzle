<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="306" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s1 = abcdebdde, s2 = bde; cells 40x34 at x = 116 + 46i, y = 110;
       walk 1: 1 -hop d-> 3 -hop e-> 4 = "bcde" (len 4); walk 2: 5 -> 6 -> 8 = "bdde" (len 4);
       tie at 4 keeps the left-most window -->
  <text x="116" y="48" fill="#5c6b76" font-size="12.5">s2 = "bde"</text>
  <text x="251" y="36" text-anchor="middle" fill="#1a2026" font-size="12.5">opening i = 1 → window <tspan fill="#4169E1" font-weight="600">"bcde"</tspan>, length 4 — first best</text>
  <!-- s1 cells -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="116" y="110" width="40" height="34" fill="#ffffff"/>
    <rect x="162" y="110" width="40" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.4"/>
    <rect x="208" y="110" width="40" height="34" fill="#dbe4fb"/>
    <rect x="254" y="110" width="40" height="34" fill="#dbe4fb"/>
    <rect x="300" y="110" width="40" height="34" fill="#dbe4fb"/>
    <rect x="346" y="110" width="40" height="34" fill="#f0f3f7" stroke="#4169E1" stroke-width="2.4"/>
    <rect x="392" y="110" width="40" height="34" fill="#f0f3f7"/>
    <rect x="438" y="110" width="40" height="34" fill="#f0f3f7"/>
    <rect x="484" y="110" width="40" height="34" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="136" y="132">a</text><text x="182" y="132">b</text><text x="228" y="132">c</text><text x="274" y="132">d</text>
    <text x="320" y="132">e</text><text x="366" y="132">b</text><text x="412" y="132">d</text><text x="458" y="132">d</text>
    <text x="504" y="132">e</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="136" y="160">0</text><text x="182" y="160">1</text><text x="228" y="160">2</text><text x="274" y="160">3</text>
    <text x="320" y="160">4</text><text x="366" y="160">5</text><text x="412" y="160">6</text><text x="458" y="160">7</text>
    <text x="504" y="160">8</text>
  </g>
  <!-- walk 1 hops (above) -->
  <path d="M 182 104 Q 228 66 274 104" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 274 104 Q 297 60 320 104" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <circle cx="228" cy="66" r="9.5" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="228" y="70.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4169E1">d</text>
    <circle cx="297" cy="57" r="9.5" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="297" y="61.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4169E1">e</text>
  </g>
  <!-- walk 2 hops (below) -->
  <path d="M 366 166 Q 389 204 412 166" fill="none" stroke="#5c6b76" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 412 166 Q 458 204 504 166" fill="none" stroke="#5c6b76" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <circle cx="389" cy="199" r="9.5" fill="#ffffff" stroke="#5c6b76" stroke-width="1.6"/>
    <text x="389" y="203.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5c6b76">d</text>
    <circle cx="458" cy="201" r="9.5" fill="#ffffff" stroke="#5c6b76" stroke-width="1.6"/>
    <text x="458" y="205.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5c6b76">e</text>
  </g>
  <text x="435" y="228" text-anchor="middle" fill="#5c6b76" font-size="12.5">opening i = 5 → window "bdde", also length 4 — not strictly shorter</text>
  <text x="320" y="268" text-anchor="middle" fill="#1a2026" font-size="13">Greedy hops from each b land on the next 'd', then 'e': <tspan fill="#4169E1" font-weight="600">"bcde"</tspan> at i = 1, "bdde" at i = 5 — both 4.</text>
  <text x="320" y="288" text-anchor="middle" fill="#1a2026" font-size="13">Only a strictly shorter window replaces the best, so the left-most <tspan fill="#4169E1" font-weight="600">"bcde"</tspan> wins.</text>
</svg>
