<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 168" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="74" y="36">move 0</text><text x="202" y="36">move 1</text><text x="330" y="36">move 2</text>
    <text x="458" y="36">move 3</text><text x="586" y="36">move 4</text><text x="714" y="36">move 5</text>
  </g>
  <!-- boards: 2x3, tile 36px; row0 y=50, row1 y=86 -->
  <g font-size="14" text-anchor="middle" font-weight="600" fill="#1a2026">
    <!-- move 0: 4 1 2 / 5 0 3 -->
    <g stroke="#1a2026" stroke-width="1.4">
      <rect x="20" y="50" width="108" height="72" fill="none"/>
      <line x1="56" y1="50" x2="56" y2="122"/><line x1="92" y1="50" x2="92" y2="122"/><line x1="20" y1="86" x2="128" y2="86"/>
      <rect x="56" y="86" width="36" height="36" fill="#dbe4fb"/>
    </g>
    <text x="38" y="72">4</text><text x="74" y="72">1</text><text x="110" y="72">2</text>
    <text x="38" y="108">5</text><text x="74" y="108">0</text><text x="110" y="108">3</text>
    <!-- move 1: 4 1 2 / 0 5 3 -->
    <g stroke="#1a2026" stroke-width="1.4">
      <rect x="148" y="50" width="108" height="72" fill="none"/>
      <line x1="184" y1="50" x2="184" y2="122"/><line x1="220" y1="50" x2="220" y2="122"/><line x1="148" y1="86" x2="256" y2="86"/>
      <rect x="148" y="86" width="36" height="36" fill="#dbe4fb"/>
    </g>
    <text x="166" y="72">4</text><text x="202" y="72">1</text><text x="238" y="72">2</text>
    <text x="166" y="108">0</text><text x="202" y="108">5</text><text x="238" y="108">3</text>
    <!-- move 2: 0 1 2 / 4 5 3 -->
    <g stroke="#1a2026" stroke-width="1.4">
      <rect x="276" y="50" width="108" height="72" fill="none"/>
      <line x1="312" y1="50" x2="312" y2="122"/><line x1="348" y1="50" x2="348" y2="122"/><line x1="276" y1="86" x2="384" y2="86"/>
      <rect x="276" y="50" width="36" height="36" fill="#dbe4fb"/>
    </g>
    <text x="294" y="72">0</text><text x="330" y="72">1</text><text x="366" y="72">2</text>
    <text x="294" y="108">4</text><text x="330" y="108">5</text><text x="366" y="108">3</text>
    <!-- move 3: 1 0 2 / 4 5 3 -->
    <g stroke="#1a2026" stroke-width="1.4">
      <rect x="404" y="50" width="108" height="72" fill="none"/>
      <line x1="440" y1="50" x2="440" y2="122"/><line x1="476" y1="50" x2="476" y2="122"/><line x1="404" y1="86" x2="512" y2="86"/>
      <rect x="440" y="50" width="36" height="36" fill="#dbe4fb"/>
    </g>
    <text x="422" y="72">1</text><text x="458" y="72">0</text><text x="494" y="72">2</text>
    <text x="422" y="108">4</text><text x="458" y="108">5</text><text x="494" y="108">3</text>
    <!-- move 4: 1 2 0 / 4 5 3 -->
    <g stroke="#1a2026" stroke-width="1.4">
      <rect x="532" y="50" width="108" height="72" fill="none"/>
      <line x1="568" y1="50" x2="568" y2="122"/><line x1="604" y1="50" x2="604" y2="122"/><line x1="532" y1="86" x2="640" y2="86"/>
      <rect x="604" y="50" width="36" height="36" fill="#dbe4fb"/>
    </g>
    <text x="550" y="72">1</text><text x="586" y="72">2</text><text x="622" y="72">0</text>
    <text x="550" y="108">4</text><text x="586" y="108">5</text><text x="622" y="108">3</text>
    <!-- move 5: 1 2 3 / 4 5 0 -->
    <g stroke="#1a2026" stroke-width="1.4">
      <rect x="660" y="50" width="108" height="72" fill="none"/>
      <line x1="696" y1="50" x2="696" y2="122"/><line x1="732" y1="50" x2="732" y2="122"/><line x1="660" y1="86" x2="768" y2="86"/>
      <rect x="732" y="86" width="36" height="36" fill="#dbe4fb"/>
    </g>
    <text x="678" y="72">1</text><text x="714" y="72">2</text><text x="750" y="72">3</text>
    <text x="678" y="108">4</text><text x="714" y="108">5</text><text x="750" y="108">0</text>
  </g>
  <g stroke="#1a2026" stroke-width="1.4">
    <line x1="132" y1="86" x2="144" y2="86" marker-end="url(#aI)"/>
    <line x1="260" y1="86" x2="272" y2="86" marker-end="url(#aI)"/>
    <line x1="388" y1="86" x2="400" y2="86" marker-end="url(#aI)"/>
    <line x1="516" y1="86" x2="528" y2="86" marker-end="url(#aI)"/>
    <line x1="644" y1="86" x2="656" y2="86" marker-end="url(#aI)"/>
  </g>
  <text x="400" y="152" text-anchor="middle" fill="#1a2026" font-size="13">5 moves reach the solved board (the 0 tile is shaded)</text>
</svg>
