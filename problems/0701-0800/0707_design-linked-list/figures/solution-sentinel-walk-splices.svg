<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="404" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- ops: addAtHead(1) addAtTail(3) addAtIndex(1,2) deleteAtIndex(1) on a sentinel-headed chain -->
  <!-- rows y=40+78i; cells 40x30 at x=160+66i; walk arcs end on the pred cell; row 4 unlinks the muted 2 -->
  <text x="544" y="22" text-anchor="end" fill="#9aa7b2" font-size="11.5">S = sentinel head</text>
  <!-- op 1: addAtHead(1) = addAtIndex(0,1), walk 0, splice behind S -->
  <text x="16" y="52" fill="#1a2026" font-size="12.5" font-weight="600">addAtHead(1)</text>
  <text x="16" y="67" fill="#9aa7b2" font-size="11">= addAtIndex(0, 1)</text>
  <text x="180" y="30" text-anchor="middle" fill="#4169E1" font-size="11.5">walk 0 → pred = S</text>
  <rect x="160" y="40" width="40" height="30" fill="#f0f3f7" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="226" y="40" width="40" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="180" y="60">S</text><text x="246" y="60">1</text>
  </g>
  <line x1="203" y1="55" x2="222" y2="55" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="269" y1="55" x2="288" y2="55" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="299" y="61" fill="#9aa7b2" font-size="13">∅</text>
  <text x="480" y="61" fill="#9aa7b2" font-size="12">size 1</text>
  <!-- op 2: addAtTail(3) = addAtIndex(1,3), walk 1 to the 1-cell -->
  <text x="16" y="130" fill="#1a2026" font-size="12.5" font-weight="600">addAtTail(3)</text>
  <text x="16" y="145" fill="#9aa7b2" font-size="11">= addAtIndex(1, 3)</text>
  <path d="M 180 112 Q 213 92 246 112" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="213" y="96" text-anchor="middle" fill="#4169E1" font-size="11.5">walk 1</text>
  <rect x="160" y="118" width="40" height="30" fill="#f0f3f7" stroke="#42525e" stroke-width="1.4"/>
  <rect x="226" y="118" width="40" height="30" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="292" y="118" width="40" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="180" y="138">S</text><text x="246" y="138">1</text><text x="312" y="138">3</text>
  </g>
  <line x1="203" y1="133" x2="222" y2="133" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="269" y1="133" x2="288" y2="133" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="335" y1="133" x2="354" y2="133" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="139" fill="#9aa7b2" font-size="13">∅</text>
  <text x="480" y="139" fill="#9aa7b2" font-size="12">size 2</text>
  <!-- op 3: addAtIndex(1,2), walk 1, splice the new 2 behind the 1-cell -->
  <text x="16" y="208" fill="#1a2026" font-size="12.5" font-weight="600">addAtIndex(1, 2)</text>
  <text x="16" y="223" fill="#9aa7b2" font-size="11">walk 1, then splice</text>
  <path d="M 180 190 Q 213 170 246 190" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="213" y="174" text-anchor="middle" fill="#4169E1" font-size="11.5">walk 1</text>
  <rect x="160" y="196" width="40" height="30" fill="#f0f3f7" stroke="#42525e" stroke-width="1.4"/>
  <rect x="226" y="196" width="40" height="30" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="292" y="196" width="40" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="358" y="196" width="40" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="180" y="216">S</text><text x="246" y="216">1</text><text x="312" y="216">2</text><text x="378" y="216">3</text>
  </g>
  <line x1="203" y1="211" x2="222" y2="211" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="269" y1="211" x2="288" y2="211" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="335" y1="211" x2="354" y2="211" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="401" y1="211" x2="420" y2="211" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="431" y="217" fill="#9aa7b2" font-size="13">∅</text>
  <text x="480" y="217" fill="#9aa7b2" font-size="12">size 3</text>
  <!-- op 4: deleteAtIndex(1), walk 1, unlink the 2; the 1-cell now points straight to the 3 -->
  <text x="16" y="286" fill="#1a2026" font-size="12.5" font-weight="600">deleteAtIndex(1)</text>
  <text x="16" y="301" fill="#9aa7b2" font-size="11">walk 1, then unlink</text>
  <path d="M 180 268 Q 213 248 246 268" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="213" y="252" text-anchor="middle" fill="#4169E1" font-size="11.5">walk 1</text>
  <rect x="160" y="274" width="40" height="30" fill="#f0f3f7" stroke="#42525e" stroke-width="1.4"/>
  <rect x="226" y="274" width="40" height="30" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="292" y="274" width="40" height="30" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="358" y="274" width="40" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="180" y="294" fill="#1a2026">S</text><text x="246" y="294" fill="#1a2026">1</text>
    <text x="312" y="294" fill="#9aa7b2">2</text><text x="378" y="294" fill="#1a2026">3</text>
  </g>
  <line x1="203" y1="289" x2="222" y2="289" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="269" y1="289" x2="288" y2="289" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="335" y1="289" x2="354" y2="289" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="401" y1="289" x2="420" y2="289" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="431" y="295" fill="#9aa7b2" font-size="13">∅</text>
  <path d="M 246 308 Q 312 336 378 308" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="480" y="295" fill="#9aa7b2" font-size="12">size 2</text>
  <text x="280" y="366" text-anchor="middle" fill="#1a2026" font-size="13">All three inserts funnel through addAtIndex and the same walk;</text>
  <text x="280" y="386" text-anchor="middle" fill="#1a2026" font-size="13">the chain grows to <tspan fill="#4169E1" font-weight="600">1-2-3</tspan>, then deleteAtIndex(1) severs it back to <tspan fill="#4169E1" font-weight="600">1-3</tspan>.</text>
</svg>
