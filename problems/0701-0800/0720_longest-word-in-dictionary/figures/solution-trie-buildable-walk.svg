<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="304" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- words = [a, banana, app, appl, ap, apply, apple]; spine a-p-p-l with e/y branches, ringed = ends a word, walk order 1..6; b-node pruned -->
  <circle cx="48" cy="26" r="9" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <circle cx="48" cy="26" r="5.5" fill="none" stroke="#4169E1" stroke-width="1"/>
  <text x="64" y="30" fill="#5c6b76" font-size="11">ring = ends a word</text>
  <circle cx="46" cy="110" r="13" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <g>
    <circle cx="126" cy="110" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="206" cy="110" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="286" cy="110" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="366" cy="110" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="466" cy="66" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="466" cy="154" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="1">
    <circle cx="126" cy="110" r="12"/><circle cx="206" cy="110" r="12"/><circle cx="286" cy="110" r="12"/>
    <circle cx="366" cy="110" r="12"/><circle cx="466" cy="66" r="12"/><circle cx="466" cy="154" r="12"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="126" y="114.5">a</text><text x="206" y="114.5">p</text><text x="286" y="114.5">p</text>
    <text x="366" y="114.5">l</text><text x="466" y="70.5">e</text><text x="466" y="158.5">y</text>
  </g>
  <g text-anchor="middle" font-size="10" font-weight="600" fill="#4169E1">
    <text x="126" y="86">1</text><text x="206" y="86">2</text><text x="286" y="86">3</text>
    <text x="366" y="86">4</text><text x="466" y="42">5</text><text x="466" y="130">6</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <line x1="61" y1="110" x2="105" y2="110" marker-end="url(#arrowA)"/>
    <line x1="145" y1="110" x2="185" y2="110" marker-end="url(#arrowA)"/>
    <line x1="225" y1="110" x2="265" y2="110" marker-end="url(#arrowA)"/>
    <line x1="305" y1="110" x2="345" y2="110" marker-end="url(#arrowA)"/>
    <line x1="382" y1="103" x2="446" y2="74" marker-end="url(#arrowA)"/>
    <line x1="382" y1="117" x2="446" y2="146" marker-end="url(#arrowA)"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="126" y="146">a</text><text x="206" y="146">ap</text><text x="286" y="146">app</text><text x="366" y="146">appl</text>
  </g>
  <text x="466" y="102" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4169E1">apple · 5</text>
  <text x="466" y="190" text-anchor="middle" font-size="11.5" fill="#5c6b76">apply · 5</text>
  <rect x="516" y="56" width="86" height="24" rx="12" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
  <text x="559" y="72" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4169E1">answer</text>
  <line x1="514" y1="68" x2="487" y2="67" stroke="#4169E1" stroke-width="1.2"/>
  <circle cx="136" cy="200" r="17" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="136" y="204.5" text-anchor="middle" font-size="13.5" fill="#9aa7b2">b</text>
  <line x1="55" y1="119" x2="122" y2="188" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g stroke="#9aa7b2" stroke-width="1.5">
    <line x1="83" y1="148" x2="93" y2="158"/><line x1="93" y1="148" x2="83" y2="158"/>
  </g>
  <circle cx="216" cy="200" r="15" fill="none" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="216" y="204.5" text-anchor="middle" font-size="12" fill="#9aa7b2">…</text>
  <line x1="153" y1="200" x2="198" y2="200" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="176" y="244" text-anchor="middle" font-size="11.5" fill="#9aa7b2">'b' ends no word — banana is never entered</text>
  <text x="320" y="272" text-anchor="middle" font-size="13" fill="#1a2026">The walk descends only through word-ending nodes — a, ap, app, appl, apple, apply.</text>
  <text x="320" y="290" text-anchor="middle" font-size="13" fill="#1a2026">Both reach length 5; <tspan fill="#4169E1" font-weight="600">apple</tspan> stays — lexicographically smaller than apply.</text>
</svg>
