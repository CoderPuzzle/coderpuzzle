<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- formula K4(ON(SO3)2)2; stack bottom→top {K:4}, {O:1,N:1}, {S:1,O:3};
       ')' folds ×2 then ×2 → bottom {K:4,N:2,O:14,S:4}; boxes 210x46 at x=48 -->
  <text x="330" y="42" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2026">K4<tspan fill="#5c6b76" font-weight="400">(</tspan>ON<tspan fill="#4169E1">(</tspan>SO3<tspan fill="#4169E1">)</tspan><tspan fill="#5c6b76" font-weight="400">2</tspan><tspan fill="#5c6b76" font-weight="400">)</tspan><tspan fill="#5c6b76" font-weight="400">2</tspan></text>
  <text x="48" y="76" fill="#5c6b76" font-size="11.5">inner map when (SO3) closes</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="48" y="82" width="210" height="46" rx="8"/>
  </g>
  <text x="153" y="111" text-anchor="middle" font-size="14.5" fill="#1a2026"><tspan font-weight="600">S</tspan> 1&#160;&#160;&#160;<tspan font-weight="600">O</tspan> 3</text>
  <text x="48" y="152" fill="#5c6b76" font-size="11.5">outer map after that fold</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="48" y="158" width="210" height="46" rx="8"/>
  </g>
  <text x="153" y="187" text-anchor="middle" font-size="14.5" fill="#1a2026"><tspan font-weight="600">O</tspan> 7&#160;&#160;&#160;<tspan font-weight="600">N</tspan> 1&#160;&#160;&#160;<tspan font-weight="600">S</tspan> 2</text>
  <text x="48" y="228" fill="#5c6b76" font-size="11.5">bottom map after the last fold</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="48" y="234" width="210" height="46" rx="8"/>
  </g>
  <text x="153" y="263" text-anchor="middle" font-size="14.5" fill="#1a2026"><tspan font-weight="600">K</tspan> <tspan fill="#4169E1" font-weight="600">4</tspan>&#160;&#160;&#160;<tspan font-weight="600">N</tspan> <tspan fill="#4169E1" font-weight="600">2</tspan>&#160;&#160;&#160;<tspan font-weight="600">O</tspan> <tspan fill="#4169E1" font-weight="600">14</tspan>&#160;&#160;&#160;<tspan font-weight="600">S</tspan> <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  <!-- the two folds -->
  <path d="M 230 130 L 230 152" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 230 206 L 230 228" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="242" y="146" fill="#4169E1" font-size="11.5" font-weight="600">pop, × 2</text>
  <text x="242" y="222" fill="#4169E1" font-size="11.5" font-weight="600">pop, × 2</text>
  <!-- fold arithmetic -->
  <text x="330" y="118" fill="#1a2026" font-size="12.5">close (SO3)2: S 1·2 = 2, O 3·2 = 6 — the outer</text>
  <text x="330" y="136" fill="#1a2026" font-size="12.5">map sums them in: O 1 + 6 = <tspan fill="#4169E1" font-weight="600">7</tspan>, N 1, S 2</text>
  <text x="330" y="196" fill="#1a2026" font-size="12.5">close the outer group ×2: O 7·2 = <tspan fill="#4169E1" font-weight="600">14</tspan>,</text>
  <text x="330" y="214" fill="#1a2026" font-size="12.5">N 1·2 = 2, S 2·2 = 4 — added beside K 4</text>
  <text x="330" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Two closing parens, two folds: (SO3)2 doubles S and O into the outer map — O 1 + 6 = 7,</text>
  <text x="330" y="324" text-anchor="middle" fill="#1a2026" font-size="13">then ×2 doubles it again; the bottom map sorts to <tspan fill="#4169E1" font-weight="600">K4 N2 O14 S4</tspan>.</text>
</svg>
