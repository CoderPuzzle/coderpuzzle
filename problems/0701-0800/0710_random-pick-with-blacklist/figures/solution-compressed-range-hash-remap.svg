<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="296" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 7, blacklist [2,3,5]; cells 64x52, x = 72 + 76i, y = 90; split edge at x = 370 -->
  <!-- split at n - b = 4 -->
  <line x1="370" y1="52" x2="370" y2="86" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="370" y="42" text-anchor="middle" font-size="12" fill="#5c6b76">n − b = 4</text>
  <!-- cells 0..6; blacklisted 2,3,5 inactive -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="72" y="90" width="64" height="52"/><rect x="148" y="90" width="64" height="52"/>
    <rect x="376" y="90" width="64" height="52"/><rect x="528" y="90" width="64" height="52"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="#f0f3f7">
    <rect x="224" y="90" width="64" height="52"/><rect x="300" y="90" width="64" height="52"/>
    <rect x="452" y="90" width="64" height="52"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="600">
    <text x="104" y="122" fill="#1a2026">0</text><text x="180" y="122" fill="#1a2026">1</text>
    <text x="256" y="122" fill="#9aa7b2">2</text><text x="332" y="122" fill="#9aa7b2">3</text>
    <text x="408" y="122" fill="#1a2026">4</text><text x="484" y="122" fill="#9aa7b2">5</text>
    <text x="560" y="122" fill="#1a2026">6</text>
  </g>
  <text x="218" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">pick draws over [0, 4)</text>
  <!-- remap arrows onto the free upper values -->
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 256 146 Q 330 196 404 146" marker-end="url(#arrowA)"/>
    <path d="M 332 146 Q 444 226 552 146" marker-end="url(#arrowA)"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="330" y="198">2 → 4</text>
    <text x="444" y="216">3 → 6</text>
  </g>
  <text x="320" y="252" text-anchor="middle" font-size="13" fill="#1a2026">Constructor remap for n = 7, blacklist [2,3,5]: low black 2, 3 take free</text>
  <text x="320" y="270" text-anchor="middle" font-size="13" fill="#1a2026">upper <tspan fill="#4169E1" font-weight="600">4, 6</tspan>, so one uniform draw over <tspan fill="#4169E1" font-weight="600">[0, 4)</tspan> returns only 0, 1, 4, 6.</text>
</svg>
