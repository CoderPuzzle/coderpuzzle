<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="384" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- x(v) = 110 + (v-10)*44; add [10,20) = bar 110..550; remove [14,16) leaves [10,14) and [16,20); query spans at y=216/256/296 -->
  <line x1="100" y1="40" x2="566" y2="40" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="110" y1="40" x2="110" y2="45"/><line x1="154" y1="40" x2="154" y2="45"/><line x1="198" y1="40" x2="198" y2="45"/>
    <line x1="242" y1="40" x2="242" y2="45"/><line x1="286" y1="40" x2="286" y2="45"/><line x1="330" y1="40" x2="330" y2="45"/>
    <line x1="374" y1="40" x2="374" y2="45"/><line x1="418" y1="40" x2="418" y2="45"/><line x1="462" y1="40" x2="462" y2="45"/>
    <line x1="506" y1="40" x2="506" y2="45"/><line x1="550" y1="40" x2="550" y2="45"/>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="110" y="58" fill="#5c6b76">10</text><text x="154" y="58" fill="#9aa7b2">11</text><text x="198" y="58" fill="#9aa7b2">12</text>
    <text x="242" y="58" fill="#9aa7b2">13</text><text x="286" y="58" fill="#5c6b76">14</text><text x="330" y="58" fill="#9aa7b2">15</text>
    <text x="374" y="58" fill="#5c6b76">16</text><text x="418" y="58" fill="#9aa7b2">17</text><text x="462" y="58" fill="#9aa7b2">18</text>
    <text x="506" y="58" fill="#9aa7b2">19</text><text x="550" y="58" fill="#5c6b76">20</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1" stroke-dasharray="2 4">
    <line x1="286" y1="68" x2="286" y2="185"/><line x1="374" y1="68" x2="374" y2="185"/><line x1="550" y1="68" x2="550" y2="185"/>
  </g>
  <text x="110" y="84" fill="#5c6b76" font-size="12.5">addRange(10, 20)</text>
  <rect x="110" y="90" width="440" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="330" y="108" text-anchor="middle" font-weight="600" fill="#1a2026">[10, 20)</text>
  <text x="110" y="140" fill="#5c6b76" font-size="12.5">removeRange(14, 16)</text>
  <rect x="110" y="152" width="176" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="286" y="152" width="88" height="26" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="374" y="152" width="176" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="198" y="169" text-anchor="middle" font-weight="600" fill="#1a2026">[10, 14)</text>
  <text x="330" y="169" text-anchor="middle" font-size="11" fill="#9aa7b2">[14, 16)</text>
  <text x="462" y="169" text-anchor="middle" font-weight="600" fill="#1a2026">[16, 20)</text>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="110" y1="216" x2="286" y2="216"/><line x1="110" y1="211" x2="110" y2="221"/><line x1="286" y1="211" x2="286" y2="221"/>
  </g>
  <text x="110" y="240" font-size="12.5" fill="#1a2026">queryRange(10, 14): [10, 14) contains it, 14 ≥ 14 → <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <g stroke="#9aa7b2" stroke-width="2.5">
    <line x1="242" y1="256" x2="330" y2="256"/><line x1="242" y1="251" x2="242" y2="261"/><line x1="330" y1="251" x2="330" y2="261"/>
  </g>
  <text x="110" y="280" font-size="12.5" fill="#1a2026">queryRange(13, 15): [10, 14) ends at 14 &lt; 15 → <tspan fill="#9aa7b2" font-weight="600">false</tspan></text>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="374" y1="296" x2="418" y2="296"/><line x1="374" y1="291" x2="374" y2="301"/><line x1="418" y1="291" x2="418" y2="301"/>
  </g>
  <text x="110" y="320" font-size="12.5" fill="#1a2026">queryRange(16, 17): [16, 20) contains it, 20 ≥ 17 → <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="320" y="348" text-anchor="middle" font-size="13" fill="#1a2026">Remove keeps the form canonical: [10, 20) minus [14, 16) is [10, 14) ∪ [16, 20),</text>
  <text x="320" y="366" text-anchor="middle" font-size="13" fill="#1a2026">so each query is answered by containment in a <tspan fill="#4169E1" font-weight="600">single stored interval</tspan>.</text>
</svg>
