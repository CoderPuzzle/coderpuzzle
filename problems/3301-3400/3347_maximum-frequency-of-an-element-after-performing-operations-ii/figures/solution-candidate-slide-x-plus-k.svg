<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,4,5], k = 1; x(v) = 60 + 70v; hollow dots = candidates x-k, x, x+k
       (union 0..6); bands = windows of v = 4 and v = 5 = 4 + k; solid dots = members 4, 5 -->
  <text x="340" y="44" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">v = 4: window {4, 5} scores min(2, 1 + 2) = 2</text>
  <rect x="270" y="52" width="140" height="18" rx="8" stroke="#4169E1" stroke-width="1.25" fill="#dbe4fb"/>
  <circle cx="340" cy="61" r="4.5" fill="#4169E1"/>
  <circle cx="410" cy="61" r="4.5" fill="#4169E1"/>
  <text x="410" y="88" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">v = 5 = 4 + k keeps {4, 5} → 2</text>
  <rect x="340" y="96" width="140" height="18" rx="8" stroke="#4169E1" stroke-width="1.25" fill="#dbe4fb"/>
  <circle cx="340" cy="105" r="4.5" fill="#4169E1"/>
  <circle cx="410" cy="105" r="4.5" fill="#4169E1"/>
  <!-- slide connector from the v = 4 window to the v = 5 window -->
  <path d="M 414 61 L 514 61 L 514 105 L 486 105" fill="none" stroke="#4169E1" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="522" y="86" fill="#4169E1" font-size="12" font-weight="600">slide to x + k = 5</text>
  <text x="40" y="132" fill="#5c6b76" font-size="11.5">candidates: for each x, x − k, x, and x + k</text>
  <!-- candidate dots at 0..6 -->
  <g stroke="#4169E1" stroke-width="1.5" fill="#ffffff">
    <circle cx="60" cy="146" r="4.5"/><circle cx="130" cy="146" r="4.5"/><circle cx="200" cy="146" r="4.5"/>
    <circle cx="270" cy="146" r="4.5"/><circle cx="340" cy="146" r="4.5"/><circle cx="410" cy="146" r="4.5"/>
    <circle cx="480" cy="146" r="4.5"/>
  </g>
  <!-- number line with the elements -->
  <line x1="40" y1="170" x2="580" y2="170" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.25">
    <line x1="60" y1="170" x2="60" y2="176"/><line x1="130" y1="170" x2="130" y2="176"/>
    <line x1="200" y1="170" x2="200" y2="176"/><line x1="270" y1="170" x2="270" y2="176"/>
    <line x1="340" y1="170" x2="340" y2="176"/><line x1="410" y1="170" x2="410" y2="176"/>
    <line x1="480" y1="170" x2="480" y2="176"/><line x1="550" y1="170" x2="550" y2="176"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="60" y="192">0</text><text x="130" y="192">1</text><text x="200" y="192">2</text>
    <text x="270" y="192">3</text><text x="340" y="192">4</text><text x="410" y="192">5</text>
    <text x="480" y="192">6</text><text x="550" y="192">7</text>
  </g>
  <g fill="#4169E1">
    <circle cx="130" cy="170" r="9"/><circle cx="340" cy="170" r="9"/><circle cx="410" cy="170" r="9"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">
    <text x="130" y="174">1</text><text x="340" y="174">4</text><text x="410" y="174">5</text>
  </g>
  <text x="320" y="226" text-anchor="middle" fill="#1a2026" font-size="13">Sliding the target from v = 4 up to x + k = 5 keeps both members {4, 5};</text>
  <text x="320" y="244" text-anchor="middle" fill="#1a2026" font-size="13">both targets score min(window 2, count 1 + 2 operations) = <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
