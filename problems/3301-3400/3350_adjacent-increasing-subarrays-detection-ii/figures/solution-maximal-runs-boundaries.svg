<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 248" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="248" fill="#ffffff"/>
  <!-- nums = [2,5,7,8,9,2,3,4,3,1]; maximal runs [2,5,7,8,9] len 5, [2,3,4] len 3, [3] len 1, [1] len 1; cells 48x42, run1 x=44+54i, run2 x=326+54i, run3 x=500, run4 x=566 -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="44" y="44" width="48" height="42" fill="#dbe4fb"/><rect x="98" y="44" width="48" height="42" fill="#dbe4fb"/><rect x="152" y="44" width="48" height="42" fill="#dbe4fb"/><rect x="206" y="44" width="48" height="42" fill="#dbe4fb"/><rect x="260" y="44" width="48" height="42" fill="#dbe4fb"/>
    <rect x="326" y="44" width="48" height="42" fill="#dbe4fb"/><rect x="380" y="44" width="48" height="42" fill="#dbe4fb"/><rect x="434" y="44" width="48" height="42" fill="#dbe4fb"/>
    <rect x="500" y="44" width="48" height="42" fill="#f0f3f7"/>
    <rect x="566" y="44" width="48" height="42" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="14.5">
    <text x="68" y="70">2</text><text x="122" y="70">5</text><text x="176" y="70">7</text><text x="230" y="70">8</text><text x="284" y="70">9</text>
    <text x="350" y="70">2</text><text x="404" y="70">3</text><text x="458" y="70">4</text>
    <text x="524" y="70">3</text><text x="590" y="70">1</text>
  </g>
  <!-- descents between runs (the 9 to 2 boundary is the dashed answer line) -->
  <g stroke="#9aa7b2" stroke-width="1.5">
    <path d="M 486 60 L 496 70"/><path d="M 486 70 L 496 60"/>
    <path d="M 552 60 L 562 70"/><path d="M 552 70 L 562 60"/>
  </g>
  <path d="M 317 38 V 108" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="176" y="110">len 5</text><text x="404" y="110">len 3</text><text x="524" y="110">len 1</text><text x="590" y="110">len 1</text>
  </g>
  <!-- windows straddling the 9 -> 2 descent -->
  <rect x="149" y="120" width="162" height="3" fill="#4169E1"/>
  <rect x="323" y="120" width="162" height="3" fill="#4169E1"/>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="230" y="138">[7,8,9]</text><text x="404" y="138">[2,3,4]</text>
  </g>
  <text x="330" y="168" text-anchor="middle" fill="#1a2026" font-size="13">across boundaries: min(5,3) = <tspan fill="#4169E1" font-weight="600">3</tspan>, min(3,1) = 1, min(1,1) = 1</text>
  <text x="330" y="188" text-anchor="middle" fill="#1a2026" font-size="13">inside a run: 5 // 2 = 2 — answer = max(2, <tspan fill="#4169E1" font-weight="600">3</tspan>, 1, 1) = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="330" y="216" text-anchor="middle" fill="#1a2026" font-size="13">The windows [7,8,9] and [2,3,4] straddle the 9 → 2 descent,</text>
  <text x="330" y="236" text-anchor="middle" fill="#1a2026" font-size="13">so k = min(prev, cur) = min(5, 3) = <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
