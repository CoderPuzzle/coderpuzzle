<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="276" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,4,5], k = 1, numOperations = 2; x(v) = 60 + 70v; bars = each element's
       reach [v-k, v+k]; shaded band = window [3,5] of target v = 4 over the axis -->
  <text x="340" y="24" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">target v = 4, window [3, 5]</text>
  <path d="M 272 34 L 408 34" fill="none" stroke="#4169E1" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="270" y="44" width="140" height="142" fill="#dbe4fb" opacity="0.45"/>
  <!-- reach bars -->
  <g stroke="#4169E1" stroke-width="1.25" fill="#dbe4fb">
    <rect x="60" y="48" width="140" height="16" rx="8"/>
    <rect x="270" y="88" width="140" height="16" rx="8"/>
    <rect x="340" y="128" width="140" height="16" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="11.5">
    <text x="130" y="60">1: [0, 2]</text>
    <text x="340" y="100">4: [3, 5]</text>
    <text x="410" y="140">5: [4, 6]</text>
  </g>
  <!-- number line with the elements -->
  <line x1="40" y1="185" x2="580" y2="185" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.25">
    <line x1="60" y1="185" x2="60" y2="191"/><line x1="130" y1="185" x2="130" y2="191"/>
    <line x1="200" y1="185" x2="200" y2="191"/><line x1="270" y1="185" x2="270" y2="191"/>
    <line x1="340" y1="185" x2="340" y2="191"/><line x1="410" y1="185" x2="410" y2="191"/>
    <line x1="480" y1="185" x2="480" y2="191"/><line x1="550" y1="185" x2="550" y2="191"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="60" y="207">0</text><text x="130" y="207">1</text><text x="200" y="207">2</text>
    <text x="270" y="207">3</text><text x="340" y="207">4</text><text x="410" y="207">5</text>
    <text x="480" y="207">6</text><text x="550" y="207">7</text>
  </g>
  <g fill="#4169E1">
    <circle cx="130" cy="185" r="8"/><circle cx="340" cy="185" r="8"/><circle cx="410" cy="185" r="8"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">
    <text x="130" y="189">1</text><text x="340" y="189">4</text><text x="410" y="189">5</text>
  </g>
  <text x="320" y="240" text-anchor="middle" fill="#1a2026" font-size="13">Both 4 and 5 lie in [3, 5], so window(4) = 2 while count(4) = 1;</text>
  <text x="320" y="258" text-anchor="middle" fill="#1a2026" font-size="13">frequency = min(2, 1 + 2) = <tspan fill="#4169E1" font-weight="600">2</tspan> — pull 5 onto 4 with one operation.</text>
</svg>
