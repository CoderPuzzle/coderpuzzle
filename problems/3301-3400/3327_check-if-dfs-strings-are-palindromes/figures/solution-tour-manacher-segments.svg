    <text x="196" y="149">3</text><text x="268" y="149">4</text><text x="408" y="149">5</text>
  </g>
  <text x="320" y="164" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">n0 [0..5]: "abaaba" — p[6] = 6 ≥ 6, palindrome</text>
  <path d="M 113 170 L 113 175 L 527 175 L 527 170" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="215" y="188" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">n1 [0..2]: p[3] = 3 ≥ 3</text>
  <text x="390" y="188" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">n2 [3..4]: p[8] = 0 &lt; 2</text>
  <path d="M 113 193 L 113 198 L 317 198 L 317 193" fill="none" stroke="#4169E1" stroke-width="2"/>
  <path d="M 323 193 L 323 198 L 457 198 L 457 193" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="113" y="206" width="64" height="36" fill="#dbe4fb"/>
    <rect x="183" y="206" width="64" height="36" fill="#dbe4fb"/>
    <rect x="253" y="206" width="64" height="36" fill="#dbe4fb"/>
    <rect x="323" y="206" width="64" height="36" fill="#dbe4fb"/>
    <rect x="393" y="206" width="64" height="36" fill="#dbe4fb"/>
    <rect x="463" y="206" width="64" height="36" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="145" y="229">a</text><text x="215" y="229">b</text><text x="285" y="229">a</text>
    <text x="355" y="229">a</text><text x="425" y="229">b</text><text x="495" y="229">a</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
