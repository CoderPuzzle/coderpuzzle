    <rect x="412" y="300" width="32" height="28"/><rect x="484" y="300" width="32" height="28"/>
  </g>
  <rect x="304" y="300" width="32" height="28" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-size="12.5" fill="#9aa7b2">
    <text x="104" y="318">#</text><text x="176" y="318">#</text><text x="248" y="318">#</text>
    <text x="320" y="318">#</text><text x="392" y="318">#</text><text x="464" y="318">#</text><text x="536" y="318">#</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="140" y="318">a</text><text x="212" y="318">b</text><text x="284" y="318">a</text>
    <text x="356" y="318">a</text><text x="428" y="318">b</text><text x="500" y="318">a</text>
  </g>
  <text x="76" y="348" text-anchor="end" fill="#5c6b76" font-size="11">p =</text>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="104" y="348">0</text><text x="140" y="348">1</text><text x="176" y="348">0</text>
    <text x="212" y="348" fill="#4169E1" font-weight="600" font-size="12">3</text><text x="248" y="348">0</text><text x="284" y="348">1</text>
    <text x="320" y="348" fill="#4169E1" font-weight="600" font-size="12">6</text><text x="356" y="348">1</text>
    <text x="392" y="348" fill="#1a2026" font-weight="600" font-size="12">0</text><text x="428" y="348">3</text>
    <text x="464" y="348">0</text><text x="500" y="348">1</text><text x="536" y="348">0</text>
  </g>
  <text x="320" y="374" text-anchor="middle" fill="#1a2026" font-size="13">Each subtree is one tour segment, a palindrome when its radius covers its length:</text>
  <text x="320" y="391" text-anchor="middle" fill="#1a2026" font-size="13">"aba": p = 3 ≥ 3. "abaaba": p = 6 ≥ 6. "ab": p = 0 &lt; 2 — <tspan fill="#4169E1" font-weight="600">only n2 is false</tspan>.</text>
</svg>
