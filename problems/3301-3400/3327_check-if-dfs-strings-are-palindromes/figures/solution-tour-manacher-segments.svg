<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="404" fill="#ffffff"/>
  <!-- parent [-1,0,0,1,1,2], s = "aababa"; dfs(0) tour "abaaba" written by nodes 3,4,1,5,2,0; tour cells 64x36 at x = 113 + 70i, y = 206; tinted cells = n1's and n2's subtree segments; Manacher t-cells 32x28 at x = 88 + 36i, y = 300 with radii p underneath -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="320" y1="34" x2="232" y2="78"/><line x1="320" y1="34" x2="408" y2="78"/>
    <line x1="232" y1="78" x2="196" y2="122"/><line x1="232" y1="78" x2="268" y2="122"/>
    <line x1="408" y1="78" x2="408" y2="122"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="320" cy="34" r="13"/><circle cx="232" cy="78" r="13"/><circle cx="408" cy="78" r="13"/>
    <circle cx="196" cy="122" r="13"/><circle cx="268" cy="122" r="13"/><circle cx="408" cy="122" r="13"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="320" y="38">a</text><text x="232" y="82">a</text><text x="408" y="82">b</text>
    <text x="196" y="126">a</text><text x="268" y="126">b</text><text x="408" y="126">a</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
