    <text x="355" y="262">n5</text><text x="425" y="262">n2</text><text x="495" y="262">n0</text>
  </g>
  <text x="320" y="290" text-anchor="middle" fill="#5c6b76" font-size="12">Manacher on "#a#b#a#a#b#a#" — palindrome radius p at each center</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#f0f3f7">
    <rect x="88" y="300" width="32" height="28"/><rect x="160" y="300" width="32" height="28"/><rect x="232" y="300" width="32" height="28"/>
    <rect x="304" y="300" width="32" height="28"/><rect x="376" y="300" width="32" height="28"/><rect x="448" y="300" width="32" height="28"/><rect x="520" y="300" width="32" height="28"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
