<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="296" fill="#ffffff"/>
  <!-- nums = [2,0,2], queries = [[0,2],[0,2],[1,1]]; kept queries[0..1] cover (2,2,2); queries[2] = [1,1] dropped; demand cells 64x34 at x = 140+72i y=44; bars h=24 at y=96/132/168 -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="172" y="34">0</text><text x="244" y="34">1</text><text x="316" y="34">2</text>
  </g>
  <text x="16" y="66" fill="#5c6b76" font-size="12.5">demand = nums</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="140" y="44" width="64" height="34" fill="#ffffff"/><rect x="212" y="44" width="64" height="34" fill="#f0f3f7"/><rect x="284" y="44" width="64" height="34" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="14.5">
    <text x="172" y="66" fill="#1a2026">2</text><text x="244" y="66" fill="#9aa7b2">0</text><text x="316" y="66" fill="#1a2026">2</text>
  </g>
  <!-- query bars: kept ones accent-tinted, dropped one dashed -->
  <g fill="#5c6b76" font-size="12.5" text-anchor="end">
    <text x="132" y="112">queries[0]</text><text x="132" y="148">queries[1]</text><text x="132" y="184">queries[2]</text>
  </g>
  <rect x="140" y="96" width="208" height="24" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <rect x="140" y="132" width="208" height="24" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <rect x="212" y="168" width="64" height="24" rx="6" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">
    <text x="244" y="112">[0,2]</text><text x="244" y="148">[0,2]</text>
  </g>
  <text x="244" y="184" text-anchor="middle" fill="#9aa7b2" font-size="12.5">[1,1]</text>
  <g fill="#4169E1" font-size="12">
    <text x="360" y="112">kept</text><text x="360" y="148">kept</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.6">
    <path d="M 288 176 L 296 184"/><path d="M 288 184 L 296 176"/>
  </g>
  <text x="304" y="184" fill="#9aa7b2" font-size="12">dropped</text>
  <line x1="40" y1="210" x2="600" y2="210" stroke="#dbe4fb" stroke-width="1.4"/>
  <text x="16" y="234" fill="#5c6b76" font-size="12.5">coverage by kept</text>
  <g text-anchor="middle" fill="#4169E1" font-size="14" font-weight="600">
    <text x="172" y="234">2</text><text x="244" y="234">2</text><text x="316" y="234">2</text>
  </g>
  <text x="360" y="234" fill="#5c6b76" font-size="12.5">≥ demand (2, 0, 2) at every index</text>
  <text x="320" y="264" text-anchor="middle" fill="#1a2026" font-size="13">Index 0's demand 2 pops both heap maxima — the two [0,2] queries;</text>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">coverage 2,2,2 meets 2,0,2, so [1,1] is removed — answer <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
