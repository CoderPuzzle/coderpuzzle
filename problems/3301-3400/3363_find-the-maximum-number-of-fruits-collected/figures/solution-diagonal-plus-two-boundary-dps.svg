<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- fruits = [[1,2,3,4],[5,6,8,7],[9,10,11,12],[13,14,15,16]]; cells 78x46 at (48,64); diagonal fill, child 2 accent stroke, child 3 gray stroke -->
  <text x="204" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">fruits</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="87" y="56">0</text><text x="165" y="56">1</text><text x="243" y="56">2</text><text x="321" y="56">3</text>
    <text x="36" y="92">0</text><text x="36" y="138">1</text><text x="36" y="184">2</text><text x="36" y="230">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="48" y="64" width="78" height="46"/><rect x="126" y="64" width="78" height="46"/><rect x="204" y="64" width="78" height="46"/>
    <rect x="48" y="110" width="78" height="46"/><rect x="126" y="110" width="78" height="46"/><rect x="204" y="110" width="78" height="46"/>
    <rect x="48" y="156" width="78" height="46"/><rect x="126" y="156" width="78" height="46"/><rect x="204" y="156" width="78" height="46"/>
    <rect x="48" y="202" width="78" height="46"/><rect x="126" y="202" width="78" height="46"/><rect x="204" y="202" width="78" height="46"/>
  </g>
  <!-- child 2 visited cells: (0,3) (1,2) (2,3) -->
  <g stroke="#4169E1" stroke-width="2" fill="#ffffff">
    <rect x="282" y="64" width="78" height="46"/><rect x="204" y="110" width="78" height="46"/><rect x="282" y="156" width="78" height="46"/>
  </g>
  <!-- child 3 visited cells: (3,0) (3,1) (3,2) -->
  <g stroke="#5c6b76" stroke-width="2" fill="#ffffff">
    <rect x="48" y="202" width="78" height="46"/><rect x="126" y="202" width="78" height="46"/><rect x="204" y="202" width="78" height="46"/>
  </g>
  <!-- main diagonal cells, owned by child 1; (3,3) is the shared meeting cell -->
  <g fill="#dbe4fb" stroke="none">
    <rect x="49" y="65" width="76" height="44"/><rect x="127" y="111" width="76" height="44"/><rect x="205" y="157" width="76" height="44"/>
  </g>
  <rect x="283" y="203" width="76" height="44" fill="#dbe4fb" stroke="none"/>
  <rect x="282" y="202" width="78" height="46" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="87" y="92">1</text><text x="165" y="92">2</text><text x="243" y="92">3</text><text x="321" y="92">4</text>
    <text x="87" y="138">5</text><text x="165" y="138">6</text><text x="243" y="138">8</text><text x="321" y="138">7</text>
    <text x="87" y="184">9</text><text x="165" y="184">10</text><text x="243" y="184">11</text><text x="321" y="184">12</text>
    <text x="87" y="230">13</text><text x="165" y="230">14</text><text x="243" y="230">15</text><text x="321" y="230">16</text>
  </g>
  <!-- start badges: 1 top-left, 2 top-right, 3 bottom-left -->
  <g text-anchor="middle">
    <circle cx="58" cy="74" r="9" fill="#1a2026"/><text x="58" y="78" fill="#ffffff" font-size="11" font-weight="600">1</text>
    <circle cx="349" cy="74" r="9" fill="#4169E1"/><text x="349" y="78" fill="#ffffff" font-size="11" font-weight="600">2</text>
    <circle cx="58" cy="238" r="9" fill="#5c6b76"/><text x="58" y="242" fill="#ffffff" font-size="11" font-weight="600">3</text>
  </g>
  <!-- child 1 forced diagonal steps -->
  <g stroke="#1a2026" stroke-width="2" fill="none">
    <path d="M 112 96 L 140 124" marker-end="url(#arrowD)"/>
    <path d="M 190 142 L 218 170" marker-end="url(#arrowD)"/>
    <path d="M 268 188 L 290 210" marker-end="url(#arrowD)"/>
  </g>
  <!-- child 2 upper-triangle sweep: (0,3) (1,2) (2,3) then into (3,3) -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 298 96 L 266 124" marker-end="url(#arrowA)"/>
    <path d="M 264 140 L 294 168" marker-end="url(#arrowA)"/>
    <path d="M 345 186 L 345 214" marker-end="url(#arrowA)"/>
  </g>
  <!-- child 3 lower-triangle sweep along row 3 -->
  <g stroke="#5c6b76" stroke-width="2" fill="none">
    <path d="M 112 225 L 140 225" marker-end="url(#arrowG)"/>
    <path d="M 190 225 L 218 225" marker-end="url(#arrowG)"/>
    <path d="M 266 225 L 296 225" marker-end="url(#arrowG)"/>
  </g>
  <!-- route cards -->
  <rect x="396" y="56" width="18" height="18" fill="#dbe4fb" stroke="#1a2026" stroke-width="1.25"/>
  <text x="424" y="70" font-weight="600" fill="#1a2026">child 1 — forced diagonal</text>
  <text x="424" y="90" fill="#5c6b76" font-size="13">1 + 6 + 11 + 16 = 34</text>
  <rect x="396" y="126" width="18" height="18" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="424" y="140" font-weight="600" fill="#1a2026">child 2 — upper triangle DP</text>
  <text x="424" y="160" fill="#5c6b76" font-size="13">4 + 8 + 12 = 24</text>
  <rect x="396" y="196" width="18" height="18" fill="#ffffff" stroke="#5c6b76" stroke-width="2"/>
  <text x="424" y="210" font-weight="600" fill="#1a2026">child 3 — lower triangle DP</text>
  <text x="424" y="230" fill="#5c6b76" font-size="13">13 + 14 + 15 = 42</text>
  <text x="330" y="286" text-anchor="middle" fill="#1a2026" font-size="13">Child 1 sweeps the diagonal once; both DP sweeps stay strictly on their</text>
  <text x="330" y="304" text-anchor="middle" fill="#1a2026" font-size="13">own side and meet at (3, 3): 34 + 24 + 42 = <tspan fill="#4169E1" font-weight="600">100</tspan>.</text>
</svg>
