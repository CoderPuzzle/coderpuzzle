<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- n = 4, k = 1, invocations = [[1,2],[0,1],[3,2]]; suspicious {1,2} shaded #dbe4fb;
       violating outside-to-suspicious edges 0->1 and 3->2 in accent -->
  <text x="300" y="40" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">k = 1 — DFS start</text>
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <path d="M 136 80 L 272 80" marker-end="url(#arrow)"/>
    <path d="M 136 200 L 272 200" marker-end="url(#arrow)"/>
  </g>
  <path d="M 300 106 L 300 172" stroke="#5c6b76" stroke-width="2" fill="none" marker-end="url(#arrowg)"/>
  <text x="204" y="64" text-anchor="middle" fill="#4169E1" font-size="12">outside → suspicious</text>
  <text x="312" y="144" fill="#5c6b76" font-size="11.5">inside</text>
  <text x="204" y="234" text-anchor="middle" fill="#4169E1" font-size="12">outside → suspicious</text>
  <g stroke="#42525e" stroke-width="1.5">
    <circle cx="110" cy="80" r="24" fill="#ffffff"/>
    <circle cx="300" cy="80" r="24" fill="#dbe4fb"/>
    <circle cx="300" cy="200" r="24" fill="#dbe4fb"/>
    <circle cx="110" cy="200" r="24" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="110" y="86">0</text><text x="300" y="86">1</text>
    <text x="300" y="206">2</text><text x="110" y="206">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="60" y="250" width="14" height="14" fill="#dbe4fb"/>
    <rect x="400" y="250" width="14" height="14" fill="#ffffff"/>
  </g>
  <text x="82" y="262" fill="#5c6b76" font-size="12.5">suspicious: marked by DFS from k = 1 ({1, 2})</text>
  <text x="422" y="262" fill="#5c6b76" font-size="12.5">outside</text>
  <text x="280" y="288" text-anchor="middle" fill="#1a2026" font-size="13">Edges 0 → 1 and 3 → 2 run from outside into the shaded set,</text>
  <text x="280" y="306" text-anchor="middle" fill="#1a2026" font-size="13">so nothing is removed — the answer stays <tspan fill="#4169E1" font-weight="600">[0, 1, 2, 3]</tspan>.</text>
</svg>
