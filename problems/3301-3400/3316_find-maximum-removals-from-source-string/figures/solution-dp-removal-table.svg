<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 332" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="332" fill="#ffffff"/>
  <!-- source "abbaa", pattern "aba", targetIndices [0,1,2]; column i (w 96, x = 98 + 100i) holds the dp state after processing position i; row k (h 42, y = 78 + 46k) = matched pattern prefix length; accented cells trace the winning move path -->
  <text x="246" y="30" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">targetIndices = [0, 1, 2]</text>
  <g text-anchor="middle">
    <text x="146" y="48" font-weight="600" font-size="15">a</text><text x="246" y="48" font-weight="600" font-size="15">b</text><text x="346" y="48" font-weight="600" font-size="15">b</text><text x="446" y="48" font-weight="600" font-size="15">a</text><text x="546" y="48" font-weight="600" font-size="15">a</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="146" y="64" fill="#4169E1">i = 0</text><text x="246" y="64" fill="#4169E1">i = 1</text><text x="346" y="64" fill="#4169E1">i = 2</text><text x="446" y="64" fill="#5c6b76">i = 3</text><text x="546" y="64" fill="#5c6b76">i = 4</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="88" y="104">k = 0</text><text x="88" y="150">k = 1</text><text x="88" y="196">k = 2</text><text x="88" y="242">k = 3</text>
  </g>
  <!-- cells: light accent = target column, gray = unreachable sentinel -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="98" y="78" width="96" height="42" fill="#dbe4fb"/><rect x="98" y="124" width="96" height="42" fill="#dbe4fb"/><rect x="98" y="170" width="96" height="42" fill="#f0f3f7"/><rect x="98" y="216" width="96" height="42" fill="#f0f3f7"/>
    <rect x="198" y="78" width="96" height="42" fill="#dbe4fb"/><rect x="198" y="124" width="96" height="42" fill="#dbe4fb"/><rect x="198" y="170" width="96" height="42" fill="#dbe4fb"/><rect x="198" y="216" width="96" height="42" fill="#f0f3f7"/>
    <rect x="298" y="78" width="96" height="42" fill="#dbe4fb"/><rect x="298" y="124" width="96" height="42" fill="#dbe4fb"/><rect x="298" y="170" width="96" height="42" fill="#dbe4fb"/>
    <rect x="398" y="78" width="96" height="42" fill="#ffffff"/><rect x="398" y="124" width="96" height="42" fill="#ffffff"/><rect x="398" y="170" width="96" height="42" fill="#ffffff"/><rect x="398" y="216" width="96" height="42" fill="#ffffff"/>
    <rect x="498" y="78" width="96" height="42" fill="#ffffff"/><rect x="498" y="124" width="96" height="42" fill="#ffffff"/><rect x="498" y="170" width="96" height="42" fill="#ffffff"/><rect x="498" y="216" width="96" height="42" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2.5">
    <rect x="98" y="124" width="96" height="42"/><rect x="198" y="124" width="96" height="42"/><rect x="298" y="170" width="96" height="42"/><rect x="398" y="216" width="96" height="42"/><rect x="498" y="216" width="96" height="42"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="146" y="105">1</text>
    <text x="246" y="105">2</text><text x="246" y="197">0</text>
    <text x="346" y="105">3</text><text x="346" y="151">2</text>
    <text x="446" y="105">3</text><text x="446" y="151">3</text><text x="446" y="197">1</text>
    <text x="546" y="105">3</text><text x="546" y="151">3</text><text x="546" y="197">1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="15">
    <text x="146" y="197">−</text><text x="146" y="243">−</text><text x="246" y="243">−</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600">
    <text x="146" y="142" font-size="15">0</text><text x="146" y="158" font-size="10.5">match</text>
    <text x="246" y="142" font-size="15">1</text><text x="246" y="158" font-size="10.5">del +1</text>
    <text x="346" y="188" font-size="15">1</text><text x="346" y="204" font-size="10.5">match</text>
    <text x="446" y="234" font-size="15">1</text><text x="446" y="250" font-size="10.5">match</text>
    <text x="546" y="234" font-size="15">1</text><text x="546" y="250" font-size="10.5">keep</text>
  </g>
  <text x="310" y="282" text-anchor="middle" fill="#5c6b76" font-size="12.5">keep: k unchanged · match: k → k + 1 · delete: +1 (target columns only)</text>
  <text x="310" y="302" text-anchor="middle" fill="#1a2026" font-size="13">Filling left to right, the full-match row k = 3 ends at <tspan fill="#4169E1" font-weight="600">1 removal</tspan>:</text>
  <text x="310" y="319" text-anchor="middle" fill="#1a2026" font-size="13">delete source[1] ('b'), then match a · b · a across "abbaa".</text>
</svg>
