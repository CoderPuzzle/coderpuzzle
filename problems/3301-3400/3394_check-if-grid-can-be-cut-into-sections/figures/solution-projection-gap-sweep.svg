<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- rectangles = [[1,0,5,2],[0,2,2,4],[3,2,5,3],[0,4,4,5]]; scale X(v) = 90 + 100v; strips 16px tall -->
  <text x="40" y="30" fill="#5c6b76" font-size="12.5">x-axis — projections [startx, endx] sorted by start</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="90" y="42" width="200" height="16"/><rect x="90" y="66" width="400" height="16"/>
    <rect x="190" y="90" width="400" height="16"/><rect x="390" y="114" width="200" height="16"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#1a2026">
    <text x="190" y="54">R1 · [0,2]</text><text x="290" y="78">R3 · [0,4]</text>
    <text x="390" y="102">R0 · [1,5]</text><text x="490" y="126">R2 · [3,5]</text>
  </g>
  <!-- running max end steps right: 2, then 4, then 5 -->
  <g stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="2 3">
    <line x1="290" y1="58" x2="290" y2="66"/><line x1="490" y1="82" x2="490" y2="90"/>
    <line x1="590" y1="106" x2="590" y2="114"/>
  </g>
  <text x="40" y="150" fill="#5c6b76" font-size="12">starts 0, 0, 1, 3 never reach the running max end 2 → 4 → 5 — no gap</text>
  <text x="40" y="184" fill="#5c6b76" font-size="12.5">y-axis — projections [starty, endy] sorted by start</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="90" y="194" width="200" height="16"/><rect x="290" y="218" width="100" height="16"/>
    <rect x="290" y="242" width="200" height="16"/><rect x="490" y="266" width="100" height="16"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#1a2026">
    <text x="190" y="206">R0 · [0,2]</text><text x="340" y="230">R2 · [2,3]</text>
    <text x="390" y="254">R1 · [2,4]</text><text x="540" y="278">R3 · [4,5]</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="2 3">
    <line x1="290" y1="210" x2="290" y2="218"/><line x1="390" y1="234" x2="390" y2="242"/>
    <line x1="490" y1="258" x2="490" y2="266"/>
  </g>
  <!-- the two cuts: next start reaches the running max end -->
  <g stroke="#4169E1" stroke-width="1.8" stroke-dasharray="6 4" fill="none">
    <line x1="290" y1="188" x2="290" y2="288" marker-end="url(#arrow)"/>
    <line x1="490" y1="188" x2="490" y2="288" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1">
    <circle cx="290" cy="202" r="3"/><circle cx="290" cy="226" r="3"/>
    <circle cx="490" cy="250" r="3"/><circle cx="490" cy="274" r="3"/>
  </g>
  <g font-size="12">
    <text x="290" y="308" text-anchor="middle"><tspan fill="#4169E1" font-weight="600">gap 1</tspan><tspan fill="#5c6b76"> — start 2 ≥ max end 2</tspan></text>
    <text x="490" y="308" text-anchor="middle"><tspan fill="#4169E1" font-weight="600">gap 2</tspan><tspan fill="#5c6b76"> — start 4 ≥ max end 4</tspan></text>
  </g>
  <text x="330" y="332" text-anchor="middle" fill="#1a2026" font-size="13">Two y-gaps (start ≥ running max end at y = 2 and y = 4) admit the horizontal cuts;</text>
  <text x="330" y="350" text-anchor="middle" fill="#1a2026" font-size="13">the x-axis never gaps, so the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
