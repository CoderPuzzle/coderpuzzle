<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 370" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="410" height="370" fill="#ffffff"/>
  <defs>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- crystal markers on focus points 3 and 5 -->
  <path d="M 80 169 L 87 176 L 80 183 L 73 176 Z" fill="#4169E1"/>
  <path d="M 80 249 L 87 256 L 80 263 L 73 256 Z" fill="#4169E1"/>
  <text x="96" y="180" font-size="11.5" fill="#4169E1">crystals</text>
  <!-- existing runes -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="137" y1="57" x2="93" y2="107" marker-end="url(#arrowI)"/>
    <line x1="100" y1="122" x2="200" y2="122" marker-end="url(#arrowI)"/>
    <line x1="207" y1="107" x2="163" y2="57" marker-end="url(#arrowI)"/>
    <line x1="100" y1="202" x2="200" y2="202" marker-end="url(#arrowI)"/>
    <line x1="100" y1="282" x2="200" y2="282" marker-end="url(#arrowI)"/>
  </g>
  <!-- added rune -->
  <line x1="220" y1="184" x2="220" y2="140" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrowA)"/>
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <circle cx="150" cy="42" r="17"/>
    <circle cx="80" cy="122" r="17"/>
    <circle cx="220" cy="122" r="17"/>
    <circle cx="80" cy="202" r="17"/>
    <circle cx="220" cy="202" r="17"/>
    <circle cx="80" cy="282" r="17"/>
    <circle cx="220" cy="282" r="17"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="150" y="47">0</text>
    <text x="80" y="127">1</text>
    <text x="220" y="127">2</text>
    <text x="80" y="207">3</text>
    <text x="220" y="207">4</text>
    <text x="80" y="287">5</text>
    <text x="220" y="287">6</text>
  </g>
  <text x="205" y="326" text-anchor="middle" font-size="12.5" fill="#5c6b76">Crystals at 3 and 5 already feed 4 and 6;</text>
  <text x="205" y="342" text-anchor="middle" font-size="12.5" fill="#5c6b76">the cycle 0 → 1 → 2 needs one added</text>
  <text x="205" y="358" text-anchor="middle" font-size="12.5" fill="#5c6b76">rune (dashed) from focus point 4 to 2.</text>
</svg>
