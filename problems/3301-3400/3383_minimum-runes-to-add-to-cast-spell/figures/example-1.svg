<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="420" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- crystal marker on focus point 0 -->
  <path d="M 200 5 L 207 12 L 200 19 L 193 12 Z" fill="#4169E1"/>
  <text x="214" y="16" font-size="11.5" fill="#4169E1">crystal</text>
  <!-- existing runes (cycle 0 -> 1 -> 2 -> 3 -> 0) -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="181" y1="51" x2="99" y2="79" marker-end="url(#arrowI)"/>
    <line x1="80" y1="105" x2="80" y2="160" marker-end="url(#arrowI)"/>
    <line x1="99" y1="186" x2="181" y2="209" marker-end="url(#arrowI)"/>
    <line x1="200" y1="195" x2="200" y2="65" marker-end="url(#arrowI)"/>
  </g>
  <!-- added runes -->
  <g stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 3" fill="none">
    <line x1="219" y1="51" x2="301" y2="79" marker-end="url(#arrowA)"/>
    <line x1="213" y1="60" x2="307" y2="165" marker-end="url(#arrowA)"/>
  </g>
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <circle cx="200" cy="45" r="17"/>
    <circle cx="80" cy="85" r="17"/>
    <circle cx="80" cy="180" r="17"/>
    <circle cx="200" cy="215" r="17"/>
    <circle cx="320" cy="85" r="17"/>
    <circle cx="320" cy="180" r="17"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="200" y="50">0</text>
    <text x="80" y="90">1</text>
    <text x="80" y="185">2</text>
    <text x="200" y="220">3</text>
    <text x="320" y="90">4</text>
    <text x="320" y="185">5</text>
  </g>
  <text x="210" y="254" text-anchor="middle" font-size="12.5" fill="#5c6b76">Solid: existing runes 0 → 1 → 2 → 3 → 0.</text>
  <text x="210" y="270" text-anchor="middle" font-size="12.5" fill="#5c6b76">Dashed: the two added runes feed points 4 and 5.</text>
</svg>
