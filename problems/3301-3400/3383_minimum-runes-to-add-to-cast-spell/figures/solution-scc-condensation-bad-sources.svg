<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- example 1: n = 6, crystals = [0], runes 0→1, 1→2, 2→3, 3→0; SCC blob 250x110 at (60,60); bad-source nodes 90x48 at (440,40) and (440,150) -->
  <!-- crystal SCC -->
  <rect x="60" y="60" width="250" height="110" rx="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="185" y="88" text-anchor="middle" font-weight="600" fill="#1a2026">SCC {0, 1, 2, 3}</text>
  <text x="185" y="112" text-anchor="middle" fill="#5c6b76" font-size="12.5">0 → 1 → 2 → 3 → 0</text>
  <rect x="118" y="126" width="134" height="22" rx="11" fill="#4169E1"/>
  <text x="185" y="141" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">crystal at 0 — good</text>
  <text x="185" y="188" text-anchor="middle" fill="#5c6b76" font-size="11.5">needs no rune</text>
  <!-- bad source singletons -->
  <rect x="440" y="40" width="90" height="48" rx="10" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="485" y="70" text-anchor="middle" font-weight="600" fill="#1a2026">{4}</text>
  <text x="485" y="104" text-anchor="middle" fill="#5c6b76" font-size="11.5">bad source</text>
  <text x="485" y="119" text-anchor="middle" fill="#9aa7b2" font-size="11.5">in-degree 0</text>
  <rect x="440" y="150" width="90" height="48" rx="10" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="485" y="180" text-anchor="middle" font-weight="600" fill="#1a2026">{5}</text>
  <text x="485" y="214" text-anchor="middle" fill="#5c6b76" font-size="11.5">bad source</text>
  <text x="485" y="229" text-anchor="middle" fill="#9aa7b2" font-size="11.5">in-degree 0</text>
  <!-- added runes -->
  <path d="M 316 82 L 432 64" fill="none" stroke="#4169E1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="374" y="56" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">add 0 → 4</text>
  <path d="M 316 142 L 432 172" fill="none" stroke="#4169E1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="374" y="148" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">add 0 → 5</text>
  <text x="320" y="268" text-anchor="middle" fill="#1a2026" font-size="13">The cycle 0 → 1 → 2 → 3 → 0 contracts to one SCC; the crystal at 0 marks it <tspan fill="#4169E1" font-weight="600">good</tspan>.</text>
  <text x="320" y="286" text-anchor="middle" fill="#1a2026" font-size="13">Bad sources {4} and {5} each take one dashed rune from 0 — the answer is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
