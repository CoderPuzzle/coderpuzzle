<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="348" fill="#ffffff"/>
  <!-- edges1 = [[0,1],[0,2],[2,3],[2,4]] (left), edges2 = [[0,1],[0,2],[0,3],[2,7],[1,4],[4,5],[4,6]] (right), k = 2; nodes r=15, drawn over center-to-center edges -->
  <text x="172" y="36" text-anchor="middle" font-weight="600" font-size="13.5" fill="#1a2026">tree 1 — node 0's ball at radius k = 2</text>
  <text x="495" y="36" text-anchor="middle" font-weight="600" font-size="13.5" fill="#1a2026">tree 2 — best ball at radius k − 1 = 1</text>
  <!-- tree edges -->
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 160 70 L 75 150"/><path d="M 160 70 L 250 150"/><path d="M 250 150 L 180 230"/><path d="M 250 150 L 285 230"/>
    <path d="M 450 70 L 440 160"/><path d="M 450 70 L 525 160"/><path d="M 450 70 L 600 160"/>
    <path d="M 440 160 L 440 250"/><path d="M 440 250 L 390 250"/><path d="M 440 250 L 490 250"/><path d="M 600 160 L 600 250"/>
  </g>
  <!-- tree 1: all 5 nodes in the ball; node 0 is the centre -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="2">
    <circle cx="75" cy="150" r="15"/><circle cx="250" cy="150" r="15"/><circle cx="180" cy="230" r="15"/><circle cx="285" cy="230" r="15"/>
  </g>
  <circle cx="160" cy="70" r="15" fill="#4169E1" stroke="#4169E1" stroke-width="2"/>
  <!-- tree 2: ball of node 4 = {1,4,5,6}; rest muted -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.25">
    <circle cx="450" cy="70" r="15"/><circle cx="525" cy="160" r="15"/><circle cx="600" cy="160" r="15"/><circle cx="600" cy="250" r="15"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="2">
    <circle cx="440" cy="160" r="15"/><circle cx="390" cy="250" r="15"/><circle cx="490" cy="250" r="15"/>
  </g>
  <circle cx="440" cy="250" r="15" fill="#4169E1" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-size="13.5" font-weight="600">
    <text x="160" y="75" fill="#ffffff">0</text>
    <text x="75" y="155" fill="#1a2026">1</text><text x="250" y="155" fill="#1a2026">2</text>
    <text x="180" y="235" fill="#1a2026">3</text><text x="285" y="235" fill="#1a2026">4</text>
    <text x="450" y="75" fill="#9aa7b2">0</text>
    <text x="440" y="165" fill="#1a2026">1</text><text x="525" y="165" fill="#9aa7b2">3</text><text x="600" y="165" fill="#9aa7b2">2</text>
    <text x="440" y="255" fill="#ffffff">4</text>
    <text x="390" y="255" fill="#1a2026">5</text><text x="490" y="255" fill="#1a2026">6</text><text x="600" y="255" fill="#9aa7b2">7</text>
  </g>
  <!-- BFS layer tags in tree 1 -->
  <g fill="#5c6b76" font-size="10.5">
    <text x="179" y="74">d=0</text>
    <text x="94" y="154">d=1</text>
    <text x="269" y="154">d=1</text>
    <text x="199" y="240">d=2</text>
    <text x="304" y="240">d=2</text>
  </g>
  <text x="172" y="286" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">all 5 nodes within k = 2</text>
  <text x="495" y="286" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">node 4's ball {1, 4, 5, 6} → 4 (node 0 ties)</text>
  <text x="340" y="314" text-anchor="middle" fill="#1a2026" font-size="13">The two parts add independently: 5 nodes around i in tree 1 plus tree 2's</text>
  <text x="340" y="332" text-anchor="middle" fill="#1a2026" font-size="13">best radius-(k − 1) ball, 4 — the same +4 for every i: answer[0] = <tspan fill="#4169E1" font-weight="600">5 + 4 = 9</tspan>.</text>
</svg>
