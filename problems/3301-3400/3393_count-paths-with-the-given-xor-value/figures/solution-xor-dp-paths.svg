<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="344" fill="#ffffff"/>
  <!-- grid = [[2,1,5],[7,10,0],[12,6,4]], k = 11; cells 72x52 at (50,68); dp bucket 16 slots of 18px at (330,246) -->
  <text x="50" y="56" fill="#5c6b76" font-size="12.5">grid, k = 11</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
    <rect x="50" y="68" width="72" height="52"/><rect x="122" y="68" width="72" height="52"/>
    <rect x="50" y="120" width="72" height="52"/><rect x="122" y="120" width="72" height="52"/><rect x="194" y="120" width="72" height="52"/>
    <rect x="50" y="172" width="72" height="52"/><rect x="122" y="172" width="72" height="52"/><rect x="194" y="172" width="72" height="52" stroke="#4169E1" stroke-width="2.2"/>
  </g>
  <rect x="194" y="68" width="72" height="52" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="14.5" font-weight="600" fill="#1a2026">
    <text x="86" y="99">2</text><text x="158" y="99">1</text><text x="230" y="99" fill="#9aa7b2">5</text>
    <text x="86" y="151">7</text><text x="158" y="151">10</text><text x="230" y="151">0</text>
    <text x="86" y="203">12</text><text x="158" y="203">6</text><text x="230" y="203" fill="#4169E1">4</text>
  </g>
  <text x="50" y="244" fill="#9aa7b2" font-size="11.5">(0, 2) meets no qualifying path.</text>
  <!-- the three qualifying paths with running XOR -->
  <text x="330" y="56" fill="#5c6b76" font-size="12.5">the three qualifying paths</text>
  <text x="330" y="82" fill="#1a2026" font-size="13" font-weight="600">2 → 7 → 12 → 6 → 4</text>
  <text x="330" y="102" fill="#5c6b76" font-size="11.5">x: 2, 5, 9, 15, <tspan fill="#4169E1" font-weight="600">11</tspan></text>
  <text x="330" y="134" fill="#1a2026" font-size="13" font-weight="600">2 → 7 → 10 → 0 → 4</text>
  <text x="330" y="154" fill="#5c6b76" font-size="11.5">x: 2, 5, 15, 15, <tspan fill="#4169E1" font-weight="600">11</tspan></text>
  <text x="330" y="186" fill="#1a2026" font-size="13" font-weight="600">2 → 1 → 10 → 6 → 4</text>
  <text x="330" y="206" fill="#5c6b76" font-size="11.5">x: 2, 3, 9, 15, <tspan fill="#4169E1" font-weight="600">11</tspan></text>
  <!-- dp bucket of the goal cell -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="8.5">
    <text x="339" y="240">0</text><text x="357" y="240">1</text><text x="375" y="240">2</text><text x="393" y="240">3</text>
    <text x="411" y="240">4</text><text x="429" y="240">5</text><text x="447" y="240">6</text><text x="465" y="240">7</text>
    <text x="483" y="240">8</text><text x="501" y="240">9</text><text x="519" y="240">10</text><text x="537" y="240">11</text>
    <text x="555" y="240">12</text><text x="573" y="240">13</text><text x="591" y="240">14</text><text x="609" y="240">15</text>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1">
    <rect x="330" y="246" width="18" height="24"/><rect x="348" y="246" width="18" height="24"/><rect x="366" y="246" width="18" height="24"/><rect x="384" y="246" width="18" height="24"/>
    <rect x="402" y="246" width="18" height="24"/><rect x="420" y="246" width="18" height="24"/><rect x="438" y="246" width="18" height="24"/><rect x="456" y="246" width="18" height="24"/>
    <rect x="474" y="246" width="18" height="24"/><rect x="492" y="246" width="18" height="24"/><rect x="510" y="246" width="18" height="24"/>
    <rect x="546" y="246" width="18" height="24"/><rect x="564" y="246" width="18" height="24"/><rect x="582" y="246" width="18" height="24"/><rect x="600" y="246" width="18" height="24"/>
  </g>
  <rect x="528" y="246" width="18" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="9.5" fill="#9aa7b2">
    <text x="339" y="262">0</text><text x="357" y="262">0</text><text x="375" y="262">0</text><text x="393" y="262">0</text>
    <text x="411" y="262">0</text><text x="429" y="262">0</text><text x="447" y="262">0</text><text x="465" y="262">0</text>
    <text x="483" y="262">0</text><text x="501" y="262">0</text><text x="519" y="262">0</text>
    <text x="555" y="262">0</text><text x="573" y="262">0</text><text x="591" y="262">0</text><text x="609" y="262">0</text>
  </g>
  <text x="537" y="263" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="700">3</text>
  <text x="330" y="290" fill="#5c6b76" font-size="11.5">dp[2][2][x] after the scan</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">dp[i][j][x] counts paths reaching (i, j) with XOR x — 16 slots per cell.</text>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">All three routes end 15 ^ 4 = <tspan fill="#4169E1" font-weight="600">11</tspan>: dp[2][2][11] = <tspan fill="#4169E1" font-weight="600">3</tspan>, the answer.</text>
</svg>
