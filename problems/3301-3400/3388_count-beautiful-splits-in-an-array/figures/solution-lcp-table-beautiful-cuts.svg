<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="356" fill="#ffffff"/>
  <!-- nums = [1,1,2,1]; lcp[i][j] = LCP(nums[i:], nums[j:]); table cells 46x36 at (110,152); cut strips: unit cells 28x30 at x=340 -->
  <text x="70" y="34" fill="#5c6b76" font-size="12.5">nums</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="44" width="40" height="34"/><rect x="114" y="44" width="40" height="34"/><rect x="158" y="44" width="40" height="34"/><rect x="202" y="44" width="40" height="34"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="90" y="66">1</text><text x="134" y="66">1</text><text x="178" y="66">2</text><text x="222" y="66">1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="90" y="92">0</text><text x="134" y="92">1</text><text x="178" y="92">2</text><text x="222" y="92">3</text>
  </g>
  <!-- lcp table -->
  <text x="110" y="128" fill="#5c6b76" font-size="12.5">lcp[i][j]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="133" y="146">0</text><text x="179" y="146">1</text><text x="225" y="146">2</text><text x="271" y="146">3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11.5">
    <text x="100" y="175">0</text><text x="100" y="211">1</text><text x="100" y="247">2</text><text x="100" y="283">3</text>
  </g>
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.2">
    <rect x="110" y="152" width="46" height="36"/>
    <rect x="110" y="188" width="46" height="36"/><rect x="156" y="188" width="46" height="36"/>
    <rect x="110" y="224" width="46" height="36"/><rect x="156" y="224" width="46" height="36"/><rect x="202" y="224" width="46" height="36"/>
    <rect x="110" y="260" width="46" height="36"/><rect x="156" y="260" width="46" height="36"/><rect x="202" y="260" width="46" height="36"/><rect x="248" y="260" width="46" height="36"/>
  </g>
  <rect x="156" y="152" width="46" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="248" y="188" width="46" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="202" y="152" width="46" height="36"/><rect x="248" y="152" width="46" height="36"/>
    <rect x="202" y="188" width="46" height="36"/>
    <rect x="248" y="224" width="46" height="36"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="133" y="175" fill="#9aa7b2">—</text><text x="179" y="175" fill="#4169E1" font-weight="700">1</text>
    <text x="225" y="175" fill="#5c6b76">0</text><text x="271" y="175" fill="#1a2026">1</text>
    <text x="133" y="211" fill="#9aa7b2">—</text><text x="179" y="211" fill="#9aa7b2">—</text>
    <text x="225" y="211" fill="#5c6b76">0</text><text x="271" y="211" fill="#1a2026" font-weight="600">1</text>
    <text x="133" y="247" fill="#9aa7b2">—</text><text x="179" y="247" fill="#9aa7b2">—</text><text x="225" y="247" fill="#9aa7b2">—</text>
    <text x="271" y="247" fill="#5c6b76">0</text>
    <text x="133" y="283" fill="#9aa7b2">—</text><text x="179" y="283" fill="#9aa7b2">—</text><text x="225" y="283" fill="#9aa7b2">—</text><text x="271" y="283" fill="#9aa7b2">—</text>
  </g>
  <!-- the two beautiful cuts -->
  <text x="340" y="146" fill="#5c6b76" font-size="12.5">the two beautiful cuts</text>
  <rect x="340" y="160" width="28" height="30" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="368" y="160" width="28" height="30" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="396" y="160" width="28" height="30"/><rect x="424" y="160" width="28" height="30"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="354" y="179">1</text><text x="382" y="179">1</text><text x="410" y="179">2</text><text x="438" y="179">1</text>
  </g>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="368" y1="154" x2="368" y2="196"/><line x1="396" y1="154" x2="396" y2="196"/>
  </g>
  <text x="382" y="212" text-anchor="middle" fill="#1a2026" font-size="12">(i, j) = (1, 2)</text>
  <text x="468" y="179" fill="#1a2026" font-size="12">lcp[0][1] = 1 ≥ i = 1 ✓</text>
  <rect x="340" y="246" width="28" height="30" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="368" y="246" width="28" height="30" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="396" y="246" width="28" height="30"/><rect x="424" y="246" width="28" height="30"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="354" y="265">1</text><text x="382" y="265">1</text><text x="410" y="265">2</text><text x="438" y="265">1</text>
  </g>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="368" y1="240" x2="368" y2="282"/><line x1="424" y1="240" x2="424" y2="282"/>
  </g>
  <text x="396" y="298" text-anchor="middle" fill="#1a2026" font-size="12">(i, j) = (1, 3)</text>
  <text x="468" y="265" fill="#1a2026" font-size="12">lcp[0][1] = 1 ≥ i = 1 ✓</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">lcp fills from the bottom-right: a head match adds 1 + lcp[i+1][j+1].</text>
  <text x="320" y="344" text-anchor="middle" fill="#1a2026" font-size="13">lcp[0][1] = 1 ≥ i = 1 makes nums1 a prefix of nums2 at (1, 2) and (1, 3): answer <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
