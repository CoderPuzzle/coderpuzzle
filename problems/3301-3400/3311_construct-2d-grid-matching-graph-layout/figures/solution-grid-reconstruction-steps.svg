<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="324" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- Example 3: n = 9; degrees 0:3 1:2 2:3 3:2 4:4 5:2 6:3 7:3 8:2; degree-2 corners {1,3,5,8};
       grid A: row 1 (8,6,3) newly placed accent; B: row 2 (7,4,2) accent; C: row 3 (1,0,5) accent.
       cells 40x40; grid A x=48, B x=280, C x=512, y=90 -->
  <text x="108" y="74" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">start: deg-2 corner 8</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="48" y="90" width="40" height="40" fill="#dbe4fb"/><rect x="88" y="90" width="40" height="40" fill="#dbe4fb"/><rect x="128" y="90" width="40" height="40" fill="#dbe4fb"/>
    <rect x="48" y="130" width="40" height="40" fill="#f0f3f7"/><rect x="88" y="130" width="40" height="40" fill="#f0f3f7"/><rect x="128" y="130" width="40" height="40" fill="#f0f3f7"/>
    <rect x="48" y="170" width="40" height="40" fill="#f0f3f7"/><rect x="88" y="170" width="40" height="40" fill="#f0f3f7"/><rect x="128" y="170" width="40" height="40" fill="#f0f3f7"/>
    <rect x="280" y="90" width="40" height="40" fill="#ffffff"/><rect x="320" y="90" width="40" height="40" fill="#ffffff"/><rect x="360" y="90" width="40" height="40" fill="#ffffff"/>
    <rect x="280" y="130" width="40" height="40" fill="#dbe4fb"/><rect x="320" y="130" width="40" height="40" fill="#dbe4fb"/><rect x="360" y="130" width="40" height="40" fill="#dbe4fb"/>
    <rect x="280" y="170" width="40" height="40" fill="#f0f3f7"/><rect x="320" y="170" width="40" height="40" fill="#f0f3f7"/><rect x="360" y="170" width="40" height="40" fill="#f0f3f7"/>
    <rect x="512" y="90" width="40" height="40" fill="#ffffff"/><rect x="552" y="90" width="40" height="40" fill="#ffffff"/><rect x="592" y="90" width="40" height="40" fill="#ffffff"/>
    <rect x="512" y="130" width="40" height="40" fill="#ffffff"/><rect x="552" y="130" width="40" height="40" fill="#ffffff"/><rect x="592" y="130" width="40" height="40" fill="#ffffff"/>
    <rect x="512" y="170" width="40" height="40" fill="#dbe4fb"/><rect x="552" y="170" width="40" height="40" fill="#dbe4fb"/><rect x="592" y="170" width="40" height="40" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="68" y="116">8</text><text x="108" y="116">6</text><text x="148" y="116">3</text>
    <text x="300" y="116">8</text><text x="340" y="116">6</text><text x="380" y="116">3</text>
    <text x="300" y="156">7</text><text x="340" y="156">4</text><text x="380" y="156">2</text>
    <text x="532" y="116">8</text><text x="572" y="116">6</text><text x="612" y="116">3</text>
    <text x="532" y="156">7</text><text x="572" y="156">4</text><text x="612" y="156">2</text>
    <text x="532" y="196">1</text><text x="572" y="196">0</text><text x="612" y="196">5</text>
  </g>
  <g stroke="#5c6b76" stroke-width="2" fill="none">
    <path d="M 176 150 L 272 150" marker-end="url(#arrow)"/>
    <path d="M 408 150 L 504 150" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="108" y="232">corner 8 (deg 2),</text>
    <text x="108" y="249">first row walks 8 → 6 → 3</text>
    <text x="340" y="232">row 2: 7 = unplaced neighbor of 8;</text>
    <text x="340" y="249">4, 2 = common neighbors from above</text>
    <text x="572" y="232">row 3 forced</text>
    <text x="572" y="249">the same way</text>
  </g>
  <text x="340" y="290" text-anchor="middle" fill="#1a2026" font-size="13">Degree-2 nodes {1, 3, 5, 8} are the corners; rows + cols = 18 − 12 = 6 gives 3×3.</text>
  <text x="340" y="308" text-anchor="middle" fill="#1a2026" font-size="13">The walk lands on the statement's grid <tspan fill="#4169E1" font-weight="600">[[8, 6, 3], [7, 4, 2], [1, 0, 5]]</tspan>.</text>
</svg>
