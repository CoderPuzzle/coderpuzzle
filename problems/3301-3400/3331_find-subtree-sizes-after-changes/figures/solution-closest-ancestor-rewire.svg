<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="410" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- parent = [-1,0,4,0,1], s = "abbba"; nodes r=17 at left (original) and right (final);
       rewire 4 to 0 and 2 to 1; reverse preorder 3,2,4,1,0 folds sizes to [5,2,1,1,1] -->
  <text x="150" y="56" text-anchor="middle" fill="#5c6b76" font-size="12.5">original tree</text>
  <text x="500" y="56" text-anchor="middle" fill="#5c6b76" font-size="12.5">final tree</text>
  <!-- original edges; 1-4 and 4-2 dashed = removed by the rewire -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="150" y1="84" x2="105" y2="148"/>
    <line x1="150" y1="84" x2="200" y2="148"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="105" y1="148" x2="105" y2="212"/>
    <line x1="105" y1="212" x2="105" y2="276"/>
  </g>
  <!-- re-parent arrows to the closest same-letter ancestor -->
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 91 202 C 40 170 60 110 136 96" marker-end="url(#arrow)"/>
    <path d="M 91 264 C 48 240 48 184 90 162" marker-end="url(#arrow)"/>
  </g>
  <text x="20" y="92" fill="#4169E1" font-size="12.5" font-weight="600">4 → 0</text>
  <text x="20" y="158" fill="#4169E1" font-size="12.5" font-weight="600">2 → 1</text>
  <!-- original nodes: index inside, letter beside -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="150" cy="84" r="17"/><circle cx="105" cy="148" r="17"/>
    <circle cx="200" cy="148" r="17"/><circle cx="105" cy="212" r="17"/>
    <circle cx="105" cy="276" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="150" y="89">0</text><text x="105" y="153">1</text><text x="200" y="153">3</text>
    <text x="105" y="217">4</text><text x="105" y="281">2</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="176" y="89">a</text><text x="131" y="153">b</text><text x="226" y="153">b</text>
    <text x="131" y="217">a</text><text x="131" y="281">b</text>
  </g>
  <!-- rewire arrow between panels -->
  <path d="M 272 160 L 366 160" fill="none" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <text x="319" y="148" text-anchor="middle" fill="#5c6b76" font-size="12">rewire</text>
  <!-- final edges -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="500" y1="84" x2="430" y2="148"/>
    <line x1="500" y1="84" x2="500" y2="148"/>
    <line x1="500" y1="84" x2="570" y2="148"/>
    <line x1="430" y1="148" x2="430" y2="212"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="500" cy="84" r="17"/><circle cx="430" cy="148" r="17"/>
    <circle cx="500" cy="148" r="17"/><circle cx="570" cy="148" r="17"/>
    <circle cx="430" cy="212" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="500" y="89">0</text><text x="430" y="153">1</text><text x="500" y="153">4</text>
    <text x="570" y="153">3</text><text x="430" y="217">2</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="526" y="89">a</text><text x="456" y="153">b</text><text x="526" y="153">a</text>
    <text x="596" y="153">b</text><text x="456" y="217">b</text>
  </g>
  <!-- reverse-preorder fold strip -->
  <text x="40" y="326" fill="#5c6b76" font-size="12.5">reverse preorder</text>
  <g stroke="#42525e" stroke-width="1.25" fill="#ffffff">
    <rect x="154" y="306" width="28" height="28"/><rect x="198" y="306" width="28" height="28"/>
    <rect x="242" y="306" width="28" height="28"/><rect x="286" y="306" width="28" height="28"/>
    <rect x="330" y="306" width="28" height="28"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="168" y="325">3</text><text x="212" y="325">2</text><text x="256" y="325">4</text>
    <text x="300" y="325">1</text><text x="344" y="325">0</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="168" y="350">→ 0</text><text x="212" y="350">→ 1</text><text x="256" y="350">→ 0</text>
    <text x="300" y="350">→ 0</text><text x="344" y="350">root</text>
  </g>
  <g font-size="12.5">
    <text x="390" y="318" fill="#1a2026">size[1] = 1 + 1 (from 2) = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="390" y="340" fill="#1a2026">size[0] = 1 + 1 (3) + 1 (4) + 2 (1) = <tspan fill="#4169E1" font-weight="600">5</tspan></text>
  </g>
  <text x="340" y="380" text-anchor="middle" fill="#1a2026" font-size="13">Nodes 4 and 2 re-parent to their closest same-letter ancestors, 0 and 1;</text>
  <text x="340" y="398" text-anchor="middle" fill="#1a2026" font-size="13">folding sizes in reverse preorder gives <tspan fill="#4169E1" font-weight="600">[5, 2, 1, 1, 1]</tspan>.</text>
</svg>
