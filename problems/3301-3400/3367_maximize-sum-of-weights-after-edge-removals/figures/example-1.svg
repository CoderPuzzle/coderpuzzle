<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="420" height="260" fill="#ffffff"/>
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="196" y1="50" x2="109" y2="115"/>
    <line x1="200" y1="134" x2="160" y2="191"/>
    <line x1="220" y1="134" x2="260" y2="191"/>
  </g>
  <!-- removed edge -->
  <line x1="210" y1="57" x2="210" y2="103" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 3"/>
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <circle cx="210" cy="40" r="17"/>
    <circle cx="95" cy="125" r="17"/>
    <circle cx="210" cy="120" r="17"/>
    <circle cx="150" cy="205" r="17"/>
    <circle cx="270" cy="205" r="17"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="210" y="45">0</text>
    <text x="95" y="130">1</text>
    <text x="210" y="125">2</text>
    <text x="150" y="210">3</text>
    <text x="270" y="210">4</text>
  </g>
  <!-- edge weights -->
  <g font-size="13" fill="#1a2026">
    <text x="138" y="80">4</text>
    <text x="162" y="168">12</text>
    <text x="248" y="168">6</text>
  </g>
  <text x="220" y="80" font-size="13" fill="#4169E1" font-weight="600">2</text>
  <text x="220" y="98" font-size="12" fill="#4169E1">removed</text>
  <text x="210" y="242" text-anchor="middle" font-size="12.5" fill="#5c6b76">Node 2 has 3 neighbors; removing the weight-2 edge</text>
  <text x="210" y="258" text-anchor="middle" font-size="12.5" fill="#5c6b76">keeps every degree ≤ k = 2, leaving 4 + 12 + 6 = 22.</text>
</svg>
