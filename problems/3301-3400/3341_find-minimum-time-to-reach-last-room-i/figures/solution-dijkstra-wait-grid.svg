<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- moveTime = [[0,4],[4,4]]; cells 120x70 at (190,60), gap 30; badge = pop order,
       big number = settled dist; arrival = max(t, open) + 1 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="190" y="60" width="120" height="70" fill="#f0f3f7"/>
    <rect x="340" y="60" width="120" height="70" fill="#ffffff"/>
    <rect x="190" y="160" width="120" height="70" fill="#ffffff"/>
    <rect x="340" y="160" width="120" height="70" fill="#dbe4fb"/>
  </g>
  <!-- pop-order badges -->
  <g stroke="#4169E1" stroke-width="1.25" fill="#ffffff">
    <circle cx="206" cy="76" r="11"/><circle cx="356" cy="76" r="11"/>
    <circle cx="206" cy="176" r="11"/><circle cx="356" cy="176" r="11"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="206" y="80">1</text><text x="356" y="80">2</text>
    <text x="206" y="180">3</text><text x="356" y="180">4</text>
  </g>
  <g text-anchor="middle">
    <text x="250" y="90" fill="#5c6b76" font-size="12">start</text>
    <text x="400" y="90" fill="#5c6b76" font-size="12">open 4</text>
    <text x="250" y="190" fill="#5c6b76" font-size="12">open 4</text>
    <text x="400" y="190" fill="#5c6b76" font-size="12">open 4</text>
    <text x="250" y="118" fill="#1a2026" font-size="20" font-weight="600">0</text>
    <text x="400" y="118" fill="#1a2026" font-size="20" font-weight="600">5</text>
    <text x="250" y="218" fill="#1a2026" font-size="20" font-weight="600">5</text>
    <text x="400" y="218" fill="#4169E1" font-size="20" font-weight="600">6</text>
  </g>
  <!-- relaxations: each arrow labelled with max(t, open) + 1 -->
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 312 95 L 336 95" marker-end="url(#arrow)"/>
    <path d="M 210 132 L 210 156" marker-end="url(#arrow)"/>
    <path d="M 312 195 L 336 195" marker-end="url(#arrow)"/>
  </g>
  <text x="325" y="48" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">max(0, 4) + 1 = 5</text>
  <text x="180" y="150" text-anchor="end" fill="#4169E1" font-size="12.5" font-weight="600">max(0, 4) + 1 = 5</text>
  <text x="400" y="256" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">max(5, 4) + 1 = 6</text>
  <text x="320" y="292" text-anchor="middle" fill="#1a2026" font-size="13">Only the start is open: the first move waits until t = 4, landing at t = 5,</text>
  <text x="320" y="310" text-anchor="middle" fill="#1a2026" font-size="13">and (1, 1) is entered at max(5, 4) + 1 = <tspan fill="#4169E1" font-weight="600">6</tspan> seconds.</text>
</svg>
