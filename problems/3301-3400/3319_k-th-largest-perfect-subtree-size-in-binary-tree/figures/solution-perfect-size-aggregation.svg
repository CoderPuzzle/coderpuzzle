  <text x="530" y="301" fill="#5c6b76" font-size="11">descending</text>
  <text x="186" y="332" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">k = 2</text>
  <text x="310" y="354" text-anchor="middle" fill="#1a2026" font-size="13">Every perfect node adds its size; the sorted list is [3, 3, 1, 1, 1, 1, 1, 1],</text>
  <text x="310" y="371" text-anchor="middle" fill="#1a2026" font-size="13">and the k = 2 entry is <tspan fill="#4169E1" font-weight="600">3</tspan> — a perfect subtree rooted at either inner 5.</text>
