  <rect x="164" y="278" width="44" height="36" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <path d="M 180 268 L 192 268 L 186 276 z" fill="#4169E1"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="134" y="301" fill="#1a2026">3</text><text x="186" y="301" fill="#4169E1">3</text><text x="238" y="301" fill="#1a2026">1</text><text x="290" y="301" fill="#1a2026">1</text>
