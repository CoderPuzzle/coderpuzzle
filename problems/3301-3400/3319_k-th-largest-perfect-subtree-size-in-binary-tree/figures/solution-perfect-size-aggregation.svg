    <circle cx="118" cy="226" r="17"/><circle cx="190" cy="226" r="17"/><circle cx="262" cy="166" r="17"/>
    <circle cx="334" cy="226" r="17"/><circle cx="406" cy="226" r="17"/><circle cx="478" cy="166" r="17"/>
