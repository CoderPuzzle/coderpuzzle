<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 358" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="358" fill="#ffffff"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [1,2,1]; each landing adds new_cnt = 1 + cnt[v-1] + cnt[v+1] subsequences; totals 1, 6, 14; buckets table columns centered at 170/330/490 -->
  <text x="330" y="24" text-anchor="middle" fill="#5c6b76" font-size="12">nums = [1, 2, 1] lands left to right</text>
  <g stroke="#4169E1" stroke-width="1.4" fill="#dbe4fb">
    <rect x="148" y="36" width="44" height="28"/><rect x="308" y="36" width="44" height="28"/><rect x="468" y="36" width="44" height="28"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="170" y="55">1</text><text x="330" y="55">2</text><text x="490" y="55">1</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <path d="M 198 50 H 302" marker-end="url(#arrowG)"/>
    <path d="M 358 50 H 462" marker-end="url(#arrowG)"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="170" y="94">new: [1]</text>
    <text x="330" y="94">new: [2], [1] → [1,2]</text>
    <text x="490" y="94">new: [1], [2] → [2,1],</text>
    <text x="490" y="112">[1,2] → [1,2,1]</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="170" y="136">their sum: 1</text>
    <text x="330" y="136">their sum: 2 + 3 = 5</text>
    <text x="490" y="136">their sum: 1 + 3 + 4 = 8</text>
  </g>
  <!-- bucket state after each landing; accent = just updated -->
  <rect x="44" y="156" width="572" height="142" fill="none" stroke="#dbe4fb" stroke-width="1.4"/>
  <g fill="#5c6b76" font-size="12.5">
    <text x="64" y="184">cnt[1]</text><text x="64" y="210">sm[1]</text><text x="64" y="236">cnt[2]</text><text x="64" y="262">sm[2]</text><text x="64" y="288">total</text>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="170" y="184" fill="#4169E1" font-weight="600">1</text><text x="330" y="184" fill="#1a2026">1</text><text x="490" y="184" fill="#4169E1" font-weight="600">4</text>
    <text x="170" y="210" fill="#4169E1" font-weight="600">1</text><text x="330" y="210" fill="#1a2026">1</text><text x="490" y="210" fill="#4169E1" font-weight="600">9</text>
    <text x="170" y="236" fill="#9aa7b2">0</text><text x="330" y="236" fill="#4169E1" font-weight="600">2</text><text x="490" y="236" fill="#1a2026">2</text>
    <text x="170" y="262" fill="#9aa7b2">0</text><text x="330" y="262" fill="#4169E1" font-weight="600">5</text><text x="490" y="262" fill="#1a2026">5</text>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#4169E1">
    <text x="170" y="288">1</text><text x="330" y="288">6</text><text x="490" y="288">14</text>
  </g>
  <text x="330" y="324" text-anchor="middle" fill="#1a2026" font-size="13">The total accrues each landing's new sums: 1 + 5 + 8 = <tspan fill="#4169E1" font-weight="600">14</tspan> —</text>
  <text x="330" y="344" text-anchor="middle" fill="#1a2026" font-size="13">the six good subsequences [1],[2],[1],[1,2],[2,1],[1,2,1] sum to 1+2+1+3+3+4 = <tspan fill="#4169E1" font-weight="600">14</tspan>.</text>
</svg>
