    <circle cx="400" cy="210" r="22"/>
  </g>
  <circle cx="400" cy="80" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
