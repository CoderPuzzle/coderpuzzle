    <text x="325" y="70" fill="#7a5a1e">3</text>
    <text x="264" y="150" fill="#4169E1">11</text>
    <text x="414" y="150" fill="#7a5a1e">3</text>
    <text x="325" y="200" fill="#4169E1">2</text>
  </g>
  <text x="250" y="266" text-anchor="middle" fill="#1a2026" font-size="13.5">trip 0 → 1 → 4 → 3 · cost 4 + 11 + 2 = <tspan fill="#4169E1" font-weight="700">17</tspan></text>
</svg>
