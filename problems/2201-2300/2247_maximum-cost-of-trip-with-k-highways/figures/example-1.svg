      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 5, highways = [[0,1,4],[2,1,3],[1,4,11],[3,2,3],[3,4,2]]; trip 0 -> 1 -> 4 -> 3 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="272" y1="80" x2="378" y2="80"/>
    <line x1="400" y1="102" x2="400" y2="188"/>
  </g>
  <g stroke="#4169E1" stroke-width="3">
    <line x1="122" y1="80" x2="226" y2="80" marker-end="url(#arrow)"/>
    <line x1="250" y1="102" x2="250" y2="186" marker-end="url(#arrow)"/>
    <line x1="272" y1="210" x2="376" y2="210" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
