<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 5; highways 0-1(4), 1-2(3), 1-4(11), 2-3(3), 4-3(2); trip 0 -> 1 -> 4 -> 3;
       masks 00001, 00011, 10011, 11011 with dp = 0, 4, 15, 17; bit cells 26px at x 420 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="218" y1="64" x2="302" y2="64"/>
    <line x1="320" y1="82" x2="320" y2="150"/>
  </g>
  <g stroke="#4169E1" stroke-width="3">
    <line x1="98" y1="64" x2="180" y2="64" marker-end="url(#arrow)"/>
    <line x1="200" y1="82" x2="200" y2="148" marker-end="url(#arrow)"/>
    <line x1="218" y1="168" x2="300" y2="168" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#dbe4fb">
    <circle cx="80" cy="64" r="18"/>
    <circle cx="200" cy="64" r="18"/>
    <circle cx="200" cy="168" r="18"/>
    <circle cx="320" cy="168" r="18"/>
  </g>
  <circle cx="320" cy="64" r="18" fill="#f0f3f7" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="80" y="69">0</text><text x="200" y="69">1</text><text x="320" y="69">2</text>
    <text x="200" y="173">4</text><text x="320" y="173">3</text>
  </g>
  <g font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="140" y="52" fill="#4169E1">4</text>
    <text x="260" y="52" fill="#5c6b76">3</text>
    <text x="214" y="120" fill="#4169E1">11</text>
    <text x="334" y="120" fill="#5c6b76">3</text>
    <text x="260" y="190" fill="#4169E1">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="80" y="34">start</text>
    <text x="320" y="204">end</text>
  </g>
  <!-- dp table -->
  <text x="540" y="36" text-anchor="middle" fill="#5c6b76" font-size="12">dp[mask][last]: one bit per city</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="433" y="58">4</text><text x="459" y="58">3</text><text x="485" y="58">2</text><text x="511" y="58">1</text><text x="537" y="58">0</text>
  </g>
  <!-- row 1: mask 00001 -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="420" y="66" width="26" height="26" fill="#ffffff"/><rect x="446" y="66" width="26" height="26" fill="#ffffff"/>
    <rect x="472" y="66" width="26" height="26" fill="#ffffff"/><rect x="498" y="66" width="26" height="26" fill="#ffffff"/>
    <rect x="524" y="66" width="26" height="26" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="433" y="84" fill="#9aa7b2">0</text><text x="459" y="84" fill="#9aa7b2">0</text><text x="485" y="84" fill="#9aa7b2">0</text><text x="511" y="84" fill="#9aa7b2">0</text><text x="537" y="84" fill="#1a2026" font-weight="600">1</text>
  </g>
  <text x="560" y="84" fill="#1a2026" font-size="12.5">end 0 · cost 0</text>
  <text x="420" y="110" fill="#5c6b76" font-size="12">highway 0-1, toll <tspan fill="#1a2026" font-weight="600">4</tspan> — bit 1 joins</text>
  <!-- row 2: mask 00011 -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="420" y="126" width="26" height="26" fill="#ffffff"/><rect x="446" y="126" width="26" height="26" fill="#ffffff"/>
    <rect x="472" y="126" width="26" height="26" fill="#ffffff"/><rect x="498" y="126" width="26" height="26" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="524" y="126" width="26" height="26" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="433" y="144" fill="#9aa7b2">0</text><text x="459" y="144" fill="#9aa7b2">0</text><text x="485" y="144" fill="#9aa7b2">0</text><text x="511" y="144" fill="#1a2026" font-weight="600">1</text><text x="537" y="144" fill="#1a2026">1</text>
  </g>
  <text x="560" y="144" fill="#1a2026" font-size="12.5">end 1 · cost 4</text>
  <text x="420" y="170" fill="#5c6b76" font-size="12">highway 1-4, toll <tspan fill="#1a2026" font-weight="600">11</tspan> — bit 4 joins</text>
  <!-- row 3: mask 10011 -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="420" y="186" width="26" height="26" fill="#dbe4fb" stroke="#4169E1"/><rect x="446" y="186" width="26" height="26" fill="#ffffff"/>
    <rect x="472" y="186" width="26" height="26" fill="#ffffff"/><rect x="498" y="186" width="26" height="26" fill="#ffffff"/>
    <rect x="524" y="186" width="26" height="26" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="433" y="204" fill="#1a2026" font-weight="600">1</text><text x="459" y="204" fill="#9aa7b2">0</text><text x="485" y="204" fill="#9aa7b2">0</text><text x="511" y="204" fill="#1a2026">1</text><text x="537" y="204" fill="#1a2026">1</text>
  </g>
  <text x="560" y="204" fill="#1a2026" font-size="12.5">end 4 · cost 15</text>
  <text x="420" y="230" fill="#5c6b76" font-size="12">highway 4-3, toll <tspan fill="#1a2026" font-weight="600">2</tspan> — bit 3 joins</text>
  <!-- row 4: mask 11011 -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="420" y="246" width="26" height="26" fill="#ffffff"/><rect x="446" y="246" width="26" height="26" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="472" y="246" width="26" height="26" fill="#ffffff"/><rect x="498" y="246" width="26" height="26" fill="#ffffff"/>
    <rect x="524" y="246" width="26" height="26" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="433" y="264" fill="#1a2026">1</text><text x="459" y="264" fill="#1a2026" font-weight="600">1</text><text x="485" y="264" fill="#9aa7b2">0</text><text x="511" y="264" fill="#1a2026">1</text><text x="537" y="264" fill="#1a2026">1</text>
  </g>
  <text x="560" y="264" fill="#4169E1" font-size="12.5" font-weight="600">end 3 · cost 17</text>
  <text x="340" y="322" text-anchor="middle" fill="#1a2026" font-size="13">Each highway adds one city bit — masks 00001 → 00011 → 10011 → 11011 —</text>
  <text x="340" y="342" text-anchor="middle" fill="#1a2026" font-size="13">while dp accretes 0 → 4 → 15 → 17; ending at city 3 the best trip costs <tspan fill="#4169E1" font-weight="600">17</tspan>.</text>
</svg>
