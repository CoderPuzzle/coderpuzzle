<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums=[6,3,3,2], k=2; heap snapshots as trees: [2,3,3,6] -> [3,3,3,6] -> [3,3,4,6]; accented root = minimum to pop; r=16 -->
  <text x="40" y="32" fill="#5c6b76" font-size="12.5">accented root = current minimum; each of the k = 2 increments goes there</text>
  <!-- edges snapshot A -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="112" y1="66" x2="76" y2="118"/><line x1="112" y1="66" x2="148" y2="118"/>
    <line x1="76" y1="118" x2="52" y2="170"/>
  </g>
  <!-- edges snapshot B -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="312" y1="66" x2="276" y2="118"/><line x1="312" y1="66" x2="348" y2="118"/>
    <line x1="276" y1="118" x2="252" y2="170"/>
  </g>
  <!-- edges snapshot C -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="512" y1="66" x2="476" y2="118"/><line x1="512" y1="66" x2="548" y2="118"/>
    <line x1="476" y1="118" x2="452" y2="170"/>
  </g>
  <!-- snapshot A nodes: root 2 accented -->
  <circle cx="112" cy="66" r="16" fill="#4169E1"/>
  <circle cx="76" cy="118" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="148" cy="118" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="52" cy="170" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <!-- snapshot B nodes: root 3 accented -->
  <circle cx="312" cy="66" r="16" fill="#4169E1"/>
  <circle cx="276" cy="118" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="348" cy="118" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="252" cy="170" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <!-- snapshot C nodes -->
  <circle cx="512" cy="66" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="476" cy="118" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="548" cy="118" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="452" cy="170" r="16" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="112" y="71" fill="#ffffff">2</text>
    <text x="76" y="123" fill="#1a2026">3</text><text x="148" y="123" fill="#1a2026">3</text><text x="52" y="175" fill="#1a2026">6</text>
    <text x="312" y="71" fill="#ffffff">3</text>
    <text x="276" y="123" fill="#1a2026">3</text><text x="348" y="123" fill="#1a2026">3</text><text x="252" y="175" fill="#1a2026">6</text>
    <text x="512" y="71" fill="#1a2026">3</text>
    <text x="476" y="123" fill="#1a2026">3</text><text x="548" y="123" fill="#1a2026">4</text><text x="452" y="175" fill="#1a2026">6</text>
  </g>
  <path d="M 178 92 L 238 92" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="208" y="80" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">pop 2 &#8594; push 3</text>
  <path d="M 388 92 L 448 92" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="80" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">pop 3 &#8594; push 4</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="112" y="210">[2, 3, 3, 6]</text>
    <text x="312" y="210">[3, 3, 3, 6]</text>
    <text x="512" y="210">[3, 3, 4, 6]</text>
  </g>
  <text x="310" y="248" text-anchor="middle" fill="#1a2026" font-size="13">Each operation pops the heap minimum and pushes it back +1: 2 becomes 3,</text>
  <text x="310" y="268" text-anchor="middle" fill="#1a2026" font-size="13">then a 3 becomes 4 — the balanced factors 6 * 4 * 3 * 3 = <tspan fill="#4169E1" font-weight="600">216</tspan>.</text>
</svg>
