<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums=[1,2,3,4,5]; rows: [1,2,3,4,5],[3,5,7,9],[8,2,6],[0,8],[8]; cells 42x34 at row y=40+50r -->
  <!-- parent -> child connectors, each child = (a + b) % 10 -->
  <g stroke="#9aa7b2" stroke-width="1">
    <path d="M 208 74 L 231 90"/><path d="M 254 74 L 231 90"/>
    <path d="M 254 74 L 277 90"/><path d="M 300 74 L 277 90"/>
    <path d="M 300 74 L 323 90"/><path d="M 346 74 L 323 90"/>
    <path d="M 231 124 L 254 140"/><path d="M 277 124 L 254 140"/>
    <path d="M 277 124 L 300 140"/><path d="M 323 124 L 300 140"/>
    <path d="M 323 124 L 346 140"/><path d="M 369 124 L 346 140"/>
    <path d="M 254 174 L 277 190"/><path d="M 300 174 L 277 190"/>
    <path d="M 300 174 L 323 190"/><path d="M 346 174 L 323 190"/>
    <path d="M 277 224 L 300 240"/><path d="M 323 224 L 300 240"/>
  </g>
  <!-- worked pair: row0 cells 4 and 5 feed the 9 below -->
  <g stroke="#4169E1" stroke-width="2">
    <path d="M 346 74 L 369 90"/><path d="M 392 74 L 369 90"/>
  </g>
  <!-- row 0: nums -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="187" y="40" width="42" height="34"/><rect x="233" y="40" width="42" height="34"/>
    <rect x="279" y="40" width="42" height="34"/><rect x="325" y="40" width="42" height="34"/>
    <rect x="371" y="40" width="42" height="34"/>
  </g>
  <!-- row 1 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="210" y="90" width="42" height="34"/><rect x="256" y="90" width="42" height="34"/>
    <rect x="302" y="90" width="42" height="34"/><rect x="348" y="90" width="42" height="34"/>
  </g>
  <!-- row 2 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="233" y="140" width="42" height="34"/><rect x="279" y="140" width="42" height="34"/>
    <rect x="325" y="140" width="42" height="34"/>
  </g>
  <!-- row 3 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="256" y="190" width="42" height="34"/><rect x="302" y="190" width="42" height="34"/>
  </g>
  <!-- row 4: apex -->
  <rect x="279" y="240" width="42" height="34" fill="#4169E1" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="208" y="62">1</text><text x="254" y="62">2</text><text x="300" y="62">3</text><text x="346" y="62">4</text><text x="392" y="62">5</text>
    <text x="231" y="112">3</text><text x="277" y="112">5</text><text x="323" y="112">7</text><text x="369" y="112" fill="#4169E1">9</text>
    <text x="254" y="162">8</text><text x="300" y="162">2</text><text x="346" y="162">6</text>
    <text x="277" y="212">0</text><text x="323" y="212">8</text>
    <text x="300" y="262" fill="#ffffff">8</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="175" y="61">nums</text>
    <text x="175" y="111">round 1</text>
    <text x="175" y="161">round 2</text>
    <text x="175" y="211">round 3</text>
    <text x="175" y="261">round 4</text>
  </g>
  <text x="430" y="90" fill="#4169E1" font-size="12.5" font-weight="600">(4 + 5) % 10 = 9</text>
  <g fill="#5c6b76" font-size="12.5">
    <text x="430" y="155">newNums[i] =</text>
    <text x="430" y="175">(nums[i] + nums[i+1]) % 10</text>
  </g>
  <text x="332" y="261" fill="#5c6b76" font-size="12.5">the triangular sum</text>
  <text x="310" y="310" text-anchor="middle" fill="#1a2026" font-size="13">Rounds of (a + b) % 10 shrink [1, 2, 3, 4, 5] through [3, 5, 7, 9], [8, 2, 6],</text>
  <text x="310" y="330" text-anchor="middle" fill="#1a2026" font-size="13">[0, 8] down to the single apex <tspan fill="#4169E1" font-weight="600">8</tspan>.</text>
</svg>
