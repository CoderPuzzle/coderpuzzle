<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="452" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- final s = "bbbbcc" after the three queries; root [0..5] pulls from children
       [0..2] = "bbb" (pref 3, suf 3, best 3) and [3..5] = "bcc" (pref 1, suf 2, best 2);
       boundary chars agree, so suf 3 + pref 1 = 4 and best = max(3, 2, 4) = 4 -->
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 295 130 L 205 186"/>
    <path d="M 345 130 L 435 186"/>
    <path d="M 242 306 L 200 258" marker-end="url(#arrow)" stroke-width="1.2"/>
    <path d="M 398 306 L 440 258" marker-end="url(#arrow)" stroke-width="1.2"/>
  </g>
  <rect x="195" y="56" width="250" height="70" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="437" y="72" text-anchor="end" fill="#5c6b76" font-size="11">[0..5]</text>
  <text x="320" y="84" text-anchor="middle" font-weight="600" font-size="15">bbbbcc</text>
  <g text-anchor="middle" font-size="12.5">
    <text x="245" y="110" fill="#5c6b76">pref <tspan fill="#1a2026" font-weight="600">4</tspan></text>
    <text x="320" y="110" fill="#5c6b76">suf <tspan fill="#1a2026" font-weight="600">2</tspan></text>
    <text x="402" y="110" fill="#5c6b76">best <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  </g>
  <rect x="90" y="190" width="200" height="62" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="282" y="206" text-anchor="end" fill="#5c6b76" font-size="11">[0..2]</text>
  <text x="190" y="216" text-anchor="middle" font-weight="600">bbb</text>
  <text x="190" y="238" text-anchor="middle" fill="#5c6b76" font-size="12.5">pref <tspan fill="#1a2026" font-weight="600">3</tspan>&#160;&#160;suf <tspan fill="#1a2026" font-weight="600">3</tspan>&#160;&#160;best <tspan fill="#1a2026" font-weight="600">3</tspan></text>
  <rect x="350" y="190" width="200" height="62" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="542" y="206" text-anchor="end" fill="#5c6b76" font-size="11">[3..5]</text>
  <text x="450" y="216" text-anchor="middle" font-weight="600">bcc</text>
  <text x="450" y="238" text-anchor="middle" fill="#5c6b76" font-size="12.5">pref <tspan fill="#1a2026" font-weight="600">1</tspan>&#160;&#160;suf <tspan fill="#1a2026" font-weight="600">2</tspan>&#160;&#160;best <tspan fill="#1a2026" font-weight="600">2</tspan></text>
  <text x="320" y="168" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">suf 3 + pref 1 = 4</text>
  <path d="M 290 236 Q 320 258 350 236" fill="none" stroke="#9aa7b2" stroke-width="1.4"/>
  <text x="320" y="282" text-anchor="middle" fill="#5c6b76" font-size="12">b = b at the boundary</text>
  <!-- leaves: b b b b c c with the tree boundary between index 2 and 3 -->
  <line x1="320" y1="306" x2="320" y2="362" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="164" y="316" width="52" height="36" fill="#dbe4fb"/><rect x="216" y="316" width="52" height="36" fill="#dbe4fb"/>
    <rect x="268" y="316" width="52" height="36" fill="#dbe4fb"/><rect x="320" y="316" width="52" height="36" fill="#dbe4fb"/>
    <rect x="372" y="316" width="52" height="36" fill="#ffffff"/><rect x="424" y="316" width="52" height="36" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="190" y="339">b</text><text x="242" y="339">b</text><text x="294" y="339">b</text>
    <text x="346" y="339">b</text><text x="398" y="339">c</text><text x="450" y="339">c</text>
  </g>
  <text x="320" y="384" text-anchor="middle" fill="#5c6b76" font-size="12">leaf boundary</text>
  <text x="320" y="414" text-anchor="middle" fill="#1a2026" font-size="13">Merging bbb | bcc: boundary b = b, so suf 3 + pref 1 joins into a run of 4;</text>
  <text x="320" y="434" text-anchor="middle" fill="#1a2026" font-size="13">best = max(3, 2, <tspan fill="#4169E1" font-weight="600">4</tspan>) — the root's best answers the query in O(1).</text>
</svg>
