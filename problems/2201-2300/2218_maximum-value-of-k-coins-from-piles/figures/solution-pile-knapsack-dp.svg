<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- piles = [[1,100,3],[7,8,9]], k = 2; coin stacks 60x30 (top coin first) at x=70,
       take-t prefix values beside; dp rows for j = 0..2 after each pile at y=70 and
       y=200, cells 64x40 at x=340,410,480; accented cell = final answer dp[2] -->
  <text x="16" y="26" fill="#5c6b76" font-size="12.5">piles = [[1,100,3],[7,8,9]], k = 2</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="60" width="60" height="30" fill="#ffffff"/><rect x="70" y="90" width="60" height="30" fill="#ffffff"/>
    <rect x="70" y="120" width="60" height="30" fill="#f0f3f7"/>
    <rect x="70" y="200" width="60" height="30" fill="#ffffff"/><rect x="70" y="230" width="60" height="30" fill="#ffffff"/>
    <rect x="70" y="260" width="60" height="30" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="100" y="80">1</text><text x="100" y="110">100</text><text x="100" y="140" fill="#9aa7b2">3</text>
    <text x="100" y="220">7</text><text x="100" y="250">8</text><text x="100" y="280" fill="#9aa7b2">9</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="140" y="79">take 1 → 1</text>
    <text x="140" y="109">take 2 → 101</text>
    <text x="140" y="139" fill="#9aa7b2">take 3 → 104</text>
    <text x="140" y="219">take 1 → 7</text>
    <text x="140" y="249">take 2 → 15</text>
    <text x="140" y="279" fill="#9aa7b2">take 3 → 24</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="100" y="168">pile 0</text>
    <text x="100" y="308">pile 1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="372" y="62">j = 0</text><text x="442" y="62">j = 1</text><text x="512" y="62">j = 2</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="330" y="95">after pile 0</text>
    <text x="330" y="225">after pile 1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="340" y="70" width="64" height="40" fill="#ffffff"/><rect x="410" y="70" width="64" height="40" fill="#ffffff"/>
    <rect x="480" y="70" width="64" height="40" fill="#ffffff"/>
    <rect x="340" y="200" width="64" height="40" fill="#ffffff"/><rect x="410" y="200" width="64" height="40" fill="#ffffff"/>
    <rect x="480" y="200" width="64" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="372" y="95">0</text><text x="442" y="95">1</text><text x="512" y="95">101</text>
    <text x="372" y="225">0</text><text x="442" y="225">7</text><text x="512" y="225" fill="#4169E1">101</text>
  </g>
  <!-- dp[2] refill: dp[2] + prefix[0] = 101, dp[1] + prefix[1] = 8, dp[0] + prefix[2] = 15 -->
  <g fill="none" stroke="#4169E1" stroke-width="1.6">
    <path d="M 512 110 L 512 196" marker-end="url(#arrow)"/>
    <path d="M 442 110 Q 450 160 500 196" marker-end="url(#arrow)"/>
    <path d="M 372 110 Q 388 175 483 196" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="522" y="150">101 + 0</text>
    <text x="434" y="150" text-anchor="end">1 + 7</text>
    <text x="362" y="172" text-anchor="end">0 + 15</text>
  </g>
  <text x="512" y="258" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">answer</text>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">Each pile offers its top-t prefix sums: 1 / 101 from pile 0, 7 / 15 from pile 1.</text>
  <text x="340" y="350" text-anchor="middle" fill="#1a2026" font-size="13">Refilling dp after pile 1: dp[2] = max(101 + 0, 1 + 7, 0 + 15) = <tspan fill="#4169E1" font-weight="600">101</tspan>.</text>
</svg>
