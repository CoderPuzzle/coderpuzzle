<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 218" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <g id="flower">
      <circle r="2.6" fill="#8a6420"/>
      <g fill="#b57f30">
        <circle cx="0" cy="-4.6" r="2.5"/>
        <circle cx="4.4" cy="-1.4" r="2.5"/>
        <circle cx="2.7" cy="3.7" r="2.5"/>
        <circle cx="-2.7" cy="3.7" r="2.5"/>
        <circle cx="-4.4" cy="-1.4" r="2.5"/>
      </g>
    </g>
    <g id="person">
      <circle cx="0" cy="-5.2" r="2.6" fill="#1a2026"/>
      <g stroke="#1a2026" stroke-width="1.5" fill="none">
        <line x1="0" y1="-2.6" x2="0" y2="3.4"/>
        <line x1="-3.8" y1="0" x2="3.8" y2="0"/>
        <line x1="0" y1="3.4" x2="-3" y2="7.6"/>
        <line x1="0" y1="3.4" x2="3" y2="7.6"/>
      </g>
    </g>
  </defs>
  <!-- flowers = [[1,10],[3,3]], people = [3,3,2] -->
  <!-- flowers in bloom at each time t = 1..10 -->
  <g>
    <use href="#flower" x="70" y="118"/>
    <use href="#flower" x="118" y="118"/>
    <use href="#flower" x="166" y="118"/><use href="#flower" x="166" y="102"/>
    <use href="#flower" x="214" y="118"/>
    <use href="#flower" x="262" y="118"/>
    <use href="#flower" x="310" y="118"/>
    <use href="#flower" x="358" y="118"/>
    <use href="#flower" x="406" y="118"/>
    <use href="#flower" x="454" y="118"/>
    <use href="#flower" x="502" y="118"/>
  </g>
  <!-- time axis -->
  <line x1="48" y1="128" x2="524" y2="128" stroke="#42525e" stroke-width="1.4"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="70" y1="124" x2="70" y2="132"/><line x1="118" y1="124" x2="118" y2="132"/>
    <line x1="166" y1="124" x2="166" y2="132"/><line x1="214" y1="124" x2="214" y2="132"/>
    <line x1="262" y1="124" x2="262" y2="132"/><line x1="310" y1="124" x2="310" y2="132"/>
    <line x1="358" y1="124" x2="358" y2="132"/><line x1="406" y1="124" x2="406" y2="132"/>
    <line x1="454" y1="124" x2="454" y2="132"/><line x1="502" y1="124" x2="502" y2="132"/>
  </g>
  <g fill="#5c6b76" text-anchor="middle" font-size="12">
    <text x="70" y="146">1</text><text x="118" y="146">2</text><text x="166" y="146">3</text>
    <text x="214" y="146">4</text><text x="262" y="146">5</text><text x="310" y="146">6</text>
    <text x="358" y="146">7</text><text x="406" y="146">8</text><text x="454" y="146">9</text>
    <text x="502" y="146">10</text>
  </g>
  <text x="50" y="122" text-anchor="end" fill="#5c6b76" font-size="12">flowers</text>
  <text x="50" y="178" text-anchor="end" fill="#5c6b76" font-size="12">people</text>
  <!-- two people arrive at t = 3, one at t = 2 -->
  <use href="#person" x="158" y="172"/>
  <use href="#person" x="174" y="172"/>
  <use href="#person" x="118" y="172"/>
  <g fill="#4169E1" font-weight="700" text-anchor="middle" font-size="13">
    <text x="158" y="204">2</text>
    <text x="174" y="204">2</text>
    <text x="118" y="204">1</text>
  </g>
</svg>
