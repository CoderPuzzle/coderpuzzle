<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- floor = "10110101", numCarpets = 2, carpetLen = 2; row i at y = 72+40i, cells 34 tall;
       tile column x=150 w=52 ('1' shaded), dp columns j=0,1,2 at x=230,330,430 w=80;
       accent cell = answer dp[0][2]; arcs show its two choices -->
  <text x="16" y="26" fill="#5c6b76" font-size="12.5">floor = 10110101, numCarpets = 2, carpetLen = 2</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="176" y="58">floor[i]</text>
    <text x="270" y="58">j = 0</text>
    <text x="370" y="58">j = 1</text>
    <text x="470" y="58">j = 2</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="142" y="94">i = 0</text><text x="142" y="134">i = 1</text><text x="142" y="174">i = 2</text>
    <text x="142" y="214">i = 3</text><text x="142" y="254">i = 4</text><text x="142" y="294">i = 5</text>
    <text x="142" y="334">i = 6</text><text x="142" y="374">i = 7</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="150" y="72" width="52" height="34" fill="#dbe4fb"/><rect x="150" y="112" width="52" height="34" fill="#ffffff"/>
    <rect x="150" y="152" width="52" height="34" fill="#dbe4fb"/><rect x="150" y="192" width="52" height="34" fill="#dbe4fb"/>
    <rect x="150" y="232" width="52" height="34" fill="#ffffff"/><rect x="150" y="272" width="52" height="34" fill="#dbe4fb"/>
    <rect x="150" y="312" width="52" height="34" fill="#ffffff"/><rect x="150" y="352" width="52" height="34" fill="#dbe4fb"/>
    <rect x="230" y="72" width="80" height="34" fill="#f0f3f7"/><rect x="230" y="112" width="80" height="34" fill="#f0f3f7"/>
    <rect x="230" y="152" width="80" height="34" fill="#f0f3f7"/><rect x="230" y="192" width="80" height="34" fill="#f0f3f7"/>
    <rect x="230" y="232" width="80" height="34" fill="#f0f3f7"/><rect x="230" y="272" width="80" height="34" fill="#f0f3f7"/>
    <rect x="230" y="312" width="80" height="34" fill="#f0f3f7"/><rect x="230" y="352" width="80" height="34" fill="#f0f3f7"/>
    <rect x="330" y="72" width="80" height="34" fill="#ffffff"/><rect x="330" y="112" width="80" height="34" fill="#ffffff"/>
    <rect x="330" y="152" width="80" height="34" fill="#ffffff"/><rect x="330" y="192" width="80" height="34" fill="#ffffff"/>
    <rect x="330" y="232" width="80" height="34" fill="#ffffff"/><rect x="330" y="272" width="80" height="34" fill="#ffffff"/>
    <rect x="330" y="312" width="80" height="34" fill="#ffffff"/><rect x="330" y="352" width="80" height="34" fill="#ffffff"/>
    <rect x="430" y="72" width="80" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <rect x="430" y="112" width="80" height="34" fill="#ffffff"/><rect x="430" y="152" width="80" height="34" fill="#ffffff"/>
    <rect x="430" y="192" width="80" height="34" fill="#ffffff"/><rect x="430" y="232" width="80" height="34" fill="#ffffff"/>
    <rect x="430" y="272" width="80" height="34" fill="#ffffff"/><rect x="430" y="312" width="80" height="34" fill="#ffffff"/>
    <rect x="430" y="352" width="80" height="34" fill="#ffffff"/>
    <rect x="230" y="392" width="80" height="34" fill="#f0f3f7"/><rect x="330" y="392" width="80" height="34" fill="#f0f3f7"/>
    <rect x="430" y="392" width="80" height="34" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="176" y="94">1</text><text x="176" y="134">0</text><text x="176" y="174">1</text>
    <text x="176" y="214">1</text><text x="176" y="254">0</text><text x="176" y="294">1</text>
    <text x="176" y="334">0</text><text x="176" y="374">1</text>
    <text x="270" y="94">5</text><text x="270" y="134">4</text><text x="270" y="174">4</text>
    <text x="270" y="214">3</text><text x="270" y="254">2</text><text x="270" y="294">2</text>
    <text x="270" y="334">1</text><text x="270" y="374">1</text>
    <text x="370" y="94">3</text><text x="370" y="134">2</text><text x="370" y="174">2</text>
    <text x="370" y="214">2</text><text x="370" y="254">1</text><text x="370" y="294">1</text>
    <text x="370" y="334">0</text><text x="370" y="374">0</text>
    <text x="470" y="94" fill="#4169E1">2</text><text x="470" y="134">1</text><text x="470" y="174">1</text>
    <text x="470" y="214">1</text><text x="470" y="254">0</text><text x="470" y="294">0</text>
    <text x="470" y="334">0</text><text x="470" y="374">0</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76">
    <text x="270" y="414">0</text><text x="370" y="414">0</text><text x="470" y="414">0</text>
    <text x="176" y="414" font-size="12">n = 8</text>
  </g>
  <!-- dp[0][2] = min(skip: floor[0] + dp[1][2] = 1+1, carpet at 0: dp[2][1] = 2) -->
  <path d="M 514 124 Q 556 106 514 92" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="562" y="112" fill="#5c6b76" font-size="12">skip: 1 + 1 = 2</text>
  <path d="M 414 172 Q 574 174 486 110" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="566" y="196" text-anchor="middle" fill="#5c6b76" font-size="12">carpet at 0:</text>
  <text x="566" y="212" text-anchor="middle" fill="#5c6b76" font-size="12">dp[2][1] = 2</text>
  <text x="340" y="466" text-anchor="middle" fill="#1a2026" font-size="13">Each cell shows or covers tile i: floor[i] + dp[i+1][j] versus dp[i+carpetLen][j-1].</text>
  <text x="340" y="486" text-anchor="middle" fill="#1a2026" font-size="13">dp[0][2] = min(1 + 1, 2) = <tspan fill="#4169E1" font-weight="600">2</tspan>; carpets at 2 and 6 realize it, leaving tiles 0 and 5 white.</text>
</svg>
