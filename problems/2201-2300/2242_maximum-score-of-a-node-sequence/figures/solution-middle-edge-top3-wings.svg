<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="412" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- scores = [5,2,9,8,4]; edges 0-1, 1-2, 2-3, 0-2, 1-3, 2-4; accent path 0-1-2-3;
       top3[1] = [2(9), 3(8), 0(5)], top3[2] = [3(8), 0(5), 4(4)]; winning wings x = 0, y = 3 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="85" y1="205" x2="220" y2="100"/>
    <line x1="220" y1="100" x2="355" y2="205"/>
    <line x1="355" y1="205" x2="220" y2="300"/>
    <line x1="85" y1="205" x2="355" y2="205"/>
    <line x1="220" y1="100" x2="220" y2="300"/>
    <line x1="355" y1="205" x2="440" y2="300"/>
  </g>
  <g stroke="#4169E1">
    <line x1="85" y1="205" x2="220" y2="100" stroke-width="2.5"/>
    <line x1="220" y1="100" x2="355" y2="205" stroke-width="4"/>
    <line x1="355" y1="205" x2="220" y2="300" stroke-width="2.5"/>
  </g>
  <text x="248" y="158" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">(1, 2)</text>
  <g stroke="#42525e" stroke-width="1.6">
    <circle cx="85" cy="205" r="21" fill="#dbe4fb"/>
    <circle cx="220" cy="100" r="21" fill="#dbe4fb"/>
    <circle cx="355" cy="205" r="21" fill="#dbe4fb"/>
    <circle cx="220" cy="300" r="21" fill="#dbe4fb"/>
    <circle cx="440" cy="300" r="21" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="85" y="210">0</text><text x="220" y="105">1</text><text x="355" y="210">2</text>
    <text x="220" y="305">3</text><text x="440" y="305">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="85" y="245">score 5</text><text x="220" y="62">score 2</text>
    <text x="355" y="247">score 9</text><text x="220" y="338">score 8</text>
    <text x="440" y="338">score 4</text>
  </g>
  <!-- pointers from each middle-edge endpoint to its top-3 list -->
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 243 96 L 476 104" marker-end="url(#arrow)"/>
    <path d="M 375 212 L 476 250" marker-end="url(#arrow)"/>
  </g>
  <!-- top3[1] -->
  <rect x="484" y="80" width="170" height="112" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="569" y="104" text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">top 3 neighbours of 1</text>
  <g text-anchor="middle" font-size="13.5">
    <text x="540" y="132" fill="#1a2026">2 · 9</text>
    <text x="540" y="158" fill="#1a2026">3 · 8</text>
    <text x="540" y="184" fill="#4169E1" font-weight="600">0 · 5</text>
  </g>
  <g font-size="11.5">
    <text x="596" y="132" fill="#9aa7b2">is b</text>
    <text x="596" y="184" fill="#4169E1" font-weight="600">← x</text>
  </g>
  <!-- top3[2] -->
  <rect x="484" y="228" width="170" height="112" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="569" y="252" text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">top 3 neighbours of 2</text>
  <g text-anchor="middle" font-size="13.5">
    <text x="540" y="280" fill="#4169E1" font-weight="600">3 · 8</text>
    <text x="540" y="304" fill="#1a2026">0 · 5</text>
    <text x="540" y="328" fill="#1a2026">4 · 4</text>
  </g>
  <g font-size="11.5">
    <text x="596" y="280" fill="#4169E1" font-weight="600">← y</text>
    <text x="596" y="304" fill="#9aa7b2">is x</text>
    <text x="596" y="328" fill="#9aa7b2">gives 20</text>
  </g>
  <text x="569" y="356" text-anchor="middle" fill="#9aa7b2" font-size="11.5">neighbour 1 · 2 falls off the list</text>
  <text x="340" y="384" text-anchor="middle" fill="#1a2026" font-size="13">Edge (1, 2) as the middle: wings x = 0 and y = 3 give 5 + 2 + 9 + 8 = <tspan fill="#4169E1" font-weight="600">24</tspan>.</text>
  <text x="340" y="402" text-anchor="middle" fill="#1a2026" font-size="13">Rows repeating a or b are skipped; among the top 3 a legal wing always remains.</text>
</svg>
