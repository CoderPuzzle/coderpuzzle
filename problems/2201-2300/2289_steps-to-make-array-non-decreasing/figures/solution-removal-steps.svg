<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <!-- nums = [5,3,4,4,7,3,6,11,8,5,11]; cells x = 44 + 56i, w 48, y 60 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="44" y="60" width="48" height="40" fill="#4169E1"/>
    <rect x="100" y="60" width="48" height="40" fill="#9db4ea"/>
    <rect x="156" y="60" width="48" height="40" fill="#dbe4f6"/>
    <rect x="212" y="60" width="48" height="40" fill="#eef3fc"/>
    <rect x="268" y="60" width="48" height="40" fill="#4169E1"/>
    <rect x="324" y="60" width="48" height="40" fill="#9db4ea"/>
    <rect x="380" y="60" width="48" height="40" fill="#dbe4f6"/>
    <rect x="436" y="60" width="48" height="40" fill="#4169E1"/>
    <rect x="492" y="60" width="48" height="40" fill="#9db4ea"/>
    <rect x="548" y="60" width="48" height="40" fill="#dbe4f6"/>
    <rect x="604" y="60" width="48" height="40" fill="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="68" y="85" fill="#ffffff">5</text><text x="124" y="85">3</text><text x="180" y="85">4</text>
    <text x="236" y="85">4</text><text x="292" y="85" fill="#ffffff">7</text><text x="348" y="85">3</text>
    <text x="404" y="85">6</text><text x="460" y="85" fill="#ffffff">11</text><text x="516" y="85">8</text>
    <text x="572" y="85">5</text><text x="628" y="85" fill="#ffffff">11</text>
  </g>
  <!-- removal step badges -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="68" y="122" fill="#4169E1" font-weight="600">step 0</text><text x="124" y="122">step 1</text>
    <text x="180" y="122">step 2</text><text x="236" y="122" fill="#1a2026" font-weight="600">step 3</text>
    <text x="292" y="122" fill="#4169E1" font-weight="600">step 0</text><text x="348" y="122">step 1</text>
    <text x="404" y="122">step 2</text><text x="460" y="122" fill="#4169E1" font-weight="600">step 0</text>
    <text x="516" y="122">step 1</text><text x="572" y="122">step 2</text><text x="628" y="122" fill="#4169E1" font-weight="600">step 0</text>
  </g>
  <!-- legend -->
  <g font-size="12.5" fill="#1a2026">
    <rect x="44" y="156" width="22" height="22" fill="#4169E1" stroke="#42525e" stroke-width="1.2"/>
    <text x="74" y="172">step 0 — prefix maxima survive forever</text>
    <rect x="44" y="186" width="22" height="22" fill="#9db4ea" stroke="#42525e" stroke-width="1.2"/>
    <text x="74" y="202">lighter = removed in a later round</text>
  </g>
  <!-- stack snapshot for the second 4 -->
  <text x="44" y="248" fill="#5c6b76" font-size="12.5">When the second 4 arrives, the stack holds (5, step 0) and (4, step 2):</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="44" y="262" width="60" height="30" fill="#dbe4f6" stroke="#42525e"/><text x="74" y="282">4 · s2</text>
    <rect x="44" y="292" width="60" height="30" fill="#4169E1" stroke="#42525e"/><text x="74" y="312" fill="#ffffff">5 · s0</text>
    <text x="124" y="282" text-anchor="start" fill="#1a2026">the 4 · s2 pops (4 ≤ 4), carrying cur = 2; the surviving 5 is strictly</text>
    <text x="124" y="302" text-anchor="start" fill="#1a2026">greater, so the new 4 is removed one round after the chain: step 3,</text>
    <text x="124" y="322" text-anchor="start" fill="#1a2026">pushed as (4, 3) — the maximum step in the array, hence the answer 3.</text>
  </g>
</svg>
