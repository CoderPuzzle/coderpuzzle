<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- tree [4,8,5,0,1,null,6]; circles r=22; edge labels carry (sum,size) child-to-parent; right column lists the post-order floor checks -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="95" y1="212" x2="133" y2="170" marker-end="url(#arrow)"/>
    <line x1="215" y1="212" x2="172" y2="170" marker-end="url(#arrow)"/>
    <line x1="405" y1="212" x2="367" y2="170" marker-end="url(#arrow)"/>
    <line x1="150" y1="128" x2="233" y2="84" marker-end="url(#arrow)"/>
    <line x1="350" y1="128" x2="267" y2="84" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#5c6b76">
    <text x="84" y="182">(0, 1)</text>
    <text x="228" y="182">(1, 1)</text>
    <text x="416" y="182">(6, 1)</text>
    <text x="150" y="98">(9, 3)</text>
    <text x="352" y="98">(11, 2)</text>
    <text x="250" y="26">(24, 6)</text>
  </g>
  <circle cx="250" cy="64" r="22" fill="#4169E1"/>
  <text x="250" y="70" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  <circle cx="350" cy="150" r="22" fill="#4169E1"/>
  <text x="350" y="156" text-anchor="middle" fill="#ffffff" font-weight="600">5</text>
  <circle cx="95" cy="236" r="22" fill="#4169E1"/>
  <text x="95" y="242" text-anchor="middle" fill="#ffffff" font-weight="600">0</text>
  <circle cx="215" cy="236" r="22" fill="#4169E1"/>
  <text x="215" y="242" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <circle cx="405" cy="236" r="22" fill="#4169E1"/>
  <text x="405" y="242" text-anchor="middle" fill="#ffffff" font-weight="600">6</text>
  <circle cx="150" cy="150" r="22" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <text x="150" y="156" text-anchor="middle" fill="#9aa7b2" font-weight="600">8</text>
  <g font-size="12.5" font-weight="600" text-anchor="middle" fill="#4169E1">
    <text x="95" y="276">0/1 = 0</text>
    <text x="215" y="276">1/1 = 1</text>
    <text x="405" y="276">6/1 = 6</text>
    <text x="350" y="192">11/2 = 5</text>
  </g>
  <text x="488" y="52" font-size="12.5" fill="#5c6b76">floor(sum / size) == val ?</text>
  <g font-size="13" font-weight="600" fill="#4169E1">
    <text x="488" y="78">0: 0/1 = 0</text>
    <text x="488" y="102">1: 1/1 = 1</text>
    <text x="488" y="150">6: 6/1 = 6</text>
    <text x="488" y="174">5: 11/2 = 5</text>
    <text x="488" y="198">4: 24/6 = 4</text>
  </g>
  <text x="488" y="126" font-size="13" fill="#9aa7b2">8: 9/3 = 3, not 8</text>
  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#1a2026">Node 8 misses (9/3 = 3); every other node matches floor(sum/size):</text>
  <text x="320" y="318" text-anchor="middle" font-size="13" fill="#1a2026">the root folds (24, 6) and 24/6 = 4, so <tspan fill="#4169E1" font-weight="600">5 nodes</tspan> qualify.</text>
</svg>
