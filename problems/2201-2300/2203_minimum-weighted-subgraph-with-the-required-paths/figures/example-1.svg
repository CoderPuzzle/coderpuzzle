    <line x1="102" y1="120" x2="486" y2="120" marker-end="url(#ink)"/>
    <line x1="213" y1="180" x2="97" y2="130" marker-end="url(#ink)"/>
    <line x1="243" y1="44" x2="386" y2="44" marker-end="url(#ink)"/>
    <line x1="243" y1="58" x2="386" y2="58" marker-end="url(#ink)"/>
    <line x1="400" y1="72" x2="400" y2="166" marker-end="url(#ink)"/>
  </g>
  <g fill="#1a2026" font-size="12" text-anchor="middle">
    <text x="143" y="78">2</text>
    <text x="295" y="112">6</text>
    <text x="147" y="162">3</text>
    <text x="315" y="182">5</text>
    <text x="243" y="140">1</text>
    <text x="314" y="36">3</text>
    <text x="314" y="74">4</text>
    <text x="412" y="142">2</text>
    <text x="462" y="166">1</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="80" cy="120" r="21"/>
    <circle cx="230" cy="50" r="21"/>
    <circle cx="230" cy="190" r="21"/>
    <circle cx="400" cy="50" r="21"/>
    <circle cx="400" cy="190" r="21"/>
    <circle cx="510" cy="120" r="21"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
