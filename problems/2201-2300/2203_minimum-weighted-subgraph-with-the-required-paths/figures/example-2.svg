<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="560" height="220" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <!-- edges = [[0,1,1],[2,1,1]]: no edge ever reaches node 2 -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="173" y1="110" x2="275" y2="110" marker-end="url(#ink)"/>
    <line x1="427" y1="110" x2="325" y2="110" marker-end="url(#ink)"/>
  </g>
  <g fill="#1a2026" font-size="12" text-anchor="middle">
    <text x="224" y="102">1</text>
    <text x="376" y="102">1</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="150" cy="110" r="21"/>
    <circle cx="300" cy="110" r="21"/>
    <circle cx="450" cy="110" r="21"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="150" y="116">0</text>
    <text x="300" y="116">1</text>
    <text x="450" y="116">2</text>
  </g>
  <g fill="#5c6b76" text-anchor="middle" font-size="11">
    <text x="150" y="152">src1</text>
    <text x="300" y="152">src2</text>
    <text x="450" y="152">dest</text>
  </g>
</svg>
