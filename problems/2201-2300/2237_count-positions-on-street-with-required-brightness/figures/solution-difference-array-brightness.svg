<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 444" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="444" fill="#ffffff"/>
  <!-- n=5, lights=[[0,1],[2,1],[3,2]] -> clamped [0,1],[1,3],[1,4]; diff cols: +1,+2,-1,0,-1 (+ -1 at sentinel n) -->
  <!-- brightness prefix sum [1,3,2,2,1] vs requirement [0,2,1,4,1]; cols 60 wide at x=200+66j -->
  <!-- position header -->
  <g stroke="#9aa7b2" stroke-width="1" fill="#f0f3f7">
    <rect x="200" y="44" width="60" height="26"/><rect x="266" y="44" width="60" height="26"/>
    <rect x="332" y="44" width="60" height="26"/><rect x="398" y="44" width="60" height="26"/>
    <rect x="464" y="44" width="60" height="26"/>
  </g>
  <text x="190" y="62" text-anchor="end" fill="#5c6b76" font-size="12">position</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="13" font-weight="600">
    <text x="230" y="62">0</text><text x="296" y="62">1</text><text x="362" y="62">2</text>
    <text x="428" y="62">3</text><text x="494" y="62">4</text>
  </g>
  <!-- lamp range bars -->
  <rect x="200" y="86" width="126" height="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1"/>
  <rect x="266" y="114" width="192" height="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1"/>
  <rect x="266" y="142" width="258" height="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1"/>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="190" y="100">lamp [0,1]</text>
    <text x="190" y="128">lamp [2,1]</text>
    <text x="190" y="156">lamp [3,2]</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="11.5" font-weight="600">
    <text x="263" y="100">[0, 1]</text>
    <text x="362" y="128">[1, 3]</text>
    <text x="395" y="156">[1, 4]</text>
  </g>
  <!-- diff row -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="200" y="178" width="60" height="34"/><rect x="266" y="178" width="60" height="34"/>
    <rect x="332" y="178" width="60" height="34"/><rect x="398" y="178" width="60" height="34"/>
    <rect x="464" y="178" width="60" height="34"/>
  </g>
  <rect x="530" y="178" width="44" height="34" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1"/>
  <text x="190" y="200" text-anchor="end" fill="#5c6b76" font-size="12">diff</text>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="230" y="200" fill="#4169E1">+1</text>
    <text x="296" y="200" fill="#4169E1">+2</text>
    <text x="362" y="200" fill="#5c6b76">-1</text>
    <text x="428" y="200" fill="#9aa7b2">0</text>
    <text x="494" y="200" fill="#5c6b76">-1</text>
    <text x="552" y="200" fill="#9aa7b2">-1</text>
  </g>
  <text x="296" y="228" text-anchor="middle" fill="#5c6b76" font-size="11">(two lamps start at 1)</text>
  <text x="552" y="228" text-anchor="middle" fill="#9aa7b2" font-size="11">index n</text>
  <!-- brightness row -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="200" y="246" width="60" height="34"/><rect x="266" y="246" width="60" height="34"/>
    <rect x="332" y="246" width="60" height="34"/><rect x="398" y="246" width="60" height="34"/>
    <rect x="464" y="246" width="60" height="34"/>
  </g>
  <text x="190" y="262" text-anchor="end" fill="#5c6b76" font-size="12">brightness</text>
  <text x="190" y="276" text-anchor="end" fill="#9aa7b2" font-size="11">(prefix sum)</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="230" y="268">1</text><text x="296" y="268">3</text><text x="362" y="268">2</text>
    <text x="428" y="268">2</text><text x="494" y="268">1</text>
  </g>
  <!-- required row -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="200" y="314" width="60" height="34"/><rect x="266" y="314" width="60" height="34"/>
    <rect x="332" y="314" width="60" height="34"/><rect x="398" y="314" width="60" height="34"/>
    <rect x="464" y="314" width="60" height="34"/>
  </g>
  <text x="190" y="336" text-anchor="end" fill="#5c6b76" font-size="12">required</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="230" y="336">0</text><text x="296" y="336">2</text><text x="362" y="336">1</text>
    <text x="428" y="336">4</text><text x="494" y="336">1</text>
  </g>
  <!-- position 3 falls short -->
  <rect x="396" y="244" width="66" height="140" fill="none" stroke="#1a2026" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g text-anchor="middle" font-size="12">
    <text x="230" y="372" fill="#9aa7b2">ok</text>
    <text x="296" y="372" fill="#9aa7b2">ok</text>
    <text x="362" y="372" fill="#9aa7b2">ok</text>
    <text x="428" y="372" fill="#1a2026" font-weight="600">short</text>
    <text x="494" y="372" fill="#9aa7b2">ok</text>
  </g>
  <text x="310" y="408" text-anchor="middle" fill="#1a2026" font-size="13">diff writes +1 at each clamped start and -1 past its end; the prefix sum gives</text>
  <text x="310" y="428" text-anchor="middle" fill="#1a2026" font-size="13">brightness [1, 3, 2, 2, 1]; only position 3 falls short, so the answer is <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
