<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- tiles = [[1,5],[10,11],[12,18],[20,25],[30,32]], carpetLen = 10; x(v) = 70 + 14v; accent band = carpet [10,19] covering 2 + 7 = 9; gray bracket below = carpet [1,10] covering 6 -->
  <text x="280" y="80" text-anchor="middle" font-size="12.5" fill="#4169E1" font-weight="600">carpet at 10: reach 10 + 10 - 1 = 19, covers 9</text>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="119" y="98">[1, 5]</text>
    <text x="224" y="98">[10, 11]</text>
    <text x="287" y="98">[12, 18]</text>
    <text x="392" y="98">[20, 25]</text>
    <text x="511" y="98">[30, 32]</text>
  </g>
  <rect x="210" y="104" width="140" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="84" y="106" width="70" height="20"/>
    <rect x="210" y="106" width="28" height="20"/>
    <rect x="238" y="106" width="98" height="20"/>
    <rect x="350" y="106" width="84" height="20"/>
    <rect x="490" y="106" width="42" height="20"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="224" y="120">+2</text>
    <text x="287" y="120">+7</text>
  </g>
  <line x1="64" y1="150" x2="540" y2="150" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="70" y1="150" x2="70" y2="156"/><line x1="140" y1="150" x2="140" y2="156"/>
    <line x1="210" y1="150" x2="210" y2="156"/><line x1="280" y1="150" x2="280" y2="156"/>
    <line x1="350" y1="150" x2="350" y2="156"/><line x1="420" y1="150" x2="420" y2="156"/>
    <line x1="490" y1="150" x2="490" y2="156"/>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="70" y="172">0</text><text x="140" y="172">5</text><text x="210" y="172">10</text>
    <text x="280" y="172">15</text><text x="350" y="172">20</text><text x="420" y="172">25</text><text x="490" y="172">30</text>
  </g>
  <path d="M 84 186 V 198 H 224 V 186" fill="none" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="154" y="216" text-anchor="middle" font-size="12.5" fill="#5c6b76">carpet at 1: reach 10, covers 5 + 1 = 6</text>
  <text x="300" y="246" text-anchor="middle" font-size="13" fill="#1a2026">Sliding the carpet's left edge onto tile starts, anchor 10 covers</text>
  <text x="300" y="264" text-anchor="middle" font-size="13" fill="#1a2026">[10, 11] and [12, 18] whole, 2 + 7 = <tspan fill="#4169E1" font-weight="600">9</tspan>; anchor 1 manages only 6.</text>
</svg>
