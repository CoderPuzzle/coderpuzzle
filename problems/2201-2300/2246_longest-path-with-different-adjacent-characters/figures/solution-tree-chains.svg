<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="330" fill="#ffffff"/>
  <!-- tree: 0(a) -> 1(b), 2(a); 1 -> 3(c), 4(b); 2 -> 5(e) -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="300" y1="84" x2="180" y2="156"/>
    <line x1="300" y1="84" x2="440" y2="156"/>
    <line x1="180" y1="188" x2="110" y2="256"/>
    <line x1="180" y1="188" x2="250" y2="256"/>
    <line x1="440" y1="188" x2="440" y2="256"/>
  </g>
  <!-- winning path 3 - 1 - 0 accent -->
  <g stroke="#4169E1" stroke-width="3.4" fill="none">
    <line x1="110" y1="256" x2="180" y2="188"/>
    <line x1="180" y1="172" x2="300" y2="90"/>
  </g>
  <!-- nodes: char inside, down label beside -->
  <g font-weight="600" text-anchor="middle" font-size="16">
    <circle cx="300" cy="72" r="22" fill="#4169E1" stroke="#42525e" stroke-width="1.6"/><text x="300" y="78" fill="#ffffff">a</text>
    <circle cx="180" cy="172" r="22" fill="#4169E1" stroke="#42525e" stroke-width="1.6"/><text x="180" y="178" fill="#ffffff">b</text>
    <circle cx="440" cy="172" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="440" y="178">a</text>
    <circle cx="110" cy="272" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="110" y="278">c</text>
    <circle cx="250" cy="272" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="250" y="278">b</text>
    <circle cx="440" cy="272" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="440" y="278">e</text>
  </g>
  <!-- down values -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="300" y="40" text-anchor="middle">down 3</text>
    <text x="180" y="140" text-anchor="middle">down 2</text>
    <text x="440" y="140" text-anchor="middle">down 2</text>
    <text x="110" y="312" text-anchor="middle">down 1</text>
    <text x="250" y="312" text-anchor="middle">down 1</text>
    <text x="440" y="312" text-anchor="middle">down 1</text>
  </g>
  <!-- blocked edges: 0-2 (a,a), 1-4 (b,b) -->
  <g stroke="#8a97a2" stroke-width="1.8">
    <line x1="348" y1="110" x2="372" y2="134"/>
    <line x1="348" y1="134" x2="372" y2="110"/>
    <line x1="200" y1="212" x2="224" y2="236"/>
    <line x1="200" y1="236" x2="224" y2="212"/>
  </g>
  <text x="392" y="112" fill="#8a97a2" font-size="12.5">a–a: contributes 0</text>
  <text x="196" y="240" fill="#8a97a2" font-size="12.5" text-anchor="end">b–b: contributes 0</text>
  <!-- narration -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="510" y="230">At the root, child 2</text>
    <text x="510" y="246">shares its letter and</text>
    <text x="510" y="262">contributes 0, so the</text>
    <text x="510" y="278">answer joins only the</text>
    <text x="510" y="294">best chain: 2 + 0 + 1.</text>
  </g>
  <text x="30" y="46" fill="#1a2026" font-size="13">The winning path c – b – a has adjacent letters all distinct, length <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
