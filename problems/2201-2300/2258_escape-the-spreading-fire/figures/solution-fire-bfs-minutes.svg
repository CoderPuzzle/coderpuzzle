    <rect x="60" y="128" width="58" height="44"/><rect x="118" y="128" width="58" height="44"/><rect x="176" y="128" width="58" height="44"/><rect x="234" y="128" width="58" height="44"/><rect x="292" y="128" width="58" height="44"/><rect x="350" y="128" width="58" height="44"/><rect x="408" y="128" width="58" height="44"/>
    <rect x="60" y="172" width="58" height="44"/><rect x="118" y="172" width="58" height="44"/><rect x="176" y="172" width="58" height="44"/><rect x="234" y="172" width="58" height="44"/><rect x="292" y="172" width="58" height="44"/><rect x="350" y="172" width="58" height="44"/><rect x="408" y="172" width="58" height="44"/>
    <rect x="60" y="216" width="58" height="44"/><rect x="118" y="216" width="58" height="44"/><rect x="176" y="216" width="58" height="44"/><rect x="234" y="216" width="58" height="44"/><rect x="292" y="216" width="58" height="44"/><rect x="350" y="216" width="58" height="44"/><rect x="408" y="216" width="58" height="44"/>
    <rect x="60" y="260" width="58" height="44"/><rect x="118" y="260" width="58" height="44"/><rect x="176" y="260" width="58" height="44"/><rect x="234" y="260" width="58" height="44"/><rect x="292" y="260" width="58" height="44"/><rect x="350" y="260" width="58" height="44"/><rect x="408" y="260" width="58" height="44"/>
  </g>
  <g fill="#4169E1">
    <rect x="351" y="129" width="56" height="42"/><rect x="293" y="173" width="56" height="42"/>
  </g>
  <polyline points="76,106 76,296 434,296" fill="none" stroke="#4169E1" stroke-width="3"/>
  <g fill="#4169E1">
    <circle cx="76" cy="106" r="3.5"/><circle cx="76" cy="296" r="3.5"/><circle cx="434" cy="296" r="3.5"/>
  </g>
  <g fill="#42525e">
    <rect x="126" y="92" width="42" height="28"/><rect x="242" y="136" width="42" height="28"/><rect x="300" y="136" width="42" height="28"/>
    <rect x="126" y="180" width="42" height="28"/><rect x="358" y="180" width="42" height="28"/>
    <rect x="184" y="224" width="42" height="28"/><rect x="242" y="224" width="42" height="28"/><rect x="300" y="224" width="42" height="28"/><rect x="416" y="224" width="42" height="28"/>
  </g>
  <rect x="409" y="261" width="56" height="42" fill="none" stroke="#4169E1" stroke-width="2.4"/>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="89" y="111">6</text><text x="205" y="111">4</text><text x="263" y="111">3</text><text x="321" y="111">2</text><text x="379" y="111">1</text><text x="437" y="111">2</text>
    <text x="89" y="155">5</text><text x="147" y="155">4</text><text x="205" y="155">3</text><text x="379" y="155" fill="#ffffff" font-weight="700">0</text><text x="437" y="155">1</text>
    <text x="89" y="199">6</text><text x="205" y="199">2</text><text x="263" y="199">1</text><text x="321" y="199" fill="#ffffff" font-weight="700">0</text><text x="437" y="199">2</text>
    <text x="89" y="243">7</text><text x="147" y="243">8</text><text x="379" y="243">14</text>
    <text x="89" y="287">8</text><text x="147" y="287">9</text><text x="205" y="287">10</text><text x="263" y="287">11</text><text x="321" y="287">12</text><text x="379" y="287">13</text><text x="437" y="287">14</text>
  </g>
  <text x="89" y="76" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">leave at t = 4</text>
  <text x="437" y="322" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">arrive at t = 13</text>
  <!-- legend -->
  <rect x="60" y="36" width="18" height="18" fill="#42525e"/>
  <text x="86" y="50" fill="#1a2026" font-size="12">wall</text>
  <rect x="150" y="36" width="18" height="18" fill="#4169E1"/>
  <text x="176" y="50" fill="#1a2026" font-size="12">initial fire</text>
  <text x="280" y="50" fill="#1a2026" font-size="13" font-weight="600">n</text>
  <text x="294" y="50" fill="#1a2026" font-size="12">minute fire arrives</text>
  <line x1="450" y1="45" x2="468" y2="45" stroke="#4169E1" stroke-width="3"/>
  <text x="476" y="50" fill="#1a2026" font-size="12">your path</text>
  <text x="290" y="350" text-anchor="middle" fill="#1a2026" font-size="13">Fire minutes from one multi-source BFS: wait <tspan fill="#4169E1" font-weight="600">3</tspan> minutes, then walk</text>
  <text x="290" y="370" text-anchor="middle" fill="#1a2026" font-size="13">at t = 4..13, always strictly ahead — only the safehouse may tie (<tspan fill="#4169E1" font-weight="600">13 &lt;= 14</tspan>).</text>
</svg>
