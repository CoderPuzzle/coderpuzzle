<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="580" height="384" fill="#ffffff"/>
  <!-- grid = [[0,2,0,0,0,0,0],[0,0,0,2,2,1,0],[0,2,0,0,1,2,0],[0,0,2,2,2,0,2],[0,0,0,0,0,0,0]];
       cells 58x44 at (60,84); numbers = fire-arrival minutes from multi-source BFS seeded at (1,5) and (2,4);
       accent line = the still-safe walk after waiting 3: down column 0 at t = 4..7, along row 4 at t = 8..13 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
