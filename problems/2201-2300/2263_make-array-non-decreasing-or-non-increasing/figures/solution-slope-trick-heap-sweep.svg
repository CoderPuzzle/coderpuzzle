<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="322" fill="#ffffff"/>
  <!-- nums = [3,2,4,5,0]; top table = non-decreasing sweep (heap contents after pushing v; pay max-v on shaded rows); bottom cells = negated sweep payments -->
  <text x="112" y="28" font-size="13" font-weight="600" fill="#1a2026">non-decreasing sweep over [3, 2, 4, 5, 0]</text>
  <g fill="#5c6b76" font-size="12">
    <text x="140" y="52" text-anchor="middle">v</text>
    <text x="330" y="52" text-anchor="middle">heap after push</text>
    <text x="470" y="52" text-anchor="middle">pay max-v</text>
    <text x="570" y="52" text-anchor="middle">cost</text>
  </g>
  <rect x="112" y="86" width="488" height="24" fill="#dbe4fb"/>
  <rect x="112" y="164" width="488" height="24" fill="#dbe4fb"/>
  <g text-anchor="middle">
    <g fill="#1a2026">
      <text x="140" y="78">3</text><text x="140" y="104">2</text><text x="140" y="130">4</text>
      <text x="140" y="156">5</text><text x="140" y="182">0</text>
      <text x="330" y="78">3</text><text x="330" y="104">2, 2</text><text x="330" y="130">2, 2, 4</text>
      <text x="330" y="156">2, 2, 4, 5</text><text x="330" y="182">0, 0, 2, 2, 4</text>
      <text x="570" y="78">0</text><text x="570" y="104">1</text><text x="570" y="130">1</text><text x="570" y="156">1</text>
    </g>
    <g fill="#9aa7b2">
      <text x="470" y="78">-</text><text x="470" y="130">-</text><text x="470" y="156">-</text>
    </g>
    <g fill="#4169E1" font-weight="600">
      <text x="470" y="104">3-2 = 1</text>
      <text x="470" y="182">5-0 = 5</text>
      <text x="570" y="182">6</text>
    </g>
  </g>
  <text x="112" y="218" font-size="13" font-weight="600" fill="#1a2026">non-increasing sweep over [-3, -2, -4, -5, 0]</text>
  <text x="600" y="218" font-size="13" text-anchor="end" fill="#4169E1" font-weight="600">cost 4</text>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="112" y="228" width="92" height="40" fill="#ffffff"/>
    <rect x="208" y="228" width="92" height="40" fill="#ffffff"/>
    <rect x="304" y="228" width="92" height="40" fill="#dbe4fb"/>
    <rect x="400" y="228" width="92" height="40" fill="#dbe4fb"/>
    <rect x="496" y="228" width="92" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="158" y="247" fill="#1a2026">-3</text><text x="254" y="247" fill="#1a2026">-2</text>
    <text x="350" y="247" fill="#1a2026">-4</text><text x="446" y="247" fill="#1a2026">-5</text>
    <text x="542" y="247" fill="#1a2026">0</text>
    <text x="158" y="263" fill="#9aa7b2">-</text><text x="254" y="263" fill="#9aa7b2">-</text>
    <text x="350" y="263" fill="#4169E1" font-weight="600">2</text>
    <text x="446" y="263" fill="#4169E1" font-weight="600">2</text>
    <text x="542" y="263" fill="#9aa7b2">-</text>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="13" fill="#1a2026">Paying max-v at v = 2 and v = 0 gives a non-decreasing array for <tspan fill="#4169E1" font-weight="600">6</tspan>;</text>
  <text x="320" y="312" text-anchor="middle" font-size="13" fill="#1a2026">the negated sweep pays 2 + 2 = 4, and <tspan fill="#4169E1" font-weight="600">min(6, 4) = 4</tspan> wins.</text>
</svg>
