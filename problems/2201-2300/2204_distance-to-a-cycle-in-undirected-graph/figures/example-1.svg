<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="560" height="330" fill="#ffffff"/>
  <!-- edges = [[1,2],[2,4],[4,3],[3,1],[0,1],[5,2],[6,5]]; cycle 1-2-4-3 -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="220" y1="55" x2="220" y2="89"/>
    <line x1="241" y1="110" x2="339" y2="110"/>
    <line x1="360" y1="131" x2="360" y2="229"/>
    <line x1="339" y1="250" x2="241" y2="250"/>
    <line x1="220" y1="229" x2="220" y2="131"/>
    <line x1="381" y1="110" x2="429" y2="110"/>
    <line x1="450" y1="110" x2="499" y2="110"/>
  </g>
  <!-- cycle nodes -->
  <g fill="#4169E1" fill-opacity="0.25" stroke="#4169E1" stroke-width="2">
    <circle cx="220" cy="110" r="20"/>
    <circle cx="360" cy="110" r="20"/>
    <circle cx="360" cy="250" r="20"/>
    <circle cx="220" cy="250" r="20"/>
  </g>
  <!-- tail nodes -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="220" cy="35" r="20"/>
    <circle cx="450" cy="110" r="20"/>
    <circle cx="520" cy="110" r="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="220" y="41">0</text>
    <text x="220" y="116">1</text>
    <text x="360" y="116">2</text>
    <text x="360" y="256">4</text>
    <text x="220" y="256">3</text>
    <text x="450" y="116">5</text>
    <text x="520" y="116">6</text>
  </g>
</svg>
