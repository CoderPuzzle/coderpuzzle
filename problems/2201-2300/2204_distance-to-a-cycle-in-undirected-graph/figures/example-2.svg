<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="560" height="220" fill="#ffffff"/>
  <!-- edges = [[0,1],[1,2],[0,2],[2,6],[6,7],[6,8],[0,3],[3,4],[3,5]]; cycle 0-1-2 -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="278" y1="68" x2="335" y2="150"/>
    <line x1="363" y1="150" x2="403" y2="68"/>
    <line x1="281" y1="55" x2="400" y2="55"/>
    <line x1="400" y1="55" x2="450" y2="55"/>
    <line x1="486" y1="45" x2="509" y2="32"/>
    <line x1="486" y1="65" x2="509" y2="78"/>
    <line x1="242" y1="55" x2="184" y2="55"/>
    <line x1="145" y1="43" x2="118" y2="31"/>
    <line x1="145" y1="67" x2="118" y2="90"/>
  </g>
  <!-- cycle nodes -->
  <g fill="#4169E1" fill-opacity="0.25" stroke="#4169E1" stroke-width="2">
    <circle cx="260" cy="55" r="20"/>
    <circle cx="380" cy="55" r="20"/>
    <circle cx="350" cy="168" r="20"/>
  </g>
  <!-- tail nodes -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="165" cy="55" r="19"/>
    <circle cx="100" cy="25" r="19"/>
    <circle cx="100" cy="98" r="19"/>
    <circle cx="470" cy="55" r="19"/>
    <circle cx="525" cy="22" r="19"/>
    <circle cx="525" cy="88" r="19"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="260" y="61">0</text>
    <text x="380" y="61">2</text>
    <text x="350" y="174">1</text>
    <text x="165" y="61">3</text>
    <text x="100" y="31">4</text>
    <text x="100" y="104">5</text>
    <text x="470" y="61">6</text>
    <text x="525" y="28">7</text>
    <text x="525" y="94">8</text>
  </g>
</svg>
