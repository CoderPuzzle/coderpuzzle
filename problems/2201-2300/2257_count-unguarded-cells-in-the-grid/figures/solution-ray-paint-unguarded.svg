  <text x="280" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Each guard paints its four rays until a wall or guard blocks the view;</text>
  <text x="280" y="316" text-anchor="middle" fill="#1a2026" font-size="13">the <tspan fill="#4169E1" font-weight="600">7</tspan> never-written cells — like (0, 2) and (3, 5) — are the answer.</text>
