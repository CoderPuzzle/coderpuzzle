<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 226" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- heights = [[5,1],[3,1],[4,1]] -> answer [[3,1],[2,1],[1,0]] -->
  <text x="80" y="30" fill="#5c6b76" font-size="13">heights</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="80" y="40" width="52" height="52"/><rect x="132" y="40" width="52" height="52"/>
    <rect x="80" y="92" width="52" height="52"/><rect x="132" y="92" width="52" height="52"/>
    <rect x="80" y="144" width="52" height="52"/><rect x="132" y="144" width="52" height="52"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="106" y="71">5</text><text x="158" y="71">1</text>
    <text x="106" y="123">3</text><text x="158" y="123">1</text>
    <text x="106" y="175">4</text><text x="158" y="175">1</text>
  </g>
  <text x="340" y="30" fill="#5c6b76" font-size="13">answer</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#e6ecfb">
    <rect x="340" y="40" width="52" height="52"/><rect x="392" y="40" width="52" height="52"/>
    <rect x="340" y="92" width="52" height="52"/><rect x="392" y="92" width="52" height="52"/>
    <rect x="340" y="144" width="52" height="52"/><rect x="392" y="144" width="52" height="52"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="700">
    <text x="366" y="71">3</text><text x="418" y="71">1</text>
    <text x="366" y="123">2</text><text x="418" y="123">1</text>
    <text x="366" y="175">1</text><text x="418" y="175">0</text>
  </g>
  <text x="260" y="218" text-anchor="middle" fill="#5c6b76" font-size="12.5">a person is seen when everyone in between is shorter than both</text>
</svg>
