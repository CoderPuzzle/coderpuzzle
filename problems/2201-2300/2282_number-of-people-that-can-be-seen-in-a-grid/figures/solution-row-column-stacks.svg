<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- heights = [[5,1],[3,1],[4,1]]; grid cells 78x58 from (80,70), each showing height and final sees;
       stack boxes 40x26: row 0 scanned right-to-left (top right), column 0 scanned bottom-to-top (bottom);
       struck gray boxes were popped by the observer, sees = pops + (1 if a >= top remains) -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="80" y="70" width="78" height="58"/><rect x="158" y="70" width="78" height="58"/>
    <rect x="80" y="128" width="78" height="58"/><rect x="158" y="128" width="78" height="58"/>
    <rect x="80" y="186" width="78" height="58"/><rect x="158" y="186" width="78" height="58"/>
  </g>
  <g text-anchor="middle">
    <g fill="#1a2026" font-size="15" font-weight="600">
      <text x="119" y="95">5</text><text x="197" y="95">1</text>
      <text x="119" y="153">3</text><text x="197" y="153">1</text>
      <text x="119" y="211">4</text><text x="197" y="211">1</text>
    </g>
    <g font-size="11.5">
      <text x="119" y="116"><tspan fill="#5c6b76">sees </tspan><tspan fill="#4169E1" font-weight="700" font-size="12">3</tspan></text>
      <text x="197" y="116"><tspan fill="#5c6b76">sees </tspan><tspan fill="#4169E1" font-weight="700" font-size="12">1</tspan></text>
      <text x="119" y="174"><tspan fill="#5c6b76">sees </tspan><tspan fill="#4169E1" font-weight="700" font-size="12">2</tspan></text>
      <text x="197" y="174"><tspan fill="#5c6b76">sees </tspan><tspan fill="#4169E1" font-weight="700" font-size="12">1</tspan></text>
      <text x="119" y="232"><tspan fill="#5c6b76">sees </tspan><tspan fill="#4169E1" font-weight="700" font-size="12">1</tspan></text>
      <text x="197" y="232"><tspan fill="#5c6b76">sees </tspan><tspan fill="#4169E1" font-weight="700" font-size="12">0</tspan></text>
    </g>
  </g>
  <text x="300" y="58" fill="#5c6b76" font-size="12.5" font-weight="600">row 0, right → left</text>
  <g text-anchor="middle" fill="#1a2026" font-size="12">
    <text x="352" y="80">(0, 1): x = 1</text>
    <text x="520" y="80">(0, 0): x = 5</text>
  </g>
  <g>
    <rect x="332" y="92" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="352" y="110" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">1</text>
    <line x1="404" y1="105" x2="430" y2="105" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrowg)"/>
    <rect x="436" y="92" width="40" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
    <line x1="440" y1="114" x2="472" y2="96" stroke="#9aa7b2" stroke-width="1"/>
    <text x="456" y="110" text-anchor="middle" fill="#9aa7b2" font-size="13" font-weight="600">1</text>
    <text x="498" y="122" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">pops 1</text>
    <line x1="480" y1="105" x2="516" y2="105" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="520" y="92" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="540" y="110" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">5</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="352" y="140"><tspan fill="#5c6b76">right: </tspan><tspan fill="#4169E1" font-weight="600">0</tspan></text>
    <text x="510" y="140"><tspan fill="#5c6b76">right: </tspan><tspan fill="#1a2026">1 + 0 = </tspan><tspan fill="#4169E1" font-weight="600">1</tspan></text>
  </g>
  <text x="80" y="262" fill="#5c6b76" font-size="12.5" font-weight="600">column 0, bottom → top</text>
  <g text-anchor="middle" fill="#1a2026" font-size="12">
    <text x="130" y="286">(2, 0): x = 4</text>
    <text x="290" y="286">(1, 0): x = 3</text>
    <text x="528" y="286">(0, 0): x = 5</text>
  </g>
  <g>
    <rect x="110" y="346" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="130" y="364" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">4</text>
    <rect x="270" y="346" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="270" y="320" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="290" y="364" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">4</text>
    <text x="290" y="338" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">3</text>
    <text x="330" y="336" fill="#5c6b76" font-size="11">top 4 ≥ 3 stays → +1</text>
    <rect x="470" y="346" width="40" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
    <rect x="470" y="320" width="40" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
    <line x1="474" y1="368" x2="506" y2="350" stroke="#9aa7b2" stroke-width="1"/>
    <line x1="474" y1="342" x2="506" y2="324" stroke="#9aa7b2" stroke-width="1"/>
    <text x="490" y="364" text-anchor="middle" fill="#9aa7b2" font-size="13" font-weight="600">4</text>
    <text x="490" y="338" text-anchor="middle" fill="#9aa7b2" font-size="13" font-weight="600">3</text>
    <text x="532" y="314" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">pops 2</text>
    <line x1="514" y1="359" x2="542" y2="359" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="546" y="346" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="566" y="364" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">5</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="100" y1="372" x2="160" y2="372"/>
    <line x1="260" y1="372" x2="320" y2="372"/>
    <line x1="460" y1="372" x2="596" y2="372"/>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="130" y="394"><tspan fill="#5c6b76">below: </tspan><tspan fill="#4169E1" font-weight="600">0</tspan></text>
    <text x="290" y="394"><tspan fill="#5c6b76">below: </tspan><tspan fill="#1a2026">0 + 1 = </tspan><tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="528" y="394"><tspan fill="#5c6b76">below: </tspan><tspan fill="#1a2026">2 + 0 = </tspan><tspan fill="#4169E1" font-weight="600">2</tspan></text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="330" y="430">Pops are people seen; a remaining top at height ≥ x adds one, then blocks.</text>
    <text x="330" y="450">(0, 0) sees <tspan fill="#4169E1" font-weight="600">1 + 2 = 3</tspan>; equal 1s count once each, then block: <tspan fill="#4169E1" font-weight="600">3,1 / 2,1 / 1,0</tspan>.</text>
  </g>
</svg>
