<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 118" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- heights = [[3,1,4,2,5]] -> answer [[2,1,2,1,0]] -->
  <text x="40" y="30" fill="#5c6b76" font-size="13">heights</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="40" y="40" width="52" height="52"/>
    <rect x="92" y="40" width="52" height="52"/>
    <rect x="144" y="40" width="52" height="52"/>
    <rect x="196" y="40" width="52" height="52"/>
    <rect x="248" y="40" width="52" height="52"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="66" y="71">3</text><text x="118" y="71">1</text><text x="170" y="71">4</text><text x="222" y="71">2</text><text x="274" y="71">5</text>
  </g>
  <text x="360" y="30" fill="#5c6b76" font-size="13">answer</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#e6ecfb">
    <rect x="360" y="40" width="52" height="52"/>
    <rect x="412" y="40" width="52" height="52"/>
    <rect x="464" y="40" width="52" height="52"/>
    <rect x="516" y="40" width="52" height="52"/>
    <rect x="568" y="40" width="52" height="52"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="700">
    <text x="386" y="71">2</text><text x="438" y="71">1</text><text x="490" y="71">2</text><text x="542" y="71">1</text><text x="594" y="71">0</text>
  </g>
  <text x="330" y="110" text-anchor="middle" fill="#5c6b76" font-size="12.5">a person is seen when everyone in between is shorter than both</text>
</svg>
