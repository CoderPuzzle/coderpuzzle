<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- start=10 = 1010, goal=7 = 0111, xor=13 = 1101; cells 64x44 at x=180+72j, rows y=56/120/184; differing columns 0,1,3 -->
  <g text-anchor="end" fill="#9aa7b2" font-size="12">
    <text x="160" y="44">place</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="212" y="44">8</text><text x="284" y="44">4</text><text x="356" y="44">2</text><text x="428" y="44">1</text>
  </g>
  <!-- start row: 1 0 1 0 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="180" y="56" width="64" height="44" fill="#dbe4fb"/>
    <rect x="252" y="56" width="64" height="44" fill="#dbe4fb"/>
    <rect x="324" y="56" width="64" height="44" fill="#ffffff"/>
    <rect x="396" y="56" width="64" height="44" fill="#dbe4fb"/>
  </g>
  <!-- goal row: 0 1 1 1 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="180" y="120" width="64" height="44" fill="#dbe4fb"/>
    <rect x="252" y="120" width="64" height="44" fill="#dbe4fb"/>
    <rect x="324" y="120" width="64" height="44" fill="#ffffff"/>
    <rect x="396" y="120" width="64" height="44" fill="#dbe4fb"/>
  </g>
  <!-- xor row: 1 1 0 1 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="180" y="184" width="64" height="44" fill="#4169E1"/>
    <rect x="252" y="184" width="64" height="44" fill="#4169E1"/>
    <rect x="324" y="184" width="64" height="44" fill="#f0f3f7"/>
    <rect x="396" y="184" width="64" height="44" fill="#4169E1"/>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="160" y="83">start = 10</text>
    <text x="160" y="147">goal = 7</text>
    <text x="160" y="211">start ^ goal = 13</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="212" y="83" fill="#1a2026">1</text><text x="284" y="83" fill="#1a2026">0</text>
    <text x="356" y="83" fill="#9aa7b2">1</text><text x="428" y="83" fill="#1a2026">0</text>
    <text x="212" y="147" fill="#1a2026">0</text><text x="284" y="147" fill="#1a2026">1</text>
    <text x="356" y="147" fill="#9aa7b2">1</text><text x="428" y="147" fill="#1a2026">1</text>
    <text x="212" y="211" fill="#ffffff">1</text><text x="284" y="211" fill="#ffffff">1</text>
    <text x="356" y="211" fill="#9aa7b2">0</text><text x="428" y="211" fill="#ffffff">1</text>
  </g>
  <path d="M 466 206 L 494 206" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="502" y="211" fill="#4169E1" font-weight="600" font-size="14">popcount = 3</text>
  <text x="310" y="270" text-anchor="middle" fill="#1a2026" font-size="13">1010 ^ 0111 = 1101 — a set bit marks exactly a position where start and goal</text>
  <text x="310" y="290" text-anchor="middle" fill="#1a2026" font-size="13">disagree; counting the three set bits gives the minimum <tspan fill="#4169E1" font-weight="600">3</tspan> flips.</text>
</svg>
