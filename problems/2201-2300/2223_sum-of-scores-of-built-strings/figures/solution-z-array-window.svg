<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = b a b a b; cells 56x44 at x=230+62j, y=60; window [left,right) = [2,5) covers cells 2..4 -->
  <!-- z = [5, 0, 3, 0, 1], sum 9 -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="40" y="66">i = 2 compared</text>
    <text x="40" y="82">b, a, b directly:</text>
    <text x="40" y="98">z[2] = 3 opens</text>
    <text x="40" y="114">window [2, 5)</text>
  </g>
  <rect x="350" y="56" width="188" height="52" fill="#dbe4fb"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="230" y="60" width="56" height="44"/>
    <rect x="292" y="60" width="56" height="44"/>
    <rect x="354" y="60" width="56" height="44"/>
    <rect x="416" y="60" width="56" height="44"/>
    <rect x="478" y="60" width="56" height="44"/>
  </g>
  <text x="214" y="87" text-anchor="end" fill="#5c6b76" font-size="12.5">s</text>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="258" y="87">b</text><text x="320" y="87">a</text><text x="382" y="87">b</text>
    <text x="444" y="87">a</text><text x="506" y="87">b</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="258" y="122">0</text><text x="320" y="122">1</text><text x="382" y="122">2</text>
    <text x="444" y="122">3</text><text x="506" y="122">4</text>
  </g>
  <path d="M 354 136 L 354 130 L 534 130 L 534 136" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="444" y="154" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">window [left, right) = [2, 5)</text>
  <text x="214" y="207" text-anchor="end" fill="#5c6b76" font-size="12.5">z</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="258" y="207" fill="#4169E1">5</text>
    <text x="320" y="207" fill="#9aa7b2">0</text>
    <text x="382" y="207" fill="#4169E1">3</text>
    <text x="444" y="207" fill="#9aa7b2">0</text>
    <text x="506" y="207" fill="#1a2026">1</text>
  </g>
  <text x="258" y="226" text-anchor="middle" fill="#5c6b76" font-size="12">(z[0] = n)</text>
  <path d="M 382 224 Q 444 252 506 224" fill="none" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="444" y="268" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">seed z[4 - 2] = 3, capped to right - i = 1</text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">The scores are the z-values of s = babab summed: 5 + 0 + 3 + 0 + 1 = <tspan fill="#4169E1" font-weight="600">9</tspan>,</text>
  <text x="320" y="320" text-anchor="middle" fill="#1a2026" font-size="13">with z[0] = n for the whole string; position 4 reuses its seed instead of re-comparing.</text>
</svg>
