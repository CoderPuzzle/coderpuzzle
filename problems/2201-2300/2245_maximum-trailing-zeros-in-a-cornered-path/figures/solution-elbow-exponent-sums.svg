  <text x="340" y="374" text-anchor="middle" fill="#1a2026" font-size="13">Each cell's (twos, fives) pair feeds row and column running sums;</text>
  <text x="340" y="394" text-anchor="middle" fill="#1a2026" font-size="13">at elbow (3, 2) the two arms meet in min(4, 3) = <tspan fill="#4169E1" font-weight="600">3</tspan> trailing zeros.</text>
