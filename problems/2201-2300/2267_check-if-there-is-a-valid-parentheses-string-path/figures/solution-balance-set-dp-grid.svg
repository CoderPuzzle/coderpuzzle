<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="520" height="384" fill="#ffffff"/>
  <!-- grid = [["(","(","("],[")","(",")"],["(","(",")"],["(","(",")"]]; cells 120x62 from (80,64); badge = row-major fill order; bottom line of each cell = its balance set -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="80" y="64" width="120" height="62"/><rect x="200" y="64" width="120" height="62"/><rect x="320" y="64" width="120" height="62"/>
    <rect x="80" y="126" width="120" height="62"/><rect x="200" y="126" width="120" height="62"/><rect x="320" y="126" width="120" height="62"/>
    <rect x="80" y="188" width="120" height="62"/><rect x="200" y="188" width="120" height="62"/><rect x="320" y="188" width="120" height="62"/>
    <rect x="80" y="250" width="120" height="62"/><rect x="200" y="250" width="120" height="62"/>
    <rect x="320" y="250" width="120" height="62" fill="#dbe4fb"/>
  </g>
  <g fill="#9aa7b2" font-size="11">
    <text x="89" y="80">1</text><text x="209" y="80">2</text><text x="329" y="80">3</text>
    <text x="89" y="142">4</text><text x="209" y="142">5</text><text x="329" y="142">6</text>
    <text x="89" y="204">7</text><text x="209" y="204">8</text><text x="329" y="204">9</text>
    <text x="89" y="266">10</text><text x="209" y="266">11</text><text x="329" y="266">12</text>
  </g>
  <g text-anchor="middle">
    <g fill="#1a2026" font-size="17" font-weight="600">
      <text x="140" y="98">(</text><text x="260" y="98">(</text><text x="380" y="98">(</text>
      <text x="140" y="160">)</text><text x="260" y="160">(</text><text x="380" y="160">)</text>
      <text x="140" y="222">(</text><text x="260" y="222">(</text><text x="380" y="222">)</text>
      <text x="140" y="284">(</text><text x="260" y="284">(</text><text x="380" y="284">)</text>
    </g>
    <g fill="#4169E1" font-size="13.5" font-weight="600">
      <text x="140" y="117">{1}</text><text x="260" y="117">{2}</text><text x="380" y="117">{3}</text>
      <text x="140" y="179">{0}</text><text x="260" y="179">{1, 3}</text><text x="380" y="179">{0, 2}</text>
      <text x="140" y="241">{1}</text><text x="260" y="241">{2, 4}</text><text x="380" y="241">{1, 3}</text>
      <text x="140" y="303">{2}</text><text x="260" y="303">{3, 5}</text><text x="380" y="303">{0, 2, 4}</text>
    </g>
  </g>
  <text x="260" y="344" text-anchor="middle" font-size="13" fill="#1a2026">Scanned row-major, each cell unions the sets from above and left,</text>
  <text x="260" y="362" text-anchor="middle" font-size="13" fill="#1a2026">+1 on '(' and -1 on ')', negatives dropped; cell 12 holds <tspan fill="#4169E1" font-weight="600">0</tspan>, so true.</text>
</svg>
