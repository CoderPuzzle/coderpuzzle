<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree edges [[0,1],[0,2],[0,3],[1,4],[2,5],[2,6]] rooted at 0; path 5-2-0-3 accented;
       off-path nodes 4 and 6 point at their closest path node: 4 -> 0 (dist 2), 6 -> 2 (dist 1) -->
  <text x="24" y="38" fill="#4169E1" font-size="12.5" font-weight="600">path 5 → 2 → 0 → 3</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="310" y1="58" x2="140" y2="138"/>
    <line x1="140" y1="138" x2="140" y2="218"/>
    <line x1="310" y1="138" x2="390" y2="218"/>
  </g>
  <g stroke="#4169E1" stroke-width="3">
    <line x1="240" y1="218" x2="310" y2="138"/>
    <line x1="310" y1="138" x2="310" y2="58"/>
    <line x1="310" y1="58" x2="480" y2="138"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 152 206 Q 210 130 298 72" marker-end="url(#arrow)"/>
    <path d="M 380 204 Q 380 168 324 150" marker-end="url(#arrow)"/>
  </g>
  <g stroke-width="1.5">
    <circle cx="310" cy="58" r="16" fill="#4169E1" stroke="#4169E1"/>
    <circle cx="310" cy="138" r="16" fill="#4169E1" stroke="#4169E1"/>
    <circle cx="480" cy="138" r="16" fill="#4169E1" stroke="#4169E1"/>
    <circle cx="240" cy="218" r="16" fill="#4169E1" stroke="#4169E1"/>
    <circle cx="140" cy="138" r="16" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="140" cy="218" r="16" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="390" cy="218" r="16" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="310" y="63" fill="#ffffff">0</text>
    <text x="310" y="143" fill="#ffffff">2</text>
    <text x="480" y="143" fill="#ffffff">3</text>
    <text x="240" y="223" fill="#ffffff">5</text>
    <text x="140" y="143" fill="#5c6b76">1</text>
    <text x="140" y="223" fill="#5c6b76">4</text>
    <text x="390" y="223" fill="#5c6b76">6</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="128" y="252">node 4: deepest LCA <tspan fill="#4169E1" font-weight="600">0</tspan>, dist 2</text>
    <text x="396" y="252">node 6: deepest LCA <tspan fill="#4169E1" font-weight="600">2</tspan>, dist 1</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="310" y="290">query [5, 3, 4]: the three pairwise LCAs all meet at 0 — the answer is <tspan fill="#4169E1" font-weight="600">0</tspan>.</text>
    <text x="310" y="310">query [5, 3, 6]: they are 0, 2, 0 — LCA(5, 6) = 2 is deepest, so the answer is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
  </g>
</svg>
