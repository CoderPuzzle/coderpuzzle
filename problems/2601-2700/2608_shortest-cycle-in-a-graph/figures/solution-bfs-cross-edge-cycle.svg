<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- n = 7, edges = [[0,1],[1,2],[2,0],[3,4],[4,5],[5,6],[6,3]]; BFS tree from 0: 0-1, 0-2 at dist 1; cross edge 1-2 closes the 3-cycle -->
  <text x="320" y="36" text-anchor="middle" fill="#5c6b76" font-size="13">BFS rooted at vertex 0 over example 1's graph</text>
  <!-- BFS tree edges out of the root -->
  <g stroke="#42525e" stroke-width="1.8" marker-end="url(#arrow)">
    <line x1="169" y1="103" x2="126" y2="167"/>
    <line x1="191" y1="103" x2="234" y2="167"/>
  </g>
  <!-- parent-checked cross edge closing the cycle -->
  <line x1="136" y1="185" x2="224" y2="185" stroke="#4169E1" stroke-width="3"/>
  <!-- second component, unreached from root 0 -->
  <g stroke="#9aa7b2" stroke-width="2">
    <line x1="451" y1="85" x2="539" y2="85"/>
    <line x1="560" y1="106" x2="560" y2="184"/>
    <line x1="539" y1="205" x2="451" y2="205"/>
    <line x1="430" y1="184" x2="430" y2="106"/>
  </g>
  <g text-anchor="middle">
    <circle cx="180" cy="85" r="21" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <text x="180" y="90" fill="#1a2026" font-size="14" font-weight="600">0</text>
    <circle cx="115" cy="185" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
    <text x="115" y="190" fill="#1a2026" font-size="14" font-weight="600">1</text>
    <circle cx="245" cy="185" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
    <text x="245" y="190" fill="#1a2026" font-size="14" font-weight="600">2</text>
    <circle cx="430" cy="85" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
    <text x="430" y="90" fill="#5c6b76" font-size="14" font-weight="600">3</text>
    <circle cx="560" cy="85" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
    <text x="560" y="90" fill="#5c6b76" font-size="14" font-weight="600">4</text>
    <circle cx="560" cy="205" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
    <text x="560" y="210" fill="#5c6b76" font-size="14" font-weight="600">5</text>
    <circle cx="430" cy="205" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
    <text x="430" y="210" fill="#5c6b76" font-size="14" font-weight="600">6</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="180" y="52">dist 0</text>
    <text x="115" y="222">dist 1</text>
    <text x="245" y="222">dist 1</text>
  </g>
  <text x="180" y="250" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">cross edge 1–2: dist 1 + dist 1 + 1 = 3</text>
  <text x="180" y="274" text-anchor="middle" fill="#5c6b76" font-size="11.5">from node 1, edge 0–1 is skipped: node 0 is its BFS parent</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="495" y="244">second component — measured</text>
    <text x="495" y="262">by another root's BFS</text>
  </g>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">The parent-checked cross edge 1–2 closes the cycle 0 → 1 → 2 → 0 of length <tspan fill="#4169E1" font-weight="600">1 + 1 + 1 = 3</tspan>,</text>
  <text x="320" y="328" text-anchor="middle" fill="#1a2026" font-size="13">the shortest cycle; rooting the BFS at every vertex in turn keeps the answer exact.</text>
</svg>
