<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- edges [[0,2,5],[0,1,2],[1,2,1],[3,0,3]]; nodes r=20 on y=120 at x 70/190/310/430; settle chips 96x44 at y 196 -->
  <text x="320" y="28" text-anchor="middle" fill="#5c6b76" font-size="12.5">shortestPath(3, 2) on edges [[0, 2, 5], [0, 1, 2], [1, 2, 1], [3, 0, 3]]</text>
  <!-- unused edge 0->2 (cost 5), muted -->
  <path d="M 198 104 Q 310 30 417 97" fill="none" stroke="#9aa7b2" stroke-width="1.6" marker-end="url(#arrowM)"/>
  <text x="310" y="48" text-anchor="middle" fill="#9aa7b2" font-size="12.5">5</text>
  <!-- shortest-path edges 3->0->1->2, accented -->
  <g stroke="#4169E1" stroke-width="2.4" fill="none">
    <line x1="92" y1="120" x2="164" y2="120" marker-end="url(#arrow)"/>
    <line x1="212" y1="120" x2="284" y2="120" marker-end="url(#arrow)"/>
    <line x1="332" y1="120" x2="404" y2="120" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="128" y="108">3</text><text x="248" y="108">2</text><text x="368" y="108">1</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <circle cx="70" cy="120" r="20" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="190" cy="120" r="20"/>
    <circle cx="310" cy="120" r="20"/>
    <circle cx="430" cy="120" r="20" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="70" y="125">3</text><text x="190" y="125">0</text><text x="310" y="125">1</text><text x="430" y="125">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="70" y="160">start</text><text x="430" y="160">target</text>
  </g>
  <!-- heap pops in settle order -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="149" y="186">(0, 3)</text><text x="263" y="186">(3, 0)</text>
    <text x="377" y="186">(5, 1)</text><text x="491" y="186">(6, 2)</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="101" y="196" width="96" height="44" rx="8"/>
    <rect x="215" y="196" width="96" height="44" rx="8"/>
    <rect x="329" y="196" width="96" height="44" rx="8"/>
  </g>
  <rect x="443" y="196" width="96" height="44" rx="8" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" font-size="14.5" fill="#1a2026">
    <text x="149" y="214">3</text><text x="263" y="214">0</text><text x="377" y="214">1</text><text x="491" y="214">2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="149" y="231">dist 0</text><text x="263" y="231">dist 3</text>
    <text x="377" y="231">dist 5</text><text x="491" y="231">dist 6</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.4" fill="none">
    <line x1="199" y1="218" x2="211" y2="218" marker-end="url(#arrowG)"/>
    <line x1="313" y1="218" x2="325" y2="218" marker-end="url(#arrowG)"/>
    <line x1="427" y1="218" x2="439" y2="218" marker-end="url(#arrowG)"/>
  </g>
  <text x="101" y="260" fill="#5c6b76" font-size="11.5">(8, 2) stale — skipped</text>
  <text x="491" y="260" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">target pops → return 6</text>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">The heap hands out settle order — 3, 0, 1, 2 at distances 0, 3, 5, 6 —</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">so the answer <tspan fill="#4169E1" font-weight="600">6</tspan> is final the moment 2 pops; the stale (8, 2) never matters.</text>
</svg>
