<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[0,2,1,0],[4,0,0,3],[1,0,0,4],[0,3,2,0]]; cells 56x40 at (56+56c, 64+40r);
       component (1,3)=3 + (2,3)=4 accented with visit badges 1,2; other components 3/5/5 -->
  <text x="168" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid = [[0,2,1,0],[4,0,0,3],[1,0,0,4],[0,3,2,0]]</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="84" y="56">c0</text><text x="140" y="56">c1</text><text x="196" y="56">c2</text><text x="252" y="56">c3</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="48" y="89">r0</text><text x="48" y="129">r1</text><text x="48" y="169">r2</text><text x="48" y="209">r3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="56" y="64" width="56" height="40" fill="#f0f3f7"/><rect x="112" y="64" width="56" height="40" fill="#ffffff"/><rect x="168" y="64" width="56" height="40" fill="#ffffff"/><rect x="224" y="64" width="56" height="40" fill="#f0f3f7"/>
    <rect x="56" y="104" width="56" height="40" fill="#ffffff"/><rect x="112" y="104" width="56" height="40" fill="#f0f3f7"/><rect x="168" y="104" width="56" height="40" fill="#f0f3f7"/>
    <rect x="56" y="144" width="56" height="40" fill="#ffffff"/><rect x="112" y="144" width="56" height="40" fill="#f0f3f7"/><rect x="168" y="144" width="56" height="40" fill="#f0f3f7"/>
    <rect x="56" y="184" width="56" height="40" fill="#f0f3f7"/><rect x="112" y="184" width="56" height="40" fill="#ffffff"/><rect x="168" y="184" width="56" height="40" fill="#ffffff"/><rect x="224" y="184" width="56" height="40" fill="#f0f3f7"/>
  </g>
  <rect x="224" y="104" width="56" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <rect x="224" y="144" width="56" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600">
    <text x="140" y="89" fill="#1a2026">2</text><text x="196" y="89" fill="#1a2026">1</text>
    <text x="84" y="129" fill="#1a2026">4</text><text x="252" y="129" fill="#1a2026">3</text>
    <text x="84" y="169" fill="#1a2026">1</text><text x="252" y="169" fill="#1a2026">4</text>
    <text x="140" y="209" fill="#1a2026">3</text><text x="196" y="209" fill="#1a2026">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-weight="600">
    <text x="84" y="89">0</text><text x="252" y="89">0</text>
    <text x="140" y="129">0</text><text x="196" y="129">0</text>
    <text x="140" y="169">0</text><text x="196" y="169">0</text>
    <text x="84" y="209">0</text><text x="252" y="209">0</text>
  </g>
  <g>
    <circle cx="234" cy="114" r="8" fill="#4169E1"/><text x="234" y="118" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">1</text>
    <circle cx="234" cy="154" r="8" fill="#4169E1"/><text x="234" y="158" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">2</text>
  </g>
  <text x="168" y="244" text-anchor="middle" fill="#5c6b76" font-size="11.5">badge = visit order in the flood fill</text>
  <text x="320" y="74" fill="#5c6b76" font-size="12">fill from the first unvisited water cell, (1,3)</text>
  <g fill="#1a2026" font-size="13">
    <text x="320" y="102">pop (1,3): catch 3, total = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="320" y="126" fill="#5c6b76">push its only unvisited water neighbor, (2,3)</text>
    <text x="320" y="150">pop (2,3): catch 4, total = <tspan fill="#4169E1" font-weight="600">7</tspan></text>
    <text x="320" y="174">stack empty — this component totals <tspan fill="#4169E1" font-weight="600">7</tspan></text>
  </g>
  <text x="320" y="208" fill="#5c6b76" font-size="13">the other three components total only 3, 5 and 5,</text>
  <text x="320" y="230" fill="#1a2026" font-size="14" font-weight="600">so the answer is <tspan fill="#4169E1">7</tspan>.</text>
  <text x="320" y="278" text-anchor="middle" fill="#1a2026" font-size="13">One flood fill per unvisited water cell; the fill walks its component cell by</text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">cell with a running total, here <tspan fill="#4169E1" font-weight="600">3 + 4 = 7</tspan> — the richest component.</text>
</svg>
