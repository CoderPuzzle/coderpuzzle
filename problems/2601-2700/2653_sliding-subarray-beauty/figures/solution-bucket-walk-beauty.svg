<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,-1,-3,-2,3], k=3, x=2; per row i=0,1,2: window cells 44x32 at x 40/84/128,
       buckets -3/-2/-1 boxes 58x34 at x 248/330/412, walk arrow stops at the answer bucket -->
  <text x="320" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums = [1,-1,-3,-2,3], k = 3, x = 2</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="180" y="40" width="56" height="34"/><rect x="236" y="40" width="56" height="34"/>
    <rect x="292" y="40" width="56" height="34"/><rect x="348" y="40" width="56" height="34"/>
    <rect x="404" y="40" width="56" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="208" y="62" fill="#9aa7b2">1</text><text x="264" y="62" fill="#1a2026">-1</text>
    <text x="320" y="62" fill="#1a2026">-3</text><text x="376" y="62" fill="#1a2026">-2</text>
    <text x="432" y="62" fill="#9aa7b2">3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="208" y="90">0</text><text x="264" y="90">1</text><text x="320" y="90">2</text>
    <text x="376" y="90">3</text><text x="432" y="90">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="106" y="112">window</text><text x="359" y="112">negative buckets, walked smallest first</text>
    <text x="540" y="112">beauty</text>
  </g>

  <!-- window i=0: [1,-1,-3]; cnt -3:1, -2:0, -1:1; cum 1,1,2 -> stop at -1 -->
  <g>
    <text x="40" y="126" fill="#5c6b76" font-size="12">i = 0</text>
    <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
      <rect x="40" y="132" width="44" height="32"/><rect x="84" y="132" width="44" height="32"/><rect x="128" y="132" width="44" height="32"/>
    </g>
    <g text-anchor="middle" font-weight="600" fill="#1a2026">
      <text x="62" y="153">1</text><text x="106" y="153">-1</text><text x="150" y="153">-3</text>
    </g>
    <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
      <rect x="248" y="132" width="58" height="34"/><rect x="330" y="132" width="58" height="34"/>
    </g>
    <rect x="412" y="132" width="58" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="277" y="146" font-weight="600" fill="#1a2026" font-size="13.5">-3</text>
      <text x="359" y="146" font-weight="600" fill="#9aa7b2" font-size="13.5">-2</text>
      <text x="441" y="146" font-weight="600" fill="#1a2026" font-size="13.5">-1</text>
      <text x="277" y="162" fill="#5c6b76" font-size="11">cnt 1</text>
      <text x="359" y="162" fill="#5c6b76" font-size="11">cnt 0</text>
      <text x="441" y="162" fill="#5c6b76" font-size="11">cnt 1</text>
    </g>
    <path d="M 252 180 H 433" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
    <g text-anchor="middle" font-size="11.5">
      <text x="277" y="198" fill="#5c6b76">1</text><text x="359" y="198" fill="#5c6b76">1</text>
      <text x="441" y="198" fill="#4169E1" font-weight="600">2 &#8805; x</text>
    </g>
    <text x="540" y="156" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="17">-1</text>
  </g>

  <!-- window i=1: [-1,-3,-2]; cnt -3:1, -2:1, -1:1; cum 1,2 -> stop at -2 -->
  <g>
    <text x="40" y="214" fill="#5c6b76" font-size="12">i = 1</text>
    <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
      <rect x="40" y="220" width="44" height="32"/><rect x="84" y="220" width="44" height="32"/><rect x="128" y="220" width="44" height="32"/>
    </g>
    <g text-anchor="middle" font-weight="600" fill="#1a2026">
      <text x="62" y="241">-1</text><text x="106" y="241">-3</text><text x="150" y="241">-2</text>
    </g>
    <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
      <rect x="248" y="220" width="58" height="34"/><rect x="412" y="220" width="58" height="34"/>
    </g>
    <rect x="330" y="220" width="58" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="277" y="234" font-weight="600" fill="#1a2026" font-size="13.5">-3</text>
      <text x="359" y="234" font-weight="600" fill="#1a2026" font-size="13.5">-2</text>
      <text x="441" y="234" font-weight="600" fill="#1a2026" font-size="13.5">-1</text>
      <text x="277" y="250" fill="#5c6b76" font-size="11">cnt 1</text>
      <text x="359" y="250" fill="#5c6b76" font-size="11">cnt 1</text>
      <text x="441" y="250" fill="#5c6b76" font-size="11">cnt 1</text>
    </g>
    <path d="M 252 268 H 351" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
    <g text-anchor="middle" font-size="11.5">
      <text x="277" y="286" fill="#5c6b76">1</text>
      <text x="359" y="286" fill="#4169E1" font-weight="600">2 &#8805; x</text>
    </g>
    <text x="540" y="244" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="17">-2</text>
  </g>

  <!-- window i=2: [-3,-2,3]; cnt -3:1, -2:1, -1:0; cum 1,2 -> stop at -2 -->
  <g>
    <text x="40" y="302" fill="#5c6b76" font-size="12">i = 2</text>
    <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
      <rect x="40" y="308" width="44" height="32"/><rect x="84" y="308" width="44" height="32"/><rect x="128" y="308" width="44" height="32"/>
    </g>
    <g text-anchor="middle" font-weight="600">
      <text x="62" y="329" fill="#1a2026">-3</text><text x="106" y="329" fill="#1a2026">-2</text><text x="150" y="329" fill="#9aa7b2">3</text>
    </g>
    <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
      <rect x="248" y="308" width="58" height="34"/><rect x="412" y="308" width="58" height="34"/>
    </g>
    <rect x="330" y="308" width="58" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="277" y="322" font-weight="600" fill="#1a2026" font-size="13.5">-3</text>
      <text x="359" y="322" font-weight="600" fill="#1a2026" font-size="13.5">-2</text>
      <text x="441" y="322" font-weight="600" fill="#9aa7b2" font-size="13.5">-1</text>
      <text x="277" y="338" fill="#5c6b76" font-size="11">cnt 1</text>
      <text x="359" y="338" fill="#5c6b76" font-size="11">cnt 1</text>
      <text x="441" y="338" fill="#5c6b76" font-size="11">cnt 0</text>
    </g>
    <path d="M 252 356 H 351" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
    <g text-anchor="middle" font-size="11.5">
      <text x="277" y="374" fill="#5c6b76">1</text>
      <text x="359" y="374" fill="#4169E1" font-weight="600">2 &#8805; x</text>
    </g>
    <text x="540" y="332" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="17">-2</text>
  </g>

  <text x="320" y="398" text-anchor="middle" fill="#1a2026" font-size="13">Each walk sums counts from -50 upward and stops once x = 2 negatives are seen;</text>
  <text x="320" y="418" text-anchor="middle" fill="#1a2026" font-size="13">the stop bucket is the beauty: <tspan fill="#4169E1" font-weight="600">-1</tspan>, <tspan fill="#4169E1" font-weight="600">-2</tspan>, <tspan fill="#4169E1" font-weight="600">-2</tspan>.</text>
</svg>
