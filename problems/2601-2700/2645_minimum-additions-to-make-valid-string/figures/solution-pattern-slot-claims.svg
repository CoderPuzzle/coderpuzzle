<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="236" fill="#ffffff"/>
  <!-- word = "aaa"; pattern slots abcabcabc, cells 54x48 at x = 45 + 62i, y 56; word claims slots 0, 3, 6 -->
  <text x="320" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">word = "aaa" → the slots of "abcabcabc"</text>
  <!-- claimed slots (the word's letters land here) -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="45" y="56" width="54" height="48"/>
    <rect x="231" y="56" width="54" height="48"/>
    <rect x="417" y="56" width="54" height="48"/>
  </g>
  <!-- unclaimed slots (each needs one inserted letter) -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2">
    <rect x="107" y="56" width="54" height="48"/>
    <rect x="169" y="56" width="54" height="48"/>
    <rect x="293" y="56" width="54" height="48"/>
    <rect x="355" y="56" width="54" height="48"/>
    <rect x="479" y="56" width="54" height="48"/>
    <rect x="541" y="56" width="54" height="48"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="72" y="86" fill="#1a2026">a</text><text x="134" y="86" fill="#9aa7b2">b</text>
    <text x="196" y="86" fill="#9aa7b2">c</text><text x="258" y="86" fill="#1a2026">a</text>
    <text x="320" y="86" fill="#9aa7b2">b</text><text x="382" y="86" fill="#9aa7b2">c</text>
    <text x="444" y="86" fill="#1a2026">a</text><text x="506" y="86" fill="#9aa7b2">b</text>
    <text x="568" y="86" fill="#9aa7b2">c</text>
  </g>
  <g fill="#5c6b76" font-size="10.5">
    <text x="50" y="69">0</text><text x="112" y="69">1</text><text x="174" y="69">2</text>
    <text x="236" y="69">3</text><text x="298" y="69">4</text><text x="360" y="69">5</text>
    <text x="422" y="69">6</text><text x="484" y="69">7</text><text x="546" y="69">8</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="72" y="48">word[0]</text><text x="258" y="48">word[1]</text><text x="444" y="48">word[2]</text>
  </g>
  <!-- insertion marks under the unclaimed slots -->
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#4169E1">
    <text x="134" y="126">+</text><text x="196" y="126">+</text><text x="320" y="126">+</text>
    <text x="382" y="126">+</text><text x="506" y="126">+</text><text x="568" y="126">+</text>
  </g>
  <text x="320" y="158" text-anchor="middle" fill="#1a2026" font-size="13">unclaimed slots: <tspan fill="#4169E1" font-weight="600">6</tspan> → 6 insertions → "abcabcabc"</text>
  <text x="320" y="194" text-anchor="middle" fill="#1a2026" font-size="13">Two pointers: a word letter claims the pattern slot it matches;</text>
  <text x="320" y="212" text-anchor="middle" fill="#1a2026" font-size="13">each mismatch abandons one slot to an insertion — 4 mid-scan + 2 tail = <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
