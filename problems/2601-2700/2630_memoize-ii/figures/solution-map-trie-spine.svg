<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- example 1: calls [[2,2],[2,2],[1,2]], fn = (a,b) => a + b; map-trie: root -2-> Map -2-> leaf 4, root -1-> Map -2-> leaf 3; replays: 4/calls 1, 4/calls 1, 3/calls 2 -->
  <text x="203" y="44" text-anchor="middle" font-size="12" fill="#9aa7b2">level 0 · 1st arg</text>
  <text x="400" y="44" text-anchor="middle" font-size="12" fill="#9aa7b2">level 1 · 2nd arg</text>
  <g fill="none" stroke="#42525e" stroke-width="1.6">
    <path d="M 154 108 L 247 85" marker-end="url(#arrow)"/>
    <path d="M 154 124 L 247 195" marker-end="url(#arrow)"/>
    <path d="M 348 80 L 447 80" marker-end="url(#arrow)"/>
    <path d="M 348 200 L 447 200" marker-end="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <rect x="58" y="96" width="96" height="40" rx="8"/>
    <rect x="252" y="60" width="96" height="40" rx="8"/>
    <rect x="252" y="180" width="96" height="40" rx="8"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <rect x="452" y="60" width="96" height="40" rx="8"/>
    <rect x="452" y="180" width="96" height="40" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="106" y="121" font-size="12.5" fill="#1a2026">root Map</text>
    <text x="300" y="85" font-size="12.5" fill="#1a2026">Map</text>
    <text x="300" y="205" font-size="12.5" fill="#1a2026">Map</text>
    <text x="500" y="75" font-size="10.5" fill="#5c6b76">result</text>
    <text x="500" y="93" font-size="15" font-weight="600" fill="#4169E1">4</text>
    <text x="500" y="195" font-size="10.5" fill="#5c6b76">result</text>
    <text x="500" y="213" font-size="15" font-weight="600" fill="#4169E1">3</text>
  </g>
  <!-- argument keys on the edges -->
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="201" y="88">2</text>
    <text x="201" y="152">1</text>
    <text x="398" y="71">2</text>
    <text x="398" y="191">2</text>
  </g>
  <!-- replay ledger -->
  <text x="340" y="252" text-anchor="middle" font-size="12.5" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">call 1 [2,2]</tspan> grows the spine 2→2, fn runs once → 4, calls = 1</text>
  <text x="340" y="274" text-anchor="middle" font-size="12.5" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">call 2 [2,2]</tspan> walks the same spine to the parked 4 — fn never runs, calls = 1</text>
  <text x="340" y="296" text-anchor="middle" font-size="12.5" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">call 3 [1,2]</tspan> opens a fresh level-0 branch 1→2, fn runs → 3, calls = 2</text>
  <text x="340" y="320" text-anchor="middle" font-size="13" fill="#1a2026">Each distinct tuple costs exactly <tspan fill="#4169E1" font-weight="600">one fn() call</tspan> — three replays, two invocations total.</text>
</svg>
