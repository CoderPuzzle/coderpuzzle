<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="346" fill="#ffffff"/>
  <!-- root = [5,4,9,1,10,null,7]; circles r=19 hold original (small gray) and new (bold); level totals 5/13/18 at x=252 -->
  <text x="320" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">input root = [5, 4, 9, 1, 10, null, 7]</text>
  <!-- tree edges -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="109" y1="91" x2="76" y2="139"/>
    <line x1="131" y1="91" x2="174" y2="139"/>
    <line x1="58" y1="173" x2="42" y2="217"/>
    <line x1="74" y1="172" x2="101" y2="218"/>
    <line x1="185" y1="174" x2="185" y2="216"/>
  </g>
  <!-- sibling groups (dashed) -->
  <g fill="none" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3">
    <rect x="40" y="131" width="170" height="48" rx="8"/>
    <rect x="10" y="211" width="126" height="48" rx="8"/>
    <rect x="161" y="211" width="48" height="48" rx="8"/>
  </g>
  <!-- nodes: original value small gray on top, rewritten value bold below -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <circle cx="120" cy="75" r="19"/><circle cx="65" cy="155" r="19"/><circle cx="185" cy="155" r="19"/>
    <circle cx="35" cy="235" r="19"/><circle cx="110" cy="235" r="19"/><circle cx="185" cy="235" r="19"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#5c6b76">
    <text x="120" y="70">5</text><text x="65" y="150">4</text><text x="185" y="150">9</text>
    <text x="35" y="230">1</text><text x="110" y="230">10</text><text x="185" y="230">7</text>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600">
    <text x="120" y="87" fill="#1a2026">0</text><text x="65" y="167" fill="#1a2026">0</text><text x="185" y="167" fill="#1a2026">0</text>
    <text x="35" y="247" fill="#4169E1">7</text><text x="110" y="247" fill="#4169E1">7</text><text x="185" y="247" fill="#4169E1">11</text>
  </g>
  <!-- level totals -->
  <text x="252" y="44" text-anchor="middle" fill="#5c6b76" font-size="11">level total</text>
  <g text-anchor="middle" font-size="12.5">
    <text x="252" y="80" fill="#5c6b76">5</text>
    <text x="252" y="160" fill="#5c6b76">13</text>
    <text x="252" y="240" fill="#4169E1" font-weight="600">18</text>
  </g>
  <!-- the writes -->
  <text x="330" y="48" fill="#5c6b76" font-size="12.5">write: level total − sibling group</text>
  <g fill="#1a2026" font-size="13">
    <text x="330" y="80">root 5 → 0 — empty group</text>
    <text x="330" y="145">4 → 13 − (4+9) = 0</text>
    <text x="330" y="165">9 → 13 − (4+9) = 0</text>
    <text x="330" y="228">1 → 18 − (1+10) = <tspan fill="#4169E1" font-weight="600">7</tspan></text>
    <text x="330" y="248">10 → 18 − (1+10) = <tspan fill="#4169E1" font-weight="600">7</tspan></text>
    <text x="330" y="268">7 → 18 − 7 = <tspan fill="#4169E1" font-weight="600">11</tspan></text>
  </g>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">Every write is per-level arithmetic on the original values:</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">level 2 totals <tspan fill="#4169E1" font-weight="600">18</tspan>, so 1 and 10 become <tspan fill="#4169E1" font-weight="600">7</tspan> and 7 becomes <tspan fill="#4169E1" font-weight="600">11</tspan>; 5, 4, 9 become 0.</text>
</svg>
