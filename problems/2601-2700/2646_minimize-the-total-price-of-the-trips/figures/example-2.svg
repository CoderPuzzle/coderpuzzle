<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 178" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n=2, edges=[[0,1]], price=[2,2], trips=[[0,0]]; halve node 0: 2 -> 1 (verified) -->
  <line x1="190" y1="100" x2="370" y2="100" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="370" cy="100" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="190" cy="100" r="21" fill="#e6ecfb" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="190" y="105">0</text>
    <text x="370" y="105">1</text>
  </g>
  <text x="190" y="52" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">price 2 → 1</text>
  <text x="370" y="52" text-anchor="middle" fill="#5c6b76" font-size="12">price 2</text>
  <text x="280" y="164" text-anchor="middle" fill="#1a2026" font-size="13.5">the single trip [0, 0] never leaves node 0 — halved, it costs <tspan fill="#4169E1" font-weight="700">1</tspan></text>
</svg>
