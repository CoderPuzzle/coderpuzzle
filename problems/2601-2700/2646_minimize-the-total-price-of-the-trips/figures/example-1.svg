<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n=4, edges=[[0,1],[1,2],[1,3]], price=[2,2,10,6], trips=[[0,3],[2,1],[2,3]]; freq=[1,3,2,2]; halving {0,2,3} saves 17 of 40 -> 23 (verified by brute force) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g stroke="#42525e" stroke-width="1.6">
    <!-- left tree: prices before -->
    <line x1="160" y1="48" x2="160" y2="138"/>
    <line x1="160" y1="138" x2="80" y2="215"/>
    <line x1="160" y1="138" x2="240" y2="215"/>
    <!-- right tree: after halving -->
    <line x1="470" y1="48" x2="470" y2="138"/>
    <line x1="470" y1="138" x2="390" y2="215"/>
    <line x1="470" y1="138" x2="550" y2="215"/>
  </g>
  <line x1="297" y1="138" x2="335" y2="138" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="160" cy="48" r="21"/>
    <circle cx="160" cy="138" r="21"/>
    <circle cx="80" cy="215" r="21"/>
    <circle cx="240" cy="215" r="21"/>
    <circle cx="470" cy="138" r="21"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="470" cy="48" r="21"/>
    <circle cx="390" cy="215" r="21"/>
    <circle cx="550" cy="215" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="160" y="53">2</text>
    <text x="160" y="143">1</text>
    <text x="80" y="220">0</text>
    <text x="240" y="220">3</text>
    <text x="470" y="53">2</text>
    <text x="470" y="143">1</text>
    <text x="390" y="220">0</text>
    <text x="550" y="220">3</text>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="160" y="20">price 10</text>
    <text x="123" y="134" text-anchor="end">price 2</text>
    <text x="80" y="252">price 2</text>
    <text x="240" y="252">price 6</text>
    <text x="433" y="134" text-anchor="end">price 2</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="470" y="20">10 → 5</text>
    <text x="390" y="252">2 → 1</text>
    <text x="550" y="252">6 → 3</text>
  </g>
  <text x="320" y="274" text-anchor="middle" fill="#1a2026" font-size="13.5">halve the pairwise non-adjacent leaves 0, 2, 3 → the three trips cost 6 + 7 + 10 = <tspan fill="#4169E1" font-weight="700">23</tspan></text>
</svg>
