<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <!-- price = [2,2,10,6]; freq = [1,3,2,2] from trips [[0,3],[2,1],[2,3]]; tree rooted at 1; root box 200x88 at (170,42), leaf boxes 150x76 at y=210 -->
  <text x="320" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">price = [2, 2, 10, 6]; trip paths 0-1-3, 2-1, 2-1-3 → freq = [1, 3, 2, 2]</text>
  <!-- tree edges (rooted at node 1) -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="232" y1="132" x2="122" y2="210"/>
    <line x1="285" y1="132" x2="310" y2="210"/>
    <line x1="338" y1="132" x2="492" y2="210"/>
  </g>
  <!-- root: node 1, kept full -->
  <rect x="170" y="42" width="200" height="90" rx="6" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="270" y="64" text-anchor="middle" font-weight="600" font-size="13.5" fill="#1a2026">node 1 — <tspan fill="#4169E1">kept full</tspan></text>
  <text x="270" y="82" text-anchor="middle" fill="#5c6b76" font-size="11.5">price 2 × freq 3</text>
  <text x="270" y="104" text-anchor="middle" font-size="13" fill="#1a2026">keep: 6 + 1 + 10 + 6 = <tspan fill="#4169E1" font-weight="600">23</tspan></text>
  <text x="270" y="124" text-anchor="middle" font-size="13" fill="#1a2026">halve: 3 + (2+20+12) = 37</text>
  <!-- leaves: nodes 0, 2, 3, all halved -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="30" y="210" width="150" height="76" rx="6"/>
    <rect x="245" y="210" width="150" height="76" rx="6"/>
    <rect x="460" y="210" width="150" height="76" rx="6"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13.5" fill="#1a2026">
    <text x="105" y="232">node 0 — <tspan fill="#4169E1">halved</tspan></text>
    <text x="320" y="232">node 2 — <tspan fill="#4169E1">halved</tspan></text>
    <text x="535" y="232">node 3 — <tspan fill="#4169E1">halved</tspan></text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="105" y="250">price 2 × freq 1</text>
    <text x="320" y="250">price 10 × freq 2</text>
    <text x="535" y="250">price 6 × freq 2</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="105" y="270">keep 2 · halve <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="320" y="270">keep 20 · halve <tspan fill="#4169E1" font-weight="600">10</tspan></text>
    <text x="535" y="270">keep 12 · halve <tspan fill="#4169E1" font-weight="600">6</tspan></text>
  </g>
  <text x="320" y="322" text-anchor="middle" fill="#1a2026" font-size="13">Keeping 1 lets every leaf halve: 6 + (1 + 10 + 6) = <tspan fill="#4169E1" font-weight="600">23</tspan>;</text>
  <text x="320" y="340" text-anchor="middle" fill="#1a2026" font-size="13">halving 1 instead forces 0, 2, 3 full for 37 — answer min(23, 37) = <tspan fill="#4169E1" font-weight="600">23</tspan>.</text>
</svg>
