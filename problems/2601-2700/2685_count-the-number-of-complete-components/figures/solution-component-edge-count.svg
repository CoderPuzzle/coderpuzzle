<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="336" fill="#ffffff"/>
  <!-- n=6, edges=[[0,1],[0,2],[1,2],[3,4],[3,5]]; circles r20: {0,1,2} at (150,84)/(90,188)/(210,188), {3,4,5} at (480,84)/(420,188)/(540,188); dashed accent = the missing 4-5 edge -->
  <text x="150" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">component {0, 1, 2}</text>
  <text x="480" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">component {3, 4, 5}</text>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="150" y1="84" x2="90" y2="188"/>
    <line x1="150" y1="84" x2="210" y2="188"/>
    <line x1="90" y1="188" x2="210" y2="188"/>
    <line x1="480" y1="84" x2="420" y2="188"/>
    <line x1="480" y1="84" x2="540" y2="188"/>
  </g>
  <line x1="442" y1="188" x2="518" y2="188" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="480" y="178" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">missing 4-5</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="150" cy="84" r="20"/><circle cx="90" cy="188" r="20"/><circle cx="210" cy="188" r="20"/>
    <circle cx="480" cy="84" r="20"/><circle cx="420" cy="188" r="20"/><circle cx="540" cy="188" r="20"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="150" y="89">0</text><text x="90" y="193">1</text><text x="210" y="193">2</text>
    <text x="480" y="89">3</text><text x="420" y="193">4</text><text x="540" y="193">5</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="150" y="246">3 edges = 3·2/2</text>
    <text x="480" y="246">2 edges &lt; 3·2/2</text>
  </g>
  <text x="150" y="268" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">complete — passes</text>
  <text x="480" y="268" text-anchor="middle" fill="#5c6b76" font-size="13" font-weight="600">not complete — fails</text>
  <text x="330" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Each root is judged by its edge tally: complete iff edges = size·(size − 1)/2.</text>
  <text x="330" y="320" text-anchor="middle" fill="#1a2026" font-size="13">{0, 1, 2} passes with 3 = 3; {3, 4, 5} fails at 2 &lt; 3 — the answer is <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
