<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 268" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="620" height="268" fill="#ffffff"/>
  <!-- panel 1: original tree -->
  <g stroke="#1a2026" stroke-width="1.5">
    <line x1="95" y1="62" x2="55" y2="97"/>
    <line x1="95" y1="62" x2="135" y2="97"/>
    <line x1="55" y1="117" x2="25" y2="152"/>
    <line x1="55" y1="117" x2="85" y2="152"/>
    <line x1="135" y1="117" x2="135" y2="152"/>
    <line x1="135" y1="172" x2="110" y2="207"/>
    <line x1="135" y1="172" x2="160" y2="207"/>
  </g>
  <circle cx="95" cy="50" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="55" cy="105" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="135" cy="105" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="25" cy="160" r="15" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="85" cy="160" r="15" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="135" cy="160" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="110" cy="215" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="160" cy="215" r="15" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="95" y="55">0</text><text x="55" y="110">1</text><text x="135" y="110">2</text>
    <text x="25" y="165">3</text><text x="85" y="165">4</text><text x="135" y="165">5</text>
    <text x="110" y="220">6</text><text x="160" y="220">7</text>
  </g>
  <text x="95" y="250" text-anchor="middle" fill="#5c6b76" font-size="12.5">start: coins on 3, 4, 7</text>
  <!-- panel 2: phase 1 -->
  <g stroke="#1a2026" stroke-width="1.5">
    <line x1="305" y1="62" x2="265" y2="97"/>
    <line x1="305" y1="62" x2="345" y2="97"/>
    <line x1="265" y1="117" x2="235" y2="152"/>
    <line x1="265" y1="117" x2="295" y2="152"/>
    <line x1="345" y1="117" x2="345" y2="152"/>
    <line x1="345" y1="172" x2="370" y2="207" stroke-dasharray="4 3"/>
  </g>
  <circle cx="305" cy="50" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="265" cy="105" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="345" cy="105" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="235" cy="160" r="15" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="295" cy="160" r="15" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="345" cy="160" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="370" cy="215" r="15" fill="none" stroke="#98a2ac" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="305" y="55">0</text><text x="265" y="110">1</text><text x="345" y="110">2</text>
    <text x="235" y="165">3</text><text x="295" y="165">4</text><text x="345" y="165">5</text>
    <text x="370" y="220" fill="#98a2ac">6</text>
  </g>
  <text x="305" y="250" text-anchor="middle" fill="#5c6b76" font-size="12.5">phase 1: coinless leaf 6 pruned</text>
  <!-- panel 3: phase 2 -->
  <line x1="515" y1="105" x2="515" y2="140" stroke="#1a2026" stroke-width="1.5"/>
  <circle cx="515" cy="90" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="515" cy="155" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="515" y="95">0</text><text x="515" y="160">2</text>
  </g>
  <g fill="#98a2ac" text-anchor="middle" font-size="12.5">
    <text x="445" y="60">3 4 7</text><text x="452" y="80">round 1</text>
    <text x="580" y="60">1 5</text><text x="580" y="80">round 2</text>
  </g>
  <text x="515" y="200" text-anchor="middle" fill="#5c6b76" font-size="12.5">2 vertices remain</text>
  <text x="515" y="250" text-anchor="middle" fill="#4169E1" font-weight="600">tour = (2 − 1) × 2 = 2 edges</text>
</svg>
