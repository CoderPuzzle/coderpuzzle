<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="260" fill="#ffffff"/>
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="84" y1="94" x2="152" y2="146"/>
    <line x1="174" y1="146" x2="238" y2="94"/>
    <line x1="262" y1="94" x2="330" y2="146"/>
    <line x1="352" y1="146" x2="416" y2="94"/>
    <line x1="440" y1="94" x2="508" y2="146"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <circle cx="70" cy="80" r="20" fill="#dbe4f6" stroke="#42525e" stroke-width="2.6"/><text x="70" y="86" fill="#1a2026">0</text>
    <circle cx="160" cy="160" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="160" y="166" fill="#1a2026">1</text>
    <circle cx="250" cy="80" r="20" fill="#ffffff" stroke="#4169E1" stroke-width="2.6"/><text x="250" y="86" fill="#1a2026">2</text>
    <circle cx="340" cy="160" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="340" y="166" fill="#1a2026">3</text>
    <circle cx="430" cy="80" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="430" y="86" fill="#1a2026">4</text>
    <circle cx="520" cy="160" r="20" fill="#dbe4f6" stroke="#42525e" stroke-width="2.6"/><text x="520" y="166" fill="#1a2026">5</text>
  </g>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="70" y="46">coin</text>
    <text x="250" y="46" fill="#4169E1" font-weight="600">start</text>
    <text x="520" y="126">coin</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="60" y="216">Coins are collected from distance 2. From vertex 2 the coin at 0</text>
    <text x="60" y="234">is already in range; one move to 3 brings coin 5 in range;</text>
    <text x="60" y="252" fill="#4169E1" font-weight="600">step back to 2 — 2 edges in total.</text>
  </g>
</svg>
