<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="400" fill="#ffffff"/>
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="284" y1="86" x2="198" y2="142"/>
    <line x1="316" y1="86" x2="402" y2="142"/>
    <line x1="166" y1="172" x2="124" y2="226"/>
    <line x1="194" y1="172" x2="236" y2="226"/>
    <line x1="420" y1="172" x2="476" y2="226"/>
    <line x1="462" y1="264" x2="436" y2="318"/>
    <line x1="494" y1="264" x2="526" y2="318"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <circle cx="300" cy="70" r="20" fill="#ffffff" stroke="#4169E1" stroke-width="2.6"/><text x="300" y="76" fill="#1a2026">0</text>
    <circle cx="180" cy="158" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="180" y="164" fill="#1a2026">1</text>
    <circle cx="420" cy="158" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="420" y="164" fill="#1a2026">2</text>
    <circle cx="110" cy="244" r="18" fill="#dbe4f6" stroke="#42525e" stroke-width="2.4"/><text x="110" y="250" fill="#1a2026">3</text>
    <circle cx="250" cy="244" r="18" fill="#dbe4f6" stroke="#42525e" stroke-width="2.4"/><text x="250" y="250" fill="#1a2026">4</text>
    <circle cx="480" cy="248" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="480" y="254" fill="#1a2026">5</text>
    <circle cx="430" cy="336" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="430" y="342" fill="#1a2026">6</text>
    <circle cx="540" cy="336" r="18" fill="#dbe4f6" stroke="#42525e" stroke-width="2.4"/><text x="540" y="342" fill="#1a2026">7</text>
  </g>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="300" y="36" fill="#4169E1" font-weight="600">start</text>
    <text x="110" y="286">coin</text>
    <text x="250" y="286">coin</text>
    <text x="540" y="378">coin</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="40" y="70">Coins sit at 3, 4 and 7. Starting at 0,</text>
    <text x="40" y="88">3 and 4 are distance 2 away; one move</text>
    <text x="40" y="106">to vertex 2 puts 7 in range; step back:</text>
    <text x="40" y="130" fill="#4169E1" font-weight="600">2 edges.</text>
  </g>
</svg>
