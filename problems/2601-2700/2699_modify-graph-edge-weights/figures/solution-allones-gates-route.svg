<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="364" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 3: n=4, edges=[[1,0,4],[1,2,3],[2,3,5],[0,3,-1]], source 0, dest 2, target 6; all-ones assignment sets edge (0,3)=1; floor 0-1-2 = 7; ceiling route 0-3-2 = 1+5 = 6 = target; d_src=[0,4,6,1], d_dst=[6,3,0,5] -->
  <text x="78" y="154" text-anchor="end" fill="#5c6b76" font-size="11.5">src</text>
  <text x="408" y="154" fill="#5c6b76" font-size="11.5">dest</text>
  <!-- fixed edges -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="127.2" y1="139.8" x2="227.8" y2="80.2"/>
    <line x1="262.2" y1="80.2" x2="362.8" y2="139.8"/>
  </g>
  <!-- route edges 0-3-2, accent -->
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="362.8" y1="160.2" x2="262.2" y2="219.8"/>
    <line x1="227.8" y1="219.8" x2="127.2" y2="160.2"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="184" y="125">4</text>
    <text x="306" y="125">3</text>
    <text x="319" y="205">5</text>
    <text x="171" y="205" fill="#4169E1" font-size="15">1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="110" cy="150" r="20"/><circle cx="245" cy="70" r="20"/>
    <circle cx="380" cy="150" r="20"/><circle cx="245" cy="230" r="20"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="110" y="155">0</text><text x="245" y="75">1</text><text x="380" y="155">2</text><text x="245" y="235">3</text>
  </g>
  <text x="40" y="278" fill="#5c6b76" font-size="12">blue: the only <tspan fill="#4169E1" font-weight="600">−1 edge (0,3)</tspan>, set to 1 by the all-ones pass</text>
  <!-- gates and distance panel -->
  <text x="462" y="62" font-size="13" font-weight="600" fill="#1a2026">feasibility gates</text>
  <text x="462" y="86" fill="#5c6b76" font-size="12">floor (fixed edges only):</text>
  <text x="462" y="104" fill="#1a2026" font-size="12.5">0→1→2 = 4+3 = 7, not below 6</text>
  <text x="462" y="130" fill="#5c6b76" font-size="12">ceiling (every −1 := 1):</text>
  <text x="462" y="148" fill="#4169E1" font-size="12.5" font-weight="600">0→3→2 = 1+5 = 6 = target</text>
  <text x="462" y="174" fill="#5c6b76" font-size="12">all-ones Dijkstra distances:</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="462" y="196" text-anchor="start">node</text>
    <text x="540" y="196">0</text><text x="575" y="196">1</text><text x="610" y="196">2</text><text x="645" y="196">3</text>
  </g>
  <text x="505" y="216" text-anchor="end" fill="#1a2026" font-size="12.5">d_src</text>
  <g text-anchor="middle" font-size="12.5">
    <text x="540" y="216" fill="#4169E1" font-weight="600">0</text><text x="575" y="216">4</text><text x="610" y="216">6</text><text x="645" y="216">1</text>
    <text x="540" y="236">6</text><text x="575" y="236">3</text><text x="610" y="236">0</text><text x="645" y="236" fill="#4169E1" font-weight="600">5</text>
  </g>
  <text x="505" y="236" text-anchor="end" fill="#1a2026" font-size="12.5">d_dst</text>
  <text x="462" y="262" fill="#5c6b76" font-size="12">binding: d_src[0] + 1 + d_dst[3]</text>
  <text x="462" y="280" fill="#1a2026" font-size="12.5">= 0 + 1 + 5 = 6 = cur, <tspan fill="#4169E1" font-weight="600">deficit 0</tspan></text>
  <text x="40" y="330" fill="#1a2026" font-size="13">Both gates pass and the all-ones route 0→3→2 already measures exactly 6, so</text>
  <text x="40" y="348" fill="#1a2026" font-size="13">the deficit is 0: edge (0,3) keeps weight 1 and the shortest 0→2 distance is <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
