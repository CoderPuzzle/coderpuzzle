<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- start (1,1), target (4,5); roads [1,2,3,3,2] and [3,4,4,5,1]; node (x,y) at
       px (80 + (x-1)*120, 260 - (y-1)*50); walk edges dark, road edges accent -->
  <text x="320" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">start = [1,1], target = [4,5], specialRoads = [[1,2,3,3,2],[3,4,4,5,1]]</text>
  <g fill="#dbe4fb">
    <circle cx="80" cy="60" r="1.5"/><circle cx="200" cy="60" r="1.5"/><circle cx="320" cy="60" r="1.5"/><circle cx="440" cy="60" r="1.5"/>
    <circle cx="80" cy="110" r="1.5"/><circle cx="200" cy="110" r="1.5"/><circle cx="320" cy="110" r="1.5"/><circle cx="440" cy="110" r="1.5"/>
    <circle cx="80" cy="160" r="1.5"/><circle cx="200" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/><circle cx="440" cy="160" r="1.5"/>
    <circle cx="80" cy="210" r="1.5"/><circle cx="200" cy="210" r="1.5"/><circle cx="320" cy="210" r="1.5"/><circle cx="440" cy="210" r="1.5"/>
    <circle cx="80" cy="260" r="1.5"/><circle cx="200" cy="260" r="1.5"/><circle cx="320" cy="260" r="1.5"/><circle cx="440" cy="260" r="1.5"/>
  </g>
  <path d="M 80 254 V 218" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="92" y="240" fill="#5c6b76" font-size="12">1</text>
  <path d="M 88 208 L 311 162" fill="none" stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrowB)"/>
  <text x="192" y="178" fill="#4169E1" font-weight="600" font-size="13">2</text>
  <path d="M 320 154 V 116" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="332" y="140" fill="#5c6b76" font-size="12">1</text>
  <path d="M 327 107 L 431 64" fill="none" stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrowB)"/>
  <text x="372" y="80" fill="#4169E1" font-weight="600" font-size="13">1</text>
  <g>
    <circle cx="80" cy="260" r="5" fill="#1a2026"/><circle cx="80" cy="210" r="5" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <circle cx="320" cy="160" r="5" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/><circle cx="320" cy="110" r="5" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <circle cx="440" cy="60" r="5" fill="#4169E1"/>
  </g>
  <g font-size="12" fill="#5c6b76">
    <text x="80" y="282" text-anchor="middle">start (1,1)</text>
    <text x="440" y="48" text-anchor="middle">target (4,5)</text>
    <text x="68" y="214" text-anchor="end">(1,2)</text>
    <text x="320" y="184" text-anchor="middle">(3,3)</text>
    <text x="308" y="116" text-anchor="end">(3,4)</text>
  </g>
  <g stroke-width="2" fill="none">
    <path d="M 140 228 H 175" stroke="#42525e"/>
    <path d="M 140 248 H 175" stroke="#4169E1"/>
  </g>
  <g font-size="11.5" fill="#5c6b76">
    <text x="183" y="232">walk (Manhattan)</text>
    <text x="183" y="252">special road (cheaper than its walk)</text>
  </g>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">Only road endpoints, start and target ever need to be graph nodes;</text>
  <text x="320" y="338" text-anchor="middle" fill="#1a2026" font-size="13">Dijkstra finds the accented route at 1 + 2 + 1 + 1 = <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
</svg>
