<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="348" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[2,4,3,5],[5,4,9,3],[3,4,2,11],[10,9,13,15]]; cells 78x42 at (130,80); light-accent fill = row reachable in that column (col 2: rows 1,3; col 3: rows 2,3), gray = dropped from the frontier; accent outlines = one 3-move path -->
  <path d="M 150 40 H 422" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="30" text-anchor="middle" fill="#5c6b76" font-size="12">sweep columns left to right</text>
  <g text-anchor="end" fill="#5c6b76" font-size="11">
    <text x="122" y="105">row 0</text><text x="122" y="147">row 1</text>
    <text x="122" y="189">row 2</text><text x="122" y="231">row 3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="169" y="70">col 0</text><text x="247" y="70">col 1</text>
    <text x="325" y="70">col 2</text><text x="403" y="70">col 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <g fill="#dbe4fb">
      <rect x="130" y="80" width="78" height="42"/><rect x="208" y="80" width="78" height="42"/><rect x="286" y="80" width="78" height="42"/><rect x="364" y="80" width="78" height="42"/>
      <rect x="130" y="122" width="78" height="42"/><rect x="208" y="122" width="78" height="42"/><rect x="286" y="122" width="78" height="42"/><rect x="364" y="122" width="78" height="42"/>
      <rect x="130" y="164" width="78" height="42"/><rect x="208" y="164" width="78" height="42"/><rect x="286" y="164" width="78" height="42"/><rect x="364" y="164" width="78" height="42"/>
      <rect x="130" y="206" width="78" height="42"/><rect x="208" y="206" width="78" height="42"/><rect x="286" y="206" width="78" height="42"/><rect x="364" y="206" width="78" height="42"/>
    </g>
    <g fill="#f0f3f7">
      <rect x="286" y="80" width="78" height="42"/><rect x="364" y="80" width="78" height="42"/>
      <rect x="286" y="164" width="78" height="42"/><rect x="364" y="122" width="78" height="42"/>
    </g>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="169" y="106">2</text><text x="247" y="106">4</text>
    <text x="169" y="148">5</text><text x="247" y="148">4</text><text x="325" y="148">9</text>
    <text x="169" y="190">3</text><text x="247" y="190">4</text><text x="403" y="190">11</text>
    <text x="169" y="232">10</text><text x="247" y="232">9</text><text x="325" y="232">13</text><text x="403" y="232">15</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-weight="600">
    <text x="325" y="106">3</text><text x="403" y="106">5</text>
    <text x="325" y="190">2</text><text x="403" y="148">3</text>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2.5">
    <rect x="130" y="80" width="78" height="42"/>
    <rect x="208" y="80" width="78" height="42"/>
    <rect x="286" y="122" width="78" height="42"/>
    <rect x="364" y="164" width="78" height="42"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">
    <text x="169" y="272">start</text><text x="247" y="272">moves 1</text>
    <text x="325" y="272">moves 2</text><text x="403" y="272">moves 3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="169" y="290">all rows</text><text x="247" y="290">rows 0-3</text>
    <text x="325" y="290">rows 1, 3</text><text x="403" y="290">rows 2, 3</text>
  </g>
  <text x="286" y="316" text-anchor="middle" fill="#1a2026" font-size="13">The frontier never empties and its depth climbs 1, 2, 3 — the answer is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
  <text x="286" y="336" text-anchor="middle" fill="#1a2026" font-size="13">The outlined path 2 → 4 → 9 → 11 makes all three moves from cell (0, 0).</text>
</svg>
