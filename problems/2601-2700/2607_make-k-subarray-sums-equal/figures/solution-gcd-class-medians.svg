<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="345" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- arr = [1,4,1,3], k = 2, n = 4, g = 2: class 0 = indices {0,2} values [1,1]; class 1 = indices {1,3} values [4,3]; ring centre (170,170) r 78 -->
  <text x="320" y="40" text-anchor="middle" fill="#5c6b76" font-size="13">n = 4, k = 2 → g = gcd(4, 2) = 2 residue classes</text>
  <!-- class-0 step arcs 0 to 2 to 0 -->
  <g stroke="#4169E1" stroke-width="1.6" fill="none">
    <path d="M 183 114 Q 212 170 183 226" marker-end="url(#arrow)"/>
    <path d="M 157 226 Q 128 170 157 114" marker-end="url(#arrow)"/>
  </g>
  <!-- class-1 step arcs 1 to 3 to 1 -->
  <g stroke="#5c6b76" stroke-width="1.6" fill="none">
    <path d="M 226 157 Q 170 128 114 157" marker-end="url(#arrowG)"/>
    <path d="M 114 183 Q 170 212 226 183" marker-end="url(#arrowG)"/>
  </g>
  <text x="170" y="175" text-anchor="middle" fill="#5c6b76" font-size="12">k = 2</text>
  <g text-anchor="middle">
    <circle cx="170" cy="92" r="27" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <text x="170" y="85" fill="#5c6b76" font-size="10.5">idx 0</text>
    <text x="170" y="105" fill="#1a2026" font-size="16" font-weight="600">1</text>
    <circle cx="248" cy="170" r="27" fill="#f0f3f7" stroke="#5c6b76" stroke-width="1.6"/>
    <text x="248" y="163" fill="#5c6b76" font-size="10.5">idx 1</text>
    <text x="248" y="183" fill="#1a2026" font-size="16" font-weight="600">4</text>
    <circle cx="170" cy="248" r="27" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <text x="170" y="241" fill="#5c6b76" font-size="10.5">idx 2</text>
    <text x="170" y="261" fill="#1a2026" font-size="16" font-weight="600">1</text>
    <circle cx="92" cy="170" r="27" fill="#f0f3f7" stroke="#5c6b76" stroke-width="1.6"/>
    <text x="92" y="163" fill="#5c6b76" font-size="10.5">idx 3</text>
    <text x="92" y="183" fill="#1a2026" font-size="16" font-weight="600">3</text>
  </g>
  <!-- per-class median panels -->
  <rect x="322" y="78" width="11" height="11" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
  <text x="342" y="88" fill="#1a2026" font-size="13" font-weight="600">class 0 — indices 0, 2</text>
  <text x="342" y="112" fill="#1a2026" font-size="12.5">values [1, 1] · sorted [1, 1] · median 1</text>
  <text x="342" y="134" fill="#5c6b76" font-size="12.5">cost |1−1| + |1−1| = 0</text>
  <rect x="322" y="178" width="11" height="11" fill="#f0f3f7" stroke="#5c6b76" stroke-width="1.2"/>
  <text x="342" y="188" fill="#1a2026" font-size="13" font-weight="600">class 1 — indices 1, 3</text>
  <text x="342" y="212" fill="#1a2026" font-size="12.5">values [4, 3] · sorted [3, 4] · median 3</text>
  <text x="342" y="234" fill="#5c6b76" font-size="12.5">cost |4−3| + |3−3| = 1</text>
  <text x="342" y="268" fill="#1a2026" font-size="13">one unit move: <tspan fill="#4169E1" font-weight="600">4 → 3</tspan></text>
  <text x="320" y="310" text-anchor="middle" fill="#1a2026" font-size="13">Equalizing each gcd-class around its median costs one unit — the move 4 → 3 turns arr</text>
  <text x="320" y="330" text-anchor="middle" fill="#1a2026" font-size="13">into [1, 3, 1, 3], where all four circular windows of length 2 sum to <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
