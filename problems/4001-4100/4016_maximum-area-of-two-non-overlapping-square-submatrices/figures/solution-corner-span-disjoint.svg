<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- mat = [[1,1,1,0],[1,1,1,1],[0,0,1,1]]; k = 2 valid corners (0,0),(0,1),(1,2); squares at (0,0) solid, (1,2) dashed; cells 48px at (150,60) -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="174" y="50">0</text><text x="222" y="50">1</text><text x="270" y="50">2</text><text x="318" y="50">3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="140" y="89">0</text><text x="140" y="137">1</text><text x="140" y="185">2</text>
  </g>
  <g stroke="#42525e" stroke-width="1">
    <rect x="150" y="60" width="48" height="48" fill="#ffffff"/><rect x="198" y="60" width="48" height="48" fill="#ffffff"/><rect x="246" y="60" width="48" height="48" fill="#ffffff"/><rect x="294" y="60" width="48" height="48" fill="#f0f3f7"/>
    <rect x="150" y="108" width="48" height="48" fill="#ffffff"/><rect x="198" y="108" width="48" height="48" fill="#ffffff"/><rect x="246" y="108" width="48" height="48" fill="#ffffff"/><rect x="294" y="108" width="48" height="48" fill="#ffffff"/>
    <rect x="150" y="156" width="48" height="48" fill="#f0f3f7"/><rect x="198" y="156" width="48" height="48" fill="#f0f3f7"/><rect x="246" y="156" width="48" height="48" fill="#ffffff"/><rect x="294" y="156" width="48" height="48" fill="#ffffff"/>
  </g>
  <!-- the two chosen 2x2 squares -->
  <rect x="150" y="60" width="96" height="96" fill="#dbe4fb"/>
  <rect x="246" y="108" width="96" height="96" fill="#dbe4fb"/>
  <rect x="150" y="60" width="96" height="96" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <rect x="246" y="108" width="96" height="96" fill="none" stroke="#4169E1" stroke-width="2.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="174" y="89" fill="#1a2026">1</text><text x="222" y="89" fill="#1a2026">1</text><text x="270" y="89" fill="#1a2026">1</text><text x="318" y="89" fill="#9aa7b2">0</text>
    <text x="174" y="137" fill="#1a2026">1</text><text x="222" y="137" fill="#1a2026">1</text><text x="270" y="137" fill="#1a2026">1</text><text x="318" y="137" fill="#1a2026">1</text>
    <text x="174" y="185" fill="#9aa7b2">0</text><text x="222" y="185" fill="#9aa7b2">0</text><text x="270" y="185" fill="#1a2026">1</text><text x="318" y="185" fill="#1a2026">1</text>
  </g>
  <!-- valid-corner marks: A (0,0) and B (1,2) chosen, (0,1) valid but not chosen -->
  <circle cx="198" cy="60" r="4.5" fill="#9aa7b2"/>
  <circle cx="150" cy="60" r="9" fill="#4169E1"/>
  <circle cx="246" cy="108" r="9" fill="#4169E1"/>
  <g text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">
    <text x="150" y="64">A</text><text x="246" y="112">B</text>
  </g>
  <!-- column span certificate -->
  <g stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="2 3">
    <line x1="150" y1="206" x2="150" y2="224"/>
    <line x1="246" y1="206" x2="246" y2="224"/>
  </g>
  <path d="M 150 230 H 246" fill="none" stroke="#4169E1" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="198" y="254" text-anchor="middle" fill="#1a2026" font-size="13">max_col − min_col = <tspan fill="#4169E1" font-weight="600">2 ≥ k = 2</tspan></text>
  <!-- row span falls short -->
  <path d="M 356 60 V 108" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-start="url(#arrowM)" marker-end="url(#arrowM)"/>
  <text x="366" y="89" fill="#9aa7b2" font-size="12">row span 1 &lt; 2</text>
  <text x="280" y="284" text-anchor="middle" fill="#1a2026" font-size="13">Valid k = 2 corners: (0,0), (0,1), (1,2) — marks at their top-left vertices.</text>
  <text x="280" y="304" text-anchor="middle" fill="#1a2026" font-size="13">Squares A and B lie 2 columns apart, so they are disjoint — area 2 × 2 = <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
