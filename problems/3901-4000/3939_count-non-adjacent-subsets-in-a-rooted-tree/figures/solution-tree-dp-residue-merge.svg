<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="436" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- chain parent=[-1,0,1], nums=[1,2,3], k=3; dp strips 34x26 at x=210; processed 2,1,0; dp0 = node unselected, dp1 = node selected; entries are subset counts by subtree sum mod 3 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="227" y="46">res 0</text><text x="265" y="46">res 1</text><text x="303" y="46">res 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="110" y1="306" x2="110" y2="226"/>
    <line x1="110" y1="186" x2="110" y2="106"/>
  </g>
  <text x="122" y="270" fill="#5c6b76" font-size="11.5">merge</text>
  <text x="122" y="150" fill="#5c6b76" font-size="11.5">merge</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="110" cy="84" r="16"/><circle cx="110" cy="204" r="16"/><circle cx="110" cy="324" r="16"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="110" y="89">0</text><text x="110" y="209">1</text><text x="110" y="329">2</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11">
    <text x="88" y="88">nums = 1</text><text x="88" y="208">nums = 2</text><text x="88" y="328">nums = 3</text>
  </g>
  <!-- node 0 dp strips -->
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="210" y="56" width="34" height="26"/><rect x="248" y="56" width="34" height="26"/><rect x="286" y="56" width="34" height="26"/>
    <rect x="210" y="90" width="34" height="26"/><rect x="248" y="90" width="34" height="26"/><rect x="286" y="90" width="34" height="26"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#9aa7b2">
    <text x="227" y="74" font-size="13" font-weight="600" fill="#4169E1">2</text><text x="265" y="74">0</text><text x="303" y="74" font-size="13" font-weight="600" fill="#1a2026">1</text>
    <text x="227" y="108" font-size="13" font-weight="600" fill="#1a2026">0</text><text x="265" y="108" font-size="13" font-weight="600" fill="#1a2026">2</text><text x="303" y="108">0</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="200" y="74">dp0</text><text x="200" y="108">dp1</text>
  </g>
  <!-- node 1 dp strips -->
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="210" y="176" width="34" height="26"/><rect x="248" y="176" width="34" height="26"/><rect x="286" y="176" width="34" height="26"/>
    <rect x="210" y="210" width="34" height="26"/><rect x="248" y="210" width="34" height="26"/><rect x="286" y="210" width="34" height="26"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#9aa7b2">
    <text x="227" y="194" font-size="13" font-weight="600" fill="#1a2026">2</text><text x="265" y="194">0</text><text x="303" y="194">0</text>
    <text x="227" y="228">0</text><text x="265" y="228">0</text><text x="303" y="228" font-size="13" font-weight="600" fill="#1a2026">1</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="200" y="194">dp0</text><text x="200" y="228">dp1</text>
  </g>
  <!-- node 2 dp strips -->
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="210" y="296" width="34" height="26"/><rect x="248" y="296" width="34" height="26"/><rect x="286" y="296" width="34" height="26"/>
    <rect x="210" y="330" width="34" height="26"/><rect x="248" y="330" width="34" height="26"/><rect x="286" y="330" width="34" height="26"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#9aa7b2">
    <text x="227" y="314" font-size="13" font-weight="600" fill="#1a2026">1</text><text x="265" y="314">0</text><text x="303" y="314">0</text>
    <text x="227" y="348" font-size="13" font-weight="600" fill="#1a2026">1</text><text x="265" y="348">0</text><text x="303" y="348">0</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="200" y="314">dp0</text><text x="200" y="348">dp1</text>
  </g>
  <!-- merge rule panel -->
  <text x="380" y="64" fill="#5c6b76" font-size="12.5" font-weight="600">Merging child into parent:</text>
  <g fill="#1a2026" font-size="12.5">
    <text x="380" y="90">dp1 (selected): child contributes</text>
    <text x="380" y="108">dp0 only — no adjacent selection</text>
    <text x="380" y="132">dp0 (unselected): child contributes</text>
    <text x="380" y="150">dp0 + dp1</text>
  </g>
  <text x="380" y="186" fill="#5c6b76" font-size="12.5" font-weight="600">At the root (k = 3):</text>
  <text x="380" y="212" fill="#1a2026" font-size="12.5">dp0[0] + dp1[0] − 1 = 2 + 0 − 1 = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <g fill="#1a2026" font-size="12.5">
    <text x="380" y="240">the one valid subset is {2}:</text>
    <text x="380" y="258">sum 3, divisible by k = 3</text>
  </g>
  <text x="340" y="396" text-anchor="middle" fill="#1a2026" font-size="13">Bottom-up merges leave dp0[0][0] = 2 — the empty subset and {2};</text>
  <text x="340" y="414" text-anchor="middle" fill="#1a2026" font-size="13">subtracting the empty subset gives the answer <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
