<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- Example 1: n=5, edges 0->1,1->4,0->2,2->3,3->4 (all t=1), power=4, cost=[2,3,1,1,1].
       States are (node, power). Path 0->1 dies: arrives (1,2), cost[1]=3 blocks leaving.
       Settled path 0->2->3->4 reaches (4,0) at t=3. Node centers: 0(90,120) 1(210,64) 2(210,176) 3(330,176) 4(450,120), r=22 -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="222" y="24">arrive p=2, t=1</text>
    <text x="222" y="38">p=2 &lt; cost[1]=3 — stuck</text>
  </g>
  <!-- edges -->
  <g stroke="#9aa7b2" stroke-width="1.6" fill="none">
    <path d="M 110 111 L 190 73" stroke-dasharray="4 3" marker-end="url(#arrowM)"/>
    <path d="M 231 69 L 429 115" stroke-dasharray="4 3" marker-end="url(#arrowM)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.4" fill="none">
    <path d="M 110 129 L 190 167" marker-end="url(#arrowB)"/>
    <path d="M 232 176 L 308 176" marker-end="url(#arrowB)"/>
    <path d="M 350 167 L 430 129" marker-end="url(#arrowB)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="140" y="168">t=1</text>
    <text x="270" y="168">t=1</text>
    <text x="392" y="172">t=1</text>
  </g>
  <!-- nodes -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.7">
    <circle cx="90" cy="120" r="22"/>
    <circle cx="210" cy="176" r="22"/>
    <circle cx="330" cy="176" r="22"/>
  </g>
  <circle cx="210" cy="64" r="22" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="450" cy="120" r="22" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.2"/>
  <g text-anchor="middle">
    <text x="90" y="118" font-weight="600">0</text><text x="90" y="132" fill="#5c6b76" font-size="10.5">c=2</text>
    <text x="210" y="62" font-weight="600" fill="#5c6b76">1</text><text x="210" y="76" fill="#9aa7b2" font-size="10.5">c=3</text>
    <text x="210" y="174" font-weight="600">2</text><text x="210" y="188" fill="#5c6b76" font-size="10.5">c=1</text>
    <text x="330" y="174" font-weight="600">3</text><text x="330" y="188" fill="#5c6b76" font-size="10.5">c=1</text>
    <text x="450" y="118" font-weight="600" fill="#4169E1">4</text><text x="450" y="132" fill="#5c6b76" font-size="10.5">c=1</text>
  </g>
  <!-- per-node state on the settled route -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="90" y="88">p=4, t=0</text>
    <text x="210" y="214">p=2, t=1</text>
    <text x="330" y="214">p=1, t=2</text>
  </g>
  <text x="486" y="116" fill="#1a2026" font-size="12.5" font-weight="600">p=0, t=3 — target</text>
  <text x="486" y="134" fill="#5c6b76" font-size="11.5">answer [3, 0]</text>
  <!-- pop order strip -->
  <text x="340" y="230" text-anchor="middle" fill="#5c6b76" font-size="12">Dijkstra pop order, states (node, power)</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="82" y="240" width="84" height="40"/>
    <rect x="406" y="240" width="84" height="40"/>
    <rect x="514" y="240" width="84" height="40"/>
  </g>
  <rect x="190" y="240" width="84" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="298" y="240" width="84" height="40" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="124" y="256">(0, 4)</text>
    <text x="232" y="256" fill="#9aa7b2">(1, 2)</text>
    <text x="340" y="256">(2, 2)</text>
    <text x="448" y="256">(3, 1)</text>
    <text x="556" y="256" fill="#4169E1">(4, 0)</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#5c6b76">
    <text x="124" y="272">t=0</text>
    <text x="232" y="272" fill="#9aa7b2">stuck 2&lt;3</text>
    <text x="340" y="272">t=1</text>
    <text x="448" y="272">t=2</text>
    <text x="556" y="272">t=3</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.4" fill="none">
    <path d="M 168 260 H 186" marker-end="url(#arrow)"/>
    <path d="M 276 260 H 294" marker-end="url(#arrow)"/>
    <path d="M 384 260 H 402" marker-end="url(#arrow)"/>
    <path d="M 492 260 H 510" marker-end="url(#arrow)"/>
  </g>
  <text x="340" y="316" text-anchor="middle" fill="#1a2026" font-size="13">The move into node 1 lands with 2 power, below cost[1] = 3, so it can never leave;</text>
  <text x="340" y="334" text-anchor="middle" fill="#1a2026" font-size="13">the settled path 0 → 2 → 3 → 4 reaches the target at time <tspan fill="#4169E1" font-weight="600">3</tspan> with <tspan fill="#4169E1" font-weight="600">0</tspan> power left.</text>
</svg>
