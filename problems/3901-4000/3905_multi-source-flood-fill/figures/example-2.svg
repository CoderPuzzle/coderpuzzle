<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 186" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 3, m = 3, sources = [[0,1,3],[1,1,5]]; grids at t = 0, 1, 2 from step-by-step simulation; no true ties, final grid [[3,3,3],[5,5,5],[5,5,5]] -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <rect x="16" y="26" width="34" height="34"/>
    <rect x="84" y="26" width="34" height="34"/>
    <rect x="16" y="60" width="34" height="34"/>
    <rect x="84" y="60" width="34" height="34"/>
    <rect x="16" y="94" width="34" height="34"/>
    <rect x="50" y="94" width="34" height="34"/>
    <rect x="84" y="94" width="34" height="34"/>
    <rect x="170" y="94" width="34" height="34"/>
    <rect x="238" y="94" width="34" height="34"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <rect x="50" y="26" width="34" height="34"/>
    <rect x="50" y="60" width="34" height="34"/>
    <rect x="170" y="26" width="34" height="34"/>
    <rect x="204" y="26" width="34" height="34"/>
    <rect x="238" y="26" width="34" height="34"/>
    <rect x="170" y="60" width="34" height="34"/>
    <rect x="204" y="60" width="34" height="34"/>
    <rect x="238" y="60" width="34" height="34"/>
    <rect x="204" y="94" width="34" height="34"/>
    <rect x="324" y="26" width="34" height="34"/>
    <rect x="358" y="26" width="34" height="34"/>
    <rect x="392" y="26" width="34" height="34"/>
    <rect x="324" y="60" width="34" height="34"/>
    <rect x="358" y="60" width="34" height="34"/>
    <rect x="392" y="60" width="34" height="34"/>
    <rect x="358" y="94" width="34" height="34"/>
  </g>
  <g fill="#e6ecfb" stroke="#4169E1" stroke-width="2.2">
    <rect x="324" y="94" width="34" height="34"/>
    <rect x="392" y="94" width="34" height="34"/>
  </g>
  <g font-size="12.5" fill="#5c6b76" text-anchor="middle">
    <text x="33" y="48">0</text>
    <text x="101" y="48">0</text>
    <text x="33" y="82">0</text>
    <text x="101" y="82">0</text>
    <text x="33" y="116">0</text>
    <text x="67" y="116">0</text>
    <text x="101" y="116">0</text>
    <text x="187" y="116">0</text>
    <text x="255" y="116">0</text>
  </g>
  <g font-size="13" font-weight="700" fill="#1a2026" text-anchor="middle">
    <text x="67" y="48">3</text>
    <text x="67" y="82">5</text>
    <text x="187" y="48">3</text>
    <text x="221" y="48">3</text>
    <text x="255" y="48">3</text>
    <text x="187" y="82">5</text>
    <text x="221" y="82">5</text>
    <text x="255" y="82">5</text>
    <text x="221" y="116">5</text>
    <text x="341" y="48">3</text>
    <text x="375" y="48">3</text>
    <text x="409" y="48">3</text>
    <text x="341" y="82">5</text>
    <text x="375" y="82">5</text>
    <text x="409" y="82">5</text>
    <text x="375" y="116">5</text>
  </g>
  <g font-size="13" font-weight="700" fill="#4169E1" text-anchor="middle">
    <text x="341" y="116">5</text>
    <text x="409" y="116">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="128" y1="77" x2="160" y2="77" marker-end="url(#arrow)"/>
    <line x1="282" y1="77" x2="314" y2="77" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#5c6b76" text-anchor="middle">
    <text x="67" y="150">t = 0</text>
    <text x="221" y="150">t = 1</text>
    <text x="375" y="150">t = 2</text>
  </g>
  <text x="220" y="176" text-anchor="middle" fill="#1a2026" font-size="13.5"><tspan fill="#4169E1" font-weight="700">3</tspan> takes the top row at t = 1 before <tspan fill="#4169E1" font-weight="700">5</tspan> arrives; 5 fills the rest by t = 2</text>
</svg>
