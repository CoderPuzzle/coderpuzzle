<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 184" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 2, m = 2, sources = [[1,1,5]]; grids at t = 0, 1, 2 from step-by-step simulation; final grid [[5,5],[5,5]] -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <rect x="24" y="26" width="40" height="40"/>
    <rect x="64" y="26" width="40" height="40"/>
    <rect x="24" y="66" width="40" height="40"/>
    <rect x="158" y="26" width="40" height="40"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <rect x="64" y="66" width="40" height="40"/>
    <rect x="198" y="26" width="40" height="40"/>
    <rect x="158" y="66" width="40" height="40"/>
    <rect x="198" y="66" width="40" height="40"/>
    <rect x="292" y="66" width="40" height="40"/>
    <rect x="332" y="66" width="40" height="40"/>
  </g>
  <g fill="#e6ecfb" stroke="#4169E1" stroke-width="2.2">
    <rect x="292" y="26" width="40" height="40"/>
    <rect x="332" y="26" width="40" height="40"/>
  </g>
  <g font-size="13" fill="#5c6b76" text-anchor="middle">
    <text x="44" y="51">0</text>
    <text x="84" y="51">0</text>
    <text x="44" y="91">0</text>
    <text x="178" y="51">0</text>
  </g>
  <g font-size="14" font-weight="700" fill="#1a2026" text-anchor="middle">
    <text x="84" y="91">5</text>
    <text x="218" y="51">5</text>
    <text x="178" y="91">5</text>
    <text x="218" y="91">5</text>
    <text x="312" y="91">5</text>
    <text x="352" y="91">5</text>
  </g>
  <g font-size="14" font-weight="700" fill="#4169E1" text-anchor="middle">
    <text x="312" y="51">5</text>
    <text x="352" y="51">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="112" y1="66" x2="150" y2="66" marker-end="url(#arrow)"/>
    <line x1="246" y1="66" x2="284" y2="66" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#5c6b76" text-anchor="middle">
    <text x="64" y="128">t = 0</text>
    <text x="198" y="128">t = 1</text>
    <text x="332" y="128">t = 2</text>
  </g>
  <text x="198" y="164" text-anchor="middle" fill="#1a2026" font-size="13.5">one source floods the grid: every cell is <tspan fill="#4169E1" font-weight="700">5</tspan> by t = 2</text>
</svg>
