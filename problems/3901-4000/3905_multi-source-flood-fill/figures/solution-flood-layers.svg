<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
  <!-- t = 0 -->
  <g text-anchor="middle" font-weight="600">
    <rect x="30" y="46" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/><text x="52" y="73" fill="#4169E1">1</text>
    <rect x="74" y="46" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="96" y="73" fill="#5c6b76">0</text>
    <rect x="118" y="46" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="140" y="73" fill="#5c6b76">0</text>
    <rect x="30" y="90" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="52" y="117" fill="#5c6b76">0</text>
    <rect x="74" y="90" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="96" y="117" fill="#5c6b76">0</text>
    <rect x="118" y="90" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="140" y="117" fill="#5c6b76">0</text>
    <rect x="30" y="134" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="52" y="161" fill="#5c6b76">0</text>
    <rect x="74" y="134" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="96" y="161" fill="#5c6b76">0</text>
    <rect x="118" y="134" width="44" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/><text x="140" y="161" fill="#ffffff">2</text>
  </g>
  <text x="96" y="34" text-anchor="middle" fill="#1a2026" font-weight="600">t = 0</text>
  <text x="96" y="200" text-anchor="middle" fill="#5c6b76" font-size="12.5">sources seeded</text>
  <!-- t = 1 -->
  <g text-anchor="middle" font-weight="600">
    <rect x="250" y="46" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/><text x="272" y="73" fill="#4169E1">1</text>
    <rect x="294" y="46" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/><text x="316" y="73" fill="#4169E1">1</text>
    <rect x="338" y="46" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="360" y="73" fill="#5c6b76">0</text>
    <rect x="250" y="90" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/><text x="272" y="117" fill="#4169E1">1</text>
    <rect x="294" y="90" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="316" y="117" fill="#5c6b76">0</text>
    <rect x="338" y="90" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="360" y="117" fill="#5c6b76">0</text>
    <rect x="250" y="134" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="272" y="161" fill="#5c6b76">0</text>
    <rect x="294" y="134" width="44" height="44" fill="#ffffff" stroke="#98a2ac"/><text x="316" y="161" fill="#5c6b76">0</text>
    <rect x="338" y="134" width="44" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/><text x="360" y="161" fill="#ffffff">2</text>
  </g>
  <text x="316" y="34" text-anchor="middle" fill="#1a2026" font-weight="600">t = 1</text>
  <text x="316" y="200" text-anchor="middle" fill="#5c6b76" font-size="12.5">frontier spreads once</text>
  <!-- t = 2 -->
  <g text-anchor="middle" font-weight="600">
    <rect x="470" y="46" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/><text x="492" y="73" fill="#4169E1">1</text>
    <rect x="514" y="46" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/><text x="536" y="73" fill="#4169E1">1</text>
    <rect x="558" y="46" width="44" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/><text x="580" y="73" fill="#ffffff">2</text>
    <rect x="470" y="90" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/><text x="492" y="117" fill="#4169E1">1</text>
    <rect x="514" y="90" width="44" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/><text x="536" y="117" fill="#ffffff">2</text>
    <rect x="558" y="90" width="44" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/><text x="580" y="117" fill="#ffffff">2</text>
    <rect x="470" y="134" width="44" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/><text x="492" y="161" fill="#ffffff">2</text>
    <rect x="514" y="134" width="44" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/><text x="536" y="161" fill="#ffffff">2</text>
    <rect x="558" y="134" width="44" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/><text x="580" y="161" fill="#ffffff">2</text>
  </g>
  <text x="536" y="34" text-anchor="middle" fill="#1a2026" font-weight="600">t = 2 (final)</text>
  <text x="536" y="200" text-anchor="middle" fill="#5c6b76" font-size="12.5">ties keep the max color</text>
  <text x="320" y="228" text-anchor="middle" fill="#5c6b76" font-size="12.5">Cells (0,2), (1,1) and (2,0) are reached by both colors at t = 2 and take color 2.</text>
  <text x="320" y="246" text-anchor="middle" fill="#5c6b76" font-size="12.5">BFS layer k colors exactly the cells at distance k from the nearest source.</text>
</svg>
