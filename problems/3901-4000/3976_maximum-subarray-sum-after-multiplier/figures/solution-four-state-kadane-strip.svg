<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,-2,3,4,-5], k = 2; four-state Kadane strip.
       Columns x = 140 + 96i (cw 96); rows y: none 100, mult 140, div 180, done 220 (h 40).
       Hand-run values: none 1 -1 3 7 2 | mult 2 -2 6 14 4 | div 0 0 1 5 5 | done - 0 3 10 9 -->
  <!-- operated span bracket over columns i=2..3 -->
  <text x="428" y="40" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">operation ×2 runs here</text>
  <path d="M 332 58 L 332 50 L 524 50 L 524 58" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <!-- column headers -->
  <g text-anchor="middle" font-weight="600">
    <text x="188" y="80">1</text><text x="284" y="80">-2</text><text x="380" y="80">3</text>
    <text x="476" y="80">4</text><text x="572" y="80">-5</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="188" y="96">i = 0</text><text x="284" y="96">i = 1</text><text x="380" y="96">i = 2</text>
    <text x="476" y="96">i = 3</text><text x="572" y="96">i = 4</text>
  </g>
  <!-- cells -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="140" y="104" width="96" height="40"/><rect x="236" y="104" width="96" height="40"/><rect x="332" y="104" width="96" height="40"/><rect x="428" y="104" width="96" height="40"/><rect x="524" y="104" width="96" height="40"/>
    <rect x="140" y="144" width="96" height="40"/><rect x="236" y="144" width="96" height="40"/><rect x="332" y="144" width="96" height="40"/><rect x="524" y="144" width="96" height="40"/>
    <rect x="140" y="184" width="96" height="40"/><rect x="236" y="184" width="96" height="40"/><rect x="332" y="184" width="96" height="40"/><rect x="428" y="184" width="96" height="40"/><rect x="524" y="184" width="96" height="40"/>
    <rect x="140" y="224" width="96" height="40"/><rect x="236" y="224" width="96" height="40"/><rect x="332" y="224" width="96" height="40"/><rect x="428" y="224" width="96" height="40"/><rect x="524" y="224" width="96" height="40"/>
  </g>
  <rect x="428" y="144" width="96" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <!-- row labels -->
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="128" y="128">none</text>
    <text x="128" y="168">multiply</text>
    <text x="128" y="208">divide</text>
    <text x="128" y="248">done</text>
  </g>
  <!-- cell values -->
  <g text-anchor="middle" font-size="14">
    <text x="188" y="129">1</text><text x="284" y="129">-1</text><text x="380" y="129">3</text><text x="476" y="129">7</text><text x="572" y="129">2</text>
    <text x="188" y="169">2</text><text x="284" y="169">-2</text><text x="380" y="169">6</text><text x="476" y="169" fill="#4169E1" font-weight="700">14</text><text x="572" y="169">4</text>
    <text x="188" y="209">0</text><text x="284" y="209">0</text><text x="380" y="209">1</text><text x="476" y="209">5</text><text x="572" y="209">5</text>
    <text x="188" y="249" fill="#9aa7b2">—</text><text x="284" y="249">0</text><text x="380" y="249">3</text><text x="476" y="249">10</text><text x="572" y="249">9</text>
  </g>
  <!-- fill direction -->
  <path d="M 150 286 H 560" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="306" text-anchor="middle" fill="#5c6b76" font-size="12">scan left to right, carrying all four states</text>
  <text x="340" y="332" text-anchor="middle" fill="#1a2026" font-size="13">Multiplying the span [3, 4] gives [6, 8]; the multiply state peaks there:</text>
  <text x="340" y="350" text-anchor="middle" fill="#1a2026" font-size="13">6 + 8 = <tspan fill="#4169E1" font-weight="600">14</tspan>, the largest value anywhere in the strip.</text>
</svg>
