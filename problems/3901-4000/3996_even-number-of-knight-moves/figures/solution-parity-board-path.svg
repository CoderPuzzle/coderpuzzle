<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 444" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="460" height="444" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- path = (1,1)->(3,2)->(2,4)->(4,3)->(2,2), sums x+y = 2,5,6,7,4; board cells 36px at (86,42); even x+y fill #dbe4fb -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="104" y="32">0</text><text x="140" y="32">1</text><text x="176" y="32">2</text><text x="212" y="32">3</text>
    <text x="248" y="32">4</text><text x="284" y="32">5</text><text x="320" y="32">6</text><text x="356" y="32">7</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="76" y="65">0</text><text x="76" y="101">1</text><text x="76" y="137">2</text><text x="76" y="173">3</text>
    <text x="76" y="209">4</text><text x="76" y="245">5</text><text x="76" y="281">6</text><text x="76" y="317">7</text>
  </g>
  <g stroke="#42525e" stroke-width="1">
    <rect x="86" y="42" width="36" height="36" fill="#dbe4fb"/><rect x="122" y="42" width="36" height="36" fill="#ffffff"/><rect x="158" y="42" width="36" height="36" fill="#dbe4fb"/><rect x="194" y="42" width="36" height="36" fill="#ffffff"/><rect x="230" y="42" width="36" height="36" fill="#dbe4fb"/><rect x="266" y="42" width="36" height="36" fill="#ffffff"/><rect x="302" y="42" width="36" height="36" fill="#dbe4fb"/><rect x="338" y="42" width="36" height="36" fill="#ffffff"/>
    <rect x="86" y="78" width="36" height="36" fill="#ffffff"/><rect x="122" y="78" width="36" height="36" fill="#dbe4fb"/><rect x="158" y="78" width="36" height="36" fill="#ffffff"/><rect x="194" y="78" width="36" height="36" fill="#dbe4fb"/><rect x="230" y="78" width="36" height="36" fill="#ffffff"/><rect x="266" y="78" width="36" height="36" fill="#dbe4fb"/><rect x="302" y="78" width="36" height="36" fill="#ffffff"/><rect x="338" y="78" width="36" height="36" fill="#dbe4fb"/>
    <rect x="86" y="114" width="36" height="36" fill="#dbe4fb"/><rect x="122" y="114" width="36" height="36" fill="#ffffff"/><rect x="158" y="114" width="36" height="36" fill="#dbe4fb"/><rect x="194" y="114" width="36" height="36" fill="#ffffff"/><rect x="230" y="114" width="36" height="36" fill="#dbe4fb"/><rect x="266" y="114" width="36" height="36" fill="#ffffff"/><rect x="302" y="114" width="36" height="36" fill="#dbe4fb"/><rect x="338" y="114" width="36" height="36" fill="#ffffff"/>
    <rect x="86" y="150" width="36" height="36" fill="#ffffff"/><rect x="122" y="150" width="36" height="36" fill="#dbe4fb"/><rect x="158" y="150" width="36" height="36" fill="#ffffff"/><rect x="194" y="150" width="36" height="36" fill="#dbe4fb"/><rect x="230" y="150" width="36" height="36" fill="#ffffff"/><rect x="266" y="150" width="36" height="36" fill="#dbe4fb"/><rect x="302" y="150" width="36" height="36" fill="#ffffff"/><rect x="338" y="150" width="36" height="36" fill="#dbe4fb"/>
    <rect x="86" y="186" width="36" height="36" fill="#dbe4fb"/><rect x="122" y="186" width="36" height="36" fill="#ffffff"/><rect x="158" y="186" width="36" height="36" fill="#dbe4fb"/><rect x="194" y="186" width="36" height="36" fill="#ffffff"/><rect x="230" y="186" width="36" height="36" fill="#dbe4fb"/><rect x="266" y="186" width="36" height="36" fill="#ffffff"/><rect x="302" y="186" width="36" height="36" fill="#dbe4fb"/><rect x="338" y="186" width="36" height="36" fill="#ffffff"/>
    <rect x="86" y="222" width="36" height="36" fill="#ffffff"/><rect x="122" y="222" width="36" height="36" fill="#dbe4fb"/><rect x="158" y="222" width="36" height="36" fill="#ffffff"/><rect x="194" y="222" width="36" height="36" fill="#dbe4fb"/><rect x="230" y="222" width="36" height="36" fill="#ffffff"/><rect x="266" y="222" width="36" height="36" fill="#dbe4fb"/><rect x="302" y="222" width="36" height="36" fill="#ffffff"/><rect x="338" y="222" width="36" height="36" fill="#dbe4fb"/>
    <rect x="86" y="258" width="36" height="36" fill="#dbe4fb"/><rect x="122" y="258" width="36" height="36" fill="#ffffff"/><rect x="158" y="258" width="36" height="36" fill="#dbe4fb"/><rect x="194" y="258" width="36" height="36" fill="#ffffff"/><rect x="230" y="258" width="36" height="36" fill="#dbe4fb"/><rect x="266" y="258" width="36" height="36" fill="#ffffff"/><rect x="302" y="258" width="36" height="36" fill="#dbe4fb"/><rect x="338" y="258" width="36" height="36" fill="#ffffff"/>
    <rect x="86" y="294" width="36" height="36" fill="#ffffff"/><rect x="122" y="294" width="36" height="36" fill="#dbe4fb"/><rect x="158" y="294" width="36" height="36" fill="#ffffff"/><rect x="194" y="294" width="36" height="36" fill="#dbe4fb"/><rect x="230" y="294" width="36" height="36" fill="#ffffff"/><rect x="266" y="294" width="36" height="36" fill="#dbe4fb"/><rect x="302" y="294" width="36" height="36" fill="#ffffff"/><rect x="338" y="294" width="36" height="36" fill="#dbe4fb"/>
  </g>
  <!-- start cell (1,1) and target cell (2,2) rings -->
  <rect x="124.5" y="80.5" width="31" height="31" fill="none" stroke="#1a2026" stroke-width="1.8"/>
  <rect x="160.5" y="116.5" width="31" height="31" fill="none" stroke="#1a2026" stroke-width="1.8"/>
  <!-- 4 knight hops through cell centres -->
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <path d="M 148 100 L 202 127" marker-end="url(#arrow)"/>
    <path d="M 208 140 L 181 194" marker-end="url(#arrow)"/>
    <path d="M 184 200 L 238 173" marker-end="url(#arrow)"/>
    <path d="M 240 164 L 186 137" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1">
    <circle cx="140" cy="96" r="8.5"/><circle cx="212" cy="132" r="8.5"/><circle cx="176" cy="204" r="8.5"/>
    <circle cx="248" cy="168" r="8.5"/><circle cx="176" cy="132" r="8.5"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">
    <text x="140" y="100">1</text><text x="212" y="136">2</text><text x="176" y="208">3</text>
    <text x="248" y="172">4</text><text x="176" y="136">5</text>
  </g>
  <text x="230" y="356" text-anchor="middle" font-size="12.5" fill="#1a2026">(1,1)=<tspan fill="#4169E1" font-weight="600">2</tspan> → (3,2)=<tspan fill="#5c6b76">5</tspan> → (2,4)=<tspan fill="#4169E1" font-weight="600">6</tspan> → (4,3)=<tspan fill="#5c6b76">7</tspan> → (2,2)=<tspan fill="#4169E1" font-weight="600">4</tspan></text>
  <g font-size="12.5">
    <rect x="140" y="373" width="14" height="14" fill="#dbe4fb" stroke="#42525e"/>
    <text x="160" y="385" fill="#5c6b76">even x+y</text>
    <rect x="240" y="373" width="14" height="14" fill="#ffffff" stroke="#42525e"/>
    <text x="260" y="385" fill="#5c6b76">odd x+y</text>
  </g>
  <text x="230" y="412" text-anchor="middle" fill="#1a2026" font-size="13">Each hop flips the color: even → odd → even → odd → even.</text>
  <text x="230" y="432" text-anchor="middle" fill="#1a2026" font-size="13">Start (1,1) and target (2,2) share a color — <tspan fill="#4169E1" font-weight="600">4</tspan> moves, even → <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
