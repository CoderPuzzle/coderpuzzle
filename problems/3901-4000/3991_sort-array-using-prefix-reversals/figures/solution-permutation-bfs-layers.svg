<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [2,0,1], pre = [2,3]; BFS over the six permutations of {0,1,2}.
       Layers: 0: 201 | 1: 021(rev2), 102(rev3) | 2: 120(021+rev3), 012(102+rev2) | 3: 210.
       Answer path: 201 via rev3 to 102 via rev2 to 012, distance 2.
       Node rects w92 h34; centers: 201(90,150) 021(230,80) 102(230,220) 120(380,55) 012(380,150) 210(530,100) -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="90" y="26">dist 0</text><text x="230" y="26">dist 1</text>
    <text x="380" y="26">dist 2</text><text x="530" y="26">dist 3</text>
  </g>
  <!-- forward edges -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 124 133 L 196 97" marker-end="url(#arrow)"/>
    <path d="M 276 72 L 334 63" marker-end="url(#arrow)"/>
    <path d="M 426 69 L 482 86" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.4" fill="none">
    <path d="M 124 167 L 196 203" marker-end="url(#arrowB)"/>
    <path d="M 266 203 L 338 167" marker-end="url(#arrowB)"/>
  </g>
  <path d="M 426 135 L 482 115" fill="none" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- edge labels -->
  <g text-anchor="middle" font-size="12">
    <text x="148" y="104" fill="#42525e">rev 2</text>
    <text x="305" y="54" fill="#42525e">rev 3</text>
    <text x="454" y="62" fill="#42525e">rev 2</text>
    <text x="150" y="204" fill="#4169E1" font-weight="600">rev 3</text>
    <text x="298" y="210" fill="#4169E1" font-weight="600">rev 2</text>
    <text x="452" y="158" fill="#9aa7b2">rev 3</text>
  </g>
  <!-- nodes -->
  <g text-anchor="middle" font-size="13" font-weight="600">
    <rect x="44" y="133" width="92" height="34" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="90" y="155">[2, 0, 1]</text>
    <rect x="184" y="63" width="92" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="230" y="85" fill="#1a2026">[0, 2, 1]</text>
    <rect x="184" y="203" width="92" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="230" y="225" fill="#1a2026">[1, 0, 2]</text>
    <rect x="334" y="38" width="92" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="380" y="60" fill="#1a2026">[1, 2, 0]</text>
    <rect x="334" y="133" width="92" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <text x="380" y="155" fill="#1a2026">[0, 1, 2]</text>
    <rect x="484" y="83" width="92" height="34" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
    <text x="530" y="105" fill="#5c6b76">[2, 1, 0]</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="90" y="184">start</text>
    <text x="380" y="184">sorted — answer</text>
  </g>
  <text x="340" y="272" text-anchor="middle" fill="#1a2026" font-size="13">From [2, 0, 1], BFS applies rev 2 / rev 3 to each dequeued permutation;</text>
  <text x="340" y="292" text-anchor="middle" fill="#1a2026" font-size="13">the sorted [0, 1, 2] first pops at distance 2 (reverse 3, then reverse 2) — answer <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
