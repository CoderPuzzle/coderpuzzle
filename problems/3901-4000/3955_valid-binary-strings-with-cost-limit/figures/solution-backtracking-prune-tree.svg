<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="400" fill="#ffffff"/>
  <!-- n=3, k=1 backtracking tree; prefixes per level, '0' before '1'; nodes 56x30 rects,
       row centers y = 40 / 122 / 204 / 286; killed prefixes carry a strike and their rule -->
  <!-- edges: solid = kept prefix, dashed = pruned prefix -->
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="385" y1="55" x2="228" y2="107"/>
    <line x1="405" y1="55" x2="562" y2="107"/>
    <line x1="212" y1="137" x2="128" y2="189"/>
    <line x1="228" y1="137" x2="312" y2="189"/>
    <line x1="562" y1="137" x2="528" y2="189"/>
    <line x1="120" y1="219" x2="76" y2="271"/>
    <line x1="312" y1="219" x2="276" y2="271"/>
    <line x1="520" y1="219" x2="476" y2="271"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 4">
    <line x1="578" y1="137" x2="612" y2="189"/>
    <line x1="128" y1="219" x2="164" y2="271"/>
    <line x1="328" y1="219" x2="364" y2="271"/>
    <line x1="528" y1="219" x2="564" y2="271"/>
  </g>
  <!-- level labels -->
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="34" y="44">start</text>
    <text x="34" y="126">i = 0</text>
    <text x="34" y="208">i = 1</text>
    <text x="34" y="290">i = 2</text>
  </g>
  <!-- internal prefixes -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="367" y="25" width="56" height="30" rx="6"/>
    <rect x="192" y="107" width="56" height="30" rx="6"/>
    <rect x="542" y="107" width="56" height="30" rx="6"/>
    <rect x="92" y="189" width="56" height="30" rx="6"/>
    <rect x="292" y="189" width="56" height="30" rx="6"/>
    <rect x="492" y="189" width="56" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="395" y="45">&#949;</text>
    <text x="220" y="127">0</text>
    <text x="570" y="127">1</text>
    <text x="120" y="209">00</text>
    <text x="320" y="209">01</text>
    <text x="520" y="209">10</text>
  </g>
  <!-- pruned prefixes: 11 at i=1; 001, 011, 101 at i=2 -->
  <g stroke="#9aa7b2" stroke-width="1.3" fill="#f0f3f7">
    <rect x="592" y="189" width="56" height="30" rx="6"/>
    <rect x="142" y="271" width="56" height="30" rx="6"/>
    <rect x="342" y="271" width="56" height="30" rx="6"/>
    <rect x="542" y="271" width="56" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-weight="600">
    <text x="620" y="209">11</text>
    <text x="170" y="291">001</text>
    <text x="370" y="291">011</text>
    <text x="570" y="291">101</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5">
    <line x1="602" y1="204" x2="638" y2="204"/>
    <line x1="152" y1="286" x2="188" y2="286"/>
    <line x1="352" y1="286" x2="388" y2="286"/>
    <line x1="552" y1="286" x2="588" y2="286"/>
  </g>
  <!-- surviving leaves -->
  <g stroke="#4169E1" stroke-width="1.5" fill="#4169E1">
    <rect x="42" y="271" width="56" height="30" rx="6"/>
    <rect x="242" y="271" width="56" height="30" rx="6"/>
    <rect x="442" y="271" width="56" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-weight="600">
    <text x="70" y="291">000</text>
    <text x="270" y="291">010</text>
    <text x="470" y="291">100</text>
  </g>
  <!-- prune reasons -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="620" y="235">adjacent 1s</text>
    <text x="170" y="317">cost 2 &gt; 1</text>
    <text x="370" y="317">adjacent 1s</text>
    <text x="570" y="317">cost 2 &gt; 1</text>
  </g>
  <text x="340" y="360" text-anchor="middle" fill="#1a2026" font-size="13">With '0' tried before '1', a prefix dies the moment a rule breaks:</text>
  <text x="340" y="380" text-anchor="middle" fill="#1a2026" font-size="13">001 and 101 exceed cost k = 1, 011 and 11 repeat a '1' — leaves <tspan fill="#4169E1" font-weight="600">000, 010, 100</tspan> survive.</text>
</svg>
