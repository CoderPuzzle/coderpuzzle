<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- Example 1: edges 0-1:5, 1-2:3, 3-4:4, 4-5:1, 1-4:2; threshold 4 -> heavy {0-1}; path 0>1>4>3, dist[3]=1 <= k=1 -->
  <!-- legend -->
  <line x1="480" y1="28" x2="508" y2="28" stroke="#4169E1" stroke-width="2.6"/>
  <text x="516" y="32" fill="#1a2026" font-size="12">heavy: w &gt; 4</text>
  <line x1="480" y1="50" x2="508" y2="50" stroke="#42525e" stroke-width="2.2"/>
  <text x="516" y="54" fill="#1a2026" font-size="12">on the chosen path</text>
  <line x1="480" y1="72" x2="508" y2="72" stroke="#9aa7b2" stroke-width="1.6"/>
  <text x="516" y="76" fill="#1a2026" font-size="12">light: w ≤ 4</text>
  <!-- light edges off the path -->
  <line x1="266" y1="80" x2="394" y2="80" stroke="#9aa7b2" stroke-width="1.6"/>
  <line x1="266" y1="200" x2="394" y2="200" stroke="#9aa7b2" stroke-width="1.6"/>
  <!-- path edges: heavy 0->1, light 1->4, light 4->3 -->
  <line x1="106" y1="80" x2="230" y2="80" stroke="#4169E1" stroke-width="2.6" marker-end="url(#arrow)"/>
  <line x1="250" y1="96" x2="250" y2="182" stroke="#42525e" stroke-width="2.2" marker-end="url(#arrowDark)"/>
  <line x1="234" y1="200" x2="108" y2="200" stroke="#42525e" stroke-width="2.2" marker-end="url(#arrowDark)"/>
  <!-- edge weights -->
  <text x="168" y="68" text-anchor="middle" fill="#4169E1" font-size="14" font-weight="600">5</text>
  <text x="330" y="68" text-anchor="middle" fill="#5c6b76" font-size="13">3</text>
  <text x="266" y="144" fill="#1a2026" font-size="13" font-weight="600">2</text>
  <text x="170" y="188" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">4</text>
  <text x="330" y="188" text-anchor="middle" fill="#5c6b76" font-size="13">1</text>
  <!-- nodes -->
  <circle cx="90" cy="80" r="16" fill="#4169E1"/>
  <text x="90" y="85" text-anchor="middle" fill="#ffffff" font-weight="600">0</text>
  <circle cx="250" cy="80" r="16" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="250" y="85" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <circle cx="410" cy="80" r="16" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="410" y="85" text-anchor="middle" fill="#5c6b76">2</text>
  <circle cx="250" cy="200" r="16" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="250" y="205" text-anchor="middle" fill="#1a2026" font-weight="600">4</text>
  <circle cx="410" cy="200" r="16" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="410" y="205" text-anchor="middle" fill="#5c6b76">5</text>
  <circle cx="90" cy="200" r="16" fill="#1a2026"/>
  <text x="90" y="205" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <!-- source / target / BFS heavy counts -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="90" y="48">source · d = 0</text>
    <text x="250" y="52">d = 1</text>
    <text x="90" y="240">target · d = 1</text>
  </g>
  <text x="276" y="190" fill="#5c6b76" font-size="11.5">d = 1</text>
  <!-- caption -->
  <text x="340" y="276" text-anchor="middle" fill="#1a2026" font-size="13">At threshold 4 only 0–1 (5) is heavy; zero-one BFS gives every node heavy count ≤ 1,</text>
  <text x="340" y="294" text-anchor="middle" fill="#1a2026" font-size="13">so 0 → 1 → 4 → 3 is valid with exactly its one heavy edge — the answer is <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
