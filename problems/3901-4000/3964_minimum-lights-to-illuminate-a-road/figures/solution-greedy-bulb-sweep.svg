<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="390" fill="#ffffff"/>
  <!-- lights = [0,0,0,0], n = 4; road cells 76x42 at x = 100 + 90i;
       three road snapshots: start, after bulb at 1 (covers 0..2), after bulb at 3 (covers 2..3) -->
  <!-- start: everything dark -->
  <g stroke="#9aa7b2" stroke-width="1.3" fill="#f0f3f7">
    <rect x="100" y="56" width="76" height="42" rx="5"/>
    <rect x="190" y="56" width="76" height="42" rx="5"/>
    <rect x="280" y="56" width="76" height="42" rx="5"/>
    <rect x="370" y="56" width="76" height="42" rx="5"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-weight="600">
    <text x="138" y="82">0</text><text x="228" y="82">1</text>
    <text x="318" y="82">2</text><text x="408" y="82">3</text>
  </g>
  <text x="86" y="82" text-anchor="end" fill="#5c6b76" font-size="12.5">start</text>
  <text x="138" y="118" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">first dark: i = 0</text>
  <!-- step 1: bulb at 1 covers [0, 2] -->
  <g stroke="#9aa7b2" stroke-width="1.3" fill="#f0f3f7">
    <rect x="370" y="150" width="76" height="42" rx="5"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="100" y="150" width="76" height="42" rx="5"/>
    <rect x="190" y="150" width="76" height="42" rx="5"/>
    <rect x="280" y="150" width="76" height="42" rx="5"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="138" y="176" fill="#1a2026">0</text><text x="228" y="176" fill="#1a2026">1</text>
    <text x="318" y="176" fill="#1a2026">2</text><text x="408" y="176" fill="#9aa7b2">3</text>
  </g>
  <text x="86" y="176" text-anchor="end" fill="#5c6b76" font-size="12.5">step 1</text>
  <text x="240" y="212" text-anchor="middle" fill="#1a2026" font-size="12.5">install at 1 &#8594; covers [0, 2]</text>
  <text x="408" y="212" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">next dark: i = 3</text>
  <!-- step 2: bulb at 3 (i + 1 = 4 out of bounds) covers [2, 3] -->
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="100" y="246" width="76" height="42" rx="5"/>
    <rect x="190" y="246" width="76" height="42" rx="5"/>
    <rect x="280" y="246" width="76" height="42" rx="5"/>
    <rect x="370" y="246" width="76" height="42" rx="5"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="138" y="272">0</text><text x="228" y="272">1</text>
    <text x="318" y="272">2</text><text x="408" y="272">3</text>
  </g>
  <text x="344" y="262" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">&#215;2</text>
  <text x="86" y="272" text-anchor="end" fill="#5c6b76" font-size="12.5">step 2</text>
  <!-- installed bulbs: badges above positions 1 and 3 -->
  <g>
    <circle cx="228" cy="134" r="10" fill="#4169E1"/>
    <line x1="224" y1="134" x2="232" y2="134" stroke="#ffffff" stroke-width="2"/>
    <line x1="228" y1="130" x2="228" y2="138" stroke="#ffffff" stroke-width="2"/>
    <circle cx="408" cy="230" r="10" fill="#4169E1"/>
    <line x1="404" y1="230" x2="412" y2="230" stroke="#ffffff" stroke-width="2"/>
    <line x1="408" y1="226" x2="408" y2="234" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="310" y="312" text-anchor="middle" fill="#1a2026" font-size="12.5">first dark cell i = 3 &#8594; install at 3 (i + 1 = 4 is out of bounds)</text>
  <text x="310" y="330" text-anchor="middle" fill="#1a2026" font-size="12.5">position 2 is lit by both bulbs — the spans overlap only there</text>
  <text x="310" y="358" text-anchor="middle" fill="#1a2026" font-size="13">The greedy sweep places each bulb as far right as it still covers the first dark cell —</text>
  <text x="310" y="376" text-anchor="middle" fill="#1a2026" font-size="13">bulbs at 1 and 3 cover [0, 2] and [2, 3], overlapping only at position 2 — <tspan fill="#4169E1" font-weight="600">2 bulbs</tspan>.</text>
</svg>
