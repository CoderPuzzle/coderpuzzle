<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree [5,2,8,1,null,9,6]; rows y 60/150/250, node r 20; included in sums: 5 and 8; muted: 2, 1, 9, 6 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="292" y1="73" x2="208" y2="137"/>
    <line x1="328" y1="73" x2="412" y2="137"/>
    <line x1="177" y1="168" x2="133" y2="232"/>
    <line x1="416" y1="167" x2="364" y2="233"/>
    <line x1="444" y1="167" x2="496" y2="233"/>
  </g>
  <!-- included nodes -->
  <circle cx="310" cy="60" r="20" fill="#4169E1"/>
  <text x="310" y="66" text-anchor="middle" fill="#ffffff" font-weight="600">5</text>
  <circle cx="430" cy="150" r="20" fill="#4169E1"/>
  <text x="430" y="156" text-anchor="middle" fill="#ffffff" font-weight="600">8</text>
  <!-- muted nodes -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6">
    <circle cx="190" cy="150" r="20"/><circle cx="120" cy="250" r="20"/>
    <circle cx="350" cy="250" r="20"/><circle cx="510" cy="250" r="20"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76">
    <text x="190" y="156">2</text><text x="120" y="256">1</text>
    <text x="350" y="256">9</text><text x="510" y="256">6</text>
  </g>
  <!-- level 1: left to right through 5 -->
  <g stroke="#4169E1" stroke-width="2">
    <line x1="240" y1="60" x2="284" y2="60"/>
    <line x1="336" y1="60" x2="398" y2="60" marker-end="url(#arrow)"/>
  </g>
  <text x="310" y="98" text-anchor="middle" fill="#5c6b76" font-size="12">L→R</text>
  <!-- level 2: right to left, stops before 2 -->
  <line x1="462" y1="150" x2="232" y2="150" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="140" x2="220" y2="160" stroke="#1a2026" stroke-width="2.5"/>
  <text x="315" y="134" text-anchor="middle" fill="#5c6b76" font-size="12">stop before 2 (no right child)</text>
  <text x="350" y="170" text-anchor="middle" fill="#5c6b76" font-size="12">R→L</text>
  <!-- level 3: left to right, stops at 1 -->
  <line x1="58" y1="250" x2="88" y2="250" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="72" y="268" text-anchor="middle" fill="#5c6b76" font-size="12">L→R</text>
  <text x="120" y="286" text-anchor="middle" fill="#5c6b76" font-size="12">stop at 1 (no left child)</text>
  <!-- level sums -->
  <g text-anchor="middle" fill="#5c6b76" font-size="13">
    <text x="575" y="65">ans[0] = <tspan fill="#4169E1" font-size="15" font-weight="600">5</tspan></text>
    <text x="575" y="155">ans[1] = <tspan fill="#4169E1" font-size="15" font-weight="600">8</tspan></text>
    <text x="575" y="255">ans[2] = <tspan fill="#4169E1" font-size="15" font-weight="600">0</tspan></text>
  </g>
  <!-- caption -->
  <text x="330" y="318" text-anchor="middle" fill="#1a2026" font-size="13">Level 2 scans right to left: 8 counts, then it stops before 2 (no right child);</text>
  <text x="330" y="336" text-anchor="middle" fill="#1a2026" font-size="13">level 3 stops at once on 1 (no left child) — the zigzag sums are <tspan fill="#4169E1" font-weight="600">5, 8, 0</tspan>.</text>
</svg>
