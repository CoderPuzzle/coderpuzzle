<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="384" fill="#ffffff"/>
  <!-- Example 1: n=2, road 0-1 cost 1 tax 2, prices [8,3]; empty weight = cost = 1, loaded weight = cost*tax = 2 -->
  <!-- graph -->
  <text x="150" y="32" text-anchor="middle" fill="#1a2026" font-size="12">prices[0] = 8</text>
  <text x="530" y="32" text-anchor="middle" fill="#1a2026" font-size="12">prices[1] = 3</text>
  <path d="M 171 60 Q 340 14 509 60" fill="none" stroke="#42525e" stroke-width="2.2"/>
  <path d="M 171 80 Q 340 126 509 80" fill="none" stroke="#4169E1" stroke-width="2.2"/>
  <text x="340" y="26" text-anchor="middle" fill="#42525e" font-size="12.5">empty trip: weight = cost = 1</text>
  <text x="340" y="126" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">loaded return: weight = cost × tax = 1 × 2 = 2</text>
  <circle cx="150" cy="70" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
  <text x="150" y="76" text-anchor="middle" fill="#1a2026" font-size="16" font-weight="600">0</text>
  <circle cx="530" cy="70" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
  <text x="530" y="76" text-anchor="middle" fill="#1a2026" font-size="16" font-weight="600">1</text>
  <g stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="150" y1="94" x2="150" y2="158"/>
    <line x1="530" y1="94" x2="530" y2="158"/>
  </g>
  <!-- start 0 panel -->
  <rect x="30" y="165" width="300" height="150" rx="8" fill="#ffffff" stroke="#dbe4fb" stroke-width="1.5"/>
  <text x="46" y="188" fill="#1a2026" font-size="13" font-weight="600">start i = 0</text>
  <text x="46" y="212" fill="#5c6b76" font-size="12.5">empty (cost): d = [0, 1]</text>
  <text x="46" y="234" fill="#5c6b76" font-size="12.5">loaded (cost·tax): d = [0, 2]</text>
  <text x="46" y="258" fill="#5c6b76" font-size="12.5">j = 0:  8 + 0 + 0 = 8</text>
  <text x="46" y="280" fill="#1a2026" font-size="12.5">j = 1:  3 + 1 + 2 = <tspan fill="#4169E1" font-weight="600">6</tspan>  ← min</text>
  <text x="46" y="302" fill="#5c6b76" font-size="14">ans[0] = <tspan fill="#4169E1" font-size="16" font-weight="700">6</tspan></text>
  <!-- start 1 panel -->
  <rect x="350" y="165" width="300" height="150" rx="8" fill="#ffffff" stroke="#dbe4fb" stroke-width="1.5"/>
  <text x="366" y="188" fill="#1a2026" font-size="13" font-weight="600">start i = 1</text>
  <text x="366" y="212" fill="#5c6b76" font-size="12.5">empty (cost): d = [1, 0]</text>
  <text x="366" y="234" fill="#5c6b76" font-size="12.5">loaded (cost·tax): d = [2, 0]</text>
  <text x="366" y="258" fill="#5c6b76" font-size="12.5">j = 0:  8 + 1 + 2 = 11</text>
  <text x="366" y="280" fill="#1a2026" font-size="12.5">j = 1:  3 + 0 + 0 = <tspan fill="#4169E1" font-weight="600">3</tspan>  ← min</text>
  <text x="366" y="302" fill="#5c6b76" font-size="14">ans[1] = <tspan fill="#4169E1" font-size="16" font-weight="700">3</tspan></text>
  <!-- caption -->
  <text x="340" y="346" text-anchor="middle" fill="#1a2026" font-size="13">min over j of prices[j] + empty + loaded: start 0 buys at shop 1 (3 + 1 + 2 = 6),</text>
  <text x="340" y="364" text-anchor="middle" fill="#1a2026" font-size="13">start 1 buys locally (3 + 0 + 0 = 3) — ans = <tspan fill="#4169E1" font-weight="600">[6, 3]</tspan>.</text>
</svg>
