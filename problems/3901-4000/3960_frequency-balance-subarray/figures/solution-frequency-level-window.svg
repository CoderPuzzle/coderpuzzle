<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="404" fill="#ffffff"/>
  <!-- nums = [1,2,2,1,2,3,3,3]; cells 64x38 at x = 49 + 74i, y = 48; left = 2 fixed,
       table rows extend the right end r = 2..7; winner row = r 6 (indices 2..6) -->
  <!-- array cells: window 2..6 shaded, 0, 1 and 7 outside -->
  <g stroke="#9aa7b2" stroke-width="1.3" fill="#f0f3f7">
    <rect x="49" y="48" width="64" height="38" rx="5"/>
    <rect x="123" y="48" width="64" height="38" rx="5"/>
    <rect x="567" y="48" width="64" height="38" rx="5"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="197" y="48" width="64" height="38" rx="5"/>
    <rect x="271" y="48" width="64" height="38" rx="5"/>
    <rect x="345" y="48" width="64" height="38" rx="5"/>
    <rect x="419" y="48" width="64" height="38" rx="5"/>
    <rect x="493" y="48" width="64" height="38" rx="5"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="81" y="73" fill="#9aa7b2">1</text>
    <text x="155" y="73" fill="#9aa7b2">2</text>
    <text x="229" y="73" fill="#1a2026">2</text>
    <text x="303" y="73" fill="#1a2026">1</text>
    <text x="377" y="73" fill="#1a2026">2</text>
    <text x="451" y="73" fill="#1a2026">3</text>
    <text x="525" y="73" fill="#1a2026">3</text>
    <text x="599" y="73" fill="#9aa7b2">3</text>
  </g>
  <g text-anchor="middle" font-size="11.5">
    <text x="81" y="104" fill="#9aa7b2">0</text>
    <text x="155" y="104" fill="#9aa7b2">1</text>
    <text x="229" y="104" fill="#4169E1">2</text>
    <text x="303" y="104" fill="#4169E1">3</text>
    <text x="377" y="104" fill="#4169E1">4</text>
    <text x="451" y="104" fill="#4169E1">5</text>
    <text x="525" y="104" fill="#4169E1">6</text>
    <text x="599" y="104" fill="#9aa7b2">7</text>
  </g>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="229" y1="112" x2="229" y2="118"/>
    <line x1="229" y1="116" x2="525" y2="116"/>
    <line x1="525" y1="112" x2="525" y2="118"/>
  </g>
  <text x="377" y="134" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">left = 2 fixed — winning window shaded</text>
  <!-- sweep table, one row per right end -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="45" y="158">r</text>
    <text x="120" y="158">window</text>
    <text x="260" y="158">value:count</text>
    <text x="445" y="158">level:#vals</text>
    <text x="590" y="158">result</text>
  </g>
  <rect x="24" y="296" width="632" height="32" rx="4" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="13">
    <text x="45" y="188" fill="#5c6b76" font-size="12.5">r = 2</text>
    <text x="120" y="188" fill="#1a2026">[2]</text>
    <text x="260" y="188" fill="#5c6b76">2:1</text>
    <text x="445" y="188" fill="#5c6b76">1:1</text>
    <text x="590" y="188" fill="#4169E1" font-weight="600">yes, len 1</text>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="45" y="220" fill="#5c6b76" font-size="12.5">r = 3</text>
    <text x="120" y="220" fill="#1a2026">[2, 1]</text>
    <text x="260" y="220" fill="#5c6b76">1:1 2:1</text>
    <text x="445" y="220" fill="#5c6b76">1:2</text>
    <text x="590" y="220" fill="#9aa7b2">no</text>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="45" y="252" fill="#5c6b76" font-size="12.5">r = 4</text>
    <text x="120" y="252" fill="#1a2026">[2, 1, 2]</text>
    <text x="260" y="252" fill="#5c6b76">1:1 2:2</text>
    <text x="445" y="252" fill="#5c6b76">1:1 2:1</text>
    <text x="590" y="252" fill="#4169E1" font-weight="600">yes, len 3</text>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="45" y="284" fill="#5c6b76" font-size="12.5">r = 5</text>
    <text x="120" y="284" fill="#1a2026">[2, 1, 2, 3]</text>
    <text x="260" y="284" fill="#5c6b76">1:1 2:2 3:1</text>
    <text x="445" y="284" fill="#5c6b76">1:2 2:1</text>
    <text x="590" y="284" fill="#4169E1" font-weight="600">yes, len 4</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="45" y="316" fill="#5c6b76" font-size="12.5">r = 6</text>
    <text x="120" y="316" fill="#1a2026">[2, 1, 2, 3, 3]</text>
    <text x="260" y="316" fill="#1a2026">1:1 2:2 3:2</text>
    <text x="445" y="316" fill="#1a2026">1:1 2:2</text>
    <text x="590" y="316" fill="#4169E1">yes, len 5</text>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="45" y="348" fill="#5c6b76" font-size="12.5">r = 7</text>
    <text x="120" y="348" fill="#1a2026">[2, 1, 2, 3, 3, 3]</text>
    <text x="260" y="348" fill="#5c6b76">1:1 2:2 3:3</text>
    <text x="445" y="348" fill="#5c6b76">1:1 2:1 3:1</text>
    <text x="590" y="348" fill="#9aa7b2">no</text>
  </g>
  <text x="340" y="378" text-anchor="middle" fill="#1a2026" font-size="13">With left = 2 fixed, [2, 1, 2, 3, 3] has exactly two levels, 1 and 2 = f and 2f — balanced.</text>
  <text x="340" y="396" text-anchor="middle" fill="#1a2026" font-size="13">Adding the last 3 opens level 3 and breaks the balance; the longest window is <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
</svg>
