<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums=[9,2,6,1], s=0101; cells 72x56 at (80,110); tokens start on the 1s at indices 1,3 and slide to 0,2; covered = indices 0,2 -->
  <text x="224" y="52" text-anchor="middle" fill="#5c6b76" font-size="12.5">each token slides one step left (at most once)</text>
  <circle cx="188" cy="78" r="6" fill="#4169E1"/>
  <circle cx="332" cy="78" r="6" fill="#4169E1"/>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="181" y1="84" x2="127" y2="103" marker-end="url(#arrow)"/>
    <line x1="325" y1="84" x2="271" y2="103" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="80" y="110" width="72" height="56" fill="#dbe4fb"/>
    <rect x="152" y="110" width="72" height="56" fill="#ffffff"/>
    <rect x="224" y="110" width="72" height="56" fill="#dbe4fb"/>
    <rect x="296" y="110" width="72" height="56" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="18" font-weight="600">
    <text x="116" y="145" fill="#4169E1">9</text>
    <text x="188" y="145" fill="#9aa7b2">2</text>
    <text x="260" y="145" fill="#4169E1">6</text>
    <text x="332" y="145" fill="#9aa7b2">1</text>
  </g>
  <text x="62" y="186" text-anchor="end" fill="#5c6b76" font-size="13">s =</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="13">
    <text x="116" y="186">0</text><text x="188" y="186">1</text><text x="260" y="186">0</text><text x="332" y="186">1</text>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="116" y="206" fill="#4169E1">covered</text>
    <text x="188" y="206" fill="#9aa7b2">not covered</text>
    <text x="260" y="206" fill="#4169E1">covered</text>
    <text x="332" y="206" fill="#9aa7b2">not covered</text>
  </g>
  <text x="402" y="110" fill="#1a2026" font-size="13" font-weight="600">token-block greedy</text>
  <g fill="#1a2026" font-size="12.5">
    <text x="402" y="136">tokens at 1 and 3 make two blocks;</text>
    <text x="402" y="156">each keeps its preceding zero</text>
    <text x="402" y="186">block [0,1]: 9 + 2 − 2 = <tspan fill="#4169E1" font-weight="600">9</tspan></text>
    <text x="402" y="210">block [2,3]: 6 + 1 − 1 = <tspan fill="#4169E1" font-weight="600">6</tspan></text>
    <text x="402" y="240" font-weight="600">total 9 + 6 = <tspan fill="#4169E1">15</tspan></text>
  </g>
  <text x="340" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Tokens land on indices 0 and 2 — covered values 9 + 6 = <tspan fill="#4169E1" font-weight="600">15</tspan>;</text>
  <text x="340" y="292" text-anchor="middle" fill="#1a2026" font-size="13">each block covers all but its minimum (2 and 1).</text>
</svg>
