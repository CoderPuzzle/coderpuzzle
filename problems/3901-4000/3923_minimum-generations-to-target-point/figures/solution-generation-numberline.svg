<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 308" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="308" fill="#ffffff"/>
  <!-- Example 2: points [0,0,0] and [5,5,5] (diagonal, so t = x = y = z), target [1,1,1]; x(t)=70+62t; rows y 78/138/198 -->
  <!-- generation guides -->
  <g stroke="#dbe4fb" stroke-width="1.2">
    <line x1="70" y1="52" x2="70" y2="212"/><line x1="132" y1="52" x2="132" y2="212"/>
    <line x1="194" y1="52" x2="194" y2="212"/><line x1="256" y1="52" x2="256" y2="212"/>
    <line x1="318" y1="52" x2="318" y2="212"/><line x1="380" y1="52" x2="380" y2="212"/>
    <line x1="442" y1="52" x2="442" y2="212"/>
  </g>
  <line x1="58" y1="214" x2="452" y2="214" stroke="#42525e" stroke-width="1.2"/>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="70" y="232">0</text><text x="132" y="232">1</text><text x="194" y="232">2</text>
    <text x="256" y="232">3</text><text x="318" y="232">4</text><text x="380" y="232">5</text>
    <text x="442" y="232">6</text>
  </g>
  <text x="464" y="218" fill="#5c6b76" font-size="11.5">t = x = y = z</text>
  <!-- row labels -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="14" y="82">gen 0</text>
    <text x="14" y="142">gen 1</text>
    <text x="14" y="202">gen 2</text>
  </g>
  <!-- generation 0: initial points -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="70" cy="78" r="11"/><circle cx="380" cy="78" r="11"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="11.5" font-weight="600">
    <text x="70" y="82">0</text><text x="380" y="82">5</text>
  </g>
  <text x="490" y="82" fill="#5c6b76" font-size="12.5">initial points 0 and 5</text>
  <!-- generation 1: mid(0,5) = 2 -->
  <circle cx="194" cy="138" r="11" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="194" y="142" text-anchor="middle" fill="#1a2026" font-size="11.5" font-weight="600">2</text>
  <text x="490" y="142" fill="#5c6b76" font-size="12.5">2 = mid(0, 5)</text>
  <!-- generation 2: mid(0,2) = 1 (target), mid(2,5) = 3 -->
  <circle cx="132" cy="198" r="11" fill="#4169E1"/>
  <text x="132" y="202" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">1</text>
  <text x="152" y="202" fill="#4169E1" font-size="12" font-weight="600">← target</text>
  <circle cx="256" cy="198" r="11" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="256" y="202" text-anchor="middle" fill="#1a2026" font-size="11.5" font-weight="600">3</text>
  <text x="490" y="202" fill="#5c6b76" font-size="12.5">1 = mid(0, 2) · 3 = mid(2, 5)</text>
  <!-- caption -->
  <text x="340" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Generation 1 adds 2 = mid(0, 5); generation 2 adds 1 = mid(0, 2) and 3 = mid(2, 5),</text>
  <text x="340" y="290" text-anchor="middle" fill="#1a2026" font-size="13">so the target 1 first appears at k = <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
