<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 388" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="388" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- occupiedIntervals = [[2,6],[4,8],[10,10],[10,12],[14,16]]; free = [7,11];
       x(v) = 100 + 32v; input bars 20 tall (staggered rows y70/y94), merged y184, result y270 -->
  <g stroke="#dbe4fb" stroke-width="1">
    <line x1="100" y1="52" x2="100" y2="310"/><line x1="164" y1="52" x2="164" y2="310"/>
    <line x1="228" y1="52" x2="228" y2="310"/><line x1="292" y1="52" x2="292" y2="310"/>
    <line x1="356" y1="52" x2="356" y2="310"/><line x1="420" y1="52" x2="420" y2="310"/>
    <line x1="484" y1="52" x2="484" y2="310"/><line x1="548" y1="52" x2="548" y2="310"/>
    <line x1="612" y1="52" x2="612" y2="310"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="100" y="46">0</text><text x="164" y="46">2</text><text x="228" y="46">4</text>
    <text x="292" y="46">6</text><text x="356" y="46">8</text><text x="420" y="46">10</text>
    <text x="484" y="46">12</text><text x="548" y="46">14</text><text x="612" y="46">16</text>
  </g>
  <!-- free window band: x(7)=324 .. x(11)=452 -->
  <rect x="324" y="140" width="128" height="156" fill="#f0f3f7"/>
  <text x="388" y="158" text-anchor="middle" fill="#5c6b76" font-size="12">free [7, 11]</text>
  <text x="88" y="104" text-anchor="end" fill="#5c6b76" font-size="12">input</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="164" y="70" width="128" height="20"/>
    <rect x="228" y="94" width="128" height="20"/>
    <rect x="420" y="70" width="32" height="20"/>
    <rect x="420" y="94" width="64" height="20"/>
    <rect x="548" y="70" width="64" height="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12">
    <text x="228" y="64">[2,6]</text>
    <text x="292" y="128">[4,8]</text>
    <text x="436" y="64">[10,10]</text>
    <text x="452" y="128">[10,12]</text>
    <text x="580" y="64">[14,16]</text>
  </g>
  <text x="88" y="197" text-anchor="end" fill="#5c6b76" font-size="12">merged</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.5">
    <rect x="164" y="184" width="192" height="26"/>
    <rect x="420" y="184" width="64" height="26"/>
    <rect x="548" y="184" width="64" height="26"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">
    <text x="260" y="201">[2, 8]</text>
    <text x="452" y="201">[10,12]</text>
    <text x="580" y="201">[14,16]</text>
  </g>
  <text x="88" y="283" text-anchor="end" fill="#5c6b76" font-size="12">after cut</text>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 228 214 L 228 264" marker-end="url(#arrow)"/>
    <path d="M 452 214 Q 468 242 496 264" marker-end="url(#arrow)"/>
    <path d="M 580 214 L 580 264" marker-end="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="164" y="270" width="128" height="26"/>
    <rect x="484" y="270" width="32" height="26"/>
    <rect x="548" y="270" width="64" height="26"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">
    <text x="228" y="287">[2, 6]</text>
    <text x="500" y="314">[12,12]</text>
    <text x="580" y="287">[14,16]</text>
  </g>
  <text x="340" y="344" text-anchor="middle" fill="#1a2026" font-size="13">Merge touching intervals first: [2,6]+[4,8] → [2,8], [10,10]+[10,12] → [10,12].</text>
  <text x="340" y="362" text-anchor="middle" fill="#1a2026" font-size="13">The free window [7, 11] cuts [2,8] down to [2,6] and trims [10,12] to <tspan fill="#4169E1" font-weight="600">[12,12]</tspan>;</text>
  <text x="340" y="380" text-anchor="middle" fill="#1a2026" font-size="13">the answer is <tspan fill="#4169E1" font-weight="600">[2,6], [12,12], [14,16]</tspan>.</text>
</svg>
