<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="384" fill="#ffffff"/>
  <!-- grid = [[1,2,0,-3],[1,-2,1,0],[-4,2,-1,3],[3,-3,3,-2],[-1,-5,0,1]]; cells 64x44 at (90,80); P1 right/down (0,0)-(1,0)-(2,0)-(2,1)-(2,2)-(2,3)-(3,3)-(4,3); P2 right/up (4,0)-(4,1)-(3,1)-(2,1)-(2,2)-(2,3)-(1,3)-(0,3); shared = (2,1),(2,2),(2,3) -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="122" y="72">0</text><text x="186" y="72">1</text><text x="250" y="72">2</text><text x="314" y="72">3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11">
    <text x="78" y="107">0</text><text x="78" y="151">1</text><text x="78" y="195">2</text><text x="78" y="239">3</text><text x="78" y="283">4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="90" y="80" width="64" height="44" fill="#ffffff"/><rect x="154" y="80" width="64" height="44" fill="#ffffff"/><rect x="218" y="80" width="64" height="44" fill="#ffffff"/><rect x="282" y="80" width="64" height="44" fill="#ffffff"/>
    <rect x="90" y="124" width="64" height="44" fill="#ffffff"/><rect x="154" y="124" width="64" height="44" fill="#ffffff"/><rect x="218" y="124" width="64" height="44" fill="#ffffff"/><rect x="282" y="124" width="64" height="44" fill="#ffffff"/>
    <rect x="90" y="168" width="64" height="44" fill="#ffffff"/><rect x="154" y="168" width="64" height="44" fill="#dbe4fb"/><rect x="218" y="168" width="64" height="44" fill="#dbe4fb"/><rect x="282" y="168" width="64" height="44" fill="#dbe4fb"/>
    <rect x="90" y="212" width="64" height="44" fill="#ffffff"/><rect x="154" y="212" width="64" height="44" fill="#ffffff"/><rect x="218" y="212" width="64" height="44" fill="#ffffff"/><rect x="282" y="212" width="64" height="44" fill="#ffffff"/>
    <rect x="90" y="256" width="64" height="44" fill="#ffffff"/><rect x="154" y="256" width="64" height="44" fill="#ffffff"/><rect x="218" y="256" width="64" height="44" fill="#ffffff"/><rect x="282" y="256" width="64" height="44" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="122" y="107">1</text><text x="186" y="107">2</text><text x="250" y="107">0</text><text x="314" y="107">−3</text>
    <text x="122" y="151">1</text><text x="186" y="151">−2</text><text x="250" y="151">1</text><text x="314" y="151">0</text>
    <text x="122" y="195">−4</text><text x="186" y="195" fill="#4169E1" font-weight="600">2</text><text x="250" y="195" fill="#4169E1" font-weight="600">−1</text><text x="314" y="195" fill="#4169E1" font-weight="600">3</text>
    <text x="122" y="239">3</text><text x="186" y="239">−3</text><text x="250" y="239">3</text><text x="314" y="239">−2</text>
    <text x="122" y="283">−1</text><text x="186" y="283">−5</text><text x="250" y="283">0</text><text x="314" y="283">1</text>
  </g>
  <!-- player 1: right/down, solid accent, lane offset (-14,-12) from cell centers -->
  <polyline points="108,90 108,178 300,178 300,266" fill="none" stroke="#4169E1" stroke-width="3"/>
  <!-- player 2: right/up, dashed gray, lane offset (+14,+12) from cell centers -->
  <polyline points="136,290 200,290 200,202 328,202 328,114" fill="none" stroke="#5c6b76" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="108" cy="90" r="5" fill="#4169E1"/><circle cx="300" cy="266" r="5" fill="#4169E1"/>
  <circle cx="136" cy="290" r="5" fill="#5c6b76"/><circle cx="328" cy="114" r="5" fill="#5c6b76"/>
  <g stroke-width="2">
    <line x1="372" y1="96" x2="404" y2="96" stroke="#4169E1"/>
    <line x1="372" y1="124" x2="404" y2="124" stroke="#5c6b76" stroke-width="2.5" stroke-dasharray="6 4"/>
  </g>
  <rect x="372" y="140" width="32" height="18" fill="#dbe4fb" stroke="#42525e" stroke-width="1.5"/>
  <g fill="#1a2026" font-size="12.5">
    <text x="414" y="100">P1: (0,0) to (4,3), right/down</text>
    <text x="414" y="128">P2: (4,0) to (0,3), right/up</text>
    <text x="414" y="154">shared cells (one row segment)</text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="372" y="192">a shared set is always one</text>
    <text x="372" y="210">contiguous row or column segment</text>
  </g>
  <text x="250" y="322" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">shared: 2 + (−1) + 3 = <tspan fill="#4169E1">4</tspan></text>
  <text x="340" y="352" text-anchor="middle" fill="#1a2026" font-size="13">Every shared set is one contiguous row or column segment;</text>
  <text x="340" y="370" text-anchor="middle" fill="#1a2026" font-size="13">crossing in row 2, cols 1-3 gives 2 + (−1) + 3 = <tspan fill="#4169E1" font-weight="600">4</tspan>, the answer.</text>
</svg>
