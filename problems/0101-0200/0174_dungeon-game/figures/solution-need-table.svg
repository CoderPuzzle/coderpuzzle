<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- need table for dungeon [[-2,-3,3],[-5,-10,1],[10,30,-5]]: room value on top, need on entry below -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <rect x="70" y="44" width="96" height="60" rx="4" stroke="#4169E1" stroke-width="2"/>
    <rect x="174" y="44" width="96" height="60" rx="4"/>
    <rect x="278" y="44" width="96" height="60" rx="4"/>
    <rect x="70" y="112" width="96" height="60" rx="4"/>
    <rect x="174" y="112" width="96" height="60" rx="4"/>
    <rect x="278" y="112" width="96" height="60" rx="4"/>
    <rect x="70" y="180" width="96" height="60" rx="4"/>
    <rect x="174" y="180" width="96" height="60" rx="4"/>
    <rect x="278" y="180" width="96" height="60" rx="4"/>
  </g>
  <g text-anchor="middle">
    <!-- row 0 -->
    <text x="118" y="68" fill="#1a2026" font-weight="600">-2</text>
    <text x="118" y="94" fill="#4169E1" font-weight="700" font-size="16">7</text>
    <text x="222" y="68" fill="#1a2026" font-weight="600">-3</text>
    <text x="222" y="94" fill="#4169E1" font-weight="700" font-size="16">5</text>
    <text x="326" y="68" fill="#1a2026" font-weight="600">3</text>
    <text x="326" y="94" fill="#4169E1" font-weight="700" font-size="16">2</text>
    <!-- row 1 -->
    <text x="118" y="136" fill="#1a2026" font-weight="600">-5</text>
    <text x="118" y="162" fill="#4169E1" font-weight="700" font-size="16">6</text>
    <text x="222" y="136" fill="#1a2026" font-weight="600">-10</text>
    <text x="222" y="162" fill="#4169E1" font-weight="700" font-size="16">11</text>
    <text x="326" y="136" fill="#1a2026" font-weight="600">1</text>
    <text x="326" y="162" fill="#4169E1" font-weight="700" font-size="16">5</text>
    <!-- row 2 -->
    <text x="118" y="204" fill="#1a2026" font-weight="600">10</text>
    <text x="118" y="230" fill="#4169E1" font-weight="700" font-size="16">1</text>
    <text x="222" y="204" fill="#1a2026" font-weight="600">30</text>
    <text x="222" y="230" fill="#4169E1" font-weight="700" font-size="16">1</text>
    <text x="326" y="204" fill="#1a2026" font-weight="600">-5</text>
    <text x="326" y="230" fill="#4169E1" font-weight="700" font-size="16">6</text>
  </g>
  <!-- fill-order arrow: bottom-right seed toward the top-left answer -->
  <line x1="316" y1="200" x2="140" y="122" stroke="#42525e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="250" y="176" fill="#5c6b76" font-size="12">fill bottom-up, right-to-left</text>
  <!-- side notes -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="406" y="60">room value (black) / need on entry (blue)</text>
    <text x="406" y="82">need = max(1, min(down, right) - room)</text>
    <text x="406" y="120">bottom-right seeds at need 1:</text>
    <text x="406" y="138">leaving the princess alive costs 1</text>
  </g>
  <g fill="#4169E1" font-size="13" font-weight="600">
    <text x="406" y="196">answer = need[0][0] = 7</text>
  </g>
  <text x="406" y="216" fill="#5c6b76" font-size="12.5">path RIGHT RIGHT DOWN DOWN</text>
</svg>
