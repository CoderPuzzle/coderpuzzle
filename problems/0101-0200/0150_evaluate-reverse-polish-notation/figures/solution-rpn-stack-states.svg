<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="302" fill="#ffffff"/>
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- tokens ["2","1","+","3","*"]; one stack snapshot per token, drawn bottom-up;
       cells 64x28 at column centers 118+120i, bottom row y=182 -->
  <text x="30" y="76" fill="#5c6b76" font-size="12">tokens</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="90" y="58" width="56" height="28"/><rect x="210" y="58" width="56" height="28"/>
    <rect x="450" y="58" width="56" height="28"/>
  </g>
  <rect x="330" y="58" width="56" height="28" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="570" y="58" width="56" height="28" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="118" y="77" fill="#1a2026">2</text>
    <text x="238" y="77" fill="#1a2026">1</text>
    <text x="358" y="77" fill="#4169E1">+</text>
    <text x="478" y="77" fill="#1a2026">3</text>
    <text x="598" y="77" fill="#4169E1">*</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.4" fill="none">
    <path d="M 118 90 V 126" marker-end="url(#arrowM)"/>
    <path d="M 238 90 V 126" marker-end="url(#arrowM)"/>
    <path d="M 358 90 V 126" marker-end="url(#arrowM)"/>
    <path d="M 478 90 V 126" marker-end="url(#arrowM)"/>
    <path d="M 598 90 V 126" marker-end="url(#arrowM)"/>
  </g>
  <!-- stack cells -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="86" y="182" width="64" height="28"/>
    <rect x="206" y="182" width="64" height="28"/><rect x="206" y="154" width="64" height="28"/>
    <rect x="326" y="182" width="64" height="28"/>
    <rect x="446" y="182" width="64" height="28"/><rect x="446" y="154" width="64" height="28"/>
  </g>
  <rect x="566" y="182" width="64" height="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="118" y="200">2</text>
    <text x="238" y="200">2</text><text x="238" y="172">1</text>
    <text x="358" y="200">3</text>
    <text x="478" y="200">3</text><text x="478" y="172">3</text>
  </g>
  <text x="598" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#4169E1">9</text>
  <text x="198" y="172" text-anchor="end" fill="#9aa7b2" font-size="10">top</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="118" y="234">push 2</text>
    <text x="238" y="234">push 1</text>
    <text x="358" y="234">pop 1, 2 → 2 + 1 = 3</text>
    <text x="478" y="234">push 3</text>
    <text x="598" y="234">pop 3, 3 → 3 × 3 = 9</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="340" y="266">On an operator the stack pops its top two values — the second pop is the left</text>
    <text x="340" y="286">operand — and pushes the result: 2 + 1 = 3, then 3 × 3 = <tspan fill="#4169E1" font-weight="600">9</tspan>, the only value left.</text>
  </g>
</svg>
