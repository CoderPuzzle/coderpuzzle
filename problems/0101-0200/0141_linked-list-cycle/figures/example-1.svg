<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 152" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- list 3 -> 2 -> 0 -> -4, tail connects back to node 2 (pos = 1) -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="60" cy="40" r="17"/>
    <circle cx="150" cy="40" r="17"/>
    <circle cx="240" cy="40" r="17"/>
    <circle cx="330" cy="40" r="17"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="81" y1="40" x2="129" y2="40" marker-end="url(#arrow)"/>
    <line x1="171" y1="40" x2="219" y2="40" marker-end="url(#arrow)"/>
    <line x1="261" y1="40" x2="309" y2="40" marker-end="url(#arrow)"/>
  </g>
  <path d="M 330 57 C 330 110, 150 110, 150 57" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowA)"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="60" y="45">3</text>
    <text x="150" y="45">2</text>
    <text x="240" y="45">0</text>
    <text x="330" y="45">-4</text>
  </g>
  <text x="240" y="136" text-anchor="middle" fill="#5c6b76" font-size="12.5">cycle: the tail connects back to the node at pos = 1</text>
</svg>
