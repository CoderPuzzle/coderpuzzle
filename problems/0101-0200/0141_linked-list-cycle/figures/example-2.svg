<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 152" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- list 1 -> 2, tail connects back to node 1 (pos = 0) -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="110" cy="40" r="17"/>
    <circle cx="230" cy="40" r="17"/>
  </g>
  <line x1="131" y1="40" x2="209" y2="40" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 230 57 C 230 115, 110 115, 110 57" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowA)"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="110" y="45">1</text>
    <text x="230" y="45">2</text>
  </g>
  <text x="170" y="140" text-anchor="middle" fill="#5c6b76" font-size="12.5">cycle: the tail connects back to the node at pos = 0</text>
</svg>
