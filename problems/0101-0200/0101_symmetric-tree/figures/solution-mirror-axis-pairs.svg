<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- tree [1,2,2,3,4,4,3]; circles r=20 at rows y=70/150/230; mirror axis x=330; gray arc pairs the 2s, accent arcs pair outer (3,3) and inner (4,4) leaves -->
  <line x1="330" y1="30" x2="330" y2="246" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="330" y1="70" x2="250" y2="150"/>
    <line x1="330" y1="70" x2="410" y2="150"/>
    <line x1="250" y1="150" x2="210" y2="230"/>
    <line x1="250" y1="150" x2="290" y2="230"/>
    <line x1="410" y1="150" x2="370" y2="230"/>
    <line x1="410" y1="150" x2="450" y2="230"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="330" cy="70" r="20"/>
    <circle cx="250" cy="150" r="20"/><circle cx="410" cy="150" r="20"/>
    <circle cx="210" cy="230" r="20"/><circle cx="290" cy="230" r="20"/>
    <circle cx="370" cy="230" r="20"/><circle cx="450" cy="230" r="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">
    <text x="330" y="75">1</text>
    <text x="250" y="155">2</text><text x="410" y="155">2</text>
    <text x="210" y="235">3</text><text x="290" y="235">4</text>
    <text x="370" y="235">4</text><text x="450" y="235">3</text>
  </g>
  <!-- top mirror call: children 2 = 2 -->
  <path d="M 268 160 Q 330 116 392 160" fill="none" stroke="#9aa7b2" stroke-width="1.8" marker-start="url(#arrowgray)" marker-end="url(#arrowgray)"/>
  <text x="230" y="120" text-anchor="middle" fill="#5c6b76" font-size="11.5">2 = 2</text>
  <!-- crossing comparison arcs: inner (4,4) and outer (3,3) -->
  <path d="M 306 246 Q 330 276 354 246" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 222 246 Q 330 356 438 246" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="330" y="284" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">4 = 4 · inner</text>
  <text x="330" y="330" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">3 = 3 · outer</text>
  <text x="330" y="364" text-anchor="middle" fill="#1a2026" font-size="13">mirror(2, 2) checks the children's values, then crosses the axis: outer 3 = 3 and</text>
  <text x="330" y="382" text-anchor="middle" fill="#1a2026" font-size="13">inner 4 = 4 both hold, so [1, 2, 2, 3, 4, 4, 3] is symmetric — <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
