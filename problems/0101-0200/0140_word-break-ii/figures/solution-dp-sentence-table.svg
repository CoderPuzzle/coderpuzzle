<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "catsanddog", wordDict = [cat,cats,and,sand,dog]; strip cells 44x30 at (60,46); dp rows baseline y = 120 + 28i -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4">
    <rect x="60" y="46" width="44" height="30"/>
    <rect x="192" y="46" width="44" height="30"/>
    <rect x="236" y="46" width="44" height="30"/>
    <rect x="368" y="46" width="44" height="30"/>
    <rect x="500" y="46" width="44" height="30"/>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1">
    <rect x="104" y="46" width="44" height="30"/><rect x="148" y="46" width="44" height="30"/>
    <rect x="280" y="46" width="44" height="30"/><rect x="324" y="46" width="44" height="30"/>
    <rect x="412" y="46" width="44" height="30"/><rect x="456" y="46" width="44" height="30"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="82" y="65" fill="#4169E1">0</text>
    <text x="126" y="65" fill="#9aa7b2">1</text>
    <text x="170" y="65" fill="#9aa7b2">2</text>
    <text x="214" y="65" fill="#4169E1">3</text>
    <text x="258" y="65" fill="#4169E1">4</text>
    <text x="302" y="65" fill="#9aa7b2">5</text>
    <text x="346" y="65" fill="#9aa7b2">6</text>
    <text x="390" y="65" fill="#4169E1">7</text>
    <text x="434" y="65" fill="#9aa7b2">8</text>
    <text x="478" y="65" fill="#9aa7b2">9</text>
    <text x="522" y="65" fill="#4169E1">10</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="104" y="92">c</text><text x="148" y="92">a</text><text x="192" y="92">t</text><text x="236" y="92">s</text><text x="280" y="92">a</text><text x="324" y="92">n</text><text x="368" y="92">d</text><text x="412" y="92">d</text><text x="456" y="92">o</text><text x="500" y="92">g</text>
  </g>
  <g font-size="12.5" font-weight="600" fill="#5c6b76">
    <text x="60" y="120">dp[0]</text>
    <text x="60" y="148">dp[3]</text>
    <text x="60" y="176">dp[4]</text>
    <text x="60" y="204">dp[7]</text>
    <text x="60" y="262">dp[10]</text>
  </g>
  <g font-size="13.5" fill="#1a2026">
    <text x="116" y="120" fill="#9aa7b2" font-weight="400" font-size="12.5">(empty sentence)</text>
    <text x="116" y="148">cat</text>
    <text x="116" y="176">cats</text>
    <text x="116" y="204">cats <tspan fill="#4169E1" font-weight="600">and</tspan></text>
    <text x="116" y="232">cat <tspan fill="#4169E1" font-weight="600">sand</tspan></text>
    <text x="116" y="262">cats and <tspan fill="#4169E1" font-weight="600">dog</tspan></text>
    <text x="116" y="280">cat sand <tspan fill="#4169E1" font-weight="600">dog</tspan></text>
  </g>
  <!-- extensions: one last word per arrow, j walking downward -->
  <g stroke="#4169E1" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <polyline points="160,176 460,176 460,204 185,204" marker-end="url(#arrowB)"/>
    <polyline points="154,148 490,148 490,232 188,232" marker-end="url(#arrowB)"/>
    <polyline points="170,240 530,240 530,268 215,268" marker-end="url(#arrowB)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="320" y="194">+ and</text>
    <text x="320" y="142">+ sand</text>
    <text x="330" y="258">+ dog</text>
  </g>
  <text x="320" y="314" text-anchor="middle" fill="#1a2026" font-size="13">The split j walks downward, so dp[7] lists 'cats and' before 'cat sand' &#8212;</text>
  <text x="320" y="332" text-anchor="middle" fill="#1a2026" font-size="13">both then take 'dog': dp[10] = [<tspan fill="#4169E1" font-weight="600">cats and dog</tspan>, <tspan fill="#4169E1" font-weight="600">cat sand dog</tspan>] &#8212; the pinned order.</text>
</svg>
