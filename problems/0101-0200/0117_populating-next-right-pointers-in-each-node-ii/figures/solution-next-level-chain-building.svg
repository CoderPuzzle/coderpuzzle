<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="472" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree [1,2,3,4,5,null,7]; circles r=22; the 2-3 chain was built by pass 1,
       pass 2 walks it and appends 4, 5, 7 into the head/tail chain below -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 320 70 L 170 170"/>
    <path d="M 320 70 L 470 170"/>
    <path d="M 170 170 L 95 270"/>
    <path d="M 170 170 L 245 270"/>
    <path d="M 470 170 L 545 270"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <circle cx="320" cy="70" r="22"/>
    <circle cx="170" cy="170" r="22"/>
    <circle cx="470" cy="170" r="22"/>
    <circle cx="95" cy="270" r="22"/>
    <circle cx="245" cy="270" r="22"/>
    <circle cx="545" cy="270" r="22"/>
  </g>
  <circle cx="395" cy="270" r="22" fill="none" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 4"/>
  <g text-anchor="middle" fill="#1a2026">
    <text x="320" y="75">1</text>
    <text x="170" y="175">2</text>
    <text x="470" y="175">3</text>
    <text x="95" y="275">4</text>
    <text x="245" y="275">5</text>
    <text x="545" y="275">7</text>
  </g>
  <text x="395" y="275" text-anchor="middle" fill="#9aa7b2">&#8709;</text>
  <text x="395" y="312" text-anchor="middle" fill="#9aa7b2" font-size="11">3.left = &#8709;</text>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 196 170 H 442" marker-end="url(#arrowB)"/>
    <path d="M 222 370 H 292" marker-end="url(#arrowB)"/>
    <path d="M 342 370 H 412" marker-end="url(#arrowB)"/>
  </g>
  <text x="320" y="196" text-anchor="middle" fill="#5c6b76" font-size="11.5">pass 2 walks this chain</text>
  <g fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4">
    <path d="M 95 296 C 95 344, 140 370, 172 370" marker-end="url(#arrowB)"/>
    <path d="M 245 296 C 245 342, 268 360, 288 366" marker-end="url(#arrowB)"/>
    <path d="M 545 296 C 545 344, 500 370, 468 370" marker-end="url(#arrowB)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="200" y="338">head</text>
    <text x="440" y="338">tail</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <circle cx="200" cy="370" r="22"/>
    <circle cx="320" cy="370" r="22"/>
    <circle cx="440" cy="370" r="22"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="200" y="375">4</text>
    <text x="320" y="375">5</text>
    <text x="440" y="375">7</text>
  </g>
  <text x="320" y="428" text-anchor="middle" fill="#1a2026" font-size="13">Pass 2 appends every child the walk meets, left to right: 4, then 5, then 7.</text>
  <text x="320" y="450" text-anchor="middle" fill="#1a2026" font-size="13">The missing child is never appended, so gaps close alone: <tspan fill="#4169E1" font-weight="600">4 &#8594; 5 &#8594; 7</tspan>, head to tail.</text>
</svg>
