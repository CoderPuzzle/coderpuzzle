<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="288" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- s = "A man, a plan, a canal: Panama" (30 chars); cells 19x34 from x=55 at y=100; pairs drawn (9,24) and (12,19); pointers meet at index 17 -->
  <g text-anchor="middle" font-size="10" fill="#9aa7b2">
    <text x="64.5" y="94">0</text><text x="235.5" y="94">9</text>
    <text x="387.5" y="94">17</text><text x="615.5" y="94">29</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="169" y="50">skip</text><text x="492" y="50">skip</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 140.5 94 Q 169 56 197.5 94" marker-end="url(#arrowG)"/>
    <path d="M 520.5 94 Q 492 56 463.5 94" marker-end="url(#arrowG)"/>
  </g>
  <g stroke="#42525e" stroke-width="1" fill="#ffffff">
    <rect x="55" y="100" width="19" height="34"/><rect x="74" y="100" width="19" height="34"/>
    <rect x="93" y="100" width="19" height="34"/><rect x="112" y="100" width="19" height="34"/>
    <rect x="131" y="100" width="19" height="34"/><rect x="150" y="100" width="19" height="34"/>
    <rect x="169" y="100" width="19" height="34"/><rect x="188" y="100" width="19" height="34"/>
    <rect x="207" y="100" width="19" height="34"/><rect x="226" y="100" width="19" height="34"/>
    <rect x="245" y="100" width="19" height="34"/><rect x="264" y="100" width="19" height="34"/>
    <rect x="283" y="100" width="19" height="34"/><rect x="302" y="100" width="19" height="34"/>
    <rect x="321" y="100" width="19" height="34"/><rect x="340" y="100" width="19" height="34"/>
    <rect x="359" y="100" width="19" height="34"/><rect x="378" y="100" width="19" height="34"/>
    <rect x="397" y="100" width="19" height="34"/><rect x="416" y="100" width="19" height="34"/>
    <rect x="435" y="100" width="19" height="34"/><rect x="454" y="100" width="19" height="34"/>
    <rect x="473" y="100" width="19" height="34"/><rect x="492" y="100" width="19" height="34"/>
    <rect x="511" y="100" width="19" height="34"/><rect x="530" y="100" width="19" height="34"/>
    <rect x="549" y="100" width="19" height="34"/><rect x="568" y="100" width="19" height="34"/>
    <rect x="587" y="100" width="19" height="34"/><rect x="606" y="100" width="19" height="34"/>
  </g>
  <!-- spaces, commas and the colon sit on the inactive fill; index 17 is where the pointers meet -->
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1">
    <rect x="74" y="100" width="19" height="34"/><rect x="150" y="100" width="19" height="34"/>
    <rect x="169" y="100" width="19" height="34"/><rect x="207" y="100" width="19" height="34"/>
    <rect x="302" y="100" width="19" height="34"/><rect x="321" y="100" width="19" height="34"/>
    <rect x="359" y="100" width="19" height="34"/><rect x="473" y="100" width="19" height="34"/>
    <rect x="492" y="100" width="19" height="34"/>
  </g>
  <rect x="378" y="100" width="19" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="64.5" y="121" fill="#1a2026">A</text><text x="83.5" y="121" fill="#9aa7b2"> </text>
    <text x="102.5" y="121" fill="#1a2026">m</text><text x="121.5" y="121" fill="#1a2026">a</text>
    <text x="140.5" y="121" fill="#1a2026">n</text><text x="159.5" y="121" fill="#9aa7b2">,</text>
    <text x="178.5" y="121" fill="#9aa7b2"> </text><text x="197.5" y="121" fill="#1a2026">a</text>
    <text x="216.5" y="121" fill="#9aa7b2"> </text><text x="235.5" y="121" fill="#1a2026">p</text>
    <text x="254.5" y="121" fill="#1a2026">l</text><text x="273.5" y="121" fill="#1a2026">a</text>
    <text x="292.5" y="121" fill="#1a2026">n</text><text x="311.5" y="121" fill="#9aa7b2">,</text>
    <text x="330.5" y="121" fill="#9aa7b2"> </text><text x="349.5" y="121" fill="#1a2026">a</text>
    <text x="368.5" y="121" fill="#9aa7b2"> </text><text x="387.5" y="121" fill="#4169E1">c</text>
    <text x="406.5" y="121" fill="#1a2026">a</text><text x="425.5" y="121" fill="#1a2026">n</text>
    <text x="444.5" y="121" fill="#1a2026">a</text><text x="463.5" y="121" fill="#1a2026">l</text>
    <text x="482.5" y="121" fill="#9aa7b2">:</text><text x="501.5" y="121" fill="#9aa7b2"> </text>
    <text x="520.5" y="121" fill="#1a2026">P</text><text x="539.5" y="121" fill="#1a2026">a</text>
    <text x="558.5" y="121" fill="#1a2026">n</text><text x="577.5" y="121" fill="#1a2026">a</text>
    <text x="596.5" y="121" fill="#1a2026">m</text><text x="615.5" y="121" fill="#1a2026">a</text>
  </g>
  <!-- mirrored pairs agree: (9,24) p = P after lowercasing, (12,19) n = n -->
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 235.5 140 Q 378 218 520.5 140"/>
    <path d="M 292.5 140 Q 359 196 425.5 140"/>
  </g>
  <g fill="#4169E1">
    <circle cx="235.5" cy="140" r="3"/><circle cx="520.5" cy="140" r="3"/>
    <circle cx="292.5" cy="140" r="3"/><circle cx="425.5" cy="140" r="3"/>
  </g>
  <g font-size="11.5" fill="#4169E1" font-weight="600">
    <text x="431" y="157">n = n</text><text x="526" y="152">p = P</text>
  </g>
  <!-- i and j converge on index 17 -->
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 381 158 L 381 140" marker-end="url(#arrow)"/>
    <path d="M 394 158 L 394 140" marker-end="url(#arrow)"/>
  </g>
  <text x="340" y="246" text-anchor="middle" fill="#1a2026" font-size="13">Skips eat punctuation in place — no filtered copy is made — and every mirrored</text>
  <text x="340" y="264" text-anchor="middle" fill="#1a2026" font-size="13">pair matches once lowercased; i and j meet on <tspan fill="#4169E1" font-weight="600">c</tspan>, so the phrase is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
