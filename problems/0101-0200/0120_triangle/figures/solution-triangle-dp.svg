<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
  </defs>
  <text x="20" y="24" fill="#1a2026" font-weight="600">triangle = [[2],[3,4],[6,5,7],[4,1,8,3]] - dp[i] = best sum from that cell down; filled bottom-up</text>
  <!-- input triangle -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="92" y="48" width="44" height="34"/>
    <rect x="70" y="106" width="44" height="34"/><rect x="114" y="106" width="44" height="34"/>
    <rect x="48" y="164" width="44" height="34"/><rect x="92" y="164" width="44" height="34" fill="#e9eefb"/><rect x="136" y="164" width="44" height="34"/>
    <rect x="26" y="222" width="44" height="34"/><rect x="70" y="222" width="44" height="34" fill="#e9eefb"/><rect x="114" y="222" width="44" height="34"/><rect x="158" y="222" width="44" height="34"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="114" y="70">2</text>
    <text x="92" y="128">3</text><text x="136" y="128">4</text>
    <text x="70" y="186">6</text><text x="114" y="186">5</text><text x="158" y="186">7</text>
    <text x="48" y="244">4</text><text x="92" y="244">1</text><text x="136" y="244">8</text><text x="180" y="244">3</text>
  </g>
  <text x="20" y="60" fill="#5b6470" font-size="11.5">input</text>
  <path d="M 240 90 C 210 120, 210 160, 235 190" fill="none" stroke="#8a94a0" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="248" y="150" fill="#5b6470" font-size="11.5">each cell picks the</text>
  <text x="248" y="166" fill="#5b6470" font-size="11.5">cheaper of the two</text>
  <text x="248" y="182" fill="#5b6470" font-size="11.5">cells beneath it</text>
  <!-- dp triangle -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#e9eefb">
    <rect x="392" y="222" width="44" height="34"/><rect x="436" y="222" width="44" height="34"/><rect x="480" y="222" width="44" height="34"/><rect x="524" y="222" width="44" height="34"/>
    <rect x="414" y="164" width="44" height="34"/><rect x="458" y="164" width="44" height="34"/><rect x="502" y="164" width="44" height="34"/>
    <rect x="436" y="106" width="44" height="34"/><rect x="480" y="106" width="44" height="34"/>
    <rect x="458" y="48" width="44" height="34" fill="#4169E1" fill-opacity="0.85"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="436" y="186">7</text><text x="480" y="186">6</text><text x="524" y="186">10</text>
    <text x="458" y="128">9</text><text x="502" y="128">10</text>
    <text x="480" y="70" fill="#ffffff">11</text>
    <text x="414" y="244">4</text><text x="458" y="244">1</text><text x="502" y="244">8</text><text x="546" y="244">3</text>
  </g>
  <text x="370" y="60" fill="#5b6470" font-size="11.5">dp, written bottom-up</text>
  <text x="370" y="286" fill="#5b6470" font-size="11">row 3 seeds dp; row 2 becomes 6+1, 5+1, 7+3;</text>
  <text x="370" y="302" fill="#5b6470" font-size="11">row 1 becomes 3+6, 4+6; apex = 2 + 9 = 11</text>
  <!-- path highlight input: cells (0,0)(1,0)(2,1)(3,1) -->
  <rect x="92" y="48" width="44" height="34" fill="none" stroke="#4169E1" stroke-width="2.4"/>
  <rect x="70" y="106" width="44" height="34" fill="none" stroke="#4169E1" stroke-width="2.4"/>
  <rect x="92" y="164" width="44" height="34" fill="none" stroke="#4169E1" stroke-width="2.4"/>
  <rect x="70" y="222" width="44" height="34" fill="none" stroke="#4169E1" stroke-width="2.4"/>
  <text x="20" y="286" fill="#4169E1" font-size="11.5" font-weight="600">cheapest path 2 + 3 + 5 + 1 = 11</text>
</svg>
