<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 192" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- before: -1 -> 5 -> 3 -> 4 -> 0 -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="50" cy="36" r="17"/>
    <circle cx="130" cy="36" r="17"/>
    <circle cx="210" cy="36" r="17"/>
    <circle cx="290" cy="36" r="17"/>
    <circle cx="370" cy="36" r="17"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="71" y1="36" x2="109" y2="36" marker-end="url(#arrow)"/>
    <line x1="151" y1="36" x2="189" y2="36" marker-end="url(#arrow)"/>
    <line x1="231" y1="36" x2="269" y2="36" marker-end="url(#arrow)"/>
    <line x1="311" y1="36" x2="349" y2="36" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="50" y="41">-1</text><text x="130" y="41">5</text><text x="210" y="41">3</text><text x="290" y="41">4</text><text x="370" y="41">0</text>
  </g>
  <line x1="210" y1="60" x2="210" y2="124" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrowA)"/>
  <!-- after: -1 -> 0 -> 3 -> 4 -> 5 -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="50" cy="150" r="17"/>
    <circle cx="130" cy="150" r="17"/>
    <circle cx="210" cy="150" r="17"/>
    <circle cx="290" cy="150" r="17"/>
    <circle cx="370" cy="150" r="17"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="71" y1="150" x2="109" y2="150" marker-end="url(#arrow)"/>
    <line x1="151" y1="150" x2="189" y2="150" marker-end="url(#arrow)"/>
    <line x1="231" y1="150" x2="269" y2="150" marker-end="url(#arrow)"/>
    <line x1="311" y1="150" x2="349" y2="150" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="50" y="155">-1</text><text x="130" y="155">0</text><text x="210" y="155">3</text><text x="290" y="155">4</text><text x="370" y="155">5</text>
