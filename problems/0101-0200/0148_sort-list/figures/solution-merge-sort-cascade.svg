<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="640" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
  </defs>
  <text x="20" y="24" fill="#1a2026" font-weight="600">head = [4,2,1,3] - slow/fast halving, then dummy-head merging; every step relinks nodes in place</text>
  <!-- stage labels -->
  <text x="20" y="66" fill="#5b6470" font-size="11.5">split</text>
  <text x="20" y="126" fill="#5b6470" font-size="11.5">split</text>
  <text x="20" y="246" fill="#5b6470" font-size="11.5">merge</text>
  <text x="20" y="326" fill="#5b6470" font-size="11.5">merge</text>
  <!-- row 0: 4 2 1 3 -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="180" y="46" width="44" height="30"/><rect x="224" y="46" width="44" height="30"/><rect x="268" y="46" width="44" height="30"/><rect x="312" y="46" width="44" height="30"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="202" y="66">4</text><text x="246" y="66">2</text><text x="290" y="66">1</text><text x="334" y="66">3</text>
  </g>
  <!-- split arrows -->
  <path d="M 224 84 C 180 100, 170 100, 158 110" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 312 84 C 356 100, 366 100, 378 110" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- row 1: [4,2] [1,3] -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="70" y="116" width="44" height="30"/><rect x="114" y="116" width="44" height="30"/>
    <rect x="410" y="116" width="44" height="30"/><rect x="454" y="116" width="44" height="30"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="92" y="136">4</text><text x="136" y="136">2</text>
    <text x="432" y="136">1</text><text x="476" y="136">3</text>
  </g>
  <path d="M 114 154 C 90 170, 78 170, 66 180" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 114 154 C 138 170, 150 170, 162 180" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 454 154 C 430 170, 418 170, 406 180" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 454 154 C 478 170, 490 170, 502 180" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- row 2: singles -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="40" y="186" width="44" height="30"/><rect x="150" y="186" width="44" height="30"/><rect x="380" y="186" width="44" height="30"/><rect x="490" y="186" width="44" height="30"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="62" y="206">4</text><text x="172" y="206">2</text><text x="402" y="206">1</text><text x="512" y="206">3</text>
  </g>
  <!-- merge arrows -->
  <path d="M 62 224 C 62 240, 100 240, 112 250" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 172 224 C 172 240, 134 240, 152 250" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 402 224 C 402 240, 440 240, 452 250" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 512 224 C 512 240, 474 240, 492 250" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- row 3: [2,4] [1,3] -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="100" y="258" width="44" height="30"/><rect x="144" y="258" width="44" height="30"/>
    <rect x="440" y="258" width="44" height="30"/><rect x="484" y="258" width="44" height="30"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="122" y="278">2</text><text x="166" y="278">4</text>
    <text x="462" y="278">1</text><text x="506" y="278">3</text>
  </g>
  <!-- merge arrows to final -->
  <path d="M 122 296 C 122 320, 240 330, 288 338" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 462 296 C 462 320, 344 330, 316 338" fill="none" stroke="#8a94a0" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- row 4: final -->
  <g stroke="#4169E1" stroke-width="1.8" fill="#e9eefb">
    <rect x="180" y="346" width="44" height="30"/><rect x="224" y="346" width="44" height="30"/><rect x="268" y="346" width="44" height="30"/><rect x="312" y="346" width="44" height="30"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="202" y="366">1</text><text x="246" y="366">2</text><text x="290" y="366">3</text><text x="334" y="366">4</text>
  </g>
  <text x="20" y="404" fill="#5b6470" font-size="11.5">fast starts one node ahead, so a two-node list splits into two singletons and the recursion always terminates.</text>
</svg>
