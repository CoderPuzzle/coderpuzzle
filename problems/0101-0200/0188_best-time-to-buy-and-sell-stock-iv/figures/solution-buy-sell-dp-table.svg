<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="312" fill="#ffffff"/>
  <!-- k = 2, prices = [3,2,6,5,0,3]; columns 68 wide pitch 76 from x=96 (start, then one per price); rows buy[1], sell[1], buy[2], sell[2] -->
  <g stroke-width="1.4">
    <rect x="96" y="48" width="68" height="26" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="172" y="48" width="68" height="26" fill="#ffffff" stroke="#1a2026"/><rect x="248" y="48" width="68" height="26" fill="#ffffff" stroke="#1a2026"/><rect x="324" y="48" width="68" height="26" fill="#ffffff" stroke="#1a2026"/><rect x="400" y="48" width="68" height="26" fill="#ffffff" stroke="#1a2026"/><rect x="476" y="48" width="68" height="26" fill="#ffffff" stroke="#1a2026"/><rect x="552" y="48" width="68" height="26" fill="#ffffff" stroke="#1a2026"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="130" y="65" fill="#9aa7b2" font-weight="400" font-size="11.5">start</text>
    <text x="206" y="65">p = 3</text><text x="282" y="65">p = 2</text><text x="358" y="65">p = 6</text>
    <text x="434" y="65">p = 5</text><text x="510" y="65">p = 0</text><text x="586" y="65">p = 3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="88" y="101">buy[1]</text><text x="88" y="135">sell[1]</text><text x="88" y="169">buy[2]</text><text x="88" y="203">sell[2]</text>
  </g>
  <!-- state after each day; accented cells are the winning chain: buy 2, sell 6, rebuy 0, sell 3 -->
  <g stroke-width="1.4">
    <rect x="96" y="82" width="68" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="172" y="82" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="248" y="82" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="324" y="82" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="400" y="82" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="476" y="82" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="552" y="82" width="68" height="30" fill="#ffffff" stroke="#1a2026"/>
    <rect x="96" y="116" width="68" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="172" y="116" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="248" y="116" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="324" y="116" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="400" y="116" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="476" y="116" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="552" y="116" width="68" height="30" fill="#ffffff" stroke="#1a2026"/>
    <rect x="96" y="150" width="68" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="172" y="150" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="248" y="150" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="324" y="150" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="400" y="150" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="476" y="150" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="552" y="150" width="68" height="30" fill="#ffffff" stroke="#1a2026"/>
    <rect x="96" y="184" width="68" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="172" y="184" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="248" y="184" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="324" y="184" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="400" y="184" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="476" y="184" width="68" height="30" fill="#ffffff" stroke="#1a2026"/><rect x="552" y="184" width="68" height="30" fill="#ffffff" stroke="#1a2026"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="248" y="82" width="68" height="30"/>
    <rect x="324" y="116" width="68" height="30"/>
    <rect x="476" y="150" width="68" height="30"/>
    <rect x="552" y="184" width="68" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="130" y="103" fill="#9aa7b2">-&#8734;</text>
    <text x="206" y="103">-3</text><text x="282" y="103" fill="#4169E1">-2</text><text x="358" y="103">-2</text><text x="434" y="103">-2</text><text x="510" y="103">0</text><text x="586" y="103">0</text>
    <text x="130" y="137" fill="#9aa7b2">0</text>
    <text x="206" y="137">0</text><text x="282" y="137">0</text><text x="358" y="137" fill="#4169E1">4</text><text x="434" y="137">4</text><text x="510" y="137">4</text><text x="586" y="137">4</text>
    <text x="130" y="171" fill="#9aa7b2">-&#8734;</text>
    <text x="206" y="171">-3</text><text x="282" y="171">-2</text><text x="358" y="171">-2</text><text x="434" y="171">-1</text><text x="510" y="171" fill="#4169E1">4</text><text x="586" y="171">4</text>
    <text x="130" y="205" fill="#9aa7b2">0</text>
    <text x="206" y="205">0</text><text x="282" y="205">0</text><text x="358" y="205">4</text><text x="434" y="205">4</text><text x="510" y="205">4</text><text x="586" y="205" fill="#4169E1">7</text>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="600" fill="#4169E1">
    <text x="282" y="232">buy at 2</text>
    <text x="358" y="232">sell at 6</text>
    <text x="510" y="232">rebuy at 0</text>
    <text x="586" y="232">sell at 3</text>
  </g>
  <text x="340" y="260" text-anchor="middle" fill="#1a2026" font-size="13">k = 2 &lt; n // 2 = 3, so the cap can bind and every level updates day by day:</text>
  <text x="340" y="280" text-anchor="middle" fill="#1a2026" font-size="13">buy[j] = max(buy[j], sell[j-1] - p), sell[j] = max(sell[j], buy[j] + p).</text>
  <text x="340" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Buy at 2, sell at 6 (+4), rebuy at 0, sell at 3 (+3) — sell[2] = <tspan fill="#4169E1" font-weight="600">7</tspan>, the answer.</text>
</svg>
