<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [3,4,5,1,2]; cells 72x44 at x = 100 + 80i, row1 y=60, row2 y=190; the small arc joins the two cells each step compares -->
  <text x="40" y="86" fill="#5c6b76" font-size="12.5">step 1</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="136" y="36">0</text><text x="216" y="36">1</text><text x="296" y="36">2</text><text x="376" y="36">3</text><text x="456" y="36">4</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="136" y="52">lo</text><text x="296" y="52">mid</text><text x="456" y="52">hi</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="100" y="60" width="72" height="44"/><rect x="180" y="60" width="72" height="44"/><rect x="260" y="60" width="72" height="44"/><rect x="340" y="60" width="72" height="44"/><rect x="420" y="60" width="72" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="136" y="88">3</text><text x="216" y="88">4</text><text x="296" y="88">5</text><text x="376" y="88">1</text><text x="456" y="88">2</text>
  </g>
  <path d="M 296 112 Q 376 136 456 112" fill="none" stroke="#4169E1" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="310" y="150" text-anchor="middle" fill="#1a2026" font-size="13">nums[mid] = <tspan fill="#4169E1" font-weight="600">5</tspan> &gt; nums[hi] = <tspan fill="#4169E1" font-weight="600">2</tspan> — the drop lies right of mid, so lo = mid + 1</text>
  <text x="40" y="216" fill="#5c6b76" font-size="12.5">step 2</text>
  <g text-anchor="middle" font-size="12">
    <text x="136" y="170" fill="#9aa7b2">0</text><text x="216" y="170" fill="#9aa7b2">1</text><text x="296" y="170" fill="#9aa7b2">2</text><text x="376" y="170" fill="#5c6b76">3</text><text x="456" y="170" fill="#5c6b76">4</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="376" y="186">lo = mid</text><text x="456" y="186">hi</text>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2">
    <rect x="100" y="190" width="72" height="44"/><rect x="180" y="190" width="72" height="44"/><rect x="260" y="190" width="72" height="44"/>
  </g>
  <rect x="340" y="190" width="72" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <rect x="420" y="190" width="72" height="44" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="15">
    <text x="136" y="218" fill="#9aa7b2">3</text><text x="216" y="218" fill="#9aa7b2">4</text><text x="296" y="218" fill="#9aa7b2">5</text>
    <text x="376" y="218" fill="#4169E1" font-weight="600">1</text><text x="456" y="218" fill="#1a2026" font-weight="600">2</text>
  </g>
  <path d="M 376 240 Q 416 258 456 240" fill="none" stroke="#4169E1" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="310" y="276" text-anchor="middle" fill="#1a2026" font-size="13">nums[mid] = <tspan fill="#4169E1" font-weight="600">1</tspan> ≤ nums[hi] = <tspan fill="#4169E1" font-weight="600">2</tspan> — mid..hi is non-decreasing, so hi = mid</text>
  <text x="310" y="304" text-anchor="middle" fill="#1a2026" font-size="13">Two halvings later lo and hi meet on the drop: min([3, 4, 5, 1, 2]) = <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
