<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- perfect tree [1,2,3,4,5,6,7]; circles r=22; solid accent = next pointers,
       dashed accent = the walk hopping along the wired 2-3 chain -->
  <text x="320" y="44" text-anchor="middle" fill="#5c6b76" font-size="11.5">the root's next stays &#8709;</text>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 320 80 L 170 190"/>
    <path d="M 320 80 L 470 190"/>
    <path d="M 170 190 L 95 300"/>
    <path d="M 170 190 L 245 300"/>
    <path d="M 470 190 L 395 300"/>
    <path d="M 470 190 L 545 300"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <circle cx="320" cy="80" r="22"/>
    <circle cx="170" cy="190" r="22"/>
    <circle cx="470" cy="190" r="22"/>
    <circle cx="95" cy="300" r="22"/>
    <circle cx="245" cy="300" r="22"/>
    <circle cx="395" cy="300" r="22"/>
    <circle cx="545" cy="300" r="22"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="320" y="85">1</text>
    <text x="170" y="195">2</text>
    <text x="470" y="195">3</text>
    <text x="95" y="305">4</text>
    <text x="245" y="305">5</text>
    <text x="395" y="305">6</text>
    <text x="545" y="305">7</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 196 190 H 442" marker-end="url(#arrowB)"/>
    <path d="M 121 300 H 213" marker-end="url(#arrowB)"/>
    <path d="M 271 300 H 363" marker-end="url(#arrowB)" stroke-width="2.5"/>
    <path d="M 421 300 H 513" marker-end="url(#arrowB)"/>
  </g>
  <path d="M 182 162 C 260 108, 380 108, 458 162" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowB)"/>
  <text x="320" y="180" text-anchor="middle" fill="#5c6b76" font-size="11.5">root wires 2 &#8594; 3</text>
  <text x="238" y="112" text-anchor="middle" fill="#4169E1" font-size="11.5">hop along the chain</text>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="170" y="288">1</text>
    <text x="320" y="288">2</text>
    <text x="470" y="288">3</text>
  </g>
  <text x="320" y="356" text-anchor="middle" fill="#1a2026" font-size="13">With level = 2 the walk rides the wired 2 &#8594; 3 chain (dashed) and threads the leaves:</text>
  <text x="320" y="378" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">1</tspan>: 4 &#8594; 5 inside the pair, <tspan fill="#4169E1" font-weight="600">2</tspan>: the cross-parent bridge 5 &#8594; 6, <tspan fill="#4169E1" font-weight="600">3</tspan>: 6 &#8594; 7 — no queue, O(1) space.</text>
</svg>
