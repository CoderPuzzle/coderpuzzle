<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="640" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
  </defs>
  <text x="20" y="24" fill="#1a2026" font-weight="600">root = [3,9,20,null,null,15,7] - the queue always holds exactly one level</text>
  <!-- level bands -->
  <rect x="40" y="36" width="240" height="60" fill="#f4f6f9"/>
  <rect x="40" y="106" width="240" height="60" fill="#ffffff"/>
  <rect x="40" y="176" width="240" height="60" fill="#f4f6f9"/>
  <g fill="#8a94a0" font-size="10.5">
    <text x="288" y="70">level 0</text>
    <text x="288" y="140">level 1</text>
    <text x="288" y="210">level 2</text>
  </g>
  <!-- edges -->
  <g stroke="#8a94a0" stroke-width="1.3" fill="none">
    <line x1="160" y1="76" x2="110" y2="120" marker-end="url(#arr)"/>
    <line x1="160" y1="76" x2="210" y2="120" marker-end="url(#arr)"/>
    <line x1="210" y1="146" x2="185" y2="190" marker-end="url(#arr)"/>
    <line x1="210" y1="146" x2="235" y2="190" marker-end="url(#arr)"/>
  </g>
  <!-- nodes -->
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <circle cx="160" cy="64" r="18"/>
    <circle cx="110" cy="134" r="18"/>
    <circle cx="210" cy="134" r="18" fill="#e9eefb"/>
    <circle cx="185" cy="204" r="18"/>
    <circle cx="235" cy="204" r="18"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="160" y="69">3</text>
    <text x="110" y="139">9</text>
    <text x="210" y="139">20</text>
    <text x="185" y="209">15</text>
    <text x="235" y="209">7</text>
  </g>
  <!-- queue evolution -->
  <text x="360" y="52" fill="#1a2026" font-weight="600" font-size="12.5">Queue at the start of each round</text>
  <g font-size="12" fill="#1a2026">
    <text x="360" y="80">round 1:  [3]</text>
    <text x="360" y="106">round 2:  [9, 20]</text>
    <text x="360" y="132">round 3:  [15, 7]</text>
    <text x="360" y="158">round 4:  []  -&gt; done</text>
  </g>
  <text x="360" y="192" fill="#5b6470" font-size="11">Each round pops exactly len(queue) nodes,</text>
  <text x="360" y="208" fill="#5b6470" font-size="11">collects their values as one level, and</text>
  <text x="360" y="224" fill="#5b6470" font-size="11">enqueues their children - which are exactly</text>
  <text x="360" y="240" fill="#5b6470" font-size="11">the next level. Output: [[3],[9,20],[15,7]].</text>
</svg>
