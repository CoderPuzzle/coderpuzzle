<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 228" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- level bands -->
  <g fill="#e5ebfa">
    <rect x="180" y="17" width="100" height="46" rx="8"/>
    <rect x="105" y="87" width="250" height="46" rx="8"/>
    <rect x="205" y="157" width="210" height="46" rx="8"/>
  </g>
  <!-- edges -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="230" y1="58" x2="150" y2="92"/>
    <line x1="230" y1="58" x2="310" y2="92"/>
    <line x1="310" y1="128" x2="250" y2="162"/>
    <line x1="310" y1="128" x2="370" y2="162"/>
  </g>
  <!-- nodes -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="230" cy="40" r="18"/>
    <circle cx="150" cy="110" r="18"/>
    <circle cx="310" cy="110" r="18"/>
    <circle cx="250" cy="180" r="18"/>
    <circle cx="370" cy="180" r="18"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="230" y="45">3</text>
    <text x="150" y="115">9</text>
    <text x="310" y="115">20</text>
    <text x="250" y="185">15</text>
    <text x="370" y="185">7</text>
  </g>
  <!-- one list entry per level -->
  <g fill="#1a2026" font-size="13">
    <text x="428" y="45">[3]</text>
    <text x="428" y="115">[9, 20]</text>
    <text x="428" y="185">[15, 7]</text>
  </g>
</svg>
