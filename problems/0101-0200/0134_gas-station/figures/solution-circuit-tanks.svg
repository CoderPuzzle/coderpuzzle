<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="600" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
  </defs>
  <text x="20" y="24" fill="#1a2026" font-weight="600">gas = [1,2,3,4,5], cost = [3,4,5,1,2] - edge labels are gas[i] - cost[i]; total = 0, so a start exists</text>
  <!-- ring edges (pentagon) -->
  <g stroke="#8a94a0" stroke-width="1.6" fill="none">
    <line x1="248" y1="72" x2="325" y2="112" marker-end="url(#arr)"/>
    <line x1="348" y1="146" x2="310" y2="208" marker-end="url(#arr)"/>
    <line x1="284" y1="248" x2="206" y2="248" marker-end="url(#arr)"/>
    <line x1="180" y1="208" x2="143" y2="146" marker-end="url(#arr)"/>
    <line x1="165" y1="112" x2="212" y2="72" marker-end="url(#arr)"/>
  </g>
  <!-- edge labels -->
  <g font-size="12" fill="#1a2026" font-weight="600">
    <text x="312" y="80">-2</text>
    <text x="336" y="184">-2</text>
    <text x="245" y="242">-2</text>
    <text x="150" y="184">+3</text>
    <text x="164" y="80">+3</text>
  </g>
  <!-- stations -->
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <circle cx="230" cy="56" r="22"/>
    <circle cx="345" cy="130" r="22"/>
    <circle cx="300" cy="226" r="22"/>
    <circle cx="190" cy="226" r="22" fill="#e9eefb" stroke="#4169E1" stroke-width="2.6"/>
    <circle cx="145" cy="130" r="22"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="230" y="62">0</text>
    <text x="345" y="136">1</text>
    <text x="300" y="232">2</text>
    <text x="190" y="232">3</text>
    <text x="145" y="136">4</text>
  </g>
  <!-- failed start marks -->
  <g stroke="#8a94a0" stroke-width="1.8">
    <line x1="216" y1="42" x2="244" y2="70"/>
    <line x1="244" y1="42" x2="216" y2="70"/>
    <line x1="331" y1="116" x2="359" y2="144"/>
    <line x1="359" y1="116" x2="331" y2="144"/>
    <line x1="286" y1="212" x2="314" y2="240"/>
    <line x1="314" y1="212" x2="286" y2="240"/>
  </g>
  <text x="230" y="100" fill="#8a94a0" font-size="10.5" text-anchor="middle">tank dips &lt; 0</text>
  <text x="400" y="60" fill="#5b6470" font-size="11.5">Scanning from 0: every start in 0..2 fails,</text>
  <text x="400" y="76" fill="#5b6470" font-size="11.5">each time the running tank goes negative -</text>
  <text x="400" y="92" fill="#5b6470" font-size="11.5">the candidate jumps past the failure point.</text>
  <text x="190" y="272" fill="#4169E1" font-size="11.5" text-anchor="middle" font-weight="700">start = 3</text>
  <text x="60" y="310" fill="#1a2026" font-size="12.5">Full circuit from 3: tank after each edge = <tspan fill="#4169E1" font-weight="700">3, 6, 4, 2, 0</tspan> - it arrives back with exactly enough fuel.</text>
  <text x="60" y="332" fill="#5b6470" font-size="11.5">total = 0 &gt;= 0 certifies that the last surviving candidate completes the whole circuit, so the scan may stop there.</text>
</svg>
