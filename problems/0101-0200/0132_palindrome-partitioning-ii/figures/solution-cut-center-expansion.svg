<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="348" fill="#ffffff"/>
  <!-- s = aab; cut seeded [-1,0,1,2]; center (0,1) spans aa: cut[2]=cut[0]+1=0;
       center (2,2) spans b: cut[3]=cut[2]+1=1 (the answer); snapshots as rows,
       cells 72x36 at x 230,302,374,446; string cells 56x36 at (310,54) -->
  <text x="298" y="76" text-anchor="end" fill="#5c6b76" font-size="12.5">s = aab</text>
  <path d="M 338 48 Q 374 20 410 48" stroke="#4169E1" stroke-width="1.8" fill="none"/>
  <text x="374" y="26" text-anchor="middle" fill="#5c6b76" font-size="11">center (0,1): aa ✓</text>
  <g stroke="#1a2026" stroke-width="1.3" fill="#ffffff">
    <rect x="310" y="54" width="56" height="36"/><rect x="382" y="54" width="56" height="36"/><rect x="454" y="54" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="338" y="78">a</text><text x="410" y="78">a</text><text x="482" y="78">b</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="338" y="102">0</text><text x="410" y="102">1</text><text x="482" y="102">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="266" y="132">cut[0]</text><text x="338" y="132">cut[1]</text><text x="410" y="132">cut[2]</text><text x="482" y="132">cut[3]</text>
  </g>
  <g stroke="#1a2026" stroke-width="1.3">
    <rect x="230" y="140" width="72" height="36" fill="#ffffff"/><rect x="302" y="140" width="72" height="36" fill="#ffffff"/><rect x="374" y="140" width="72" height="36" fill="#ffffff"/><rect x="446" y="140" width="72" height="36" fill="#ffffff"/>
    <rect x="230" y="184" width="72" height="36" fill="#ffffff"/><rect x="302" y="184" width="72" height="36" fill="#ffffff"/><rect x="374" y="184" width="72" height="36" fill="#dbe4fb"/><rect x="446" y="184" width="72" height="36" fill="#ffffff"/>
    <rect x="230" y="228" width="72" height="36" fill="#ffffff"/><rect x="302" y="228" width="72" height="36" fill="#ffffff"/><rect x="374" y="228" width="72" height="36" fill="#ffffff"/><rect x="446" y="228" width="72" height="36" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="266" y="163">-1</text><text x="338" y="163">0</text><text x="410" y="163">1</text><text x="482" y="163">2</text>
    <text x="266" y="207">-1</text><text x="338" y="207">0</text><text x="482" y="207">2</text>
    <text x="266" y="251">-1</text><text x="338" y="251">0</text><text x="410" y="251">0</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600">
    <text x="410" y="207">0</text>
    <text x="482" y="251">1</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="220" y="163">seed: cut[i] = i-1</text>
    <text x="220" y="207">center (0,1): aa</text>
    <text x="220" y="251">center (2,2): b</text>
  </g>
  <text x="526" y="208" fill="#5c6b76" font-size="12">= cut[0] + 1</text>
  <text x="526" y="252" fill="#4169E1" font-size="12" font-weight="600">= cut[2] + 1 — answer</text>
  <text x="340" y="290" text-anchor="middle" fill="#9aa7b2" font-size="11.5">centers (0,0), (1,1), (1,2) relax nothing new</text>
  <text x="340" y="316" text-anchor="middle" fill="#1a2026" font-size="13">The aa center drops cut[2] to cut[0] + 1 = 0; center (2,2) then sets</text>
  <text x="340" y="338" text-anchor="middle" fill="#1a2026" font-size="13">cut[3] = cut[2] + 1 = <tspan fill="#4169E1" font-weight="600">1</tspan> — the one cut that [aa, b] needs.</text>
</svg>
