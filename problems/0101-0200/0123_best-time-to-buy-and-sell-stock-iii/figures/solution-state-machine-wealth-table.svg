<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 318" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="318" fill="#ffffff"/>
  <!-- prices = [3,3,5,0,0,3,1,4]; cells 60x38 from x=70; rows buy1/sell1/buy2/sell2 at y=78/116/154/192; accented cells are the updates that fire -->
  <text x="60" y="42" text-anchor="end" fill="#9aa7b2" font-size="11">day</text>
  <text x="60" y="69" text-anchor="end" fill="#5c6b76" font-size="12.5">price</text>
  <g text-anchor="middle" font-size="11">
    <text x="100" y="42" fill="#9aa7b2">0</text><text x="160" y="42" fill="#9aa7b2">1</text>
    <text x="220" y="42" fill="#9aa7b2">2</text><text x="280" y="42" fill="#4169E1" font-weight="600">3</text>
    <text x="340" y="42" fill="#9aa7b2">4</text><text x="400" y="42" fill="#4169E1" font-weight="600">5</text>
    <text x="460" y="42" fill="#9aa7b2">6</text><text x="520" y="42" fill="#4169E1" font-weight="600">7</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#f0f3f7">
    <rect x="70" y="50" width="60" height="28"/><rect x="130" y="50" width="60" height="28"/>
    <rect x="190" y="50" width="60" height="28"/><rect x="250" y="50" width="60" height="28"/>
    <rect x="310" y="50" width="60" height="28"/><rect x="370" y="50" width="60" height="28"/>
    <rect x="430" y="50" width="60" height="28"/><rect x="490" y="50" width="60" height="28"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="100" y="69">3</text><text x="160" y="69">3</text><text x="220" y="69">5</text>
    <text x="280" y="69">0</text><text x="340" y="69">0</text><text x="400" y="69">3</text>
    <text x="460" y="69">1</text><text x="520" y="69">4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="70" y="78" width="60" height="38"/><rect x="130" y="78" width="60" height="38"/>
    <rect x="190" y="78" width="60" height="38"/><rect x="250" y="78" width="60" height="38"/>
    <rect x="310" y="78" width="60" height="38"/><rect x="370" y="78" width="60" height="38"/>
    <rect x="430" y="78" width="60" height="38"/><rect x="490" y="78" width="60" height="38"/>
    <rect x="70" y="116" width="60" height="38"/><rect x="130" y="116" width="60" height="38"/>
    <rect x="190" y="116" width="60" height="38"/><rect x="250" y="116" width="60" height="38"/>
    <rect x="310" y="116" width="60" height="38"/><rect x="370" y="116" width="60" height="38"/>
    <rect x="430" y="116" width="60" height="38"/><rect x="490" y="116" width="60" height="38"/>
    <rect x="70" y="154" width="60" height="38"/><rect x="130" y="154" width="60" height="38"/>
    <rect x="190" y="154" width="60" height="38"/><rect x="250" y="154" width="60" height="38"/>
    <rect x="310" y="154" width="60" height="38"/><rect x="370" y="154" width="60" height="38"/>
    <rect x="430" y="154" width="60" height="38"/><rect x="490" y="154" width="60" height="38"/>
    <rect x="70" y="192" width="60" height="38"/><rect x="130" y="192" width="60" height="38"/>
    <rect x="190" y="192" width="60" height="38"/><rect x="250" y="192" width="60" height="38"/>
    <rect x="310" y="192" width="60" height="38"/><rect x="370" y="192" width="60" height="38"/>
    <rect x="430" y="192" width="60" height="38"/><rect x="490" y="192" width="60" height="38"/>
  </g>
  <!-- fired updates: buy2 at day 3 (price 0), sell2 at days 5 and 7 -->
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="250" y="154" width="60" height="38"/>
    <rect x="370" y="192" width="60" height="38"/>
    <rect x="490" y="192" width="60" height="38"/>
  </g>
  <rect x="490" y="192" width="60" height="38" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5" font-weight="600">
    <text x="60" y="102">buy1</text><text x="60" y="140">sell1</text>
    <text x="60" y="178">buy2</text><text x="60" y="216">sell2</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14.5" fill="#1a2026">
    <text x="100" y="102">-3</text><text x="160" y="102">-3</text><text x="220" y="102">-3</text>
    <text x="280" y="102">0</text><text x="340" y="102">0</text><text x="400" y="102">0</text>
    <text x="460" y="102">0</text><text x="520" y="102">0</text>
    <text x="100" y="140">0</text><text x="160" y="140">0</text><text x="220" y="140">2</text>
    <text x="280" y="140">2</text><text x="340" y="140">2</text><text x="400" y="140">3</text>
    <text x="460" y="140">3</text><text x="520" y="140">4</text>
    <text x="100" y="178">-3</text><text x="160" y="178">-3</text><text x="220" y="178">-3</text>
    <text x="280" y="178" fill="#4169E1">2</text><text x="340" y="178">2</text>
    <text x="400" y="178">2</text><text x="460" y="178">2</text><text x="520" y="178">2</text>
    <text x="100" y="216">0</text><text x="160" y="216">0</text><text x="220" y="216">2</text>
    <text x="280" y="216">2</text><text x="340" y="216">2</text>
    <text x="400" y="216" fill="#4169E1">5</text><text x="460" y="216">5</text>
    <text x="520" y="216" fill="#4169E1">6</text>
  </g>
  <text x="280" y="246" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">buy2 = sell1 2 - 0</text>
  <text x="310" y="280" text-anchor="middle" fill="#1a2026" font-size="13">The second buy fires the day the price hits 0; selling at 3 then 4 on</text>
  <text x="310" y="298" text-anchor="middle" fill="#1a2026" font-size="13">top of it lifts sell2 to 5 and finally <tspan fill="#4169E1" font-weight="600">6</tspan> — the answer.</text>
</svg>
