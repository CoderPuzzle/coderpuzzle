<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- t = "bag", s = "babgbag"; one row per character of s: dp = [1,0,0,0] -> [1,3,4,5];
       cells 70x34 at x=100/170/240/310, rows start y=78 -->
  <text x="240" y="30" text-anchor="middle" fill="#5c6b76" font-size="12">dp[j] counts ways to form t[:j] — here t = bag</text>
  <path d="M 378 44 H 104" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="400" y="48" fill="#5c6b76" font-size="11.5">j sweeps right to left</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="88" y="68">s char</text>
    <text x="135" y="68">&#8709;</text>
    <text x="205" y="68">'b'</text>
    <text x="275" y="68">'ba'</text>
    <text x="345" y="68">'bag'</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1">
    <rect x="100" y="78" width="70" height="34"/><rect x="170" y="78" width="70" height="34"/><rect x="240" y="78" width="70" height="34"/><rect x="310" y="78" width="70" height="34"/>
    <rect x="100" y="112" width="70" height="34"/><rect x="170" y="112" width="70" height="34"/><rect x="240" y="112" width="70" height="34"/><rect x="310" y="112" width="70" height="34"/>
    <rect x="100" y="146" width="70" height="34"/><rect x="170" y="146" width="70" height="34"/><rect x="240" y="146" width="70" height="34"/><rect x="310" y="146" width="70" height="34"/>
    <rect x="100" y="180" width="70" height="34"/><rect x="170" y="180" width="70" height="34"/><rect x="240" y="180" width="70" height="34"/><rect x="310" y="180" width="70" height="34"/>
    <rect x="100" y="214" width="70" height="34"/><rect x="170" y="214" width="70" height="34"/><rect x="240" y="214" width="70" height="34"/><rect x="310" y="214" width="70" height="34"/>
    <rect x="100" y="248" width="70" height="34"/><rect x="170" y="248" width="70" height="34"/><rect x="240" y="248" width="70" height="34"/><rect x="310" y="248" width="70" height="34"/>
    <rect x="100" y="282" width="70" height="34"/><rect x="170" y="282" width="70" height="34"/><rect x="240" y="282" width="70" height="34"/><rect x="310" y="282" width="70" height="34"/>
    <rect x="100" y="316" width="70" height="34"/><rect x="170" y="316" width="70" height="34"/><rect x="240" y="316" width="70" height="34"/><rect x="310" y="316" width="70" height="34"/>
  </g>
  <!-- cells updated by the current character of s -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="170" y="112" width="70" height="34"/>
    <rect x="240" y="146" width="70" height="34"/>
    <rect x="170" y="180" width="70" height="34"/>
    <rect x="310" y="214" width="70" height="34"/>
    <rect x="170" y="248" width="70" height="34"/>
    <rect x="240" y="282" width="70" height="34"/>
    <rect x="310" y="316" width="70" height="34"/>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="13">
    <text x="88" y="100">start</text>
    <text x="88" y="134">'b'</text>
    <text x="88" y="168">'a'</text>
    <text x="88" y="202">'b'</text>
    <text x="88" y="236">'g'</text>
    <text x="88" y="270">'b'</text>
    <text x="88" y="304">'a'</text>
    <text x="88" y="338">'g'</text>
  </g>
  <g text-anchor="middle">
    <text x="135" y="100" fill="#1a2026">1</text><text x="205" y="100" fill="#9aa7b2">0</text><text x="275" y="100" fill="#9aa7b2">0</text><text x="345" y="100" fill="#9aa7b2">0</text>
    <text x="135" y="134" fill="#1a2026">1</text><text x="205" y="134" fill="#4169E1" font-weight="600">1</text><text x="275" y="134" fill="#9aa7b2">0</text><text x="345" y="134" fill="#9aa7b2">0</text>
    <text x="135" y="168" fill="#1a2026">1</text><text x="205" y="168" fill="#1a2026">1</text><text x="275" y="168" fill="#4169E1" font-weight="600">1</text><text x="345" y="168" fill="#9aa7b2">0</text>
    <text x="135" y="202" fill="#1a2026">1</text><text x="205" y="202" fill="#4169E1" font-weight="600">2</text><text x="275" y="202" fill="#1a2026">1</text><text x="345" y="202" fill="#9aa7b2">0</text>
    <text x="135" y="236" fill="#1a2026">1</text><text x="205" y="236" fill="#1a2026">2</text><text x="275" y="236" fill="#1a2026">1</text><text x="345" y="236" fill="#4169E1" font-weight="600">1</text>
    <text x="135" y="270" fill="#1a2026">1</text><text x="205" y="270" fill="#4169E1" font-weight="600">3</text><text x="275" y="270" fill="#1a2026">1</text><text x="345" y="270" fill="#1a2026">1</text>
    <text x="135" y="304" fill="#1a2026">1</text><text x="205" y="304" fill="#1a2026">3</text><text x="275" y="304" fill="#4169E1" font-weight="600">4</text><text x="345" y="304" fill="#1a2026">1</text>
    <text x="135" y="338" fill="#1a2026">1</text><text x="205" y="338" fill="#1a2026">3</text><text x="275" y="338" fill="#1a2026">4</text><text x="345" y="338" fill="#4169E1" font-weight="600">5</text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="400" y="134">dp[1] += dp[0] = 1</text>
    <text x="400" y="168">dp[2] += dp[1] = 1</text>
    <text x="400" y="202">dp[1] += dp[0] = 1</text>
    <text x="400" y="236">dp[3] += dp[2] = 1</text>
    <text x="400" y="270">dp[1] += dp[0] = 1</text>
    <text x="400" y="304">dp[2] += dp[1] = 3</text>
    <text x="400" y="338">dp[3] += dp[2] = 4</text>
  </g>
  <text x="280" y="382" text-anchor="middle" fill="#1a2026" font-size="13">Rows sweep j right-to-left: dp[j-1] is still the previous row when read.</text>
  <text x="280" y="404" text-anchor="middle" fill="#1a2026" font-size="13">After all of s = babgbag, <tspan fill="#4169E1" font-weight="600">dp[3] = 5</tspan> — the five distinct ways to form bag.</text>
</svg>
