<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- adjList = [[2,4],[1,3],[2,4],[1,3]]: 4-cycle 1-2-3-4-1; DFS clones 1',2',3',4' in order;
       dashed arrows = visited-map entries; the accent c4-c1 edge is the back edge that finds
       clone 1' already mapped; node circles r=20 -->
  <text x="215" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">original</text>
  <text x="535" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">clone, built in DFS order</text>
  <text x="310" y="36" text-anchor="middle" fill="#9aa7b2" font-size="11">visited map</text>
  <!-- visited-map arrows original -> clone -->
  <g stroke="#9aa7b2" stroke-width="1.3" fill="none" stroke-dasharray="4 3">
    <path d="M 166 76 Q 310 30 454 76" marker-end="url(#arrow)"/>
    <path d="M 296 76 Q 440 44 584 76" marker-end="url(#arrow)"/>
    <path d="M 296 224 Q 440 256 584 224" marker-end="url(#arrow)"/>
    <path d="M 166 224 Q 310 256 454 224" marker-end="url(#arrow)"/>
  </g>
  <!-- original edges -->
  <g stroke="#42525e" stroke-width="1.6">
    <path d="M 170 90 H 260"/><path d="M 280 110 V 190"/><path d="M 260 210 H 170"/><path d="M 150 190 V 110"/>
  </g>
  <!-- clone edges; c4-c1 is the highlighted back edge -->
  <g stroke="#42525e" stroke-width="1.6">
    <path d="M 490 90 H 580"/><path d="M 600 110 V 190"/><path d="M 580 210 H 490"/>
  </g>
  <path d="M 470 190 V 110" stroke="#4169E1" stroke-width="2.4"/>
  <!-- original nodes -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <circle cx="150" cy="90" r="20"/><circle cx="280" cy="90" r="20"/><circle cx="280" cy="210" r="20"/><circle cx="150" cy="210" r="20"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="150" y="95">1</text><text x="280" y="95">2</text><text x="280" y="215">3</text><text x="150" y="215">4</text>
  </g>
  <!-- clone nodes -->
  <g fill="#ffffff" stroke="#4169E1" stroke-width="1.8">
    <circle cx="470" cy="90" r="20"/><circle cx="600" cy="90" r="20"/><circle cx="600" cy="210" r="20"/><circle cx="470" cy="210" r="20"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#4169E1">
    <text x="470" y="95">1'</text><text x="600" y="95">2'</text><text x="600" y="215">3'</text><text x="470" y="215">4'</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">
    <text x="470" y="52">1st</text><text x="600" y="52">2nd</text><text x="600" y="258">3rd</text><text x="470" y="258">4th</text>
  </g>
  <g text-anchor="end" fill="#1a2026" font-size="12.5">
    <text x="458" y="132">4 revisits 1: the map</text>
    <text x="458" y="148">returns the built 1' —</text>
    <text x="458" y="164">no recursion</text>
  </g>
  <text x="340" y="282" text-anchor="middle" fill="#1a2026" font-size="13">The DFS builds 1', 2', 3', 4' in order; each back edge finds its target's clone</text>
  <text x="340" y="304" text-anchor="middle" fill="#1a2026" font-size="13">already in the visited map — the 4-cycle closes without unbounded recursion.</text>
</svg>
