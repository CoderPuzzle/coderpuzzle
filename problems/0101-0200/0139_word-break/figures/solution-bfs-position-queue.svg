<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="302" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "leetcode", wordDict = ["leet","code"]; cells 56x40 at (96,54); position i sits at x = 96 + 56i -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 96 46 Q 206 2 312 46" marker-end="url(#arrowB)"/>
    <path d="M 328 46 Q 436 2 540 46" marker-end="url(#arrowB)"/>
  </g>
  <text x="204" y="16" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">leet</text>
  <text x="434" y="16" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">code</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="96" y="54" width="56" height="40"/><rect x="152" y="54" width="56" height="40"/><rect x="208" y="54" width="56" height="40"/><rect x="264" y="54" width="56" height="40"/>
    <rect x="320" y="54" width="56" height="40"/><rect x="376" y="54" width="56" height="40"/><rect x="432" y="54" width="56" height="40"/><rect x="488" y="54" width="56" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="124" y="79">l</text><text x="180" y="79">e</text><text x="236" y="79">e</text><text x="292" y="79">t</text>
    <text x="348" y="79">c</text><text x="404" y="79">o</text><text x="460" y="79">d</text><text x="516" y="79">e</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="96" y="112" fill="#4169E1" font-weight="600">0</text>
    <text x="152" y="112" fill="#9aa7b2">1</text>
    <text x="208" y="112" fill="#9aa7b2">2</text>
    <text x="264" y="112" fill="#9aa7b2">3</text>
    <text x="320" y="112" fill="#4169E1" font-weight="600">4</text>
    <text x="376" y="112" fill="#9aa7b2">5</text>
    <text x="432" y="112" fill="#9aa7b2">6</text>
    <text x="488" y="112" fill="#9aa7b2">7</text>
    <text x="544" y="112" fill="#4169E1" font-weight="600">8</text>
  </g>
  <circle cx="544" cy="108" r="9" fill="none" stroke="#4169E1" stroke-width="1.3"/>
  <!-- queue trace: one expansion per row -->
  <g fill="#5c6b76" font-size="11">
    <text x="96" y="148">step</text>
    <text x="320" y="148" text-anchor="middle">queue</text>
    <text x="452" y="148" text-anchor="middle">visited</text>
    <text x="552" y="148" text-anchor="middle">result</text>
  </g>
  <g font-size="13" fill="#1a2026">
    <text x="96" y="176">start</text>
    <text x="96" y="206">pop 0: leet &#8594; 4</text>
    <text x="96" y="236">pop 4: code &#8594; 8 = n</text>
  </g>
  <g>
    <rect x="306" y="160" width="28" height="22" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="320" y="176" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">0</text>
    <rect x="306" y="190" width="28" height="22" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="320" y="206" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">4</text>
    <text x="320" y="236" text-anchor="middle" fill="#9aa7b2" font-size="13">&#8212;</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="452" y="176">{0}</text>
    <text x="452" y="206">{0, 4}</text>
    <text x="452" y="236">{0, 4}</text>
  </g>
  <text x="552" y="236" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">true</text>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Each position expands at most once; the 'code' edge from 4 lands exactly on</text>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">position <tspan fill="#4169E1" font-weight="600">8 = n</tspan>, so 'leetcode' segments as leet + code: <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
