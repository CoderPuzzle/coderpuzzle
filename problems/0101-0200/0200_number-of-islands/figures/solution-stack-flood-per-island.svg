<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="412" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- example 2 grid = 4 rows x 5 cols at (70,56), cells 60x44; land '1' shaded #dbe4fb once visited;
       badge = seed/island count order; island 1 stack snapshots bottom: pop order (0,0)(0,1)(1,1)(1,0),
       stack cells 56x22, columns every 110 from x 130, bottom row y 318, top row y 296 -->
  <text x="220" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid (example 2)</text>
  <g stroke="#1a2026" stroke-width="1.4">
    <rect x="70" y="56" width="60" height="44" fill="#dbe4fb"/><rect x="130" y="56" width="60" height="44" fill="#dbe4fb"/><rect x="190" y="56" width="60" height="44" fill="#ffffff"/><rect x="250" y="56" width="60" height="44" fill="#ffffff"/><rect x="310" y="56" width="60" height="44" fill="#ffffff"/>
    <rect x="70" y="100" width="60" height="44" fill="#dbe4fb"/><rect x="130" y="100" width="60" height="44" fill="#dbe4fb"/><rect x="190" y="100" width="60" height="44" fill="#ffffff"/><rect x="250" y="100" width="60" height="44" fill="#ffffff"/><rect x="310" y="100" width="60" height="44" fill="#ffffff"/>
    <rect x="70" y="144" width="60" height="44" fill="#ffffff"/><rect x="130" y="144" width="60" height="44" fill="#ffffff"/><rect x="190" y="144" width="60" height="44" fill="#dbe4fb"/><rect x="250" y="144" width="60" height="44" fill="#ffffff"/><rect x="310" y="144" width="60" height="44" fill="#ffffff"/>
    <rect x="70" y="188" width="60" height="44" fill="#ffffff"/><rect x="130" y="188" width="60" height="44" fill="#ffffff"/><rect x="190" y="188" width="60" height="44" fill="#ffffff"/><rect x="250" y="188" width="60" height="44" fill="#dbe4fb"/><rect x="310" y="188" width="60" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="100" y="83">1</text><text x="160" y="83">1</text>
    <text x="100" y="127">1</text><text x="160" y="127">1</text>
    <text x="220" y="171">1</text>
    <text x="280" y="215">1</text><text x="340" y="215">1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2">
    <text x="220" y="83">0</text><text x="280" y="83">0</text><text x="340" y="83">0</text>
    <text x="220" y="127">0</text><text x="280" y="127">0</text><text x="340" y="127">0</text>
    <text x="100" y="171">0</text><text x="160" y="171">0</text><text x="280" y="171">0</text><text x="340" y="171">0</text>
    <text x="100" y="215">0</text><text x="160" y="215">0</text><text x="220" y="215">0</text>
  </g>
  <g>
    <circle cx="81" cy="67" r="10" fill="#4169E1"/><text x="81" y="71" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">1</text>
    <circle cx="201" cy="155" r="10" fill="#4169E1"/><text x="201" y="159" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">2</text>
    <circle cx="261" cy="199" r="10" fill="#4169E1"/><text x="261" y="203" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">3</text>
  </g>
  <text x="400" y="78" fill="#5c6b76" font-size="12.5">the row-major scan, seed by seed</text>
  <g fill="#1a2026" font-size="12.5">
    <text x="400" y="106"><tspan fill="#4169E1" font-weight="600">seed 1</tspan> (0,0) floods 4 cells</text>
    <text x="400" y="132"><tspan fill="#4169E1" font-weight="600">seed 2</tspan> (2,2) floods 1 cell</text>
    <text x="400" y="158"><tspan fill="#4169E1" font-weight="600">seed 3</tspan> (3,3) floods 2 cells</text>
  </g>
  <text x="400" y="198" font-size="14" font-weight="600" fill="#1a2026">islands = 1 + 1 + 1 = <tspan fill="#4169E1">3</tspan></text>
  <text x="70" y="272" fill="#5c6b76" font-size="12.5">island 1's explicit stack during its sweep (top on top)</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="130" y="290">seed (0,0)</text><text x="240" y="290">pop (0,0)</text><text x="350" y="290">pop (0,1)</text><text x="460" y="290">pop (1,1)</text><text x="570" y="290">pop (1,0)</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="102" y="296" width="56" height="22" fill="#dbe4fb"/>
    <rect x="212" y="296" width="56" height="22" fill="#dbe4fb"/><rect x="212" y="318" width="56" height="22" fill="#ffffff"/>
    <rect x="322" y="296" width="56" height="22" fill="#dbe4fb"/><rect x="322" y="318" width="56" height="22" fill="#ffffff"/>
    <rect x="432" y="318" width="56" height="22" fill="#dbe4fb"/>
    <rect x="542" y="318" width="56" height="22" fill="none" stroke="#9aa7b2" stroke-dasharray="3 3"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12">
    <text x="130" y="311">(0,0)</text>
    <text x="240" y="333">(1,0)</text><text x="240" y="311">(0,1)</text>
    <text x="350" y="333">(1,0)</text><text x="350" y="311">(1,1)</text>
    <text x="460" y="333">(1,0)</text>
  </g>
  <text x="570" y="333" text-anchor="middle" fill="#9aa7b2" font-size="11">empty</text>
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 164 329 H 198" marker-end="url(#arrow)"/>
    <path d="M 274 329 H 308" marker-end="url(#arrow)"/>
    <path d="M 384 329 H 418" marker-end="url(#arrow)"/>
    <path d="M 494 329 H 528" marker-end="url(#arrow)"/>
  </g>
  <text x="330" y="386" text-anchor="middle" fill="#1a2026" font-size="13">Each unvisited land cell seeds one depth-first sweep that marks its island visited;</text>
  <text x="330" y="406" text-anchor="middle" fill="#1a2026" font-size="13">the scan finds a fresh island per drained stack: 1 + 1 + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan> islands total.</text>
</svg>
