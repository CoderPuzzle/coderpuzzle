<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="412" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- A prefix 4,1 and B prefix 5,6,1 over the shared tail 8,4,5; circles r=20; strip cells 40x26 at x = 70 + 46i; light gray cells are the other list's prefix, accent cells the shared tail, last cell the meet -->
  <text x="22" y="64" fill="#5c6b76" font-size="12">headA</text>
  <text x="22" y="204" fill="#5c6b76" font-size="12">headB</text>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 105 60 L 144 60" marker-end="url(#arrow)"/>
    <path d="M 188 70 L 277 118" marker-end="url(#arrow)"/>
    <path d="M 105 200 L 144 200" marker-end="url(#arrow)"/>
    <path d="M 190 200 L 234 200" marker-end="url(#arrow)"/>
    <path d="M 270 183 L 289 150" marker-end="url(#arrow)"/>
    <path d="M 320 130 L 396 130" marker-end="url(#arrow)"/>
    <path d="M 440 130 L 516 130" marker-end="url(#arrow)"/>
    <path d="M 560 130 L 578 130" marker-end="url(#arrow)"/>
  </g>
  <!-- nodes -->
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <circle cx="85" cy="60" r="20"/><circle cx="170" cy="60" r="20"/>
    <circle cx="85" cy="200" r="20"/><circle cx="170" cy="200" r="20"/><circle cx="260" cy="200" r="20"/>
  </g>
  <circle cx="300" cy="130" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.5"/>
  <g stroke="#1a2026" stroke-width="1.6" fill="#dbe4fb">
    <circle cx="420" cy="130" r="20"/><circle cx="540" cy="130" r="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="85" y="65">4</text><text x="170" y="65">1</text>
    <text x="300" y="135" fill="#4169E1">8</text><text x="420" y="135">4</text><text x="540" y="135">5</text>
    <text x="85" y="205">5</text><text x="170" y="205">6</text><text x="260" y="205">1</text>
  </g>
  <text x="300" y="102" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">meet</text>
  <text x="598" y="134" fill="#5c6b76" font-size="12.5">null</text>
  <!-- pA walk: own prefix, shared tail, restart at headB, meet -->
  <text x="30" y="287" fill="#4169E1" font-size="12.5" font-weight="600">pA</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="113" y="262">A's prefix</text><text x="228" y="262">shared tail</text><text x="389" y="262">restarts at headB</text>
  </g>
  <g stroke-width="1.4">
    <rect x="70" y="270" width="40" height="26" fill="#ffffff" stroke="#42525e"/><rect x="116" y="270" width="40" height="26" fill="#ffffff" stroke="#42525e"/>
    <rect x="162" y="270" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/><rect x="208" y="270" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/><rect x="254" y="270" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="300" y="270" width="40" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/><rect x="346" y="270" width="40" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/><rect x="392" y="270" width="40" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="438" y="270" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.2"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="90" y="287" fill="#1a2026">4</text><text x="136" y="287" fill="#1a2026">1</text>
    <text x="182" y="287" fill="#1a2026">8</text><text x="228" y="287" fill="#1a2026">4</text><text x="274" y="287" fill="#1a2026">5</text>
    <text x="320" y="287" fill="#5c6b76">5</text><text x="366" y="287" fill="#5c6b76">6</text><text x="412" y="287" fill="#5c6b76">1</text>
    <text x="458" y="287" fill="#4169E1" font-weight="600">8</text>
  </g>
  <!-- pB walk: own prefix, shared tail, restart at headA, meet -->
  <text x="30" y="333" fill="#4169E1" font-size="12.5" font-weight="600">pB</text>
  <g stroke-width="1.4">
    <rect x="70" y="316" width="40" height="26" fill="#ffffff" stroke="#42525e"/><rect x="116" y="316" width="40" height="26" fill="#ffffff" stroke="#42525e"/><rect x="162" y="316" width="40" height="26" fill="#ffffff" stroke="#42525e"/>
    <rect x="208" y="316" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/><rect x="254" y="316" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/><rect x="300" y="316" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="346" y="316" width="40" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/><rect x="392" y="316" width="40" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="438" y="316" width="40" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.2"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="90" y="333" fill="#1a2026">5</text><text x="136" y="333" fill="#1a2026">6</text><text x="182" y="333" fill="#1a2026">1</text>
    <text x="228" y="333" fill="#1a2026">8</text><text x="274" y="333" fill="#1a2026">4</text><text x="320" y="333" fill="#1a2026">5</text>
    <text x="366" y="333" fill="#5c6b76">4</text><text x="412" y="333" fill="#5c6b76">1</text>
    <text x="458" y="333" fill="#4169E1" font-weight="600">8</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="136" y="360">B's prefix</text><text x="274" y="360">shared tail</text><text x="412" y="360">restarts at headA</text>
  </g>
  <text x="340" y="384" text-anchor="middle" fill="#1a2026" font-size="13">Restarting at the other head, each pointer covers own plus other prefix, 8 nodes either way,</text>
  <text x="340" y="402" text-anchor="middle" fill="#1a2026" font-size="13">so the two walks collide exactly at the shared node <tspan fill="#4169E1" font-weight="600">8</tspan>.</text>
</svg>
