<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- numbers=[2,7,11,15], target=9; cells 60x44 at y=70, x=100+64i; sums 17 and 13 certify 15 then 11 irrelevant; 2+7 lands -->
  <text x="100" y="56" fill="#5c6b76" font-size="12.5">target = 9</text>
  <text x="322" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">2 + 15 = 17 &gt; 9</text>
  <text x="258" y="52" text-anchor="middle" fill="#5c6b76" font-size="12.5">2 + 11 = 13 &gt; 9</text>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="none">
    <path d="M 322 36 L 322 66" marker-end="url(#arrow-muted)"/>
    <path d="M 258 58 L 258 66" marker-end="url(#arrow-muted)"/>
  </g>
  <!-- surviving pair accent; discarded endpoints gray -->
  <g fill="#ffffff" stroke="#4169E1" stroke-width="2">
    <rect x="100" y="70" width="60" height="44"/><rect x="164" y="70" width="60" height="44"/>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5">
    <rect x="228" y="70" width="60" height="44"/><rect x="292" y="70" width="60" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="130" y="97" fill="#4169E1">2</text><text x="194" y="97" fill="#4169E1">7</text>
    <text x="258" y="97" fill="#9aa7b2">11</text><text x="322" y="97" fill="#9aa7b2">15</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="130" y="132" font-weight="700" fill="#4169E1">L</text>
    <text x="194" y="132" font-weight="700" fill="#4169E1">R</text>
    <text x="258" y="132" fill="#9aa7b2" font-size="10.5">retired</text>
    <text x="322" y="132" fill="#9aa7b2" font-size="10.5">retired</text>
  </g>
  <!-- final comparison closes the window -->
  <path d="M 130 142 Q 162 195 194 142" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="162" y="205" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">2 + 7 = 9 &#8594; [1, 2]</text>
  <text x="40" y="238" fill="#1a2026" font-size="13">Each comparison certifies the discarded endpoint: 17 proves 15 can never join,</text>
  <text x="40" y="256" fill="#1a2026" font-size="13">13 proves 11 can never join, so the window closes on 2 + 7 = 9 and returns <tspan fill="#4169E1" font-weight="600">[1, 2]</tspan>.</text>
</svg>
