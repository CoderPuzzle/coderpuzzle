<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="396" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree = [1,2,5,3,4,null,6]; splice at 1: tail 4 adopts the old right subtree 5-6, the 2-subtree swings to 1.right, 1.left is nulled; spine boxes 40x36 at x=155+66i, y=274 -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="138" y1="71" x2="97" y2="116"/>
    <line x1="164" y1="68" x2="231" y2="118"/>
    <line x1="78" y1="143" x2="59" y2="183"/>
    <line x1="92" y1="143" x2="118" y2="183"/>
    <line x1="260" y1="141" x2="289" y2="185"/>
  </g>
  <path d="M 140 206 Q 200 236 240 148" fill="none" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <circle cx="150" cy="58" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="85" cy="128" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="245" cy="128" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="52" cy="198" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="125" cy="198" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="125" cy="198" r="21" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <circle cx="300" cy="198" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="150" y="63">1</text>
    <text x="85" y="133">2</text>
    <text x="245" y="133">5</text>
    <text x="52" y="203">3</text>
    <text x="125" y="203">4</text>
    <text x="300" y="203">6</text>
  </g>
  <text x="125" y="236" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">tail</text>
  <text x="196" y="252" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">4.right = 5</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="420" y="52"><tspan fill="#4169E1" font-weight="600">(1)</tspan> hunt the tail: the rightmost</text>
    <text x="420" y="70">node of the left subtree is 4.</text>
    <text x="420" y="96"><tspan fill="#4169E1" font-weight="600">(2)</tspan> 4.right adopts the old right</text>
    <text x="420" y="114">subtree: 5, with 6 still attached.</text>
    <text x="420" y="140"><tspan fill="#4169E1" font-weight="600">(3)</tspan> 1.right = the left root 2 and</text>
    <text x="420" y="158">1.left = null; the cursor steps to 2.</text>
  </g>
  <!-- finished right spine -->
  <text x="155" y="278" fill="#5c6b76" font-size="12.5">the finished right spine:</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="155" y="290" width="40" height="36"/><rect x="221" y="290" width="40" height="36"/>
    <rect x="287" y="290" width="40" height="36"/><rect x="353" y="290" width="40" height="36"/>
    <rect x="419" y="290" width="40" height="36"/><rect x="485" y="290" width="40" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="175" y="313">1</text><text x="241" y="313">2</text><text x="307" y="313">3</text>
    <text x="373" y="313">4</text><text x="439" y="313">5</text><text x="505" y="313">6</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 198 308 L 216 308" marker-end="url(#arrow)"/>
    <path d="M 264 308 L 282 308" marker-end="url(#arrow)"/>
    <path d="M 330 308 L 348 308" marker-end="url(#arrow)"/>
    <path d="M 396 308 L 414 308" marker-end="url(#arrow)"/>
    <path d="M 462 308 L 480 308" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="175" y="340">left null</text><text x="241" y="340">left null</text><text x="307" y="340">left null</text>
    <text x="373" y="340">left null</text><text x="439" y="340">left null</text><text x="505" y="340">left null</text>
  </g>
  <text x="40" y="364" fill="#1a2026" font-size="13">The splice only relinks: 4 adopts 5-6, the 2-subtree swings to 1.right, 1.left is</text>
  <text x="40" y="382" fill="#1a2026" font-size="13">nulled, and the same three writes at 2 finish the spine <tspan fill="#4169E1" font-weight="600">1-2-3-4-5-6</tspan>.</text>
</svg>
