<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="600" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
  </defs>
  <text x="20" y="24" fill="#1a2026" font-weight="600">beginWord = "hit", endWord = "cog" - BFS levels of the one-letter-difference graph</text>
  <!-- level bands -->
  <rect x="30" y="38" width="420" height="56" fill="#f4f6f9"/>
  <rect x="30" y="102" width="420" height="56" fill="#ffffff"/>
  <rect x="30" y="166" width="420" height="56" fill="#f4f6f9"/>
  <rect x="30" y="230" width="420" height="56" fill="#ffffff"/>
  <rect x="30" y="294" width="420" height="50" fill="#f4f6f9"/>
  <g fill="#8a94a0" font-size="10.5">
    <text x="462" y="70">dist 0</text>
    <text x="462" y="134">dist 1</text>
    <text x="462" y="198">dist 2</text>
    <text x="462" y="262">dist 3</text>
    <text x="462" y="324">dist 4</text>
  </g>
  <!-- edges -->
  <g stroke="#8a94a0" stroke-width="1.3" fill="none">
    <line x1="240" y1="84" x2="240" y2="110" marker-end="url(#arr)"/>
    <line x1="230" y1="140" x2="170" y2="170" marker-end="url(#arr)"/>
    <line x1="250" y1="140" x2="310" y2="170" marker-end="url(#arr)"/>
    <line x1="170" y1="200" x2="170" y2="238" marker-end="url(#arr)"/>
    <line x1="310" y1="200" x2="310" y2="238" marker-end="url(#arr)"/>
    <line x1="170" y1="268" x2="225" y2="300" marker-end="url(#arr)"/>
    <line x1="310" y1="268" x2="255" y2="300" marker-end="url(#arr)"/>
  </g>
  <!-- nodes -->
  <g stroke="#1a2026" stroke-width="1.5" fill="#ffffff">
    <rect x="205" y="58" width="70" height="26" rx="13"/>
    <rect x="205" y="122" width="70" height="26" rx="13"/>
    <rect x="135" y="186" width="70" height="26" rx="13"/>
    <rect x="275" y="186" width="70" height="26" rx="13"/>
    <rect x="135" y="250" width="70" height="26" rx="13"/>
    <rect x="275" y="250" width="70" height="26" rx="13"/>
    <rect x="205" y="310" width="70" height="26" rx="13" fill="#e9eefb" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="12.5">
    <text x="240" y="76">hit</text>
    <text x="240" y="140">hot</text>
    <text x="170" y="204">dot</text>
    <text x="310" y="204">lot</text>
    <text x="170" y="268">dog</text>
    <text x="310" y="268">log</text>
    <text x="240" y="328" fill="#1a2026">cog</text>
  </g>
  <text x="20" y="344" fill="#5b6470" font-size="11.5">The DFS reconstruction follows only recorded level+1 edges, so both root-to-cog walks are shortest ladders.</text>
</svg>
