<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
  </defs>
  <text x="20" y="24" fill="#1a2026" font-weight="600">preorder = [3,9,20,15,7], inorder = [9,3,15,20,7] - the first preorder value roots the subtree</text>
  <!-- preorder row -->
  <text x="30" y="66" fill="#5b6470" font-size="11.5">preorder</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="120" y="48" width="48" height="32"/><rect x="168" y="48" width="48" height="32"/><rect x="216" y="48" width="48" height="32"/><rect x="264" y="48" width="48" height="32"/><rect x="312" y="48" width="48" height="32"/>
  </g>
  <rect x="120" y="48" width="48" height="32" fill="#4169E1" fill-opacity="0.85" stroke="#1a2026" stroke-width="1.4"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="144" y="69" fill="#ffffff">3</text><text x="192" y="69">9</text><text x="240" y="69">20</text><text x="288" y="69">15</text><text x="336" y="69">7</text>
  </g>
  <path d="M 144 92 L 144 104" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="156" y="102" fill="#4169E1" font-size="11">cursor: root of the whole tree</text>
  <text x="392" y="66" fill="#5b6470" font-size="11">the cursor then feeds 9 (left subtree),</text>
  <text x="392" y="82" fill="#5b6470" font-size="11">then 20, 15, 7 (right subtree)</text>
  <!-- inorder row -->
  <text x="30" y="150" fill="#5b6470" font-size="11.5">inorder</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="120" y="132" width="48" height="32"/><rect x="168" y="132" width="48" height="32"/><rect x="216" y="132" width="48" height="32"/><rect x="264" y="132" width="48" height="32"/><rect x="312" y="132" width="48" height="32"/>
  </g>
  <rect x="168" y="132" width="48" height="32" fill="#4169E1" fill-opacity="0.85" stroke="#1a2026" stroke-width="1.4"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="144" y="153">9</text><text x="192" y="153" fill="#ffffff">3</text><text x="240" y="153">15</text><text x="288" y="153">20</text><text x="336" y="153">7</text>
  </g>
  <!-- brackets -->
  <path d="M 120 172 L 120 182 L 168 182 L 168 172" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="144" y="198" fill="#4169E1" font-size="11" text-anchor="middle">left range</text>
  <path d="M 216 172 L 216 182 L 360 182 L 360 172" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="288" y="198" fill="#4169E1" font-size="11" text-anchor="middle">right range</text>
  <text x="392" y="150" fill="#5b6470" font-size="11">the index map finds 3 at inorder</text>
  <text x="392" y="166" fill="#5b6470" font-size="11">position 1 in O(1), splitting the</text>
  <text x="392" y="182" fill="#5b6470" font-size="11">range into [9] and [15,20,7]</text>
  <!-- tree -->
  <g stroke="#8a94a0" stroke-width="1.3" fill="none">
    <line x1="180" y1="256" x2="130" y2="292" marker-end="url(#arr)"/>
    <line x1="180" y1="256" x2="230" y2="292" marker-end="url(#arr)"/>
    <line x1="230" y1="292" x2="205" y2="312"/>
    <line x1="230" y1="292" x2="255" y2="312"/>
  </g>
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <circle cx="180" cy="240" r="17"/>
    <circle cx="130" cy="296" r="15"/>
    <circle cx="230" cy="296" r="15" fill="#e9eefb"/>
    <circle cx="205" cy="312" r="13"/>
    <circle cx="255" cy="312" r="13"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="12">
    <text x="180" y="245">3</text>
    <text x="130" y="301">9</text>
    <text x="230" y="301">20</text>
    <text x="205" y="317">15</text>
    <text x="255" y="317">7</text>
  </g>
  <text x="300" y="245" fill="#5b6470" font-size="11">recursion consumes preorder left to right</text>
  <text x="300" y="261" fill="#5b6470" font-size="11">and shrinks inorder ranges (low, high)</text>
</svg>
