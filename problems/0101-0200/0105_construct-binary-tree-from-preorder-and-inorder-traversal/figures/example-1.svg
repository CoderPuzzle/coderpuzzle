    <line x1="230" y1="53" x2="310" y2="79"/>
    <line x1="310" y1="113" x2="250" y2="139"/>
    <line x1="310" y1="113" x2="370" y2="139"/>
  </g>
  <!-- nodes: root is the first preorder value -->
  <circle cx="150" cy="96" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="310" cy="96" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
