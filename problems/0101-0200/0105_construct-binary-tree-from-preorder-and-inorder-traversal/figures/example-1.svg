  <text x="36" y="228" fill="#5c6b76" font-size="12.5">preorder</text>
  <g stroke="#b9c4cd" fill="#ffffff">
    <rect x="120" y="210" width="34" height="28" stroke="#4169E1" fill="#e5ebfa"/>
    <rect x="158" y="210" width="34" height="28"/>
    <rect x="196" y="210" width="34" height="28"/>
    <rect x="234" y="210" width="34" height="28"/>
    <rect x="272" y="210" width="34" height="28"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-size="13">
    <text x="137" y="228">3</text><text x="175" y="228">9</text><text x="213" y="228">20</text><text x="251" y="228">15</text><text x="289" y="228">7</text>
  </g>
  <text x="44" y="270" fill="#5c6b76" font-size="12.5">inorder</text>
