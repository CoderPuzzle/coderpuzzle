<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="392" fill="#ffffff"/>
  <!-- tree = [1,2,2,3,3,null,null,4,4]; nodes r=19; h labels sit at (cx, cy+38); heights are bottom-up, an absent child counts 0 -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="305" y1="67" x2="225" y2="125"/>
    <line x1="335" y1="67" x2="415" y2="125"/>
    <line x1="199" y1="151" x2="161" y2="201"/>
    <line x1="221" y1="151" x2="259" y2="201"/>
    <line x1="141" y1="233" x2="114" y2="279"/>
    <line x1="159" y1="233" x2="186" y2="279"/>
  </g>
  <circle cx="320" cy="56" r="19" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="210" cy="136" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="430" cy="136" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="150" cy="216" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="270" cy="216" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="105" cy="296" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="195" cy="296" r="19" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="320" y="61">1</text>
    <text x="210" y="141">2</text>
    <text x="430" y="141">2</text>
    <text x="150" y="221">3</text>
    <text x="270" y="221">3</text>
    <text x="105" y="301">4</text>
    <text x="195" y="301">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="210" y="174">h = 3</text>
    <text x="430" y="174">h = 1</text>
    <text x="150" y="254">h = 2</text>
    <text x="270" y="254">h = 1</text>
    <text x="105" y="334">h = 1</text>
    <text x="195" y="334">h = 1</text>
  </g>
  <text x="320" y="94" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">h = -1</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="40" y="48">empty child counts 0,</text>
    <text x="40" y="64">a leaf stores 1,</text>
    <text x="40" y="80">a node stores 1 + max(L, R).</text>
  </g>
  <g font-size="12.5">
    <text x="470" y="48" fill="#5c6b76">h(L) = 3, h(R) = 1:</text>
    <text x="470" y="66" fill="#4169E1" font-weight="600">diff 2 &gt; 1 → store -1</text>
  </g>
  <text x="40" y="360" fill="#1a2026" font-size="13">Bottom up, the leaves store 1 and the left spine climbs to height 3; at the root</text>
  <text x="40" y="378" fill="#1a2026" font-size="13">the children differ by 2, so -1 is born there and <tspan fill="#4169E1" font-weight="600">height(root) = -1</tspan> says false.</text>
</svg>
