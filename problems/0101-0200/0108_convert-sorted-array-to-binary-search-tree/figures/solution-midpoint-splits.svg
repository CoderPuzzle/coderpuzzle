<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="412" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [-10,-3,0,5,9]; cells 52x40 at x=178+58i, y=36; bracket spans mark each segment's [lo..hi]; tree nodes r=17 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="178" y="36" width="52" height="40"/><rect x="236" y="36" width="52" height="40"/>
    <rect x="352" y="36" width="52" height="40"/><rect x="410" y="36" width="52" height="40"/>
  </g>
  <rect x="294" y="36" width="52" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600">
    <text x="204" y="61" fill="#1a2026">-10</text><text x="262" y="61" fill="#1a2026">-3</text>
    <text x="320" y="61" fill="#4169E1">0</text><text x="378" y="61" fill="#1a2026">5</text>
    <text x="436" y="61" fill="#1a2026">9</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="204" y="96">0</text><text x="262" y="96">1</text><text x="320" y="96">2</text>
    <text x="378" y="96">3</text><text x="436" y="96">4</text>
  </g>
  <!-- segment spans -->
  <g fill="none" stroke="#4169E1" stroke-width="1.5">
    <path d="M 204 104 L 204 110 L 436 110 L 436 104"/>
    <path d="M 204 146 L 204 152 L 262 152 L 262 146"/>
    <path d="M 378 146 L 378 152 L 436 152 L 436 146"/>
  </g>
  <text x="320" y="128" text-anchor="middle" fill="#5c6b76" font-size="12.5">[0..4]: mid = (0+4+1)//2 = 2 → <tspan fill="#4169E1" font-weight="600">root 0</tspan></text>
  <text x="233" y="170" text-anchor="middle" fill="#5c6b76" font-size="12">mid = 1 → <tspan fill="#4169E1" font-weight="600">-3</tspan> (second middle)</text>
  <text x="407" y="170" text-anchor="middle" fill="#5c6b76" font-size="12">mid = 4 → <tspan fill="#4169E1" font-weight="600">9</tspan> (second middle)</text>
  <g stroke="#4169E1" stroke-width="1.5" fill="none">
    <path d="M 320 136 L 320 200" marker-end="url(#arrow)"/>
    <path d="M 233 178 L 234 262" marker-end="url(#arrow)"/>
    <path d="M 407 178 L 406 262" marker-end="url(#arrow)"/>
  </g>
  <!-- assembled tree: 0(-3(-10,-), 9(5,-)) -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="306" y1="235" x2="249" y2="275"/>
    <line x1="334" y1="235" x2="391" y2="275"/>
    <line x1="224" y1="298" x2="196" y2="327"/>
    <line x1="394" y1="298" x2="366" y2="327"/>
  </g>
  <circle cx="320" cy="225" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <circle cx="235" cy="285" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="405" cy="285" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="185" cy="340" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="355" cy="340" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600">
    <text x="320" y="230" fill="#4169E1">0</text>
    <text x="235" y="290" fill="#1a2026">-3</text>
    <text x="405" y="290" fill="#1a2026">9</text>
    <text x="185" y="345" fill="#1a2026">-10</text>
    <text x="355" y="345" fill="#1a2026">5</text>
  </g>
  <text x="40" y="386" fill="#1a2026" font-size="13">Every segment roots at its middle - [0..4] at 0, [-10,-3] at -3, [5,9] at 9 -</text>
  <text x="40" y="404" fill="#1a2026" font-size="13">and even segments take the second middle, so the balanced tree is <tspan fill="#4169E1" font-weight="600">[0,-3,9,-10,null,5]</tspan>.</text>
</svg>
