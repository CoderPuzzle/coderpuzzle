<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- tree = [-10,9,20,null,null,15,7]; at node 20's combine the gain stack is [9,15,7] bottom to top; bend 15+20+7=42, push 20+max(15,7)=35 -->
  <text x="178" y="34" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">node 20 combines</text>
  <g stroke="#42525e" stroke-width="1.5">
    <path d="M 107 86 L 75 124"/><path d="M 133 86 L 165 124"/>
    <path d="M 168 158 L 148 192"/><path d="M 188 158 L 208 192"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="120" cy="70" r="21"/><circle cx="62" cy="140" r="21"/>
    <circle cx="138" cy="210" r="21"/><circle cx="218" cy="210" r="21"/>
  </g>
  <circle cx="178" cy="140" r="21" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="120" y="74.5">-10</text><text x="62" y="144.5">9</text><text x="178" y="144.5">20</text>
    <text x="138" y="214.5">15</text><text x="218" y="214.5">7</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="62" y="246">gain 9</text><text x="138" y="246">gain 15</text><text x="218" y="246">gain 7</text>
  </g>
  <!-- gain stack: dashed box = the gain about to be pushed back -->
  <text x="335" y="48" text-anchor="middle" fill="#5c6b76" font-size="12.5">gain stack</text>
  <text x="272" y="82" text-anchor="end" fill="#9aa7b2" font-size="11">pushed for -10</text>
  <rect x="280" y="60" width="110" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="335" y="82" text-anchor="middle" fill="#4169E1" font-size="14" font-weight="600">35</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="280" y="98" width="110" height="34"/>
    <rect x="280" y="132" width="110" height="34"/>
    <rect x="280" y="166" width="110" height="34"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="335" y="120"><tspan font-weight="600" fill="#1a2026">7</tspan><tspan fill="#5c6b76"> · right</tspan></text>
    <text x="335" y="154"><tspan font-weight="600" fill="#1a2026">15</tspan><tspan fill="#5c6b76"> · left</tspan></text>
    <text x="335" y="188"><tspan font-weight="600" fill="#1a2026">9</tspan><tspan fill="#5c6b76"> · for -10</tspan></text>
  </g>
  <text x="335" y="218" text-anchor="middle" fill="#5c6b76" font-size="12.5">at node 20's combine</text>
  <!-- pops into the combine box -->
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 392 115 L 436 130" marker-end="url(#arrow)"/>
    <path d="M 392 149 L 436 152" marker-end="url(#arrow)"/>
  </g>
  <rect x="440" y="106" width="224" height="104" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g font-size="12.5" fill="#1a2026">
    <text x="456" y="130">clamp at 0: 15 and 7 unchanged</text>
    <text x="456" y="152">bend 15 + 20 + 7 = <tspan fill="#4169E1" font-weight="600">42</tspan></text>
    <text x="456" y="174" fill="#4169E1" font-weight="600">best = 42</text>
    <text x="456" y="196">push 20 + max(15, 7) = 35</text>
  </g>
  <path d="M 480 104 Q 460 46 396 70" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 276 77 Q 200 40 142 68" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <text x="340" y="284" text-anchor="middle" fill="#1a2026" font-size="13">At node 20's combine the gain stack pops right 7 then left 15; bend 15 + 20 + 7 = <tspan fill="#4169E1" font-weight="600">42</tspan></text>
  <text x="340" y="302" text-anchor="middle" fill="#1a2026" font-size="13">becomes the best, and the returned gain 20 + max(15, 7) = <tspan fill="#4169E1" font-weight="600">35</tspan> heads to -10.</text>
</svg>
