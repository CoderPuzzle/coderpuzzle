<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- path edges 2 -> 1 -> 3 -->
  <g stroke="#4169E1" stroke-width="3">
    <line x1="110" y1="130" x2="200" y2="50"/>
    <line x1="200" y1="50" x2="290" y2="130"/>
  </g>
  <!-- nodes -->
  <circle cx="200" cy="50" r="18" fill="#4169E1" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="110" cy="130" r="18" fill="#4169E1" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="290" cy="130" r="18" fill="#4169E1" stroke="#1a2026" stroke-width="1.6"/>
  <g fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="200" y="55">1</text>
    <text x="110" y="135">2</text>
    <text x="290" y="135">3</text>
  </g>
  <text x="200" y="180" text-anchor="middle" fill="#5c6b76" font-size="12.5">path 2 -&gt; 1 -&gt; 3, sum = 2 + 1 + 3 = 6</text>
</svg>
