<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 242" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- edges -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="250" y1="58" x2="150" y2="92"/>
    <line x1="250" y1="58" x2="350" y2="92"/>
    <line x1="350" y1="128" x2="270" y2="162"/>
    <line x1="350" y1="128" x2="430" y2="162"/>
  </g>
  <!-- path edges 15 -> 20 -> 7 -->
  <g stroke="#4169E1" stroke-width="3">
    <line x1="270" y1="180" x2="350" y2="110"/>
    <line x1="350" y1="110" x2="430" y2="180"/>
  </g>
  <!-- nodes -->
  <circle cx="250" cy="40" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="150" cy="110" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="350" cy="110" r="18" fill="#4169E1" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="270" cy="180" r="18" fill="#4169E1" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="430" cy="180" r="18" fill="#4169E1" stroke="#1a2026" stroke-width="1.6"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="250" y="45">-10</text>
    <text x="150" y="115">9</text>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="350" y="115">20</text>
    <text x="270" y="185">15</text>
    <text x="430" y="185">7</text>
  </g>
  <text x="290" y="226" text-anchor="middle" fill="#5c6b76" font-size="12.5">path 15 -&gt; 20 -&gt; 7, sum = 15 + 20 + 7 = 42</text>
</svg>
