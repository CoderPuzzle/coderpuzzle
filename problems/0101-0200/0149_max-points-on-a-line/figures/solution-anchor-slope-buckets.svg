<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="320" fill="#ffffff"/>
  <!-- points = [[1,1],[3,2],[5,3],[4,1],[2,3],[1,4]]; 40 px cells, origin (60,240);
       accent line y = -x + 5 through the four (1,-1) points of anchor (3,2) -->
  <g stroke="#dbe4fb" stroke-width="1">
    <path d="M 100 40 V 240"/><path d="M 140 40 V 240"/><path d="M 180 40 V 240"/><path d="M 220 40 V 240"/><path d="M 260 40 V 240"/><path d="M 300 40 V 240"/>
    <path d="M 60 40 H 300"/><path d="M 60 80 H 300"/><path d="M 60 120 H 300"/><path d="M 60 160 H 300"/><path d="M 60 200 H 300"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2">
    <path d="M 48 240 H 314"/><path d="M 60 252 V 32"/>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="10">
    <text x="50" y="258">0</text>
    <text x="48" y="204">1</text><text x="48" y="164">2</text><text x="48" y="124">3</text><text x="48" y="84">4</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="100" y="258">1</text><text x="140" y="258">2</text><text x="180" y="258">3</text><text x="220" y="258">4</text><text x="260" y="258">5</text>
  </g>
  <path d="M 100 80 L 260 240" stroke="#4169E1" stroke-width="2.5" fill="none"/>
  <circle cx="180" cy="160" r="10" fill="none" stroke="#4169E1" stroke-width="1.3" stroke-dasharray="3 2"/>
  <circle cx="220" cy="200" r="5.5" fill="#4169E1"/>
  <circle cx="140" cy="120" r="5.5" fill="#4169E1"/>
  <circle cx="180" cy="160" r="5.5" fill="#4169E1"/>
  <circle cx="100" cy="80" r="5.5" fill="#4169E1"/>
  <circle cx="100" cy="200" r="5" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="260" cy="120" r="5" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <g font-size="11">
    <text x="100" y="222" text-anchor="middle" fill="#5c6b76">(1,1)</text>
    <text x="270" y="124" text-anchor="start" fill="#5c6b76">(5,3)</text>
    <text x="170" y="180" text-anchor="end" fill="#4169E1">(3,2)</text>
    <text x="232" y="204" text-anchor="start" fill="#4169E1">(4,1)</text>
    <text x="150" y="108" text-anchor="start" fill="#4169E1">(2,3)</text>
    <text x="104" y="62" text-anchor="middle" fill="#4169E1">(1,4)</text>
  </g>
  <text x="340" y="56" fill="#5c6b76" font-size="12.5">anchor (3, 2): reduced (dx, dy) buckets</text>
  <text x="340" y="92" fill="#4169E1" font-size="14" font-weight="600">(1, -1) × 3</text>
  <text x="340" y="110" fill="#5c6b76" font-size="11.5">from (4, 1), (2, 3), (1, 4)</text>
  <text x="340" y="144" fill="#1a2026" font-size="14" font-weight="600">(2, 1) × 1</text>
  <text x="340" y="162" fill="#5c6b76" font-size="11.5">from (5, 3)</text>
  <text x="340" y="194" fill="#5c6b76" font-size="11.5">(-1, 1) and (-2, 2) flip to (1, -1) when dx &lt; 0</text>
  <text x="340" y="228" fill="#1a2026" font-size="14">best line through the anchor: 1 + <tspan fill="#4169E1" font-weight="600">3</tspan> = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="340" y="284">For anchor (3, 2) the directions to (4, 1), (2, 3), (1, 4) all reduce to (1, -1) —</text>
    <text x="340" y="304">so 1 + 3 = <tspan fill="#4169E1" font-weight="600">four collinear points</tspan> on the slope -1 line, the answer.</text>
  </g>
</svg>
