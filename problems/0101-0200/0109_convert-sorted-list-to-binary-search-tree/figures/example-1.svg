<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- sorted linked list -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="70" cy="40" r="17"/>
    <circle cx="152" cy="40" r="17"/>
    <circle cx="234" cy="40" r="17"/>
    <circle cx="316" cy="40" r="17"/>
    <circle cx="398" cy="40" r="17"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="91" y1="40" x2="131" y2="40" marker-end="url(#arrow)"/>
    <line x1="173" y1="40" x2="213" y2="40" marker-end="url(#arrow)"/>
    <line x1="255" y1="40" x2="295" y2="40" marker-end="url(#arrow)"/>
    <line x1="337" y1="40" x2="377" y2="40" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="70" y="45">-10</text>
    <text x="152" y="45">-3</text>
    <text x="234" y="45">0</text>
    <text x="316" y="45">5</text>
    <text x="398" y="45">9</text>
  </g>
  <!-- conversion -->
  <line x1="234" y1="62" x2="234" y2="126" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrowA)"/>
  <!-- resulting height-balanced BST -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="234" y1="167" x2="150" y2="198"/>
    <line x1="234" y1="167" x2="318" y2="198"/>
    <line x1="150" y1="232" x2="105" y2="261"/>
    <line x1="318" y1="232" x2="363" y2="261"/>
  </g>
  <g fill="#e5ebfa" stroke="#1a2026" stroke-width="1.6">
    <circle cx="234" cy="150" r="17"/>
    <circle cx="150" cy="215" r="17"/>
    <circle cx="318" cy="215" r="17"/>
    <circle cx="105" cy="278" r="17"/>
    <circle cx="363" cy="278" r="17"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="13">
    <text x="234" y="155">0</text>
    <text x="150" y="220">-3</text>
    <text x="318" y="220">9</text>
    <text x="105" y="283">-10</text>
    <text x="363" y="283">5</text>
  </g>
</svg>
