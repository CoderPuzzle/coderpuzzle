<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="404" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "leetcode", trie of {leet, code}; spines x=90/250, node rows y = 100 + 46i, r=13; strip cells 56x34 at (96,304) -->
  <text x="170" y="30" text-anchor="middle" fill="#5c6b76" font-size="11">root</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="170" y1="52" x2="90" y2="100"/>
    <line x1="170" y1="52" x2="250" y2="100"/>
    <line x1="90" y1="100" x2="90" y2="146"/>
    <line x1="90" y1="146" x2="90" y2="192"/>
    <line x1="90" y1="192" x2="90" y2="238"/>
    <line x1="250" y1="100" x2="250" y2="146"/>
    <line x1="250" y1="146" x2="250" y2="192"/>
    <line x1="250" y1="192" x2="250" y2="238"/>
  </g>
  <!-- walk arrows along each spine -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 156 60 L 108 90" marker-end="url(#arrowB)"/>
    <path d="M 90 116 V 128" marker-end="url(#arrowB)"/>
    <path d="M 90 162 V 174" marker-end="url(#arrowB)"/>
    <path d="M 90 208 V 220" marker-end="url(#arrowB)"/>
    <path d="M 184 60 L 232 90" marker-end="url(#arrowB)"/>
    <path d="M 250 116 V 128" marker-end="url(#arrowB)"/>
    <path d="M 250 162 V 174" marker-end="url(#arrowB)"/>
    <path d="M 250 208 V 220" marker-end="url(#arrowB)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="170" cy="52" r="13" fill="#f0f3f7"/>
    <circle cx="90" cy="100" r="13"/><circle cx="90" cy="146" r="13"/><circle cx="90" cy="192" r="13"/>
    <circle cx="250" cy="100" r="13"/><circle cx="250" cy="146" r="13"/><circle cx="250" cy="192" r="13"/>
  </g>
  <circle cx="90" cy="238" r="13" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="250" cy="238" r="13" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="90" cy="238" r="17.5" fill="none" stroke="#4169E1" stroke-width="1.2"/>
  <circle cx="250" cy="238" r="17.5" fill="none" stroke="#4169E1" stroke-width="1.2"/>
  <g text-anchor="middle" font-weight="600">
    <text x="90" y="105">l</text><text x="90" y="151">e</text><text x="90" y="197">e</text><text x="90" y="243" fill="#4169E1">t</text>
    <text x="250" y="105">c</text><text x="250" y="151">o</text><text x="250" y="197">d</text><text x="250" y="243" fill="#4169E1">e</text>
  </g>
  <text x="90" y="286" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">marks 4</text>
  <text x="250" y="286" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">marks 8 = n &#8594; true</text>
  <text x="380" y="286" fill="#5c6b76" font-size="11.5">ringed node = a word ends</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="96" y="304" width="56" height="34"/><rect x="152" y="304" width="56" height="34"/><rect x="208" y="304" width="56" height="34"/><rect x="264" y="304" width="56" height="34"/>
    <rect x="320" y="304" width="56" height="34"/><rect x="376" y="304" width="56" height="34"/><rect x="432" y="304" width="56" height="34"/><rect x="488" y="304" width="56" height="34"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="124" y="326">l</text><text x="180" y="326">e</text><text x="236" y="326">e</text><text x="292" y="326">t</text>
    <text x="348" y="326">c</text><text x="404" y="326">o</text><text x="460" y="326">d</text><text x="516" y="326">e</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="96" y="356" fill="#4169E1" font-weight="600">0</text>
    <text x="152" y="356" fill="#9aa7b2">1</text>
    <text x="208" y="356" fill="#9aa7b2">2</text>
    <text x="264" y="356" fill="#9aa7b2">3</text>
    <text x="320" y="356" fill="#4169E1" font-weight="600">4</text>
    <text x="376" y="356" fill="#9aa7b2">5</text>
    <text x="432" y="356" fill="#9aa7b2">6</text>
    <text x="488" y="356" fill="#9aa7b2">7</text>
    <text x="544" y="356" fill="#4169E1" font-weight="600">8</text>
  </g>
  <circle cx="544" cy="352" r="9" fill="none" stroke="#4169E1" stroke-width="1.3"/>
  <text x="320" y="380" text-anchor="middle" fill="#1a2026" font-size="13">0 walks l-e-e-t to a ringed word end and marks 4; 4 walks c-o-d-e and marks <tspan fill="#4169E1" font-weight="600">8 = n</tspan>,</text>
  <text x="320" y="398" text-anchor="middle" fill="#1a2026" font-size="13">so 'leetcode' segments &#8212; gray positions 1, 2, 3, 5, 6, 7 never start a walk.</text>
</svg>
