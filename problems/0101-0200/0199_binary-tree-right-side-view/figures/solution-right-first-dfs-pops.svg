<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 332" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="332" fill="#ffffff"/>
  <!-- root = [1,2,3,null,5,null,4]; nodes r=18; pop order 1,3,4,2,5; recorded depths 0,1,2 hold 1,3,4 -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="180" y1="70" x2="120" y2="150"/><line x1="180" y1="70" x2="260" y2="150"/>
    <line x1="120" y1="150" x2="180" y2="230"/><line x1="260" y1="150" x2="320" y2="230"/>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5">
    <circle cx="120" cy="150" r="18"/><circle cx="180" cy="230" r="18"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <circle cx="180" cy="70" r="18"/><circle cx="260" cy="150" r="18"/><circle cx="320" cy="230" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="180" y="75" fill="#4169E1">1</text><text x="120" y="155" fill="#9aa7b2">2</text>
    <text x="260" y="155" fill="#4169E1">3</text><text x="180" y="235" fill="#9aa7b2">5</text><text x="320" y="235" fill="#4169E1">4</text>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="180" y="104" fill="#4169E1">pop 1</text>
    <text x="260" y="184" fill="#4169E1">pop 2</text>
    <text x="320" y="264" fill="#4169E1">pop 3</text>
    <text x="120" y="184" fill="#9aa7b2">pop 4</text>
    <text x="180" y="264" fill="#9aa7b2">pop 5</text>
  </g>
  <g fill="#9aa7b2" font-size="11">
    <text x="40" y="75">depth 0</text><text x="40" y="155">depth 1</text><text x="40" y="235">depth 2</text>
  </g>
  <text x="388" y="64" fill="#5c6b76" font-size="12.5">the five pops</text>
  <g font-size="13" fill="#1a2026">
    <text x="388" y="90">pop (1, 0) — depth 0 is new: record <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="388" y="120">pop (3, 1) — depth 1 is new: record <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="388" y="150">pop (4, 2) — depth 2 is new: record <tspan fill="#4169E1" font-weight="600">4</tspan></text>
    <text x="388" y="180" fill="#9aa7b2">pop (2, 1) — depth 1 seen: skip</text>
    <text x="388" y="210" fill="#9aa7b2">pop (5, 2) — depth 2 seen: skip</text>
  </g>
  <text x="388" y="240" fill="#5c6b76" font-size="12">record only when depth == len(view)</text>
  <text x="340" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Left pushed before right, so the right child pops first: 1, 3, 4 are each</text>
  <text x="340" y="316" text-anchor="middle" fill="#1a2026" font-size="13">the first touch at a new depth; the later left-side touches 2 and 5 add nothing.</text>
</svg>
