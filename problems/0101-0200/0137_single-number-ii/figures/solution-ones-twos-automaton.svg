<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 368" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="368" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [2,2,3,2] = 10,10,11,10; per-bit state of (ones,twos) after each element:
       bit 1 rides ones -> twos -> 00 -> ones (the three 2s), bit 0 holds the lone 3;
       final ones = 11 = 3; chips 64x24 centred at x 330 (bit 1) and 510 (bit 0) -->
  <text x="202" y="71" text-anchor="end" fill="#5c6b76" font-size="12.5">nums =</text>
  <g stroke="#1a2026" stroke-width="1.3" fill="#ffffff">
    <rect x="210" y="46" width="60" height="40"/><rect x="270" y="46" width="60" height="40"/><rect x="330" y="46" width="60" height="40"/><rect x="390" y="46" width="60" height="40"/>
  </g>
  <g text-anchor="middle">
    <text x="240" y="64" font-weight="600" fill="#1a2026">2</text><text x="300" y="64" font-weight="600" fill="#1a2026">2</text><text x="360" y="64" font-weight="600" fill="#1a2026">3</text><text x="420" y="64" font-weight="600" fill="#1a2026">2</text>
    <text x="240" y="79" fill="#9aa7b2" font-size="10">10</text><text x="300" y="79" fill="#9aa7b2" font-size="10">10</text><text x="360" y="79" fill="#9aa7b2" font-size="10">11</text><text x="420" y="79" fill="#9aa7b2" font-size="10">10</text>
  </g>
  <text x="330" y="122" text-anchor="middle" fill="#5c6b76" font-size="12.5">bit 1 (2's place)</text>
  <text x="510" y="122" text-anchor="middle" fill="#5c6b76" font-size="12.5">bit 0 (1's place)</text>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="232" y="174">after 1st 2 (10)</text>
    <text x="232" y="212">after 2nd 2 (10)</text>
    <text x="232" y="250">after 3 (11)</text>
    <text x="232" y="288">after 3rd 2 (10)</text>
  </g>
  <g stroke="#1a2026" stroke-width="1.2">
    <rect x="298" y="158" width="64" height="24" rx="12" fill="#dbe4fb"/>
    <rect x="478" y="158" width="64" height="24" rx="12" fill="#ffffff"/>
    <rect x="298" y="196" width="64" height="24" rx="12" fill="#f0f3f7"/>
    <rect x="478" y="196" width="64" height="24" rx="12" fill="#ffffff"/>
    <rect x="298" y="234" width="64" height="24" rx="12" fill="#ffffff"/>
    <rect x="478" y="234" width="64" height="24" rx="12" fill="#dbe4fb"/>
    <rect x="298" y="272" width="64" height="24" rx="12" fill="#dbe4fb"/>
    <rect x="478" y="272" width="64" height="24" rx="12" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <text x="330" y="174" fill="#4169E1">ones</text><text x="510" y="174" fill="#9aa7b2">00</text>
    <text x="330" y="212" fill="#5c6b76">twos</text><text x="510" y="212" fill="#9aa7b2">00</text>
    <text x="330" y="250" fill="#9aa7b2">00</text><text x="510" y="250" fill="#4169E1">ones</text>
    <text x="330" y="288" fill="#4169E1">ones</text><text x="510" y="288" fill="#4169E1">ones</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.3" fill="none">
    <path d="M 330 184 V 193" marker-end="url(#arrow)"/>
    <path d="M 330 222 V 231" marker-end="url(#arrow)"/>
    <path d="M 330 260 V 269" marker-end="url(#arrow)"/>
  </g>
  <text x="556" y="288" fill="#4169E1" font-size="12.5" font-weight="600">ones = 11 = 3</text>
  <text x="330" y="318" text-anchor="middle" fill="#9aa7b2" font-size="11.5">higher bits stay 00 throughout</text>
  <text x="330" y="340" text-anchor="middle" fill="#1a2026" font-size="13">Bit 1 rides the mod-3 cycle 00 → ones → twos → 00 across the three 2s;</text>
  <text x="330" y="360" text-anchor="middle" fill="#1a2026" font-size="13">bit 0 keeps the lone 3 — the scan ends with ones = 11 = <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
