<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- edges [0,1,2],[1,2,7],[2,3,7],[3,4,4]; states (node, excluded); crossing 1 to 2 rides the 7-edge free; settled (4,1) = 2+0+7+4 = 13 -->
  <text x="48" y="48" fill="#5c6b76" font-size="12.5">layer 0: exclusion unspent</text>
  <g stroke="#9aa7b2" stroke-width="1.5">
    <line x1="240" y1="90" x2="320" y2="90"/>
    <line x1="360" y1="90" x2="440" y2="90"/>
    <line x1="480" y1="90" x2="560" y2="90"/>
  </g>
  <line x1="120" y1="90" x2="200" y2="90" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-size="12.5">
    <text x="160" y="84" fill="#4169E1" font-weight="600">2</text>
    <text x="280" y="84" fill="#5c6b76">7</text>
    <text x="400" y="84" fill="#5c6b76">7</text>
    <text x="520" y="84" fill="#5c6b76">4</text>
  </g>
  <circle cx="100" cy="90" r="20" fill="#4169E1"/>
  <text x="100" y="95" text-anchor="middle" fill="#ffffff" font-weight="600">0</text>
  <circle cx="220" cy="90" r="20" fill="#4169E1"/>
  <text x="220" y="95" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <circle cx="340" cy="90" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="340" y="95" text-anchor="middle" fill="#1a2026">2</text>
  <circle cx="460" cy="90" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="460" y="95" text-anchor="middle" fill="#1a2026">3</text>
  <circle cx="580" cy="90" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="580" y="95" text-anchor="middle" fill="#1a2026">4</text>
  <text x="220" y="128" text-anchor="middle" fill="#5c6b76" font-size="11.5">dist 2</text>
  <text x="48" y="198" fill="#5c6b76" font-size="12.5">layer 1: exclusion spent</text>
  <path d="M 240 96 L 326 224" stroke="#4169E1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="356" y="164" fill="#1a2026" font-size="12.5">cross 1 &#8594; 2 rides free &#8212;</text>
  <text x="356" y="182" fill="#1a2026" font-size="12.5">weight 7 excluded</text>
  <text x="356" y="204" fill="#9aa7b2" font-size="12">any single edge can be the free one</text>
  <g stroke="#9aa7b2" stroke-width="1.5">
    <line x1="120" y1="240" x2="200" y2="240"/>
    <line x1="240" y1="240" x2="320" y2="240"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="360" y1="240" x2="440" y2="240"/>
    <line x1="480" y1="240" x2="560" y2="240"/>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="160" y="234" fill="#5c6b76">2</text>
    <text x="280" y="234" fill="#5c6b76">7</text>
    <text x="400" y="234" fill="#4169E1" font-weight="600">7</text>
    <text x="520" y="234" fill="#4169E1" font-weight="600">4</text>
  </g>
  <circle cx="100" cy="240" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="100" y="245" text-anchor="middle" fill="#1a2026">0</text>
  <circle cx="220" cy="240" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="220" y="245" text-anchor="middle" fill="#1a2026">1</text>
  <circle cx="340" cy="240" r="20" fill="#4169E1"/>
  <text x="340" y="245" text-anchor="middle" fill="#ffffff" font-weight="600">2</text>
  <circle cx="460" cy="240" r="20" fill="#4169E1"/>
  <text x="460" y="245" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <circle cx="580" cy="240" r="20" fill="#4169E1"/>
  <text x="580" y="245" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  <circle cx="580" cy="240" r="23" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="340" y="281">dist 2</text>
    <text x="460" y="281">dist 9</text>
  </g>
  <text x="580" y="283" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="700">dist 13</text>
  <text x="320" y="312" text-anchor="middle" fill="#1a2026" font-size="13">Dijkstra settles (4, excluded) at 2 + 0 + 7 + 4 = <tspan fill="#4169E1" font-weight="600">13</tspan>:</text>
  <text x="320" y="330" text-anchor="middle" fill="#1a2026" font-size="13">the 7-weight edge 1-2 rides free as the one exclusion.</text>
</svg>
