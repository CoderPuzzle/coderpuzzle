<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,2,1,1,3]; value 1 occurs at indices 0, 2, 3; cells 64x40 at x = 136 + 76i, y = 44 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#f0f3f7">
    <rect x="212" y="44" width="64" height="40"/><rect x="440" y="44" width="64" height="40"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="136" y="44" width="64" height="40"/><rect x="288" y="44" width="64" height="40"/>
    <rect x="364" y="44" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="168" y="70" fill="#1a2026">1</text><text x="244" y="70" fill="#9aa7b2">2</text>
    <text x="320" y="70" fill="#1a2026">1</text><text x="396" y="70" fill="#1a2026">1</text>
    <text x="472" y="70" fill="#9aa7b2">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="168" y="102">0</text><text x="244" y="102">1</text><text x="320" y="102">2</text>
    <text x="396" y="102">3</text><text x="472" y="102">4</text>
  </g>
  <text x="320" y="130" text-anchor="middle" fill="#1a2026" font-size="13">Sorted a &lt; b &lt; c, the abs-sum collapses: (b - a) + (c - b) + (c - a) = 2 * (c - a)</text>
  <!-- value 1's occurrence list; the sweep keeps the last two, here (0, 2), when 3 arrives -->
  <text x="226" y="193" text-anchor="end" fill="#5c6b76" font-size="12.5">value 1:</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="246" y="170" width="44" height="36"/><rect x="300" y="170" width="44" height="36"/>
    <rect x="354" y="170" width="44" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="268" y="193">0</text><text x="322" y="193">2</text><text x="376" y="193">3</text>
  </g>
  <path d="M 268 212 Q 322 236 376 212" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="260" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">candidate: 2 * (3 - 0) = 6</text>
  <text x="320" y="288" text-anchor="middle" fill="#1a2026" font-size="13">When 1 reappears at i = 3, the stored last-two pair is (0, 2); the candidate</text>
  <text x="320" y="306" text-anchor="middle" fill="#1a2026" font-size="13">distance 2 * (3 - 0) = <tspan fill="#4169E1" font-weight="600">6</tspan> drops the middle index 2 entirely.</text>
</svg>
