<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="580" height="500" fill="#ffffff"/>
  <!-- s = "onefourthree" in 34px cells from x=90; trie of the ten digit words; accent = the walks that consume "one" -> 1, "four" -> 4, "three" -> 3; nodes hold letters, terminals hold the digit -->
  <!-- the scan -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="90" y="18" width="34" height="32"/><rect x="124" y="18" width="34" height="32"/><rect x="158" y="18" width="34" height="32"/>
    <rect x="192" y="18" width="34" height="32"/><rect x="226" y="18" width="34" height="32"/><rect x="260" y="18" width="34" height="32"/>
    <rect x="294" y="18" width="34" height="32"/><rect x="328" y="18" width="34" height="32"/><rect x="362" y="18" width="34" height="32"/>
    <rect x="396" y="18" width="34" height="32"/><rect x="430" y="18" width="34" height="32"/><rect x="464" y="18" width="34" height="32"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="107" y="39">o</text><text x="141" y="39">n</text><text x="175" y="39">e</text>
    <text x="209" y="39">f</text><text x="243" y="39">o</text><text x="277" y="39">u</text><text x="311" y="39">r</text>
    <text x="345" y="39">t</text><text x="379" y="39">h</text><text x="413" y="39">r</text><text x="447" y="39">e</text><text x="481" y="39">e</text>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="1.8">
    <path d="M 90 56 V 64 H 192 V 56"/>
    <path d="M 192 56 V 64 H 328 V 56"/>
    <path d="M 328 56 V 64 H 498 V 56"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">
    <text x="141" y="82">digit 1</text>
    <text x="260" y="82">digit 4</text>
    <text x="413" y="82">digit 3</text>
  </g>
  <!-- trie edges: accent = consumed walks, gray = the rest of the vocabulary -->
  <g stroke="#9aa7b2" stroke-width="1.3">
    <line x1="80" y1="292" x2="180" y2="150"/>
    <line x1="180" y1="150" x2="255" y2="150"/><line x1="255" y1="150" x2="330" y2="150"/><line x1="330" y1="150" x2="405" y2="150"/>
    <line x1="180" y1="228" x2="255" y2="212"/><line x1="255" y1="212" x2="330" y2="212"/>
    <line x1="180" y1="292" x2="255" y2="308"/><line x1="255" y1="308" x2="330" y2="308"/><line x1="330" y1="308" x2="405" y2="308"/>
    <line x1="80" y1="292" x2="180" y2="356"/>
    <line x1="180" y1="356" x2="255" y2="340"/><line x1="255" y1="340" x2="330" y2="340"/>
    <line x1="180" y1="356" x2="255" y2="372"/><line x1="255" y1="372" x2="330" y2="372"/><line x1="330" y1="372" x2="405" y2="372"/><line x1="405" y1="372" x2="480" y2="372"/>
    <line x1="80" y1="292" x2="180" y2="404"/>
    <line x1="180" y1="404" x2="255" y2="404"/><line x1="255" y1="404" x2="330" y2="404"/><line x1="330" y1="404" x2="405" y2="404"/><line x1="405" y1="404" x2="480" y2="404"/>
    <line x1="80" y1="292" x2="180" y2="434"/>
    <line x1="180" y1="434" x2="255" y2="434"/><line x1="255" y1="434" x2="330" y2="434"/><line x1="330" y1="434" x2="405" y2="434"/>
  </g>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="80" y1="292" x2="180" y2="180"/>
    <line x1="180" y1="180" x2="255" y2="180"/><line x1="255" y1="180" x2="330" y2="180"/>
    <line x1="80" y1="292" x2="180" y2="228"/>
    <line x1="180" y1="228" x2="255" y2="244"/><line x1="255" y1="244" x2="330" y2="244"/><line x1="330" y1="244" x2="405" y2="244"/><line x1="405" y1="244" x2="480" y2="244"/>
    <line x1="80" y1="292" x2="180" y2="292"/>
    <line x1="180" y1="292" x2="255" y2="276"/><line x1="255" y1="276" x2="330" y2="276"/><line x1="330" y1="276" x2="405" y2="276"/>
  </g>
  <!-- root -->
  <circle cx="80" cy="292" r="12" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="62" y="296" text-anchor="end" fill="#5c6b76" font-size="11.5">root</text>
  <!-- muted branches: zero, two, five, six, seven, eight, nine -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3">
    <circle cx="180" cy="150" r="11"/><circle cx="255" cy="150" r="11"/><circle cx="330" cy="150" r="11"/><circle cx="405" cy="150" r="12"/>
    <circle cx="255" cy="212" r="11"/><circle cx="330" cy="212" r="12"/>
    <circle cx="255" cy="308" r="11"/><circle cx="330" cy="308" r="11"/><circle cx="405" cy="308" r="12"/>
    <circle cx="180" cy="356" r="11"/>
    <circle cx="255" cy="340" r="11"/><circle cx="330" cy="340" r="12"/>
    <circle cx="255" cy="372" r="11"/><circle cx="330" cy="372" r="11"/><circle cx="405" cy="372" r="11"/><circle cx="480" cy="372" r="12"/>
    <circle cx="180" cy="404" r="11"/><circle cx="255" cy="404" r="11"/><circle cx="330" cy="404" r="11"/><circle cx="405" cy="404" r="11"/><circle cx="480" cy="404" r="12"/>
    <circle cx="180" cy="434" r="11"/><circle cx="255" cy="434" r="11"/><circle cx="330" cy="434" r="11"/><circle cx="405" cy="434" r="12"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#9aa7b2">
    <text x="180" y="154">z</text><text x="255" y="154">e</text><text x="330" y="154">r</text><text x="405" y="154" font-weight="700">0</text>
    <text x="255" y="216">w</text><text x="330" y="216" font-weight="700">2</text>
    <text x="255" y="312">i</text><text x="330" y="312">v</text><text x="405" y="312" font-weight="700">5</text>
    <text x="180" y="360">s</text>
    <text x="255" y="344">i</text><text x="330" y="344" font-weight="700">6</text>
    <text x="255" y="376">e</text><text x="330" y="376">v</text><text x="405" y="376">e</text><text x="480" y="376" font-weight="700">7</text>
    <text x="180" y="408">e</text><text x="255" y="408">i</text><text x="330" y="408">g</text><text x="405" y="408">h</text><text x="480" y="408" font-weight="700">8</text>
    <text x="180" y="438">n</text><text x="255" y="438">i</text><text x="330" y="438">n</text><text x="405" y="438" font-weight="700">9</text>
  </g>
  <!-- accent walks: one -> 1, three -> 3, four -> 4 -->
  <g fill="#4169E1">
    <circle cx="180" cy="180" r="11"/><circle cx="255" cy="180" r="11"/><circle cx="330" cy="180" r="12"/>
    <circle cx="180" cy="228" r="11"/>
    <circle cx="255" cy="244" r="11"/><circle cx="330" cy="244" r="11"/><circle cx="405" cy="244" r="11"/><circle cx="480" cy="244" r="12"/>
    <circle cx="180" cy="292" r="11"/>
    <circle cx="255" cy="276" r="11"/><circle cx="330" cy="276" r="11"/><circle cx="405" cy="276" r="12"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">
    <text x="180" y="184">o</text><text x="255" y="184">n</text><text x="330" y="184" font-weight="700">1</text>
    <text x="180" y="232">t</text>
    <text x="255" y="248">h</text><text x="330" y="248">r</text><text x="405" y="248">e</text><text x="480" y="248" font-weight="700">3</text>
    <text x="180" y="296">f</text>
    <text x="255" y="280">o</text><text x="330" y="280">u</text><text x="405" y="280" font-weight="700">4</text>
  </g>
  <text x="290" y="472" text-anchor="middle" fill="#1a2026" font-size="13">Each position walks the trie; reaching a terminal digit consumes that word, and</text>
  <text x="290" y="490" text-anchor="middle" fill="#1a2026" font-size="13">the scan restarts after it: one → <tspan fill="#4169E1" font-weight="600">1</tspan>, four → <tspan fill="#4169E1" font-weight="600">4</tspan>, three → <tspan fill="#4169E1" font-weight="600">3</tspan> join into "<tspan fill="#4169E1" font-weight="600">143</tspan>".</text>
</svg>
