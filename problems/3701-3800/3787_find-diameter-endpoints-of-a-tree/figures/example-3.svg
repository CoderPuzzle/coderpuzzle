<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 168" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 2, edges = [[0,1]]; diameter = 1 edge, only path 0-1, special = {0,1} -> "11" (verified by enumerating all simple paths) -->
  <line x1="110" y1="70" x2="270" y2="70" stroke="#42525e" stroke-width="1.6"/>
  <line x1="110" y1="70" x2="270" y2="70" stroke="#4169E1" stroke-width="3.2"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="110" cy="70" r="21"/>
    <circle cx="270" cy="70" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="110" y="75">0</text>
    <text x="270" y="75">1</text>
  </g>
  <text x="190" y="42" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">1 edge</text>
  <g font-size="12" font-weight="600" text-anchor="middle" fill="#4169E1">
    <text x="110" y="118">special</text>
    <text x="270" y="118">special</text>
  </g>
  <text x="230" y="156" text-anchor="middle" fill="#1a2026" font-size="13.5">one edge, one diameter: both endpoints are special → <tspan fill="#4169E1" font-weight="700">"11"</tspan></text>
</svg>
