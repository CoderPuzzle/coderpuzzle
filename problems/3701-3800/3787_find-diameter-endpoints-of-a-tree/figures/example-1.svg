<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 192" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 3, edges = [[0,1],[1,2]]; diameter = 2 edges, only path 0-2, special = {0,2} -> "101" (verified by enumerating all simple paths) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="110" y1="72" x2="230" y2="72"/>
    <line x1="230" y1="72" x2="350" y2="72"/>
  </g>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="110" y1="72" x2="230" y2="72"/>
    <line x1="230" y1="72" x2="350" y2="72"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="110" cy="72" r="21"/>
    <circle cx="350" cy="72" r="21"/>
  </g>
  <circle cx="230" cy="72" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="110" y="77">0</text>
    <text x="230" y="77">1</text>
    <text x="350" y="77">2</text>
  </g>
  <text x="230" y="44" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">2 edges</text>
  <g font-size="12" font-weight="600" text-anchor="middle" fill="#4169E1">
    <text x="110" y="120">special</text>
    <text x="350" y="120">special</text>
  </g>
  <text x="250" y="172" text-anchor="middle" fill="#1a2026" font-size="13.5">the diameter 0 → 2 spans 2 edges; its endpoints are special → <tspan fill="#4169E1" font-weight="700">"101"</tspan></text>
</svg>
