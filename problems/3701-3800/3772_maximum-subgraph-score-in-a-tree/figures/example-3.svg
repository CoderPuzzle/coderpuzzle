<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 168" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 2, edges = [[0,1]], good = [0,0]; best scores = [-1,-1] (verified by brute force: a lone bad node scores -1) -->
  <line x1="110" y1="70" x2="270" y2="70" stroke="#42525e" stroke-width="1.6"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="110" cy="70" r="21"/>
    <circle cx="270" cy="70" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="110" y="75">0</text>
    <text x="270" y="75">1</text>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle" fill="#5c6b76">
    <text x="110" y="118">bad</text>
    <text x="270" y="118">bad</text>
  </g>
  <text x="230" y="156" text-anchor="middle" fill="#1a2026" font-size="13.5">both nodes are bad: each stands alone for a score of <tspan fill="#4169E1" font-weight="700">−1</tspan></text>
</svg>
