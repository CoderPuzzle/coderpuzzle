<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 606" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="606" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree edges 1-0 and 1-2 pruned in the down sweep; down = [-1,3,-1,2,1], up = [3,-inf,3,1,2], answers [2,3,2,3,3] -->
  <text x="48" y="40" font-weight="600" font-size="13.5" fill="#1a2026">down sweep</text>
  <text x="150" y="40" fill="#5c6b76" font-size="12.5">d[u] = w[u] + &#931; positive d[child] &#8212; d &lt; 0 branches pruned</text>
  <g stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4">
    <line x1="304" y1="108" x2="166" y2="187"/>
    <line x1="318" y1="113" x2="332" y2="177"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="336" y1="108" x2="494" y2="182"/>
    <line x1="510" y1="213" x2="510" y2="254"/>
  </g>
  <text x="190" y="140" fill="#9aa7b2" font-size="11.5">pruned</text>
  <text x="342" y="152" fill="#9aa7b2" font-size="11.5">pruned</text>
  <circle cx="320" cy="100" r="18" fill="#4169E1"/>
  <text x="320" y="105" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <circle cx="150" cy="195" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="150" y="200" text-anchor="middle" fill="#1a2026">0</text>
  <circle cx="330" cy="195" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="330" y="200" text-anchor="middle" fill="#1a2026">2</text>
  <circle cx="510" cy="195" r="18" fill="#4169E1"/>
  <text x="510" y="200" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <circle cx="510" cy="272" r="18" fill="#4169E1"/>
  <text x="510" y="277" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  <g font-size="12.5" font-weight="600" fill="#5c6b76">
    <text x="320" y="73" text-anchor="middle">d = 3</text>
    <text x="150" y="232" text-anchor="middle">d = &#8722;1</text>
    <text x="330" y="232" text-anchor="middle">d = &#8722;1</text>
    <text x="540" y="200">d = 2</text>
    <text x="540" y="277">d = 1</text>
  </g>
  <text x="48" y="300" font-weight="600" font-size="13.5" fill="#1a2026">up sweep</text>
  <text x="150" y="300" fill="#5c6b76" font-size="12.5">u[c] = w[parent] + other positive branches + max(0, u[parent])</text>
  <g stroke="#dbe4fb" stroke-width="5">
    <line x1="304" y1="360" x2="166" y2="432"/>
    <line x1="318" y1="370" x2="332" y2="422"/>
    <line x1="336" y1="360" x2="494" y2="432"/>
    <line x1="510" y1="458" x2="510" y2="490"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 300 363 L 174 428" marker-end="url(#arrow)"/>
    <path d="M 319 373 L 331 419" marker-end="url(#arrow)"/>
    <path d="M 342 363 L 486 429" marker-end="url(#arrow)"/>
    <path d="M 510 463 L 510 486" marker-end="url(#arrow)"/>
  </g>
  <circle cx="320" cy="352" r="18" fill="#4169E1"/>
  <text x="320" y="357" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <circle cx="150" cy="440" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="150" y="445" text-anchor="middle" fill="#1a2026">0</text>
  <circle cx="330" cy="440" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="330" y="445" text-anchor="middle" fill="#1a2026">2</text>
  <circle cx="510" cy="440" r="18" fill="#4169E1"/>
  <text x="510" y="445" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <circle cx="510" cy="508" r="18" fill="#4169E1"/>
  <text x="510" y="513" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  <text x="320" y="328" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">u = &#8722;&#8734;<tspan fill="#5c6b76" font-weight="400"> (root sentinel)</tspan></text>
  <g font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="150" y="478" text-anchor="middle">u = 3</text>
    <text x="330" y="478" text-anchor="middle">u = 3</text>
    <text x="540" y="445">u = 1</text>
    <text x="540" y="513">u = 2</text>
  </g>
  <text x="48" y="545" fill="#1a2026" font-size="12.5">node 1 hands child 0 its parent-side piece: u[0] = 1 + 2 + 0 = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="320" y="572" text-anchor="middle" fill="#1a2026" font-size="13">answer[u] = d[u] + max(0, u[u]): nodes 1, 3, 4 reach <tspan fill="#4169E1" font-weight="600">3</tspan>;</text>
  <text x="320" y="590" text-anchor="middle" fill="#1a2026" font-size="13">bad nodes 0 and 2 settle at 2 &#8212; output [2, 3, 2, 3, 3].</text>
</svg>
