<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [1,1,2,3,2,1,2]; buckets: 1 -> [0,1,5] span 5, 2 -> [2,4,6] span 4; cells 48x40 at x = 116 + 60i, y = 44 -->
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="116" y="44" width="48" height="40"/><rect x="176" y="44" width="48" height="40"/>
    <rect x="416" y="44" width="48" height="40"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="236" y="44" width="48" height="40"/><rect x="356" y="44" width="48" height="40"/>
    <rect x="476" y="44" width="48" height="40"/>
  </g>
  <rect x="296" y="44" width="48" height="40" fill="#f0f3f7" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="140" y="70" fill="#1a2026">1</text><text x="200" y="70" fill="#1a2026">1</text>
    <text x="260" y="70" fill="#1a2026">2</text><text x="320" y="70" fill="#9aa7b2">3</text>
    <text x="380" y="70" fill="#1a2026">2</text><text x="440" y="70" fill="#1a2026">1</text>
    <text x="500" y="70" fill="#1a2026">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="140" y="102">0</text><text x="200" y="102">1</text><text x="260" y="102">2</text>
    <text x="320" y="102">3</text><text x="380" y="102">4</text><text x="440" y="102">5</text>
    <text x="500" y="102">6</text>
  </g>
  <!-- bucket of value 1: single consecutive triple 0,1,5, span 5 -->
  <rect x="146" y="141" width="12" height="12" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
  <text x="164" y="151" fill="#5c6b76" font-size="12.5">value 1</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="200" y="132" width="44" height="36"/><rect x="252" y="132" width="44" height="36"/>
    <rect x="304" y="132" width="44" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="222" y="155">0</text><text x="274" y="155">1</text><text x="326" y="155">5</text>
  </g>
  <path d="M 222 174 Q 274 196 326 174" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <text x="344" y="190" fill="#5c6b76" font-size="12.5">span 5 - 0 = 5, distance 2 * 5 = 10</text>
  <!-- bucket of value 2: single consecutive triple 2,4,6, span 4 — the winner -->
  <rect x="146" y="233" width="12" height="12" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="164" y="243" fill="#5c6b76" font-size="12.5">value 2</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="200" y="224" width="44" height="36"/><rect x="252" y="224" width="44" height="36"/>
    <rect x="304" y="224" width="44" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="222" y="247">2</text><text x="274" y="247">4</text><text x="326" y="247">6</text>
  </g>
  <path d="M 222 266 Q 274 288 326 266" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="344" y="282" fill="#4169E1" font-size="12.5" font-weight="600">span 6 - 2 = 4, distance 2 * 4 = 8</text>
  <text x="320" y="314" text-anchor="middle" fill="#1a2026" font-size="13">Each sorted bucket is scanned by consecutive triples: value 1's window 0 → 5</text>
  <text x="320" y="332" text-anchor="middle" fill="#1a2026" font-size="13">costs 10, but value 2's 2 → 6 is tightest — the distance is <tspan fill="#4169E1" font-weight="600">8</tspan>.</text>
</svg>
