<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 306" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="306" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [3,1,3,2,0]; running pair (pxor, gap) with gap = evens - odds; pair (3,-1) first seen after i=0, recurs after i=4 -> window (0,4] of length 4 -->
  <!-- balanced window bracket over indices 1..4 -->
  <text x="376" y="36" text-anchor="middle" fill="#1a2026" font-size="12.5">window [1, 3, 2, 0]: XOR 0 with two even and two odd</text>
  <path d="M 208 58 V 48 H 544 V 58" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <!-- array cells -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="120" y="70" width="72" height="44" fill="#ffffff"/>
    <rect x="208" y="70" width="72" height="44" fill="#dbe4fb"/>
    <rect x="296" y="70" width="72" height="44" fill="#dbe4fb"/>
    <rect x="384" y="70" width="72" height="44" fill="#dbe4fb"/>
    <rect x="472" y="70" width="72" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="156" y="98">3</text><text x="244" y="98">1</text><text x="332" y="98">3</text><text x="420" y="98">2</text><text x="508" y="98">0</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#9aa7b2">
    <text x="110" y="136">index</text>
    <text x="156" y="136">0</text><text x="244" y="136">1</text><text x="332" y="136">2</text><text x="420" y="136">3</text><text x="508" y="136">4</text>
  </g>
  <!-- running (pxor, gap) after each index -->
  <text x="110" y="172" text-anchor="end" fill="#5c6b76" font-size="12.5">(pxor, gap)</text>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="156" y="172" fill="#4169E1">(3, −1)</text>
    <text x="244" y="172" fill="#1a2026">(2, −2)</text>
    <text x="332" y="172" fill="#1a2026">(1, −3)</text>
    <text x="420" y="172" fill="#1a2026">(3, −2)</text>
    <text x="508" y="172" fill="#4169E1">(3, −1)</text>
  </g>
  <!-- the pair repeats: length = 4 - 0 -->
  <path d="M 156 190 Q 332 244 508 190" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="240" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">same pair (3, −1) seen again at i = 4 → length 4 − 0 = 4</text>
  <text x="310" y="274" text-anchor="middle" fill="#1a2026" font-size="13">Pair (3, −1) first appears after index 0; when it recurs after index 4, the window</text>
  <text x="310" y="292" text-anchor="middle" fill="#1a2026" font-size="13">(0, 4] = [1, 3, 2, 0] has XOR 0 and even/odd tied, so the answer is <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
