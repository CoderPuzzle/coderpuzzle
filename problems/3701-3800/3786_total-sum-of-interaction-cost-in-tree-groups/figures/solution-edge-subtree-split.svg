<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <!-- star tree: n = 4, edges = [[0,1],[0,2],[0,3]], group = [1,1,4,4]; subtree(1) holds 1 of label 1, subtrees (2),(3) hold 1 of label 4, totals 2 each -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="130" y1="150" x2="330" y2="62"/>
    <line x1="130" y1="150" x2="330" y2="150"/>
    <line x1="130" y1="150" x2="330" y2="224"/>
  </g>
  <circle cx="130" cy="150" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="130" y="155" text-anchor="middle" fill="#1a2026" font-weight="600">0</text>
  <circle cx="330" cy="62" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="330" y="67" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <circle cx="330" cy="150" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="330" y="155" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <circle cx="330" cy="224" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="330" y="229" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="130" y="190">group 1</text>
    <text x="130" y="208">rooted at 0</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="360" y="67">group 1</text>
    <text x="360" y="155">group 4</text>
    <text x="360" y="229">group 4</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="436" y="88">edge</text>
    <text x="506" y="88">split</text>
    <text x="570" y="88">a×(total−a)</text>
  </g>
  <g fill="#1a2026" font-size="13">
    <text x="436" y="118">0-1</text><text x="506" y="118">g1: 1 of 2</text>
    <text x="436" y="148">0-2</text><text x="506" y="148">g4: 1 of 2</text>
    <text x="436" y="178">0-3</text><text x="506" y="178">g4: 1 of 2</text>
    <text x="506" y="208" fill="#5c6b76">sum</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="14">
    <text x="596" y="118">1</text>
    <text x="596" y="148">1</text>
    <text x="596" y="178">1</text>
    <text x="596" y="208">3</text>
  </g>
  <g stroke="#dbe4fb" stroke-width="1">
    <line x1="430" y1="128" x2="650" y2="128"/>
    <line x1="430" y1="158" x2="650" y2="158"/>
    <line x1="430" y1="188" x2="650" y2="188"/>
  </g>
  <text x="436" y="238" fill="#5c6b76" font-size="11.5">totals: total[1] = 2, total[4] = 2</text>
  <text x="340" y="266" text-anchor="middle" fill="#1a2026" font-size="13">Rooted at 0, each child edge holds a = 1 node of its label against a total of 2:</text>
  <text x="340" y="284" text-anchor="middle" fill="#1a2026" font-size="13">1×(2−1) = 1 per edge, and 1 + 1 + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan> same-group crossings in all.</text>
</svg>
