<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- grid = [[0,1],[2,0]], k = 1; each cell shows dp over cost c = 0..1; cells 140x86 at (100,48), (270,48), (100,168), (270,168) -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="100" y="48" width="140" height="86"/><rect x="270" y="48" width="140" height="86"/>
    <rect x="100" y="168" width="140" height="86"/>
  </g>
  <rect x="270" y="168" width="140" height="86" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="170" y="65">(0, 0) · value 0</text><text x="340" y="65">(0, 1) · value 1</text>
    <text x="170" y="185">(1, 0) · value 2</text><text x="340" y="185">(1, 1) · value 0</text>
  </g>
  <g stroke="#42525e" stroke-width="1">
    <rect x="108" y="74" width="58" height="52" fill="#f0f3f7"/><rect x="174" y="74" width="58" height="52" fill="#ffffff"/>
    <rect x="278" y="74" width="58" height="52" fill="#f0f3f7"/><rect x="344" y="74" width="58" height="52" fill="#ffffff"/>
    <rect x="108" y="194" width="58" height="52" fill="#f0f3f7"/><rect x="174" y="194" width="58" height="52" fill="#ffffff"/>
    <rect x="278" y="194" width="58" height="52" fill="#f0f3f7"/><rect x="344" y="194" width="58" height="52" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="137" y="88">c = 0</text><text x="203" y="88">c = 1</text>
    <text x="307" y="88">c = 0</text><text x="373" y="88">c = 1</text>
    <text x="137" y="208">c = 0</text><text x="203" y="208">c = 1</text>
    <text x="307" y="208">c = 0</text><text x="373" y="208">c = 1</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="137" y="114" fill="#1a2026">0</text><text x="203" y="114" fill="#9aa7b2">—</text>
    <text x="307" y="114" fill="#9aa7b2">—</text><text x="373" y="114" fill="#1a2026">1</text>
    <text x="137" y="234" fill="#9aa7b2">—</text><text x="203" y="234" fill="#1a2026">2</text>
    <text x="307" y="234" fill="#9aa7b2">—</text><text x="373" y="234" fill="#4169E1">2</text>
  </g>
  <text x="420" y="215" fill="#4169E1" font-size="12" font-weight="600">answer</text>
  <!-- chosen path down-then-right; dashed gray is right-first -->
  <path d="M 170 138 L 170 164" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 244 211 L 266 211" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 244 91 L 266 91" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <path d="M 340 138 L 340 164" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <text x="320" y="276" text-anchor="middle" fill="#1a2026" font-size="13">Charged cells (value 1 or 2) shift every state one step, c → c + 1;</text>
  <text x="320" y="294" text-anchor="middle" fill="#1a2026" font-size="13">0-cells are free, and a dash marks a state no path reaches.</text>
  <text x="320" y="320" text-anchor="middle" fill="#1a2026" font-size="13">Down then right reaches (1, 1) at cost 1 with score 0 + 2 + 0 = <tspan fill="#4169E1" font-weight="600">2</tspan>, and</text>
  <text x="320" y="338" text-anchor="middle" fill="#1a2026" font-size="13">k = 1 allows it; right first would land in the same state with only 1.</text>
</svg>
