<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="396" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- value 12 = "1100", b = 4; each row: half box 56x30 at x=140, mirror arrow, candidate box 80x30 at x=240 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="245" y="26" width="150" height="40"/>
  </g>
  <text x="320" y="51" text-anchor="middle" font-weight="600" font-size="15">12 = 1100</text>
  <text x="410" y="51" fill="#5c6b76" font-size="13">b = 4</text>
  <text x="48" y="106" fill="#5c6b76" font-size="12.5">mirror the first half (b = 4):</text>
  <g font-size="13">
    <text x="48" y="145">h = 10</text>
    <text x="48" y="187">h + 1 = 11</text>
    <text x="48" y="229">h &#8722; 1 = 01</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="140" y="125" width="56" height="30"/>
    <rect x="140" y="167" width="56" height="30"/>
  </g>
  <rect x="140" y="209" width="56" height="30" stroke="#9aa7b2" stroke-width="1.5" fill="#f0f3f7"/>
  <g text-anchor="middle" font-weight="600">
    <text x="168" y="145">10</text>
    <text x="168" y="187">11</text>
    <text x="168" y="229" fill="#9aa7b2">01</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 202 140 L 234 140" marker-end="url(#arrow)"/>
    <path d="M 202 182 L 234 182" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="240" y="125" width="80" height="30"/>
    <rect x="240" y="167" width="80" height="30"/>
  </g>
  <rect x="240" y="209" width="80" height="30" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4" fill="#f0f3f7"/>
  <g text-anchor="middle" font-weight="600">
    <text x="280" y="145">1001</text>
    <text x="280" y="187">1111</text>
    <text x="280" y="229" fill="#9aa7b2">0110</text>
  </g>
  <g font-weight="600">
    <text x="334" y="145">= 9</text>
    <text x="334" y="187">= 15</text>
  </g>
  <text x="334" y="229" fill="#9aa7b2" font-size="13">leading zero &#8212; skipped</text>
  <g text-anchor="end" font-size="13" font-weight="600" fill="#4169E1">
    <text x="592" y="145">|12 &#8722; 9| = 3</text>
    <text x="592" y="187">|12 &#8722; 15| = 3</text>
  </g>
  <text x="48" y="268" fill="#5c6b76" font-size="12.5">length boundaries:</text>
  <g font-size="13">
    <text x="48" y="305">b &#8722; 1 bits, all ones</text>
    <text x="48" y="347">b + 1 bits, 10&#183;&#183;&#183;01</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="240" y="285" width="80" height="30"/>
    <rect x="240" y="327" width="80" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="280" y="305">111</text>
    <text x="280" y="347">10001</text>
  </g>
  <g font-weight="600">
    <text x="334" y="305">= 7</text>
    <text x="334" y="347">= 17</text>
  </g>
  <g text-anchor="end" font-size="13" fill="#5c6b76">
    <text x="592" y="305">|12 &#8722; 7| = 5</text>
    <text x="592" y="347">|12 &#8722; 17| = 5</text>
  </g>
  <text x="320" y="372" text-anchor="middle" fill="#1a2026" font-size="13">The nearest candidates for 12 are 9 and 15, each <tspan fill="#4169E1" font-weight="600">3</tspan> steps away,</text>
  <text x="320" y="390" text-anchor="middle" fill="#1a2026" font-size="13">so 12 needs <tspan fill="#4169E1" font-weight="600">3</tspan> operations.</text>
</svg>
