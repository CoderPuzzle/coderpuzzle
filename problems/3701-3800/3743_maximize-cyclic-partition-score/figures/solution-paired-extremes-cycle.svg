<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 274" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="274" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums = [1,2,3,3] cyclic, k = 2; plus marks (maxima) at indices 2,3, minus marks (minima) at indices 1,0; cells 56x56 at x = 144 + 72i, y = 54 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="172" y="40">0</text><text x="244" y="40">1</text><text x="316" y="40">2</text><text x="388" y="40">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="144" y="54" width="56" height="56"/><rect x="216" y="54" width="56" height="56"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="288" y="54" width="56" height="56"/><rect x="360" y="54" width="56" height="56"/>
  </g>
  <g text-anchor="middle">
    <text x="172" y="82" font-weight="600" font-size="16" fill="#1a2026">1</text>
    <text x="172" y="100" font-size="11.5" fill="#5c6b76">-1</text>
    <text x="244" y="82" font-weight="600" font-size="16" fill="#1a2026">2</text>
    <text x="244" y="100" font-size="11.5" fill="#5c6b76">-2</text>
    <text x="316" y="82" font-weight="600" font-size="16" fill="#1a2026">3</text>
    <text x="316" y="100" font-size="11.5" fill="#4169E1" font-weight="600">+3</text>
    <text x="388" y="82" font-weight="600" font-size="16" fill="#1a2026">3</text>
    <text x="388" y="100" font-size="11.5" fill="#4169E1" font-weight="600">+3</text>
  </g>
  <!-- inside pair: minus at index 1 with plus at index 2 -->
  <path d="M 244 118 Q 280 140 316 118" fill="none" stroke="#5c6b76" stroke-width="1.6" marker-end="url(#arrowS)"/>
  <text x="280" y="158" text-anchor="middle" fill="#5c6b76" font-size="12.5">3 - 2 = 1</text>
  <!-- seam pair: plus at index 3 closes on minus at index 0 across the wrap -->
  <path d="M 388 118 Q 280 232 172 118" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="196" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">3 - 1 = 2</text>
  <text x="280" y="238" text-anchor="middle" fill="#1a2026" font-size="13">With k = 2 the marks pair off, plus with minus, alternating; the</text>
  <text x="280" y="256" text-anchor="middle" fill="#1a2026" font-size="13">seam pair wraps to index 0 — (3 - 2) + (3 - 1) = 1 + 2 = <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
