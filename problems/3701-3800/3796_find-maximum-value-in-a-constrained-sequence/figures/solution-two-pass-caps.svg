<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="286" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- n = 10, diff = [2,2,3,1,4,5,1,1,2], restrictions = [[3,1],[8,1]]; left sweep caps [0,2,4,1,2,6,11,12,1,3], final caps [0,2,4,1,2,6,3,2,1,3]; cells 50x38 at x=76+56i -->
  <text x="353" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">diff = [2,2,3,1,4,5,1,1,2]; restrictions [3,1] and [8,1]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="101" y="58">0</text><text x="157" y="58">1</text><text x="213" y="58">2</text><text x="269" y="58">3</text><text x="325" y="58">4</text>
    <text x="381" y="58">5</text><text x="437" y="58">6</text><text x="493" y="58">7</text><text x="549" y="58">8</text><text x="605" y="58">9</text>
  </g>
  <text x="8" y="82" fill="#5c6b76" font-size="12">after left</text>
  <text x="8" y="96" fill="#5c6b76" font-size="12">sweep</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="76" y="66" width="50" height="38" fill="#ffffff"/><rect x="132" y="66" width="50" height="38" fill="#ffffff"/>
    <rect x="188" y="66" width="50" height="38" fill="#ffffff"/><rect x="244" y="66" width="50" height="38" fill="#dbe4fb"/>
    <rect x="300" y="66" width="50" height="38" fill="#ffffff"/><rect x="356" y="66" width="50" height="38" fill="#ffffff"/>
    <rect x="412" y="66" width="50" height="38" fill="#ffffff"/><rect x="468" y="66" width="50" height="38" fill="#ffffff"/>
    <rect x="524" y="66" width="50" height="38" fill="#dbe4fb"/><rect x="580" y="66" width="50" height="38" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="101" y="90" fill="#1a2026">0</text><text x="157" y="90" fill="#1a2026">2</text>
    <text x="213" y="90" fill="#1a2026">4</text><text x="269" y="90" fill="#1a2026">1</text>
    <text x="325" y="90" fill="#1a2026">2</text><text x="381" y="90" fill="#1a2026">6</text>
    <text x="437" y="90" fill="#9aa7b2">11</text><text x="493" y="90" fill="#9aa7b2">12</text>
    <text x="549" y="90" fill="#1a2026">1</text><text x="605" y="90" fill="#1a2026">3</text>
  </g>
  <text x="521" y="126" text-anchor="middle" fill="#5c6b76" font-size="12">right sweep: 1+1 → 2, 2+1 → 3</text>
  <path d="M 605 138 H 466" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="8" y="166" fill="#5c6b76" font-size="12">after right</text>
  <text x="8" y="180" fill="#5c6b76" font-size="12">sweep</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="76" y="150" width="50" height="38" fill="#ffffff"/><rect x="132" y="150" width="50" height="38" fill="#ffffff"/>
    <rect x="188" y="150" width="50" height="38" fill="#ffffff"/><rect x="244" y="150" width="50" height="38" fill="#dbe4fb"/>
    <rect x="300" y="150" width="50" height="38" fill="#ffffff"/><rect x="356" y="150" width="50" height="38" fill="#ffffff"/>
    <rect x="412" y="150" width="50" height="38" fill="#ffffff"/><rect x="468" y="150" width="50" height="38" fill="#ffffff"/>
    <rect x="524" y="150" width="50" height="38" fill="#dbe4fb"/><rect x="580" y="150" width="50" height="38" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="101" y="174" fill="#1a2026">0</text><text x="157" y="174" fill="#1a2026">2</text>
    <text x="213" y="174" fill="#1a2026">4</text><text x="269" y="174" fill="#1a2026">1</text>
    <text x="325" y="174" fill="#1a2026">2</text><text x="381" y="174" fill="#4169E1" font-size="15">6</text>
    <text x="437" y="174" fill="#1a2026">3</text><text x="493" y="174" fill="#1a2026">2</text>
    <text x="549" y="174" fill="#1a2026">1</text><text x="605" y="174" fill="#1a2026">3</text>
  </g>
  <text x="320" y="214" text-anchor="middle" fill="#5c6b76" font-size="12">shaded = restricted to ≤ 1 · muted = left-sweep values the right sweep tightens</text>
  <text x="320" y="248" text-anchor="middle" fill="#1a2026" font-size="13">The cap-1 valley at i = 3 rebounds to 2 and 6 by i = 5;</text>
  <text x="320" y="266" text-anchor="middle" fill="#1a2026" font-size="13">i = 8's cap 1 drags 12, 11 down to 2, 3 — the envelope peaks at <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
