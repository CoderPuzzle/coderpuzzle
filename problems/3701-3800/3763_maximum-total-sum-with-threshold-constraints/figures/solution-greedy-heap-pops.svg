<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrowa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- nums = [1,10,4,2,1,6], threshold = [5,1,5,5,2,2]; buckets: t=1 -> 10 (i=1), t=2 -> 1 (i=4), 6 (i=5), t=5 never fires; pops 10, 6, 1 give total 17; heap drains at step 4 -->
  <text x="40" y="24" fill="#5c6b76" font-size="12.5">nums = [1, 10, 4, 2, 1, 6]&#160;&#160;&#160;&#160;threshold = [5, 1, 5, 5, 2, 2]</text>
  <g fill="#5c6b76" font-size="12" font-weight="600">
    <text x="40" y="48">step</text>
    <text x="112" y="48">unlock (bucket t)</text>
    <text x="228" y="48">max-heap after pushes</text>
    <text x="462" y="48">pop &#183; total</text>
  </g>
  <!-- step 1: bucket 1 unlocks 10; heap [10]; pop 10 -->
  <text x="40" y="89" font-weight="600" fill="#1a2026">step 1</text>
  <rect x="112" y="71" width="32" height="24" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <text x="128" y="89" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">10</text>
  <text x="128" y="106" text-anchor="middle" font-size="10.5" fill="#5c6b76">i = 1</text>
  <path d="M 150 84 L 222 84" stroke="#42525e" stroke-width="1.5" fill="none" marker-end="url(#arrowg)"/>
  <rect x="228" y="68" width="52" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <rect x="236" y="72" width="34" height="22" fill="#4169E1"/>
  <text x="253" y="87" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">10</text>
  <path d="M 284 84 L 452 84" stroke="#4169E1" stroke-width="1.8" fill="none" marker-end="url(#arrowa)"/>
  <text x="368" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">pop 10</text>
  <text x="462" y="89" fill="#1a2026">total <tspan fill="#4169E1" font-weight="700">10</tspan></text>
  <!-- step 2: bucket 2 unlocks 1 and 6; heap [6, 1]; pop 6 -->
  <text x="40" y="149" font-weight="600" fill="#1a2026">step 2</text>
  <rect x="112" y="131" width="32" height="24" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <rect x="150" y="131" width="32" height="24" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <text x="128" y="149" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">1</text>
  <text x="166" y="149" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">6</text>
  <text x="128" y="166" text-anchor="middle" font-size="10.5" fill="#5c6b76">i = 4</text>
  <text x="166" y="166" text-anchor="middle" font-size="10.5" fill="#5c6b76">i = 5</text>
  <path d="M 188 144 L 222 144" stroke="#42525e" stroke-width="1.5" fill="none" marker-end="url(#arrowg)"/>
  <rect x="228" y="128" width="92" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <rect x="236" y="132" width="34" height="22" fill="#4169E1"/>
  <rect x="276" y="132" width="34" height="22" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="253" y="147" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">6</text>
  <text x="293" y="147" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">1</text>
  <path d="M 324 144 L 452 144" stroke="#4169E1" stroke-width="1.8" fill="none" marker-end="url(#arrowa)"/>
  <text x="388" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">pop 6</text>
  <text x="462" y="149" fill="#1a2026">total <tspan fill="#4169E1" font-weight="700">16</tspan></text>
  <!-- step 3: bucket 3 empty; heap [1]; pop 1 -->
  <text x="40" y="209" font-weight="600" fill="#1a2026">step 3</text>
  <text x="112" y="209" font-size="12.5" fill="#9aa7b2">no unlock</text>
  <rect x="228" y="188" width="52" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <rect x="236" y="192" width="34" height="22" fill="#4169E1"/>
  <text x="253" y="207" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <path d="M 284 204 L 452 204" stroke="#4169E1" stroke-width="1.8" fill="none" marker-end="url(#arrowa)"/>
  <text x="368" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">pop 1</text>
  <text x="462" y="209" fill="#1a2026">total <tspan fill="#4169E1" font-weight="700">17</tspan></text>
  <!-- step 4: nothing unlocks, heap drained -> stop -->
  <text x="40" y="269" font-weight="600" fill="#1a2026">step 4</text>
  <text x="112" y="269" font-size="12.5" fill="#9aa7b2">no unlock</text>
  <rect x="228" y="248" width="52" height="30" fill="none" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="254" y="269" text-anchor="middle" font-size="11" fill="#9aa7b2">empty</text>
  <text x="462" y="269" font-weight="600" fill="#1a2026">heap empty &#8594; stop</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">Step 4 unlocks nothing more (the rest need threshold 5) and the heap has drained,</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">so the simulation stops at the maximum total 10 + 6 + 1 = <tspan fill="#4169E1" font-weight="600">17</tspan>.</text>
</svg>
