<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 276" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="276" fill="#ffffff"/>
  <defs>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
    <marker id="arrowaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [4,3,2,7,8,2,3,1]; cells 64x48 at x=50+72i, y=120; top line = value read, bottom = stored after the pass;
       arcs map each read value v to slot v-1: 4->slot3, 3->slot2, 2->slot1 (twice each for 2 and 3) -->
  <text x="40" y="32" fill="#5c6b76" font-size="12">each value v maps to slot v - 1</text>
  <g fill="none" stroke="#5c6b76" stroke-width="1.4">
    <path d="M 82 116 Q 190 45 298 116" marker-end="url(#arrowgray)"/>
    <path d="M 154 116 Q 190 68 226 116" marker-end="url(#arrowgray)"/>
    <path d="M 226 116 Q 190 90 154 116" marker-end="url(#arrowgray)"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 442 116 Q 298 27 154 116" marker-end="url(#arrowaccent)"/>
    <path d="M 514 116 Q 370 27 226 116" marker-end="url(#arrowaccent)"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">
    <text x="298" y="58">2 again</text>
    <text x="370" y="58">3 again</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="50" y="120" width="64" height="48"/><rect x="122" y="120" width="64" height="48"/>
    <rect x="194" y="120" width="64" height="48"/><rect x="266" y="120" width="64" height="48"/>
    <rect x="338" y="120" width="64" height="48"/><rect x="410" y="120" width="64" height="48"/>
    <rect x="482" y="120" width="64" height="48"/><rect x="554" y="120" width="64" height="48"/>
  </g>
  <g text-anchor="middle">
    <text x="82" y="141" font-weight="600" fill="#1a2026">4</text>
    <text x="154" y="141" font-weight="600" fill="#1a2026">3</text>
    <text x="226" y="141" font-weight="600" fill="#1a2026">2</text>
    <text x="298" y="141" font-weight="600" fill="#1a2026">7</text>
    <text x="370" y="141" font-weight="600" fill="#1a2026">8</text>
    <text x="442" y="141" font-weight="600" fill="#1a2026">2</text>
    <text x="514" y="141" font-weight="600" fill="#1a2026">3</text>
    <text x="586" y="141" font-weight="600" fill="#1a2026">1</text>
    <text x="82" y="159" font-size="13" fill="#4169E1">-4</text>
    <text x="154" y="159" font-size="13" fill="#4169E1">-3</text>
    <text x="226" y="159" font-size="13" fill="#4169E1">-2</text>
    <text x="298" y="159" font-size="13" fill="#4169E1">-7</text>
    <text x="370" y="159" font-size="13" fill="#9aa7b2">8</text>
    <text x="442" y="159" font-size="13" fill="#9aa7b2">2</text>
    <text x="514" y="159" font-size="13" fill="#4169E1">-3</text>
    <text x="586" y="159" font-size="13" fill="#4169E1">-1</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="82" y="184">slot 0</text><text x="154" y="184">slot 1</text>
    <text x="226" y="184">slot 2</text><text x="298" y="184">slot 3</text>
    <text x="370" y="184">slot 4</text><text x="442" y="184">slot 5</text>
    <text x="514" y="184">slot 6</text><text x="586" y="184">slot 7</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">
    <text x="154" y="206">dup 2</text><text x="226" y="206">dup 3</text>
  </g>
  <text x="40" y="242" fill="#1a2026" font-size="13">A first visit flips slot v - 1 negative; the second <tspan fill="#4169E1" font-weight="600">2 and 3</tspan> find slots 1</text>
  <text x="40" y="260" fill="#1a2026" font-size="13">and 2 already negative — the duplicates. A final abs() restores the array.</text>
</svg>
