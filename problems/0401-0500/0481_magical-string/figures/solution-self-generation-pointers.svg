<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- magical string for n = 6; cells 40x36 pitch 42 at x=200; rows: seed 1,2,2 (read=2), after appending 1,1 (read=3), after appending 2 (read=4, write=6); group lengths 1 2 2 1 spell the string's own prefix -->
  <!-- row A: seed, read at index 2, write slot 3 -->
  <text x="186" y="75" text-anchor="end" fill="#5c6b76" font-size="12.5">s =</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="200" y="52" width="40" height="36"/><rect x="242" y="52" width="40" height="36"/><rect x="284" y="52" width="40" height="36"/>
  </g>
  <rect x="326" y="52" width="40" height="36" fill="none" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="3 3"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="220" y="75">1</text><text x="262" y="75">2</text><text x="304" y="75">2</text>
  </g>
  <path d="M 304 110 L 304 94" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="296" y="106" text-anchor="end" fill="#4169E1" font-size="11.5">read</text>
  <path d="M 346 110 L 346 94" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrowW)"/>
  <text x="354" y="106" text-anchor="start" fill="#5c6b76" font-size="11.5">write</text>
  <text x="330" y="136" text-anchor="middle" fill="#5c6b76" font-size="12.5">read s[2] = 2 &#8594; append two 1s; flip becomes 2</text>
  <!-- row B: after appending 1 1, read at index 3, write slot 5 -->
  <text x="186" y="171" text-anchor="end" fill="#5c6b76" font-size="12.5">s =</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="200" y="148" width="40" height="36"/><rect x="242" y="148" width="40" height="36"/><rect x="284" y="148" width="40" height="36"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="326" y="148" width="40" height="36"/><rect x="368" y="148" width="40" height="36"/>
  </g>
  <rect x="410" y="148" width="40" height="36" fill="none" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="3 3"/>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="220" y="171" fill="#1a2026">1</text><text x="262" y="171" fill="#1a2026">2</text><text x="304" y="171" fill="#1a2026">2</text>
    <text x="346" y="171" fill="#1a2026">1</text><text x="388" y="171" fill="#1a2026">1</text>
  </g>
  <path d="M 346 206 L 346 190" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="338" y="202" text-anchor="end" fill="#4169E1" font-size="11.5">read</text>
  <path d="M 430 206 L 430 190" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrowW)"/>
  <text x="438" y="202" text-anchor="start" fill="#5c6b76" font-size="11.5">write</text>
  <text x="330" y="232" text-anchor="middle" fill="#5c6b76" font-size="12.5">read s[3] = 1 &#8594; append one 2; flip becomes 1</text>
  <!-- row C: n = 6 reached, read at index 4, write at 6 -->
  <text x="186" y="267" text-anchor="end" fill="#5c6b76" font-size="12.5">s =</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="200" y="244" width="40" height="36"/><rect x="242" y="244" width="40" height="36"/><rect x="284" y="244" width="40" height="36"/><rect x="326" y="244" width="40" height="36"/><rect x="368" y="244" width="40" height="36"/>
  </g>
  <rect x="410" y="244" width="40" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="220" y="267">1</text><text x="262" y="267">2</text><text x="304" y="267">2</text>
    <text x="346" y="267">1</text><text x="388" y="267">1</text><text x="430" y="267">2</text>
  </g>
  <path d="M 388 302 L 388 286" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="380" y="298" text-anchor="end" fill="#4169E1" font-size="11.5">read</text>
  <path d="M 472 302 L 472 286" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrowW)"/>
  <text x="480" y="298" text-anchor="start" fill="#5c6b76" font-size="11.5">write</text>
  <!-- group brackets: run lengths 1 2 2 1 reproduce the prefix -->
  <g fill="none" stroke="#5c6b76" stroke-width="1.2">
    <path d="M 200 318 L 200 324 L 240 324 L 240 318"/>
    <path d="M 242 318 L 242 324 L 324 324 L 324 318"/>
    <path d="M 326 318 L 326 324 L 408 324 L 408 318"/>
    <path d="M 410 318 L 410 324 L 450 324 L 450 318"/>
  </g>
  <text x="186" y="342" text-anchor="end" fill="#5c6b76" font-size="11.5">lengths</text>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="220" y="342">1</text><text x="283" y="342">2</text><text x="367" y="342">2</text><text x="430" y="342">1</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="310" y="368">s[2] = 2 then s[3] = 1 append 1 1 then 2: s reaches <tspan fill="#4169E1" font-weight="600">122112</tspan> for n = 6;</text>
    <text x="310" y="388">read gains one per step, never catching write; the first 6 digits hold <tspan fill="#4169E1" font-weight="600">three 1s</tspan>.</text>
  </g>
</svg>
