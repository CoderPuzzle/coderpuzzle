<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="580" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- before: node 3 (highlighted) is the key to delete -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="129.8" y1="56.3" x2="90.2" y2="103.7"/>
    <line x1="150.2" y1="56.3" x2="189.8" y2="103.7"/>
    <line x1="73" y1="130.4" x2="51" y2="175.6"/>
    <line x1="87" y1="130.4" x2="109" y2="175.6"/>
    <line x1="200" y1="132" x2="200" y2="174"/>
  </g>
  <circle cx="80" cy="116" r="16" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="140" cy="44" r="16"/>
    <circle cx="200" cy="116" r="16"/>
    <circle cx="44" cy="190" r="16"/>
    <circle cx="116" cy="190" r="16"/>
    <circle cx="200" cy="190" r="16"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="140" y="49">5</text>
    <text x="80" y="121">3</text>
    <text x="200" y="121">6</text>
    <text x="44" y="195">2</text>
    <text x="116" y="195">4</text>
    <text x="200" y="195">7</text>
  </g>
  <text x="120" y="230" text-anchor="middle" fill="#5c6b76" font-size="12.5">delete key 3</text>
  <line x1="250" y1="116" x2="318" y2="116" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- after: the successor 4 has taken node 3's place -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="408.8" y1="55.5" x2="361.2" y2="104.5"/>
    <line x1="431.2" y1="55.5" x2="478.8" y2="104.5"/>
    <line x1="342.4" y1="130.1" x2="317.6" y2="175.9"/>
    <line x1="490" y1="132" x2="490" y2="174"/>
  </g>
  <circle cx="350" cy="116" r="16" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="420" cy="44" r="16"/>
    <circle cx="490" cy="116" r="16"/>
    <circle cx="310" cy="190" r="16"/>
    <circle cx="490" cy="190" r="16"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="420" y="49">5</text>
    <text x="350" y="121">4</text>
    <text x="490" y="121">6</text>
    <text x="310" y="195">2</text>
    <text x="490" y="195">7</text>
  </g>
  <text x="400" y="230" text-anchor="middle" fill="#5c6b76" font-size="12.5">the in-order successor 4 replaces 3</text>
</svg>
