<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="392" fill="#ffffff"/>
  <!-- example 1: rand7_outputs = [1,1]. Grid of the 49 (a,b) pairs, rows a=1..7
       top to bottom, columns b=1..7; cell value = idx = (a-1)*7+b.
       Tinted cells idx 1..40 are kept (each output class gets four indices);
       grey struck cells 41..49 are rejected. Accent cell: a=1,b=1 -> idx 1. -->
  <g fill="#5c6b76" font-size="10.5">
    <text x="94" y="96" text-anchor="middle">b=1</text>
    <text x="130" y="96" text-anchor="middle">b=2</text>
    <text x="166" y="96" text-anchor="middle">b=3</text>
    <text x="202" y="96" text-anchor="middle">b=4</text>
    <text x="238" y="96" text-anchor="middle">b=5</text>
    <text x="274" y="96" text-anchor="middle">b=6</text>
    <text x="310" y="96" text-anchor="middle">b=7</text>
    <text x="70" y="123" text-anchor="end">a=1</text>
    <text x="70" y="153" text-anchor="end">a=2</text>
    <text x="70" y="183" text-anchor="end">a=3</text>
    <text x="70" y="213" text-anchor="end">a=4</text>
    <text x="70" y="243" text-anchor="end">a=5</text>
    <text x="70" y="273" text-anchor="end">a=6</text>
    <text x="70" y="303" text-anchor="end">a=7</text>
  </g>
  <!-- kept cells: idx 1..40 -->
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1">
    <rect x="76" y="104" width="36" height="30"/><rect x="112" y="104" width="36" height="30"/><rect x="148" y="104" width="36" height="30"/><rect x="184" y="104" width="36" height="30"/><rect x="220" y="104" width="36" height="30"/><rect x="256" y="104" width="36" height="30"/><rect x="292" y="104" width="36" height="30"/>
    <rect x="76" y="134" width="36" height="30"/><rect x="112" y="134" width="36" height="30"/><rect x="148" y="134" width="36" height="30"/><rect x="184" y="134" width="36" height="30"/><rect x="220" y="134" width="36" height="30"/><rect x="256" y="134" width="36" height="30"/><rect x="292" y="134" width="36" height="30"/>
    <rect x="76" y="164" width="36" height="30"/><rect x="112" y="164" width="36" height="30"/><rect x="148" y="164" width="36" height="30"/><rect x="184" y="164" width="36" height="30"/><rect x="220" y="164" width="36" height="30"/><rect x="256" y="164" width="36" height="30"/><rect x="292" y="164" width="36" height="30"/>
    <rect x="76" y="194" width="36" height="30"/><rect x="112" y="194" width="36" height="30"/><rect x="148" y="194" width="36" height="30"/><rect x="184" y="194" width="36" height="30"/><rect x="220" y="194" width="36" height="30"/><rect x="256" y="194" width="36" height="30"/><rect x="292" y="194" width="36" height="30"/>
    <rect x="76" y="224" width="36" height="30"/><rect x="112" y="224" width="36" height="30"/><rect x="148" y="224" width="36" height="30"/><rect x="184" y="224" width="36" height="30"/><rect x="220" y="224" width="36" height="30"/><rect x="256" y="224" width="36" height="30"/><rect x="292" y="224" width="36" height="30"/>
    <rect x="76" y="254" width="36" height="30"/><rect x="112" y="254" width="36" height="30"/><rect x="148" y="254" width="36" height="30"/><rect x="184" y="254" width="36" height="30"/><rect x="220" y="254" width="36" height="30"/>
  </g>
  <!-- rejected cells: idx 41..49 -->
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1">
    <rect x="256" y="254" width="36" height="30"/><rect x="292" y="254" width="36" height="30"/>
    <rect x="76" y="284" width="36" height="30"/><rect x="112" y="284" width="36" height="30"/><rect x="148" y="284" width="36" height="30"/><rect x="184" y="284" width="36" height="30"/><rect x="220" y="284" width="36" height="30"/><rect x="256" y="284" width="36" height="30"/><rect x="292" y="284" width="36" height="30"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2">
    <line x1="260" y1="258" x2="288" y2="280"/><line x1="296" y1="258" x2="324" y2="280"/>
    <line x1="80" y1="288" x2="108" y2="310"/><line x1="116" y1="288" x2="144" y2="310"/><line x1="152" y1="288" x2="180" y2="310"/><line x1="188" y1="288" x2="216" y2="310"/><line x1="224" y1="288" x2="252" y2="310"/><line x1="260" y1="288" x2="288" y2="310"/><line x1="296" y1="288" x2="324" y2="310"/>
  </g>
  <!-- cell values = idx -->
  <g text-anchor="middle" font-size="11.5" fill="#1a2026">
    <text x="94" y="123">1</text><text x="130" y="123">2</text><text x="166" y="123">3</text><text x="202" y="123">4</text><text x="238" y="123">5</text><text x="274" y="123">6</text><text x="310" y="123">7</text>
    <text x="94" y="153">8</text><text x="130" y="153">9</text><text x="166" y="153">10</text><text x="202" y="153">11</text><text x="238" y="153">12</text><text x="274" y="153">13</text><text x="310" y="153">14</text>
    <text x="94" y="183">15</text><text x="130" y="183">16</text><text x="166" y="183">17</text><text x="202" y="183">18</text><text x="238" y="183">19</text><text x="274" y="183">20</text><text x="310" y="183">21</text>
    <text x="94" y="213">22</text><text x="130" y="213">23</text><text x="166" y="213">24</text><text x="202" y="213">25</text><text x="238" y="213">26</text><text x="274" y="213">27</text><text x="310" y="213">28</text>
    <text x="94" y="243">29</text><text x="130" y="243">30</text><text x="166" y="243">31</text><text x="202" y="243">32</text><text x="238" y="243">33</text><text x="274" y="243">34</text><text x="310" y="243">35</text>
    <text x="94" y="273">36</text><text x="130" y="273">37</text><text x="166" y="273">38</text><text x="202" y="273">39</text><text x="238" y="273">40</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#9aa7b2">
    <text x="274" y="273">41</text><text x="310" y="273">42</text>
    <text x="94" y="303">43</text><text x="130" y="303">44</text><text x="166" y="303">45</text><text x="202" y="303">46</text><text x="238" y="303">47</text><text x="274" y="303">48</text><text x="310" y="303">49</text>
  </g>
  <!-- example pair (1,1) -->
  <rect x="76" y="104" width="36" height="30" fill="none" stroke="#4169E1" stroke-width="2.4"/>
  <!-- side panel -->
  <text x="386" y="120" fill="#1a2026" font-size="13.5" font-weight="600">idx = (a &#8722; 1) &#215; 7 + b</text>
  <rect x="386" y="140" width="12" height="12" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="406" y="150" fill="#5c6b76" font-size="12">kept: idx 1..40 returns</text>
  <text x="406" y="168" fill="#5c6b76" font-size="12">((idx &#8722; 1) mod 10) + 1</text>
  <rect x="386" y="183" width="12" height="12" fill="#f0f3f7" stroke="#42525e" stroke-width="1"/>
  <text x="406" y="192" fill="#5c6b76" font-size="12">rejected: 41..49 &#8212; discard</text>
  <text x="406" y="210" fill="#5c6b76" font-size="12">both draws and redraw</text>
  <rect x="380" y="232" width="286" height="92" rx="6" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="396" y="258" fill="#4169E1" font-size="12.5" font-weight="600">example: a=1, b=1</text>
  <text x="396" y="280" fill="#1a2026" font-size="12.5">idx = 0&#215;7 + 1 = 1</text>
  <text x="396" y="302" fill="#1a2026" font-size="12.5">return (1&#8722;1) mod 10 + 1 = 1</text>
  <text x="340" y="346" text-anchor="middle" fill="#1a2026" font-size="13">40 of the 49 pairs survive &#8212; four indices per output; the grey nine are discarded and redrawn.</text>
  <text x="340" y="368" text-anchor="middle" fill="#1a2026" font-size="13">The example draws (1, 1) land on <tspan fill="#4169E1" font-weight="600">idx 1</tspan> &#8594; rand10() returns <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
