<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- head = 1-2-3-4-5-6 with 3.child = 7-8-9-10; top row boxes 44x36 at y=80, x=60+90k; child row boxes 44x36 at y=170, x=240/306/372/438; splice state: 3.next=7, 10.next=4, 3.child=null -->
  <text x="82" y="66" fill="#5c6b76" font-size="12">top level</text>
  <text x="150" y="193" text-anchor="end" fill="#5c6b76" font-size="12">child list</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="60" y="80" width="44" height="36"/><rect x="150" y="80" width="44" height="36"/>
    <rect x="240" y="80" width="44" height="36" stroke="#4169E1" stroke-width="2.5"/>
    <rect x="330" y="80" width="44" height="36"/><rect x="420" y="80" width="44" height="36"/>
    <rect x="510" y="80" width="44" height="36"/>
    <rect x="240" y="170" width="44" height="36"/><rect x="306" y="170" width="44" height="36"/>
    <rect x="372" y="170" width="44" height="36"/><rect x="438" y="170" width="44" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="700" font-size="15" fill="#1a2026">
    <text x="82" y="103">1</text><text x="172" y="103">2</text><text x="262" y="103">3</text>
    <text x="352" y="103">4</text><text x="442" y="103">5</text><text x="532" y="103">6</text>
    <text x="262" y="193">7</text><text x="328" y="193">8</text><text x="394" y="193">9</text><text x="460" y="193">10</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 104 98 L 146 98" marker-end="url(#arrowgray)"/>
    <path d="M 194 98 L 236 98" marker-end="url(#arrowgray)"/>
    <path d="M 374 98 L 416 98" marker-end="url(#arrowgray)"/>
    <path d="M 464 98 L 506 98" marker-end="url(#arrowgray)"/>
    <path d="M 284 188 L 302 188" marker-end="url(#arrowgray)"/>
    <path d="M 350 188 L 368 188" marker-end="url(#arrowgray)"/>
    <path d="M 416 188 L 434 188" marker-end="url(#arrowgray)"/>
  </g>
  <path d="M 262 120 L 262 166" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="250" y="148" text-anchor="end" fill="#9aa7b2" font-size="11.5">child = null</text>
  <path d="M 284 112 C 310 118 306 148 298 166" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="314" y="152" fill="#4169E1" font-size="12.5" font-weight="600">3.next = 7</text>
  <path d="M 472 168 Q 478 124 364 118" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="496" y="146" fill="#4169E1" font-size="12.5" font-weight="600">10.next = 4</text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">The splice at 3: child tail <tspan fill="#4169E1" font-weight="600">10.next = 4</tspan>, head side <tspan fill="#4169E1" font-weight="600">3.next = 7</tspan>, child pointer cleared;</text>
  <text x="320" y="322" text-anchor="middle" fill="#1a2026" font-size="13">the walk then continues into 7 — deeper children splice by the same rule later.</text>
</svg>
