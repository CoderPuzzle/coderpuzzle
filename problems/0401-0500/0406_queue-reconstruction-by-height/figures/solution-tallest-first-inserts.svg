<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="366" fill="#ffffff"/>
  <!-- people = [[7,0],[4,4],[7,1],[5,0],[6,1],[5,2]];
       sorted = [[7,0],[7,1],[6,1],[5,0],[5,2],[4,4]];
       queue cells 48x30, slot j at x = 210+52j; rows y = 96+36i; sorted cells y = 48 -->
  <text x="40" y="67" fill="#5c6b76" font-size="12.5">sorted (h desc, k asc):</text>
  <g stroke="#42525e" stroke-width="1.25" fill="#ffffff">
    <rect x="210" y="48" width="48" height="30"/><rect x="262" y="48" width="48" height="30"/>
    <rect x="314" y="48" width="48" height="30"/><rect x="366" y="48" width="48" height="30"/>
    <rect x="418" y="48" width="48" height="30"/><rect x="470" y="48" width="48" height="30"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">
    <text x="234" y="67">[7,0]</text><text x="286" y="67">[7,1]</text><text x="338" y="67">[6,1]</text>
    <text x="390" y="67">[5,0]</text><text x="442" y="67">[5,2]</text><text x="494" y="67">[4,4]</text>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="40" y="116">insert [7,0] at 0</text>
    <text x="40" y="152">insert [7,1] at 1</text>
    <text x="40" y="188">insert [6,1] at 1</text>
    <text x="40" y="224">insert [5,0] at 0</text>
    <text x="40" y="260">insert [5,2] at 2</text>
    <text x="40" y="296">insert [4,4] at 4</text>
  </g>
  <!-- row 0: [[7,0]] -->
  <g stroke="#42525e" stroke-width="1.25">
    <rect x="210" y="96" width="48" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  </g>
  <text x="234" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">[7,0]</text>
  <!-- row 1: [[7,0],[7,1]] -->
  <g stroke="#42525e" stroke-width="1.25">
    <rect x="210" y="132" width="48" height="30" fill="#ffffff"/>
    <rect x="262" y="132" width="48" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">
    <text x="234" y="151">[7,0]</text><text x="286" y="151">[7,1]</text>
  </g>
  <!-- row 2: [[7,0],[6,1],[7,1]] -->
  <g stroke="#42525e" stroke-width="1.25">
    <rect x="210" y="168" width="48" height="30" fill="#ffffff"/>
    <rect x="262" y="168" width="48" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="314" y="168" width="48" height="30" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">
    <text x="234" y="187">[7,0]</text><text x="286" y="187">[6,1]</text><text x="338" y="187">[7,1]</text>
  </g>
  <!-- row 3: [[5,0],[7,0],[6,1],[7,1]] -->
  <g stroke="#42525e" stroke-width="1.25">
    <rect x="210" y="204" width="48" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="262" y="204" width="48" height="30" fill="#ffffff"/>
    <rect x="314" y="204" width="48" height="30" fill="#ffffff"/>
    <rect x="366" y="204" width="48" height="30" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">
    <text x="234" y="223">[5,0]</text><text x="286" y="223">[7,0]</text><text x="338" y="223">[6,1]</text><text x="390" y="223">[7,1]</text>
  </g>
  <!-- row 4: [[5,0],[7,0],[5,2],[6,1],[7,1]] -->
  <g stroke="#42525e" stroke-width="1.25">
    <rect x="210" y="240" width="48" height="30" fill="#ffffff"/>
    <rect x="262" y="240" width="48" height="30" fill="#ffffff"/>
    <rect x="314" y="240" width="48" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="366" y="240" width="48" height="30" fill="#ffffff"/>
    <rect x="418" y="240" width="48" height="30" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">
    <text x="234" y="259">[5,0]</text><text x="286" y="259">[7,0]</text><text x="338" y="259">[5,2]</text>
    <text x="390" y="259">[6,1]</text><text x="442" y="259">[7,1]</text>
  </g>
  <!-- row 5: [[5,0],[7,0],[5,2],[6,1],[4,4],[7,1]] -->
  <g stroke="#42525e" stroke-width="1.25">
    <rect x="210" y="276" width="48" height="30" fill="#ffffff"/>
    <rect x="262" y="276" width="48" height="30" fill="#ffffff"/>
    <rect x="314" y="276" width="48" height="30" fill="#ffffff"/>
    <rect x="366" y="276" width="48" height="30" fill="#ffffff"/>
    <rect x="418" y="276" width="48" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="470" y="276" width="48" height="30" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">
    <text x="234" y="295">[5,0]</text><text x="286" y="295">[7,0]</text><text x="338" y="295">[5,2]</text>
    <text x="390" y="295">[6,1]</text><text x="442" y="295">[4,4]</text><text x="494" y="295">[7,1]</text>
  </g>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">Each person lands at index k behind exactly k taller-or-equal people, and later,</text>
  <text x="320" y="352" text-anchor="middle" fill="#1a2026" font-size="13">shorter inserts never disturb them — the final row is <tspan fill="#4169E1" font-weight="600">[[5,0],[7,0],[5,2],[6,1],[4,4],[7,1]]</tspan>.</text>
</svg>
