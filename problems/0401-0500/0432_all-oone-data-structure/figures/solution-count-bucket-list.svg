<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- trace inc(hello), inc(hello), inc(leet); buckets ascend left to right; sentinels shaded #f0f3f7 -->
  <!-- after two inc(hello): head - bucket 2 {hello} - tail -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4">
    <rect x="60" y="52" width="64" height="46"/><rect x="510" y="52" width="64" height="46"/>
  </g>
  <text x="92" y="80" text-anchor="middle" fill="#9aa7b2" font-size="13">head</text>
  <text x="542" y="80" text-anchor="middle" fill="#9aa7b2" font-size="13">tail</text>
  <rect x="250" y="52" width="120" height="46" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="310" y="72" text-anchor="middle" fill="#5c6b76" font-size="12">count 2</text>
  <text x="310" y="90" text-anchor="middle" fill="#1a2026" font-weight="600">hello</text>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <line x1="127" y1="75" x2="247" y2="75" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="373" y1="75" x2="507" y2="75" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="340" y="118" text-anchor="middle" fill="#5c6b76" font-size="11.5">getMaxKey() and getMinKey() both return "hello"</text>
  <path d="M 340 130 V 152" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <text x="352" y="146" fill="#4169E1" font-size="12" font-weight="600">inc("leet")</text>
  <!-- after inc(leet): bucket 1 spliced between head and bucket 2 -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4">
    <rect x="60" y="164" width="64" height="46"/><rect x="510" y="164" width="64" height="46"/>
  </g>
  <text x="92" y="192" text-anchor="middle" fill="#9aa7b2" font-size="13">head</text>
  <text x="542" y="192" text-anchor="middle" fill="#9aa7b2" font-size="13">tail</text>
  <rect x="172" y="164" width="120" height="46" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="232" y="184" text-anchor="middle" fill="#5c6b76" font-size="12">count 1</text>
  <text x="232" y="202" text-anchor="middle" fill="#1a2026" font-weight="600">leet</text>
  <rect x="340" y="164" width="120" height="46" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="400" y="184" text-anchor="middle" fill="#5c6b76" font-size="12">count 2</text>
  <text x="400" y="202" text-anchor="middle" fill="#1a2026" font-weight="600">hello</text>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <line x1="127" y1="187" x2="169" y2="187" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="295" y1="187" x2="337" y2="187" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="463" y1="187" x2="507" y2="187" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <!-- the end sentinels answer the getters -->
  <path d="M 92 212 Q 158 250 220 216" fill="none" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="254" text-anchor="middle" fill="#5c6b76" font-size="11.5">getMinKey()</text>
  <path d="M 542 212 Q 476 250 442 216" fill="none" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="254" text-anchor="middle" fill="#5c6b76" font-size="11.5">getMaxKey()</text>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">After inc("leet"), <tspan fill="#4169E1" font-weight="600">bucket 1 = {leet}</tspan> is spliced between the head sentinel and</text>
  <text x="320" y="304" text-anchor="middle" fill="#1a2026" font-size="13">bucket 2: getMinKey reads "leet" at the front, getMaxKey reads "hello" at the end.</text>
</svg>
