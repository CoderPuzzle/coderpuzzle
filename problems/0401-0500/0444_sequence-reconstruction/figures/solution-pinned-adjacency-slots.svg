<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="288" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [1,2,3], sequences = [[1,2],[1,3]]; nums cells 64x44 at x=240+100i, y=120;
       adjacency slots sit between cells at x=322 (1·2) and x=422 (2·3); pair cells 30x32 at y=30 -->
  <text x="60" y="50" fill="#5c6b76" font-size="12.5">sequences</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="170" y="30" width="30" height="32"/><rect x="204" y="30" width="30" height="32"/>
    <rect x="410" y="30" width="30" height="32"/><rect x="444" y="30" width="30" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="185" y="51">1</text><text x="219" y="51">2</text>
    <text x="425" y="51">1</text><text x="459" y="51">3</text>
  </g>
  <path d="M 202 62 Q 262 100 322 118" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 442 62 Q 462 96 472 118" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowmuted)"/>
  <g font-size="12" fill="#5c6b76">
    <text x="520" y="92">1→3 skips ahead —</text>
    <text x="520" y="108">pins nothing</text>
  </g>
  <text x="100" y="146" fill="#5c6b76" font-size="12.5">nums = [1,2,3]</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="240" y="120" width="64" height="44"/><rect x="340" y="120" width="64" height="44"/>
    <rect x="440" y="120" width="64" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="272" y="148">1</text><text x="372" y="148">2</text><text x="472" y="148">3</text>
  </g>
  <line x1="322" y1="166" x2="322" y2="182" stroke="#4169E1" stroke-width="2"/>
  <line x1="422" y1="166" x2="422" y2="182" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g text-anchor="middle">
    <text x="322" y="200" font-size="12.5" font-weight="600" fill="#4169E1">pinned</text>
    <text x="322" y="216" font-size="12" fill="#5c6b76">by pair 1→2</text>
    <text x="422" y="200" font-size="12.5" font-weight="600" fill="#1a2026">unpinned</text>
    <text x="422" y="216" font-size="12" fill="#5c6b76">no pair pins 2→3</text>
  </g>
  <text x="40" y="252" fill="#1a2026" font-size="13">Only 1→2 is pinned; the free 2·3 slot swaps to give <tspan fill="#4169E1" font-weight="600">[1,3,2]</tspan>, an equally</text>
  <text x="40" y="270" fill="#1a2026" font-size="13">short second supersequence — not every adjacency is pinned, so the answer is false.</text>
</svg>
