<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 332" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="320" fill="#ffffff"/>
  <!-- 3x6 terrain grid, cell 64, x=150 y=50 -->
  <!-- water cells: (1,1) +1, (1,2) +2, (1,4) +1 -->
  <g fill="#dbe4f6">
    <rect x="214" y="114" width="64" height="64"/>
    <rect x="278" y="114" width="64" height="64"/>
    <rect x="406" y="114" width="64" height="64"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <rect x="150" y="50" width="64" height="64"/>
    <rect x="214" y="50" width="64" height="64"/>
    <rect x="278" y="50" width="64" height="64"/>
    <rect x="342" y="50" width="64" height="64"/>
    <rect x="406" y="50" width="64" height="64"/>
    <rect x="470" y="50" width="64" height="64"/>
    <rect x="150" y="114" width="64" height="64"/>
    <rect x="214" y="114" width="64" height="64"/>
    <rect x="278" y="114" width="64" height="64"/>
    <rect x="342" y="114" width="64" height="64"/>
    <rect x="406" y="114" width="64" height="64"/>
    <rect x="470" y="114" width="64" height="64"/>
    <rect x="150" y="178" width="64" height="64"/>
    <rect x="214" y="178" width="64" height="64"/>
    <rect x="278" y="178" width="64" height="64"/>
    <rect x="342" y="178" width="64" height="64"/>
    <rect x="406" y="178" width="64" height="64"/>
    <rect x="470" y="178" width="64" height="64"/>
  </g>
  <!-- border ring (initial heap), dashed accent -->
  <rect x="150" y="50" width="384" height="192" fill="none" stroke="#4169E1" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- terrain values -->
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="182" y="88">1</text><text x="246" y="88">4</text><text x="310" y="88">3</text>
    <text x="374" y="88">1</text><text x="438" y="88">3</text><text x="502" y="88">2</text>
    <text x="182" y="152">3</text><text x="246" y="152">2</text><text x="310" y="152">1</text>
    <text x="374" y="152">3</text><text x="438" y="152">2</text><text x="502" y="152">4</text>
    <text x="182" y="216">2</text><text x="246" y="216">3</text><text x="310" y="216">3</text>
    <text x="374" y="216">2</text><text x="438" y="216">3</text><text x="502" y="216">1</text>
  </g>
  <!-- water depth labels -->
  <g text-anchor="middle" fill="#4169E1" font-size="11.5">
    <text x="246" y="168">water +1</text>
    <text x="310" y="168">water +2</text>
    <text x="438" y="168">water +1</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="40" y="272">The dashed ring is the initial heap: every border cell, ordered by height. Popping the</text>
    <text x="40" y="288">lowest cell settles its neighbors — lower ones trap the difference — and each is pushed</text>
    <text x="40" y="304">back at the effective level max(h, nh). Interior cells fill to the lowest barrier on</text>
    <text x="40" y="320">their path to the border: 1 + 2 + 1 = 4 units trapped in total.</text>
  </g>
</svg>
