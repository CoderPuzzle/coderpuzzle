<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- num = "1432219", k = 3; the greedy pops 4, 3, and the second 2 -->
  <text x="52" y="52" fill="#5c6b76" font-size="12.5">num, k = 3:</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="128" y="62" width="48" height="34"/>
    <rect x="272" y="62" width="48" height="34"/>
    <rect x="368" y="62" width="48" height="34"/>
    <rect x="416" y="62" width="48" height="34"/>
  </g>
  <g fill="#f6e8d3" stroke="#b8860b" stroke-width="1.6">
    <rect x="176" y="62" width="48" height="34"/>
    <rect x="224" y="62" width="48" height="34"/>
    <rect x="320" y="62" width="48" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="152" y="84" fill="#1a2026">1</text>
    <text x="200" y="84" fill="#8a6d1a">4</text>
    <text x="248" y="84" fill="#8a6d1a">3</text>
    <text x="296" y="84" fill="#1a2026">2</text>
    <text x="344" y="84" fill="#8a6d1a">2</text>
    <text x="392" y="84" fill="#1a2026">1</text>
    <text x="440" y="84" fill="#1a2026">9</text>
  </g>
  <text x="520" y="84" fill="#8a6d1a" font-size="12.5">popped (k = 3)</text>
  <!-- stack evolution; cells 44x30, bottoms aligned at y=236 -->
  <text x="52" y="140" fill="#5c6b76" font-size="12.5">stack stays non-decreasing while removals remain:</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="108" y="206" width="44" height="30"/><rect x="108" y="176" width="44" height="30"/>
    <rect x="248" y="206" width="44" height="30"/><rect x="248" y="176" width="44" height="30"/>
    <rect x="388" y="206" width="44" height="30"/><rect x="388" y="176" width="44" height="30"/><rect x="388" y="146" width="44" height="30"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <rect x="528" y="206" width="44" height="30"/><rect x="528" y="176" width="44" height="30"/><rect x="528" y="146" width="44" height="30"/><rect x="528" y="116" width="44" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="130" y="226">1</text><text x="130" y="196">3</text>
    <text x="270" y="226">1</text><text x="270" y="196">2</text>
    <text x="410" y="226">1</text><text x="410" y="196">2</text><text x="410" y="166">1</text>
    <text x="550" y="226">1</text><text x="550" y="196">2</text><text x="550" y="166">1</text><text x="550" y="136">9</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 186 100 Q 168 140 156 172" marker-end="url(#arrow)"/>
    <path d="M 284 100 Q 276 140 268 172" marker-end="url(#arrow)"/>
    <path d="M 340 100 Q 372 140 400 142" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="130" y="258">read 143</text>
    <text x="270" y="258">read 1432</text>
    <text x="410" y="258">read 143221</text>
    <text x="550" y="258">read 1432219</text>
  </g>
  <text x="410" y="282" text-anchor="middle" fill="#5c6b76" font-size="11.5">removals spent, k = 0</text>
  <text x="550" y="282" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">= 1219</text>
  <text x="320" y="310" text-anchor="middle" fill="#1a2026" font-size="13">A larger kept digit is popped the moment a smaller one arrives; after</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">k = 3 pops the stack reads <tspan fill="#4169E1" font-weight="600">1219</tspan> — the smallest keep-in-order choice.</text>
</svg>
