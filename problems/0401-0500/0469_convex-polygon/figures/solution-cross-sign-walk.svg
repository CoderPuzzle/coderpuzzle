<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 522" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="522" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- example 2: points = [[0,0],[0,10],[10,10],[10,0],[5,5]] mapped to
       (36*x + 80, 430 - 36*y). Each vertex carries the z cross product of
       (cur - prev) x (next - cur): negative = right turn, positive = left.
       (5,5) is the one +50 left turn, so the signs disagree -> false. -->
  <path d="M 80 430 L 80 70 L 440 70 L 440 430 L 260 250 Z" fill="#f0f3f7" stroke="#42525e" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- walk-direction ticks at edge midpoints -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="80" y1="256" x2="80" y2="246" marker-end="url(#arrow)"/>
    <line x1="254" y1="70" x2="264" y2="70" marker-end="url(#arrow)"/>
    <line x1="440" y1="244" x2="440" y2="254" marker-end="url(#arrow)"/>
    <line x1="353.5" y1="343.5" x2="346.5" y2="336.5" marker-end="url(#arrow)"/>
    <line x1="173.5" y1="336.5" x2="166.5" y2="343.5" marker-end="url(#arrow)"/>
  </g>
  <!-- vertices -->
  <circle cx="80" cy="430" r="5" fill="#1a2026"/>
  <circle cx="80" cy="70" r="5" fill="#1a2026"/>
  <circle cx="440" cy="70" r="5" fill="#1a2026"/>
  <circle cx="440" cy="430" r="5" fill="#1a2026"/>
  <circle cx="260" cy="250" r="6" fill="#4169E1"/>
  <!-- coordinates -->
  <g fill="#5c6b76" font-size="11">
    <text x="68" y="424" text-anchor="end">(0,0)</text>
    <text x="68" y="60" text-anchor="end">(0,10)</text>
    <text x="452" y="80">(10,10)</text>
    <text x="452" y="454">(10,0)</text>
    <text x="250" y="236" text-anchor="end">(5,5)</text>
  </g>
  <!-- per-vertex turn signs -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="140" y="52" text-anchor="middle">cross &#8722;100 (right)</text>
    <text x="452" y="60">cross &#8722;100 (right)</text>
    <text x="452" y="436">cross &#8722;50 (right)</text>
    <text x="140" y="458" text-anchor="middle">cross &#8722;50 (right)</text>
    <text x="274" y="240" fill="#4169E1" font-weight="600">+50 &#8212; LEFT turn</text>
  </g>
  <text x="340" y="478" text-anchor="middle" fill="#1a2026" font-size="13">cross z = (cur &#8722; prev) &#215; (next &#8722; cur); a convex polygon keeps one sign at every vertex.</text>
  <text x="340" y="500" text-anchor="middle" fill="#1a2026" font-size="13">Here four turns read &#8722;100, &#8722;100, &#8722;50, &#8722;50, but (5,5) flips to <tspan fill="#4169E1" font-weight="600">+50</tspan> &#8212; a left turn &#8212; so: false.</text>
</svg>
