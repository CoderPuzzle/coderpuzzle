<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="304" fill="#ffffff"/>
  <!-- nums = [3,10,5,25,2,8] shown in 5 bits; bit cells 26x24 at x = 88+30j,
       rows y = 64+28i; tinted rows are the winning pair 5 and 25;
       decision lines (right, x = 272) test candidate = best | (1 &lt;&lt; bit) -->
  <text x="320" y="28" text-anchor="middle" fill="#1a2026" font-weight="600">nums = [3,10,5,25,2,8] — build the answer bit by bit</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="103" y="54">bit 4</text><text x="133" y="54">bit 3</text><text x="163" y="54">bit 2</text>
    <text x="193" y="54">bit 1</text><text x="223" y="54">bit 0</text>
  </g>
  <g text-anchor="end" font-weight="600" fill="#5c6b76" font-size="13">
    <text x="76" y="81">3</text><text x="76" y="109">10</text><text x="76" y="137" fill="#4169E1">5</text>
    <text x="76" y="165" fill="#4169E1">25</text><text x="76" y="193">2</text><text x="76" y="221">8</text>
  </g>
  <g stroke="#42525e" stroke-width="1.25">
    <rect x="90" y="64" width="26" height="24" fill="#ffffff"/><rect x="120" y="64" width="26" height="24" fill="#ffffff"/><rect x="150" y="64" width="26" height="24" fill="#ffffff"/><rect x="180" y="64" width="26" height="24" fill="#ffffff"/><rect x="210" y="64" width="26" height="24" fill="#ffffff"/>
    <rect x="90" y="92" width="26" height="24" fill="#ffffff"/><rect x="120" y="92" width="26" height="24" fill="#ffffff"/><rect x="150" y="92" width="26" height="24" fill="#ffffff"/><rect x="180" y="92" width="26" height="24" fill="#ffffff"/><rect x="210" y="92" width="26" height="24" fill="#ffffff"/>
    <rect x="90" y="120" width="26" height="24" fill="#dbe4fb"/><rect x="120" y="120" width="26" height="24" fill="#dbe4fb"/><rect x="150" y="120" width="26" height="24" fill="#dbe4fb"/><rect x="180" y="120" width="26" height="24" fill="#dbe4fb"/><rect x="210" y="120" width="26" height="24" fill="#dbe4fb"/>
    <rect x="90" y="148" width="26" height="24" fill="#dbe4fb"/><rect x="120" y="148" width="26" height="24" fill="#dbe4fb"/><rect x="150" y="148" width="26" height="24" fill="#dbe4fb"/><rect x="180" y="148" width="26" height="24" fill="#dbe4fb"/><rect x="210" y="148" width="26" height="24" fill="#dbe4fb"/>
    <rect x="90" y="176" width="26" height="24" fill="#ffffff"/><rect x="120" y="176" width="26" height="24" fill="#ffffff"/><rect x="150" y="176" width="26" height="24" fill="#ffffff"/><rect x="180" y="176" width="26" height="24" fill="#ffffff"/><rect x="210" y="176" width="26" height="24" fill="#ffffff"/>
    <rect x="90" y="204" width="26" height="24" fill="#ffffff"/><rect x="120" y="204" width="26" height="24" fill="#ffffff"/><rect x="150" y="204" width="26" height="24" fill="#ffffff"/><rect x="180" y="204" width="26" height="24" fill="#ffffff"/><rect x="210" y="204" width="26" height="24" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="103" y="81">0</text><text x="133" y="81">0</text><text x="163" y="81">0</text><text x="193" y="81">1</text><text x="223" y="81">1</text>
    <text x="103" y="109">0</text><text x="133" y="109">1</text><text x="163" y="109">0</text><text x="193" y="109">1</text><text x="223" y="109">0</text>
    <text x="103" y="137">0</text><text x="133" y="137">0</text><text x="163" y="137">1</text><text x="193" y="137">0</text><text x="223" y="137">1</text>
    <text x="103" y="165">1</text><text x="133" y="165">1</text><text x="163" y="165">0</text><text x="193" y="165">0</text><text x="223" y="165">1</text>
    <text x="103" y="193">0</text><text x="133" y="193">0</text><text x="163" y="193">0</text><text x="193" y="193">1</text><text x="223" y="193">0</text>
    <text x="103" y="221">0</text><text x="133" y="221">1</text><text x="163" y="221">0</text><text x="193" y="221">0</text><text x="223" y="221">0</text>
  </g>
  <g font-size="12" fill="#1a2026">
    <text x="272" y="81"><tspan font-weight="600">bit 4:</tspan> cand 10000 — 00000 ^ 10000 hit → best 10000</text>
    <text x="272" y="109"><tspan font-weight="600">bit 3:</tspan> cand 11000 — 00000 ^ 11000 hit → best 11000</text>
    <text x="272" y="137"><tspan font-weight="600">bit 2:</tspan> cand 11100 — 00100 ^ 11100 hit → best <tspan fill="#4169E1" font-weight="600">11100</tspan></text>
    <text x="272" y="165"><tspan font-weight="600">bit 1:</tspan> cand 11110 — no pair → best stays 11100</text>
    <text x="272" y="193"><tspan font-weight="600">bit 0:</tspan> cand 11101 — no pair → best 11100 = 28</text>
  </g>
  <text x="272" y="227" font-size="12.5" fill="#1a2026">the same pair does it: 5 ^ 25 = 00101 ^ 11001 = <tspan fill="#4169E1" font-weight="600">11100</tspan></text>
  <text x="320" y="268" text-anchor="middle" fill="#1a2026" font-size="13">The same pair (5, 25) passes bits 4, 3, and 2, so best locks at 11100;</text>
  <text x="320" y="286" text-anchor="middle" fill="#1a2026" font-size="13">bits 1 and 0 find no prefix pair and stay 0 — the maximum is <tspan fill="#4169E1" font-weight="600">28</tspan>.</text>
</svg>
