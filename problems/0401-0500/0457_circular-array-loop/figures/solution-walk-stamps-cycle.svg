<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowedge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- nums = [2,-1,1,2,2], n = 5 on a ring, node r = 20, centers r = 92 around (170,150);
       the walk from start 0 stamps state 1 at 0, 2, 3; hop 3 -> 0 lands on stamped 0 and returns true;
       indices 1 and 4 are never walked; right panel: state array after the walk -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="170" y="30">0</text><text x="288" y="116">1</text><text x="224" y="260">2</text>
    <text x="116" y="260">3</text><text x="52" y="116">4</text>
  </g>
  <!-- hops of the walk -->
  <g fill="none" stroke="#42525e" stroke-width="1.8">
    <path d="M 177 79 L 217 202" marker-end="url(#arrowedge)"/>
    <path d="M 204 224 L 140 224" marker-end="url(#arrowedge)"/>
  </g>
  <path d="M 123 204 L 163 81" fill="none" stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrow)"/>
  <!-- stamped nodes: 0, 2, 3 -->
  <g text-anchor="middle" font-weight="600">
    <circle cx="170" cy="58" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <text x="170" y="63">2</text>
    <circle cx="224" cy="224" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <text x="224" y="229">1</text>
    <circle cx="116" cy="224" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <text x="116" y="229">2</text>
  </g>
  <!-- untouched nodes: 1, 4 -->
  <g text-anchor="middle" fill="#9aa7b2">
    <circle cx="258" cy="122" r="20" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <text x="258" y="127">-1</text>
    <circle cx="82" cy="122" r="20" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <text x="82" y="127">2</text>
  </g>
  <!-- hop order badges -->
  <g text-anchor="middle" font-size="11" font-weight="600">
    <circle cx="197" cy="140" r="9" fill="#5c6b76"/><text x="197" y="144" fill="#ffffff">1</text>
    <circle cx="172" cy="224" r="9" fill="#5c6b76"/><text x="172" y="228" fill="#ffffff">2</text>
    <circle cx="143" cy="142" r="9" fill="#4169E1"/><text x="143" y="146" fill="#ffffff">3</text>
  </g>
  <text x="98" y="176" text-anchor="end" fill="#4169E1" font-size="11.5" font-weight="600">closes the cycle</text>
  <path d="M 102 172 L 132 150" stroke="#4169E1" stroke-width="1" fill="none"/>
  <!-- state panel -->
  <text x="380" y="64" fill="#5c6b76" font-size="11.5">state: 0 unseen, 1 on the path</text>
  <g text-anchor="middle" font-size="12.5">
    <rect x="380" y="72" width="30" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="414" y="72" width="30" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="448" y="72" width="30" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="482" y="72" width="30" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="516" y="72" width="30" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <text x="395" y="89">1</text><text x="429" y="89" fill="#9aa7b2">0</text>
    <text x="463" y="89">1</text><text x="497" y="89">1</text><text x="531" y="89" fill="#9aa7b2">0</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="395" y="112">0</text><text x="429" y="112">1</text><text x="463" y="112">2</text>
    <text x="497" y="112">3</text><text x="531" y="112">4</text>
  </g>
  <text x="380" y="140" fill="#1a2026" font-size="13">walk from 0: 0 &#8594; 2 &#8594; 3</text>
  <text x="380" y="164" fill="#5c6b76" font-size="12">the hop 3 &#8594; 0 lands on stamped 0:</text>
  <text x="380" y="180" fill="#5c6b76" font-size="12">one direction, k = 3 &gt; 1 &#8212; legal.</text>
  <g fill="#5c6b76" font-size="11.5">
    <text x="380" y="216">refused hops: a sign flip, or a</text>
    <text x="380" y="231">self-loop (k = 1); a dead walk</text>
    <text x="380" y="246">retires its whole path (state 2).</text>
  </g>
  <rect x="376" y="264" width="110" height="26" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="431" y="282" text-anchor="middle" fill="#4169E1" font-size="15" font-weight="600">return true</text>
  <text x="300" y="308" text-anchor="middle" fill="#1a2026" font-size="13">The walk from 0 stamps 0, 2, 3 and its third hop returns to stamped</text>
  <text x="300" y="326" text-anchor="middle" fill="#1a2026" font-size="13">0 &#8212; the same-direction cycle <tspan fill="#4169E1" font-weight="600">0 &#8594; 2 &#8594; 3 &#8594; 0</tspan>, so the answer is true.</text>
</svg>
