<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums = [1,3,-1,-3,5,3,6,7], k = 3; sorted window after insorting nums[i] and evicting nums[i-3]; median = window[k//2] = window[1]; rows y=60+60r, cells 50x30 at x=150 -->
  <text x="280" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums = [1, 3, -1, -3, 5, 3, 6, 7]&#160;&#160;&#160;k = 3</text>
  <text x="225" y="48" text-anchor="middle" fill="#5c6b76" font-size="12">sorted window</text>
  <text x="316" y="48" text-anchor="start" fill="#5c6b76" font-size="12">median = window[1]</text>
  <!-- window rows -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="150" y="60" width="50" height="30"/><rect x="254" y="60" width="50" height="30"/>
    <rect x="150" y="120" width="50" height="30"/><rect x="254" y="120" width="50" height="30"/>
    <rect x="150" y="180" width="50" height="30"/><rect x="254" y="180" width="50" height="30"/>
    <rect x="150" y="240" width="50" height="30"/><rect x="254" y="240" width="50" height="30"/>
    <rect x="150" y="300" width="50" height="30"/><rect x="254" y="300" width="50" height="30"/>
    <rect x="150" y="360" width="50" height="30"/><rect x="254" y="360" width="50" height="30"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="202" y="60" width="50" height="30"/><rect x="202" y="120" width="50" height="30"/>
    <rect x="202" y="180" width="50" height="30"/><rect x="202" y="240" width="50" height="30"/>
    <rect x="202" y="300" width="50" height="30"/><rect x="202" y="360" width="50" height="30"/>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="175" y="80">-1</text><text x="279" y="80">3</text>
    <text x="175" y="140">-3</text><text x="279" y="140">3</text>
    <text x="175" y="200">-3</text><text x="279" y="200">5</text>
    <text x="175" y="260">-3</text><text x="279" y="260">5</text>
    <text x="175" y="320">3</text><text x="279" y="320">6</text>
    <text x="175" y="380">3</text><text x="279" y="380">7</text>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#4169E1">
    <text x="227" y="80">1</text><text x="227" y="140">-1</text><text x="227" y="200">-1</text>
    <text x="227" y="260">3</text><text x="227" y="320">5</text><text x="227" y="380">6</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="140" y="79">i = 2</text><text x="140" y="139">i = 3</text><text x="140" y="199">i = 4</text>
    <text x="140" y="259">i = 5</text><text x="140" y="319">i = 6</text><text x="140" y="379">i = 7</text>
  </g>
  <g text-anchor="start" fill="#4169E1" font-size="14" font-weight="600">
    <text x="316" y="80">1</text><text x="316" y="140">-1</text><text x="316" y="200">-1</text>
    <text x="316" y="260">3</text><text x="316" y="320">5</text><text x="316" y="380">6</text>
  </g>
  <!-- transitions: binary insert of the entrant, then eviction of the leaver at its leftmost index -->
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 108 96 L 108 112" marker-end="url(#arrow)"/>
    <path d="M 108 156 L 108 172" marker-end="url(#arrow)"/>
    <path d="M 108 216 L 108 232" marker-end="url(#arrow)"/>
    <path d="M 108 276 L 108 292" marker-end="url(#arrow)"/>
    <path d="M 108 336 L 108 352" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="start" fill="#5c6b76" font-size="11.5">
    <text x="122" y="109">insert -3 at 0, evict 1 at 2</text>
    <text x="122" y="169">insert 5 at 3, evict 3 at 2</text>
    <text x="122" y="229">insert 3 at 2, evict -1 at 1</text>
    <text x="122" y="289">insert 6 at 3, evict -3 at 0</text>
    <text x="122" y="349">insert 7 at 3, evict 5 at 1</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="280" y="424">One sorted list mirrors the window: insort the entrant, evict the leaver</text>
    <text x="280" y="444">at its leftmost match, then read slot k/2 = 1: medians <tspan fill="#4169E1" font-weight="600">1, -1, -1, 3, 5, 6</tspan>.</text>
  </g>
</svg>
