<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- n-ary [1,null,3,2,4,null,5,6] encodes to binary [1,3,null,5,2,null,6,null,4]; circles r=17, levels y = 60 + 64i -->
  <text x="140" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">n-ary tree</text>
  <text x="480" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">binary encoding</text>
  <!-- n-ary edges: parent to children in order -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="150" y1="66" x2="85" y2="140"/>
    <line x1="150" y1="66" x2="150" y2="140"/>
    <line x1="150" y1="66" x2="215" y2="140"/>
    <line x1="85" y1="140" x2="55" y2="214"/>
    <line x1="85" y1="140" x2="115" y2="214"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="150" cy="66" r="17"/><circle cx="85" cy="140" r="17"/><circle cx="150" cy="140" r="17"/>
    <circle cx="215" cy="140" r="17"/><circle cx="55" cy="214" r="17"/><circle cx="115" cy="214" r="17"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="150" y="71">1</text><text x="85" y="145">3</text><text x="150" y="145">2</text>
    <text x="215" y="145">4</text><text x="55" y="219">5</text><text x="115" y="219">6</text>
  </g>
  <path d="M 244 158 H 310" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="277" y="146" text-anchor="middle" fill="#5c6b76" font-size="12">encode</text>
  <!-- binary edges: left = first child (blue), right = next sibling (gray) -->
  <g fill="none" stroke-width="1.6">
    <line x1="480" y1="60" x2="410" y2="124" stroke="#4169E1"/>
    <line x1="410" y1="124" x2="340" y2="188" stroke="#4169E1"/>
    <line x1="410" y1="124" x2="480" y2="188" stroke="#42525e"/>
    <line x1="340" y1="188" x2="410" y2="252" stroke="#42525e"/>
    <line x1="480" y1="188" x2="550" y2="252" stroke="#42525e"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="480" cy="60" r="17"/><circle cx="410" cy="124" r="17"/><circle cx="340" cy="188" r="17"/>
    <circle cx="480" cy="188" r="17"/><circle cx="410" cy="252" r="17"/><circle cx="550" cy="252" r="17"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="480" y="65">1</text><text x="410" y="129">3</text><text x="340" y="193">5</text>
    <text x="480" y="193">2</text><text x="410" y="257">6</text><text x="550" y="257">4</text>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="600">
    <text x="431" y="88" fill="#4169E1">L</text><text x="361" y="152" fill="#4169E1">L</text>
    <text x="459" y="152" fill="#5c6b76">R</text><text x="389" y="216" fill="#5c6b76">R</text>
    <text x="529" y="216" fill="#5c6b76">R</text>
  </g>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">First child left, next sibling right: 1's left child is 3; siblings 2 then 4 chain right</text>
  <text x="320" y="336" text-anchor="middle" fill="#1a2026" font-size="13">off 3, and 3's own children <tspan fill="#4169E1" font-weight="600">5</tspan> and <tspan fill="#4169E1" font-weight="600">6</tspan> chain right off 5 — one left edge per group.</text>
</svg>
