<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="292" fill="#ffffff"/>
  <!-- example 1: matchsticks = [1,1,2,2,2], total 8, side = 8/4 = 2.
       Sorted descending 2,2,2,1,1 placed in order into four side buckets
       (34 px per length unit, capacity 2 = 68 px). Sticks 1-3 each fill a
       side; sticks 4 and 5 stack in side 4. Panel: the tried-set pruning
       skips further empty sides for the same stick. -->
  <text x="60" y="48" fill="#5c6b76" font-size="12">sorted descending &#8212; placed in this order:</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="60" y="60" width="34" height="24"/><rect x="100" y="60" width="34" height="24"/><rect x="140" y="60" width="34" height="24"/><rect x="180" y="60" width="34" height="24"/><rect x="220" y="60" width="34" height="24"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="77" y="77">2</text><text x="117" y="77">2</text><text x="157" y="77">2</text><text x="197" y="77">1</text><text x="237" y="77">1</text>
  </g>
  <text x="276" y="77" fill="#1a2026" font-size="12.5">side = 8/4 = 2</text>
  <!-- side buckets -->
  <g fill="#4169E1">
    <rect x="50" y="110" width="46" height="68"/>
    <rect x="150" y="110" width="46" height="68"/>
    <rect x="250" y="110" width="46" height="68"/>
    <rect x="350" y="144" width="46" height="34"/>
    <rect x="350" y="110" width="46" height="34"/>
  </g>
  <g fill="none" stroke="#42525e" stroke-width="1.4">
    <rect x="50" y="110" width="46" height="68"/>
    <rect x="150" y="110" width="46" height="68"/>
    <rect x="250" y="110" width="46" height="68"/>
    <rect x="350" y="110" width="46" height="68"/>
    <line x1="350" y1="144" x2="396" y2="144" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">
    <text x="73" y="150">2</text><text x="173" y="150">2</text><text x="273" y="150">2</text>
    <text x="373" y="133">1</text><text x="373" y="166">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="73" y="196">side 1 &#183; stick 1</text>
    <text x="173" y="196">side 2 &#183; stick 2</text>
    <text x="273" y="196">side 3 &#183; stick 3</text>
    <text x="373" y="196">side 4 &#183; sticks 4+5</text>
  </g>
  <!-- pruning note -->
  <text x="452" y="120" fill="#1a2026" font-size="12.5" font-weight="600">equal-length pruning</text>
  <g fill="#5c6b76" font-size="12">
    <text x="452" y="142">stick 2 (length 2) scans the</text>
    <text x="452" y="159">sides: side 1 can't fit 2+2,</text>
    <text x="452" y="176">side 2 (empty) takes it. If that</text>
    <text x="452" y="193">branch failed, sides 3 and 4 &#8212;</text>
    <text x="452" y="210">also empty, identical state &#8212;</text>
    <text x="452" y="227">are skipped by the tried set.</text>
  </g>
  <text x="340" y="246" text-anchor="middle" fill="#1a2026" font-size="13">Each 2 lands alone on a side; the two 1s share side 4 &#8212; every side sums to <tspan fill="#4169E1" font-weight="600">exactly 2</tspan> &#8594; true.</text>
  <text x="340" y="268" text-anchor="middle" fill="#1a2026" font-size="13">Capacity checks (sum + stick &#8804; 2) prune full sides; the tried set prunes equal-sum sides.</text>
</svg>
