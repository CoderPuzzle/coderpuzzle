<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="300" fill="#ffffff"/>
  <!-- plain edges -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="320" y1="66" x2="180" y2="116"/>
    <line x1="320" y1="66" x2="470" y2="116"/>
    <line x1="180" y1="146" x2="110" y2="196"/>
    <line x1="180" y1="146" x2="250" y2="196"/>
    <line x1="110" y1="226" x2="60" y2="266"/>
    <line x1="110" y1="226" x2="160" y2="266"/>
    <line x1="250" y1="226" x2="310" y2="266"/>
    <line x1="470" y1="146" x2="470" y2="186"/>
  </g>
  <!-- highlighted path edges (accent) -->
  <g stroke="#4169E1" stroke-width="3">
    <line x1="320" y1="66" x2="180" y2="116"/>
    <line x1="180" y1="146" x2="110" y2="196"/>
    <line x1="180" y1="146" x2="250" y2="196"/>
    <line x1="250" y1="226" x2="310" y2="266"/>
    <line x1="320" y1="66" x2="470" y2="116"/>
    <line x1="470" y1="146" x2="470" y2="186"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="320" cy="54" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="320" y="59" text-anchor="middle" fill="#1a2026">10</text>
    <circle cx="180" cy="132" r="20" fill="#4169E1"/>
    <text x="180" y="137" text-anchor="middle" fill="#ffffff">5</text>
    <circle cx="470" cy="132" r="20" fill="#4169E1"/>
    <text x="470" y="137" text-anchor="middle" fill="#ffffff">-3</text>
    <circle cx="110" cy="212" r="20" fill="#4169E1"/>
    <text x="110" y="217" text-anchor="middle" fill="#ffffff">3</text>
    <circle cx="250" cy="212" r="20" fill="#4169E1"/>
    <text x="250" y="217" text-anchor="middle" fill="#ffffff">2</text>
    <circle cx="470" cy="206" r="20" fill="#4169E1"/>
    <text x="470" y="211" text-anchor="middle" fill="#ffffff">11</text>
    <circle cx="60" cy="280" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="60" y="285" text-anchor="middle" fill="#1a2026" font-size="12.5">3</text>
    <circle cx="160" cy="280" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="160" y="285" text-anchor="middle" fill="#1a2026" font-size="12.5">-2</text>
    <circle cx="310" cy="280" r="18" fill="#4169E1"/>
    <text x="310" y="285" text-anchor="middle" fill="#ffffff" font-size="12.5">1</text>
  </g>
  <!-- path labels -->
  <g font-size="12.5" fill="#4169E1">
    <text x="128" y="100">5 + 3 = 8</text>
    <text x="196" y="172">5 + 2 + 1 = 8</text>
    <text x="486" y="176">-3 + 11 = 8</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="40" y="40">Paths need not start at the root: each highlighted downward</text>
    <text x="40" y="56">chain sums to the target 8. The DFS counts, at every node,</text>
    <text x="40" y="72">ancestors whose prefix sum equals running − 8.</text>
  </g>
</svg>
