<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- expression = "F?1:T?4:5"; boxes 30x32 at x=187+32i, y=40; stack frames bottom-aligned at y=250, cells 56x30 at cx=80+120k -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="187" y="40" width="30" height="32"/><rect x="251" y="40" width="30" height="32"/>
    <rect x="283" y="40" width="30" height="32"/><rect x="315" y="40" width="30" height="32"/><rect x="379" y="40" width="30" height="32"/>
    <rect x="411" y="40" width="30" height="32"/><rect x="443" y="40" width="30" height="32"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="219" y="40" width="30" height="32"/><rect x="347" y="40" width="30" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="202" y="61" fill="#1a2026">F</text><text x="234" y="61" fill="#4169E1">?</text>
    <text x="266" y="61" fill="#1a2026">1</text><text x="298" y="61" fill="#1a2026">:</text>
    <text x="330" y="61" fill="#1a2026">T</text><text x="362" y="61" fill="#4169E1">?</text>
    <text x="394" y="61" fill="#1a2026">4</text><text x="426" y="61" fill="#1a2026">:</text>
    <text x="458" y="61" fill="#1a2026">5</text>
  </g>
  <path d="M 466 92 L 194 92" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="112" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">scan right to left</text>
  <text x="140" y="150" text-anchor="middle" fill="#5c6b76" font-size="12">stack (bottom → top)</text>
  <!-- stack frames: 5 | 5,: ,4 | 4 | 4,: ,1 | 4 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="52" y="220" width="56" height="30"/>
    <rect x="172" y="220" width="56" height="30"/><rect x="172" y="190" width="56" height="30"/><rect x="172" y="160" width="56" height="30"/>
    <rect x="412" y="220" width="56" height="30"/><rect x="412" y="190" width="56" height="30"/><rect x="412" y="160" width="56" height="30"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="292" y="220" width="56" height="30"/>
    <rect x="532" y="220" width="56" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="80" y="240" fill="#1a2026">5</text>
    <text x="200" y="240" fill="#1a2026">5</text><text x="200" y="210" fill="#5c6b76">:</text><text x="200" y="180" fill="#1a2026">4</text>
    <text x="320" y="240" fill="#4169E1">4</text>
    <text x="440" y="240" fill="#1a2026">4</text><text x="440" y="210" fill="#5c6b76">:</text><text x="440" y="180" fill="#1a2026">1</text>
    <text x="560" y="240" fill="#4169E1">4</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 114 235 L 162 235" marker-end="url(#arrowgray)"/>
    <path d="M 234 235 L 282 235" marker-end="url(#arrowgray)"/>
    <path d="M 354 235 L 402 235" marker-end="url(#arrowgray)"/>
    <path d="M 474 235 L 522 235" marker-end="url(#arrowgray)"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="80" y="274">push 5</text>
    <text x="200" y="274">push :, 4</text>
    <text x="320" y="274">pop 4 : 5,</text>
    <text x="440" y="274">push :, 1</text>
    <text x="560" y="274">pop 1 : 4,</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">
    <text x="320" y="290">T → push 4</text>
    <text x="560" y="290">F → push 4</text>
  </g>
  <text x="40" y="318" fill="#1a2026" font-size="13">Each ? pops its true branch, its :, and its false branch, pushing one</text>
  <text x="40" y="336" fill="#1a2026" font-size="13">character back: T keeps 4, then F takes the false 4 — one value, <tspan fill="#4169E1" font-weight="600">4</tspan>, remains.</text>
</svg>
