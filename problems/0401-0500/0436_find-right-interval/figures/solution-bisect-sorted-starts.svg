<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="296" fill="#ffffff"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- intervals [[3,4],[2,3],[1,2]]; 80 px per unit, x = 80 + 80v; sorted starts carry (1,i=2),(2,i=1),(3,i=0); end 4 finds nothing -->
  <!-- number line with the three intervals chained end to start -->
  <line x1="60" y1="64" x2="496" y2="64" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="160" y1="59" x2="160" y2="69"/><line x1="240" y1="59" x2="240" y2="69"/>
    <line x1="320" y1="59" x2="320" y2="69"/><line x1="400" y1="59" x2="400" y2="69"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="160" y="48">1</text><text x="240" y="48">2</text><text x="320" y="48">3</text><text x="400" y="48">4</text>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
    <rect x="160" y="76" width="80" height="20"/><rect x="240" y="76" width="80" height="20"/>
    <rect x="320" y="76" width="80" height="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">
    <text x="200" y="90">[1,2]</text><text x="280" y="90">[2,3]</text><text x="360" y="90">[3,4]</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="200" y="114">i = 2</text><text x="280" y="114">i = 1</text><text x="360" y="114">i = 0</text>
  </g>
  <g fill="#4169E1">
    <circle cx="240" cy="96" r="3.5"/><circle cx="320" cy="96" r="3.5"/><circle cx="400" cy="96" r="3.5"/>
  </g>
  <!-- sorted starts, each cell keeping the index it came from -->
  <text x="160" y="150" text-anchor="middle" fill="#5c6b76" font-size="11.5">sorted starts</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="124" y="158" width="72" height="48"/><rect x="204" y="158" width="72" height="48"/>
    <rect x="284" y="158" width="72" height="48"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="160" y="182" fill="#1a2026">1</text><text x="240" y="182" fill="#1a2026">2</text>
    <text x="320" y="182" fill="#1a2026">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="160" y="198">i = 2</text><text x="240" y="198">i = 1</text><text x="320" y="198">i = 0</text>
  </g>
  <!-- each end bisects to the first start at or above it; end 4 finds none -->
  <g fill="none" stroke="#4169E1" stroke-width="1.8">
    <path d="M 240 102 V 152" marker-end="url(#arrow)"/>
    <path d="M 320 102 V 152" marker-end="url(#arrow)"/>
    <path d="M 400 102 C 400 128, 420 140, 452 154" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="250" y="130">end = 2</text><text x="330" y="130">end = 3</text>
    <text x="416" y="118">end = 4</text>
  </g>
  <rect x="424" y="158" width="72" height="48" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="460" y="188" text-anchor="middle" fill="#4169E1" font-size="15" font-weight="600">-1</text>
  <text x="460" y="226" text-anchor="middle" fill="#5c6b76" font-size="11.5">no start at or above 4</text>
  <text x="320" y="258" text-anchor="middle" fill="#1a2026" font-size="13">Each end drops to the first sorted start at or above it: end 3 hits start 3,</text>
  <text x="320" y="278" text-anchor="middle" fill="#1a2026" font-size="13">end 2 hits start 2; end 4 finds nothing — the answers are <tspan fill="#4169E1" font-weight="600">[-1, 0, 1]</tspan>.</text>
</svg>
