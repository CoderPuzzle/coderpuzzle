<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="260" fill="#ffffff"/>
  <!-- x axis: unit = 130px, x(v) = 60 + 130*(v-1) -> 1..4 span 60..450 -->
  <line x1="40" y1="220" x2="500" y2="220" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="60" y1="220" x2="60" y2="226"/><line x1="190" y1="220" x2="190" y2="226"/>
    <line x1="320" y1="220" x2="320" y2="226"/><line x1="450" y1="220" x2="450" y2="226"/>
  </g>
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="60" y="242">1</text><text x="190" y="242">2</text><text x="320" y="242">3</text><text x="450" y="242">4</text>
  </g>
  <!-- sorted by end: [1,2] keep, [2,3] keep, [1,3] remove, [3,4] keep -->
  <rect x="60" y="60" width="130" height="20" rx="9" fill="#4169E1"/>
  <text x="125" y="50" text-anchor="middle" fill="#1a2026" font-size="12.5">[1,2] — keep</text>
  <rect x="190" y="105" width="130" height="20" rx="9" fill="#4169E1"/>
  <text x="255" y="95" text-anchor="middle" fill="#1a2026" font-size="12.5">[2,3] — keep (start == prev end)</text>
  <rect x="60" y="150" width="260" height="20" rx="9" fill="#f7e9d7" stroke="#b57f30" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="190" y="140" text-anchor="middle" fill="#b57f30" font-size="12.5">[1,3] — remove (start 1 &lt; prev end 3)</text>
  <rect x="320" y="195" width="130" height="20" rx="9" fill="#4169E1"/>
  <text x="385" y="185" text-anchor="middle" fill="#1a2026" font-size="12.5">[3,4] — keep</text>
  <!-- prev_end markers -->
  <g stroke="#4169E1" stroke-width="1.6">
    <line x1="190" y1="55" x2="190" y2="215" stroke-dasharray="3 3"/>
    <line x1="320" y1="100" x2="320" y2="215" stroke-dasharray="3 3"/>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="196" y="212">prev_end = 2</text>
    <text x="326" y="86">prev_end = 3</text>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="520" y="60">Sorted by right</text>
    <text x="520" y="76">endpoint, each</text>
    <text x="520" y="92">interval is kept</text>
    <text x="520" y="108">only if it starts</text>
    <text x="520" y="124">at or after the</text>
    <text x="520" y="140">last kept end.</text>
    <text x="520" y="170">One removal</text>
    <text x="520" y="186">here: [1,3].</text>
  </g>
</svg>
