<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [1,0,1,1,0]; cells 46x38 pitch 50 at x=150, rows y=66 and y=188; window A [0,3] length 4, window B [2,4] length 3; blue cells mark the single flippable 0; best = 4 -->
  <text x="273" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums = [1, 0, 1, 1, 0]</text>
  <!-- state A: r = 3, window [0..3] -->
  <rect x="146" y="48" width="204" height="8" rx="4" fill="#4169E1"/>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="150" y="66" width="46" height="38"/><rect x="250" y="66" width="46" height="38"/>
    <rect x="300" y="66" width="46" height="38"/>
  </g>
  <rect x="200" y="66" width="46" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="350" y="66" width="46" height="38" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.1"/>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="173" y="91" fill="#1a2026">1</text><text x="223" y="91" fill="#1a2026">0</text>
    <text x="273" y="91" fill="#1a2026">1</text><text x="323" y="91" fill="#1a2026">1</text>
    <text x="373" y="91" fill="#9aa7b2">0</text>
  </g>
  <text x="458" y="89" text-anchor="start" fill="#1a2026" font-size="12.5">length 4 — <tspan fill="#4169E1" font-weight="600">best = 4</tspan></text>
  <path d="M 173 124 L 173 108" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <text x="173" y="140" text-anchor="middle" fill="#5c6b76" font-size="11.5">l = 0</text>
  <path d="M 323 124 L 323 108" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="323" y="140" text-anchor="middle" fill="#4169E1" font-size="11.5">r = 3</text>
  <text x="273" y="162" text-anchor="middle" fill="#5c6b76" font-size="12.5">r = 4 brings a second 0, so l advances until only one 0 remains</text>
  <!-- state B: r = 4, l jumped to 2, window [2..4] -->
  <rect x="246" y="170" width="154" height="8" rx="4" fill="#4169E1"/>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="250" y="188" width="46" height="38"/><rect x="300" y="188" width="46" height="38"/>
  </g>
  <rect x="350" y="188" width="46" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g stroke="#9aa7b2" stroke-width="1.1" fill="#f0f3f7">
    <rect x="150" y="188" width="46" height="38"/><rect x="200" y="188" width="46" height="38"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="173" y="213" fill="#9aa7b2">1</text><text x="223" y="213" fill="#9aa7b2">0</text>
    <text x="273" y="213" fill="#1a2026">1</text><text x="323" y="213" fill="#1a2026">1</text>
    <text x="373" y="213" fill="#1a2026">0</text>
  </g>
  <text x="458" y="211" text-anchor="start" fill="#1a2026" font-size="12.5">length 3 — <tspan fill="#4169E1" font-weight="600">best stays 4</tspan></text>
  <path d="M 173 250 L 173 234" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrowM)"/>
  <text x="173" y="266" text-anchor="middle" fill="#9aa7b2" font-size="11.5">old l = 0</text>
  <path d="M 273 250 L 273 234" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <text x="273" y="266" text-anchor="middle" fill="#5c6b76" font-size="11.5">l = 2</text>
  <path d="M 373 250 L 373 234" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="373" y="266" text-anchor="middle" fill="#4169E1" font-size="11.5">r = 4</text>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="310" y="300">The window keeps at most one 0; when a second slips in at r = 4,</text>
    <text x="310" y="320">l jumps to index 2 and the best span stays [1, 0, 1, 1] — <tspan fill="#4169E1" font-weight="600">length 4</tspan>.</text>
  </g>
</svg>
