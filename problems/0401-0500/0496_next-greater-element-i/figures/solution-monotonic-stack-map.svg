<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums2 = [1,3,4,2]; stack snapshots under each scanned value; map at right; nums1 lookup strip below -->
  <!-- nums2 = [1,3,4,2]; cells 60x34 at y=44, column centers x=80+100i -->
  <text x="46" y="30" fill="#5c6b76" font-size="12">scan nums2 left to right; stack state after each step</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="50" y="44" width="60" height="34"/>
    <rect x="150" y="44" width="60" height="34"/>
    <rect x="250" y="44" width="60" height="34"/>
    <rect x="350" y="44" width="60" height="34"/>
  </g>
  <text x="80" y="66" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <text x="180" y="66" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <text x="280" y="66" text-anchor="middle" fill="#1a2026" font-weight="600">4</text>
  <text x="380" y="66" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <!-- snapshots of the stack after each element; accent stroke = top of stack -->
  <rect x="52" y="110" width="56" height="24" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="80" y="126.5" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <text x="80" y="176" text-anchor="middle" fill="#5c6b76" font-size="11">push 1</text>
  <rect x="152" y="110" width="56" height="24" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="180" y="126.5" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <text x="180" y="176" text-anchor="middle" fill="#5c6b76" font-size="11">3 &gt; 1 &#8594; pop 1</text>
  <text x="180" y="192" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">ng[1] = 3</text>
  <text x="180" y="208" text-anchor="middle" fill="#5c6b76" font-size="11">push 3</text>
  <rect x="252" y="110" width="56" height="24" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="280" y="126.5" text-anchor="middle" fill="#1a2026" font-weight="600">4</text>
  <text x="280" y="176" text-anchor="middle" fill="#5c6b76" font-size="11">4 &gt; 3 &#8594; pop 3</text>
  <text x="280" y="192" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">ng[3] = 4</text>
  <text x="280" y="208" text-anchor="middle" fill="#5c6b76" font-size="11">push 4</text>
  <rect x="352" y="110" width="56" height="24" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="380" y="126.5" text-anchor="middle" fill="#1a2026" font-weight="600">4</text>
  <rect x="352" y="138" width="56" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="380" y="154.5" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <text x="413" y="125" fill="#9aa7b2" font-size="9.5">top</text>
  <text x="413" y="153" fill="#9aa7b2" font-size="9.5">bottom</text>
  <text x="380" y="176" text-anchor="middle" fill="#5c6b76" font-size="11">2 &lt; 4 &#8594; push 2</text>
  <text x="380" y="192" text-anchor="middle" fill="#5c6b76" font-size="11">nothing pops</text>
  <!-- next_greater after the scan; 4 and 2 never pop, so they map to -1 -->
  <text x="470" y="58" fill="#5c6b76" font-size="12.5">next_greater</text>
  <text x="470" y="84" fill="#1a2026" font-size="13.5">1 &#8594; 3</text>
  <text x="470" y="108" fill="#1a2026" font-size="13.5">3 &#8594; 4</text>
  <text x="470" y="132" fill="#9aa7b2" font-size="13.5">4 &#8594; &#8722;1</text>
  <text x="470" y="156" fill="#9aa7b2" font-size="13.5">2 &#8594; &#8722;1</text>
  <text x="470" y="180" fill="#9aa7b2" font-size="11">still on the stack &#8594; no greater</text>
  <!-- nums1 = [4,1,2] answered by map lookups -->
  <text x="46" y="228" fill="#5c6b76" font-size="12.5">nums1</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="50" y="236" width="40" height="30"/>
    <rect x="110" y="236" width="40" height="30"/>
    <rect x="170" y="236" width="40" height="30"/>
  <text x="70" y="256" text-anchor="middle" fill="#1a2026">4</text>
  <text x="130" y="256" text-anchor="middle" fill="#1a2026">1</text>
  <text x="190" y="256" text-anchor="middle" fill="#1a2026">2</text>
  </g>
  <line x1="222" y1="251" x2="258" y2="251" stroke="#42525e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="350" y="228" text-anchor="middle" fill="#5c6b76" font-size="11">ans</text>
  <g fill="#ffffff" stroke="#4169E1" stroke-width="1.4">
    <rect x="270" y="236" width="40" height="30"/>
    <rect x="330" y="236" width="40" height="30"/>
    <rect x="390" y="236" width="40" height="30"/>
  <text x="290" y="256" text-anchor="middle" fill="#4169E1" font-weight="600">&#8722;1</text>
  <text x="350" y="256" text-anchor="middle" fill="#4169E1" font-weight="600">3</text>
  <text x="410" y="256" text-anchor="middle" fill="#4169E1" font-weight="600">&#8722;1</text>
  </g>
  <text x="450" y="256" fill="#5c6b76" font-size="11.5">one map lookup per query</text>
  <text x="340" y="288" text-anchor="middle" fill="#1a2026" font-size="13">Each pop records its answer (ng[1] = <tspan fill="#4169E1" font-weight="600">3</tspan>, ng[3] = <tspan fill="#4169E1" font-weight="600">4</tspan>); the leftovers 4 and 2 map to <tspan fill="#4169E1" font-weight="600">&#8722;1</tspan>.</text>
  <text x="340" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Looking nums1 = [4,1,2] up in the map gives ans = [<tspan fill="#4169E1" font-weight="600">&#8722;1, 3, &#8722;1</tspan>].</text>
</svg>
