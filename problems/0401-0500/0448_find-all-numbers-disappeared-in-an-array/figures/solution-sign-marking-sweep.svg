<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [4,3,2,7,8,2,3,1], n = 8; cells 56x32 at x = 70+64c;
       row 1 = start, row 2 = after pass 1 flips slot v-1 negative for each abs value read;
       slots 4 and 5 stay positive, so values 5 and 6 are the disappeared numbers -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="98" y="40">0</text><text x="162" y="40">1</text><text x="226" y="40">2</text>
    <text x="290" y="40">3</text><text x="354" y="40">4</text><text x="418" y="40">5</text>
    <text x="482" y="40">6</text><text x="546" y="40">7</text>
  </g>
  <text x="62" y="40" text-anchor="end" fill="#9aa7b2" font-size="11.5">index</text>
  <text x="62" y="71" text-anchor="end" fill="#5c6b76" font-size="12.5">before</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="70" y="50" width="56" height="32"/><rect x="134" y="50" width="56" height="32"/>
    <rect x="198" y="50" width="56" height="32"/><rect x="262" y="50" width="56" height="32"/>
    <rect x="326" y="50" width="56" height="32"/><rect x="390" y="50" width="56" height="32"/>
    <rect x="454" y="50" width="56" height="32"/><rect x="518" y="50" width="56" height="32"/>
  </g>
  <g text-anchor="middle">
    <text x="98" y="71">4</text><text x="162" y="71">3</text><text x="226" y="71">2</text>
    <text x="290" y="71">7</text><text x="354" y="71">8</text><text x="418" y="71">2</text>
    <text x="482" y="71">3</text><text x="546" y="71">1</text>
  </g>
  <text x="70" y="120" fill="#1a2026" font-size="12.5">pass 1 reads abs(nums[i]) = v and flips slot v - 1 negative:</text>
  <text x="70" y="140" fill="#5c6b76" font-size="12.5">4&#8594;slot 3,  3&#8594;slot 2,  2&#8594;slot 1,  7&#8594;slot 6,  8&#8594;slot 7,</text>
  <text x="70" y="158" fill="#5c6b76" font-size="12.5">2&#8594;slot 1 already marked,  3&#8594;slot 2 already marked,  1&#8594;slot 0</text>
  <text x="62" y="213" text-anchor="end" fill="#5c6b76" font-size="12.5">after</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="70" y="192" width="56" height="32"/><rect x="134" y="192" width="56" height="32"/>
    <rect x="198" y="192" width="56" height="32"/><rect x="262" y="192" width="56" height="32"/>
    <rect x="454" y="192" width="56" height="32"/><rect x="518" y="192" width="56" height="32"/>
  </g>
  <!-- still-positive slots 4 and 5 -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <rect x="326" y="192" width="56" height="32"/><rect x="390" y="192" width="56" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="98" y="213">-4</text><text x="162" y="213">-3</text><text x="226" y="213">-2</text>
    <text x="290" y="213">-7</text><text x="354" y="213">8</text><text x="418" y="213">2</text>
    <text x="482" y="213">-3</text><text x="546" y="213">-1</text>
  </g>
  <path d="M 354 228 L 354 250" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 418 228 L 418 250" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="354" y="268">missing 5</text><text x="418" y="268">missing 6</text>
  </g>
  <text x="310" y="302" text-anchor="middle" fill="#1a2026" font-size="13">Slot i still positive means value i + 1 never appeared; sweeping</text>
  <text x="310" y="320" text-anchor="middle" fill="#1a2026" font-size="13">slots left to right reads 5 and 6 and returns <tspan fill="#4169E1" font-weight="600">[5, 6]</tspan> already sorted.</text>
</svg>
