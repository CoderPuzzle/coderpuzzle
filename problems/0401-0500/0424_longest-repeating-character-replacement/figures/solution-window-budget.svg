<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s = AABABBA, k = 1; cells 44 wide starting at x=150 -->
  <text x="80" y="60" fill="#5c6b76" font-size="12.5">s = AABABBA, k = 1</text>
  <!-- band 1: right = 3, window [0..3] -->
  <g text-anchor="middle" font-size="12.5" fill="#5c6b76">
    <text x="238" y="78" fill="#4169E1" font-weight="600">window A A B A — best = 4</text>
  </g>
  <path d="M 150 88 V 82 H 326 V 88" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="150" y="94" width="44" height="36"/><rect x="194" y="94" width="44" height="36"/><rect x="238" y="94" width="44" height="36"/><rect x="282" y="94" width="44" height="36"/>
  </g>
  <g fill="#dbe4fb" stroke="#1a2026" stroke-width="1.4">
    <rect x="326" y="94" width="44" height="36"/><rect x="370" y="94" width="44" height="36"/><rect x="414" y="94" width="44" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="172" y="117">A</text><text x="216" y="117">A</text><text x="260" y="117">B</text><text x="304" y="117">A</text>
    <text x="348" y="117">B</text><text x="392" y="117">B</text><text x="436" y="117">A</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="172" y="146">l</text>
    <text x="304" y="146">r</text>
  </g>
  <text x="80" y="176" fill="#1a2026" font-size="13">length 4 − max freq 3 = 1 replacement ≤ k ✓</text>
  <!-- band 2: right = 4 breaks the budget, shrink -->
  <path d="M 150 216 V 210 H 370 V 216" fill="none" stroke="#5c6b76" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="80" y="204" fill="#5c6b76" font-size="12.5">r reaches the second B:</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="150" y="222" width="44" height="36"/><rect x="194" y="222" width="44" height="36"/><rect x="238" y="222" width="44" height="36"/><rect x="282" y="222" width="44" height="36"/><rect x="326" y="222" width="44" height="36"/>
  </g>
  <g fill="#dbe4fb" stroke="#1a2026" stroke-width="1.4">
    <rect x="370" y="222" width="44" height="36"/><rect x="414" y="222" width="44" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="172" y="245">A</text><text x="216" y="245">A</text><text x="260" y="245">B</text><text x="304" y="245">A</text><text x="348" y="245">B</text>
    <text x="392" y="245">B</text><text x="436" y="245">A</text>
  </g>
  <text x="196" y="276" fill="#4169E1" font-size="12.5" font-weight="600">shrink l: 5 − 3 = 2 &gt; k ✗ → A B A B, 4 − 3 = 1 ≤ k ✓</text>
  <text x="320" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Every window pays at most k = 1 non-majority character;</text>
  <text x="320" y="324" text-anchor="middle" fill="#1a2026" font-size="13">the widest window the sweep ever holds is <tspan fill="#4169E1" font-weight="600">4</tspan> characters.</text>
</svg>
