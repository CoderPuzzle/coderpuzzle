<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="364" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- l1 = [7,2,4,3], l2 = [5,6,4]; stack cells 40x32, tops aligned at y=60 (top of stack on top);
       emitted digits fill the result row right-to-left (front-insertion), cells 44x36 at x=350+44i -->
  <g text-anchor="middle" font-size="12.5" fill="#5c6b76">
    <text x="80" y="48">l1</text>
    <text x="150" y="48">l2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="60" y="60" width="40" height="32" fill="#dbe4fb"/>
    <rect x="60" y="92" width="40" height="32" fill="#ffffff"/>
    <rect x="60" y="124" width="40" height="32" fill="#ffffff"/>
    <rect x="60" y="156" width="40" height="32" fill="#ffffff"/>
    <rect x="130" y="60" width="40" height="32" fill="#dbe4fb"/>
    <rect x="130" y="92" width="40" height="32" fill="#ffffff"/>
    <rect x="130" y="124" width="40" height="32" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="80" y="81" fill="#4169E1">3</text>
    <text x="80" y="113" fill="#1a2026">4</text>
    <text x="80" y="145" fill="#1a2026">2</text>
    <text x="80" y="177" fill="#1a2026">7</text>
    <text x="150" y="81" fill="#4169E1">4</text>
    <text x="150" y="113" fill="#1a2026">6</text>
    <text x="150" y="145" fill="#1a2026">5</text>
  </g>
  <text x="115" y="212" text-anchor="middle" fill="#5c6b76" font-size="12">ones digits end on top</text>
  <path d="M 182 76 L 246 76" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="12.5" fill="#1a2026">
    <text x="258" y="80"><tspan fill="#5c6b76">1.</tspan> pop 3 + 4 = 7 → <tspan fill="#4169E1" font-weight="600">emit 7</tspan>, carry 0</text>
    <text x="258" y="128"><tspan fill="#5c6b76">2.</tspan> pop 4 + 6 (+1) = 10 → <tspan fill="#4169E1" font-weight="600">emit 0</tspan>, carry 1</text>
    <text x="258" y="176"><tspan fill="#5c6b76">3.</tspan> pop 2 + 5 (+1) = 8 → <tspan fill="#4169E1" font-weight="600">emit 8</tspan>, carry 0</text>
    <text x="258" y="224"><tspan fill="#5c6b76">4.</tspan> pop 7 — l2 empty → <tspan fill="#4169E1" font-weight="600">emit 7</tspan>, carry 0</text>
  </g>
  <text x="258" y="286" fill="#5c6b76" font-size="12.5">result</text>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="372" y="258">step 4</text><text x="416" y="258">step 3</text>
    <text x="460" y="258">step 2</text><text x="504" y="258">step 1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="350" y="264" width="44" height="36"/><rect x="394" y="264" width="44" height="36"/>
    <rect x="438" y="264" width="44" height="36"/><rect x="482" y="264" width="44" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#4169E1">
    <text x="372" y="288">7</text><text x="416" y="288">8</text>
    <text x="460" y="288">0</text><text x="504" y="288">7</text>
  </g>
  <text x="40" y="330" fill="#1a2026" font-size="13">Stacks put the ones digits on top, so the columns add 3+4, 4+6+1, 2+5+1, then a</text>
  <text x="40" y="348" fill="#1a2026" font-size="13">lone 7; each digit links in front, so the list reads <tspan fill="#4169E1" font-weight="600">7→8→0→7</tspan>.</text>
</svg>
