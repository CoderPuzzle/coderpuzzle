<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="298" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- diff(i,j) table for nums = [1,5,2]; cells 64x40, pitch (84,54), origin (120,70); base = nums, dp[0][1]=4, dp[1][2]=3, dp[0][2]=max(1-3, 2-4)=-2; unused lower triangle dashed -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="84" y="95">i = 0</text><text x="84" y="149">i = 1</text><text x="84" y="203">i = 2</text>
    <text x="152" y="232">j = 0</text><text x="236" y="232">j = 1</text><text x="320" y="232">j = 2</text>
  </g>
  <!-- unused cells -->
  <g fill="none" stroke="#9aa7b2" stroke-width="1.1" stroke-dasharray="3 3">
    <rect x="120" y="124" width="64" height="40"/><rect x="120" y="178" width="64" height="40"/><rect x="204" y="178" width="64" height="40"/>
  </g>
  <!-- base cells (length 1) -->
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.4">
    <rect x="120" y="70" width="64" height="40"/><rect x="204" y="124" width="64" height="40"/><rect x="288" y="178" width="64" height="40"/>
  </g>
  <!-- length-2 cells -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="204" y="70" width="64" height="40"/><rect x="288" y="124" width="64" height="40"/>
  </g>
  <!-- final cell dp[0][2] -->
  <rect x="288" y="70" width="64" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="start" fill="#9aa7b2" font-size="10.5">
    <text x="126" y="83">1</text><text x="210" y="137">2</text><text x="294" y="191">3</text>
    <text x="210" y="83">4</text><text x="294" y="137">5</text><text x="294" y="83">6</text>
  </g>
  <g text-anchor="middle" font-size="14" fill="#1a2026">
    <text x="152" y="95">1</text><text x="236" y="149">5</text><text x="320" y="203">2</text>
    <text x="236" y="95">4</text><text x="320" y="149">3</text>
  </g>
  <text x="320" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#4169E1">-2</text>
  <!-- the two sub-differences feeding dp[0][2]: dp[0][1] from above, dp[1][2] from below -->
  <path d="M 226 64 Q 262 22 298 64" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 354 150 Q 382 126 354 106" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- recurrence panel -->
  <g text-anchor="start" fill="#5c6b76" font-size="12.5">
    <text x="390" y="100">dp[i][j] = max(nums[i] - dp[i+1][j],</text>
    <text x="459" y="120">nums[j] - dp[i][j-1])</text>
  </g>
  <text x="390" y="152" text-anchor="start" fill="#1a2026" font-size="12.5">dp[0][2] = max(1 - 3, 2 - 4) = <tspan fill="#4169E1" font-weight="700">-2</tspan></text>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="320" y="262">Cells fill by increasing length: dp[0][1] = max(1 - 5, 5 - 1) = 4,</text>
    <text x="320" y="282">dp[1][2] = 3, and dp[0][2] = max(1 - 3, 2 - 4) = <tspan fill="#4169E1" font-weight="600">-2</tspan> &lt; 0: player 1 loses.</text>
  </g>
</svg>
