<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="372" fill="#ffffff"/>
  <!-- nums = [7,2,5,10,8], k = 2; cells 40x34 at x = 150+46j; probe rows y = 88+58i;
       accent bar in a gap = greedy cut; gray numbers under each piece = its sum -->
  <text x="320" y="32" text-anchor="middle" fill="#1a2026" font-weight="600">nums = [7,2,5,10,8], k = 2 — search opens at lo = 10, hi = 32</text>
  <!-- probe L = 21: 7+2+5 | 10+8, 2 pieces, feasible -->
  <text x="40" y="110" fill="#1a2026" font-weight="600">L = 21</text>
  <g stroke="#42525e" stroke-width="1.25" fill="#ffffff">
    <rect x="150" y="88" width="40" height="34"/><rect x="196" y="88" width="40" height="34"/>
    <rect x="242" y="88" width="40" height="34"/><rect x="288" y="88" width="40" height="34"/>
    <rect x="334" y="88" width="40" height="34"/>
  </g>
  <path d="M 285 84 L 285 126" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="170" y="110">7</text><text x="216" y="110">2</text><text x="262" y="110">5</text>
    <text x="308" y="110">10</text><text x="354" y="110">8</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="216" y="136">14</text><text x="331" y="136">18</text>
  </g>
  <text x="396" y="110" fill="#1a2026" font-size="12.5">2 pieces — feasible, hi = 21</text>
  <!-- probe L = 15: 7+2+5 | 10 | 8, 3 pieces, infeasible -->
  <text x="40" y="168" fill="#1a2026" font-weight="600">L = 15</text>
  <g stroke="#42525e" stroke-width="1.25" fill="#ffffff">
    <rect x="150" y="146" width="40" height="34"/><rect x="196" y="146" width="40" height="34"/>
    <rect x="242" y="146" width="40" height="34"/><rect x="288" y="146" width="40" height="34"/>
    <rect x="334" y="146" width="40" height="34"/>
  </g>
  <path d="M 285 142 L 285 184" stroke="#4169E1" stroke-width="2.5"/>
  <path d="M 331 142 L 331 184" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="170" y="168">7</text><text x="216" y="168">2</text><text x="262" y="168">5</text>
    <text x="308" y="168">10</text><text x="354" y="168">8</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="216" y="194">14</text><text x="308" y="194">10</text><text x="354" y="194">8</text>
  </g>
  <text x="396" y="168" fill="#1a2026" font-size="12.5">3 pieces — too many, lo = 16</text>
  <!-- probe L = 18: 7+2+5 | 10+8, 2 pieces, feasible -->
  <text x="40" y="226" fill="#1a2026" font-weight="600">L = 18</text>
  <g stroke="#42525e" stroke-width="1.25" fill="#ffffff">
    <rect x="150" y="204" width="40" height="34"/><rect x="196" y="204" width="40" height="34"/>
    <rect x="242" y="204" width="40" height="34"/><rect x="288" y="204" width="40" height="34"/>
    <rect x="334" y="204" width="40" height="34"/>
  </g>
  <path d="M 285 200 L 285 242" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="170" y="226">7</text><text x="216" y="226">2</text><text x="262" y="226">5</text>
    <text x="308" y="226">10</text><text x="354" y="226">8</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="216" y="252">14</text><text x="331" y="252">18</text>
  </g>
  <text x="396" y="226" fill="#1a2026" font-size="12.5">2 pieces — feasible, hi = 18</text>
  <!-- probe L = 17: 7+2+5 | 10 | 8, 3 pieces, infeasible -->
  <text x="40" y="284" fill="#1a2026" font-weight="600">L = 17</text>
  <g stroke="#42525e" stroke-width="1.25" fill="#ffffff">
    <rect x="150" y="262" width="40" height="34"/><rect x="196" y="262" width="40" height="34"/>
    <rect x="242" y="262" width="40" height="34"/><rect x="288" y="262" width="40" height="34"/>
    <rect x="334" y="262" width="40" height="34"/>
  </g>
  <path d="M 285 258 L 285 300" stroke="#4169E1" stroke-width="2.5"/>
  <path d="M 331 258 L 331 300" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="170" y="284">7</text><text x="216" y="284">2</text><text x="262" y="284">5</text>
    <text x="308" y="284">10</text><text x="354" y="284">8</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="216" y="310">14</text><text x="308" y="310">10</text><text x="354" y="310">8</text>
  </g>
  <text x="396" y="284" fill="#1a2026" font-size="12.5">3 pieces — too many, lo = 18</text>
  <text x="320" y="340" text-anchor="middle" fill="#1a2026" font-size="13">Probes 21 and 18 pack [7,2,5] | [10,8] into 2 pieces; 15 and 17 need 3 —</text>
  <text x="320" y="358" text-anchor="middle" fill="#1a2026" font-size="13">the search narrows onto lo = hi = <tspan fill="#4169E1" font-weight="600">18</tspan>, the minimized largest sum.</text>
</svg>
