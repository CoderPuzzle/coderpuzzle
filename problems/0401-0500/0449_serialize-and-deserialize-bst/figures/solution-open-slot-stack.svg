<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 408" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="580" height="408" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- tree [2,1,3]; deserialize("2,1,x,x,3,x,x"); token stream boxes 52x32 at x = 80+62c;
       one row per token: stack of open child slots (left-to-right = bottom-to-top), boxes 48x26 at x = 150+54i;
       accent = entry pushed by this token, dashed = entry popped by this token;
       stack entries: pop [node, side]; a value pushes [node, other side] first (left fill) then [child, 0] -->
  <text x="80" y="24" fill="#5c6b76" font-size="11.5">preorder token stream</text>
  <g text-anchor="middle">
    <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
      <rect x="80" y="30" width="52" height="32"/><rect x="142" y="30" width="52" height="32"/>
      <rect x="328" y="30" width="52" height="32"/>
    </g>
    <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5">
      <rect x="204" y="30" width="52" height="32"/><rect x="266" y="30" width="52" height="32"/>
      <rect x="390" y="30" width="52" height="32"/><rect x="452" y="30" width="52" height="32"/>
    </g>
    <text x="106" y="51">2</text><text x="168" y="51">1</text>
    <text x="230" y="51" fill="#9aa7b2">x</text><text x="292" y="51" fill="#9aa7b2">x</text>
    <text x="354" y="51">3</text>
    <text x="416" y="51" fill="#9aa7b2">x</text><text x="478" y="51" fill="#9aa7b2">x</text>
  </g>
  <text x="80" y="84" fill="#9aa7b2" font-size="11.5">stack entry = a node's open child slot (L = left, R = right)</text>
  <rect x="80" y="92" width="13" height="13" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="99" y="103" fill="#5c6b76" font-size="11.5">opened by this token</text>
  <rect x="240" y="92" width="13" height="13" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="259" y="103" fill="#5c6b76" font-size="11.5">closed by this token</text>
  <!-- per-token rows -->
  <g text-anchor="end" fill="#9aa7b2" font-size="11.5">
    <text x="56" y="132">1</text><text x="56" y="166">2</text><text x="56" y="200">3</text>
    <text x="56" y="234">4</text><text x="56" y="268">5</text><text x="56" y="302">6</text>
    <text x="56" y="336">7</text>
  </g>
  <g text-anchor="middle" font-size="13">
    <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
      <rect x="64" y="114" width="40" height="26"/><rect x="64" y="148" width="40" height="26"/>
      <rect x="64" y="282" width="40" height="26"/>
    </g>
    <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5">
      <rect x="64" y="182" width="40" height="26"/><rect x="64" y="216" width="40" height="26"/>
      <rect x="64" y="250" width="40" height="26"/><rect x="64" y="318" width="40" height="26"/>
    </g>
    <text x="84" y="132">2</text><text x="84" y="166">1</text>
    <text x="84" y="200" fill="#9aa7b2">x</text><text x="84" y="234" fill="#9aa7b2">x</text>
    <text x="84" y="268">3</text>
    <text x="84" y="302" fill="#9aa7b2">x</text><text x="84" y="336" fill="#9aa7b2">x</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="none">
    <path d="M 108 127 L 136 127" marker-end="url(#arrowmuted)"/>
    <path d="M 108 161 L 136 161" marker-end="url(#arrowmuted)"/>
    <path d="M 108 195 L 136 195" marker-end="url(#arrowmuted)"/>
    <path d="M 108 229 L 136 229" marker-end="url(#arrowmuted)"/>
    <path d="M 108 263 L 136 263" marker-end="url(#arrowmuted)"/>
    <path d="M 108 297 L 136 297" marker-end="url(#arrowmuted)"/>
    <path d="M 108 331 L 136 331" marker-end="url(#arrowmuted)"/>
  </g>
  <!-- row 1: token 2 -> stack [2L] -->
  <rect x="150" y="114" width="48" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="174" y="132" text-anchor="middle" font-size="12.5">2L</text>
  <text x="230" y="132" fill="#5c6b76" font-size="12">root 2, opens its left slot</text>
  <!-- row 2: token 1 -> stack [2R][1L], popped 2L -->
  <rect x="150" y="148" width="48" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="174" y="166" text-anchor="middle" font-size="12.5">2R</text>
  <rect x="204" y="148" width="48" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="228" y="166" text-anchor="middle" font-size="12.5">1L</text>
  <rect x="270" y="148" width="48" height="26" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="294" y="166" text-anchor="middle" font-size="12.5" fill="#9aa7b2">2L</text>
  <text x="344" y="166" fill="#5c6b76" font-size="12">1 fills 2L, reopens 2R, opens 1L</text>
  <!-- row 3: token x -> stack [2R][1R], popped 1L -->
  <rect x="150" y="182" width="48" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="174" y="200" text-anchor="middle" font-size="12.5">2R</text>
  <rect x="204" y="182" width="48" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="228" y="200" text-anchor="middle" font-size="12.5">1R</text>
  <rect x="270" y="182" width="48" height="26" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="294" y="200" text-anchor="middle" font-size="12.5" fill="#9aa7b2">1L</text>
  <text x="344" y="200" fill="#5c6b76" font-size="12">x closes 1L, 1R reopens</text>
  <!-- row 4: token x -> stack [2R], popped 1R -->
  <rect x="150" y="216" width="48" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="174" y="234" text-anchor="middle" font-size="12.5">2R</text>
  <rect x="216" y="216" width="48" height="26" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="234" text-anchor="middle" font-size="12.5" fill="#9aa7b2">1R</text>
  <text x="290" y="234" fill="#5c6b76" font-size="12">x closes 1R</text>
  <!-- row 5: token 3 -> stack [3L], popped 2R -->
  <rect x="150" y="250" width="48" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="174" y="268" text-anchor="middle" font-size="12.5">3L</text>
  <rect x="216" y="250" width="48" height="26" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="268" text-anchor="middle" font-size="12.5" fill="#9aa7b2">2R</text>
  <text x="290" y="268" fill="#5c6b76" font-size="12">3 fills 2R, opens 3L</text>
  <!-- row 6: token x -> stack [3R], popped 3L -->
  <rect x="150" y="284" width="48" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="174" y="302" text-anchor="middle" font-size="12.5">3R</text>
  <rect x="216" y="284" width="48" height="26" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="302" text-anchor="middle" font-size="12.5" fill="#9aa7b2">3L</text>
  <text x="290" y="302" fill="#5c6b76" font-size="12">x closes 3L, 3R reopens</text>
  <!-- row 7: token x -> stack empty, popped 3R -->
  <rect x="150" y="318" width="48" height="26" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="174" y="336" text-anchor="middle" font-size="12.5" fill="#9aa7b2">3R</text>
  <text x="224" y="336" fill="#5c6b76" font-size="12">x closes 3R, stack empty</text>
  <text x="290" y="374" text-anchor="middle" fill="#1a2026" font-size="13">Each value pushes its next open slot and each x closes one, so the</text>
  <text x="290" y="392" text-anchor="middle" fill="#1a2026" font-size="13">stack drains to empty exactly as the last x lands, rebuilding <tspan fill="#4169E1" font-weight="600">[2,1,3]</tspan>.</text>
</svg>
