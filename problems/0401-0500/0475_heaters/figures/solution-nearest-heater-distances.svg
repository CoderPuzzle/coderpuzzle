<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="310" fill="#ffffff"/>
  <!-- houses = [1,2,3,4] at x=70+100p; heaters sorted [1,4]; radius 1 = 100px; bands cover [0,2] and [3,5]; per-house nearest distances 0,1,1,0; answer = max = 1 -->
  <line x1="48" y1="160" x2="592" y2="160" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="70" y1="169" x2="70" y2="174"/><line x1="270" y1="169" x2="270" y2="174"/>
    <line x1="370" y1="169" x2="370" y2="174"/><line x1="570" y1="169" x2="570" y2="174"/>
  </g>
  <g fill="#dbe4fb" fill-opacity="0.55" stroke="#4169E1" stroke-width="1.3" stroke-dasharray="4 3">
    <rect x="70" y="151" width="200" height="18" rx="9"/>
    <rect x="370" y="151" width="200" height="18" rx="9"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="70" y="184">0</text><text x="270" y="184">2</text>
    <text x="370" y="184">3</text><text x="570" y="184">5</text>
  </g>
  <g fill="#4169E1" font-size="11.5" text-anchor="middle">
    <text x="120" y="145">radius 1</text>
    <text x="420" y="145">radius 1</text>
  </g>
  <!-- house lane: circles carry the coordinate, labels above give the nearest-heater distance -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="270" y="82">min(1, 2)</text>
    <text x="370" y="82">min(2, 1)</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="170" y="100" fill="#5c6b76">0</text>
    <text x="270" y="100" fill="#4169E1">1</text>
    <text x="370" y="100" fill="#4169E1">1</text>
    <text x="470" y="100" fill="#5c6b76">0</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="170" y1="131" x2="170" y2="149"/><line x1="270" y1="131" x2="270" y2="149"/>
    <line x1="370" y1="131" x2="370" y2="149"/><line x1="470" y1="131" x2="470" y2="149"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.5">
    <circle cx="170" cy="120" r="11"/><circle cx="270" cy="120" r="11"/>
    <circle cx="370" cy="120" r="11"/><circle cx="470" cy="120" r="11"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">
    <text x="170" y="124.5">1</text><text x="270" y="124.5">2</text>
    <text x="370" y="124.5">3</text><text x="470" y="124.5">4</text>
  </g>
  <text x="36" y="124" text-anchor="middle" fill="#5c6b76" font-size="11.5">houses</text>
  <!-- heater lane -->
  <g stroke="#42525e" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="170" y1="169" x2="170" y2="194"/><line x1="470" y1="169" x2="470" y2="194"/>
  </g>
  <g fill="#4169E1">
    <rect x="159" y="196" width="22" height="22" rx="3"/>
    <rect x="459" y="196" width="22" height="22" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="170" y="238">heater 1</text>
    <text x="470" y="238">heater 4</text>
  </g>
  <text x="36" y="211" text-anchor="middle" fill="#5c6b76" font-size="11.5">heaters</text>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="320" y="272">Each house is served by its nearest heater; the distances are 0, 1, 1, 0,</text>
    <text x="320" y="292">so the smallest radius covering every house is the largest of them: <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
  </g>
</svg>
