<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="448" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [1,null,1,1,1,null,null,1,1,null,1,null,null,null,1]; runs (go-left, go-right): A(0,2) B(1,3) C(0,0) D(2,1) E(0,1) F(0,0) G(0,1) H(0,0) -->
  <text x="40" y="30" fill="#5c6b76" font-size="12">each node: (go-left run,</text>
  <text x="40" y="48" fill="#5c6b76" font-size="12">go-right run; missing child → 0</text>
  <!-- plain edges -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 295 64 L 375 110" marker-end="url(#arrow)"/>
    <path d="M 376 128 L 314 170" marker-end="url(#arrow)"/>
    <path d="M 504 190 L 566 232" marker-end="url(#arrow)"/>
    <path d="M 354 313 L 426 357" marker-end="url(#arrow)"/>
  </g>
  <!-- zigzag path B-right -> D-left -> E-right -> G -->
  <g stroke="#4169E1" stroke-width="2.4" fill="none">
    <path d="M 404 127 L 476 171" marker-end="url(#arrowB)"/>
    <path d="M 477 190 L 424 232" marker-end="url(#arrowB)"/>
    <path d="M 397 253 L 353 293" marker-end="url(#arrowB)"/>
  </g>
  <g fill="#4169E1" font-size="11.5" font-style="italic">
    <text x="446" y="146">right</text>
    <text x="434" y="216" text-anchor="end">left</text>
    <text x="384" y="284">right</text>
  </g>
  <!-- path nodes -->
  <g>
    <circle cx="390" cy="118" r="17" fill="#4169E1"/>
    <text x="390" y="123" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
    <circle cx="490" cy="180" r="17" fill="#4169E1"/>
    <text x="490" y="185" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
    <circle cx="410" cy="242" r="17" fill="#4169E1"/>
    <text x="410" y="247" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
    <circle cx="340" cy="304" r="17" fill="#4169E1"/>
    <text x="340" y="309" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  </g>
  <!-- other nodes -->
  <g>
    <circle cx="280" cy="56" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
    <text x="280" y="61" text-anchor="middle" fill="#1a2026">1</text>
    <circle cx="300" cy="180" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
    <text x="300" y="185" text-anchor="middle" fill="#1a2026">1</text>
    <circle cx="580" cy="242" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
    <text x="580" y="247" text-anchor="middle" fill="#1a2026">1</text>
    <circle cx="440" cy="366" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
    <text x="440" y="371" text-anchor="middle" fill="#1a2026">1</text>
  </g>
  <!-- node letters A-H used by the caption: A root, B root.right, C B.left, D B.right, E D.left, F D.right, G E.right, H G.right -->
  <g fill="#9aa7b2" font-size="10.5">
    <text x="257" y="61" text-anchor="end">A</text>
    <text x="413" y="123">B</text>
    <text x="277" y="185" text-anchor="end">C</text>
    <text x="513" y="185">D</text>
    <text x="434" y="262">E</text>
    <text x="556" y="250" text-anchor="end">F</text>
    <text x="340" y="336" text-anchor="middle">G</text>
    <text x="416" y="376" text-anchor="end">H</text>
  </g>
  <!-- per-node run pairs -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="280" y="26">(0, 2)</text>
    <text x="300" y="216">(0, 0)</text>
    <text x="490" y="216">(2, 1)</text>
    <text x="606" y="247" text-anchor="start">(0, 0)</text>
    <text x="314" y="309" text-anchor="end">(0, 1)</text>
    <text x="468" y="371" text-anchor="start">(0, 0)</text>
  </g>
  <text x="386" y="250" text-anchor="end" fill="#5c6b76" font-size="12.5">(0, 1)</text>
  <text x="366" y="116" text-anchor="end" fill="#4169E1" font-size="12.5" font-weight="600">(1, 3)</text>
  <text x="340" y="414" text-anchor="middle" fill="#1a2026" font-size="13">At B the go-right run is 1 + D's go-left 2 = 3: right → left → right through D, E, G.</text>
  <text x="340" y="434" text-anchor="middle" fill="#1a2026" font-size="13">No node beats run 3, so the longest ZigZag path has length <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
