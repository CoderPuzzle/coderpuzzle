<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="292" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "level"; cells 64x44 at x = 144 + 72i, y 70; pi row below; notes show the i-step comparison -->
  <text x="320" y="30" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">longest proper border: prefix l = suffix l</text>
  <path d="M 176 64 Q 320 38 464 64" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="144" y="70" width="64" height="44"/><rect x="216" y="70" width="64" height="44"/>
    <rect x="288" y="70" width="64" height="44"/><rect x="360" y="70" width="64" height="44"/>
    <rect x="432" y="70" width="64" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="176" y="98" fill="#1a2026">l</text><text x="248" y="98" fill="#1a2026">e</text>
    <text x="320" y="98" fill="#1a2026">v</text><text x="392" y="98" fill="#1a2026">e</text>
    <text x="464" y="98" fill="#1a2026">l</text>
  </g>
  <g fill="#9aa7b2" font-size="10">
    <text x="153" y="84">0</text><text x="225" y="84">1</text><text x="297" y="84">2</text>
    <text x="369" y="84">3</text><text x="441" y="84">4</text>
  </g>
  <text x="132" y="150" text-anchor="end" fill="#5c6b76" font-size="12.5">pi</text>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="176" y="150" fill="#1a2026">0</text><text x="248" y="150" fill="#1a2026">0</text>
    <text x="320" y="150" fill="#1a2026">0</text><text x="392" y="150" fill="#1a2026">0</text>
    <text x="464" y="150" fill="#4169E1">1</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="176" y="180">base 0</text>
    <text x="248" y="180">e≠l → 0</text>
    <text x="320" y="180">v≠l → 0</text>
    <text x="392" y="180">e≠l → 0</text>
    <text x="464" y="180" fill="#4169E1" font-weight="600">l=l → 1</text>
  </g>
  <text x="320" y="210" text-anchor="middle" fill="#5c6b76" font-size="12.5">each mismatch arrives with j = 0, so the fallback pi[j - 1] never even runs</text>
  <text x="320" y="248" text-anchor="middle" fill="#1a2026" font-size="13">Scanning left to right, only i = 4 extends a match, giving pi = [0, 0, 0, 0, <tspan fill="#4169E1" font-weight="600">1</tspan>].</text>
  <text x="320" y="268" text-anchor="middle" fill="#1a2026" font-size="13">The surviving border is the <tspan fill="#4169E1" font-weight="600">l</tspan> at both ends of level, so the answer is <tspan fill="#4169E1" font-weight="600">l</tspan>.</text>
</svg>
