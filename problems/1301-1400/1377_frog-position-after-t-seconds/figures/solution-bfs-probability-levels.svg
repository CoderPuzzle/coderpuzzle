<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 362" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="362" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- edges [[1,2],[1,3],[1,7],[2,4],[2,6],[3,5]], t = 2, target = 4; BFS probs: 1:1, 2/3/7:1/3, 4/6:1/6, 5:1/3 -->
  <g fill="#9aa7b2" font-size="12">
    <text x="40" y="65">t = 0</text>
    <text x="40" y="160">t = 1</text>
    <text x="40" y="255">t = 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 323 70 L 197 145" marker-end="url(#arrow)"/>
    <path d="M 340 80 L 340 135" marker-end="url(#arrow)"/>
    <path d="M 357 70 L 483 145" marker-end="url(#arrow)"/>
    <path d="M 168 171 L 122 234" marker-end="url(#arrow)"/>
    <path d="M 192 171 L 238 234" marker-end="url(#arrow)"/>
    <path d="M 340 175 L 340 230" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="240" y="100" text-anchor="end">1/3</text>
    <text x="352" y="112">1/3</text>
    <text x="440" y="100">1/3</text>
    <text x="128" y="196" text-anchor="end">1/2</text>
    <text x="262" y="196">1/2</text>
    <text x="352" y="208">1</text>
  </g>
  <!-- vertices -->
  <circle cx="340" cy="60" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="340" y="66" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <circle cx="180" cy="155" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="180" y="161" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <circle cx="340" cy="155" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="340" y="161" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <circle cx="500" cy="155" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="500" y="161" text-anchor="middle" fill="#1a2026" font-weight="600">7</text>
  <circle cx="110" cy="250" r="20" fill="#4169E1"/>
  <text x="110" y="256" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  <circle cx="250" cy="250" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="250" y="256" text-anchor="middle" fill="#1a2026" font-weight="600">6</text>
  <circle cx="340" cy="250" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="340" y="256" text-anchor="middle" fill="#1a2026" font-weight="600">5</text>
  <!-- per-vertex probabilities -->
  <g text-anchor="middle" font-size="12.5">
    <text x="340" y="26" fill="#5c6b76">p = 1</text>
    <text x="180" y="124" fill="#5c6b76">p = 1/3</text>
    <text x="368" y="160" fill="#5c6b76" text-anchor="start">p = 1/3</text>
    <text x="500" y="196" fill="#5c6b76">p = 1/3</text>
    <text x="110" y="290" fill="#4169E1" font-weight="600">p = 1/6</text>
    <text x="250" y="290" fill="#5c6b76">p = 1/6</text>
    <text x="340" y="290" fill="#5c6b76">p = 1/3</text>
  </g>
  <text x="500" y="214" text-anchor="middle" fill="#9aa7b2" font-size="11">leaf — stays put</text>
  <text x="110" y="308" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">target</text>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">The frog needs t = 2 jumps to reach 4: 1 → 2 at 1/3, then 2 → 4 at 1/2,</text>
  <text x="340" y="348" text-anchor="middle" fill="#1a2026" font-size="13">so target 4 holds probability 1/3 × 1/2 = <tspan fill="#4169E1" font-weight="600">1/6</tspan> ≈ 0.167 after 2 seconds.</text>
</svg>
