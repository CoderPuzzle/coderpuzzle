<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- jobDifficulty = [6,5,4,3,2,1], d = 2; table columns i = 0..6 at x = 150 + 62i (w 62), rows j = 1,2 at y = 108,148 (h 40); fold boxes k = 6..2 at x = 140 + 96m (w 88) -->
  <text x="140" y="62" text-anchor="end" fill="#5c6b76" font-size="12.5">jobDifficulty</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="216" y="42" width="54" height="30"/><rect x="278" y="42" width="54" height="30"/>
    <rect x="340" y="42" width="54" height="30"/><rect x="402" y="42" width="54" height="30"/>
    <rect x="464" y="42" width="54" height="30"/><rect x="526" y="42" width="54" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="243" y="62">6</text><text x="305" y="62">5</text><text x="367" y="62">4</text>
    <text x="429" y="62">3</text><text x="491" y="62">2</text><text x="553" y="62">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="181" y="100">0</text><text x="243" y="100">1</text><text x="305" y="100">2</text>
    <text x="367" y="100">3</text><text x="429" y="100">4</text><text x="491" y="100">5</text>
    <text x="553" y="100">6</text>
  </g>
  <text x="140" y="100" text-anchor="end" fill="#5c6b76" font-size="12">i (jobs)</text>
  <!-- dp table; row j = 1 then j = 2 -->
  <g stroke="#42525e" stroke-width="1.5">
    <g fill="#f0f3f7">
      <rect x="150" y="108" width="62" height="40"/>
      <rect x="150" y="148" width="62" height="40"/><rect x="212" y="148" width="62" height="40"/>
    </g>
    <g fill="#ffffff">
      <rect x="212" y="108" width="62" height="40"/><rect x="274" y="108" width="62" height="40"/>
      <rect x="336" y="108" width="62" height="40"/><rect x="398" y="108" width="62" height="40"/>
      <rect x="522" y="108" width="62" height="40"/>
      <rect x="274" y="148" width="62" height="40"/><rect x="336" y="148" width="62" height="40"/>
      <rect x="398" y="148" width="62" height="40"/><rect x="460" y="148" width="62" height="40"/>
    </g>
    <rect x="460" y="108" width="62" height="40" fill="#dbe4fb"/>
    <rect x="522" y="148" width="62" height="40" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-size="15">
    <text x="181" y="133" fill="#9aa7b2">&#8734;</text>
    <text x="243" y="133">6</text><text x="305" y="133">6</text><text x="367" y="133">6</text>
    <text x="429" y="133">6</text><text x="491" y="133" font-weight="600">6</text><text x="553" y="133">6</text>
    <text x="181" y="173" fill="#9aa7b2">&#8734;</text><text x="243" y="173" fill="#9aa7b2">&#8734;</text>
    <text x="305" y="173">11</text><text x="367" y="173">10</text><text x="429" y="173">9</text>
    <text x="491" y="173">8</text><text x="553" y="173" fill="#4169E1" font-weight="600">7</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="140" y="133">j = 1</text><text x="140" y="173">j = 2</text>
  </g>
  <text x="592" y="132" fill="#5c6b76" font-size="12.5">dp[j][i]</text>
  <!-- last-day fold for dp[2][6]: k sweeps 6,5,4,3,2; day_max grows 1,2,3,4,5 -->
  <text x="376" y="216" text-anchor="middle" fill="#1a2026" font-size="13">filling dp[2][6]: the last day&#8217;s start k sweeps left from 6</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="140" y="226" width="88" height="40" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="236" y="226" width="88" height="40" fill="#ffffff"/>
    <rect x="332" y="226" width="88" height="40" fill="#ffffff"/>
    <rect x="428" y="226" width="88" height="40" fill="#ffffff"/>
    <rect x="524" y="226" width="88" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle">
    <text x="184" y="243" fill="#5c6b76" font-size="11.5">k = 6</text>
    <text x="280" y="243" fill="#5c6b76" font-size="11.5">k = 5</text>
    <text x="376" y="243" fill="#5c6b76" font-size="11.5">k = 4</text>
    <text x="472" y="243" fill="#5c6b76" font-size="11.5">k = 3</text>
    <text x="568" y="243" fill="#5c6b76" font-size="11.5">k = 2</text>
    <text x="184" y="260" fill="#4169E1" font-weight="600" font-size="13.5">6 + 1 = 7</text>
    <text x="280" y="260" font-size="13.5">6 + 2 = 8</text>
    <text x="376" y="260" font-size="13.5">6 + 3 = 9</text>
    <text x="472" y="260" font-size="13.5">6 + 4 = 10</text>
    <text x="568" y="260" font-size="13.5">6 + 5 = 11</text>
  </g>
  <path d="M 596 280 L 156 280" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="376" y="300" text-anchor="middle" fill="#5c6b76" font-size="12.5">day_max folds <tspan fill="#4169E1" font-weight="600">1 &#8594; 2 &#8594; 3 &#8594; 4 &#8594; 5</tspan> as the block grows</text>
  <text x="330" y="328" text-anchor="middle" fill="#1a2026" font-size="13">Each candidate costs dp[1][k&#8722;1] + day_max = 6 + day_max, so the best cut</text>
  <text x="330" y="346" text-anchor="middle" fill="#1a2026" font-size="13">leaves job 6 alone on day 2: dp[2][6] = <tspan fill="#4169E1" font-weight="600">6 + 1 = 7</tspan>.</text>
</svg>
