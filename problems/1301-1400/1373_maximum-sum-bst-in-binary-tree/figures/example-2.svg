<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- edges -->
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="210" y1="40" x2="130" y2="120"/>
    <line x1="130" y1="120" x2="60" y2="200"/>
    <line x1="130" y1="120" x2="200" y2="200"/>
  </g>
  <!-- nodes -->
  <g stroke="#1a2026" stroke-width="2">
    <circle cx="210" cy="40" r="17" fill="#ffffff"/>
    <circle cx="130" cy="120" r="17" fill="#ffffff"/>
    <circle cx="60" cy="200" r="17" fill="#ffffff"/>
  </g>
  <circle cx="200" cy="200" r="17" fill="#e8edfb" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="210" y="45">4</text>
    <text x="130" y="125">3</text>
    <text x="60" y="205">1</text>
    <text x="200" y="205">2</text>
  </g>
  <text x="210" y="238" text-anchor="middle" fill="#4169E1" font-weight="700">best BST: the single node 2 — sum 2</text>
  <text x="210" y="260" text-anchor="middle" fill="#5c6b76" font-size="12.5">node 3 breaks the rule: its right child 2 is smaller than 3</text>
</svg>
