<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 302" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- dashed enclosure around the best subtree -->
  <rect x="336" y="72" width="246" height="192" rx="26" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="6 4"/>
  <!-- edges -->
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="300" y1="34" x2="170" y2="96"/>
    <line x1="300" y1="34" x2="430" y2="96"/>
    <line x1="170" y1="96" x2="110" y2="164"/>
    <line x1="170" y1="96" x2="230" y2="164"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.4">
    <line x1="430" y1="96" x2="360" y2="164"/>
    <line x1="430" y1="96" x2="500" y2="164"/>
    <line x1="500" y1="164" x2="440" y2="232"/>
    <line x1="500" y1="164" x2="560" y2="232"/>
  </g>
  <!-- nodes -->
  <g stroke="#1a2026" stroke-width="2">
    <circle cx="300" cy="34" r="17" fill="#ffffff"/>
    <circle cx="170" cy="96" r="17" fill="#ffffff"/>
    <circle cx="110" cy="164" r="17" fill="#ffffff"/>
    <circle cx="230" cy="164" r="17" fill="#ffffff"/>
  </g>
  <g fill="#e8edfb" stroke="#4169E1" stroke-width="2.4">
    <circle cx="430" cy="96" r="17"/>
    <circle cx="360" cy="164" r="17"/>
    <circle cx="500" cy="164" r="17"/>
    <circle cx="440" cy="232" r="17"/>
    <circle cx="560" cy="232" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="300" y="39">1</text>
    <text x="170" y="101">4</text>
    <text x="110" y="169">2</text>
    <text x="230" y="169">4</text>
    <text x="430" y="101">3</text>
    <text x="360" y="169">2</text>
    <text x="500" y="169">5</text>
    <text x="440" y="237">4</text>
    <text x="560" y="237">6</text>
  </g>
  <text x="430" y="290" text-anchor="middle" fill="#1a2026" font-weight="600">the subtree rooted at 3 is a BST: 3 + 2 + 5 + 4 + 6 = 20</text>
  <text x="170" y="290" text-anchor="middle" fill="#5c6b76" font-size="12.5">the root's own subtree is not a BST</text>
</svg>
