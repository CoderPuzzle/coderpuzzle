<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5ae"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- path cells tinted -->
  <g fill="#e8edfb">
    <rect x="60" y="26" width="70" height="70"/><rect x="130" y="26" width="70" height="70"/><rect x="200" y="26" width="70" height="70"/><rect x="270" y="26" width="70" height="70"/>
    <rect x="60" y="96" width="70" height="70"/><rect x="130" y="96" width="70" height="70"/><rect x="200" y="96" width="70" height="70"/><rect x="270" y="96" width="70" height="70"/>
    <rect x="60" y="166" width="70" height="70"/><rect x="130" y="166" width="70" height="70"/><rect x="200" y="166" width="70" height="70"/><rect x="270" y="166" width="70" height="70"/>
    <rect x="270" y="236" width="70" height="70"/>
  </g>
  <g fill="none" stroke="#c8cfd6">
    <rect x="60" y="26" width="280" height="280"/>
    <line x1="130" y1="26" x2="130" y2="306"/><line x1="200" y1="26" x2="200" y2="306"/><line x1="270" y1="26" x2="270" y2="306"/>
    <line x1="60" y1="96" x2="340" y2="96"/><line x1="60" y1="166" x2="340" y2="166"/><line x1="60" y1="236" x2="340" y2="236"/>
  </g>
  <!-- the walk -->
  <polyline points="95,61 305,61 305,131 95,131 95,201 305,201 305,271" fill="none" stroke="#4169E1" stroke-width="3"/>
  <circle cx="95" cy="61" r="6" fill="#4169E1"/>
  <circle cx="305" cy="271" r="8" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <!-- arrows: 1 right, 2 left (offset from the walk) -->
  <g stroke="#1a2026" stroke-width="2">
    <line x1="80" y1="45" x2="106" y2="45" marker-end="url(#i)"/><line x1="150" y1="45" x2="176" y2="45" marker-end="url(#i)"/><line x1="220" y1="45" x2="246" y2="45" marker-end="url(#i)"/>
    <line x1="150" y1="113" x2="124" y2="113" marker-end="url(#i)"/><line x1="220" y1="113" x2="194" y2="113" marker-end="url(#i)"/><line x1="290" y1="113" x2="264" y2="113" marker-end="url(#i)"/>
    <line x1="80" y1="183" x2="106" y2="183" marker-end="url(#i)"/><line x1="150" y1="183" x2="176" y2="183" marker-end="url(#i)"/><line x1="220" y1="183" x2="246" y2="183" marker-end="url(#i)"/>
    <line x1="150" y1="253" x2="124" y2="253" marker-end="url(#i)"/><line x1="220" y1="253" x2="194" y2="253" marker-end="url(#i)"/><line x1="290" y1="253" x2="264" y2="253" marker-end="url(#i)"/>
  </g>
  <!-- changed cells: original arrow struck out, new down arrow in accent -->
  <g fill="none">
    <line x1="293" y1="43" x2="317" y2="43" stroke="#9aa5ae" stroke-width="1.6" marker-end="url(#g)"/>
    <line x1="291" y1="35" x2="319" y2="51" stroke="#c0392b" stroke-width="1.6"/>
    <line x1="321" y1="66" x2="321" y2="92" stroke="#4169E1" stroke-width="2.6" marker-end="url(#b)"/>
    <line x1="107" y1="113" x2="83" y2="113" stroke="#9aa5ae" stroke-width="1.6" marker-end="url(#g)"/>
    <line x1="81" y1="105" x2="109" y2="121" stroke="#c0392b" stroke-width="1.6"/>
    <line x1="79" y1="146" x2="79" y2="164" stroke="#4169E1" stroke-width="2.6" marker-end="url(#b)"/>
    <line x1="293" y1="183" x2="317" y2="183" stroke="#9aa5ae" stroke-width="1.6" marker-end="url(#g)"/>
    <line x1="291" y1="175" x2="319" y2="191" stroke="#c0392b" stroke-width="1.6"/>
    <line x1="321" y1="216" x2="321" y2="234" stroke="#4169E1" stroke-width="2.6" marker-end="url(#b)"/>
  </g>
  <g>
    <circle cx="328" cy="40" r="9" fill="#4169E1"/><text x="328" y="44" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text>
    <circle cx="118" cy="110" r="9" fill="#4169E1"/><text x="118" y="114" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text>
    <circle cx="328" cy="180" r="9" fill="#4169E1"/><text x="328" y="184" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text>
  </g>
  <!-- legend -->
  <g fill="#1a2026" font-size="12.5">
    <text x="386" y="60" font-weight="600">signs</text>
    <line x1="386" y1="80" x2="412" y2="80" stroke="#1a2026" stroke-width="2" marker-end="url(#i)"/><text x="424" y="84">1 — right</text>
    <line x1="412" y1="104" x2="386" y2="104" stroke="#1a2026" stroke-width="2" marker-end="url(#i)"/><text x="424" y="108">2 — left</text>
    <line x1="399" y1="118" x2="399" y2="144" stroke="#1a2026" stroke-width="2" marker-end="url(#i)"/><text x="424" y="135">3 — down</text>
    <line x1="399" y1="178" x2="399" y2="152" stroke="#1a2026" stroke-width="2" marker-end="url(#i)"/><text x="424" y="169">4 — up</text>
    <text x="386" y="196" fill="#4169E1" font-weight="700">change 3 arrows to ↓</text>
    <text x="386" y="216" fill="#4169E1" font-weight="700">total cost = 3</text>
    <text x="386" y="244" fill="#5c6b76">walk from (0, 0)</text>
    <text x="386" y="261" fill="#5c6b76">snake row by row</text>
    <text x="386" y="278" fill="#5c6b76">to reach (3, 3)</text>
  </g>
</svg>
