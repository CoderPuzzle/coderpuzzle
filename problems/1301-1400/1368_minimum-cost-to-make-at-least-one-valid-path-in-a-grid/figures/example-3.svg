<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5ae"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <g fill="#e8edfb">
    <rect x="60" y="24" width="100" height="100"/><rect x="160" y="24" width="100" height="100"/><rect x="160" y="124" width="100" height="100"/>
  </g>
  <g fill="none" stroke="#c8cfd6">
    <rect x="60" y="24" width="200" height="200"/>
    <line x1="160" y1="24" x2="160" y2="224"/><line x1="60" y1="124" x2="260" y2="124"/>
  </g>
  <!-- the walk (0,0) -> (0,1) -> (1,1) -->
  <path d="M 110 74 L 210 74 L 210 158" fill="none" stroke="#4169E1" stroke-width="3"/>
  <circle cx="110" cy="74" r="6" fill="#4169E1"/>
  <circle cx="210" cy="174" r="8" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <!-- signs -->
  <line x1="82" y1="56" x2="132" y2="56" stroke="#1a2026" stroke-width="2.2" marker-end="url(#i)"/>
  <line x1="196" y1="56" x2="148" y2="56" stroke="#9aa5ae" stroke-width="2" marker-end="url(#g)"/>
  <line x1="156" y1="48" x2="190" y2="64" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="210" y1="94" x2="210" y2="140" stroke="#4169E1" stroke-width="3" marker-end="url(#b)"/>
  <line x1="94" y1="190" x2="94" y2="158" stroke="#1a2026" stroke-width="2.2" marker-end="url(#i)"/>
  <line x1="196" y1="152" x2="196" y2="198" stroke="#1a2026" stroke-width="2.2" marker-end="url(#i)"/>
  <g>
    <circle cx="242" cy="44" r="9" fill="#4169E1"/><text x="242" y="48" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="300" y="66" fill="#1a2026">(0,0) says → , so walk</text>
    <text x="300" y="84" fill="#1a2026">to (0,1) for free</text>
    <text x="300" y="116" fill="#4169E1" font-weight="600">change (0,1) to ↓ — cost 1</text>
    <text x="300" y="148" fill="#4169E1" font-weight="700" font-size="15">total cost = 1</text>
    <text x="300" y="180" fill="#5c6b76">signs: 1 → right, 2 → left,</text>
    <text x="300" y="198" fill="#5c6b76">3 → down, 4 → up</text>
  </g>
</svg>
