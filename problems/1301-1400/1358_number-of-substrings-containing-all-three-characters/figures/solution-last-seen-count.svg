<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <!-- s = "abcabc"; columns i = 0..5 at x 104+84c; rows: s[i], i, last a/b/c, min,
       adds min+1, running total; updated last cells and the final 10 accented -->
  <text x="356" y="46" text-anchor="middle" fill="#5c6b76" font-size="11.5">last[c] = newest index of c so far; -1 = not seen yet</text>
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.2">
    <rect x="104" y="60" width="84" height="36"/><rect x="188" y="60" width="84" height="36"/><rect x="272" y="60" width="84" height="36"/><rect x="356" y="60" width="84" height="36"/><rect x="440" y="60" width="84" height="36"/><rect x="524" y="60" width="84" height="36"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="104" y="96" width="84" height="22"/><rect x="188" y="96" width="84" height="22"/><rect x="272" y="96" width="84" height="22"/><rect x="356" y="96" width="84" height="22"/><rect x="440" y="96" width="84" height="22"/><rect x="524" y="96" width="84" height="22"/>
    <rect x="104" y="118" width="84" height="28"/><rect x="188" y="118" width="84" height="28"/><rect x="272" y="118" width="84" height="28"/><rect x="356" y="118" width="84" height="28"/><rect x="440" y="118" width="84" height="28"/><rect x="524" y="118" width="84" height="28"/>
    <rect x="104" y="146" width="84" height="28"/><rect x="188" y="146" width="84" height="28"/><rect x="272" y="146" width="84" height="28"/><rect x="356" y="146" width="84" height="28"/><rect x="440" y="146" width="84" height="28"/><rect x="524" y="146" width="84" height="28"/>
    <rect x="104" y="174" width="84" height="28"/><rect x="188" y="174" width="84" height="28"/><rect x="272" y="174" width="84" height="28"/><rect x="356" y="174" width="84" height="28"/><rect x="440" y="174" width="84" height="28"/><rect x="524" y="174" width="84" height="28"/>
    <rect x="104" y="202" width="84" height="30"/><rect x="188" y="202" width="84" height="30"/><rect x="272" y="202" width="84" height="30"/><rect x="356" y="202" width="84" height="30"/><rect x="440" y="202" width="84" height="30"/><rect x="524" y="202" width="84" height="30"/>
    <rect x="104" y="232" width="84" height="30"/><rect x="188" y="232" width="84" height="30"/><rect x="272" y="232" width="84" height="30"/><rect x="356" y="232" width="84" height="30"/><rect x="440" y="232" width="84" height="30"/><rect x="524" y="232" width="84" height="30"/>
    <rect x="104" y="262" width="84" height="30"/><rect x="188" y="262" width="84" height="30"/><rect x="272" y="262" width="84" height="30"/><rect x="356" y="262" width="84" height="30"/><rect x="440" y="262" width="84" height="30"/><rect x="524" y="262" width="84" height="30"/>
  </g>
  <g fill="#dbe4fb">
    <rect x="104" y="118" width="84" height="28"/>
    <rect x="188" y="146" width="84" height="28"/>
    <rect x="272" y="174" width="84" height="28"/>
    <rect x="356" y="118" width="84" height="28"/>
    <rect x="440" y="146" width="84" height="28"/>
    <rect x="524" y="174" width="84" height="28"/>
    <rect x="524" y="262" width="84" height="30"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="16" font-weight="600">
    <text x="146" y="84">a</text><text x="230" y="84">b</text><text x="314" y="84">c</text><text x="398" y="84">a</text><text x="482" y="84">b</text><text x="566" y="84">c</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="146" y="111">0</text><text x="230" y="111">1</text><text x="314" y="111">2</text><text x="398" y="111">3</text><text x="482" y="111">4</text><text x="566" y="111">5</text>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="146" y="136" fill="#4169E1" font-weight="600">0</text><text x="230" y="136" fill="#1a2026">0</text><text x="314" y="136" fill="#1a2026">0</text><text x="398" y="136" fill="#4169E1" font-weight="600">3</text><text x="482" y="136" fill="#1a2026">3</text><text x="566" y="136" fill="#1a2026">3</text>
    <text x="146" y="164" fill="#9aa7b2">-1</text><text x="230" y="164" fill="#4169E1" font-weight="600">1</text><text x="314" y="164" fill="#1a2026">1</text><text x="398" y="164" fill="#1a2026">1</text><text x="482" y="164" fill="#4169E1" font-weight="600">4</text><text x="566" y="164" fill="#1a2026">4</text>
    <text x="146" y="192" fill="#9aa7b2">-1</text><text x="230" y="192" fill="#9aa7b2">-1</text><text x="314" y="192" fill="#4169E1" font-weight="600">2</text><text x="398" y="192" fill="#1a2026">2</text><text x="482" y="192" fill="#1a2026">2</text><text x="566" y="192" fill="#4169E1" font-weight="600">5</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="146" y="221" fill="#9aa7b2">-1</text><text x="230" y="221" fill="#9aa7b2">-1</text><text x="314" y="221" fill="#4169E1">0</text><text x="398" y="221" fill="#4169E1">1</text><text x="482" y="221" fill="#4169E1">2</text><text x="566" y="221" fill="#4169E1">3</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="146" y="251" fill="#9aa7b2">0</text><text x="230" y="251" fill="#9aa7b2">0</text><text x="314" y="251" fill="#4169E1">1</text><text x="398" y="251" fill="#4169E1">2</text><text x="482" y="251" fill="#4169E1">3</text><text x="566" y="251" fill="#4169E1">4</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="146" y="281">0</text><text x="230" y="281">0</text><text x="314" y="281">1</text><text x="398" y="281">3</text><text x="482" y="281">6</text><text x="566" y="281" fill="#4169E1" font-weight="600">10</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="96" y="84">s[i]</text><text x="96" y="111">i</text><text x="96" y="136">last a</text><text x="96" y="164">last b</text><text x="96" y="192">last c</text><text x="96" y="221">min</text><text x="96" y="251">adds min+1</text><text x="96" y="281">total</text>
  </g>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">Each position adds min(last) + 1 valid left endpoints &#8212; 0, 0, 1, 2, 3, 4 &#8212; so every</text>
  <text x="320" y="338" text-anchor="middle" fill="#1a2026" font-size="13">substring with all of a, b and c is counted once at its right endpoint: <tspan fill="#4169E1" font-weight="600">10</tspan> total.</text>
</svg>
