<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="cw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#ffffff"/>
  <text x="180" y="26" text-anchor="middle" fill="#5c6b76" font-size="13">slices = [1,2,3,4,5,6] clockwise</text>
  <!-- Round 1: full pizza -->
  <g stroke="#42525e" stroke-width="1">
    <path d="M 180 170 L 180 55 A 115 115 0 0 1 279.6 112.5 Z" fill="#2e9e5b" fill-opacity="0.14"/>
    <path d="M 180 170 L 279.6 112.5 A 115 115 0 0 1 279.6 227.5 Z" fill="#b57f30" fill-opacity="0.16"/>
    <path d="M 180 170 L 279.6 227.5 A 115 115 0 0 1 180 285 Z" fill="#b57f30" fill-opacity="0.16"/>
    <path d="M 180 170 L 180 285 A 115 115 0 0 1 80.4 227.5 Z" fill="#4169E1" fill-opacity="0.18"/>
    <path d="M 180 170 L 80.4 227.5 A 115 115 0 0 1 80.4 112.5 Z" fill="#2e9e5b" fill-opacity="0.14"/>
    <path d="M 180 170 L 80.4 112.5 A 115 115 0 0 1 180 55 Z" fill="#4169E1" fill-opacity="0.18"/>
  </g>
  <g text-anchor="middle">
    <text x="215" y="112" fill="#1a2026" font-weight="700" font-size="17">1</text>
    <text x="215" y="128" fill="#2e7d4f" font-size="10.5">Bob</text>
    <text x="250" y="168" fill="#1a2026" font-weight="700" font-size="17">2</text>
    <text x="250" y="184" fill="#7a5a1e" font-size="10.5">Alice</text>
    <text x="215" y="234" fill="#1a2026" font-weight="700" font-size="17">3</text>
    <text x="215" y="250" fill="#7a5a1e" font-size="10.5">Alice</text>
    <text x="145" y="234" fill="#1a2026" font-weight="700" font-size="17">4</text>
    <text x="145" y="250" fill="#274db1" font-size="10.5">You</text>
    <text x="110" y="168" fill="#1a2026" font-weight="700" font-size="17">5</text>
    <text x="110" y="184" fill="#2e7d4f" font-size="10.5">Bob</text>
    <text x="145" y="112" fill="#1a2026" font-weight="700" font-size="17">6</text>
    <text x="145" y="128" fill="#274db1" font-size="10.5">You</text>
  </g>
  <path d="M 300 55 A 130 130 0 0 1 300 90" transform="rotate(30 180 170)" fill="none" stroke="#5c6b76" stroke-width="1.3" marker-end="url(#cw)"/>
  <text x="180" y="322" text-anchor="middle" fill="#5c6b76" font-size="12.5">Round 1: You pick 4, Alice 3, Bob 5</text>
  <!-- Round 2: remaining half -->
  <g stroke="#42525e" stroke-width="1">
    <path d="M 540 170 L 440.4 112.5 A 115 115 0 0 1 540 55 Z" fill="#4169E1" fill-opacity="0.18"/>
    <path d="M 540 170 L 540 55 A 115 115 0 0 1 639.6 112.5 Z" fill="#2e9e5b" fill-opacity="0.14"/>
    <path d="M 540 170 L 639.6 112.5 A 115 115 0 0 1 639.6 227.5 Z" fill="#b57f30" fill-opacity="0.16"/>
    <line x1="440.4" y1="112.5" x2="639.6" y2="227.5" stroke-dasharray="3 3"/>
  </g>
  <g text-anchor="middle">
    <text x="505" y="112" fill="#1a2026" font-weight="700" font-size="17">6</text>
    <text x="505" y="128" fill="#274db1" font-size="10.5">You</text>
    <text x="575" y="112" fill="#1a2026" font-weight="700" font-size="17">1</text>
    <text x="575" y="128" fill="#2e7d4f" font-size="10.5">Bob</text>
    <text x="610" y="168" fill="#1a2026" font-weight="700" font-size="17">2</text>
    <text x="610" y="184" fill="#7a5a1e" font-size="10.5">Alice</text>
  </g>
  <text x="540" y="322" text-anchor="middle" fill="#5c6b76" font-size="12.5">Round 2: You pick 6, Alice 2, Bob 1</text>
  <text x="360" y="345" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="14">You keep 4 + 6 = 10</text>
</svg>
