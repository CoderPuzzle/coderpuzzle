<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="432" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- slices [1,2,3,4,5,6], k=2; runs rob([1,2,3,4,5]) and rob([2,3,4,5,6]) -->
  <!-- table A cells 44x30 at x=90+46c, table B at x=330+46c; rows y=66+36i; -1 = unreachable -->
  <text x="137" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">drop the last: [1, 2, 3, 4, 5]</text>
  <text x="377" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">drop the first: [2, 3, 4, 5, 6]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="66" y="60">i</text><text x="112" y="60">j = 0</text><text x="158" y="60">j = 1</text><text x="204" y="60">j = 2</text>
    <text x="307" y="60">i</text><text x="352" y="60">j = 0</text><text x="398" y="60">j = 1</text><text x="444" y="60">j = 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="90" y="66" width="44" height="30"/>
    <rect x="90" y="102" width="44" height="30"/><rect x="136" y="102" width="44" height="30"/><rect x="182" y="102" width="44" height="30"/>
    <rect x="90" y="138" width="44" height="30"/><rect x="136" y="138" width="44" height="30"/><rect x="182" y="138" width="44" height="30"/>
    <rect x="90" y="174" width="44" height="30"/><rect x="136" y="174" width="44" height="30"/><rect x="182" y="174" width="44" height="30"/>
    <rect x="90" y="210" width="44" height="30"/><rect x="136" y="210" width="44" height="30"/><rect x="182" y="210" width="44" height="30"/>
    <rect x="90" y="246" width="44" height="30"/><rect x="136" y="246" width="44" height="30"/>
    <rect x="330" y="66" width="44" height="30"/>
    <rect x="330" y="102" width="44" height="30"/><rect x="376" y="102" width="44" height="30"/><rect x="422" y="102" width="44" height="30"/>
    <rect x="330" y="138" width="44" height="30"/><rect x="376" y="138" width="44" height="30"/><rect x="422" y="138" width="44" height="30"/>
    <rect x="330" y="174" width="44" height="30"/><rect x="376" y="174" width="44" height="30"/><rect x="422" y="174" width="44" height="30"/>
    <rect x="330" y="210" width="44" height="30"/><rect x="376" y="210" width="44" height="30"/><rect x="422" y="210" width="44" height="30"/>
    <rect x="330" y="246" width="44" height="30"/><rect x="376" y="246" width="44" height="30"/>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3">
    <rect x="136" y="66" width="44" height="30"/><rect x="182" y="66" width="44" height="30"/>
    <rect x="182" y="138" width="44" height="30"/>
    <rect x="376" y="66" width="44" height="30"/><rect x="422" y="66" width="44" height="30"/>
    <rect x="182" y="102" width="44" height="30"/>
    <rect x="422" y="102" width="44" height="30"/>
    <rect x="422" y="138" width="44" height="30"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <rect x="182" y="246" width="44" height="30"/>
    <rect x="422" y="246" width="44" height="30"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="66" y="122">1</text><text x="66" y="158">2</text><text x="66" y="194">3</text><text x="66" y="230">4</text><text x="66" y="266">5</text>
    <text x="307" y="122">2</text><text x="307" y="158">3</text><text x="307" y="194">4</text><text x="307" y="230">5</text><text x="307" y="266">6</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="112" y="86">0</text>
    <text x="112" y="122">0</text><text x="158" y="122">1</text>
    <text x="112" y="158">0</text><text x="158" y="158">2</text>
    <text x="112" y="194">0</text><text x="158" y="194">3</text><text x="204" y="194">4</text>
    <text x="112" y="230">0</text><text x="158" y="230">4</text><text x="204" y="230">6</text>
    <text x="112" y="266">0</text><text x="158" y="266">5</text>
    <text x="352" y="86">0</text>
    <text x="352" y="122">0</text><text x="398" y="122">2</text>
    <text x="352" y="158">0</text><text x="398" y="158">3</text>
    <text x="352" y="194">0</text><text x="398" y="194">4</text><text x="444" y="194">6</text>
    <text x="352" y="230">0</text><text x="398" y="230">5</text><text x="444" y="230">8</text>
    <text x="352" y="266">0</text><text x="398" y="266">6</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-weight="400">
    <text x="158" y="86">-1</text>
    <text x="204" y="86">-1</text>
    <text x="204" y="122">-1</text>
    <text x="204" y="158">-1</text>
    <text x="398" y="86">-1</text>
    <text x="444" y="86">-1</text>
    <text x="444" y="122">-1</text>
    <text x="444" y="158">-1</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#4169E1">
    <text x="204" y="266">8</text>
    <text x="444" y="266" font-size="15">10</text>
  </g>
  <text x="257" y="172" text-anchor="middle" fill="#9aa7b2" font-size="12">vs</text>
  <!-- run B's last cell: skip keeps dp[4][2] = 8, take adds arr = 6 to dp[3][1] = 4 -->
  <text x="242" y="318" text-anchor="end" fill="#5c6b76" font-size="11.5">take dp[3][1] + 6:</text>
  <rect x="250" y="300" width="94" height="28" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="297" y="318" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">4 + 6 = 10</text>
  <text x="242" y="354" text-anchor="end" fill="#5c6b76" font-size="11.5">skip keeps dp[4][2]:</text>
  <rect x="250" y="336" width="94" height="28" fill="#ffffff" stroke="#5c6b76" stroke-width="1.4"/>
  <text x="297" y="354" text-anchor="middle" fill="#5c6b76" font-size="12.5">8</text>
  <text x="444" y="310" text-anchor="middle" fill="#5c6b76" font-size="11.5">dp[5][2]</text>
  <rect x="422" y="318" width="44" height="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="444" y="337" text-anchor="middle" fill="#4169E1" font-size="15" font-weight="600">10</text>
  <g fill="none" stroke="#42525e" stroke-width="1.5">
    <path d="M 348 314 L 416 330" marker-end="url(#arrow)"/>
    <path d="M 348 350 L 416 340" marker-end="url(#arrow)"/>
  </g>
  <text x="340" y="402" text-anchor="middle" fill="#1a2026" font-size="13">Filling left to right: skip carries dp[i-1][j]; take adds the row's slice to dp[i-2][j-1].</text>
  <text x="340" y="422" text-anchor="middle" fill="#1a2026" font-size="13">Dropping the last yields 8, dropping the first yields 10 — answer max(8, 10) = <tspan fill="#4169E1" font-weight="600">10</tspan>.</text>
</svg>
