<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="720" height="350" fill="#ffffff"/>
  <text x="180" y="26" text-anchor="middle" fill="#5c6b76" font-size="13">slices = [8,9,8,6,1,1] clockwise</text>
  <!-- Round 1: full pizza -->
  <g stroke="#42525e" stroke-width="1">
    <path d="M 180 170 L 180 55 A 115 115 0 0 1 279.6 112.5 Z" fill="#4169E1" fill-opacity="0.18"/>
    <path d="M 180 170 L 279.6 112.5 A 115 115 0 0 1 279.6 227.5 Z" fill="#2e9e5b" fill-opacity="0.14"/>
    <path d="M 180 170 L 279.6 227.5 A 115 115 0 0 1 180 285 Z" fill="#f1f3f5"/>
    <path d="M 180 170 L 180 285 A 115 115 0 0 1 80.4 227.5 Z" fill="#f1f3f5"/>
    <path d="M 180 170 L 80.4 227.5 A 115 115 0 0 1 80.4 112.5 Z" fill="#f1f3f5"/>
    <path d="M 180 170 L 80.4 112.5 A 115 115 0 0 1 180 55 Z" fill="#b57f30" fill-opacity="0.16"/>
  </g>
  <g text-anchor="middle">
    <text x="215" y="112" fill="#1a2026" font-weight="700" font-size="17">8</text>
    <text x="215" y="128" fill="#274db1" font-size="10.5">You</text>
    <text x="250" y="168" fill="#1a2026" font-weight="700" font-size="17">9</text>
    <text x="250" y="184" fill="#2e7d4f" font-size="10.5">Bob</text>
    <text x="215" y="234" fill="#1a2026" font-weight="700" font-size="17">8</text>
    <text x="145" y="234" fill="#1a2026" font-weight="700" font-size="17">6</text>
    <text x="110" y="168" fill="#1a2026" font-weight="700" font-size="17">1</text>
    <text x="110" y="184" fill="#7a5a1e" font-size="10.5">Alice</text>
    <text x="145" y="112" fill="#1a2026" font-weight="700" font-size="17">1</text>
    <text x="145" y="128" fill="#7a5a1e" font-size="10.5">Alice</text>
  </g>
  <text x="180" y="322" text-anchor="middle" fill="#5c6b76" font-size="12.5">Round 1: You pick 8, Alice 1, Bob 9</text>
  <!-- Round 2: remaining half -->
  <g stroke="#42525e" stroke-width="1">
    <path d="M 540 170 L 639.6 227.5 A 115 115 0 0 1 540 285 Z" fill="#4169E1" fill-opacity="0.18"/>
    <path d="M 540 170 L 540 285 A 115 115 0 0 1 440.4 227.5 Z" fill="#2e9e5b" fill-opacity="0.14"/>
    <path d="M 540 170 L 440.4 227.5 A 115 115 0 0 1 440.4 112.5 Z" fill="#b57f30" fill-opacity="0.16"/>
    <line x1="639.6" y1="227.5" x2="440.4" y2="112.5" stroke-dasharray="3 3"/>
  </g>
  <g text-anchor="middle">
    <text x="575" y="230" fill="#1a2026" font-weight="700" font-size="17">8</text>
    <text x="575" y="246" fill="#274db1" font-size="10.5">You</text>
    <text x="505" y="230" fill="#1a2026" font-weight="700" font-size="17">6</text>
    <text x="505" y="246" fill="#2e7d4f" font-size="10.5">Bob</text>
    <text x="470" y="168" fill="#1a2026" font-weight="700" font-size="17">1</text>
    <text x="470" y="184" fill="#7a5a1e" font-size="10.5">Alice</text>
  </g>
  <text x="540" y="322" text-anchor="middle" fill="#5c6b76" font-size="12.5">Round 2: You pick 8, Alice 1, Bob 6</text>
  <text x="360" y="345" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="14">Pick 8 in each turn (picking 9 feeds Bob an 8) — You keep 8 + 8 = 16</text>
</svg>
