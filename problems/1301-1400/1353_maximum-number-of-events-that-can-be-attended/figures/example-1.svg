<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 232" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- day separators -->
  <g stroke="#e3e6ea" stroke-dasharray="3 3">
    <line x1="175" y1="40" x2="175" y2="172"/>
    <line x1="300" y1="40" x2="300" y2="172"/>
    <line x1="425" y1="40" x2="425" y2="172"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="112" y="194">day 1</text><text x="237" y="194">day 2</text>
    <text x="362" y="194">day 3</text><text x="487" y="194">day 4</text>
  </g>
  <!-- event bars; attended day highlighted -->
  <rect x="50" y="48" width="250" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <rect x="50" y="48" width="115" height="30" rx="4" fill="#4169E1"/>
  <text x="187" y="68" fill="#1a2026">event 1: days 1–2</text>
  <rect x="175" y="94" width="250" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <rect x="175" y="94" width="115" height="30" rx="4" fill="#4169E1"/>
  <text x="312" y="114" fill="#1a2026">event 2: days 2–3</text>
  <rect x="300" y="140" width="250" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <rect x="300" y="140" width="115" height="30" rx="4" fill="#4169E1"/>
  <text x="437" y="160" fill="#1a2026">event 3: days 3–4</text>
  <!-- attend markers -->
  <g fill="#ffffff" font-weight="700" text-anchor="middle">
    <text x="107" y="68">day 1</text>
    <text x="232" y="114">day 2</text>
    <text x="357" y="160">day 3</text>
  </g>
  <text x="280" y="222" text-anchor="middle" fill="#5c6b76">one event per day — attend on days 1, 2, 3 and see all three</text>
</svg>
