<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="354" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- events = [[1,2],[2,3],[3,4]]; day d spans x 130+110(d-1)..130+110d; bars 28 tall;
       sweep: day 1 heap [2] attend, day 2 heap [3] attend, day 3 heap [4] attend -> 3 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="185" y="62">day 1</text><text x="295" y="62">day 2</text><text x="405" y="62">day 3</text><text x="515" y="62">day 4</text>
  </g>
  <g stroke="#9aa7b2" stroke-opacity="0.55" stroke-width="1">
    <line x1="130" y1="70" x2="130" y2="178"/><line x1="240" y1="70" x2="240" y2="178"/><line x1="350" y1="70" x2="350" y2="178"/><line x1="460" y1="70" x2="460" y2="178"/><line x1="570" y1="70" x2="570" y2="178"/>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="end">
    <text x="120" y="92">0: [1,2]</text><text x="120" y="128">1: [2,3]</text><text x="120" y="164">2: [3,4]</text>
  </g>
  <rect x="130" y="74" width="220" height="28" fill="#ffffff"/>
  <rect x="130" y="74" width="110" height="28" fill="#dbe4fb"/>
  <rect x="130" y="74" width="220" height="28" fill="none" stroke="#1a2026" stroke-width="1.4"/>
  <rect x="240" y="110" width="220" height="28" fill="#ffffff"/>
  <rect x="240" y="110" width="110" height="28" fill="#dbe4fb"/>
  <rect x="240" y="110" width="220" height="28" fill="none" stroke="#1a2026" stroke-width="1.4"/>
  <rect x="350" y="146" width="220" height="28" fill="#ffffff"/>
  <rect x="350" y="146" width="110" height="28" fill="#dbe4fb"/>
  <rect x="350" y="146" width="220" height="28" fill="none" stroke="#1a2026" stroke-width="1.4"/>
  <g fill="#4169E1">
    <circle cx="185" cy="88" r="9"/><circle cx="295" cy="124" r="9"/><circle cx="405" cy="160" r="9"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">
    <text x="185" y="92">1</text><text x="295" y="128">2</text><text x="405" y="164">3</text>
  </g>
  <!-- day sweep trace: chip = clock, box = min-heap of end days after the push -->
  <text x="310" y="214" text-anchor="middle" fill="#5c6b76" font-size="11">min-heap of end days</text>
  <g fill="#dbe4fb">
    <rect x="108" y="218" width="56" height="22" rx="11"/>
    <rect x="108" y="248" width="56" height="22" rx="11"/>
    <rect x="108" y="278" width="56" height="22" rx="11"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="136" y="233">day 1</text><text x="136" y="263">day 2</text><text x="136" y="293">day 3</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="214" y="233">push 2</text><text x="214" y="263">push 3</text><text x="214" y="293">push 4</text>
    <text x="452" y="233">pop 2, attend</text><text x="452" y="263">pop 3, attend</text><text x="452" y="293">pop 4, attend</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="272" y="218" width="76" height="22" rx="4"/>
    <rect x="272" y="248" width="76" height="22" rx="4"/>
    <rect x="272" y="278" width="76" height="22" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">
    <text x="310" y="233">2</text><text x="310" y="263">3</text><text x="310" y="293">4</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="none">
    <path d="M 240 229 L 266 229" marker-end="url(#arrow)"/>
    <path d="M 354 229 L 380 229" marker-end="url(#arrow)"/>
    <path d="M 240 259 L 266 259" marker-end="url(#arrow)"/>
    <path d="M 354 259 L 380 259" marker-end="url(#arrow)"/>
    <path d="M 240 289 L 266 289" marker-end="url(#arrow)"/>
    <path d="M 354 289 L 380 289" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">
    <text x="560" y="233">count 1</text><text x="560" y="263">count 2</text><text x="560" y="293">count 3</text>
  </g>
  <text x="330" y="324" text-anchor="middle" fill="#1a2026" font-size="13">Each day pushes newly started events into the min-heap of end days &#8212; 2, then 3,</text>
  <text x="330" y="344" text-anchor="middle" fill="#1a2026" font-size="13">then 4 &#8212; and attending the earliest-ending one every day covers <tspan fill="#4169E1" font-weight="600">all 3</tspan> events.</text>
</svg>
