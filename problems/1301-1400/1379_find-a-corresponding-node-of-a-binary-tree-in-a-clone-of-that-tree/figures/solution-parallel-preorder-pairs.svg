<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="368" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree = [7,4,3,null,null,6,19], target = 3; nodes r=17; stack cells 70x32 at (170,274) -->
  <text x="134" y="42" text-anchor="middle" fill="#5c6b76" font-size="12.5">original</text>
  <text x="492" y="42" text-anchor="middle" fill="#5c6b76" font-size="12.5">cloned</text>
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="110" y1="78" x2="62" y2="140"/><line x1="110" y1="78" x2="158" y2="140"/>
    <line x1="158" y1="140" x2="112" y2="202"/><line x1="158" y1="140" x2="204" y2="202"/>
    <line x1="470" y1="78" x2="422" y2="140"/><line x1="470" y1="78" x2="518" y2="140"/>
    <line x1="518" y1="140" x2="472" y2="202"/><line x1="518" y1="140" x2="564" y2="202"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="110" cy="78" r="17"/><circle cx="62" cy="140" r="17"/>
    <circle cx="112" cy="202" r="17"/><circle cx="204" cy="202" r="17"/>
    <circle cx="470" cy="78" r="17"/><circle cx="422" cy="140" r="17"/>
    <circle cx="472" cy="202" r="17"/><circle cx="564" cy="202" r="17"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="#dbe4fb">
    <circle cx="158" cy="140" r="17"/><circle cx="518" cy="140" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="110" y="83">7</text><text x="62" y="145">4</text>
    <text x="112" y="207">6</text><text x="204" y="207">19</text>
    <text x="470" y="83">7</text><text x="422" y="145">4</text>
    <text x="472" y="207">6</text><text x="564" y="207">19</text>
    <text x="158" y="145" fill="#4169E1">3</text><text x="518" y="145" fill="#4169E1">3</text>
  </g>
  <path d="M 158 159 V 172 H 508 V 156" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="290" y="166" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">target = 3</text>
  <text x="290" y="190" text-anchor="middle" fill="#5c6b76" font-size="12">same node in the clone</text>
  <text x="40" y="252" fill="#1a2026" font-size="13">step 1: pop (7,7), push (4,4) and (3,3)</text>
  <text x="275" y="268" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">top</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="170" y="274" width="70" height="32"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="#ffffff">
    <rect x="240" y="274" width="70" height="32"/>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="205" y="295">(4,4)</text><text x="275" y="295" fill="#4169E1" font-weight="600">(3,3)</text>
  </g>
  <text x="205" y="322" text-anchor="middle" fill="#5c6b76" font-size="11">pairs are (original, cloned)</text>
  <text x="345" y="252" fill="#1a2026" font-size="13">step 2: pop (3,3) — 3 = target</text>
  <text x="345" y="282" fill="#1a2026" font-size="13">return cloned 3 → subtree <tspan fill="#4169E1" font-weight="600">[3,6,19]</tspan></text>
  <text x="320" y="340" text-anchor="middle" fill="#1a2026" font-size="13">Both walks move in lockstep and the second pop carries value 3,</text>
  <text x="320" y="358" text-anchor="middle" fill="#1a2026" font-size="13">so the paired cloned node comes back with subtree <tspan fill="#4169E1" font-weight="600">[3,6,19]</tspan>.</text>
</svg>
