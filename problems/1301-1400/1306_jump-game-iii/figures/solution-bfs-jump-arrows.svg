<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- arr = [4,2,3,0,3,1,2], start = 5; cells 64x44 at (96,80); corner n = BFS pop order;
       gray arcs = jumps (dashed = target already visited), blue arc = the jump reaching the 0 -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 448 124 Q 420 152 392 124" marker-end="url(#arrow)"/>
    <path d="M 512 124 Q 448 190 376 124" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
    <path d="M 384 124 Q 288 200 192 124" marker-end="url(#arrow)"/>
    <path d="M 448 76 Q 480 48 512 76" marker-end="url(#arrow)"/>
  </g>
  <path d="M 192 76 Q 256 40 320 76" fill="none" stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrowB)"/>
  <text x="480" y="52" text-anchor="middle" fill="#5c6b76" font-size="12">+1</text>
  <text x="256" y="44" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">+2 → the 0</text>
  <text x="420" y="168" text-anchor="middle" fill="#5c6b76" font-size="12">−1</text>
  <text x="448" y="206" text-anchor="middle" fill="#5c6b76" font-size="12">−2 seen</text>
  <text x="288" y="182" text-anchor="middle" fill="#5c6b76" font-size="12">−3</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="96" y="80" width="64" height="44" fill="#f0f3f7"/>
    <rect x="160" y="80" width="64" height="44" fill="#dbe4fb"/>
    <rect x="224" y="80" width="64" height="44" fill="#f0f3f7"/>
    <rect x="288" y="80" width="64" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.5"/>
    <rect x="352" y="80" width="64" height="44" fill="#dbe4fb"/>
    <rect x="416" y="80" width="64" height="44" fill="#dbe4fb"/>
    <rect x="480" y="80" width="64" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="128" y="107" fill="#9aa7b2">4</text><text x="192" y="107" fill="#1a2026">2</text><text x="256" y="107" fill="#9aa7b2">3</text>
    <text x="320" y="107" fill="#4169E1">0</text><text x="384" y="107" fill="#1a2026">3</text><text x="448" y="103" fill="#1a2026">1</text>
    <text x="512" y="107" fill="#1a2026">2</text>
  </g>
  <text x="448" y="119" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">start</text>
  <g text-anchor="start" fill="#5c6b76" font-size="10.5">
    <text x="166" y="94">4</text><text x="294" y="94">5</text>
    <text x="358" y="94">3</text><text x="422" y="94">1</text><text x="486" y="94">2</text>
  </g>
  <text x="320" y="230" text-anchor="middle" fill="#1a2026" font-size="13">queue: [5] → [6, 4] → [4] → [1] → [3] — popping 3 finds arr[3] = 0 → <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="320" y="256" text-anchor="middle" fill="#1a2026" font-size="13">Indexes 0 and 2 are never reached — both jump routes land on index 3,</text>
  <text x="320" y="275" text-anchor="middle" fill="#1a2026" font-size="13">whose value 0 ends the search.</text>
</svg>
