<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="180" y1="50" x2="100" y2="140"/>
    <line x1="180" y1="50" x2="260" y2="140"/>
  </g>
  <g stroke="#1a2026" stroke-width="2">
