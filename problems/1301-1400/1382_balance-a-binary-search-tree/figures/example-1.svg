<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- input: a right spine -->
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="60" y1="30" x2="120" y2="75"/>
    <line x1="120" y1="75" x2="180" y2="120"/>
    <line x1="180" y1="120" x2="240" y2="165"/>
  </g>
  <g stroke="#1a2026" stroke-width="2">
    <circle cx="60" cy="30" r="15" fill="#ffffff"/>
    <circle cx="120" cy="75" r="15" fill="#ffffff"/>
    <circle cx="180" cy="120" r="15" fill="#ffffff"/>
    <circle cx="240" cy="165" r="15" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="60" y="35">1</text><text x="120" y="80">2</text><text x="180" y="125">3</text><text x="240" y="170">4</text>
  </g>
  <text x="150" y="215" text-anchor="middle" fill="#5c6b76" font-size="12.5">input: every node hangs right</text>
  <line x1="290" y1="100" x2="340" y2="100" stroke="#5c6b76" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- output -->
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="420" y1="40" x2="350" y2="110"/>
    <line x1="420" y1="40" x2="490" y2="110"/>
    <line x1="490" y1="110" x2="555" y2="170"/>
  </g>
  <g stroke="#1a2026" stroke-width="2">
    <circle cx="420" cy="40" r="15" fill="#ffffff"/>
    <circle cx="350" cy="110" r="15" fill="#ffffff"/>
    <circle cx="490" cy="110" r="15" fill="#ffffff"/>
    <circle cx="555" cy="170" r="15" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="420" y="45">2</text><text x="350" y="115">1</text><text x="490" y="115">3</text><text x="555" y="175">4</text>
  </g>
  <text x="450" y="212" text-anchor="middle" fill="#5c6b76" font-size="12.5">output</text>
  <!-- also valid -->
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="430" y1="240" x2="355" y2="305"/>
    <line x1="430" y1="240" x2="505" y2="305"/>
    <line x1="355" y1="305" x2="425" y2="360"/>
  </g>
  <g stroke="#1a2026" stroke-width="2">
    <circle cx="430" cy="240" r="15" fill="#ffffff"/>
    <circle cx="355" cy="305" r="15" fill="#ffffff"/>
    <circle cx="505" cy="305" r="15" fill="#ffffff"/>
    <circle cx="425" cy="360" r="15" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="430" y="245">3</text><text x="355" y="310">1</text><text x="505" y="310">4</text><text x="425" y="365">2</text>
  </g>
  <text x="450" y="398" text-anchor="middle" fill="#5c6b76" font-size="12.5">also valid</text>
</svg>
