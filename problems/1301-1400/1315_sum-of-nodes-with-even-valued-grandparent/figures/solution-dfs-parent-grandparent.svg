<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="430" fill="#ffffff"/>
  <!-- tree [6,7,8,2,7,1,3,9,null,1,4,null,null,null,5]; stack entries carry (node, p, g); label (p,g) under each node; contributors over even g filled #dbe4fb; pop trace 3,5,1,7,2 sums to 18 -->
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="190" y1="65" x2="105" y2="140"/><line x1="190" y1="65" x2="275" y2="140"/>
    <line x1="105" y1="140" x2="70" y2="215"/><line x1="105" y1="140" x2="150" y2="215"/>
    <line x1="275" y1="140" x2="230" y2="215"/><line x1="275" y1="140" x2="310" y2="215"/>
    <line x1="70" y1="215" x2="40" y2="285"/><line x1="150" y1="215" x2="120" y2="285"/>
    <line x1="150" y1="215" x2="190" y2="285"/><line x1="310" y1="215" x2="350" y2="285"/>
  </g>
  <g>
    <circle cx="190" cy="65" r="21" fill="#ffffff" stroke="#4169E1" stroke-width="2.4"/>
    <circle cx="105" cy="140" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="275" cy="140" r="21" fill="#ffffff" stroke="#4169E1" stroke-width="2.4"/>
    <circle cx="70" cy="215" r="21" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.4"/>
    <circle cx="150" cy="215" r="21" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="230" cy="215" r="21" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="310" cy="215" r="21" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="40" cy="285" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3"/>
    <circle cx="120" cy="285" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3"/>
    <circle cx="190" cy="285" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3"/>
    <circle cx="350" cy="285" r="21" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="190" y="70">6</text><text x="105" y="145">7</text><text x="275" y="145">8</text>
    <text x="70" y="220">2</text><text x="150" y="220">7</text><text x="230" y="220">1</text><text x="310" y="220">3</text>
    <text x="40" y="290" fill="#5c6b76">9</text><text x="120" y="290" fill="#5c6b76">1</text><text x="190" y="290" fill="#5c6b76">4</text>
    <text x="350" y="290">5</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="190" y="103">(&#8211;,&#8211;)</text>
    <text x="105" y="178">(6,&#8211;)</text><text x="275" y="178">(6,&#8211;)</text>
    <text x="70" y="253">(7,6)</text><text x="150" y="253">(7,6)</text><text x="230" y="253">(8,6)</text><text x="310" y="253">(8,6)</text>
    <text x="40" y="323">(2,7)</text><text x="120" y="323">(7,7)</text><text x="190" y="323">(7,7)</text><text x="350" y="323">(3,8)</text>
  </g>
  <text x="30" y="348" fill="#5c6b76" font-size="11.5">(p, g) = (parent value, grandparent value); &#8211; = none</text>
  <text x="430" y="84" fill="#5c6b76" font-size="12">pops with even g</text>
  <text x="650" y="84" text-anchor="end" fill="#5c6b76" font-size="12">sum</text>
  <g font-size="13">
    <text x="430" y="112" font-weight="600" fill="#1a2026">3</text><text x="470" y="112" fill="#5c6b76" font-size="12">(g=6)</text>
    <text x="430" y="140" font-weight="600" fill="#1a2026">5</text><text x="470" y="140" fill="#5c6b76" font-size="12">(g=8)</text>
    <text x="430" y="168" font-weight="600" fill="#1a2026">1</text><text x="470" y="168" fill="#5c6b76" font-size="12">(g=6)</text>
    <text x="430" y="196" font-weight="600" fill="#1a2026">7</text><text x="470" y="196" fill="#5c6b76" font-size="12">(g=6)</text>
    <text x="430" y="224" font-weight="600" fill="#1a2026">2</text><text x="470" y="224" fill="#5c6b76" font-size="12">(g=6)</text>
  </g>
  <g text-anchor="end" font-size="14" font-weight="600" fill="#1a2026">
    <text x="650" y="112">3</text><text x="650" y="140">8</text><text x="650" y="168">9</text><text x="650" y="196">16</text>
    <text x="650" y="224" fill="#4169E1" font-size="15">18</text>
  </g>
  <text x="430" y="254" fill="#5c6b76" font-size="12">g = 7 is odd: 9, 1, 4 add nothing.</text>
  <text x="340" y="388" text-anchor="middle" fill="#1a2026" font-size="13">Each entry carries (node, parent, grandparent); an even g pays the node's value.</text>
  <text x="340" y="410" text-anchor="middle" fill="#1a2026" font-size="13">Running over even grandparents: 3 + 5 + 1 + 7 + 2 = <tspan fill="#4169E1" font-weight="600">18</tspan>.</text>
</svg>
