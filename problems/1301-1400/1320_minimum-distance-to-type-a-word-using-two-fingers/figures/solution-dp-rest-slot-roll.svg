<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- word="CAKE"; keyboard = statement's 6-wide alphabetical grid, letter i sits at (row, col) = (i div 6, i mod 6); cells 40x32 at (40,60); dp columns = typed prefixes, rows = resting slot o, o=26 unused -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">keyboard, 6 keys per row</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="80" y="60" width="40" height="32"/><rect x="160" y="60" width="40" height="32"/><rect x="240" y="60" width="40" height="32"/>
    <rect x="40" y="92" width="40" height="32"/><rect x="80" y="92" width="40" height="32"/><rect x="120" y="92" width="40" height="32"/><rect x="160" y="92" width="40" height="32"/><rect x="240" y="92" width="40" height="32"/>
    <rect x="40" y="124" width="40" height="32"/><rect x="80" y="124" width="40" height="32"/><rect x="120" y="124" width="40" height="32"/><rect x="160" y="124" width="40" height="32"/><rect x="200" y="124" width="40" height="32"/><rect x="240" y="124" width="40" height="32"/>
    <rect x="40" y="156" width="40" height="32"/><rect x="80" y="156" width="40" height="32"/><rect x="120" y="156" width="40" height="32"/><rect x="160" y="156" width="40" height="32"/><rect x="200" y="156" width="40" height="32"/><rect x="240" y="156" width="40" height="32"/>
    <rect x="40" y="188" width="40" height="32"/><rect x="80" y="188" width="40" height="32"/>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="40" y="60" width="40" height="32"/><rect x="120" y="60" width="40" height="32"/>
    <rect x="200" y="60" width="40" height="32"/><rect x="200" y="92" width="40" height="32"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="60" y="81" font-weight="600">A</text><text x="100" y="81">B</text><text x="140" y="81" font-weight="600">C</text><text x="180" y="81">D</text><text x="220" y="81" font-weight="600">E</text><text x="260" y="81">F</text>
    <text x="60" y="113">G</text><text x="100" y="113">H</text><text x="140" y="113">I</text><text x="180" y="113">J</text><text x="220" y="113" font-weight="600">K</text><text x="260" y="113">L</text>
    <text x="60" y="145">M</text><text x="100" y="145">N</text><text x="140" y="145">O</text><text x="180" y="145">P</text><text x="220" y="145">Q</text><text x="260" y="145">R</text>
    <text x="60" y="177">S</text><text x="100" y="177">T</text><text x="140" y="177">U</text><text x="180" y="177">V</text><text x="220" y="177">W</text><text x="260" y="177">X</text>
    <text x="60" y="209">Y</text><text x="100" y="209">Z</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 136 58 Q 100 40 64 60" marker-end="url(#arrow)"/>
    <path d="M 220 105 V 82" marker-end="url(#arrow)"/>
  </g>
  <text x="124" y="207" fill="#1a2026" font-size="12"><tspan fill="#4169E1" font-weight="600">1</tspan> finger 1: C → A, +2</text>
  <text x="124" y="225" fill="#1a2026" font-size="12"><tspan fill="#4169E1" font-weight="600">2</tspan> finger 2: K lands free, then K → E, +1</text>
  <!-- dp table -->
  <text x="352" y="48" fill="#5c6b76" font-size="12.5">dp[o] = cost, resting finger on o</text>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#5c6b76">
    <text x="490" y="74">CA</text><text x="546" y="74">CAK</text><text x="602" y="74">CAKE</text>
  </g>
  <line x1="460" y1="82" x2="632" y2="82" stroke="#dbe4fb" stroke-width="1.5"/>
  <rect x="460" y="90" width="172" height="26" fill="#f0f3f7"/>
  <rect x="574" y="90" width="56" height="26" fill="#dbe4fb"/>
  <g fill="#5c6b76" font-size="12.5">
    <text x="352" y="108">rest on A</text>
    <text x="352" y="134">rest on C</text>
    <text x="352" y="160">rest on K</text>
    <text x="352" y="186">rest = unused</text>
    <text x="352" y="212">all other o</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="490" y="108">2</text><text x="546" y="108">2</text><text x="602" y="108" fill="#4169E1">3</text>
    <text x="490" y="134">0</text><text x="546" y="134">5</text><text x="602" y="134">6</text>
    <text x="490" y="160">2</text><text x="546" y="160">7</text><text x="602" y="160">6</text>
    <text x="490" y="186">2</text><text x="546" y="186">7</text><text x="602" y="186">8</text>
    <text x="490" y="212">2</text><text x="546" y="212">7</text><text x="602" y="212">8</text>
  </g>
  <text x="340" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Rolling one row per typed character, the best state after CAKE rests on A:</text>
  <text x="340" y="282" text-anchor="middle" fill="#1a2026" font-size="13">2 (C → A) + 0 (K, free) + 1 (K → E) = <tspan fill="#4169E1" font-weight="600">3</tspan>, the minimum over all 27 slots.</text>
</svg>
