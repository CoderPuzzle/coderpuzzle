<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="360" fill="#ffffff"/>
  <!-- Example 1: n=3, reserved=[[1,2],[1,3],[1,8],[2,6],[3,1],[3,10]]; seats 30x30 at x=80+34(s-1), rows y=84/176/268 -->
  <!-- masks list bit i = seat i, written seat 1..10; accent-filled seats = one chosen block set per row -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="95" y="72">1</text><text x="129" y="72">2</text><text x="163" y="72">3</text><text x="197" y="72">4</text><text x="231" y="72">5</text>
    <text x="265" y="72">6</text><text x="299" y="72">7</text><text x="333" y="72">8</text><text x="367" y="72">9</text><text x="401" y="72">10</text>
    <text x="462" y="72">2-5</text><text x="522" y="72">4-7</text><text x="582" y="72">6-9</text>
    <text x="648" y="72">groups</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="80" y="84" width="30" height="30"/>
    <rect x="352" y="84" width="30" height="30"/><rect x="386" y="84" width="30" height="30"/>
    <rect x="80" y="176" width="30" height="30"/><rect x="114" y="176" width="30" height="30"/><rect x="148" y="176" width="30" height="30"/>
    <rect x="182" y="176" width="30" height="30"/><rect x="216" y="176" width="30" height="30"/><rect x="284" y="176" width="30" height="30"/>
    <rect x="318" y="176" width="30" height="30"/><rect x="352" y="176" width="30" height="30"/><rect x="386" y="176" width="30" height="30"/>
    <rect x="114" y="268" width="30" height="30"/><rect x="148" y="268" width="30" height="30"/><rect x="182" y="268" width="30" height="30"/>
    <rect x="216" y="268" width="30" height="30"/><rect x="250" y="268" width="30" height="30"/><rect x="284" y="268" width="30" height="30"/>
    <rect x="318" y="268" width="30" height="30"/><rect x="352" y="268" width="30" height="30"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="182" y="84" width="30" height="30"/><rect x="216" y="84" width="30" height="30"/>
    <rect x="250" y="84" width="30" height="30"/><rect x="284" y="84" width="30" height="30"/>
    <rect x="114" y="176" width="30" height="30"/><rect x="148" y="176" width="30" height="30"/>
    <rect x="182" y="176" width="30" height="30"/><rect x="216" y="176" width="30" height="30"/>
    <rect x="114" y="268" width="30" height="30"/><rect x="148" y="268" width="30" height="30"/>
    <rect x="182" y="268" width="30" height="30"/><rect x="216" y="268" width="30" height="30"/>
    <rect x="250" y="268" width="30" height="30"/><rect x="284" y="268" width="30" height="30"/>
    <rect x="318" y="268" width="30" height="30"/><rect x="352" y="268" width="30" height="30"/>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3">
    <rect x="114" y="84" width="30" height="30"/><rect x="148" y="84" width="30" height="30"/><rect x="318" y="84" width="30" height="30"/>
    <rect x="250" y="176" width="30" height="30"/>
    <rect x="80" y="268" width="30" height="30"/><rect x="386" y="268" width="30" height="30"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="13">
    <text x="129" y="104">×</text><text x="163" y="104">×</text><text x="333" y="104">×</text>
    <text x="265" y="196">×</text>
    <text x="95" y="288">×</text><text x="401" y="288">×</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="44" y="97">row 1</text><text x="44" y="189">row 2</text><text x="44" y="281">row 3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="44" y="111">0110000100</text><text x="44" y="203">0000010000</text><text x="44" y="295">1000000001</text>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="462" y="104" fill="#9aa7b2" font-weight="400">✗</text><text x="522" y="104" fill="#4169E1">✓</text><text x="582" y="104" fill="#9aa7b2" font-weight="400">✗</text>
    <text x="462" y="196" fill="#4169E1">✓</text><text x="522" y="196" fill="#9aa7b2" font-weight="400">✗</text><text x="582" y="196" fill="#9aa7b2" font-weight="400">✗</text>
    <text x="462" y="288" fill="#4169E1">✓</text><text x="522" y="288" fill="#4169E1">✓</text><text x="582" y="288" fill="#4169E1">✓</text>
    <text x="648" y="104" fill="#4169E1">1</text>
    <text x="648" y="196" fill="#4169E1">1</text>
    <text x="648" y="288" fill="#4169E1">2</text>
  </g>
  <text x="340" y="328" text-anchor="middle" fill="#1a2026" font-size="13">Rows 1 and 2 keep one free block each; row 3 keeps both side blocks:</text>
  <text x="340" y="346" text-anchor="middle" fill="#1a2026" font-size="13">1 + 1 + 2 = <tspan fill="#4169E1" font-weight="600">4</tspan> groups in total.</text>
</svg>
