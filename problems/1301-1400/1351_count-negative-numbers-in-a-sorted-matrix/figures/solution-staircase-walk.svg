<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="318" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[4,3,2,-1],[3,2,1,-1],[1,1,-1,-2],[-1,-1,-2,-3]]; cells 64x40 at (60,90);
       pointer enters col 3, stops at cols 2, 2, 1, -1; rows add 1+1+2+4 = 8 negatives -->
  <text x="188" y="60" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="90" width="64" height="40"/><rect x="124" y="90" width="64" height="40"/><rect x="188" y="90" width="64" height="40"/><rect x="252" y="90" width="64" height="40"/>
    <rect x="60" y="130" width="64" height="40"/><rect x="124" y="130" width="64" height="40"/><rect x="188" y="130" width="64" height="40"/><rect x="252" y="130" width="64" height="40"/>
    <rect x="60" y="170" width="64" height="40"/><rect x="124" y="170" width="64" height="40"/><rect x="188" y="170" width="64" height="40"/><rect x="252" y="170" width="64" height="40"/>
    <rect x="60" y="210" width="64" height="40"/><rect x="124" y="210" width="64" height="40"/><rect x="188" y="210" width="64" height="40"/><rect x="252" y="210" width="64" height="40"/>
  </g>
  <g fill="#dbe4fb">
    <rect x="252" y="90" width="64" height="40"/>
    <rect x="252" y="130" width="64" height="40"/>
    <rect x="188" y="170" width="64" height="40"/><rect x="252" y="170" width="64" height="40"/>
    <rect x="60" y="210" width="64" height="40"/><rect x="124" y="210" width="64" height="40"/><rect x="188" y="210" width="64" height="40"/><rect x="252" y="210" width="64" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="92" y="110">4</text><text x="156" y="110">3</text><text x="220" y="110">2</text><text x="284" y="110">-1</text>
    <text x="92" y="150">3</text><text x="156" y="150">2</text><text x="220" y="150">1</text><text x="284" y="150">-1</text>
    <text x="92" y="190">1</text><text x="156" y="190">1</text><text x="220" y="190">-1</text><text x="284" y="190">-2</text>
    <text x="92" y="230">-1</text><text x="156" y="230">-1</text><text x="220" y="230">-2</text><text x="284" y="230">-3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="92" y="82">0</text><text x="156" y="82">1</text><text x="220" y="82">2</text><text x="284" y="82">3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11.5">
    <text x="48" y="82">row</text><text x="48" y="110">0</text><text x="48" y="150">1</text><text x="48" y="190">2</text><text x="48" y="230">3</text>
  </g>
  <!-- pointer enters above column 3; the accent staircase marks each row's stop boundary -->
  <path d="M 278 88 L 290 88 L 284 96 z" fill="#4169E1"/>
  <polyline points="252,90 252,170 188,170 188,210 60,210 60,250" fill="none" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- per-row trace aligned with the grid rows -->
  <text x="484" y="84" text-anchor="middle" fill="#5c6b76" font-size="10.5">pointer col</text>
  <text x="566" y="84" text-anchor="middle" fill="#5c6b76" font-size="10.5">adds 4-1-col</text>
  <text x="628" y="84" text-anchor="middle" fill="#5c6b76" font-size="10.5">total</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="356" y="92" width="304" height="36" rx="4"/>
    <rect x="356" y="132" width="304" height="36" rx="4"/>
    <rect x="356" y="172" width="304" height="36" rx="4"/>
    <rect x="356" y="212" width="304" height="36" rx="4"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="368" y="115">row 0</text><text x="368" y="155">row 1</text><text x="368" y="195">row 2</text><text x="368" y="235">row 3</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="484" y="115">3 &#8594; 2</text><text x="484" y="155">2</text><text x="484" y="195">2 &#8594; 1</text><text x="484" y="235">1 &#8594; 0 &#8594; -1</text>
    <text x="566" y="115">+1</text><text x="566" y="155">+1</text><text x="566" y="195">+2</text><text x="566" y="235">+4</text>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="628" y="115">1</text><text x="628" y="155">2</text><text x="628" y="195">4</text><text x="628" y="235" fill="#4169E1">8</text>
  </g>
  <text x="340" y="284" text-anchor="middle" fill="#1a2026" font-size="13">The column pointer enters at column 3 and only slides left, stopping at columns 2, 2,</text>
  <text x="340" y="304" text-anchor="middle" fill="#1a2026" font-size="13">1 and then -1, so the rows add 1 + 1 + 2 + 4 = <tspan fill="#4169E1" font-weight="600">8</tspan> negatives in total.</text>
</svg>
