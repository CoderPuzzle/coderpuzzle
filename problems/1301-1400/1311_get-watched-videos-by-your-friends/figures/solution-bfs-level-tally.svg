<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="376" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- friends 0:[1,2] 1:[0,3] 2:[0,3] 3:[1,2]; watchedVideos 1:[C] 2:[B,C] 3:[D]; level-1 box (178,40,96,254) holds people 1,2; person 3 at level 2 is muted; tally B:1 C:2 -->
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="80" y1="170" x2="220" y2="80"/>
    <line x1="80" y1="170" x2="220" y2="260"/>
    <line x1="220" y1="80" x2="360" y2="170"/>
    <line x1="220" y1="260" x2="360" y2="170"/>
  </g>
  <rect x="178" y="40" width="96" height="254" rx="10" fill="none" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="226" y="30" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">level 1</text>
  <g>
    <circle cx="80" cy="170" r="27" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <circle cx="220" cy="80" r="27" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="220" cy="260" r="27" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="360" cy="170" r="27" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="80" y="175">0</text><text x="220" y="85">1</text><text x="220" y="265">2</text>
    <text x="360" y="175" fill="#5c6b76">3</text>
  </g>
  <text x="80" y="216" text-anchor="middle" fill="#5c6b76" font-size="12">you &#183; level 0</text>
  <text x="168" y="84" text-anchor="end" fill="#5c6b76" font-size="12">C</text>
  <text x="168" y="264" text-anchor="end" fill="#5c6b76" font-size="12">B C</text>
  <text x="360" y="214" text-anchor="middle" fill="#5c6b76" font-size="12">D</text>
  <text x="360" y="231" text-anchor="middle" fill="#9aa7b2" font-size="11.5">level 2 &gt; k</text>
  <text x="540" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">videos of level-1 friends</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="430" y="80" width="140" height="32"/><rect x="430" y="120" width="140" height="32"/>
  </g>
  <g fill="#1a2026" font-weight="600">
    <text x="448" y="101">B</text><text x="448" y="141">C</text>
  </g>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="505" y1="88" x2="505" y2="104"/>
    <line x1="505" y1="128" x2="505" y2="144"/><line x1="517" y1="128" x2="517" y2="144"/>
  </g>
  <g text-anchor="end" fill="#4169E1" font-weight="600">
    <text x="556" y="101">1</text><text x="556" y="141">2</text>
  </g>
  <path d="M 500 162 V 200" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="514" y="186" fill="#5c6b76" font-size="12">sort by (count, name)</text>
  <rect x="430" y="212" width="200" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="530" y="237" text-anchor="middle" fill="#1a2026" font-weight="600">["B","C"]</text>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">BFS from 0 stops after level 1: friends 1 and 2; person 3 (level 2) is never visited.</text>
  <text x="340" y="352" text-anchor="middle" fill="#1a2026" font-size="13">Their videos tally B&#8594;<tspan fill="#4169E1" font-weight="600">1</tspan>, C&#8594;<tspan fill="#4169E1" font-weight="600">2</tspan> and sort by (frequency, name) into <tspan fill="#4169E1" font-weight="600">["B","C"]</tspan>.</text>
</svg>
