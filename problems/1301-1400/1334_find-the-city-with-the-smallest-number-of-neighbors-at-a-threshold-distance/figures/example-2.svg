<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- weighted edges -->
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="110" y1="70" x2="300" y2="60"/>
    <line x1="110" y1="70" x2="90" y2="240"/>
    <line x1="300" y1="60" x2="440" y2="160"/>
    <line x1="300" y1="60" x2="90" y2="240"/>
    <line x1="440" y1="160" x2="330" y2="270"/>
    <line x1="330" y1="270" x2="90" y2="240"/>
  </g>
  <g fill="#1a2026">
    <text x="197" y="52">2</text>
    <text x="84" y="160">8</text>
    <text x="384" y="96">3</text>
    <text x="172" y="146">2</text>
    <text x="402" y="226">1</text>
    <text x="205" y="246">1</text>
  </g>
  <!-- cities -->
  <g stroke="#1a2026" stroke-width="2">
    <circle cx="300" cy="60" r="19" fill="#ffffff"/>
    <circle cx="440" cy="160" r="19" fill="#ffffff"/>
    <circle cx="330" cy="270" r="19" fill="#ffffff"/>
    <circle cx="90" cy="240" r="19" fill="#ffffff"/>
  </g>
  <circle cx="110" cy="70" r="19" fill="#e8edfb" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="110" y="75">0</text>
    <text x="300" y="65">1</text>
    <text x="440" y="165">2</text>
    <text x="330" y="275">3</text>
    <text x="90" y="245">4</text>
  </g>
  <g fill="#1a2026">
    <text x="470" y="60" font-weight="600">within distance 2:</text>
    <text x="470" y="82" fill="#4169E1" font-weight="600">city 0 → {1}</text>
    <text x="470" y="102" fill="#5c6b76">city 1 → {0, 4}</text>
    <text x="470" y="122" fill="#5c6b76">city 2 → {3, 4}</text>
    <text x="470" y="142" fill="#5c6b76">city 3 → {2, 4}</text>
    <text x="470" y="162" fill="#5c6b76">city 4 → {1, 2, 3}</text>
    <text x="470" y="192" fill="#4169E1" font-weight="700">answer: 0</text>
  </g>
</svg>
