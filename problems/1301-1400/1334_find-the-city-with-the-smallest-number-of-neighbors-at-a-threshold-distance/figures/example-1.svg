<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- weighted edges -->
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="90" y1="120" x2="250" y2="50"/>
    <line x1="250" y1="50" x2="360" y2="240"/>
    <line x1="250" y1="50" x2="170" y2="240"/>
    <line x1="360" y1="240" x2="170" y2="240"/>
  </g>
  <g fill="#1a2026">
    <text x="152" y="76">3</text>
    <text x="322" y="146">1</text>
    <text x="192" y="146">4</text>
    <text x="262" y="232">1</text>
  </g>
  <!-- cities -->
  <g stroke="#1a2026" stroke-width="2">
    <circle cx="90" cy="120" r="19" fill="#ffffff"/>
    <circle cx="250" cy="50" r="19" fill="#ffffff"/>
    <circle cx="360" cy="240" r="19" fill="#ffffff"/>
  </g>
  <circle cx="170" cy="240" r="19" fill="#e8edfb" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="90" y="125">0</text>
    <text x="250" y="55">1</text>
    <text x="360" y="245">2</text>
    <text x="170" y="245">3</text>
  </g>
  <g fill="#1a2026">
    <text x="430" y="80" font-weight="600">within distance 4:</text>
    <text x="430" y="102" fill="#5c6b76">city 0 → {1, 2}</text>
    <text x="430" y="122" fill="#5c6b76">city 1 → {0, 2, 3}</text>
    <text x="430" y="142" fill="#5c6b76">city 2 → {0, 1, 3}</text>
    <text x="430" y="162" fill="#4169E1" font-weight="600">city 3 → {1, 2}</text>
    <text x="430" y="192" fill="#4169E1" font-weight="700">answer: 3</text>
  </g>
</svg>
