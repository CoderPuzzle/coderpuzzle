<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="296" fill="#ffffff"/>
  <!-- n=4, edges=[[0,1,3],[1,2,1],[1,3,4],[2,3,1]], distanceThreshold=4; nodes r=18; Dijkstra from 0 settles d=[0,3,4,5]; per-city counts within 4: 0:2, 1:3, 2:3, 3:2 -> tie broken to city 3 -->
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="240" y="36">one Dijkstra run, source city 0</text>
    <text x="547" y="36">neighbors within threshold 4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="110" y1="80" x2="240" y2="140"/>
    <line x1="240" y1="140" x2="110" y2="200"/>
    <line x1="240" y1="140" x2="370" y2="140"/>
    <line x1="110" y1="200" x2="370" y2="140"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="181" y="100">3</text>
    <text x="168" y="160">1</text>
    <text x="305" y="126">4</text>
    <text x="240" y="188">1</text>
  </g>
  <circle cx="110" cy="80" r="18" fill="#dbe4fb" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="240" cy="140" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="110" cy="200" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="370" cy="140" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="110" y="85">0</text><text x="240" y="145">1</text><text x="110" y="205">2</text><text x="370" y="145">3</text>
  </g>
  <text x="110" y="50" text-anchor="middle" fill="#5c6b76" font-size="11">source</text>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="110" y="118">d = 0</text><text x="240" y="106">d = 3</text><text x="110" y="240">d = 4</text><text x="370" y="178">d = 5</text>
  </g>
  <!-- counts table -->
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="462" y="70">city</text><text x="548" y="70">neighbors ≤ 4</text><text x="630" y="70">count</text>
  </g>
  <line x1="440" y1="78" x2="654" y2="78" stroke="#dbe4fb" stroke-width="1.5"/>
  <rect x="440" y="172" width="214" height="24" fill="#dbe4fb"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="462" y="102">0</text><text x="462" y="130">1</text><text x="462" y="158">2</text><text x="462" y="186">3</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#5c6b76">
    <text x="548" y="102">1, 2</text><text x="548" y="130">0, 2, 3</text><text x="548" y="158">0, 1, 3</text><text x="548" y="186">1, 2</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="630" y="102">2</text><text x="630" y="130">3</text><text x="630" y="158">3</text><text x="630" y="186" fill="#4169E1">2</text>
  </g>
  <text x="340" y="256" text-anchor="middle" fill="#1a2026" font-size="13">The run from city 0 settles 0, 3, 4, 5; every source fills one row — counts 2, 3, 3, 2 tie at 2,</text>
  <text x="340" y="276" text-anchor="middle" fill="#1a2026" font-size="13">and the tie-break takes the greatest number: city <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
