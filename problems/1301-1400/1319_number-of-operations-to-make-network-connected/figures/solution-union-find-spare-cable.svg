<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n=4, connections=[[0,1],[0,2],[1,2]]; badges 1/2/3 = edge processing order; forest panels show parent pointers after each cable, nodes r=14 at y=235, panel centers x=120,340,560 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="250" y1="70" x2="170" y2="125"/>
    <line x1="250" y1="70" x2="330" y2="125"/>
  </g>
  <line x1="170" y1="125" x2="330" y2="125" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="5 4"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="250" cy="70" r="18"/><circle cx="170" cy="125" r="18"/><circle cx="330" cy="125" r="18"/>
  </g>
  <circle cx="470" cy="95" r="18" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="250" y="75">0</text><text x="170" y="130">1</text><text x="330" y="130">2</text>
    <text x="470" y="100" fill="#9aa7b2">3</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="250" y="114">spare</text>
    <text x="470" y="137">no cable</text>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">
    <circle cx="192" cy="106" r="9" fill="#4169E1"/><text x="192" y="110">1</text>
    <circle cx="308" cy="106" r="9" fill="#4169E1"/><text x="308" y="110">2</text>
    <circle cx="250" cy="144" r="9" fill="#4169E1"/><text x="250" y="148">3</text>
  </g>
  <!-- panel titles -->
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="120" y="185">cable [0,1] lands</text>
    <text x="340" y="185">cable [0,2] lands</text>
    <text x="560" y="185">cable [1,2] lands</text>
  </g>
  <!-- panel 1: parent[1]=0 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <circle cx="48" cy="235" r="14"/><circle cx="96" cy="235" r="14"/><circle cx="144" cy="235" r="14"/><circle cx="192" cy="235" r="14"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="48" y="240">0</text><text x="96" y="240">1</text><text x="144" y="240">2</text><text x="192" y="240">3</text>
  </g>
  <path d="M 92 219 Q 72 203 54 219" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- panel 2: parent[1]=0, parent[2]=0 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <circle cx="268" cy="235" r="14"/><circle cx="316" cy="235" r="14"/><circle cx="364" cy="235" r="14"/><circle cx="412" cy="235" r="14"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="268" y="240">0</text><text x="316" y="240">1</text><text x="364" y="240">2</text><text x="412" y="240">3</text>
  </g>
  <path d="M 312 220 Q 292 206 277 220" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 360 216 Q 316 190 272 214" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- panel 3: forest unchanged, cable 1-2 refused -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <circle cx="488" cy="235" r="14"/><circle cx="536" cy="235" r="14"/><circle cx="584" cy="235" r="14"/><circle cx="632" cy="235" r="14"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="488" y="240">0</text><text x="536" y="240">1</text><text x="584" y="240">2</text><text x="632" y="240">3</text>
  </g>
  <path d="M 532 220 Q 512 206 497 220" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 580 216 Q 536 190 492 214" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 536 252 Q 560 266 584 252" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="120" y="288">roots 1 ≠ 0 → merge</text>
    <text x="340" y="288">roots 2 ≠ 0 → merge</text>
    <text x="560" y="288">roots 0, 0 → spare cable</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="120" y="308">components 4 → 3</text>
    <text x="340" y="308">components 3 → 2</text>
    <text x="560" y="308">components stays <tspan fill="#4169E1">2</tspan></text>
  </g>
  <text x="330" y="338" text-anchor="middle" fill="#1a2026" font-size="13">Answer = components − 1 = 2 − 1 = <tspan fill="#4169E1" font-weight="600">1</tspan>: rewire the spare cable 1–2 to reach computer 3.</text>
</svg>
