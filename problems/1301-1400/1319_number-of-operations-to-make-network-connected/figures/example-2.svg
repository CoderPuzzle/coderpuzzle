<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 302" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- before -->
  <g>
    <line x1="70" y1="50" x2="200" y2="50" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="70" y1="50" x2="70" y2="150" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="70" y1="50" x2="200" y2="150" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="200" y1="50" x2="70" y2="150" stroke="#9aa5ae" stroke-width="1.8" stroke-dasharray="5 4"/>
    <line x1="200" y1="50" x2="200" y2="150" stroke="#9aa5ae" stroke-width="1.8" stroke-dasharray="5 4"/>
    <circle cx="70" cy="50" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="200" cy="50" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="70" cy="150" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="200" cy="150" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="70" cy="250" r="17" fill="#e8edfb" stroke="#4169E1" stroke-width="2.5"/>
    <circle cx="200" cy="250" r="17" fill="#e8edfb" stroke="#4169E1" stroke-width="2.5"/>
    <g text-anchor="middle" font-weight="600" fill="#1a2026">
      <text x="70" y="55">0</text><text x="200" y="55">1</text>
      <text x="70" y="155">2</text><text x="200" y="155">3</text>
      <text x="70" y="255">4</text><text x="200" y="255">5</text>
    </g>
    <text x="135" y="292" text-anchor="middle" fill="#5c6b76" font-size="12.5">before</text>
  </g>
  <!-- transformation arrow -->
  <line x1="278" y1="150" x2="330" y2="150" stroke="#5c6b76" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="304" y="132" text-anchor="middle" fill="#5c6b76" font-size="12">move two cables</text>
  <!-- after -->
  <g>
    <line x1="400" y1="50" x2="530" y2="50" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="400" y1="50" x2="400" y2="150" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="400" y1="50" x2="530" y2="150" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="530" y1="150" x2="400" y2="250" stroke="#4169E1" stroke-width="2.8"/>
    <line x1="417" y1="250" x2="513" y2="250" stroke="#4169E1" stroke-width="2.8"/>
    <circle cx="400" cy="50" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="530" cy="50" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="400" cy="150" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="530" cy="150" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="400" cy="250" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="530" cy="250" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <g text-anchor="middle" font-weight="600" fill="#1a2026">
      <text x="400" y="55">0</text><text x="530" y="55">1</text>
      <text x="400" y="155">2</text><text x="530" y="155">3</text>
      <text x="400" y="255">4</text><text x="530" y="255">5</text>
    </g>
    <text x="465" y="292" text-anchor="middle" fill="#5c6b76" font-size="12.5">after</text>
  </g>
</svg>
