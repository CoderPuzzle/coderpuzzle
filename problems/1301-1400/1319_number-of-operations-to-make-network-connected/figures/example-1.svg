<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 258" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- before -->
  <g>
    <line x1="80" y1="60" x2="210" y2="60" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="80" y1="60" x2="80" y2="190" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="210" y1="60" x2="80" y2="190" stroke="#9aa5ae" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="152" y="116" fill="#5c6b76" font-size="11.5" transform="rotate(55 152 116)">remove</text>
    <circle cx="80" cy="60" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="210" cy="60" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="80" cy="190" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="210" cy="190" r="18" fill="#e8edfb" stroke="#4169E1" stroke-width="2.5"/>
    <g text-anchor="middle" font-weight="600" fill="#1a2026">
      <text x="80" y="65">0</text><text x="210" y="65">1</text>
      <text x="80" y="195">2</text><text x="210" y="195">3</text>
    </g>
    <text x="145" y="235" text-anchor="middle" fill="#5c6b76" font-size="12.5">before</text>
  </g>
  <!-- transformation arrow -->
  <line x1="280" y1="125" x2="335" y2="125" stroke="#5c6b76" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="307" y="108" text-anchor="middle" fill="#5c6b76" font-size="12">move one cable</text>
  <!-- after -->
  <g>
    <line x1="410" y1="60" x2="540" y2="60" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="410" y1="60" x2="410" y2="190" stroke="#1a2026" stroke-width="1.8"/>
    <line x1="540" y1="60" x2="540" y2="190" stroke="#4169E1" stroke-width="2.8"/>
    <circle cx="410" cy="60" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="540" cy="60" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="410" cy="190" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <circle cx="540" cy="190" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
    <g text-anchor="middle" font-weight="600" fill="#1a2026">
      <text x="410" y="65">0</text><text x="540" y="65">1</text>
      <text x="410" y="195">2</text><text x="540" y="195">3</text>
    </g>
    <text x="475" y="235" text-anchor="middle" fill="#5c6b76" font-size="12.5">after</text>
  </g>
</svg>
