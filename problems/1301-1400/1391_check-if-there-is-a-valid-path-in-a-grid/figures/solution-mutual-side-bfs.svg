<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[2,4,3],[6,5,2]]; cells 120x92 at (140,64); blue bars = street openings; badge = BFS pop order -->
  <g stroke="#9aa7b2" stroke-width="2" fill="none">
    <path d="M 394 26 L 406 38 M 406 26 L 394 38"/>
  </g>
  <line x1="140" y1="32" x2="200" y2="32" stroke="#4169E1" stroke-width="6" stroke-linecap="round"/>
  <text x="212" y="37" fill="#5c6b76" font-size="12">side a street opens</text>
  <text x="418" y="37" fill="#5c6b76" font-size="12">shared side closed</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="140" y="64" width="120" height="92"/><rect x="260" y="64" width="120" height="92"/><rect x="380" y="64" width="120" height="92"/>
    <rect x="140" y="156" width="120" height="92"/><rect x="260" y="156" width="120" height="92"/>
  </g>
  <rect x="380" y="156" width="120" height="92" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.5"/>
  <!-- openings: each street's two open sides, drawn on the cell edges -->
  <g stroke="#4169E1" stroke-width="6" stroke-linecap="round">
    <line x1="170" y1="64" x2="230" y2="64"/>
    <line x1="170" y1="156" x2="230" y2="156"/>
    <line x1="290" y1="156" x2="350" y2="156"/>
    <line x1="410" y1="156" x2="470" y2="156"/>
    <line x1="380" y1="80" x2="380" y2="140"/>
    <line x1="260" y1="172" x2="260" y2="232"/>
    <line x1="410" y1="248" x2="470" y2="248"/>
  </g>
  <!-- the two closed shared sides -->
  <g stroke="#9aa7b2" stroke-width="2.5" fill="none">
    <path d="M 250 100 L 270 120 M 270 100 L 250 120"/>
    <path d="M 370 192 L 390 212 M 390 192 L 370 212"/>
  </g>
  <g text-anchor="middle">
    <text x="200" y="116" font-weight="600" font-size="17" fill="#1a2026">2</text><text x="200" y="140" fill="#5c6b76" font-size="11.5">(0, 0)</text>
    <text x="320" y="116" font-weight="600" font-size="17" fill="#1a2026">4</text><text x="320" y="140" fill="#5c6b76" font-size="11.5">(0, 1)</text>
    <text x="440" y="116" font-weight="600" font-size="17" fill="#1a2026">3</text><text x="440" y="140" fill="#5c6b76" font-size="11.5">(0, 2)</text>
    <text x="200" y="208" font-weight="600" font-size="17" fill="#1a2026">6</text><text x="200" y="232" fill="#5c6b76" font-size="11.5">(1, 0)</text>
    <text x="320" y="208" font-weight="600" font-size="17" fill="#1a2026">5</text><text x="320" y="232" fill="#5c6b76" font-size="11.5">(1, 1)</text>
    <text x="440" y="208" font-weight="600" font-size="17" fill="#1a2026">2</text><text x="440" y="232" fill="#5c6b76" font-size="11.5">(1, 2)</text>
  </g>
  <!-- BFS arrows, one per step, each crossing a mutually open side -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 224 130 L 224 170" marker-end="url(#arrow)"/>
    <path d="M 246 202 L 274 202" marker-end="url(#arrow)"/>
    <path d="M 294 170 L 294 130" marker-end="url(#arrow)"/>
    <path d="M 366 110 L 394 110" marker-end="url(#arrow)"/>
    <path d="M 414 130 L 414 170" marker-end="url(#arrow)"/>
  </g>
  <g>
    <circle cx="156" cy="80" r="9.5" fill="#4169E1"/><circle cx="156" cy="172" r="9.5" fill="#4169E1"/>
    <circle cx="276" cy="80" r="9.5" fill="#4169E1"/><circle cx="276" cy="172" r="9.5" fill="#4169E1"/>
    <circle cx="484" cy="80" r="9.5" fill="#4169E1"/><circle cx="396" cy="172" r="9.5" fill="#4169E1"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">
    <text x="156" y="84">1</text><text x="156" y="176">2</text><text x="276" y="84">4</text>
    <text x="276" y="176">3</text><text x="484" y="84">5</text><text x="396" y="176">6</text>
  </g>
  <text x="320" y="292" text-anchor="middle" fill="#1a2026" font-size="13">From (0, 0) each step crosses a side that <tspan fill="#4169E1" font-weight="600">both streets open</tspan>, and BFS</text>
  <text x="320" y="310" text-anchor="middle" fill="#1a2026" font-size="13">pops all six cells, reaching (1, 2) = (m - 1, n - 1): the path is <tspan fill="#4169E1" font-weight="600">valid</tspan>.</text>
</svg>
