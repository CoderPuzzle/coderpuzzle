<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- leftChild = [1,-1,3,-1], rightChild = [2,-1,-1,-1]; indeg = [0,1,1,1]; BFS order 0,1,2,3 -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 177 104 L 116 167" marker-end="url(#arrow)"/>
    <path d="M 203 104 L 264 167" marker-end="url(#arrow)"/>
    <path d="M 280 205 L 280 248" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="130" y="130">L</text><text x="252" y="130">R</text>
  </g>
  <text x="292" y="234" fill="#9aa7b2" font-size="11.5">L</text>
  <!-- in-degree audit: node 0 is the only parentless node -->
  <circle cx="190" cy="90" r="20" fill="#4169E1"/>
  <text x="190" y="96" text-anchor="middle" fill="#ffffff" font-weight="600">0</text>
  <circle cx="100" cy="185" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="100" y="191" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <circle cx="280" cy="185" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="280" y="191" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <circle cx="280" cy="272" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="280" y="278" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <text x="190" y="52" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">indeg 0 — root</text>
  <text x="100" y="225" text-anchor="middle" fill="#5c6b76" font-size="12">indeg 1</text>
  <text x="310" y="190" fill="#5c6b76" font-size="12">indeg 1</text>
  <text x="310" y="277" fill="#5c6b76" font-size="12">indeg 1</text>
  <!-- BFS badges: visit order 1..4 -->
  <g fill="#dbe4fb">
    <circle cx="209" cy="73" r="9.5"/><circle cx="119" cy="168" r="9.5"/>
    <circle cx="299" cy="168" r="9.5"/><circle cx="299" cy="255" r="9.5"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">
    <text x="209" y="77">1</text><text x="119" y="172">2</text>
    <text x="299" y="172">3</text><text x="299" y="259">4</text>
  </g>
  <!-- BFS panel -->
  <text x="400" y="60" fill="#5c6b76" font-size="12.5">BFS from the only parentless node (0)</text>
  <g fill="#1a2026" font-size="12">
    <text x="400" y="88">queue [0] → pop 0, enqueue 1, 2</text>
    <text x="400" y="112">queue [1, 2] → pop 1 (leaf)</text>
    <text x="400" y="136">queue [2] → pop 2, enqueue 3</text>
    <text x="400" y="160">queue [3] → pop 3, queue empty</text>
  </g>
  <text x="400" y="180" fill="#9aa7b2" font-size="10.5">queue shown before each pop</text>
  <text x="400" y="210" fill="#1a2026" font-size="13" font-weight="600">visited = <tspan fill="#4169E1">4</tspan> = n → valid tree</text>
  <text x="330" y="310" text-anchor="middle" fill="#1a2026" font-size="13">Node 0 is the only node with in-degree 0, so the BFS starts there</text>
  <text x="330" y="328" text-anchor="middle" fill="#1a2026" font-size="13">and reaches every node — one root, all reachable, so the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
