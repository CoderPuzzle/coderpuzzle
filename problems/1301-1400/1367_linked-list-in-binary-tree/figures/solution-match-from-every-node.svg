<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="410" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [1,4,4,null,2,2,null,1,null,6,8,null,null,null,null,1,3]; list [4,2,8] -->
  <!-- plain edges -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 187 67 L 133 111" marker-end="url(#arrow)"/>
    <path d="M 214 66 L 276 112" marker-end="url(#arrow)"/>
    <path d="M 129 136 L 151 174" marker-end="url(#arrow)"/>
    <path d="M 151 203 L 129 239" marker-end="url(#arrow)"/>
    <path d="M 231 203 L 209 239" marker-end="url(#arrow)"/>
    <path d="M 293 270 L 277 304" marker-end="url(#arrow)"/>
    <path d="M 308 269 L 327 305" marker-end="url(#arrow)"/>
  </g>
  <!-- matched chain C-4 -> E-2 -> H-8 -->
  <g stroke="#4169E1" stroke-width="2.4" fill="none">
    <path d="M 280 136 L 250 174" marker-end="url(#arrowB)"/>
    <path d="M 251 201 L 289 241" marker-end="url(#arrowB)"/>
  </g>
  <!-- unmatched nodes -->
  <circle cx="200" cy="56" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="200" y="61" text-anchor="middle" fill="#1a2026">1</text>
  <circle cx="120" cy="122" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.6"/>
  <text x="120" y="127" text-anchor="middle" fill="#1a2026">4</text>
  <circle cx="160" cy="188" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.6"/>
  <text x="160" y="193" text-anchor="middle" fill="#1a2026">2</text>
  <circle cx="120" cy="254" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.6"/>
  <text x="120" y="259" text-anchor="middle" fill="#1a2026">1</text>
  <circle cx="200" cy="254" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="200" y="259" text-anchor="middle" fill="#1a2026">6</text>
  <circle cx="270" cy="320" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="270" y="325" text-anchor="middle" fill="#1a2026">1</text>
  <circle cx="335" cy="320" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="335" y="325" text-anchor="middle" fill="#1a2026">3</text>
  <!-- matched chain nodes -->
  <circle cx="290" cy="122" r="17" fill="#4169E1"/>
  <text x="290" y="127" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  <circle cx="240" cy="188" r="17" fill="#4169E1"/>
  <text x="240" y="193" text-anchor="middle" fill="#ffffff" font-weight="600">2</text>
  <circle cx="300" cy="254" r="17" fill="#4169E1"/>
  <text x="300" y="259" text-anchor="middle" fill="#ffffff" font-weight="600">8</text>
  <!-- node names used by the stack traces -->
  <g fill="#9aa7b2" font-size="10.5">
    <text x="200" y="30" text-anchor="middle">A</text>
    <text x="96" y="116" text-anchor="end">B</text>
    <text x="314" y="112">C</text>
    <text x="186" y="182" text-anchor="end">D</text>
    <text x="215" y="192" text-anchor="end">E</text>
    <text x="96" y="248" text-anchor="end">F</text>
    <text x="186" y="280" text-anchor="end">G</text>
    <text x="322" y="242">H</text>
    <text x="252" y="346" text-anchor="middle">I</text>
    <text x="348" y="346" text-anchor="middle">J</text>
  </g>
  <!-- (node, index) stack traces -->
  <text x="392" y="56" fill="#5c6b76" font-size="12.5">list = [4, 2, 8]; match stacks:</text>
  <text x="392" y="88" fill="#1a2026" font-size="12.5" font-weight="600">start at B (root.left, 4)</text>
  <g fill="#1a2026" font-size="12">
    <text x="392" y="110">(B,0): 4 = list[0]</text>
    <text x="392" y="130">(D,1): 2 = list[1]</text>
    <text x="392" y="150">(F,2): 1 ≠ 8 — abandon</text>
  </g>
  <text x="392" y="190" fill="#1a2026" font-size="12.5" font-weight="600">start at C (root.right, 4)</text>
  <g fill="#1a2026" font-size="12">
    <text x="392" y="212">(C,0): 4 = list[0]</text>
    <text x="392" y="232">(E,1): 2 = list[1]</text>
    <text x="392" y="252">push (G,2), (H,2); pop (H,2):</text>
    <text x="392" y="272">8 = list[2], index 3 = list end</text>
  </g>
  <text x="392" y="300" fill="#4169E1" font-size="13" font-weight="600">whole list matched → return true</text>
  <text x="340" y="372" text-anchor="middle" fill="#1a2026" font-size="13">Both 4-valued starts are tried; only the right child's descent 4 → 2 → 8</text>
  <text x="340" y="392" text-anchor="middle" fill="#1a2026" font-size="13">consumes the whole list, so the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
