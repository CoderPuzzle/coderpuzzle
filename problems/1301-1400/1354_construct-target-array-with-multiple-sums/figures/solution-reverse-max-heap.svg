<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- target = [9,3,5]; reverse un-mixing: 9-(3+5)=1, 5-(1+3)=1, 3-(1+1)=1 -> [1,1,1];
       cells 78x40 at x 150, rows y 64/122/180/238; sums 17 -> 9 -> 5 -> 3 -->
  <text x="271" y="46" text-anchor="middle" fill="#5c6b76" font-size="11.5">max-heap serves the largest each step</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <rect x="150" y="64" width="78" height="40"/>
    <rect x="314" y="122" width="78" height="40"/>
    <rect x="232" y="180" width="78" height="40"/>
    <rect x="150" y="238" width="78" height="40"/><rect x="232" y="238" width="78" height="40"/><rect x="314" y="238" width="78" height="40"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="232" y="64" width="78" height="40"/><rect x="314" y="64" width="78" height="40"/>
    <rect x="150" y="122" width="78" height="40"/><rect x="232" y="122" width="78" height="40"/>
    <rect x="150" y="180" width="78" height="40"/><rect x="314" y="180" width="78" height="40"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="189" y="89" fill="#4169E1" font-weight="600">9</text><text x="271" y="89" fill="#1a2026">3</text><text x="353" y="89" fill="#1a2026">5</text>
    <text x="189" y="147" fill="#4169E1" font-weight="600">1</text><text x="271" y="147" fill="#1a2026">3</text><text x="353" y="147" fill="#4169E1" font-weight="600">5</text>
    <text x="189" y="205" fill="#1a2026">1</text><text x="271" y="205" fill="#4169E1" font-weight="600">3</text><text x="353" y="205" fill="#4169E1" font-weight="600">1</text>
    <text x="189" y="263" fill="#4169E1" font-weight="600">1</text><text x="271" y="263" fill="#4169E1" font-weight="600">1</text><text x="353" y="263" fill="#4169E1" font-weight="600">1</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="140" y="89">target</text><text x="140" y="263">start</text>
  </g>
  <!-- reversed steps: replace the accent-boxed largest with largest - rest -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 189 104 L 189 122" marker-end="url(#arrow)"/>
    <path d="M 353 162 L 353 180" marker-end="url(#arrow)"/>
    <path d="M 271 220 L 271 238" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="412" y="117">largest 9 - rest 8 = 1</text>
    <text x="412" y="175">largest 5 - rest 4 = 1</text>
    <text x="412" y="233">largest 3 - rest 2 = 1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="614" y="89">sum 17</text><text x="614" y="147">sum 9</text><text x="614" y="205">sum 5</text><text x="614" y="263">sum 3</text>
  </g>
  <text x="330" y="308" text-anchor="middle" fill="#1a2026" font-size="13">Reversing, each step replaces the largest with largest - rest: 9-8, 5-4, 3-2 &#8212; every</text>
  <text x="330" y="328" text-anchor="middle" fill="#1a2026" font-size="13">element unwinds to 1, so target = [9, 3, 5] is reachable and the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
