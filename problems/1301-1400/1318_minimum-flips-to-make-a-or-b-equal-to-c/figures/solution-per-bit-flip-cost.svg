<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="316" fill="#ffffff"/>
  <!-- a=2=0010 b=6=0110 c=5=0101; cells 48x38 at (120+48j, 88+38i), j=bit3..bit0; cost chips at y=210: 0,0,2,1; total 3 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="144" y="78">bit 3</text><text x="192" y="78">bit 2</text><text x="240" y="78">bit 1</text><text x="288" y="78">bit 0</text>
  </g>
  <g text-anchor="end" fill="#1a2026" font-size="13">
    <text x="104" y="112">a = 2</text><text x="104" y="150">b = 6</text><text x="104" y="188">c = 5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="120" y="88" width="48" height="38"/><rect x="168" y="88" width="48" height="38"/><rect x="216" y="88" width="48" height="38"/><rect x="264" y="88" width="48" height="38"/>
    <rect x="120" y="126" width="48" height="38"/><rect x="168" y="126" width="48" height="38"/><rect x="216" y="126" width="48" height="38"/><rect x="264" y="126" width="48" height="38"/>
    <rect x="120" y="164" width="48" height="38"/><rect x="168" y="164" width="48" height="38"/><rect x="216" y="164" width="48" height="38"/><rect x="264" y="164" width="48" height="38"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="144" y="112">0</text><text x="192" y="112">0</text><text x="240" y="112" fill="#4169E1" font-weight="600">1</text><text x="288" y="112">0</text>
    <text x="144" y="150">0</text><text x="192" y="150">1</text><text x="240" y="150" fill="#4169E1" font-weight="600">1</text><text x="288" y="150">0</text>
    <text x="144" y="188">0</text><text x="192" y="188">1</text><text x="240" y="188">0</text><text x="288" y="188" fill="#4169E1" font-weight="600">1</text>
  </g>
  <g>
    <rect x="120" y="210" width="48" height="30" rx="4" fill="#f0f3f7"/><rect x="168" y="210" width="48" height="30" rx="4" fill="#f0f3f7"/>
    <rect x="216" y="210" width="48" height="30" rx="4" fill="#dbe4fb"/><rect x="264" y="210" width="48" height="30" rx="4" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="144" y="230" fill="#9aa7b2">0</text><text x="192" y="230" fill="#9aa7b2">0</text>
    <text x="240" y="230" fill="#4169E1">2</text><text x="288" y="230" fill="#4169E1">1</text>
  </g>
  <text x="104" y="230" text-anchor="end" fill="#5c6b76" font-size="12">flips</text>
  <g font-size="12.5">
    <text x="360" y="106" fill="#1a2026" font-weight="600">c's bit is 1: OR must give 1.</text>
    <text x="360" y="126" fill="#5c6b76">a = b = 0 &#8594; one flip (bit 0).</text>
    <text x="360" y="160" fill="#1a2026" font-weight="600">c's bit is 0: OR must give 0.</text>
    <text x="360" y="180" fill="#5c6b76">clear every set bit &#8212;</text>
    <text x="360" y="198" fill="#5c6b76">a = b = 1 &#8594; two flips (bit 1).</text>
  </g>
  <text x="340" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Bit by bit: bit 0 needs a 1 (one flip); bit 1 must clear two 1s (two flips).</text>
  <text x="340" y="294" text-anchor="middle" fill="#1a2026" font-size="13">Bits 3 and 2 already agree, so the minimum is 2 + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan> flips.</text>
</svg>
