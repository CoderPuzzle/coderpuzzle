<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="396" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- Example 1, maxSize 3; values strip cells 32x30 at x=170+36c, pending strip at x=360+36c; rows y=64+48r -->
  <!-- accented pending cell = the single slot written this step; ghost (dashed) cells are slots vacated by a pop; fold arc runs ghost -> kept cell -->
  <text x="24" y="48" fill="#5c6b76" font-size="12.5">op</text>
  <text x="222" y="48" text-anchor="middle" fill="#5c6b76" font-size="12.5">values</text>
  <text x="412" y="48" text-anchor="middle" fill="#5c6b76" font-size="12.5">pending</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="170" y="64" width="32" height="30"/><rect x="206" y="64" width="32" height="30"/><rect x="242" y="64" width="32" height="30"/>
    <rect x="170" y="112" width="32" height="30"/><rect x="206" y="112" width="32" height="30"/><rect x="242" y="112" width="32" height="30"/>
    <rect x="170" y="160" width="32" height="30"/><rect x="206" y="160" width="32" height="30"/><rect x="242" y="160" width="32" height="30"/>
    <rect x="170" y="208" width="32" height="30"/><rect x="206" y="208" width="32" height="30"/>
    <rect x="170" y="256" width="32" height="30"/>
  </g>
  <g fill="none" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="3 3">
    <rect x="242" y="208" width="32" height="30"/>
    <rect x="206" y="256" width="32" height="30"/><rect x="242" y="256" width="32" height="30"/>
    <rect x="170" y="304" width="32" height="30"/><rect x="206" y="304" width="32" height="30"/><rect x="242" y="304" width="32" height="30"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="360" y="64" width="32" height="30"/><rect x="396" y="64" width="32" height="30"/><rect x="432" y="64" width="32" height="30"/>
    <rect x="360" y="112" width="32" height="30"/><rect x="396" y="112" width="32" height="30"/>
    <rect x="360" y="160" width="32" height="30"/><rect x="432" y="160" width="32" height="30"/>
    <rect x="360" y="208" width="32" height="30"/>
    <rect x="360" y="256" width="32" height="30"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="432" y="112" width="32" height="30"/>
    <rect x="396" y="160" width="32" height="30"/>
    <rect x="396" y="208" width="32" height="30"/>
    <rect x="360" y="256" width="32" height="30"/>
  </g>
  <g fill="none" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="3 3">
    <rect x="432" y="208" width="32" height="30"/>
    <rect x="396" y="256" width="32" height="30"/><rect x="432" y="256" width="32" height="30"/>
    <rect x="360" y="304" width="32" height="30"/><rect x="396" y="304" width="32" height="30"/><rect x="432" y="304" width="32" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="186" y="84">1</text><text x="222" y="84">2</text><text x="258" y="84">3</text>
    <text x="186" y="132">1</text><text x="222" y="132">2</text><text x="258" y="132">3</text>
    <text x="186" y="180">1</text><text x="222" y="180">2</text><text x="258" y="180">3</text>
    <text x="186" y="228">1</text><text x="222" y="228">2</text>
    <text x="186" y="276">1</text>
    <text x="448" y="180">100</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="13">
    <text x="376" y="84">0</text><text x="412" y="84">0</text><text x="448" y="84">0</text>
    <text x="376" y="132">0</text><text x="412" y="132">0</text>
    <text x="376" y="180">0</text>
    <text x="376" y="228">0</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#4169E1">
    <text x="448" y="132">100</text>
    <text x="412" y="180">100</text>
    <text x="412" y="228">200</text>
    <text x="376" y="276">200</text>
  </g>
  <g fill="none" stroke="#42525e" stroke-width="1.5">
    <path d="M 448 204 Q 430 190 414 204" marker-end="url(#arrow)"/>
    <path d="M 412 252 Q 394 238 378 252" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="24" y="84">push 1, 2, 3</text>
    <text x="24" y="132">increment(5,100)</text>
    <text x="24" y="180">increment(2,100)</text>
    <text x="24" y="228">pop → <tspan fill="#4169E1" font-weight="600">103</tspan></text>
    <text x="24" y="276">pop → <tspan fill="#4169E1" font-weight="600">202</tspan></text>
    <text x="24" y="324">pop → <tspan fill="#4169E1" font-weight="600">201</tspan></text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="486" y="84">push(4) rejected: full</text>
    <text x="486" y="132">one write: slot 3 += 100</text>
    <text x="486" y="180">one write: slot 2 += 100</text>
    <text x="486" y="228">3 + 100 = 103; fold 100 down</text>
    <text x="486" y="276">2 + 200 = 202; fold 200 down</text>
    <text x="486" y="324">1 + 200 = 201; next pop -1</text>
  </g>
  <text x="340" y="364" text-anchor="middle" fill="#1a2026" font-size="13">Each increment is one pending write at the deepest slot it reaches;</text>
  <text x="340" y="382" text-anchor="middle" fill="#1a2026" font-size="13">each pop collects its pending and folds it down — pops return <tspan fill="#4169E1" font-weight="600">103, 202, 201</tspan>.</text>
</svg>
