<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- board = ["E23","2X2","12S"]; cells 64x40, board at (90,70), score table at (380,70);
       score cell = best sum from S (−1 unreachable); corner ×n = paths attaining it;
       blue outlines = the single max path E → 2 → 3 → 2 → S -->
  <text x="186" y="54" text-anchor="middle" fill="#5c6b76" font-size="12.5">board</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="90" y="70" width="64" height="40"/><rect x="154" y="70" width="64" height="40"/><rect x="218" y="70" width="64" height="40"/>
    <rect x="90" y="110" width="64" height="40"/><rect x="154" y="110" width="64" height="40"/><rect x="218" y="110" width="64" height="40"/>
    <rect x="90" y="150" width="64" height="40"/><rect x="154" y="150" width="64" height="40"/><rect x="218" y="150" width="64" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="122" y="95" font-weight="600">E</text><text x="186" y="95">2</text><text x="250" y="95">3</text>
    <text x="122" y="135">2</text><text x="186" y="135">X</text><text x="250" y="135">2</text>
    <text x="122" y="175">1</text><text x="186" y="175">2</text><text x="250" y="175" font-weight="600">S</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 292 130 H 356" marker-end="url(#arrow)"/>
  </g>
  <text x="324" y="112" text-anchor="middle" fill="#5c6b76" font-size="12">sweep from S,</text>
  <text x="324" y="152" text-anchor="middle" fill="#5c6b76" font-size="12">up and left</text>
  <text x="476" y="54" text-anchor="middle" fill="#5c6b76" font-size="12.5">score (ways)</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="380" y="70" width="64" height="40"/><rect x="444" y="70" width="64" height="40"/><rect x="508" y="70" width="64" height="40"/>
    <rect x="380" y="110" width="64" height="40"/><rect x="508" y="110" width="64" height="40"/>
    <rect x="380" y="150" width="64" height="40"/><rect x="444" y="150" width="64" height="40"/><rect x="508" y="150" width="64" height="40"/>
  </g>
  <rect x="154" y="110" width="64" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <rect x="380" y="70" width="64" height="40" fill="#dbe4fb"/>
  <rect x="508" y="150" width="64" height="40" fill="#dbe4fb"/>
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <rect x="380" y="70" width="64" height="40"/><rect x="444" y="70" width="64" height="40"/>
    <rect x="508" y="70" width="64" height="40"/><rect x="508" y="110" width="64" height="40"/>
    <rect x="508" y="150" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="412" y="95" fill="#4169E1">7</text><text x="476" y="95" fill="#4169E1">7</text><text x="540" y="95" fill="#4169E1">5</text>
    <text x="412" y="135" fill="#1a2026">5</text><text x="540" y="135" fill="#4169E1">2</text>
    <text x="412" y="175" fill="#1a2026">3</text><text x="476" y="175" fill="#1a2026">2</text><text x="540" y="175" fill="#4169E1">0</text>
  </g>
  <text x="476" y="135" text-anchor="middle" fill="#9aa7b2">−1</text>
  <g text-anchor="end" fill="#5c6b76" font-size="10.5">
    <text x="440" y="83">×1</text><text x="504" y="83">×1</text><text x="568" y="83">×1</text>
    <text x="440" y="123">×1</text><text x="568" y="123">×1</text>
    <text x="440" y="163">×1</text><text x="504" y="163">×1</text><text x="568" y="163">×1</text>
  </g>
  <g text-anchor="start" fill="#4169E1" font-size="10.5" font-weight="600">
    <text x="384" y="83">E</text><text x="512" y="163">S</text>
  </g>
  <text x="320" y="214" text-anchor="middle" fill="#5c6b76" font-size="12">corner ×n = number of paths attaining the cell's best score</text>
  <text x="320" y="244" text-anchor="middle" fill="#1a2026" font-size="13">Bottom-up from S the best chain 0 → 2 → 5 → 7 reaches E around the X,</text>
  <text x="320" y="263" text-anchor="middle" fill="#1a2026" font-size="13">and exactly one path attains it — the answer is <tspan fill="#4169E1" font-weight="600">[7, 1]</tspan>.</text>
</svg>
