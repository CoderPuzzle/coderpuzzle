<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="352" fill="#ffffff"/>
  <!-- s = m b a d m; dp cells 56x36 at (84+56j, 92+36i); diagonal len-1 = 0 gray; dp[0][4]=2 accent; dp[1][3] outlined as its source -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="112" y="66">0</text><text x="168" y="66">1</text><text x="224" y="66">2</text><text x="280" y="66">3</text><text x="336" y="66">4</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">
    <text x="112" y="84">m</text><text x="168" y="84">b</text><text x="224" y="84">a</text><text x="280" y="84">d</text><text x="336" y="84">m</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11">
    <text x="70" y="115">0</text><text x="70" y="151">1</text><text x="70" y="187">2</text><text x="70" y="223">3</text><text x="70" y="259">4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="84" y="92" width="56" height="36"/><rect x="140" y="92" width="56" height="36"/><rect x="196" y="92" width="56" height="36"/><rect x="252" y="92" width="56" height="36"/><rect x="308" y="92" width="56" height="36"/>
    <rect x="140" y="128" width="56" height="36"/><rect x="196" y="128" width="56" height="36"/><rect x="252" y="128" width="56" height="36"/><rect x="308" y="128" width="56" height="36"/>
    <rect x="196" y="164" width="56" height="36"/><rect x="252" y="164" width="56" height="36"/><rect x="308" y="164" width="56" height="36"/>
    <rect x="252" y="200" width="56" height="36"/><rect x="308" y="200" width="56" height="36"/>
    <rect x="308" y="236" width="56" height="36"/>
  </g>
  <g fill="#f0f3f7">
    <rect x="84" y="92" width="56" height="36"/><rect x="140" y="128" width="56" height="36"/><rect x="196" y="164" width="56" height="36"/>
    <rect x="252" y="200" width="56" height="36"/><rect x="308" y="236" width="56" height="36"/>
  </g>
  <rect x="308" y="92" width="56" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="252" y="128" width="56" height="36" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" fill="#5c6b76">
    <text x="112" y="115">0</text><text x="168" y="151">0</text><text x="224" y="187">0</text><text x="280" y="223">0</text><text x="336" y="259">0</text>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="168" y="115">1</text><text x="224" y="151">1</text><text x="280" y="187">1</text><text x="336" y="223">1</text>
    <text x="224" y="115">2</text><text x="336" y="187">2</text>
    <text x="280" y="115">3</text><text x="336" y="151">3</text>
  </g>
  <text x="280" y="151" text-anchor="middle" fill="#4169E1" font-weight="600">2</text>
  <text x="336" y="115" text-anchor="middle" fill="#4169E1" font-size="15" font-weight="600">2</text>
  <g fill="#1a2026" font-size="12.5">
    <text x="440" y="104">Fill by increasing length; each</text>
    <text x="440" y="124">mismatched outer pair pays 1.</text>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="440" y="156">s[i]==s[j] &#8594; dp[i+1][j-1]</text>
    <text x="440" y="176">else 1 + min(dp[i+1][j],</text>
    <text x="468" y="196">dp[i][j-1])</text>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="440" y="228">Outer m&#8230;m pair matches free:</text>
  </g>
  <text x="440" y="248" font-size="12.5" fill="#1a2026">dp[0][4] = dp[1][3] = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="340" y="308" text-anchor="middle" fill="#1a2026" font-size="13">mbadm: every adjacent pair mismatches, but the outer m&#8230;m pair matches for free.</text>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">Filling by length ends at dp[0][4] = dp[1][3] = <tspan fill="#4169E1" font-weight="600">2</tspan> &#8212; e.g. "mbdadbm".</text>
</svg>
