<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="314" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- zigzag labels, rows top to bottom: [1]; [3,2] (RTL); [4,5,6,7] (LTR); [15,14,13,12,11,10,9,8] (RTL).
       Node centers: row4 x = 78 + 72j at y 226; row3 x = 114 + 72j at y 168; row2 x 150/294 at y 110; row1 x 222 at y 52.
       Path for label 14: 14 -> 4 -> 3 -> 1 (accent edges, hop labels "pos p -> p//2"). -->
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="78" y1="226" x2="114" y2="168"/><line x1="150" y1="226" x2="114" y2="168"/>
    <line x1="222" y1="226" x2="186" y2="168"/><line x1="294" y1="226" x2="186" y2="168"/>
    <line x1="366" y1="226" x2="258" y2="168"/><line x1="438" y1="226" x2="258" y2="168"/>
    <line x1="510" y1="226" x2="330" y2="168"/><line x1="582" y1="226" x2="330" y2="168"/>
    <line x1="114" y1="168" x2="150" y2="110"/><line x1="186" y1="168" x2="150" y2="110"/>
    <line x1="258" y1="168" x2="294" y2="110"/><line x1="330" y1="168" x2="294" y2="110"/>
    <line x1="150" y1="110" x2="222" y2="52"/><line x1="294" y1="110" x2="222" y2="52"/>
  </g>
  <!-- path edges: 14 -> 4 -> 3 -> 1, arrows stopping at the parent circle -->
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <line x1="141" y1="211" x2="123" y2="183" marker-end="url(#arrow)"/>
    <line x1="123" y1="153" x2="141" y2="125" marker-end="url(#arrow)"/>
    <line x1="163" y1="99" x2="209" y2="63" marker-end="url(#arrow)"/>
  </g>
  <!-- plain nodes -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="78" cy="226" r="15"/><circle cx="222" cy="226" r="15"/><circle cx="294" cy="226" r="15"/>
    <circle cx="366" cy="226" r="15"/><circle cx="438" cy="226" r="15"/><circle cx="510" cy="226" r="15"/>
    <circle cx="582" cy="226" r="15"/>
    <circle cx="186" cy="168" r="15"/><circle cx="258" cy="168" r="15"/><circle cx="330" cy="168" r="15"/>
    <circle cx="294" cy="110" r="15"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="78" y="230.5">15</text><text x="222" y="230.5">13</text><text x="294" y="230.5">12</text>
    <text x="366" y="230.5">11</text><text x="438" y="230.5">10</text><text x="510" y="230.5">9</text>
    <text x="582" y="230.5">8</text>
    <text x="186" y="172.5">5</text><text x="258" y="172.5">6</text><text x="330" y="172.5">7</text>
    <text x="294" y="114.5">2</text>
  </g>
  <!-- path nodes -->
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <circle cx="150" cy="226" r="15"/><circle cx="114" cy="168" r="15"/>
    <circle cx="150" cy="110" r="15"/><circle cx="222" cy="52" r="15"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="150" y="230.5">14</text><text x="114" y="172.5">4</text>
    <text x="150" y="114.5">3</text><text x="222" y="56.5">1</text>
  </g>
  <!-- row direction tags -->
  <g font-size="11.5" fill="#5c6b76">
    <text x="8" y="56">row 1 →</text>
    <text x="8" y="114">row 2 ←</text>
    <text x="8" y="172">row 3 →</text>
    <text x="8" y="230">row 4 ←</text>
  </g>
  <!-- hop labels: position within the row, then halved -->
  <g font-size="11.5" font-weight="600" fill="#4169E1">
    <text x="96" y="200" text-anchor="end">pos 1 → 0</text>
    <text x="122" y="144" text-anchor="end">pos 0 → 0</text>
    <text x="204" y="86">pos 1 → 0</text>
  </g>
  <text x="320" y="262" text-anchor="middle" font-size="12" fill="#5c6b76">each hop: mirror the label to its position within the row, halve it, mirror back one row up</text>
  <text x="320" y="284" text-anchor="middle" font-size="13" fill="#1a2026">Row 4 is right-to-left, so 14 sits at position 15 − 14 = 1; halving gives position 0,</text>
  <text x="320" y="302" text-anchor="middle" font-size="13" fill="#1a2026">which row 3 spells left-to-right as 4. Again: 4 → 3 → the root 1 — path <tspan fill="#4169E1" font-weight="600">[1, 3, 4, 14]</tspan>.</text>
</svg>
