<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- n = 3; red edges 0->1, 1->2; blue none; state = (node, last edge color); seeds (0,red), (0,blue) at 0 -->
  <!-- graph: only the two red edges exist; node 2 stays unreached -->
  <g stroke="#4169E1" stroke-width="2.2" fill="none">
    <line x1="80" y1="124" x2="80" y2="196" marker-end="url(#arrow)"/>
    <line x1="102.4" y1="211.3" x2="212.6" y2="168.7" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="80" cy="100" r="18"/><circle cx="80" cy="220" r="18"/>
  </g>
  <circle cx="235" cy="160" r="18" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="80" y="105" fill="#1a2026">0</text><text x="80" y="225" fill="#1a2026">1</text>
    <text x="235" y="165" fill="#5c6b76">2</text>
  </g>
  <g fill="#9aa7b2" font-size="11">
    <text x="104" y="105">ans 0</text><text x="104" y="225">ans 1</text><text x="261" y="165">ans -1</text>
  </g>
  <!-- state table: dist for each (node, last color) -->
  <rect x="400" y="130" width="115" height="40" fill="#dbe4fb"/>
  <rect x="400" y="170" width="230" height="40" fill="#f0f3f7"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="375" y="80">node</text><text x="457.5" y="80">last = red</text><text x="572.5" y="80">last = blue</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="none">
    <rect x="350" y="90" width="280" height="120"/>
    <line x1="400" y1="90" x2="400" y2="210"/>
    <line x1="515" y1="90" x2="515" y2="210"/>
    <line x1="350" y1="130" x2="630" y2="130"/>
    <line x1="350" y1="170" x2="630" y2="170"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="375" y="115">0</text><text x="375" y="155">1</text><text x="375" y="195" fill="#5c6b76">2</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="457.5" y="112" fill="#1a2026">0</text><text x="572.5" y="112" fill="#1a2026">0</text>
    <text x="457.5" y="157" fill="#4169E1">1</text><text x="572.5" y="156" fill="#9aa7b2">&#8212;</text>
    <text x="457.5" y="196" fill="#9aa7b2">&#8212;</text><text x="572.5" y="196" fill="#9aa7b2">&#8212;</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="9.5">
    <text x="457.5" y="125">seed</text><text x="572.5" y="125">seed</text>
  </g>
  <text x="490" y="230" text-anchor="middle" font-size="13" fill="#1a2026">answer = <tspan fill="#4169E1" font-weight="600">[0, 1, -1]</tspan></text>
  <text x="320" y="254" text-anchor="middle" fill="#1a2026" font-size="13">Both seeds (0,red) and (0,blue) start at 0; node 1 enters state (1, red) at distance 1,</text>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">and from there only a blue edge may leave — none exists, so node 2 stays -1.</text>
  <!-- legend -->
  <line x1="40" y1="294" x2="70" y2="294" stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="78" y="298" fill="#5c6b76" font-size="11.5">red edge</text>
  <line x1="150" y1="294" x2="180" y2="294" stroke="#9aa7b2" stroke-width="2.2" marker-end="url(#arrowG)"/>
  <text x="188" y="298" fill="#5c6b76" font-size="11.5">blue edge: none</text>
</svg>
