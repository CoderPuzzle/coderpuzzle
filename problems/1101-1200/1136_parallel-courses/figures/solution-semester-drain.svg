<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 3, relations = [[1,3],[2,3]]; indeg = 0,0,2; nodes r=24 at y=90; semester bands y=200 -->
  <path d="M 188 76 Q 360 14 525 79" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 356 94 Q 445 92 525 101" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="170" cy="90" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="170" y="96" text-anchor="middle" font-weight="600">1</text>
  <circle cx="330" cy="90" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="330" y="96" text-anchor="middle" font-weight="600">2</text>
  <circle cx="550" cy="90" r="24" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="550" y="96" text-anchor="middle" font-weight="600">3</text>
  <g font-size="12.5" text-anchor="middle" fill="#5c6b76">
    <text x="170" y="142">indegree 0</text>
    <text x="330" y="142">indegree 0</text>
    <text x="550" y="142">indegree 2 <tspan fill="#4169E1" font-weight="600">→ 0</tspan></text>
  </g>
  <!-- semester bands -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="70" y="190">semester 1</text>
    <text x="460" y="190">semester 2</text>
  </g>
  <rect x="70" y="200" width="330" height="76" rx="10" fill="#dbe4fb"/>
  <rect x="460" y="200" width="170" height="76" rx="10" fill="#dbe4fb"/>
  <circle cx="150" cy="238" r="20" fill="#ffffff" stroke="#4169E1" stroke-width="1.4"/>
  <text x="150" y="243" text-anchor="middle" font-weight="600">1</text>
  <circle cx="250" cy="238" r="20" fill="#ffffff" stroke="#4169E1" stroke-width="1.4"/>
  <text x="250" y="243" text-anchor="middle" font-weight="600">2</text>
  <circle cx="520" cy="238" r="20" fill="#ffffff" stroke="#4169E1" stroke-width="1.4"/>
  <text x="520" y="243" text-anchor="middle" font-weight="600">3</text>
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="340" y="243">drained</text>
    <text x="587" y="243">drained</text>
  </g>
  <!-- course 3 becomes available once its indegree hits 0 -->
  <path d="M 550 150 L 545 194" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="40" y="306" fill="#1a2026" font-size="13">Semester 1 drains courses 1 and 2, dropping course 3's indegree from 2 to 0;</text>
  <text x="40" y="324" fill="#1a2026" font-size="13">course 3 then runs alone in semester 2 — the answer is <tspan fill="#4169E1" font-weight="600">2</tspan> semesters.</text>
</svg>
