<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="370" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- bookings = [[1,2,10],[2,3,20],[2,5,25]], n = 5; diff slots: +10@0, -10@2; +20@1, -20@3; +25@1, -25@5.
       Cells x = 170 + 80j, w 68; booking rows h 34 at y 84/126/168; diff row y 210; answer row y 252. -->
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="204" y="40">slot 0</text><text x="284" y="40">slot 1</text><text x="364" y="40">slot 2</text>
    <text x="444" y="40">slot 3</text><text x="524" y="40">slot 4</text><text x="604" y="40">slot 5</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="204" y="56">flight 1</text><text x="284" y="56">flight 2</text><text x="364" y="56">flight 3</text>
    <text x="444" y="56">flight 4</text><text x="524" y="56">flight 5</text><text x="604" y="56">sentinel</text>
  </g>
  <rect x="564" y="66" width="80" height="220" fill="#f0f3f7"/>
  <!-- booking rows -->
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="170" y="84" width="68" height="34"/><rect x="250" y="84" width="68" height="34"/>
    <rect x="330" y="84" width="68" height="34"/><rect x="410" y="84" width="68" height="34"/>
    <rect x="490" y="84" width="68" height="34"/><rect x="570" y="84" width="68" height="34"/>
    <rect x="170" y="126" width="68" height="34"/><rect x="250" y="126" width="68" height="34"/>
    <rect x="330" y="126" width="68" height="34"/><rect x="410" y="126" width="68" height="34"/>
    <rect x="490" y="126" width="68" height="34"/><rect x="570" y="126" width="68" height="34"/>
    <rect x="170" y="168" width="68" height="34"/><rect x="250" y="168" width="68" height="34"/>
    <rect x="330" y="168" width="68" height="34"/><rect x="410" y="168" width="68" height="34"/>
    <rect x="490" y="168" width="68" height="34"/><rect x="570" y="168" width="68" height="34"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600">
    <text x="204" y="106" fill="#4169E1">+10</text><text x="364" y="106" fill="#5c6b76">−10</text>
    <text x="284" y="148" fill="#4169E1">+20</text><text x="444" y="148" fill="#5c6b76">−20</text>
    <text x="284" y="190" fill="#4169E1">+25</text><text x="604" y="190" fill="#5c6b76">−25</text>
  </g>
  <g text-anchor="end" font-size="12" fill="#5c6b76">
    <text x="162" y="105">[1,2,10]</text>
    <text x="162" y="147">[2,3,20]</text>
    <text x="162" y="189">[2,5,25]</text>
  </g>
  <text x="162" y="76" text-anchor="end" font-size="11" fill="#9aa7b2">booking</text>
  <!-- diff row -->
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="170" y="210" width="68" height="34"/><rect x="250" y="210" width="68" height="34"/>
    <rect x="330" y="210" width="68" height="34"/><rect x="410" y="210" width="68" height="34"/>
    <rect x="490" y="210" width="68" height="34"/><rect x="570" y="210" width="68" height="34"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="204" y="232">10</text><text x="284" y="232">45</text><text x="364" y="232">−10</text>
    <text x="444" y="232">−20</text><text x="524" y="232">0</text><text x="604" y="232">−25</text>
  </g>
  <text x="162" y="232" text-anchor="end" font-size="12" font-weight="600" fill="#1a2026">diff</text>
  <!-- answer row -->
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="170" y="252" width="68" height="34"/><rect x="250" y="252" width="68" height="34"/>
    <rect x="330" y="252" width="68" height="34"/><rect x="410" y="252" width="68" height="34"/>
    <rect x="490" y="252" width="68" height="34"/><rect x="570" y="252" width="68" height="34"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#4169E1">
    <text x="204" y="274">10</text><text x="284" y="274">55</text><text x="364" y="274">45</text>
    <text x="444" y="274">25</text><text x="524" y="274">25</text>
  </g>
  <text x="604" y="268" text-anchor="middle" font-size="12" fill="#9aa7b2">—</text>
  <text x="604" y="281" text-anchor="middle" font-size="9.5" fill="#9aa7b2">unused</text>
  <text x="162" y="274" text-anchor="end" font-size="12" font-weight="600" fill="#4169E1">answer</text>
  <line x1="170" y1="300" x2="630" y2="300" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="318" text-anchor="middle" font-size="11" fill="#9aa7b2">one left-to-right running sum over the first five slots</text>
  <text x="330" y="342" text-anchor="middle" font-size="13" fill="#1a2026">Example 1's stamps sum to diff [10, 45, −10, −20, 0, −25]; one running sweep yields</text>
  <text x="330" y="360" text-anchor="middle" font-size="13" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">[10, 55, 45, 25, 25]</tspan>, flight 2 picking up all three stamps.</text>
</svg>
