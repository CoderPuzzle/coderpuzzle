<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- arr = [4,11]: the only possible tree -->
  <g stroke="#1a2026" stroke-width="1.5">
    <line x1="187.6" y1="54.2" x2="132.6" y2="112.1"/>
    <line x1="212.4" y1="54.2" x2="267.4" y2="112.1"/>
  </g>
  <circle cx="200" cy="40" r="18" fill="#e5ebfa" stroke="#4169E1" stroke-width="2"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="120" cy="130" r="18"/>
    <circle cx="280" cy="130" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="200" y="45" fill="#1a2026">44</text>
    <text x="120" y="135" fill="#1a2026">4</text>
    <text x="280" y="135" fill="#1a2026">11</text>
  </g>
  <text x="200" y="184" text-anchor="middle" fill="#5c6b76" font-size="12.5">with two leaves the root is forced: 4 x 11 = 44</text>
</svg>
