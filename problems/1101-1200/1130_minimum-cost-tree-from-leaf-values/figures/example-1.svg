<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- arr = [6,2,4]: the two possible trees, leaves in order 6, 2, 4 -->
  <g stroke="#1a2026" stroke-width="1.5">
    <line x1="120" y1="36" x2="70" y2="120"/>
    <line x1="120" y1="36" x2="190" y2="120"/>
    <line x1="70" y1="120" x2="30" y2="204"/>
    <line x1="70" y1="120" x2="110" y2="204"/>
    <line x1="380" y1="36" x2="300" y2="120"/>
    <line x1="380" y1="36" x2="460" y2="120"/>
    <line x1="460" y1="120" x2="390" y2="204"/>
    <line x1="460" y1="120" x2="530" y2="204"/>
  </g>
  <g fill="#e5ebfa" stroke="#4169E1" stroke-width="2">
    <circle cx="120" cy="36" r="17"/>
    <circle cx="70" cy="120" r="17"/>
    <circle cx="380" cy="36" r="17"/>
    <circle cx="460" cy="120" r="17"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="190" cy="120" r="17"/>
    <circle cx="30" cy="204" r="17"/>
    <circle cx="110" cy="204" r="17"/>
    <circle cx="300" cy="120" r="17"/>
    <circle cx="390" cy="204" r="17"/>
    <circle cx="530" cy="204" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="120" y="41" fill="#1a2026">24</text>
    <text x="70" y="125" fill="#1a2026">12</text>
    <text x="190" y="125" fill="#1a2026">4</text>
    <text x="30" y="209" fill="#1a2026">6</text>
    <text x="110" y="209" fill="#1a2026">2</text>
    <text x="380" y="41" fill="#1a2026">24</text>
    <text x="300" y="125" fill="#1a2026">6</text>
    <text x="460" y="125" fill="#1a2026">8</text>
    <text x="390" y="209" fill="#1a2026">2</text>
    <text x="530" y="209" fill="#1a2026">4</text>
  </g>
  <text x="110" y="244" text-anchor="middle" fill="#5c6b76" font-size="12.5">non-leaf sum 24 + 12 = 36</text>
  <text x="415" y="244" text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">non-leaf sum 24 + 8 = 32</text>
</svg>
