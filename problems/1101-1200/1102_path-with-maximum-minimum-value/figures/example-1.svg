<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 218" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- grid = [[5,4,5],[1,2,6],[7,4,6]]: the best path keeps its minimum at 4 -->
  <g fill="#e5ebfa">
    <rect x="70" y="28" width="48" height="48"/>
    <rect x="118" y="28" width="48" height="48"/>
    <rect x="166" y="28" width="48" height="48"/>
    <rect x="166" y="76" width="48" height="48"/>
    <rect x="166" y="124" width="48" height="48"/>
  </g>
  <g stroke="#b9c4cd" stroke-width="1" fill="none">
    <rect x="70" y="28" width="144" height="144"/>
    <line x1="118" y1="28" x2="118" y2="172"/>
    <line x1="166" y1="28" x2="166" y2="172"/>
    <line x1="70" y1="76" x2="214" y2="76"/>
    <line x1="70" y1="124" x2="214" y2="124"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <rect x="70" y="28" width="144" height="48"/>
    <rect x="166" y="76" width="48" height="96"/>
  </g>
  <g fill="#1a2026" text-anchor="middle">
    <text x="94" y="58">5</text><text x="142" y="58">4</text><text x="190" y="58">5</text>
    <text x="94" y="106">1</text><text x="142" y="106">2</text><text x="190" y="106">6</text>
    <text x="94" y="154">7</text><text x="142" y="154">4</text><text x="190" y="154">6</text>
  </g>
  <text x="170" y="206" text-anchor="middle" fill="#5c6b76" font-size="12.5">along 5 - 4 - 5 - 6 - 6 the smallest value is 4, the best achievable score</text>
</svg>
