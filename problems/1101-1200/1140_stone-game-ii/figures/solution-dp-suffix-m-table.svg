<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="276" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- piles = [2,7,9,4,4]; suf = [18,16,17,8,4]; dp[i][m] rows m=1..3, cols i=0..4, filled i=4 → 0; dp[0][1] = 10; cells 56x32 at (70,72) -->
  <path d="M 340 44 L 90 44" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="215" y="36" text-anchor="middle" fill="#1a2026" font-size="12.5">fill i = 4 → 0</text>
  <g font-size="12.5" fill="#5c6b76" text-anchor="middle">
    <text x="98" y="66">i = 0</text><text x="154" y="66">i = 1</text><text x="210" y="66">i = 2</text><text x="266" y="66">i = 3</text><text x="322" y="66">i = 4</text>
  </g>
  <g stroke="#42525e" stroke-width="1" fill="#ffffff">
    <rect x="70" y="72" width="56" height="30"/><rect x="126" y="72" width="56" height="30"/><rect x="182" y="72" width="56" height="30"/><rect x="238" y="72" width="56" height="30"/><rect x="294" y="72" width="56" height="30"/>
    <rect x="70" y="102" width="56" height="32"/><rect x="126" y="102" width="56" height="32"/><rect x="182" y="102" width="56" height="32"/><rect x="238" y="102" width="56" height="32"/><rect x="294" y="102" width="56" height="32"/>
    <rect x="70" y="134" width="56" height="32"/><rect x="126" y="134" width="56" height="32"/><rect x="182" y="134" width="56" height="32"/><rect x="238" y="134" width="56" height="32"/><rect x="294" y="134" width="56" height="32"/>
    <rect x="70" y="166" width="56" height="32"/><rect x="126" y="166" width="56" height="32"/><rect x="182" y="166" width="56" height="32"/><rect x="238" y="166" width="56" height="32"/><rect x="294" y="166" width="56" height="32"/>
  </g>
  <!-- cells feeding dp[0][1] = max(18 − dp[1][1], 18 − dp[2][2]) -->
  <rect x="126" y="102" width="56" height="32" fill="#dbe4fb" stroke="none"/>
  <rect x="182" y="134" width="56" height="32" fill="#dbe4fb" stroke="none"/>
  <rect x="70" y="102" width="56" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="62" y="91" text-anchor="end" fill="#5c6b76" font-size="12.5">suf[i]</text>
  <text x="62" y="123" text-anchor="end" fill="#1a2026" font-size="12.5">m = 1</text>
  <text x="62" y="155" text-anchor="end" fill="#1a2026" font-size="12.5">m = 2</text>
  <text x="62" y="187" text-anchor="end" fill="#1a2026" font-size="12.5">m = 3</text>
  <g font-size="13" fill="#5c6b76" text-anchor="middle">
    <text x="98" y="91">18</text><text x="154" y="91">16</text><text x="210" y="91">17</text><text x="266" y="91">8</text><text x="322" y="91">4</text>
  </g>
  <g font-size="14" fill="#1a2026" text-anchor="middle">
    <text x="98" y="123" font-weight="600" fill="#4169E1">10</text><text x="154" y="123">8</text><text x="210" y="123">13</text><text x="266" y="123">8</text><text x="322" y="123">4</text>
    <text x="98" y="155">14</text><text x="154" y="155">16</text><text x="210" y="155">17</text><text x="266" y="155">8</text><text x="322" y="155">4</text>
    <text x="98" y="187">18</text><text x="154" y="187">16</text><text x="210" y="187">17</text><text x="266" y="187">8</text><text x="322" y="187">4</text>
  </g>
  <g font-size="13">
    <text x="372" y="91" fill="#5c6b76">dp[5][*] = 0 (no piles)</text>
    <text x="372" y="127" fill="#1a2026">dp[1][1] = max(16−13, 16−8) = 8</text>
    <text x="372" y="152" fill="#1a2026">dp[0][1] = max(18−8, 18−17) = <tspan fill="#4169E1" font-weight="600">10</tspan></text>
  </g>
  <text x="40" y="236" fill="#1a2026" font-size="13">Taking x = 1 beats x = 2 at the start: 18 − dp[1][1] = 10 against 18 − dp[2][2] = 1.</text>
  <text x="40" y="256" fill="#1a2026" font-size="13">Alice takes 1 pile, Bob 2, Alice the last 2: she ends with 2 + 4 + 4 = <tspan fill="#4169E1" font-weight="600">10</tspan>.</text>
</svg>
