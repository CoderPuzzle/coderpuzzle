<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="372" fill="#ffffff"/>
  <!-- hours = [9,9,6,0,6,6,9] mapped to +1/-1; boundary b(j) = 60 + 64(j+1), j = -1..6; y = 170 - 30*prefix -->
  <text x="30" y="40" fill="#5c6b76" font-size="12.5">first-seen map: 0&#8594;-1 (sentinel), 1&#8594;0, 2&#8594;1, -1&#8594;4, -2&#8594;5</text>
  <!-- prefix step line over values -2..2 -->
  <line x1="60" y1="170" x2="508" y2="170" stroke="#9aa7b2" stroke-width="1" stroke-dasharray="4 4"/>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="46" y="114">2</text><text x="46" y="144">1</text><text x="46" y="174">0</text>
    <text x="46" y="204">-1</text><text x="46" y="234">-2</text>
  </g>
  <path d="M 60 170 H 124 V 140 H 188 V 110 H 252 V 140 H 316 V 170 H 380 V 200 H 444 V 230 H 508 V 200"
        fill="none" stroke="#42525e" stroke-width="2"/>
  <!-- accent dots = first occurrence of a prefix value; hollow = value seen before, not re-stored -->
  <text x="60" y="156" text-anchor="middle" fill="#9aa7b2" font-size="10">sentinel</text>
  <g fill="#4169E1">
    <circle cx="60" cy="170" r="4"/><circle cx="124" cy="140" r="4"/><circle cx="188" cy="110" r="4"/>
    <circle cx="380" cy="200" r="4"/><circle cx="444" cy="230" r="4"/>
  </g>
  <g fill="#ffffff" stroke="#9aa7b2" stroke-width="1.5">
    <circle cx="252" cy="140" r="3.5"/><circle cx="316" cy="170" r="3.5"/><circle cx="508" cy="200" r="3.5"/>
  </g>
  <!-- day cells with their +1/-1 contribution above -->
  <g text-anchor="middle" font-size="10.5">
    <text x="92" y="247" fill="#4169E1">+1</text><text x="156" y="247" fill="#4169E1">+1</text>
    <text x="220" y="247" fill="#9aa7b2">-1</text><text x="284" y="247" fill="#9aa7b2">-1</text>
    <text x="348" y="247" fill="#9aa7b2">-1</text><text x="412" y="247" fill="#9aa7b2">-1</text>
    <text x="476" y="247" fill="#4169E1">+1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="63" y="252" width="58" height="34"/><rect x="127" y="252" width="58" height="34"/>
    <rect x="191" y="252" width="58" height="34"/><rect x="255" y="252" width="58" height="34"/>
    <rect x="319" y="252" width="58" height="34"/><rect x="383" y="252" width="58" height="34"/>
    <rect x="447" y="252" width="58" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="92" y="274">9</text><text x="156" y="274">9</text><text x="220" y="274">6</text>
    <text x="284" y="274">0</text><text x="348" y="274">6</text><text x="412" y="274">6</text>
    <text x="476" y="274">9</text>
  </g>
  <!-- best interval: days 0..2 -->
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="60" y1="302" x2="252" y2="302"/>
    <line x1="60" y1="296" x2="60" y2="308"/>
    <line x1="252" y1="296" x2="252" y2="308"/>
  </g>
  <text x="156" y="322" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">9, 9, 6 &#8594; length 3</text>
  <text x="310" y="344" text-anchor="middle" fill="#1a2026" font-size="13">p &gt; 0 at day 2 sets best = <tspan fill="#4169E1" font-weight="600">3</tspan> for prefix [9,9,6]; at day 6, p = -1 reads first[-2] = 5</text>
  <text x="310" y="362" text-anchor="middle" fill="#1a2026" font-size="13">and adds only length 1 — the answer stays 3.</text>
</svg>
