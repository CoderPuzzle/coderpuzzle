<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- text = "ababa"; runs = [a 1, b 1, a 1, b 1, a 1]; counts a=3 b=2; string cells 52px at x=168+58i, y=70..112; runs boxes aligned below at y=180..220; merge bracket spans the a,b,a boxes -->
  <path d="M 252 66 Q 339 32 426 66" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="339" y="44" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">swap 'b' (i = 1) with 'a' (i = 4)</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="168" y="70" width="52" height="42"/><rect x="284" y="70" width="52" height="42"/>
    <rect x="342" y="70" width="52" height="42"/><rect x="400" y="70" width="52" height="42"/>
  </g>
  <rect x="226" y="70" width="52" height="42" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="194" y="96">a</text><text x="252" y="96" fill="#4169E1">b</text><text x="310" y="96">a</text>
    <text x="368" y="96" fill="#4169E1">b</text><text x="426" y="96">a</text>
  </g>
  <text x="310" y="130" text-anchor="middle" font-size="11.5" fill="#5c6b76">each 'b' is a one-character separator</text>
  <text x="252" y="156" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">merge a·1 + a·1 across 'b': 1 + 1 + 1 (spare 'a') = 3</text>
  <path d="M 168 174 V 162 H 336 V 174" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="168" y="180" width="52" height="40"/><rect x="284" y="180" width="52" height="40"/>
    <rect x="342" y="180" width="52" height="40"/><rect x="400" y="180" width="52" height="40"/>
  </g>
  <rect x="226" y="180" width="52" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="194" y="205" fill="#1a2026">a · 1</text><text x="252" y="205" fill="#4169E1">b · 1</text>
    <text x="310" y="205" fill="#1a2026">a · 1</text><text x="368" y="205" fill="#4169E1">b · 1</text>
    <text x="426" y="205" fill="#1a2026">a · 1</text>
  </g>
  <text x="152" y="205" text-anchor="end" font-size="12" fill="#5c6b76">runs</text>
  <text x="470" y="205" font-size="12.5" fill="#1a2026">counts: a = 3, b = 2</text>
  <text x="310" y="262" text-anchor="middle" font-size="13" fill="#1a2026">Swapping a separator 'b' for the spare 'a' turns ababa into aaabb:</text>
  <text x="310" y="280" text-anchor="middle" font-size="13" fill="#1a2026">the two a-runs merge into 'aaa' — the longest repeated substring, length <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
