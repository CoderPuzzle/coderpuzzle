<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree = [3,5,1,6,2,0,8,null,null,7,4]; heights h; accent arrows trace the descent 3 -> 5 -> 2; nodes r 20 -->
  <!-- plain tree edges first, accent descent arrows on top, circles cover the joins -->
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="320" y1="70" x2="450" y2="150"/>
    <line x1="190" y1="150" x2="110" y2="230"/>
    <line x1="270" y1="230" x2="210" y2="310"/>
    <line x1="270" y1="230" x2="330" y2="310"/>
    <line x1="450" y1="150" x2="390" y2="230"/>
    <line x1="450" y1="150" x2="530" y2="230"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <path d="M 300.4 82 L 209.6 138" marker-end="url(#arrow)"/>
    <path d="M 206.3 166.3 L 253.7 213.7" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="320" cy="70" r="20"/><circle cx="190" cy="150" r="20"/>
    <circle cx="450" cy="150" r="20"/><circle cx="110" cy="230" r="20"/>
    <circle cx="390" cy="230" r="20"/><circle cx="530" cy="230" r="20"/>
    <circle cx="210" cy="310" r="20"/><circle cx="330" cy="310" r="20"/>
  </g>
  <circle cx="270" cy="230" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="320" y="75">3</text><text x="190" y="155">5</text><text x="450" y="155">1</text>
    <text x="110" y="235">6</text><text x="390" y="235">0</text><text x="530" y="235">8</text>
    <text x="210" y="315">7</text><text x="330" y="315">4</text>
  </g>
  <text x="270" y="235" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">2</text>
  <!-- height of each node: depth of its deepest leaf -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="320" y="106">h 3</text><text x="190" y="186">h 2</text><text x="450" y="186">h 1</text>
    <text x="110" y="266">h 0</text><text x="270" y="266">h 1</text><text x="390" y="266">h 0</text>
    <text x="530" y="266">h 0</text><text x="210" y="346">h 0</text><text x="330" y="346">h 0</text>
  </g>
  <text x="247" y="98" text-anchor="middle" fill="#5c6b76" font-size="11">taller</text>
  <text x="246" y="176" text-anchor="middle" fill="#5c6b76" font-size="11">taller</text>
  <text x="298" y="227" fill="#4169E1" font-size="12" font-weight="600">tie: stop</text>
  <text x="320" y="368" text-anchor="middle" fill="#1a2026" font-size="13">Heights settle in the reversed BFS pass; the descent 3 → 5 → 2 always steps</text>
  <text x="320" y="386" text-anchor="middle" fill="#1a2026" font-size="13">into the taller child and stops at <tspan fill="#4169E1" font-weight="600">2</tspan>, where h 0 = h 0 — LCA of leaves 7 and 4.</text>
</svg>
