<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 212" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 3x3 grid: land at the four corners -->
  <g stroke-width="1">
    <rect x="36" y="26" width="52" height="52" fill="#d9dee4" stroke="#c8cfd6"/>
    <rect x="88" y="26" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="140" y="26" width="52" height="52" fill="#d9dee4" stroke="#c8cfd6"/>
    <rect x="36" y="78" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="88" y="78" width="52" height="52" fill="#e8edfb" stroke="#4169E1" stroke-width="2.5"/>
    <rect x="140" y="78" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="36" y="130" width="52" height="52" fill="#d9dee4" stroke="#c8cfd6"/>
    <rect x="88" y="130" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="140" y="130" width="52" height="52" fill="#d9dee4" stroke="#c8cfd6"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="62" y="57">1</text>
    <text x="114" y="57">0</text>
    <text x="166" y="57">1</text>
    <text x="62" y="109">0</text>
    <text x="114" y="109" font-weight="700" fill="#4169E1">0</text>
    <text x="166" y="109">0</text>
    <text x="62" y="161">1</text>
    <text x="114" y="161">0</text>
    <text x="166" y="161">1</text>
  </g>
  <line x1="170" y1="104" x2="230" y2="104" stroke="#5c6b76" stroke-dasharray="3 3"/>
  <text x="240" y="98" font-weight="600" fill="#1a2026">cell (1, 1)</text>
  <text x="240" y="116" fill="#5c6b76" font-size="12.5">2 away from the nearest land</text>
  <g font-size="12.5" fill="#1a2026">
    <rect x="240" y="132" width="14" height="14" fill="#d9dee4" stroke="#c8cfd6"/>
    <text x="262" y="144">land (1)</text>
    <rect x="240" y="154" width="14" height="14" fill="#ffffff" stroke="#c8cfd6"/>
    <text x="262" y="166">water (0)</text>
    <rect x="240" y="176" width="14" height="14" fill="#e8edfb" stroke="#4169E1"/>
    <text x="262" y="188">farthest water cell</text>
  </g>
</svg>
