<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 212" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 3x3 grid: a single land cell in the top-left corner -->
  <g stroke-width="1">
    <rect x="36" y="26" width="52" height="52" fill="#d9dee4" stroke="#c8cfd6"/>
    <rect x="88" y="26" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="140" y="26" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="36" y="78" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="88" y="78" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="140" y="78" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="36" y="130" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="88" y="130" width="52" height="52" fill="#ffffff" stroke="#c8cfd6"/>
    <rect x="140" y="130" width="52" height="52" fill="#e8edfb" stroke="#4169E1" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="62" y="57">1</text>
    <text x="114" y="57">0</text>
    <text x="166" y="57">0</text>
    <text x="62" y="109">0</text>
    <text x="114" y="109">0</text>
    <text x="166" y="109">0</text>
    <text x="62" y="161">0</text>
    <text x="114" y="161">0</text>
    <text x="166" y="161" font-weight="700" fill="#4169E1">0</text>
  </g>
  <line x1="196" y1="156" x2="230" y2="156" stroke="#5c6b76" stroke-dasharray="3 3"/>
  <text x="240" y="150" font-weight="600" fill="#1a2026">cell (2, 2)</text>
  <text x="240" y="168" fill="#5c6b76" font-size="12.5">4 away from the only land</text>
  <g font-size="12.5" fill="#1a2026">
    <rect x="240" y="60" width="14" height="14" fill="#d9dee4" stroke="#c8cfd6"/>
    <text x="262" y="72">land (1)</text>
    <rect x="240" y="82" width="14" height="14" fill="#ffffff" stroke="#c8cfd6"/>
    <text x="262" y="94">water (0)</text>
    <rect x="240" y="104" width="14" height="14" fill="#e8edfb" stroke="#4169E1"/>
    <text x="262" y="116">farthest water cell</text>
  </g>
</svg>
