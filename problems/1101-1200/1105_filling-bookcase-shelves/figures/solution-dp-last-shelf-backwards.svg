<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- books = [[1,1],[2,3],[2,3],[1,1],[1,1],[1,1],[1,2]], shelfWidth = 4.
       dp = [0,1,3,4,5,5,5,6]; cells 64 wide at x = 64 + 64i, y 52 h 36.
       i = 7 candidates: last shelf {6} {5,6} {4,5,6} {3,4,5,6}, 17 px per thickness/height unit, baseline y 226. -->
  <text x="56" y="77" text-anchor="end" fill="#5c6b76" font-size="12.5">dp</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="64" y="52" width="64" height="36"/><rect x="128" y="52" width="64" height="36"/>
    <rect x="192" y="52" width="64" height="36"/><rect x="256" y="52" width="64" height="36"/>
    <rect x="320" y="52" width="64" height="36"/><rect x="384" y="52" width="64" height="36"/>
    <rect x="448" y="52" width="64" height="36"/>
    <rect x="512" y="52" width="64" height="36" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="96" y="76" fill="#5c6b76">0</text>
    <text x="160" y="76" fill="#1a2026">1</text><text x="224" y="76" fill="#1a2026">3</text>
    <text x="288" y="76" fill="#1a2026">4</text><text x="352" y="76" fill="#1a2026">5</text>
    <text x="416" y="76" fill="#1a2026">5</text><text x="480" y="76" fill="#1a2026">5</text>
    <text x="544" y="76" fill="#4169E1">6</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="96" y="106">i = 0</text><text x="160" y="106">i = 1</text><text x="224" y="106">i = 2</text>
    <text x="288" y="106">i = 3</text><text x="352" y="106">i = 4</text><text x="416" y="106">i = 5</text>
    <text x="480" y="106">i = 6</text><text x="544" y="106">i = 7</text>
  </g>
  <text x="64" y="136" font-size="13" font-weight="600" fill="#1a2026">i = 7 — the last shelf grows backwards from book 6</text>
  <!-- candidate labels -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="101" y="162">books 6</text>
    <text x="249" y="162">books 5–6</text>
    <text x="397" y="162">books 4–6</text>
    <text x="545" y="162">books 3–6</text>
  </g>
  <!-- candidate A: book 6 (w 1, h 2) -->
  <rect x="101" y="192" width="17" height="34" stroke="#42525e" stroke-width="1.5" fill="#ffffff"/>
  <text x="109.5" y="212" text-anchor="middle" font-size="10.5" fill="#1a2026">6</text>
  <line x1="95" y1="226" x2="124" y2="226" stroke="#42525e" stroke-width="2"/>
  <!-- candidate B: books 5,6 (w 2, h 2) -->
  <rect x="224" y="209" width="17" height="17" stroke="#42525e" stroke-width="1.5" fill="#ffffff"/>
  <rect x="241" y="192" width="17" height="34" stroke="#42525e" stroke-width="1.5" fill="#ffffff"/>
  <text x="232.5" y="221" text-anchor="middle" font-size="10.5" fill="#1a2026">5</text>
  <text x="249.5" y="212" text-anchor="middle" font-size="10.5" fill="#1a2026">6</text>
  <line x1="218" y1="226" x2="264" y2="226" stroke="#42525e" stroke-width="2"/>
  <!-- candidate C: books 4,5,6 (w 3, h 2) -->
  <rect x="364" y="209" width="17" height="17" stroke="#42525e" stroke-width="1.5" fill="#ffffff"/>
  <rect x="381" y="209" width="17" height="17" stroke="#42525e" stroke-width="1.5" fill="#ffffff"/>
  <rect x="398" y="192" width="17" height="34" stroke="#42525e" stroke-width="1.5" fill="#ffffff"/>
  <g text-anchor="middle" font-size="10.5" fill="#1a2026">
    <text x="372.5" y="221">4</text><text x="389.5" y="221">5</text><text x="406.5" y="212">6</text>
  </g>
  <line x1="358" y1="226" x2="421" y2="226" stroke="#42525e" stroke-width="2"/>
  <!-- candidate D: books 3,4,5,6 (w 4, h 2) — the winner -->
  <rect x="504" y="209" width="17" height="17" stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb"/>
  <rect x="521" y="209" width="17" height="17" stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb"/>
  <rect x="538" y="209" width="17" height="17" stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb"/>
  <rect x="555" y="192" width="17" height="34" stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="10.5" fill="#1a2026">
    <text x="512.5" y="221">3</text><text x="529.5" y="221">4</text>
    <text x="546.5" y="221">5</text><text x="563.5" y="212">6</text>
  </g>
  <line x1="498" y1="226" x2="578" y2="226" stroke="#4169E1" stroke-width="2"/>
  <!-- widths, heights, contributions -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="109.5" y="248">w = 1, h = 2</text>
    <text x="249.5" y="248">w = 2, h = 2</text>
    <text x="397" y="248">w = 3, h = 2</text>
    <text x="545" y="248">w = 4, h = 2</text>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="109.5" y="270">dp[6] + 2 = 7</text>
    <text x="249.5" y="270">dp[5] + 2 = 7</text>
    <text x="397" y="270">dp[4] + 2 = 7</text>
    <text x="545" y="270" fill="#4169E1">dp[3] + 2 = 6</text>
  </g>
  <text x="320" y="296" text-anchor="middle" font-size="12" fill="#9aa7b2">adding book 2 too would make the width 6 &gt; 4 — the backwards walk stops there</text>
  <text x="320" y="326" text-anchor="middle" font-size="13" fill="#1a2026">Every dp[i] keeps its cheapest last shelf; for all 7 books that shelf is books 3–6</text>
  <text x="320" y="344" text-anchor="middle" font-size="13" fill="#1a2026">(width 4, height 2), so dp[7] = dp[3] + 2 = <tspan fill="#4169E1" font-weight="600">6</tspan> — the bookcase's minimum height.</text>
</svg>
