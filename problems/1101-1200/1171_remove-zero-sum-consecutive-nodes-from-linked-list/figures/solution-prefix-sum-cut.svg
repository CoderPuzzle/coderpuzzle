<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- values = [1, 2, -3, 3, 1]; boxes 56x44 at y = 66, x = 72 + 88k (dummy dashed first); running prefix sums sit above each right edge (0, 1, 3, 0, 3, 4) and the repeated 0s are accented; the cut stretch [1, 2, -3] is gray -->
  <path d="M 128 48 Q 260 16 392 48" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="260" y="22" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">prefix 0 repeats</text>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="128" y="58" fill="#4169E1" font-weight="700">0</text>
    <text x="216" y="58">1</text>
    <text x="304" y="58">3</text>
    <text x="392" y="58" fill="#4169E1" font-weight="700">0</text>
    <text x="480" y="58">3</text>
    <text x="568" y="58">4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="72" y="66" width="56" height="44" fill="#ffffff" stroke-dasharray="4 3"/>
    <rect x="160" y="66" width="56" height="44" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="248" y="66" width="56" height="44" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="336" y="66" width="56" height="44" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="424" y="66" width="56" height="44" fill="#ffffff"/>
    <rect x="512" y="66" width="56" height="44" fill="#ffffff"/>
  </g>
  <g text-anchor="middle">
    <text x="100" y="92" font-size="10.5" fill="#5c6b76">dummy</text>
    <text x="188" y="95" font-size="15" font-weight="600" fill="#9aa7b2">1</text>
    <text x="276" y="95" font-size="15" font-weight="600" fill="#9aa7b2">2</text>
    <text x="364" y="95" font-size="15" font-weight="600" fill="#9aa7b2">-3</text>
    <text x="452" y="95" font-size="15" font-weight="600" fill="#1a2026">3</text>
    <text x="540" y="95" font-size="15" font-weight="600" fill="#1a2026">1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 130 88 H 156" marker-end="url(#arrow)"/>
    <path d="M 218 88 H 244" marker-end="url(#arrow)"/>
    <path d="M 306 88 H 332" marker-end="url(#arrow)"/>
    <path d="M 394 88 H 420" marker-end="url(#arrow)"/>
    <path d="M 482 88 H 508" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="138" y1="79" x2="150" y2="97"/>
    <line x1="402" y1="79" x2="414" y2="97"/>
  </g>
  <text x="276" y="138" text-anchor="middle" font-size="12.5" fill="#5c6b76">[1, 2, -3] sums to 0 — cut</text>
  <path d="M 320 150 V 190" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="334" y="172" font-size="12" fill="#5c6b76">restart the scan</text>
  <text x="232" y="218" text-anchor="end" font-size="12" fill="#5c6b76">result</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="248" y="196" width="56" height="44"/>
    <rect x="336" y="196" width="56" height="44"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="276" y="225">3</text><text x="364" y="225">1</text>
  </g>
  <path d="M 306 218 H 330" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="320" y="268" text-anchor="middle" font-size="13" fill="#1a2026">The seeded prefix 0 repeats after -3, so [1, 2, -3] drops out;</text>
  <text x="320" y="286" text-anchor="middle" font-size="13" fill="#1a2026">the rescan of [3, 1] finds no repeat, leaving <tspan fill="#4169E1" font-weight="600">3 → 1</tspan>.</text>
</svg>
