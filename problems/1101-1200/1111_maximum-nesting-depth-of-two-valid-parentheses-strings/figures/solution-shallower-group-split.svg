<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="300" fill="#ffffff"/>
  <!-- seq = "(()())"; cells 60x44 at x = 80 + 76i, y = 120, centers 110..490; arcs join matched pairs (0,5) (1,2) (3,4) -->
  <!-- matcher arcs: group 0 pair above, group 1 pairs below it -->
  <path d="M 110 114 Q 300 18 490 114" fill="none" stroke="#4169E1" stroke-width="2"/>
  <path d="M 186 114 Q 224 72 262 114" fill="none" stroke="#5c6b76" stroke-width="1.8"/>
  <path d="M 338 114 Q 376 72 414 114" fill="none" stroke="#5c6b76" stroke-width="1.8"/>
  <text x="300" y="56" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">group 0</text>
  <text x="300" y="99" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">group 1</text>
  <!-- cells: group-0 positions 0 and 5 get the light accent fill -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="80" y="120" width="60" height="44" fill="#dbe4fb"/>
    <rect x="156" y="120" width="60" height="44" fill="#ffffff"/>
    <rect x="232" y="120" width="60" height="44" fill="#ffffff"/>
    <rect x="308" y="120" width="60" height="44" fill="#ffffff"/>
    <rect x="384" y="120" width="60" height="44" fill="#ffffff"/>
    <rect x="460" y="120" width="60" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="17" fill="#1a2026">
    <text x="110" y="148">(</text><text x="186" y="148">(</text><text x="262" y="148">)</text>
    <text x="338" y="148">(</text><text x="414" y="148">)</text><text x="490" y="148">)</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="110" y="182">0</text><text x="186" y="182">1</text><text x="262" y="182">2</text>
    <text x="338" y="182">3</text><text x="414" y="182">4</text><text x="490" y="182">5</text>
  </g>
  <!-- running count of open parentheses after each character -->
  <text x="36" y="208" fill="#5c6b76" font-size="12">depth</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="13">
    <text x="110" y="208">1</text><text x="186" y="208">2</text><text x="262" y="208">1</text>
    <text x="338" y="208">2</text><text x="414" y="208">1</text><text x="490" y="208">0</text>
  </g>
  <!-- answer[i] = group id -->
  <text x="36" y="234" fill="#5c6b76" font-size="12">answer</text>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="110" y="234" fill="#4169E1">0</text><text x="186" y="234" fill="#1a2026">1</text>
    <text x="262" y="234" fill="#1a2026">1</text><text x="338" y="234" fill="#1a2026">1</text>
    <text x="414" y="234" fill="#1a2026">1</text><text x="490" y="234" fill="#4169E1">0</text>
  </g>
  <text x="300" y="266" text-anchor="middle" fill="#1a2026" font-size="13">Each '(' opens in the currently shallower group and its ')' reuses it —</text>
  <text x="300" y="284" text-anchor="middle" fill="#1a2026" font-size="13">for seq = "(()())" both groups finish at depth <tspan fill="#4169E1" font-weight="600">1</tspan> = ceil(2 / 2).</text>
</svg>
