<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- arr = [1,-2,0,3]; after each i: one_del = max(one_del + a, prev no_del), no_del = max(no_del + a, a) -->
  <!-- element boxes 100x44 at x=96+116i, y=44; state columns centered at 146+116i -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="96" y="44" width="100" height="44"/><rect x="212" y="44" width="100" height="44"/>
    <rect x="328" y="44" width="100" height="44"/><rect x="444" y="44" width="100" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="146" y="71" fill="#1a2026">1</text>
    <text x="262" y="71" fill="#4169E1">&#8722;2</text>
    <text x="378" y="71" fill="#1a2026">0</text>
    <text x="494" y="71" fill="#1a2026">3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="146" y="106">i = 0</text><text x="262" y="106">i = 1</text>
    <text x="378" y="106">i = 2</text><text x="494" y="106">i = 3</text>
  </g>
  <!-- no_del row -->
  <text x="86" y="150" text-anchor="end" fill="#5c6b76" font-size="12.5">no_del</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="146" y="150">1</text><text x="262" y="150">&#8722;1</text>
    <text x="378" y="150">0</text><text x="494" y="150">3</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.4" fill="none">
    <path d="M 166 144 H 240" marker-end="url(#arrowG)"/>
    <path d="M 282 144 H 356" marker-end="url(#arrowG)"/>
    <path d="M 398 144 H 472" marker-end="url(#arrowG)"/>
  </g>
  <!-- one_del row -->
  <text x="86" y="200" text-anchor="end" fill="#5c6b76" font-size="12.5">one_del</text>
  <g text-anchor="middle" font-size="15">
    <text x="146" y="200" fill="#9aa7b2">&#8722;&#8734;</text>
    <text x="262" y="200" fill="#4169E1" font-weight="600">1</text>
    <text x="378" y="200" fill="#4169E1" font-weight="600">1</text>
    <text x="494" y="200" fill="#4169E1" font-weight="600">4</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.4" fill="none">
    <path d="M 276 195 H 362" marker-end="url(#arrowG)"/>
    <path d="M 394 195 H 478" marker-end="url(#arrowG)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="320" y="187">+ 0</text>
    <text x="436" y="187">+ 3</text>
  </g>
  <!-- the branch at -2: one_del takes the previous no_del (delete -2 now) -->
  <path d="M 146 158 Q 200 212 252 194" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="204" y="232" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">at &#8722;2: one_del &#8592; no_del = 1</text>
  <!-- best row -->
  <text x="86" y="256" text-anchor="end" fill="#5c6b76" font-size="12.5">best</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="146" y="256">1</text><text x="262" y="256">1</text>
    <text x="378" y="256">1</text><text x="494" y="256" fill="#4169E1">4</text>
  </g>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">At &#8722;2, one_del branches from the previous no_del = 1 &#8212; the deletion happens there &#8212;</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">then rides 1 + 0 = 1 and 1 + 3 = 4 while no_del restarts at 0; the answer is best = <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
