<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="460" fill="#ffffff"/>
  <!-- arr = [1,1,2,2,1,1], query(0,5,4); segment tree splits at mid=(lo+hi)/2: root [0..5] -> [0..2]|[3..5]; nodes carry (candidate, surplus); root folds to (1,2); positions[1] = [0,1,4,5], count 4 &gt;= threshold 4 -->
