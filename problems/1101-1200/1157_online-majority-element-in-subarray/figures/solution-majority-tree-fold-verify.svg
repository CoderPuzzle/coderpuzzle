  <path d="M 240 376 V 382 H 402 V 376" fill="none" stroke="#4169E1" stroke-width="1.2"/>
  <text x="321" y="400" text-anchor="middle" font-size="12" fill="#1a2026">bisect_left(6) − bisect_left(0) = 4 − 0 = 4 ≥ threshold 4</text>
  <text x="330" y="432" text-anchor="middle" font-size="13" fill="#1a2026">The fold proposes candidate 1; the position list confirms 4 occurrences in</text>
  <text x="330" y="450" text-anchor="middle" font-size="13" fill="#1a2026">arr[0..5], meeting the threshold — the query returns <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
