    <rect x="152" y="104" width="72" height="46"/><rect x="428" y="104" width="72" height="46"/>
    <rect x="106" y="184" width="72" height="46"/><rect x="244" y="184" width="72" height="46"/>
    <rect x="520" y="184" width="72" height="46"/>
  </g>
  <rect x="382" y="184" width="72" height="46" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
