    <text x="188" y="122" fill="#1a2026">(1, 1)</text><text x="464" y="122" fill="#1a2026">(1, 1)</text>
    <text x="142" y="202" fill="#1a2026">(1, 2)</text><text x="280" y="202" fill="#1a2026">(2, 1)</text>
    <text x="556" y="202" fill="#1a2026">(1, 1)</text><text x="418" y="202" fill="#9aa7b2">(0, 0)</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="326" y="60">[0..5]</text>
    <text x="188" y="140">[0..2]</text><text x="464" y="140">[3..5]</text>
    <text x="142" y="220">[0..1]</text><text x="280" y="220">[2..2]</text>
    <text x="556" y="220">[5..5]</text><text x="418" y="220">[3..4]</text>
  </g>
  <text x="372" y="50" font-size="11.5" fill="#5c6b76">equal candidates pool: 1 + 1 = 2</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="68" y="264" width="56" height="42"/><rect x="160" y="264" width="56" height="42"/>
    <rect x="344" y="264" width="56" height="42"/><rect x="436" y="264" width="56" height="42"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="96" y="282">(1, 1)</text><text x="188" y="282">(1, 1)</text>
    <text x="372" y="282">(2, 1)</text><text x="464" y="282">(1, 1)</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="96" y="299">i = 0</text><text x="188" y="299">i = 1</text>
    <text x="372" y="299">i = 3</text><text x="464" y="299">i = 4</text>
  </g>
  <text x="326" y="252" text-anchor="middle" font-size="11" fill="#9aa7b2">leaves: (value, 1)</text>
  <!-- verification: positions of candidate 1 -->
  <text x="56" y="356" font-size="13" font-weight="600" fill="#1a2026">verify '1': positions[1] =</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="240" y="338" width="36" height="32"/><rect x="282" y="338" width="36" height="32"/>
    <rect x="324" y="338" width="36" height="32"/><rect x="366" y="338" width="36" height="32"/>
