  <g stroke="#42525e" stroke-width="1.2">
    <path d="M 326 70 L 188 104"/><path d="M 326 70 L 464 104"/>
    <path d="M 188 150 L 142 184"/><path d="M 188 150 L 280 184"/>
    <path d="M 464 150 L 418 184"/><path d="M 464 150 L 556 184"/>
    <path d="M 142 230 L 96 264"/><path d="M 142 230 L 188 264"/>
    <path d="M 418 230 L 372 264"/><path d="M 418 230 L 464 264"/>
  </g>
  <rect x="290" y="24" width="72" height="46" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
