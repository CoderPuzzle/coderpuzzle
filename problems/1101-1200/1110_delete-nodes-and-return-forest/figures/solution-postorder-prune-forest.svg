<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 486" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="486" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root [1,2,3,4,5,6,7], to_delete = [3,5]; post-order visits 4,5,2,6,7,3,1 (muted badges).
       Original tree: 1 (280,58), 2 (180,128), 3 (380,128), 4 (130,198), 5 (230,198), 6 (330,198), 7 (430,198), r 17.
       Dashed edges touch a deleted node; bottom forest: kept root 1 (140,304), new roots 6 (300,304) and 7 (390,304). -->
  <g stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="280" y1="58" x2="380" y2="128"/>
    <line x1="380" y1="128" x2="330" y2="198"/>
    <line x1="380" y1="128" x2="430" y2="198"/>
    <line x1="180" y1="128" x2="230" y2="198"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="280" y1="58" x2="180" y2="128"/>
    <line x1="180" y1="128" x2="130" y2="198"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="280" cy="58" r="17"/><circle cx="180" cy="128" r="17"/>
    <circle cx="130" cy="198" r="17"/><circle cx="330" cy="198" r="17"/><circle cx="430" cy="198" r="17"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="#f0f3f7">
    <circle cx="380" cy="128" r="17"/><circle cx="230" cy="198" r="17"/>
  </g>
  <line x1="368" y1="140" x2="392" y2="116" stroke="#9aa7b2" stroke-width="1.5"/>
  <line x1="218" y1="210" x2="242" y2="186" stroke="#9aa7b2" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="280" y="62.5">1</text><text x="180" y="132.5">2</text>
    <text x="130" y="202.5">4</text><text x="330" y="202.5">6</text><text x="430" y="202.5">7</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#9aa7b2">
    <text x="380" y="132.5">3</text><text x="230" y="202.5">5</text>
  </g>
  <g font-size="10.5" fill="#9aa7b2">
    <text x="152" y="180">1st</text>
    <text x="252" y="180">2nd</text>
    <text x="134" y="110">3rd</text>
    <text x="352" y="180">4th</text>
    <text x="452" y="180">5th</text>
    <text x="402" y="110">6th</text>
    <text x="302" y="40">7th</text>
  </g>
  <line x1="280" y1="226" x2="280" y2="246" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="292" y="241" font-size="12" font-weight="600" fill="#4169E1">post-order prune</text>
  <!-- resulting forest -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="140" y1="304" x2="98" y2="358"/>
    <line x1="98" y1="358" x2="62" y2="412"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="140" cy="304" r="15"/><circle cx="98" cy="358" r="15"/><circle cx="62" cy="412" r="15"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <circle cx="300" cy="304" r="15"/><circle cx="390" cy="304" r="15"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="140" y="308.5">1</text><text x="98" y="362.5">2</text><text x="62" y="416.5">4</text>
    <text x="300" y="308.5">6</text><text x="390" y="308.5">7</text>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="600" fill="#4169E1">
    <text x="140" y="278">kept root</text>
    <text x="300" y="278">new root</text>
    <text x="390" y="278">new root</text>
  </g>
  <text x="280" y="452" text-anchor="middle" font-size="13" fill="#1a2026">Deleted 3 and 5 return null and cut 6 and 7 loose as new roots; 1 survives, so the</text>
  <text x="280" y="470" text-anchor="middle" font-size="13" fill="#1a2026">forest is <tspan fill="#4169E1" font-weight="600">[[1,2,null,4], [6], [7]]</tspan>.</text>
</svg>
