<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<line x1="110" y1="60" x2="210" y2="120" stroke="#4169E1" stroke-width="2.4"/>
  <line x1="210" y1="120" x2="110" y2="180" stroke="#4169E1" stroke-width="2.4"/>
  <line x1="110" y1="180" x2="110" y2="60" stroke="#4169E1" stroke-width="2.4"/>
  <line x1="210" y1="120" x2="300" y2="120" stroke="#b57f30" stroke-width="3"/>
  <circle cx="110" cy="60" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="110" y="65" text-anchor="middle" font-weight="600">0</text>
  <circle cx="210" cy="120" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="210" y="125" text-anchor="middle" font-weight="600">1</text>
  <circle cx="110" cy="180" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="110" y="185" text-anchor="middle" font-weight="600">2</text>
  <circle cx="300" cy="120" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="300" y="125" text-anchor="middle" font-weight="600">3</text>
  <text x="360" y="116" fill="#b57f30" font-size="12">bridge [1, 3]</text>
  <text x="360" y="134" fill="#4169E1" font-size="12">cycle 0&#8211;1&#8211;2</text>
  <text x="40" y="246" fill="#5c6b76" font-size="12">DFS from 0 gives disc/low values; after returning from child 3, low[3] &gt; disc[1]</text>
  <text x="40" y="264" fill="#5c6b76" font-size="12">holds (no back edge from 3&#8217;s subtree reaches 1 or above), so edge (1, 3) is a bridge.</text>
</svg>
