<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 242" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- cycle 0-1-2 -->
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="120" y1="60" x2="250" y2="60"/>
    <line x1="250" y1="60" x2="185" y2="170"/>
    <line x1="185" y1="170" x2="120" y2="60"/>
  </g>
  <!-- the critical connection -->
  <line x1="250" y1="60" x2="390" y2="170" stroke="#4169E1" stroke-width="3"/>
  <text x="330" y="98" fill="#4169E1" font-weight="600">critical</text>
  <!-- servers -->
  <g stroke="#1a2026" stroke-width="2">
    <circle cx="120" cy="60" r="19" fill="#ffffff"/>
    <circle cx="250" cy="60" r="19" fill="#ffffff"/>
    <circle cx="185" cy="170" r="19" fill="#ffffff"/>
    <circle cx="390" cy="170" r="19" fill="#e8edfb" stroke="#4169E1" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="120" y="65">0</text>
    <text x="250" y="65">1</text>
    <text x="185" y="175">2</text>
    <text x="390" y="175">3</text>
  </g>
  <text x="230" y="228" text-anchor="middle" fill="#5c6b76" font-size="12.5">removing (1, 3) cuts server 3 off from the rest</text>
</svg>
