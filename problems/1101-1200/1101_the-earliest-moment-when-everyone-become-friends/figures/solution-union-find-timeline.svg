<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="354" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- logs sorted by moment: (20190101,0,1) (20190104,3,4) (20190107,2,3) (20190211,1,5) (20190224,2,4) (20190301,0,3), n=6; rows at cy = 72 + 42i; group boxes h 28 from x 190 -->
  <g fill="#f0f3f7">
    <rect x="8" y="97" width="624" height="34"/>
    <rect x="8" y="181" width="624" height="34"/>
  </g>
  <rect x="8" y="265" width="624" height="34" fill="#dbe4fb"/>
  <g fill="#5c6b76" font-size="12">
    <text x="20" y="40">moment</text>
    <text x="98" y="40">union</text>
    <text x="190" y="40">components after each merge</text>
    <text x="534" y="40" text-anchor="middle">count</text>
  </g>
  <!-- time rail -->
  <line x1="10" y1="72" x2="10" y2="282" stroke="#dbe4fb" stroke-width="3"/>
  <g fill="#9aa7b2">
    <circle cx="10" cy="72" r="4"/><circle cx="10" cy="114" r="4"/><circle cx="10" cy="156" r="4"/>
    <circle cx="10" cy="198" r="4"/><circle cx="10" cy="240" r="4"/>
  </g>
  <circle cx="10" cy="282" r="4" fill="#4169E1"/>
  <!-- row 1: 20190101 union(0,1) -->
  <g font-size="13" fill="#1a2026">
    <text x="20" y="77">20190101</text>
  </g>
  <text x="98" y="77" font-size="12" fill="#5c6b76">union(0,1)</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="190" y="58" width="42" height="28" rx="5" stroke="#4169E1"/>
    <rect x="240" y="58" width="26" height="28" rx="5"/>
    <rect x="274" y="58" width="26" height="28" rx="5"/>
    <rect x="308" y="58" width="26" height="28" rx="5"/>
    <rect x="342" y="58" width="26" height="28" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="211" y="77">0 1</text><text x="253" y="77">2</text><text x="287" y="77">3</text>
    <text x="321" y="77">4</text><text x="355" y="77">5</text>
  </g>
  <text x="534" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">5</text>
  <!-- row 2: 20190104 union(3,4) -->
  <text x="20" y="119" font-size="13" fill="#1a2026">20190104</text>
  <text x="98" y="119" font-size="12" fill="#5c6b76">union(3,4)</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="190" y="100" width="42" height="28" rx="5"/>
    <rect x="240" y="100" width="26" height="28" rx="5"/>
    <rect x="274" y="100" width="42" height="28" rx="5" stroke="#4169E1"/>
    <rect x="324" y="100" width="26" height="28" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="211" y="119">0 1</text><text x="253" y="119">2</text><text x="295" y="119">3 4</text>
    <text x="337" y="119">5</text>
  </g>
  <text x="534" y="119" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">4</text>
  <!-- row 3: 20190107 union(2,3) -->
  <text x="20" y="161" font-size="13" fill="#1a2026">20190107</text>
  <text x="98" y="161" font-size="12" fill="#5c6b76">union(2,3)</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="190" y="142" width="42" height="28" rx="5"/>
    <rect x="240" y="142" width="58" height="28" rx="5" stroke="#4169E1"/>
    <rect x="306" y="142" width="26" height="28" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="211" y="161">0 1</text><text x="269" y="161">2 3 4</text><text x="319" y="161">5</text>
  </g>
  <text x="534" y="161" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">3</text>
  <!-- row 4: 20190211 union(1,5) -->
  <text x="20" y="203" font-size="13" fill="#1a2026">20190211</text>
  <text x="98" y="203" font-size="12" fill="#5c6b76">union(1,5)</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="190" y="184" width="58" height="28" rx="5" stroke="#4169E1"/>
    <rect x="256" y="184" width="58" height="28" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="219" y="203">0 1 5</text><text x="285" y="203">2 3 4</text>
  </g>
  <text x="534" y="203" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">2</text>
  <!-- row 5: 20190224 union(2,4) — redundant, muted -->
  <text x="20" y="245" font-size="13" fill="#1a2026">20190224</text>
  <text x="98" y="245" font-size="12" fill="#9aa7b2">union(2,4)</text>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="#ffffff">
    <rect x="190" y="226" width="58" height="28" rx="5"/>
    <rect x="256" y="226" width="58" height="28" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#9aa7b2">
    <text x="219" y="245">0 1 5</text><text x="285" y="245">2 3 4</text>
  </g>
  <text x="330" y="245" font-size="11.5" fill="#9aa7b2">already connected — no merge</text>
  <text x="534" y="245" text-anchor="middle" font-size="15" font-weight="600" fill="#9aa7b2">2</text>
  <!-- row 6: 20190301 union(0,3) — everyone in one component -->
  <text x="20" y="287" font-size="13" font-weight="600" fill="#1a2026">20190301</text>
  <text x="98" y="287" font-size="12" fill="#5c6b76">union(0,3)</text>
  <rect x="190" y="268" width="106" height="28" rx="5" stroke="#4169E1" stroke-width="1.5" fill="#ffffff"/>
  <text x="243" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">0 1 5 2 3 4</text>
  <text x="534" y="287" text-anchor="middle" font-size="15" font-weight="600" fill="#4169E1">1</text>
  <text x="330" y="287" font-size="12" fill="#4169E1" font-weight="600">answer</text>
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#1a2026">Merging only fuses groups, so the count falls 6 → 5 → 4 → 3 → 2 → 1; the</text>
  <text x="320" y="340" text-anchor="middle" font-size="13" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">20190301</tspan> union of 0 and 3 closes the last divide — return <tspan fill="#4169E1" font-weight="600">20190301</tspan>.</text>
</svg>
