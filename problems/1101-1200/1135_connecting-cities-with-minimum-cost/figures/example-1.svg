<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- n = 3, connections = [[1,2,5],[1,3,6],[2,3,1]]; MST picks 2-3 and 1-2 -->
  <line x1="110.8" y1="65.6" x2="179.2" y2="164.4" stroke="#b9c4cd" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g stroke="#4169E1" stroke-width="3" fill="none">
    <line x1="119" y1="50" x2="261" y2="50"/>
    <line x1="269.2" y1="65.6" x2="200.8" y2="164.4"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="190" y="40" text-anchor="middle" font-weight="600" fill="#1a2026">5</text>
    <text x="128" y="118" text-anchor="end">6</text>
    <text x="252" y="118" font-weight="600" fill="#1a2026">1</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="100" cy="50" r="19"/>
    <circle cx="280" cy="50" r="19"/>
    <circle cx="190" cy="180" r="19"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="100" y="55">1</text>
    <text x="280" y="55">2</text>
    <text x="190" y="185">3</text>
  </g>
  <text x="190" y="228" text-anchor="middle" fill="#5c6b76" font-size="12.5">the cheapest two links, 1 + 5 = 6, already reach every city; 6 never gets used</text>
</svg>
