<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="310" fill="#ffffff"/>
  <!-- n = 3, connections = [[1,2,5],[1,3,6],[2,3,1]]; Prim from 1: buy 1-2 (5), then 2-3 (1); (6,3) pops stale -->
  <!-- edges: bought ones accent, cost-6 dashed and rejected; white halos keep cost labels off the lines -->
  <line x1="120" y1="100" x2="80" y2="225" stroke="#4169E1" stroke-width="3"/>
  <line x1="80" y1="225" x2="265" y2="165" stroke="#4169E1" stroke-width="3"/>
  <line x1="120" y1="100" x2="265" y2="165" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="6 5"/>
  <!-- buy-order dots on the two bought edges -->
  <circle cx="100" cy="162.5" r="9" fill="#4169E1"/>
  <circle cx="144.75" cy="204" r="9" fill="#4169E1"/>
  <g text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">
    <text x="100" y="166.5">1</text><text x="144.75" y="208">2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="120" cy="100" r="18"/><circle cx="80" cy="225" r="18"/>
  </g>
  <circle cx="265" cy="165" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="120" y="105">1</text><text x="80" y="230">2</text><text x="265" y="170">3</text>
  </g>
  <text x="144" y="105" fill="#4169E1" font-size="10.5" font-weight="600">root</text>
  <!-- cost labels with white halo rects -->
  <rect x="64" y="150" width="20" height="17" fill="#ffffff"/>
  <text x="74" y="163" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">5</text>
  <rect x="182" y="108" width="20" height="17" fill="#ffffff"/>
  <text x="192" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">6</text>
  <rect x="166" y="203" width="20" height="17" fill="#ffffff"/>
  <text x="176" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">1</text>
  <!-- heap trace -->
  <text x="330" y="84" font-weight="600" fill="#1a2026" font-size="13.5">heap pops (price, city):</text>
  <g font-size="12.5" fill="#1a2026">
    <text x="330" y="112">plant 1 at price 0 &#8212; heap: (5,2) (6,3)</text>
    <text x="330" y="136">pop (5,2): buy 1-2, total <tspan fill="#4169E1" font-weight="600">5</tspan></text>
    <text x="330" y="160">pop (1,3): buy 2-3, total <tspan fill="#4169E1" font-weight="600">6</tspan> &#8212; all settled</text>
    <text x="330" y="184" fill="#5c6b76">pop (6,3): city 3 visited &#8212; stale, discard</text>
  </g>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Prim plants city 1 and always buys the cheapest offer leaving the tree:</text>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">1-2 for 5, then 2-3 for 1 — total <tspan fill="#4169E1" font-weight="600">6</tspan>; the stale cost-6 record is never used.</text>
</svg>
