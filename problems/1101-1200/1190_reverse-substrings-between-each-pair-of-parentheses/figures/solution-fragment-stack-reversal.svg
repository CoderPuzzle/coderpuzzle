<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- s = "(u(love)i)"; four snapshots of the fragment stack, boxes 104x30 at
       x 48/208/368/528, rows y 130 (top) / 160 / 190 (base); the state under
       each stack mirrors the section walkthrough's ["", "u"] notation -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="48" y="160" width="104" height="30" fill="#ffffff"/>
    <rect x="48" y="190" width="104" height="30" fill="#f0f3f7"/>
    <rect x="208" y="130" width="104" height="30" fill="#ffffff"/>
    <rect x="208" y="160" width="104" height="30" fill="#ffffff"/>
    <rect x="208" y="190" width="104" height="30" fill="#f0f3f7"/>
    <rect x="368" y="160" width="104" height="30" fill="#ffffff"/>
    <rect x="368" y="190" width="104" height="30" fill="#f0f3f7"/>
    <rect x="528" y="190" width="104" height="30" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="100" y="180" font-weight="600">u</text>
    <text x="100" y="210" fill="#9aa7b2">""</text>
    <text x="260" y="150" font-weight="600">love</text>
    <text x="260" y="180" font-weight="600">u</text>
    <text x="260" y="210" fill="#9aa7b2">""</text>
    <text x="420" y="180"><tspan font-weight="600">u</tspan><tspan fill="#4169E1" font-weight="600">evol</tspan></text>
    <text x="420" y="210" fill="#9aa7b2">""</text>
    <text x="580" y="210" fill="#4169E1" font-weight="600">iloveu</text>
  </g>
  <!-- event arrows between snapshots -->
  <g fill="none" stroke-width="2">
    <path d="M 158 105 L 198 105" stroke="#5c6b76" marker-end="url(#arrowg)"/>
    <path d="M 318 105 L 358 105" stroke="#4169E1" marker-end="url(#arrow)"/>
    <path d="M 478 105 L 518 105" stroke="#4169E1" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="180" y="93" fill="#5c6b76">inner ( , love</text>
    <text x="340" y="93" fill="#4169E1" font-weight="600">) pops: love &#8594; evol</text>
    <text x="500" y="93" fill="#4169E1" font-weight="600">i joins, then ) pops</text>
  </g>
  <!-- stack state after each snapshot, matching the walkthrough notation -->
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="100" y="240">["", "u"]</text>
    <text x="260" y="240">["", "u", "love"]</text>
    <text x="420" y="240">["", "uevol"]</text>
    <text x="580" y="240">["iloveu"]</text>
  </g>
  <text x="330" y="276" text-anchor="middle" fill="#1a2026" font-size="13">Each ) pops the top fragment, reverses it, and appends it to the fragment below;</text>
  <text x="330" y="294" text-anchor="middle" fill="#1a2026" font-size="13">the inner ) makes uevol, and the outer ) finally flips uevoli to <tspan fill="#4169E1" font-weight="600">iloveu</tspan>.</text>
</svg>
