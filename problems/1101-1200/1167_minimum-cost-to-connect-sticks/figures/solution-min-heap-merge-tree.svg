<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="384" fill="#ffffff"/>
  <!-- sticks = [2, 4, 3]; merge tree: internal nodes (blue, #dbe4fb) are merges charging x + y, white nodes are original sticks; nodes 56x44 at centers (320,76) (200,190) (440,190) (360,308) (520,308) -->
  <text x="320" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">sticks = [2, 4, 3]</text>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="320" y1="98" x2="200" y2="168"/>
    <line x1="320" y1="98" x2="440" y2="168"/>
    <line x1="440" y1="212" x2="360" y2="286"/>
    <line x1="440" y1="212" x2="520" y2="286"/>
  </g>
  <!-- merge 2: pops 4 and 5, cost 9 -->
  <rect x="292" y="54" width="56" height="44" rx="10" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="320" y="82" text-anchor="middle" font-size="16" font-weight="600" fill="#4169E1">9</text>
  <text x="358" y="80" fill="#5c6b76" font-size="11.5">last merge</text>
  <!-- merge 1: pops 2 and 3, cost 5 -->
  <rect x="412" y="168" width="56" height="44" rx="10" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="440" y="196" text-anchor="middle" font-size="16" font-weight="600" fill="#4169E1">5</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="172" y="168" width="56" height="44" rx="10"/>
    <rect x="332" y="286" width="56" height="44" rx="10"/>
    <rect x="492" y="286" width="56" height="44" rx="10"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="600" fill="#1a2026">
    <text x="200" y="196">4</text><text x="360" y="314">2</text><text x="520" y="314">3</text>
  </g>
  <text x="238" y="136" text-anchor="end" font-size="12.5" fill="#5c6b76">merge 2: heap pops 4, 5 → cost 9</text>
  <text x="380" y="252" text-anchor="end" font-size="12.5" fill="#5c6b76">merge 1: heap pops 2, 3 → cost 5</text>
  <text x="320" y="352" text-anchor="middle" font-size="13" fill="#1a2026">Each internal node charges x + y: 2 + 3 = 5, then 5 + 4 = 9 — the short sticks</text>
  <text x="320" y="370" text-anchor="middle" font-size="13" fill="#1a2026">feed both merges while 4 joins only the last: total = <tspan fill="#4169E1" font-weight="600">5 + 9 = 14</tspan>.</text>
</svg>
