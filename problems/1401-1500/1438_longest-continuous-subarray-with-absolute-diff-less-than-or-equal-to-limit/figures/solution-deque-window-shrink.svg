<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [8,2,4,7], limit = 4; array cells 80x44 at y 46, x = 40 + 94i; table rows cy = 200/244/288/332, deque cells 40x36 -->
  <text x="40" y="30" fill="#5c6b76" font-size="12.5">nums = [8, 2, 4, 7]</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="40" y="46" width="80" height="44" fill="#f0f3f7"/>
    <rect x="134" y="46" width="80" height="44" fill="#f0f3f7"/>
    <rect x="228" y="46" width="80" height="44" fill="#dbe4fb"/>
    <rect x="322" y="46" width="80" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="80" y="74" fill="#9aa7b2">8</text><text x="174" y="74" fill="#9aa7b2">2</text>
    <text x="268" y="74" fill="#1a2026">4</text><text x="362" y="74" fill="#1a2026">7</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="80" y="108">0</text><text x="174" y="108">1</text><text x="268" y="108">2</text><text x="362" y="108">3</text>
  </g>
  <text x="430" y="74" fill="#5c6b76" font-size="12.5">limit = 4</text>
  <path d="M 228 116 V 122 H 402 V 116" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <text x="315" y="140" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">final window [4, 7]</text>
  <!-- table headers -->
  <g fill="#5c6b76" font-size="11.5">
    <text x="40" y="170">step</text>
    <text x="180" y="170">max-deque (falling)</text>
    <text x="330" y="170">min-deque (rising)</text>
    <text x="470" y="170">max − min</text>
    <text x="615" y="170" text-anchor="middle">best</text>
  </g>
  <!-- row right=0 -->
  <text x="40" y="205" font-size="12.5" fill="#1a2026">right = 0 (<tspan font-weight="600">8</tspan>)</text>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="180" y="182" width="40" height="36"/><rect x="330" y="182" width="40" height="36"/>
  </g>
  <g text-anchor="middle">
    <text x="200" y="200" font-weight="600">8</text><text x="200" y="212" fill="#9aa7b2" font-size="9.5">i0</text>
    <text x="350" y="200" font-weight="600">8</text><text x="350" y="212" fill="#9aa7b2" font-size="9.5">i0</text>
  </g>
  <text x="470" y="205" font-size="12.5" fill="#5c6b76">0 ≤ 4 ok</text>
  <text x="615" y="205" text-anchor="middle" font-weight="600" fill="#1a2026">1</text>
  <!-- row right=1 : spread 6 evicts the 8 -->
  <text x="40" y="249" font-size="12.5" fill="#1a2026">right = 1 (<tspan font-weight="600">2</tspan>)</text>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="180" y="226" width="40" height="36" fill="#f0f3f7"/><rect x="226" y="226" width="40" height="36" fill="#ffffff"/>
    <rect x="330" y="226" width="40" height="36" fill="#ffffff"/>
  </g>
  <line x1="186" y1="256" x2="214" y2="232" stroke="#9aa7b2" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="200" y="244" font-weight="600" fill="#9aa7b2">8</text><text x="200" y="256" fill="#9aa7b2" font-size="9.5">i0</text>
    <text x="246" y="244" font-weight="600">2</text><text x="246" y="256" fill="#9aa7b2" font-size="9.5">i1</text>
    <text x="350" y="244" font-weight="600">2</text><text x="350" y="256" fill="#9aa7b2" font-size="9.5">i1</text>
  </g>
  <path d="M 198 222 Q 184 212 170 216" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="249" font-size="12.5" fill="#4169E1" font-weight="600">6 &gt; 4 → evict 8</text>
  <text x="615" y="249" text-anchor="middle" font-weight="600" fill="#1a2026">1</text>
  <!-- row right=2 -->
  <text x="40" y="293" font-size="12.5" fill="#1a2026">right = 2 (<tspan font-weight="600">4</tspan>)</text>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="180" y="270" width="40" height="36"/>
    <rect x="330" y="270" width="40" height="36"/><rect x="376" y="270" width="40" height="36"/>
  </g>
  <g text-anchor="middle">
    <text x="200" y="288" font-weight="600">4</text><text x="200" y="300" fill="#9aa7b2" font-size="9.5">i2</text>
    <text x="350" y="288" font-weight="600">2</text><text x="350" y="300" fill="#9aa7b2" font-size="9.5">i1</text>
    <text x="396" y="288" font-weight="600">4</text><text x="396" y="300" fill="#9aa7b2" font-size="9.5">i2</text>
  </g>
  <text x="470" y="293" font-size="12.5" fill="#5c6b76">2 ≤ 4 ok</text>
  <text x="615" y="293" text-anchor="middle" font-weight="600" fill="#4169E1">2</text>
  <!-- row right=3 : spread 5 evicts the 2 -->
  <text x="40" y="337" font-size="12.5" fill="#1a2026">right = 3 (<tspan font-weight="600">7</tspan>)</text>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="180" y="314" width="40" height="36" fill="#ffffff"/>
    <rect x="330" y="314" width="40" height="36" fill="#f0f3f7"/><rect x="376" y="314" width="40" height="36" fill="#ffffff"/><rect x="422" y="314" width="40" height="36" fill="#dbe4fb"/>
  </g>
  <line x1="336" y1="344" x2="364" y2="320" stroke="#9aa7b2" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="200" y="332" font-weight="600">7</text><text x="200" y="344" fill="#9aa7b2" font-size="9.5">i3</text>
    <text x="350" y="332" font-weight="600" fill="#9aa7b2">2</text><text x="350" y="344" fill="#9aa7b2" font-size="9.5">i1</text>
    <text x="396" y="332" font-weight="600">4</text><text x="396" y="344" fill="#9aa7b2" font-size="9.5">i2</text>
    <text x="442" y="332" font-weight="600">7</text><text x="442" y="344" fill="#9aa7b2" font-size="9.5">i3</text>
  </g>
  <path d="M 348 310 Q 334 300 320 304" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="337" font-size="12.5" fill="#4169E1" font-weight="600">5 &gt; 4 → evict 2</text>
  <text x="615" y="337" text-anchor="middle" font-weight="600" fill="#4169E1">2</text>
  <text x="330" y="396" text-anchor="middle" fill="#1a2026" font-size="13">Each shrink pops the evicted front: 6 &gt; 4 drops the 8, then 7 − 2 = 5 drops the 2.</text>
  <text x="330" y="418" text-anchor="middle" fill="#1a2026" font-size="13">The longest valid window is [4, 7] with spread 3 ≤ 4 — best length <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
