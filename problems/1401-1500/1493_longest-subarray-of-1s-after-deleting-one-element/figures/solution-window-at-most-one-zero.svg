<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="304" fill="#ffffff"/>
  <!-- nums = [0,1,1,1,0,1,1,0,1]; cells 56x48 at x=40+62i, y=60; window length ending at each r: 1,2,3,4,4,5,6,3,4; best window [1..6] = 6 cells; answer 6-1 = 5 -->
  <g font-size="11" fill="#9aa7b2" text-anchor="middle">
    <text x="68" y="50">0</text><text x="130" y="50">1</text><text x="192" y="50">2</text>
    <text x="254" y="50">3</text><text x="316" y="50">4</text><text x="378" y="50">5</text>
    <text x="440" y="50">6</text><text x="502" y="50">7</text><text x="564" y="50">8</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="40" y="60" width="56" height="48" fill="#f0f3f7"/>
    <rect x="102" y="60" width="56" height="48" fill="#ffffff"/>
    <rect x="164" y="60" width="56" height="48" fill="#ffffff"/>
    <rect x="226" y="60" width="56" height="48" fill="#ffffff"/>
    <rect x="350" y="60" width="56" height="48" fill="#ffffff"/>
    <rect x="412" y="60" width="56" height="48" fill="#ffffff"/>
    <rect x="474" y="60" width="56" height="48" fill="#f0f3f7"/>
    <rect x="536" y="60" width="56" height="48" fill="#ffffff"/>
  </g>
  <rect x="288" y="60" width="56" height="48" fill="#f0f3f7" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="68" y="89" fill="#5c6b76">0</text><text x="130" y="89" fill="#1a2026">1</text>
    <text x="192" y="89" fill="#1a2026">1</text><text x="254" y="89" fill="#1a2026">1</text>
    <text x="316" y="89" fill="#5c6b76">0</text><text x="378" y="89" fill="#1a2026">1</text>
    <text x="440" y="89" fill="#1a2026">1</text><text x="502" y="89" fill="#5c6b76">0</text>
    <text x="564" y="89" fill="#1a2026">1</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="68" y="126">1</text><text x="130" y="126">2</text><text x="192" y="126">3</text>
    <text x="254" y="126">4</text><text x="316" y="126">4</text><text x="378" y="126">5</text>
    <text x="440" y="126" fill="#4169E1" font-weight="600">6</text><text x="502" y="126">3</text>
    <text x="564" y="126">4</text>
  </g>
  <text x="600" y="126" fill="#5c6b76" font-size="11">len</text>
  <text x="592" y="142" text-anchor="end" fill="#9aa7b2" font-size="10.5">window length ending at r</text>
  <rect x="102" y="160" width="366" height="6" rx="3" fill="#4169E1"/>
  <text x="285" y="184" text-anchor="middle" fill="#4169E1" font-size="12">best window [1..6] = 6 cells; delete its lone 0 &#8594; 5</text>
  <rect x="350" y="206" width="242" height="6" rx="3" fill="#9aa7b2"/>
  <text x="471" y="230" text-anchor="middle" fill="#5c6b76" font-size="12">after the second 0 (r = 7), l walks 1 &#8594; 5: window [5..8] = 4</text>
  <text x="340" y="262" text-anchor="middle" fill="#1a2026" font-size="13">The window holds at most one zero: when r = 7 brings the second 0, l advances 1 &#8594; 5.</text>
  <text x="340" y="280" text-anchor="middle" fill="#1a2026" font-size="13">The best window [1..6] spans 6 cells; deleting its lone 0 gives the answer <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
</svg>
