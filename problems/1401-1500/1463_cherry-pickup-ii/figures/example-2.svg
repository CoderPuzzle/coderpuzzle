<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="drop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <rect width="400" height="400" fill="#ffffff"/>
  <text x="50" y="30" text-anchor="middle" fill="#2e7d4f" font-weight="600" font-size="12.5">Robot #1</text>
  <text x="290" y="30" text-anchor="middle" fill="#274db1" font-weight="600" font-size="12.5">Robot #2</text>
  <line x1="50" y1="40" x2="50" y2="70" stroke="#42525e" stroke-width="1.4" marker-end="url(#drop)"/>
  <line x1="290" y1="40" x2="290" y2="70" stroke="#42525e" stroke-width="1.4" marker-end="url(#drop)"/>
  <!-- grid -->
  <g stroke="#42525e" stroke-width="1.1">
    <rect x="30" y="80" width="40" height="40" fill="#2e9e5b" fill-opacity="0.16"/>
    <rect x="70" y="80" width="40" height="40" fill="#ffffff"/><rect x="110" y="80" width="40" height="40" fill="#ffffff"/><rect x="150" y="80" width="40" height="40" fill="#ffffff"/><rect x="190" y="80" width="40" height="40" fill="#ffffff"/><rect x="230" y="80" width="40" height="40" fill="#ffffff"/>
    <rect x="270" y="80" width="40" height="40" fill="#4169E1" fill-opacity="0.16"/>
    <rect x="30" y="120" width="40" height="40" fill="#ffffff"/><rect x="70" y="120" width="40" height="40" fill="#2e9e5b" fill-opacity="0.16"/><rect x="110" y="120" width="40" height="40" fill="#ffffff"/><rect x="150" y="120" width="40" height="40" fill="#ffffff"/><rect x="190" y="120" width="40" height="40" fill="#ffffff"/>
    <rect x="230" y="120" width="40" height="40" fill="#4169E1" fill-opacity="0.16"/><rect x="270" y="120" width="40" height="40" fill="#ffffff"/>
    <rect x="30" y="160" width="40" height="40" fill="#ffffff"/><rect x="70" y="160" width="40" height="40" fill="#ffffff"/><rect x="110" y="160" width="40" height="40" fill="#2e9e5b" fill-opacity="0.16"/><rect x="150" y="160" width="40" height="40" fill="#ffffff"/>
    <rect x="190" y="160" width="40" height="40" fill="#4169E1" fill-opacity="0.16"/><rect x="230" y="160" width="40" height="40" fill="#ffffff"/><rect x="270" y="160" width="40" height="40" fill="#ffffff"/>
    <rect x="30" y="200" width="40" height="40" fill="#ffffff"/><rect x="70" y="200" width="40" height="40" fill="#ffffff"/><rect x="110" y="200" width="40" height="40" fill="#ffffff"/><rect x="150" y="200" width="40" height="40" fill="#2e9e5b" fill-opacity="0.16"/>
    <rect x="190" y="200" width="40" height="40" fill="#4169E1" fill-opacity="0.16"/><rect x="230" y="200" width="40" height="40" fill="#ffffff"/><rect x="270" y="200" width="40" height="40" fill="#ffffff"/>
    <rect x="30" y="240" width="40" height="40" fill="#ffffff"/><rect x="70" y="240" width="40" height="40" fill="#ffffff"/><rect x="110" y="240" width="40" height="40" fill="#2e9e5b" fill-opacity="0.16"/>
    <rect x="150" y="240" width="40" height="40" fill="#4169E1" fill-opacity="0.16"/><rect x="190" y="240" width="40" height="40" fill="#ffffff"/><rect x="230" y="240" width="40" height="40" fill="#ffffff"/><rect x="270" y="240" width="40" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600" font-size="13">
    <text x="50" y="104">1</text><text x="90" y="104">0</text><text x="130" y="104">0</text><text x="170" y="104">0</text><text x="210" y="104">0</text><text x="250" y="104">0</text><text x="290" y="104">1</text>
    <text x="50" y="144">2</text><text x="90" y="144">0</text><text x="130" y="144">0</text><text x="170" y="144">0</text><text x="210" y="144">0</text><text x="250" y="144">3</text><text x="290" y="144">0</text>
    <text x="50" y="184">2</text><text x="90" y="184">0</text><text x="130" y="184">9</text><text x="170" y="184">0</text><text x="210" y="184">0</text><text x="250" y="184">0</text><text x="290" y="184">0</text>
    <text x="50" y="224">0</text><text x="90" y="224">3</text><text x="130" y="224">0</text><text x="170" y="224">5</text><text x="210" y="224">4</text><text x="250" y="224">0</text><text x="290" y="224">0</text>
    <text x="50" y="264">1</text><text x="90" y="264">0</text><text x="130" y="264">2</text><text x="170" y="264">3</text><text x="210" y="264">0</text><text x="250" y="264">0</text><text x="290" y="264">6</text>
  </g>
  <!-- paths -->
  <polyline points="50,100 90,140 130,180 170,220 130,260" fill="none" stroke="#2e9e5b" stroke-width="2.2"/>
  <polyline points="290,100 250,140 210,180 210,220 170,260" fill="none" stroke="#4169E1" stroke-width="2.2"/>
  <g fill="#2e9e5b" stroke="#ffffff" stroke-width="1.1">
    <circle cx="50" cy="100" r="4"/><circle cx="90" cy="140" r="4"/><circle cx="130" cy="180" r="4"/><circle cx="170" cy="220" r="4"/><circle cx="130" cy="260" r="4"/>
  </g>
  <g fill="#4169E1" stroke="#ffffff" stroke-width="1.1">
    <circle cx="290" cy="100" r="4"/><circle cx="250" cy="140" r="4"/><circle cx="210" cy="180" r="4"/><circle cx="210" cy="220" r="4"/><circle cx="170" cy="260" r="4"/>
  </g>
  <text x="200" y="330" text-anchor="middle" fill="#2e7d4f" font-size="12.5">Robot #1: 1 + 0 + 9 + 5 + 2 = 17</text>
  <text x="200" y="350" text-anchor="middle" fill="#274db1" font-size="12.5">Robot #2: 1 + 3 + 0 + 4 + 3 = 11</text>
  <text x="200" y="375" text-anchor="middle" fill="#1a2026" font-weight="600">total 17 + 11 = 28</text>
</svg>
