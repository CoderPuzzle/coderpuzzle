<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="500" height="350" fill="#ffffff"/>
  <text x="250" y="28" text-anchor="middle" fill="#5c6b76" font-size="12.5">edges labeled index · weight</text>
  <g stroke="#4169E1" stroke-width="2.4">
    <line x1="235" y1="73" x2="155" y2="147"/>
    <line x1="140" y1="183" x2="235" y2="257"/>
    <line x1="265" y1="257" x2="345" y2="183"/>
    <line x1="360" y1="147" x2="265" y2="73"/>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="180" y="100">0 · 1</text>
    <text x="180" y="235">1 · 1</text>
    <text x="322" y="235">2 · 1</text>
    <text x="322" y="100">3 · 1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="250" cy="55" r="18"/>
    <circle cx="140" cy="165" r="18"/>
    <circle cx="250" cy="275" r="18"/>
    <circle cx="360" cy="165" r="18"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="250" y="60">0</text><text x="140" y="170">1</text><text x="250" y="280">2</text><text x="360" y="170">3</text>
  </g>
  <text x="250" y="335" text-anchor="middle" fill="#1a2026" font-weight="600">any 3 of the 4 edges give an MST — all are pseudo-critical</text>
</svg>
