<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- the 12 happy strings of length 3 in lexicographic order; k = 9 descends: block (9-1)/4 = 2 -> c, then a, then b; surviving leaf cab accented, eliminated leaves muted -->
  <g stroke-width="1.3">
    <g fill="#f0f3f7" stroke="#9aa7b2">
      <rect x="40" y="60" width="44" height="34"/><rect x="84" y="60" width="44" height="34"/>
      <rect x="128" y="60" width="44" height="34"/><rect x="172" y="60" width="44" height="34"/>
      <rect x="216" y="60" width="44" height="34"/><rect x="260" y="60" width="44" height="34"/>
      <rect x="304" y="60" width="44" height="34"/><rect x="348" y="60" width="44" height="34"/>
      <rect x="436" y="60" width="44" height="34"/>
      <rect x="480" y="60" width="44" height="34"/><rect x="524" y="60" width="44" height="34"/>
    </g>
    <rect x="392" y="60" width="44" height="34" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#9aa7b2">
    <text x="62" y="82">aba</text><text x="106" y="82">abc</text><text x="150" y="82">aca</text>
    <text x="194" y="82">acb</text><text x="238" y="82">bab</text><text x="282" y="82">bac</text>
    <text x="326" y="82">bca</text><text x="370" y="82">bcb</text>
    <text x="458" y="82">cac</text><text x="502" y="82">cba</text><text x="546" y="82">cbc</text>
  </g>
  <text x="414" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">cab</text>
  <g fill="none" stroke="#9aa7b2" stroke-width="1.2">
    <path d="M 40 100 L 40 106 L 216 106 L 216 100"/>
    <path d="M 216 100 L 216 106 L 392 106 L 392 100"/>
  </g>
  <path d="M 392 100 L 392 106 L 568 106 L 568 100" fill="none" stroke="#4169E1" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="12">
    <text x="128" y="124" fill="#9aa7b2">a - 4</text>
    <text x="304" y="124" fill="#9aa7b2">b - 4</text>
    <text x="480" y="124" fill="#4169E1" font-weight="600">c - 4</text>
  </g>
  <path d="M 480 156 L 480 134" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="320" y="176">k = 9: block (9-1)/4 = 2, so the first letter is c</text>
    <text x="320" y="208">k = 1: pair (1-1)/2 = 0, so the next letter is a</text>
    <text x="320" y="240">k = 1: letter (1-1)/1 = 0, so the last letter is b</text>
  </g>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Each letter halves the block 4 → 2 → 1; k = 9 descends c, a, b to <tspan fill="#4169E1" font-weight="600">cab</tspan>,</text>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">the 9th of the twelve happy strings, read off without generating any.</text>
</svg>
