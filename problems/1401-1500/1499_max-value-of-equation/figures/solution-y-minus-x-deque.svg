<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- points [[1,3],[2,0],[5,10],[6,-10]], k = 1; keys y-x = 2, -2, 5, -16; cards x = 90 + 120i, w 104; deque cells 36x26 at x = 150 -->
  <text x="90" y="30" fill="#5c6b76" font-size="12.5">points (x, y), sorted by x — key below is y − x; k = 1</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="90" y="46" width="104" height="50"/><rect x="210" y="46" width="104" height="50"/>
    <rect x="330" y="46" width="104" height="50"/><rect x="450" y="46" width="104" height="50"/>
  </g>
  <g text-anchor="middle">
    <text x="142" y="68" font-weight="600">(1, 3)</text><text x="262" y="68" font-weight="600">(2, 0)</text>
    <text x="382" y="68" font-weight="600">(5, 10)</text><text x="502" y="68" font-weight="600">(6, −10)</text>
    <text x="142" y="87" fill="#5c6b76" font-size="12">y − x = 2</text><text x="262" y="87" fill="#5c6b76" font-size="12">y − x = −2</text>
    <text x="382" y="87" fill="#5c6b76" font-size="12">y − x = 5</text><text x="502" y="87" fill="#5c6b76" font-size="12">y − x = −16</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="142" y="112">i = 0</text><text x="262" y="112">i = 1</text><text x="382" y="112">i = 2</text><text x="502" y="112">i = 3</text>
  </g>
  <text x="150" y="140" fill="#9aa7b2" font-size="11">deque (keys y − x), front first</text>
  <!-- j = 1: window [1,2] keeps both; front key 2 scores 0 + 2 + 2 = 4 -->
  <text x="40" y="168" fill="#5c6b76" font-size="12.5">j = 1 (x = 2)</text>
  <rect x="150" y="150" width="36" height="26" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <rect x="190" y="150" width="36" height="26" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="168" y="168" fill="#4169E1">2</text><text x="208" y="168">−2</text>
  </g>
  <text x="310" y="168" fill="#1a2026" font-size="12.5">front: 0 + 2 + 2 = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  <!-- j = 2: x = 5 lies > k behind fronts x = 1, 2; both popped, 5 enters -->
  <text x="40" y="218" fill="#5c6b76" font-size="12.5">j = 2 (x = 5)</text>
  <rect x="150" y="200" width="36" height="26" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="168" y="218" text-anchor="middle" font-weight="600" font-size="13">5</text>
  <text x="310" y="218" fill="#5c6b76" font-size="12.5">fronts x = 1, 2 exceed k — popped empty</text>
  <!-- j = 3: window [5,6]; front 5 scores -10 + 6 + 5 = 1 -->
  <text x="40" y="268" fill="#5c6b76" font-size="12.5">j = 3 (x = 6)</text>
  <rect x="150" y="250" width="36" height="26" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <rect x="190" y="250" width="36" height="26" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="168" y="268" fill="#4169E1">5</text><text x="208" y="268">−16</text>
  </g>
  <text x="310" y="268" fill="#1a2026" font-size="12.5">front: −10 + 6 + 5 = 1 &lt; 4</text>
  <text x="320" y="310" text-anchor="middle" fill="#1a2026" font-size="13">The deque front is the largest y − x in the window, maximizing y + x + (y − x).</text>
  <text x="320" y="328" text-anchor="middle" fill="#1a2026" font-size="13">At j = 1 the front, point (1, 3), scores 0 + 2 + 2 = <tspan fill="#4169E1" font-weight="600">4</tspan> — the answer.</text>
</svg>
