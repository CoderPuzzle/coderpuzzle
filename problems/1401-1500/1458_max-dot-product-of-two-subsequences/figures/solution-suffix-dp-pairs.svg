<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums1 = [2,1,-2,5] (rows i = 0..3), nums2 = [3,0,-6] (cols j = 0..2); cells 92x42 at (76,90) -->
  <!-- dp[i][j] filled from the bottom-right: dp[3][2]=-30, dp[3][1]=0, dp[3][0]=15, dp[2]=12,12,15, dp[1]=12,12,15, dp[0]=12,12,18 -->
  <text x="214" y="46" text-anchor="middle" fill="#5c6b76" font-size="12">nums2</text>
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.2">
    <rect x="76" y="56" width="92" height="34"/><rect x="168" y="56" width="92" height="34"/><rect x="260" y="56" width="92" height="34"/>
    <rect x="40" y="90" width="36" height="42"/><rect x="40" y="132" width="36" height="42"/><rect x="40" y="174" width="36" height="42"/><rect x="40" y="216" width="36" height="42"/>
  </g>
  <g text-anchor="middle">
    <text x="122" y="70" fill="#5c6b76" font-size="10">j = 0</text><text x="214" y="70" fill="#5c6b76" font-size="10">j = 1</text><text x="306" y="70" fill="#5c6b76" font-size="10">j = 2</text>
    <text x="122" y="85" font-weight="600" font-size="14" fill="#1a2026">3</text><text x="214" y="85" font-weight="600" font-size="14" fill="#1a2026">0</text><text x="306" y="85" font-weight="600" font-size="14" fill="#1a2026">-6</text>
    <text x="58" y="117" font-weight="600" font-size="14" fill="#1a2026">2</text><text x="58" y="159" font-weight="600" font-size="14" fill="#1a2026">1</text><text x="58" y="201" font-weight="600" font-size="14" fill="#1a2026">-2</text><text x="58" y="243" font-weight="600" font-size="14" fill="#1a2026">5</text>
  </g>
  <text transform="rotate(-90 16 174)" x="16" y="174" text-anchor="middle" fill="#5c6b76" font-size="12">nums1</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="168" y="90" width="92" height="42"/><rect x="260" y="90" width="92" height="42"/>
    <rect x="76" y="132" width="92" height="42"/><rect x="168" y="132" width="92" height="42"/><rect x="260" y="132" width="92" height="42"/>
    <rect x="76" y="174" width="92" height="42"/><rect x="168" y="174" width="92" height="42"/><rect x="260" y="174" width="92" height="42"/>
    <rect x="76" y="216" width="92" height="42"/><rect x="168" y="216" width="92" height="42"/><rect x="260" y="216" width="92" height="42"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="2">
    <rect x="76" y="90" width="92" height="42"/>
    <rect x="168" y="132" width="92" height="42"/>
    <rect x="260" y="174" width="92" height="42"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="122" y="117" fill="#4169E1">18</text><text x="214" y="117" fill="#1a2026">12</text><text x="306" y="117" fill="#1a2026">12</text>
    <text x="122" y="159" fill="#1a2026">15</text><text x="214" y="159" fill="#1a2026">12</text><text x="306" y="159" fill="#1a2026">12</text>
    <text x="122" y="201" fill="#1a2026">15</text><text x="214" y="201" fill="#1a2026">12</text><text x="306" y="201" fill="#1a2026">12</text>
    <text x="122" y="243" fill="#1a2026">15</text><text x="214" y="243" fill="#1a2026">0</text><text x="306" y="243" fill="#1a2026">-30</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <path d="M 98 132 V 166" marker-end="url(#arrowM)"/>
    <path d="M 168 98 H 202" marker-end="url(#arrowM)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 156 120 L 192 146" marker-end="url(#arrow)"/>
    <path d="M 248 162 L 284 188" marker-end="url(#arrow)"/>
  </g>
  <text x="380" y="104" fill="#5c6b76" font-size="12.5">each cell: best of pair, skip-row, skip-col</text>
  <text x="380" y="132" fill="#4169E1" font-size="13" font-weight="600">pair heads: 2·3 + dp[1][1]</text>
  <text x="380" y="152" fill="#4169E1" font-size="13" font-weight="600">= 6 + 12 = 18</text>
  <text x="380" y="180" fill="#1a2026" font-size="13">skip nums1[0]: dp[1][0] = 15</text>
  <text x="380" y="200" fill="#1a2026" font-size="13">skip nums2[0]: dp[0][1] = 12</text>
  <text x="380" y="228" fill="#5c6b76" font-size="12.5">down the arrows: dp[1][1] = 1·0 + dp[2][2]</text>
  <text x="380" y="246" fill="#5c6b76" font-size="12.5">= 0 + (-2)·(-6) = 12</text>
  <text x="340" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Filled from the bottom-right, dp[0][0] pairs 2·3 and adds the best</text>
  <text x="340" y="322" text-anchor="middle" fill="#1a2026" font-size="13">remainder dp[1][1] = 12 = (-2)·(-6): the answer is <tspan fill="#4169E1" font-weight="600">18</tspan>.</text>
</svg>
