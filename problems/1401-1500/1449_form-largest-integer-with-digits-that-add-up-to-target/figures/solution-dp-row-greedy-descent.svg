<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- cost = [4,3,2,5,6,7,2,5,5], target = 9; dp[0..9] = 0, –, 1, 1, 2, 2, 3, 3, 4, 4; cells 52x42 at x = 34+60t, y 76; descent 9>7>5>3>0 picks 7,7,7,2 -->
  <text x="34" y="28" fill="#5c6b76" font-size="12.5">cost = [4, 3, 2, 5, 6, 7, 2, 5, 5],  target = 9</text>
  <text x="34" y="48" fill="#5c6b76" font-size="12">dp[t] = most digits paintable for exact cost t</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="60" y="70">0</text><text x="120" y="70">1</text><text x="180" y="70">2</text><text x="240" y="70">3</text><text x="300" y="70">4</text>
    <text x="360" y="70">5</text><text x="420" y="70">6</text><text x="480" y="70">7</text><text x="540" y="70">8</text><text x="600" y="70">9</text>
  </g>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="34" y="76" width="52" height="42" fill="#dbe4fb"/>
    <rect x="94" y="76" width="52" height="42" fill="#f0f3f7"/>
    <rect x="154" y="76" width="52" height="42" fill="#ffffff"/>
    <rect x="214" y="76" width="52" height="42" fill="#dbe4fb"/>
    <rect x="274" y="76" width="52" height="42" fill="#ffffff"/>
    <rect x="334" y="76" width="52" height="42" fill="#dbe4fb"/>
    <rect x="394" y="76" width="52" height="42" fill="#ffffff"/>
    <rect x="454" y="76" width="52" height="42" fill="#dbe4fb"/>
    <rect x="514" y="76" width="52" height="42" fill="#ffffff"/>
    <rect x="574" y="76" width="52" height="42" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="60" y="103" fill="#4169E1">0</text>
    <text x="120" y="103" fill="#9aa7b2">–</text>
    <text x="180" y="103">1</text>
    <text x="240" y="103" fill="#4169E1">1</text>
    <text x="300" y="103">2</text>
    <text x="360" y="103" fill="#4169E1">2</text>
    <text x="420" y="103">3</text>
    <text x="480" y="103" fill="#4169E1">3</text>
    <text x="540" y="103">4</text>
    <text x="600" y="103" fill="#4169E1">4</text>
  </g>
  <!-- greedy descent arcs, each labeled with the digit it picks -->
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 600 120 Q 540 162 480 120" marker-end="url(#arrow)"/>
    <path d="M 480 120 Q 420 190 360 120" marker-end="url(#arrow)"/>
    <path d="M 360 120 Q 300 218 240 120" marker-end="url(#arrow)"/>
    <path d="M 240 120 Q 150 246 60 120" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="540" y="158">digit 7</text>
    <text x="420" y="172">digit 7</text>
    <text x="300" y="186">digit 7</text>
    <text x="150" y="200">digit 2</text>
  </g>
  <text x="330" y="258" text-anchor="middle" fill="#1a2026" font-size="13">Greedy descent tries digits 9 down to 1, keeping d when dp[t − cost[d]] = dp[t] − 1.</text>
  <text x="330" y="282" text-anchor="middle" fill="#1a2026" font-size="13">Budgets 9 → 7 → 5 → 3 → 0 pick 7, 7, 7, 2 — spelling <tspan fill="#4169E1" font-weight="600">7772</tspan>; dp[1] stays unreachable.</text>
</svg>
