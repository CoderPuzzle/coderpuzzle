    <rect x="200" y="380" width="13" height="13"/><rect x="215" y="380" width="13" height="13"/><rect x="230" y="380" width="13" height="13"/><rect x="245" y="380" width="13" height="13"/><rect x="260" y="380" width="13" height="13"/><rect x="275" y="380" width="13" height="13"/><rect x="290" y="380" width="13" height="13"/>
