    <rect x="170" y="314" width="13" height="13"/><rect x="215" y="314" width="13" height="13"/><rect x="230" y="314" width="13" height="13"/><rect x="245" y="314" width="13" height="13"/><rect x="260" y="314" width="13" height="13"/><rect x="275" y="314" width="13" height="13"/><rect x="290" y="314" width="13" height="13"/>
    <rect x="215" y="332" width="13" height="13"/><rect x="230" y="332" width="13" height="13"/><rect x="245" y="332" width="13" height="13"/><rect x="260" y="332" width="13" height="13"/><rect x="275" y="332" width="13" height="13"/><rect x="290" y="332" width="13" height="13"/>
