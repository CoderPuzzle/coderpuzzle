  </g>
  <g fill="#4169E1">
    <rect x="185" y="362" width="13" height="13"/>
    <rect x="170" y="380" width="13" height="13"/><rect x="185" y="380" width="13" height="13"/>
    <rect x="185" y="398" width="13" height="13"/>
  </g>
  <g font-size="12">
    <text x="318" y="373" fill="#5c6b76">mask = 2</text>
    <text x="318" y="391" fill="#5c6b76">mask = 3</text>
    <text x="318" y="409" fill="#4169E1" font-weight="600">mask = 2</text>
  </g>
  <path d="M 423 404 l 6 7 l 12 -15" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <text x="448" y="409" fill="#4169E1" font-size="12.5">one set bit</text>
  <text x="300" y="448" text-anchor="middle" fill="#1a2026" font-size="13">Each node toggles its digit's bit; a leaf counts when mask &amp; (mask - 1) = 0.</text>
  <text x="300" y="468" text-anchor="middle" fill="#1a2026" font-size="13">Paths [2,3,3] and [2,1,1] end at mask 2 — one odd digit each: answer <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
