    <text x="266.5" y="222">7</text><text x="281.5" y="222">8</text><text x="296.5" y="222">9</text>
  </g>
  <path d="M 28 286 H 540" stroke="#dbe4fb" stroke-width="1.5"/>
  <path d="M 28 352 H 540" stroke="#dbe4fb" stroke-width="1.5"/>
  <!-- lane 1: path 2-3-3, masks 2, 6, 2 -->
  <text x="28" y="259" fill="#1a2026" font-size="12.5">path [2, 3, 3]</text>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="0.8">
