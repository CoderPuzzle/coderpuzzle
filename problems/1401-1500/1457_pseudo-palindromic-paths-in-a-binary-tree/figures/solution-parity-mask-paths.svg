<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 484" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="484" fill="#ffffff"/>
  <!-- root = [2,3,1,3,1,null,1]; three root-to-leaf paths 2-3-3, 2-3-1, 2-1-1 -->
  <!-- bit j of the mask = digit j+1 toggled per node; leaf masks 2, 7, 2 -> at most one set bit twice -->
