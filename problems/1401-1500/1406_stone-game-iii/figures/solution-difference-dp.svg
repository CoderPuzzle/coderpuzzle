<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="276" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- stoneValue = [1,2,3,7]; cells 88x44 at x = 60 + 108i; dp filled right to left from the base dp[4] = 0 -->
  <text x="60" y="46" fill="#5c6b76" font-size="12.5">stoneValue</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="60" y="56" width="88" height="44"/><rect x="168" y="56" width="88" height="44"/>
    <rect x="276" y="56" width="88" height="44"/><rect x="384" y="56" width="88" height="44"/>
  </g>
  <rect x="492" y="56" width="88" height="44" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="104" y="84" fill="#1a2026">1</text><text x="212" y="84" fill="#1a2026">2</text>
    <text x="320" y="84" fill="#1a2026">3</text><text x="428" y="84" fill="#1a2026">7</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="104" y="118">i = 0</text><text x="212" y="118">i = 1</text>
    <text x="320" y="118">i = 2</text><text x="428" y="118">i = 3</text><text x="536" y="118">i = 4</text>
  </g>
  <text x="30" y="167" fill="#5c6b76" font-size="12.5">dp</text>
  <line x1="540" y1="138" x2="106" y2="138" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="104" y="167" fill="#4169E1">-1</text><text x="212" y="167" fill="#1a2026">12</text>
    <text x="320" y="167" fill="#1a2026">10</text><text x="428" y="167" fill="#1a2026">7</text>
    <text x="536" y="167" fill="#5c6b76">0</text>
  </g>
  <text x="536" y="187" text-anchor="middle" fill="#5c6b76" font-size="11">base</text>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="104" y="192">take 3: 6 - 7</text>
    <text x="212" y="192">take 3: 12 - 0</text>
    <text x="320" y="192">take 2: 10 - 0</text>
    <text x="428" y="192">take 1: 7 - 0</text>
  </g>
  <text x="320" y="230" text-anchor="middle" fill="#1a2026" font-size="13">dp[0] = -1 &lt; 0: even Alice's best move, taking 1 + 2 + 3 = 6, trails dp[3] = 7,</text>
  <text x="320" y="248" text-anchor="middle" fill="#1a2026" font-size="13">so Bob ends 7 to 6 ahead and wins — the answer is <tspan fill="#4169E1" font-weight="600">"Bob"</tspan>.</text>
</svg>
