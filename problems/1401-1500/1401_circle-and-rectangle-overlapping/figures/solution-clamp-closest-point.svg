<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 1: radius = 1, center (0,0); rect x 1..3, y -1..1; unit = 60px, origin at screen (240,170) -->
  <g stroke="#9aa7b2" stroke-width="1.2">
    <line x1="70" y1="170" x2="450" y2="170"/>
    <line x1="240" y1="44" x2="240" y2="296"/>
    <line x1="180" y1="166" x2="180" y2="174"/>
    <line x1="300" y1="166" x2="300" y2="174"/>
    <line x1="360" y1="166" x2="360" y2="174"/>
    <line x1="420" y1="166" x2="420" y2="174"/>
    <line x1="236" y1="110" x2="244" y2="110"/>
    <line x1="236" y1="230" x2="244" y2="230"/>
  </g>
  <g fill="#9aa7b2" font-size="10.5">
    <text x="176" y="188" text-anchor="end">-1</text>
    <text x="428" y="188">3</text>
    <text x="250" y="106">1</text>
    <text x="250" y="244">-1</text>
  </g>
  <circle cx="240" cy="170" r="60" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <rect x="300" y="110" width="120" height="120" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
  <!-- x ticks 1 and 2 painted after the rect so the opaque rect does not cover them -->
  <g fill="#9aa7b2" font-size="10.5">
    <text x="306" y="188">1</text>
    <text x="360" y="188" text-anchor="middle">2</text>
  </g>
  <line x1="246" y1="170" x2="294" y2="170" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="240" cy="170" r="4" fill="#1a2026"/>
  <circle cx="300" cy="170" r="4.5" fill="#4169E1"/>
  <text x="230" y="192" text-anchor="end" fill="#5c6b76" font-size="12">(0, 0)</text>
  <text x="308" y="156" fill="#4169E1" font-size="12.5" font-weight="600">(1, 0)</text>
  <text x="458" y="92" fill="#5c6b76" font-size="12">clamp each coordinate</text>
  <text x="458" y="120" fill="#1a2026" font-size="12.5">x: mid(0, 1, 3) = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <text x="458" y="140" fill="#1a2026" font-size="12.5">y: mid(0, -1, 1) = <tspan fill="#4169E1" font-weight="600">0</tspan></text>
  <text x="458" y="170" fill="#1a2026" font-size="12.5">distance² = 1² + 0² = 1</text>
  <text x="458" y="190" fill="#1a2026" font-size="12.5">radius² = 1² = 1</text>
  <text x="458" y="220" fill="#4169E1" font-size="13.5" font-weight="600">1 ≤ 1 → true</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">Clamping the center (0, 0) into the rectangle [1, -1, 3, 1] yields the nearest point <tspan fill="#4169E1" font-weight="600">(1, 0)</tspan>,</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">where the circle meets the left edge: distance 1 = radius, so the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
