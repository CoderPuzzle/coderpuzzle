<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="428" fill="#ffffff"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- numCourses = 3, prerequisites = [[1,2],[1,0],[2,0]]; Kahn pops 1, 2, 0 -->
  <!-- pop u forwards reach[u] | {u}: pop 1 -> {1}; pop 2 -> {1,2}; pop 0 -> {1,2,0}; reach[0] = {1,2,0} -->
  <g stroke="#42525e" stroke-width="2" fill="none">
    <path d="M 118 81 L 82 141" marker-end="url(#arrowG)"/>
    <path d="M 138 81 L 174 141" marker-end="url(#arrowG)"/>
    <path d="M 92 158 L 163 158" marker-end="url(#arrowG)"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <circle cx="128" cy="64" r="17"/><circle cx="72" cy="158" r="17"/><circle cx="184" cy="158" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14.5" fill="#1a2026">
    <text x="128" y="69">1</text><text x="72" y="163">2</text><text x="184" y="163">0</text>
  </g>
  <g fill="#5c6b76" font-size="10.5">
    <text x="154" y="66">indeg 0</text>
    <text x="72" y="190" text-anchor="middle">indeg 1</text>
    <text x="184" y="190" text-anchor="middle">indeg 2</text>
  </g>
  <g>
    <rect x="258" y="46" width="62" height="22" rx="11" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
    <text x="289" y="61" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">pop 1</text>
    <text x="334" y="61" fill="#1a2026" font-size="13">forwards <tspan fill="#4169E1" font-weight="600">{1}</tspan></text>
    <text x="334" y="81" fill="#5c6b76" font-size="12.5">reach[2]: {} → {1}; reach[0]: {} → {1}</text>
    <rect x="258" y="104" width="62" height="22" rx="11" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
    <text x="289" y="119" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">pop 2</text>
    <text x="334" y="119" fill="#1a2026" font-size="13">forwards <tspan fill="#4169E1" font-weight="600">{1, 2}</tspan></text>
    <text x="334" y="139" fill="#5c6b76" font-size="12.5">reach[0]: {1} → {1, 2}</text>
    <rect x="258" y="162" width="62" height="22" rx="11" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
    <text x="289" y="177" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">pop 0</text>
    <text x="334" y="177" fill="#1a2026" font-size="13">forwards <tspan fill="#4169E1" font-weight="600">{1, 2, 0}</tspan></text>
    <text x="334" y="197" fill="#5c6b76" font-size="12.5">no dependent — the queue empties</text>
  </g>
  <text x="128" y="246" text-anchor="middle" fill="#5c6b76" font-size="12">final reach sets</text>
  <text x="40" y="274" fill="#1a2026" font-size="13">reach[1] <tspan fill="#9aa7b2">= { }</tspan></text>
  <text x="126" y="304" text-anchor="end" fill="#1a2026" font-size="13">reach[2]</text>
  <g stroke="#9aa7b2" stroke-width="0.8" fill="#f0f3f7">
    <rect x="140" y="288" width="30" height="24"/>
    <rect x="204" y="288" width="30" height="24"/>
  </g>
  <rect x="172" y="288" width="30" height="24" fill="#4169E1"/>
  <g text-anchor="middle" font-size="11">
    <text x="155" y="304" fill="#5c6b76">0</text>
    <text x="187" y="304" fill="#ffffff" font-weight="600">1</text>
    <text x="219" y="304" fill="#5c6b76">2</text>
  </g>
  <text x="126" y="338" text-anchor="end" fill="#1a2026" font-size="13">reach[0]</text>
  <g fill="#4169E1">
    <rect x="140" y="322" width="30" height="24"/>
    <rect x="172" y="322" width="30" height="24"/>
    <rect x="204" y="322" width="30" height="24"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#ffffff" font-weight="600">
    <text x="155" y="338">0</text><text x="187" y="338">1</text><text x="219" y="338">2</text>
  </g>
  <text x="258" y="250" fill="#1a2026" font-size="13">query [1, 0]: 1 ∈ reach[0] → <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="258" y="278" fill="#1a2026" font-size="13">query [1, 2]: 1 ∈ reach[2] → <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="320" y="386" text-anchor="middle" fill="#1a2026" font-size="13">Kahn pops 1, 2, 0 and OR-merges each forwarded set into its dependents;</text>
  <text x="320" y="406" text-anchor="middle" fill="#1a2026" font-size="13">reach[0] = <tspan fill="#4169E1" font-weight="600">{1, 2, 0}</tspan> answers both queries true by one bit test each.</text>
</svg>
