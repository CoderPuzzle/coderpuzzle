<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <!-- nums = [10,2,-10,5,20], k = 2; dp[i] = nums[i] + max(0, dp of last k indices); table rows show the deque of indices (idx:dp) after each step, strictly decreasing by dp; indices 0,1,3,4 form the best subsequence -->
  <g stroke-width="1.5">
    <g fill="#dbe4fb" stroke="#4169E1">
      <rect x="103" y="40" width="74" height="40"/>
      <rect x="193" y="40" width="74" height="40"/>
      <rect x="373" y="40" width="74" height="40"/>
      <rect x="463" y="40" width="74" height="40"/>
    </g>
    <rect x="283" y="40" width="74" height="40" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="140" y="65">10</text><text x="230" y="65">2</text>
    <text x="410" y="65">5</text><text x="500" y="65">20</text>
  </g>
  <text x="320" y="65" text-anchor="middle" font-size="15" font-weight="600" fill="#9aa7b2">-10</text>
  <text x="320" y="102" text-anchor="middle" fill="#5c6b76" font-size="12">dp[4] = 37 comes from the accented cells — the subsequence [10, 2, 5, 20]</text>
  <g fill="#5c6b76" font-size="12">
    <text x="88" y="130" text-anchor="middle">i</text>
    <text x="160" y="130" text-anchor="middle">num</text>
    <text x="262" y="130" text-anchor="middle">max(0, win)</text>
    <text x="356" y="130" text-anchor="middle">dp[i]</text>
    <text x="426" y="130">deque after (idx:dp)</text>
  </g>
  <path d="M 64 138 H 576" stroke="#9aa7b2" stroke-width="0.75"/>
  <rect x="60" y="258" width="520" height="24" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="88" y="162">0</text><text x="160" y="162">10</text><text x="262" y="162">0</text><text x="356" y="162" font-weight="600">10</text><text x="426" y="162" text-anchor="start">0:10</text>
    <text x="88" y="190">1</text><text x="160" y="190">2</text><text x="262" y="190">10</text><text x="356" y="190" font-weight="600">12</text><text x="426" y="190" text-anchor="start">1:12</text>
    <text x="88" y="218">2</text><text x="160" y="218">-10</text><text x="262" y="218">12</text><text x="356" y="218" font-weight="600">2</text><text x="426" y="218" text-anchor="start">1:12&#160;&#160;&#160;2:2</text>
    <text x="88" y="246">3</text><text x="160" y="246">5</text><text x="262" y="246">12</text><text x="356" y="246" font-weight="600">17</text><text x="426" y="246" text-anchor="start">3:17</text>
    <text x="88" y="274">4</text><text x="160" y="274">20</text><text x="262" y="274">17</text><text x="356" y="274" font-size="15" fill="#4169E1" font-weight="600">37</text><text x="426" y="274" text-anchor="start">4:37</text>
  </g>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">The deque falls strictly front to back, so its front is always the window</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">maximum; the sweep ends at dp[4] = 20 + 17 = <tspan fill="#4169E1" font-weight="600">37</tspan>.</text>
</svg>
