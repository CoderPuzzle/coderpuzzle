<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 345" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="500" height="345" fill="#ffffff"/>
  <!-- edges that already point toward 0 -->
  <g stroke="#42525e" stroke-width="1.7">
    <line x1="150" y1="268" x2="150" y2="232" marker-end="url(#ink)"/>
    <line x1="332.8" y1="116.3" x2="267.2" y2="63.7" marker-end="url(#ink)"/>
  </g>
  <!-- edges that must be reversed -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="232.8" y1="63.7" x2="167.2" y2="116.3" marker-end="url(#red)"/>
    <line x1="150" y1="152" x2="150" y2="188" marker-end="url(#red)"/>
    <line x1="350" y1="152" x2="350" y2="188" marker-end="url(#red)"/>
  </g>
  <g stroke="#c0392b" stroke-width="1.6">
    <line x1="196" y1="86" x2="204" y2="94"/><line x1="204" y1="86" x2="196" y2="94"/>
    <line x1="146" y1="166" x2="154" y2="174"/><line x1="154" y1="166" x2="146" y2="174"/>
    <line x1="346" y1="166" x2="354" y2="174"/><line x1="354" y1="166" x2="346" y2="174"/>
  </g>
  <!-- nodes -->
  <g stroke-width="1.7" fill="#ffffff">
    <circle cx="250" cy="50" r="17" stroke="#42525e"/>
    <circle cx="150" cy="130" r="17" stroke="#42525e"/>
    <circle cx="350" cy="130" r="17" stroke="#42525e"/>
    <circle cx="150" cy="210" r="17" stroke="#42525e"/>
    <circle cx="350" cy="210" r="17" stroke="#42525e"/>
    <circle cx="150" cy="290" r="17" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="250" y="55">0</text>
    <text x="150" y="135">1</text>
    <text x="350" y="135">4</text>
    <text x="150" y="215">3</text>
    <text x="350" y="215">5</text>
    <text x="150" y="295">2</text>
  </g>
  <text x="440" y="55" fill="#5c6b76" font-size="12">capital</text>
  <text x="250" y="332" text-anchor="middle" fill="#1a2026" font-weight="600">3 red edges (0→1, 1→3, 4→5) point away from 0 and must flip</text>
</svg>
