<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 345" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="500" height="345" fill="#ffffff"/>
  <!-- edges already fine -->
  <g stroke="#42525e" stroke-width="1.7">
    <line x1="250" y1="103" x2="250" y2="67" marker-end="url(#ink)"/>
    <line x1="318" y1="205" x2="182" y2="205" marker-end="url(#ink)"/>
  </g>
  <!-- edges to reverse -->
  <g stroke="#c0392b" stroke-width="2">
    <line x1="233.6" y1="139.6" x2="176.4" y2="190.4" marker-end="url(#red)"/>
    <line x1="340" y1="227" x2="340" y2="263" marker-end="url(#red)"/>
  </g>
  <g stroke="#c0392b" stroke-width="1.6">
    <line x1="201" y1="161" x2="209" y2="169"/><line x1="209" y1="161" x2="201" y2="169"/>
    <line x1="336" y1="241" x2="344" y2="249"/><line x1="344" y1="241" x2="336" y2="249"/>
  </g>
  <g stroke-width="1.7" fill="#ffffff">
    <circle cx="250" cy="45" r="17" stroke="#42525e"/>
    <circle cx="250" cy="125" r="17" stroke="#42525e"/>
    <circle cx="160" cy="205" r="17" stroke="#42525e"/>
    <circle cx="340" cy="205" r="17" stroke="#42525e"/>
    <circle cx="340" cy="285" r="17" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="250" y="50">0</text>
    <text x="250" y="130">1</text>
    <text x="160" y="210">2</text>
    <text x="340" y="210">3</text>
    <text x="340" y="290">4</text>
  </g>
  <text x="440" y="50" fill="#5c6b76" font-size="12">capital</text>
  <text x="250" y="332" text-anchor="middle" fill="#1a2026" font-weight="600">2 red edges (1→2, 3→4) point away from 0 and must flip</text>
</svg>
