<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- mat = [[1,3,11],[2,4,6]], k = 5; mat cells 60x34 at (60,44); sum grid cells 66x42, x = 100+82i, y = 168+58j; pop log at x 360 -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">mat = [[1, 3, 11], [2, 4, 6]],  k = 5</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="60" y="44" width="60" height="34"/><rect x="124" y="44" width="60" height="34"/><rect x="188" y="44" width="60" height="34"/>
    <rect x="60" y="82" width="60" height="34"/><rect x="124" y="82" width="60" height="34"/><rect x="188" y="82" width="60" height="34"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="90" y="66">1</text><text x="154" y="66">3</text><text x="218" y="66">11</text>
    <text x="90" y="104">2</text><text x="154" y="104">4</text><text x="218" y="104">6</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="54" y="65">row 0</text><text x="54" y="103">row 1</text>
  </g>
  <text x="40" y="150" fill="#5c6b76" font-size="12.5">sum grid over index tuples (i, j); badges = pop order</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="133" y="162">i = 0</text><text x="215" y="162">i = 1</text><text x="297" y="162">i = 2</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="92" y="193">j = 0</text><text x="92" y="251">j = 1</text><text x="92" y="309">j = 2</text>
  </g>
  <!-- grid row j=0 -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="100" y="168" width="66" height="42" fill="#dbe4fb"/>
    <rect x="182" y="168" width="66" height="42" fill="#dbe4fb"/>
    <rect x="264" y="168" width="66" height="42" fill="#f0f3f7"/>
    <rect x="100" y="226" width="66" height="42" fill="#dbe4fb"/>
    <rect x="182" y="226" width="66" height="42" fill="#dbe4fb"/>
    <rect x="264" y="226" width="66" height="42" fill="#f0f3f7"/>
    <rect x="100" y="284" width="66" height="42" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
    <rect x="182" y="284" width="66" height="42" fill="#f0f3f7"/>
    <rect x="264" y="284" width="66" height="42" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle">
    <text x="133" y="188" font-weight="600">3</text><text x="215" y="188" font-weight="600">5</text><text x="297" y="188" fill="#9aa7b2">13</text>
    <text x="133" y="246" font-weight="600">5</text><text x="215" y="246" font-weight="600">7</text><text x="297" y="246" fill="#9aa7b2">15</text>
    <text x="133" y="304" font-weight="600" fill="#4169E1">7</text><text x="215" y="304" fill="#9aa7b2">9</text><text x="297" y="304" fill="#9aa7b2">17</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="9">
    <text x="133" y="201">(0,0)</text><text x="215" y="201">(1,0)</text><text x="297" y="201">(2,0)</text>
    <text x="133" y="259">(0,1)</text><text x="215" y="259">(1,1)</text><text x="297" y="259">(2,1)</text>
    <text x="133" y="317">(0,2)</text><text x="215" y="317">(1,2)</text><text x="297" y="317">(2,2)</text>
  </g>
  <!-- pop-order badges on the four popped tuples -->
  <g>
    <circle cx="108" cy="176" r="8.5" fill="#4169E1"/><text x="108" y="179.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">1</text>
    <circle cx="190" cy="176" r="8.5" fill="#4169E1"/><text x="190" y="179.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">2</text>
    <circle cx="108" cy="234" r="8.5" fill="#4169E1"/><text x="108" y="237.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">3</text>
    <circle cx="190" cy="234" r="8.5" fill="#4169E1"/><text x="190" y="237.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">4</text>
  </g>
  <!-- pop log -->
  <g fill="#1a2026" font-size="12">
    <text x="360" y="184">pop 1: (0,0) = 3 → push (1,0) 5, (0,1) 5</text>
    <text x="360" y="212">pop 2: (1,0) = 5 → push (2,0) 13, (1,1) 7</text>
    <text x="360" y="240">pop 3: (0,1) = 5 → push (0,2) 7, skip (1,1)</text>
    <text x="360" y="268">pop 4: (1,1) = 7 → push (1,2) 9, (2,1) 15</text>
    <text x="360" y="300" font-weight="600" fill="#4169E1">pop 5: (0,2) = 7 ← the answer</text>
  </g>
  <!-- pop-5 arrow runs under the grid and points up into the (0,2) = 7 cell (x 100-166, bottom y 326) -->
  <path d="M 356 300 Q 352 342 300 344 L 152 344 Q 134 344 134 327" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="372" text-anchor="middle" fill="#1a2026" font-size="13">The heap pops sums 3, 5, 5, 7; each pop pushes the tuples that advance one row's index.</text>
  <text x="330" y="394" text-anchor="middle" fill="#1a2026" font-size="13">The 5th pop is <tspan fill="#4169E1" font-weight="600">7</tspan> — the kth smallest sum for k = 5.</text>
</svg>
