<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- darts = [[-3,0],[3,0],[2,6],[5,4],[0,9],[7,8]], r = 5; origin (262,262), 22 px/unit -->
  <!-- pair (-3,0),(3,0): d = 6, h = sqrt(25-9) = 4 -> centers (0,4) and (0,-4), both r = 110 px -->
  <!-- circle (0,4) covers (-3,0),(3,0),(2,6),(5,4),(0,9) = 5; circle (0,-4) covers only the pair = 2 -->
  <circle cx="262" cy="174" r="110" fill="#dbe4fb" fill-opacity="0.4"/>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 130 262 H 446" marker-end="url(#arrowG)"/>
    <path d="M 262 486 V 40" marker-end="url(#arrowG)"/>
  </g>
  <circle cx="262" cy="350" r="110" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="262" cy="174" r="110" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <text x="262" y="28" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">perpendicular bisector (x = 0)</text>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 274 254 V 184" marker-end="url(#arrow)"/>
    <path d="M 274 270 V 340" marker-end="url(#arrow)"/>
  </g>
  <text x="282" y="224" fill="#4169E1" font-size="12.5" font-weight="600">h = 4</text>
  <text x="282" y="316" fill="#4169E1" font-size="12.5" font-weight="600">h = 4</text>
  <circle cx="262" cy="262" r="4" fill="#1a2026"/>
  <circle cx="262" cy="174" r="4" fill="#4169E1"/>
  <circle cx="262" cy="350" r="4" fill="#9aa7b2"/>
  <g fill="#4169E1" stroke="#1a2026" stroke-width="2">
    <circle cx="196" cy="262" r="5.5"/>
    <circle cx="328" cy="262" r="5.5"/>
  </g>
  <g fill="#4169E1">
    <circle cx="306" cy="130" r="5.5"/>
    <circle cx="372" cy="174" r="5.5"/>
    <circle cx="262" cy="64" r="5.5"/>
  </g>
  <circle cx="416" cy="86" r="5.5" fill="#9aa7b2"/>
  <g font-size="12.5" fill="#1a2026">
    <text x="186" y="296">(-3, 0)</text>
    <text x="318" y="296" text-anchor="end">(3, 0)</text>
    <text x="316" y="128">(2, 6)</text>
    <text x="382" y="182">(5, 4)</text>
    <text x="250" y="56" text-anchor="end">(0, 9)</text>
    <text x="426" y="90" fill="#5c6b76">(7, 8)</text>
  </g>
  <text x="368" y="246" fill="#4169E1" font-size="12.5" font-weight="600">pair</text>
  <path d="M 364 251 L 338 260" stroke="#4169E1" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <g fill="#4169E1" stroke="#4169E1" stroke-width="1.5">
    <path d="M 464 145 L 344 92" marker-end="url(#arrow)"/>
  </g>
  <g fill="#9aa7b2" stroke="#9aa7b2" stroke-width="1.5">
    <path d="M 464 325 L 378 345" marker-end="url(#arrowM)"/>
  </g>
  <text x="470" y="150" font-size="13.5" font-weight="600" fill="#4169E1">circle (0, 4)</text>
  <text x="470" y="170" font-size="13" fill="#4169E1">covers 5 darts</text>
  <text x="470" y="330" font-size="13.5" font-weight="600" fill="#9aa7b2">circle (0, -4)</text>
  <text x="470" y="350" font-size="13" fill="#9aa7b2">covers 2 darts</text>
  <text x="40" y="522" font-size="13" fill="#1a2026">Pair (-3,0),(3,0): d = 6 so h = sqrt(25 - 9) = 4, centers (0,4) and (0,-4);</text>
  <text x="40" y="542" font-size="13" fill="#1a2026">the circle at (0,4) covers <tspan fill="#4169E1" font-weight="600">5</tspan> darts — all but (7,8) — the best found.</text>
</svg>
