<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 432" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="432" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- pizza = ["A..","AAA","..."], k = 3; apple counts has(r,c): [[4,2,1],[3,2,1],[0,0,0]]; pizza cells 54x40 at (78,54), table at (400,54) -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">pizza = ["A..", "AAA", "..."],  k = 3</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="105" y="48">c0</text><text x="159" y="48">c1</text><text x="213" y="48">c2</text>
    <text x="427" y="48">c0</text><text x="481" y="48">c1</text><text x="535" y="48">c2</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="10">
    <text x="72" y="79">r0</text><text x="72" y="119">r1</text><text x="72" y="159">r2</text>
    <text x="394" y="79">r0</text><text x="394" y="119">r1</text><text x="394" y="159">r2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="78" y="54" width="54" height="40"/><rect x="132" y="54" width="54" height="40"/><rect x="186" y="54" width="54" height="40"/>
    <rect x="78" y="94" width="54" height="40"/><rect x="132" y="94" width="54" height="40"/><rect x="186" y="94" width="54" height="40"/>
    <rect x="78" y="134" width="54" height="40"/><rect x="132" y="134" width="54" height="40"/><rect x="186" y="134" width="54" height="40"/>
    <rect x="400" y="54" width="54" height="40"/><rect x="454" y="54" width="54" height="40"/><rect x="508" y="54" width="54" height="40"/>
    <rect x="400" y="94" width="54" height="40"/><rect x="454" y="94" width="54" height="40"/><rect x="508" y="94" width="54" height="40"/>
    <rect x="400" y="134" width="54" height="40"/><rect x="454" y="134" width="54" height="40"/><rect x="508" y="134" width="54" height="40"/>
  </g>
  <g text-anchor="middle">
    <text x="105" y="79" font-weight="600">A</text><text x="159" y="79" fill="#9aa7b2">.</text><text x="213" y="79" fill="#9aa7b2">.</text>
    <text x="105" y="119" font-weight="600">A</text><text x="159" y="119" font-weight="600">A</text><text x="213" y="119" font-weight="600">A</text>
    <text x="105" y="159" fill="#9aa7b2">.</text><text x="159" y="159" fill="#9aa7b2">.</text><text x="213" y="159" fill="#9aa7b2">.</text>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="427" y="79">4</text><text x="481" y="79">2</text><text x="535" y="79">1</text>
    <text x="427" y="119">3</text><text x="481" y="119">2</text><text x="535" y="119">1</text>
    <text x="427" y="159" fill="#9aa7b2">0</text><text x="481" y="159" fill="#9aa7b2">0</text><text x="535" y="159" fill="#9aa7b2">0</text>
  </g>
  <text x="470" y="212" text-anchor="middle" fill="#5c6b76" font-size="12">apples left in (r, c) .. (2, 2)</text>
  <text x="40" y="212" fill="#5c6b76" font-size="12">a cut is valid when the handed strip and the kept</text>
  <text x="40" y="228" fill="#5c6b76" font-size="12">piece both read &gt; 0 in this table</text>
  <!-- root memo state -->
  <rect x="66" y="252" width="128" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="130" y="279" text-anchor="middle" font-weight="600" fill="#1a2026">dp(0, 0, 2)</text>
  <!-- the four first cuts -->
  <path d="M 196 264 Q 250 252 296 260" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <path d="M 196 272 Q 250 280 296 296" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 194 280 Q 250 316 296 332" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <path d="M 192 290 Q 250 350 296 368" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-size="12.5">
    <text x="310" y="264" fill="#1a2026">horizontal above row 1 → dp(1,0,1) = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="310" y="300" fill="#5c6b76">horizontal above row 2 → kept (2,0) has no apple → 0</text>
    <text x="310" y="336" fill="#1a2026">vertical left of col 1 → dp(0,1,1) = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="310" y="372" fill="#5c6b76">vertical left of col 2 → dp(0,2,1) = 0</text>
  </g>
  <text x="330" y="408" text-anchor="middle" fill="#1a2026" font-size="13">dp(0,0,2) = 2 + 0 + 1 + 0 = <tspan fill="#4169E1" font-weight="600">3</tspan> ways to hand pieces 1 and 2 out.</text>
</svg>
