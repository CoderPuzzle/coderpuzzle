<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- arr = [2,3,1,6,7]; prefix xor P: P[-1]=0, P[0..4] = 2,1,0,6,1; cells 80x44 at x = 110+96i, y 46; arcs pair equal P values -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="110" y="46" width="80" height="44"/><rect x="206" y="46" width="80" height="44"/><rect x="302" y="46" width="80" height="44"/>
    <rect x="398" y="46" width="80" height="44"/><rect x="494" y="46" width="80" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="150" y="74">2</text><text x="246" y="74">3</text><text x="342" y="74">1</text>
    <text x="438" y="74">6</text><text x="534" y="74">7</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="54" y="112">-1</text><text x="150" y="112">0</text><text x="246" y="112">1</text>
    <text x="342" y="112">2</text><text x="438" y="112">3</text><text x="534" y="112">4</text>
  </g>
  <text x="20" y="143" fill="#5c6b76" font-size="12">P</text>
  <circle cx="54" cy="138" r="15" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="54" y="143" text-anchor="middle" font-weight="600" fill="#4169E1">0</text>
  <g text-anchor="middle" font-weight="600">
    <text x="150" y="143" fill="#1a2026">2</text>
    <text x="246" y="143" fill="#4169E1">1</text>
    <text x="342" y="143" fill="#4169E1">0</text>
    <text x="438" y="143" fill="#1a2026">6</text>
    <text x="534" y="143" fill="#4169E1">1</text>
  </g>
  <!-- arc pairing P[-1]=0 with P[2]=0 -->
  <path d="M 54 155 C 100 218, 300 218, 342 149" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="220" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">0 = 0 → +2 triplets</text>
  <!-- arc pairing P[1]=1 with P[4]=1 -->
  <path d="M 246 149 C 300 280, 480 280, 534 149" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="268" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">1 = 1 → +2 triplets</text>
  <text x="330" y="310" text-anchor="middle" fill="#1a2026" font-size="13">The running xor repeats: 0 at positions −1 and 2, 1 at positions 1 and 4.</text>
  <text x="330" y="332" text-anchor="middle" fill="#1a2026" font-size="13">Each repeated pair spans g = 3 positions and adds g − 1 = 2 triplets — total <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
