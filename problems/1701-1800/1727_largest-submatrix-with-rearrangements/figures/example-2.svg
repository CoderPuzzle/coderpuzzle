<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 110" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="110" fill="#ffffff"/>
  <!-- before: 1 x 5 -->
  <g stroke="#1a2026" stroke-width="1.2">
    <rect x="50" y="30" width="40" height="40" fill="#ffffff"/>
    <rect x="90" y="30" width="40" height="40" fill="#dde3ec"/>
    <rect x="130" y="30" width="40" height="40" fill="#ffffff"/>
    <rect x="170" y="30" width="40" height="40" fill="#dde3ec"/>
    <rect x="210" y="30" width="40" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="70" y="55">1</text><text x="110" y="55">0</text><text x="150" y="55">1</text><text x="190" y="55">0</text><text x="230" y="55">1</text>
  </g>
  <!-- arrow -->
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <line x1="285" y1="50" x2="335" y2="50" stroke="#1a2026" stroke-width="1.8" marker-end="url(#a2)"/>
  <!-- after: 1s grouped -->
  <g stroke="#1a2026" stroke-width="1.2">
    <rect x="370" y="30" width="40" height="40" fill="#e6ecfb"/>
    <rect x="410" y="30" width="40" height="40" fill="#e6ecfb"/>
    <rect x="450" y="30" width="40" height="40" fill="#e6ecfb"/>
    <rect x="490" y="30" width="40" height="40" fill="#dde3ec"/>
    <rect x="530" y="30" width="40" height="40" fill="#dde3ec"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="390" y="55">1</text><text x="430" y="55">1</text><text x="470" y="55">1</text><text x="510" y="55">0</text><text x="550" y="55">0</text>
  </g>
  <rect x="369" y="29" width="122" height="42" fill="none" stroke="#4169E1" stroke-width="3"/>
  <text x="310" y="97" text-anchor="middle" fill="#5c6b76" font-size="12.5">the three columns holding a 1 are grouped together: area 3</text>
</svg>
