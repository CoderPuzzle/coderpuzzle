<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="306" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- matrix = [[0,0,1],[1,1,1],[1,0,1]]; matrix cells 46x40 at (56,92), pitch (46,40).
       Per row: heights[j] (cells 36x30 at x=306), sorted desc (at x=454), areas ordered[i]*(i+1).
       Zeros in #9aa7b2; best area 2*2 = 4 at row 2 accented; dashed rects mark cols 0 and 2, rows 1-2. -->
  <text x="340" y="48" text-anchor="middle" fill="#5c6b76" font-size="12.5">heights[j] = run of 1s ending at the row; sort each row descending, area = ordered[i]·(i+1)</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="56" y="92" width="46" height="40"/><rect x="102" y="92" width="46" height="40"/><rect x="148" y="92" width="46" height="40"/>
    <rect x="56" y="132" width="46" height="40"/><rect x="102" y="132" width="46" height="40"/><rect x="148" y="132" width="46" height="40"/>
    <rect x="56" y="172" width="46" height="40"/><rect x="102" y="172" width="46" height="40"/><rect x="148" y="172" width="46" height="40"/>
  </g>
  <rect x="56" y="132" width="46" height="80" fill="none" stroke="#4169E1" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="148" y="132" width="46" height="80" fill="none" stroke="#4169E1" stroke-width="2" stroke-dasharray="5 3"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="79" y="86">j=0</text><text x="125" y="86">j=1</text><text x="171" y="86">j=2</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="79" y="117">0</text><text x="125" y="117">0</text><text x="171" y="117">1</text>
    <text x="79" y="157">1</text><text x="125" y="157">1</text><text x="171" y="157">1</text>
    <text x="79" y="197">1</text><text x="125" y="197">0</text><text x="171" y="197">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="364" y="86">heights[j]</text>
    <text x="514" y="86">sorted desc</text>
    <text x="622" y="86">areas h·(i+1)</text>
  </g>
  <g stroke="#1a2026" stroke-width="1.3" fill="#ffffff">
    <rect x="306" y="92" width="36" height="30"/><rect x="348" y="92" width="36" height="30"/><rect x="390" y="92" width="36" height="30"/>
    <rect x="306" y="132" width="36" height="30"/><rect x="348" y="132" width="36" height="30"/><rect x="390" y="132" width="36" height="30"/>
    <rect x="306" y="172" width="36" height="30"/><rect x="348" y="172" width="36" height="30"/><rect x="390" y="172" width="36" height="30"/>
    <rect x="454" y="92" width="36" height="30"/><rect x="496" y="92" width="36" height="30"/><rect x="538" y="92" width="36" height="30"/>
    <rect x="454" y="132" width="36" height="30"/><rect x="496" y="132" width="36" height="30"/><rect x="538" y="132" width="36" height="30"/>
    <rect x="454" y="172" width="36" height="30"/><rect x="496" y="172" width="36" height="30"/><rect x="538" y="172" width="36" height="30"/>
  </g>
  <g stroke="#5c6b76" stroke-width="1.4" fill="none">
    <path d="M 428 107 H 446" marker-end="url(#arrow)"/>
    <path d="M 428 147 H 446" marker-end="url(#arrow)"/>
    <path d="M 428 187 H 446" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="start" fill="#5c6b76" font-size="12.5">
    <text x="214" y="112">row 0 = [0,0,1]</text>
    <text x="214" y="152">row 1 = [1,1,1]</text>
    <text x="214" y="192">row 2 = [1,0,1]</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="324" y="112" fill="#9aa7b2">0</text><text x="366" y="112" fill="#9aa7b2">0</text><text x="408" y="112" fill="#1a2026">1</text>
    <text x="324" y="152" fill="#1a2026">1</text><text x="366" y="152" fill="#1a2026">1</text><text x="408" y="152" fill="#1a2026">2</text>
    <text x="324" y="192" fill="#1a2026">2</text><text x="366" y="192" fill="#9aa7b2">0</text><text x="408" y="192" fill="#1a2026">3</text>
    <text x="472" y="112" fill="#1a2026">1</text><text x="514" y="112" fill="#9aa7b2">0</text><text x="556" y="112" fill="#9aa7b2">0</text>
    <text x="472" y="152" fill="#1a2026">2</text><text x="514" y="152" fill="#1a2026">1</text><text x="556" y="152" fill="#1a2026">1</text>
    <text x="472" y="192" fill="#1a2026">3</text><text x="514" y="192" fill="#1a2026">2</text><text x="556" y="192" fill="#9aa7b2">0</text>
  </g>
  <g text-anchor="start" font-size="12.5">
    <text x="584" y="112" fill="#1a2026">1·1</text>
    <text x="584" y="152" fill="#1a2026">2·1 1·2 1·3</text>
    <text x="584" y="192" fill="#1a2026">3·1 <tspan fill="#4169E1" font-weight="600">2·2 = 4</tspan></text>
  </g>
  <text x="340" y="256" text-anchor="middle" fill="#1a2026" font-size="13">Row 2's [2,0,3] sorts to [3,2,0]; the two tallest columns give the best area <tspan fill="#4169E1" font-weight="600">2·2 = 4</tspan>, beating</text>
  <text x="340" y="278" text-anchor="middle" fill="#1a2026" font-size="13">row 1's best 1·3 = 3. The dashed cells mark those two columns (0 and 2) over rows 1–2.</text>
</svg>
