<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="210" fill="#ffffff"/>
  <!-- before -->
  <g stroke="#1a2026" stroke-width="1.2">
    <rect x="60" y="30" width="40" height="40" fill="#ffffff"/>
    <rect x="100" y="30" width="40" height="40" fill="#ffffff"/>
    <rect x="140" y="30" width="40" height="40" fill="#dde3ec"/>
    <rect x="60" y="70" width="40" height="40" fill="#ffffff"/>
    <rect x="100" y="70" width="40" height="40" fill="#ffffff"/>
    <rect x="140" y="70" width="40" height="40" fill="#ffffff"/>
    <rect x="60" y="110" width="40" height="40" fill="#ffffff"/>
    <rect x="100" y="110" width="40" height="40" fill="#dde3ec"/>
    <rect x="140" y="110" width="40" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="80" y="55">0</text><text x="120" y="55">0</text><text x="160" y="55">1</text>
    <text x="80" y="95">1</text><text x="120" y="95">1</text><text x="160" y="95">1</text>
    <text x="80" y="135">1</text><text x="120" y="135">0</text><text x="160" y="135">1</text>
  </g>
  <!-- arrow -->
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <line x1="220" y1="90" x2="270" y2="90" stroke="#1a2026" stroke-width="1.8" marker-end="url(#a1)"/>
  <!-- after: columns reordered [2,0,1] -->
  <g stroke="#1a2026" stroke-width="1.2">
    <rect x="320" y="30" width="40" height="40" fill="#ffffff"/>
    <rect x="360" y="30" width="40" height="40" fill="#ffffff"/>
    <rect x="400" y="30" width="40" height="40" fill="#dde3ec"/>
    <rect x="320" y="70" width="40" height="40" fill="#e6ecfb"/>
    <rect x="360" y="70" width="40" height="40" fill="#e6ecfb"/>
    <rect x="400" y="70" width="40" height="40" fill="#ffffff"/>
    <rect x="320" y="110" width="40" height="40" fill="#e6ecfb"/>
    <rect x="360" y="110" width="40" height="40" fill="#e6ecfb"/>
    <rect x="400" y="110" width="40" height="40" fill="#dde3ec"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="340" y="55">1</text><text x="380" y="55">0</text><text x="420" y="55">0</text>
    <text x="340" y="95">1</text><text x="380" y="95">1</text><text x="420" y="95">1</text>
    <text x="340" y="135">1</text><text x="380" y="135">1</text><text x="420" y="135">0</text>
  </g>
  <rect x="319" y="69" width="82" height="82" fill="none" stroke="#4169E1" stroke-width="3"/>
  <text x="280" y="190" text-anchor="middle" fill="#5c6b76" font-size="12.5">after rearranging columns, the highlighted 2 × 2 block of 1s has area 4</text>
</svg>
