<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <!-- flowers = [1,2,3,1,2]; cells 72x44 pitch 80 from x=124 at y=64; pair brackets:
       value 1 spans i = 0..3 (sum 2*1 + 2 + 3 = 7), value 2 spans i = 1..4 (sum 2*2 + 3 + 1 = 8);
       garden strip cells 44x38 pitch 50 from x=140 at y=214 -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="124" y="64" width="72" height="44"/><rect x="204" y="64" width="72" height="44"/>
    <rect x="284" y="64" width="72" height="44"/><rect x="364" y="64" width="72" height="44"/>
    <rect x="444" y="64" width="72" height="44"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="160" y="91">1</text><text x="240" y="91">2</text><text x="320" y="91">3</text>
    <text x="400" y="91">1</text><text x="480" y="91">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="160" y="126">i = 0</text><text x="240" y="126">i = 1</text><text x="320" y="126">i = 2</text>
    <text x="400" y="126">i = 3</text><text x="480" y="126">i = 4</text>
  </g>
  <!-- bracket: equal-value pair 1 at i = 0..3, garden 1 + 2 + 3 + 1 = 2*1 + 2 + 3 = 7 -->
  <path d="M 160 58 V 46 H 400 V 58" fill="none" stroke="#42525e" stroke-width="1.6"/>
  <text x="280" y="36" text-anchor="middle" fill="#5c6b76" font-size="12.5">value 1: 2·1 + 2 + 3 = 7</text>
  <!-- bracket: equal-value pair 2 at i = 1..4, garden 2 + 3 + 1 + 2 = 2*2 + 3 + 1 = 8 (best) -->
  <path d="M 240 136 V 148 H 480 V 136" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <text x="360" y="168" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">value 2: 2·2 + 3 + 1 = 8</text>
  <text x="320" y="196" text-anchor="middle" fill="#5c6b76" font-size="12.5">every middle here is strictly positive (2, 3 and 3, 1); a negative middle would be dropped</text>
  <!-- best garden strip -->
  <text x="60" y="238" fill="#5c6b76" font-size="12.5">garden</text>
  <g stroke="#4169E1" stroke-width="1.4" fill="#dbe4fb">
    <rect x="140" y="214" width="44" height="38"/><rect x="190" y="214" width="44" height="38"/>
    <rect x="240" y="214" width="44" height="38"/><rect x="290" y="214" width="44" height="38"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="162" y="238">2</text><text x="212" y="238">3</text><text x="262" y="238">1</text><text x="312" y="238">2</text>
  </g>
  <text x="350" y="238" fill="#1a2026" font-size="13.5">= 2 + 3 + 1 + 2 = <tspan fill="#4169E1" font-weight="600">8</tspan></text>
  <text x="320" y="288" text-anchor="middle" fill="#1a2026" font-size="13">Each equal-value pair keeps its two endpoints plus the positive flowers between:</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">value 1 closes for 7, value 2 for <tspan fill="#4169E1" font-weight="600">8</tspan> — the answer is the garden [2, 3, 1, 2].</text>
</svg>
