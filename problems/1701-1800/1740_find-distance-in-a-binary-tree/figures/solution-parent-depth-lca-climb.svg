<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree = [3,5,1,6,2,0,8,null,null,7,4]; circles r=19; each label is depth,parent from the pre-order build; query p=5, q=0 -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="200" y1="146" x2="130" y2="226"/>
    <line x1="200" y1="146" x2="270" y2="226"/>
    <line x1="440" y1="146" x2="530" y2="226"/>
    <line x1="270" y1="226" x2="200" y2="306"/>
    <line x1="270" y1="226" x2="340" y2="306"/>
  </g>
  <g stroke="#4169E1" stroke-width="3">
    <line x1="200" y1="146" x2="320" y2="66"/>
    <line x1="320" y1="66" x2="440" y2="146"/>
    <line x1="440" y1="146" x2="390" y2="226"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <line x1="408" y1="220" x2="442" y2="165" marker-end="url(#arrow)"/>
    <line x1="219" y1="148" x2="314" y2="84" marker-end="url(#arrow)"/>
    <line x1="434" y1="128" x2="339" y2="64" marker-end="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#4169E1" stroke-width="2">
    <circle cx="200" cy="146" r="19"/>
    <circle cx="440" cy="146" r="19"/>
    <circle cx="390" cy="226" r="19"/>
  </g>
  <circle cx="320" cy="66" r="19" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g fill="#ffffff" stroke="#9aa7b2" stroke-width="1.5">
    <circle cx="130" cy="226" r="19"/>
    <circle cx="270" cy="226" r="19"/>
    <circle cx="530" cy="226" r="19"/>
    <circle cx="200" cy="306" r="19"/>
    <circle cx="340" cy="306" r="19"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="320" y="71" fill="#1a2026">3</text>
    <text x="200" y="151" fill="#1a2026">5</text>
    <text x="440" y="151" fill="#1a2026">1</text>
    <text x="390" y="231" fill="#1a2026">0</text>
    <text x="130" y="231" fill="#5c6b76">6</text>
    <text x="270" y="231" fill="#5c6b76">2</text>
    <text x="530" y="231" fill="#5c6b76">8</text>
    <text x="200" y="311" fill="#5c6b76">7</text>
    <text x="340" y="311" fill="#5c6b76">4</text>
  </g>
  <text x="200" y="122" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">p</text>
  <text x="372" y="200" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">q</text>
  <g fill="#5c6b76" font-size="11.5">
    <text x="320" y="32" text-anchor="middle">d0, root</text>
    <text x="172" y="150" text-anchor="end">d1, p3</text>
    <text x="468" y="150">d1, p3</text>
    <text x="102" y="230" text-anchor="end">d2, p5</text>
    <text x="298" y="230">d2, p5</text>
    <text x="390" y="262" text-anchor="middle">d2, p1</text>
    <text x="558" y="230">d2, p1</text>
    <text x="172" y="310" text-anchor="end">d3, p2</text>
    <text x="368" y="310">d3, p2</text>
  </g>
  <text x="452" y="192" fill="#4169E1" font-size="11.5" font-weight="600">lift q</text>
  <text x="320" y="152" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">lockstep climb</text>
  <text x="320" y="356" text-anchor="middle" fill="#1a2026" font-size="13">Lift q = 0 onto 1, then climb 5 and 1 in lockstep — they meet at LCA <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
  <text x="320" y="376" text-anchor="middle" fill="#1a2026" font-size="13">depth[5] + depth[0] - 2·depth[3] = 1 + 2 - 0: the path 5 → 3 → 1 → 0 has <tspan fill="#4169E1" font-weight="600">3</tspan> edges.</text>
</svg>
