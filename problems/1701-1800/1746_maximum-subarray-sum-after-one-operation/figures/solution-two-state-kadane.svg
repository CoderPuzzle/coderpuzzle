<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [2,-1,-4,-3]; dp0 = [2,1,-3,-6]; dp1 = [4,3,17,14]; dp1[2] = max(16, 1+16, 3-4) = 17 -->
  <text x="270" y="40" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">best subarray 2, -1, 16 sums to 17</text>
  <path d="M 124 62 L 124 52 L 416 52 L 416 62" fill="none" stroke="#4169E1" stroke-width="2"/>
  <rect x="124" y="70" width="92" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <rect x="224" y="70" width="92" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <rect x="324" y="70" width="92" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <rect x="424" y="70" width="92" height="40" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="170" y="88">2</text><text x="270" y="88">-1</text><text x="370" y="88">-4</text><text x="470" y="88">-3</text>
  </g>
  <text x="370" y="104" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">squared: 16</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="170" y="128">i = 0</text><text x="270" y="128">i = 1</text><text x="370" y="128">i = 2</text><text x="470" y="128">i = 3</text>
  </g>
  <text x="100" y="162" text-anchor="end" fill="#5c6b76" font-size="12.5">dp0</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="170" y="162">2</text><text x="270" y="162">1</text><text x="370" y="162">-3</text><text x="470" y="162">-6</text>
  </g>
  <text x="100" y="202" text-anchor="end" fill="#5c6b76" font-size="12.5">dp1</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="170" y="202">4</text><text x="270" y="202">3</text><text x="370" y="202" fill="#4169E1" font-size="16">17</text><text x="470" y="202">14</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <line x1="394" y1="114" x2="394" y2="186" marker-end="url(#arrow)"/>
    <line x1="284" y1="166" x2="346" y2="192" marker-end="url(#arrow)"/>
    <line x1="284" y1="202" x2="344" y2="202" marker-end="url(#arrow)"/>
  </g>
  <text x="370" y="232" text-anchor="middle" fill="#5c6b76" font-size="12.5">dp1[2] = max(16, 1 + 16, 3 - 4) = <tspan fill="#4169E1" font-weight="600">17</tspan></text>
  <text x="320" y="282" text-anchor="middle" fill="#1a2026" font-size="13">Exactly one element gets squared: dp1[i] = max(x·x, dp0[i-1] + x·x, dp1[i-1] + x).</text>
  <text x="320" y="302" text-anchor="middle" fill="#1a2026" font-size="13">Squaring -4 at i = 2 turns it into 16, and the answer is the best dp1: <tspan fill="#4169E1" font-weight="600">17</tspan>.</text>
</svg>
