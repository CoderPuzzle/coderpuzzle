<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 406" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="406" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- binary = "000110"; zero seats {0,1,2,5}, first = 0, z = 4; cells 48x30 at x = 130 + 52j;
       ladder: fuse(0,1) fuse(1,2) slide 5->3 fuse(2,3) => lone zero at first+z-1 = 3, output 111011 -->
  <text x="320" y="22" text-anchor="middle" fill="#5c6b76" font-size="12.5">Herding the zeros of 000110 into one seat (first = 0, z = 4)</text>
  <!-- ladder arrows -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 154 72 V 101" marker-end="url(#arrow)"/>
    <path d="M 154 136 V 165" marker-end="url(#arrow)"/>
    <path d="M 154 200 V 229" marker-end="url(#arrow)"/>
    <path d="M 154 264 V 293" marker-end="url(#arrow)"/>
  </g>
  <!-- row zero-sets, left -->
  <g font-size="12" fill="#5c6b76">
    <text x="14" y="59"><tspan font-weight="600" fill="#1a2026">before</tspan>  {0, 1, 2, 5}</text>
    <text x="14" y="123">{1, 2, 5}</text>
    <text x="14" y="187">{2, 5}</text>
    <text x="14" y="251">{2, 3}</text>
    <text x="14" y="315"><tspan font-weight="600" fill="#1a2026">after</tspan>  {3}</text>
  </g>
  <!-- zero cells -->
  <g stroke="#4169E1" stroke-width="1.4" fill="#dbe4fb">
    <rect x="130" y="40" width="48" height="30"/><rect x="182" y="40" width="48" height="30"/><rect x="234" y="40" width="48" height="30"/>
    <rect x="390" y="40" width="48" height="30"/>
    <rect x="182" y="104" width="48" height="30"/><rect x="234" y="104" width="48" height="30"/>
    <rect x="390" y="104" width="48" height="30"/>
    <rect x="234" y="168" width="48" height="30"/>
    <rect x="390" y="168" width="48" height="30"/>
    <rect x="234" y="232" width="48" height="30"/><rect x="286" y="232" width="48" height="30"/>
    <rect x="286" y="296" width="48" height="30"/>
  </g>
  <!-- one cells -->
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="286" y="40" width="48" height="30"/><rect x="338" y="40" width="48" height="30"/>
    <rect x="130" y="104" width="48" height="30"/><rect x="286" y="104" width="48" height="30"/><rect x="338" y="104" width="48" height="30"/>
    <rect x="130" y="168" width="48" height="30"/><rect x="182" y="168" width="48" height="30"/><rect x="286" y="168" width="48" height="30"/><rect x="338" y="168" width="48" height="30"/>
    <rect x="130" y="232" width="48" height="30"/><rect x="182" y="232" width="48" height="30"/><rect x="338" y="232" width="48" height="30"/><rect x="390" y="232" width="48" height="30"/>
    <rect x="130" y="296" width="48" height="30"/><rect x="182" y="296" width="48" height="30"/><rect x="234" y="296" width="48" height="30"/><rect x="338" y="296" width="48" height="30"/><rect x="390" y="296" width="48" height="30"/>
  </g>
  <!-- cell digits: rows 000110 / 100110 / 110110 / 110011 / 111011 -->
  <g text-anchor="middle" font-size="13">
    <g font-weight="600" fill="#4169E1">
      <text x="154" y="60">0</text><text x="206" y="60">0</text><text x="258" y="60">0</text><text x="414" y="60">0</text>
      <text x="206" y="124">0</text><text x="258" y="124">0</text><text x="414" y="124">0</text>
      <text x="258" y="188">0</text><text x="414" y="188">0</text>
      <text x="258" y="252">0</text><text x="310" y="252">0</text>
      <text x="310" y="316">0</text>
    </g>
    <g fill="#1a2026">
      <text x="310" y="60">1</text><text x="362" y="60">1</text>
      <text x="154" y="124">1</text><text x="310" y="124">1</text><text x="362" y="124">1</text>
      <text x="154" y="188">1</text><text x="206" y="188">1</text><text x="310" y="188">1</text><text x="362" y="188">1</text>
      <text x="154" y="252">1</text><text x="206" y="252">1</text><text x="362" y="252">1</text><text x="414" y="252">1</text>
      <text x="154" y="316">1</text><text x="206" y="316">1</text><text x="258" y="316">1</text><text x="362" y="316">1</text><text x="414" y="316">1</text>
    </g>
  </g>
  <!-- seat indices under the last row -->
  <g text-anchor="middle" font-size="10.5" fill="#9aa7b2">
    <text x="154" y="340">0</text><text x="206" y="340">1</text><text x="258" y="340">2</text>
    <text x="310" y="340">3</text><text x="362" y="340">4</text><text x="414" y="340">5</text>
  </g>
  <!-- operation labels in the gaps -->
  <g font-size="11.5" fill="#5c6b76">
    <text x="452" y="90">00 → 10 at seats 0, 1</text>
    <text x="452" y="154">00 → 10 at seats 1, 2</text>
    <text x="452" y="218">10 → 01 twice: 5 → 3</text>
    <text x="452" y="282">00 → 10 at seats 2, 3</text>
    <text x="452" y="315">all seats left of 3 are 1</text>
  </g>
  <text x="320" y="366" text-anchor="middle" fill="#1a2026" font-size="13">Each fusion 00 → 10 keeps the right-hand zero and moves it one seat right;</text>
  <text x="320" y="386" text-anchor="middle" fill="#1a2026" font-size="13">after z − 1 = 3 fusions the lone zero sits at first + z − 1 = <tspan fill="#4169E1" font-weight="600">3</tspan>, giving <tspan fill="#4169E1" font-weight="600">111011</tspan>.</text>
</svg>
