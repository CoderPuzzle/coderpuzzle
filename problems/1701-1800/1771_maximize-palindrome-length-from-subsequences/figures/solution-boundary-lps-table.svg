<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="436" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "cacb" + "cbba" = "cacbcbba"; string cells 40x34 at (110,46); dp cells 40x30 at (110,104);
       dp[i][j] = lps length of s[i..j]; shaded = matching boundary pair, solid = the winning dp[1][7] -->
  <text x="190" y="36" text-anchor="middle" fill="#5c6b76" font-size="12">word1</text>
  <text x="350" y="36" text-anchor="middle" fill="#5c6b76" font-size="12">word2</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="110" y="46" width="40" height="34"/><rect x="150" y="46" width="40" height="34" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="190" y="46" width="40" height="34"/><rect x="230" y="46" width="40" height="34"/>
    <rect x="270" y="46" width="40" height="34"/><rect x="310" y="46" width="40" height="34"/>
    <rect x="350" y="46" width="40" height="34"/><rect x="390" y="46" width="40" height="34" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="130" y="68">c</text><text x="170" y="68">a</text><text x="210" y="68">c</text><text x="250" y="68">b</text>
    <text x="290" y="68">c</text><text x="330" y="68">b</text><text x="370" y="68">b</text><text x="410" y="68">a</text>
  </g>
  <line x1="270" y1="42" x2="270" y2="346" stroke="#4169E1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="98" y="98" text-anchor="end" fill="#9aa7b2" font-size="11">i</text>
  <text x="104" y="96" fill="#9aa7b2" font-size="11">j</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="130" y="96">0</text><text x="170" y="96">1</text><text x="210" y="96">2</text><text x="250" y="96">3</text>
    <text x="290" y="96">4</text><text x="330" y="96">5</text><text x="370" y="96">6</text><text x="410" y="96">7</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="98" y="123">0</text><text x="98" y="153">1</text><text x="98" y="183">2</text><text x="98" y="213">3</text>
    <text x="98" y="243">4</text><text x="98" y="273">5</text><text x="98" y="303">6</text><text x="98" y="333">7</text>
  </g>
  <!-- lower triangle: unused -->
  <g fill="#f0f3f7" stroke="#dbe0e6" stroke-width="1">
    <rect x="110" y="134" width="40" height="30"/><rect x="110" y="164" width="40" height="30"/><rect x="150" y="164" width="40" height="30"/>
    <rect x="110" y="194" width="40" height="30"/><rect x="150" y="194" width="40" height="30"/><rect x="190" y="194" width="40" height="30"/>
    <rect x="110" y="224" width="40" height="30"/><rect x="150" y="224" width="40" height="30"/><rect x="190" y="224" width="40" height="30"/><rect x="230" y="224" width="40" height="30"/>
    <rect x="110" y="254" width="40" height="30"/><rect x="150" y="254" width="40" height="30"/><rect x="190" y="254" width="40" height="30"/><rect x="230" y="254" width="40" height="30"/><rect x="270" y="254" width="40" height="30"/>
    <rect x="110" y="284" width="40" height="30"/><rect x="150" y="284" width="40" height="30"/><rect x="190" y="284" width="40" height="30"/><rect x="230" y="284" width="40" height="30"/><rect x="270" y="284" width="40" height="30"/><rect x="310" y="284" width="40" height="30"/>
    <rect x="110" y="314" width="40" height="30"/><rect x="150" y="314" width="40" height="30"/><rect x="190" y="314" width="40" height="30"/><rect x="230" y="314" width="40" height="30"/><rect x="270" y="314" width="40" height="30"/><rect x="310" y="314" width="40" height="30"/><rect x="350" y="314" width="40" height="30"/>
  </g>
  <!-- dp values, i descending -->
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="110" y="104" width="40" height="30"/><rect x="150" y="104" width="40" height="30"/><rect x="190" y="104" width="40" height="30"/><rect x="230" y="104" width="40" height="30"/>
    <rect x="270" y="104" width="40" height="30" fill="#dbe4fb" stroke="#9aa7b2"/><rect x="310" y="104" width="40" height="30"/><rect x="350" y="104" width="40" height="30"/><rect x="390" y="104" width="40" height="30"/>
    <rect x="150" y="134" width="40" height="30"/><rect x="190" y="134" width="40" height="30"/><rect x="230" y="134" width="40" height="30"/>
    <rect x="270" y="134" width="40" height="30"/><rect x="310" y="134" width="40" height="30"/><rect x="350" y="134" width="40" height="30"/>
    <rect x="390" y="134" width="40" height="30" fill="#4169E1" stroke="#4169E1"/>
    <rect x="190" y="164" width="40" height="30"/><rect x="230" y="164" width="40" height="30"/>
    <rect x="270" y="164" width="40" height="30" fill="#dbe4fb" stroke="#9aa7b2"/><rect x="310" y="164" width="40" height="30"/><rect x="350" y="164" width="40" height="30"/><rect x="390" y="164" width="40" height="30"/>
    <rect x="230" y="194" width="40" height="30"/><rect x="270" y="194" width="40" height="30"/>
    <rect x="310" y="194" width="40" height="30" fill="#dbe4fb" stroke="#9aa7b2"/><rect x="350" y="194" width="40" height="30" fill="#dbe4fb" stroke="#9aa7b2"/><rect x="390" y="194" width="40" height="30"/>
    <rect x="270" y="224" width="40" height="30"/><rect x="310" y="224" width="40" height="30"/><rect x="350" y="224" width="40" height="30"/><rect x="390" y="224" width="40" height="30"/>
    <rect x="310" y="254" width="40" height="30"/><rect x="350" y="254" width="40" height="30"/><rect x="390" y="254" width="40" height="30"/>
    <rect x="350" y="284" width="40" height="30"/><rect x="390" y="284" width="40" height="30"/>
    <rect x="390" y="314" width="40" height="30"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="130" y="124">1</text><text x="170" y="124">1</text><text x="210" y="124">3</text><text x="250" y="124">3</text>
    <text x="290" y="124">3</text><text x="330" y="124">3</text><text x="370" y="124">3</text><text x="410" y="124">5</text>
    <text x="170" y="154">1</text><text x="210" y="154">1</text><text x="250" y="154">1</text>
    <text x="290" y="154">3</text><text x="330" y="154">3</text><text x="370" y="154">3</text>
    <text x="410" y="154" fill="#ffffff" font-weight="700">5</text>
    <text x="210" y="184">1</text><text x="250" y="184">1</text>
    <text x="290" y="184">3</text><text x="330" y="184">3</text><text x="370" y="184">3</text><text x="410" y="184">3</text>
    <text x="250" y="214">1</text><text x="290" y="214">1</text>
    <text x="330" y="214">3</text><text x="370" y="214">3</text><text x="410" y="214">3</text>
    <text x="290" y="244">1</text><text x="330" y="244">1</text><text x="370" y="244">2</text><text x="410" y="244">2</text>
    <text x="330" y="274">1</text><text x="370" y="274">2</text><text x="410" y="274">2</text>
    <text x="370" y="304">1</text><text x="410" y="304">1</text>
    <text x="410" y="334">1</text>
  </g>
  <line x1="466" y1="148" x2="436" y2="148" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="116" fill="#1a2026" font-size="13">dp[1][7] = dp[2][6] + 2</text>
  <text x="470" y="140" fill="#4169E1" font-size="15" font-weight="600">= 3 + 2 = 5</text>
  <text x="470" y="196" fill="#5c6b76" font-size="12" font-weight="600">other boundary matches (shaded)</text>
  <text x="470" y="216" fill="#5c6b76" font-size="12.5">dp[0][4] = dp[2][4] = 3</text>
  <text x="470" y="234" fill="#5c6b76" font-size="12.5">dp[3][5] = dp[3][6] = 3</text>
  <text x="470" y="278" fill="#1a2026" font-size="12.5">answer = 5, spelled</text>
  <text x="470" y="298" fill="#4169E1" font-size="13.5" font-weight="600">"ab" + "cba" = "abcba"</text>
  <text x="40" y="400" fill="#1a2026" font-size="13">The table fills with i descending; the best match straddling the boundary is</text>
  <text x="40" y="418" fill="#1a2026" font-size="13">s[1] = s[7] = 'a', giving dp[1][7] = <tspan fill="#4169E1" font-weight="600">5</tspan> — the longest "word1 + word2" palindrome.</text>
</svg>
