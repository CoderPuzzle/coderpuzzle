<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="326" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- matrix = [[5,2],[1,6]], k = 1; prefix cells 54x44 at x = 252/314, y = 96/142.
       prefix[1][1] = 6 ^ 7 ^ 4 ^ 5 = 0: above = prefix[0][1] (#dbe4fb), left = prefix[1][0] (#f0f3f7),
       upper-left = prefix[0][0] (dashed) — the shared 5 cancels. values 5,7,4,0 sort to 0,4,5,7; k = 1 reads 7. -->
  <text x="122" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">matrix</text>
  <text x="295" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">prefix xor</text>
  <text x="551" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">values in sweep order</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="64" y="96" width="54" height="44"/><rect x="126" y="96" width="54" height="44"/>
    <rect x="64" y="142" width="54" height="44"/><rect x="126" y="142" width="54" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="91" y="123">5</text><text x="153" y="123">2</text>
    <text x="91" y="169">1</text><text x="153" y="169">6</text>
  </g>
  <rect x="252" y="96" width="54" height="44" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="314" y="96" width="54" height="44" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="252" y="142" width="54" height="44" fill="#f0f3f7" stroke="#42525e" stroke-width="1.4"/>
  <rect x="314" y="142" width="54" height="44" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600">
    <text x="279" y="123" fill="#1a2026">5</text><text x="341" y="123" fill="#1a2026">7</text>
    <text x="279" y="169" fill="#1a2026">4</text><text x="341" y="169" fill="#4169E1">0</text>
  </g>
  <g fill="#5c6b76" font-size="11" text-anchor="middle">
    <text x="279" y="90">upper-left</text>
    <text x="341" y="90">above</text>
    <text x="234" y="169" text-anchor="end">left</text>
  </g>
  <text x="64" y="214" fill="#1a2026" font-size="12.5">prefix[0][0] = 5,  prefix[0][1] = 5 ^ 2 = 7</text>
  <text x="64" y="232" fill="#1a2026" font-size="12.5">prefix[1][0] = 5 ^ 1 = 4,  prefix[1][1] = 6 ^ 7 ^ 4 ^ 5 = 0 — the 5 cancels</text>
  <g stroke="#1a2026" stroke-width="1.3" fill="#ffffff">
    <rect x="470" y="96" width="36" height="30"/><rect x="512" y="96" width="36" height="30"/><rect x="554" y="96" width="36" height="30"/><rect x="596" y="96" width="36" height="30"/>
    <rect x="470" y="184" width="36" height="30"/><rect x="512" y="184" width="36" height="30"/><rect x="554" y="184" width="36" height="30"/>
  </g>
  <rect x="596" y="184" width="36" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="488" y="116" fill="#1a2026">5</text><text x="530" y="116" fill="#1a2026">7</text><text x="572" y="116" fill="#1a2026">4</text><text x="614" y="116" fill="#1a2026">0</text>
    <text x="488" y="204" fill="#1a2026">0</text><text x="530" y="204" fill="#1a2026">4</text><text x="572" y="204" fill="#1a2026">5</text><text x="614" y="204" fill="#4169E1">7</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="488" y="142">(0,0)</text><text x="530" y="142">(0,1)</text><text x="572" y="142">(1,0)</text><text x="614" y="142">(1,1)</text>
  </g>
  <line x1="551" y1="150" x2="551" y2="172" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="168" text-anchor="start" fill="#5c6b76" font-size="11.5">sort</text>
  <path d="M 592 218 V 226 H 636 V 218" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <text x="614" y="244" text-anchor="middle" fill="#4169E1" font-size="11.5">kth largest, k = 1</text>
  <text x="340" y="282" text-anchor="middle" fill="#1a2026" font-size="13">The sweep fills the 2 × 2 table with values 5, 7, 4, 0; sorted ascending they read 0, 4, 5, 7,</text>
  <text x="340" y="304" text-anchor="middle" fill="#1a2026" font-size="13">and k = 1 takes the kth largest off the end: <tspan fill="#4169E1" font-weight="600">7</tspan>, the XOR 5 ^ 2 of coordinate (0,1).</text>
</svg>
