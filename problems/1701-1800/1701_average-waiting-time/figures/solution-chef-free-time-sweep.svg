<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="344" fill="#ffffff"/>
  <!-- customers = [[1,2],[2,5],[4,3]]; x(t) = 60 + 44t; rows y = 64, 126, 188, bar h 26;
       starts 1, 3, 8 = max(free_at, arrival); finishes 3, 8, 11; waits 3-1=2, 8-2=6, 11-4=7; average 5 -->
  <text x="14" y="35" font-size="12.5" font-weight="600" fill="#1a2026">customers = [[1, 2], [2, 5], [4, 3]]</text>
  <g font-size="12" fill="#5c6b76">
    <rect x="340" y="26" width="16" height="11" fill="#dbe4fb" stroke="#4169E1" stroke-width="0.8"/>
    <text x="362" y="35">waiting for the chef</text>
    <rect x="500" y="26" width="16" height="11" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="522" y="35">cooking</text>
  </g>
  <!-- waiting spans (arrival to start) -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="0.8">
    <rect x="148" y="126" width="44" height="26"/>
    <rect x="236" y="188" width="176" height="26"/>
  </g>
  <!-- cooking bars (start to finish) -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="104" y="64" width="88" height="26"/>
    <rect x="192" y="126" width="220" height="26"/>
    <rect x="412" y="188" width="132" height="26"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#42525e">
    <text x="148" y="81">2 min</text>
    <text x="302" y="143">5 min</text>
    <text x="478" y="205">3 min</text>
  </g>
  <!-- row labels -->
  <g font-size="12" fill="#5c6b76">
    <text x="14" y="81">c1 [1, 2]</text>
    <text x="14" y="143">c2 [2, 5]</text>
    <text x="14" y="205">c3 [4, 3]</text>
  </g>
  <!-- start / finish labels above bar edges -->
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="104" y="58">start 1</text>
    <text x="192" y="58">finish 3</text>
    <text x="192" y="120">start 3</text>
    <text x="412" y="120">finish 8</text>
    <text x="412" y="182">start 8</text>
    <text x="544" y="182">finish 11</text>
  </g>
  <!-- wait lines: arrival to finish -->
  <g stroke="#4169E1" stroke-width="2">
    <path d="M 104 102 H 192"/>
    <path d="M 148 164 H 412"/>
    <path d="M 236 226 H 544"/>
  </g>
  <g fill="#4169E1">
    <circle cx="104" cy="102" r="3"/><circle cx="192" cy="102" r="3"/>
    <circle cx="148" cy="164" r="3"/><circle cx="412" cy="164" r="3"/>
    <circle cx="236" cy="226" r="3"/><circle cx="544" cy="226" r="3"/>
  </g>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="104" y="118">arrive 1</text>
    <text x="148" y="180">arrive 2</text>
    <text x="236" y="242">arrive 4</text>
  </g>
  <g font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="200" y="106">wait 2</text>
    <text x="420" y="168">wait 6</text>
    <text x="552" y="230">wait 7</text>
  </g>
  <!-- time axis -->
  <line x1="60" y1="262" x2="560" y2="262" stroke="#42525e" stroke-width="1.2"/>
  <g stroke="#42525e" stroke-width="1">
    <path d="M 60 258 V 266"/><path d="M 104 258 V 266"/><path d="M 148 258 V 266"/>
    <path d="M 192 258 V 266"/><path d="M 236 258 V 266"/><path d="M 280 258 V 266"/>
    <path d="M 324 258 V 266"/><path d="M 368 258 V 266"/><path d="M 412 258 V 266"/>
    <path d="M 456 258 V 266"/><path d="M 500 258 V 266"/><path d="M 544 258 V 266"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="60" y="280">0</text><text x="104" y="280">1</text><text x="148" y="280">2</text>
    <text x="192" y="280">3</text><text x="236" y="280">4</text><text x="280" y="280">5</text>
    <text x="324" y="280">6</text><text x="368" y="280">7</text><text x="412" y="280">8</text>
    <text x="456" y="280">9</text><text x="500" y="280">10</text><text x="544" y="280">11</text>
  </g>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">Each order runs from start = max(free_at, arrival) to finish = start + time;</text>
  <text x="320" y="328" text-anchor="middle" fill="#1a2026" font-size="13">the waits 2 + 6 + 7 = 15 over 3 customers give the average <tspan fill="#4169E1" font-weight="600">5.00000</tspan>.</text>
</svg>
