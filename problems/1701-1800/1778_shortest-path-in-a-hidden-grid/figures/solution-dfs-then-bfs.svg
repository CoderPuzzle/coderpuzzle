<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrow-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- grid = [[0,0,1],[1,1,1],[1,0,0]], start (0,2), target (2,0); cells 62px,
       left grid at (50,64), right grid at (440,64); left = DFS entry order,
       right = BFS distance from the start -->
  <text x="143" y="40" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">DFS: record every reachable cell</text>
  <text x="533" y="40" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">BFS: rings from the start</text>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#f0f3f7">
    <rect x="50" y="64" width="62" height="62"/><rect x="112" y="64" width="62" height="62"/>
    <rect x="112" y="188" width="62" height="62"/><rect x="174" y="188" width="62" height="62"/>
    <rect x="440" y="64" width="62" height="62"/><rect x="502" y="64" width="62" height="62"/>
    <rect x="502" y="188" width="62" height="62"/><rect x="564" y="188" width="62" height="62"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="174" y="64" width="62" height="62"/>
    <rect x="50" y="126" width="62" height="62"/><rect x="112" y="126" width="62" height="62"/><rect x="174" y="126" width="62" height="62"/>
    <rect x="50" y="188" width="62" height="62" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="564" y="64" width="62" height="62"/>
    <rect x="440" y="126" width="62" height="62"/><rect x="502" y="126" width="62" height="62"/><rect x="564" y="126" width="62" height="62"/>
    <rect x="440" y="188" width="62" height="62" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <!-- left: entry order 1..5, dashed backtrack outside the grid -->
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="205" y="106">S</text><text x="205" y="168">2</text><text x="143" y="168">3</text>
    <text x="81" y="168">4</text><text x="81" y="230">T</text>
    <text x="595" y="106">S</text><text x="595" y="169" fill="#4169E1">1</text><text x="533" y="169" fill="#4169E1">2</text>
    <text x="471" y="169" fill="#4169E1">3</text><text x="471" y="230">T</text>
  </g>
  <g font-size="11" fill="#9aa7b2">
    <text x="180" y="80">1</text>
  </g>
  <text x="62" y="208" font-size="11" font-weight="600" fill="#4169E1">5</text>
  <path d="M 46 219 L 26 219 L 26 268 L 258 268 L 258 95 L 242 95" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-mute)"/>
  <text x="142" y="262" text-anchor="middle" fill="#9aa7b2" font-size="11.5">backtrack moves retrace the path</text>
  <!-- right: BFS path arrows -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="595" y1="122" x2="595" y2="146" marker-end="url(#arrow)"/>
    <line x1="567" y1="157" x2="549" y2="157" marker-end="url(#arrow)"/>
    <line x1="505" y1="157" x2="489" y2="157" marker-end="url(#arrow)"/>
    <line x1="471" y1="184" x2="471" y2="204" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" font-weight="600" fill="#4169E1">
    <text x="570" y="80">0</text><text x="452" y="208">4</text>
  </g>
  <text x="143" y="284" text-anchor="middle" fill="#5c6b76" font-size="11.5">numbers: DFS entry order</text>
  <text x="533" y="284" text-anchor="middle" fill="#5c6b76" font-size="11.5">numbers: BFS distance</text>
  <text x="40" y="316" fill="#1a2026" font-size="13">DFS enters each of the five reachable cells once (dashed = backtrack moves) and finds T;</text>
  <text x="40" y="334" fill="#1a2026" font-size="13">BFS from the start then first reaches the target at distance <tspan fill="#4169E1" font-weight="600">4</tspan> — the minimum.</text>
</svg>
