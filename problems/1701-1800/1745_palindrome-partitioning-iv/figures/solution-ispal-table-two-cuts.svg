<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="424" fill="#ffffff"/>
  <!-- s = "abcbdd", n=6; isPal true only at (l,l) all l, (4,5), (1,3); cuts i=1, j=4 give "a"+"bcb"+"dd" -->
  <text x="110" y="44" fill="#5c6b76" font-size="12.5">isPal[l][r] — filled by increasing substring length</text>
  <g fill="#5c6b76" font-size="11.5">
    <text x="98" y="66" text-anchor="end">r</text>
    <text x="132" y="66" text-anchor="middle">0</text><text x="176" y="66" text-anchor="middle">1</text>
    <text x="220" y="66" text-anchor="middle">2</text><text x="264" y="66" text-anchor="middle">3</text>
    <text x="308" y="66" text-anchor="middle">4</text><text x="352" y="66" text-anchor="middle">5</text>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="end">
    <text x="98" y="84">0</text><text x="98" y="116">1</text><text x="98" y="148">2</text>
    <text x="98" y="180">3</text><text x="98" y="212">4</text><text x="98" y="244">5</text>
  </g>
  <!-- palindromic cells -->
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="110" y="64" width="42" height="30"/><rect x="154" y="96" width="42" height="30"/>
    <rect x="198" y="128" width="42" height="30"/><rect x="242" y="160" width="42" height="30"/>
    <rect x="286" y="192" width="42" height="30"/><rect x="330" y="224" width="42" height="30"/>
    <rect x="330" y="192" width="42" height="30"/>
  </g>
  <rect x="242" y="96" width="42" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.5"/>
  <!-- false cells (r > l) -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="154" y="64" width="42" height="30"/><rect x="198" y="64" width="42" height="30"/>
    <rect x="242" y="64" width="42" height="30"/><rect x="286" y="64" width="42" height="30"/>
    <rect x="330" y="64" width="42" height="30"/><rect x="198" y="96" width="42" height="30"/>
    <rect x="286" y="96" width="42" height="30"/><rect x="330" y="96" width="42" height="30"/>
    <rect x="242" y="128" width="42" height="30"/><rect x="286" y="128" width="42" height="30"/>
    <rect x="330" y="128" width="42" height="30"/><rect x="286" y="160" width="42" height="30"/>
    <rect x="330" y="160" width="42" height="30"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="131" y="84" fill="#4169E1">T</text><text x="175" y="116" fill="#4169E1">T</text>
    <text x="219" y="148" fill="#4169E1">T</text><text x="263" y="180" fill="#4169E1">T</text>
    <text x="307" y="212" fill="#4169E1">T</text><text x="351" y="244" fill="#4169E1">T</text>
    <text x="351" y="212" fill="#4169E1">T</text><text x="263" y="116" fill="#4169E1">T</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#9aa7b2">
    <text x="175" y="84">F</text><text x="219" y="84">F</text><text x="263" y="84">F</text>
    <text x="307" y="84">F</text><text x="351" y="84">F</text><text x="219" y="116">F</text>
    <text x="307" y="116">F</text><text x="351" y="116">F</text><text x="263" y="148">F</text>
    <text x="307" y="148">F</text><text x="351" y="148">F</text><text x="307" y="180">F</text>
    <text x="351" y="180">F</text>
  </g>
  <!-- s = a b c b d d with cuts after index 0 (i=1) and after index 3 (j=4) -->
  <text x="172" y="320" text-anchor="end" fill="#5c6b76" font-size="12.5">s</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="188" y="300" width="42" height="30"/><rect x="232" y="300" width="42" height="30"/>
    <rect x="276" y="300" width="42" height="30"/><rect x="320" y="300" width="42" height="30"/>
    <rect x="364" y="300" width="42" height="30"/><rect x="408" y="300" width="42" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="209" y="320">a</text><text x="253" y="320">b</text><text x="297" y="320">c</text>
    <text x="341" y="320">b</text><text x="385" y="320">d</text><text x="429" y="320">d</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="209" y="288">pal</text><text x="297" y="288">pal</text><text x="429" y="288">pal</text>
  </g>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="231" y1="292" x2="231" y2="338"/>
    <line x1="363" y1="292" x2="363" y2="338"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="231" y="354">i = 1</text><text x="363" y="354">j = 4</text>
  </g>
  <text x="320" y="386" text-anchor="middle" fill="#1a2026" font-size="13">The scan takes i = 1, j = 4: isPal[0][0], isPal[1][3], isPal[4][5] are all T —</text>
  <text x="320" y="406" text-anchor="middle" fill="#1a2026" font-size="13">"a" + "bcb" + "dd", three palindromes, so the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
