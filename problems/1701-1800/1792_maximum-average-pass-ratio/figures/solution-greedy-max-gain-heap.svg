<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- classes = [[1,2],[3,5],[2,2]], extraStudents = 2; gain = (p+1)/(t+1) - p/t:
       (1,2) -> 1/6, (3,5) -> 1/15, (2,2) -> 0; pop 1: (1,2) -> (2,3) gain 1/12;
       pop 2: (2,3) -> (3,4); panels at x 20/240/460, rows y = 88/116/144 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="110" y="52">initial heap</text>
    <text x="330" y="52">student 1 → class (1, 2)</text>
    <text x="550" y="52">student 2 → class (2, 3)</text>
  </g>
  <rect x="22" y="68" width="176" height="26" fill="#dbe4fb"/>
  <rect x="242" y="68" width="176" height="26" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="12.5">
    <text x="110" y="86" fill="#1a2026">(1, 2) · 1/2 · gain 1/6</text>
    <text x="110" y="116" fill="#1a2026">(3, 5) · 3/5 · gain 1/15</text>
    <text x="110" y="144" fill="#1a2026">(2, 2) · 2/2 · gain 0</text>
    <text x="330" y="86" fill="#1a2026">(2, 3) · 2/3 · gain 1/12</text>
    <text x="330" y="116" fill="#1a2026">(3, 5) · 3/5 · gain 1/15</text>
    <text x="330" y="144" fill="#1a2026">(2, 2) · 2/2 · gain 0</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="550" y="86" fill="#4169E1" font-weight="600">(3, 4) · ratio 3/4</text>
    <text x="550" y="116" fill="#1a2026">(3, 5) · ratio 3/5</text>
    <text x="550" y="144" fill="#1a2026">(2, 2) · ratio 2/2</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 204 81 H 234" marker-end="url(#arrow)"/>
    <path d="M 424 81 H 454" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11">
    <text x="219" y="66">+1</text>
    <text x="439" y="66">+1</text>
  </g>
  <text x="550" y="176" text-anchor="middle" fill="#5c6b76" font-size="12.5">loop ends — average the ratios</text>
  <text x="330" y="232" text-anchor="middle" fill="#1a2026" font-size="13">Both extra students land in class (1, 2): its gain — 1/6, then 1/12 — stays the</text>
  <text x="330" y="252" text-anchor="middle" fill="#1a2026" font-size="13">heap's largest, and the final ratios 3/4, 3/5, 2/2 average <tspan fill="#4169E1" font-weight="600">0.78333</tspan>.</text>
</svg>
