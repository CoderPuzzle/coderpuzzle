<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- pairs = [[2,1],[3,4],[3,2]]; degrees 1:1 2:2 3:2 4:1; the walk 1->2->3->4 emits [1,2,3,4] -->
  <text x="320" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">adjacentPairs</text>
  <rect x="208" y="50" width="64" height="28" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <rect x="288" y="50" width="64" height="28" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="368" y="50" width="64" height="28" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle">
    <text x="240" y="69">[2,1]</text><text x="320" y="69">[3,4]</text><text x="400" y="69">[3,2]</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="184" y1="160" x2="256" y2="160" marker-end="url(#arrow)"/>
    <line x1="304" y1="160" x2="376" y2="160" marker-end="url(#arrow)"/>
    <line x1="424" y1="160" x2="496" y2="160" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="220" y="142">1st</text><text x="340" y="142">2nd</text><text x="460" y="142">3rd</text>
  </g>
  <g fill="#ffffff" stroke="#9aa7b2" stroke-width="1.6">
    <circle cx="280" cy="160" r="20"/><circle cx="400" cy="160" r="20"/>
  </g>
  <g fill="#ffffff" stroke="#4169E1" stroke-width="2">
    <circle cx="160" cy="160" r="20"/><circle cx="520" cy="160" r="20"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="160" y="165">1</text><text x="280" y="165">2</text><text x="400" y="165">3</text><text x="520" y="165">4</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5">
    <text x="160" y="112">endpoint</text>
    <text x="160" y="129" font-weight="600" font-size="12.5">start</text>
    <text x="520" y="112">endpoint</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="160" y="198">degree 1</text><text x="280" y="198">degree 2</text>
    <text x="400" y="198">degree 2</text><text x="520" y="198">degree 1</text>
  </g>
  <text x="96" y="255" text-anchor="end" fill="#5c6b76" font-size="12.5">out</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="132" y="232" width="56" height="36"/><rect x="252" y="232" width="56" height="36"/>
    <rect x="372" y="232" width="56" height="36"/><rect x="492" y="232" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="160" y="255">1</text><text x="280" y="255">2</text><text x="400" y="255">3</text><text x="520" y="255">4</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="160" y="284">0</text><text x="280" y="284">1</text><text x="400" y="284">2</text><text x="520" y="284">3</text>
  </g>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">adjacentPairs[0] = [2, 1]: 2 already has degree 2, so the walk starts at endpoint <tspan fill="#4169E1" font-weight="600">1</tspan> and</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">always steps to the neighbour it did not just visit, emitting [<tspan fill="#4169E1" font-weight="600">1, 2, 3, 4</tspan>].</text>
</svg>
