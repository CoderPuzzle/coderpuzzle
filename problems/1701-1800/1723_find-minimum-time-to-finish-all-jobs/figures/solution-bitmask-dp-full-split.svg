<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="420" fill="#ffffff"/>
  <!-- jobs = [1,2,4,7,8], k = 2; bit i = jobs[i]. Strip: masks 0..31 row-major,
       cells 56x42 at (88,70), pitch (64,52); sums[mask] bold under the 5-bit mask.
       Accent: mask 19 = 10011 {1,2,8} and mask 12 = 01100 {4,7}; mask 31 marked full. -->
  <text x="340" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">sums[mask] for all 32 masks of jobs [1,2,4,7,8] — the dp's first row: one worker takes set mask whole</text>
  <g stroke="#1a2026" stroke-width="1.3" fill="#ffffff">
    <rect x="88" y="70" width="56" height="42"/><rect x="152" y="70" width="56" height="42"/><rect x="216" y="70" width="56" height="42"/><rect x="280" y="70" width="56" height="42"/><rect x="344" y="70" width="56" height="42"/><rect x="408" y="70" width="56" height="42"/><rect x="472" y="70" width="56" height="42"/><rect x="536" y="70" width="56" height="42"/>
    <rect x="88" y="122" width="56" height="42"/><rect x="152" y="122" width="56" height="42"/><rect x="216" y="122" width="56" height="42"/><rect x="280" y="122" width="56" height="42"/><rect x="408" y="122" width="56" height="42"/><rect x="472" y="122" width="56" height="42"/><rect x="536" y="122" width="56" height="42"/>
    <rect x="88" y="174" width="56" height="42"/><rect x="152" y="174" width="56" height="42"/><rect x="216" y="174" width="56" height="42"/><rect x="344" y="174" width="56" height="42"/><rect x="408" y="174" width="56" height="42"/><rect x="472" y="174" width="56" height="42"/><rect x="536" y="174" width="56" height="42"/>
    <rect x="88" y="226" width="56" height="42"/><rect x="152" y="226" width="56" height="42"/><rect x="216" y="226" width="56" height="42"/><rect x="280" y="226" width="56" height="42"/><rect x="344" y="226" width="56" height="42"/><rect x="408" y="226" width="56" height="42"/><rect x="472" y="226" width="56" height="42"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="#dbe4fb">
    <rect x="344" y="122" width="56" height="42"/>
    <rect x="280" y="174" width="56" height="42"/>
  </g>
  <rect x="536" y="226" width="56" height="42" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="602" y="251" text-anchor="start" fill="#4169E1" font-size="11.5">full</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="116" y="87">00000</text><text x="180" y="87">00001</text><text x="244" y="87">00010</text><text x="308" y="87">00011</text><text x="372" y="87">00100</text><text x="436" y="87">00101</text><text x="500" y="87">00110</text><text x="564" y="87">00111</text>
    <text x="116" y="139">01000</text><text x="180" y="139">01001</text><text x="244" y="139">01010</text><text x="308" y="139">01011</text><text x="372" y="139">01100</text><text x="436" y="139">01101</text><text x="500" y="139">01110</text><text x="564" y="139">01111</text>
    <text x="116" y="191">10000</text><text x="180" y="191">10001</text><text x="244" y="191">10010</text><text x="308" y="191">10011</text><text x="372" y="191">10100</text><text x="436" y="191">10101</text><text x="500" y="191">10110</text><text x="564" y="191">10111</text>
    <text x="116" y="243">11000</text><text x="180" y="243">11001</text><text x="244" y="243">11010</text><text x="308" y="243">11011</text><text x="372" y="243">11100</text><text x="436" y="243">11101</text><text x="500" y="243">11110</text><text x="564" y="243">11111</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="116" y="105" fill="#1a2026">0</text><text x="180" y="105" fill="#1a2026">1</text><text x="244" y="105" fill="#1a2026">2</text><text x="308" y="105" fill="#1a2026">3</text><text x="372" y="105" fill="#1a2026">4</text><text x="436" y="105" fill="#1a2026">5</text><text x="500" y="105" fill="#1a2026">6</text><text x="564" y="105" fill="#1a2026">7</text>
    <text x="116" y="157" fill="#1a2026">7</text><text x="180" y="157" fill="#1a2026">8</text><text x="244" y="157" fill="#1a2026">9</text><text x="308" y="157" fill="#1a2026">10</text><text x="372" y="157" fill="#4169E1">11</text><text x="436" y="157" fill="#1a2026">12</text><text x="500" y="157" fill="#1a2026">13</text><text x="564" y="157" fill="#1a2026">14</text>
    <text x="116" y="209" fill="#1a2026">8</text><text x="180" y="209" fill="#1a2026">9</text><text x="244" y="209" fill="#1a2026">10</text><text x="308" y="209" fill="#4169E1">11</text><text x="372" y="209" fill="#1a2026">12</text><text x="436" y="209" fill="#1a2026">13</text><text x="500" y="209" fill="#1a2026">14</text><text x="564" y="209" fill="#1a2026">15</text>
    <text x="116" y="261" fill="#1a2026">15</text><text x="180" y="261" fill="#1a2026">16</text><text x="244" y="261" fill="#1a2026">17</text><text x="308" y="261" fill="#1a2026">18</text><text x="372" y="261" fill="#1a2026">19</text><text x="436" y="261" fill="#1a2026">20</text><text x="500" y="261" fill="#1a2026">21</text><text x="564" y="261" fill="#4169E1">22</text>
  </g>
  <!-- the full mask's best split for worker 2 -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="100" y="296" width="190" height="48"/>
    <rect x="390" y="296" width="190" height="48"/>
  </g>
  <text x="195" y="315" text-anchor="middle" fill="#1a2026" font-size="12.5">sub = 10011 → {1,2,8}</text>
  <text x="195" y="335" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">sums = 11</text>
  <text x="340" y="325" text-anchor="middle" fill="#5c6b76" font-size="12.5">vs</text>
  <text x="485" y="315" text-anchor="middle" fill="#1a2026" font-size="12.5">11111 ^ sub = 01100 → {4,7}</text>
  <text x="485" y="335" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">sums = 11</text>
  <text x="340" y="378" text-anchor="middle" fill="#1a2026" font-size="13">Worker 2's pass splits mask 11111 (sums 22): 10011 {1,2,8} vs 01100 {4,7} — both sides sum 11,</text>
  <text x="340" y="400" text-anchor="middle" fill="#1a2026" font-size="13">and no split of the 22 total keeps both sides below 11, so dp[2][full] = <tspan fill="#4169E1" font-weight="600">11</tspan>.</text>
</svg>
