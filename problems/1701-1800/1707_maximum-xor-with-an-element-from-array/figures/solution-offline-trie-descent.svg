<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="384" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums [0,1,2,3,4] sorted; query (x=3, m=1); after the insert pointer the trie
       holds {0,1} only (low bits 2..0 drawn); root y=78, levels y=146/214/282,
       bit-0 fork x=105 (child 0, taken) vs x=195 (child 1, not taken) -->
  <text x="40" y="34" font-size="12.5" fill="#5c6b76">nums sorted: [0, 1, 2, 3, 4]; the m = 1 pointer has inserted {0, 1} - low 3 bits drawn</text>
  <text x="150" y="60" text-anchor="middle" font-size="11.5" fill="#5c6b76">root</text>
  <!-- absent 1-child stub at bit 2 -->
  <line x1="159" y1="85" x2="182" y2="126" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="190" y="112" font-size="11" fill="#9aa7b2">1 absent</text>
  <!-- trie edges -->
  <line x1="150" y1="89" x2="150" y2="135" stroke="#4169E1" stroke-width="2.2"/>
  <line x1="150" y1="157" x2="150" y2="203" stroke="#4169E1" stroke-width="2.2"/>
  <line x1="142" y1="221" x2="113" y2="273" stroke="#4169E1" stroke-width="2.2"/>
  <line x1="158" y1="221" x2="187" y2="273" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="4 3"/>
  <g font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="158" y="118">0</text>
    <text x="158" y="184">0</text>
    <text x="114" y="246">0</text>
  </g>
  <text x="180" y="246" font-size="12.5" fill="#9aa7b2">1</text>
  <!-- nodes -->
  <circle cx="150" cy="78" r="11" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="150" cy="146" r="11" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="150" cy="214" r="11" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="105" cy="282" r="11" fill="#4169E1" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="195" cy="282" r="11" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <g font-size="12" fill="#5c6b76">
    <text x="56" y="150" text-anchor="end">bit 2</text>
    <text x="56" y="218" text-anchor="end">bit 1</text>
    <text x="56" y="286" text-anchor="end">bit 0</text>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <text x="105" y="312" fill="#4169E1">0 = 000</text>
    <text x="195" y="312" fill="#9aa7b2">1 = 001</text>
  </g>
  <!-- descent steps -->
  <text x="320" y="78" font-size="13.5" font-weight="600" fill="#1a2026">greedy descent for x = 3 (011):</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="320" y="112">bit 2: want 1 - absent, forced 0 (best 0)</text>
    <text x="320" y="140">bit 1: want 0 - found, best = 2</text>
    <text x="320" y="168">bit 0: want 0 - found, best = 3</text>
  </g>
  <text x="320" y="202" font-size="13" fill="#1a2026">the walk lands on number 0:</text>
  <text x="320" y="228" font-size="15" font-weight="600" fill="#4169E1">0 XOR 3 = 3</text>
  <text x="320" y="258" font-size="12" fill="#5c6b76">(the 1-leaf would give 1 XOR 3 = 2.)</text>
  <text x="320" y="346" text-anchor="middle" fill="#1a2026" font-size="13">Sorted offline, the trie for m = 1 holds only 0 and 1; the complement-bit</text>
  <text x="320" y="364" text-anchor="middle" fill="#1a2026" font-size="13">walk for x = 3 reaches 0 and scores <tspan fill="#4169E1" font-weight="600">0 XOR 3 = 3</tspan>.</text>
</svg>
