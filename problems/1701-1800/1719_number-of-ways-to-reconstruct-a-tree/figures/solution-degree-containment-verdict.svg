<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="394" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- pairs = [[1,2],[2,3],[1,3]]: adj(1)=adj(2)=adj(3)={1,2,3}\self, all degrees 2 = V-1;
       order [1,2,3]; parent(2)=1, parent(3)=1 (degree tie keeps first); every edge equal-degree;
       chains 1-2-3 and 1-3-2 are two of the six valid rooted trees, verdict 2 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="65" y="44" width="150" height="48"/><rect x="245" y="44" width="150" height="48"/><rect x="425" y="44" width="150" height="48"/>
  </g>
  <g text-anchor="middle">
    <text x="140" y="66" font-weight="600" fill="#1a2026">value 1</text><text x="140" y="83" fill="#5c6b76" font-size="12">degree 2</text>
    <text x="320" y="66" font-weight="600" fill="#1a2026">value 2</text><text x="320" y="83" fill="#5c6b76" font-size="12">degree 2</text>
    <text x="500" y="66" font-weight="600" fill="#1a2026">value 3</text><text x="500" y="83" fill="#5c6b76" font-size="12">degree 2</text>
  </g>
  <text x="320" y="114" text-anchor="middle" fill="#5c6b76" font-size="12.5">largest degree is V − 1 = 2 — the root check holds</text>
  <!-- placement table -->
  <g fill="#5c6b76" font-size="12">
    <text x="100" y="146" text-anchor="middle">v</text>
    <text x="230" y="146" text-anchor="middle">placed neighbors</text>
    <text x="350" y="146" text-anchor="middle">parent</text>
    <text x="440" y="146">check</text>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="100" y="170" text-anchor="middle">1</text>
    <text x="230" y="170" text-anchor="middle">—</text>
    <text x="350" y="170" text-anchor="middle" font-weight="600">root</text>
    <text x="440" y="170">—</text>
    <text x="100" y="194" text-anchor="middle">2</text>
    <text x="230" y="194" text-anchor="middle">{1}</text>
    <text x="350" y="194" text-anchor="middle" font-weight="600">1</text>
    <text x="440" y="194">pass · deg 2 = 2</text>
    <text x="100" y="218" text-anchor="middle">3</text>
    <text x="230" y="218" text-anchor="middle">{1,2}</text>
    <text x="350" y="218" text-anchor="middle" font-weight="600">1</text>
    <text x="440" y="218">pass · deg 2 = 2</text>
  </g>
  <text x="320" y="246" text-anchor="middle" fill="#5c6b76" font-size="11.5">parent = deepest placed neighbor (degree tie keeps the first); check = v's other neighbors lie in adj(parent)</text>
  <!-- two of the six valid chains -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="250" y="268" text-anchor="middle">rooted tree 1</text>
    <text x="490" y="268" text-anchor="middle">rooted tree 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <circle cx="170" cy="296" r="15" fill="#dbe4fb"/><circle cx="250" cy="296" r="15" fill="#ffffff"/><circle cx="330" cy="296" r="15" fill="#ffffff"/>
    <circle cx="410" cy="296" r="15" fill="#dbe4fb"/><circle cx="490" cy="296" r="15" fill="#ffffff"/><circle cx="570" cy="296" r="15" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="170" y="301">1</text><text x="250" y="301">2</text><text x="330" y="301">3</text>
    <text x="410" y="301">1</text><text x="490" y="301">3</text><text x="570" y="301">2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 187 296 H 229" marker-end="url(#arrow)"/>
    <path d="M 267 296 H 309" marker-end="url(#arrow)"/>
    <path d="M 427 296 H 469" marker-end="url(#arrow)"/>
    <path d="M 507 296 H 549" marker-end="url(#arrow)"/>
  </g>
  <text x="320" y="338" text-anchor="middle" fill="#5c6b76" font-size="11.5">the equal-degree {2,3} edge flips between them — every edge here ties at degree 2</text>
  <text x="320" y="366" text-anchor="middle" fill="#1a2026" font-size="13">Every parent edge joins equal degrees, so the chains flip freely: six valid</text>
  <text x="320" y="386" text-anchor="middle" fill="#1a2026" font-size="13">rooted trees realize the pairs — the answer is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
