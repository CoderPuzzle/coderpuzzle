<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,0,0,1,0,1], k = 2; pos = [0,3,5]; q = pos[i]-i = [0,2,3];
       windows: i=0 {0,2} median 2 cost 2; i=1 {2,3} median 3 cost 1 = answer; axis x(q) = 90 + 150q -->
  <text x="14" y="61" font-size="12.5" fill="#5c6b76">nums</text>
  <text x="365" y="61" font-size="12.5" fill="#5c6b76">k = <tspan font-weight="600" fill="#1a2026">2</tspan></text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="135" y="44" width="42" height="26"/><rect x="180" y="44" width="42" height="26"/><rect x="270" y="44" width="42" height="26"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.4" fill="#dbe4fb">
    <rect x="90" y="44" width="42" height="26"/><rect x="225" y="44" width="42" height="26"/><rect x="315" y="44" width="42" height="26"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <g font-weight="600" fill="#4169E1">
      <text x="111" y="62">1</text><text x="246" y="62">1</text><text x="336" y="62">1</text>
    </g>
    <g fill="#1a2026">
      <text x="156" y="62">0</text><text x="201" y="62">0</text><text x="291" y="62">0</text>
    </g>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#9aa7b2">
    <text x="111" y="86">0</text><text x="156" y="86">1</text><text x="201" y="86">2</text>
    <text x="246" y="86">3</text><text x="291" y="86">4</text><text x="336" y="86">5</text>
  </g>
  <text x="320" y="112" text-anchor="middle" fill="#1a2026" font-size="13">one-positions pos = [0, 3, 5]  →  q[i] = pos[i] − i = <tspan font-weight="600" fill="#4169E1">[0, 2, 3]</tspan></text>
  <!-- window i = 0 -->
  <text x="90" y="150" font-size="12.5" fill="#1a2026">window i = 0:  q = {0, 2},  median q[1] = 2</text>
  <line x1="90" y1="185" x2="560" y2="185" stroke="#42525e" stroke-width="1.2"/>
  <g stroke="#42525e" stroke-width="1">
    <path d="M 90 181 V 189"/><path d="M 240 181 V 189"/><path d="M 390 181 V 189"/><path d="M 540 181 V 189"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#9aa7b2">
    <text x="90" y="203">0</text><text x="240" y="203">1</text><text x="390" y="203">2</text><text x="540" y="203">3</text>
  </g>
  <circle cx="90" cy="185" r="4.5" fill="#4169E1"/>
  <circle cx="390" cy="185" r="4.5" fill="#4169E1"/>
  <path d="M 385 173 L 395 173 L 390 180 z" fill="#4169E1"/>
  <path d="M 96 181 Q 240 140 383 180" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="572" y="190" font-size="12.5" font-weight="600" fill="#5c6b76">cost 2</text>
  <!-- window i = 1 -->
  <text x="90" y="235" font-size="12.5" fill="#1a2026">window i = 1:  q = {2, 3},  median q[2] = 3</text>
  <line x1="90" y1="270" x2="560" y2="270" stroke="#42525e" stroke-width="1.2"/>
  <g stroke="#42525e" stroke-width="1">
    <path d="M 90 266 V 274"/><path d="M 240 266 V 274"/><path d="M 390 266 V 274"/><path d="M 540 266 V 274"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#9aa7b2">
    <text x="90" y="288">0</text><text x="240" y="288">1</text><text x="390" y="288">2</text><text x="540" y="288">3</text>
  </g>
  <circle cx="390" cy="270" r="4.5" fill="#4169E1"/>
  <circle cx="540" cy="270" r="4.5" fill="#4169E1"/>
  <path d="M 535 258 L 545 258 L 540 265 z" fill="#4169E1"/>
  <path d="M 396 266 Q 465 226 533 265" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="572" y="275" font-size="12.5" font-weight="600" fill="#4169E1">cost 1</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">Gathering window i = 1 around its median q = 3 moves the q = 2 one one seat:</text>
  <text x="320" y="338" text-anchor="middle" fill="#1a2026" font-size="13">cost |2−3| + |3−3| = <tspan fill="#4169E1" font-weight="600">1</tspan>, the minimum over both windows — one adjacent swap.</text>
</svg>
