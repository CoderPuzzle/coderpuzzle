<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="366" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrow-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- n = 5, edges [[1,2,3],[1,3,3],[2,3,1],[1,4,2],[5,2,2],[3,5,1],[5,4,10]];
       Dijkstra from 5: d = [4,2,1,6,0]; every edge points farther -> closer;
       counts fill in increasing d: cnt[5]=1, cnt[3]=1, cnt[2]=2, cnt[1]=3, cnt[4]=4 -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 74 198 L 134 120" marker-end="url(#arrow-gray)"/>
    <path d="M 79 222 Q 330 290 582 219" marker-end="url(#arrow-gray)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.2" fill="none">
    <path d="M 170 92 L 296 180" marker-end="url(#arrow)"/>
    <path d="M 172 100 L 444 95" marker-end="url(#arrow)"/>
    <path d="M 340 160 L 447 107" marker-end="url(#arrow)"/>
    <path d="M 342 173 L 579 202" marker-end="url(#arrow)"/>
    <path d="M 487 109 L 585 189" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="150" y="66">d = 4</text><text x="320" y="136">d = 2</text>
    <text x="470" y="61">d = 1</text><text x="60" y="181">d = 6</text><text x="605" y="171">d = 0</text>
  </g>
  <circle cx="150" cy="100" r="20" fill="#4169E1"/>
  <circle cx="320" cy="170" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="470" cy="95" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="60" cy="215" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="605" cy="205" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="150" y="105" fill="#ffffff">1</text><text x="320" y="175" fill="#1a2026">2</text>
    <text x="470" y="100" fill="#1a2026">3</text><text x="60" y="220" fill="#1a2026">4</text>
    <text x="605" y="210" fill="#1a2026">5</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#4169E1">
    <text x="156" y="142" font-size="13.5">cnt = 3</text><text x="320" y="212" font-size="12.5">cnt = 2</text>
    <text x="470" y="133" font-size="12.5">cnt = 1</text><text x="60" y="253" font-size="12.5">cnt = 4</text>
    <text x="605" y="245" font-size="12.5">cnt = 1</text>
  </g>
  <text x="656" y="264" text-anchor="end" fill="#5c6b76" font-size="11.5">fill by increasing distance</text>
  <g fill="#ffffff" stroke="#9aa7b2" stroke-width="1.3">
    <rect x="24" y="272" width="112" height="34"/><rect x="154" y="272" width="112" height="34"/>
    <rect x="284" y="272" width="112" height="34"/>
    <rect x="544" y="272" width="112" height="34"/>
  </g>
  <rect x="414" y="272" width="112" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="80" y="285">d = 0</text><text x="210" y="285">d = 1</text><text x="340" y="285">d = 2</text>
    <text x="470" y="285">d = 4</text><text x="600" y="285">d = 6</text>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="80" y="300">cnt[5] = 1</text><text x="210" y="300">cnt[3] = 1</text><text x="340" y="300">cnt[2] = 2</text>
    <text x="600" y="300">cnt[4] = 4</text>
  </g>
  <text x="470" y="300" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">cnt[1] = 3</text>
  <g stroke="#9aa7b2" stroke-width="1.2">
    <line x1="139" y1="289" x2="147" y2="289" marker-end="url(#arrow-mute)"/>
    <line x1="269" y1="289" x2="277" y2="289" marker-end="url(#arrow-mute)"/>
    <line x1="399" y1="289" x2="407" y2="289" marker-end="url(#arrow-mute)"/>
    <line x1="529" y1="289" x2="537" y2="289" marker-end="url(#arrow-mute)"/>
  </g>
  <text x="40" y="330" fill="#1a2026" font-size="13">Dijkstra from node 5 gives d = [4,2,1,6,0]; every edge then points from the farther</text>
  <text x="40" y="348" fill="#1a2026" font-size="13">endpoint to the closer one, and count[1] = 2 + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan> restricted paths reach node 5.</text>
</svg>
