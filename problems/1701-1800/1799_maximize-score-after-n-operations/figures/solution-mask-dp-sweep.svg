<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums=[3,4,6,8]; grid cell (row i, col j) is mask 4i+j, 64x46 at (40+72j, 68+56i);
       dp from the ascending sweep (odd-popcount masks are never reached);
       pair gcd table: gcd(3,4)=1, gcd(3,6)=3, gcd(3,8)=1, gcd(4,6)=2, gcd(4,8)=4, gcd(6,8)=2 -->
  <text x="40" y="32" fill="#1a2026" font-weight="600">nums = [3, 4, 6, 8]  (bit i ↔ index i)</text>
  <text x="640" y="32" text-anchor="end" fill="#9aa7b2" font-size="11.5">odd masks: never reached</text>
  <text x="40" y="52" fill="#5c6b76" font-size="12.5">dp[mask]</text>
  <!-- dp grid -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="40" y="68" width="64" height="46" fill="#ffffff"/><rect x="112" y="68" width="64" height="46" fill="#f0f3f7"/><rect x="184" y="68" width="64" height="46" fill="#f0f3f7"/><rect x="256" y="68" width="64" height="46" fill="#ffffff"/>
    <rect x="40" y="124" width="64" height="46" fill="#f0f3f7"/><rect x="112" y="124" width="64" height="46" fill="#dbe4fb"/><rect x="184" y="124" width="64" height="46" fill="#ffffff"/><rect x="256" y="124" width="64" height="46" fill="#f0f3f7"/>
    <rect x="40" y="180" width="64" height="46" fill="#f0f3f7"/><rect x="112" y="180" width="64" height="46" fill="#ffffff"/><rect x="184" y="180" width="64" height="46" fill="#ffffff"/><rect x="256" y="180" width="64" height="46" fill="#f0f3f7"/>
    <rect x="40" y="236" width="64" height="46" fill="#ffffff"/><rect x="112" y="236" width="64" height="46" fill="#f0f3f7"/><rect x="184" y="236" width="64" height="46" fill="#f0f3f7"/><rect x="256" y="236" width="64" height="46" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="72" y="85" fill="#5c6b76">0000</text><text x="144" y="85" fill="#9aa7b2">0001</text><text x="216" y="85" fill="#9aa7b2">0010</text><text x="288" y="85" fill="#5c6b76">0011</text>
    <text x="72" y="141" fill="#9aa7b2">0100</text><text x="144" y="141" fill="#5c6b76" font-weight="600">0101</text><text x="216" y="141" fill="#5c6b76">0110</text><text x="288" y="141" fill="#9aa7b2">0111</text>
    <text x="72" y="197" fill="#9aa7b2">1000</text><text x="144" y="197" fill="#5c6b76">1001</text><text x="216" y="197" fill="#5c6b76">1010</text><text x="288" y="197" fill="#9aa7b2">1011</text>
    <text x="72" y="253" fill="#5c6b76">1100</text><text x="144" y="253" fill="#9aa7b2">1101</text><text x="216" y="253" fill="#9aa7b2">1110</text><text x="288" y="253" fill="#5c6b76" font-weight="600">1111</text>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="72" y="105" fill="#1a2026">0</text><text x="144" y="105" fill="#9aa7b2">–</text><text x="216" y="105" fill="#9aa7b2">–</text><text x="288" y="105" fill="#1a2026">1</text>
    <text x="72" y="161" fill="#9aa7b2">–</text><text x="144" y="161" fill="#4169E1">3</text><text x="216" y="161" fill="#1a2026">2</text><text x="288" y="161" fill="#9aa7b2">–</text>
    <text x="72" y="217" fill="#9aa7b2">–</text><text x="144" y="217" fill="#1a2026">1</text><text x="216" y="217" fill="#1a2026">4</text><text x="288" y="217" fill="#9aa7b2">–</text>
    <text x="72" y="273" fill="#1a2026">2</text><text x="144" y="273" fill="#9aa7b2">–</text><text x="216" y="273" fill="#9aa7b2">–</text><text x="288" y="273" fill="#4169E1">11</text>
  </g>
  <!-- winning chain 0000 -> 0101 -> 1111 through the diagonal gaps -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 78 95 L 110 121" marker-end="url(#arrow)"/>
    <path d="M 158 158 L 252 231" marker-end="url(#arrow)"/>
  </g>
  <!-- pair gcd table -->
  <text x="396" y="52" fill="#5c6b76" font-size="12.5" font-weight="600">pair gcds</text>
  <g text-anchor="start" font-size="13" fill="#1a2026">
    <text x="396" y="72">(3,4) = 1</text>
    <text x="396" y="90">(3,6) = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="396" y="108">(3,8) = 1</text>
    <text x="396" y="126">(4,6) = 2</text>
    <text x="396" y="144">(4,8) = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
    <text x="396" y="162">(6,8) = 2</text>
  </g>
  <text x="396" y="196" fill="#5c6b76" font-size="12.5" font-weight="600">winning chain</text>
  <g text-anchor="start" font-size="13" fill="#1a2026">
    <text x="396" y="216">op 1: {6,3} → 1×3 = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="396" y="236">op 2: {8,4} → 2×4 = <tspan fill="#4169E1" font-weight="600">8</tspan></text>
    <text x="396" y="256">dp[1111] = 3 + 8 = <tspan fill="#4169E1" font-weight="600">11</tspan></text>
  </g>
  <text x="340" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Ascending mask sweep: dp[0101] = 0 + 1×gcd(3,6) = 3 (remove {6,3});</text>
  <text x="340" y="324" text-anchor="middle" fill="#1a2026" font-size="13">then dp[1111] = 3 + 2×gcd(4,8) = <tspan fill="#4169E1" font-weight="600">11</tspan>, the best of the six final pairs.</text>
</svg>
