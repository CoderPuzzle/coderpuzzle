<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- edgeList = [[0,2,4],[0,3,2],[1,2,3],[2,3,1],[4,5,5]]; Kruskal accepts 2-3(1), 0-3(2), 1-2(3), 4-5(5),
       rejects 0-2(4). Tree A rooted at 0: chain 0 -2-> 3 -1-> 2 -3-> 1. Queries: (2,0,3) lifts 2 to 0, max 1,2 = 2;
       (1,3,3) lifts 1 to 3, max 3,1 = 3. Graph nodes r=17; chain at x=560, y = 105/165/225/285. -->
  <text x="235" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">cheapest-first Kruskal — tree edges accented, 0–2 closes a cycle</text>
  <g stroke="#9aa7b2" stroke-width="1.8" stroke-dasharray="5 4" fill="none">
    <line x1="87" y1="243" x2="173" y2="152"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.6" fill="none">
    <line x1="185" y1="157" x2="185" y2="238"/>
    <line x1="92" y1="255" x2="168" y2="255"/>
    <line x1="202" y1="140" x2="283" y2="140"/>
    <line x1="395" y1="157" x2="395" y2="238"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="75" cy="255" r="17"/><circle cx="185" cy="255" r="17"/><circle cx="185" cy="140" r="17"/>
    <circle cx="300" cy="140" r="17"/><circle cx="395" cy="140" r="17"/><circle cx="395" cy="255" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="75" y="260">0</text><text x="185" y="260">3</text><text x="185" y="145">2</text>
    <text x="300" y="145">1</text><text x="395" y="145">4</text><text x="395" y="260">5</text>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="173" y="202" text-anchor="end">1</text>
    <text x="130" y="245" text-anchor="middle">2</text>
    <text x="242" y="130" text-anchor="middle">3</text>
    <text x="383" y="202" text-anchor="end">5</text>
  </g>
  <g fill="#9aa7b2" font-size="11.5" text-anchor="middle">
    <text x="95" y="201">4</text>
    <text x="95" y="217">cycle</text>
  </g>
  <!-- rooted tree with lifting walks -->
  <text x="560" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">tree rooted at 0, depths</text>
  <g stroke="#42525e" stroke-width="1.8" fill="none">
    <line x1="560" y1="122" x2="560" y2="148"/>
    <line x1="560" y1="182" x2="560" y2="208"/>
    <line x1="560" y1="242" x2="560" y2="268"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="572" y="139">2</text>
    <text x="572" y="199">1</text>
    <text x="572" y="259">3</text>
  </g>
  <g fill="#9aa7b2" font-size="11" text-anchor="end">
    <text x="512" y="109">d 0</text><text x="512" y="169">d 1</text><text x="512" y="229">d 2</text><text x="512" y="289">d 3</text>
  </g>
  <path d="M 543 225 C 518 195 518 135 543 105" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <path d="M 577 285 C 610 252 610 198 577 165" fill="none" stroke="#5c6b76" stroke-width="2" marker-end="url(#arrowG)"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="560" cy="105" r="17"/><circle cx="560" cy="165" r="17"/><circle cx="560" cy="225" r="17"/><circle cx="560" cy="285" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="560" y="110">0</text><text x="560" y="170">3</text><text x="560" y="230">2</text><text x="560" y="290">1</text>
  </g>
  <text x="60" y="322" fill="#1a2026" font-size="12.5"><tspan fill="#4169E1" font-weight="600">query (2,0,3):</tspan> lift 2 → 3 → 0, carrying max(1, 2) = 2 &lt; 3 → true</text>
  <text x="60" y="344" fill="#1a2026" font-size="12.5"><tspan fill="#5c6b76" font-weight="600">query (1,3,3):</tspan> lift 1 over 1 → 2 → 3, max(3, 1) = 3 — strict bound fails → false</text>
  <text x="340" y="384" text-anchor="middle" fill="#1a2026" font-size="13">Cheapest-first Kruskal keeps 2–3 (1), 0–3 (2), 1–2 (3), 4–5 (5) and skips 0–2 (4, cycle):</text>
  <text x="340" y="406" text-anchor="middle" fill="#1a2026" font-size="13">a query reads its tree path's max edge: <tspan fill="#4169E1" font-weight="600">2</tspan> &lt; 3 passes, <tspan fill="#4169E1" font-weight="600">3</tspan> fails; 0 and 5 sit in different trees.</text>
</svg>
