<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="412" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrow-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- cars = [[1,2],[2,1],[4,3],[7,2]] (car i at x = 40 + 80*pos); right-to-left scan:
       i=3 push; i=2 t=3; i=1 pops 2,3; i=0 t=1; answers [1,-1,3,-1] -->
  <line x1="620" y1="44" x2="140" y2="44" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-mute)"/>
  <text x="380" y="36" text-anchor="middle" fill="#9aa7b2" font-size="11.5">scan right to left</text>
  <circle cx="120" cy="82" r="12" fill="#4169E1"/>
  <circle cx="200" cy="82" r="12" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.6"/>
  <circle cx="360" cy="82" r="12" fill="#4169E1"/>
  <circle cx="600" cy="82" r="12" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="120" y="86" fill="#ffffff">0</text><text x="200" y="86" fill="#5c6b76">1</text>
    <text x="360" y="86" fill="#ffffff">2</text><text x="600" y="86" fill="#9aa7b2">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="120" y="108">sp 2</text><text x="200" y="108">sp 1</text>
    <text x="360" y="108">sp 3</text><text x="600" y="108">sp 2</text>
  </g>
  <line x1="50" y1="118" x2="640" y2="118" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="120" y1="118" x2="120" y2="126"/><line x1="200" y1="118" x2="200" y2="126"/>
    <line x1="360" y1="118" x2="360" y2="126"/><line x1="600" y1="118" x2="600" y2="126"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="120" y="142">pos 1</text><text x="200" y="142">pos 2</text>
    <text x="360" y="142">pos 4</text><text x="600" y="142">pos 7</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="120" y="164" fill="#4169E1">ans 1</text><text x="200" y="164" fill="#9aa7b2">ans -1</text>
    <text x="360" y="164" fill="#4169E1">ans 3</text><text x="600" y="164" fill="#9aa7b2">ans -1</text>
  </g>
  <text x="40" y="196" fill="#5c6b76" font-size="12">stack after each step (bottom to top):</text>
  <!-- step panels, in scan order -->
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="90" y="218">i = 3</text><text x="258" y="218">i = 2</text>
    <text x="426" y="218">i = 1</text><text x="594" y="218">i = 0</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="70" y="288" width="40" height="26"/>
    <rect x="238" y="288" width="40" height="26"/><rect x="238" y="260" width="40" height="26"/>
    <rect x="574" y="288" width="40" height="26"/><rect x="574" y="260" width="40" height="26"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#ffffff" stroke-dasharray="4 3">
    <rect x="406" y="288" width="40" height="26"/>
    <rect x="406" y="260" width="40" height="26"/><rect x="406" y="232" width="40" height="26"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="90" y="306">3</text>
    <text x="258" y="306">3</text><text x="258" y="278">2</text>
    <text x="426" y="306">1</text>
    <text x="594" y="306">1</text><text x="594" y="278">0</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#9aa7b2">
    <text x="426" y="278">3</text><text x="426" y="250">2</text>
  </g>
  <g fill="#5c6b76" font-size="10.5">
    <text x="282" y="277">top</text><text x="618" y="277">top</text><text x="450" y="249">popped</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="90" y="340" fill="#5c6b76">stack empty</text>
    <text x="90" y="358" fill="#1a2026">ans[3] = <tspan fill="#9aa7b2" font-weight="600">-1</tspan></text>
    <text x="258" y="340" fill="#1a2026">t = (7-4)/(3-2)</text>
    <text x="258" y="358" fill="#1a2026">ans[2] = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="426" y="340" fill="#1a2026">pop 2 (sp 3), pop 3 (sp 2)</text>
    <text x="426" y="358" fill="#1a2026">ans[1] = <tspan fill="#9aa7b2" font-weight="600">-1</tspan></text>
    <text x="594" y="340" fill="#1a2026">t = (2-1)/(2-1)</text>
    <text x="594" y="358" fill="#1a2026">ans[0] = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  </g>
  <text x="40" y="388" fill="#1a2026" font-size="13">Cars faster than the current car pop for good, so cars 1 and 3 end at -1,</text>
  <text x="40" y="406" fill="#1a2026" font-size="13">while car 0 meets car 1 at t = <tspan fill="#4169E1" font-weight="600">1</tspan> and car 2 meets car 3 at t = <tspan fill="#4169E1" font-weight="600">3</tspan> — answer [1, -1, 3, -1].</text>
</svg>
