<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- timeToLive = 5; generate aaa@2 -> 7, generate bbb@7 -> 12, renew bbb@10 -> 15;
       final queue [(aaa,7), (bbb,12) stale, (bbb,15)], map {aaa: 7, bbb: 15};
       boxes 120x44 at x = 110/260/410, y = 124; count(6) returns 1, count(15) returns 0 -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="32" y="40">renew(aaa, 8): aaa expired at 7 (7 ≤ 8) — ignored, nothing changes</text>
    <text x="32" y="60">renew(bbb, 10): 12 &gt; 10, so bbb's expiry moves to 15 — (bbb, 12) is orphaned</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="170" y="112">map: aaa → 7</text>
    <text x="320" y="112">map: bbb → 15</text>
    <text x="470" y="112">map: bbb → 15</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="110" y="124" width="120" height="44"/>
    <rect x="260" y="124" width="120" height="44"/>
    <rect x="410" y="124" width="120" height="44"/>
  </g>
  <g text-anchor="middle" font-size="14.5" font-weight="600">
    <text x="170" y="151" fill="#1a2026">(aaa, 7)</text>
    <text x="320" y="151" fill="#9aa7b2">(bbb, 12)</text>
    <text x="470" y="151" fill="#1a2026">(bbb, 15)</text>
  </g>
  <line x1="288" y1="146" x2="352" y2="146" stroke="#9aa7b2" stroke-width="1.6"/>
  <path d="M 104 146 H 78" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="90" y="132" text-anchor="middle" fill="#4169E1" font-size="11">pop</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="170" y="186">front</text>
    <text x="320" y="186">stale</text>
    <text x="470" y="186">tail</text>
  </g>
  <text x="320" y="224" text-anchor="middle" fill="#1a2026" font-size="13">count(6) — the queue holds just (aaa, 7): live, 7 &gt; 6, so it returns <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <text x="320" y="246" text-anchor="middle" fill="#1a2026" font-size="13">count(15) — (aaa, 7) expired (7 ≤ 15) drops; (bbb, 12) is stale, dropped</text>
  <text x="320" y="266" text-anchor="middle" fill="#1a2026" font-size="13">untouched; (bbb, 15) expired (15 ≤ 15) drops — queue empty, returns <tspan fill="#4169E1" font-weight="600">0</tspan></text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Each entry is pushed once and popped at most once — every call is O(1) amortized.</text>
</svg>
