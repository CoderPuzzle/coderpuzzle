<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="352" fill="#ffffff"/>
  <!-- n = 10, answer 6: k = 2 staircase (S(2) = 4) + j = 3 runoff cells close the S(3) staircase.
       Corner at top; cell (x,y) floor centre = (240 + 26(x-y), 190 + 13(x+y)); cube rise 24, half-width 26, half-height 13.
       Column heights: (0,0)=3, (1,0)=2, (0,1)=2 on the pyramid; extras (2,0), (1,1), (0,2) = 1 each, accented. Total 3+2+2+1+1+1 = 10. -->
  <text x="340" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">example 3, n = 10: the k = 2 corner staircase plus j = 3 runoff cells on the next diagonal</text>
  <line x1="240" y1="164" x2="344" y2="216" stroke="#9aa7b2" stroke-width="5"/>
  <line x1="240" y1="164" x2="136" y2="216" stroke="#9aa7b2" stroke-width="5"/>
  <text x="352" y="222" text-anchor="start" fill="#9aa7b2" font-size="11">wall</text>
  <text x="128" y="222" text-anchor="end" fill="#9aa7b2" font-size="11">wall</text>
  <!-- column (0,0), height 3 -->
  <polygon points="214,166 240,179 240,203 214,190" fill="#f0f3f7" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="266,166 240,179 240,203 266,190" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="240,153 266,166 240,179 214,166" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="214,142 240,155 240,179 214,166" fill="#f0f3f7" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="266,142 240,155 240,179 266,166" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="240,129 266,142 240,155 214,142" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="214,118 240,131 240,155 214,142" fill="#f0f3f7" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="266,118 240,131 240,155 266,142" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="240,105 266,118 240,131 214,118" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <!-- column (1,0), height 2 -->
  <polygon points="240,179 266,192 266,216 240,203" fill="#f0f3f7" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="292,179 266,192 266,216 292,203" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="266,166 292,179 266,192 240,179" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="240,155 266,168 266,192 240,179" fill="#f0f3f7" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="292,155 266,168 266,192 292,179" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="266,142 292,155 266,168 240,155" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <!-- column (0,1), height 2 -->
  <polygon points="188,179 214,192 214,216 188,203" fill="#f0f3f7" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="240,179 214,192 214,216 240,203" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="214,166 240,179 214,192 188,179" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="188,155 214,168 214,192 188,179" fill="#f0f3f7" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="240,155 214,168 214,192 240,179" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <polygon points="214,142 240,155 214,168 188,155" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <!-- extra (2,0), height 1, accent -->
  <polygon points="266,192 292,205 292,229 266,216" fill="#f0f3f7" stroke="#4169E1" stroke-width="1.4"/>
  <polygon points="318,192 292,205 292,229 318,216" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <polygon points="292,179 318,192 292,205 266,192" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <!-- extra (1,1), height 1, accent -->
  <polygon points="214,192 240,205 240,229 214,216" fill="#f0f3f7" stroke="#4169E1" stroke-width="1.4"/>
  <polygon points="266,192 240,205 240,229 266,216" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <polygon points="240,179 266,192 240,205 214,192" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <!-- extra (0,2), height 1, accent -->
  <polygon points="162,192 188,205 188,229 162,216" fill="#f0f3f7" stroke="#4169E1" stroke-width="1.4"/>
  <polygon points="214,192 188,205 188,229 214,216" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <polygon points="188,179 214,192 188,205 162,192" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600" font-size="12.5">
    <text x="240" y="122" fill="#1a2026">3</text>
    <text x="266" y="159" fill="#1a2026">2</text>
    <text x="214" y="159" fill="#1a2026">2</text>
    <text x="292" y="196" fill="#4169E1">1</text>
    <text x="240" y="196" fill="#4169E1">1</text>
    <text x="188" y="196" fill="#4169E1">1</text>
  </g>
  <text x="240" y="262" text-anchor="middle" fill="#5c6b76" font-size="12">floor footprint: rows 3 · 2 · 1 = 6 cells</text>
  <text x="545" y="90" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">n = 10 → k = 2, j = 3</text>
  <text x="460" y="124" text-anchor="start" fill="#5c6b76" font-size="12.5">largest pyramid below n = 10:</text>
  <text x="460" y="144" text-anchor="start" fill="#1a2026" font-size="13">S(2) = 2·3·4/6 = 4</text>
  <text x="460" y="174" text-anchor="start" fill="#5c6b76" font-size="12.5">runoff for the rest 10 − 4 = 6:</text>
  <text x="460" y="194" text-anchor="start" fill="#1a2026" font-size="13">T'(3) = 3·4/2 = 6 → j = 3</text>
  <text x="460" y="230" text-anchor="start" fill="#1a2026" font-size="15" font-weight="600">floor = T(2) + j = 3 + 3 = <tspan fill="#4169E1">6</tspan></text>
  <text x="340" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Heights 3·2·2·1·1·1 stack to exactly n = 10; the accented diagonal x + y = 2 is the runoff:</text>
  <text x="340" y="328" text-anchor="middle" fill="#1a2026" font-size="13">its p-th cell adds p boxes, so the floor count is T(2) + j = 3 + 3 = <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
