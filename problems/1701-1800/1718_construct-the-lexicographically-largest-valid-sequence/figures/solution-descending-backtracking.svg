<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="372" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 3, sequence cells 44x30 at x=170+48j; rows y=62,134,206,278; row labels at x=20;
       dead try: value 2 at cell 1 needs cell 3, which already holds 3 -->
  <text x="288" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">each cell tries 3, 2, 1 in that order — the first complete sequence wins</text>
  <g fill="#5c6b76" font-size="12.5">
    <text x="20" y="54">cell 0: try 3</text>
    <text x="20" y="126">cell 1: try 2</text>
    <text x="20" y="198">cell 1: try 1</text>
    <text x="20" y="270">cell 2: try 2 — done</text>
  </g>
  <!-- row 1: 3 placed at cells 0 and 3 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="170" y="62" width="44" height="30" fill="#ffffff"/><rect x="218" y="62" width="44" height="30" fill="#f0f3f7"/>
    <rect x="266" y="62" width="44" height="30" fill="#f0f3f7"/><rect x="314" y="62" width="44" height="30" fill="#ffffff"/>
    <rect x="362" y="62" width="44" height="30" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="192" y="82">3</text><text x="336" y="82">3</text>
  </g>
  <!-- row 2: trying 2 at cell 1 dies — partner cell 3 is taken -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="170" y="134" width="44" height="30" fill="#ffffff"/><rect x="218" y="134" width="44" height="30" fill="#ffffff" stroke="#9aa7b2" stroke-dasharray="4 3"/>
    <rect x="266" y="134" width="44" height="30" fill="#f0f3f7"/><rect x="314" y="134" width="44" height="30" fill="#ffffff"/>
    <rect x="362" y="134" width="44" height="30" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="192" y="154" fill="#1a2026">3</text><text x="240" y="154" fill="#9aa7b2">2</text><text x="336" y="154" fill="#1a2026">3</text>
  </g>
  <text x="288" y="108" text-anchor="middle" fill="#5c6b76" font-size="11">cell 3 already holds 3</text>
  <path d="M 240 128 Q 288 112 336 128" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- row 3: 1 at cell 1 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="170" y="206" width="44" height="30" fill="#ffffff"/><rect x="218" y="206" width="44" height="30" fill="#ffffff"/>
    <rect x="266" y="206" width="44" height="30" fill="#f0f3f7"/><rect x="314" y="206" width="44" height="30" fill="#ffffff"/>
    <rect x="362" y="206" width="44" height="30" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="192" y="226">3</text><text x="240" y="226">1</text><text x="336" y="226">3</text>
  </g>
  <!-- row 4: complete sequence -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="170" y="278" width="44" height="30" fill="#dbe4fb"/><rect x="218" y="278" width="44" height="30" fill="#dbe4fb"/>
    <rect x="266" y="278" width="44" height="30" fill="#dbe4fb"/><rect x="314" y="278" width="44" height="30" fill="#dbe4fb"/>
    <rect x="362" y="278" width="44" height="30" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="192" y="298">3</text><text x="240" y="298">1</text><text x="288" y="298">2</text>
    <text x="336" y="298">3</text><text x="384" y="298">2</text>
  </g>
  <text x="320" y="340" text-anchor="middle" fill="#1a2026" font-size="13">The 2 at cell 1 dies — its partner cell 3 already holds 3 — so cell 1 takes 1,</text>
  <text x="320" y="360" text-anchor="middle" fill="#1a2026" font-size="13">and the first complete sequence <tspan fill="#4169E1" font-weight="600">[3,1,2,3,2]</tspan> is the lexicographically largest.</text>
</svg>
