<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- strs = ["ca","bb","ac"]; grid cells 60x40 at (70,80); flag chips 88x26 at x=406/512 -->
  <text x="100" y="68" text-anchor="middle" fill="#5c6b76" font-size="12.5">col 0</text>
  <text x="160" y="68" text-anchor="middle" fill="#5c6b76" font-size="12.5">col 1</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="80" width="60" height="40"/><rect x="130" y="80" width="60" height="40"/>
    <rect x="70" y="120" width="60" height="40"/><rect x="130" y="120" width="60" height="40"/>
    <rect x="70" y="160" width="60" height="40"/><rect x="130" y="160" width="60" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="100" y="105">c</text><text x="160" y="105">a</text>
    <text x="100" y="145">b</text><text x="160" y="145">b</text>
    <text x="100" y="185">a</text><text x="160" y="185">c</text>
  </g>
  <rect x="66" y="76" width="68" height="128" rx="5" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="100" y="226" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">deleted</text>
  <text x="160" y="226" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12.5">kept</text>
  <!-- one tie flag per adjacent row pair -->
  <text x="348" y="92" text-anchor="middle" fill="#5c6b76" font-size="12">pair flag</text>
  <text x="450" y="92" text-anchor="middle" fill="#5c6b76" font-size="12">after col 0</text>
  <text x="556" y="92" text-anchor="middle" fill="#5c6b76" font-size="12">after col 1</text>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="348" y="118">ca / bb</text>
    <text x="348" y="158">bb / ac</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#f0f3f7">
    <rect x="406" y="100" width="88" height="26" rx="13"/><rect x="406" y="140" width="88" height="26" rx="13"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="450" y="117">tied</text><text x="450" y="157">tied</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#dbe4fb">
    <rect x="512" y="100" width="88" height="26" rx="13"/><rect x="512" y="140" width="88" height="26" rx="13"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">
    <text x="556" y="117">ordered</text><text x="556" y="157">ordered</text>
  </g>
  <text x="450" y="188" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12">delete — c &gt; b</text>
  <text x="556" y="188" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12">keep — a &lt; b, b &lt; c</text>
  <text x="503" y="208" text-anchor="middle" fill="#5c6b76" font-size="10.5">deleted columns never move a flag</text>
  <text x="320" y="254" text-anchor="middle" fill="#1a2026" font-size="13">A column is deleted only when it strictly drops a still-tied pair;</text>
  <text x="320" y="274" text-anchor="middle" fill="#1a2026" font-size="13">column 0 drops ca/bb, column 1 rises on both — exactly <tspan fill="#4169E1" font-weight="600">1</tspan> deletion.</text>
</svg>
