<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- x = 40 + 20 * value -->
  <g stroke="#dfe5ea" stroke-width="1">
    <line x1="40" y1="38" x2="40" y2="152"/>
    <line x1="120" y1="38" x2="120" y2="152"/>
    <line x1="200" y1="38" x2="200" y2="152"/>
    <line x1="280" y1="38" x2="280" y2="152"/>
    <line x1="360" y1="38" x2="360" y2="152"/>
    <line x1="440" y1="38" x2="440" y2="152"/>
    <line x1="520" y1="38" x2="520" y2="152"/>
    <line x1="560" y1="38" x2="560" y2="152"/>
  </g>
  <!-- lane A: [[0,2],[5,10],[13,23],[24,25]] -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="40" y="48" width="40" height="18"/>
    <rect x="140" y="48" width="100" height="18"/>
    <rect x="300" y="48" width="200" height="18"/>
    <rect x="520" y="48" width="20" height="18"/>
  </g>
  <!-- lane B: [[1,5],[8,12],[15,24],[25,26]] -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="60" y="88" width="80" height="18"/>
    <rect x="200" y="88" width="80" height="18"/>
    <rect x="340" y="88" width="180" height="18"/>
    <rect x="540" y="88" width="20" height="18"/>
  </g>
  <!-- lane ans: [1,2] [5,5] [8,10] [15,23] [24,24] [25,25] -->
  <g fill="#4169E1">
    <rect x="60" y="128" width="20" height="18"/>
    <rect x="138" y="128" width="4" height="18"/>
    <rect x="200" y="128" width="40" height="18"/>
    <rect x="340" y="128" width="160" height="18"/>
    <rect x="518" y="128" width="4" height="18"/>
    <rect x="538" y="128" width="4" height="18"/>
  </g>
  <g fill="#5c6b76" font-size="12.5" text-anchor="end">
    <text x="32" y="62">A</text>
    <text x="32" y="102">B</text>
    <text x="32" y="142">ans</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.2">
    <line x1="40" y1="158" x2="560" y2="158"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="40" y="174">0</text>
    <text x="120" y="174">4</text>
    <text x="200" y="174">8</text>
    <text x="280" y="174">12</text>
    <text x="360" y="174">16</text>
    <text x="440" y="174">20</text>
    <text x="520" y="174">24</text>
  </g>
  <text x="300" y="194" text-anchor="middle" fill="#5c6b76" font-size="12.5">wherever A and B overlap or merely touch, a blue piece lands in the answer</text>
</svg>
