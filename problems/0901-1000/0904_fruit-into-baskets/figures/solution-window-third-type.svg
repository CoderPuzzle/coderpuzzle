      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- fruits = [1,2,3,2,2]; cells 48x36 at x=170+58k, rows y=60/136/212; brackets mark the window -->
  <text x="310" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">fruits = [1, 2, 3, 2, 2]</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.2">
    <rect x="170" y="60" width="48" height="36"/><rect x="228" y="60" width="48" height="36"/>
    <rect x="344" y="60" width="48" height="36"/><rect x="402" y="60" width="48" height="36"/>
    <rect x="228" y="136" width="48" height="36"/><rect x="286" y="136" width="48" height="36"/>
    <rect x="344" y="136" width="48" height="36"/><rect x="402" y="136" width="48" height="36"/>
    <rect x="170" y="212" width="48" height="36"/>
  </g>
  <rect x="286" y="60" width="48" height="36" fill="#ffffff" stroke="#4169E1" stroke-width="2.2"/>
  <rect x="170" y="136" width="48" height="36" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="228" y="212" width="48" height="36"/><rect x="286" y="212" width="48" height="36"/><rect x="344" y="212" width="48" height="36"/><rect x="402" y="212" width="48" height="36"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="194" y="83">1</text><text x="252" y="83">2</text><text x="310" y="83">3</text><text x="368" y="83">2</text><text x="426" y="83">2</text>
    <text x="252" y="159">2</text><text x="310" y="159">3</text><text x="368" y="159">2</text><text x="426" y="159">2</text>
  </g>
  <text x="194" y="159" text-anchor="middle" fill="#9aa7b2">1</text>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="252" y="235">2</text><text x="310" y="235">3</text><text x="368" y="235">2</text><text x="426" y="235">2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
