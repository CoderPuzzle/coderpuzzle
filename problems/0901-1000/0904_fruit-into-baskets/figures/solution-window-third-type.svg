    <text x="281" y="204">[2, 3] after the 1 retires from the left</text>
    <text x="339" y="280">[2, 3, 2, 2] &#8212; length <tspan fill="#4169E1" font-weight="600">4</tspan>, the best window</text>
  </g>
  <text x="310" y="308" text-anchor="middle" fill="#1a2026" font-size="13">The window reaches [1, 2, 3], the 1 retires, and growth resumes &#8212;</text>
  <text x="310" y="330" text-anchor="middle" fill="#1a2026" font-size="13">[2, 3, 2, 2] spans <tspan fill="#4169E1" font-weight="600">4</tspan> trees, the longest legal window and the answer.</text>
