<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- root = [10,5,15,3,7,null,18], window [7,15]; pop 10(+10), 5(cut left), 7(+7), 15(+15), 18(cut right); sum 32; nodes r=21 -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="233.9" y1="91.5" x2="171.1" y2="144.5"/>
    <line x1="266.1" y1="91.5" x2="328.9" y2="144.5"/>
    <line x1="167.4" y1="175" x2="202.6" y2="223"/>
    <line x1="363.6" y1="174" x2="401.4" y2="224"/>
  </g>
  <line x1="144.6" y1="176.2" x2="118.4" y2="221.8" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4"/>
  <!-- in-window nodes: accent -->
  <g stroke="none">
    <circle cx="250" cy="78" r="21" fill="#4169E1"/>
    <circle cx="215" cy="240" r="21" fill="#4169E1"/>
    <circle cx="345" cy="158" r="21" fill="#4169E1"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-weight="600">
    <text x="250" y="83">10</text><text x="215" y="245">7</text><text x="345" y="163">15</text>
  </g>
  <!-- visited, not counted -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="155" cy="158" r="21"/>
    <circle cx="415" cy="240" r="21"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="155" y="163">5</text><text x="415" y="245">18</text>
  </g>
  <!-- pruned: 3 -->
  <circle cx="108" cy="240" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="108" y="245" text-anchor="middle" fill="#9aa7b2" font-weight="600">3</text>
  <g fill="#5c6b76" font-size="12.5">
    <text x="28" y="150">5 &lt; low 7:</text>
    <text x="28" y="166">left subtree cut</text>
    <text x="108" y="278" text-anchor="middle">pruned</text>
    <text x="415" y="278" text-anchor="middle">18 &gt; 15: cut right</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="250" y="48">+10</text>
    <text x="345" y="126">+15</text>
    <text x="215" y="278">+7</text>
  </g>
  <!-- stack walk panel -->
  <text x="500" y="58" fill="#5c6b76" font-size="12.5" font-weight="600">stack walk (pop → rule)</text>
  <g font-size="12" fill="#1a2026">
    <text x="500" y="82">10 in: <tspan fill="#4169E1" font-weight="600">+10</tspan> → [15 5]</text>
    <text x="500" y="106">5 low: cut L → [15 7]</text>
    <text x="500" y="130">7 in: <tspan fill="#4169E1" font-weight="600">+7</tspan> → [15]</text>
    <text x="500" y="154">15 in: <tspan fill="#4169E1" font-weight="600">+15</tspan> → [18]</text>
    <text x="500" y="178">18 high: cut R → []</text>
  </g>
  <text x="500" y="206" fill="#1a2026" font-size="12.5">sum = 10 + 7 + 15 = <tspan fill="#4169E1" font-weight="600">32</tspan></text>
  <text x="340" y="340" text-anchor="middle" fill="#1a2026" font-size="13">Below 7 only a right move helps; above 15 only a left one.</text>
  <text x="340" y="360" text-anchor="middle" fill="#1a2026" font-size="13">The in-window pops 10, 7, 15 sum to <tspan fill="#4169E1" font-weight="600">32</tspan> — nothing in range is missed.</text>
</svg>
