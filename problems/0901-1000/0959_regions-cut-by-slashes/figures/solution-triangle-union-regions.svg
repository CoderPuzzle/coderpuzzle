<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="360" fill="#ffffff"/>
  <defs>
    <pattern id="hatchG" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9aa7b2" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatchA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#4169E1" stroke-width="1.6"/>
    </pattern>
  </defs>
  <!-- grid = ["/\\","\\/"]; squares 110px at (70,60); each square quarters into T/R/B/L triangles;
       five surviving sets: 4 corner halves + the central diamond -->
  <text x="180" y="46" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid = ["/\", "\/"]</text>
  <!-- triangle fills by surviving set -->
  <g stroke="none">
    <polygon points="70,60 180,60 125,115" fill="#f0f3f7"/><polygon points="70,60 70,170 125,115" fill="#f0f3f7"/>
    <polygon points="180,60 290,60 235,115" fill="#ffffff"/><polygon points="290,60 290,170 235,115" fill="#ffffff"/>
    <polygon points="70,280 180,280 125,225" fill="url(#hatchG)"/><polygon points="70,170 70,280 125,225" fill="url(#hatchG)"/>
    <polygon points="180,280 290,280 235,225" fill="url(#hatchA)"/><polygon points="290,170 290,280 235,225" fill="url(#hatchA)"/>
    <polygon points="180,60 180,170 125,115" fill="#dbe4fb"/><polygon points="70,170 180,170 125,115" fill="#dbe4fb"/>
    <polygon points="180,170 290,170 235,115" fill="#dbe4fb"/><polygon points="180,60 180,170 235,115" fill="#dbe4fb"/>
    <polygon points="70,170 180,170 125,225" fill="#dbe4fb"/><polygon points="180,170 180,280 125,225" fill="#dbe4fb"/>
    <polygon points="180,170 290,170 235,225" fill="#dbe4fb"/><polygon points="180,170 180,280 235,225" fill="#dbe4fb"/>
  </g>
  <!-- quartering diagonals (light) and square borders -->
  <g stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3">
    <line x1="70" y1="60" x2="180" y2="170"/><line x1="180" y1="170" x2="290" y2="60"/>
    <line x1="70" y1="280" x2="180" y2="170"/><line x1="180" y1="170" x2="290" y2="280"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <rect x="70" y="60" width="220" height="220"/>
    <line x1="180" y1="60" x2="180" y2="280"/><line x1="70" y1="170" x2="290" y2="170"/>
  </g>
  <!-- walls -->
  <g stroke="#1a2026" stroke-width="3.5" stroke-linecap="round">
    <line x1="70" y1="170" x2="180" y2="60"/><line x1="180" y1="60" x2="290" y2="170"/>
    <line x1="70" y1="170" x2="180" y2="280"/><line x1="180" y1="280" x2="290" y2="170"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="95" y="100">1</text><text x="265" y="100">2</text>
    <text x="95" y="250">3</text><text x="265" y="250">4</text>
  </g>
  <text x="180" y="175" text-anchor="middle" font-weight="600" font-size="15" fill="#4169E1" stroke="#ffffff" stroke-width="4" paint-order="stroke">5</text>
  <!-- legend -->
  <text x="330" y="54" fill="#5c6b76" font-size="12.5">five surviving union-find sets</text>
  <g stroke="#42525e" stroke-width="1">
    <rect x="330" y="67" width="22" height="16" fill="#f0f3f7"/>
    <rect x="330" y="99" width="22" height="16" fill="#ffffff"/>
    <rect x="330" y="131" width="22" height="16" fill="url(#hatchG)"/>
    <rect x="330" y="163" width="22" height="16" fill="url(#hatchA)"/>
    <rect x="330" y="195" width="22" height="16" fill="#dbe4fb"/>
  </g>
  <g font-size="11.5" fill="#1a2026">
    <text x="362" y="80">(0,0) top + left — top-left corner</text>
    <text x="362" y="112">(0,1) top + right — top-right corner</text>
    <text x="362" y="144">(1,0) bottom + left — bottom-left corner</text>
    <text x="362" y="176">(1,1) bottom + right — bottom-right corner</text>
    <text x="362" y="208" font-weight="600">inner half of every square — the diamond</text>
  </g>
  <text x="320" y="322" text-anchor="middle" fill="#1a2026" font-size="13">A / square unions top+left and right+bottom; a \ square unions top+right and</text>
  <text x="320" y="342" text-anchor="middle" fill="#1a2026" font-size="13">bottom+left, and open edges chain the inner halves — <tspan fill="#4169E1" font-weight="600">5</tspan> regions.</text>
</svg>
