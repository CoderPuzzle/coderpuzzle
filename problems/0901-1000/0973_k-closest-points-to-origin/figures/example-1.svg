<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- points = [[1,3],[-2,2]], k = 1; origin (180,180), 30 px per unit -->
  <g stroke="#dfe5ea" stroke-width="1">
    <line x1="210" y1="30" x2="210" y2="330"/>
    <line x1="240" y1="30" x2="240" y2="330"/>
    <line x1="270" y1="30" x2="270" y2="330"/>
    <line x1="300" y1="30" x2="300" y2="330"/>
    <line x1="330" y1="30" x2="330" y2="330"/>
    <line x1="30" y1="30" x2="30" y2="330"/>
    <line x1="60" y1="30" x2="60" y2="330"/>
    <line x1="90" y1="30" x2="90" y2="330"/>
    <line x1="120" y1="30" x2="120" y2="330"/>
    <line x1="150" y1="30" x2="150" y2="330"/>
    <line x1="30" y1="150" x2="330" y2="150"/>
    <line x1="30" y1="120" x2="330" y2="120"/>
    <line x1="30" y1="90" x2="330" y2="90"/>
    <line x1="30" y1="60" x2="330" y2="60"/>
    <line x1="30" y1="210" x2="330" y2="210"/>
    <line x1="30" y1="240" x2="330" y2="240"/>
    <line x1="30" y1="270" x2="330" y2="270"/>
    <line x1="30" y1="300" x2="330" y2="300"/>
    <line x1="30" y1="330" x2="330" y2="330"/>
  </g>
  <g stroke="#5c6b76" stroke-width="1.4">
    <line x1="30" y1="180" x2="330" y2="180"/>
    <line x1="180" y1="30" x2="180" y2="330"/>
  </g>
  <g fill="#5c6b76" font-size="10.5" text-anchor="middle">
    <text x="30" y="196">-5</text>
    <text x="60" y="196">-4</text>
    <text x="90" y="196">-3</text>
    <text x="120" y="196">-2</text>
    <text x="150" y="196">-1</text>
    <text x="210" y="196">1</text>
    <text x="240" y="196">2</text>
    <text x="270" y="196">3</text>
    <text x="300" y="196">4</text>
    <text x="330" y="196">5</text>
    <text x="170" y="153">1</text>
    <text x="170" y="123">2</text>
    <text x="170" y="93">3</text>
    <text x="170" y="63">4</text>
    <text x="170" y="33">5</text>
    <text x="170" y="213">-1</text>
    <text x="170" y="243">-2</text>
    <text x="170" y="273">-3</text>
    <text x="170" y="303">-4</text>
    <text x="170" y="333">-5</text>
  </g>
  <!-- distances to the origin -->
  <g stroke="#5c6b76" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
    <line x1="180" y1="180" x2="210" y2="90"/>
    <line x1="180" y1="180" x2="120" y2="120"/>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="204" y="146">&#8730;10</text>
    <text x="146" y="156" text-anchor="end">&#8730;8</text>
  </g>
  <circle cx="210" cy="90" r="6" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="222" y="86" fill="#1a2026">(1, 3)</text>
  <circle cx="120" cy="120" r="6.5" fill="#4169E1"/>
  <text x="120" y="106" text-anchor="middle" fill="#1a2026" font-weight="600">(-2, 2)</text>
  <text x="180" y="344" text-anchor="middle" fill="#5c6b76" font-size="12.5">&#8730;8 &lt; &#8730;10, so (-2, 2) is the k = 1 closest point</text>
</svg>
