<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="470" fill="#ffffff"/>
  <!-- Example 3 board; R at row 3, col 3; cell (i,j) drawn at (40 + 44j, 40 + 44i), 44px;
       light squares are the empty squares each ray traverses; rays stop at the first piece:
       pawns at (2,3), (3,1), (3,5) are captures, the bishop at (5,3) blocks the down ray -->
  <g stroke="#42525e" stroke-width="1" fill="#ffffff">
    <rect x="40" y="40" width="44" height="44"/><rect x="84" y="40" width="44" height="44"/><rect x="128" y="40" width="44" height="44"/><rect x="172" y="40" width="44" height="44"/><rect x="216" y="40" width="44" height="44"/><rect x="260" y="40" width="44" height="44"/><rect x="304" y="40" width="44" height="44"/><rect x="348" y="40" width="44" height="44"/>
    <rect x="40" y="84" width="44" height="44"/><rect x="84" y="84" width="44" height="44"/><rect x="128" y="84" width="44" height="44"/><rect x="172" y="84" width="44" height="44"/><rect x="216" y="84" width="44" height="44"/><rect x="260" y="84" width="44" height="44"/><rect x="304" y="84" width="44" height="44"/><rect x="348" y="84" width="44" height="44"/>
    <rect x="40" y="128" width="44" height="44"/><rect x="84" y="128" width="44" height="44"/><rect x="128" y="128" width="44" height="44"/><rect x="172" y="128" width="44" height="44"/><rect x="216" y="128" width="44" height="44"/><rect x="260" y="128" width="44" height="44"/><rect x="304" y="128" width="44" height="44"/><rect x="348" y="128" width="44" height="44"/>
    <rect x="40" y="172" width="44" height="44"/><rect x="84" y="172" width="44" height="44"/><rect x="128" y="172" width="44" height="44"/><rect x="172" y="172" width="44" height="44"/><rect x="216" y="172" width="44" height="44"/><rect x="260" y="172" width="44" height="44"/><rect x="304" y="172" width="44" height="44"/><rect x="348" y="172" width="44" height="44"/>
    <rect x="40" y="216" width="44" height="44"/><rect x="84" y="216" width="44" height="44"/><rect x="128" y="216" width="44" height="44"/><rect x="172" y="216" width="44" height="44"/><rect x="216" y="216" width="44" height="44"/><rect x="260" y="216" width="44" height="44"/><rect x="304" y="216" width="44" height="44"/><rect x="348" y="216" width="44" height="44"/>
    <rect x="40" y="260" width="44" height="44"/><rect x="84" y="260" width="44" height="44"/><rect x="128" y="260" width="44" height="44"/><rect x="172" y="260" width="44" height="44"/><rect x="216" y="260" width="44" height="44"/><rect x="260" y="260" width="44" height="44"/><rect x="304" y="260" width="44" height="44"/><rect x="348" y="260" width="44" height="44"/>
    <rect x="40" y="304" width="44" height="44"/><rect x="84" y="304" width="44" height="44"/><rect x="128" y="304" width="44" height="44"/><rect x="172" y="304" width="44" height="44"/><rect x="216" y="304" width="44" height="44"/><rect x="260" y="304" width="44" height="44"/><rect x="304" y="304" width="44" height="44"/><rect x="348" y="304" width="44" height="44"/>
    <rect x="40" y="348" width="44" height="44"/><rect x="84" y="348" width="44" height="44"/><rect x="128" y="348" width="44" height="44"/><rect x="172" y="348" width="44" height="44"/><rect x="216" y="348" width="44" height="44"/><rect x="260" y="348" width="44" height="44"/><rect x="304" y="348" width="44" height="44"/><rect x="348" y="348" width="44" height="44"/>
  </g>
  <rect x="128" y="172" width="44" height="44" fill="#dbe4fb"/>
  <rect x="216" y="172" width="44" height="44" fill="#dbe4fb"/>
  <rect x="172" y="216" width="44" height="44" fill="#dbe4fb"/>
  <g stroke="#4169E1" stroke-width="3" stroke-linecap="round">
    <line x1="194" y1="198" x2="194" y2="154"/>
    <line x1="194" y1="198" x2="106" y2="198"/>
    <line x1="194" y1="198" x2="282" y2="198"/>
  </g>
  <line x1="194" y1="198" x2="194" y2="286" stroke="#9aa7b2" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <circle cx="194" cy="154" r="18"/><circle cx="106" cy="198" r="18"/><circle cx="282" cy="198" r="18"/>
  </g>
  <circle cx="194" cy="286" r="18" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="194" y="115">p</text><text x="194" y="159">p</text>
    <text x="62" y="203">p</text><text x="106" y="203">p</text><text x="282" y="203">p</text>
    <text x="194" y="335">p</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#5c6b76">
    <text x="326" y="203">B</text><text x="194" y="291">B</text>
  </g>
  <text x="194" y="204" text-anchor="middle" font-weight="700" font-size="17" fill="#4169E1">R</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="404" y1="116" x2="420" y2="116" stroke="#4169E1"/>
    <line x1="404" y1="146" x2="420" y2="146" stroke="#4169E1"/>
    <line x1="404" y1="176" x2="420" y2="176" stroke="#4169E1"/>
    <line x1="404" y1="206" x2="420" y2="206" stroke="#9aa7b2"/>
  </g>
  <g font-size="13" fill="#1a2026">
    <text x="428" y="120">up: pawn at (2,3) — <tspan fill="#4169E1" font-weight="600">capture</tspan></text>
    <text x="428" y="150">left: pawn at (3,1) — <tspan fill="#4169E1" font-weight="600">capture</tspan></text>
    <text x="428" y="180">right: pawn at (3,5) — <tspan fill="#4169E1" font-weight="600">capture</tspan></text>
    <text x="428" y="210">down: bishop at (5,3) — <tspan fill="#5c6b76" font-weight="600">blocked</tspan></text>
  </g>
  <text x="428" y="250" font-size="15" font-weight="600" fill="#4169E1">captures = 3</text>
  <text x="428" y="280" font-size="12.5" fill="#5c6b76">pawns behind it stay out of reach</text>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="340" y="428">Walking out from the rook until the first piece, the scans find</text>
    <text x="340" y="446">pawns up, left, and right — <tspan fill="#4169E1" font-weight="600">3</tspan> captures; the bishop blocks the down ray.</text>
  </g>
</svg>
