<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- initial [1, 2]; snapshots: constructor queue [1, 2], insert(3) -> queue [2, 3], insert(4) -> queue [2, 3, 4]; node circles r 16, queue cells 30x26 at y 246, accented cell = queue front (next parent) -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="110" y="32">CBTInserter([1, 2])</text>
    <text x="320" y="32">insert(3) → 1</text>
    <text x="530" y="32">insert(4) → 2</text>
    <text x="110" y="240">queue</text>
    <text x="320" y="240">queue</text>
    <text x="530" y="240">queue</text>
  </g>
  <!-- tree after construction -->
  <line x1="110" y1="72" x2="78" y2="134" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="110" cy="72" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="110" y="77" text-anchor="middle">1</text>
  <circle cx="78" cy="134" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="78" y="139" text-anchor="middle">2</text>
  <!-- tree after insert(3): 3 under 1's right slot -->
  <line x1="320" y1="72" x2="288" y2="134" stroke="#42525e" stroke-width="1.6"/>
  <line x1="320" y1="72" x2="352" y2="134" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="320" cy="72" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="320" y="77" text-anchor="middle">1</text>
  <circle cx="288" cy="134" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="288" y="139" text-anchor="middle">2</text>
  <circle cx="352" cy="134" r="16" fill="#4169E1"/>
  <text x="352" y="139" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <!-- tree after insert(4): 4 under 2's left slot -->
  <line x1="530" y1="72" x2="498" y2="134" stroke="#42525e" stroke-width="1.6"/>
  <line x1="530" y1="72" x2="562" y2="134" stroke="#42525e" stroke-width="1.6"/>
  <line x1="498" y1="134" x2="466" y2="196" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="530" cy="72" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="530" y="77" text-anchor="middle">1</text>
  <circle cx="498" cy="134" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="498" y="139" text-anchor="middle">2</text>
  <circle cx="562" cy="134" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="562" y="139" text-anchor="middle">3</text>
  <circle cx="466" cy="196" r="16" fill="#4169E1"/>
  <text x="466" y="201" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  <!-- 2's open right slot is why it stays queued -->
  <circle cx="530" cy="196" r="10" fill="none" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="3 3"/>
  <!-- queues, front cell accented -->
  <g text-anchor="middle" font-weight="600">
    <rect x="76" y="246" width="30" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="91" y="264">1</text>
    <rect x="114" y="246" width="30" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="129" y="264">2</text>
    <rect x="286" y="246" width="30" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="301" y="264">2</text>
    <rect x="324" y="246" width="30" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="339" y="264">3</text>
    <rect x="477" y="246" width="30" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="492" y="264">2</text>
    <rect x="515" y="246" width="30" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="530" y="264">3</text>
    <rect x="553" y="246" width="30" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="568" y="264">4</text>
  </g>
  <text x="91" y="290" text-anchor="middle" fill="#4169E1" font-size="10.5">front</text>
  <text x="320" y="306" text-anchor="middle" fill="#1a2026" font-size="13">insert(3) fills the front 1's right slot, so 1 leaves and 3 joins; insert(4) then</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">fills 2's left slot, so 2 stays front (right slot open) — get_root() is [1, 2, 3, 4].</text>
</svg>
