<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="390" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- rods = [1,2,3,6]; dp rows after rods 1-3, columns d = -6..6, cell = tallest left height;
       bottom: rod 6 relaxes the gap (d 6, left 6) three ways -->
  <text x="341" y="50" text-anchor="middle" fill="#5c6b76" font-size="11">seed  d 0 → left 0</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="137" y="76">-6</text><text x="171" y="76">-5</text><text x="205" y="76">-4</text>
    <text x="239" y="76">-3</text><text x="273" y="76">-2</text><text x="307" y="76">-1</text>
    <text x="341" y="76" font-weight="600" fill="#4169E1">0</text>
    <text x="375" y="76">1</text><text x="409" y="76">2</text><text x="443" y="76">3</text>
    <text x="477" y="76">4</text><text x="511" y="76">5</text><text x="545" y="76">6</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11.5">
    <text x="112" y="103">after rod 1</text>
    <text x="112" y="137">after rod 2</text>
    <text x="112" y="171">after rod 3</text>
  </g>
  <!-- cells: fill #f0f3f7 = unreachable, #ffffff = reached, #dbe4fb = the d = 0 column -->
  <g stroke="#42525e" stroke-width="1">
    <g fill="#f0f3f7">
      <rect x="120" y="84" width="34" height="30"/><rect x="154" y="84" width="34" height="30"/><rect x="188" y="84" width="34" height="30"/>
      <rect x="222" y="84" width="34" height="30"/><rect x="256" y="84" width="34" height="30"/>
      <rect x="120" y="118" width="34" height="30"/><rect x="154" y="118" width="34" height="30"/>
      <rect x="460" y="118" width="34" height="30"/><rect x="494" y="118" width="34" height="30"/><rect x="528" y="118" width="34" height="30"/>
    </g>
    <g fill="#ffffff">
      <rect x="290" y="84" width="34" height="30"/><rect x="324" y="84" width="34" height="30"/><rect x="358" y="84" width="34" height="30"/>
      <rect x="222" y="118" width="34" height="30"/>
      <rect x="256" y="118" width="34" height="30"/><rect x="290" y="118" width="34" height="30"/>
      <rect x="358" y="118" width="34" height="30"/><rect x="392" y="118" width="34" height="30"/><rect x="426" y="118" width="34" height="30"/>
      <rect x="120" y="152" width="34" height="30"/><rect x="154" y="152" width="34" height="30"/><rect x="188" y="152" width="34" height="30"/>
      <rect x="222" y="152" width="34" height="30"/><rect x="256" y="152" width="34" height="30"/><rect x="290" y="152" width="34" height="30"/>
      <rect x="358" y="152" width="34" height="30"/><rect x="392" y="152" width="34" height="30"/>
      <rect x="426" y="152" width="34" height="30"/><rect x="460" y="152" width="34" height="30"/>
      <rect x="494" y="152" width="34" height="30"/><rect x="528" y="152" width="34" height="30"/>
    </g>
    <g fill="#dbe4fb">
      <rect x="324" y="84" width="34" height="30"/>
      <rect x="324" y="118" width="34" height="30"/>
      <rect x="324" y="152" width="34" height="30"/>
    </g>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="307" y="104">0</text><text x="341" y="104">0</text><text x="375" y="104">1</text>
    <text x="239" y="138">0</text><text x="273" y="138">0</text><text x="307" y="138">1</text>
    <text x="341" y="138">0</text><text x="375" y="138">2</text><text x="409" y="138">2</text><text x="443" y="138">3</text>
    <text x="137" y="172">0</text><text x="171" y="172">0</text><text x="205" y="172">1</text>
    <text x="239" y="172">3</text><text x="273" y="172">2</text><text x="307" y="172">2</text>
    <text x="341" y="172">3</text><text x="375" y="172">3</text><text x="409" y="172">4</text><text x="443" y="172">3</text>
    <text x="477" y="172">5</text><text x="511" y="172">5</text><text x="545" y="172">6</text>
  </g>
  <path d="M 545 186 C 545 202 320 196 158 209" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowM)"/>
  <!-- rod 6 relaxes (d 6, left 6) -->
  <text x="140" y="280" text-anchor="middle" fill="#5c6b76" font-size="12">rod 6, three fates</text>
  <rect x="60" y="210" width="160" height="48" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="140" y="230" text-anchor="middle" font-weight="600" fill="#1a2026" font-size="13.5">d 6, left 6</text>
  <text x="140" y="248" text-anchor="middle" fill="#5c6b76" font-size="10.5">rods 1+2+3 all welded left</text>
  <path d="M 224 224 C 320 224 330 221 394 221" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 224 234 C 320 234 330 261 394 261" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <path d="M 224 244 C 320 244 330 301 394 301" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="400" y="206" width="200" height="30" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="500" y="225" text-anchor="middle" fill="#1a2026" font-size="13">weld left  →  (d 12, left 12)</text>
  <rect x="400" y="246" width="200" height="30" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="500" y="265" text-anchor="middle" font-weight="600" fill="#1a2026" font-size="13">weld right  →  (d 0, left 6)</text>
  <rect x="400" y="286" width="200" height="30" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="500" y="305" text-anchor="middle" fill="#1a2026" font-size="13">discard  →  (d 6, left 6)</text>
  <text x="340" y="352" text-anchor="middle" fill="#1a2026" font-size="13">Every reached gap relaxes three ways per rod and keeps its tallest left height;</text>
  <text x="340" y="372" text-anchor="middle" fill="#1a2026" font-size="13">rod 6's right weld closes the gap, so d = 0 stores left height <tspan fill="#4169E1" font-weight="600">6</tspan> — the answer.</text>
</svg>
