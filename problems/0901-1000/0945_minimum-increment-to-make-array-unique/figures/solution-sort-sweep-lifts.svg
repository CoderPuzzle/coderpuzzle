<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums [3,2,1,2,1,7] sorted to [1,1,2,2,3,7]; sweep grants finals [1,2,3,4,5,7]; lifts 0,+1,+1,+2,+2,0 = 6 moves;
       cells 64x40 at x = 100+76k, sorted row y = 60, finals row y = 170 -->
  <text x="88" y="85" text-anchor="end" fill="#5c6b76" font-size="12.5">sorted</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="100" y="60" width="64" height="40"/>
    <rect x="480" y="60" width="64" height="40"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="176" y="60" width="64" height="40"/>
    <rect x="252" y="60" width="64" height="40"/>
    <rect x="328" y="60" width="64" height="40"/>
    <rect x="404" y="60" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="132" y="85">1</text><text x="208" y="85">1</text><text x="284" y="85">2</text>
    <text x="360" y="85">2</text><text x="436" y="85">3</text><text x="512" y="85">7</text>
  </g>
  <!-- lift arrows: sorted[i] down to its final -->
  <g fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowm)">
    <path d="M 132 104 L 132 166"/>
    <path d="M 512 104 L 512 166"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M 208 104 L 208 166"/>
    <path d="M 284 104 L 284 166"/>
    <path d="M 360 104 L 360 166"/>
    <path d="M 436 104 L 436 166"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <text x="148" y="140" fill="#9aa7b2">+0</text>
    <text x="224" y="140" fill="#4169E1">+1</text>
    <text x="300" y="140" fill="#4169E1">+1</text>
    <text x="376" y="140" fill="#4169E1">+2</text>
    <text x="452" y="140" fill="#4169E1">+2</text>
    <text x="528" y="140" fill="#9aa7b2">+0</text>
  </g>
  <text x="88" y="195" text-anchor="end" fill="#5c6b76" font-size="12.5">finals</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="100" y="170" width="64" height="40"/>
    <rect x="176" y="170" width="64" height="40"/>
    <rect x="252" y="170" width="64" height="40"/>
    <rect x="328" y="170" width="64" height="40"/>
    <rect x="404" y="170" width="64" height="40"/>
    <rect x="480" y="170" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="132" y="195">1</text><text x="208" y="195">2</text><text x="284" y="195">3</text>
    <text x="360" y="195">4</text><text x="436" y="195">5</text><text x="512" y="195">7</text>
  </g>
  <text x="310" y="244" text-anchor="middle" fill="#1a2026" font-size="13">The sweep lifts each duplicate to prev + 1: moves 0, 1, 1, 2, 2, 0 — total <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
  <text x="310" y="264" text-anchor="middle" fill="#1a2026" font-size="13">Finals [1,2,3,4,5,7] — the statement's answer up to order.</text>
</svg>
