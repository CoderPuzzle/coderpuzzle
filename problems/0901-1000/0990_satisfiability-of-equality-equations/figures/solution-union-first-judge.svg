<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- equations = ["a==b","b!=a"]; parent = list(range(26)); pass one: parent[find(a)] = find(b)
       so parent[a] = b; pass two: find(b) == find(a) = b fails b != a -->
  <g fill="#ffffff" stroke="#4169E1" stroke-width="1.5">
    <rect x="40" y="30" width="70" height="26" rx="4"/>
  </g>
  <text x="75" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">a==b</text>
  <text x="124" y="48" fill="#5c6b76" font-size="12.5">pass one: union (parent[a] = b)</text>
  <rect x="370" y="30" width="70" height="26" rx="4" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="405" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">b!=a</text>
  <text x="454" y="48" fill="#5c6b76" font-size="12.5">pass two: judge</text>
  <text x="40" y="84" fill="#5c6b76" font-size="12.5">parent array after pass one</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="62" y="92">a</text><text x="110" y="92">b</text><text x="158" y="92">c</text><text x="206" y="92">d</text><text x="254" y="92">e</text><text x="302" y="92">f</text><text x="350" y="92">g</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="40" y="96" width="44" height="34"/><rect x="136" y="96" width="44" height="34"/><rect x="184" y="96" width="44" height="34"/><rect x="232" y="96" width="44" height="34"/><rect x="280" y="96" width="44" height="34"/><rect x="328" y="96" width="44" height="34"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="88" y="96" width="44" height="34"/>
  </g>
  <rect x="40" y="96" width="44" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="62" y="118" fill="#4169E1">b</text><text x="110" y="118" fill="#4169E1">b</text>
    <text x="158" y="118" fill="#9aa7b2">c</text><text x="206" y="118" fill="#9aa7b2">d</text><text x="254" y="118" fill="#9aa7b2">e</text><text x="302" y="118" fill="#9aa7b2">f</text><text x="350" y="118" fill="#9aa7b2">g</text>
  </g>
  <g font-size="10.5">
    <text x="64" y="148" text-anchor="middle" fill="#5c6b76">points to b</text>
    <text x="110" y="148" text-anchor="middle" fill="#4169E1" font-weight="600">root</text>
    <text x="40" y="168" fill="#9aa7b2">the other 24 letters still root themselves</text>
  </g>
  <text x="430" y="90" fill="#5c6b76" font-size="11.5">one class {a, b}</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4">
    <rect x="430" y="98" width="36" height="34"/><rect x="530" y="98" width="36" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="448" y="120">a</text><text x="548" y="120">b</text>
  </g>
  <line x1="466" y1="115" x2="520" y2="115" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="494" y="107" text-anchor="middle" fill="#9aa7b2" font-size="10">parent</text>
  <text x="548" y="150" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">root</text>
  <g font-size="13" fill="#1a2026">
    <text x="40" y="196">Pass two reads b != a: find(b) = b, find(a) = b —</text>
    <text x="40" y="218">both sides in one class — no assignment works.</text>
  </g>
  <rect x="430" y="180" width="182" height="56" rx="5" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="521" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#4169E1">return false</text>
  <text x="521" y="225" text-anchor="middle" font-size="11" fill="#1a2026">equations unsatisfiable</text>
  <text x="320" y="274" text-anchor="middle" fill="#1a2026" font-size="13">Union every equality first, then judge the inequalities: a==b already tied</text>
  <text x="320" y="294" text-anchor="middle" fill="#1a2026" font-size="13">a to b when b!=a is judged, so the verdict is <tspan fill="#4169E1" font-weight="600">false</tspan> — order-independent.</text>
</svg>
