<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="460" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- strs = ["babca","bbazb"]; columns are (b,b) (a,b) (b,a) (c,z) (a,b); cells 44x34 at x=70+52j, rows y=64/100; dp boxes 44x30 at y=190 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="92" y="54">j = 0</text><text x="144" y="54">j = 1</text><text x="196" y="54">j = 2</text><text x="248" y="54">j = 3</text><text x="300" y="54">j = 4</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="60" y="86">row 0</text>
    <text x="60" y="122">row 1</text>
  </g>
  <!-- grid: dropped columns 0,1,4 muted; kept chain columns 2,3 accented -->
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#f0f3f7">
    <rect x="70" y="64" width="44" height="34"/><rect x="122" y="64" width="44" height="34"/>
    <rect x="70" y="100" width="44" height="34"/><rect x="122" y="100" width="44" height="34"/>
    <rect x="278" y="64" width="44" height="34"/><rect x="278" y="100" width="44" height="34"/>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#dbe4fb">
    <rect x="174" y="64" width="44" height="34"/><rect x="226" y="64" width="44" height="34"/>
    <rect x="174" y="100" width="44" height="34"/><rect x="226" y="100" width="44" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="196" y="86" fill="#1a2026">b</text><text x="248" y="86" fill="#1a2026">c</text>
    <text x="196" y="122" fill="#1a2026">a</text><text x="248" y="122" fill="#1a2026">z</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2">
    <text x="92" y="86">b</text><text x="144" y="86">a</text><text x="300" y="86">a</text>
    <text x="92" y="122">b</text><text x="144" y="122">b</text><text x="300" y="122">b</text>
  </g>
  <!-- kept-chain bracket under columns 2,3 -->
  <path d="M 174 142 L 174 148 L 270 148 L 270 142" fill="none" stroke="#4169E1" stroke-width="2"/>
  <!-- dp row: hand-simulated dp = [1,1,1,2,2] -->
  <text x="60" y="210" text-anchor="end" fill="#5c6b76" font-size="12.5">dp</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="70" y="190" width="44" height="30"/><rect x="122" y="190" width="44" height="30"/>
    <rect x="174" y="190" width="44" height="30"/><rect x="226" y="190" width="44" height="30"/>
    <rect x="278" y="190" width="44" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="92" y="210" fill="#1a2026">1</text><text x="144" y="210" fill="#1a2026">1</text><text x="196" y="210" fill="#4169E1">1</text>
    <text x="248" y="210" fill="#4169E1">2</text><text x="300" y="210" fill="#4169E1">2</text>
  </g>
  <!-- chain transition column 2 -> column 3 -->
  <path d="M 196 228 Q 222 252 248 228" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="222" y="272" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">dp[3] = dp[2] + 1 = 2</text>
  <text x="230" y="300" text-anchor="middle" fill="#1a2026" font-size="13">The longest chain keeps columns 2 and 3 (rows read bc, az),</text>
  <text x="230" y="318" text-anchor="middle" fill="#1a2026" font-size="13">so 5 − 2 = <tspan fill="#4169E1" font-weight="600">3</tspan> columns are deleted.</text>
</svg>
