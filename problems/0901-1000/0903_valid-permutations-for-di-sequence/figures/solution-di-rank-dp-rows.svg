<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- dp rows on s="DID": [1], [1,0], [0,1,1], [2,2,1,0]; cells 44x30, cols x=240+48j, rows y=76+44i -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="262" y="68">rank 0</text><text x="310" y="68">rank 1</text><text x="358" y="68">rank 2</text><text x="406" y="68">rank 3</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.2">
    <rect x="240" y="76" width="44" height="30"/>
    <rect x="240" y="120" width="44" height="30"/><rect x="288" y="120" width="44" height="30"/>
    <rect x="240" y="164" width="44" height="30"/><rect x="288" y="164" width="44" height="30"/><rect x="336" y="164" width="44" height="30"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="240" y="208" width="44" height="30"/><rect x="288" y="208" width="44" height="30"/><rect x="336" y="208" width="44" height="30"/><rect x="384" y="208" width="44" height="30"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="262" y="96">1</text>
    <text x="262" y="140">1</text><text x="310" y="140" fill="#9aa7b2">0</text>
    <text x="262" y="184">0</text><text x="310" y="184">1</text><text x="358" y="184">1</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="262" y="228">2</text><text x="310" y="228">2</text><text x="358" y="228">1</text><text x="406" y="228">0</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="200" y="96">dp[0]</text>
    <text x="200" y="140">dp[1]</text>
    <text x="200" y="184">dp[2]</text>
    <text x="200" y="228">dp[3]</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="200" y="117">s[0] = 'D' (suffix sums)</text>
    <text x="200" y="161">s[1] = 'I' (prefix sums)</text>
    <text x="200" y="205">s[2] = 'D' (suffix sums)</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 226 108 V 116" marker-end="url(#arrow)"/>
    <path d="M 226 152 V 160" marker-end="url(#arrow)"/>
    <path d="M 226 196 V 204" marker-end="url(#arrow)"/>
  </g>
  <text x="452" y="228" fill="#4169E1" font-weight="600">&#931; = 5</text>
  <text x="310" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Each 'D' row takes the suffix sum below rank j, each 'I' row the prefix sum:</text>
  <text x="310" y="284" text-anchor="middle" fill="#1a2026" font-size="13">on "DID" the rows run [1] &#8594; [1, 0] &#8594; [0, 1, 1] &#8594; <tspan fill="#4169E1" font-weight="600">[2, 2, 1, 0]</tspan> and sum to <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
</svg>
