<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 3, goal = 3, k = 1; dp rows i = 0..3, cols j = 0..3; cells 54x30, col pitch 66 from x 158, row pitch 44 from y 84; diagonal arrows = introduce (weight n - j + 1), vertical arrows = repeat (weight j - k) -->
  <text x="280" y="40" text-anchor="middle" fill="#1a2026" font-weight="600">n = 3, goal = 3, k = 1</text>
  <text x="148" y="74" text-anchor="end" fill="#5c6b76" font-size="12.5">dp[i][j]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="185" y="74">j = 0</text><text x="251" y="74">j = 1</text><text x="317" y="74">j = 2</text><text x="383" y="74">j = 3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="148" y="103">i = 0</text><text x="148" y="147">i = 1</text><text x="148" y="191">i = 2</text><text x="148" y="235">i = 3</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="158" y="84" width="54" height="30"/><rect x="224" y="84" width="54" height="30"/><rect x="290" y="84" width="54" height="30"/><rect x="356" y="84" width="54" height="30"/>
    <rect x="158" y="128" width="54" height="30"/><rect x="224" y="128" width="54" height="30"/><rect x="290" y="128" width="54" height="30"/><rect x="356" y="128" width="54" height="30"/>
    <rect x="158" y="172" width="54" height="30"/><rect x="224" y="172" width="54" height="30"/><rect x="290" y="172" width="54" height="30"/><rect x="356" y="172" width="54" height="30"/>
    <rect x="158" y="216" width="54" height="30"/><rect x="224" y="216" width="54" height="30"/><rect x="290" y="216" width="54" height="30"/><rect x="356" y="216" width="54" height="30"/>
  </g>
  <g text-anchor="middle">
    <text x="185" y="104" fill="#1a2026" font-weight="600">1</text><text x="251" y="104" fill="#9aa7b2">0</text><text x="317" y="104" fill="#9aa7b2">0</text><text x="383" y="104" fill="#9aa7b2">0</text>
    <text x="185" y="148" fill="#9aa7b2">0</text><text x="251" y="148" fill="#1a2026" font-weight="600">3</text><text x="317" y="148" fill="#9aa7b2">0</text><text x="383" y="148" fill="#9aa7b2">0</text>
    <text x="185" y="192" fill="#9aa7b2">0</text><text x="251" y="192" fill="#9aa7b2">0</text><text x="317" y="192" fill="#1a2026" font-weight="600">6</text><text x="383" y="192" fill="#9aa7b2">0</text>
    <text x="185" y="236" fill="#9aa7b2">0</text><text x="251" y="236" fill="#9aa7b2">0</text><text x="317" y="236" fill="#1a2026" font-weight="600">6</text><text x="383" y="236" fill="#4169E1" font-weight="600">6</text>
  </g>
  <!-- introduce arrows along the diagonal -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 206 110 L 221 125" marker-end="url(#arrow)"/>
    <path d="M 272 154 L 287 169" marker-end="url(#arrow)"/>
    <path d="M 334 198 L 349 213" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="230" y="124">× 3</text>
    <text x="296" y="168">× 2</text>
    <text x="362" y="212">× 1</text>
  </g>
  <!-- repeat arrow into dp[3][2], weight j - k = 1; the dp[3][3] repeat reads a zero source -->
  <path d="M 317 204 L 317 214" stroke="#4169E1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="309" y="212" text-anchor="end" fill="#4169E1" font-size="11.5" font-weight="600">repeat × 1</text>
  <path d="M 383 204 L 383 214" stroke="#9aa7b2" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="391" y="212" fill="#9aa7b2" font-size="11">× 2, source 0</text>
  <text x="280" y="274" text-anchor="middle" fill="#1a2026" font-size="13">Introduce steps chain along the diagonal with weights × 3, × 2, × 1;</text>
  <text x="280" y="294" text-anchor="middle" fill="#1a2026" font-size="13">the repeat step × 1 fills dp[3][2] = 6, and the answer is dp[3][3] = <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
