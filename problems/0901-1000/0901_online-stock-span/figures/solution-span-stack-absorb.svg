<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="348" fill="#ffffff"/>
  <!-- prices 100,80,60,70,60,75,85; column i = the (price, span) stack after that next(); accent cell = just pushed, dashed struck cell = popped that step; cells 74x28, columns at cx = 62+90i, rows y = 182-34j -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="115" y="182" width="74" height="28"/>
    <rect x="205" y="182" width="74" height="28"/>
    <rect x="205" y="148" width="74" height="28"/>
    <rect x="295" y="182" width="74" height="28"/>
    <rect x="295" y="148" width="74" height="28"/>
    <rect x="385" y="182" width="74" height="28"/>
    <rect x="385" y="148" width="74" height="28"/>
    <rect x="385" y="114" width="74" height="28"/>
    <rect x="475" y="182" width="74" height="28"/>
    <rect x="475" y="148" width="74" height="28"/>
    <rect x="565" y="182" width="74" height="28"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="25" y="182" width="74" height="28"/>
    <rect x="115" y="148" width="74" height="28"/>
    <rect x="205" y="114" width="74" height="28"/>
