    <rect x="475" y="114" width="74" height="28"/>
    <rect x="565" y="148" width="74" height="28"/>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="295" y="80" width="74" height="28"/>
    <rect x="475" y="80" width="74" height="28"/>
    <rect x="475" y="46" width="74" height="28"/>
    <rect x="565" y="114" width="74" height="28"/>
    <rect x="565" y="80" width="74" height="28"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2">
    <line x1="295" y1="108" x2="369" y2="80"/>
    <line x1="475" y1="108" x2="549" y2="80"/>
    <line x1="475" y1="74" x2="549" y2="46"/>
    <line x1="565" y1="142" x2="639" y2="114"/>
    <line x1="565" y1="108" x2="639" y2="80"/>
  </g>
  <g>
    <text x="62" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(100, 1)</text>
    <text x="152" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(100, 1)</text>
    <text x="152" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(80, 1)</text>
    <text x="242" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(100, 1)</text>
    <text x="242" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(80, 1)</text>
    <text x="242" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(60, 1)</text>
    <text x="332" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(100, 1)</text>
    <text x="332" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(80, 1)</text>
    <text x="332" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(70, 2)</text>
    <text x="332" y="98" text-anchor="middle" font-size="11.5" fill="#9aa7b2">(60, 1)</text>
    <text x="422" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(100, 1)</text>
    <text x="422" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(80, 1)</text>
    <text x="422" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(70, 2)</text>
    <text x="422" y="98" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(60, 1)</text>
    <text x="512" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(100, 1)</text>
    <text x="512" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(80, 1)</text>
    <text x="512" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(75, 4)</text>
    <text x="512" y="98" text-anchor="middle" font-size="11.5" fill="#9aa7b2">(70, 2)</text>
    <text x="512" y="64" text-anchor="middle" font-size="11.5" fill="#9aa7b2">(60, 1)</text>
    <text x="602" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(100, 1)</text>
    <text x="602" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">(85, 6)</text>
    <text x="602" y="132" text-anchor="middle" font-size="11.5" fill="#9aa7b2">(80, 1)</text>
    <text x="602" y="98" text-anchor="middle" font-size="11.5" fill="#9aa7b2">(75, 4)</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="62" y="232">next(100)</text><text x="152" y="232">next(80)</text><text x="242" y="232">next(60)</text>
    <text x="332" y="232">next(70)</text><text x="422" y="232">next(60)</text><text x="512" y="232">next(75)</text>
    <text x="602" y="232">next(85)</text>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="700">
    <text x="62" y="252" fill="#1a2026">span 1</text><text x="152" y="252" fill="#1a2026">span 1</text><text x="242" y="252" fill="#1a2026">span 1</text>
    <text x="332" y="252" fill="#1a2026">span 2</text><text x="422" y="252" fill="#1a2026">span 1</text>
    <text x="512" y="252" fill="#4169E1">span 4</text><text x="602" y="252" fill="#4169E1">span 6</text>
  </g>
  <text x="340" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Each next() pops every (price, span) whose price ≤ today's, absorbing their spans:</text>
  <text x="340" y="320" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">75</tspan> absorbs 1 + 1 + 2 = <tspan fill="#4169E1" font-weight="600">4</tspan>; <tspan fill="#4169E1" font-weight="600">85</tspan> absorbs 1 + 4 + 1 = <tspan fill="#4169E1" font-weight="600">6</tspan> — the stack stays strictly decreasing.</text>
</svg>
