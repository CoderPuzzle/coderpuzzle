<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [5, -3, 5]; ring centre (180, 148), ring radius 60, node circles r 25; accented wrap arc = subarray [5, 5] (i = 2 then i = 0), dashed arc = omitted minimum subarray [-3] (i = 1) -->
  <path d="M 120.3 153.7 A 60 60 0 0 1 155 93.4" fill="none" stroke="#4169E1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 232 118 A 60 60 0 0 1 180 208" fill="none" stroke="#9aa7b2" stroke-width="2.5" stroke-dasharray="5 5"/>
  <circle cx="180" cy="88" r="25" fill="#4169E1"/>
  <text x="180" y="93" text-anchor="middle" fill="#ffffff" font-weight="600">5</text>
  <circle cx="128" cy="178" r="25" fill="#4169E1"/>
  <text x="128" y="183" text-anchor="middle" fill="#ffffff" font-weight="600">5</text>
  <circle cx="232" cy="178" r="25" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="232" y="183" text-anchor="middle" fill="#9aa7b2">-3</text>
  <text x="180" y="142" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">wrap</text>
  <text x="180" y="160" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">[5, 5]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="180" y="50">i = 0</text>
    <text x="232" y="220">i = 1</text>
    <text x="128" y="220">i = 2</text>
  </g>
  <text x="232" y="238" text-anchor="middle" fill="#9aa7b2" font-size="11.5">omitted</text>
  <g font-size="13">
    <text x="310" y="78" fill="#1a2026" font-weight="600">nums = [5, -3, 5]</text>
    <text x="310" y="106" fill="#1a2026">total = 5 - 3 + 5 = 7</text>
    <text x="310" y="134" fill="#1a2026">best_min = min subarray [-3] = -3</text>
    <text x="310" y="162" fill="#1a2026">wrap = total - best_min = <tspan fill="#4169E1" font-weight="600">10</tspan></text>
    <text x="310" y="190" fill="#1a2026">plain Kadane = 7 (the whole array)</text>
    <text x="310" y="218" fill="#1a2026">answer = max(7, 10) = <tspan fill="#4169E1" font-weight="600">10</tspan></text>
  </g>
  <text x="320" y="262" text-anchor="middle" fill="#1a2026" font-size="13">The omitted middle is the minimum subarray [-3]: the wrap [5, 5] sums 7 - (-3) = 10,</text>
  <text x="320" y="282" text-anchor="middle" fill="#1a2026" font-size="13">beating Kadane's non-wrapping 7, so the answer is <tspan fill="#4169E1" font-weight="600">10</tspan>.</text>
</svg>
