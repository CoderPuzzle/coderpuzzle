<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="290" fill="#ffffff"/>
  <!-- arr = [1,0,1,0,1]; cells 72x44 at (130,70); cuts at x=206 (i=0) and x=366 (j=3); parts [1] [0,1] [0,1] -->
  <g text-anchor="middle" fill="#4169E1" font-size="13.5" font-weight="600">
    <text x="206" y="48">i = 0</text>
    <text x="366" y="48">j = 3</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3">
    <line x1="206" y1="56" x2="206" y2="126"/>
    <line x1="366" y1="56" x2="366" y2="126"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="130" y="70" width="72" height="44"/><rect x="210" y="70" width="72" height="44"/>
    <rect x="290" y="70" width="72" height="44"/><rect x="370" y="70" width="72" height="44"/>
    <rect x="450" y="70" width="72" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="166" y="97" fill="#4169E1">1</text>
    <text x="246" y="97" fill="#1a2026">0</text>
    <text x="326" y="97" fill="#4169E1">1</text>
    <text x="406" y="97" fill="#1a2026">0</text>
    <text x="486" y="97" fill="#4169E1">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="166" y="134">0</text><text x="246" y="134">1</text><text x="326" y="134">2</text>
    <text x="406" y="134">3</text><text x="486" y="134">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="166" y="154">1st 1</text>
    <text x="326" y="154">2nd 1</text>
    <text x="486" y="154">3rd 1 — pattern</text>
  </g>
  <!-- part brackets: [1] | [0,1] | [0,1] -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 130 170 V 164 H 202 V 170"/>
    <path d="M 210 170 V 164 H 362 V 170"/>
    <path d="M 370 170 V 164 H 522 V 170"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="166" y="192">[1] = 1</text>
    <text x="286" y="192">[0,1] = 1</text>
    <text x="446" y="192">[0,1] = 1</text>
  </g>
  <text x="310" y="222" text-anchor="middle" fill="#5c6b76" font-size="12.5">pattern = suffix starting at the 3rd 1 = <tspan fill="#4169E1" font-weight="600">[1]</tspan>, so L = 0 bits follow</text>
  <text x="310" y="252" text-anchor="middle" fill="#1a2026" font-size="13">Each part holds k = 3/3 = 1 one and matches the pattern [1]:</text>
  <text x="310" y="270" text-anchor="middle" fill="#1a2026" font-size="13">the cuts land at i = 0 + 0 = 0 and j = 2 + 0 + 1 = 3 → <tspan fill="#4169E1" font-weight="600">[0, 3]</tspan>.</text>
</svg>
