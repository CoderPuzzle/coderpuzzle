<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrowmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- arr = [9,4,2,10,7,8,8,1,9]; cells x = 60 + 66i, w 54, y 64;
       signs between neighbours: > > < > < = > <;
       run = [1,2,2,3,4,5,1,2,3], best = 5 at i = 5 -->
  <text x="46" y="90" text-anchor="end" fill="#5c6b76" font-size="12.5">arr</text>
  <text x="46" y="170" text-anchor="end" fill="#5c6b76" font-size="12.5">run</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="60" y="64" width="54" height="42"/>
    <rect x="456" y="64" width="54" height="42"/>
    <rect x="522" y="64" width="54" height="42"/>
    <rect x="588" y="64" width="54" height="42"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="126" y="64" width="54" height="42"/>
    <rect x="192" y="64" width="54" height="42"/>
    <rect x="258" y="64" width="54" height="42"/>
    <rect x="324" y="64" width="54" height="42"/>
    <rect x="390" y="64" width="54" height="42"/>
  </g>
  <g text-anchor="middle" font-size="14.5" font-weight="600" fill="#1a2026">
    <text x="87" y="90">9</text>
    <text x="153" y="90">4</text>
    <text x="219" y="90">2</text>
    <text x="285" y="90">10</text>
    <text x="351" y="90">7</text>
    <text x="417" y="90">8</text>
    <text x="483" y="90">8</text>
    <text x="549" y="90">1</text>
    <text x="615" y="90">9</text>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="120" y="90" fill="#5c6b76">&gt;</text>
    <text x="186" y="90" fill="#5c6b76">&gt;</text>
    <text x="252" y="90" fill="#4169E1">&lt;</text>
    <text x="318" y="90" fill="#5c6b76">&gt;</text>
    <text x="384" y="90" fill="#4169E1">&lt;</text>
    <text x="450" y="90" fill="#9aa7b2">=</text>
    <text x="516" y="90" fill="#5c6b76">&gt;</text>
    <text x="582" y="90" fill="#4169E1">&lt;</text>
  </g>
  <path d="M 450 114 L 479 157" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowmuted)"/>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="87" y="170" fill="#1a2026">1</text>
    <text x="153" y="170" fill="#1a2026">2</text>
    <text x="219" y="170" fill="#1a2026">2</text>
    <text x="285" y="170" fill="#1a2026">3</text>
    <text x="351" y="170" fill="#1a2026">4</text>
    <text x="417" y="170" fill="#4169E1">5</text>
    <text x="483" y="170" fill="#1a2026">1</text>
    <text x="549" y="170" fill="#1a2026">2</text>
    <text x="615" y="170" fill="#1a2026">3</text>
  </g>
  <line x1="405" y1="177" x2="429" y2="177" stroke="#4169E1" stroke-width="2"/>
  <text x="417" y="194" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">best</text>
  <text x="340" y="272" text-anchor="middle" font-size="13" fill="#1a2026">The run climbs to <tspan fill="#4169E1" font-weight="600">5</tspan> across [4, 2, 10, 7, 8], the equal 8s restart it at 1,</text>
  <text x="340" y="290" text-anchor="middle" font-size="13" fill="#1a2026">and the tail [8, 1, 9] only reaches 3 &#8212; best = <tspan fill="#4169E1" font-weight="600">5</tspan> is the answer.</text>
</svg>
