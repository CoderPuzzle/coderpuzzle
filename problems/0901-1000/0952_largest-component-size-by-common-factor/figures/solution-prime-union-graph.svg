<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 490" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="480" height="490" fill="#ffffff"/>
  <!-- nums = [4,6,15,35]; primes 4:{2} 6:{2,3} 15:{3,5} 35:{5,7}; values r24 at x=140, primes r16 at x=350 -->
  <text x="140" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">value</text>
  <text x="350" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">distinct primes</text>
  <!-- dashed frame: all four values end in one union-find class -->
  <rect x="102" y="51" width="76" height="378" rx="12" fill="none" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g stroke="#5c6b76" stroke-width="1.5">
    <line x1="164" y1="90" x2="334" y2="127"/>
    <line x1="164" y1="170" x2="334" y2="133"/>
    <line x1="164" y1="180" x2="334" y2="217"/>
    <line x1="164" y1="260" x2="334" y2="223"/>
    <line x1="164" y1="270" x2="334" y2="307"/>
    <line x1="164" y1="350" x2="334" y2="313"/>
    <line x1="164" y1="358" x2="334" y2="383"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="2">
    <circle cx="140" cy="85" r="24"/><circle cx="140" cy="175" r="24"/>
    <circle cx="140" cy="265" r="24"/><circle cx="140" cy="355" r="24"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="350" cy="130" r="16"/><circle cx="350" cy="220" r="16"/>
    <circle cx="350" cy="310" r="16"/><circle cx="350" cy="385" r="16"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="140" y="91">4</text><text x="140" y="181">6</text>
    <text x="140" y="271">15</text><text x="140" y="361">35</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="350" y="134">2</text><text x="350" y="224">3</text>
    <text x="350" y="314">5</text><text x="350" y="389">7</text>
  </g>
  <text x="240" y="452" text-anchor="middle" fill="#1a2026" font-size="13">Each value unions with its distinct primes; the shared-prime chain</text>
  <text x="240" y="472" text-anchor="middle" fill="#1a2026" font-size="13">2–3–5 links all four values into one component of size <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
