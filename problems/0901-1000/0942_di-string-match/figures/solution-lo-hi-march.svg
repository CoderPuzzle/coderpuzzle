<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s = "IDID", lo = 0, hi = 4; I spends lo (0 then 1), D spends hi (4 then 3); pointers meet at 2; perm = [0,4,1,3,2];
       pool line circles cx 140+100k, cy 78, r 13; perm boxes 90x44 at y = 170 -->
  <!-- legend -->
  <g font-size="12.5" font-weight="600">
    <text x="28" y="62" fill="#4169E1">I: spend lo</text>
    <text x="28" y="94" fill="#42525e">D: spend hi</text>
  </g>
  <!-- pool 0..4 with marching pointers -->
  <g fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M 153 68 Q 190 46 227 68"/>
    <path d="M 253 68 Q 290 46 327 68"/>
  </g>
  <g fill="none" stroke="#42525e" stroke-width="1.8" marker-end="url(#arrowd)">
    <path d="M 527 88 Q 490 110 453 88"/>
    <path d="M 427 88 Q 390 110 353 88"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="140" cy="78" r="13"/>
    <circle cx="240" cy="78" r="13"/>
    <circle cx="440" cy="78" r="13"/>
    <circle cx="540" cy="78" r="13"/>
  </g>
  <circle cx="340" cy="78" r="13" fill="#4169E1"/>
  <g text-anchor="middle" font-weight="600">
    <text x="140" y="83">0</text><text x="240" y="83">1</text><text x="440" y="83">3</text><text x="540" y="83">4</text>
    <text x="340" y="83" fill="#ffffff">2</text>
  </g>
  <text x="340" y="52" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">leftover</text>
  <!-- perm slots -->
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="140" y="160">I</text><text x="240" y="160">D</text><text x="340" y="160">I</text><text x="440" y="160">D</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="95" y="170" width="90" height="44"/>
    <rect x="195" y="170" width="90" height="44"/>
    <rect x="295" y="170" width="90" height="44"/>
    <rect x="395" y="170" width="90" height="44"/>
  </g>
  <rect x="495" y="170" width="90" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="140" y="197">0</text><text x="240" y="197">4</text><text x="340" y="197">1</text><text x="440" y="197">3</text>
    <text x="540" y="197" fill="#4169E1">2</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="140" y="236">lo</text><text x="240" y="236">hi</text><text x="340" y="236">lo</text><text x="440" y="236">hi</text>
    <text x="540" y="236" fill="#4169E1" font-weight="600">meet</text>
  </g>
  <text x="320" y="274" text-anchor="middle" fill="#1a2026" font-size="13">Each I spends the smallest remaining value, each D the largest — IDID fills 0, 4, 1, 3.</text>
  <text x="320" y="292" text-anchor="middle" fill="#1a2026" font-size="13">The pointers meet at the one leftover, 2: perm = <tspan fill="#4169E1" font-weight="600">[0,4,1,3,2]</tspan>.</text>
</svg>
