<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="260" fill="#ffffff"/>
  <!-- days=[1,4,6,7,8,20], costs=[2,7,15]; cells 25x34 at x=64+27(d-1), y=74;
       travel cells lit #dbe4fb; bracket = the 7-day pass covering days 2..8, $2 ticks on days 1 and 20 -->
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 76.5 58 V 70"/>
    <path d="M 103.5 62 V 70"/>
    <path d="M 103.5 62 H 265.5"/>
    <path d="M 265.5 62 V 70"/>
    <path d="M 589.5 58 V 70"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="76.5" y="52">$2</text>
    <text x="184.5" y="52">7-day pass, $7</text>
    <text x="589.5" y="52">$2</text>
  </g>
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1">
    <rect x="91" y="74" width="25" height="34"/><rect x="118" y="74" width="25" height="34"/>
    <rect x="172" y="74" width="25" height="34"/>
    <rect x="280" y="74" width="25" height="34"/><rect x="307" y="74" width="25" height="34"/><rect x="334" y="74" width="25" height="34"/><rect x="361" y="74" width="25" height="34"/><rect x="388" y="74" width="25" height="34"/><rect x="415" y="74" width="25" height="34"/><rect x="442" y="74" width="25" height="34"/><rect x="469" y="74" width="25" height="34"/><rect x="496" y="74" width="25" height="34"/><rect x="523" y="74" width="25" height="34"/><rect x="550" y="74" width="25" height="34"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4">
    <rect x="64" y="74" width="25" height="34"/>
    <rect x="145" y="74" width="25" height="34"/>
    <rect x="199" y="74" width="25" height="34"/>
    <rect x="226" y="74" width="25" height="34"/>
    <rect x="253" y="74" width="25" height="34"/>
    <rect x="577" y="74" width="25" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="76.5" y="96">2</text><text x="157.5" y="96">4</text><text x="211.5" y="96">6</text><text x="238.5" y="96">7</text><text x="265.5" y="96">9</text><text x="589.5" y="96">11</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#9aa7b2">
    <text x="103.5" y="95">2</text><text x="130.5" y="95">2</text><text x="184.5" y="95">4</text>
    <text x="292.5" y="95">9</text><text x="319.5" y="95">9</text><text x="346.5" y="95">9</text><text x="373.5" y="95">9</text><text x="400.5" y="95">9</text><text x="427.5" y="95">9</text><text x="454.5" y="95">9</text><text x="481.5" y="95">9</text><text x="508.5" y="95">9</text><text x="535.5" y="95">9</text><text x="562.5" y="95">9</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="76.5" y="124">1</text><text x="103.5" y="124">2</text><text x="130.5" y="124">3</text><text x="157.5" y="124">4</text><text x="184.5" y="124">5</text><text x="211.5" y="124">6</text><text x="238.5" y="124">7</text><text x="265.5" y="124">8</text><text x="292.5" y="124">9</text><text x="319.5" y="124">10</text><text x="346.5" y="124">11</text><text x="373.5" y="124">12</text><text x="400.5" y="124">13</text><text x="427.5" y="124">14</text><text x="454.5" y="124">15</text><text x="481.5" y="124">16</text><text x="508.5" y="124">17</text><text x="535.5" y="124">18</text><text x="562.5" y="124">19</text><text x="589.5" y="124">20</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="320" y="156">day 7: min(dp[6]+2, dp[0]+7, dp[0]+15) = min(8, <tspan fill="#4169E1" font-weight="600">7</tspan>, 15) = <tspan fill="#4169E1" font-weight="600">7</tspan> — the 7-day window wins</text>
    <text x="320" y="178">day 20: min(dp[19]+2, dp[13]+7, dp[0]+15) = min(<tspan fill="#4169E1" font-weight="600">11</tspan>, 16, 15) = <tspan fill="#4169E1" font-weight="600">11</tspan></text>
  </g>
  <text x="320" y="216" text-anchor="middle" fill="#1a2026" font-size="13">Non-travel days carry the cost forward; each travel day takes the cheapest</text>
  <text x="320" y="238" text-anchor="middle" fill="#1a2026" font-size="13">pass window — the drawn plan buys 2 + 7 + 2 = <tspan fill="#4169E1" font-weight="600">11</tspan>, so dp[20] = 11.</text>
</svg>
