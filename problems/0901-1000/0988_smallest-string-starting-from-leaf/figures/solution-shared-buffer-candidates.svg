<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [0,1,2,3,4,3,4]; values 0..4 spell a..e; the sweep carries one shared
       buffer of letters root-to-current; each leaf's buffer reversed is a candidate -->
  <text x="40" y="32" fill="#9aa7b2" font-size="11">values 0 1 2 3 4 → letters a b c d e</text>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="170" y1="56" x2="90" y2="132"/>
    <line x1="170" y1="56" x2="250" y2="132"/>
    <line x1="90" y1="132" x2="130" y2="208"/>
    <line x1="250" y1="132" x2="210" y2="208"/>
    <line x1="250" y1="132" x2="290" y2="208"/>
  </g>
  <line x1="90" y1="132" x2="50" y2="208" stroke="#4169E1" stroke-width="2.5"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="90" cy="132" r="16"/>
    <circle cx="250" cy="132" r="16"/>
    <circle cx="130" cy="208" r="16"/>
    <circle cx="210" cy="208" r="16"/>
    <circle cx="290" cy="208" r="16"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <circle cx="170" cy="56" r="16"/>
    <circle cx="50" cy="208" r="16"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="170" y="61">a</text><text x="90" y="137">b</text><text x="250" y="137">c</text>
    <text x="50" y="213">d</text><text x="130" y="213">e</text><text x="210" y="213">d</text><text x="290" y="213">e</text>
  </g>
  <g font-size="13.5">
    <rect x="420" y="64" width="196" height="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.3"/>
    <text x="430" y="83" font-weight="700" fill="#4169E1">dba<tspan font-weight="400" font-size="12" fill="#1a2026">   a→b→d, smallest</tspan></text>
    <text x="430" y="116" font-weight="600" fill="#1a2026">eba<tspan font-weight="400" font-size="12" fill="#9aa7b2">   a→b→e</tspan></text>
    <text x="430" y="140" font-weight="600" fill="#1a2026">dca<tspan font-weight="400" font-size="12" fill="#9aa7b2">   a→c→d</tspan></text>
    <text x="430" y="164" font-weight="600" fill="#1a2026">eca<tspan font-weight="400" font-size="12" fill="#9aa7b2">   a→c→e</tspan></text>
    <text x="430" y="52" fill="#5c6b76" font-size="12.5">leaf → root candidates</text>
  </g>
  <text x="40" y="284" font-size="13" fill="#1a2026">shared buffer at the winning leaf:</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="270" y="264" width="26" height="26"/><rect x="298" y="264" width="26" height="26"/><rect x="326" y="264" width="26" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="283" y="282">a</text><text x="311" y="282">b</text><text x="339" y="282">d</text>
  </g>
  <line x1="360" y1="277" x2="404" y2="277" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="382" y="258" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">reverse</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4">
    <rect x="414" y="264" width="26" height="26"/><rect x="442" y="264" width="26" height="26"/><rect x="470" y="264" width="26" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="427" y="282">d</text><text x="455" y="282">b</text><text x="483" y="282">a</text>
  </g>
  <text x="510" y="282" fill="#5c6b76" font-size="12.5">= candidate</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">The walk keeps one shared buffer, one letter per stack frame; at each leaf it</text>
  <text x="320" y="338" text-anchor="middle" fill="#1a2026" font-size="13">reverses into a candidate — native comparison crowns <tspan fill="#4169E1" font-weight="600">dba</tspan> over eba, dca, eca.</text>
</svg>
