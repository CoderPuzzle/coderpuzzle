  <rect x="154" y="66" width="60" height="60" fill="#ffffff" stroke="#1a2026"/>
  <text x="184.0" y="101.0" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <text x="184.0" y="58" text-anchor="middle" fill="#4169E1" font-size="11">t=1</text>
  <rect x="218" y="66" width="60" height="60" fill="#ffffff" stroke="#1a2026"/>
  <text x="248.0" y="101.0" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <text x="248.0" y="58" text-anchor="middle" fill="#4169E1" font-size="11">t=2</text>
  <rect x="90" y="130" width="60" height="60" fill="#ffffff" stroke="#1a2026"/>
  <text x="120.0" y="165.0" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <text x="120.0" y="122" text-anchor="middle" fill="#4169E1" font-size="11">t=1</text>
  <rect x="154" y="130" width="60" height="60" fill="#ffffff" stroke="#1a2026"/>
  <text x="184.0" y="165.0" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <text x="184.0" y="122" text-anchor="middle" fill="#4169E1" font-size="11">t=2</text>
  <rect x="218" y="130" width="60" height="60" fill="#ffffff" stroke="#1a2026"/>
  <text x="248.0" y="165.0" text-anchor="middle" fill="#1a2026" font-weight="600">0</text>
  <rect x="90" y="194" width="60" height="60" fill="#ffffff" stroke="#1a2026"/>
  <text x="120.0" y="229.0" text-anchor="middle" fill="#1a2026" font-weight="600">0</text>
  <rect x="154" y="194" width="60" height="60" fill="#ffffff" stroke="#1a2026"/>
