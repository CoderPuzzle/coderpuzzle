  <text x="248.0" y="186" text-anchor="middle" fill="#4169E1" font-size="11">t=4</text>
  <text x="40" y="40" fill="#5c6b76" font-size="12">Both rotten cells enter the queue at timestamp 0; each fresh neighbor is</text>
  <text x="40" y="58" fill="#5c6b76" font-size="12">stamped t + 1 when enqueued, so the last orange rots at t = 4.</text>
