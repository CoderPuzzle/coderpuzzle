<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
