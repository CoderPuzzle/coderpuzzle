<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- points [[1,2],[2,1],[1,0],[0,1]] plotted at (110+65x, 240-65y); diagonals (1,2)-(1,0) and (2,1)-(0,1) cross at midpoint (1,1) -->
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="95" y1="240" x2="290" y2="240"/>
    <line x1="110" y1="252" x2="110" y2="88"/>
  </g>
  <g fill="#9aa7b2" font-size="11.5">
    <text x="110" y="258" text-anchor="middle">0</text><text x="175" y="258" text-anchor="middle">1</text><text x="240" y="258" text-anchor="middle">2</text>
    <text x="100" y="244" text-anchor="end">0</text><text x="100" y="179" text-anchor="end">1</text><text x="100" y="114" text-anchor="end">2</text>
  </g>
  <!-- the two diagonals: equal length, one shared midpoint -->
  <line x1="175" y1="110" x2="175" y2="240" stroke="#4169E1" stroke-width="2.5"/>
  <line x1="240" y1="175" x2="110" y2="175" stroke="#4169E1" stroke-width="2.5"/>
  <circle cx="175" cy="175" r="4" fill="#1a2026"/>
  <text x="185" y="168" fill="#42525e" font-size="11.5">midpoint (1, 1)</text>
  <g>
    <circle cx="175" cy="110" r="5.5" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
    <circle cx="240" cy="175" r="5.5" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
    <circle cx="175" cy="240" r="5.5" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
    <circle cx="110" cy="175" r="5.5" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
  </g>
  <g fill="#42525e" font-size="12">
    <text x="165" y="102" text-anchor="end">[1, 2]</text>
    <text x="250" y="198">[2, 1]</text>
    <text x="163" y="246" text-anchor="end">[1, 0]</text>
    <text x="99" y="163" text-anchor="end">[0, 1]</text>
  </g>
  <!-- hash-key panel: doubled midpoint + squared length -->
  <text x="350" y="76" fill="#5c6b76" font-size="12.5">key = (x1+x2, y1+y2, |d|²)</text>
  <text x="350" y="104" fill="#5c6b76" font-size="12.5">diagonal (1,2)–(1,0)</text>
  <text x="350" y="124" fill="#4169E1" font-size="13.5" font-weight="600">key = (2, 2, 4)</text>
  <text x="350" y="158" fill="#5c6b76" font-size="12.5">diagonal (2,1)–(0,1)</text>
  <text x="350" y="178" fill="#4169E1" font-size="13.5" font-weight="600">key = (2, 2, 4)</text>
  <text x="350" y="214" fill="#42525e" font-size="12.5">One bucket holds both: same midpoint,</text>
  <text x="350" y="232" fill="#42525e" font-size="12.5">same length → a rectangle of area 2.</text>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Both diagonals share midpoint (1, 1) and squared length 4;</text>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">their key collision (2, 2, 4) certifies the tilted rectangle of area <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
