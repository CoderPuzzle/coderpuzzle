<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 328" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="470" height="328" fill="#ffffff"/>
  <!-- arr = [3,2,4,1]; pinned flips k = 3,4,2,3,2; rows show the array after each flip; cells 44x32 at x=160+50c, rows y=36+42r; accent = prefix that flip reversed, gray = parked before the round -->
  <g text-anchor="end" font-size="12.5" fill="#5c6b76">
    <text x="146" y="57">start</text>
    <text x="146" y="99" fill="#4169E1" font-weight="600">k = 3</text>
    <text x="146" y="141" fill="#4169E1" font-weight="600">k = 4</text>
    <text x="146" y="183" fill="#4169E1" font-weight="600">k = 2</text>
    <text x="146" y="225" fill="#4169E1" font-weight="600">k = 3</text>
    <text x="146" y="267" fill="#4169E1" font-weight="600">k = 2</text>
  </g>
  <!-- start [3,2,4,1] -->
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="160" y="36" width="44" height="32"/><rect x="210" y="36" width="44" height="32"/>
    <rect x="260" y="36" width="44" height="32"/><rect x="310" y="36" width="44" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="182" y="57">3</text><text x="232" y="57">2</text><text x="282" y="57">4</text><text x="332" y="57">1</text>
  </g>
  <!-- after k=3: [4,2,3,1], prefix 0..2 reversed -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="160" y="78" width="44" height="32" fill="#dbe4fb"/><rect x="210" y="78" width="44" height="32" fill="#dbe4fb"/>
    <rect x="260" y="78" width="44" height="32" fill="#dbe4fb"/><rect x="310" y="78" width="44" height="32" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="182" y="99">4</text><text x="232" y="99">2</text><text x="282" y="99">3</text><text x="332" y="99">1</text>
  </g>
  <!-- after k=4: [1,3,2,4], whole array reversed; 4 parks at the back -->
  <g stroke="#42525e" stroke-width="1.2" fill="#dbe4fb">
    <rect x="160" y="120" width="44" height="32"/><rect x="210" y="120" width="44" height="32"/>
    <rect x="260" y="120" width="44" height="32"/><rect x="310" y="120" width="44" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="182" y="141">1</text><text x="232" y="141">3</text><text x="282" y="141">2</text><text x="332" y="141">4</text>
  </g>
  <!-- after k=2: [3,1,2,4]; 4 stays parked -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="160" y="162" width="44" height="32" fill="#dbe4fb"/><rect x="210" y="162" width="44" height="32" fill="#dbe4fb"/>
    <rect x="260" y="162" width="44" height="32" fill="#ffffff"/>
  </g>
  <rect x="310" y="162" width="44" height="32" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="182" y="183">3</text><text x="232" y="183">1</text><text x="282" y="183">2</text>
  </g>
  <text x="332" y="183" text-anchor="middle" font-weight="600" fill="#9aa7b2">4</text>
  <!-- after k=3: [2,1,3,4]; 3 parks at index 2 -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="160" y="204" width="44" height="32" fill="#dbe4fb"/><rect x="210" y="204" width="44" height="32" fill="#dbe4fb"/>
    <rect x="260" y="204" width="44" height="32" fill="#dbe4fb"/>
  </g>
  <rect x="310" y="204" width="44" height="32" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="182" y="225">2</text><text x="232" y="225">1</text><text x="282" y="225">3</text>
  </g>
  <text x="332" y="225" text-anchor="middle" font-weight="600" fill="#9aa7b2">4</text>
  <!-- after k=2: [1,2,3,4] sorted -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="160" y="246" width="44" height="32" fill="#dbe4fb"/><rect x="210" y="246" width="44" height="32" fill="#dbe4fb"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#f0f3f7">
    <rect x="260" y="246" width="44" height="32"/><rect x="310" y="246" width="44" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="182" y="267" fill="#1a2026">1</text><text x="232" y="267" fill="#1a2026">2</text>
    <text x="282" y="267" fill="#9aa7b2">3</text><text x="332" y="267" fill="#9aa7b2">4</text>
  </g>
  <text x="235" y="298" text-anchor="middle" fill="#5c6b76" font-size="11.5">accent = prefix this flip reversed · gray = parked for good</text>
  <text x="235" y="316" text-anchor="middle" fill="#1a2026" font-size="13">Five flips — 3, 4, 2, 3, 2 — sort [3, 2, 4, 1] into <tspan fill="#4169E1" font-weight="600">[1, 2, 3, 4]</tspan>.</text>
</svg>
