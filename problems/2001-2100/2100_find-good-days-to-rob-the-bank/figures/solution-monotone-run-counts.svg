<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="322" fill="#ffffff"/>
  <!-- security = [5,3,3,3,5,6,2], time = 2; columns x = 112+70i, w 60; left[i] = non-increasing steps ending at i, right[i] = non-decreasing steps starting at i; days 2,3 accented -->
  <text x="628" y="44" text-anchor="end" fill="#5c6b76" font-size="12.5">time = 2</text>
  <!-- security row -->
  <text x="8" y="87" fill="#5c6b76" font-size="12.5">security</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="112" y="64" width="60" height="36"/><rect x="182" y="64" width="60" height="36"/>
    <rect x="392" y="64" width="60" height="36"/><rect x="462" y="64" width="60" height="36"/>
    <rect x="532" y="64" width="60" height="36"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="#ffffff">
    <rect x="252" y="64" width="60" height="36"/><rect x="322" y="64" width="60" height="36"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="142" y="87">5</text><text x="212" y="87">3</text><text x="282" y="87">3</text>
    <text x="352" y="87">3</text><text x="422" y="87">5</text><text x="492" y="87">6</text><text x="562" y="87">2</text>
  </g>
  <!-- left scan: non-increasing steps ending at i -->
  <text x="8" y="150" fill="#5c6b76" font-size="11.5">non-increasing</text>
  <text x="8" y="164" fill="#5c6b76" font-size="11.5">steps ending at i</text>
  <g stroke="#42525e" stroke-width="1" fill="#ffffff">
    <rect x="112" y="138" width="60" height="32"/><rect x="182" y="138" width="60" height="32"/>
    <rect x="392" y="138" width="60" height="32"/><rect x="462" y="138" width="60" height="32"/>
    <rect x="532" y="138" width="60" height="32"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="252" y="138" width="60" height="32"/><rect x="322" y="138" width="60" height="32"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="142" y="158" fill="#9aa7b2">0</text><text x="212" y="158">1</text>
    <text x="282" y="158" font-weight="700">2</text><text x="352" y="158" font-weight="700">3</text>
    <text x="422" y="158" fill="#9aa7b2">0</text><text x="492" y="158" fill="#9aa7b2">0</text>
    <text x="562" y="158">1</text>
  </g>
  <!-- right scan: non-decreasing steps starting at i -->
  <text x="8" y="218" fill="#5c6b76" font-size="11.5">non-decreasing</text>
  <text x="8" y="232" fill="#5c6b76" font-size="11.5">steps starting at i</text>
  <g stroke="#42525e" stroke-width="1" fill="#ffffff">
    <rect x="112" y="206" width="60" height="32"/><rect x="182" y="206" width="60" height="32"/>
    <rect x="392" y="206" width="60" height="32"/><rect x="462" y="206" width="60" height="32"/>
    <rect x="532" y="206" width="60" height="32"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="252" y="206" width="60" height="32"/><rect x="322" y="206" width="60" height="32"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="142" y="226" fill="#9aa7b2">0</text><text x="212" y="226">4</text>
    <text x="282" y="226" font-weight="700">3</text><text x="352" y="226" font-weight="700">2</text>
    <text x="422" y="226">1</text><text x="492" y="226" fill="#9aa7b2">0</text>
    <text x="562" y="226" fill="#9aa7b2">0</text>
  </g>
  <!-- days 2 and 3 qualify -->
  <path d="M 252 250 L 252 256 L 382 256 L 382 250" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <text x="317" y="272" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">both counts reach time = 2</text>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Only days 2 (left 2, right 3) and 3 (left 3, right 2) have both runs at time = 2,</text>
  <text x="320" y="314" text-anchor="middle" fill="#1a2026" font-size="13">so the answer is <tspan fill="#4169E1" font-weight="600">[2, 3]</tspan>.</text>
</svg>
