<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <!-- s = a a a b c b b c c (indices 0-8), count = 3; cells 44x40 at (122,58); brackets mark the d = 1/2/3 fixed windows -->
  <text x="320" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">s = aaabcbbcc · count = 3</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="122" y="58" width="44" height="40"/><rect x="166" y="58" width="44" height="40"/><rect x="210" y="58" width="44" height="40"/>
    <rect x="254" y="58" width="44" height="40"/><rect x="298" y="58" width="44" height="40"/><rect x="342" y="58" width="44" height="40"/>
    <rect x="386" y="58" width="44" height="40"/><rect x="430" y="58" width="44" height="40"/><rect x="474" y="58" width="44" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="144" y="83">a</text><text x="188" y="83">a</text><text x="232" y="83">a</text>
    <text x="276" y="83">b</text><text x="320" y="83">c</text><text x="364" y="83">b</text>
    <text x="408" y="83">b</text><text x="452" y="83">c</text><text x="496" y="83">c</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="144" y="114">0</text><text x="188" y="114">1</text><text x="232" y="114">2</text>
    <text x="276" y="114">3</text><text x="320" y="114">4</text><text x="364" y="114">5</text>
    <text x="408" y="114">6</text><text x="452" y="114">7</text><text x="496" y="114">8</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 122 134 V 146 H 254 V 134"/>
    <path d="M 254 180 V 192 H 518 V 180"/>
    <path d="M 122 226 V 238 H 518 V 226"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="188" y="164">d = 1, length 3: <tspan fill="#4169E1" font-weight="600">"aaa"</tspan> — valid</text>
    <text x="386" y="210">d = 2, length 6: <tspan fill="#4169E1" font-weight="600">"bcbbcc"</tspan> — valid</text>
    <text x="320" y="256">d = 3, length 9: <tspan fill="#4169E1" font-weight="600">"aaabcbbcc"</tspan> — valid</text>
  </g>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">A window with d distinct letters needs length d × count; each fixed length above finds</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">exactly one valid window in aaabcbbcc — 1 + 1 + 1 is the answer <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
