<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- buildings = [[1,4,2],[3,9,4]]; events +2@1, +4@3, -2@4, -4@9; intervals avg 2, 3, 4; x = 60 + 60 * coordinate -->
  <rect x="120" y="144" width="180" height="60" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="240" y="84" width="360" height="120" fill="none" stroke="#42525e" stroke-width="1.6"/>
  <text x="186" y="178" text-anchor="middle" fill="#1a2026" font-size="12.5">height 2</text>
  <text x="480" y="148" text-anchor="middle" fill="#1a2026" font-size="12.5">height 4</text>
  <line x1="96" y1="204" x2="630" y2="204" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="642" y="209" fill="#5c6b76" font-size="11.5">x</text>
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="120" y1="204" x2="120" y2="212"/><line x1="240" y1="204" x2="240" y2="212"/>
    <line x1="300" y1="204" x2="300" y2="212"/><line x1="600" y1="204" x2="600" y2="212"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="120" y="228">1</text><text x="240" y="228">3</text><text x="300" y="228">4</text><text x="600" y="228">9</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">
    <text x="120" y="248">+2</text><text x="240" y="248">+4</text><text x="300" y="248">−2</text><text x="600" y="248">−4</text>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4">
    <rect x="120" y="272" width="120" height="48"/><rect x="240" y="272" width="60" height="48"/><rect x="300" y="272" width="300" height="48"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="180" y="292">avg 2</text><text x="270" y="292">avg 3</text><text x="450" y="292">avg 4</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="180" y="310">[1, 3)</text><text x="270" y="310">[3, 4)</text><text x="450" y="310">[4, 9)</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="180" y="336">sum 2 ÷ 1</text><text x="270" y="336">sum 6 ÷ 2</text><text x="450" y="336">sum 4 ÷ 1</text>
  </g>
  <text x="330" y="368" text-anchor="middle" fill="#1a2026" font-size="13">Events +2, +4, −2, −4 at coordinates 1, 3, 4, 9 give constant (sum, count) intervals;</text>
  <text x="330" y="386" text-anchor="middle" fill="#1a2026" font-size="13">adjacent averages 2, 3, 4 all differ, so nothing merges: <tspan fill="#4169E1" font-weight="600">[[1,3,2],[3,4,3],[4,9,4]]</tspan>.</text>
</svg>
