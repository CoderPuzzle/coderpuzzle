<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <!-- relations = [[1,5],[2,5],[3,5],[3,4],[4,5]], time = [1,2,3,4,5] -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="131" y1="65" x2="437" y2="135" marker-end="url(#arrow)"/>
    <line x1="132" y1="140" x2="437" y2="140" marker-end="url(#arrow)"/>
    <line x1="131" y1="215" x2="438" y2="143" marker-end="url(#arrow)"/>
    <line x1="132" y1="220" x2="257" y2="220" marker-end="url(#arrow)"/>
    <line x1="300" y1="211" x2="439" y2="153" marker-end="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="110" cy="60" r="22"/>
    <circle cx="110" cy="140" r="22"/>
    <circle cx="110" cy="220" r="22"/>
    <circle cx="280" cy="220" r="22"/>
    <circle cx="460" cy="140" r="22"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="110" y="66">1</text>
    <text x="110" y="146">2</text>
    <text x="110" y="226">3</text>
    <text x="280" y="226">4</text>
    <text x="460" y="146">5</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="110" y="98">1 month</text>
    <text x="110" y="178">2 months</text>
    <text x="110" y="258">3 months</text>
    <text x="280" y="258">4 months</text>
    <text x="460" y="178">5 months</text>
  </g>
</svg>
