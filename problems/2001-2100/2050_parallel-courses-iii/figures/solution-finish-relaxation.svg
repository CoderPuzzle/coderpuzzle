<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- n = 3, relations = [[1,3],[2,3]], time = [3,2,5].
       Kahn relaxation: finish[1] = 3, finish[2] = 2; course 3 starts at max(3,2) = 3, finish 3 + 5 = 8.
       Critical chain 1 -> 3 accented. Boxes 170x70: 1(80,64) 2(80,176) 3(380,120) -->
  <text x="320" y="24" text-anchor="middle" fill="#5c6b76" font-size="12.5">n = 3, relations = [[1,3],[2,3]], time = [3,2,5]</text>
  <!-- relaxation edges -->
  <line x1="250" y1="99" x2="376" y2="149" fill="none" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrowA)"/>
  <line x1="250" y1="211" x2="376" y2="161" fill="none" stroke="#5c6b76" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <!-- course 1 -->
  <rect x="80" y="64" width="170" height="70" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="165" y="91" text-anchor="middle" fill="#1a2026" font-weight="600">course 1</text>
  <text x="165" y="114" text-anchor="middle" font-size="12"><tspan fill="#5c6b76">starts at 0 · </tspan><tspan fill="#4169E1" font-weight="600">finish 3</tspan></text>
  <!-- course 2 -->
  <rect x="80" y="176" width="170" height="70" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="165" y="203" text-anchor="middle" fill="#1a2026" font-weight="600">course 2</text>
  <text x="165" y="226" text-anchor="middle" font-size="12"><tspan fill="#5c6b76">starts at 0 · </tspan><tspan fill="#1a2026" font-weight="600">finish 2</tspan></text>
  <!-- course 3 -->
  <rect x="380" y="120" width="170" height="70" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="465" y="144" text-anchor="middle" fill="#1a2026" font-weight="600">course 3</text>
  <text x="465" y="163" text-anchor="middle" fill="#5c6b76" font-size="12">starts at max(3, 2) = 3</text>
  <text x="465" y="182" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">finish 3 + 5 = 8</text>
  <text x="320" y="278" text-anchor="middle" fill="#1a2026" font-size="13">Course 3 starts at max(3, 2) = 3 — a course waits for all prerequisites —</text>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">so the critical chain 1 → 3 finishes at 3 + 5 = <tspan fill="#4169E1" font-weight="600">8</tspan> months, the answer.</text>
</svg>
