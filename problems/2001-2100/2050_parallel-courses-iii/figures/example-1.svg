<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <!-- relations = [[1,3],[2,3]], time = [3,2,5] -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="162" y1="82" x2="368" y2="116" marker-end="url(#arrow)"/>
    <line x1="162" y1="178" x2="368" y2="144" marker-end="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="140" cy="75" r="22"/>
    <circle cx="140" cy="185" r="22"/>
    <circle cx="390" cy="130" r="22"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="140" y="81">1</text>
    <text x="140" y="191">2</text>
    <text x="390" y="136">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="140" y="113">3 months</text>
    <text x="140" y="223">2 months</text>
    <text x="390" y="168">5 months</text>
  </g>
</svg>
