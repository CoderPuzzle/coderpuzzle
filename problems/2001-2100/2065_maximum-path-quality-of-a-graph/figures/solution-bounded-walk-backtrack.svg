<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- values = [0,32,10,43]; edges 0-1 (10 s), 1-2 (15 s), 0-3 (10 s); maxTime = 49;
       walk 0-1-0-3-0 = 40 s, candidates q=0, q=32, q=75; chips at x = 334 + 68k;
       budget bar 330..630 maps 0..49 s (fill 40/49 = 245 px) -->
  <g stroke="#9aa7b2" stroke-width="2">
    <line x1="260" y1="136" x2="260" y2="214"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="146" y1="110" x2="234" y2="110"/>
    <line x1="120" y1="136" x2="120" y2="214"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="190" y="98" fill="#4169E1">10 s</text>
    <text x="276" y="179" fill="#9aa7b2">15 s</text>
    <text x="104" y="179" fill="#4169E1">10 s</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <circle cx="120" cy="110" r="24" fill="#dbe4fb"/>
    <circle cx="260" cy="110" r="24" fill="#dbe4fb"/>
    <circle cx="260" cy="240" r="24" fill="#f0f3f7" stroke-dasharray="4 3"/>
    <circle cx="120" cy="240" r="24" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="120" y="115">0</text><text x="260" y="115">32</text>
    <text x="260" y="245" fill="#9aa7b2">10</text><text x="120" y="245">43</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="120" y="72">node 0</text><text x="260" y="72">node 1</text>
    <text x="260" y="280">node 2</text><text x="120" y="280">node 3</text>
  </g>
  <!-- backtracking walk 0 -1- 0 -3- 0 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="334" y="96" width="30" height="30" rx="6"/>
    <rect x="402" y="96" width="30" height="30" rx="6"/>
    <rect x="470" y="96" width="30" height="30" rx="6"/>
    <rect x="538" y="96" width="30" height="30" rx="6"/>
    <rect x="606" y="96" width="30" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="349" y="116">0</text><text x="417" y="116">1</text><text x="485" y="116">0</text>
    <text x="553" y="116">3</text><text x="621" y="116">0</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 367 111 L 398 111" marker-end="url(#arrow)"/>
    <path d="M 435 111 L 466 111" marker-end="url(#arrow)"/>
    <path d="M 503 111 L 534 111" marker-end="url(#arrow)"/>
    <path d="M 571 111 L 602 111" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5">
    <text x="383" y="90">+10</text><text x="451" y="90">+10</text>
    <text x="519" y="90">+10</text><text x="587" y="90">+10</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="383" y="143">t=10</text><text x="451" y="143">t=20</text>
    <text x="519" y="143">t=30</text><text x="587" y="143">t=40</text>
    <text x="349" y="143">q=0</text><text x="485" y="143">q=32</text>
  </g>
  <text x="621" y="143" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">q=75</text>
  <!-- elapsed time against the budget -->
  <rect x="330" y="174" width="300" height="10" rx="5" fill="#f0f3f7"/>
  <rect x="330" y="174" width="245" height="10" rx="5" fill="#4169E1"/>
  <line x1="630" y1="170" x2="630" y2="188" stroke="#5c6b76" stroke-width="1.5"/>
  <text x="575" y="168" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">40 s</text>
  <text x="332" y="202" fill="#5c6b76" font-size="11.5">0</text>
  <text x="630" y="202" text-anchor="end" fill="#5c6b76" font-size="11.5">budget 49</text>
  <text x="40" y="316" fill="#1a2026" font-size="13">The walk 0 &#8594; 1 &#8594; 0 &#8594; 3 &#8594; 0 takes 40 s of the 49 s budget and returns to node 0,</text>
  <text x="40" y="334" fill="#1a2026" font-size="13">scoring unique values 0 + 32 + 43 = <tspan fill="#4169E1" font-weight="600">75</tspan>; node 2 (10) can't be visited and back in time.</text>
</svg>
