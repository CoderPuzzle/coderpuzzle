<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="348" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- n = 5, rides = [[2,5,4],[1,5,1]]; dp = [0,0,0,0,0,7]; both rides end at point 5 -->
  <g font-size="13">
    <line x1="36" y1="46" x2="52" y2="46" stroke="#4169E1" stroke-width="3"/>
    <text x="58" y="50" fill="#4169E1" font-weight="600">ride [2, 5, 4]: dp[2] + 5 − 2 + 4 = 7</text>
    <line x1="36" y1="72" x2="52" y2="72" stroke="#5c6b76" stroke-width="2"/>
    <text x="58" y="76" fill="#5c6b76">ride [1, 5, 1]: dp[1] + 5 − 1 + 1 = 5</text>
  </g>
  <path d="M 290 202 Q 440 108 574 200" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 190 202 Q 390 34 594 204" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <line x1="64" y1="210" x2="612" y2="210" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="90" y1="210" x2="90" y2="218"/><line x1="190" y1="210" x2="190" y2="218"/>
    <line x1="290" y1="210" x2="290" y2="218"/><line x1="390" y1="210" x2="390" y2="218"/>
    <line x1="490" y1="210" x2="490" y2="218"/><line x1="590" y1="210" x2="590" y2="218"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="90" y="238">0</text><text x="190" y="238">1</text><text x="290" y="238">2</text>
    <text x="390" y="238">3</text><text x="490" y="238">4</text><text x="590" y="238">5</text>
  </g>
  <text x="46" y="272" text-anchor="end" fill="#5c6b76" font-size="12.5">dp</text>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="90" y="272">0</text><text x="190" y="272">0</text><text x="290" y="272">0</text>
    <text x="390" y="272">0</text><text x="490" y="272">0</text>
  </g>
  <text x="590" y="272" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="16">7</text>
  <text x="290" y="292" text-anchor="middle" fill="#5c6b76" font-size="11.5">points 1–4 carry dp = 0 forward</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">Grouping both rides at endpoint 5: dp[5] = max(carry 0, dp[2] + 7, dp[1] + 5) = <tspan fill="#4169E1" font-weight="600">7</tspan>.</text>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">Points 1–4 only carry dp forward; the [2, 5, 4] ride is the winning last ride.</text>
</svg>
