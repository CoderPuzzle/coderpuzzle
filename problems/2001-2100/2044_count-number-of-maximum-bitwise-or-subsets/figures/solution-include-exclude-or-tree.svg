<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="384" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums = [3,1]; target OR = 3 | 1 = 3. Levels: root (or=0), index-0 decisions (skip/take 3), index-1 decisions (skip/take 1) as leaves.
       Counted leaves (or=3): subsets [3] and [3,1]. Inner boxes 120x46 (root y=32, level-2 y=146), leaf boxes 110x46 at y=264, x = 25 + 160i -->
  <text x="320" y="20" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums = [3,1], target OR = 3 | 1 = 3</text>
  <!-- edges -->
  <g fill="none" stroke="#5c6b76" stroke-width="1.5">
    <path d="M 320 78 Q 240 112 160 146" marker-end="url(#arrow)"/>
    <path d="M 320 78 Q 400 112 480 146" marker-end="url(#arrow)"/>
    <path d="M 160 192 Q 120 228 80 264" marker-end="url(#arrow)"/>
    <path d="M 160 192 Q 200 228 240 264" marker-end="url(#arrow)"/>
    <path d="M 480 192 Q 440 228 400 264" marker-end="url(#arrow)"/>
    <path d="M 480 192 Q 520 228 560 264" marker-end="url(#arrow)"/>
  </g>
  <!-- root -->
  <rect x="260" y="32" width="120" height="46" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="320" y="50" text-anchor="middle" fill="#5c6b76" font-size="11">start</text>
  <text x="320" y="70" text-anchor="middle" fill="#1a2026" font-weight="600">or = 0</text>
  <!-- index-0 decision nodes -->
  <rect x="100" y="146" width="120" height="46" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="160" y="164" text-anchor="middle" fill="#5c6b76" font-size="11">skip 3</text>
  <text x="160" y="184" text-anchor="middle" fill="#1a2026" font-weight="600">or = 0</text>
  <rect x="420" y="146" width="120" height="46" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="480" y="164" text-anchor="middle" fill="#5c6b76" font-size="11">take 3</text>
  <text x="480" y="184" text-anchor="middle" fill="#4169E1" font-weight="600">or = 3</text>
  <!-- leaves -->
  <rect x="25" y="264" width="110" height="46" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="80" y="283" text-anchor="middle" fill="#9aa7b2" font-size="11">skip 1</text>
  <text x="80" y="302" text-anchor="middle" fill="#9aa7b2" font-weight="600">or = 0</text>
  <rect x="185" y="264" width="110" height="46" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="240" y="283" text-anchor="middle" fill="#9aa7b2" font-size="11">take 1</text>
  <text x="240" y="302" text-anchor="middle" fill="#9aa7b2" font-weight="600">or = 1</text>
  <rect x="345" y="264" width="110" height="46" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="400" y="283" text-anchor="middle" fill="#5c6b76" font-size="11">skip 1</text>
  <text x="400" y="302" text-anchor="middle" fill="#4169E1" font-weight="600">or = 3</text>
  <rect x="505" y="264" width="110" height="46" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="560" y="283" text-anchor="middle" fill="#5c6b76" font-size="11">take 1</text>
  <text x="560" y="302" text-anchor="middle" fill="#4169E1" font-weight="600">or = 3</text>
  <!-- subsets of the counted leaves -->
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="400" y="328">[3]</text>
    <text x="560" y="328">[3,1]</text>
  </g>
  <text x="320" y="354" text-anchor="middle" fill="#1a2026" font-size="13">Target OR = 3 | 1 = 3; the accented leaves, subsets [3] and [3,1],</text>
  <text x="320" y="372" text-anchor="middle" fill="#1a2026" font-size="13">are exactly the maximum-OR subsets — the answer is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
