<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 470" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="650" height="470" fill="#ffffff"/>
  <!-- stored (3,10),(11,2),(3,2); query (11,10); square side d = 8; product 1x1x1 = 1, duplicate (11,2) gives 2 -->
  <g stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <line x1="70" y1="70" x2="390" y2="70"/>
    <line x1="390" y1="70" x2="390" y2="370"/>
    <line x1="390" y1="370" x2="70" y2="370"/>
    <line x1="70" y1="370" x2="70" y2="70"/>
  </g>
  <text x="230" y="58" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">d = 8</text>
  <g fill="#4169E1">
    <circle cx="70" cy="70" r="7"/><circle cx="70" cy="370" r="7"/><circle cx="390" cy="370" r="7"/>
  </g>
  <rect x="382" y="62" width="16" height="16" fill="#1a2026"/>
  <text x="48" y="60" fill="#1a2026" font-size="12.5">(3,10)</text>
  <text x="390" y="46" text-anchor="middle" fill="#1a2026" font-size="12.5">query (11,10)</text>
  <text x="70" y="396" text-anchor="middle" fill="#1a2026" font-size="12.5">(3,2)</text>
  <text x="390" y="396" text-anchor="middle" fill="#1a2026" font-size="12.5">(11,2)</text>
  <text x="390" y="416" text-anchor="middle" fill="#5c6b76" font-size="11.5">added twice → freq 2</text>
  <text x="548" y="70" text-anchor="middle" fill="#5c6b76" font-size="13">count((11,10))</text>
  <text x="456" y="104" fill="#1a2026" font-size="13">partner (3,10) sets <tspan fill="#4169E1" font-weight="600">d = 8</tspan></text>
  <text x="456" y="132" fill="#5c6b76" font-size="12.5">up (3,18),(11,18) → 0</text>
  <text x="456" y="152" fill="#5c6b76" font-size="12.5">down (3,2),(11,2) present</text>
  <text x="456" y="182" fill="#4169E1" font-weight="600" font-size="14">1 × 1 × 1 = 1</text>
  <text x="456" y="214" fill="#5c6b76" font-size="12.5">after add((11,2)):</text>
  <text x="456" y="242" fill="#4169E1" font-weight="600" font-size="14">1 × 2 × 1 = 2</text>
  <text x="325" y="446" text-anchor="middle" fill="#1a2026" font-size="13">Partner (3,10) fixes d = 8; the matching corners (11,2) and (3,2) give 1 × 1 × 1 = <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
  <text x="325" y="464" text-anchor="middle" fill="#1a2026" font-size="13">The duplicate (11,2) doubles the product, so the second count returns <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
