<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="322" fill="#ffffff"/>
  <!-- board = [["#"," ","#"],[" "," ","#"],["#","c"," "]], word "abc";
       cells 56x56 at (84,64); the run is column 1, rows 0-2 -->
  <text x="168" y="46" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">word = "abc"</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="112" y="60">0</text><text x="168" y="60">1</text><text x="224" y="60">2</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="10.5">
    <text x="74" y="96">0</text><text x="74" y="152">1</text><text x="74" y="208">2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="84" y="64" width="56" height="56" fill="#f0f3f7"/><rect x="140" y="64" width="56" height="56" fill="#dbe4fb"/><rect x="196" y="64" width="56" height="56" fill="#f0f3f7"/>
    <rect x="84" y="120" width="56" height="56" fill="#ffffff"/><rect x="140" y="120" width="56" height="56" fill="#dbe4fb"/><rect x="196" y="120" width="56" height="56" fill="#f0f3f7"/>
    <rect x="84" y="176" width="56" height="56" fill="#f0f3f7"/><rect x="140" y="176" width="56" height="56" fill="#dbe4fb"/><rect x="196" y="176" width="56" height="56" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="16">
    <text x="112" y="97">#</text><text x="224" y="97">#</text>
    <text x="224" y="153">#</text>
    <text x="112" y="209">#</text>
  </g>
  <g text-anchor="middle">
    <text x="168" y="100" fill="#4169E1" font-size="22" font-weight="650">a</text>
    <text x="168" y="156" fill="#4169E1" font-size="22" font-weight="650">b</text>
    <text x="168" y="212" fill="#4169E1" font-size="22" font-weight="650">c</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="9">
    <text x="168" y="115">space</text>
    <text x="168" y="171">space</text>
  </g>
  <rect x="144" y="180" width="48" height="48" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <text x="168" y="252" text-anchor="middle" fill="#5c6b76" font-size="10.5">fixed c matches</text>
  <line x1="168" y1="234" x2="168" y2="242" stroke="#9aa7b2" stroke-width="1"/>
  <!-- run inventory -->
  <text x="300" y="74" fill="#1a2026" font-size="14" font-weight="600">maximal open runs</text>
  <text x="300" y="98" fill="#5c6b76" font-size="12" font-weight="600">horizontal</text>
  <g fill="#1a2026" font-size="13">
    <text x="300" y="120">row 0 · length 1</text>
    <text x="300" y="140">row 1 · length 2</text>
    <text x="300" y="160">row 2 · length 2</text>
  </g>
  <text x="300" y="186" fill="#5c6b76" font-size="12" font-weight="600">vertical</text>
  <g fill="#1a2026" font-size="13">
    <text x="300" y="208">col 0 · length 1</text>
    <text x="300" y="228">col 1 · length <tspan fill="#4169E1" font-weight="700">3</tspan><tspan fill="#5c6b76"> = |abc|</tspan></text>
    <text x="300" y="248">col 2 · length 1</text>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="300" y="272">col 1 runs edge to edge: a, b fill spaces,</text>
    <text x="300" y="290">c lands on the fixed c — the word fits</text>
  </g>
  <text x="320" y="314" text-anchor="middle" fill="#1a2026" font-size="13">Only column 1 is a length-3 run; abc laid top to bottom fits it — the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
