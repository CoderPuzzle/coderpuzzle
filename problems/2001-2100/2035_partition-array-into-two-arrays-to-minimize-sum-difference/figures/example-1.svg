<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="230" fill="#ffffff"/>
  <!-- partition [3,9] and [7,3] of nums = [3,9,7,3] -->
  <text x="78" y="62" fill="#5c6b76" text-anchor="end">array 1:</text>
  <g fill="#4f9d69" fill-opacity="0.2" stroke="#1a2026" stroke-width="1.2">
    <rect x="90" y="40" width="46" height="34" rx="3"/>
    <rect x="142" y="40" width="46" height="34" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="113" y="62">3</text><text x="165" y="62">9</text>
  </g>
  <text x="78" y="132" fill="#5c6b76" text-anchor="end">nums:</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.2">
    <rect x="90" y="110" width="46" height="34" rx="3"/>
    <rect x="142" y="110" width="46" height="34" rx="3"/>
    <rect x="194" y="110" width="46" height="34" rx="3"/>
    <rect x="246" y="110" width="46" height="34" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="113" y="132">3</text><text x="165" y="132">9</text>
    <text x="217" y="132">7</text><text x="269" y="132">3</text>
  </g>
  <text x="78" y="202" fill="#5c6b76" text-anchor="end">array 2:</text>
  <g fill="#c98a2e" fill-opacity="0.22" stroke="#1a2026" stroke-width="1.2">
    <rect x="90" y="180" width="46" height="34" rx="3"/>
    <rect x="142" y="180" width="46" height="34" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="113" y="202">7</text><text x="165" y="202">3</text>
  </g>
