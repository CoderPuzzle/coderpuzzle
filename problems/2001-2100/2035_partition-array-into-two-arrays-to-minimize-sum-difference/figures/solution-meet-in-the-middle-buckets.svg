<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="700" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [3,9,7,3], n = 2, total = 22; first half [3,9] -> A[0]=[0] A[1]=[3,9] A[2]=[12];
       second half [7,3] -> B[0]=[0] B[1]=[3,7] B[2]=[10]; pairings 0+10, 3+7, 9+3, 12+0
       all give |22 - 2(a+b)| = 2. Chips 34x26; A rows at x=84/124, B rows at x=536/576. -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">nums = [3,9,7,3], n = 2, total = 22, target total/2 = 11</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="240" y="44" width="50" height="36"/><rect x="290" y="44" width="50" height="36"/>
    <rect x="340" y="44" width="50" height="36"/><rect x="390" y="44" width="50" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="265" y="68">3</text><text x="315" y="68">9</text><text x="365" y="68">7</text><text x="415" y="68">3</text>
  </g>
  <path d="M 340 40 L 340 84" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="290" y="98">first half</text><text x="390" y="98">second half</text>
  </g>
  <text x="130" y="126" text-anchor="middle" fill="#5c6b76" font-size="12">A[c] — subset sums of [3, 9]</text>
  <text x="570" y="126" text-anchor="middle" fill="#5c6b76" font-size="12">B[c] — subset sums of [7, 3]</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="84" y="140" width="34" height="26"/>
    <rect x="84" y="172" width="34" height="26"/><rect x="124" y="172" width="34" height="26"/>
    <rect x="84" y="204" width="34" height="26"/>
    <rect x="536" y="172" width="34" height="26"/><rect x="576" y="172" width="34" height="26"/>
    <rect x="576" y="140" width="34" height="26"/>
    <rect x="576" y="204" width="34" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="101" y="158">0</text>
    <text x="101" y="190">3</text><text x="141" y="190">9</text>
    <text x="101" y="222">12</text>
    <text x="593" y="158">0</text>
    <text x="553" y="190">3</text><text x="593" y="190">7</text>
    <text x="593" y="222">10</text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="76" y="158" text-anchor="end">A[0]</text>
    <text x="76" y="190" text-anchor="end">A[1]</text>
    <text x="76" y="222" text-anchor="end">A[2]</text>
    <text x="618" y="158">B[0]</text>
    <text x="618" y="190">B[1]</text>
    <text x="618" y="222">B[2]</text>
  </g>
  <path d="M 101 198 L 101 200 Q 101 201 102 201 L 583 201 Q 588 201 588 196.5" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 162 193 L 530 193" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="347" y="171" text-anchor="middle" fill="#1a2026" font-size="12">a = 3: binary-search B[1] for 11 - 3 = 8 → <tspan fill="#4169E1" font-weight="600">b = 7</tspan></text>
  <text x="347" y="213" text-anchor="middle" fill="#1a2026" font-size="12">a = 9: binary-search for 11 - 9 = 2 → <tspan fill="#4169E1" font-weight="600">b = 3</tspan></text>
  <text x="350" y="248" text-anchor="middle" fill="#5c6b76" font-size="12">End counts pair too: c = 0 pairs 0 with 10, c = 2 pairs 12 with 0 — both differences are 2.</text>
  <text x="350" y="278" text-anchor="middle" fill="#1a2026" font-size="13">For every a the search picks the b nearest total/2 - a, and the best |total - 2(a + b)|</text>
  <text x="350" y="298" text-anchor="middle" fill="#1a2026" font-size="13">over all pairings is <tspan fill="#4169E1" font-weight="600">2</tspan> — e.g. 3 + 7 = 10: |22 - 20| = 2.</text>
</svg>
