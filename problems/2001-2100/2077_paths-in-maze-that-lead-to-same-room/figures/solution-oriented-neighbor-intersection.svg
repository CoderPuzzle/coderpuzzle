<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="345" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- corridors [[1,2],[5,2],[4,1],[2,4],[3,1],[3,4]]; rooms 1(140,180) 2(220,70) 3(75,275) 4(270,240) 5(320,40) r 20; cycle edges accent -->
  <line x1="220" y1="70" x2="320" y2="40" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="140" y1="180" x2="220" y2="70"/>
    <line x1="220" y1="70" x2="270" y2="240"/>
    <line x1="140" y1="180" x2="270" y2="240"/>
    <line x1="140" y1="180" x2="75" y2="275"/>
    <line x1="75" y1="275" x2="270" y2="240"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="140" cy="180" r="20"/><circle cx="220" cy="70" r="20"/>
    <circle cx="75" cy="275" r="20"/><circle cx="270" cy="240" r="20"/>
  </g>
  <circle cx="320" cy="40" r="20" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="140" y="185">1</text><text x="220" y="75">2</text>
    <text x="75" y="280">3</text><text x="270" y="245">4</text>
  </g>
  <text x="320" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#9aa7b2">5</text>
  <!-- forward-neighbor intersection for oriented edge 1 -> 2 -->
  <text x="512" y="58" text-anchor="middle" fill="#5c6b76" font-size="12.5">degree order: 5 &lt; 3 &lt; 1 &lt; 2 &lt; 4</text>
  <text x="512" y="88" text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">edge 1 → 2: rank(1) &lt; rank(2)</text>
  <rect x="366" y="104" width="160" height="36" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="446" y="127" text-anchor="middle" fill="#1a2026" font-size="13">forward(1) = {2, 4}</text>
  <rect x="536" y="104" width="130" height="36" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="601" y="127" text-anchor="middle" fill="#1a2026" font-size="13">forward(2) = {4}</text>
  <line x1="516" y1="148" x2="516" y2="170" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="386" y="178" width="260" height="36" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="516" y="201" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">shared room 4 → triangle {1, 2, 4}</text>
  <text x="516" y="240" text-anchor="middle" fill="#5c6b76" font-size="12.5">edge 3 → 1 finds room 4 the same way;</text>
  <text x="516" y="260" text-anchor="middle" fill="#5c6b76" font-size="12.5">each triangle is counted exactly once.</text>
  <text x="340" y="305" text-anchor="middle" fill="#1a2026" font-size="13">Orienting corridors by (degree, id), each cycle's lowest→middle edge</text>
  <text x="340" y="325" text-anchor="middle" fill="#1a2026" font-size="13">finds its third room once: cycles {1, 2, 4} and {1, 3, 4} — answer <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
