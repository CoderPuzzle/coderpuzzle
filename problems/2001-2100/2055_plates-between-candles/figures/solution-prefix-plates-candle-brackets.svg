<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = **|**|***| ; cells 46x38 at x = 80 + 52i, y 40 (candle cells accent);
       prefix plates 1,2,2,3,4,4,5,6,7,7 ; brackets span candle centers 207-363 and 363-571 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="80" y="40" width="46" height="38"/><rect x="132" y="40" width="46" height="38"/>
    <rect x="236" y="40" width="46" height="38"/><rect x="288" y="40" width="46" height="38"/>
    <rect x="392" y="40" width="46" height="38"/><rect x="444" y="40" width="46" height="38"/>
    <rect x="496" y="40" width="46" height="38"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="184" y="40" width="46" height="38"/><rect x="340" y="40" width="46" height="38"/>
    <rect x="548" y="40" width="46" height="38"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="103" y="64">*</text><text x="155" y="64">*</text>
    <text x="207" y="64" font-weight="700">|</text><text x="259" y="64">*</text>
    <text x="311" y="64">*</text><text x="363" y="64" font-weight="700">|</text>
    <text x="415" y="64">*</text><text x="467" y="64">*</text>
    <text x="519" y="64">*</text><text x="571" y="64" font-weight="700">|</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="103" y="94">0</text><text x="155" y="94">1</text><text x="207" y="94">2</text>
    <text x="259" y="94">3</text><text x="311" y="94">4</text><text x="363" y="94">5</text>
    <text x="415" y="94">6</text><text x="467" y="94">7</text><text x="519" y="94">8</text>
    <text x="571" y="94">9</text>
  </g>
  <!-- query [2,5]: nearest candle right of 2 is 2, nearest candle left of 5 is 5 -->
  <path d="M 207 110 L 363 110" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="285" y="131" text-anchor="middle" fill="#1a2026" font-size="13">query [2,5]: 4 &#8722; 2 = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <!-- query [5,9]: nearest candle right of 5 is 5, nearest candle left of 9 is 9 -->
  <path d="M 363 154 L 571 154" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="467" y="175" text-anchor="middle" fill="#1a2026" font-size="13">query [5,9]: 7 &#8722; 4 = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <!-- prefix plate counts -->
  <text x="30" y="202" text-anchor="middle" fill="#5c6b76" font-size="12.5">prefix</text>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="103" y="202">1</text><text x="155" y="202">2</text><text x="207" y="202">2</text>
    <text x="259" y="202">3</text><text x="311" y="202">4</text><text x="363" y="202">4</text>
    <text x="415" y="202">5</text><text x="467" y="202">6</text><text x="519" y="202">7</text>
    <text x="571" y="202">7</text>
  </g>
  <text x="40" y="232" fill="#1a2026" font-size="13">Query [2,5] takes prefix[4] &#8722; prefix[2] = 4 &#8722; 2 = <tspan fill="#4169E1" font-weight="600">2</tspan> plates between</text>
  <text x="40" y="250" fill="#1a2026" font-size="13">candles 2 and 5; query [5,9] takes prefix[8] &#8722; prefix[5] = 7 &#8722; 4 = <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
