<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- n = 3, restrictions [[0,1]], requests [[0,2],[2,1]]; person circles r 22 at (110,116) (320,116) (530,116) -->
  <path d="M 136 116 L 296 116" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
  <text x="216" y="94" text-anchor="middle" fill="#9aa7b2" font-size="12">restriction 0–1</text>
  <!-- request [2,1]: rejected -->
  <text x="425" y="26" text-anchor="middle" fill="#9aa7b2" font-size="12.5" font-weight="600">request [2,1]: rejected</text>
  <path d="M 510 99 Q 425 24 340 99" fill="none" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowMuted)"/>
  <!-- request [0,2]: accepted -->
  <path d="M 133 128 Q 320 226 507 128" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="206" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">request [0,2]: accepted — union into one component {0, 2}</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="110" cy="116" r="22"/><circle cx="320" cy="116" r="22"/><circle cx="530" cy="116" r="22"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="110" y="121">0</text><text x="320" y="121">1</text><text x="530" y="121">2</text>
  </g>
  <!-- components after both requests -->
  <text x="320" y="240" text-anchor="middle" fill="#5c6b76" font-size="12">components after both requests</text>
  <rect x="168" y="252" width="130" height="36" rx="8" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="233" y="275" text-anchor="middle" font-weight="600" fill="#1a2026">{0, 2}</text>
  <rect x="318" y="252" width="80" height="36" rx="8" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <text x="358" y="275" text-anchor="middle" font-weight="600" fill="#5c6b76">{1}</text>
  <text x="320" y="314" text-anchor="middle" fill="#1a2026" font-size="13">Accepted unions keep the restricted pair 0 and 1 in different components;</text>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">[2,1] would merge {0, 2} with {1}, putting 0 and 1 together — <tspan fill="#4169E1" font-weight="600">rejected</tspan>.</text>
</svg>
