<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="336" fill="#ffffff"/>
  <!-- edges = [[0,1],[1,2]], patience = [0,2,1]; d(1)=1 round trip 2, d(2)=2 round trip 4;
       server 1 sends only at 0 (reply at 2); server 2 sends 0,1,2,3, replies land 4,5,6,7;
       last reply 3 + 4 = 7 -> idle from 8. Timeline x(s) = 240 + 48s. -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">edges = [[0,1],[1,2]], patience = [0,2,1]</text>
  <g stroke="#42525e" stroke-width="1.6">
    <path d="M 90 97 L 90 133"/>
    <path d="M 90 167 L 90 203"/>
  </g>
  <circle cx="90" cy="80" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <circle cx="90" cy="150" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="90" cy="220" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600">
    <text x="90" y="85" fill="#4169E1">0</text>
    <text x="90" y="155">1</text>
    <text x="90" y="225">2</text>
  </g>
  <text x="114" y="85" fill="#5c6b76" font-size="11.5">master</text>
  <text x="114" y="146" fill="#5c6b76" font-size="11.5">patience 2</text>
  <text x="114" y="162" fill="#9aa7b2" font-size="11">d = 1</text>
  <text x="114" y="216" fill="#5c6b76" font-size="11.5">patience 1</text>
  <text x="114" y="232" fill="#9aa7b2" font-size="11">d = 2</text>
  <text x="78" y="118" text-anchor="end" fill="#9aa7b2" font-size="10.5">1 s</text>
  <text x="78" y="188" text-anchor="end" fill="#9aa7b2" font-size="10.5">1 s</text>
  <text x="240" y="134" fill="#1a2026" font-size="12">server 1 · round trip 2·1 = 2</text>
  <g stroke="#9aa7b2" stroke-width="1.2">
    <path d="M 240 150 L 624 150"/>
    <path d="M 240 146 L 240 154"/><path d="M 288 146 L 288 154"/><path d="M 336 146 L 336 154"/>
    <path d="M 384 146 L 384 154"/><path d="M 432 146 L 432 154"/><path d="M 480 146 L 480 154"/>
    <path d="M 528 146 L 528 154"/><path d="M 576 146 L 576 154"/><path d="M 624 146 L 624 154"/>
  </g>
  <circle cx="240" cy="150" r="5" fill="#42525e"/>
  <circle cx="336" cy="150" r="5.5" fill="#4169E1"/>
  <text x="240" y="172" text-anchor="middle" fill="#9aa7b2" font-size="10">1A</text>
  <text x="336" y="172" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">reply at 2</text>
  <text x="240" y="214" fill="#1a2026" font-size="12">server 2 · round trip 2·2 = 4</text>
  <g stroke="#9aa7b2" stroke-width="1.2">
    <path d="M 240 230 L 624 230"/>
    <path d="M 240 226 L 240 234"/><path d="M 288 226 L 288 234"/><path d="M 336 226 L 336 234"/>
    <path d="M 384 226 L 384 234"/><path d="M 432 226 L 432 234"/><path d="M 480 226 L 480 234"/>
    <path d="M 528 226 L 528 234"/><path d="M 576 226 L 576 234"/><path d="M 624 226 L 624 234"/>
  </g>
  <g fill="#42525e">
    <circle cx="240" cy="230" r="5"/><circle cx="288" cy="230" r="5"/>
    <circle cx="336" cy="230" r="5"/><circle cx="384" cy="230" r="5"/>
  </g>
  <g fill="#4169E1">
    <circle cx="432" cy="230" r="5.5"/><circle cx="480" cy="230" r="5.5"/>
    <circle cx="528" cy="230" r="5.5"/><circle cx="576" cy="230" r="6.5"/>
  </g>
  <g fill="#5c6b76" font-size="10" text-anchor="middle">
    <text x="240" y="248">2A</text><text x="288" y="248">2B</text><text x="336" y="248">2C</text><text x="384" y="248">2D</text>
  </g>
  <g fill="#9aa7b2" font-size="10" text-anchor="middle">
    <text x="432" y="248">2A</text><text x="480" y="248">2B</text><text x="528" y="248">2C</text>
  </g>
  <text x="576" y="248" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">2D at 7</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="240" y="266">0</text><text x="288" y="266">1</text><text x="336" y="266">2</text>
    <text x="384" y="266">3</text><text x="432" y="266">4</text><text x="480" y="266">5</text>
    <text x="528" y="266">6</text><text x="576" y="266">7</text><text x="624" y="266">8</text>
  </g>
  <path d="M 624 122 L 624 254" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <text x="624" y="116" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">idle from 8</text>
  <text x="340" y="292" text-anchor="middle" fill="#1a2026" font-size="13">Server 2 (patience 1) resends at 0, 1, 2, 3 — every multiple before the first reply at 4 —</text>
  <text x="340" y="312" text-anchor="middle" fill="#1a2026" font-size="13">so its last reply lands at <tspan fill="#4169E1" font-weight="600">3 + 4 = 7</tspan> and the network idles from <tspan fill="#4169E1" font-weight="600">7 + 1 = 8</tspan>.</text>
</svg>
