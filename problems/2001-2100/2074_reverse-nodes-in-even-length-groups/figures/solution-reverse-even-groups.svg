  <text x="313" y="157" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">reverse in place</text>
  <text x="320" y="250" text-anchor="middle" fill="#1a2026" font-size="13">Groups of length 2 and 4 reverse in place — each old head becomes the tail:</text>
  <text x="320" y="268" text-anchor="middle" fill="#1a2026" font-size="13">5 → [6 → 2] → 3, 1 → [4 → 8 → 3 → 7] → end — result <tspan fill="#4169E1" font-weight="600">[5, 6, 2, 3, 9, 1, 4, 8, 3, 7]</tspan>.</text>
