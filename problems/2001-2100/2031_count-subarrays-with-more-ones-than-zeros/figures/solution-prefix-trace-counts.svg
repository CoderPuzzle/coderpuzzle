<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="260" fill="#ffffff"/>
  <!-- nums = [0,1,1,0,1]; cells 56x36 at x = 170+56j;
       prefix strip P = 0,-1,0,1,0,1 in six 56x36 boxes at x = 114+56m (P[m] under cell m-1);
       counts of strictly smaller earlier prefixes = 0,1,3,1,4 under the cell centers -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">nums = [0,1,1,0,1] — each 1 is +1, each 0 is -1</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="198" y="40">0</text><text x="254" y="40">1</text><text x="310" y="40">2</text><text x="366" y="40">3</text><text x="422" y="40">4</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="170" y="46" width="56" height="36"/><rect x="226" y="46" width="56" height="36"/>
    <rect x="282" y="46" width="56" height="36"/><rect x="338" y="46" width="56" height="36"/>
    <rect x="394" y="46" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="198" y="70">0</text><text x="254" y="70">1</text><text x="310" y="70">1</text>
    <text x="366" y="70">0</text><text x="422" y="70">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="198" y="100">-1</text><text x="254" y="100">+1</text><text x="310" y="100">+1</text>
    <text x="366" y="100">-1</text><text x="422" y="100">+1</text>
  </g>
  <text x="108" y="139" text-anchor="end" fill="#9aa7b2" font-size="11">prefix</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="114" y="116" width="56" height="36" fill="#f0f3f7"/>
    <rect x="170" y="116" width="56" height="36" fill="#ffffff"/>
    <rect x="226" y="116" width="56" height="36" fill="#ffffff"/>
    <rect x="282" y="116" width="56" height="36" fill="#ffffff"/>
    <rect x="338" y="116" width="56" height="36" fill="#ffffff"/>
    <rect x="394" y="116" width="56" height="36" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="142" y="139" fill="#5c6b76">0</text>
    <text x="198" y="139">-1</text><text x="254" y="139">0</text><text x="310" y="139">1</text>
    <text x="366" y="139">0</text><text x="422" y="139">1</text>
  </g>
  <text x="108" y="184" text-anchor="end" fill="#9aa7b2" font-size="11">count</text>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="198" y="184">0</text><text x="254" y="184">1</text><text x="310" y="184">3</text>
    <text x="366" y="184">1</text><text x="422" y="184">4</text>
  </g>
  <text x="456" y="184" fill="#4169E1" font-weight="600" font-size="16">= 9</text>
  <text x="280" y="220" text-anchor="middle" fill="#1a2026" font-size="13">Each count is the number of earlier prefix sums strictly below the new one —</text>
  <text x="280" y="240" text-anchor="middle" fill="#1a2026" font-size="13">here <tspan fill="#4169E1" font-weight="600">0 + 1 + 3 + 1 + 4 = 9</tspan> subarrays with more ones than zeros.</text>
</svg>
