<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- highways = [[0,1,4],[2,1,3],[1,4,11],[3,2,3],[3,4,2]], discounts = 1; columns x = 92+112c (cities 0-4), rows y = 95 (used 0) / 215 (used 1), r = 18; drawn edges: toll-4 (0-1) and toll-11 (1-4) in both modes; cities 2,3 muted (the 1-2-3-4 detour, tolls 3+3+2, never beats 9); under-node numbers are route sums from city 0 -->
  <text x="14" y="60" fill="#5c6b76" font-size="12.5">discounts used = 0</text>
  <text x="14" y="180" fill="#5c6b76" font-size="12.5">discounts used = 1</text>
  <!-- full-cost edge 0-1 (toll 4) -->
  <line x1="110" y1="95" x2="186" y2="95" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="148" y="84" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">4</text>
  <!-- full-cost edge 1-4 (toll 11) over the top -->
  <path d="M 216 83 Q 372 26 528 83" fill="none" stroke="#9aa7b2" stroke-width="1.6" marker-end="url(#arrowgray)"/>
  <text x="372" y="40" text-anchor="middle" fill="#9aa7b2" font-size="12.5">11</text>
  <!-- halved edge 1-4 into the used-1 layer -->
  <line x1="221" y1="101" x2="524" y2="209" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="384" y="140" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">11/2 = 5</text>
  <!-- halved edge 0-1 into the used-1 layer -->
  <line x1="104" y1="108" x2="192" y2="202" stroke="#9aa7b2" stroke-width="1.6" marker-end="url(#arrowgray)"/>
  <text x="140" y="192" text-anchor="middle" fill="#9aa7b2" font-size="12.5">4/2 = 2</text>
  <!-- layer used = 0 -->
  <g stroke-width="1.6" text-anchor="middle">
    <circle cx="92" cy="95" r="18" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <circle cx="204" cy="95" r="18" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
    <circle cx="316" cy="95" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="428" cy="95" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="540" cy="95" r="18" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="92" y="100">0</text><text x="204" y="100">1</text>
    <text x="316" y="100" fill="#9aa7b2">2</text><text x="428" y="100" fill="#9aa7b2">3</text>
    <text x="540" y="100">4</text>
  </g>
  <!-- layer used = 1 -->
  <g stroke-width="1.6" text-anchor="middle">
    <circle cx="92" cy="215" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="204" cy="215" r="18" fill="#ffffff" stroke="#42525e"/>
    <circle cx="316" cy="215" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="428" cy="215" r="18" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="540" cy="215" r="18" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="92" y="220" fill="#9aa7b2">0</text><text x="204" y="220">1</text>
    <text x="316" y="220" fill="#9aa7b2">2</text><text x="428" y="220" fill="#9aa7b2">3</text>
    <text x="540" y="220">4</text>
  </g>
  <!-- route sums -->
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="92" y="129">start, 0</text>
    <text x="204" y="129">4</text>
    <text x="540" y="129">4 + 11 = 15</text>
    <text x="204" y="249">2</text>
  </g>
  <text x="540" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#4169E1">4 + 11/2 = 9</text>
  <text x="310" y="280" text-anchor="middle" fill="#1a2026" font-size="13">Every edge offers a full-cost hop and a halved hop into the next layer;</text>
  <text x="310" y="298" text-anchor="middle" fill="#1a2026" font-size="13">0→1→4 costs 4 + 11/2 = <tspan fill="#4169E1" font-weight="600">9</tspan> with the discount vs 15 without.</text>
</svg>
