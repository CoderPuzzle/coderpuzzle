<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="700" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- after update(1,10), update(2,5), update(1,3): map = {1:3, 2:5};
       max-heap top (10,1) is stale (map[1] = 3) and is popped, (5,2) answers maximum() = 5;
       min-heap top (3,1) is live, its (10,1) is buried garbage. Heap boxes 110x32. -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">after update(1, 10), update(2, 5), update(1, 3) — maximum() runs:</text>
  <text x="113" y="54" text-anchor="middle" fill="#5c6b76" font-size="12">map (ts → price)</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="65" y="70" width="36" height="32"/><rect x="125" y="70" width="36" height="32"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="65" y="112" width="36" height="32"/><rect x="125" y="112" width="36" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="83" y="91" fill="#4169E1">1</text><text x="143" y="91" fill="#4169E1">3</text>
    <text x="83" y="133">2</text><text x="143" y="133">5</text>
  </g>
  <path d="M 103 86 L 121 86" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 103 128 L 121 128" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="113" y="168" text-anchor="middle" fill="#5c6b76" font-size="11">update(1, 3) overwrote 10</text>
  <text x="330" y="54" text-anchor="middle" fill="#5c6b76" font-size="12">max-heap</text>
  <rect x="275" y="70" width="110" height="32" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="275" y="112" width="110" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="275" y="154" width="110" height="32" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600">
    <text x="330" y="91" fill="#9aa7b2">(10, 1)</text>
    <text x="330" y="133" fill="#4169E1">(5, 2)</text>
    <text x="330" y="175">(3, 1)</text>
  </g>
  <path d="M 389 86 L 448 86" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="430" y="74" text-anchor="middle" fill="#5c6b76" font-size="11">stale — popped</text>
  <text x="330" y="210" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">maximum() = 5</text>
  <text x="575" y="54" text-anchor="middle" fill="#5c6b76" font-size="12">min-heap</text>
  <rect x="520" y="70" width="110" height="32" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="520" y="112" width="110" height="32" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="520" y="154" width="110" height="32" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-weight="600">
    <text x="575" y="91">(3, 1)</text>
    <text x="575" y="133">(5, 2)</text>
    <text x="575" y="175" fill="#9aa7b2">(10, 1)</text>
  </g>
  <text x="512" y="170" text-anchor="end" fill="#9aa7b2" font-size="10.5">buried stale</text>
  <text x="575" y="210" text-anchor="middle" fill="#5c6b76" font-size="11.5">top (3, 1) is live</text>
  <text x="350" y="246" text-anchor="middle" fill="#1a2026" font-size="13">maximum() peeks (10, 1); the map says timestamp 1 now costs 3, so the stale</text>
  <text x="350" y="266" text-anchor="middle" fill="#1a2026" font-size="13">entry is popped and (5, 2) answers <tspan fill="#4169E1" font-weight="600">5</tspan>; the min-heap's buried (10, 1) waits its turn.</text>
</svg>
