<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s = "leet", k = 3, letter = "e", repetition = 1; suffix e-counts s[i:] = 2,2,1,0;
       stack columns centered at x = 120 + 150j, boxes 56x32, bottom row top edge y = 204 -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">s = "leet", k = 3, letter = "e", repetition = 1</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="90" y="44" width="56" height="36"/><rect x="146" y="44" width="56" height="36"/>
    <rect x="202" y="44" width="56" height="36"/><rect x="258" y="44" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="118" y="68">l</text><text x="174" y="68">e</text><text x="230" y="68">e</text><text x="286" y="68">t</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="118" y="98">2</text><text x="174" y="98">2</text><text x="230" y="98">1</text><text x="286" y="98">0</text>
  </g>
  <text x="82" y="98" text-anchor="end" fill="#9aa7b2" font-size="11">e's in s[i:]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="120" y="124">i = 0</text><text x="270" y="124">i = 1</text><text x="420" y="124">i = 2</text><text x="570" y="124">i = 3</text>
  </g>
  <!-- per-step stacks; step 1 shows the popped 'l' as a dashed ghost above the stack -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="92" y="204" width="56" height="32"/>
    <rect x="242" y="204" width="56" height="32"/>
    <rect x="392" y="204" width="56" height="32"/><rect x="392" y="172" width="56" height="32"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="542" y="204" width="56" height="32"/><rect x="542" y="172" width="56" height="32"/>
    <rect x="542" y="140" width="56" height="32"/>
  </g>
  <rect x="242" y="140" width="56" height="32" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="120" y="225">l</text>
    <text x="270" y="225">e</text>
    <text x="420" y="225">e</text><text x="420" y="193">e</text>
    <text x="570" y="225" fill="#4169E1">e</text><text x="570" y="193" fill="#4169E1">e</text><text x="570" y="161" fill="#4169E1">t</text>
  </g>
  <text x="270" y="161" text-anchor="middle" font-weight="600" font-size="15" fill="#9aa7b2">l</text>
  <path d="M 270 202 L 270 176" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="278" y="193" fill="#5c6b76" font-size="11">popped</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="120" y="258">push l</text>
    <text x="270" y="258">pop l, push e</text>
    <text x="420" y="258">e not &gt; e — push</text>
    <text x="570" y="258" fill="#4169E1" font-weight="600">stack = "eet"</text>
  </g>
  <text x="340" y="290" text-anchor="middle" fill="#1a2026" font-size="13">Only pop, at i = 1: 'l' &gt; 'e', 3 characters remain for k = 3, and the e-supply</text>
  <text x="340" y="308" text-anchor="middle" fill="#1a2026" font-size="13">after the pop is <tspan fill="#4169E1" font-weight="600">1 + 1 = 2</tspan> ≥ repetition 1 — the stack <tspan fill="#4169E1" font-weight="600">eet</tspan> is the answer.</text>
</svg>
