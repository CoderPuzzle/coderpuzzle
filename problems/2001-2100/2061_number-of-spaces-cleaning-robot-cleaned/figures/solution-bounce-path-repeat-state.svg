    <path d="M 253 231 L 315 231" marker-end="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#4169E1" stroke-width="1.5">
    <rect x="259" y="292" width="136" height="22" rx="11"/>
  </g>
  <text x="327" y="307" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">stop: seen (2,2,down)</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="392" y="60" width="16" height="16"/><rect x="392" y="86" width="16" height="16"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="2">
    <line x1="396" y1="90" x2="404" y2="98"/><line x1="404" y1="90" x2="396" y2="98"/>
  </g>
  <line x1="392" y1="122" x2="410" y2="122" stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <g fill="#5c6b76" font-size="12">
    <text x="416" y="73">cleaned; numbered by first visit</text>
    <text x="416" y="99">object</text>
    <text x="416" y="126">second pass (retrace)</text>
  </g>
  <text x="392" y="160" fill="#1a2026" font-size="12.5" font-weight="600">Stop rule &#8212; repeat of (row, col, dir)</text>
  <g fill="#5c6b76" font-size="12.5">
    <text x="392" y="184">(2,0) up: object at (1,0) &#8594; right</text>
    <text x="392" y="208">(2,2) right: wall ahead &#8594; down</text>
    <text x="392" y="232">(2,2, down) again &#8594; <tspan fill="#4169E1" font-weight="600">stop</tspan></text>
    <text x="392" y="256">cleaned spaces: <tspan fill="#4169E1" font-weight="600">7</tspan></text>
  </g>
  <text x="40" y="336" fill="#1a2026" font-size="13">The robot sweeps the top row, right column, and bottom row, turning clockwise</text>
  <text x="40" y="354" fill="#1a2026" font-size="13">at walls and the (1,0) object; when state (2,2, down) repeats it stops &#8212; <tspan fill="#4169E1" font-weight="600">7</tspan> cleaned.</text>
</svg>
