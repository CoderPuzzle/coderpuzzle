  </g>
  <g fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="151" y="124">1</text><text x="227" y="124">2</text><text x="303" y="124">3</text>
    <text x="303" y="200">4</text><text x="303" y="276">5</text><text x="227" y="276">6</text>
    <text x="151" y="276">7</text>
  </g>
  <polygon points="163,89 163,101 175,95" fill="#4169E1"/>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 177 95 L 245 95" marker-end="url(#arrow)"/>
    <path d="M 253 95 L 321 95" marker-end="url(#arrow)"/>
    <path d="M 323 95 A 4 4 0 0 1 327 99"/>
    <path d="M 327 103 L 327 165" marker-end="url(#arrow)"/>
    <path d="M 327 177 L 327 237" marker-end="url(#arrow)"/>
    <path d="M 327 239 A 8 8 0 0 1 319 247"/>
    <path d="M 319 247 L 257 247" marker-end="url(#arrow)"/>
    <path d="M 245 247 L 177 247" marker-end="url(#arrow)"/>
