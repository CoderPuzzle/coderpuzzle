    <path d="M 319 231 A 8 8 0 0 1 327 239" stroke-dasharray="0" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none" stroke-dasharray="5 4" opacity="0.85">
