      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- room = [[0,0,0],[1,1,0],[0,0,0]]; cells 70x70 at x = 140+76c, y = 60+76r;
       cleaned order: (0,0)1 (0,1)2 (0,2)3 (1,2)4 (2,2)5 (2,1)6 (2,0)7;
       first pass solid at row centers, retrace dashed at y=231; repeat state (2,2,down) -->
  <text x="251" y="38" text-anchor="middle" fill="#5c6b76" font-size="13">room = [[0,0,0],[1,1,0],[0,0,0]]</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="140" y="60" width="70" height="70"/><rect x="216" y="60" width="70" height="70"/>
    <rect x="292" y="60" width="70" height="70"/><rect x="292" y="136" width="70" height="70"/>
    <rect x="140" y="212" width="70" height="70"/><rect x="216" y="212" width="70" height="70"/>
    <rect x="292" y="212" width="70" height="70"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#f0f3f7">
    <rect x="140" y="136" width="70" height="70"/><rect x="216" y="136" width="70" height="70"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="3">
