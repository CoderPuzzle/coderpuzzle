<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- encodedText = "iveo    eed   l te   olc" (len 24), rows = 4, cols = 6; cells 44x40 at (40,64);
       corner number d = start column = col - row; '·' = space; shaded cells (col < row) are never read -->
  <text x="172" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">matrix = encodedText row-wise · rows = 4, cols = 6</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="62" y="56">c=0</text><text x="106" y="56">c=1</text><text x="150" y="56">c=2</text>
    <text x="194" y="56">c=3</text><text x="238" y="56">c=4</text><text x="282" y="56">c=5</text>
    <text x="30" y="89">r=0</text><text x="30" y="129">r=1</text><text x="30" y="169">r=2</text><text x="30" y="209">r=3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2">
    <g fill="#ffffff">
      <rect x="40" y="64" width="44" height="40"/><rect x="84" y="64" width="44" height="40"/><rect x="128" y="64" width="44" height="40"/>
      <rect x="172" y="64" width="44" height="40"/><rect x="216" y="64" width="44" height="40"/><rect x="260" y="64" width="44" height="40"/>
      <rect x="84" y="104" width="44" height="40"/><rect x="128" y="104" width="44" height="40"/>
      <rect x="172" y="104" width="44" height="40"/><rect x="216" y="104" width="44" height="40"/><rect x="260" y="104" width="44" height="40"/>
      <rect x="128" y="144" width="44" height="40"/><rect x="172" y="144" width="44" height="40"/>
      <rect x="216" y="144" width="44" height="40"/><rect x="260" y="144" width="44" height="40"/>
      <rect x="172" y="184" width="44" height="40"/><rect x="216" y="184" width="44" height="40"/><rect x="260" y="184" width="44" height="40"/>
    </g>
    <g fill="#f0f3f7">
      <rect x="40" y="104" width="44" height="40"/>
      <rect x="40" y="144" width="44" height="40"/><rect x="84" y="144" width="44" height="40"/>
      <rect x="40" y="184" width="44" height="40"/><rect x="84" y="184" width="44" height="40"/><rect x="128" y="184" width="44" height="40"/>
    </g>
  </g>
  <g fill="#4169E1" font-size="10">
    <text x="45" y="77">0</text><text x="89" y="77">1</text><text x="133" y="77">2</text>
    <text x="177" y="77">3</text><text x="221" y="77">4</text><text x="265" y="77">5</text>
    <text x="89" y="117">0</text><text x="133" y="117">1</text><text x="177" y="117">2</text>
    <text x="221" y="117">3</text><text x="265" y="117">4</text>
    <text x="133" y="157">0</text><text x="177" y="157">1</text><text x="221" y="157">2</text><text x="265" y="157">3</text>
    <text x="177" y="197">0</text><text x="221" y="197">1</text><text x="265" y="197">2</text>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="62" y="89">i</text><text x="106" y="89">v</text><text x="150" y="89">e</text><text x="194" y="89">o</text>
    <text x="238" y="88" fill="#9aa7b2" font-size="10">·</text><text x="282" y="88" fill="#9aa7b2" font-size="10">·</text>
    <text x="150" y="129">e</text><text x="194" y="129">e</text><text x="238" y="129">d</text>
    <text x="106" y="128" fill="#9aa7b2" font-size="10">·</text><text x="282" y="128" fill="#9aa7b2" font-size="10">·</text>
    <text x="150" y="169">l</text><text x="238" y="169">t</text><text x="282" y="169">e</text>
    <text x="194" y="168" fill="#9aa7b2" font-size="10">·</text>
    <text x="194" y="209">o</text><text x="238" y="209">l</text><text x="282" y="209">c</text>
  </g>
  <path d="M 308 144 H 332" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="58" fill="#5c6b76" font-size="12">diagonal reads (start column → text)</text>
  <g fill="#1a2026" font-size="12.5">
    <text x="340" y="84">start 0 → <tspan fill="#4169E1" font-weight="600">"i lo"</tspan></text>
    <text x="340" y="112">start 1 → <tspan fill="#4169E1" font-weight="600">"ve l"</tspan></text>
    <text x="340" y="140">start 2 → <tspan fill="#4169E1" font-weight="600">"eetc"</tspan></text>
    <text x="340" y="168">start 3 → <tspan fill="#4169E1" font-weight="600">"ode"</tspan></text>
    <text x="340" y="196">starts 4, 5 → spaces, trimmed</text>
  </g>
  <text x="172" y="240" text-anchor="middle" fill="#5c6b76" font-size="11.5">· = space · shaded cells (col &lt; row) are never read</text>
  <text x="320" y="264" text-anchor="middle" fill="#1a2026" font-size="13">24 / 4 rows = 6 columns; the diagonals read "i lo", "ve l", "eetc", "ode",</text>
  <text x="320" y="282" text-anchor="middle" fill="#1a2026" font-size="13">joined and right-trimmed → <tspan fill="#4169E1" font-weight="600">"i love leetcode"</tspan>.</text>
</svg>
