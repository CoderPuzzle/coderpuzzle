<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s = "7+3*1*2": operands 7, 3, 1, 2; dp[i][j] = values span i..j can make;
       cells 74x40 at x = 56+74j, y = 84+42i; full span dp[0][3] = {13, 20} -->
  <text x="204" y="52" text-anchor="middle" fill="#5c6b76" font-size="12.5">achievable values per operand span</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="93" y="76">0</text><text x="167" y="76">1</text><text x="241" y="76">2</text><text x="315" y="76">3</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="48" y="108">0</text><text x="48" y="150">1</text><text x="48" y="192">2</text><text x="48" y="234">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="56" y="84" width="74" height="40" fill="#f0f3f7"/>
    <rect x="130" y="84" width="74" height="40" fill="#ffffff"/><rect x="204" y="84" width="74" height="40" fill="#ffffff"/><rect x="278" y="84" width="74" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <rect x="130" y="126" width="74" height="40" fill="#f0f3f7"/>
    <rect x="204" y="126" width="74" height="40" fill="#ffffff"/><rect x="278" y="126" width="74" height="40" fill="#ffffff"/>
    <rect x="204" y="168" width="74" height="40" fill="#f0f3f7"/>
    <rect x="278" y="168" width="74" height="40" fill="#ffffff"/>
    <rect x="278" y="210" width="74" height="40" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" fill="#42525e" font-size="13" font-weight="600">
    <text x="93" y="109">{7}</text><text x="167" y="151">{3}</text><text x="241" y="193">{1}</text><text x="315" y="235">{2}</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">
    <text x="167" y="102">{10}</text><text x="241" y="102">{10}</text>
    <text x="241" y="144">{3}</text><text x="315" y="144">{6}</text>
    <text x="315" y="186">{2}</text>
  </g>
  <text x="315" y="109" text-anchor="middle" fill="#4169E1" font-size="14" font-weight="700">{13, 20}</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="8.5">
    <text x="167" y="118">7+3</text><text x="241" y="118">7+3*1</text>
    <text x="241" y="160">3*1</text><text x="315" y="160">3*1*2</text>
    <text x="315" y="202">1*2</text>
  </g>
  <path d="M 356 104 H 392" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- splits of the full span -->
  <text x="402" y="88" fill="#1a2026" font-size="13.5" font-weight="600">splits of the full span</text>
  <g font-size="13">
    <text x="402" y="118" fill="#1a2026">at '+': {7} + {6} = <tspan fill="#4169E1" font-weight="700">13</tspan> <tspan fill="#5c6b76">→ 5 pts</tspan></text>
    <text x="402" y="146" fill="#1a2026">at '*': {10} × {2} = <tspan fill="#4169E1" font-weight="700">20</tspan> <tspan fill="#5c6b76">→ 2 pts</tspan></text>
    <text x="402" y="174" fill="#5c6b76">42 arises from no split → 0 pts</text>
  </g>
  <text x="402" y="208" fill="#5c6b76" font-size="12.5">correct value: 13 (precedence)</text>
  <text x="320" y="286" text-anchor="middle" fill="#1a2026" font-size="13">Every way of parenthesizing 7+3*1*2 yields 13 or 20 and nothing else, so</text>
  <text x="320" y="304" text-anchor="middle" fill="#1a2026" font-size="13">answers 20, 13, 42 score 2 + 5 + 0 and the total is <tspan fill="#4169E1" font-weight="600">7</tspan>.</text>
</svg>
