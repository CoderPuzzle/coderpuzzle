<text x="48" y="174" text-anchor="start" fill="#1a2026" font-size="22" font-weight="650" font-family="SFMono-Regular, Menlo, monospace">13</text>
<line x1="48.0" y1="181" x2="74.4" y2="181" stroke="#c0392b" stroke-width="3"/>
<text x="270" y="172" text-anchor="start" fill="#5c6b76" font-size="15" font-weight="500" font-family="IBM Plex Sans, system-ui, sans-serif">final addition</text>
</svg>
