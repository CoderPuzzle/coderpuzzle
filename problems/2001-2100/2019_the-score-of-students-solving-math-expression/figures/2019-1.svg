<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 196" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="42" text-anchor="start" fill="#1a2026" font-size="22" font-weight="650" font-family="SFMono-Regular, Menlo, monospace">7 + 3 * 1 * 2</text>
<text x="270" y="40" text-anchor="start" fill="#5c6b76" font-size="15" font-weight="500" font-family="IBM Plex Sans, system-ui, sans-serif">original expression</text>
<text x="48" y="86" text-anchor="start" fill="#1a2026" font-size="22" font-weight="650" font-family="SFMono-Regular, Menlo, monospace">7 + 3 * 2</text>
<line x1="100.8" y1="93" x2="114.0" y2="93" stroke="#c0392b" stroke-width="3"/>
<text x="270" y="84" text-anchor="start" fill="#5c6b76" font-size="15" font-weight="500" font-family="IBM Plex Sans, system-ui, sans-serif">first multiplication</text>
<text x="48" y="130" text-anchor="start" fill="#1a2026" font-size="22" font-weight="650" font-family="SFMono-Regular, Menlo, monospace">7 + 6</text>
