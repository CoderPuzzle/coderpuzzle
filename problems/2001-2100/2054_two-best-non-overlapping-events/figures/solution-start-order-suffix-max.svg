<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- events sorted by start: #0 [1,3] v2, #2 [2,4] v3, #1 [4,5] v2; suffix max 3,3,2;
       strips share one time scale t = 0..6, origin cx-60, 20px per unit; cards w150 at x 70,260,450 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="70" y="46" width="150" height="64"/>
    <rect x="260" y="46" width="150" height="64"/>
    <rect x="450" y="46" width="150" height="64"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="145" y="66">#0 &#183; start 1, end 3</text>
    <text x="335" y="66">#2 &#183; start 2, end 4</text>
    <text x="525" y="66">#1 &#183; start 4, end 5</text>
  </g>
  <g stroke="#dbe4fb" stroke-width="4" stroke-linecap="round">
    <line x1="85" y1="84" x2="205" y2="84"/>
    <line x1="275" y1="84" x2="395" y2="84"/>
    <line x1="465" y1="84" x2="585" y2="84"/>
  </g>
  <g stroke="#4169E1" stroke-width="4" stroke-linecap="round">
    <line x1="105" y1="84" x2="145" y2="84"/>
    <line x1="315" y1="84" x2="355" y2="84"/>
    <line x1="545" y1="84" x2="565" y2="84"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">
    <text x="145" y="104">v = 2</text>
    <text x="335" y="104">v = 3</text>
    <text x="525" y="104">v = 2</text>
  </g>
  <!-- binary search from #0: first start strictly greater than end 3 -->
  <path d="M 150 46 Q 335 -20 515 46" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="34" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">first start &gt; 3 &#8594; event #1 (suf 2)</text>
  <!-- suffix maxima over values [2, 3, 2] -->
  <text x="36" y="146" text-anchor="middle" fill="#5c6b76" font-size="12.5">suf</text>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="145" y="146" fill="#1a2026">3</text>
    <text x="335" y="146" fill="#1a2026">3</text>
    <text x="525" y="146" fill="#4169E1">2</text>
  </g>
  <!-- per-event best candidate -->
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="145" y="184">2 + 2 = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
    <text x="335" y="184">no start &gt; 4 &#8594; 3</text>
    <text x="525" y="184">nothing later &#8594; 2</text>
  </g>
  <text x="40" y="224" fill="#1a2026" font-size="13">Sorted by start, event #0 (end 3) binary-searches to the first start &gt; 3 &#8212;</text>
  <text x="40" y="242" fill="#1a2026" font-size="13">event #1 at start 4, suffix max 2 &#8212; for 2 + 2 = <tspan fill="#4169E1" font-weight="600">4</tspan>, the best pair.</text>
</svg>
