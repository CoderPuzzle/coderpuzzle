<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- 6x3 grid, cells 56x44 at (152,70); perimeter indices 0-13 in travel order (east, north, west, south);
       blue badges = cumulative steps 2, 4, 6, 7, 11 after each step() call; final stop (1,2) = index 11 -->
  <text x="236" y="44" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">final stop: (1,2) — arrives facing West</text>
  <path d="M 236 50 V 66" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.3">
    <g fill="#ffffff">
      <rect x="152" y="70" width="56" height="44"/><rect x="208" y="70" width="56" height="44" fill="#dbe4fb"/>
      <rect x="264" y="70" width="56" height="44"/><rect x="320" y="70" width="56" height="44"/>
      <rect x="376" y="70" width="56" height="44"/><rect x="432" y="70" width="56" height="44"/>
      <rect x="152" y="114" width="56" height="44"/>
      <rect x="432" y="114" width="56" height="44"/>
      <rect x="152" y="158" width="56" height="44"/><rect x="208" y="158" width="56" height="44"/>
      <rect x="264" y="158" width="56" height="44"/><rect x="320" y="158" width="56" height="44"/>
      <rect x="376" y="158" width="56" height="44"/><rect x="432" y="158" width="56" height="44"/>
    </g>
    <g fill="#f0f3f7">
      <rect x="208" y="114" width="56" height="44"/><rect x="264" y="114" width="56" height="44"/>
      <rect x="320" y="114" width="56" height="44"/><rect x="376" y="114" width="56" height="44"/>
    </g>
  </g>
  <g fill="#9aa7b2" font-size="10.5">
    <text x="159" y="85">12</text><text x="215" y="85">11</text><text x="271" y="85">10</text>
    <text x="327" y="85">9</text><text x="383" y="85">8</text><text x="439" y="85">7</text>
    <text x="159" y="129">13</text><text x="439" y="129">6</text>
    <text x="159" y="173">0</text><text x="215" y="173">1</text><text x="271" y="173">2</text>
    <text x="327" y="173">3</text><text x="383" y="173">4</text><text x="439" y="173">5</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="180" y="96">(0,2)</text><text x="236" y="96">(1,2)</text><text x="292" y="96">(2,2)</text>
    <text x="348" y="96">(3,2)</text><text x="404" y="96">(4,2)</text><text x="460" y="96">(5,2)</text>
    <text x="180" y="140">(0,1)</text><text x="460" y="140">(5,1)</text>
    <text x="180" y="184">(0,0)</text><text x="236" y="184">(1,0)</text><text x="292" y="184">(2,0)</text>
    <text x="348" y="184">(3,0)</text><text x="404" y="184">(4,0)</text><text x="460" y="184">(5,0)</text>
  </g>
  <g>
    <circle cx="310" cy="193" r="9" fill="#4169E1"/><text x="310" y="196.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">2</text>
    <circle cx="422" cy="193" r="9" fill="#4169E1"/><text x="422" y="196.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">4</text>
    <circle cx="478" cy="149" r="9" fill="#4169E1"/><text x="478" y="152.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">6</text>
    <circle cx="478" cy="105" r="9" fill="#4169E1"/><text x="478" y="108.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">7</text>
    <circle cx="254" cy="105" r="9" fill="#4169E1"/><text x="254" y="108.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">11</text>
  </g>
  <text x="320" y="228" text-anchor="middle" fill="#5c6b76" font-size="12">corner = perimeter index (0–13) · blue badge = cumulative steps after each step() call</text>
  <text x="320" y="256" text-anchor="middle" fill="#1a2026" font-size="13">2 + 2 + 2 + 1 + 4 = 11 steps; <tspan fill="#4169E1" font-weight="600">11 mod 14 = index 11</tspan> → cell (1,2), arriving West.</text>
  <text x="320" y="274" text-anchor="middle" fill="#1a2026" font-size="13">Index 0 is dual: never moved faces East, finished whole laps faces <tspan fill="#4169E1" font-weight="600">South</tspan>.</text>
</svg>
