<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- parents = [-1,2,0,2,0], n = 5. Tree: 0 root, children 2 and 4; 2's children 1 and 3.
       Scores from removing each node: 0: 3x1=3, 1: 4, 2: 1x1x2=2, 3: 4, 4: 4. Nodes 1,3,4 tie at max 4.
       Circles r=22: 0(320,62) 2(200,155) 4(440,155) 1(140,245) 3(260,245) -->
  <text x="320" y="24" text-anchor="middle" fill="#5c6b76" font-size="12.5">parents = [-1,2,0,2,0], n = 5</text>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="303" y1="75" x2="217" y2="142"/>
    <line x1="337" y1="75" x2="423" y2="142"/>
    <line x1="188" y1="169" x2="152" y2="227"/>
    <line x1="212" y1="169" x2="248" y2="227"/>
  </g>
  <!-- nodes -->
  <g stroke-width="1.6">
    <circle cx="320" cy="62" r="22" fill="#ffffff" stroke="#42525e"/>
    <circle cx="200" cy="155" r="22" fill="#ffffff" stroke="#42525e"/>
    <circle cx="440" cy="155" r="22" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="140" cy="245" r="22" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="260" cy="245" r="22" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="320" y="67" fill="#1a2026">0</text>
    <text x="200" y="160" fill="#1a2026">2</text>
    <text x="440" y="160" fill="#4169E1">4</text>
    <text x="140" y="250" fill="#4169E1">1</text>
    <text x="260" y="250" fill="#4169E1">3</text>
  </g>
  <!-- per-node split product and subtree size -->
  <text x="352" y="66" fill="#5c6b76" font-size="12.5">3 × 1 <tspan fill="#1a2026" font-weight="600">= 3</tspan></text>
  <text x="352" y="82" fill="#5c6b76" font-size="11">size 5</text>
  <text x="168" y="148" text-anchor="end" fill="#5c6b76" font-size="12.5">1 × 1 × 2 <tspan fill="#1a2026" font-weight="600">= 2</tspan></text>
  <text x="168" y="164" text-anchor="end" fill="#5c6b76" font-size="11">size 3</text>
  <text x="472" y="148" fill="#4169E1" font-weight="600" font-size="12.5">4</text>
  <text x="472" y="164" fill="#5c6b76" font-size="11">size 1</text>
  <text x="172" y="242" fill="#4169E1" font-weight="600" font-size="12.5">4</text>
  <text x="172" y="258" fill="#5c6b76" font-size="11">size 1</text>
  <text x="292" y="242" fill="#4169E1" font-weight="600" font-size="12.5">4</text>
  <text x="292" y="258" fill="#5c6b76" font-size="11">size 1</text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Removing each node multiplies its split sizes: scores 3, 4, 2, 4, 4.</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">The maximum <tspan fill="#4169E1" font-weight="600">4</tspan> occurs at nodes 1, 3, and 4, so the answer is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
