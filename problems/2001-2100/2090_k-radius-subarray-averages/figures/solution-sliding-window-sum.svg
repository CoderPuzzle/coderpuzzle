  <text x="320" y="314" text-anchor="middle" fill="#1a2026" font-size="13">Each element enters and leaves the running sum exactly once;</text>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">avgs = [-1, -1, -1, <tspan fill="#4169E1" font-weight="600">5</tspan>, <tspan fill="#4169E1" font-weight="600">4</tspan>, <tspan fill="#4169E1" font-weight="600">4</tspan>, -1, -1, -1]</text>
