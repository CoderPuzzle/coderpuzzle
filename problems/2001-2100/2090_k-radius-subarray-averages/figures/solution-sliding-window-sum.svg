  <text x="313" y="134" text-anchor="middle" fill="#5c6b76" font-size="12.5">slide: drop 7, add 2 → sum 32 → <tspan fill="#4169E1" font-weight="600">avg[4] = 32 / 7 = 4</tspan></text>
