<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [5,1,2,3,null,6,4], start 3, dest 6; nodes: 5 (320,60), 1 (200,140), 2 (440,140), 3 (140,220), 6 (380,220), 4 (500,220), r = 17; path 3-1-5-2-6 spelled U, U, R, L -->
  <!-- non-path edge -->
  <line x1="450" y1="154" x2="490" y2="206" stroke="#42525e" stroke-width="1.5"/>
  <!-- path edges with travel arrows -->
  <g stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrow)">
    <line x1="150" y1="206" x2="188" y2="154"/>
    <line x1="214" y1="131" x2="306" y2="69"/>
    <line x1="334" y1="69" x2="426" y2="131"/>
    <line x1="428" y1="154" x2="392" y2="206"/>
  </g>
  <g font-size="14" font-weight="600" fill="#4169E1" text-anchor="middle">
    <text x="149" y="183">U</text>
    <text x="243" y="92">U</text>
    <text x="394" y="92">R</text>
    <text x="383" y="190">L</text>
  </g>
  <!-- nodes -->
  <circle cx="320" cy="60" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="320" y="65" text-anchor="middle" font-weight="600">5</text>
  <circle cx="200" cy="140" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="200" y="145" text-anchor="middle" font-weight="600">1</text>
  <circle cx="440" cy="140" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="440" y="145" text-anchor="middle" font-weight="600">2</text>
  <circle cx="140" cy="220" r="17" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
  <text x="140" y="225" text-anchor="middle" font-weight="700">3</text>
  <circle cx="380" cy="220" r="17" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
  <text x="380" y="225" text-anchor="middle" font-weight="700">6</text>
  <circle cx="500" cy="220" r="17" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="500" y="225" text-anchor="middle" font-weight="600" fill="#9aa7b2">4</text>
  <text x="320" y="30" text-anchor="middle" fill="#5c6b76" font-size="12">LCA</text>
  <text x="140" y="254" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">start</text>
  <text x="380" y="254" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">dest</text>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">Up-walks from 3 and 6 meet at LCA 5: the start side gives <tspan fill="#4169E1" font-weight="600">UU</tspan>;</text>
  <text x="320" y="302" text-anchor="middle" fill="#1a2026" font-size="13">the dest side collects L, R and reverses them into RL — <tspan fill="#4169E1" font-weight="600">UURL</tspan>.</text>
</svg>
