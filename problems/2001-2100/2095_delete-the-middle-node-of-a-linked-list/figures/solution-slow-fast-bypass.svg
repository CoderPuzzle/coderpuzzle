<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 252" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="610" height="252" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="mgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="mmute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- head = [1,3,4,7,1,2,6]; boxes 58x44 at x = 14+74i, y = 84, links at y = 106; slow ends on index 2 (value 4), fast ends on index 6 (value 6), middle index 3 (value 7) gets bypassed -->
  <!-- list links; the two around the middle node are dead -->
  <g stroke="#42525e" stroke-width="1.5" marker-end="url(#mgray)">
    <line x1="72" y1="106" x2="86" y2="106"/>
    <line x1="146" y1="106" x2="160" y2="106"/>
    <line x1="220" y1="106" x2="234" y2="106"/>
    <line x1="442" y1="106" x2="456" y2="106"/>
    <line x1="516" y1="106" x2="530" y2="106"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#mmute)">
    <line x1="294" y1="106" x2="308" y2="106"/>
    <line x1="368" y1="106" x2="382" y2="106"/>
  </g>
  <!-- bypass link slow.next.next -->
  <path d="M 265 84 Q 339 22 413 84" fill="none" stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="339" y="40" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">slow.next = slow.next.next</text>
  <!-- nodes -->
  <g stroke="#9aa7b2" stroke-width="1.5" fill="#f0f3f7">
    <rect x="14" y="84" width="58" height="44"/>
    <rect x="310" y="84" width="58" height="44"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="88" y="84" width="58" height="44"/>
    <rect x="162" y="84" width="58" height="44"/>
    <rect x="236" y="84" width="58" height="44"/>
    <rect x="384" y="84" width="58" height="44"/>
    <rect x="458" y="84" width="58" height="44"/>
    <rect x="532" y="84" width="58" height="44"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="117" y="112">1</text><text x="191" y="112">3</text><text x="265" y="112">4</text>
    <text x="413" y="112">1</text><text x="487" y="112">2</text><text x="561" y="112">6</text>
  </g>
  <text x="43" y="110" text-anchor="middle" font-size="12" fill="#5c6b76">dummy</text>
  <text x="339" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#9aa7b2">7</text>
  <line x1="330" y1="106" x2="348" y2="106" stroke="#9aa7b2" stroke-width="1.5"/>
  <!-- pointers after three rounds -->
  <line x1="265" y1="164" x2="265" y2="138" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="182" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">slow</text>
  <line x1="561" y1="52" x2="561" y2="78" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="561" y="46" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">fast</text>
  <text x="305" y="214" text-anchor="middle" fill="#1a2026" font-size="13">slow moves 1 per round, fast moves 2; after 3 rounds slow sits on 4, just before 7</text>
  <text x="305" y="234" text-anchor="middle" fill="#1a2026" font-size="13">the bypass points 4 at 1 and unlinks 7: <tspan fill="#4169E1" font-weight="600">[1,3,4,1,2,6]</tspan>.</text>
</svg>
