<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="348" fill="#ffffff"/>
  <!-- parents = [-1,0,1,1]; queries [[0,2],[3,2],[2,5]]; tree circles r=15, trie circles r=14 at levels y=130/200/270 -->
  <!-- tree -->
  <text x="95" y="32" text-anchor="middle" fill="#5c6b76" font-size="11.5">parents = [-1, 0, 1, 1]</text>
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="95" y1="85" x2="95" y2="125"/>
    <line x1="86" y1="152" x2="62" y2="196"/><line x1="104" y1="152" x2="128" y2="196"/>
  </g>
  <circle cx="95" cy="70" r="15" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="95" cy="140" r="15" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="55" cy="210" r="15" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <circle cx="135" cy="210" r="15" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="95" y="75" fill="#1a2026">0</text><text x="95" y="145" fill="#1a2026">1</text>
    <text x="55" y="215" fill="#1a2026">2</text><text x="135" y="215" fill="#9aa7b2">3</text>
  </g>
  <text x="20" y="258" fill="#4169E1" font-size="12" font-weight="600">now at node 2: query (2, 5)</text>
  <text x="20" y="278" fill="#5c6b76" font-size="11.5">(0, 2) → 2 and (3, 2) → 3 answered earlier</text>
  <!-- binary trie of path values {0, 1, 2} = 000, 001, 010 -->
  <text x="470" y="32" text-anchor="middle" fill="#5c6b76" font-size="11.5">binary trie of path values — 3 of 18 bits shown</text>
  <g text-anchor="end" fill="#5c6b76" font-size="11.5">
    <text x="330" y="134">bit 2</text><text x="330" y="204">bit 1</text><text x="330" y="274">bit 0</text>
  </g>
  <circle cx="480" cy="58" r="7" fill="#9aa7b2"/>
  <text x="464" y="62" text-anchor="end" fill="#5c6b76" font-size="10.5">root</text>
  <g stroke="#42525e" stroke-width="1.3" fill="none">
    <line x1="480" y1="65" x2="480" y2="114"/>
    <line x1="470" y1="141" x2="449" y2="189"/><line x1="490" y1="141" x2="511" y2="189"/>
    <line x1="430" y1="211" x2="419" y2="257"/><line x1="450" y1="211" x2="461" y2="257"/>
    <line x1="517" y1="212" x2="528" y2="257"/>
  </g>
  <!-- greedy descent for val = 101: taken trie bits 0, 1, 0 build p = 010 = 2; result 5 ^ 2 = 7 -->
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <line x1="480" y1="65" x2="480" y2="114"/>
    <line x1="490" y1="141" x2="511" y2="189"/>
    <line x1="517" y1="212" x2="528" y2="257"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <circle cx="480" cy="130" r="14"/>
    <circle cx="440" cy="200" r="14"/><circle cx="520" cy="200" r="14" stroke="#4169E1" stroke-width="1.8"/>
    <circle cx="410" cy="270" r="14"/><circle cx="470" cy="270" r="14"/>
  </g>
  <circle cx="530" cy="270" r="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="480" y="134">0</text>
    <text x="440" y="204">0</text><text x="520" y="204">1</text>
    <text x="410" y="274">0</text><text x="470" y="274">1</text><text x="530" y="274">0</text>
  </g>
  <g fill="#5c6b76" font-size="11">
    <text x="470" y="95" text-anchor="end">0</text>
    <text x="450" y="163" text-anchor="end">0</text><text x="492" y="163" text-anchor="end">1</text>
    <text x="416" y="234" text-anchor="end">0</text><text x="448" y="240" text-anchor="end">1</text>
    <text x="517" y="240" text-anchor="end">0</text>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="410" y="298" fill="#5c6b76">val 0</text><text x="470" y="298" fill="#5c6b76">val 1</text>
    <text x="530" y="298" fill="#4169E1" font-weight="600">p = 010 = 2</text>
  </g>
  <!-- caption -->
  <text x="340" y="322" text-anchor="middle" fill="#1a2026" font-size="13">At node 2 the trie holds exactly the path values {0, 1, 2}; preferring the</text>
  <text x="340" y="340" text-anchor="middle" fill="#1a2026" font-size="13">complement bit builds p = 010 and gains 4 + 2 + 1: 5 ⊕ 2 = <tspan fill="#4169E1" font-weight="600">7</tspan>.</text>
</svg>
