<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
  <rect width="560" height="210" fill="#ffffff"/>
  <!-- m = 1, n = 2: the six colorings, arranged 3 x 2 -->
  <!-- row 1: r g | g r | b r -->
  <rect x="148" y="44" width="31" height="31" rx="2" fill="#cf5044"/>
  <rect x="181" y="44" width="31" height="31" rx="2" fill="#4f9d69"/>
  <rect x="248" y="44" width="31" height="31" rx="2" fill="#4f9d69"/>
  <rect x="281" y="44" width="31" height="31" rx="2" fill="#cf5044"/>
  <rect x="348" y="44" width="31" height="31" rx="2" fill="#4169E1"/>
  <rect x="381" y="44" width="31" height="31" rx="2" fill="#cf5044"/>
  <!-- row 2: r b | g b | b g -->
  <rect x="148" y="132" width="31" height="31" rx="2" fill="#cf5044"/>
  <rect x="181" y="132" width="31" height="31" rx="2" fill="#4169E1"/>
  <rect x="248" y="132" width="31" height="31" rx="2" fill="#4f9d69"/>
  <rect x="281" y="132" width="31" height="31" rx="2" fill="#4169E1"/>
  <rect x="348" y="132" width="31" height="31" rx="2" fill="#4169E1"/>
  <rect x="381" y="132" width="31" height="31" rx="2" fill="#4f9d69"/>
</svg>
