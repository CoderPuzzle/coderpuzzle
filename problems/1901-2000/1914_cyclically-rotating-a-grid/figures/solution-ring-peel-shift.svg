<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 408" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="408" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 2: grid 4x4 = 1..16, k = 2. Outer-ring walk (CCW from top-left):
       [1,5,9,13,14,15,16,12,8,4,3,2], shifted right by k % L = 2.
       Grid cells 40x40; input grid at (60,50), final grid at (476,50);
       walk row y = 244, shifted row y = 304, cell x = 76 + 44j -->
  <text x="140" y="38" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid, k = 2</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="50" width="40" height="40" fill="#dbe4fb"/><rect x="100" y="50" width="40" height="40" fill="#dbe4fb"/><rect x="140" y="50" width="40" height="40" fill="#dbe4fb"/><rect x="180" y="50" width="40" height="40" fill="#dbe4fb"/>
    <rect x="60" y="90" width="40" height="40" fill="#dbe4fb"/><rect x="100" y="90" width="40" height="40" fill="#f0f3f7"/><rect x="140" y="90" width="40" height="40" fill="#f0f3f7"/><rect x="180" y="90" width="40" height="40" fill="#dbe4fb"/>
    <rect x="60" y="130" width="40" height="40" fill="#dbe4fb"/><rect x="100" y="130" width="40" height="40" fill="#f0f3f7"/><rect x="140" y="130" width="40" height="40" fill="#f0f3f7"/><rect x="180" y="130" width="40" height="40" fill="#dbe4fb"/>
    <rect x="60" y="170" width="40" height="40" fill="#dbe4fb"/><rect x="100" y="170" width="40" height="40" fill="#dbe4fb"/><rect x="140" y="170" width="40" height="40" fill="#dbe4fb"/><rect x="180" y="170" width="40" height="40" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="80" y="75">1</text><text x="120" y="75">2</text><text x="160" y="75">3</text><text x="200" y="75">4</text>
    <text x="80" y="115">5</text><text x="120" y="115" fill="#9aa7b2">6</text><text x="160" y="115" fill="#9aa7b2">7</text><text x="200" y="115">8</text>
    <text x="80" y="155">9</text><text x="120" y="155" fill="#9aa7b2">10</text><text x="160" y="155" fill="#9aa7b2">11</text><text x="200" y="155">12</text>
    <text x="80" y="195">13</text><text x="120" y="195">14</text><text x="160" y="195">15</text><text x="200" y="195">16</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="476" y="50" width="40" height="40"/><rect x="516" y="50" width="40" height="40"/><rect x="556" y="50" width="40" height="40"/><rect x="596" y="50" width="40" height="40"/>
    <rect x="476" y="90" width="40" height="40"/><rect x="516" y="90" width="40" height="40"/><rect x="556" y="90" width="40" height="40"/><rect x="596" y="90" width="40" height="40"/>
    <rect x="476" y="130" width="40" height="40"/><rect x="516" y="130" width="40" height="40"/><rect x="556" y="130" width="40" height="40"/><rect x="596" y="130" width="40" height="40"/>
    <rect x="476" y="170" width="40" height="40"/><rect x="516" y="170" width="40" height="40"/><rect x="556" y="170" width="40" height="40"/><rect x="596" y="170" width="40" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="496" y="75">3</text><text x="536" y="75">4</text><text x="576" y="75">8</text><text x="616" y="75">12</text>
    <text x="496" y="115">2</text><text x="536" y="115">11</text><text x="576" y="115">10</text><text x="616" y="115">16</text>
    <text x="496" y="155">1</text><text x="536" y="155">7</text><text x="576" y="155">6</text><text x="616" y="155">15</text>
    <text x="496" y="195">5</text><text x="536" y="195">9</text><text x="576" y="195">13</text><text x="616" y="195">14</text>
  </g>
  <line x1="268" y1="115" x2="452" y2="115" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="360" y="104" text-anchor="middle" fill="#5c6b76" font-size="12">rotate every ring,</text>
  <text x="360" y="136" text-anchor="middle" fill="#5c6b76" font-size="12">k % L positions each</text>
  <text x="556" y="228" text-anchor="middle" fill="#5c6b76" font-size="11.5">written back around the ring</text>
  <!-- peel the outer ring -->
  <text x="332" y="238" text-anchor="middle" fill="#5c6b76" font-size="12.5">peel the outer ring counter-clockwise</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="76" y="248" width="44" height="36"/><rect x="120" y="248" width="44" height="36"/><rect x="164" y="248" width="44" height="36"/><rect x="208" y="248" width="44" height="36"/><rect x="252" y="248" width="44" height="36"/><rect x="296" y="248" width="44" height="36"/><rect x="340" y="248" width="44" height="36"/><rect x="384" y="248" width="44" height="36"/><rect x="428" y="248" width="44" height="36"/><rect x="472" y="248" width="44" height="36"/><rect x="516" y="248" width="44" height="36"/><rect x="560" y="248" width="44" height="36"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="98" y="271">1</text><text x="142" y="271">5</text><text x="186" y="271">9</text><text x="230" y="271">13</text><text x="274" y="271">14</text><text x="318" y="271">15</text><text x="362" y="271">16</text><text x="406" y="271">12</text><text x="450" y="271">8</text><text x="494" y="271">4</text><text x="538" y="271">3</text><text x="582" y="271">2</text>
  </g>
  <text x="66" y="271" text-anchor="end" fill="#5c6b76" font-size="11.5">walk</text>
  <!-- right-shift by 2 -->
  <path d="M 98 290 C 130 290 154 304 182 306" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <path d="M 450 290 C 482 290 506 304 534 306" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="332" y="303" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">cyclic right-shift by k % L = 2</text>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
    <rect x="76" y="310" width="44" height="36"/><rect x="120" y="310" width="44" height="36"/><rect x="164" y="310" width="44" height="36"/><rect x="208" y="310" width="44" height="36"/><rect x="252" y="310" width="44" height="36"/><rect x="296" y="310" width="44" height="36"/><rect x="340" y="310" width="44" height="36"/><rect x="384" y="310" width="44" height="36"/><rect x="428" y="310" width="44" height="36"/><rect x="472" y="310" width="44" height="36"/><rect x="516" y="310" width="44" height="36"/><rect x="560" y="310" width="44" height="36"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="98" y="333">3</text><text x="142" y="333">2</text><text x="186" y="333">1</text><text x="230" y="333">5</text><text x="274" y="333">9</text><text x="318" y="333">13</text><text x="362" y="333">14</text><text x="406" y="333">15</text><text x="450" y="333">16</text><text x="494" y="333">12</text><text x="538" y="333">8</text><text x="582" y="333">4</text>
  </g>
  <text x="332" y="372" text-anchor="middle" fill="#1a2026" font-size="13">Shift the peel right by k % L = 2, write it back — one modulo, no simulated steps;</text>
  <text x="332" y="392" text-anchor="middle" fill="#1a2026" font-size="13">the inner ring [6,10,11,7] shifts the same way to [11,7,6,10], giving the grid at top right.</text>
</svg>
