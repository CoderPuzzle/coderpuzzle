<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="300" fill="#ffffff"/>
  <!-- tree: / -> a, c; a -> b; c -> d; all folders are unique -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="266" y1="58" x2="202" y2="118"/>
    <line x1="294" y1="58" x2="358" y2="118"/>
    <line x1="190" y1="162" x2="190" y2="218"/>
    <line x1="370" y1="162" x2="370" y2="218"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="280" cy="40" r="22"/>
    <circle cx="190" cy="140" r="22"/>
    <circle cx="370" cy="140" r="22"/>
    <circle cx="190" cy="240" r="22"/>
    <circle cx="370" cy="240" r="22"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="280" y="46">/</text>
    <text x="190" y="146">a</text>
    <text x="370" y="146">c</text>
    <text x="190" y="246">b</text>
    <text x="370" y="246">d</text>
  </g>
</svg>
