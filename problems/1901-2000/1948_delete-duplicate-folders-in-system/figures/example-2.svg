<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="430" fill="#ffffff"/>
  <!-- tree: / -> a, c, w; a -> b -> x -> y; c -> b; w -> y -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="268" y1="54" x2="152" y2="100"/>
    <line x1="280" y1="62" x2="280" y2="100"/>
    <line x1="292" y1="54" x2="418" y2="100"/>
    <line x1="140" y1="142" x2="140" y2="188"/>
    <line x1="140" y1="232" x2="140" y2="268"/>
    <line x1="140" y1="312" x2="140" y2="368"/>
    <line x1="280" y1="142" x2="280" y2="188"/>
    <line x1="430" y1="142" x2="430" y2="188"/>
  </g>
  <!-- deletion ovals around the identical x and w subtrees (both contain y) -->
  <g fill="none" stroke="#c05046" stroke-width="2" stroke-dasharray="6 4">
    <ellipse cx="140" cy="340" rx="52" ry="78"/>
    <ellipse cx="430" cy="152" rx="52" ry="78"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="280" cy="40" r="22"/>
    <circle cx="140" cy="120" r="22"/>
    <circle cx="280" cy="120" r="22"/>
    <circle cx="430" cy="120" r="22"/>
    <circle cx="140" cy="210" r="22"/>
    <circle cx="140" cy="290" r="22"/>
    <circle cx="280" cy="210" r="22"/>
    <circle cx="430" cy="210" r="22"/>
    <circle cx="140" cy="390" r="22"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="280" y="46">/</text>
    <text x="140" y="126">a</text>
    <text x="280" y="126">c</text>
    <text x="430" y="126">w</text>
    <text x="140" y="216">b</text>
    <text x="140" y="296">x</text>
    <text x="280" y="216">b</text>
    <text x="430" y="216">y</text>
    <text x="140" y="396">y</text>
  </g>
</svg>
