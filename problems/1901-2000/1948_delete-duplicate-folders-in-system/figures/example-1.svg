<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="300" fill="#ffffff"/>
  <!-- tree: / -> a, c, d; a -> b; c -> b; d -> a -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="272" y1="58" x2="158" y2="118"/>
    <line x1="280" y1="62" x2="280" y2="118"/>
    <line x1="288" y1="58" x2="402" y2="118"/>
    <line x1="150" y1="162" x2="150" y2="218"/>
    <line x1="280" y1="162" x2="280" y2="218"/>
    <line x1="410" y1="162" x2="410" y2="218"/>
  </g>
  <!-- deletion ovals around the identical /a and /c subtrees -->
  <g fill="none" stroke="#c05046" stroke-width="2" stroke-dasharray="6 4">
    <ellipse cx="150" cy="190" rx="52" ry="86"/>
    <ellipse cx="280" cy="190" rx="52" ry="86"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="280" cy="40" r="22"/>
    <circle cx="150" cy="140" r="22"/>
    <circle cx="280" cy="140" r="22"/>
    <circle cx="410" cy="140" r="22"/>
    <circle cx="150" cy="240" r="22"/>
    <circle cx="280" cy="240" r="22"/>
    <circle cx="410" cy="240" r="22"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="280" y="46">/</text>
    <text x="150" y="146">a</text>
    <text x="280" y="146">c</text>
    <text x="410" y="146">d</text>
    <text x="150" y="246">b</text>
    <text x="280" y="246">b</text>
    <text x="410" y="246">a</text>
  </g>
</svg>
