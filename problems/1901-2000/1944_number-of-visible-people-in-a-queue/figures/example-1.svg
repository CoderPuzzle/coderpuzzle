<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
  <rect width="560" height="300" fill="#ffffff"/>
  <!-- heights = [10,6,8,5,11,9]; baseline y = 250, 1 unit = 16px -->
  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <g fill="#1a2026">
    <rect x="88" y="90" width="44" height="160" rx="3"/>
    <rect x="156" y="154" width="44" height="96" rx="3"/>
    <rect x="224" y="122" width="44" height="128" rx="3"/>
    <rect x="292" y="170" width="44" height="80" rx="3"/>
    <rect x="360" y="74" width="44" height="176" rx="3"/>
    <rect x="428" y="106" width="44" height="144" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="110" y="82">10</text><text x="178" y="146">6</text><text x="246" y="114">8</text>
    <text x="314" y="162">5</text><text x="382" y="66">11</text><text x="450" y="98">9</text>
  </g>
  <!-- baseline and vertical scale -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="60" y1="250" x2="500" y2="250" marker-end="url(#axis)"/>
    <line x1="60" y1="250" x2="60" y2="62" marker-end="url(#axis)"/>
  </g>
  <g stroke="#1a2026" stroke-width="1.2">
    <line x1="56" y1="250" x2="60" y2="250"/><line x1="56" y1="234" x2="60" y2="234"/>
    <line x1="56" y1="218" x2="60" y2="218"/><line x1="56" y1="202" x2="60" y2="202"/>
    <line x1="56" y1="186" x2="60" y2="186"/><line x1="56" y1="170" x2="60" y2="170"/>
    <line x1="56" y1="154" x2="60" y2="154"/><line x1="56" y1="138" x2="60" y2="138"/>
    <line x1="56" y1="122" x2="60" y2="122"/><line x1="56" y1="106" x2="60" y2="106"/>
    <line x1="56" y1="90" x2="60" y2="90"/><line x1="56" y1="74" x2="60" y2="74"/>
  </g>
  <g fill="#5c6b76" text-anchor="end" font-size="11">
    <text x="50" y="254">0</text><text x="50" y="222">2</text><text x="50" y="190">4</text>
    <text x="50" y="158">6</text><text x="50" y="126">8</text><text x="50" y="94">10</text>
  </g>
  <g fill="#5c6b76" text-anchor="middle">
    <text x="110" y="272">0</text><text x="178" y="272">1</text><text x="246" y="272">2</text>
    <text x="314" y="272">3</text><text x="382" y="272">4</text><text x="450" y="272">5</text>
  </g>
</svg>
