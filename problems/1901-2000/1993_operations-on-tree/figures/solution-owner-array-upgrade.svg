<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="352" fill="#ffffff"/>
  <!-- parent = [-1,0,0,1,1,2,2]; tree on the left, badges = owner[] after all six ops;
       upgrade(0,1) locks 0 for user 1 and clears descendant 4 (was user 5) -->
  <text x="150" y="30" text-anchor="middle" fill="#5c6b76" font-size="11.5">badges = owner[] after all six ops</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="150" y1="80" x2="90" y2="170"/>
    <line x1="150" y1="80" x2="215" y2="170"/>
    <line x1="90" y1="170" x2="45" y2="260"/>
    <line x1="90" y1="170" x2="115" y2="260"/>
    <line x1="215" y1="170" x2="200" y2="260"/>
    <line x1="215" y1="170" x2="270" y2="260"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="90" cy="170" r="20"/><circle cx="215" cy="170" r="20"/>
    <circle cx="45" cy="260" r="20"/><circle cx="200" cy="260" r="20"/><circle cx="270" cy="260" r="20"/>
  </g>
  <circle cx="150" cy="80" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.2"/>
  <circle cx="115" cy="260" r="20" fill="#ffffff" stroke="#4169E1" stroke-width="2.2"/>
  <g text-anchor="middle" font-weight="600">
    <text x="150" y="85">0</text><text x="90" y="175">1</text><text x="215" y="175">2</text>
    <text x="45" y="265">3</text><text x="115" y="265">4</text><text x="200" y="265">5</text><text x="270" y="265">6</text>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="150" y="116" fill="#4169E1" font-weight="600">1</text>
    <text x="90" y="206" fill="#9aa7b2">&#8722;1</text>
    <text x="215" y="206" fill="#9aa7b2">&#8722;1</text>
    <text x="45" y="296" fill="#9aa7b2">&#8722;1</text>
    <text x="115" y="296" fill="#4169E1" font-weight="600">5 &#8594; &#8722;1</text>
    <text x="200" y="296" fill="#9aa7b2">&#8722;1</text>
    <text x="270" y="296" fill="#9aa7b2">&#8722;1</text>
  </g>
  <!-- op sequence -->
  <g font-size="12.5" text-anchor="start">
    <text x="330" y="60">lock(2, 2) &#8594; <tspan fill="#4169E1" font-weight="600">true</tspan></text>
    <text x="330" y="86">unlock(2, 3) &#8594; false</text>
    <text x="330" y="112">unlock(2, 2) &#8594; <tspan fill="#4169E1" font-weight="600">true</tspan></text>
    <text x="330" y="138">lock(4, 5) &#8594; <tspan fill="#4169E1" font-weight="600">true</tspan></text>
    <text x="330" y="170" font-weight="600">upgrade(0, 1) &#8594; <tspan fill="#4169E1">true</tspan></text>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="start">
    <text x="330" y="192">0 unlocked, no locked ancestor above it;</text>
    <text x="330" y="210">stack walk hits locked descendant 4 (user 5)</text>
  </g>
  <text x="330" y="232" font-size="12.5" text-anchor="start">&#8594; owner[0] = <tspan fill="#4169E1" font-weight="600">1</tspan>, owner[4] = <tspan fill="#4169E1" font-weight="600">&#8722;1</tspan></text>
  <text x="330" y="264" font-size="12.5" text-anchor="start">lock(0, 1) &#8594; false <tspan fill="#5c6b76" font-size="12">(0 is already locked)</tspan></text>
  <text x="340" y="316" text-anchor="middle" fill="#1a2026" font-size="13">upgrade is the only multi-hop op: check the ancestor chain, scan descendants,</text>
  <text x="340" y="334" text-anchor="middle" fill="#1a2026" font-size="13">lock 0 for user 1 and clear 4 &#8212; output [null, true, false, true, true, true, false].</text>
</svg>
