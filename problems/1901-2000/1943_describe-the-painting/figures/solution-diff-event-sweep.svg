<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="376" fill="#ffffff"/>
  <!-- segments = [[1,4,5],[4,7,7],[1,7,9]]; x(c) = 110 + 60c puts keys 1, 4, 7 at x 170, 350, 530; diff events +5 +9 at 1, +7 -5 at 4, -7 -9 at 7; output bar spans y 296-320 -->
  <text x="160" y="67" text-anchor="end" fill="#5c6b76" font-size="12">[1,4) color 5</text>
  <rect x="170" y="52" width="180" height="22" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <text x="260" y="68" text-anchor="middle" font-weight="600" fill="#1a2026">5</text>
  <text x="160" y="99" text-anchor="end" fill="#5c6b76" font-size="12">[4,7) color 7</text>
  <rect x="350" y="84" width="180" height="22" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <text x="440" y="100" text-anchor="middle" font-weight="600" fill="#1a2026">7</text>
  <text x="160" y="131" text-anchor="end" fill="#5c6b76" font-size="12">[1,7) color 9</text>
  <rect x="170" y="116" width="360" height="22" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <text x="350" y="132" text-anchor="middle" font-weight="600" fill="#1a2026">9</text>
  <!-- number line -->
  <line x1="110" y1="176" x2="560" y2="176" stroke="#42525e" stroke-width="1.5"/>
  <line x1="170" y1="171" x2="170" y2="181" stroke="#42525e" stroke-width="1.5"/>
  <line x1="350" y1="171" x2="350" y2="181" stroke="#42525e" stroke-width="1.5"/>
  <line x1="530" y1="171" x2="530" y2="181" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="170" y="198">1</text><text x="350" y="198">4</text><text x="530" y="198">7</text>
  </g>
  <!-- per-segment events, then the collapsed diff-map entry and running sum -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="170" y="222">+5 +9</text><text x="350" y="222">+7 −5</text><text x="530" y="222">−7 −9</text>
  </g>
  <text x="130" y="248" text-anchor="end" fill="#5c6b76" font-size="12.5">diff</text>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="14">
    <text x="170" y="248">+14</text><text x="350" y="248">+2</text><text x="530" y="248">−16</text>
  </g>
  <text x="130" y="276" text-anchor="end" fill="#5c6b76" font-size="12.5">running</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="170" y="276" fill="#4169E1">14</text><text x="350" y="276" fill="#4169E1">16</text><text x="530" y="276" fill="#9aa7b2">0</text>
  </g>
  <!-- output pieces over the unpainted base strip -->
  <rect x="110" y="296" width="450" height="24" fill="#f0f3f7"/>
  <rect x="170" y="296" width="180" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="260" y="313" text-anchor="middle" font-weight="600" fill="#4169E1">14</text>
  <rect x="350" y="296" width="180" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="440" y="313" text-anchor="middle" font-weight="600" fill="#4169E1">16</text>
  <text x="320" y="346" text-anchor="middle" fill="#1a2026" font-size="13">Each start adds its color and each end removes it: +14 at 1, +2 at 4 (+7 −5), −16 at 7.</text>
  <text x="320" y="366" text-anchor="middle" fill="#1a2026" font-size="13">The running sum <tspan fill="#4169E1" font-weight="600">14 → 16 → 0</tspan> emits exactly [<tspan fill="#4169E1" font-weight="600">1,4,14</tspan>] and [<tspan fill="#4169E1" font-weight="600">4,7,16</tspan>].</text>
</svg>
