<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
  <rect width="560" height="210" fill="#ffffff"/>
  <!-- input segments [1,4,5], [4,7,7], [1,7,9]; 1 unit = 40px, x(v) = 60 + 40(v-1) -->
  <g fill="#4169E1">
    <rect x="60" y="28" width="120" height="26" rx="3"/>
    <rect x="180" y="62" width="120" height="26" rx="3"/>
    <rect x="60" y="96" width="240" height="26" rx="3"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-weight="600" font-size="13">
    <text x="120" y="46">5</text>
    <text x="240" y="80">7</text>
    <text x="180" y="114">9</text>
  </g>
  <!-- number line 1..7 -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="60" y1="158" x2="308" y2="158"/>
    <line x1="60" y1="158" x2="60" y2="163"/><line x1="100" y1="158" x2="100" y2="163"/>
    <line x1="140" y1="158" x2="140" y2="163"/><line x1="180" y1="158" x2="180" y2="163"/>
    <line x1="220" y1="158" x2="220" y2="163"/><line x1="260" y1="158" x2="260" y2="163"/>
    <line x1="300" y1="158" x2="300" y2="163"/>
  </g>
  <g fill="#5c6b76" text-anchor="middle">
    <text x="60" y="180">1</text><text x="100" y="180">2</text><text x="140" y="180">3</text>
    <text x="180" y="180">4</text><text x="220" y="180">5</text><text x="260" y="180">6</text>
    <text x="300" y="180">7</text>
  </g>
</svg>
