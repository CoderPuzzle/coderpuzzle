<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- roads = [[0,6,7],[0,1,2],[1,2,3],[1,3,3],[6,3,3],[3,5,1],[6,5,1],[2,5,1],[0,4,5],[4,6,2]];
       node boxes 56x40; badge = "d<dist> w<ways>" after Dijkstra finalizes:
       dist = [0,2,5,5,5,6,7], ways = [1,1,1,1,1,2,4];
       accent edges satisfy dist[u]+t = dist[v]; edge 6-3 (muted) has 5+3 &gt; 7 -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="90" y1="110" x2="590" y2="110"/>
    <line x1="90" y1="110" x2="300" y2="50"/>
    <line x1="90" y1="110" x2="170" y2="240"/>
    <line x1="170" y1="240" x2="255" y2="330"/>
    <line x1="170" y1="240" x2="330" y2="255"/>
    <line x1="330" y1="255" x2="470" y2="290"/>
    <line x1="590" y1="110" x2="470" y2="290"/>
    <line x1="300" y1="50" x2="590" y2="110"/>
  </g>
  <line x1="590" y1="110" x2="330" y2="255" stroke="#9aa7b2" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="340" y="102">7</text>
    <text x="195" y="70">5</text>
    <text x="114" y="168">2</text>
    <text x="196" y="284">3</text>
    <text x="250" y="238">3</text>
    <text x="400" y="264">1</text>
    <text x="546" y="196">1</text>
    <text x="445" y="70">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="452" y="170">3</text>
    <text x="492" y="192" font-size="10.5">(5+3 &gt; 7)</text>
  </g>
  <!-- node boxes: id bold, badge below -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="62" y="90" width="56" height="40"/><rect x="272" y="30" width="56" height="40"/>
    <rect x="142" y="220" width="56" height="40"/><rect x="302" y="235" width="56" height="40"/>
    <rect x="442" y="270" width="56" height="40"/><rect x="227" y="310" width="56" height="40"/>
  </g>
  <rect x="562" y="90" width="56" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.4"/>
  <g text-anchor="middle">
    <text x="90" y="107" font-weight="600">0</text><text x="90" y="123" fill="#5c6b76" font-size="10.5">d0 w1</text>
    <text x="300" y="47" font-weight="600">4</text><text x="300" y="63" fill="#5c6b76" font-size="10.5">d5 w1</text>
    <text x="170" y="237" font-weight="600">1</text><text x="170" y="253" fill="#5c6b76" font-size="10.5">d2 w1</text>
    <text x="330" y="252" font-weight="600">3</text><text x="330" y="268" fill="#5c6b76" font-size="10.5">d5 w1</text>
    <text x="470" y="287" font-weight="600">5</text><text x="470" y="303" fill="#5c6b76" font-size="10.5">d6 w2</text>
    <text x="255" y="327" font-weight="600">2</text><text x="255" y="343" fill="#5c6b76" font-size="10.5">d5 w1</text>
    <text x="590" y="107" font-weight="600">6</text><text x="590" y="123" fill="#4169E1" font-size="10.5" font-weight="600">d7 w4</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="672" y="26">into node 6:</text>
    <text x="672" y="44">from 0: +1, from 4: +1,</text>
    <text x="672" y="62">from 5: +2</text>
  </g>
  <text x="320" y="366" text-anchor="middle" fill="#1a2026" font-size="13">ways[v] adds ways[u] on every edge with dist[u] + t = dist[v]; node 6 settles</text>
  <text x="320" y="386" text-anchor="middle" fill="#1a2026" font-size="13">at dist 7 with ways[6] = 1 + 1 + 2 = <tspan fill="#4169E1" font-weight="600">4</tspan> shortest routes from node 0.</text>
</svg>
