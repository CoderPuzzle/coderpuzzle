<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="348" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- sums sorted = [-3,-2,-1,0,0,1,2,3]; each round: diff = max - second max,
       pairs (s, s+diff) via arcs, kept half is the one containing 0 (accent cells);
       rounds peel +1, +2, -3 leaving [0] -->
  <!-- round 1: diff = 1, left = [-3,-1,0,2] kept -->
  <text x="20" y="68" font-weight="600" font-size="13">round 1</text>
  <text x="20" y="86" fill="#4169E1" font-size="12">diff = 3&#8722;2 = 1</text>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 172 48 Q 184 34 196 48" marker-end="url(#arrow)"/>
    <path d="M 264 48 Q 276 34 288 48" marker-end="url(#arrow)"/>
    <path d="M 356 48 Q 368 34 380 48" marker-end="url(#arrow)"/>
    <path d="M 448 48 Q 460 34 472 48" marker-end="url(#arrow)"/>
  </g>
  <g stroke-width="1.4">
    <rect x="150" y="52" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="196" y="52" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="242" y="52" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="288" y="52" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="334" y="52" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="380" y="52" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="426" y="52" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="472" y="52" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="172" y="75" fill="#4169E1" font-weight="600">&#8722;3</text>
    <text x="218" y="75" fill="#9aa7b2">&#8722;2</text>
    <text x="264" y="75" fill="#4169E1" font-weight="600">&#8722;1</text>
    <text x="310" y="75" fill="#4169E1" font-weight="600">0</text>
    <text x="356" y="75" fill="#9aa7b2">0</text>
    <text x="402" y="75" fill="#9aa7b2">1</text>
    <text x="448" y="75" fill="#4169E1" font-weight="600">2</text>
    <text x="494" y="75" fill="#9aa7b2">3</text>
  </g>
  <text x="536" y="66" fill="#5c6b76" font-size="12">0 in left &#8594;</text>
  <text x="536" y="84" fill="#4169E1" font-size="12.5" font-weight="600">peel +1, keep left</text>
  <path d="M 273 92 Q 230 118 184 138" fill="none" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <!-- round 2: diff = 2, left = [-3,0] kept -->
  <text x="20" y="158" font-weight="600" font-size="13">round 2</text>
  <text x="20" y="176" fill="#4169E1" font-size="12">diff = 2&#8722;0 = 2</text>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 172 138 Q 184 124 196 138" marker-end="url(#arrow)"/>
    <path d="M 264 138 Q 276 124 288 138" marker-end="url(#arrow)"/>
  </g>
  <g stroke-width="1.4">
    <rect x="150" y="142" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="196" y="142" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="242" y="142" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="288" y="142" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="172" y="165" fill="#4169E1" font-weight="600">&#8722;3</text>
    <text x="218" y="165" fill="#9aa7b2">&#8722;1</text>
    <text x="264" y="165" fill="#4169E1" font-weight="600">0</text>
    <text x="310" y="165" fill="#9aa7b2">2</text>
  </g>
  <text x="348" y="156" fill="#5c6b76" font-size="12">0 in left &#8594;</text>
  <text x="348" y="174" fill="#4169E1" font-size="12.5" font-weight="600">peel +2, keep left</text>
  <path d="M 218 182 Q 205 202 180 226" fill="none" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <!-- round 3: diff = 3, right = [0] kept -->
  <text x="20" y="248" font-weight="600" font-size="13">round 3</text>
  <text x="20" y="266" fill="#4169E1" font-size="12">diff = 0&#8722;(&#8722;3) = 3</text>
  <path d="M 172 228 Q 184 214 196 228" fill="none" stroke="#42525e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="150" y="232" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <rect x="196" y="232" width="44" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="172" y="255" text-anchor="middle" fill="#9aa7b2" font-size="13">&#8722;3</text>
  <text x="218" y="255" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">0</text>
  <text x="256" y="246" fill="#5c6b76" font-size="12">0 in right &#8594;</text>
  <text x="256" y="264" fill="#4169E1" font-size="12.5" font-weight="600">peel &#8722;3, keep right</text>
  <text x="256" y="284" fill="#5c6b76" font-size="11.5">[0] alone remains: the empty subset, stop.</text>
  <text x="340" y="318" text-anchor="middle" fill="#1a2026" font-size="13">Each round pairs every s with s + diff (arcs) and keeps the half containing 0;</text>
  <text x="340" y="336" text-anchor="middle" fill="#1a2026" font-size="13">peeling +1, +2, then &#8722;3 leaves the empty subset, so ans = [<tspan fill="#4169E1" font-weight="600">1, 2, &#8722;3</tspan>].</text>
</svg>
