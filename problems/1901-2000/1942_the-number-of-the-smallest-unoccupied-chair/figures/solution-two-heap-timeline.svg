<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="392" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- times = [[1,4],[2,3],[4,6]], targetFriend = 1; x = 80 + 70*t, chair-0 lane y=100, chair-1 lane y=150, axis y=200 -->
  <!-- timeline bars -->
  <text x="64" y="117" text-anchor="end" fill="#5c6b76" font-size="12">chair 0</text>
  <text x="64" y="167" text-anchor="end" fill="#5c6b76" font-size="12">chair 1</text>
  <rect x="150" y="100" width="206" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="362" y="100" width="138" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="220" y="150" width="68" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="253" y="117">F0</text><text x="431" y="117">F2</text><text x="254" y="167">F1</text>
  </g>
  <text x="254" y="190" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">friend 1 — target</text>
  <!-- time axis -->
  <line x1="70" y1="200" x2="590" y2="200" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="150" y1="197" x2="150" y2="203"/><line x1="220" y1="197" x2="220" y2="203"/>
    <line x1="290" y1="197" x2="290" y2="203"/><line x1="360" y1="197" x2="360" y2="203"/>
    <line x1="430" y1="197" x2="430" y2="203"/><line x1="500" y1="197" x2="500" y2="203"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="150" y="218">1</text><text x="220" y="218">2</text><text x="290" y="218">3</text>
    <text x="360" y="218">4</text><text x="430" y="218">5</text><text x="500" y="218">6</text>
  </g>
  <!-- answer badge -->
  <path d="M 551 159 L 296 162" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowB)"/>
  <rect x="555" y="140" width="115" height="38" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="612" y="163" text-anchor="middle" fill="#4169E1" font-size="14" font-weight="600">answer = 1</text>
  <!-- heaps at t = 2, right after seating friend 1 -->
  <rect x="70" y="245" width="260" height="86" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <text x="200" y="264" text-anchor="middle" fill="#5c6b76" font-size="12">occupied min-heap at t = 2</text>
  <rect x="88" y="274" width="108" height="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="142" y="289" text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">(3, ch 1)</text>
  <rect x="88" y="300" width="108" height="22" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.3"/>
  <text x="142" y="315" text-anchor="middle" font-size="12.5" fill="#5c6b76">(4, ch 0)</text>
  <text x="206" y="286" fill="#5c6b76" font-size="11">min = earliest</text>
  <text x="206" y="312" fill="#5c6b76" font-size="11">departure first</text>
  <rect x="450" y="245" width="180" height="86" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <text x="540" y="264" text-anchor="middle" fill="#5c6b76" font-size="12">free min-heap at t = 2</text>
  <text x="540" y="292" text-anchor="middle" fill="#9aa7b2" font-size="12.5">empty</text>
  <text x="540" y="312" text-anchor="middle" fill="#5c6b76" font-size="11.5">t = 4: pops give {0, 1},</text>
  <text x="540" y="326" text-anchor="middle" fill="#5c6b76" font-size="11.5">F2 takes chair 0</text>
  <text x="70" y="349" fill="#4169E1" font-size="11.5" font-weight="600">(3, ch 1) pops at the first arrival t ≥ 3 → chair 1 back to free</text>
  <!-- caption -->
  <text x="340" y="366" text-anchor="middle" fill="#1a2026" font-size="13">Before each seating, occupied entries with leaving ≤ now pop into free — friend 1</text>
  <text x="340" y="386" text-anchor="middle" fill="#1a2026" font-size="13">arrives at t = 2 with nothing free and takes new chair <tspan fill="#4169E1" font-weight="600">1</tspan>: the answer.</text>
</svg>
