<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="330" fill="#ffffff"/>
  <!-- non-path edges -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="95" y1="176" x2="192" y2="254"/>
    <line x1="228" y1="268" x2="332" y2="268"/>
    <line x1="368" y1="254" x2="465" y2="176"/>
  </g>
  <!-- chosen path 0 -> 1 -> 2 -> 5 -->
  <g stroke="#4169E1" stroke-width="3">
    <line x1="95" y1="144" x2="192" y2="66"/>
    <line x1="228" y1="52" x2="332" y2="52"/>
    <line x1="368" y1="66" x2="465" y2="144"/>
  </g>
  <!-- edge travel times -->
  <g fill="#1a2026" font-size="12.5" text-anchor="middle">
    <text x="128" y="94">10</text>
    <text x="280" y="42">10</text>
    <text x="433" y="94">10</text>
    <text x="128" y="228">1</text>
    <text x="280" y="292">10</text>
    <text x="433" y="228">15</text>
  </g>
  <!-- nodes: id with passing fee below -->
  <g>
    <circle cx="80" cy="160" r="22" fill="#ffffff" stroke="#4169E1" stroke-width="2.4"/>
    <circle cx="205" cy="52" r="22" fill="#ffffff" stroke="#4169E1" stroke-width="2.4"/>
    <circle cx="355" cy="52" r="22" fill="#ffffff" stroke="#4169E1" stroke-width="2.4"/>
    <circle cx="480" cy="160" r="22" fill="#ffffff" stroke="#4169E1" stroke-width="2.4"/>
    <circle cx="205" cy="268" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <circle cx="355" cy="268" r="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle">
    <text x="80" y="166" fill="#1a2026" font-weight="600">0</text>
    <text x="205" y="58" fill="#1a2026" font-weight="600">1</text>
    <text x="355" y="58" fill="#1a2026" font-weight="600">2</text>
    <text x="480" y="166" fill="#1a2026" font-weight="600">5</text>
    <text x="205" y="274" fill="#1a2026" font-weight="600">3</text>
    <text x="355" y="274" fill="#1a2026" font-weight="600">4</text>
  </g>
  <g fill="#5c6b76" font-size="11" text-anchor="middle">
