<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="230" fill="#ffffff"/>
  <!-- root 0 -->
  <circle cx="280" cy="34" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="280" y="40" text-anchor="middle" font-weight="600" fill="#1a2026">0</text>
  <!-- edges -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="264" y1="49" x2="196" y2="86"/>
    <line x1="296" y1="49" x2="364" y2="86"/>
    <line x1="170" y1="112" x2="140" y2="148"/>
    <line x1="390" y1="112" x2="420" y2="148"/>
  </g>
  <!-- children 1, 2 -->
  <circle cx="183" cy="103" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="183" y="109" text-anchor="middle" font-weight="600" fill="#1a2026">1</text>
  <circle cx="377" cy="103" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="377" y="109" text-anchor="middle" font-weight="600" fill="#1a2026">2</text>
  <!-- grandchildren 3, 4 -->
  <circle cx="133" cy="165" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="133" y="171" text-anchor="middle" font-weight="600" fill="#1a2026">3</text>
  <circle cx="427" cy="165" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="427" y="171" text-anchor="middle" font-weight="600" fill="#1a2026">4</text>
  <text x="280" y="216" text-anchor="middle" fill="#5c6b76" font-size="12.5">build 0 first, then interleave the two 2-room chains {1, 3} and {2, 4}: 6 ways</text>
</svg>
