<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- mat = [[1,2,3],[4,5,6],[7,8,9]], target = 13;
       reachable-sum set folds row by row: {0} -> {1,2,3} -> {5,...,9} -> {12,...,18};
       accented picks 1, 5, 7 give 0 -> 1 -> 6 -> 13 -->
  <text x="660" y="38" text-anchor="end" fill="#1a2026" font-size="13">target = <tspan fill="#4169E1" font-weight="600">13</tspan></text>
  <text x="52" y="37" text-anchor="end" fill="#5c6b76" font-size="12">start</text>
  <rect x="90" y="14" width="70" height="36" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="125" y="38" text-anchor="middle">0</text>
  <!-- row 0 -->
  <text x="82" y="94" text-anchor="end" fill="#5c6b76" font-size="12">mat[0]</text>
  <rect x="90" y="70" width="46" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <rect x="138" y="70" width="46" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="186" y="70" width="46" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="113" y="95" text-anchor="middle" fill="#4169E1" font-weight="600">1</text>
  <text x="161" y="95" text-anchor="middle">2</text>
  <text x="209" y="95" text-anchor="middle">3</text>
  <line x1="236" y1="90" x2="282" y2="90" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="260" y="80" text-anchor="middle" fill="#5c6b76" font-size="10.5">+1 +2 +3</text>
  <rect x="290" y="70" width="230" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="405" y="95" text-anchor="middle">{1, 2, 3}</text>
  <!-- row 1 -->
  <text x="82" y="164" text-anchor="end" fill="#5c6b76" font-size="12">mat[1]</text>
  <rect x="90" y="140" width="46" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="138" y="140" width="46" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <rect x="186" y="140" width="46" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="113" y="165" text-anchor="middle">4</text>
  <text x="161" y="165" text-anchor="middle" fill="#4169E1" font-weight="600">5</text>
  <text x="209" y="165" text-anchor="middle">6</text>
  <line x1="236" y1="160" x2="282" y2="160" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="260" y="150" text-anchor="middle" fill="#5c6b76" font-size="10.5">+4 +5 +6</text>
  <rect x="290" y="140" width="230" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="405" y="165" text-anchor="middle">{5, 6, 7, 8, 9}</text>
  <!-- row 2 -->
  <text x="82" y="234" text-anchor="end" fill="#5c6b76" font-size="12">mat[2]</text>
  <rect x="90" y="210" width="46" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <rect x="138" y="210" width="46" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="186" y="210" width="46" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="113" y="235" text-anchor="middle" fill="#4169E1" font-weight="600">7</text>
  <text x="161" y="235" text-anchor="middle">8</text>
  <text x="209" y="235" text-anchor="middle">9</text>
  <line x1="236" y1="230" x2="282" y2="230" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="260" y="220" text-anchor="middle" fill="#5c6b76" font-size="10.5">+7 +8 +9</text>
  <rect x="290" y="210" width="230" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="405" y="235" text-anchor="middle">{12, <tspan fill="#4169E1" font-weight="600">13</tspan>, 14, ..., 18}</text>
  <!-- pick path 1 -> 5 -> 7 -->
  <line x1="113" y1="112" x2="159" y2="138" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowA)"/>
  <line x1="161" y1="182" x2="115" y2="208" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowA)"/>
  <text x="340" y="282" text-anchor="middle" fill="#1a2026" font-size="13">Each row shifts the whole set by each of its values; picking 1, then 5, then 7</text>
  <text x="340" y="300" text-anchor="middle" fill="#1a2026" font-size="13">walks 0 → 1 → 6 → 13, and 13 in the final set gives |13 − 13| = <tspan fill="#4169E1" font-weight="600">0</tspan>.</text>
</svg>
