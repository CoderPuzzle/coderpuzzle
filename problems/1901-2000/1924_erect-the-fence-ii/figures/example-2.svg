<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="ax2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <rect width="380" height="400" fill="#ffffff"/>
  <!-- axes: 1 unit = 55 px, origin (50, 340) -->
  <g stroke="#9aa7b3" stroke-width="1.2">
    <line x1="50" y1="340" x2="340" y2="340" marker-end="url(#ax2)"/>
    <line x1="50" y1="340" x2="50" y2="58" marker-end="url(#ax2)"/>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="105" y="358">1</text><text x="160" y="358">2</text><text x="215" y="358">3</text><text x="270" y="358">4</text>
    <text x="38" y="291">1</text><text x="38" y="236">2</text>
  </g>
  <!-- fence circle: center (2.5,2) r 1.5 -->
  <circle cx="187.5" cy="230" r="82.5" fill="none" stroke="#1a2026" stroke-width="2"/>
  <line x1="187.5" y1="230" x2="270" y2="230" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="229" y="222" text-anchor="middle" fill="#4169E1" font-size="12.5">r = 1.5</text>
  <circle cx="187.5" cy="230" r="4" fill="#4169E1"/>
  <text x="187.5" y="252" text-anchor="middle" fill="#4169E1" font-size="12.5">(2.5, 2)</text>
  <!-- trees: (1,2) (2,2) (4,2) -->
  <g fill="#3e8e5f" stroke="#2c6b46" stroke-width="1.4">
    <circle cx="105" cy="230" r="7"/>
    <circle cx="160" cy="230" r="7"/>
    <circle cx="270" cy="230" r="7"/>
  </g>
  <text x="190" y="388" text-anchor="middle" fill="#5c6b76" font-size="12.5">center (2.5, 2), radius 1.5 — the trees at (1,2) and (4,2) form a diameter</text>
</svg>
