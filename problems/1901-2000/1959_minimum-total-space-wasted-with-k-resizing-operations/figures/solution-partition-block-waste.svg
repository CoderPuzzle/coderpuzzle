<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- nums = [10,20,15,30,20], k = 2; cells 88x44 at x = 104 + 96i, y = 64; best split [10] [20,15] [30,20]: block maxima 10/20/30 give wastes 0, 40-35=5, 60-50=10, total 15; waste bars 12 px per unit at y = 178 -->
  <text x="96" y="90" text-anchor="end" fill="#5c6b76" font-size="12.5">nums</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="104" y="64" width="88" height="44"/><rect x="200" y="64" width="88" height="44"/>
    <rect x="296" y="64" width="88" height="44"/><rect x="392" y="64" width="88" height="44"/>
    <rect x="488" y="64" width="88" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="148" y="91">10</text><text x="244" y="91">20</text><text x="340" y="91">15</text>
    <text x="436" y="91">30</text><text x="532" y="91">20</text>
  </g>
  <!-- the two resize points -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="196" y="52">resize 1</text><text x="388" y="52">resize 2</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4">
    <line x1="196" y1="58" x2="196" y2="134"/>
    <line x1="388" y1="58" x2="388" y2="134"/>
  </g>
  <!-- block brackets and their serving sizes -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 104 124 L 104 130 M 104 124 L 192 124 L 192 130"/>
    <path d="M 200 124 L 200 130 M 200 124 L 384 124 L 384 130"/>
    <path d="M 392 124 L 392 130 M 392 124 L 576 124 L 576 130"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="148" y="148">size 10 = max(10)</text>
    <text x="292" y="148">size 20 = max(20, 15)</text>
    <text x="484" y="148">size 30 = max(30, 20)</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#5c6b76">
    <text x="148" y="168">waste 0</text>
    <text x="292" y="168">waste 40 − 35 = 5</text>
    <text x="484" y="168">waste 60 − 50 = 10</text>
  </g>
  <!-- waste bars -->
  <rect x="200" y="178" width="60" height="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
  <rect x="392" y="178" width="120" height="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
  <g font-size="12" fill="#1a2026">
    <text x="268" y="189.5">5</text><text x="520" y="189.5">10</text>
  </g>
  <text x="340" y="226" text-anchor="middle" fill="#1a2026" font-size="14">total waste = 0 + 5 + 10 = <tspan fill="#4169E1" font-weight="600">15</tspan></text>
  <text x="320" y="260" text-anchor="middle" fill="#1a2026" font-size="13">With k = 2, dp splits [10,20,15,30,20] into three blocks served by sizes 10, 20, 30,</text>
  <text x="320" y="280" text-anchor="middle" fill="#1a2026" font-size="13">each sized to its maximum, wasting only 0 + 5 + 10 = <tspan fill="#4169E1" font-weight="600">15</tspan> — the best of the 6 splits.</text>
</svg>
