<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">
  <rect width="560" height="170" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- days 0..4 on a 3 x 3 grid; water floods (1,2), (2,1), (3,3), (2,2) in turn -->
  <g font-size="10" fill="#5c6b76" text-anchor="middle">
    <text x="64" y="34">start</text><text x="170" y="34">start</text><text x="276" y="34">start</text>
    <text x="382" y="34">start</text><text x="488" y="34">start</text>
    <text x="64" y="146">end</text><text x="170" y="146">end</text><text x="276" y="146">end</text>
    <text x="382" y="146">end</text><text x="488" y="146">end</text>
  </g>
  <!-- day 0: all land -->
  <g stroke="#1a2026" stroke-width="1">
    <rect x="25" y="46" width="26" height="26" fill="#f2dfae"/><rect x="51" y="46" width="26" height="26" fill="#f2dfae"/><rect x="77" y="46" width="26" height="26" fill="#f2dfae"/>
    <rect x="25" y="72" width="26" height="26" fill="#f2dfae"/><rect x="51" y="72" width="26" height="26" fill="#f2dfae"/><rect x="77" y="72" width="26" height="26" fill="#f2dfae"/>
    <rect x="25" y="98" width="26" height="26" fill="#f2dfae"/><rect x="51" y="98" width="26" height="26" fill="#f2dfae"/><rect x="77" y="98" width="26" height="26" fill="#f2dfae"/>
  </g>
  <!-- day 1: water at (1,2) -->
  <g stroke="#1a2026" stroke-width="1">
    <rect x="131" y="46" width="26" height="26" fill="#f2dfae"/><rect x="157" y="46" width="26" height="26" fill="#4169E1"/><rect x="183" y="46" width="26" height="26" fill="#f2dfae"/>
    <rect x="131" y="72" width="26" height="26" fill="#f2dfae"/><rect x="157" y="72" width="26" height="26" fill="#f2dfae"/><rect x="183" y="72" width="26" height="26" fill="#f2dfae"/>
    <rect x="131" y="98" width="26" height="26" fill="#f2dfae"/><rect x="157" y="98" width="26" height="26" fill="#f2dfae"/><rect x="183" y="98" width="26" height="26" fill="#f2dfae"/>
  </g>
  <!-- day 2: water at (1,2) and (2,1) -->
  <g stroke="#1a2026" stroke-width="1">
    <rect x="237" y="46" width="26" height="26" fill="#f2dfae"/><rect x="263" y="46" width="26" height="26" fill="#4169E1"/><rect x="289" y="46" width="26" height="26" fill="#f2dfae"/>
    <rect x="237" y="72" width="26" height="26" fill="#4169E1"/><rect x="263" y="72" width="26" height="26" fill="#f2dfae"/><rect x="289" y="72" width="26" height="26" fill="#f2dfae"/>
    <rect x="237" y="98" width="26" height="26" fill="#f2dfae"/><rect x="263" y="98" width="26" height="26" fill="#f2dfae"/><rect x="289" y="98" width="26" height="26" fill="#f2dfae"/>
  </g>
  <!-- day 3: water at (1,2), (2,1), (3,3); last day it is possible to cross -->
  <g stroke="#1a2026" stroke-width="1">
    <rect x="343" y="46" width="26" height="26" fill="#f2dfae"/><rect x="369" y="46" width="26" height="26" fill="#4169E1"/><rect x="395" y="46" width="26" height="26" fill="#f2dfae"/>
    <rect x="343" y="72" width="26" height="26" fill="#4169E1"/><rect x="369" y="72" width="26" height="26" fill="#f2dfae"/><rect x="395" y="72" width="26" height="26" fill="#f2dfae"/>
    <rect x="343" y="98" width="26" height="26" fill="#f2dfae"/><rect x="369" y="98" width="26" height="26" fill="#f2dfae"/><rect x="395" y="98" width="26" height="26" fill="#4169E1"/>
  </g>
  <!-- day 4: water also at (2,2); no crossing remains -->
  <g stroke="#1a2026" stroke-width="1">
    <rect x="449" y="46" width="26" height="26" fill="#f2dfae"/><rect x="475" y="46" width="26" height="26" fill="#4169E1"/><rect x="501" y="46" width="26" height="26" fill="#f2dfae"/>
    <rect x="449" y="72" width="26" height="26" fill="#4169E1"/><rect x="475" y="72" width="26" height="26" fill="#4169E1"/><rect x="501" y="72" width="26" height="26" fill="#f2dfae"/>
    <rect x="449" y="98" width="26" height="26" fill="#f2dfae"/><rect x="475" y="98" width="26" height="26" fill="#f2dfae"/><rect x="501" y="98" width="26" height="26" fill="#4169E1"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="600">
    <text x="38" y="63" fill="#1a2026">0</text><text x="64" y="63" fill="#1a2026">0</text><text x="90" y="63" fill="#1a2026">0</text>
    <text x="38" y="89" fill="#1a2026">0</text><text x="64" y="89" fill="#1a2026">0</text><text x="90" y="89" fill="#1a2026">0</text>
    <text x="38" y="115" fill="#1a2026">0</text><text x="64" y="115" fill="#1a2026">0</text><text x="90" y="115" fill="#1a2026">0</text>
    <text x="144" y="63" fill="#1a2026">0</text><text x="170" y="63" fill="#ffffff">1</text><text x="196" y="63" fill="#1a2026">0</text>
    <text x="144" y="89" fill="#1a2026">0</text><text x="170" y="89" fill="#1a2026">0</text><text x="196" y="89" fill="#1a2026">0</text>
    <text x="144" y="115" fill="#1a2026">0</text><text x="170" y="115" fill="#1a2026">0</text><text x="196" y="115" fill="#1a2026">0</text>
    <text x="250" y="63" fill="#1a2026">0</text><text x="276" y="63" fill="#ffffff">1</text><text x="302" y="63" fill="#1a2026">0</text>
    <text x="250" y="89" fill="#ffffff">1</text><text x="276" y="89" fill="#1a2026">0</text><text x="302" y="89" fill="#1a2026">0</text>
    <text x="250" y="115" fill="#1a2026">0</text><text x="276" y="115" fill="#1a2026">0</text><text x="302" y="115" fill="#1a2026">0</text>
    <text x="356" y="63" fill="#1a2026">0</text><text x="382" y="63" fill="#ffffff">1</text><text x="408" y="63" fill="#1a2026">0</text>
    <text x="356" y="89" fill="#ffffff">1</text><text x="382" y="89" fill="#1a2026">0</text><text x="408" y="89" fill="#1a2026">0</text>
    <text x="356" y="115" fill="#1a2026">0</text><text x="382" y="115" fill="#1a2026">0</text><text x="408" y="115" fill="#ffffff">1</text>
    <text x="462" y="63" fill="#1a2026">0</text><text x="488" y="63" fill="#ffffff">1</text><text x="514" y="63" fill="#1a2026">0</text>
    <text x="462" y="89" fill="#ffffff">1</text><text x="488" y="89" fill="#ffffff">1</text><text x="514" y="89" fill="#1a2026">0</text>
    <text x="462" y="115" fill="#1a2026">0</text><text x="488" y="115" fill="#1a2026">0</text><text x="514" y="115" fill="#ffffff">1</text>
  </g>
  <!-- crossing route on day 3: (1,3) -> (2,3) -> (2,2) -> (3,2) -->
  <polyline points="408,59 408,85 382,85 382,111" fill="none" stroke="#c05046" stroke-width="2" stroke-dasharray="5 4"/>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="107" y1="85" x2="125" y2="85"/>
    <line x1="213" y1="85" x2="231" y2="85"/>
    <line x1="319" y1="85" x2="337" y2="85"/>
    <line x1="425" y1="85" x2="443" y2="85"/>
  </g>
</svg>
