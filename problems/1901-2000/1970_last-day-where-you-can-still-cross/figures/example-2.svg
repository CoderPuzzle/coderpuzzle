<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
  <rect width="560" height="170" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- days 0..2; water floods (1,1) then (1,2) -->
  <g font-size="11" fill="#5c6b76" text-anchor="middle">
    <text x="106" y="34">start</text><text x="244" y="34">start</text><text x="382" y="34">start</text>
    <text x="106" y="140">end</text><text x="244" y="140">end</text><text x="382" y="140">end</text>
  </g>
  <!-- day 0: all land -->
  <g stroke="#1a2026" stroke-width="1">
    <rect x="80" y="46" width="26" height="26" fill="#f2dfae"/><rect x="106" y="46" width="26" height="26" fill="#f2dfae"/>
    <rect x="80" y="72" width="26" height="26" fill="#f2dfae"/><rect x="106" y="72" width="26" height="26" fill="#f2dfae"/>
  </g>
  <!-- day 1: water at (1,1); last day it is possible to cross -->
  <g stroke="#1a2026" stroke-width="1">
    <rect x="218" y="46" width="26" height="26" fill="#4169E1"/><rect x="244" y="46" width="26" height="26" fill="#f2dfae"/>
    <rect x="218" y="72" width="26" height="26" fill="#f2dfae"/><rect x="244" y="72" width="26" height="26" fill="#f2dfae"/>
  </g>
  <!-- day 2: water at (1,1) and (1,2); the top row is cut off -->
  <g stroke="#1a2026" stroke-width="1">
    <rect x="356" y="46" width="26" height="26" fill="#4169E1"/><rect x="382" y="46" width="26" height="26" fill="#4169E1"/>
    <rect x="356" y="72" width="26" height="26" fill="#f2dfae"/><rect x="382" y="72" width="26" height="26" fill="#f2dfae"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="93" y="63" fill="#1a2026">0</text><text x="119" y="63" fill="#1a2026">0</text>
    <text x="93" y="89" fill="#1a2026">0</text><text x="119" y="89" fill="#1a2026">0</text>
    <text x="231" y="63" fill="#ffffff">1</text><text x="257" y="63" fill="#1a2026">0</text>
    <text x="231" y="89" fill="#1a2026">0</text><text x="257" y="89" fill="#1a2026">0</text>
    <text x="369" y="63" fill="#ffffff">1</text><text x="395" y="63" fill="#ffffff">1</text>
    <text x="369" y="89" fill="#1a2026">0</text><text x="395" y="89" fill="#1a2026">0</text>
  </g>
  <!-- crossing route on day 1 -->
  <line x1="257" y1="46" x2="257" y2="98" stroke="#c05046" stroke-width="2" stroke-dasharray="5 4"/>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="140" y1="72" x2="212" y2="72"/>
    <line x1="278" y1="72" x2="350" y2="72"/>
  </g>
</svg>
