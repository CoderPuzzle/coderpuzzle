<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- points = [[1,2,3],[1,5,1],[3,1,1]]; grid cells 54x40 at (50,60); dp cells 54x40 at (270,60); row-2 sweeps run on previous dp = [2,7,4] -->
  <!-- points grid, picks (0,2) (1,1) (2,0) accented -->
  <text x="133" y="50" text-anchor="middle" fill="#5c6b76" font-size="12.5">points</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="50" y="60" width="54" height="40"/><rect x="106" y="60" width="54" height="40"/>
    <rect x="50" y="100" width="54" height="40"/><rect x="162" y="100" width="54" height="40"/>
    <rect x="106" y="140" width="54" height="40"/><rect x="162" y="140" width="54" height="40"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="162" y="60" width="54" height="40"/><rect x="106" y="100" width="54" height="40"/>
    <rect x="50" y="140" width="54" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="77" y="85">1</text><text x="133" y="85">2</text><text x="189" y="85" fill="#4169E1">3</text>
    <text x="77" y="125">1</text><text x="133" y="125" fill="#4169E1">5</text><text x="189" y="125">1</text>
    <text x="77" y="165" fill="#4169E1">3</text><text x="133" y="165">1</text><text x="189" y="165">1</text>
  </g>
  <rect x="88" y="192" width="12" height="12" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
  <text x="106" y="202" fill="#5c6b76" font-size="11.5">picked</text>
  <!-- dp after each row -->
  <path d="M 222 120 H 234" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="353" y="50" text-anchor="middle" fill="#5c6b76" font-size="12.5">dp after each row</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="270" y="60" width="54" height="40"/><rect x="326" y="60" width="54" height="40"/>
    <rect x="382" y="60" width="54" height="40"/>
    <rect x="270" y="100" width="54" height="40"/><rect x="326" y="100" width="54" height="40"/>
    <rect x="382" y="100" width="54" height="40"/>
    <rect x="270" y="140" width="54" height="40"/><rect x="326" y="140" width="54" height="40"/>
    <rect x="382" y="140" width="54" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="297" y="85">1</text><text x="353" y="85">2</text><text x="409" y="85" fill="#4169E1">3</text>
    <text x="297" y="125">2</text><text x="353" y="125" fill="#4169E1">7</text><text x="409" y="125">4</text>
    <text x="297" y="165" fill="#4169E1">9</text><text x="353" y="165">8</text><text x="409" y="165">7</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="10.5">
    <text x="262" y="85">r=0</text><text x="262" y="125">r=1</text><text x="262" y="165">r=2</text>
  </g>
  <!-- row 2 sweeps -->
  <text x="470" y="78" fill="#5c6b76" font-size="12">row 2, previous dp = [2, 7, 4]:</text>
  <text x="470" y="106" fill="#1a2026" font-size="13" font-weight="600">left  = [2, 8, 8]</text>
  <text x="470" y="124" fill="#5c6b76" font-size="11.5">(max dp[p] + p, p ≤ c)</text>
  <text x="470" y="152" fill="#1a2026" font-size="13" font-weight="600">right = [6, 6, 2]</text>
  <text x="470" y="170" fill="#5c6b76" font-size="11.5">(max dp[p] − p, p ≥ c)</text>
  <text x="470" y="202" fill="#4169E1" font-size="13" font-weight="600">dp[0] = 3 + max(2 − 0, 6 + 0) = 9</text>
  <!-- caption -->
  <text x="340" y="312" text-anchor="middle" fill="#1a2026" font-size="13">Picks (0,2), (1,1), (2,0): 3 + 5 + 3 = 11, minus penalties 1 + 1 →</text>
  <text x="340" y="332" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">9</tspan>, the maximum of the final dp row [9, 8, 7].</text>
</svg>
