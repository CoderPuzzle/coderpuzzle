<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- nums = [0,1,2,4]; left = [-1,0,1,2], right = [4,4,4,4] from the two monotonic passes, so spans right-left-1 = 4,3,2,1; slots 80x110 at x = 130 + 115i, baseline y = 150; seeds ans[span-1] = value -->
  <text x="105" y="100" text-anchor="end" fill="#5c6b76" font-size="12.5">nums</text>
  <line x1="118" y1="150" x2="575" y2="150" stroke="#42525e" stroke-width="1.5"/>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1">
    <rect x="130" y="40" width="80" height="110"/>
    <rect x="245" y="40" width="80" height="110"/>
    <rect x="360" y="40" width="80" height="110"/>
    <rect x="475" y="40" width="80" height="110"/>
  </g>
  <rect x="245" y="124" width="80" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <rect x="360" y="98" width="80" height="52" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <rect x="475" y="46" width="80" height="104" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600">
    <text x="170" y="144" fill="#5c6b76">0</text>
    <text x="285" y="142" fill="#1a2026">1</text>
    <text x="400" y="129" fill="#1a2026">2</text>
    <text x="515" y="103" fill="#1a2026">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="170" y="168">i = 0</text><text x="285" y="168">i = 1</text><text x="400" y="168">i = 2</text><text x="515" y="168">i = 3</text>
  </g>
  <!-- span of the nearest-smaller window, and the seed it writes -->
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="170" y="192">span 4</text><text x="285" y="192">span 3</text><text x="400" y="192">span 2</text><text x="515" y="192">span 1</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#4169E1">
    <text x="170" y="212">ans[3] ← 0</text><text x="285" y="212">ans[2] ← 1</text><text x="400" y="212">ans[1] ← 2</text><text x="515" y="212">ans[0] ← 4</text>
  </g>
  <!-- ans array after the suffix maximum -->
  <text x="150" y="261" text-anchor="end" fill="#5c6b76" font-size="12.5">ans</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="168" y="236" width="70" height="38"/><rect x="246" y="236" width="70" height="38"/>
    <rect x="324" y="236" width="70" height="38"/><rect x="402" y="236" width="70" height="38"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="203" y="261" fill="#4169E1">4</text><text x="281" y="261" fill="#4169E1">2</text>
    <text x="359" y="261" fill="#4169E1">1</text><text x="437" y="261" fill="#4169E1">0</text>
  </g>
  <text x="320" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Nearest-smaller spans <tspan fill="#4169E1" font-weight="600">4, 3, 2, 1</tspan> seed <tspan fill="#4169E1" font-weight="600">0, 1, 2, 4</tspan> into ans[3], ans[2], ans[1], ans[0];</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">the right-to-left suffix maximum then leaves ans = [<tspan fill="#4169E1" font-weight="600">4, 2, 1, 0</tspan>] unchanged.</text>
</svg>
