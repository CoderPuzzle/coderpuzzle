<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="432" fill="#ffffff"/>
  <!-- nums = [7,21,3]: 7 = 7, 21 = 3 x 7, 3 = 3; value-prime unions merge everything into one component {3,7,21} -->
  <text x="320" y="28" text-anchor="middle" fill="#5c6b76" font-size="12.5">factor each value with the spf sieve, then union the value with each distinct prime</text>
  <text x="170" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">values</text>
  <text x="470" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">primes</text>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="193" y1="104" x2="440" y2="126"/>
    <line x1="193" y1="163" x2="440" y2="139"/>
    <line x1="193" y1="177" x2="440" y2="211"/>
    <line x1="193" y1="236" x2="440" y2="229"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <circle cx="170" cy="100" r="24"/><circle cx="170" cy="170" r="24"/><circle cx="170" cy="240" r="24"/>
    <rect x="438" y="110" width="64" height="40" rx="8"/><rect x="438" y="200" width="64" height="40" rx="8"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="170" y="106">7</text><text x="170" y="176">21</text><text x="170" y="246">3</text>
    <text x="470" y="136">7</text><text x="470" y="226">3</text>
  </g>
  <text x="320" y="282" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13.5">one component: {3, 7, 21}</text>
  <text x="48" y="318" fill="#5c6b76" font-size="12.5">sorted target [3, 7, 21], checked position by position:</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="48" y="330" width="170" height="46" rx="6"/><rect x="235" y="330" width="170" height="46" rx="6"/><rect x="422" y="330" width="170" height="46" rx="6"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="133" y="359">0: 7 → 3 <tspan fill="#4169E1">✓</tspan></text>
    <text x="320" y="359">1: 21 → 7 <tspan fill="#4169E1">✓</tspan></text>
    <text x="507" y="359">2: 3 → 21 <tspan fill="#4169E1">✓</tspan></text>
  </g>
  <text x="320" y="404" text-anchor="middle" fill="#1a2026" font-size="13">Each position's original and sorted target share the one component, so gcd chains</text>
  <text x="320" y="422" text-anchor="middle" fill="#1a2026" font-size="13">can permute them into place — [7, 21, 3] sorts to [3, 7, 21]: return <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
