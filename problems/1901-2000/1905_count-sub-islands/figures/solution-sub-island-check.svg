<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- grid1 5x5, cell 36, x=140 y=60 -->
  <text x="140" y="48" fill="#5c6b76" font-size="13">grid1</text>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="140" y="60" width="36" height="36" fill="#dbe4f6"/><rect x="176" y="60" width="36" height="36" fill="#dbe4f6"/><rect x="212" y="60" width="36" height="36" fill="#dbe4f6"/><rect x="248" y="60" width="36" height="36" fill="#ffffff"/><rect x="284" y="60" width="36" height="36" fill="#ffffff"/>
    <rect x="140" y="96" width="36" height="36" fill="#ffffff"/><rect x="176" y="96" width="36" height="36" fill="#dbe4f6"/><rect x="212" y="96" width="36" height="36" fill="#dbe4f6"/><rect x="248" y="96" width="36" height="36" fill="#dbe4f6"/><rect x="284" y="96" width="36" height="36" fill="#dbe4f6"/>
    <rect x="140" y="132" width="36" height="36" fill="#ffffff"/><rect x="176" y="132" width="36" height="36" fill="#ffffff"/><rect x="212" y="132" width="36" height="36" fill="#ffffff"/><rect x="248" y="132" width="36" height="36" fill="#ffffff"/><rect x="284" y="132" width="36" height="36" fill="#ffffff"/>
    <rect x="140" y="168" width="36" height="36" fill="#dbe4f6"/><rect x="176" y="168" width="36" height="36" fill="#ffffff"/><rect x="212" y="168" width="36" height="36" fill="#ffffff"/><rect x="248" y="168" width="36" height="36" fill="#ffffff"/><rect x="284" y="168" width="36" height="36" fill="#ffffff"/>
    <rect x="140" y="204" width="36" height="36" fill="#dbe4f6"/><rect x="176" y="204" width="36" height="36" fill="#dbe4f6"/><rect x="212" y="204" width="36" height="36" fill="#ffffff"/><rect x="248" y="204" width="36" height="36" fill="#dbe4f6"/><rect x="284" y="204" width="36" height="36" fill="#dbe4f6"/>
  </g>
  <!-- grid2 5x5, x=390 y=60; sub islands accent, failing gray -->
  <text x="390" y="48" fill="#5c6b76" font-size="13">grid2</text>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="390" y="60" width="36" height="36" fill="#4169E1"/><rect x="426" y="60" width="36" height="36" fill="#4169E1"/><rect x="462" y="60" width="36" height="36" fill="#4169E1"/><rect x="498" y="60" width="36" height="36" fill="#ffffff"/><rect x="534" y="60" width="36" height="36" fill="#ffffff"/>
    <rect x="390" y="96" width="36" height="36" fill="#ffffff"/><rect x="426" y="96" width="36" height="36" fill="#ffffff"/><rect x="462" y="96" width="36" height="36" fill="#4169E1"/><rect x="498" y="96" width="36" height="36" fill="#4169E1"/><rect x="534" y="96" width="36" height="36" fill="#4169E1"/>
    <rect x="390" y="132" width="36" height="36" fill="#ffffff"/><rect x="426" y="132" width="36" height="36" fill="#e3e7eb"/><rect x="462" y="132" width="36" height="36" fill="#ffffff"/><rect x="498" y="132" width="36" height="36" fill="#ffffff"/><rect x="534" y="132" width="36" height="36" fill="#ffffff"/>
    <rect x="390" y="168" width="36" height="36" fill="#4169E1"/><rect x="426" y="168" width="36" height="36" fill="#ffffff"/><rect x="462" y="168" width="36" height="36" fill="#e3e7eb"/><rect x="498" y="168" width="36" height="36" fill="#e3e7eb"/><rect x="534" y="168" width="36" height="36" fill="#ffffff"/>
    <rect x="390" y="204" width="36" height="36" fill="#ffffff"/><rect x="426" y="204" width="36" height="36" fill="#4169E1"/><rect x="462" y="204" width="36" height="36" fill="#ffffff"/><rect x="498" y="204" width="36" height="36" fill="#e3e7eb"/><rect x="534" y="204" width="36" height="36" fill="#ffffff"/>
  </g>
  <!-- offending cells in grid2: (2,1) and (3,2) -->
  <g stroke="#5c6b76" stroke-width="1.8">
    <line x1="432" y1="138" x2="456" y2="162"/>
    <line x1="432" y1="162" x2="456" y2="138"/>
    <line x1="468" y1="174" x2="492" y2="198"/>
    <line x1="468" y1="198" x2="492" y2="174"/>
  </g>
  <!-- legend -->
  <g font-size="12.5">
    <rect x="40" y="76" width="22" height="22" fill="#4169E1" stroke="#42525e" stroke-width="1.2"/>
    <text x="70" y="92" fill="#1a2026">sub-island — every cell is</text>
    <text x="70" y="110" fill="#1a2026">also land in grid1: counted</text>
    <rect x="40" y="140" width="22" height="22" fill="#e3e7eb" stroke="#42525e" stroke-width="1.2"/>
    <text x="70" y="156" fill="#1a2026">failing island — an X marks</text>
    <text x="70" y="174" fill="#1a2026">a cell that is water in grid1</text>
  </g>
  <text x="40" y="264" fill="#1a2026" font-size="13">Three flood fills pass the check: the six-cell top island, the lone (3, 0), and (4, 1) → answer <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
