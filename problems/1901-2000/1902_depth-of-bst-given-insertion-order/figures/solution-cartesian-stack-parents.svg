<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="348" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- order = [2,1,4,3]; pos over values 1..4 = [2,1,4,3] (1-based insertion time);
       pos cells 44x36 at (60,76); tree circles r=18: 2 (480,84), 1 (408,160), 4 (552,160), 3 (480,236) -->
  <text x="148" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">pos[v] = insertion time (1-based)</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="76" width="44" height="36"/><rect x="104" y="76" width="44" height="36"/>
    <rect x="148" y="76" width="44" height="36"/><rect x="192" y="76" width="44" height="36"/>
    <rect x="60" y="112" width="44" height="36"/><rect x="104" y="112" width="44" height="36"/>
    <rect x="148" y="112" width="44" height="36"/><rect x="192" y="112" width="44" height="36"/>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="11.5">
    <text x="54" y="99">value</text><text x="54" y="135">pos</text>
  </g>
  <g text-anchor="middle">
    <text x="82" y="99" fill="#1a2026">1</text><text x="126" y="99" fill="#1a2026">2</text>
    <text x="170" y="99" fill="#1a2026">3</text><text x="214" y="99" fill="#1a2026">4</text>
    <text x="82" y="135" fill="#4169E1" font-weight="600">2</text><text x="126" y="135" fill="#4169E1" font-weight="600">1</text>
    <text x="170" y="135" fill="#4169E1" font-weight="600">4</text><text x="214" y="135" fill="#4169E1" font-weight="600">3</text>
  </g>
  <!-- monotonic-stack sweep over v = 1..4 -->
  <g text-anchor="start" font-size="12.5" fill="#1a2026">
    <text x="60" y="182">v=1, pos 2: push → stack [1]</text>
    <text x="60" y="206">v=2, pos 1: pops 1 → 1 re-hangs as 2's left child → [2]</text>
    <text x="60" y="230">v=3, pos 4: sits on 2 → 2's right child → [2,3]</text>
    <text x="60" y="254">v=4, pos 3: pops 3 → 3 re-hangs as 4's left child → [2,4]</text>
  </g>
  <!-- the grown BST -->
  <text x="480" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">the grown BST</text>
  <g fill="none" stroke-width="1.6">
    <line x1="467.6" y1="97.1" x2="420.4" y2="146.9" stroke="#4169E1"/>
    <line x1="492.4" y1="97.1" x2="539.6" y2="146.9" stroke="#42525e"/>
    <line x1="539.6" y1="173.1" x2="492.4" y2="222.9" stroke="#4169E1"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="480" cy="84" r="18"/><circle cx="408" cy="160" r="18"/>
    <circle cx="552" cy="160" r="18"/><circle cx="480" cy="236" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="480" y="89" fill="#1a2026">2</text><text x="408" y="165" fill="#1a2026">1</text>
    <text x="552" y="165" fill="#1a2026">4</text><text x="480" y="241" fill="#4169E1">3</text>
  </g>
  <g font-size="11" fill="#5c6b76">
    <text x="480" y="120" text-anchor="middle">d=1</text>
    <text x="434" y="165">d=2</text><text x="578" y="165">d=2</text>
    <text x="480" y="274" text-anchor="middle" fill="#4169E1" font-weight="600">d=3</text>
  </g>
  <text x="480" y="298" text-anchor="middle" fill="#5c6b76" font-size="12">accent edges come from pops; gray from the stack-below parent</text>
  <text x="340" y="318" text-anchor="middle" fill="#1a2026" font-size="13">pos = [2,1,4,3] makes the grown BST the min-Cartesian tree of the insertion times;</text>
  <text x="340" y="338" text-anchor="middle" fill="#1a2026" font-size="13">one left-to-right walk folds depth[3] = depth[4] + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan> — the tree's depth.</text>
</svg>
