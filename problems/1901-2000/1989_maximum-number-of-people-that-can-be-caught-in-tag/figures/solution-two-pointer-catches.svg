<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="292" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- team = [0,1,0,1,0], dist = 3; it = [1,3], not it = [0,2,4];
       two-pointer greedy: it 1 catches 0, it 3 catches 2, person 4 uncaught -->
  <!-- catch ranges -->
  <text x="83" y="52" fill="#4169E1" font-size="12">it 1 catches in [-2, 4]</text>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="83" y1="64" x2="537" y2="64"/>
    <line x1="83" y1="58" x2="83" y2="70"/>
    <line x1="537" y1="58" x2="537" y2="70"/>
  </g>
  <text x="537" y="90" text-anchor="end" fill="#5c6b76" font-size="12">it 3 catches in [0, 6]</text>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="83" y1="98" x2="537" y2="98"/>
    <line x1="83" y1="92" x2="83" y2="104"/>
    <line x1="537" y1="92" x2="537" y2="104"/>
  </g>
  <!-- people row -->
  <g text-anchor="middle" font-size="12">
    <text x="110" y="130" fill="#5c6b76">not it</text>
    <text x="210" y="130" fill="#4169E1">it</text>
    <text x="310" y="130" fill="#5c6b76">not it</text>
    <text x="410" y="130" fill="#4169E1">it</text>
    <text x="510" y="130" fill="#5c6b76">not it</text>
  </g>
  <g stroke-width="1.6">
    <circle cx="110" cy="160" r="17" fill="#ffffff" stroke="#42525e"/>
    <circle cx="210" cy="160" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <circle cx="310" cy="160" r="17" fill="#ffffff" stroke="#42525e"/>
    <circle cx="410" cy="160" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <circle cx="510" cy="160" r="17" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="110" y="165">0</text><text x="210" y="165">1</text><text x="310" y="165">2</text>
    <text x="410" y="165">3</text><text x="510" y="165">4</text>
  </g>
  <!-- greedy match arcs -->
  <path d="M 196 174 Q 153 208 124 174" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <path d="M 396 174 Q 355 208 326 174" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <g text-anchor="middle" fill="#4169E1" font-size="11">
    <text x="159" y="224">1st match</text>
    <text x="360" y="224">2nd match</text>
  </g>
  <text x="510" y="220" text-anchor="middle" fill="#9aa7b2" font-size="11.5">uncaught</text>
  <text x="340" y="256" text-anchor="middle" fill="#1a2026" font-size="13">With dist = 3 the greedy pairs the leftmost it with the leftmost uncaught</text>
  <text x="340" y="274" text-anchor="middle" fill="#1a2026" font-size="13">not-it in range: it 1 takes 0, it 3 takes 2, person 4 escapes &#8212; answer <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
