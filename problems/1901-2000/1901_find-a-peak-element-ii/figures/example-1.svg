<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="420" height="200" fill="#ffffff"/>
  <!-- 4x4 grid: -1 perimeter around the 2x2 matrix -->
  <g stroke="#1a2026" stroke-width="1.2">
    <rect x="110" y="30" width="50" height="40" fill="#e3e7ec"/>
    <rect x="160" y="30" width="50" height="40" fill="#e3e7ec"/>
    <rect x="210" y="30" width="50" height="40" fill="#e3e7ec"/>
    <rect x="260" y="30" width="50" height="40" fill="#e3e7ec"/>
    <rect x="110" y="70" width="50" height="40" fill="#e3e7ec"/>
    <rect x="160" y="70" width="50" height="40" fill="#ffffff"/>
    <rect x="210" y="70" width="50" height="40" fill="#4169E1"/>
    <rect x="260" y="70" width="50" height="40" fill="#e3e7ec"/>
    <rect x="110" y="110" width="50" height="40" fill="#e3e7ec"/>
    <rect x="160" y="110" width="50" height="40" fill="#ffffff"/>
    <rect x="210" y="110" width="50" height="40" fill="#ffffff"/>
    <rect x="260" y="110" width="50" height="40" fill="#e3e7ec"/>
    <rect x="110" y="150" width="50" height="40" fill="#e3e7ec"/>
    <rect x="160" y="150" width="50" height="40" fill="#e3e7ec"/>
    <rect x="210" y="150" width="50" height="40" fill="#e3e7ec"/>
    <rect x="260" y="150" width="50" height="40" fill="#e3e7ec"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="185" y="95" fill="#1a2026">1</text>
    <text x="235" y="95" fill="#ffffff">4</text>
    <text x="185" y="135" fill="#1a2026">2</text>
    <text x="235" y="135" fill="#1a2026">3</text>
  </g>
  <g text-anchor="middle" fill="#7a8794" font-size="12">
    <text x="135" y="55">-1</text><text x="185" y="55">-1</text><text x="235" y="55">-1</text><text x="285" y="55">-1</text>
    <text x="135" y="95">-1</text><text x="285" y="95">-1</text>
    <text x="135" y="135">-1</text><text x="285" y="135">-1</text>
    <text x="135" y="175">-1</text><text x="185" y="175">-1</text><text x="235" y="175">-1</text><text x="285" y="175">-1</text>
  </g>
  <text x="210" y="192" text-anchor="middle" fill="#5c6b76" font-size="12.5">4 beats every neighbor, so [0, 1] is a peak</text>
</svg>
