<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 242" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- grid=[[1,0,0],[0,0,0],[0,0,1]]; multi-source BFS: d(0,0)=0 and d(2,2)=0, so every path from (0,0) to (2,2) has safeness 0 (verified) -->
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <rect x="200" y="30" width="52" height="52"/>
    <rect x="252" y="30" width="52" height="52"/>
    <rect x="304" y="30" width="52" height="52"/>
    <rect x="200" y="82" width="52" height="52"/>
    <rect x="252" y="82" width="52" height="52"/>
    <rect x="304" y="82" width="52" height="52"/>
    <rect x="200" y="134" width="52" height="52"/>
    <rect x="252" y="134" width="52" height="52"/>
    <rect x="304" y="134" width="52" height="52"/>
  </g>
  <g stroke="#b57f30" stroke-width="1.6" fill="#f7ecd9">
    <rect x="200" y="30" width="52" height="52"/>
    <rect x="304" y="134" width="52" height="52"/>
  </g>
  <g text-anchor="middle">
    <text x="226" y="66" font-weight="700" fill="#7a5a1e">1</text>
    <text x="278" y="66" fill="#5c6b76">0</text>
    <text x="330" y="66" fill="#5c6b76">0</text>
    <text x="226" y="118" fill="#5c6b76">0</text>
    <text x="278" y="118" fill="#5c6b76">0</text>
    <text x="330" y="118" fill="#5c6b76">0</text>
    <text x="226" y="170" fill="#5c6b76">0</text>
    <text x="278" y="170" fill="#5c6b76">0</text>
    <text x="330" y="170" font-weight="700" fill="#7a5a1e">1</text>
  </g>
  <text x="192" y="60" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">start (0, 0)</text>
  <text x="364" y="170" text-anchor="start" fill="#4169E1" font-size="12" font-weight="600">end (2, 2)</text>
  <text x="280" y="228" text-anchor="middle" fill="#1a2026" font-size="13.5">start and destination are themselves thieves — every path has safeness <tspan fill="#4169E1" font-weight="700">0</tspan></text>
</svg>
