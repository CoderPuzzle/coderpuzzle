<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="380" fill="#ffffff"/>
  <!-- sorted values = [-1, 1, 1, 2, 3], target = 2;
       sweep: (lo 0, hi 4) fail, (lo 0, hi 3) pass count += 3 with partners at indices 1,2,3 (the 3 at index 4 is outside the window), (lo 1, hi 3) fail, (lo 1, hi 2) fail; count = 3;
       mini cells 44x28 at x = 56 + 50j, band y = 44 + 76b -->
  <text x="320" y="24" text-anchor="middle" fill="#5c6b76" font-size="12.5">sorted copy: [-1, 1, 1, 2, 3], target = 2</text>
  <!-- band 1: lo = 0, hi = 4 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="56" y="44" width="44" height="28"/><rect x="106" y="44" width="44" height="28"/>
    <rect x="156" y="44" width="44" height="28"/><rect x="206" y="44" width="44" height="28"/>
    <rect x="256" y="44" width="44" height="28"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="78" y="63">-1</text><text x="128" y="63">1</text><text x="178" y="63">1</text>
    <text x="228" y="63">2</text><text x="278" y="63">3</text>
  </g>
  <path d="M 73 84 L 83 84 L 78 76 Z" fill="#4169E1"/><text x="78" y="98" text-anchor="middle" fill="#4169E1" font-size="11.5">lo</text>
  <path d="M 273 84 L 283 84 L 278 76 Z" fill="#1a2026"/><text x="278" y="98" text-anchor="middle" fill="#1a2026" font-size="11.5">hi</text>
  <text x="322" y="58" fill="#1a2026" font-size="12.5">-1 + 3 = 2: not &lt; 2, so hi retreats</text>
  <!-- band 2: lo = 0, hi = 3, credit 3 pairs — tinted cells are the three partners at indices 1,2,3 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="56" y="120" width="44" height="28"/><rect x="256" y="120" width="44" height="28"/>
    <rect x="106" y="120" width="44" height="28" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="156" y="120" width="44" height="28" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="206" y="120" width="44" height="28" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="78" y="139">-1</text><text x="128" y="139">1</text><text x="178" y="139">1</text>
    <text x="228" y="139">2</text><text x="278" y="139">3</text>
  </g>
  <path d="M 73 160 L 83 160 L 78 152 Z" fill="#4169E1"/><text x="78" y="174" text-anchor="middle" fill="#4169E1" font-size="11.5">lo</text>
  <path d="M 223 160 L 233 160 L 228 152 Z" fill="#1a2026"/><text x="228" y="174" text-anchor="middle" fill="#1a2026" font-size="11.5">hi</text>
  <text x="322" y="134" fill="#1a2026" font-size="12.5">-1 + 2 = 1 &lt; 2: count += hi - lo = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="322" y="152" fill="#5c6b76" font-size="11.5">1, 1 and 2 all pair with the -1 at once</text>
  <!-- band 3: lo = 1, hi = 3 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="56" y="196" width="44" height="28"/><rect x="106" y="196" width="44" height="28"/>
    <rect x="156" y="196" width="44" height="28"/><rect x="206" y="196" width="44" height="28"/>
    <rect x="256" y="196" width="44" height="28"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="78" y="215">-1</text><text x="128" y="215">1</text><text x="178" y="215">1</text>
    <text x="228" y="215">2</text><text x="278" y="215">3</text>
  </g>
  <path d="M 123 236 L 133 236 L 128 228 Z" fill="#4169E1"/><text x="128" y="250" text-anchor="middle" fill="#4169E1" font-size="11.5">lo</text>
  <path d="M 273 236 L 283 236 L 278 228 Z" fill="#1a2026"/><text x="278" y="250" text-anchor="middle" fill="#1a2026" font-size="11.5">hi</text>
  <text x="322" y="210" fill="#1a2026" font-size="12.5">1 + 2 = 3: not &lt; 2, hi retreats</text>
  <!-- band 4: lo = 1, hi = 2 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="56" y="272" width="44" height="28"/><rect x="106" y="272" width="44" height="28"/>
    <rect x="156" y="272" width="44" height="28"/><rect x="206" y="272" width="44" height="28"/>
    <rect x="256" y="272" width="44" height="28"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="78" y="291">-1</text><text x="128" y="291">1</text><text x="178" y="291">1</text>
    <text x="228" y="291">2</text><text x="278" y="291">3</text>
  </g>
  <path d="M 123 312 L 133 312 L 128 304 Z" fill="#4169E1"/><text x="128" y="326" text-anchor="middle" fill="#4169E1" font-size="11.5">lo</text>
  <path d="M 223 312 L 233 312 L 228 304 Z" fill="#1a2026"/><text x="228" y="326" text-anchor="middle" fill="#1a2026" font-size="11.5">hi</text>
  <text x="322" y="286" fill="#1a2026" font-size="12.5">1 + 1 = 2: not &lt; 2, hi retreats</text>
  <text x="322" y="304" fill="#5c6b76" font-size="11.5">hi meets lo — the sweep ends; count = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="320" y="350" text-anchor="middle" fill="#1a2026" font-size="13">Only one state credits pairs: at lo = 0, hi = 3 the sum 1 &lt; 2 banks 3 pairs at once.</text>
  <text x="320" y="368" text-anchor="middle" fill="#1a2026" font-size="13">Every other step just retreats a pointer; the final count is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
