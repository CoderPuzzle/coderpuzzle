<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums=[2,6,5,8], k=2; pools bit3:1, bit2:2, bit1:2, bit0:1; slot cells: bit3 [1,0], bit2 [1,1], bit1 [1,1], bit0 [1,0]; columns read 1111=15, 0110=6; cells 40x30 -->
  <text x="48" y="32" fill="#5c6b76" font-size="12.5">nums = [2,6,5,8], k = 2</text>
  <text x="48" y="54" fill="#9aa7b2" font-size="11.5">2 = 0010, 6 = 0110, 5 = 0101, 8 = 1000</text>
  <text x="141" y="80" text-anchor="middle" fill="#5c6b76" font-size="11.5">bit copies</text>
  <text x="296" y="80" text-anchor="middle" fill="#5c6b76" font-size="12">slot 0</text>
  <text x="344" y="80" text-anchor="middle" fill="#5c6b76" font-size="12">slot 1</text>
  <g text-anchor="end" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="126" y="107">bit 3</text><text x="126" y="147">bit 2</text>
    <text x="126" y="187">bit 1</text><text x="126" y="227">bit 0</text>
  </g>
  <!-- pool copies -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2">
    <rect x="136" y="96" width="14" height="14"/>
    <rect x="136" y="136" width="14" height="14"/><rect x="156" y="136" width="14" height="14"/>
    <rect x="136" y="176" width="14" height="14"/><rect x="156" y="176" width="14" height="14"/>
    <rect x="136" y="216" width="14" height="14"/>
  </g>
  <line x1="244" y1="96" x2="244" y2="230" stroke="#9aa7b2" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="226" y="163" transform="rotate(-90 226 163)" text-anchor="middle" fill="#9aa7b2" font-size="11">high bits first</text>
  <!-- slot cells: filled = slot i below count[b] -->
  <g stroke-width="1.3">
    <rect x="276" y="88" width="40" height="30" fill="#dbe4fb" stroke="#4169E1"/><rect x="324" y="88" width="40" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="276" y="128" width="40" height="30" fill="#dbe4fb" stroke="#4169E1"/><rect x="324" y="128" width="40" height="30" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="276" y="168" width="40" height="30" fill="#dbe4fb" stroke="#4169E1"/><rect x="324" y="168" width="40" height="30" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="276" y="208" width="40" height="30" fill="#dbe4fb" stroke="#4169E1"/><rect x="324" y="208" width="40" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="296" y="108" fill="#1a2026">1</text><text x="344" y="108" fill="#9aa7b2">0</text>
    <text x="296" y="148" fill="#1a2026">1</text><text x="344" y="148" fill="#1a2026">1</text>
    <text x="296" y="188" fill="#1a2026">1</text><text x="344" y="188" fill="#1a2026">1</text>
    <text x="296" y="228" fill="#1a2026">1</text><text x="344" y="228" fill="#9aa7b2">0</text>
  </g>
  <text x="296" y="264" text-anchor="middle" fill="#4169E1" font-size="15" font-weight="600">15</text>
  <text x="344" y="264" text-anchor="middle" fill="#4169E1" font-size="15" font-weight="600">6</text>
  <text x="416" y="150" fill="#5c6b76" font-size="12">sum of squares</text>
  <text x="416" y="176" fill="#1a2026" font-size="13.5">15&#178; + 6&#178; = 225 + 36 = <tspan fill="#4169E1" font-weight="600">261</tspan></text>
  <text x="310" y="298" text-anchor="middle" fill="#1a2026" font-size="13">Bit pools pour into the two kept slots high bits first, packing them as</text>
  <text x="310" y="316" text-anchor="middle" fill="#1a2026" font-size="13">1111 = 15 and 0110 = 6 &#8212; the maximum sum of squares is <tspan fill="#4169E1" font-weight="600">261</tspan>.</text>
</svg>
