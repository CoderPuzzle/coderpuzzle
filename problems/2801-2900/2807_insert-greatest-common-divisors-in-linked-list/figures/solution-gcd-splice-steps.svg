<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="364" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- head = [18,6,10,3]; splice rows y=64/136/208: cursor box x150 w44,
       new gcd box x250 (accent #dbe4fb), untouched successor x350;
       final list y=270: boxes 40x40 gap 14 from x138, inserted nodes accented -->
  <g stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 194 64 H 246" fill="none"/><path d="M 294 64 H 346" fill="none"/>
    <path d="M 194 136 H 246" fill="none"/><path d="M 294 136 H 346" fill="none"/>
    <path d="M 194 208 H 246" fill="none"/><path d="M 294 208 H 346" fill="none"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <rect x="150" y="44" width="44" height="40"/><rect x="250" y="44" width="44" height="40" fill="#dbe4fb"/><rect x="350" y="44" width="44" height="40"/>
    <rect x="150" y="116" width="44" height="40"/><rect x="250" y="116" width="44" height="40" fill="#dbe4fb"/><rect x="350" y="116" width="44" height="40"/>
    <rect x="150" y="188" width="44" height="40"/><rect x="250" y="188" width="44" height="40" fill="#dbe4fb"/><rect x="350" y="188" width="44" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="172" y="69">18</text><text x="272" y="69">6</text><text x="372" y="69">6</text>
    <text x="172" y="141">6</text><text x="272" y="141">2</text><text x="372" y="141">10</text>
    <text x="172" y="213">10</text><text x="272" y="213">1</text><text x="372" y="213">3</text>
  </g>
  <g text-anchor="end" font-size="13" fill="#5c6b76">
    <text x="128" y="69">gcd(18, 6) = <tspan fill="#4169E1" font-weight="600">6</tspan></text>
    <text x="128" y="141">gcd(6, 10) = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="128" y="213">gcd(10, 3) = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="172" y="34">cursor</text><text x="272" y="34">new node</text>
    <text x="172" y="106">cursor</text><text x="272" y="106">new node</text>
    <text x="172" y="178">cursor</text><text x="272" y="178">new node</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="372" y="98">untouched successor</text>
    <text x="372" y="170">untouched successor</text>
    <text x="372" y="242">tail — loop stops</text>
  </g>
  <g fill="#9aa7b2" font-size="13" text-anchor="start">
    <text x="410" y="69">…</text><text x="410" y="141">…</text><text x="410" y="213">null</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="none">
    <path d="M 394 64 H 404"/><path d="M 394 136 H 404"/><path d="M 394 208 H 404"/>
  </g>
  <!-- assembled output -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="138" y="270" width="40" height="40" fill="#ffffff"/>
    <rect x="192" y="270" width="40" height="40" fill="#dbe4fb"/>
    <rect x="246" y="270" width="40" height="40" fill="#ffffff"/>
    <rect x="300" y="270" width="40" height="40" fill="#dbe4fb"/>
    <rect x="354" y="270" width="40" height="40" fill="#ffffff"/>
    <rect x="408" y="270" width="40" height="40" fill="#dbe4fb"/>
    <rect x="462" y="270" width="40" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="158" y="295">18</text><text x="212" y="295">6</text><text x="266" y="295">6</text>
    <text x="320" y="295">2</text><text x="374" y="295">10</text><text x="428" y="295">1</text><text x="482" y="295">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="212" y="262">new</text><text x="320" y="262">new</text><text x="428" y="262">new</text>
  </g>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">Each stop rewires next to a fresh gcd node, then steps to the untouched</text>
  <text x="320" y="352" text-anchor="middle" fill="#1a2026" font-size="13">successor — [18, 6, 10, 3] becomes [18, <tspan fill="#4169E1" font-weight="600">6</tspan>, 6, <tspan fill="#4169E1" font-weight="600">2</tspan>, 10, <tspan fill="#4169E1" font-weight="600">1</tspan>, 3].</text>
</svg>
