<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 244" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n=3, edges=[[1,2],[2,0]] directed; answer=[2,0,1] (verified by rooting the tree at each node) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="152.1" y1="144.7" x2="232.3" y2="71.2" marker-end="url(#arrow)"/>
    <line x1="267.7" y1="71.2" x2="347.9" y2="144.7" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="250" cy="60" r="21"/>
    <circle cx="130" cy="170" r="21"/>
    <circle cx="370" cy="170" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="250" y="65">2</text>
    <text x="130" y="175">1</text>
    <text x="370" y="175">0</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="250" y="29">ans 1</text>
    <text x="130" y="212">ans 0</text>
    <text x="370" y="212">ans 2</text>
  </g>
  <text x="250" y="238" text-anchor="middle" fill="#1a2026" font-size="13.5">answer = <tspan fill="#4169E1" font-weight="700">[2, 0, 1]</tspan> — node 1 already reaches every node</text>
</svg>
