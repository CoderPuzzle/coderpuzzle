<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- chain 0-2-1-3 from edges [[2,0],[2,1],[1,3]]; nodes x=110+150i, r 20; top row y=75 is the dp sweep, bottom row y=228 the reroot; edge arrows show original directions -->
  <text x="40" y="30" fill="#5c6b76" font-size="12.5">Pass 1 — dp sweep rooted at 0, children before parents:</text>
  <text x="110" y="46" text-anchor="middle" fill="#5c6b76" font-size="11.5">root</text>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 240 75 L 130 75" marker-end="url(#arrow)"/>
    <path d="M 280 75 L 390 75" marker-end="url(#arrow)"/>
    <path d="M 430 75 L 540 75" marker-end="url(#arrow)"/>
  </g>
  <circle cx="110" cy="75" r="20" fill="#4169E1"/>
  <circle cx="260" cy="75" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="410" cy="75" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="560" cy="75" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="110" y="80" fill="#ffffff">0</text><text x="260" y="80" fill="#1a2026">2</text>
    <text x="410" y="80" fill="#1a2026">1</text><text x="560" y="80" fill="#1a2026">3</text>
  </g>
  <text x="62" y="140" text-anchor="end" fill="#5c6b76" font-size="12.5">dp</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="110" y="140" fill="#4169E1">1</text><text x="260" y="140" fill="#1a2026">0</text>
    <text x="410" y="140" fill="#1a2026">0</text><text x="560" y="140" fill="#1a2026">0</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <path d="M 230 136 L 140 136" marker-end="url(#arrowG)"/>
    <path d="M 380 136 L 290 136" marker-end="url(#arrowG)"/>
    <path d="M 530 136 L 440 136" marker-end="url(#arrowG)"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="185" y="128" fill="#4169E1" font-weight="600">+1</text>
    <text x="335" y="128">+0</text><text x="485" y="128">+0</text>
  </g>
  <text x="185" y="155" text-anchor="middle" fill="#5c6b76" font-size="11">edge 2 → 0 reversed</text>
  <text x="40" y="188" fill="#5c6b76" font-size="12.5">Pass 2 — reroot, parents before children:</text>
  <text x="40" y="205" fill="#1a2026" font-size="12.5">ans[0] = dp[0] = 1, <tspan fill="#5c6b76">then cross each edge:</tspan></text>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 240 228 L 130 228" marker-end="url(#arrow)"/>
    <path d="M 280 228 L 390 228" marker-end="url(#arrow)"/>
    <path d="M 430 228 L 540 228" marker-end="url(#arrow)"/>
  </g>
  <circle cx="110" cy="228" r="20" fill="#4169E1"/>
  <circle cx="260" cy="228" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="410" cy="228" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="560" cy="228" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="110" y="233" fill="#ffffff">0</text><text x="260" y="233" fill="#1a2026">2</text>
    <text x="410" y="233" fill="#1a2026">1</text><text x="560" y="233" fill="#1a2026">3</text>
  </g>
  <text x="62" y="293" text-anchor="end" fill="#5c6b76" font-size="12.5">ans</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#4169E1">
    <text x="110" y="293">1</text><text x="260" y="293">0</text>
    <text x="410" y="293">1</text><text x="560" y="293">2</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <path d="M 140 289 L 230 289" marker-end="url(#arrowG)"/>
    <path d="M 290 289 L 380 289" marker-end="url(#arrowG)"/>
    <path d="M 440 289 L 530 289" marker-end="url(#arrowG)"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="185" y="281" fill="#4169E1" font-weight="600">-1</text>
    <text x="335" y="281">+1</text><text x="485" y="281">+1</text>
  </g>
  <text x="320" y="324" text-anchor="middle" fill="#1a2026" font-size="13">Rooted at 0 the sweep pays 1 to reverse edge 2 → 0; rerooting then moves</text>
  <text x="320" y="342" text-anchor="middle" fill="#1a2026" font-size="13">the answer by -1, +1, +1 down the chain, filling answer = <tspan fill="#4169E1" font-weight="600">[1, 1, 0, 2]</tspan>.</text>
</svg>
