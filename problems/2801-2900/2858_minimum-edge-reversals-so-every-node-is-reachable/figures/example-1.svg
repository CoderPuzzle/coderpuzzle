<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n=4, edges=[[2,0],[2,1],[1,3]] directed; answer=[1,1,0,2] (verified by rooting the tree at each node and counting edges pointing toward the root) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="301.8" y1="65" x2="372.7" y2="97.5" marker-end="url(#arrow)"/>
    <line x1="262.6" y1="71.5" x2="201.7" y2="129.3" marker-end="url(#arrow)"/>
    <line x1="200.1" y1="163.1" x2="254.8" y2="198.7" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="280" cy="55" r="21"/>
    <circle cx="400" cy="110" r="21"/>
    <circle cx="180" cy="150" r="21"/>
    <circle cx="280" cy="215" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="280" y="60">2</text>
    <text x="400" y="115">0</text>
    <text x="180" y="155">1</text>
    <text x="280" y="220">3</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600">
    <text x="280" y="26" text-anchor="middle">ans 0</text>
    <text x="400" y="78" text-anchor="middle">ans 1</text>
    <text x="134" y="154" text-anchor="end">ans 1</text>
    <text x="312" y="220">ans 2</text>
  </g>
  <text x="280" y="252" text-anchor="middle" fill="#1a2026" font-size="13.5">answer = <tspan fill="#4169E1" font-weight="700">[1, 1, 0, 2]</tspan> — node 2 already reaches every node</text>
</svg>
