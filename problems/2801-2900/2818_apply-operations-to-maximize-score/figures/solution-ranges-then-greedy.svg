<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="344" fill="#ffffff"/>
  <!-- nums = [8,3,9,3,8], k = 2; all prime scores = 1 so left = [-1,0,1,2,3], right = [5,5,5,5,5], ranges = [5,4,3,2,1];
       big cells 88x44 at x = 84 + 96i, y = 40; sorted strip 56x34 at x = 60 + 62i, y = 244;
       strip pairs (value, range, source index): (9,3,i2) (8,5,i0) (8,1,i4) (3,4,i1) (3,2,i3) — each max n is that element's own ranges[i] -->
  <text x="320" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums = [8, 3, 9, 3, 8], k = 2 — every value's prime score is 1</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="84" y="40" width="88" height="44"/><rect x="180" y="40" width="88" height="44"/>
    <rect x="372" y="40" width="88" height="44"/><rect x="468" y="40" width="88" height="44"/>
  </g>
  <rect x="276" y="40" width="88" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="128" y="68">8</text><text x="224" y="68">3</text><text x="416" y="68">3</text><text x="512" y="68">8</text>
    <text x="320" y="68" fill="#4169E1">9</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="128" y="104">i = 0</text><text x="224" y="104">i = 1</text><text x="320" y="104">i = 2</text>
    <text x="416" y="104">i = 3</text><text x="512" y="104">i = 4</text>
  </g>
  <text x="40" y="130" fill="#5c6b76" font-size="12">left</text>
  <g text-anchor="middle" font-size="13" fill="#5c6b76">
    <text x="128" y="130">-1</text><text x="224" y="130">0</text><text x="320" y="130">1</text>
    <text x="416" y="130">2</text><text x="512" y="130">3</text>
  </g>
  <text x="40" y="152" fill="#5c6b76" font-size="12">right</text>
  <g text-anchor="middle" font-size="13" fill="#5c6b76">
    <text x="128" y="152">5</text><text x="224" y="152">5</text><text x="320" y="152">5</text>
    <text x="416" y="152">5</text><text x="512" y="152">5</text>
  </g>
  <text x="40" y="178" fill="#1a2026" font-size="12.5" font-weight="600">ranges</text>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="128" y="178">5</text><text x="224" y="178">4</text><text x="416" y="178">2</text><text x="512" y="178">1</text>
    <text x="320" y="178" fill="#4169E1">3</text>
  </g>
  <text x="320" y="206" text-anchor="middle" fill="#5c6b76" font-size="12.5">ranges[i] = (i - left[i]) * (right[i] - i); for the 9 at i = 2: (2 - 1) * (5 - 2) = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="60" y="236" fill="#5c6b76" font-size="12">sorted by value, each with its range</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="122" y="244" width="56" height="34"/><rect x="184" y="244" width="56" height="34"/>
    <rect x="246" y="244" width="56" height="34"/><rect x="308" y="244" width="56" height="34"/>
  </g>
  <rect x="60" y="244" width="56" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="88" y="261">9</text><text x="150" y="261">8</text><text x="212" y="261">8</text>
    <text x="274" y="261">3</text><text x="336" y="261">3</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#5c6b76">
    <text x="88" y="274">max 3</text><text x="150" y="274">max 5</text><text x="212" y="274">max 1</text>
    <text x="274" y="274">max 4</text><text x="336" y="274">max 2</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#9aa7b2">
    <text x="88" y="291">from i = 2</text><text x="150" y="291">from i = 0</text><text x="212" y="291">from i = 4</text>
    <text x="274" y="291">from i = 1</text><text x="336" y="291">from i = 3</text>
  </g>
  <text x="384" y="258" fill="#1a2026" font-size="13" font-weight="600">k = 2: take the 9 twice</text>
  <text x="384" y="276" fill="#1a2026" font-size="13">9 × 9 = <tspan fill="#4169E1" font-weight="600">81</tspan></text>
  <text x="320" y="314" text-anchor="middle" fill="#1a2026" font-size="13">All scores tie at 1, so each element wins only subarrays that start at itself.</text>
  <text x="320" y="332" text-anchor="middle" fill="#1a2026" font-size="13">The 9 owns <tspan fill="#4169E1" font-weight="600">3</tspan> of them, covering the whole budget k = 2, so the score is 9 × 9 = <tspan fill="#4169E1" font-weight="600">81</tspan>.</text>
</svg>
