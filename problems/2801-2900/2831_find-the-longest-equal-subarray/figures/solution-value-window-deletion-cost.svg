<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 366" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="366" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,3,2,3,1,3], k = 3; value 3 at P = [1,3,5];
       nums cells 64x44 at x = 110+72i; deleted cells: indices 2 and 4;
       window rows h=36 at y = 184+44j over P, right end j = 0,1,2 -->
  <text x="110" y="34" fill="#5c6b76" font-size="12.5">nums, k = 3</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="110" y="48" width="64" height="44" fill="#ffffff"/>
    <rect x="182" y="48" width="64" height="44" fill="#dbe4fb"/>
    <rect x="254" y="48" width="64" height="44" fill="#f0f3f7"/>
    <rect x="326" y="48" width="64" height="44" fill="#dbe4fb"/>
    <rect x="398" y="48" width="64" height="44" fill="#f0f3f7"/>
    <rect x="470" y="48" width="64" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="142" y="76">1</text><text x="214" y="76">3</text>
    <text x="286" y="76" fill="#9aa7b2">2</text><text x="358" y="76">3</text>
    <text x="430" y="76" fill="#9aa7b2">1</text><text x="502" y="76">3</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.6">
    <line x1="270" y1="58" x2="302" y2="82"/><line x1="302" y1="58" x2="270" y2="82"/>
    <line x1="414" y1="58" x2="446" y2="82"/><line x1="446" y1="58" x2="414" y2="82"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="142" y="108">0</text><text x="214" y="108">1</text><text x="286" y="108">2</text>
    <text x="358" y="108">3</text><text x="430" y="108">4</text><text x="502" y="108">5</text>
  </g>
  <path d="M 182 126 L 182 118 L 534 118 L 534 126" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="358" y="142" text-anchor="middle" fill="#5c6b76" font-size="11">span of the kept 3s &#8212; the 2 and the 1 inside must go</text>
  <text x="310" y="166" text-anchor="middle" fill="#1a2026" font-size="12.5">value 3 occurs at P = [1, 3, 5] &#8212; slide a window over P</text>
  <!-- two-pointer rows: right end j grows, cost = (P[j]-P[i]) - (j-i) -->
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="130" y="206">j = 0</text><text x="130" y="250">j = 1</text><text x="130" y="294">j = 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="146" y="184" width="48" height="36"/>
    <rect x="146" y="228" width="48" height="36"/><rect x="200" y="228" width="48" height="36"/>
    <rect x="146" y="272" width="48" height="36"/><rect x="200" y="272" width="48" height="36"/><rect x="254" y="272" width="48" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="170" y="207">1</text>
    <text x="170" y="251">1</text><text x="224" y="251">3</text>
    <text x="170" y="295">1</text><text x="224" y="295">3</text><text x="278" y="295">5</text>
  </g>
  <g font-size="12" fill="#5c6b76">
    <text x="330" y="207">cost 0 &#183; len 1</text>
    <text x="330" y="251">cost (3&#8722;1) &#8722; 1 = 1 &#183; len 2</text>
    <text x="330" y="295" fill="#4169E1" font-weight="600">cost (5&#8722;1) &#8722; 2 = 2 &#8804; k = 3 &#183; len 3</text>
  </g>
  <text x="310" y="338" text-anchor="middle" fill="#1a2026" font-size="13">The window never needs to shrink: keeping [1, 3, 5] costs 2 deletions &#8212;</text>
  <text x="310" y="358" text-anchor="middle" fill="#1a2026" font-size="13">the foreign 2 and 1, within k = 3. Best equal subarray: length <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
