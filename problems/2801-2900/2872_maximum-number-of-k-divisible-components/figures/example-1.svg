<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 302" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n=5, edges=[[0,2],[1,2],[1,3],[2,4]], values=[1,8,1,4,4], k=6; cut edge (1,2): {0,2,4}=1+1+4=6, {1,3}=8+4=12 (verified by greedy subtree sums) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g stroke="#42525e" stroke-width="1.6">
    <!-- before: node 2 at top, leaves 0 / 4, branch 1-3; edge 1-2 gets cut -->
    <line x1="160" y1="48" x2="40" y2="138"/>
    <line x1="160" y1="48" x2="280" y2="138"/>
    <line x1="160" y1="138" x2="160" y2="224"/>
    <!-- after: two components -->
    <line x1="540" y1="48" x2="420" y2="138"/>
    <line x1="540" y1="48" x2="660" y2="138"/>
    <line x1="770" y1="66" x2="770" y2="152"/>
  </g>
  <line x1="160" y1="48" x2="160" y2="138" stroke="#b57f30" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="176" y="97" fill="#7a5a1e" font-size="12">cut</text>
  <line x1="322" y1="140" x2="358" y2="140" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="160" cy="48" r="21"/>
    <circle cx="40" cy="138" r="21"/>
    <circle cx="160" cy="138" r="21"/>
    <circle cx="280" cy="138" r="21"/>
    <circle cx="160" cy="224" r="21"/>
    <circle cx="540" cy="48" r="21"/>
    <circle cx="420" cy="138" r="21"/>
    <circle cx="660" cy="138" r="21"/>
    <circle cx="770" cy="66" r="21"/>
    <circle cx="770" cy="152" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="160" y="53">2</text>
    <text x="40" y="143">0</text>
    <text x="160" y="143">1</text>
    <text x="280" y="143">4</text>
    <text x="160" y="229">3</text>
    <text x="540" y="53">2</text>
    <text x="420" y="143">0</text>
    <text x="660" y="143">4</text>
    <text x="770" y="71">1</text>
    <text x="770" y="157">3</text>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="160" y="18">v 1</text>
    <text x="40" y="176">v 1</text>
    <text x="114" y="142" text-anchor="end">v 8</text>
    <text x="280" y="176">v 4</text>
    <text x="160" y="264">v 4</text>
    <text x="540" y="18">v 1</text>
    <text x="420" y="176">v 1</text>
    <text x="660" y="176">v 4</text>
    <text x="800" y="70" text-anchor="start">v 8</text>
    <text x="770" y="192">v 4</text>
  </g>
  <g fill="#4169E1" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="540" y="214">1 + 1 + 4 = 6</text>
    <text x="770" y="214">8 + 4 = 12</text>
  </g>
  <text x="420" y="292" text-anchor="middle" fill="#1a2026" font-size="13.5">cut edge 1–2: sums <tspan fill="#4169E1" font-weight="700">6</tspan> and <tspan fill="#4169E1" font-weight="700">12</tspan> are both divisible by k = 6 → <tspan fill="#4169E1" font-weight="700">2</tspan> components</text>
</svg>
