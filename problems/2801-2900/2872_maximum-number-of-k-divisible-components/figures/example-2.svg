<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 302" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n=7, edges=[[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]], values=[3,0,6,1,5,2,1], k=3; cut (0,1),(0,2): {0}=3, {1,3,4}=0+1+5=6, {2,5,6}=6+2+1=9 (verified by greedy subtree sums) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g stroke="#42525e" stroke-width="1.6">
    <!-- before: node 0 at top, children 1 / 2, leaves 3 4 5 6; edges 0-1 and 0-2 get cut -->
    <line x1="90" y1="124" x2="50" y2="210"/>
    <line x1="90" y1="124" x2="130" y2="210"/>
    <line x1="250" y1="124" x2="210" y2="210"/>
    <line x1="250" y1="124" x2="290" y2="210"/>
    <!-- after: three components -->
    <line x1="490" y1="88" x2="410" y2="174"/>
    <line x1="490" y1="88" x2="570" y2="174"/>
    <line x1="700" y1="88" x2="620" y2="174"/>
    <line x1="700" y1="88" x2="780" y2="174"/>
  </g>
  <g stroke="#b57f30" stroke-width="1.6" stroke-dasharray="4 3">
    <line x1="170" y1="42" x2="90" y2="124"/>
    <line x1="170" y1="42" x2="250" y2="124"/>
  </g>
  <text x="170" y="97" fill="#7a5a1e" font-size="12" text-anchor="middle">both cut</text>
  <line x1="352" y1="130" x2="388" y2="130" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="170" cy="42" r="21"/>
    <circle cx="90" cy="124" r="21"/>
    <circle cx="250" cy="124" r="21"/>
    <circle cx="50" cy="210" r="21"/>
    <circle cx="130" cy="210" r="21"/>
    <circle cx="210" cy="210" r="21"/>
    <circle cx="290" cy="210" r="21"/>
    <circle cx="490" cy="88" r="21"/>
    <circle cx="410" cy="174" r="21"/>
    <circle cx="570" cy="174" r="21"/>
    <circle cx="700" cy="88" r="21"/>
    <circle cx="620" cy="174" r="21"/>
    <circle cx="780" cy="174" r="21"/>
    <circle cx="860" cy="131" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="170" y="47">0</text>
    <text x="90" y="129">1</text>
    <text x="250" y="129">2</text>
    <text x="50" y="215">3</text>
    <text x="130" y="215">4</text>
    <text x="210" y="215">5</text>
    <text x="290" y="215">6</text>
    <text x="490" y="93">1</text>
    <text x="410" y="179">3</text>
    <text x="570" y="179">4</text>
    <text x="700" y="93">2</text>
    <text x="620" y="179">5</text>
    <text x="780" y="179">6</text>
    <text x="860" y="136">0</text>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="170" y="14">v 3</text>
    <text x="48" y="128" text-anchor="end">v 0</text>
    <text x="292" y="128" text-anchor="start">v 6</text>
    <text x="50" y="248">v 1</text>
    <text x="130" y="248">v 5</text>
    <text x="210" y="248">v 2</text>
    <text x="290" y="248">v 1</text>
    <text x="490" y="58">v 0</text>
    <text x="410" y="212">v 1</text>
    <text x="570" y="212">v 5</text>
    <text x="700" y="58">v 6</text>
    <text x="620" y="212">v 2</text>
    <text x="780" y="212">v 1</text>
    <text x="886" y="135" text-anchor="start">v 3</text>
  </g>
  <g fill="#4169E1" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="490" y="244">0 + 1 + 5 = 6</text>
    <text x="700" y="244">6 + 2 + 1 = 9</text>
    <text x="860" y="176">3</text>
  </g>
  <text x="465" y="290" text-anchor="middle" fill="#1a2026" font-size="13.5">cut edges 0–1 and 0–2: sums <tspan fill="#4169E1" font-weight="700">3</tspan>, <tspan fill="#4169E1" font-weight="700">6</tspan>, <tspan fill="#4169E1" font-weight="700">9</tspan> are all divisible by k = 3 → <tspan fill="#4169E1" font-weight="700">3</tspan> components</text>
</svg>
