<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- values=[1,8,1,4,4], k=6; subtree sums: 3:4 merge, 1:12 (12%6=0 cut), 4:4 merge, 2:5 merge, 0:6 root; nodes r=22, chips 44x20 -->
  <text x="24" y="32" fill="#5c6b76" font-size="12.5">values = [1,8,1,4,4], k = 6</text>
  <g font-size="11.5" fill="#5c6b76">
    <rect x="330" y="22" width="12" height="12" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2"/>
    <text x="348" y="32">cut component {1,3} = 12</text>
  </g>
  <!-- tree edges; arrowheads point child to parent; edge 1-2 is cut -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 68 394 L 101 326" marker-end="url(#arrow)"/>
    <path d="M 286 294 L 184 204" marker-end="url(#arrow)"/>
    <path d="M 170 170 L 170 104" marker-end="url(#arrow)"/>
    <path d="M 120.2 286.5 L 136.8 255" stroke-dasharray="5 4"/>
    <path d="M 143.2 243 L 159.8 211.5" stroke-dasharray="5 4"/>
  </g>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="135" y1="244" x2="145" y2="254"/><line x1="145" y1="244" x2="135" y2="254"/>
  </g>
  <text x="112" y="252" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">cut: 12 % 6 = 0</text>
  <g stroke-width="1.6">
    <circle cx="170" cy="78" r="22" fill="#ffffff" stroke="#42525e"/>
    <circle cx="170" cy="192" r="22" fill="#ffffff" stroke="#42525e"/>
    <circle cx="110" cy="306" r="22" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="300" cy="306" r="22" fill="#ffffff" stroke="#42525e"/>
    <circle cx="58" cy="414" r="22" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle">
    <text x="170" y="75" font-weight="600" font-size="13.5" fill="#1a2026">0</text><text x="170" y="91" font-size="10.5" fill="#5c6b76">val 1</text>
    <text x="170" y="189" font-weight="600" font-size="13.5" fill="#1a2026">2</text><text x="170" y="205" font-size="10.5" fill="#5c6b76">val 1</text>
    <text x="110" y="303" font-weight="600" font-size="13.5" fill="#1a2026">1</text><text x="110" y="319" font-size="10.5" fill="#5c6b76">val 8</text>
    <text x="300" y="303" font-weight="600" font-size="13.5" fill="#1a2026">4</text><text x="300" y="319" font-size="10.5" fill="#5c6b76">val 4</text>
    <text x="58" y="411" font-weight="600" font-size="13.5" fill="#1a2026">3</text><text x="58" y="427" font-size="10.5" fill="#5c6b76">val 4</text>
  </g>
  <!-- subtree-sum chips -->
  <g fill="#f0f3f7">
    <rect x="86" y="404" width="44" height="20" rx="4"/>
    <rect x="134" y="296" width="48" height="20" rx="4" stroke="#4169E1" stroke-width="1.4"/>
    <rect x="324" y="296" width="44" height="20" rx="4"/>
    <rect x="196" y="182" width="44" height="20" rx="4"/>
    <rect x="196" y="68" width="44" height="20" rx="4" stroke="#4169E1" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026">
    <text x="108" y="418">&#931; 4</text>
    <text x="158" y="310">&#931; 12</text>
    <text x="346" y="310">&#931; 4</text>
    <text x="218" y="196">&#931; 5</text>
    <text x="218" y="82">&#931; 6</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="6" y="360">4 % 6 &#8800; 0</text>
    <text x="300" y="258">4 % 6 &#8800; 0</text>
    <text x="180" y="140">5 % 6 &#8800; 0</text>
  </g>
  <text x="320" y="448" text-anchor="middle" fill="#1a2026" font-size="13">Subtree 1 finishes at 12 &#8212; 12 % 6 = 0, so its edge is cut; subtree 2's 5 merges up.</text>
  <text x="320" y="466" text-anchor="middle" fill="#1a2026" font-size="13">The root finishes at 6 and closes the last component: 12 and 6 &#8212; <tspan fill="#4169E1" font-weight="600">2</tspan> in total.</text>
</svg>
