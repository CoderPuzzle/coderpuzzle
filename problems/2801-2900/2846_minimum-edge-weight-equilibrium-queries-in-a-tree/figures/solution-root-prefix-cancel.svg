<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="250" fill="#ffffff"/>
  <!-- chain 0..6, edge weights 1,1,1,2,2,2; freq[v][w] = weight-w edges on root-0 path; query (0,6), lca = 0 -->
  <text x="330" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">rooted prefix counts freq[v][w] — weight-w edges from root 0 down to v</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="77" y1="88" x2="133" y2="88"/><line x1="167" y1="88" x2="223" y2="88"/><line x1="257" y1="88" x2="313" y2="88"/>
    <line x1="347" y1="88" x2="403" y2="88"/><line x1="437" y1="88" x2="493" y2="88"/><line x1="527" y1="88" x2="583" y2="88"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="105" y="74" fill="#4169E1">1</text><text x="195" y="74" fill="#4169E1">1</text><text x="285" y="74" fill="#4169E1">1</text>
    <text x="375" y="74" fill="#1a2026">2</text><text x="465" y="74" fill="#1a2026">2</text><text x="555" y="74" fill="#1a2026">2</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="60" cy="88" r="17"/><circle cx="150" cy="88" r="17"/><circle cx="240" cy="88" r="17"/><circle cx="330" cy="88" r="17"/>
    <circle cx="420" cy="88" r="17"/><circle cx="510" cy="88" r="17"/>
  </g>
  <circle cx="600" cy="88" r="17" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600">
    <text x="60" y="93">0</text><text x="150" y="93">1</text><text x="240" y="93">2</text><text x="330" y="93">3</text>
    <text x="420" y="93">4</text><text x="510" y="93">5</text><text x="600" y="93">6</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="60" y="138">1:0  2:0</text><text x="150" y="138">1:1  2:0</text><text x="240" y="138">1:2  2:0</text>
    <text x="330" y="138">1:3  2:0</text><text x="420" y="138">1:3  2:1</text><text x="510" y="138">1:3  2:2</text>
    <text x="600" y="138" fill="#4169E1" font-weight="600">1:3  2:3</text>
  </g>
  <text x="60" y="156" text-anchor="middle" fill="#5c6b76" font-size="11">root · lca</text>
  <text x="600" y="156" text-anchor="middle" fill="#5c6b76" font-size="11">query end</text>
  <text x="330" y="186" text-anchor="middle" fill="#5c6b76" font-size="12.5">query (0,6): count(1) = 0 + 3 − 2·0 = 3 and count(2) = 0 + 3 − 2·0 = 3</text>
  <text x="330" y="214" text-anchor="middle" fill="#1a2026" font-size="13">Six path edges — three 1s, three 2s; keep the majority, rewrite 6 − 3 = <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
  <text x="330" y="236" text-anchor="middle" fill="#1a2026" font-size="13">queries[3] = [0,6] answers <tspan fill="#4169E1" font-weight="600">3</tspan>, the last entry of output [0, 0, 1, 3].</text>
</svg>
