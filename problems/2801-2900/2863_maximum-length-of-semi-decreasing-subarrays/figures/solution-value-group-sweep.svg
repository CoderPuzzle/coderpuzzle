<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [7,6,5,4,3,2,1,6,10,11]; cells 44x34 at x=70+48i, y=48; sweep table rows y=188+22j; min_index hits 0 at value 7, group-6 row is the winner -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">Sort (value, index) pairs by value descending, sweep in equal-value groups:</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="48" width="44" height="34"/><rect x="118" y="48" width="44" height="34"/>
    <rect x="166" y="48" width="44" height="34"/><rect x="214" y="48" width="44" height="34"/>
    <rect x="262" y="48" width="44" height="34"/><rect x="310" y="48" width="44" height="34"/>
    <rect x="358" y="48" width="44" height="34"/><rect x="406" y="48" width="44" height="34"/>
    <rect x="454" y="48" width="44" height="34"/><rect x="502" y="48" width="44" height="34"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="92" y="70">7</text><text x="140" y="70">6</text><text x="188" y="70">5</text>
    <text x="236" y="70">4</text><text x="284" y="70">3</text><text x="332" y="70">2</text>
    <text x="380" y="70">1</text><text x="428" y="70">6</text><text x="476" y="70">10</text>
    <text x="524" y="70">11</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="92" y="98">0</text><text x="140" y="98">1</text><text x="188" y="98">2</text>
    <text x="236" y="98">3</text><text x="284" y="98">4</text><text x="332" y="98">5</text>
    <text x="380" y="98">6</text><text x="428" y="98">7</text><text x="476" y="98">8</text>
    <text x="524" y="98">9</text>
  </g>
  <path d="M 428 104 Q 260 138 92 104" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="260" y="142" text-anchor="middle" fill="#1a2026" font-size="12">6 at index 7 pairs back to 7 at index 0 — length <tspan fill="#4169E1" font-weight="600">8</tspan></text>
  <g fill="#f0f3f7">
    <rect x="84" y="196" width="520" height="20" rx="3"/>
    <rect x="84" y="240" width="520" height="20" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="140" y="166">value</text><text x="252" y="166">positions</text>
    <text x="408" y="166">best length</text><text x="545" y="166">min_index after</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="140" y="192">11</text><text x="252" y="192">9</text><text x="408" y="192" fill="#9aa7b2">—</text><text x="545" y="192">9</text>
    <text x="140" y="214">10</text><text x="252" y="214">8</text><text x="408" y="214" fill="#9aa7b2">—</text><text x="545" y="214">8</text>
    <text x="140" y="236">7</text><text x="252" y="236">0</text><text x="408" y="236" fill="#9aa7b2">—</text><text x="545" y="236" fill="#4169E1" font-weight="600">0</text>
    <text x="140" y="258" fill="#4169E1" font-weight="600">6</text><text x="252" y="258">1, 7</text><text x="408" y="258" fill="#4169E1" font-weight="600">7 - 0 + 1 = 8</text><text x="545" y="258">0</text>
    <text x="140" y="280">5,4,3,2,1</text><text x="252" y="280">2,3,4,5,6</text><text x="408" y="280">3,4,5,6,7</text><text x="545" y="280">0</text>
  </g>
  <text x="320" y="306" text-anchor="middle" fill="#5c6b76" font-size="11.5">group 6 queries both positions before merging — equal values never pair</text>
  <text x="320" y="330" text-anchor="middle" fill="#1a2026" font-size="13">The 6 at index 7 queries before its group merges, so it pairs with 7 at index 0:</text>
  <text x="320" y="348" text-anchor="middle" fill="#1a2026" font-size="13">the best semi-decreasing subarray is nums[0..7], length <tspan fill="#4169E1" font-weight="600">8</tspan>.</text>
</svg>
