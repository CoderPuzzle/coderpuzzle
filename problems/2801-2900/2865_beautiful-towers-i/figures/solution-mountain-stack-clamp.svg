<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="382" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- heights = [6,5,3,9,2,7]; bars 52w at x=70+66i, baseline y=185, 13px per unit; accent bars are the clamped mountain [3,3,3,9,2,2] at peak i=3; left=[6,10,9,18,10,17], right=[21,15,10,13,4,7] -->
  <text x="40" y="28" fill="#5c6b76" font-size="12.5">Clamp every tower toward the peak i = 3 (heights = [6,5,3,9,2,7]):</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="70" y="107" width="52" height="78"/><rect x="136" y="120" width="52" height="65"/>
    <rect x="202" y="146" width="52" height="39"/><rect x="268" y="68" width="52" height="117"/>
    <rect x="334" y="159" width="52" height="26"/><rect x="400" y="94" width="52" height="91"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="70" y="146" width="52" height="39"/><rect x="136" y="146" width="52" height="39"/>
    <rect x="202" y="146" width="52" height="39"/><rect x="268" y="68" width="52" height="117"/>
    <rect x="334" y="159" width="52" height="26"/><rect x="400" y="159" width="52" height="26"/>
  </g>
  <line x1="60" y1="185" x2="462" y2="185" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#9aa7b2" font-size="13">
    <text x="96" y="100">6</text><text x="162" y="113">5</text><text x="228" y="139">3</text>
    <text x="294" y="61">9</text><text x="360" y="152">2</text><text x="426" y="87">7</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">
    <text x="96" y="178">3</text><text x="162" y="178">3</text><text x="228" y="178">3</text>
    <text x="294" y="178">9</text><text x="360" y="178">2</text><text x="426" y="178">2</text>
  </g>
  <text x="294" y="46" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">peak i = 3</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="96" y="203">0</text><text x="162" y="203">1</text><text x="228" y="203">2</text>
    <text x="294" y="203">3</text><text x="360" y="203">4</text><text x="426" y="203">5</text>
  </g>
  <text x="56" y="228" text-anchor="end" fill="#5c6b76" font-size="12">left</text>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="96" y="228">6</text><text x="162" y="228">10</text><text x="228" y="228">9</text>
    <text x="294" y="228" fill="#4169E1" font-weight="600">18</text><text x="360" y="228">10</text><text x="426" y="228">17</text>
  </g>
  <text x="56" y="246" text-anchor="end" fill="#5c6b76" font-size="12">right</text>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="96" y="246">21</text><text x="162" y="246">15</text><text x="228" y="246">10</text>
    <text x="294" y="246" fill="#4169E1" font-weight="600">13</text><text x="360" y="246">4</text><text x="426" y="246">7</text>
  </g>
  <path d="M 70 258 Q 195 272 320 258" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="195" y="288" text-anchor="middle" fill="#1a2026" font-size="12.5">left[3] = 3+3+3+9 = <tspan fill="#4169E1" font-weight="600">18</tspan></text>
  <path d="M 268 300 Q 360 314 452 300" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="360" y="330" text-anchor="middle" fill="#1a2026" font-size="12.5">right[3] = 9+2+2 = <tspan fill="#4169E1" font-weight="600">13</tspan></text>
  <text x="320" y="352" text-anchor="middle" fill="#1a2026" font-size="13">left[3] + right[3] - 9 = 18 + 13 - 9 = <tspan fill="#4169E1" font-weight="600">22</tspan> — the heaviest mountain is [3,3,3,9,2,2].</text>
  <text x="320" y="370" text-anchor="middle" fill="#1a2026" font-size="13">Pops keep the sweeps linear: computing right[2], the (9,1) run pops and 9 clamps to 3.</text>
</svg>
