<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- nums=[2,3,3,7,3,5], k=20; blocks [2*3*3]=18, [7], [3*5]=15; backward products 3-9-18, 7, 5-15; dp prefixes 0,1,1,1,2,3,3; cells 64x44 at x=88+72i, y=84 -->
  <text x="88" y="32" fill="#5c6b76" font-size="12.5">nums = [2,3,3,7,3,5], k = 20</text>
  <g fill="none" stroke-width="1.8">
    <path d="M 88 76 V 68 H 296 V 76" stroke="#4169E1"/>
    <path d="M 304 76 V 68 H 368 V 76" stroke="#9aa7b2"/>
    <path d="M 376 76 V 68 H 512 V 76" stroke="#4169E1"/>
  </g>
  <text x="192" y="56" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">2&#183;3&#183;3 = 18 &#8804; 20</text>
  <text x="336" y="56" text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">7</text>
  <text x="444" y="56" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">3&#183;5 = 15 &#8804; 20</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="88" y="84" width="64" height="44"/><rect x="160" y="84" width="64" height="44"/>
    <rect x="232" y="84" width="64" height="44"/><rect x="304" y="84" width="64" height="44"/>
    <rect x="376" y="84" width="64" height="44"/><rect x="448" y="84" width="64" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="120" y="111">2</text><text x="192" y="111">3</text><text x="264" y="111">3</text>
    <text x="336" y="111">7</text><text x="408" y="111">3</text><text x="480" y="111">5</text>
  </g>
  <text x="24" y="150" fill="#9aa7b2" font-size="11">backward scan</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="192" y="150">3 &#8594; 9 &#8594; 18</text>
    <text x="336" y="150">7</text>
    <text x="444" y="150">5 &#8594; 15</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="88" y1="190" x2="88" y2="197"/><line x1="160" y1="190" x2="160" y2="197"/>
    <line x1="232" y1="190" x2="232" y2="197"/><line x1="304" y1="190" x2="304" y2="197"/>
    <line x1="376" y1="190" x2="376" y2="197"/><line x1="448" y1="190" x2="448" y2="197"/>
    <line x1="520" y1="190" x2="520" y2="197"/>
  </g>
  <text x="60" y="208" text-anchor="middle" fill="#5c6b76" font-size="12.5">dp</text>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="88" y="214">0</text><text x="160" y="214">1</text><text x="232" y="214">1</text>
    <text x="304" y="214">2</text><text x="376" y="214">3</text><text x="448" y="214">3</text>
    <text x="520" y="214" font-size="15" fill="#4169E1">3</text>
  </g>
  <text x="320" y="252" text-anchor="middle" fill="#1a2026" font-size="13">Every block's backward product stays within k &#8212; 18, 7 and 15 &#8804; 20 &#8212; so the six</text>
  <text x="320" y="270" text-anchor="middle" fill="#1a2026" font-size="13">elements pack into three blocks: the minimum final length is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
