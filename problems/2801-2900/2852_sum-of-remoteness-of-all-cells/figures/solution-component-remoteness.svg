<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="520" height="372" fill="#ffffff"/>
  <!-- grid = [[-1,1,-1],[5,-1,4],[-1,3,-1]]; cells 76px at (146,64); four singleton components, S = 13, R = 13 - v -->
  <text x="260" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid = [[-1,1,-1],[5,-1,4],[-1,3,-1]], S = 1+5+4+3 = 13</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="184" y="58">0</text><text x="260" y="58">1</text><text x="336" y="58">2</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="134" y="108">0</text><text x="134" y="184">1</text><text x="134" y="260">2</text>
  </g>
  <g fill="#5c6b76" stroke="#42525e" stroke-width="1.4">
    <rect x="146" y="64" width="76" height="76"/><rect x="298" y="64" width="76" height="76"/>
    <rect x="222" y="140" width="76" height="76"/>
    <rect x="146" y="216" width="76" height="76"/><rect x="298" y="216" width="76" height="76"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="222" y="64" width="76" height="76"/><rect x="146" y="140" width="76" height="76"/><rect x="298" y="140" width="76" height="76"/>
    <rect x="222" y="216" width="76" height="76"/>
  </g>
  <g text-anchor="middle" fill="#dbe4fb" font-size="10.5">
    <text x="184" y="106">-1</text><text x="336" y="106">-1</text><text x="260" y="182">-1</text>
    <text x="184" y="258">-1</text><text x="336" y="258">-1</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="17" fill="#1a2026">
    <text x="260" y="104">1</text><text x="184" y="180">5</text><text x="336" y="180">4</text><text x="260" y="256">3</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="260" y="126">R = 12</text><text x="184" y="202">R = 8</text><text x="336" y="202">R = 9</text><text x="260" y="278">R = 10</text>
  </g>
  <text x="260" y="316" text-anchor="middle" fill="#5c6b76" font-size="12.5">one flood fill per unvisited open cell — four singleton components, none adjacent</text>
  <text x="260" y="344" text-anchor="middle" fill="#1a2026" font-size="13">Every remoteness reads S minus its own component: 12 + 8 + 9 + 10 = <tspan fill="#4169E1" font-weight="600">39</tspan>,</text>
  <text x="260" y="364" text-anchor="middle" fill="#1a2026" font-size="13">blocked cells contribute nothing.</text>
</svg>
