<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n=6, edges=[[1,2],[1,3],[2,4],[3,5],[3,6]]; primes={2,3,5}; exactly-one-prime pairs: (1,2),(1,3),(1,4),(1,6),(2,4),(3,6) -> 6 (verified by enumerating all 15 pairs) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="280" y1="45" x2="170" y2="130"/>
    <line x1="280" y1="45" x2="390" y2="130"/>
    <line x1="170" y1="130" x2="170" y2="215"/>
    <line x1="390" y1="130" x2="340" y2="215"/>
    <line x1="390" y1="130" x2="460" y2="215"/>
  </g>
  <circle cx="280" cy="45" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="170" cy="215" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="460" cy="215" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="170" cy="130" r="21"/>
    <circle cx="390" cy="130" r="21"/>
    <circle cx="340" cy="215" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="280" y="50">1</text>
    <text x="170" y="135">2</text>
    <text x="390" y="135">3</text>
    <text x="170" y="220">4</text>
    <text x="340" y="220">5</text>
    <text x="460" y="220">6</text>
  </g>
  <text x="280" y="252" text-anchor="middle" fill="#1a2026" font-size="13.5">pairs with exactly one prime: (1,2), (1,3), (1,4), (1,6), (2,4), (3,6) → <tspan fill="#4169E1" font-weight="700">6</tspan></text>
</svg>
