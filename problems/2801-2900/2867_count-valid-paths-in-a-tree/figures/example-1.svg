<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n=5, edges=[[1,2],[1,3],[2,4],[2,5]]; primes={2,3,5}; exactly-one-prime pairs: (1,2),(1,3),(1,4),(2,4) -> 4 (verified by enumerating all 10 pairs) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="280" y1="45" x2="160" y2="130"/>
    <line x1="280" y1="45" x2="400" y2="130"/>
    <line x1="400" y1="130" x2="330" y2="215"/>
    <line x1="400" y1="130" x2="470" y2="215"/>
  </g>
  <circle cx="280" cy="45" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="330" cy="215" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="160" cy="130" r="21"/>
    <circle cx="400" cy="130" r="21"/>
    <circle cx="470" cy="215" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="280" y="50">1</text>
    <text x="160" y="135">3</text>
    <text x="400" y="135">2</text>
    <text x="330" y="220">4</text>
    <text x="470" y="220">5</text>
  </g>
  <text x="280" y="252" text-anchor="middle" fill="#1a2026" font-size="13.5">prime nodes shaded — valid pairs (1,2), (1,3), (1,4), (2,4): <tspan fill="#4169E1" font-weight="700">4</tspan> paths</text>
</svg>
