<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="362" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [2,1,3,3,2] circular: cells 56x40 at (132,52), occurrences of 3 accented;
       wrap arrow runs from cell 4 to cell 0; below, the widest arc straightened as
       [3] 4 0 1 [3]: frontiers fill cells 4 and 1 at second 1, cell 0 at second 2 -->
  <text x="320" y="36" text-anchor="middle" fill="#5c6b76" font-size="12.5">value 3 occurs at indices 2 and 3</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="132" y="52" width="56" height="40" fill="#ffffff"/>
    <rect x="212" y="52" width="56" height="40" fill="#ffffff"/>
    <rect x="292" y="52" width="56" height="40" fill="#dbe4fb"/>
    <rect x="372" y="52" width="56" height="40" fill="#dbe4fb"/>
    <rect x="452" y="52" width="56" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="160" y="77">2</text><text x="240" y="77">1</text><text x="320" y="77">3</text>
    <text x="400" y="77">3</text><text x="480" y="77">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="160" y="108">0</text><text x="240" y="108">1</text><text x="320" y="108">2</text>
    <text x="400" y="108">3</text><text x="480" y="108">4</text>
  </g>
  <path d="M 480 112 C 480 142, 456 146, 420 146 L 230 146 C 194 146, 170 142, 170 112" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="141" text-anchor="middle" fill="#5c6b76" font-size="11">wrap-around</text>
  <!-- widest arc, straightened -->
  <text x="320" y="206" text-anchor="middle" fill="#5c6b76" font-size="12.5">widest arc of value 3, straightened (4 steps)</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="200" y="224">second 1</text><text x="440" y="224">second 1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="140" y="228" width="44" height="40" fill="#dbe4fb"/>
    <rect x="216" y="228" width="56" height="40" fill="#f0f3f7"/>
    <rect x="292" y="228" width="56" height="40" fill="#f0f3f7"/>
    <rect x="368" y="228" width="56" height="40" fill="#f0f3f7"/>
    <rect x="456" y="228" width="44" height="40" fill="#dbe4fb"/>
  </g>
  <path d="M 188 248 L 212 248" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M 452 248 L 428 248" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M 320 306 L 320 272" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="332" y="296" fill="#5c6b76" font-size="11">second 2</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="162" y="253">3</text><text x="244" y="253">2</text><text x="320" y="253">2</text>
    <text x="396" y="253">2</text><text x="478" y="253">3</text>
  </g>
  <g fill="#9aa7b2" font-size="9.5">
    <text x="220" y="240">i=4</text><text x="296" y="240">i=0</text><text x="372" y="240">i=1</text>
  </g>
  <text x="320" y="332" text-anchor="middle" fill="#1a2026" font-size="13">Value 3's widest gap is the wrap-around arc of 4 steps; each end fills one</text>
  <text x="320" y="350" text-anchor="middle" fill="#1a2026" font-size="13">cell per second, so it closes in ⌊4 / 2⌋ = <tspan fill="#4169E1" font-weight="600">2</tspan> seconds — the answer.</text>
</svg>
