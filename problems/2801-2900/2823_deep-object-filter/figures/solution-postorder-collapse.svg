<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="354" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- obj = [-1, [-1, -1, 5, -1, 10], -1, [-1], [-5]], fn = x > 0;
       member boxes 96x48 at x = 48 + 112j, y = 118; leaf cells 44x40 at x = 82 + 52k, y = 246;
       leaves fail fn, emptied arrays drop, [5, 10] percolates to the root -->
  <text x="237" y="54" text-anchor="end" fill="#5c6b76" font-size="11.5">root</text>
  <rect x="245" y="30" width="150" height="38" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="320" y="54" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">[[5, 10]]</text>
  <g stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M 96 118 L 268 68"/><path d="M 320 118 L 324 68"/>
    <path d="M 432 118 L 352 68"/><path d="M 544 118 L 380 68"/>
  </g>
  <path d="M 208 118 L 296 68" stroke="#4169E1" stroke-width="2" fill="none"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="48" y="118" width="96" height="48"/><rect x="272" y="118" width="96" height="48"/>
    <rect x="384" y="118" width="96" height="48"/><rect x="496" y="118" width="96" height="48"/>
  </g>
  <rect x="160" y="118" width="96" height="48" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="96" y="139">-1</text><text x="320" y="139">-1</text>
    <text x="432" y="139">[-1]</text><text x="544" y="139">[-5]</text>
    <text x="208" y="139">[5, 10]</text>
  </g>
  <g text-anchor="middle" font-size="9.5" fill="#9aa7b2">
    <text x="96" y="157">fn false, drop</text><text x="320" y="157">fn false, drop</text>
    <text x="432" y="157">emptied, drop</text><text x="544" y="157">emptied, drop</text>
    <text x="208" y="157" fill="#4169E1" font-weight="600">kept (non-empty)</text>
  </g>
  <path d="M 208 242 L 208 172" stroke="#4169E1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="220" y="210" fill="#4169E1" font-size="11.5">survivors rise</text>
  <text x="350" y="262" fill="#5c6b76" font-size="11.5">leaves of the array member,</text>
  <text x="350" y="278" fill="#5c6b76" font-size="11.5">filtered first (post-order)</text>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="#f0f3f7">
    <rect x="82" y="246" width="44" height="40"/><rect x="134" y="246" width="44" height="40"/>
    <rect x="238" y="246" width="44" height="40"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="186" y="246" width="44" height="40"/><rect x="290" y="246" width="44" height="40"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#9aa7b2">
    <text x="104" y="271">-1</text><text x="156" y="271">-1</text><text x="260" y="271">-1</text>
    <text x="208" y="271" font-weight="600" fill="#1a2026">5</text>
    <text x="312" y="271" font-weight="600" fill="#1a2026">10</text>
  </g>
  <g text-anchor="middle" font-size="10">
    <text x="104" y="300" fill="#9aa7b2">drop</text><text x="156" y="300" fill="#9aa7b2">drop</text>
    <text x="260" y="300" fill="#9aa7b2">drop</text>
    <text x="208" y="300" fill="#4169E1">keep</text><text x="312" y="300" fill="#4169E1">keep</text>
  </g>
  <text x="320" y="324" text-anchor="middle" fill="#1a2026" font-size="13">Leaves failing fn and arrays left with nothing are pruned bottom-up;</text>
  <text x="320" y="342" text-anchor="middle" fill="#1a2026" font-size="13">only 5 and 10 percolate up, so the root keeps <tspan fill="#4169E1" font-weight="600">[[5, 10]]</tspan>.</text>
</svg>
