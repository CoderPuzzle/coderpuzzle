<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 386" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="520" height="386" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[1,1,0],[1,1,1],[1,2,1]]; cells 76px at (146,64); donor (2,1) relays (2,1)→(2,2)→(1,2)→(0,2), 3 moves -->
  <text x="260" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid = [[1,1,0],[1,1,1],[1,2,1]]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="184" y="58">0</text><text x="260" y="58">1</text><text x="336" y="58">2</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="134" y="108">0</text><text x="134" y="184">1</text><text x="134" y="260">2</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="146" y="64" width="76" height="76"/><rect x="222" y="64" width="76" height="76"/>
    <rect x="146" y="140" width="76" height="76"/><rect x="222" y="140" width="76" height="76"/><rect x="298" y="140" width="76" height="76"/>
    <rect x="146" y="216" width="76" height="76"/><rect x="298" y="216" width="76" height="76"/>
  </g>
  <rect x="222" y="216" width="76" height="76" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="298" y="64" width="76" height="76" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-weight="600" font-size="17">
    <text x="184" y="108">1</text><text x="260" y="108">1</text>
    <text x="184" y="184">1</text><text x="260" y="184">1</text><text x="336" y="184">1</text>
    <text x="184" y="260">1</text><text x="336" y="260">1</text>
    <text x="260" y="260" fill="#4169E1">2</text>
    <text x="336" y="108" fill="#9aa7b2">0</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 276 254 L 322 254" marker-end="url(#arrow)"/>
    <path d="M 336 238 L 336 198" marker-end="url(#arrow)"/>
    <path d="M 336 160 L 336 120" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="11" font-weight="600">
    <text x="306" y="231">1</text><text x="306" y="155">2</text><text x="306" y="79">3</text>
  </g>
  <text x="260" y="316" text-anchor="middle" fill="#5c6b76" font-size="12.5">donor (2,1) holds the one spare stone; (0,2) is the only empty cell</text>
  <text x="260" y="344" text-anchor="middle" fill="#1a2026" font-size="13">The relay (2,1)→(2,2)→(1,2)→(0,2) moves the surplus stone 3 steps —</text>
  <text x="260" y="366" text-anchor="middle" fill="#1a2026" font-size="13">backtracking's pairing cost |2−0| + |1−2| = <tspan fill="#4169E1" font-weight="600">3</tspan> equals the output.</text>
</svg>
