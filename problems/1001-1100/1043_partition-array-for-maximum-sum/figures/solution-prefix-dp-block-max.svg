<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- arr = [1,15,7,9,2,5,10], k = 3; cells w60 pitch64 from x84; arr row y42, dp row y142; winners row y204 -->
  <g text-anchor="middle">
    <text x="52" y="67" fill="#5c6b76" font-size="13">arr</text>
    <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
      <rect x="84" y="42" width="60" height="40"/><rect x="148" y="42" width="60" height="40"/>
      <rect x="212" y="42" width="60" height="40"/><rect x="276" y="42" width="60" height="40"/>
      <rect x="340" y="42" width="60" height="40"/><rect x="404" y="42" width="60" height="40"/>
      <rect x="468" y="42" width="60" height="40"/>
    </g>
    <g font-weight="600" fill="#1a2026">
      <text x="114" y="67">1</text><text x="178" y="67">15</text><text x="242" y="67">7</text>
      <text x="306" y="67">9</text><text x="370" y="67">2</text><text x="434" y="67">5</text>
      <text x="498" y="67">10</text>
    </g>
    <g fill="#9aa7b2" font-size="11.5">
      <text x="114" y="98">0</text><text x="178" y="98">1</text><text x="242" y="98">2</text>
      <text x="306" y="98">3</text><text x="370" y="98">4</text><text x="434" y="98">5</text>
      <text x="498" y="98">6</text>
    </g>
    <text x="338" y="128" fill="#5c6b76" font-size="12.5">dp[i] = max over j = 1..min(3, i) of dp[i&#8722;j] + (block max) &#215; j</text>
    <text x="52" y="169" fill="#5c6b76" font-size="13">dp</text>
    <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
      <rect x="84" y="142" width="60" height="42"/><rect x="148" y="142" width="60" height="42"/>
      <rect x="212" y="142" width="60" height="42"/><rect x="276" y="142" width="60" height="42"/>
      <rect x="340" y="142" width="60" height="42"/><rect x="404" y="142" width="60" height="42"/>
      <rect x="468" y="142" width="60" height="42"/>
    </g>
    <rect x="532" y="142" width="60" height="42" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <g font-weight="600" font-size="15">
      <text x="114" y="169" fill="#1a2026">0</text><text x="178" y="169" fill="#1a2026">1</text>
      <text x="242" y="169" fill="#1a2026">30</text><text x="306" y="169" fill="#1a2026">45</text>
      <text x="370" y="169" fill="#1a2026">54</text><text x="434" y="169" fill="#1a2026">63</text>
      <text x="498" y="169" fill="#1a2026">72</text><text x="562" y="169" fill="#4169E1">84</text>
    </g>
    <g fill="#5c6b76" font-size="10.5">
      <text x="114" y="204" fill="#9aa7b2">seed</text>
      <text x="178" y="204">dp0+1&#215;1</text><text x="242" y="204">dp0+15&#215;2</text>
      <text x="306" y="204">dp0+15&#215;3</text><text x="370" y="204">dp3+9&#215;1</text>
      <text x="434" y="204">dp3+9&#215;2</text><text x="498" y="204">dp3+9&#215;3</text>
    </g>
    <text x="562" y="204" fill="#4169E1" font-size="10.5" font-weight="600">dp4+10&#215;3</text>
    <text x="84" y="240" fill="#5c6b76" font-size="12" text-anchor="start">the three candidates for dp[7]:</text>
    <g text-anchor="start" font-size="12.5" fill="#5c6b76">
      <text x="84" y="262">j = 1:&#160;&#160;dp[6] + 10&#215;1 = 72 + 10 = 82</text>
      <text x="84" y="282">j = 2:&#160;&#160;dp[5] + 10&#215;2 = 63 + 20 = 83</text>
      <text x="84" y="302" fill="#4169E1" font-weight="600">j = 3:&#160;&#160;dp[4] + 10&#215;3 = 54 + 30 = 84&#160;&#160;&#160;&#171; wins</text>
    </g>
    <text x="40" y="332" fill="#1a2026" font-size="13" text-anchor="start">Each dp[i] keeps the best of its up-to-3 last-block candidates; the winning</text>
    <text x="40" y="350" fill="#1a2026" font-size="13" text-anchor="start">blocks [1,15,7], [9], [2,5,10] score 45 + 9 + 30 = 84 &#8212; the example's answer.</text>
  </g>
</svg>
