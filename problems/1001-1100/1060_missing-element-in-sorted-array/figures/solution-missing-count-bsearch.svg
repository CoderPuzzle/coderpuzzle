<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="244" fill="#ffffff"/>
  <!-- nums=[4,7,9,10], k=1; number line 4..10 as cells 52x40 at x=80+56i; shaded dashed = missing integers 5,6,8; corner number in a present cell = missing(i) -->
  <!-- answer ring on the value 5 -->
  <rect x="133" y="61" width="58" height="46" rx="4" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <text x="162" y="52" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">answer · k = 1</text>
  <!-- number-line cells -->
  <g>
    <rect x="80" y="64" width="52" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <rect x="136" y="64" width="52" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="192" y="64" width="52" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="248" y="64" width="52" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <rect x="304" y="64" width="52" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="360" y="64" width="52" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <rect x="416" y="64" width="52" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="106" y="89" fill="#1a2026">4</text><text x="162" y="89" fill="#9aa7b2">5</text>
    <text x="218" y="89" fill="#9aa7b2">6</text><text x="274" y="89" fill="#1a2026">7</text>
    <text x="330" y="89" fill="#9aa7b2">8</text><text x="386" y="89" fill="#1a2026">9</text>
    <text x="442" y="89" fill="#1a2026">10</text>
  </g>
  <!-- array index of each present cell -->
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="106" y="122">i = 0</text><text x="274" y="122">i = 1</text>
    <text x="386" y="122">i = 2</text><text x="442" y="122">i = 3</text>
  </g>
  <!-- missing(i) corner counts -->
  <g font-size="10.5" fill="#9aa7b2">
    <text x="86" y="77">0</text><text x="254" y="77">2</text>
    <text x="366" y="77">3</text><text x="422" y="77">3</text>
  </g>
  <g font-size="11.5" fill="#5c6b76">
    <text x="484" y="78">missing(i) =</text>
    <text x="484" y="96" font-size="12.5" font-weight="600" fill="#1a2026">0, 2, 3, 3</text>
    <text x="484" y="118">non-decreasing</text>
  </g>
  <text x="320" y="160" text-anchor="middle" fill="#1a2026" font-size="13">missing(i) = nums[i] − nums[0] − i → 0, 2, 3, 3 (non-decreasing);</text>
  <text x="320" y="184" text-anchor="middle" fill="#1a2026" font-size="13">first i with missing(i) ≥ 1: probe i=1 (2 ≥ 1), then i=0 (0 &lt; 1) → lo = 1.</text>
  <text x="320" y="212" text-anchor="middle" fill="#1a2026" font-size="13">Answer = nums[0] + (k − missing(0)) = 4 + (1 − 0) = <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
</svg>
