<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- clumsy(4) = 4 * 3 / 2 + 1; stack cells 56x32, bottoms y=200, column centers 65, 185, 305, 425: [4] -*3-> [12] -/2-> [6] -+1-> [6,1]; result 6 + 1 = 7 at (545,172) -->
  <text x="310" y="36" text-anchor="middle" fill="#1a2026" font-weight="600">clumsy(4) = 4 * 3 / 2 <tspan fill="#4169E1">+ 1</tspan></text>
  <text x="310" y="56" text-anchor="middle" fill="#5c6b76" font-size="12">* and / fold into the stack top; + and - push a new entry</text>
  <!-- seed -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="37" y="168" width="56" height="32"/>
  </g>
  <text x="65" y="189" text-anchor="middle" fill="#1a2026" font-weight="600">4</text>
  <text x="65" y="226" text-anchor="middle" fill="#5c6b76" font-size="12">seed</text>
  <!-- * 3 -->
  <path d="M 101 172 L 147 172" stroke="#42525e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="124" y="160" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">* 3</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="157" y="168" width="56" height="32"/>
  </g>
  <text x="185" y="189" text-anchor="middle" fill="#1a2026" font-weight="600">12</text>
  <!-- / 2 -->
  <path d="M 221 172 L 267 172" stroke="#42525e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="244" y="160" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">/ 2</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="277" y="168" width="56" height="32"/>
  </g>
  <text x="305" y="189" text-anchor="middle" fill="#1a2026" font-weight="600">6</text>
  <!-- + 1 -->
  <path d="M 341 172 L 387 172" stroke="#42525e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="364" y="160" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">+ 1</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="397" y="168" width="56" height="32"/><rect x="397" y="136" width="56" height="32"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="425" y="189">6</text><text x="425" y="157">1</text>
  </g>
  <!-- sum -->
  <path d="M 461 172 L 505 172" stroke="#42525e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="483" y="160" text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">sum</text>
  <text x="545" y="132" text-anchor="middle" fill="#5c6b76" font-size="12.5">6 + 1</text>
  <circle cx="545" cy="172" r="26" fill="#4169E1"/>
  <text x="545" y="178" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">7</text>
  <text x="40" y="258" fill="#1a2026" font-size="13">* and / fold 4 * 3 / 2 into a single stack entry 6; + starts a second, pre-signed</text>
  <text x="40" y="276" fill="#1a2026" font-size="13">entry, and the answer is the stack sum <tspan fill="#4169E1" font-weight="600">6 + 1 = 7</tspan>.</text>
</svg>
