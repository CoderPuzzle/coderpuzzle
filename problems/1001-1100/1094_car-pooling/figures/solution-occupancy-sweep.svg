<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- trips = [[2,1,5],[3,3,7]], capacity = 4; cells 62x36 at x=90+70i; delta row y=56, occupancy row y=150 -->
  <text x="40" y="26" fill="#5c6b76" font-size="13">trips = [[2,1,5],[3,3,7]], capacity = 4</text>
  <!-- delta row -->
  <text x="78" y="80" text-anchor="end" fill="#5c6b76" font-size="12.5">delta</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="90" y="56" width="62" height="36"/><rect x="160" y="56" width="62" height="36"/>
    <rect x="230" y="56" width="62" height="36"/><rect x="300" y="56" width="62" height="36"/>
    <rect x="370" y="56" width="62" height="36"/><rect x="440" y="56" width="62" height="36"/>
    <rect x="510" y="56" width="62" height="36"/><rect x="580" y="56" width="62" height="36"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="121" y="79" fill="#9aa7b2">0</text>
    <text x="191" y="79" fill="#4169E1" font-weight="600">+2</text>
    <text x="261" y="79" fill="#9aa7b2">0</text>
    <text x="331" y="79" fill="#4169E1" font-weight="600">+3</text>
    <text x="401" y="79" fill="#9aa7b2">0</text>
    <text x="471" y="79" fill="#4169E1" font-weight="600">−2</text>
    <text x="541" y="79" fill="#9aa7b2">0</text>
    <text x="611" y="79" fill="#4169E1" font-weight="600">−3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="121" y="112">loc 0</text><text x="191" y="112">loc 1</text>
    <text x="261" y="112">loc 2</text><text x="331" y="112">loc 3</text>
    <text x="401" y="112">loc 4</text><text x="471" y="112">loc 5</text>
    <text x="541" y="112">loc 6</text><text x="611" y="112">loc 7</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="191" y="128">trip A in</text><text x="331" y="128">trip B in</text>
    <text x="471" y="128">trip A out</text><text x="611" y="128">trip B out</text>
  </g>
  <text x="80" y="134" fill="#9aa7b2" font-size="11">sweep east</text>
  <line x1="100" y1="142" x2="632" y2="142" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <!-- running occupancy row -->
  <text x="78" y="173" text-anchor="end" fill="#5c6b76" font-size="12.5">onboard</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="90" y="150" width="62" height="36"/><rect x="160" y="150" width="62" height="36"/>
    <rect x="230" y="150" width="62" height="36"/>
  </g>
  <rect x="300" y="150" width="62" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g stroke="#42525e" stroke-width="1.4" fill="#f0f3f7">
    <rect x="370" y="150" width="62" height="36"/><rect x="440" y="150" width="62" height="36"/>
    <rect x="510" y="150" width="62" height="36"/><rect x="580" y="150" width="62" height="36"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="121" y="173" fill="#1a2026">0</text>
    <text x="191" y="173" fill="#1a2026">2</text>
    <text x="261" y="173" fill="#1a2026">2</text>
    <text x="331" y="173" fill="#4169E1" font-weight="600">5</text>
    <text x="401" y="173" fill="#9aa7b2">5</text>
    <text x="471" y="173" fill="#9aa7b2">3</text>
    <text x="541" y="173" fill="#9aa7b2">3</text>
    <text x="611" y="173" fill="#9aa7b2">0</text>
  </g>
  <line x1="331" y1="244" x2="331" y2="194" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="224" fill="#4169E1" font-size="12.5" font-weight="600">5 &gt; capacity 4 → false</text>
  <text x="40" y="262" fill="#1a2026" font-size="13">Sweeping east, occupancy reaches <tspan fill="#4169E1" font-weight="600">5 riders at location 3</tspan> (2 aboard + 3 boarding) —</text>
  <text x="40" y="280" fill="#1a2026" font-size="13">past capacity 4, so the answer is <tspan fill="#4169E1" font-weight="600">false</tspan>.</text>
</svg>
