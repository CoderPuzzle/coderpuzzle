<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="392" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- left: a 4x4 grid corner, cells 32px, top-left (72,120), y drawn upward; wall (0,3)(1,2)(2,1)(3,0) dark, pocket {(0,0)(0,1)(0,2)(1,0)(1,1)(2,0)} = 6 cells light
       right: example 1 blocked=[[0,1],[1,0]] source=(0,0) target=(0,2); 3x4 grid, cells 36px, top-left (400,120); light (1,2) = target fill's cap-breaking 2nd visited cell -->
  <text x="136" y="104" text-anchor="middle" fill="#5c6b76" font-size="12.5">a diagonal wall of n = 4 blocked cells…</text>
  <g stroke="#42525e" stroke-width="1">
    <rect x="72" y="120" width="32" height="32" fill="#42525e"/>
    <rect x="104" y="120" width="32" height="32" fill="#ffffff"/>
    <rect x="136" y="120" width="32" height="32" fill="#ffffff"/>
    <rect x="168" y="120" width="32" height="32" fill="#ffffff"/>
    <rect x="72" y="152" width="32" height="32" fill="#dbe4fb"/>
    <rect x="104" y="152" width="32" height="32" fill="#42525e"/>
    <rect x="136" y="152" width="32" height="32" fill="#ffffff"/>
    <rect x="168" y="152" width="32" height="32" fill="#ffffff"/>
    <rect x="72" y="184" width="32" height="32" fill="#dbe4fb"/>
    <rect x="104" y="184" width="32" height="32" fill="#dbe4fb"/>
    <rect x="136" y="184" width="32" height="32" fill="#42525e"/>
    <rect x="168" y="184" width="32" height="32" fill="#ffffff"/>
    <rect x="72" y="216" width="32" height="32" fill="#dbe4fb"/>
    <rect x="104" y="216" width="32" height="32" fill="#dbe4fb"/>
    <rect x="136" y="216" width="32" height="32" fill="#dbe4fb"/>
    <rect x="168" y="216" width="32" height="32" fill="#42525e"/>
  </g>
  <text x="136" y="268" text-anchor="middle" fill="#5c6b76" font-size="12.5">seals a staircase pocket of at most</text>
  <text x="136" y="286" text-anchor="middle" fill="#5c6b76" font-size="12.5">n(n−1)/2 = <tspan fill="#4169E1" font-weight="600">6</tspan> open cells</text>
  <line x1="356" y1="96" x2="356" y2="300" stroke="#dbe4fb" stroke-width="2"/>
  <!-- example 1 -->
  <text x="454" y="90" text-anchor="middle" fill="#5c6b76" font-size="12.5">example 1: blocked = [[0, 1], [1, 0]]</text>
  <text x="454" y="108" text-anchor="middle" fill="#5c6b76" font-size="12.5">cap = n(n−1)/2 = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <g stroke="#42525e" stroke-width="1">
    <rect x="400" y="120" width="36" height="36" fill="#ffffff"/>
    <rect x="436" y="120" width="36" height="36" fill="#ffffff"/>
    <rect x="472" y="120" width="36" height="36" fill="#ffffff"/>
    <rect x="400" y="156" width="36" height="36" fill="#ffffff"/>
    <rect x="436" y="156" width="36" height="36" fill="#dbe4fb"/>
    <rect x="472" y="156" width="36" height="36" fill="#ffffff"/>
    <rect x="400" y="192" width="36" height="36" fill="#42525e"/>
    <rect x="436" y="192" width="36" height="36" fill="#ffffff"/>
    <rect x="472" y="192" width="36" height="36" fill="#ffffff"/>
    <rect x="400" y="228" width="36" height="36" fill="#4169E1"/>
    <rect x="436" y="228" width="36" height="36" fill="#42525e"/>
    <rect x="472" y="228" width="36" height="36" fill="#ffffff"/>
  </g>
  <rect x="400" y="156" width="36" height="36" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <line x1="400" y1="120" x2="400" y2="264" stroke="#1a2026" stroke-width="2.5"/>
  <line x1="400" y1="264" x2="508" y2="264" stroke="#1a2026" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="418" y="251" fill="#ffffff">S</text>
    <text x="418" y="179" fill="#4169E1">T</text>
  </g>
  <g font-size="12.5" fill="#1a2026">
    <text x="400" y="288">source fill: 1 visited ≤ cap 1 → <tspan fill="#4169E1" font-weight="600">sealed</tspan></text>
    <text x="400" y="306">target fill: 2 &gt; 1 → <tspan fill="#4169E1" font-weight="600">free</tspan></text>
  </g>
  <rect x="400" y="320" width="76" height="30" rx="6" fill="#dbe4fb"/>
  <text x="438" y="340" text-anchor="middle" fill="#4169E1" font-weight="700" font-size="15">false</text>
  <text x="340" y="366" text-anchor="middle" fill="#1a2026" font-size="13">The source fill stalls at 1 visited cell, the target fill passes the cap on its second</text>
  <text x="340" y="384" text-anchor="middle" fill="#1a2026" font-size="13">cell — one trapped fill decides it: the maze returns <tspan fill="#4169E1" font-weight="600">false</tspan>.</text>
</svg>
