<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="344" fill="#ffffff"/>
  <!-- tree [1,0,1,0,1,0,1]; (node, running) walk: value = running*2 + bit; leaves emit 4, 5, 6, 7; total 22; midway stack bottom->top = (0,1),(0,3),(1,3) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="323" y1="77" x2="232" y2="135"/>
    <line x1="357" y1="77" x2="448" y2="135"/>
    <line x1="202" y1="162" x2="163" y2="211"/>
    <line x1="228" y1="162" x2="267" y2="211"/>
    <line x1="452" y1="162" x2="413" y2="211"/>
    <line x1="478" y1="162" x2="517" y2="211"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="340" cy="66" r="20"/>
    <circle cx="215" cy="146" r="20"/>
    <circle cx="465" cy="146" r="20"/>
  </g>
  <g fill="#4169E1">
    <circle cx="150" cy="226" r="20"/>
    <circle cx="280" cy="226" r="20"/>
    <circle cx="400" cy="226" r="20"/>
    <circle cx="530" cy="226" r="20"/>
  </g>
  <g text-anchor="middle">
    <text x="340" y="71">1</text><text x="215" y="151">0</text><text x="465" y="151">1</text>
    <text x="150" y="231" fill="#ffffff">0</text><text x="280" y="231" fill="#ffffff">1</text>
    <text x="400" y="231" fill="#ffffff">0</text><text x="530" y="231" fill="#ffffff">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="340" y="106">running 1</text>
    <text x="215" y="186">10 = 2</text>
    <text x="465" y="186">11 = 3</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="150" y="266" fill="#5c6b76">100 = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
    <text x="280" y="266" fill="#5c6b76">101 = <tspan fill="#4169E1" font-weight="600">5</tspan></text>
    <text x="400" y="266" fill="#5c6b76">110 = <tspan fill="#4169E1" font-weight="600">6</tspan></text>
    <text x="530" y="266" fill="#5c6b76">111 = <tspan fill="#4169E1" font-weight="600">7</tspan></text>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="40" y="140">each pop appends</text>
    <text x="40" y="156">the node's bit:</text>
    <text x="40" y="200">a leaf adds its</text>
    <text x="40" y="216">value to the total</text>
  </g>
  <text x="40" y="176" fill="#1a2026" font-size="12.5" font-weight="600">running*2 + bit</text>
  <text x="578" y="90" fill="#5c6b76" font-size="12.5">stack midway</text>
  <text x="578" y="104" fill="#5c6b76" font-size="11.5">(node, running):</text>
  <g stroke="#42525e" stroke-width="1.3" fill="#dbe4fb">
    <rect x="578" y="112" width="86" height="26"/>
    <rect x="578" y="142" width="86" height="26"/>
    <rect x="578" y="172" width="86" height="26"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12">
    <text x="621" y="129">(1, 3)</text>
    <text x="621" y="159">(0, 3)</text>
    <text x="621" y="189">(0, 1)</text>
  </g>
  <text x="578" y="214" fill="#5c6b76" font-size="11.5">top pops next</text>
  <text x="340" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Each leaf's path value: 100 → 4, 101 → 5, 110 → 6, 111 → 7;</text>
  <text x="340" y="326" text-anchor="middle" fill="#1a2026" font-size="13">the stack walk sums them to <tspan fill="#4169E1" font-weight="600">22</tspan>.</text>
</svg>
