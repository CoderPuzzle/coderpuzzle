<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 398" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="398" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- pairs (s1[i], s2[i]) = (p,m)(a,o)(r,r)(k,r)(e,i)(r,s); unions attach the larger root under the smaller,
       giving components {m,p} {a,o} {k,r,s} {e,i} rooted at m,a,k,e; baseStr "parser" maps to "makkek".
       pair chips 64x26 at y=34; tree boxes 36x32 (roots y=110, children y=178); mapping cells 34x30 (y=264, y=316) -->
  <text x="330" y="24" text-anchor="middle" fill="#5c6b76" font-size="12.5">Equivalent pairs from s1 = "parker", s2 = "morris", unioned in order</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="113" y="34" width="64" height="26"/><rect x="187" y="34" width="64" height="26"/>
    <rect x="261" y="34" width="64" height="26" stroke="#9aa7b2"/><rect x="335" y="34" width="64" height="26"/>
    <rect x="409" y="34" width="64" height="26"/><rect x="483" y="34" width="64" height="26"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="145" y="51">p ≡ m</text><text x="219" y="51">a ≡ o</text>
    <text x="293" y="51" fill="#9aa7b2">r ≡ r</text><text x="367" y="51">k ≡ r</text>
    <text x="441" y="51">e ≡ i</text><text x="515" y="51">r ≡ s</text>
  </g>
  <text x="293" y="73" text-anchor="middle" fill="#9aa7b2" font-size="10.5">self pair, no union</text>
  <text x="330" y="98" text-anchor="middle" fill="#5c6b76" font-size="12.5">Components after all unions — each root is the smallest letter</text>
  <!-- trees: root above, children below -->
  <g>
    <rect x="132" y="110" width="36" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="242" y="110" width="36" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="372" y="110" width="36" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="492" y="110" width="36" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="150" y="131">m</text><text x="260" y="131">a</text><text x="390" y="131">k</text><text x="510" y="131">e</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="132" y="178" width="36" height="32"/><rect x="242" y="178" width="36" height="32"/>
    <rect x="346" y="178" width="36" height="32"/><rect x="398" y="178" width="36" height="32"/>
    <rect x="492" y="178" width="36" height="32"/>
  </g>
  <g text-anchor="middle" font-size="15">
    <text x="150" y="199">p</text><text x="260" y="199">o</text>
    <text x="364" y="199">r</text><text x="416" y="199">s</text><text x="510" y="199">i</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 150 144 L 150 175" marker-end="url(#arrow)"/>
    <path d="M 260 144 L 260 175" marker-end="url(#arrow)"/>
    <path d="M 390 144 L 364 175" marker-end="url(#arrow)"/>
    <path d="M 390 144 L 416 175" marker-end="url(#arrow)"/>
    <path d="M 510 144 L 510 175" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="150" y="232">[m, p]</text><text x="260" y="232">[a, o]</text>
    <text x="390" y="232">[k, r, s]</text><text x="510" y="232">[e, i]</text>
  </g>
  <!-- baseStr mapping -->
  <text x="330" y="258" text-anchor="middle" fill="#5c6b76" font-size="12.5">Each baseStr letter maps to its component's root</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="208" y="264" width="34" height="30"/><rect x="250" y="264" width="34" height="30"/>
    <rect x="292" y="264" width="34" height="30"/><rect x="334" y="264" width="34" height="30"/>
    <rect x="376" y="264" width="34" height="30"/><rect x="418" y="264" width="34" height="30"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="225" y="284">p</text><text x="267" y="284">a</text><text x="309" y="284">r</text>
    <text x="351" y="284">s</text><text x="393" y="284">e</text><text x="435" y="284">r</text>
  </g>
  <g fill="none" stroke-width="1.6">
    <path d="M 225 296 L 225 313" stroke="#4169E1" marker-end="url(#arrowB)"/>
    <path d="M 267 296 L 267 313" stroke="#9aa7b2" marker-end="url(#arrowM)"/>
    <path d="M 309 296 L 309 313" stroke="#4169E1" marker-end="url(#arrowB)"/>
    <path d="M 351 296 L 351 313" stroke="#4169E1" marker-end="url(#arrowB)"/>
    <path d="M 393 296 L 393 313" stroke="#9aa7b2" marker-end="url(#arrowM)"/>
    <path d="M 435 296 L 435 313" stroke="#4169E1" marker-end="url(#arrowB)"/>
  </g>
  <g>
    <rect x="208" y="316" width="34" height="30" fill="#ffffff" stroke="#4169E1" stroke-width="1.3"/>
    <rect x="250" y="316" width="34" height="30" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="292" y="316" width="34" height="30" fill="#ffffff" stroke="#4169E1" stroke-width="1.3"/>
    <rect x="334" y="316" width="34" height="30" fill="#ffffff" stroke="#4169E1" stroke-width="1.3"/>
    <rect x="376" y="316" width="34" height="30" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <rect x="418" y="316" width="34" height="30" fill="#ffffff" stroke="#4169E1" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="225" y="336">m</text><text x="267" y="336">a</text><text x="309" y="336">k</text>
    <text x="351" y="336">k</text><text x="393" y="336">e</text><text x="435" y="336">k</text>
  </g>
  <text x="330" y="372" text-anchor="middle" fill="#1a2026" font-size="13">Every letter joins the group of its smallest member: parser becomes <tspan fill="#4169E1" font-weight="600">makkek</tspan>.</text>
  <text x="330" y="390" text-anchor="middle" fill="#1a2026" font-size="13">p, r and s change to their roots m and k; a and e are already the smallest.</text>
</svg>
