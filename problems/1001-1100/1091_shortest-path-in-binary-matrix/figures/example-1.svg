<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 204" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[0,1],[1,0]]: corner-adjacent steps are allowed -->
  <rect x="100" y="36" width="56" height="56" fill="#e5ebfa"/>
  <rect x="184" y="120" width="56" height="56" fill="#e5ebfa"/>
  <g stroke="#b9c4cd" stroke-width="1" fill="none">
    <rect x="100" y="36" width="140" height="140"/>
    <line x1="184" y1="36" x2="184" y2="176"/>
    <line x1="100" y1="120" x2="240" y2="120"/>
  </g>
  <line x1="128" y1="64" x2="176" y2="112" stroke="#4169E1" stroke-width="3" marker-end="url(#pa)"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="128" y="70">0</text>
    <text x="212" y="70">1</text>
    <text x="128" y="154">1</text>
    <text x="212" y="154">0</text>
  </g>
  <text x="170" y="196" text-anchor="middle" fill="#5c6b76" font-size="12.5">one diagonal step joins (0,0) to (1,1), so the path has length 2</text>
</svg>
