<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 222" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[0,0,0],[1,1,0],[1,1,0]]: right, diagonal, down -->
  <g fill="#e5ebfa">
    <rect x="80" y="32" width="52" height="52"/>
    <rect x="132" y="32" width="52" height="52"/>
    <rect x="184" y="84" width="52" height="52"/>
    <rect x="184" y="136" width="52" height="52"/>
  </g>
  <g stroke="#b9c4cd" stroke-width="1" fill="none">
    <rect x="80" y="32" width="156" height="156"/>
    <line x1="132" y1="32" x2="132" y2="188"/>
    <line x1="184" y1="32" x2="184" y2="188"/>
    <line x1="80" y1="84" x2="236" y2="84"/>
    <line x1="80" y1="136" x2="236" y2="136"/>
  </g>
  <polyline points="106,58 148,58 202,102 210,150" fill="none" stroke="#4169E1" stroke-width="3" marker-end="url(#pa)"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="106" y="64">0</text><text x="158" y="64">0</text><text x="210" y="64">0</text>
    <text x="106" y="116">1</text><text x="158" y="116">1</text><text x="210" y="116">0</text>
    <text x="106" y="168">1</text><text x="158" y="168">1</text><text x="210" y="168">0</text>
  </g>
  <text x="190" y="214" text-anchor="middle" fill="#5c6b76" font-size="12.5">right, then diagonally, then down: the path visits 4 cells</text>
</svg>
