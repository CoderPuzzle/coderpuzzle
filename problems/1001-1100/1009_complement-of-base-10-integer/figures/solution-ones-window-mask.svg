<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 5 = 0b101; bit cells 40x34 at x = 200 + 40j (columns 8 4 2 1); mask rows grow 1, 3, 7 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="220" y="54">8</text><text x="260" y="54">4</text><text x="300" y="54">2</text><text x="340" y="54">1</text>
  </g>
  <text x="186" y="88" text-anchor="end" fill="#5c6b76" font-size="12.5">n = 5</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="200" y="66" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="240" y="66" width="40" height="34" fill="#ffffff"/>
    <rect x="280" y="66" width="40" height="34" fill="#ffffff"/>
    <rect x="320" y="66" width="40" height="34" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="260" y="88">1</text><text x="300" y="88">0</text><text x="340" y="88">1</text>
  </g>
  <text x="186" y="134" text-anchor="end" fill="#5c6b76" font-size="12.5">mask = 1</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="200" y="112" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="240" y="112" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="280" y="112" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="320" y="112" width="40" height="34" fill="#ffffff"/>
  </g>
  <text x="340" y="134" text-anchor="middle" fill="#1a2026">1</text>
  <text x="376" y="134" fill="#5c6b76" font-size="12">1 &lt; 5 → grow</text>
  <text x="186" y="180" text-anchor="end" fill="#5c6b76" font-size="12.5">mask = 3</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="200" y="158" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="240" y="158" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="280" y="158" width="40" height="34" fill="#ffffff"/>
    <rect x="320" y="158" width="40" height="34" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="300" y="180">1</text><text x="340" y="180">1</text>
  </g>
  <text x="376" y="180" fill="#5c6b76" font-size="12">3 &lt; 5 → grow</text>
  <text x="186" y="226" text-anchor="end" fill="#5c6b76" font-size="12.5">mask = 7</text>
  <g stroke="#4169E1" stroke-width="1.6">
    <rect x="200" y="204" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="240" y="204" width="40" height="34" fill="#dbe4fb"/>
    <rect x="280" y="204" width="40" height="34" fill="#dbe4fb"/>
    <rect x="320" y="204" width="40" height="34" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600">
    <text x="260" y="226">1</text><text x="300" y="226">1</text><text x="340" y="226">1</text>
  </g>
  <text x="376" y="226" fill="#5c6b76" font-size="12">7 ≥ 5 → stop</text>
  <path d="M 340 242 L 340 252" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="186" y="278" text-anchor="end" fill="#5c6b76" font-size="12.5">5 ^ 7</text>
  <g stroke="#4169E1" stroke-width="1.6">
    <rect x="200" y="256" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="240" y="256" width="40" height="34" fill="#dbe4fb"/>
    <rect x="280" y="256" width="40" height="34" fill="#dbe4fb"/>
    <rect x="320" y="256" width="40" height="34" fill="#dbe4fb"/>
  </g>
  <text x="220" y="278" text-anchor="middle" fill="#9aa7b2" font-size="12">0</text>
  <g text-anchor="middle" fill="#4169E1" font-weight="600">
    <text x="260" y="278">0</text><text x="300" y="278">1</text><text x="340" y="278">0</text>
  </g>
  <text x="376" y="278" fill="#4169E1" font-size="14" font-weight="600">= 010 = 2</text>
  <text x="280" y="324" text-anchor="middle" fill="#1a2026" font-size="13">The grown mask stops at 111: 101 ^ 111 = 010.</text>
  <text x="280" y="346" text-anchor="middle" fill="#1a2026" font-size="13">Exactly the three window bits flip — the complement is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
