<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- values = [1,2,3] clockwise from the top; n - 2 = 1 triangle -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <path d="M 200 40 L 290 180 L 110 180 z"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="200" cy="40" r="17"/>
    <circle cx="290" cy="180" r="17"/>
    <circle cx="110" cy="180" r="17"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="200" y="45">1</text>
    <text x="290" y="185">2</text>
    <text x="110" y="185">3</text>
  </g>
  <text x="200" y="228" text-anchor="middle" fill="#5c6b76" font-size="12.5">a triangle needs no cuts: its score is 1 x 2 x 3 = 6</text>
</svg>
