<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="316" fill="#ffffff"/>
  <!-- values = [3,7,4,5]; squares: v0=3 top-left, v1=7 top-right, v2=4 bottom-right, v3=5 bottom-left; sq1 x 90-210, sq2 x 410-530, y 64-184; shaded triangle = the splitting triangle (0,k,3) on edge (0,3) -->
  <text x="340" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">values = [3, 7, 4, 5] — split the closing edge (0, 3) at each third vertex k</text>
  <!-- k = 1 square: splitting triangle (0,1,3), diagonal (1,3) -->
  <polygon points="90,64 210,64 90,184" fill="#f0f3f7"/>
  <rect x="90" y="64" width="120" height="120" fill="none" stroke="#42525e" stroke-width="1.6"/>
  <line x1="210" y1="64" x2="90" y2="184" stroke="#9aa7b2" stroke-width="1.6"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">
    <text x="76" y="56">3</text><text x="224" y="56">7</text><text x="224" y="200">4</text><text x="76" y="200">5</text>
    <text x="130" y="110">105</text><text x="170" y="150">140</text>
  </g>
  <!-- k = 2 square: splitting triangle (0,2,3), diagonal (0,2) -->
  <polygon points="410,64 530,184 410,184" fill="#dbe4fb"/>
  <rect x="410" y="64" width="120" height="120" fill="none" stroke="#42525e" stroke-width="1.6"/>
  <line x1="410" y1="64" x2="530" y2="184" stroke="#4169E1" stroke-width="2.2"/>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <text x="396" y="56" fill="#5c6b76">3</text><text x="544" y="56" fill="#5c6b76">7</text>
    <text x="544" y="200" fill="#5c6b76">4</text><text x="396" y="200" fill="#5c6b76">5</text>
    <text x="490" y="110" fill="#5c6b76">84</text><text x="450" y="150" fill="#4169E1">60</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#5c6b76">
    <text x="150" y="216">k = 1: dp[0][1] + dp[1][3] + 3·7·5 = 245</text>
    <text x="470" y="216">k = 2: dp[0][2] + dp[2][3] + 3·4·5 = <tspan fill="#4169E1" font-weight="700">144</tspan></text>
  </g>
  <text x="340" y="248" text-anchor="middle" fill="#1a2026" font-size="15" font-weight="600">dp[0][3] = min(245, 144) = <tspan fill="#4169E1">144</tspan></text>
  <text x="340" y="278" text-anchor="middle" fill="#1a2026" font-size="13">Splitting at k = 2 pays only 3·4·5 = 60 on top of the already-final dp[0][2] = 84,</text>
  <text x="340" y="296" text-anchor="middle" fill="#1a2026" font-size="13">while k = 1 must buy the costlier sub-polygon dp[1][3] = 140.</text>
</svg>
