<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- s = "bcabc"; last = {b:3, c:4, a:2}; stack states around i = 2 where 'a' pops c then b -->
  <!-- s cells -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="82" y="36" width="56" height="44"/><rect x="162" y="36" width="56" height="44"/>
    <rect x="322" y="36" width="56" height="44"/><rect x="402" y="36" width="56" height="44"/>
  </g>
  <rect x="242" y="36" width="56" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="110" y="64">b</text><text x="190" y="64">c</text><text x="270" y="64">a</text>
    <text x="350" y="64">b</text><text x="430" y="64">c</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="110" y="98">i = 0</text><text x="190" y="98">i = 1</text><text x="270" y="98">i = 2</text>
    <text x="350" y="98">i = 3</text><text x="430" y="98">i = 4</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="110" y="115">last 3</text><text x="190" y="115">last 4</text><text x="270" y="115">last 2</text>
    <text x="350" y="115">last 3</text><text x="430" y="115">last 4</text>
  </g>
  <!-- stack before: [b, c] with c on top -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="78" y="130" width="64" height="34"/><rect x="78" y="170" width="64" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="110" y="152">c</text><text x="110" y="192">b</text>
  </g>
  <!-- pop arrows: c first, then b, into ghost boxes -->
  <g stroke="#5c6b76" stroke-width="1.4" fill="none">
    <line x1="148" y1="147" x2="210" y2="147" marker-end="url(#arrow)"/>
    <line x1="148" y1="187" x2="210" y2="187" marker-end="url(#arrow)"/>
    <line x1="288" y1="187" x2="350" y2="187" marker-end="url(#arrow)"/>
    <line x1="428" y1="187" x2="490" y2="187" marker-end="url(#arrow)"/>
  </g>
  <!-- popped ghosts: both reoccur later -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3">
    <rect x="218" y="130" width="64" height="34"/><rect x="218" y="170" width="64" height="34"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#9aa7b2">
    <text x="250" y="152">c</text><text x="250" y="192">b</text>
  </g>
  <!-- stack after the pops: a is pushed -->
  <rect x="358" y="170" width="64" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="390" y="192" text-anchor="middle" font-weight="600" font-size="14">a</text>
  <!-- final stack reads a, b, c bottom to top -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="498" y="90" width="64" height="34"/><rect x="498" y="130" width="64" height="34"/>
    <rect x="498" y="170" width="64" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="530" y="112">c</text><text x="530" y="152">b</text><text x="530" y="192">a</text>
  </g>
  <text x="530" y="226" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="14">= "abc"</text>
  <g text-anchor="middle" font-size="12">
    <text x="110" y="252" fill="#5c6b76">stack at i = 2</text>
    <text x="250" y="252" fill="#4169E1" font-weight="600">pop c, then b</text>
    <text x="390" y="252" fill="#5c6b76">push a</text>
    <text x="530" y="252" fill="#5c6b76">final stack</text>
  </g>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">At i = 2, a <tspan fill="#4169E1" font-weight="600">pops c then b</tspan> — last[c] = 4 and last[b] = 3, so both reoccur later.</text>
  <text x="320" y="320" text-anchor="middle" fill="#1a2026" font-size="13">Every other step just pushes; the stack ends a, b, c — <tspan fill="#4169E1" font-weight="600">"abc"</tspan>, the smallest answer.</text>
</svg>
