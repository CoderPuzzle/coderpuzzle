<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="336" fill="#ffffff"/>
  <!-- nums = [1,4,2,5,3]; stack holds indices, drawn as value + index; pops bank i-j:
       i=2 pops index 1 (+1), i=4 pops index 3 (+1), sentinel i=5 pops 4,2,0 (+1+3+5) = 11.
       array cells 56x44 at y=36; stack boxes 46x30, levels at y=222/190/158; floors y=256 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="152" y="36" width="56" height="44"/><rect x="216" y="36" width="56" height="44"/>
    <rect x="280" y="36" width="56" height="44"/><rect x="344" y="36" width="56" height="44"/>
    <rect x="408" y="36" width="56" height="44"/>
    <rect x="472" y="36" width="56" height="44" fill="#f0f3f7" stroke="#9aa7b2" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="180" y="57">1</text><text x="244" y="57">4</text><text x="308" y="57">2</text>
    <text x="372" y="57">5</text><text x="436" y="57">3</text><text x="500" y="57" fill="#5c6b76">−1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="180" y="73">i = 0</text><text x="244" y="73">i = 1</text><text x="308" y="73">i = 2</text>
    <text x="372" y="73">i = 3</text><text x="436" y="73">i = 4</text><text x="500" y="73">i = 5</text>
  </g>
  <text x="500" y="28" text-anchor="middle" fill="#5c6b76" font-size="10.5">sentinel</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="65" y="106">i = 0</text><text x="170" y="106">i = 1</text><text x="275" y="106">i = 2</text>
    <text x="380" y="106">i = 3</text><text x="485" y="106">i = 4</text><text x="590" y="106">i = 5</text>
  </g>
  <g text-anchor="middle" font-size="11.5">
    <text x="65" y="128" fill="#5c6b76">push 1</text><text x="170" y="128" fill="#5c6b76">push 4</text>
    <text x="275" y="128" fill="#42525e">pop 4</text><text x="380" y="128" fill="#5c6b76">push 5</text>
    <text x="485" y="128" fill="#42525e">pop 5</text><text x="590" y="128" fill="#42525e">pop 3, 2, 1</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="15">
    <text x="275" y="150">+1</text><text x="485" y="150">+1</text><text x="590" y="150">+1+3+5</text>
  </g>
  <!-- stack snapshots, bottom box = stack bottom -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="42" y="222" width="46" height="30"/>
    <rect x="147" y="222" width="46" height="30"/><rect x="147" y="190" width="46" height="30"/>
    <rect x="252" y="222" width="46" height="30"/><rect x="252" y="190" width="46" height="30"/>
    <rect x="357" y="222" width="46" height="30"/><rect x="357" y="190" width="46" height="30"/><rect x="357" y="158" width="46" height="30"/>
    <rect x="462" y="222" width="46" height="30"/><rect x="462" y="190" width="46" height="30"/><rect x="462" y="158" width="46" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="65" y="235">1</text>
    <text x="170" y="235">1</text><text x="170" y="203">4</text>
    <text x="275" y="235">1</text><text x="275" y="203">2</text>
    <text x="380" y="235">1</text><text x="380" y="203">2</text><text x="380" y="171">5</text>
    <text x="485" y="235">1</text><text x="485" y="203">2</text><text x="485" y="171">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="9.5">
    <text x="65" y="248">i=0</text>
    <text x="170" y="248">i=0</text><text x="170" y="216">i=1</text>
    <text x="275" y="248">i=0</text><text x="275" y="216">i=2</text>
    <text x="380" y="248">i=0</text><text x="380" y="216">i=2</text><text x="380" y="184">i=3</text>
    <text x="485" y="248">i=0</text><text x="485" y="216">i=2</text><text x="485" y="184">i=4</text>
  </g>
  <text x="590" y="243" text-anchor="middle" fill="#9aa7b2" font-size="11">empty</text>
  <g stroke="#9aa7b2" stroke-width="1">
    <path d="M 35 256 H 95"/><path d="M 140 256 H 200"/><path d="M 245 256 H 305"/>
    <path d="M 350 256 H 410"/><path d="M 455 256 H 515"/><path d="M 560 256 H 620"/>
  </g>
  <text x="340" y="282" text-anchor="middle" fill="#1a2026" font-size="13">Banks 1 + 1 + 1 + 3 + 5 = <tspan fill="#4169E1" font-weight="600">11</tspan> valid subarrays.</text>
  <text x="340" y="306" text-anchor="middle" fill="#1a2026" font-size="13">The stack holds indices still waiting for a smaller value; popping index j at i</text>
  <text x="340" y="324" text-anchor="middle" fill="#1a2026" font-size="13">banks i − j runs, and the sentinel −1 at position 5 flushes the rest in one pass.</text>
</svg>
