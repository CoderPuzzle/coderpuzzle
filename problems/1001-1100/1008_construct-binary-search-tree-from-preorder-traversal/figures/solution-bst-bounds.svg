  <text x="40" y="286" fill="#5c6b76" font-size="12">preorder = [8, 5, 1, 7, 10, 12]: each node is claimed only if it fits the open</text>
  <text x="40" y="304" fill="#5c6b76" font-size="12">bound pair; the left call tightens to (low, v&#8722;1), the right to (v+1, high).</text>
  <text x="40" y="322" fill="#5c6b76" font-size="12">A peeked value outside the bounds belongs to an ancestor&#8217;s right subtree.</text>
