  <circle cx="300" cy="44" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="300" y="49" text-anchor="middle" font-weight="600">8</text>
  <text x="300" y="78" text-anchor="middle" fill="#4169E1" font-size="11">(&#8722;&#8734;, +&#8734;)</text>
  <circle cx="180" cy="124" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="180" y="129" text-anchor="middle" font-weight="600">5</text>
  <text x="180" y="158" text-anchor="middle" fill="#4169E1" font-size="11">(&#8722;&#8734;, 7)</text>
  <circle cx="100" cy="204" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="100" y="209" text-anchor="middle" font-weight="600">1</text>
  <text x="100" y="238" text-anchor="middle" fill="#4169E1" font-size="11">(&#8722;&#8734;, 4)</text>
  <circle cx="260" cy="204" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="260" y="209" text-anchor="middle" font-weight="600">7</text>
  <text x="260" y="238" text-anchor="middle" fill="#4169E1" font-size="11">(6, 7)</text>
  <circle cx="420" cy="124" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="420" y="129" text-anchor="middle" font-weight="600">10</text>
