<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 232" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- preorder = [8,5,1,7,10,12] -> [8,5,10,1,7,null,12] -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="223.9" y1="47.9" x2="160.1" y2="95.1"/>
    <line x1="256.1" y1="47.9" x2="319.9" y2="95.1"/>
    <line x1="127.4" y1="125.5" x2="95.7" y2="164.6"/>
    <line x1="152.6" y1="125.5" x2="184.3" y2="164.6"/>
    <line x1="352.6" y1="125.5" x2="384.3" y2="164.6"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="240" cy="36" r="20"/>
    <circle cx="140" cy="110" r="20"/>
    <circle cx="340" cy="110" r="20"/>
    <circle cx="80" cy="184" r="20"/>
    <circle cx="200" cy="184" r="20"/>
    <circle cx="400" cy="184" r="20"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="240" y="41">8</text>
    <text x="140" y="115">5</text>
    <text x="340" y="115">10</text>
    <text x="80" y="189">1</text>
    <text x="200" y="189">7</text>
    <text x="400" y="189">12</text>
  </g>
  <text x="240" y="224" text-anchor="middle" fill="#5c6b76" font-size="12.5">reading the preorder array left to right rebuilds exactly this BST</text>
</svg>
