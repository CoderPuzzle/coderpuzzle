<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 338" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<rect x="70" y="60" width="58" height="40" fill="#ffffff" stroke="#1a2026"/><text x="99.0" y="85" text-anchor="middle" font-weight="600">1</text>
  <rect x="136" y="60" width="58" height="40" fill="#ffffff" stroke="#1a2026"/><text x="165.0" y="85" text-anchor="middle" font-weight="600">2</text>
  <rect x="202" y="60" width="58" height="40" fill="#ffffff" stroke="#1a2026"/><text x="231.0" y="85" text-anchor="middle" font-weight="600">4</text>
  <rect x="70" y="200" width="58" height="40" fill="#ffffff" stroke="#1a2026"/><text x="99.0" y="225" text-anchor="middle" font-weight="600">1</text>
  <rect x="136" y="200" width="58" height="40" fill="#ffffff" stroke="#1a2026"/><text x="165.0" y="225" text-anchor="middle" font-weight="600">4</text>
  <rect x="202" y="200" width="58" height="40" fill="#ffffff" stroke="#1a2026"/><text x="231.0" y="225" text-anchor="middle" font-weight="600">2</text>
  <line x1="99.0" y1="200" x2="99.0" y2="100" stroke="#4169E1" stroke-width="2"/>
  <line x1="231.0" y1="200" x2="165.0" y2="100" stroke="#4169E1" stroke-width="2"/>
  <line x1="165.0" y1="200" x2="231.0" y2="100" stroke="#b57f30" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="40" y="286" fill="#5c6b76" font-size="12">Connecting equal values in order is a common subsequence: 1&#8211;1 and 2&#8211;2 (blue)</text>
  <text x="40" y="304" fill="#5c6b76" font-size="12">stay parallel. Adding 4&#8211;4 as well (dashed) would cross the 2&#8211;2 line, so the</text>
  <text x="40" y="322" fill="#5c6b76" font-size="12">answer is the LCS length, 2.</text>
</svg>
