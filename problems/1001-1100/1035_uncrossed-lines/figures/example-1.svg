<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 232" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- nums1 = [1,4,2] over nums2 = [1,2,4]; solid = chosen pairing, dashed = rejected -->
  <line x1="220" y1="58" x2="340" y2="152" stroke="#4169E1" stroke-width="2.6"/>
  <line x1="100" y1="58" x2="100" y2="152" stroke="#4169E1" stroke-width="2.6"/>
  <line x1="340" y1="58" x2="220" y2="152" stroke="#b9c4cd" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g stroke="#b03030" stroke-width="2.2" stroke-linecap="round">
    <line x1="274" y1="99" x2="286" y2="111"/>
    <line x1="286" y1="99" x2="274" y2="111"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle" font-size="15">
    <text x="100" y="44">1</text>
    <text x="220" y="44">4</text>
    <text x="340" y="44">2</text>
    <text x="100" y="184">1</text>
    <text x="220" y="184">2</text>
    <text x="340" y="184">4</text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="36" y="44" text-anchor="end">nums1</text>
    <text x="36" y="184" text-anchor="end">nums2</text>
  </g>
  <text x="200" y="220" text-anchor="middle" fill="#5c6b76" font-size="12.5">matching 1-1 and 4-4 keeps 2 lines; adding 2-2 would cross the 4-4 line</text>
</svg>
