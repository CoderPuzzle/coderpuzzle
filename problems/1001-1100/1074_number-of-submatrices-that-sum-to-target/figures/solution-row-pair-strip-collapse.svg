<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 328" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="328" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- matrix [[0,1,0],[1,1,1],[0,1,0]], target 0; strip for rows 0..0 = [0,1,0] with prefix sums 0,1,1;
       map seeded {0:1} -> +1 at col 0, +1 at col 2. All six row pairs: (0,0)->2, (0,1)->0, (0,2)->0,
       (1,1)->0, (1,2)->0, (2,2)->2; total 4. matrix cells 48x38 at (40,56); strip cells 44x38 at (258,56) -->
  <text x="112" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">matrix</text>
  <g stroke="#1a2026" stroke-width="1.4">
    <rect x="40" y="56" width="48" height="38" fill="#dbe4fb"/>
    <rect x="88" y="56" width="48" height="38" fill="#ffffff"/>
    <rect x="136" y="56" width="48" height="38" fill="#dbe4fb"/>
    <rect x="40" y="94" width="48" height="38" fill="#ffffff"/>
    <rect x="88" y="94" width="48" height="38" fill="#ffffff"/>
    <rect x="136" y="94" width="48" height="38" fill="#ffffff"/>
    <rect x="40" y="132" width="48" height="38" fill="#dbe4fb"/>
    <rect x="88" y="132" width="48" height="38" fill="#ffffff"/>
    <rect x="136" y="132" width="48" height="38" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="64" y="80">0</text><text x="112" y="80">1</text><text x="160" y="80">0</text>
    <text x="64" y="118">1</text><text x="112" y="118">1</text><text x="160" y="118">1</text>
    <text x="64" y="156">0</text><text x="112" y="156">1</text><text x="160" y="156">0</text>
  </g>
  <path d="M 194 75 H 250" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="222" y="62" text-anchor="middle" fill="#5c6b76" font-size="11.5">rows 0..0</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="258" y="56" width="44" height="38"/><rect x="302" y="56" width="44" height="38"/><rect x="346" y="56" width="44" height="38"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="280" y="80">0</text><text x="324" y="80">1</text><text x="368" y="80">0</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="280" y="114">S = 0</text><text x="324" y="114">S = 1</text><text x="368" y="114">S = 1</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="14">
    <text x="280" y="136">+1</text><text x="368" y="136">+1</text>
  </g>
  <text x="420" y="66" fill="#1a2026" font-size="12.5">map seeded {0: 1}</text>
  <text x="420" y="88" fill="#1a2026" font-size="12.5">col 0: S = 0 hits the seed → +1</text>
  <text x="420" y="110" fill="#1a2026" font-size="12.5">col 2: S = 1 hits col 1's prefix → +1</text>
  <text x="324" y="162" text-anchor="middle" fill="#1a2026" font-size="13">strip (0..0) banks <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="340" y="196" text-anchor="middle" fill="#5c6b76" font-size="12.5">all six row pairs (strip → zero-sum subarrays)</text>
  <g font-size="13" fill="#1a2026">
    <text x="120" y="220">(0..0) [0,1,0] → <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="120" y="242">(0..1) [1,2,1] → <tspan fill="#9aa7b2">0</tspan></text>
    <text x="120" y="264">(0..2) [1,3,1] → <tspan fill="#9aa7b2">0</tspan></text>
    <text x="400" y="220">(1..1) [1,1,1] → <tspan fill="#9aa7b2">0</tspan></text>
    <text x="400" y="242">(1..2) [1,2,1] → <tspan fill="#9aa7b2">0</tspan></text>
    <text x="400" y="264">(2..2) [0,1,0] → <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  </g>
  <text x="340" y="290" text-anchor="middle" fill="#1a2026" font-size="13">2 + 0 + 0 + 0 + 0 + 2 = <tspan fill="#4169E1" font-weight="600">4</tspan> submatrices sum to target 0.</text>
  <text x="340" y="314" text-anchor="middle" fill="#1a2026" font-size="13">Only rows 0..0 and 2..2 find zero-sum runs — the four corner 0-cells are the whole answer.</text>
</svg>
