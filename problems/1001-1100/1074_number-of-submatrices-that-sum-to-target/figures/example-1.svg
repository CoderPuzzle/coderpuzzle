<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 308 212" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- matrix = [[0,1,0],[1,1,1],[0,1,0]], target = 0: the four corner cells -->
  <g fill="#e5ebfa">
    <rect x="88" y="28" width="44" height="44"/>
    <rect x="176" y="28" width="44" height="44"/>
    <rect x="88" y="116" width="44" height="44"/>
    <rect x="176" y="116" width="44" height="44"/>
  </g>
  <g stroke="#b9c4cd" stroke-width="1" fill="none">
    <rect x="88" y="28" width="132" height="44"/>
    <rect x="88" y="72" width="132" height="44"/>
    <rect x="88" y="116" width="132" height="44"/>
    <line x1="132" y1="28" x2="132" y2="160"/>
    <line x1="176" y1="28" x2="176" y2="160"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <rect x="88" y="28" width="44" height="44"/>
    <rect x="176" y="28" width="44" height="44"/>
    <rect x="88" y="116" width="44" height="44"/>
    <rect x="176" y="116" width="44" height="44"/>
  </g>
  <g fill="#1a2026" text-anchor="middle">
    <text x="110" y="55">0</text><text x="154" y="55">1</text><text x="198" y="55">0</text>
    <text x="110" y="99">1</text><text x="154" y="99">1</text><text x="198" y="99">1</text>
    <text x="110" y="143">0</text><text x="154" y="143">1</text><text x="198" y="143">0</text>
  </g>
  <text x="154" y="196" text-anchor="middle" fill="#5c6b76" font-size="12.5">only the four 1 x 1 cells holding 0 sum to the target</text>
</svg>
