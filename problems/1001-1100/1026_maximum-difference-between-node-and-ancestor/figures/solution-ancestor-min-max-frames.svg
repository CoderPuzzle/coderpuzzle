<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 456" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="456" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree = [8,3,10,1,6,null,14,null,null,4,7,13]; circles r=20; gray label under each node is its frame (lo, hi) = extremes of its strict ancestors -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="304" y1="66" x2="211" y2="136"/>
    <line x1="337" y1="65" x2="443" y2="137"/>
    <line x1="184" y1="165" x2="141" y2="235"/>
    <line x1="208" y1="163" x2="272" y2="237"/>
    <line x1="472" y1="164" x2="523" y2="236"/>
    <line x1="271" y1="267" x2="204" y2="338"/>
    <line x1="298" y1="267" x2="362" y2="337"/>
    <line x1="549" y1="267" x2="616" y2="338"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <circle cx="320" cy="54" r="20" fill="#dbe4fb"/>
    <circle cx="195" cy="148" r="20" fill="#dbe4fb"/>
    <circle cx="460" cy="148" r="20" fill="#ffffff"/>
    <circle cx="285" cy="252" r="20" fill="#ffffff"/>
    <circle cx="535" cy="252" r="20" fill="#ffffff"/>
    <circle cx="190" cy="352" r="20" fill="#ffffff"/>
    <circle cx="375" cy="352" r="20" fill="#ffffff"/>
    <circle cx="630" cy="352" r="20" fill="#ffffff"/>
  </g>
  <circle cx="130" cy="252" r="20" fill="#4169E1"/>
  <g text-anchor="middle" font-weight="600">
    <text x="320" y="59" fill="#1a2026">8</text>
    <text x="195" y="153" fill="#1a2026">3</text>
    <text x="460" y="153" fill="#1a2026">10</text>
    <text x="130" y="257" fill="#ffffff">1</text>
    <text x="285" y="257" fill="#1a2026">6</text>
    <text x="535" y="257" fill="#1a2026">14</text>
    <text x="190" y="357" fill="#1a2026">4</text>
    <text x="375" y="357" fill="#1a2026">7</text>
    <text x="630" y="357" fill="#1a2026">13</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="320" y="94">(8, 8)</text>
    <text x="195" y="190">(8, 8)</text>
    <text x="460" y="190">(8, 8)</text>
    <text x="285" y="292">(3, 8)</text>
    <text x="535" y="292">(8, 10)</text>
    <text x="190" y="392">(3, 8)</text>
    <text x="375" y="392">(3, 8)</text>
    <text x="630" y="392">(8, 14)</text>
  </g>
  <text x="130" y="292" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">(3, 8)</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="22" y="48">each stack frame carries</text>
    <text x="22" y="66">(lo, hi): the min and max</text>
    <text x="22" y="84">of the node's ancestors</text>
  </g>
  <g font-size="12.5">
    <text x="22" y="238" fill="#5c6b76">at node 1:</text>
    <text x="22" y="256" fill="#1a2026">|1 - 3| = 2</text>
    <text x="22" y="274" fill="#1a2026">|1 - 8| = <tspan fill="#4169E1" font-weight="600">7</tspan></text>
  </g>
  <path d="M 98 258 L 109 256" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="424" text-anchor="middle" fill="#1a2026" font-size="13">Node 1 pairs against its ancestor extremes, |1 - 8| = <tspan fill="#4169E1" font-weight="600">7</tspan> and |1 - 3| = 2,</text>
  <text x="340" y="442" text-anchor="middle" fill="#1a2026" font-size="13">so the walk ends with the maximum difference <tspan fill="#4169E1" font-weight="600">7</tspan> = |8 - 1|.</text>
</svg>
