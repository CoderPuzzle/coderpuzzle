<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="292" fill="#ffffff"/>
  <!-- n = 20; DFS over digits {0,1,6,8,9}; each box shows cur and its incrementally tracked rot; accent = rot != cur (confusing) -->
  <text x="32" y="30" fill="#5c6b76" font-size="12.5">n = 20</text>
  <!-- level-1 edges: root 1 appends 0,1,6,8,9; dashed = everything above 20 pruned -->
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="164" y1="92" x2="60" y2="148"/><line x1="166" y1="92" x2="136" y2="148"/>
    <line x1="170" y1="92" x2="212" y2="148"/><line x1="174" y1="92" x2="288" y2="148"/>
    <line x1="176" y1="92" x2="364" y2="148"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3">
    <line x1="450" y1="92" x2="450" y2="144"/><line x1="545" y1="92" x2="545" y2="144"/>
    <line x1="640" y1="92" x2="640" y2="144"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="104" y="114">+0</text><text x="142" y="118">+1</text><text x="196" y="122">+6</text>
    <text x="232" y="118">+8</text><text x="272" y="114">+9</text>
  </g>
  <!-- level 1: roots 1, 6, 8, 9 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="142" y="48" width="56" height="44"/><rect x="517" y="48" width="56" height="44"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="422" y="48" width="56" height="44"/><rect x="612" y="48" width="56" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="170" y="67" fill="#1a2026">1</text><text x="450" y="67" fill="#1a2026">6</text>
    <text x="545" y="67" fill="#1a2026">8</text><text x="640" y="67" fill="#1a2026">9</text>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="170" y="84" fill="#5c6b76">rot 1</text><text x="450" y="84" fill="#4169E1" font-weight="600">rot 9</text>
    <text x="545" y="84" fill="#5c6b76">rot 8</text><text x="640" y="84" fill="#4169E1" font-weight="600">rot 6</text>
  </g>
  <!-- level 2: children 10, 11, 16, 18, 19 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="108" y="148" width="56" height="44"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="32" y="148" width="56" height="44"/><rect x="184" y="148" width="56" height="44"/>
    <rect x="260" y="148" width="56" height="44"/><rect x="336" y="148" width="56" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="60" y="167" fill="#1a2026">10</text><text x="136" y="167" fill="#1a2026">11</text>
    <text x="212" y="167" fill="#1a2026">16</text><text x="288" y="167" fill="#1a2026">18</text>
    <text x="364" y="167" fill="#1a2026">19</text>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="60" y="184" fill="#4169E1" font-weight="600">rot 1</text><text x="136" y="184" fill="#5c6b76">rot 11</text>
    <text x="212" y="184" fill="#4169E1" font-weight="600">rot 91</text><text x="288" y="184" fill="#4169E1" font-weight="600">rot 81</text>
    <text x="364" y="184" fill="#4169E1" font-weight="600">rot 61</text>
  </g>
  <!-- 6, 8, 9 cannot take a second digit below 20 -->
  <rect x="422" y="148" width="246" height="44" fill="none" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="545" y="166">any second digit on 6, 8, 9 gives</text>
    <text x="545" y="182">60, 80, 90 or more — above 20: pruned</text>
  </g>
  <text x="212" y="224" text-anchor="middle" font-size="11.5" fill="#9aa7b2">a third digit reaches 100 &gt; 20 — pruned as well</text>
  <text x="545" y="224" text-anchor="middle" font-size="11.5" fill="#9aa7b2">append d: rot' = rot180(d)·10^k + rot</text>
  <text x="340" y="254" text-anchor="middle" fill="#1a2026" font-size="13">DFS appends digits {0, 1, 6, 8, 9} (no leading 0) and prunes anything above 20.</text>
  <text x="340" y="274" text-anchor="middle" fill="#1a2026" font-size="13">Confusing exactly when rot ≠ cur: 6→9, 9→6, 10→1, 16→91, 18→81, 19→61 — <tspan fill="#4169E1" font-weight="600">count 6</tspan>.</text>
</svg>
