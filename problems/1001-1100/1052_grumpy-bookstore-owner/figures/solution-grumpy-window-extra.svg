<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="272" fill="#ffffff"/>
  <!-- customers=[1,0,1,2,1,1,7,5] grumpy=[0,1,0,1,0,1,0,1] minutes=3; cells 56x44 at x=88+64i; extra badges = customers saved if calmed; window sums end at cell 2..7 -->
  <!-- best window band over minutes 5-7 -->
  <rect x="404" y="52" width="188" height="60" rx="8" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="498" y="44" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">best window</text>
  <!-- customer cells: shaded = grumpy minute -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="88" y="60" width="56" height="44" fill="#ffffff"/><rect x="152" y="60" width="56" height="44" fill="#f0f3f7"/>
    <rect x="216" y="60" width="56" height="44" fill="#ffffff"/><rect x="280" y="60" width="56" height="44" fill="#f0f3f7"/>
    <rect x="344" y="60" width="56" height="44" fill="#ffffff"/><rect x="408" y="60" width="56" height="44" fill="#f0f3f7"/>
    <rect x="472" y="60" width="56" height="44" fill="#ffffff"/><rect x="536" y="60" width="56" height="44" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="116" y="87">1</text><text x="180" y="87">0</text><text x="244" y="87">1</text><text x="308" y="87">2</text>
    <text x="372" y="87">1</text><text x="436" y="87">1</text><text x="500" y="87">7</text><text x="564" y="87">5</text>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="116" y="122" fill="#9aa7b2">calm</text><text x="180" y="122" fill="#5c6b76" font-weight="600">grumpy</text>
    <text x="244" y="122" fill="#9aa7b2">calm</text><text x="308" y="122" fill="#5c6b76" font-weight="600">grumpy</text>
    <text x="372" y="122" fill="#9aa7b2">calm</text><text x="436" y="122" fill="#5c6b76" font-weight="600">grumpy</text>
    <text x="500" y="122" fill="#9aa7b2">calm</text><text x="564" y="122" fill="#5c6b76" font-weight="600">grumpy</text>
  </g>
  <!-- extra saved if that grumpy minute is calmed -->
  <text x="40" y="148" fill="#5c6b76" font-size="11.5">extra if calmed</text>
  <g fill="#dbe4fb">
    <rect x="162" y="134" width="36" height="20" rx="4"/><rect x="290" y="134" width="36" height="20" rx="4"/>
    <rect x="418" y="134" width="36" height="20" rx="4"/><rect x="546" y="134" width="36" height="20" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">
    <text x="180" y="148">+0</text><text x="308" y="148">+2</text><text x="436" y="148">+1</text><text x="564" y="148">+5</text>
  </g>
  <!-- sliding window sums over the extras, by last minute covered -->
  <text x="40" y="190" fill="#5c6b76" font-size="11.5">window sums</text>
  <g text-anchor="middle" font-size="13" fill="#5c6b76">
    <text x="244" y="190">0</text><text x="308" y="190">2</text><text x="372" y="190">2</text>
    <text x="436" y="190">3</text><text x="500" y="190">1</text>
  </g>
  <text x="564" y="191" text-anchor="middle" font-size="15" font-weight="600" fill="#4169E1">6</text>
  <text x="320" y="232" text-anchor="middle" fill="#1a2026" font-size="13">Calm baseline 1+1+1+7 = 10; the best 3-minute window saves 1+5 = 6 more,</text>
  <text x="320" y="254" text-anchor="middle" fill="#1a2026" font-size="13">so the answer is 10 + 6 = <tspan fill="#4169E1" font-weight="600">16</tspan>.</text>
</svg>
