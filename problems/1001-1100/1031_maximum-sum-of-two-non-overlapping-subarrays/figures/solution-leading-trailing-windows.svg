    <text x="150" y="81" fill="#1a2026">6</text>
    <text x="212" y="81" fill="#1a2026">5</text>
    <text x="274" y="81" fill="#1a2026">2</text>
    <text x="336" y="81" fill="#1a2026">2</text>
    <text x="398" y="81" fill="#1a2026">5</text>
    <text x="460" y="81" fill="#1a2026">1</text>
    <text x="522" y="81" fill="#ffffff">9</text>
    <text x="584" y="81" fill="#1a2026">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="88" y="112">0</text><text x="150" y="112">1</text><text x="212" y="112">2</text>
    <text x="274" y="112">3</text><text x="336" y="112">4</text><text x="398" y="112">5</text>
    <text x="460" y="112">6</text><text x="522" y="112">7</text><text x="584" y="112">8</text>
  </g>
