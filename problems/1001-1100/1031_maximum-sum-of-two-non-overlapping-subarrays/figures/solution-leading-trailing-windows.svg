  <g text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">
    <text x="210" y="246">11</text><text x="274" y="246">13</text><text x="338" y="246">13</text>
    <text x="402" y="246">16</text><text x="466" y="246">12</text><text x="530" y="246" fill="#4169E1">20</text>
    <text x="594" y="246">15</text>
