  <text x="24" y="141" fill="#5c6b76" font-size="12">prefix</text>
  <g stroke="#9aa7b2" stroke-width="1" fill="#f0f3f7">
    <rect x="60" y="124" width="48" height="24"/><rect x="122" y="124" width="48" height="24"/>
    <rect x="184" y="124" width="48" height="24"/><rect x="246" y="124" width="48" height="24"/>
    <rect x="308" y="124" width="48" height="24"/><rect x="370" y="124" width="48" height="24"/>
    <rect x="432" y="124" width="48" height="24"/><rect x="494" y="124" width="48" height="24"/>
    <rect x="556" y="124" width="48" height="24"/><rect x="618" y="124" width="48" height="24"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="84" y="140">0</text><text x="146" y="140">0</text><text x="208" y="140">6</text>
    <text x="270" y="140">11</text><text x="332" y="140">13</text><text x="394" y="140">15</text>
    <text x="456" y="140">20</text><text x="518" y="140">21</text><text x="580" y="140">30</text>
    <text x="642" y="140">34</text>
  </g>
  <!-- sweep trace, order (leading len 2, trailing len 1) -->
  <rect x="500" y="164" width="60" height="94" fill="#dbe4fb"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="210" y="180">2</text><text x="274" y="180">3</text><text x="338" y="180">4</text>
    <text x="402" y="180">5</text><text x="466" y="180">6</text><text x="530" y="180" font-weight="600">7</text>
    <text x="594" y="180">8</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="210" y="202">6</text><text x="274" y="202">11</text><text x="338" y="202">11</text>
    <text x="402" y="202">11</text><text x="466" y="202">11</text><text x="530" y="202" font-weight="600">11</text>
