    <rect x="432" y="58" width="56" height="36" fill="#ffffff"/>
    <rect x="494" y="58" width="56" height="36" fill="#4169E1"/>
    <rect x="556" y="58" width="56" height="36" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600">
