<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [0,6,5,2,2,5,1,9,4]; firstLen=1, secondLen=2; cells 56x36 at x=60+62i; prefix P[i] drawn at boundary i; sweep order (leading len 2, trailing len 1); highlight column m=7 is the winner -->
  <path d="M 262 28 C 330 10, 410 10, 478 28" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" font-size="12.5">
    <text x="181" y="46" fill="#4169E1" font-weight="600">[6,5]  best leading = 11</text>
    <text x="522" y="46" fill="#1a2026">[9]  trailing = 9</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
