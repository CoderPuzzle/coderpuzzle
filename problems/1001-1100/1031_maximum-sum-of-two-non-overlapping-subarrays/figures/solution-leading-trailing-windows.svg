    <rect x="122" y="58" width="56" height="36" fill="#dbe4fb"/>
    <rect x="184" y="58" width="56" height="36" fill="#dbe4fb"/>
    <rect x="246" y="58" width="56" height="36" fill="#ffffff"/>
    <rect x="308" y="58" width="56" height="36" fill="#ffffff"/>
