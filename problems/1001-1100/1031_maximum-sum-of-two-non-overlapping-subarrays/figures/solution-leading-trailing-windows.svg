  <g fill="#5c6b76" font-size="12">
    <text x="24" y="180">trailing end m</text>
    <text x="24" y="202">best leading (len 2)</text>
    <text x="24" y="224">trailing sum (len 1)</text>
    <text x="24" y="246" fill="#1a2026" font-weight="600">total</text>
  </g>
  <text x="340" y="280" text-anchor="middle" fill="#1a2026" font-size="13">Trying both orders, the best is leading [6,5] + trailing [9] = 11 + 9 = <tspan fill="#4169E1" font-weight="600">20</tspan>;</text>
  <text x="340" y="298" text-anchor="middle" fill="#1a2026" font-size="13">the mirrored order tops out at 6 + [9,4] = 19.</text>
</svg>
