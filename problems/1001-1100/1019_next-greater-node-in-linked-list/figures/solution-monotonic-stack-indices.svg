<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- values = [2,1,5]; list boxes 70x40 at x = 100 + 120i, y = 56; stack cells 120x32 at (80,200/236); answer cells 68x34 at x = 430 + 76j, y = 218 -->
  <text x="340" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">values = [2, 1, 5], answer = [0, 0, 0]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="135" y="48">i = 0</text><text x="255" y="48">i = 1</text><text x="375" y="48">i = 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <rect x="100" y="56" width="70" height="40"/>
    <rect x="220" y="56" width="70" height="40"/>
    <rect x="340" y="56" width="70" height="40" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle">
    <text x="135" y="81">2</text><text x="255" y="81">1</text>
    <text x="375" y="81" fill="#4169E1" font-weight="600">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <path d="M 174 76 L 214 76" marker-end="url(#arrow)"/>
    <path d="M 294 76 L 334 76" marker-end="url(#arrow)"/>
  </g>
  <text x="375" y="118" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">value 5 arrives</text>
  <text x="140" y="182" text-anchor="middle" fill="#5c6b76" font-size="12.5">stack</text>
  <path d="M 74 190 L 74 276 L 206 276 L 206 190" fill="none" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.4" fill="#dbe4fb">
    <rect x="80" y="200" width="120" height="32"/>
    <rect x="80" y="236" width="120" height="32"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="140" y="221">i = 1 (value 1)</text>
    <text x="140" y="257">i = 0 (value 2)</text>
  </g>
  <text x="140" y="294" text-anchor="middle" fill="#5c6b76" font-size="12">waiting: 2 &gt; 1</text>
  <text x="540" y="206" text-anchor="middle" fill="#5c6b76" font-size="12.5">answer</text>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <rect x="430" y="218" width="68" height="34"/>
    <rect x="506" y="218" width="68" height="34"/>
    <rect x="582" y="218" width="68" height="34"/>
  </g>
  <g text-anchor="middle">
    <text x="464" y="240" fill="#4169E1" font-weight="600">5</text>
    <text x="540" y="240" fill="#4169E1" font-weight="600">5</text>
    <text x="616" y="240" fill="#9aa7b2">0</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="464" y="272">i = 0</text><text x="540" y="272">i = 1</text><text x="616" y="272">i = 2</text>
  </g>
  <!-- pops: 5 resolves the two waiting indices into their answer slots -->
  <path d="M 208 216 C 300 196 420 196 522 212" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="360" y="188" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">5 pops i = 1 → answer[1] = 5</text>
  <path d="M 208 252 C 290 274 360 274 424 244" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="310" y="290" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">5 pops i = 0 → answer[0] = 5</text>
  <text x="340" y="324" text-anchor="middle" fill="#1a2026" font-size="13">5 pops both waiting indices (values 2, 1); index 2 then pushes, waits to the</text>
  <text x="340" y="344" text-anchor="middle" fill="#1a2026" font-size="13">end, and keeps its 0 — the answer is <tspan fill="#4169E1" font-weight="600">[5, 5, 0]</tspan>.</text>
</svg>
