<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 212" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="ca" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- head = [2,1,5] -> [5,5,0]; curved dashed arcs jump to the next greater node -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="93" y1="50" x2="167" y2="50" marker-end="url(#la)"/>
    <line x1="213" y1="50" x2="287" y2="50" marker-end="url(#la)"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="5 4">
    <path d="M 310 68 Q 250 130 74 76" marker-end="url(#ca)"/>
    <path d="M 304 68 Q 254 112 202 70" marker-end="url(#ca)"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="70" cy="50" r="18"/>
    <circle cx="190" cy="50" r="18"/>
    <circle cx="310" cy="50" r="18"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="70" y="55">2</text>
    <text x="190" y="55">1</text>
    <text x="310" y="55">5</text>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="70" y="176" fill="#1a2026">5</text>
    <text x="190" y="176" fill="#1a2026">5</text>
    <text x="310" y="176" fill="#5c6b76">0</text>
  </g>
  <text x="176" y="198" text-anchor="middle" fill="#5c6b76" font-size="12.5">both 2 and 1 first meet a larger value at 5; 5 itself never does</text>
</svg>
