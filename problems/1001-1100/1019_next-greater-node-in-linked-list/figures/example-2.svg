<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 232" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="ca" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- head = [2,7,4,3,5] -> [7,0,5,5,0] -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="83" y1="60" x2="147" y2="60" marker-end="url(#la)"/>
    <line x1="193" y1="60" x2="257" y2="60" marker-end="url(#la)"/>
    <line x1="303" y1="60" x2="367" y2="60" marker-end="url(#la)"/>
    <line x1="413" y1="60" x2="477" y2="60" marker-end="url(#la)"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="5 4">
    <path d="M 170 78 Q 115 160 64 82" marker-end="url(#ca)"/>
    <path d="M 500 78 Q 390 176 284 82" marker-end="url(#ca)"/>
    <path d="M 494 78 Q 445 140 396 80" marker-end="url(#ca)"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="60" cy="60" r="18"/>
    <circle cx="170" cy="60" r="18"/>
    <circle cx="280" cy="60" r="18"/>
    <circle cx="390" cy="60" r="18"/>
    <circle cx="500" cy="60" r="18"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="60" y="65">2</text>
    <text x="170" y="65">7</text>
    <text x="280" y="65">4</text>
    <text x="390" y="65">3</text>
    <text x="500" y="65">5</text>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="60" y="196" fill="#1a2026">7</text>
    <text x="170" y="196" fill="#5c6b76">0</text>
    <text x="280" y="196" fill="#1a2026">5</text>
    <text x="390" y="196" fill="#1a2026">5</text>
    <text x="500" y="196" fill="#5c6b76">0</text>
  </g>
  <text x="280" y="220" text-anchor="middle" fill="#5c6b76" font-size="12.5">7 tops both neighbors, and 5 is the first value after 4 and 3 that beats them</text>
</svg>
