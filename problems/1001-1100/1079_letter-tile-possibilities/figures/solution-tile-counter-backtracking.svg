<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="400" fill="#ffffff"/>
  <!-- tiles = "AAB"; counter {A:2, B:1}; every placed node = one new sequence, duplicates share a branch.
       8 placed nodes = A, B, AA, AB, AAB, ABA, BA, BAA. node boxes 76x40; rows at y=30/120/210/300 -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3">
    <rect x="302" y="30" width="76" height="40"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="162" y="120" width="76" height="40"/><rect x="442" y="120" width="76" height="40"/>
    <rect x="72" y="210" width="76" height="40"/><rect x="252" y="210" width="76" height="40"/><rect x="442" y="210" width="76" height="40"/>
    <rect x="34" y="300" width="76" height="40"/><rect x="214" y="300" width="76" height="40"/><rect x="444" y="300" width="76" height="40"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 340 70 L 200 118" marker-end="url(#arrow)"/>
    <path d="M 340 70 L 480 118" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.4" fill="none">
    <path d="M 200 160 L 110 208" marker-end="url(#arrowM)"/>
    <path d="M 200 160 L 290 208" marker-end="url(#arrowM)"/>
    <path d="M 480 160 L 480 208" marker-end="url(#arrowM)"/>
    <path d="M 110 250 L 70 298" marker-end="url(#arrow)"/>
    <path d="M 290 250 L 250 298" marker-end="url(#arrow)"/>
    <path d="M 480 250 L 480 298" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <g text-anchor="middle">
    <text x="340" y="47" fill="#5c6b76" font-size="12.5">start</text>
    <text x="340" y="63" fill="#5c6b76" font-size="10.5">A:2 B:1</text>
    <text x="200" y="137" fill="#4169E1" font-weight="600" font-size="15">A</text><text x="200" y="153" fill="#5c6b76" font-size="10.5">A:1 B:1</text>
    <text x="480" y="137" fill="#4169E1" font-weight="600" font-size="15">B</text><text x="480" y="153" fill="#5c6b76" font-size="10.5">A:2 B:0</text>
    <text x="110" y="227" fill="#4169E1" font-weight="600" font-size="15">AA</text><text x="110" y="243" fill="#5c6b76" font-size="10.5">A:0 B:1</text>
    <text x="290" y="227" fill="#4169E1" font-weight="600" font-size="15">AB</text><text x="290" y="243" fill="#5c6b76" font-size="10.5">A:1 B:0</text>
    <text x="480" y="227" fill="#4169E1" font-weight="600" font-size="15">BA</text><text x="480" y="243" fill="#5c6b76" font-size="10.5">A:1 B:0</text>
    <text x="70" y="317" fill="#4169E1" font-weight="600" font-size="15">AAB</text><text x="70" y="333" fill="#5c6b76" font-size="10.5">A:0 B:0</text>
    <text x="250" y="317" fill="#4169E1" font-weight="600" font-size="15">ABA</text><text x="250" y="333" fill="#5c6b76" font-size="10.5">A:0 B:0</text>
    <text x="480" y="317" fill="#4169E1" font-weight="600" font-size="15">BAA</text><text x="480" y="333" fill="#5c6b76" font-size="10.5">A:0 B:0</text>
  </g>
  <text x="340" y="368" text-anchor="middle" fill="#1a2026" font-size="13">Branching on remaining counts, not tile positions: the two A tiles share one branch,</text>
  <text x="340" y="386" text-anchor="middle" fill="#1a2026" font-size="13">so the <tspan fill="#4169E1" font-weight="600">8</tspan> placed nodes are exactly the 8 distinct sequences from tiles AAB.</text>
</svg>
