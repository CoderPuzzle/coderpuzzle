<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="324" fill="#ffffff"/>
  <!-- stones = [2,7,4,1,8,1]; total 23, target 11; grid cells 30x24 from (110,72), cols = sums 0..11, 7 rows -->
  <!-- reachable: light #dbe4fb, newly reachable this stone: #4169E1, else #f0f3f7 -->
  <g text-anchor="middle">
    <rect x="340" y="18" width="14" height="14" fill="#dbe4fb" stroke="#9aa7b2" stroke-width="1"/>
    <text x="362" y="29" font-size="11.5" fill="#5c6b76" text-anchor="start">reachable earlier</text>
    <rect x="478" y="18" width="14" height="14" fill="#4169E1"/>
    <text x="500" y="29" font-size="11.5" fill="#5c6b76" text-anchor="start">new this stone</text>
    <g fill="#5c6b76" font-size="11.5">
      <text x="125" y="64">0</text><text x="155" y="64">1</text><text x="185" y="64">2</text>
      <text x="215" y="64">3</text><text x="245" y="64">4</text><text x="275" y="64">5</text>
      <text x="305" y="64">6</text><text x="335" y="64">7</text><text x="365" y="64">8</text>
      <text x="395" y="64">9</text><text x="425" y="64">10</text><text x="455" y="64" fill="#4169E1" font-weight="600">11</text>
    </g>
    <g fill="#5c6b76" font-size="12.5" text-anchor="end">
      <text x="102" y="88">seed</text><text x="102" y="112">+ 2</text><text x="102" y="136">+ 7</text>
      <text x="102" y="160">+ 4</text><text x="102" y="184">+ 1</text><text x="102" y="208">+ 8</text>
      <text x="102" y="232">+ 1</text>
    </g>
    <!-- row seed: new 0 -->
    <g>
      <rect x="110" y="72" width="30" height="24" fill="#4169E1"/>
      <rect x="140" y="72" width="330" height="24" fill="#f0f3f7"/>
    </g>
    <!-- row +2: old 0, new 2 -->
    <g>
      <rect x="110" y="96" width="30" height="24" fill="#dbe4fb"/>
      <rect x="140" y="96" width="30" height="24" fill="#4169E1"/>
      <rect x="170" y="96" width="300" height="24" fill="#f0f3f7"/>
    </g>
    <!-- row +7: old 0,2 ; new 7,9 -->
    <g>
      <rect x="110" y="120" width="30" height="24" fill="#dbe4fb"/>
      <rect x="170" y="120" width="30" height="24" fill="#dbe4fb"/>
      <rect x="320" y="120" width="30" height="24" fill="#4169E1"/>
      <rect x="380" y="120" width="30" height="24" fill="#4169E1"/>
      <rect x="140" y="120" width="30" height="24" fill="#f0f3f7"/>
      <rect x="200" y="120" width="120" height="24" fill="#f0f3f7"/>
      <rect x="350" y="120" width="30" height="24" fill="#f0f3f7"/>
      <rect x="410" y="120" width="60" height="24" fill="#f0f3f7"/>
    </g>
    <!-- row +4: old 0,2,7,9 ; new 4,6,11 -->
    <g>
      <rect x="110" y="144" width="30" height="24" fill="#dbe4fb"/>
      <rect x="170" y="144" width="30" height="24" fill="#dbe4fb"/>
      <rect x="320" y="144" width="30" height="24" fill="#dbe4fb"/>
      <rect x="380" y="144" width="30" height="24" fill="#dbe4fb"/>
      <rect x="230" y="144" width="30" height="24" fill="#4169E1"/>
      <rect x="290" y="144" width="30" height="24" fill="#4169E1"/>
      <rect x="440" y="144" width="30" height="24" fill="#4169E1"/>
      <rect x="140" y="144" width="30" height="24" fill="#f0f3f7"/>
      <rect x="200" y="144" width="30" height="24" fill="#f0f3f7"/>
      <rect x="260" y="144" width="30" height="24" fill="#f0f3f7"/>
      <rect x="350" y="144" width="30" height="24" fill="#f0f3f7"/>
      <rect x="410" y="144" width="30" height="24" fill="#f0f3f7"/>
    </g>
    <!-- row +1: old 0,2,4,6,7,9,11 ; new 1,3,5,8,10 -->
    <g>
      <rect x="110" y="168" width="30" height="24" fill="#dbe4fb"/>
      <rect x="170" y="168" width="30" height="24" fill="#dbe4fb"/>
      <rect x="230" y="168" width="30" height="24" fill="#dbe4fb"/>
      <rect x="290" y="168" width="30" height="24" fill="#dbe4fb"/>
      <rect x="320" y="168" width="30" height="24" fill="#dbe4fb"/>
      <rect x="380" y="168" width="30" height="24" fill="#dbe4fb"/>
      <rect x="440" y="168" width="30" height="24" fill="#dbe4fb"/>
      <rect x="140" y="168" width="30" height="24" fill="#4169E1"/>
      <rect x="200" y="168" width="30" height="24" fill="#4169E1"/>
      <rect x="260" y="168" width="30" height="24" fill="#4169E1"/>
      <rect x="350" y="168" width="30" height="24" fill="#4169E1"/>
      <rect x="410" y="168" width="30" height="24" fill="#4169E1"/>
    </g>
    <!-- rows +8 and +1: everything already reachable -->
    <g>
      <rect x="110" y="192" width="360" height="24" fill="#dbe4fb"/>
      <rect x="110" y="216" width="360" height="24" fill="#dbe4fb"/>
    </g>
    <!-- target column 11 outline -->
    <rect x="440" y="72" width="30" height="168" fill="none" stroke="#4169E1" stroke-width="1.5"/>
    <g text-anchor="start" font-size="12.5">
      <text x="496" y="100" fill="#1a2026">total = 23</text>
      <text x="496" y="124" fill="#1a2026">target = 23 // 2 = 11</text>
      <text x="496" y="148" fill="#1a2026">best &#8804; 11 is 11</text>
      <text x="496" y="174" fill="#4169E1" font-weight="600" font-size="13.5">answer: 23 &#8722; 2&#183;11 = 1</text>
    </g>
    <text x="110" y="258" font-size="11" fill="#9aa7b2" text-anchor="start">sums above the target are never recorded &#8212; only sums &#8804; 11 can win</text>
    <text x="40" y="290" fill="#1a2026" font-size="13" text-anchor="start">Updating the sums from high to low keeps each stone to one use; after all six</text>
    <text x="40" y="308" fill="#1a2026" font-size="13" text-anchor="start">stones every sum 0..11 is reachable, so the split 11 | 12 leaves 23 &#8722; 2&#183;11 = <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
  </g>
</svg>
