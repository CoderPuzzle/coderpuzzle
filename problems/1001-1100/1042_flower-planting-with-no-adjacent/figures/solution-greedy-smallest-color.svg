<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="390" fill="#ffffff"/>
  <!-- n = 3, paths = [[1,2],[2,3],[3,1]]; gardens at 1 (340,78), 2 (210,218), 3 (470,218), r 24; greedy order 1, 2, 3 -->
  <text x="40" y="36" fill="#5c6b76" font-size="12.5">paths = [[1, 2], [2, 3], [3, 1]] — process the gardens in order 1, 2, 3</text>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="340" y1="78" x2="210" y2="218"/>
    <line x1="340" y1="78" x2="470" y2="218"/>
    <line x1="210" y1="218" x2="470" y2="218"/>
  </g>
  <g fill="#4169E1">
    <circle cx="340" cy="78" r="24"/>
    <circle cx="210" cy="218" r="24"/>
    <circle cx="470" cy="218" r="24"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-weight="600" font-size="16">
    <text x="340" y="84">1</text>
    <text x="210" y="224">2</text>
    <text x="470" y="224">3</text>
  </g>
  <!-- greedy reasoning per garden -->
  <g font-size="12" fill="#5c6b76" font-weight="600">
    <text x="386" y="64">garden 1</text>
    <text x="210" y="266" text-anchor="middle">garden 2</text>
    <text x="470" y="266" text-anchor="middle">garden 3</text>
  </g>
  <text x="386" y="84" fill="#1a2026" font-size="12.5">neighbors colored: none</text>
  <text x="386" y="102" fill="#4169E1" font-size="12.5" font-weight="600">→ take 1</text>
  <g text-anchor="middle" font-size="12.5">
    <text x="210" y="286" fill="#1a2026">neighbors colored: {1}</text>
    <text x="210" y="304" fill="#4169E1" font-weight="600">→ take 2</text>
    <text x="470" y="286" fill="#1a2026">neighbors colored: {1, 2}</text>
    <text x="470" y="304" fill="#4169E1" font-weight="600">→ take 3</text>
  </g>
  <rect x="240" y="322" width="200" height="30" rx="15" fill="#dbe4fb"/>
  <text x="340" y="342" text-anchor="middle" fill="#4169E1" font-weight="700" font-size="14">answer = [1, 2, 3]</text>
  <text x="340" y="374" text-anchor="middle" fill="#1a2026" font-size="13">At most 3 colored neighbors can never block all 4 types, so a smallest free one always exists.</text>
</svg>
