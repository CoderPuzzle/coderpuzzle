<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- pairs (0,1)(1,2)(2,3)(2,4)(1,5)(2,6)(2,7) of the traversal string; each column is the ancestor stack after reading that pair; boxes 46x26, rows 28px apart, bottom row top y=224; dashed ghosts are the entries the trim popped -->
  <text x="24" y="34" fill="#1a2026" font-weight="600">1-2--3--4-5--6--7</text>
  <text x="24" y="58" fill="#5c6b76" font-size="12">each dash run is a depth; each value enters at that depth</text>
  <!-- recovered tree [1,2,5,3,4,6,7] -->
  <g stroke="#9aa7b2" stroke-width="1.4">
    <line x1="600" y1="20" x2="560" y2="48"/>
    <line x1="600" y1="20" x2="640" y2="48"/>
    <line x1="560" y1="48" x2="543" y2="76"/>
    <line x1="560" y1="48" x2="577" y2="76"/>
    <line x1="640" y1="48" x2="623" y2="76"/>
    <line x1="640" y1="48" x2="657" y2="76"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <circle cx="600" cy="20" r="11"/><circle cx="560" cy="48" r="11"/><circle cx="640" cy="48" r="11"/>
    <circle cx="543" cy="76" r="11"/><circle cx="577" cy="76" r="11"/>
    <circle cx="623" cy="76" r="11"/><circle cx="657" cy="76" r="11"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12" font-weight="600">
    <text x="600" y="24">1</text><text x="560" y="52">2</text><text x="640" y="52">5</text>
    <text x="543" y="80">3</text><text x="577" y="80">4</text>
    <text x="623" y="80">6</text><text x="657" y="80">7</text>
  </g>
  <!-- pair headers -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="90" y="104">read (0, 1)</text>
    <text x="168" y="104">read (1, 2)</text>
    <text x="246" y="104">read (2, 3)</text>
    <text x="324" y="104">read (2, 4)</text>
    <text x="402" y="104">read (1, 5)</text>
    <text x="480" y="104">read (2, 6)</text>
    <text x="558" y="104">read (2, 7)</text>
  </g>
  <!-- ghost (popped) boxes -->
  <g stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3" fill="#f0f3f7">
    <rect x="301" y="140" width="46" height="26"/>
    <rect x="379" y="168" width="46" height="26"/>
    <rect x="379" y="140" width="46" height="26"/>
    <rect x="535" y="140" width="46" height="26"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="13">
    <text x="324" y="157">3</text>
    <text x="402" y="185">2</text>
    <text x="402" y="157">4</text>
    <text x="558" y="157">6</text>
  </g>
  <!-- live stack boxes -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="67" y="224" width="46" height="26"/>
    <rect x="145" y="224" width="46" height="26"/><rect x="145" y="196" width="46" height="26"/>
    <rect x="223" y="224" width="46" height="26"/><rect x="223" y="196" width="46" height="26"/><rect x="223" y="168" width="46" height="26"/>
    <rect x="301" y="224" width="46" height="26"/><rect x="301" y="196" width="46" height="26"/>
    <rect x="379" y="224" width="46" height="26"/>
    <rect x="457" y="224" width="46" height="26"/><rect x="457" y="196" width="46" height="26"/><rect x="457" y="168" width="46" height="26"/>
    <rect x="535" y="224" width="46" height="26"/><rect x="535" y="196" width="46" height="26"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#4169E1">
    <rect x="67" y="224" width="46" height="26"/>
    <rect x="145" y="196" width="46" height="26"/>
    <rect x="223" y="168" width="46" height="26"/>
    <rect x="301" y="196" width="46" height="26"/>
    <rect x="379" y="224" width="46" height="26"/>
    <rect x="457" y="168" width="46" height="26"/>
    <rect x="535" y="168" width="46" height="26"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="90" y="241" fill="#ffffff">1</text>
    <text x="168" y="241" fill="#1a2026">1</text><text x="168" y="213" fill="#ffffff">2</text>
    <text x="246" y="241" fill="#1a2026">1</text><text x="246" y="213" fill="#1a2026">2</text><text x="246" y="185" fill="#ffffff">3</text>
    <text x="324" y="241" fill="#1a2026">1</text><text x="324" y="213" fill="#1a2026">2</text><text x="324" y="185" fill="#ffffff">4</text>
    <text x="402" y="241" fill="#1a2026">1</text><text x="402" y="213" fill="#ffffff">5</text>
    <text x="480" y="241" fill="#1a2026">1</text><text x="480" y="213" fill="#1a2026">5</text><text x="480" y="185" fill="#ffffff">6</text>
    <text x="558" y="241" fill="#1a2026">1</text><text x="558" y="213" fill="#1a2026">5</text><text x="558" y="185" fill="#ffffff">7</text>
  </g>
  <!-- attachment notes -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="90" y="270">root = 1</text>
    <text x="168" y="270">2 = 1.left</text>
    <text x="246" y="270">3 = 2.left</text>
    <text x="324" y="270">4 = 2.right</text>
    <text x="402" y="270">5 = 1.right</text>
    <text x="480" y="270">6 = 5.left</text>
    <text x="558" y="270">7 = 5.right</text>
  </g>
  <text x="324" y="288" text-anchor="middle" fill="#9aa7b2" font-size="12">pop 3</text>
  <text x="402" y="288" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">pop 4, then 2</text>
  <text x="558" y="288" text-anchor="middle" fill="#9aa7b2" font-size="12">pop 6</text>
  <text x="340" y="320" text-anchor="middle" fill="#1a2026" font-size="13">Each read first trims the stack down to the dash depth, then the node pushes on</text>
  <text x="340" y="338" text-anchor="middle" fill="#1a2026" font-size="13">as the new top; the bottom entry stays root 1, giving <tspan fill="#4169E1" font-weight="600">[1,2,5,3,4,6,7]</tspan>.</text>
</svg>
