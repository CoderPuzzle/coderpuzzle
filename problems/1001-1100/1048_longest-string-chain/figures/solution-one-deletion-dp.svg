<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="232" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- words by length; boxes w80 pitch92 from x54 y58; centers 94,186,278,370,462,554; dp = 1,1,2,3,3,4 -->
  <!-- one-deletion arrows, successor -> predecessor; blue = the chain a,ba,bda,bdca -->
  <g fill="none" stroke="#9aa7b2" stroke-width="1.5">
    <path d="M 278 106 Q 232 122 186 106" marker-end="url(#arrow)"/>
    <path d="M 370 106 Q 324 122 278 106" marker-end="url(#arrow)"/>
    <path d="M 554 106 Q 462 215 370 106" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 278 106 Q 186 165 94 106" marker-end="url(#arrow)"/>
    <path d="M 462 106 Q 370 175 278 106" marker-end="url(#arrow)"/>
    <path d="M 554 106 Q 508 122 462 106" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle">
    <!-- a : dp 1 (chain) -->
    <rect x="54" y="58" width="80" height="48" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="94" y="78" font-weight="600" fill="#1a2026">"a"</text>
    <text x="94" y="97" font-size="11.5" font-weight="600" fill="#4169E1">dp 1</text>
    <!-- b : dp 1 -->
    <rect x="146" y="58" width="80" height="48" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="186" y="78" font-weight="600" fill="#1a2026">"b"</text>
    <text x="186" y="97" font-size="11.5" fill="#5c6b76">dp 1</text>
    <!-- ba : dp 2 (chain) -->
    <rect x="238" y="58" width="80" height="48" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="278" y="78" font-weight="600" fill="#1a2026">"ba"</text>
    <text x="278" y="97" font-size="11.5" font-weight="600" fill="#4169E1">dp 2</text>
    <!-- bca : dp 3 -->
    <rect x="330" y="58" width="80" height="48" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="370" y="78" font-weight="600" fill="#1a2026">"bca"</text>
    <text x="370" y="97" font-size="11.5" fill="#5c6b76">dp 3</text>
    <!-- bda : dp 3 (chain) -->
    <rect x="422" y="58" width="80" height="48" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="462" y="78" font-weight="600" fill="#1a2026">"bda"</text>
    <text x="462" y="97" font-size="11.5" font-weight="600" fill="#4169E1">dp 3</text>
    <!-- bdca : dp 4 (chain) -->
    <rect x="514" y="58" width="80" height="48" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="554" y="78" font-weight="600" fill="#1a2026">"bdca"</text>
    <text x="554" y="97" font-size="11.5" font-weight="600" fill="#4169E1">dp 4</text>
  </g>
  <text x="186" y="152" text-anchor="middle" fill="#5c6b76" font-size="11.5">delete one char,</text>
  <text x="186" y="168" text-anchor="middle" fill="#5c6b76" font-size="11.5">look the rest up</text>
  <text x="40" y="200" fill="#1a2026" font-size="13" text-anchor="start">Deleting one character of each word and looking the rest up sets dp = 1 + best</text>
  <text x="40" y="218" fill="#1a2026" font-size="13" text-anchor="start">hit; the chain "a" &#8594; "ba" &#8594; "bda" &#8594; "bdca" (blue) reaches length <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
