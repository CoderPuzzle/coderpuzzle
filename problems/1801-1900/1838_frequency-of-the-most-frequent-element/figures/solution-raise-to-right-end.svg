<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <!-- sorted nums = [1,2,4]; bars x = 130 + i*120, w 90, baseline 270, scale 45px/unit -->
  <line x1="80" y1="270" x2="560" y2="270" stroke="#42525e" stroke-width="1.6"/>
  <!-- increments to reach 4 -->
  <rect x="130" y="225" width="90" height="45" fill="#9db4ea" stroke="#42525e" stroke-width="1.5"/>
  <rect x="130" y="90" width="90" height="135" fill="#dbe4f6" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="250" y="180" width="90" height="45" fill="#9db4ea" stroke="#42525e" stroke-width="1.5"/>
  <rect x="250" y="90" width="90" height="90" fill="#dbe4f6" stroke="#4169E1" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="370" y="90" width="90" height="180" fill="#dbe4f6" stroke="#42525e" stroke-width="1.5"/>
  <!-- target level line -->
  <line x1="80" y1="90" x2="560" y2="90" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="84" y="82" fill="#4169E1" font-size="12.5" font-weight="600">target = right end 4</text>
  <!-- labels -->
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="175" y="217">1</text><text x="295" y="172">2</text><text x="415" y="82">4</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="175" y="120">+3</text><text x="295" y="132">+2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="175" y="292">sorted[0]</text><text x="295" y="292">sorted[1]</text><text x="415" y="292">sorted[2]</text>
  </g>
  <!-- formula -->
  <g font-size="13" fill="#1a2026">
    <text x="80" y="322">Window cost = 3 × 4 − (1 + 2 + 4) = 5 ≤ k, so all three elements rise to 4 — frequency <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="490" y="160">The mid-blue</text>
    <text x="490" y="176">blocks are the</text>
    <text x="490" y="192">increments the</text>
    <text x="490" y="208">budget pays for;</text>
    <text x="490" y="224">the window ends</text>
    <text x="490" y="240">at the value that</text>
    <text x="490" y="256">sets the target.</text>
  </g>
</svg>
