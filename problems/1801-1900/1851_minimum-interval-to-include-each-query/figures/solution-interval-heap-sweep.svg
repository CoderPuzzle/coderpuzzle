<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="312" fill="#ffffff"/>
  <!-- intervals [[1,4],[2,4],[3,6],[4,4]], queries [2,3,4,5]; x(v) = 120 + 90*(v-1); axis y=40; bars h=14 at rows y=64/86/108/130; heap columns cx 110/250/390/530 -->
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="210" y="22">q=2</text><text x="300" y="22">q=3</text><text x="390" y="22">q=4</text><text x="480" y="22">q=5</text>
  </g>
  <line x1="100" y1="40" x2="600" y2="40" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="120" y1="36" x2="120" y2="44"/><line x1="210" y1="36" x2="210" y2="44"/>
    <line x1="300" y1="36" x2="300" y2="44"/><line x1="390" y1="36" x2="390" y2="44"/>
    <line x1="480" y1="36" x2="480" y2="44"/><line x1="570" y1="36" x2="570" y2="44"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="120" y="58">1</text><text x="210" y="58">2</text><text x="300" y="58">3</text>
    <text x="390" y="58">4</text><text x="480" y="58">5</text><text x="570" y="58">6</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.35">
    <line x1="210" y1="46" x2="210" y2="150"/>
    <line x1="300" y1="46" x2="300" y2="150"/>
    <line x1="390" y1="46" x2="390" y2="150"/>
    <line x1="480" y1="46" x2="480" y2="150"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2">
    <rect x="120" y="64" width="270" height="14"/>
    <rect x="210" y="86" width="180" height="14"/>
    <rect x="300" y="108" width="270" height="14"/>
    <rect x="384" y="130" width="12" height="14"/>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="14" y="75">[1,4] size 4</text>
    <text x="14" y="97">[2,4] size 3</text>
    <text x="14" y="119">[3,6] size 4</text>
    <text x="14" y="141">[4,4] size 1</text>
  </g>
  <g text-anchor="middle">
    <g fill="#4169E1" font-size="13" font-weight="600">
      <text x="110" y="172">q = 2</text><text x="250" y="172">q = 3</text>
      <text x="390" y="172">q = 4</text><text x="530" y="172">q = 5</text>
    </g>
    <g fill="#5c6b76" font-size="12.5">
      <text x="110" y="194">push [1,4] [2,4]</text>
      <text x="250" y="194">push [3,6]</text>
      <text x="390" y="194">push [4,4]</text>
      <text x="530" y="194">pop [4,4] [2,4] [1,4]</text>
    </g>
    <g fill="#1a2026" font-size="12.5">
      <text x="110" y="214">top [2,4] sz 3</text>
      <text x="250" y="214">top [2,4] sz 3</text>
      <text x="390" y="214">top [4,4] sz 1</text>
      <text x="530" y="214">top [3,6] sz 4</text>
    </g>
    <g fill="#4169E1" font-size="13" font-weight="600">
      <text x="110" y="234">answer 3</text><text x="250" y="234">answer 3</text>
      <text x="390" y="234">answer 1</text><text x="530" y="234">answer 4</text>
    </g>
  </g>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">The min-heap is keyed by size and holds the live intervals; each query reads its</text>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">surviving top — at q = 5 the expired tops pop and [3,6] (size 4) answers <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
