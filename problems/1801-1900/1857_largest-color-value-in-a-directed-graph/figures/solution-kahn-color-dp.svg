<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- colors = "abaca", edges 0->1, 0->2, 2->3, 3->4; nodes r22 (main row cy=80 at cx 90/250/410/570, node 1 at 170,190); dp cells 26x20 in rows y=130 (y=240 for node 1); final dp rows shown per node -->
  <text x="14" y="24" fill="#5c6b76" font-size="12.5">dp[u][c] = most nodes of color c on any path ending at u</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="90" y="50">1st</text><text x="250" y="50">3rd</text>
    <text x="410" y="50">4th</text><text x="570" y="50">5th</text>
  </g>
  <path d="M 115 80 L 225 80" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M 275 80 L 385 80" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M 435 80 L 545 80" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M 105 100 Q 150 120 155 170" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="90" cy="80" r="22"/><circle cx="250" cy="80" r="22"/>
    <circle cx="410" cy="80" r="22"/>
  </g>
  <circle cx="570" cy="80" r="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="170" cy="190" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle">
    <g font-weight="600" font-size="14" fill="#1a2026">
      <text x="90" y="78">0</text><text x="250" y="78">2</text>
      <text x="410" y="78">3</text><text x="570" y="78">4</text><text x="170" y="188">1</text>
    </g>
    <g font-size="11" fill="#5c6b76">
      <text x="90" y="92">a</text><text x="250" y="92">a</text>
      <text x="410" y="92">c</text><text x="570" y="92">a</text><text x="170" y="202">b</text>
    </g>
  </g>
  <text x="180" y="160" text-anchor="middle" fill="#9aa7b2" font-size="11">2nd</text>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5">
    <text x="172" y="120">a: 1+1 = 2</text>
    <text x="330" y="120">a: 2+0 = 2</text>
    <text x="490" y="120">a: 2+1 = 3</text>
  </g>
  <text x="14" y="144" fill="#9aa7b2" font-size="11.5">dp</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="49" y="130" width="26" height="20"/><rect x="77" y="130" width="26" height="20"/><rect x="105" y="130" width="26" height="20"/>
    <rect x="209" y="130" width="26" height="20" fill="#dbe4fb"/><rect x="237" y="130" width="26" height="20"/><rect x="265" y="130" width="26" height="20"/>
    <rect x="369" y="130" width="26" height="20"/><rect x="397" y="130" width="26" height="20"/><rect x="425" y="130" width="26" height="20"/>
    <rect x="529" y="130" width="26" height="20" fill="#dbe4fb"/><rect x="557" y="130" width="26" height="20"/><rect x="585" y="130" width="26" height="20"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#1a2026">
    <text x="62" y="144"><tspan fill="#9aa7b2">a</tspan>1</text><text x="90" y="144"><tspan fill="#9aa7b2">b</tspan>0</text><text x="118" y="144"><tspan fill="#9aa7b2">c</tspan>0</text>
    <text x="222" y="144" fill="#4169E1" font-weight="600"><tspan fill="#4169E1">a</tspan>2</text><text x="250" y="144"><tspan fill="#9aa7b2">b</tspan>0</text><text x="278" y="144"><tspan fill="#9aa7b2">c</tspan>0</text>
    <text x="382" y="144">a2</text><text x="410" y="144"><tspan fill="#9aa7b2">b</tspan>0</text><text x="438" y="144"><tspan fill="#9aa7b2">c</tspan>1</text>
    <text x="542" y="144" fill="#4169E1" font-weight="600"><tspan fill="#4169E1">a</tspan>3</text><text x="570" y="144"><tspan fill="#9aa7b2">b</tspan>0</text><text x="598" y="144"><tspan fill="#9aa7b2">c</tspan>0</text>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2">
    <rect x="129" y="240" width="26" height="20"/><rect x="157" y="240" width="26" height="20"/><rect x="185" y="240" width="26" height="20"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="142" y="254"><tspan fill="#9aa7b2">a</tspan>1</text><text x="170" y="254"><tspan fill="#9aa7b2">b</tspan>1</text><text x="198" y="254"><tspan fill="#9aa7b2">c</tspan>0</text>
  </g>
  <text x="170" y="278" text-anchor="middle" fill="#9aa7b2" font-size="10.5">no out-edges</text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Kahn order 0, 1, 2, 3, 4: each node adds its own color, then max-merges its row</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">into its successors; a-counts accrue 1 → 2 → 2 → 3 along 0→2→3→4 — answer <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
  <text x="320" y="336" text-anchor="middle" fill="#1a2026" font-size="13">A cycle would leave nodes unvisited (visited &lt; n) and force the answer −1.</text>
</svg>
