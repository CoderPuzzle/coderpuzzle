<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n=5, restrictions [[2,1],[4,1]]; pins (1,0) (2,1) (4,1); profile [0,1,2,1,2]; baseline y=230, 60px per height unit, bars 56 wide at cx 130+110k -->
  <text x="88" y="38" fill="#5c6b76" font-size="12.5">n = 5, restrictions = [[2,1],[4,1]]</text>
  <circle cx="96" cy="56" r="4" fill="#4169E1"/>
  <text x="108" y="60" fill="#5c6b76" font-size="12">pinned cap</text>
  <line x1="196" y1="56" x2="222" y2="56" stroke="#4169E1" stroke-width="2.5"/>
  <text x="230" y="60" fill="#5c6b76" font-size="12">meeting ramps</text>
  <g stroke="#f0f3f7" stroke-width="1.5">
    <line x1="85" y1="170" x2="600" y2="170"/>
    <line x1="85" y1="110" x2="600" y2="110"/>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="12">
    <text x="72" y="115">2</text><text x="72" y="175">1</text><text x="72" y="235">0</text>
  </g>
  <line x1="85" y1="230" x2="600" y2="230" stroke="#42525e" stroke-width="1.5"/>
  <rect x="212" y="170" width="56" height="60" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <rect x="322" y="110" width="56" height="120" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="432" y="170" width="56" height="60" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <rect x="542" y="110" width="56" height="120" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <polyline points="130,230 240,170 350,110 460,170 570,110" fill="none" stroke="#42525e" stroke-width="2"/>
  <polyline points="240,170 350,110 460,170" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="130" y="216" fill="#1a2026">0</text>
    <text x="240" y="190" fill="#4169E1">1</text>
    <text x="350" y="130" fill="#1a2026">2</text>
    <text x="460" y="190" fill="#4169E1">1</text>
    <text x="570" y="130" fill="#1a2026">2</text>
  </g>
  <circle cx="130" cy="230" r="5" fill="#4169E1"/>
  <circle cx="240" cy="170" r="5" fill="#4169E1"/>
  <circle cx="460" cy="170" r="5" fill="#4169E1"/>
  <circle cx="350" cy="110" r="5.5" fill="#4169E1" stroke="#ffffff" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="130" y="252">1</text><text x="240" y="252">2</text><text x="350" y="252">3</text>
    <text x="460" y="252">4</text><text x="570" y="252">5</text>
  </g>
  <text x="78" y="252" text-anchor="end" fill="#9aa7b2" font-size="12">building</text>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5">
    <text x="130" y="270">cap 0</text><text x="240" y="270">cap 1</text><text x="460" y="270">cap 1</text>
  </g>
  <text x="497" y="90" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">peak (1+1+2)/2 = 2</text>
  <path d="M 430 94 Q 392 96 362 105" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Between pins 2 and 4 the ramps meet at <tspan fill="#4169E1" font-weight="600">(1+1+2)/2 = 2</tspan>; past pin 4 the</text>
  <text x="310" y="314" text-anchor="middle" fill="#1a2026" font-size="13">free ramp tops out at 2 again — the tallest building reaches <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
