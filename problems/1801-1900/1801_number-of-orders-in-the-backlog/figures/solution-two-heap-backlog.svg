<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 414" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="414" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- orders=[[10,5,0],[15,2,1],[25,1,1],[30,4,0]]; one row per incoming batch,
       chips "amount @ price", each panel top-first (buy = highest price, sell = lowest);
       accent chip = newly added this step; step 4 matches 2 sells @15 then 1 @25,
       leftover 1 @30 joins the buys; final backlog 5 + 1 = 6 -->
  <text x="235" y="40" text-anchor="middle" fill="#1a2026" font-weight="600">buy max-heap</text>
  <text x="235" y="56" text-anchor="middle" fill="#5c6b76" font-size="11.5">(top = highest price)</text>
  <text x="485" y="40" text-anchor="middle" fill="#1a2026" font-weight="600">sell min-heap</text>
  <text x="485" y="56" text-anchor="middle" fill="#5c6b76" font-size="11.5">(top = lowest price)</text>
  <!-- row separators -->
  <g stroke="#dbe4fb" stroke-width="1">
    <line x1="20" y1="129" x2="660" y2="129"/>
    <line x1="20" y1="187" x2="660" y2="187"/>
    <line x1="20" y1="245" x2="660" y2="245"/>
  </g>
  <!-- step labels -->
  <g font-size="11.5" fill="#9aa7b2">
    <text x="24" y="92">step 1</text><text x="24" y="150">step 2</text>
    <text x="24" y="208">step 3</text><text x="24" y="266">step 4</text>
  </g>
  <g font-size="13" font-weight="600" fill="#1a2026">
    <text x="24" y="110">buy 5@10</text><text x="24" y="168">sell 2@15</text>
    <text x="24" y="226">sell 1@25</text><text x="24" y="284">buy 4@30</text>
  </g>
  <!-- row 1: buy 5@10 in; sells empty -->
  <rect x="160" y="74" width="150" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="235" y="90" text-anchor="middle" font-size="13">5 @ 10</text>
  <text x="485" y="90" text-anchor="middle" font-size="12.5" fill="#9aa7b2">empty</text>
  <!-- row 2: sell 2@15 added (no buy >= 15) -->
  <rect x="160" y="132" width="150" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="235" y="148" text-anchor="middle" font-size="13">5 @ 10</text>
  <rect x="410" y="132" width="150" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="485" y="148" text-anchor="middle" font-size="13">2 @ 15</text>
  <!-- row 3: sell 1@25 added -->
  <rect x="160" y="190" width="150" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="235" y="206" text-anchor="middle" font-size="13">5 @ 10</text>
  <rect x="410" y="190" width="150" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="485" y="206" text-anchor="middle" font-size="13">2 @ 15</text>
  <rect x="410" y="216" width="150" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="485" y="232" text-anchor="middle" font-size="13">1 @ 25</text>
  <!-- row 4: buy 4@30 consumes both sells, leftover 1 @30 joins buys -->
  <rect x="160" y="248" width="150" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="235" y="264" text-anchor="middle" font-size="13">1 @ 30</text>
  <rect x="160" y="274" width="150" height="24" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="235" y="290" text-anchor="middle" font-size="13">5 @ 10</text>
  <text x="485" y="264" text-anchor="middle" font-size="12.5" fill="#9aa7b2">empty</text>
  <!-- step 4 detail strip -->
  <text x="40" y="314" fill="#5c6b76" font-size="12">step 4 in detail — the buy at 30 eats 2 @ 15, then 1 @ 25</text>
  <rect x="42" y="322" width="108" height="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="96" y="341" text-anchor="middle" font-size="13">buy 4@30</text>
  <path d="M 154 336 L 190 336" stroke="#4169E1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="172" y="328" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">2</text>
  <rect x="194" y="322" width="108" height="28" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="248" y="341" text-anchor="middle" font-size="13" fill="#9aa7b2">sell 2@15</text>
  <line x1="212" y1="336" x2="284" y2="336" stroke="#9aa7b2" stroke-width="1.2"/>
  <path d="M 306 336 L 342 336" stroke="#4169E1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="324" y="328" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">1</text>
  <rect x="346" y="322" width="108" height="28" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="400" y="341" text-anchor="middle" font-size="13" fill="#9aa7b2">sell 1@25</text>
  <line x1="364" y1="336" x2="436" y2="336" stroke="#9aa7b2" stroke-width="1.2"/>
  <path d="M 458 336 L 502 336" stroke="#4169E1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="480" y="328" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">leftover</text>
  <rect x="506" y="322" width="108" height="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="560" y="341" text-anchor="middle" font-size="13">buy 1@30</text>
  <text x="340" y="380" text-anchor="middle" fill="#1a2026" font-size="13">Cheapest-first matching: the 30-buy eats 2 @ 15 then 1 @ 25, leaving backlog</text>
  <text x="340" y="398" text-anchor="middle" fill="#1a2026" font-size="13">5 @ 10 + 1 @ 30 = <tspan fill="#4169E1" font-weight="600">6</tspan> orders.</text>
</svg>
