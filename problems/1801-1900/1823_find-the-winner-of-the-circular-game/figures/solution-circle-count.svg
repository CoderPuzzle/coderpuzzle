<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- circle of 5 friends, center (300,180) r 118 -->
  <circle cx="300" cy="180" r="118" fill="none" stroke="#dbe4f6" stroke-width="2"/>
  <!-- counting arrows: 1->2, 3->4, 5->1, 3->5 -->
  <g stroke="#5c6b76" stroke-width="1.8" fill="none">
    <path d="M 314 76 Q 371 84 398 133" marker-end="url(#arrow)"/>
    <path d="M 348 285 Q 298 310 249 285" marker-end="url(#arrow)"/>
    <path d="M 206 133 Q 229 84 282 75" marker-end="url(#arrow)"/>
    <path d="M 347 262 Q 261 230 206 159" marker-end="url(#arrow)"/>
  </g>
  <!-- nodes: winner accent; eliminated struck through -->
  <circle cx="300" cy="62" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="300" y="67" text-anchor="middle" font-weight="600" fill="#1a2026">1</text>
  <circle cx="412" cy="146" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="412" y="151" text-anchor="middle" font-weight="600" fill="#1a2026">2</text>
  <circle cx="365" cy="275" r="20" fill="#4169E1" stroke="#42525e" stroke-width="1.5"/>
  <text x="365" y="280" text-anchor="middle" font-weight="600" fill="#ffffff">3</text>
  <circle cx="235" cy="275" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="235" y="280" text-anchor="middle" font-weight="600" fill="#1a2026">4</text>
  <circle cx="188" cy="146" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="188" y="151" text-anchor="middle" font-weight="600" fill="#1a2026">5</text>
  <!-- strikethrough on eliminated -->
  <g stroke="#5c6b76" stroke-width="1.8">
    <line x1="396" y1="132" x2="428" y2="160"/>
    <line x1="219" y1="255" x2="251" y2="295"/>
    <line x1="284" y1="46" x2="316" y2="78"/>
    <line x1="172" y1="132" x2="204" y2="160"/>
  </g>
  <!-- elimination order badges -->
  <g font-size="11.5" fill="#5c6b76">
    <text x="440" y="140">leaves 1st</text>
    <text x="222" y="310">leaves 2nd</text>
    <text x="316" y="42">leaves 3rd</text>
    <text x="118" y="130">leaves 4th</text>
    <text x="365" y="316" fill="#4169E1" font-weight="600">winner</text>
  </g>
  <!-- narration -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="470" y="200">k = 2: each count of two</text>
    <text x="470" y="216">clockwise lands on</text>
    <text x="470" y="232">(idx + k − 1) % len,</text>
    <text x="470" y="248">so 2, 4, 1, then 5 leave.</text>
  </g>
  <text x="40" y="340" fill="#1a2026" font-size="13">After a pop, the same idx already points at the next count's start — friend <tspan fill="#4169E1" font-weight="600">3</tspan> is never counted out and wins.</text>
</svg>
