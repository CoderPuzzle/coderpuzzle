<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 406" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="406" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums=[1,4,2,7], k=6=110; querying x=2=010 (third element) against the trie of
       {1,4} (values inserted before it), 15-bit width with the bits 14-3 zero spine
       elided; left-to-right levels = bits 2,1,0; node counts = values through the node;
       walk: bit 2 of k is 1 so the x-bit (0) subtree banks whole (+1, 2^1=3), continue
       child 1; bit 1 banks the empty child (0), continue child 0; bit 0 descends the
       matching child and the landed node counts exactly (+1, 2^4=6=k); query total 2;
       stream total f(6)-f(1) = 6-0 = 6 -->
  <text x="340" y="28" text-anchor="middle" fill="#1a2026" font-weight="600">nums = [1, 4, 2, 7], low = 2, high = 6</text>
  <text x="340" y="44" text-anchor="middle" fill="#5c6b76" font-size="12">querying x = 2 = 010 against k = 6 = 110 (trie = values before 2; bits 14–3 elided zero spine)</text>
  <g font-size="11.5" fill="#5c6b76">
    <text x="250" y="62" text-anchor="middle">bit 2</text>
    <text x="410" y="62" text-anchor="middle">bit 1</text>
    <text x="570" y="62" text-anchor="middle">bit 0</text>
    <text x="80" y="143" text-anchor="middle">root</text>
  </g>
  <!-- edges; accent = walked, gray = banked side / untouched, dashed = absent child -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="80" y1="171" x2="250" y2="116"/>
    <line x1="250" y1="116" x2="410" y2="116"/>
    <line x1="410" y1="116" x2="570" y2="116"/>
  </g>
  <line x1="250" y1="226" x2="410" y2="320" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="80" y1="171" x2="250" y2="226"/>
    <line x1="250" y1="226" x2="410" y2="226"/>
    <line x1="410" y1="226" x2="570" y2="226"/>
  </g>
  <!-- edge bit labels -->
  <g font-size="11.5" fill="#5c6b76">
    <text x="153" y="139" text-anchor="middle">0</text>
    <text x="183" y="217" text-anchor="middle">1</text>
    <text x="330" y="108" text-anchor="middle">0</text>
    <text x="490" y="108" text-anchor="middle">1</text>
    <text x="330" y="218" text-anchor="middle">0</text>
    <text x="490" y="218" text-anchor="middle">0</text>
    <text x="323" y="285" text-anchor="middle">1</text>
  </g>
  <!-- nodes -->
  <g stroke-width="1.5">
    <circle cx="80" cy="171" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="250" cy="116" r="16" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="410" cy="116" r="16" fill="#dbe4fb" stroke="#42525e"/>
    <circle cx="570" cy="116" r="16" fill="#dbe4fb" stroke="#42525e"/>
    <circle cx="250" cy="226" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="410" cy="226" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="570" cy="226" r="16" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="410" cy="320" r="16" fill="#f0f3f7" stroke="#9aa7b2" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="80" y="176">2</text>
    <text x="250" y="121" fill="#4169E1">1</text>
    <text x="410" y="121">1</text>
    <text x="570" y="121">1</text>
    <text x="250" y="231">1</text>
    <text x="410" y="231">1</text>
    <text x="570" y="231" fill="#4169E1">1</text>
    <text x="410" y="325" fill="#9aa7b2">0</text>
  </g>
  <text x="410" y="352" text-anchor="middle" font-size="11" fill="#9aa7b2">no child</text>
  <text x="570" y="150" text-anchor="middle" font-size="11.5" fill="#5c6b76">value 1</text>
  <text x="570" y="280" text-anchor="middle" font-size="11.5" fill="#5c6b76">value 4</text>
  <!-- walk annotations -->
  <g font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="250" y="88" text-anchor="middle">bank +1 (2^1 = 3)</text>
    <text x="570" y="262" text-anchor="middle">count +1 (2^4 = 6 = k)</text>
  </g>
  <text x="434" y="325" text-anchor="start" font-size="12.5" fill="#5c6b76">bank 0 (empty)</text>
  <text x="340" y="376" text-anchor="middle" fill="#1a2026" font-size="13">bit 2 banks value 1's subtree (2^1 = 3); bit 1 banks an empty child; bit 0 lands</text>
  <text x="340" y="394" text-anchor="middle" fill="#1a2026" font-size="13">on value 4 exactly (2^4 = 6 = k) → 2 pairs; stream: f(6) − f(1) = 6 − 0 = <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
