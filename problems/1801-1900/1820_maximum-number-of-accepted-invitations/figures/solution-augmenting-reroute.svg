<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[1,1,1],[1,0,1],[0,0,1]]; boys b0..b2 at (120, 90/160/230), girls g0..g2 at (300, 90/160/230), r=17;
       Kuhn trace: b0-g0, then b1 reroutes b0 to g1 and takes g0, then b2-g2 — matching = 3 -->
  <text x="120" y="52" text-anchor="middle" fill="#5c6b76" font-size="12">boys</text>
  <text x="300" y="52" text-anchor="middle" fill="#5c6b76" font-size="12">girls</text>
  <g stroke="#9aa7b2" stroke-width="1.3">
    <line x1="120" y1="90" x2="300" y2="90"/>
    <line x1="120" y1="90" x2="300" y2="230"/>
    <line x1="120" y1="160" x2="300" y2="230"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="120" y1="90" x2="300" y2="160"/>
    <line x1="120" y1="160" x2="300" y2="90"/>
    <line x1="120" y1="230" x2="300" y2="230"/>
  </g>
  <path d="M 137.6 86.1 L 283.9 143.1" fill="none" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="196" y="74" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">b0 re-hung to g1</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="120" cy="90" r="17"/><circle cx="120" cy="160" r="17"/><circle cx="120" cy="230" r="17"/>
    <circle cx="300" cy="90" r="17"/><circle cx="300" cy="160" r="17"/><circle cx="300" cy="230" r="17"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="120" y="94.5">b0</text><text x="120" y="164.5">b1</text><text x="120" y="234.5">b2</text>
    <text x="300" y="94.5">g0</text><text x="300" y="164.5">g1</text><text x="300" y="234.5">g2</text>
  </g>
  <g font-size="12.5" fill="#1a2026">
    <text x="356" y="92"><tspan fill="#4169E1" font-weight="600">1</tspan>  boy 0: girl 0 free - b0-g0.</text>
    <text x="356" y="122"><tspan fill="#4169E1" font-weight="600">2</tspan>  boy 1: girl 0 is taken, so</text>
    <text x="372" y="140">boy 0 reroutes to girl 1;</text>
    <text x="372" y="158">boy 1 takes girl 0.</text>
    <text x="356" y="188"><tspan fill="#4169E1" font-weight="600">3</tspan>  boy 2: girl 2 free - b2-g2.</text>
    <text x="356" y="214">Every boy ends up seated:</text>
    <text x="356" y="232">the answer is the maximum <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
  </g>
  <text x="320" y="278" text-anchor="middle" fill="#1a2026" font-size="13">The reroute is an augmenting path: girl 0 is freed, boy 0 re-hangs to girl 1,</text>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">boy 1 takes girl 0, and boy 2 takes girl 2 - the matching grows to <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
