<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="372" fill="#ffffff"/>
  <!-- nums = [1,2,3,2]; bars x = 110 + i*110, w 70, baseline 230, scale 42px/unit -->
  <line x1="70" y1="230" x2="560" y2="230" stroke="#42525e" stroke-width="1.6"/>
  <rect x="110" y="188" width="70" height="42" fill="#dbe4f6" stroke="#42525e" stroke-width="1.5"/>
  <rect x="220" y="146" width="70" height="84" fill="#9db4ea" stroke="#42525e" stroke-width="1.5"/>
  <rect x="330" y="104" width="70" height="126" fill="#dbe4f6" stroke="#42525e" stroke-width="1.5"/>
  <rect x="440" y="146" width="70" height="84" fill="#4169E1" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="145" y="222">1</text><text x="255" y="222" fill="#ffffff">2</text><text x="365" y="222">3</text><text x="475" y="222" fill="#ffffff">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="145" y="252">0</text><text x="255" y="252">1</text><text x="365" y="252">2</text><text x="475" y="252">3</text>
  </g>
  <!-- min level line across winning window [1..3] -->
  <line x1="220" y1="146" x2="510" y2="146" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="514" y="150" fill="#4169E1" font-size="12.5" font-weight="600">min 2</text>
  <!-- window bracket -->
  <path d="M 220 264 v 8 h 290 v -8" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="365" y="290" text-anchor="middle" fill="#1a2026" font-size="12.5">sum 2 + 3 + 2 = 7 → 2 × 7 = <tspan fill="#4169E1" font-weight="600">14</tspan></text>
  <!-- stack snapshots -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="70" y="322">i = 2 → stack [0, 1, 2] (values 1 &lt; 2 &lt; 3)</text>
    <text x="70" y="340">i = 3, cur 2 → pops 3 (window [2,2], 3 × 3 = 9) and 2 (window [1,2], 2 × 5 = 10), pushes 3</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="430" y="322">sentinel 0 → pops index 3:</text>
    <text x="430" y="340">nearest smaller left is 0, so its</text>
  </g>
  <text x="430" y="358" fill="#5c6b76" font-size="12.5">window is [1, 3] — the winner 14.</text>
</svg>
