<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- encoded1 = [[1,3],[2,1],[3,2]] expands to nums1; encoded2 = [[2,3],[3,3]] to nums2; cells 40px from x=180; the sweep takes runs of 3, 1, 2 cells at products 2, 6, 9 -->
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="166" y="86">nums1</text>
    <text x="166" y="128">nums2</text>
    <text x="166" y="192">product</text>
  </g>
  <!-- nums1 = [1,1,1,2,3,3], run borders after the three 1s and the lone 2 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="180" y="64" width="240" height="34"/>
  </g>
  <g stroke="#42525e" stroke-width="1.2">
    <path d="M 220 64 V 98 M 260 64 V 98 M 380 64 V 98"/>
  </g>
  <g stroke="#1a2026" stroke-width="2.4">
    <path d="M 300 64 V 98 M 340 64 V 98"/>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="200" y="86">1</text><text x="240" y="86">1</text><text x="280" y="86">1</text>
    <text x="320" y="86">2</text><text x="360" y="86">3</text><text x="400" y="86">3</text>
  </g>
  <!-- nums2 = [2,2,2,3,3,3], run border after the three 2s -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="180" y="106" width="240" height="34"/>
  </g>
  <g stroke="#42525e" stroke-width="1.2">
    <path d="M 220 106 V 140 M 260 106 V 140 M 300 106 V 140 M 380 106 V 140"/>
  </g>
  <g stroke="#1a2026" stroke-width="2.4">
    <path d="M 340 106 V 140"/>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#1a2026">
    <text x="200" y="128">2</text><text x="240" y="128">2</text><text x="280" y="128">2</text>
    <text x="320" y="128">3</text><text x="360" y="128">3</text><text x="400" y="128">3</text>
  </g>
  <!-- product runs: 1*2 three cells, 2*3 one cell, 3*3 two cells -->
  <g fill="#ffffff" stroke="#4169E1" stroke-width="1.8">
    <rect x="180" y="170" width="120" height="34"/>
    <rect x="300" y="170" width="40" height="34"/>
    <rect x="340" y="170" width="80" height="34"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="200" y="192">2</text><text x="240" y="192">2</text><text x="280" y="192">2</text>
    <text x="320" y="192">6</text>
    <text x="360" y="192">9</text><text x="400" y="192">9</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.2" fill="none">
    <path d="M 180 212 V 216 H 300 V 212"/>
    <path d="M 300 212 V 216 H 340 V 212"/>
    <path d="M 340 212 V 216 H 420 V 212"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="240" y="232">take 3</text>
    <text x="320" y="232">take 1</text>
    <text x="380" y="232">take 2</text>
  </g>
  <text x="320" y="258" text-anchor="middle" fill="#1a2026" font-size="13">compressed output: <tspan fill="#4169E1" font-weight="600">[[2,3],[6,1],[9,2]]</tspan></text>
  <text x="320" y="282" text-anchor="middle" fill="#1a2026" font-size="13">Each step consumes min(leftover1, leftover2) cells: takes 3, 1, 2 meet products 2, 6, 9.</text>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">Whichever encoding's run ends first advances; only adjacent equal products merge.</text>
</svg>
