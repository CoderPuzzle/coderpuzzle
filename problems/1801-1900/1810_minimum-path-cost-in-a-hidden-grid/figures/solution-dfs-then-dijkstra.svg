<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="278" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- grid = [[2,3],[1,1]], start (0,1)=3, target (1,0)=1; cells 64x40 at (84/148, 92/132);
       learned map rows dr 0..1, cols dc -1..0 at (448/512, 92/132): [[2,0],[1,1]];
       Dijkstra route (0,0) -> (1,0) -> (1,-1) pays 1 + 1 = 2 -->
  <text x="148" y="66" text-anchor="middle" fill="#5c6b76" font-size="12.5">hidden grid</text>
  <g fill="#9aa7b2" font-size="11.5" text-anchor="middle">
    <text x="116" y="84">0</text><text x="180" y="84">1</text>
  </g>
  <g fill="#9aa7b2" font-size="11.5" text-anchor="end">
    <text x="76" y="120">0</text><text x="76" y="160">1</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="84" y="92" width="64" height="40"/><rect x="148" y="92" width="64" height="40"/>
    <rect x="84" y="132" width="64" height="40"/><rect x="148" y="132" width="64" height="40"/>
  </g>
  <rect x="148" y="92" width="64" height="40" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="84" y="132" width="64" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="116" y="121">2</text><text x="180" y="121">3</text>
    <text x="116" y="161">1</text><text x="180" y="161">1</text>
  </g>
  <text x="180" y="192" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">start</text>
  <text x="116" y="192" text-anchor="middle" fill="#1a2026" font-size="11.5" font-weight="600">target</text>
  <path d="M 240 136 H 412" stroke="#42525e" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="326" y="118" text-anchor="middle" fill="#5c6b76" font-size="12">DFS learns the map,</text>
  <text x="326" y="160" text-anchor="middle" fill="#5c6b76" font-size="12">costs relative to start</text>
  <text x="512" y="66" text-anchor="middle" fill="#5c6b76" font-size="12.5">learned cost map (relative to start)</text>
  <g fill="#9aa7b2" font-size="11.5" text-anchor="middle">
    <text x="480" y="84">-1</text><text x="544" y="84">0</text>
  </g>
  <g fill="#9aa7b2" font-size="11.5" text-anchor="end">
    <text x="440" y="120">0</text><text x="440" y="160">1</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="448" y="92" width="64" height="40"/><rect x="512" y="92" width="64" height="40"/>
    <rect x="448" y="132" width="64" height="40"/><rect x="512" y="132" width="64" height="40"/>
  </g>
  <rect x="512" y="92" width="64" height="40" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <rect x="448" y="132" width="64" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="480" y="121">2</text><text x="544" y="121">0</text>
    <text x="480" y="161">1</text><text x="544" y="161">1</text>
  </g>
  <circle cx="566" cy="102" r="8" fill="#4169E1"/>
  <text x="566" y="105.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">S</text>
  <circle cx="502" cy="142" r="8" fill="#1a2026"/>
  <text x="502" y="145.5" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">T</text>
  <polyline points="520,100 520,168 456,168" fill="none" stroke="#4169E1" stroke-width="3"/>
  <g fill="#4169E1">
    <circle cx="520" cy="100" r="3.5"/><circle cx="520" cy="168" r="3.5"/><circle cx="456" cy="168" r="3.5"/>
  </g>
  <text x="320" y="234" text-anchor="middle" fill="#1a2026" font-size="13">The DFS visits every reachable cell and records what each move onto it costs,</text>
  <text x="320" y="254" text-anchor="middle" fill="#1a2026" font-size="13">keyed relative to the start; Dijkstra settles down then left, paying <tspan fill="#4169E1" font-weight="600">1 + 1 = 2</tspan>.</text>
</svg>
