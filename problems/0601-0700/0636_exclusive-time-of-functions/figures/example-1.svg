<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 244" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- boundary ticks -->
  <g stroke="#c9d2da" stroke-width="1" stroke-dasharray="3 3">
    <line x1="100" y1="36" x2="100" y2="150"/>
    <line x1="212" y1="36" x2="212" y2="150"/>
    <line x1="436" y1="36" x2="436" y2="150"/>
    <line x1="492" y1="36" x2="492" y2="150"/>
  </g>
  <!-- function 1 runs time units 2..5 -->
  <text x="208" y="34" text-anchor="end" fill="#4169E1" font-size="12.5">1 start</text>
  <rect x="212" y="42" width="224" height="16" fill="#4169E1"/>
  <text x="440" y="34" fill="#4169E1" font-size="12.5">1 end</text>
  <!-- function 0 spans 0..6 but delegates the middle -->
  <text x="96" y="80" text-anchor="end" fill="#b57f30" font-size="12.5">0 start</text>
  <rect x="100" y="88" width="392" height="16" fill="#b57f30" fill-opacity="0.45" stroke="#b57f30" stroke-width="1.4"/>
  <text x="496" y="80" fill="#b57f30" font-size="12.5">0 end</text>
  <!-- one box per timestamp unit -->
  <g stroke="#1a2026" stroke-width="1.4">
    <rect x="100" y="150" width="56" height="34" fill="#f6e8d3"/>
    <rect x="156" y="150" width="56" height="34" fill="#f6e8d3"/>
    <rect x="212" y="150" width="56" height="34" fill="#dbe4fb"/>
    <rect x="268" y="150" width="56" height="34" fill="#dbe4fb"/>
    <rect x="324" y="150" width="56" height="34" fill="#dbe4fb"/>
    <rect x="380" y="150" width="56" height="34" fill="#dbe4fb"/>
    <rect x="436" y="150" width="56" height="34" fill="#f6e8d3"/>
  </g>
  <g fill="#1a2026" text-anchor="middle">
    <text x="128" y="172">0</text><text x="184" y="172">1</text><text x="240" y="172">2</text><text x="296" y="172">3</text>
    <text x="352" y="172">4</text><text x="408" y="172">5</text><text x="464" y="172">6</text>
  </g>
  <rect x="100" y="200" width="12" height="12" fill="#b57f30" fill-opacity="0.45" stroke="#b57f30"/>
  <text x="118" y="211" fill="#1a2026" font-size="12.5">function 0 — exclusive time 2 + 1 = 3</text>
  <rect x="352" y="200" width="12" height="12" fill="#4169E1"/>
  <text x="370" y="211" fill="#1a2026" font-size="12.5">function 1 — exclusive time 4</text>
</svg>
