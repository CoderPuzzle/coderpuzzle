<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<rect x="60" y="90" width="66" height="46" fill="#ffffff" stroke="#1a2026"/>
  <text x="93.0" y="118.0" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <rect x="126" y="90" width="66" height="46" fill="#ffffff" stroke="#1a2026"/>
  <text x="159.0" y="118.0" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <rect x="192" y="90" width="66" height="46" fill="#ffffff" stroke="#1a2026"/>
  <text x="225.0" y="118.0" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <rect x="258" y="90" width="66" height="46" fill="#ffffff" stroke="#1a2026"/>
  <text x="291.0" y="118.0" text-anchor="middle" fill="#1a2026" font-weight="600">4</text>
  <text x="291.0" y="78" text-anchor="middle" fill="#4169E1" font-weight="600">i = 3 (c = 4)</text>
  <line x1="93.0" y1="150" x2="93.0" y2="180" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="93.0" y="198" text-anchor="middle" fill="#4169E1">lo = 0</text>
  <line x1="225.0" y1="150" x2="225.0" y2="180" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="225.0" y="198" text-anchor="middle" fill="#4169E1">hi = 2</text>
  <path d="M 126 204 L 126 216 L 258 216 L 258 204" fill="none" stroke="#42525e" stroke-width="1.5"/>
  <text x="192.0" y="234" text-anchor="middle" fill="#5c6b76">nums[lo] + nums[hi] = 2 + 3 &gt; 4, so hi &#8722; lo = 2 triplets are counted at once</text>
  <text x="60" y="46" fill="#5c6b76" font-size="12">After sorting [2,2,3,4]: outer pointer fixes the largest side c = 4.</text>
</svg>
