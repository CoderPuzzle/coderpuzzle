<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="280" fill="#ffffff"/>
  <!-- s = "00110011" → runs 2,2,2,2; cells 46x46 at x=96+46i, y=84; boundaries at x=188,280,372 -->
  <text x="84" y="112" text-anchor="end" fill="#5c6b76" font-size="12.5">s</text>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="none">
    <path d="M 98 71 V 65 H 186 V 71"/>
    <path d="M 190 71 V 65 H 278 V 71"/>
    <path d="M 282 71 V 65 H 370 V 71"/>
    <path d="M 374 71 V 65 H 462 V 71"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="142" y="59">2</text><text x="234" y="59">2</text>
    <text x="326" y="59">2</text><text x="418" y="59">2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="96" y="84" width="46" height="46" fill="#ffffff"/>
    <rect x="142" y="84" width="46" height="46" fill="#ffffff"/>
    <rect x="280" y="84" width="46" height="46" fill="#ffffff"/>
    <rect x="326" y="84" width="46" height="46" fill="#ffffff"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.4" fill="#dbe4fb">
    <rect x="188" y="84" width="46" height="46"/>
    <rect x="234" y="84" width="46" height="46"/>
    <rect x="372" y="84" width="46" height="46"/>
    <rect x="418" y="84" width="46" height="46"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="15" font-weight="600">
    <text x="119" y="112">0</text><text x="165" y="112">0</text>
    <text x="211" y="112">1</text><text x="257" y="112">1</text>
    <text x="303" y="112">0</text><text x="349" y="112">0</text>
    <text x="395" y="112">1</text><text x="441" y="112">1</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="188" y1="138" x2="188" y2="160"/>
    <line x1="280" y1="138" x2="280" y2="160"/>
    <line x1="372" y1="138" x2="372" y2="160"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="188" y="182">min(2, 2) = 2</text>
    <text x="280" y="182">min(2, 2) = 2</text>
    <text x="372" y="182">min(2, 2) = 2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="188" y="200">"01", "0011"</text>
    <text x="280" y="200">"10", "1100"</text>
    <text x="372" y="200">"01", "0011"</text>
  </g>
  <text x="280" y="238" text-anchor="middle" fill="#1a2026" font-size="13">Four equal runs of 2 make three boundaries, each banking min(prev, cur) = 2:</text>
  <text x="280" y="258" text-anchor="middle" fill="#1a2026" font-size="13">2 + 2 + 2 = <tspan fill="#4169E1" font-weight="600">6</tspan>, the six valid substrings of the example, repeats included.</text>
</svg>
