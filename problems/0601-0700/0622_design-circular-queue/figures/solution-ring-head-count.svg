<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- k=3; final buf = [4,2,3], head = 1, count = 3; cells 96x56 at x = 176/292/408, y = 76 -->
  <text x="320" y="38" text-anchor="middle" fill="#5c6b76" font-size="12.5">k = 3 &#8212; after enQueue 1, 2, 3, then deQueue, then enQueue 4</text>
  <text x="340" y="58" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">head = 1, count = 3</text>
  <line x1="340" y1="64" x2="340" y2="72" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- cells -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="176" y="76" width="96" height="56"/><rect x="292" y="76" width="96" height="56"/><rect x="408" y="76" width="96" height="56"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="224" y="110" fill="#4169E1">4</text>
    <text x="340" y="110" fill="#1a2026">2</text>
    <text x="456" y="110" fill="#1a2026">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="224" y="152">slot 0</text><text x="340" y="152">slot 1</text><text x="456" y="152">slot 2</text>
  </g>
  <!-- Rear arrow into slot 0 -->
  <line x1="110" y1="96" x2="168" y2="96" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="104" y="100" text-anchor="end" fill="#5c6b76" font-size="12.5">Rear</text>
  <!-- wrap-around path from slot 2 into the freed slot 0 -->
  <path d="M 508 96 C 566 100, 566 212, 452 212 L 248 212 C 190 212, 184 162, 198 140" fill="none" stroke="#42525e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <text x="346" y="204" text-anchor="middle" fill="#5c6b76" font-size="11.5">the ring wraps</text>
  <!-- caption -->
  <text x="320" y="252" text-anchor="middle" fill="#1a2026" font-size="13">After deQueue frees slot 0, enQueue(4) wraps into it &#8212; buf becomes [4, 2, 3] with</text>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">head = 1; Rear = buf[(1 + 3 &#8722; 1) mod 3] = buf[0] = <tspan fill="#4169E1" font-weight="600">4</tspan> and Front = buf[1] = 2.</text>
</svg>
