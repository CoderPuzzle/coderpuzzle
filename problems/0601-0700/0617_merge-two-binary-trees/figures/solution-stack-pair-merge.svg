<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="366" fill="#ffffff"/>
  <!-- tree1 = [1,3,2,5], tree2 = [2,1,3,null,4,null,7]; summed circles r=24 at (430,84)(320,172)(540,172), lone r=20 at (255,262)(385,262)(590,262); stack cells 130x32 at x=36 -->
  <!-- stack panel -->
  <text x="101" y="62" text-anchor="middle" fill="#5c6b76" font-size="12.5">the stack</text>
  <rect x="36" y="76" width="130" height="32" fill="#dbe4fb"/>
  <text x="101" y="97" text-anchor="middle" fill="#1a2026" font-size="13">(1,2) &#8594; 3</text>
  <text x="101" y="123" text-anchor="middle" fill="#5c6b76" font-size="10.5">root pair settles</text>
  <text x="101" y="146" text-anchor="middle" fill="#5c6b76" font-size="10.5">then the stack holds</text>
  <rect x="36" y="154" width="130" height="32" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="101" y="175" text-anchor="middle" fill="#1a2026" font-size="13">(2,3) &#8594; 5</text>
  <text x="30" y="174" text-anchor="end" fill="#4169E1" font-size="10.5">top</text>
  <rect x="36" y="192" width="130" height="32" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="101" y="213" text-anchor="middle" fill="#1a2026" font-size="13">(3,1) &#8594; 4</text>
  <!-- merged tree edges -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="409" y1="101" x2="341" y2="155"/>
    <line x1="451" y1="101" x2="519" y2="155"/>
    <line x1="304" y1="194" x2="269" y2="243"/>
    <line x1="336" y1="194" x2="371" y2="243"/>
    <line x1="553" y1="196" x2="578" y2="241"/>
  </g>
  <text x="430" y="44" text-anchor="middle" fill="#5c6b76" font-size="10.5">merged tree</text>
  <!-- summed nodes: white value + light-accent pair inside -->
  <circle cx="430" cy="84" r="24" fill="#4169E1"/>
  <text x="430" y="84" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="15">3</text>
  <text x="430" y="99" text-anchor="middle" fill="#dbe4fb" font-size="10.5">1+2</text>
  <circle cx="320" cy="172" r="24" fill="#4169E1"/>
  <text x="320" y="172" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="15">4</text>
  <text x="320" y="187" text-anchor="middle" fill="#dbe4fb" font-size="10.5">3+1</text>
  <circle cx="540" cy="172" r="24" fill="#4169E1"/>
  <text x="540" y="172" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="15">5</text>
  <text x="540" y="187" text-anchor="middle" fill="#dbe4fb" font-size="10.5">2+3</text>
  <!-- lone nodes, attached whole -->
  <circle cx="255" cy="262" r="20" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.6"/>
  <text x="255" y="267" text-anchor="middle" fill="#1a2026" font-size="14">5</text>
  <circle cx="385" cy="262" r="20" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.6"/>
  <text x="385" y="267" text-anchor="middle" fill="#1a2026" font-size="14">4</text>
  <circle cx="590" cy="262" r="20" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.6"/>
  <text x="590" y="267" text-anchor="middle" fill="#1a2026" font-size="14">7</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="255" y="298">from t1</text>
    <text x="385" y="298">from t2</text>
    <text x="590" y="298">from t2</text>
  </g>
  <!-- caption -->
  <text x="320" y="332" text-anchor="middle" fill="#1a2026" font-size="13">The stack sums the three overlapping pairs in place &#8212; 1+2, 3+1, 2+3 &#8212;</text>
  <text x="320" y="352" text-anchor="middle" fill="#1a2026" font-size="13">lone subtrees 5, 4, 7 attach whole: <tspan fill="#4169E1" font-weight="600">[3,4,5,5,4,null,7]</tspan>.</text>
</svg>
