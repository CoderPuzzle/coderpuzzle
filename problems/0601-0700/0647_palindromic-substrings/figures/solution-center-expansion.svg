<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 276" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<rect x="50" y="150" width="54" height="46" fill="#ffffff" stroke="#1a2026"/>
  <text x="77.0" y="178.0" text-anchor="middle" fill="#1a2026" font-weight="600">a</text>
  <rect x="104" y="150" width="54" height="46" fill="#ffffff" stroke="#1a2026"/>
  <text x="131.0" y="178.0" text-anchor="middle" fill="#1a2026" font-weight="600">a</text>
  <rect x="158" y="150" width="54" height="46" fill="#ffffff" stroke="#1a2026"/>
  <text x="185.0" y="178.0" text-anchor="middle" fill="#1a2026" font-weight="600">a</text>
  <path d="M 131.0 140 L 131.0 116" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="131.0" y="108" text-anchor="middle" fill="#4169E1">odd center (1, 1): &quot;a&quot;</text>
  <path d="M 56 202 C 131.0 242, 131.0 242, 206 202" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="131.0" y="258" text-anchor="middle" fill="#4169E1">expands to (0, 2): &quot;aaa&quot;</text>
  <path d="M 104 140 L 104 116" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="104" y="108" text-anchor="middle" fill="#5c6b76">even center (0, 1): &quot;aa&quot;</text>
  <text x="50" y="60" fill="#5c6b76" font-size="12">Each center expands while the outer characters match; every successful</text>
  <text x="50" y="78" fill="#5c6b76" font-size="12">step records one palindrome. For &quot;aaa&quot;: centers at 0, 1, 2 (odd) and</text>
  <text x="50" y="96" fill="#5c6b76" font-size="12">between 0&#8211;1, 1&#8211;2 (even) yield 3 + 2 + 1 + 1 + ... = 6 palindromes.</text>
  <text x="50" y="114" fill="#5c6b76" font-size="12">(center 0 odd: &quot;a&quot;; center 1 odd: &quot;a&quot;,&quot;aaa&quot;; center 2 odd: &quot;a&quot;; evens: &quot;aa&quot; twice)</text>
</svg>
