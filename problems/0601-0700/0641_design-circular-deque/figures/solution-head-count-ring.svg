<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 434" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="434" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- k = 3; slots 0,1,2 at x=250/306/362 (48x40); rows after insertFront(3), deleteLast(), insertFront(4); wrap arc = slot 2's neighbor is slot 0 -->
  <!-- row 1: after insertLast(1), insertLast(2), insertFront(3) -->
  <path d="M 386 78 C 386 52, 274 52, 274 78" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="72" text-anchor="middle" fill="#9aa7b2" font-size="10">wraps</text>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="250" y="84" width="48" height="40"/><rect x="306" y="84" width="48" height="40"/><rect x="362" y="84" width="48" height="40"/>
  </g>
  <g text-anchor="middle">
    <text x="257" y="99" fill="#5c6b76" font-size="9.5">0</text>
    <text x="313" y="99" fill="#5c6b76" font-size="9.5">1</text>
    <text x="369" y="99" fill="#5c6b76" font-size="9.5">2</text>
    <text x="274" y="112" fill="#1a2026" font-size="15" font-weight="600">1</text>
    <text x="330" y="112" fill="#1a2026" font-size="15" font-weight="600">2</text>
    <text x="386" y="112" fill="#1a2026" font-size="15" font-weight="600">3</text>
  </g>
  <path d="M 380 140 L 392 140 L 386 130 z" fill="#4169E1"/>
  <path d="M 324 140 L 336 140 L 330 130 z" fill="#1a2026"/>
  <text x="386" y="156" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">head = 2</text>
  <text x="330" y="156" text-anchor="middle" fill="#1a2026" font-size="12" font-weight="600">rear</text>
  <text x="40" y="98" fill="#1a2026" font-size="12.5" font-weight="600">insertLast(1), insertLast(2),</text>
  <text x="40" y="116" fill="#1a2026" font-size="12.5" font-weight="600">insertFront(3)</text>
  <text x="40" y="134" fill="#5c6b76" font-size="12">full — insertFront(4) → false</text>
  <text x="470" y="98" fill="#5c6b76" font-size="12">count = 3 = k</text>
  <text x="470" y="116" fill="#5c6b76" font-size="12">getRear() → 2 (slot 1)</text>
  <!-- row 2: after deleteLast() -->
  <path d="M 386 190 C 386 164, 274 164, 274 190" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="250" y="196" width="48" height="40"/><rect x="362" y="196" width="48" height="40"/>
  </g>
  <rect x="306" y="196" width="48" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g text-anchor="middle">
    <text x="257" y="211" fill="#5c6b76" font-size="9.5">0</text>
    <text x="313" y="211" fill="#9aa7b2" font-size="9.5">1</text>
    <text x="369" y="211" fill="#5c6b76" font-size="9.5">2</text>
    <text x="274" y="224" fill="#1a2026" font-size="15" font-weight="600">1</text>
    <text x="386" y="224" fill="#1a2026" font-size="15" font-weight="600">3</text>
  </g>
  <path d="M 380 252 L 392 252 L 386 242 z" fill="#4169E1"/>
  <path d="M 268 252 L 280 252 L 274 242 z" fill="#1a2026"/>
  <text x="386" y="268" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">head = 2</text>
  <text x="274" y="268" text-anchor="middle" fill="#1a2026" font-size="12" font-weight="600">rear</text>
  <text x="40" y="210" fill="#1a2026" font-size="12.5" font-weight="600">deleteLast()</text>
  <text x="40" y="228" fill="#5c6b76" font-size="12">count 3 → 2 — no index moves</text>
  <text x="470" y="210" fill="#5c6b76" font-size="12">count = 2</text>
  <text x="470" y="228" fill="#5c6b76" font-size="12">rear = slot 0</text>
  <!-- row 3: after insertFront(4) -->
  <path d="M 386 302 C 386 276, 274 276, 274 302" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="250" y="308" width="48" height="40"/><rect x="362" y="308" width="48" height="40"/>
  </g>
  <rect x="306" y="308" width="48" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle">
    <text x="257" y="323" fill="#5c6b76" font-size="9.5">0</text>
    <text x="313" y="323" fill="#5c6b76" font-size="9.5">1</text>
    <text x="369" y="323" fill="#5c6b76" font-size="9.5">2</text>
    <text x="274" y="336" fill="#1a2026" font-size="15" font-weight="600">1</text>
    <text x="330" y="336" fill="#1a2026" font-size="15" font-weight="600">4</text>
    <text x="386" y="336" fill="#1a2026" font-size="15" font-weight="600">3</text>
  </g>
  <path d="M 324 364 L 336 364 L 330 354 z" fill="#4169E1"/>
  <path d="M 268 364 L 280 364 L 274 354 z" fill="#1a2026"/>
  <text x="330" y="380" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">head = 1</text>
  <text x="274" y="380" text-anchor="middle" fill="#1a2026" font-size="12" font-weight="600">rear</text>
  <text x="40" y="322" fill="#1a2026" font-size="12.5" font-weight="600">insertFront(4)</text>
  <text x="40" y="340" fill="#5c6b76" font-size="12">head 2 → 1, slot 1 ← 4</text>
  <text x="40" y="358" fill="#4169E1" font-size="12" font-weight="600">getFront() → 4</text>
  <text x="470" y="322" fill="#5c6b76" font-size="12">count = 3</text>
  <text x="470" y="340" fill="#5c6b76" font-size="12">isFull() → true</text>
  <text x="40" y="404" fill="#1a2026" font-size="13">deleteLast only decrements count; insertFront steps head back mod k and</text>
  <text x="40" y="422" fill="#1a2026" font-size="13">writes — the full ring first rejects 4, then takes it, and <tspan fill="#4169E1" font-weight="600">getFront() = 4</tspan>.</text>
</svg>
