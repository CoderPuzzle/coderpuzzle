<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- trie for apple, app; node = prefix, lower number = running total after insert(app, 2): a/ap/app 5, appl/apple 3 -->
  <path d="M 78 124 Q 202 76 326 124" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="202" y="92" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">delta +2 = 2 − 0, a new key</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="42" y="130" width="72" height="46" rx="10"/>
    <rect x="166" y="130" width="72" height="46" rx="10"/>
    <rect x="290" y="130" width="72" height="46" rx="10"/>
    <rect x="414" y="130" width="72" height="46" rx="10"/>
    <rect x="538" y="130" width="72" height="46" rx="10"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="78" y="150" fill="#1a2026">a</text>
    <text x="202" y="150" fill="#1a2026">ap</text>
    <text x="326" y="150" fill="#1a2026">app</text>
    <text x="450" y="150" fill="#1a2026">appl</text>
    <text x="574" y="150" fill="#1a2026">apple</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="78" y="168" fill="#4169E1">5</text>
    <text x="202" y="168" fill="#4169E1">5</text>
    <text x="326" y="168" fill="#4169E1">5</text>
    <text x="450" y="168" fill="#1a2026">3</text>
    <text x="574" y="168" fill="#1a2026">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 118 153 L 161 153" marker-end="url(#arrowgray)"/>
    <path d="M 242 153 L 285 153" marker-end="url(#arrowgray)"/>
    <path d="M 366 153 L 409 153" marker-end="url(#arrowgray)"/>
    <path d="M 490 153 L 533 153" marker-end="url(#arrowgray)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="140" y="141">p</text>
    <text x="264" y="141">p</text>
    <text x="388" y="141">l</text>
    <text x="512" y="141">e</text>
  </g>
  <!-- sum("ap") reads the node -->
  <path d="M 202 236 L 202 183" fill="none" stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="202" y="254" text-anchor="middle" fill="#4169E1" font-size="13.5" font-weight="600">sum("ap")</text>
  <text x="40" y="282" fill="#1a2026" font-size="13">insert("app", 2) is a new key: delta <tspan fill="#4169E1" font-weight="600">+2</tspan> lifts a, ap, app from 3 to 5;</text>
  <text x="40" y="300" fill="#1a2026" font-size="13">appl and apple keep 3 — sum("ap") reads the <tspan fill="#4169E1" font-weight="600">5</tspan> on ap.</text>
</svg>
