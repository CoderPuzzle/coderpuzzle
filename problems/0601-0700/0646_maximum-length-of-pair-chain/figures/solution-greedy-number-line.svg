<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- pairs sorted by right endpoint = [[1,2],[2,3],[3,4]]; x = 80 + 96v; segments y=96 ([1,2],[3,4]) and y=112 ([2,3]) -->
  <!-- number line -->
  <line x1="80" y1="220" x2="560" y2="220" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="80" y1="216" x2="80" y2="224"/><line x1="176" y1="216" x2="176" y2="224"/>
    <line x1="272" y1="216" x2="272" y2="224"/><line x1="368" y1="216" x2="368" y2="224"/>
    <line x1="464" y1="216" x2="464" y2="224"/><line x1="560" y1="216" x2="560" y2="224"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="80" y="242">0</text><text x="176" y="242">1</text><text x="272" y="242">2</text>
    <text x="368" y="242">3</text><text x="464" y="242">4</text><text x="560" y="242">5</text>
  </g>
  <!-- pairs -->
  <g stroke="#4169E1" stroke-width="5" stroke-linecap="round">
    <line x1="176" y1="96" x2="272" y2="96"/>
    <line x1="368" y1="96" x2="464" y2="96"/>
  </g>
  <line x1="272" y1="112" x2="368" y2="112" stroke="#9aa7b2" stroke-width="5" stroke-linecap="round"/>
  <g fill="#4169E1">
    <circle cx="176" cy="96" r="4.5"/><circle cx="272" cy="96" r="4.5"/>
    <circle cx="368" cy="96" r="4.5"/><circle cx="464" cy="96" r="4.5"/>
  </g>
  <g fill="#9aa7b2">
    <circle cx="272" cy="112" r="4.5"/><circle cx="368" cy="112" r="4.5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="224" y="82" fill="#1a2026">[1, 2]</text>
    <text x="416" y="82" fill="#1a2026">[3, 4]</text>
    <text x="320" y="104" fill="#9aa7b2">[2, 3]</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="224" y="120" fill="#4169E1" font-weight="600">take (1 &gt; −∞)</text>
    <text x="416" y="120" fill="#4169E1" font-weight="600">take (3 &gt; 2)</text>
    <text x="320" y="136" fill="#5c6b76">skip — 2 &gt; 2 is false</text>
  </g>
  <!-- chain arc over the rejected pair -->
  <path d="M 278 88 C 300 56, 340 56, 362 88" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="48" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">2 &lt; 3</text>
  <!-- current_end barrier: 2 then 4 -->
  <g stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="272" y1="150" x2="272" y2="220"/>
    <line x1="464" y1="150" x2="464" y2="220"/>
  </g>
  <line x1="280" y1="176" x2="450" y2="176" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="366" y="168" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">current_end advances 2 → 4</text>
  <text x="40" y="268" fill="#1a2026" font-size="13">Sorted by right endpoint: [1, 2] taken, the touching [2, 3] rejected (2 &gt; 2</text>
  <text x="40" y="286" fill="#1a2026" font-size="13">fails strictly), then [3, 4] taken — the barrier moves 2 → 4. Chain length <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
