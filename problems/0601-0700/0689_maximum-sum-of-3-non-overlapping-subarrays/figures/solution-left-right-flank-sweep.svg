<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,2,1,2,6,7,5,1], k = 2; window sums W = [3,3,3,8,13,12,6] for starts s = 0..6; left = [0,0,0,3,4,4,4]; right = [4,4,4,4,4,5,6]; columns cx = 84 + 74c, boxes w72 h40 at y=110; the sweep at j = 3 pairs W[0] + W[3] + W[5] = 23 -->
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="70" y="100">right</text>
    <text x="70" y="236">left</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#42525e">
    <text x="84" y="100">4</text><text x="158" y="100">4</text><text x="232" y="100">4</text><text x="306" y="100">4</text><text x="380" y="100">4</text>
    <text x="454" y="100" font-weight="600" fill="#4169E1">5</text><text x="528" y="100">6</text>
    <text x="84" y="236">0</text><text x="158" y="236" font-weight="600" fill="#4169E1">0</text><text x="232" y="236">0</text><text x="306" y="236">3</text><text x="380" y="236">4</text>
    <text x="454" y="236">4</text><text x="528" y="236">4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="48" y="114" width="72" height="40" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="122" y="114" width="72" height="40" fill="#ffffff"/>
    <rect x="196" y="114" width="72" height="40" fill="#ffffff"/>
    <rect x="270" y="114" width="72" height="40" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="344" y="114" width="72" height="40" fill="#ffffff"/>
    <rect x="418" y="114" width="72" height="40" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="492" y="114" width="72" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="84" y="140" fill="#4169E1">3</text><text x="158" y="140">3</text><text x="232" y="140">3</text>
    <text x="306" y="140" fill="#4169E1">8</text><text x="380" y="140">13</text><text x="454" y="140" fill="#4169E1">12</text><text x="528" y="140">6</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="84" y="172">s = 0</text><text x="158" y="172">s = 1</text><text x="232" y="172">s = 2</text>
    <text x="306" y="172">s = 3</text><text x="380" y="172">s = 4</text><text x="454" y="172">s = 5</text><text x="528" y="172">s = 6</text>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 98 156 Q 188 216 278 157" marker-end="url(#arrow)"/>
    <path d="M 334 157 Q 424 216 514 156" marker-end="url(#arrow)"/>
  </g>
  <text x="306" y="206" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">3 + 8 + 12 = 23</text>
  <text x="306" y="262" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">middle j = 3</text>
  <text x="340" y="290" text-anchor="middle" fill="#1a2026" font-size="13">The middle sweep fixes j = 3 between flank windows 0 and 5 — left[1] = 0, right[5] = 5 —</text>
  <text x="340" y="308" text-anchor="middle" fill="#1a2026" font-size="13">totaling 3 + 8 + 12 = <tspan fill="#4169E1" font-weight="600">23</tspan> for the answer starts [0, 3, 5].</text>
</svg>
