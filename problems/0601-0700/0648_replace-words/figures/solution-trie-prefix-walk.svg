<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- trie of dictionary [cat, bat, rat]; nodes r=18; chains at x=120 (b), x=340 (c, walked), x=560 (r); rows y=120,178,236 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="323" y1="54" x2="137" y2="114"/>
    <line x1="357" y1="54" x2="563" y2="114"/>
    <line x1="120" y1="138" x2="120" y2="160"/>
    <line x1="120" y1="196" x2="120" y2="218"/>
    <line x1="560" y1="138" x2="560" y2="160"/>
    <line x1="560" y1="196" x2="560" y2="218"/>
  </g>
  <!-- accent walk: root -> c -> a -> t along cattle's letters -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="340" y1="66" x2="340" y2="100" marker-end="url(#arrow-accent)"/>
    <line x1="340" y1="138" x2="340" y2="158" marker-end="url(#arrow-accent)"/>
    <line x1="340" y1="196" x2="340" y2="216" marker-end="url(#arrow-accent)"/>
  </g>
  <!-- trie nodes -->
  <circle cx="340" cy="48" r="18" fill="#f0f3f7" stroke="#42525e" stroke-width="1.6"/>
  <text x="340" y="52" text-anchor="middle" fill="#5c6b76" font-size="11">root</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="120" cy="120" r="18"/><circle cx="120" cy="178" r="18"/><circle cx="120" cy="236" r="18"/>
    <circle cx="560" cy="120" r="18"/><circle cx="560" cy="178" r="18"/><circle cx="560" cy="236" r="18"/>
  </g>
  <g fill="#4169E1">
    <circle cx="340" cy="120" r="18"/><circle cx="340" cy="178" r="18"/><circle cx="340" cy="236" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="120" y="125" fill="#1a2026">b</text><text x="120" y="183" fill="#1a2026">a</text><text x="120" y="241" fill="#1a2026">t</text>
    <text x="340" y="125" fill="#ffffff">c</text><text x="340" y="183" fill="#ffffff">a</text><text x="340" y="241" fill="#ffffff">t</text>
    <text x="560" y="125" fill="#1a2026">r</text><text x="560" y="183" fill="#1a2026">a</text><text x="560" y="241" fill="#1a2026">t</text>
  </g>
  <!-- end flags -->
  <g fill="#4169E1" stroke="#ffffff" stroke-width="1.5">
    <circle cx="136" cy="248" r="5"/><circle cx="356" cy="248" r="5"/><circle cx="576" cy="248" r="5"/>
  </g>
  <circle cx="516" cy="34" r="5" fill="#4169E1" stroke="#ffffff" stroke-width="1.5"/>
  <text x="528" y="38" fill="#5c6b76" font-size="12.5">end flag</text>
  <!-- was: falls off at the root -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="40" y="40">was: no 'w' child at the root —</text>
    <text x="40" y="58">the walk dies, word stands</text>
  </g>
  <line x1="318" y1="52" x2="266" y2="50" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="356" y="90" fill="#4169E1" font-size="12.5" font-weight="600">walk</text>
  <!-- word outcomes -->
  <g text-anchor="middle" font-size="13">
    <text x="120" y="284" fill="#5c6b76">bat</text>
    <text x="340" y="284" fill="#4169E1" font-weight="600">cattle → cat</text>
    <text x="560" y="284" fill="#5c6b76">rat</text>
  </g>
  <text x="340" y="312" text-anchor="middle" fill="#1a2026" font-size="13">One walk along the word's own letters: the first end flag it crosses is the shortest root,</text>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">so <tspan fill="#4169E1" font-weight="600">cattle prints cat</tspan>, while was falls off the root at w and keeps itself.</text>
</svg>
