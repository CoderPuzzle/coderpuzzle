<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- edges = [[1,2],[1,3],[2,3]]; node 3 takes two parent arrows: cand1 [1,3] and cand2 [2,3]; the sweep unions [1,2] and [1,3], skips cand2; nodes r=24: 1(250,75) 2(180,215) 3(340,215) -->
  <line x1="239.3" y1="96.5" x2="190.7" y2="193.5" stroke="#42525e" stroke-width="1.8" marker-end="url(#arrowD)"/>
  <line x1="260.7" y1="96.5" x2="329.3" y2="193.5" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="204" y1="215" x2="316" y2="215" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowA)"/>
  <circle cx="250" cy="75" r="24" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="180" cy="215" r="24" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="340" cy="215" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="250" y="81">1</text><text x="180" y="221">2</text><text x="340" y="221">3</text>
  </g>
  <text x="356" y="146" font-size="13" font-weight="600">[1, 3] — <tspan fill="#4169E1">cand1</tspan></text>
  <text x="260" y="254" text-anchor="middle" font-size="13" font-weight="600">[2, 3] — <tspan fill="#4169E1">cand2</tspan></text>
  <g font-size="13">
    <text x="495" y="96" fill="#5c6b76" font-size="12">second pass:</text>
    <text x="495" y="120" fill="#1a2026">[1, 2] union</text>
    <text x="495" y="142" fill="#1a2026">[1, 3] union</text>
    <text x="495" y="164" fill="#9aa7b2">[2, 3] skipped</text>
    <text x="495" y="190" fill="#5c6b76" font-size="12">sweep finds no cycle</text>
    <text x="495" y="210" fill="#4169E1" font-weight="600">answer: [2, 3]</text>
  </g>
  <text x="340" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Node 3 ends with two parents — cand1 [1, 3] and cand2 [2, 3]. The sweep</text>
  <text x="340" y="314" text-anchor="middle" fill="#1a2026" font-size="13">unions all but cand2 and finds no cycle, so the later candidate <tspan fill="#4169E1" font-weight="600">[2, 3]</tspan> is removed.</text>
</svg>
