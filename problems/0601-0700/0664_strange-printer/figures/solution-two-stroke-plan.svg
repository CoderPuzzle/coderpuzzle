<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "aba"; cells 64x40 at x 220/288/356; target row y=46, turn-1 row y=150, turn-2 row y=240 -->
  <text x="204" y="71" text-anchor="end" fill="#5c6b76" font-size="12.5">target</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="220" y="46" width="64" height="40"/><rect x="288" y="46" width="64" height="40"/><rect x="356" y="46" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="252" y="71">a</text><text x="320" y="71">b</text><text x="388" y="71">a</text>
  </g>
  <text x="320" y="122" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">turn 1: print "aaa" in one stroke</text>
  <path d="M 216 132 H 424" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
    <rect x="220" y="150" width="64" height="40"/><rect x="288" y="150" width="64" height="40"/><rect x="356" y="150" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#4169E1">
    <text x="252" y="175">a</text><text x="320" y="175">a</text><text x="388" y="175">a</text>
  </g>
  <path d="M 320 194 V 234" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="336" y="210" fill="#5c6b76" font-size="12">turn 2: print "b" over the middle,</text>
  <text x="336" y="226" fill="#5c6b76" font-size="12">covering the printed a</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="220" y="240" width="64" height="40"/><rect x="356" y="240" width="64" height="40"/>
    <rect x="288" y="240" width="64" height="40"/>
  </g>
  <g fill="#dbe4fb">
    <rect x="221" y="241" width="62" height="38"/><rect x="357" y="241" width="62" height="38"/>
  </g>
  <text x="292" y="253" fill="#9aa7b2" font-size="10.5">a</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="252" y="265" fill="#4169E1">a</text><text x="320" y="265" fill="#1a2026">b</text><text x="388" y="265" fill="#4169E1">a</text>
  </g>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">The a-stroke survives on cells 0 and 2, so the recurrence splits at k = 2:</text>
  <text x="320" y="336" text-anchor="middle" fill="#1a2026" font-size="13">dp[0][2] = dp[1][1] + dp[2][2] = 1 + 1 = <tspan fill="#4169E1" font-weight="600">2</tspan> turns.</text>
</svg>
