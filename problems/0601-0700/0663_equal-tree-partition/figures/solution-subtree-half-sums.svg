<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- root = [5,10,10,null,null,2,3]; post-order subtree sums: 2, 3,
       15 (right 10), 10 (left 10), total 30 at the root; the accent edge
       root -> right 10 is the one removable edge; circles r 20 -->
  <line x1="250" y1="50" x2="140" y2="130" stroke="#42525e" stroke-width="1.6"/>
  <line x1="250" y1="50" x2="360" y2="130" stroke="#4169E1" stroke-width="2.4" stroke-dasharray="6 4"/>
  <line x1="360" y1="130" x2="300" y2="210" stroke="#42525e" stroke-width="1.6"/>
  <line x1="360" y1="130" x2="420" y2="210" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="250" cy="50" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="250" y="55" text-anchor="middle" fill="#1a2026" font-weight="600">5</text>
  <circle cx="140" cy="130" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="140" y="135" text-anchor="middle" fill="#1a2026" font-weight="600">10</text>
  <circle cx="360" cy="130" r="20" fill="#4169E1"/>
  <text x="360" y="135" text-anchor="middle" fill="#ffffff" font-weight="600">10</text>
  <circle cx="300" cy="210" r="20" fill="#4169E1"/>
  <text x="300" y="215" text-anchor="middle" fill="#ffffff" font-weight="600">2</text>
  <circle cx="420" cy="210" r="20" fill="#4169E1"/>
  <text x="420" y="215" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <text x="250" y="20" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">total 30</text>
  <text x="140" y="100" text-anchor="middle" fill="#5c6b76" font-size="12">sum 10</text>
  <text x="360" y="100" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">sum 15</text>
  <text x="300" y="246" text-anchor="middle" fill="#5c6b76" font-size="12">sum 2</text>
  <text x="420" y="246" text-anchor="middle" fill="#5c6b76" font-size="12">sum 3</text>
  <text x="272" y="110" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">cut here</text>
  <text x="40" y="272" fill="#1a2026" font-size="13">Post-order sums build up: 2 + 3 + 10 = 15 on the right, 10 on the left, total 30.</text>
  <text x="40" y="290" fill="#1a2026" font-size="13">The right subtree's 15 is exactly half of 30 — one cut splits <tspan fill="#4169E1" font-weight="600">15 | 15</tspan>: true.</text>
</svg>
