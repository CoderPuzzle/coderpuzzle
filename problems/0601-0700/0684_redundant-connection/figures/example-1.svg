<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#1a2026" stroke-width="1.8">
    <line x1="140" y1="60" x2="300" y2="60"/>
    <line x1="140" y1="60" x2="220" y2="185"/>
  </g>
  <line x1="300" y1="60" x2="220" y2="185" stroke="#4169E1" stroke-width="3.5"/>
  <g font-weight="600" text-anchor="middle">
    <circle cx="140" cy="60" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
    <text x="140" y="65" fill="#1a2026">1</text>
    <circle cx="300" cy="60" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
    <text x="300" y="65" fill="#1a2026">2</text>
    <circle cx="220" cy="185" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
    <text x="220" y="190" fill="#1a2026">3</text>
  </g>
  <text x="262" y="132" fill="#4169E1" font-size="12.5" font-weight="600">[2,3]</text>
  <text x="220" y="232" text-anchor="middle" fill="#1a2026" font-size="12.5">the last edge [2,3] closes the cycle — remove it</text>
</svg>
