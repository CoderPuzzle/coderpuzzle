<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- edges = [[1,2],[1,3],[2,3]]; nodes r=24: 1(280,80) 2(200,210) 3(360,210); solid lines = prefix edges, curved arrows = the DFS probe from 2, dashed = candidate [2,3] not yet added -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="267.4" y1="100.4" x2="212.6" y2="189.6"/>
    <line x1="292.6" y1="100.4" x2="347.4" y2="189.6"/>
  </g>
  <line x1="224" y1="210" x2="336" y2="210" stroke="#4169E1" stroke-width="2.2" stroke-dasharray="6 5"/>
  <path d="M 176 196 Q 162 128 254 87" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 306 87 Q 398 128 384 196" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="280" cy="80" r="24" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="200" cy="210" r="24" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="360" cy="210" r="24" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="280" y="86">1</text><text x="200" y="216">2</text><text x="360" y="216">3</text>
  </g>
  <text x="280" y="252" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">candidate [2, 3]</text>
  <g font-size="12.5">
    <text x="40" y="108" fill="#5c6b76">probe before</text>
    <text x="40" y="125" fill="#5c6b76">adding [2, 3]:</text>
    <text x="40" y="150" fill="#4169E1" font-weight="600">2 → 1 → 3</text>
    <text x="40" y="175" fill="#1a2026">3 is already</text>
    <text x="40" y="192" fill="#1a2026">reachable</text>
  </g>
  <g font-size="12.5">
    <text x="500" y="100" fill="#5c6b76" font-size="12">edge by edge</text>
    <text x="500" y="124" fill="#1a2026">[1, 2] — added</text>
    <text x="500" y="146" fill="#1a2026">[1, 3] — added</text>
    <text x="500" y="168" fill="#4169E1" font-weight="600">[2, 3] — cycle</text>
    <text x="500" y="194" fill="#5c6b76" font-size="12">endpoints already</text>
    <text x="500" y="210" fill="#5c6b76" font-size="12">connected</text>
  </g>
  <text x="340" y="298" text-anchor="middle" fill="#1a2026" font-size="13">Before adding [2, 3], the DFS from 2 already reaches 3 along 2 → 1 → 3,</text>
  <text x="340" y="316" text-anchor="middle" fill="#1a2026" font-size="13">so <tspan fill="#4169E1" font-weight="600">[2, 3]</tspan> joins connected endpoints — it closes the cycle and is the answer.</text>
</svg>
