<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "aaabbb", words = ["aa","b"]; hits: aa at [0,2) and [1,3), b at [3,4), [4,5), [5,6); cells 64 wide from x = 128; s row y = 72 h = 40, word rows h = 32, mask row y = 240 h = 36 -->
  <text x="320" y="42" text-anchor="middle" fill="#1a2026">s = "aaabbb", words = ["aa", "b"]</text>
  <text x="110" y="97" text-anchor="end" font-size="12.5" fill="#5c6b76">s</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="128" y="72" width="64" height="40"/><rect x="192" y="72" width="64" height="40"/><rect x="256" y="72" width="64" height="40"/>
    <rect x="320" y="72" width="64" height="40"/><rect x="384" y="72" width="64" height="40"/><rect x="448" y="72" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="160" y="97">a</text><text x="224" y="97">a</text><text x="288" y="97">a</text>
    <text x="352" y="97">b</text><text x="416" y="97">b</text><text x="480" y="97">b</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="160" y="128">0</text><text x="224" y="128">1</text><text x="288" y="128">2</text>
    <text x="352" y="128">3</text><text x="416" y="128">4</text><text x="480" y="128">5</text>
  </g>
  <!-- paint row for "aa": cells 0..2 covered by [0,2) and [1,3) -->
  <text x="110" y="161" text-anchor="end" font-size="12.5" fill="#5c6b76">"aa"</text>
  <g stroke-width="1.4">
    <rect x="128" y="140" width="64" height="32" fill="#dbe4fb" stroke="#42525e"/>
    <rect x="192" y="140" width="64" height="32" fill="#dbe4fb" stroke="#42525e"/>
    <rect x="256" y="140" width="64" height="32" fill="#dbe4fb" stroke="#42525e"/>
    <rect x="320" y="140" width="64" height="32" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="384" y="140" width="64" height="32" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="448" y="140" width="64" height="32" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <text x="516" y="161" font-size="11.5" fill="#9aa7b2">[0,2) [1,3)</text>
  <!-- paint row for "b": cells 3..5 -->
  <text x="110" y="205" text-anchor="end" font-size="12.5" fill="#5c6b76">"b"</text>
  <g stroke-width="1.4">
    <rect x="128" y="184" width="64" height="32" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="192" y="184" width="64" height="32" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="256" y="184" width="64" height="32" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="320" y="184" width="64" height="32" fill="#dbe4fb" stroke="#42525e"/>
    <rect x="384" y="184" width="64" height="32" fill="#dbe4fb" stroke="#42525e"/>
    <rect x="448" y="184" width="64" height="32" fill="#dbe4fb" stroke="#42525e"/>
  </g>
  <text x="516" y="205" font-size="11.5" fill="#9aa7b2">[3,4) [4,5) [5,6)</text>
  <text x="320" y="230" text-anchor="middle" font-size="12" fill="#5c6b76">union of all painted cells</text>
  <!-- bold mask: all true; emission toggles at the two ends -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4">
    <rect x="128" y="240" width="64" height="36"/><rect x="192" y="240" width="64" height="36"/><rect x="256" y="240" width="64" height="36"/>
    <rect x="320" y="240" width="64" height="36"/><rect x="384" y="240" width="64" height="36"/><rect x="448" y="240" width="64" height="36"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#4169E1">
    <text x="160" y="263">T</text><text x="224" y="263">T</text><text x="288" y="263">T</text>
    <text x="352" y="263">T</text><text x="416" y="263">T</text><text x="480" y="263">T</text>
  </g>
  <text x="82" y="263" text-anchor="middle" font-size="13" font-weight="600" fill="#4169E1">&lt;b&gt;</text>
  <line x1="100" y1="258" x2="122" y2="258" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="514" y1="258" x2="540" y2="258" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="562" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#4169E1">&lt;/b&gt;</text>
  <text x="320" y="304" text-anchor="middle" fill="#1a2026" font-size="13">The five hits paint one unbroken true run, so the emit toggles just twice:</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">&lt;b&gt;aaabbb&lt;/b&gt;</tspan> — one bold pair around the whole string.</text>
</svg>
