<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 258" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 2 x 3 multiplication table -->
  <g stroke="#1a2026" stroke-width="1.4">
    <rect x="80" y="40" width="150" height="100"/>
    <line x1="80" y1="90" x2="230" y2="90"/>
    <line x1="130" y1="40" x2="130" y2="140"/>
    <line x1="180" y1="40" x2="180" y2="140"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="105" y="70">1</text><text x="155" y="70">2</text><text x="205" y="70">3</text>
    <text x="105" y="120">2</text><text x="155" y="120">4</text><text x="205" y="120">6</text>
  </g>
  <!-- flattened, sorted -->
  <g stroke="#1a2026" stroke-width="1.4">
    <rect x="80" y="212" width="36" height="30" fill="#ffffff"/>
    <rect x="116" y="212" width="36" height="30" fill="#ffffff"/>
    <rect x="152" y="212" width="36" height="30" fill="#ffffff"/>
    <rect x="188" y="212" width="36" height="30" fill="#ffffff"/>
    <rect x="224" y="212" width="36" height="30" fill="#ffffff"/>
    <rect x="260" y="212" width="36" height="30" fill="#4169E1"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="98" y="232">1</text><text x="134" y="232">2</text><text x="170" y="232">2</text>
    <text x="206" y="232">3</text><text x="242" y="232">4</text>
    <text x="278" y="232" fill="#ffffff" font-weight="600">6</text>
  </g>
  <text x="278" y="200" text-anchor="middle" fill="#4169E1" font-size="12.5">k = 6</text>
  <text x="312" y="232" fill="#1a2026" font-size="12.5">← 6th smallest is 6</text>
</svg>
