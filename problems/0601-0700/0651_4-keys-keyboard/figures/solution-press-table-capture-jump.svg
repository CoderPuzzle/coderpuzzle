<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="236" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 7; best[1..7] = 1,2,3,4,5,6,9; cells 64x44 at x = 60 + 76i, y = 56; j = 3 is the capture point -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="92" y="40">i = 1</text><text x="168" y="40">i = 2</text><text x="244" y="40">i = 3</text>
    <text x="320" y="40">i = 4</text><text x="396" y="40">i = 5</text><text x="472" y="40">i = 6</text>
    <text x="548" y="40">i = 7</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="60" y="56" width="64" height="44"/><rect x="136" y="56" width="64" height="44"/>
    <rect x="288" y="56" width="64" height="44"/><rect x="364" y="56" width="64" height="44"/>
    <rect x="440" y="56" width="64" height="44"/>
  </g>
  <rect x="212" y="56" width="64" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="516" y="56" width="64" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="92" y="85">1</text><text x="168" y="85">2</text><text x="244" y="85">3</text>
    <text x="320" y="85">4</text><text x="396" y="85">5</text><text x="472" y="85">6</text>
    <text x="548" y="85" fill="#ffffff">9</text>
  </g>
  <text x="34" y="85" text-anchor="middle" fill="#5c6b76" font-size="12.5">best</text>
  <!-- capture-point jump: best[7] = best[3] x (7-3-1) -->
  <path d="M 244 104 Q 396 150 548 104" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396" y="146" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">best[7] = best[3] × (7 − 3 − 1) = 3 × 3 = 9</text>
  <text x="396" y="166" text-anchor="middle" fill="#5c6b76" font-size="12">presses: A, A, A, Ctrl-A, Ctrl-C, V, V</text>
  <text x="320" y="200" text-anchor="middle" fill="#1a2026" font-size="13">Plain printing tops out at best[6] + 1 = 7; the pair captures the screen as it stood</text>
  <text x="320" y="218" text-anchor="middle" fill="#1a2026" font-size="13">at press 3, and two pastes triple it — <tspan fill="#4169E1" font-weight="600">9</tspan> at i = 7, the expected output.</text>
</svg>
