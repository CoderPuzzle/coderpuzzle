<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 204" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="204" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- coins = [1,2,4,-1,2] (1-indexed), maxJump = 2; cells x = 110 + 96i, w 88;
       cost = [7, 8, 6, unreachable, 2]; next = [3, 3, 5, none, end]; walk = [1,3,5] -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="154" y="28">1</text><text x="250" y="28">2</text><text x="346" y="28">3</text>
    <text x="442" y="28">4</text><text x="538" y="28">5</text>
  </g>
  <text x="96" y="66" text-anchor="end" fill="#5c6b76" font-size="12.5">coins</text>
  <text x="96" y="86" text-anchor="end" fill="#5c6b76" font-size="12.5">cost</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="110" y="42" width="88" height="52" fill="#dbe4fb"/>
    <rect x="206" y="42" width="88" height="52" fill="#ffffff"/>
    <rect x="302" y="42" width="88" height="52" fill="#dbe4fb"/>
    <rect x="398" y="42" width="88" height="52" fill="#f0f3f7"/>
    <rect x="494" y="42" width="88" height="52" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="154" y="66">1</text><text x="250" y="66">2</text><text x="346" y="66">4</text>
    <text x="442" y="66" fill="#9aa7b2">-1</text><text x="538" y="66">2</text>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">
    <text x="154" y="86">cost 7</text><text x="250" y="86">cost 8</text>
    <text x="346" y="86">cost 6</text><text x="538" y="86">cost 2</text>
  </g>
  <text x="442" y="86" text-anchor="middle" fill="#9aa7b2" font-size="11">unreachable</text>
  <text x="146" y="108" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">start</text>
  <path d="M 154 96 Q 250 132 342 98" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 350 96 Q 440 128 534 98" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="154" y="140">next 3</text><text x="250" y="140">next 3</text>
    <text x="346" y="140">next 5</text><text x="442" y="140" fill="#9aa7b2">next —</text>
    <text x="538" y="140">end</text>
  </g>
  <text x="40" y="170" fill="#1a2026" font-size="13">Filled right to left — <tspan fill="#4169E1" font-weight="600">cost[3] = 6</tspan> beats cost[2] = 8; index 4's -1 is unreachable.</text>
  <text x="40" y="188" fill="#1a2026" font-size="13">Following next from 1 through 3 to 5 gives path <tspan fill="#4169E1" font-weight="600">[1,3,5]</tspan> at cost 1 + 4 + 2 = 7.</text>
</svg>
