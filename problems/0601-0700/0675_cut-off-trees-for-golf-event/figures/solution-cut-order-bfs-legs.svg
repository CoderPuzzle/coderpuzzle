<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- forest = [[1,2,3],[0,0,4],[7,6,5]]; cells 84x84 at cols x=96,208,320, rows y=80,192,304; badge = cut order -->
  <text x="138" y="68" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">start (0, 0)</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="96" y="80" width="84" height="84" fill="#ffffff"/>
    <rect x="208" y="80" width="84" height="84" fill="#ffffff"/>
    <rect x="320" y="80" width="84" height="84" fill="#ffffff"/>
    <rect x="96" y="192" width="84" height="84" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="208" y="192" width="84" height="84" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="320" y="192" width="84" height="84" fill="#ffffff"/>
    <rect x="96" y="304" width="84" height="84" fill="#ffffff"/>
    <rect x="208" y="304" width="84" height="84" fill="#ffffff"/>
    <rect x="320" y="304" width="84" height="84" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="138" y="128">1</text>
    <text x="250" y="128">2</text>
    <text x="362" y="128">3</text>
    <text x="138" y="240" fill="#9aa7b2">0</text>
    <text x="250" y="240" fill="#9aa7b2">0</text>
    <text x="362" y="240">4</text>
    <text x="138" y="352">7</text>
    <text x="250" y="352">6</text>
    <text x="362" y="352">5</text>
  </g>
  <!-- cut-order badges: 2 is 1st, 3 is 2nd, 4 is 3rd, 5 is 4th, 6 is 5th, 7 is 6th -->
  <g>
    <circle cx="280" cy="92" r="10" fill="#4169E1"/><text x="280" y="96" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">1</text>
    <circle cx="392" cy="92" r="10" fill="#4169E1"/><text x="392" y="96" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">2</text>
    <circle cx="392" cy="204" r="10" fill="#4169E1"/><text x="392" y="208" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">3</text>
    <circle cx="392" cy="316" r="10" fill="#4169E1"/><text x="392" y="320" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">4</text>
    <circle cx="280" cy="316" r="10" fill="#4169E1"/><text x="280" y="320" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">5</text>
    <circle cx="168" cy="316" r="10" fill="#4169E1"/><text x="168" y="320" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">6</text>
  </g>
  <!-- the six BFS legs, each one step -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 183 122 L 203 122" marker-end="url(#arrow)"/>
    <path d="M 295 122 L 315 122" marker-end="url(#arrow)"/>
    <path d="M 362 167 L 362 187" marker-end="url(#arrow)"/>
    <path d="M 362 279 L 362 299" marker-end="url(#arrow)"/>
    <path d="M 317 346 L 297 346" marker-end="url(#arrow)"/>
    <path d="M 205 346 L 185 346" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="80" y="126">0</text>
    <text x="80" y="238">1</text>
    <text x="80" y="350">2</text>
    <text x="138" y="406">0</text>
    <text x="250" y="406">1</text>
    <text x="362" y="406">2</text>
  </g>
  <!-- legend -->
  <circle cx="455" cy="100" r="10" fill="#4169E1"/>
  <text x="472" y="104" fill="#1a2026" font-size="12.5">cut order</text>
  <rect x="447" y="128" width="16" height="16" fill="#f0f3f7" stroke="#9aa7b2"/>
  <text x="472" y="141" fill="#1a2026" font-size="12.5">blocked 0</text>
  <text x="40" y="436" fill="#1a2026" font-size="13">Six legs, each a one-step BFS walk — cut 2,3,4,5,6,7 in <tspan fill="#4169E1" font-weight="600">6 steps</tspan></text>
  <text x="40" y="454" fill="#1a2026" font-size="13">total, threading down through (1, 2), the middle row's only open cell.</text>
</svg>
