<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="330" fill="#ffffff"/>
  <!-- positions = [[1,2],[2,3],[6,1]]; edges 1,2,3,5,6,7 → cells [1,2) [2,3) [3,5) [5,6) [6,7) -->
  <!-- interval boxes 88x26 at x=100+94i, y=46; height rows after each drop at y=120, 174, 228 (88x30) -->
  <text x="100" y="36" fill="#5c6b76" font-size="12.5">edges 1, 2, 3, 5, 6, 7 → five compressed cells</text>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="100" y="46" width="88" height="26"/><rect x="194" y="46" width="88" height="26"/>
    <rect x="288" y="46" width="88" height="26"/><rect x="382" y="46" width="88" height="26"/>
    <rect x="476" y="46" width="88" height="26"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="144" y="63">[1, 2)</text><text x="238" y="63">[2, 3)</text><text x="332" y="63">[3, 5)</text>
    <text x="426" y="63">[5, 6)</text><text x="520" y="63">[6, 7)</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="144" y="88">c0</text><text x="238" y="88">c1</text><text x="332" y="88">c2</text>
    <text x="426" y="88">c3</text><text x="520" y="88">c4</text>
  </g>
  <!-- drop 1: [1,3) side 2 reads max 0 over c0-c1, writes 2; heights [2,2,0,0,0] -->
  <text x="100" y="112" fill="#5c6b76" font-size="12">drop 1 · square [1, 3), side 2 — reads max 0, writes 2, tallest <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <rect x="100" y="120" width="88" height="30"/><rect x="194" y="120" width="88" height="30"/>
  </g>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="288" y="120" width="88" height="30"/><rect x="382" y="120" width="88" height="30"/>
    <rect x="476" y="120" width="88" height="30"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="144" y="140" fill="#1a2026">2</text><text x="238" y="140" fill="#1a2026">2</text>
    <text x="332" y="140" fill="#9aa7b2">0</text><text x="426" y="140" fill="#9aa7b2">0</text>
    <text x="520" y="140" fill="#9aa7b2">0</text>
  </g>
  <!-- drop 2: [2,5) side 3 reads max 2 over c1-c2, writes 5; heights [2,5,5,0,0] -->
  <text x="100" y="166" fill="#5c6b76" font-size="12">drop 2 · square [2, 5), side 3 — reads max 2, writes 5, tallest <tspan fill="#4169E1" font-weight="600">5</tspan></text>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="100" y="174" width="88" height="30"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <rect x="194" y="174" width="88" height="30"/><rect x="288" y="174" width="88" height="30"/>
  </g>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="382" y="174" width="88" height="30"/><rect x="476" y="174" width="88" height="30"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="144" y="194" fill="#1a2026">2</text><text x="238" y="194" fill="#1a2026">5</text>
    <text x="332" y="194" fill="#1a2026">5</text><text x="426" y="194" fill="#9aa7b2">0</text>
    <text x="520" y="194" fill="#9aa7b2">0</text>
  </g>
  <!-- drop 3: [6,7) side 1 reads max 0 over c4, writes 1; heights [2,5,5,0,1] -->
  <text x="100" y="220" fill="#5c6b76" font-size="12">drop 3 · square [6, 7), side 1 — reads max 0, writes 1, tallest <tspan fill="#4169E1" font-weight="600">5</tspan></text>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="100" y="228" width="88" height="30"/><rect x="194" y="228" width="88" height="30"/>
    <rect x="288" y="228" width="88" height="30"/><rect x="382" y="228" width="88" height="30"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <rect x="476" y="228" width="88" height="30"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="144" y="248" fill="#1a2026">2</text><text x="238" y="248" fill="#1a2026">5</text>
    <text x="332" y="248" fill="#1a2026">5</text><text x="426" y="248" fill="#9aa7b2">0</text>
    <text x="520" y="248" fill="#1a2026">1</text>
  </g>
  <text x="310" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Each drop lands at its side plus the max height under its half-open run of cells:</text>
  <text x="310" y="316" text-anchor="middle" fill="#1a2026" font-size="13">the [2, 5) square lands on the 2 it overlaps at [2, 3), and the answers read <tspan fill="#4169E1" font-weight="600">2, 5, 5</tspan>.</text>
</svg>
