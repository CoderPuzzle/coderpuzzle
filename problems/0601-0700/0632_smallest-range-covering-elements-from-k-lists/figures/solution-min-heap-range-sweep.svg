<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="354" fill="#ffffff"/>
  <!-- nums = [[4,10,15,24,26],[0,9,12,20],[5,18,22,30]]; cells 52x34, pitch 58, x0=150; rows y=48/104/160; heap cells y=232 -->
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="140" y="70">list 0</text><text x="140" y="126">list 1</text><text x="140" y="182">list 2</text>
  </g>
  <!-- consumed slots -->
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#f0f3f7">
    <rect x="150" y="48" width="52" height="34"/><rect x="208" y="48" width="52" height="34"/><rect x="266" y="48" width="52" height="34"/>
    <rect x="150" y="104" width="52" height="34"/><rect x="208" y="104" width="52" height="34"/><rect x="266" y="104" width="52" height="34"/>
    <rect x="150" y="160" width="52" height="34"/><rect x="208" y="160" width="52" height="34"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2">
    <text x="176" y="70">4</text><text x="234" y="70">10</text><text x="292" y="70">15</text>
    <text x="176" y="126">0</text><text x="234" y="126">9</text><text x="292" y="126">12</text>
    <text x="176" y="182">5</text><text x="234" y="182">18</text>
  </g>
  <!-- upcoming slots -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="382" y="48" width="52" height="34"/><rect x="324" y="160" width="52" height="34"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="408" y="70">26</text><text x="350" y="182">30</text>
  </g>
  <!-- current heads -->
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <rect x="324" y="48" width="52" height="34"/>
    <rect x="324" y="104" width="52" height="34"/>
    <rect x="266" y="160" width="52" height="34"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="350" y="70">24</text><text x="350" y="126">20</text><text x="292" y="182">22</text>
  </g>
  <!-- one pointer per list -->
  <g fill="#4169E1">
    <path d="M 344 88 L 356 88 L 350 96 z"/>
    <path d="M 344 144 L 356 144 L 350 152 z"/>
    <path d="M 286 200 L 298 200 L 292 208 z"/>
  </g>
  <!-- candidate trail, one line per pop -->
  <text x="460" y="38" fill="#5c6b76" font-size="11.5" font-weight="600">candidate after each pop</text>
  <g text-anchor="start" font-size="12" fill="#9aa7b2">
    <text x="460" y="56">[0, 5] w 5</text>
    <text x="460" y="73">[4, 9] w 5</text>
    <text x="460" y="90">[5, 10] w 5</text>
    <text x="460" y="107">[9, 18] w 9</text>
    <text x="460" y="124">[10, 18] w 8</text>
    <text x="460" y="141">[12, 18] w 6</text>
    <text x="460" y="158">[15, 20] w 5</text>
    <text x="460" y="175">[18, 24] w 6</text>
  </g>
  <text x="460" y="192" font-size="12" font-weight="600" fill="#4169E1">[20, 24] w 4 — best</text>
  <!-- min-heap of current heads -->
  <text x="140" y="253" text-anchor="end" fill="#5c6b76" font-size="12">min-heap</text>
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <rect x="150" y="232" width="52" height="34"/><rect x="208" y="232" width="52" height="34"/><rect x="266" y="232" width="52" height="34"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="176" y="254">20</text><text x="234" y="254">22</text><text x="292" y="254">24</text>
  </g>
  <text x="340" y="253" fill="#1a2026" font-size="13">cur_max = <tspan fill="#4169E1" font-weight="600">24</tspan></text>
  <!-- candidate bracket over the heap -->
  <path d="M 150 272 L 150 284 M 318 272 L 318 284 M 150 278 L 318 278" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="234" y="300" text-anchor="middle" font-size="12.5" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">[20, 24]</tspan>, width 4</text>
  <text x="340" y="300" fill="#5c6b76" font-size="12">pop 20 — list 1's last — stops the sweep</text>
  <text x="40" y="324" fill="#1a2026" font-size="13">Advancing the minimum narrows the sweep; the pop of 20 — list 1's last</text>
  <text x="40" y="342" fill="#1a2026" font-size="13">element — records <tspan fill="#4169E1" font-weight="600">[20, 24]</tspan>, width 4, and stops. Nothing better exists.</text>
</svg>
