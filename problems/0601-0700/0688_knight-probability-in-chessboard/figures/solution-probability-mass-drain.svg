<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 3, k = 2, start (0,0); two 3x3 boards of 44px cells; board1 x0=90 y0=80, board2 x0=356 y0=80; cell (r,c) center = (x0+44c+22, y0+44r+22); board shows probability mass after each move: move 1 leaves 1/8 on (1,2) and (2,1); move 2 leaves 2/64 on (0,0), 1/64 on (2,0) and (0,2) -->
  <text x="156" y="40" text-anchor="middle" font-weight="600" fill="#1a2026">after move 1 — mass 2/8</text>
  <text x="422" y="40" text-anchor="middle" font-weight="600" fill="#1a2026">after move 2 — mass 4/64</text>
  <g fill="#9aa7b2" font-size="10.5" text-anchor="middle">
    <text x="112" y="72">0</text><text x="156" y="72">1</text><text x="200" y="72">2</text>
    <text x="378" y="72">0</text><text x="422" y="72">1</text><text x="466" y="72">2</text>
    <text x="80" y="107">0</text><text x="80" y="151">1</text><text x="80" y="195">2</text>
    <text x="346" y="107">0</text><text x="346" y="151">1</text><text x="346" y="195">2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="90" y="80" width="44" height="44"/><rect x="134" y="80" width="44" height="44"/><rect x="178" y="80" width="44" height="44"/>
    <rect x="90" y="124" width="44" height="44"/><rect x="134" y="124" width="44" height="44"/><rect x="178" y="124" width="44" height="44" fill="#dbe4fb"/>
    <rect x="90" y="168" width="44" height="44"/><rect x="134" y="168" width="44" height="44" fill="#dbe4fb"/><rect x="178" y="168" width="44" height="44"/>
    <rect x="356" y="80" width="44" height="44" fill="#dbe4fb"/><rect x="400" y="80" width="44" height="44"/><rect x="444" y="80" width="44" height="44" fill="#dbe4fb"/>
    <rect x="356" y="124" width="44" height="44"/><rect x="400" y="124" width="44" height="44"/><rect x="444" y="124" width="44" height="44"/>
    <rect x="356" y="168" width="44" height="44" fill="#dbe4fb"/><rect x="400" y="168" width="44" height="44"/><rect x="444" y="168" width="44" height="44"/>
  </g>
  <text x="112" y="107" text-anchor="middle" fill="#9aa7b2" font-size="9.5">start</text>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#4169E1">
    <text x="200" y="151">1/8</text>
    <text x="156" y="195">1/8</text>
    <text x="378" y="107">2/64</text>
    <text x="378" y="195">1/64</text>
    <text x="466" y="107">1/64</text>
  </g>
  <path d="M 234 146 L 338 146" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="136" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">2/8 each</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="156" y="244">6/8 falls off</text>
    <text x="422" y="244">60/64 falls off</text>
  </g>
  <text x="320" y="274" text-anchor="middle" fill="#1a2026" font-size="13">Each surviving cell keeps 2 of its 8 moves — 2/8 after move 1, 4/64 after move 2:</text>
  <text x="320" y="292" text-anchor="middle" fill="#1a2026" font-size="13">the mass left is 0.25 × 0.25 = <tspan fill="#4169E1" font-weight="600">0.0625</tspan>.</text>
</svg>
