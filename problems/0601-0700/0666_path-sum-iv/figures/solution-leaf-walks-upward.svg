<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="376" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [113,215,221]; decoded (1,1)=3 (2,1)=5 (2,2)=1 on a 4-level skeleton;
       levels y 70/140/210/280, level-4 slot 60 from x0=80 -->
  <text x="320" y="24" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums = [113, 215, 221] decodes to (1,1)=3, (2,1)=5, (2,2)=1</text>
  <g stroke="#dbe4fb" stroke-width="1.5">
    <path d="M 200 140 L 140 210 M 200 140 L 260 210 M 440 140 L 380 210 M 440 140 L 500 210"/>
    <path d="M 140 210 L 110 280 M 140 210 L 170 280 M 260 210 L 230 280 M 260 210 L 290 280"/>
    <path d="M 380 210 L 350 280 M 380 210 L 410 280 M 500 210 L 470 280 M 500 210 L 530 280"/>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="0.8">
    <circle cx="140" cy="210" r="4.5"/><circle cx="260" cy="210" r="4.5"/><circle cx="380" cy="210" r="4.5"/><circle cx="500" cy="210" r="4.5"/>
    <circle cx="110" cy="280" r="4.5"/><circle cx="170" cy="280" r="4.5"/><circle cx="230" cy="280" r="4.5"/><circle cx="290" cy="280" r="4.5"/>
    <circle cx="350" cy="280" r="4.5"/><circle cx="410" cy="280" r="4.5"/><circle cx="470" cy="280" r="4.5"/><circle cx="530" cy="280" r="4.5"/>
  </g>
  <path d="M 320 70 L 200 140 M 320 70 L 440 140" stroke="#42525e" stroke-width="1.8" fill="none"/>
  <!-- upward leaf walks (parent = (d-1, (p+1)/2)), bulged off the real edges -->
  <path d="M 214 132 Q 232 84 304 80" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 426 132 Q 408 84 336 80" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="228" y="101" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">5 + 3 = 8</text>
  <text x="412" y="101" fill="#4169E1" font-size="12" font-weight="600">1 + 3 = 4</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <circle cx="320" cy="70" r="14"/><circle cx="200" cy="140" r="14"/><circle cx="440" cy="140" r="14"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="320" y="75">3</text><text x="200" y="145">5</text><text x="440" y="145">1</text>
  </g>
  <g fill="#5c6b76" font-size="11" text-anchor="middle">
    <text x="320" y="46">(1,1)</text><text x="200" y="170">leaf</text><text x="440" y="170">leaf</text>
  </g>
  <text x="178" y="145" text-anchor="end" fill="#5c6b76" font-size="11">(2,1)</text>
  <text x="462" y="145" fill="#5c6b76" font-size="11">(2,2)</text>
  <text x="320" y="332" text-anchor="middle" fill="#1a2026" font-size="13">Each leaf walks up by the parent rule (d - 1, (p + 1) / 2): both land on (1, 1).</text>
  <text x="320" y="354" text-anchor="middle" fill="#1a2026" font-size="13">The walks sum (3 + 5) + (3 + 1) = <tspan fill="#4169E1" font-weight="600">12</tspan>.</text>
</svg>
