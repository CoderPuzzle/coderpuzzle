<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [2,2,5,null,null,5,7]; visited 2s: (320,88),(196,172); candidate 5: (444,172);
       pruned subtree: inner 5 (384,256), 7 (504,256) -->
  <text x="320" y="24" text-anchor="middle" fill="#5c6b76" font-size="12.5">root = [2,2,5,null,null,5,7]</text>
  <text x="320" y="52" text-anchor="middle" fill="#5c6b76" font-size="12">root value 2 = the tree minimum</text>
  <path d="M 306 98 L 214 160 M 334 98 L 426 160" stroke="#4169E1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <path d="M 444 172 L 384 256 M 444 172 L 504 256"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="320" cy="88" r="17"/><circle cx="196" cy="172" r="17"/>
  </g>
  <circle cx="444" cy="172" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3">
    <circle cx="384" cy="256" r="17"/><circle cx="504" cy="256" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="320" y="93" fill="#1a2026">2</text><text x="196" y="177" fill="#1a2026">2</text>
    <text x="444" y="177" fill="#4169E1">5</text>
    <text x="384" y="261" fill="#9aa7b2">5</text><text x="504" y="261" fill="#9aa7b2">7</text>
  </g>
  <text x="196" y="212" text-anchor="middle" fill="#5c6b76" font-size="11.5">still 2: leaf, walk ends</text>
  <text x="466" y="136" fill="#4169E1" font-size="12.5" font-weight="600">5 &gt; 2: candidate</text>
  <text x="466" y="154" fill="#5c6b76" font-size="11.5">subtree never entered</text>
  <text x="444" y="296" text-anchor="middle" fill="#5c6b76" font-size="11.5">inner 5 and 7 are never visited</text>
  <text x="320" y="322" text-anchor="middle" fill="#1a2026" font-size="13">Descend while nodes carry the root's 2; the first larger node, the right 5,</text>
  <text x="320" y="342" text-anchor="middle" fill="#1a2026" font-size="13">is taken whole as the candidate &#8212; second minimum = <tspan fill="#4169E1" font-weight="600">5</tspan>, its subtree unvisited.</text>
</svg>
