<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- bulbs = [1,3,2], k = 1; days[p] = day position p turns on = [1,3,2]; cells 88x44 at x = 164+112i; arc joins window endpoints pos 1 and pos 3 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="208" y="46">pos 1</text><text x="320" y="46">pos 2</text><text x="432" y="46">pos 3</text>
  </g>
  <!-- bulb states on day 2 -->
  <rect x="164" y="58" width="88" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="276" y="58" width="88" height="44" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <rect x="388" y="58" width="88" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="208" y="86">1</text><text x="320" y="86" fill="#9aa7b2">0</text><text x="432" y="86">1</text>
  </g>
  <text x="496" y="85" fill="#5c6b76" font-size="12.5">bulbs on day 2</text>
  <!-- inverted days array -->
  <rect x="164" y="140" width="88" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="276" y="140" width="88" height="44" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <rect x="388" y="140" width="88" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="208" y="168">1</text><text x="320" y="168" fill="#5c6b76">3</text><text x="432" y="168">2</text>
  </g>
  <text x="496" y="160" fill="#1a2026" font-size="12.5" font-weight="600">days[p]</text>
  <text x="496" y="178" fill="#5c6b76" font-size="12.5">day p turns on</text>
  <text x="320" y="130" text-anchor="middle" fill="#5c6b76" font-size="12">dark at day 2</text>
  <!-- window over the interior -->
  <path d="M 208 196 Q 320 244 432 196" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="320" y="248" text-anchor="middle" fill="#1a2026" font-size="12.5">interior min (deque front) 3 &gt; max(1, 2) = 2 — valid</text>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Positions 1 and 3 light on days 1 and 2, before the interior's day 3,</text>
  <text x="320" y="314" text-anchor="middle" fill="#1a2026" font-size="13">so the pair is complete on day max(1, 2) = <tspan fill="#4169E1" font-weight="600">2</tspan> — the answer.</text>
</svg>
