<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="380" fill="#ffffff"/>
  <!-- nums = [3,2,1,6,0,5]; tree nodes r=17; spine trace rows at x=360, y = 76 + 28i -->
  <text x="150" y="28" text-anchor="middle" fill="#5c6b76" font-size="12.5">finished tree</text>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="138" y1="68" x2="82" y2="128"/>
    <line x1="162" y1="68" x2="228" y2="128"/>
    <line x1="79" y1="155" x2="111" y2="209"/>
    <line x1="231" y1="154" x2="194" y2="210"/>
    <line x1="129" y1="239" x2="161" y2="293"/>
  </g>
  <circle cx="150" cy="56" r="17" fill="#4169E1"/>
  <text x="150" y="61" text-anchor="middle" fill="#ffffff" font-weight="600">6</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="70" cy="140" r="17"/><circle cx="240" cy="140" r="17"/>
    <circle cx="120" cy="224" r="17"/><circle cx="185" cy="224" r="17"/>
    <circle cx="170" cy="308" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="70" y="145">3</text><text x="240" y="145">5</text>
    <text x="120" y="229">2</text><text x="185" y="229">0</text>
    <text x="170" y="313">1</text>
  </g>
  <text x="360" y="48" fill="#5c6b76" font-size="12.5">spine stack after each value</text>
  <g font-size="12.5" fill="#1a2026">
    <text x="360" y="76">push 3 → [3]</text>
    <text x="360" y="104">push 2 → [3, 2]</text>
    <text x="360" y="132">push 1 → [3, 2, 1]</text>
    <text x="360" y="160" fill="#4169E1" font-weight="600">6 pops 1, 2, 3 → hangs 3 left → [6]</text>
    <text x="360" y="188">push 0 → [6, 0]</text>
    <text x="360" y="216">5 pops 0 → hangs 0 left → [6, 5]</text>
  </g>
  <text x="340" y="344" text-anchor="middle" fill="#1a2026" font-size="13">6 swallows the whole 3-2-1 run as its left subtree; 5 then adopts 0 on its left and</text>
  <text x="340" y="362" text-anchor="middle" fill="#1a2026" font-size="13">takes the spine slot under 6 — the surviving stack <tspan fill="#4169E1" font-weight="600">[6, 5]</tspan> is the finished tree.</text>
</svg>
