<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="650" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- cards = [4,1,8,7]; winning reduction 8-4=4, then 7-1=6, then 4*6=24; outline = pair combined, tinted = new value -->
  <text x="325" y="52" text-anchor="middle" fill="#5c6b76" font-size="13.5">cards = [4, 1, 8, 7]</text>
  <rect x="445" y="41" width="14" height="14" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="465" y="53" fill="#5c6b76" font-size="12">combined pair</text>
  <rect x="445" y="61" width="14" height="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="465" y="73" fill="#5c6b76" font-size="12">new value</text>
  <!-- multiset 4 values -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="66" y="90" width="68" height="38" stroke="#4169E1" stroke-width="2"/>
    <rect x="66" y="138" width="68" height="38"/>
    <rect x="66" y="186" width="68" height="38" stroke="#4169E1" stroke-width="2"/>
    <rect x="66" y="234" width="68" height="38"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="100" y="114">4</text>
    <text x="100" y="162">1</text>
    <text x="100" y="210">8</text>
    <text x="100" y="258">7</text>
  </g>
  <!-- multiset 3 values -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="226" y="90" width="68" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="226" y="138" width="68" height="38" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
    <rect x="226" y="186" width="68" height="38" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="260" y="114" fill="#4169E1">4</text>
    <text x="260" y="162" fill="#1a2026">1</text>
    <text x="260" y="210" fill="#1a2026">7</text>
  </g>
  <!-- multiset 2 values -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="386" y="90" width="68" height="38" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
    <rect x="386" y="138" width="68" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="420" y="114" fill="#1a2026">4</text>
    <text x="420" y="162" fill="#4169E1">6</text>
  </g>
  <!-- multiset 1 value -->
  <rect x="546" y="90" width="68" height="38" fill="#4169E1"/>
  <text x="580" y="115" text-anchor="middle" font-weight="600" font-size="17" fill="#ffffff">24</text>
  <!-- transitions -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 138 165 L 219 165" marker-end="url(#arrow)"/>
    <path d="M 298 165 L 379 165" marker-end="url(#arrow)"/>
    <path d="M 458 165 L 539 165" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#4169E1">
    <text x="180" y="150">8 − 4 = 4</text>
    <text x="340" y="150">7 − 1 = 6</text>
    <text x="500" y="150">4 × 6 = 24</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="100" y="292">4 values</text>
    <text x="260" y="244">3 values</text>
    <text x="420" y="196">2 values</text>
    <text x="580" y="148">1 value</text>
  </g>
  <text x="40" y="322" fill="#1a2026" font-size="13">Pair by pair the multiset shrinks 4 → 3 → 2 → 1 values: 8 − 4 = 4 while</text>
  <text x="40" y="340" fill="#1a2026" font-size="13">7 − 1 = 6 waits, then 4 × 6 = <tspan fill="#4169E1" font-weight="600">24</tspan> — within epsilon of 24, so true.</text>
</svg>
