<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- ops = ["5","2","C","D","+"]; columns centered at 90+120i, stack cells 80x34 with bottom row y=218; the dashed cell is the 2 popped by C -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="68" y="44" width="44" height="30"/><rect x="188" y="44" width="44" height="30"/>
    <rect x="308" y="44" width="44" height="30"/><rect x="428" y="44" width="44" height="30"/>
    <rect x="548" y="44" width="44" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="90" y="64">5</text><text x="210" y="64">2</text><text x="330" y="64">C</text><text x="450" y="64">D</text><text x="570" y="64">+</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="90" y="96">push 5</text><text x="210" y="96">push 2</text><text x="330" y="96">pop 2</text>
    <text x="450" y="96">push 2×5=10</text><text x="570" y="96">push 5+10=15</text>
  </g>
  <!-- stack after each op -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="50" y="218" width="80" height="34"/>
    <rect x="170" y="218" width="80" height="34"/>
    <rect x="290" y="218" width="80" height="34"/>
    <rect x="410" y="218" width="80" height="34"/>
    <rect x="530" y="218" width="80" height="34"/><rect x="530" y="184" width="80" height="34"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="170" y="184" width="80" height="34"/>
    <rect x="410" y="184" width="80" height="34"/>
    <rect x="530" y="150" width="80" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="90" y="240">5</text>
    <text x="210" y="240">5</text><text x="210" y="206">2</text>
    <text x="330" y="240">5</text>
    <text x="450" y="240">5</text><text x="450" y="206">10</text>
    <text x="530" y="240">5</text><text x="530" y="206">10</text><text x="530" y="172">15</text>
  </g>
  <!-- the 2 that C removed, shown dashed in its old slot -->
  <rect x="290" y="184" width="80" height="34" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="330" y="206" text-anchor="middle" font-weight="600" font-size="15" fill="#9aa7b2">2</text>
  <path d="M 372 178 Q 398 148 404 122" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="570" y="274" text-anchor="middle" fill="#5c6b76" font-size="12">final record</text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Replaying [5, 2, C, D, +] leaves the record [5, 10, 15];</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">the total is 5 + 10 + 15 = <tspan fill="#4169E1" font-weight="600">30</tspan>.</text>
</svg>
