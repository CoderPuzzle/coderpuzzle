<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 308" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="580" height="308" fill="#ffffff"/>
  <!-- nums sorted = [5,4,3,3,2,2,1], k = 4, target 5; value cells 52x40 at x=74+60i, y=56 -->
  <!-- bit rows y=126+34i, squares 26x26 at x=center-13; masks after each subset: 1, 67, 87, 127 -->
  <text x="74" y="40" fill="#5c6b76" font-size="12.5">sorted descending — target = 20 / 4 = 5</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="74" y="56" width="52" height="40"/><rect x="134" y="56" width="52" height="40"/>
    <rect x="194" y="56" width="52" height="40"/><rect x="254" y="56" width="52" height="40"/>
    <rect x="314" y="56" width="52" height="40"/><rect x="374" y="56" width="52" height="40"/>
    <rect x="434" y="56" width="52" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="15" font-weight="600">
    <text x="100" y="81">5</text><text x="160" y="81">4</text><text x="220" y="81">3</text>
    <text x="280" y="81">3</text><text x="340" y="81">2</text><text x="400" y="81">2</text>
    <text x="460" y="81">1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="100" y="112">bit 0</text><text x="160" y="112">bit 1</text><text x="220" y="112">bit 2</text>
    <text x="280" y="112">bit 3</text><text x="340" y="112">bit 4</text><text x="400" y="112">bit 5</text>
    <text x="460" y="112">bit 6</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="64" y="144">subset 1</text><text x="64" y="178">subset 2</text>
    <text x="64" y="212">subset 3</text><text x="64" y="246">subset 4</text>
  </g>
  <!-- unset bits white, bits set by earlier subsets light, this subset's placements solid accent -->
  <!-- square x = 87 + 60*bit: bit0 87, bit1 147, bit2 207, bit3 267, bit4 327, bit5 387, bit6 447 -->
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#ffffff">
    <rect x="147" y="126" width="26" height="26"/><rect x="207" y="126" width="26" height="26"/>
    <rect x="267" y="126" width="26" height="26"/><rect x="327" y="126" width="26" height="26"/>
    <rect x="387" y="126" width="26" height="26"/><rect x="447" y="126" width="26" height="26"/>
    <rect x="207" y="160" width="26" height="26"/><rect x="267" y="160" width="26" height="26"/>
    <rect x="327" y="160" width="26" height="26"/><rect x="387" y="160" width="26" height="26"/>
    <rect x="267" y="194" width="26" height="26"/><rect x="387" y="194" width="26" height="26"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#dbe4fb">
    <rect x="87" y="160" width="26" height="26"/>
    <rect x="87" y="194" width="26" height="26"/><rect x="147" y="194" width="26" height="26"/>
    <rect x="447" y="194" width="26" height="26"/>
    <rect x="87" y="228" width="26" height="26"/><rect x="147" y="228" width="26" height="26"/>
    <rect x="207" y="228" width="26" height="26"/><rect x="327" y="228" width="26" height="26"/>
    <rect x="447" y="228" width="26" height="26"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#4169E1">
    <rect x="87" y="126" width="26" height="26"/>
    <rect x="147" y="160" width="26" height="26"/><rect x="447" y="160" width="26" height="26"/>
    <rect x="207" y="194" width="26" height="26"/><rect x="327" y="194" width="26" height="26"/>
    <rect x="267" y="228" width="26" height="26"/><rect x="387" y="228" width="26" height="26"/>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="496" y="144">mask = 1</text>
    <text x="496" y="178">mask = 67</text>
    <text x="496" y="212">mask = 87</text>
  </g>
  <text x="496" y="246" fill="#4169E1" font-size="12" font-weight="600">mask = 127</text>
  <text x="290" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Target 5: the search fills one subset at a time — (5), (4+1), (3+2), (3+2).</text>
  <text x="290" y="292" text-anchor="middle" fill="#1a2026" font-size="13">The last placement completes the mask 1111111 = <tspan fill="#4169E1" font-weight="600">127</tspan>, so the answer is <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
