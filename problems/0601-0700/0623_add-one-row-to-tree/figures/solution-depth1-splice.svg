<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- input [4,2,6,3,1,5], val=1, depth=2; circles r=17; rows y = 80/155/230 (input) and 80/155/230/300 (output) -->
  <text x="107" y="44" text-anchor="middle" fill="#5c6b76" font-size="11.5">root = [4,2,6,3,1,5]</text>
  <text x="460" y="44" text-anchor="middle" fill="#5c6b76" font-size="11.5">after adding row val = 1 at depth 2</text>
  <!-- input tree edges -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="111" y1="94" x2="79" y2="141"/>
    <line x1="129" y1="94" x2="161" y2="141"/>
    <line x1="65" y1="171" x2="50" y2="214"/>
    <line x1="75" y1="171" x2="90" y2="214"/>
    <line x1="165" y1="171" x2="150" y2="214"/>
  </g>
  <!-- input nodes; root ringed as the depth-1 frontier -->
  <circle cx="120" cy="80" r="17" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
  <text x="120" y="85" text-anchor="middle" fill="#1a2026" font-size="13">4</text>
  <text x="142" y="84" fill="#4169E1" font-size="10.5">frontier</text>
  <circle cx="70" cy="155" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="70" y="160" text-anchor="middle" fill="#1a2026" font-size="13">2</text>
  <circle cx="170" cy="155" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="170" y="160" text-anchor="middle" fill="#1a2026" font-size="13">6</text>
  <circle cx="45" cy="230" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="45" y="235" text-anchor="middle" fill="#1a2026" font-size="13">3</text>
  <circle cx="95" cy="230" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="95" y="235" text-anchor="middle" fill="#1a2026" font-size="13">1</text>
  <circle cx="145" cy="230" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="145" y="235" text-anchor="middle" fill="#1a2026" font-size="13">5</text>
  <!-- splice arrow -->
  <line x1="205" y1="165" x2="253" y2="165" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="150" text-anchor="middle" fill="#5c6b76" font-size="11">the splice</text>
  <!-- output tree edges: the four splice edges are accent -->
  <g stroke="#4169E1" stroke-width="1.8">
    <line x1="448" y1="92" x2="402" y2="143"/>
    <line x1="472" y1="92" x2="518" y2="143"/>
    <line x1="381" y1="169" x2="349" y2="216"/>
    <line x1="521" y1="169" x2="481" y2="216"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="331" y1="244" x2="304" y2="286"/>
    <line x1="349" y1="244" x2="376" y2="286"/>
    <line x1="463" y1="246" x2="447" y2="284"/>
  </g>
  <!-- output nodes -->
  <circle cx="460" cy="80" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="460" y="85" text-anchor="middle" fill="#1a2026" font-size="13">4</text>
  <circle cx="390" cy="155" r="17" fill="#4169E1"/>
  <text x="390" y="160" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="13">1</text>
  <text x="367" y="159" text-anchor="end" fill="#4169E1" font-size="10.5">new</text>
  <circle cx="530" cy="155" r="17" fill="#4169E1"/>
  <text x="530" y="160" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="13">1</text>
  <text x="552" y="159" fill="#4169E1" font-size="10.5">new</text>
  <circle cx="340" cy="230" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="340" y="235" text-anchor="middle" fill="#1a2026" font-size="13">2</text>
  <circle cx="470" cy="230" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="470" y="235" text-anchor="middle" fill="#1a2026" font-size="13">6</text>
  <circle cx="295" cy="300" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="295" y="305" text-anchor="middle" fill="#1a2026" font-size="13">3</text>
  <circle cx="385" cy="300" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="385" y="305" text-anchor="middle" fill="#1a2026" font-size="13">1</text>
  <circle cx="440" cy="300" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
  <text x="440" y="305" text-anchor="middle" fill="#1a2026" font-size="13">5</text>
  <!-- caption -->
  <text x="320" y="348" text-anchor="middle" fill="#1a2026" font-size="13">The depth-1 frontier node 4 trades its child slots for two fresh 1-nodes; the</text>
  <text x="320" y="366" text-anchor="middle" fill="#1a2026" font-size="13">old subtrees rooted 2 and 6 re-hang one level deeper: <tspan fill="#4169E1" font-weight="600">[4,1,1,2,null,null,6,3,1,5]</tspan>.</text>
</svg>
