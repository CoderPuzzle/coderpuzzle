<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="560" height="260" fill="#ffffff"/>
  <!-- left half background band -->
  <rect x="60" y="46" width="163" height="124" fill="#e9eefb"/>
  <text x="70" y="64" fill="#4169E1" font-size="11.5" font-weight="600">left half (1 element)</text>
  <text x="240" y="64" fill="#5b6470" font-size="11.5">right half (2 elements)</text>
  <!-- rows -->
  <text x="30" y="96" fill="#1a2026" font-weight="600">nums1</text>
  <text x="30" y="166" fill="#1a2026" font-weight="600">nums2</text>
  <g stroke="#1a2026" stroke-width="1.5">
    <rect x="190" y="76" width="33" height="32" fill="#ffffff"/>
    <rect x="223" y="76" width="33" height="32" fill="#ffffff"/>
    <rect x="190" y="146" width="33" height="32" fill="#ffffff"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="206.5" y="97">1</text>
    <text x="239.5" y="97">3</text>
    <text x="206.5" y="167">2</text>
  </g>
  <!-- cut markers -->
  <line x1="223" y1="52" x2="223" y2="190" stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="188" y1="140" x2="188" y2="190" stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="252" y="60" fill="#4169E1" font-size="11.5">cut after i = 1 elements of nums1</text>
  <text x="62" y="140" fill="#4169E1" font-size="11.5">j = half - i = 0</text>
  <!-- flank labels -->
  <g fill="#5b6470" font-size="11.5">
    <text x="172" y="126" text-anchor="end">a_left = 1</text>
    <text x="238" y="126">a_right = 3</text>
    <text x="172" y="196" text-anchor="end">b_left = -inf</text>
    <text x="238" y="196">b_right = 2</text>
  </g>
  <!-- verdict -->
  <text x="60" y="226" fill="#1a2026">Cross checks: a_left 1 &lt;= b_right 2 and b_left -inf &lt;= a_right 3 - the partition is valid.</text>
  <text x="60" y="248" fill="#1a2026">Odd total 3, so the median is min(a_right, b_right) = min(3, 2) = <tspan fill="#4169E1" font-weight="700">2</tspan>.</text>
</svg>
