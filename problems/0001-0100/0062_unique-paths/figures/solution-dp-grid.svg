<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="560" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <text x="20" y="24" fill="#1a2026" font-weight="600">m = 3, n = 7 - path counts; each cell adds the counts of the cell above and the cell to the left</text>
  <!-- column headers -->
  <g fill="#8a94a0" font-size="11" text-anchor="middle">
    <text x="128" y="52">c1</text><text x="184" y="52">c2</text><text x="240" y="52">c3</text><text x="296" y="52">c4</text><text x="352" y="52">c5</text><text x="408" y="52">c6</text><text x="464" y="52">c7</text>
  </g>
  <g fill="#8a94a0" font-size="11">
    <text x="96" y="84" text-anchor="end">r1</text><text x="96" y="126" text-anchor="end">r2</text><text x="96" y="168" text-anchor="end">r3</text>
  </g>
  <!-- grid -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="100" y="60" width="56" height="42"/><rect x="156" y="60" width="56" height="42"/><rect x="212" y="60" width="56" height="42"/><rect x="268" y="60" width="56" height="42"/><rect x="324" y="60" width="56" height="42"/><rect x="380" y="60" width="56" height="42"/><rect x="436" y="60" width="56" height="42"/>
    <rect x="100" y="102" width="56" height="42"/><rect x="156" y="102" width="56" height="42" fill="#e9eefb"/><rect x="212" y="102" width="56" height="42" fill="#e9eefb"/><rect x="268" y="102" width="56" height="42" fill="#e9eefb"/><rect x="324" y="102" width="56" height="42" fill="#e9eefb"/><rect x="380" y="102" width="56" height="42" fill="#e9eefb"/><rect x="436" y="102" width="56" height="42" fill="#e9eefb"/>
    <rect x="100" y="144" width="56" height="42" fill="#e9eefb"/><rect x="156" y="144" width="56" height="42" fill="#e9eefb"/><rect x="212" y="144" width="56" height="42"/><rect x="268" y="144" width="56" height="42"/><rect x="324" y="144" width="56" height="42"/><rect x="380" y="144" width="56" height="42"/><rect x="436" y="144" width="56" height="42" fill="#4169E1" fill-opacity="0.85"/>
  </g>
  <!-- values -->
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="128" y="86">1</text><text x="184" y="86">1</text><text x="240" y="86">1</text><text x="296" y="86">1</text><text x="352" y="86">1</text><text x="408" y="86">1</text><text x="464" y="86">1</text>
    <text x="128" y="128">1</text><text x="184" y="128">2</text><text x="240" y="128">3</text><text x="296" y="128">4</text><text x="352" y="128">5</text><text x="408" y="128">6</text><text x="464" y="128">7</text>
    <text x="128" y="170">1</text><text x="184" y="170">3</text><text x="240" y="170">6</text><text x="296" y="170">10</text><text x="352" y="170">15</text><text x="408" y="170">21</text><text x="464" y="170" fill="#ffffff">28</text>
  </g>
  <!-- arrows into r3c4 = 10 -->
  <line x1="243" y1="165" x2="262" y2="165" stroke="#4169E1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="296" y1="148" x2="296" y2="140" stroke="#4169E1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="296" y="230" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">10 = 6 (left) + 4 (above)</text>
  <text x="20" y="256" fill="#5b6470" font-size="11.5">Top row and left column are the all-ones seed; the rolling row rewrites one row at a time, and the</text>
  <text x="20" y="272" fill="#5b6470" font-size="11.5">bottom-right cell holds the answer, 28 paths.</text>
</svg>
