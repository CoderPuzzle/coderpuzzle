<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 264" font-family="IBM Plex Sans, system-ui, sans-serif">
  <rect width="264" height="264" fill="#ffffff"/>
  <!-- 4x4 board; subtle alternating shading on (row+col) even cells -->
  <g fill="#4169E1" fill-opacity="0.08">
    <rect x="20" y="20" width="56" height="56"/>
    <rect x="132" y="20" width="56" height="56"/>
    <rect x="76" y="76" width="56" height="56"/>
    <rect x="188" y="76" width="56" height="56"/>
    <rect x="20" y="132" width="56" height="56"/>
    <rect x="132" y="132" width="56" height="56"/>
    <rect x="76" y="188" width="56" height="56"/>
    <rect x="188" y="188" width="56" height="56"/>
  </g>
  <!-- inner grid lines -->
  <g stroke="#1a2026" stroke-width="1">
    <line x1="76" y1="20" x2="76" y2="244"/>
    <line x1="132" y1="20" x2="132" y2="244"/>
    <line x1="188" y1="20" x2="188" y2="244"/>
    <line x1="20" y1="76" x2="244" y2="76"/>
    <line x1="20" y1="132" x2="244" y2="132"/>
    <line x1="20" y1="188" x2="244" y2="188"/>
  </g>
  <!-- outer border -->
  <rect x="20" y="20" width="224" height="224" fill="none" stroke="#1a2026" stroke-width="2"/>
  <!-- queens: solution [".Q..","...Q","Q...","..Q."] -->
  <g fill="#4169E1">
    <circle cx="104" cy="48" r="13"/>
    <circle cx="216" cy="104" r="13"/>
    <circle cx="48" cy="160" r="13"/>
    <circle cx="160" cy="216" r="13"/>
  </g>
  <g fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">
    <text x="104" y="53">Q</text>
    <text x="216" y="109">Q</text>
    <text x="48" y="165">Q</text>
    <text x="160" y="221">Q</text>
  </g>
</svg>
