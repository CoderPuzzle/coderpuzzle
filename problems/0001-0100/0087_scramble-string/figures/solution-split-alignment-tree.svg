<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s1 = "great", s2 = "rgeat"; each box is a (sub-a, sub-b) pair; split gr | eat kept, then gr↔rg tried keep and swap -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="300" y1="86" x2="210" y2="132" marker-end="url(#arrowg)"/>
    <line x1="340" y1="86" x2="480" y2="132" marker-end="url(#arrowg)"/>
    <line x1="172" y1="178" x2="98" y2="206" marker-end="url(#arrowg)"/>
    <line x1="208" y1="178" x2="322" y2="206" marker-end="url(#arrowg)"/>
  </g>
  <text x="320" y="108" text-anchor="middle" fill="#5c6b76" font-size="11.5">split gr | eat</text>
  <g font-size="11" fill="#9aa7b2">
    <text x="20" y="106">the swap alignment here,</text>
    <text x="20" y="122">gr ↔ at — counts differ</text>
  </g>
  <rect x="235" y="36" width="170" height="48" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="320" y="58" text-anchor="middle" font-weight="600">great ↔ rgeat</text>
  <text x="320" y="74" text-anchor="middle" fill="#5c6b76" font-size="11">letter counts match</text>
  <rect x="135" y="136" width="110" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="190" y="160" text-anchor="middle" font-weight="600">gr ↔ rg</text>
  <rect x="430" y="136" width="120" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="490" y="160" text-anchor="middle" font-weight="600">eat ↔ eat</text>
  <text x="490" y="192" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">identical → true</text>
  <text x="150" y="196" fill="#5c6b76" font-size="11.5">keep</text>
  <text x="258" y="180" fill="#4169E1" font-size="11.5" font-weight="600">swap</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="52" y="208" width="76" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="162" y="208" width="76" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="292" y="208" width="76" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="407" y="208" width="76" height="36" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="90" y="231" fill="#9aa7b2">g ↔ r</text>
    <text x="200" y="231" fill="#9aa7b2">r ↔ g</text>
    <text x="330" y="231">g ↔ g</text>
    <text x="445" y="231">r ↔ r</text>
  </g>
  <text x="145" y="264" text-anchor="middle" fill="#5c6b76" font-size="11.5">letter counts differ → pruned</text>
  <text x="387" y="264" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">leaves match → true</text>
  <g font-size="13" fill="#1a2026">
    <text x="40" y="296">Swapping gr's halves pairs g with g and r with r; the eat half is identical,</text>
    <text x="40" y="314">so the surviving leaves match letter by letter: great scrambles to <tspan fill="#4169E1" font-weight="600">rgeat</tspan>.</text>
  </g>
</svg>
