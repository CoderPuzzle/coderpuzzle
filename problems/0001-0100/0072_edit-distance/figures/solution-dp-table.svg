<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="440" height="330" fill="#ffffff"/>
  <text x="20" y="24" fill="#1a2026" font-weight="600">word1 = "horse", word2 = "ros" - dp[i][j] = edits turning the first i chars into the first j</text>
  <!-- headers -->
  <g fill="#8a94a0" text-anchor="middle" font-size="12">
    <text x="70" y="56">#</text><text x="118" y="56">r</text><text x="166" y="56">o</text><text x="214" y="56">s</text>
    <text x="46" y="82">#</text><text x="46" y="122">h</text><text x="46" y="162">o</text><text x="46" y="202">r</text><text x="46" y="242">s</text><text x="46" y="282">e</text>
  </g>
  <!-- cells -->
  <g stroke="#1a2026" stroke-width="1.3" fill="#ffffff">
    <rect x="48" y="62" width="48" height="40"/><rect x="96" y="62" width="48" height="40"/><rect x="144" y="62" width="48" height="40"/><rect x="192" y="62" width="48" height="40"/>
    <rect x="48" y="102" width="48" height="40"/><rect x="96" y="102" width="48" height="40"/><rect x="144" y="102" width="48" height="40"/><rect x="192" y="102" width="48" height="40"/>
    <rect x="48" y="142" width="48" height="40"/><rect x="96" y="142" width="48" height="40"/><rect x="144" y="142" width="48" height="40" fill="#e9eefb"/><rect x="192" y="142" width="48" height="40"/>
    <rect x="48" y="182" width="48" height="40"/><rect x="96" y="182" width="48" height="40" fill="#e9eefb"/><rect x="144" y="182" width="48" height="40"/><rect x="192" y="182" width="48" height="40"/>
    <rect x="48" y="222" width="48" height="40"/><rect x="96" y="222" width="48" height="40"/><rect x="144" y="222" width="48" height="40"/><rect x="192" y="222" width="48" height="40"/>
    <rect x="48" y="262" width="48" height="40"/><rect x="96" y="262" width="48" height="40"/><rect x="144" y="262" width="48" height="40"/><rect x="192" y="262" width="48" height="40" fill="#4169E1" fill-opacity="0.85"/>
  </g>
  <!-- values -->
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="72" y="87">0</text><text x="120" y="87">1</text><text x="168" y="87">2</text><text x="216" y="87">3</text>
    <text x="72" y="127">1</text><text x="120" y="127">1</text><text x="168" y="127">2</text><text x="216" y="127">3</text>
    <text x="72" y="167">2</text><text x="120" y="167">2</text><text x="168" y="167">1</text><text x="216" y="167">2</text>
    <text x="72" y="207">3</text><text x="120" y="207">2</text><text x="168" y="207">2</text><text x="216" y="207">2</text>
    <text x="72" y="247">4</text><text x="120" y="247">3</text><text x="168" y="247">3</text><text x="216" y="247">2</text>
    <text x="72" y="287">5</text><text x="120" y="287">4</text><text x="168" y="287">4</text><text x="216" y="287" fill="#ffffff">3</text>
  </g>
  <!-- match annotation: dp[2][2] = dp[1][1] -->
  <text x="252" y="120" fill="#5b6470" font-size="11">shaded: equal chars align</text>
  <text x="252" y="136" fill="#5b6470" font-size="11">for free - dp copies the</text>
  <text x="252" y="152" fill="#5b6470" font-size="11">diagonal (o/o: 1, r/r: 2)</text>
  <text x="252" y="182" fill="#1a2026" font-size="11.5" font-weight="600">answer dp[5][3] = 3:</text>
  <text x="252" y="198" fill="#5b6470" font-size="11">horse -&gt; rorse -&gt; rose -&gt; ros</text>
  <text x="20" y="322" fill="#5b6470" font-size="11">Row 0 counts insertions into an empty prefix; column 0 counts deletions down to the empty prefix.</text>
</svg>
