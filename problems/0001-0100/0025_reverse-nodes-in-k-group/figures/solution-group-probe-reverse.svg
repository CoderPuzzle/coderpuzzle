<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- head = [1,2,3,4,5], k = 3; top row probes from the anchor, bottom row is the list after the in-place group reversal; boxes 44x36 pitch 68 from x=116 -->
  <text x="169" y="20" text-anchor="middle" fill="#5c6b76" font-size="12">the probe walks k = 3 nodes and lands on node 3</text>
  <path d="M 64 76 Q 169 26 274 76" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="108" y="72" width="196" height="56" rx="8" fill="none" stroke="#4169E1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="312" y="72" width="128" height="56" rx="8" fill="none" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="5 4"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="36" y="80" width="56" height="36"/>
    <rect x="116" y="80" width="44" height="36"/>
    <rect x="184" y="80" width="44" height="36"/>
    <rect x="252" y="80" width="44" height="36"/>
    <rect x="320" y="80" width="44" height="36"/>
    <rect x="388" y="80" width="44" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="64" y="102" font-size="11.5">dummy</text>
    <text x="138" y="102">1</text>
    <text x="206" y="102">2</text>
    <text x="274" y="102">3</text>
    <text x="342" y="102">4</text>
    <text x="410" y="102">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 92 98 H 112" marker-end="url(#arrow)"/>
    <path d="M 160 98 H 180" marker-end="url(#arrow)"/>
    <path d="M 228 98 H 248" marker-end="url(#arrow)"/>
    <path d="M 296 98 H 316" marker-end="url(#arrow)"/>
    <path d="M 364 98 H 384" marker-end="url(#arrow)"/>
  </g>
  <text x="64" y="148" text-anchor="middle" fill="#5c6b76" font-size="12">anchor</text>
  <text x="206" y="148" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">one full group of k = 3</text>
  <text x="376" y="148" text-anchor="middle" fill="#9aa7b2" font-size="12">only 2 left — under k</text>
  <path d="M 206 158 V 190" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="222" y="178" fill="#5c6b76" font-size="12">reverse the group in place</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="36" y="206" width="56" height="36" fill="#ffffff"/>
    <rect x="116" y="206" width="44" height="36" fill="#dbe4fb"/>
    <rect x="184" y="206" width="44" height="36" fill="#dbe4fb"/>
    <rect x="252" y="206" width="44" height="36" fill="#dbe4fb"/>
    <rect x="320" y="206" width="44" height="36" fill="#ffffff"/>
    <rect x="388" y="206" width="44" height="36" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="64" y="228" font-size="11.5">dummy</text>
    <text x="138" y="228">3</text>
    <text x="206" y="228">2</text>
    <text x="274" y="228">1</text>
    <text x="342" y="228">4</text>
    <text x="410" y="228">5</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 92 224 H 112" marker-end="url(#arrowB)"/>
    <path d="M 160 224 H 180" marker-end="url(#arrowB)"/>
    <path d="M 228 224 H 248" marker-end="url(#arrowB)"/>
    <path d="M 296 224 H 316" marker-end="url(#arrowB)"/>
  </g>
  <path d="M 364 224 H 384" fill="none" stroke="#9aa7b2" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="138" y="262" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">3 now leads</text>
  <text x="376" y="262" text-anchor="middle" fill="#9aa7b2" font-size="12">tail untouched</text>
  <text x="340" y="300" text-anchor="middle" fill="#1a2026" font-size="13">The probe lands on node 3, the full group flips in place so 3 leads, and it splices</text>
  <text x="340" y="320" text-anchor="middle" fill="#1a2026" font-size="13">onto the short tail — 1 → 2 → 3 → 4 → 5 with k = 3 becomes <tspan fill="#4169E1" font-weight="600">3 → 2 → 1 → 4 → 5</tspan>.</text>
</svg>
