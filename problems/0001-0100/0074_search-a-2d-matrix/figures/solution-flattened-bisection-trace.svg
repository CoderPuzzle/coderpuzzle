<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="280" fill="#ffffff"/>
  <!-- matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3; cells 56x38 at (60,70),
       gray corner = flattened index; bisection: (0,12,6,16>=3),(0,6,3,7>=3),(0,3,1,3>=3),(0,1,0,1<3) -->
  <text x="172" y="52" text-anchor="middle" fill="#5c6b76" font-size="12.5">matrix — gray = flattened index</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="70" width="56" height="38"/><rect x="116" y="70" width="56" height="38"/><rect x="172" y="70" width="56" height="38"/><rect x="228" y="70" width="56" height="38"/>
    <rect x="60" y="108" width="56" height="38"/><rect x="116" y="108" width="56" height="38"/><rect x="172" y="108" width="56" height="38"/><rect x="228" y="108" width="56" height="38"/>
    <rect x="60" y="146" width="56" height="38"/><rect x="116" y="146" width="56" height="38"/><rect x="172" y="146" width="56" height="38"/><rect x="228" y="146" width="56" height="38"/>
  </g>
  <rect x="116" y="70" width="56" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.2"/>
  <g text-anchor="middle" fill="#1a2026" font-size="14">
    <text x="88" y="94">1</text><text x="144" y="94" fill="#4169E1" font-weight="600">3</text><text x="200" y="94">5</text><text x="256" y="94">7</text>
    <text x="88" y="132">10</text><text x="144" y="132">11</text><text x="200" y="132">16</text><text x="256" y="132">20</text>
    <text x="88" y="170">23</text><text x="144" y="170">30</text><text x="200" y="170">34</text><text x="256" y="170">60</text>
  </g>
  <g text-anchor="start" fill="#9aa7b2" font-size="10">
    <text x="64" y="82">0</text><text x="120" y="82">1</text><text x="176" y="82">2</text><text x="232" y="82">3</text>
    <text x="64" y="120">4</text><text x="120" y="120">5</text><text x="176" y="120">6</text><text x="232" y="120">7</text>
    <text x="64" y="158">8</text><text x="120" y="158">9</text><text x="176" y="158">10</text><text x="232" y="158">11</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="336" y="82">step</text><text x="380" y="82">lo</text><text x="420" y="82">hi</text>
    <text x="460" y="82">mid</text><text x="524" y="82">value</text><text x="594" y="82">goes to</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="336" y="106">1</text><text x="380" y="106">0</text><text x="420" y="106">12</text>
    <text x="460" y="106">6</text><text x="524" y="106">16 ≥ 3</text><text x="594" y="106">hi = 6</text>
    <text x="336" y="132">2</text><text x="380" y="132">0</text><text x="420" y="132">6</text>
    <text x="460" y="132">3</text><text x="524" y="132">7 ≥ 3</text><text x="594" y="132">hi = 3</text>
    <text x="336" y="158">3</text><text x="380" y="158">0</text><text x="420" y="158">3</text>
    <text x="460" y="158" fill="#4169E1" font-weight="600">1</text><text x="524" y="158" fill="#4169E1" font-weight="600">3 ≥ 3</text><text x="594" y="158">hi = 1</text>
    <text x="336" y="184">4</text><text x="380" y="184">0</text><text x="420" y="184">1</text>
    <text x="460" y="184">0</text><text x="524" y="184">1 &lt; 3</text><text x="594" y="184">lo = 1</text>
  </g>
  <g stroke="#f0f3f7" stroke-width="1">
    <line x1="316" y1="114" x2="622" y2="114"/><line x1="316" y1="140" x2="622" y2="140"/>
    <line x1="316" y1="166" x2="622" y2="166"/>
  </g>
  <text x="320" y="228" text-anchor="middle" fill="#1a2026" font-size="13">The window collapses to lo = hi = <tspan fill="#4169E1" font-weight="600">1</tspan> — cell (0, 1) holds <tspan fill="#4169E1" font-weight="600">3</tspan>, so target 3 is found.</text>
  <text x="320" y="254" text-anchor="middle" fill="#1a2026" font-size="13">One bisection over [0, 12) suffices; mid / 4 and mid % 4 map each mid back to its cell.</text>
</svg>
