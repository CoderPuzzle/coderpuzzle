<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 3, filled [[1,2,3],[8,9,4],[7,6,5]]; cells 56x48 at (96,92); gray corner tags = run number, arrows = run direction -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="96" y="92" width="56" height="48"/><rect x="152" y="92" width="56" height="48"/><rect x="208" y="92" width="56" height="48"/>
    <rect x="96" y="140" width="56" height="48"/><rect x="152" y="140" width="56" height="48"/><rect x="208" y="140" width="56" height="48"/>
    <rect x="96" y="188" width="56" height="48"/><rect x="152" y="188" width="56" height="48"/><rect x="208" y="188" width="56" height="48"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="14">
    <text x="124" y="121">1</text><text x="180" y="121">2</text><text x="236" y="121">3</text>
    <text x="124" y="169">8</text><text x="180" y="169">9</text><text x="236" y="169">4</text>
    <text x="124" y="217">7</text><text x="180" y="217">6</text><text x="236" y="217">5</text>
  </g>
  <g fill="#9aa7b2" font-size="10">
    <text x="102" y="106">1</text><text x="158" y="106">1</text><text x="214" y="106">1</text>
    <text x="102" y="154">4</text><text x="158" y="154">5</text><text x="214" y="154">2</text>
    <text x="102" y="202">3</text><text x="158" y="202">3</text><text x="214" y="202">2</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 100 78 H 252" marker-end="url(#arrow)"/>
    <path d="M 280 96 V 228" marker-end="url(#arrow)"/>
    <path d="M 260 252 H 108" marker-end="url(#arrow)"/>
    <path d="M 80 232 V 100" marker-end="url(#arrow)"/>
  </g>
  <text x="320" y="84" fill="#5c6b76" font-size="12.5">the runs, in order</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="320" y="112">ring 1 &#183; top row, left to right &#8212; <tspan fill="#4169E1" font-weight="600">1 2 3</tspan></text>
    <text x="320" y="140">ring 1 &#183; right column, top down &#8212; <tspan fill="#4169E1" font-weight="600">4 5</tspan></text>
    <text x="320" y="168">ring 1 &#183; bottom row, right to left &#8212; <tspan fill="#4169E1" font-weight="600">6 7</tspan></text>
    <text x="320" y="196">ring 1 &#183; left column, bottom up &#8212; <tspan fill="#4169E1" font-weight="600">8</tspan></text>
    <text x="320" y="224">ring 2 &#183; top row, one cell &#8212; <tspan fill="#4169E1" font-weight="600">9</tspan></text>
  </g>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Each ring is four runs &#8212; top, right, bottom, left &#8212; then the boundaries step inward.</text>
  <text x="320" y="320" text-anchor="middle" fill="#1a2026" font-size="13">Ring 2's top-row run is a single cell, so <tspan fill="#4169E1" font-weight="600">9</tspan> &#8212; the last value &#8212; lands in the centre.</text>
</svg>
