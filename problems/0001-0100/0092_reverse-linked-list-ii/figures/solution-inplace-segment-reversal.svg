<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 385" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="385" fill="#ffffff"/>
  <!-- head = [1,2,3,4,5], left = 2, right = 4; node boxes 36x32 at x = 250 + 68k;
       rows: start, after 3 flips (2-3-4 point backwards), after the two splice writes -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- row labels -->
  <g fill="#5c6b76" font-size="12">
    <text x="16" y="60">Dummy first, so prev can sit</text>
    <text x="16" y="76">on node 1 while curr starts</text>
    <text x="16" y="92">the segment at node 2.</text>
    <text x="16" y="168">Three flips (right-left+1)</text>
    <text x="16" y="184">point 2, 3, 4 backwards;</text>
    <text x="16" y="200">node 1 still holds 2, node 5</text>
    <text x="16" y="216">has nothing pointing at it.</text>
    <text x="16" y="284">Two writes splice it home:</text>
    <text x="16" y="300">1 takes 4 and the old first</text>
    <text x="16" y="316">node 2 takes 5.</text>
  </g>
  <!-- row 1: start -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="250" y="54" width="36" height="32"/><rect x="318" y="54" width="36" height="32"/>
    <rect x="386" y="54" width="36" height="32"/><rect x="454" y="54" width="36" height="32"/>
    <rect x="522" y="54" width="36" height="32"/><rect x="590" y="54" width="36" height="32"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="268" y="74" fill="#5c6b76" font-size="12">d</text>
    <text x="336" y="74">1</text><text x="404" y="74">2</text><text x="472" y="74">3</text>
    <text x="540" y="74">4</text><text x="608" y="74">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 288 70 H 314" marker-end="url(#arrow)"/>
    <path d="M 356 70 H 382" marker-end="url(#arrow)"/>
    <path d="M 424 70 H 450" marker-end="url(#arrow)"/>
    <path d="M 492 70 H 518" marker-end="url(#arrow)"/>
    <path d="M 560 70 H 586" marker-end="url(#arrow)"/>
  </g>
  <rect x="380" y="48" width="184" height="44" rx="8" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="472" y="140" text-anchor="middle" fill="#4169E1" font-size="12">positions left = 2 .. right = 4</text>
  <g stroke="#4169E1" stroke-width="1.5">
    <line x1="336" y1="104" x2="336" y2="90" marker-end="url(#arrowB)"/>
    <line x1="404" y1="104" x2="404" y2="94" marker-end="url(#arrowB)"/>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="336" y="118">prev</text>
    <text x="404" y="118">curr</text>
  </g>
  <!-- row 2: after 3 flips -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="250" y="159" width="36" height="32"/><rect x="318" y="159" width="36" height="32"/>
    <rect x="386" y="159" width="36" height="32"/><rect x="454" y="159" width="36" height="32"/>
    <rect x="522" y="159" width="36" height="32"/><rect x="590" y="159" width="36" height="32"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="268" y="179" fill="#5c6b76" font-size="12">d</text>
    <text x="336" y="179">1</text><text x="404" y="179">2</text><text x="472" y="179">3</text>
    <text x="540" y="179">4</text><text x="608" y="179">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 288 175 H 314" marker-end="url(#arrow)"/>
    <path d="M 356 175 H 382" marker-end="url(#arrow)"/>
  </g>
  <!-- flipped links 2->1, 3->2, 4->3 -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 398 194 Q 371 224 344 195" marker-end="url(#arrowB)"/>
    <path d="M 466 194 Q 439 224 412 195" marker-end="url(#arrowB)"/>
    <path d="M 534 194 Q 507 224 480 195" marker-end="url(#arrowB)"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5">
    <line x1="540" y1="234" x2="540" y2="196" marker-end="url(#arrowB)"/>
    <line x1="608" y1="234" x2="608" y2="196" marker-end="url(#arrowB)"/>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="540" y="248">prev</text>
    <text x="608" y="248">curr</text>
  </g>
  <!-- row 3: after the two splice writes -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="250" y="274" width="36" height="32"/><rect x="318" y="274" width="36" height="32"/>
    <rect x="386" y="274" width="36" height="32"/><rect x="454" y="274" width="36" height="32"/>
    <rect x="522" y="274" width="36" height="32"/><rect x="590" y="274" width="36" height="32"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="268" y="294" fill="#5c6b76" font-size="12">d</text>
    <text x="336" y="294">1</text><text x="404" y="294">4</text><text x="472" y="294">3</text>
    <text x="540" y="294">2</text><text x="608" y="294">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 288 290 H 314" marker-end="url(#arrow)"/>
    <path d="M 424 290 H 450" marker-end="url(#arrow)"/>
    <path d="M 492 290 H 518" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <path d="M 356 290 H 382" marker-end="url(#arrowB)"/>
    <path d="M 560 290 H 586" marker-end="url(#arrowB)"/>
  </g>
  <text x="369" y="270" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">1→4</text>
  <text x="573" y="270" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">2→5</text>
  <!-- caption -->
  <text x="340" y="344" text-anchor="middle" fill="#1a2026" font-size="13">After exactly right-left+1 = 3 flips prev sits on 4 and curr on 5; the two splice</text>
  <text x="340" y="364" text-anchor="middle" fill="#1a2026" font-size="13">writes 1→4 and 2→5 finish the one-pass result <tspan fill="#4169E1" font-weight="600">[1,4,3,2,5]</tspan>.</text>
</svg>
