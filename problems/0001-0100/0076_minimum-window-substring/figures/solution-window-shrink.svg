<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="600" height="270" fill="#ffffff"/>
  <text x="20" y="24" fill="#1a2026" font-weight="600">s = "ADOBECODEBANC", t = "ABC" - every time missing hits 0, the window is squeezed from the left</text>
  <!-- char cells: 13 chars, x = 70 + i*36, w=34 -->
  <g fill="#8a94a0" font-size="10.5" text-anchor="middle">
    <text x="87" y="50">0</text><text x="123" y="50">1</text><text x="159" y="50">2</text><text x="195" y="50">3</text><text x="231" y="50">4</text><text x="267" y="50">5</text><text x="303" y="50">6</text><text x="339" y="50">7</text><text x="375" y="50">8</text><text x="411" y="50">9</text><text x="447" y="50">10</text><text x="483" y="50">11</text><text x="519" y="50">12</text>
  </g>
  <!-- row 1: ADOBEC [0..5] -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="70" y="58" width="34" height="30"/><rect x="106" y="58" width="34" height="30"/><rect x="142" y="58" width="34" height="30"/><rect x="178" y="58" width="34" height="30"/><rect x="214" y="58" width="34" height="30"/><rect x="250" y="58" width="34" height="30"/><rect x="286" y="58" width="34" height="30"/><rect x="322" y="58" width="34" height="30"/><rect x="358" y="58" width="34" height="30"/><rect x="394" y="58" width="34" height="30"/><rect x="430" y="58" width="34" height="30"/><rect x="466" y="58" width="34" height="30"/><rect x="502" y="58" width="34" height="30"/>
  </g>
  <rect x="70" y="58" width="214" height="30" fill="#e9eefb" stroke="#4169E1" stroke-width="1.8"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="87" y="78">A</text><text x="123" y="78">D</text><text x="159" y="78">O</text><text x="195" y="78">B</text><text x="231" y="78">E</text><text x="267" y="78">C</text><text x="303" y="78">O</text><text x="339" y="78">D</text><text x="375" y="78">E</text><text x="411" y="78">B</text><text x="447" y="78">A</text><text x="483" y="78">N</text><text x="519" y="78">C</text>
  </g>
  <text x="300" y="106" fill="#5b6470" font-size="11.5">right = 5: first valid window "ADOBEC", length 6</text>
  <!-- row 2: CODEBA [5..10] -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="70" y="122" width="34" height="30"/><rect x="106" y="122" width="34" height="30"/><rect x="142" y="122" width="34" height="30"/><rect x="178" y="122" width="34" height="30"/><rect x="214" y="122" width="34" height="30"/><rect x="250" y="122" width="34" height="30"/><rect x="286" y="122" width="34" height="30"/><rect x="322" y="122" width="34" height="30"/><rect x="358" y="122" width="34" height="30"/><rect x="394" y="122" width="34" height="30"/><rect x="430" y="122" width="34" height="30"/><rect x="466" y="122" width="34" height="30"/><rect x="502" y="122" width="34" height="30"/>
  </g>
  <rect x="250" y="122" width="214" height="30" fill="#e9eefb" stroke="#4169E1" stroke-width="1.8"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="87" y="142">A</text><text x="123" y="142">D</text><text x="159" y="142">O</text><text x="195" y="142">B</text><text x="231" y="142">E</text><text x="267" y="142">C</text><text x="303" y="142">O</text><text x="339" y="142">D</text><text x="375" y="142">E</text><text x="411" y="142">B</text><text x="447" y="142">A</text><text x="483" y="142">N</text><text x="519" y="142">C</text>
  </g>
  <text x="300" y="170" fill="#5b6470" font-size="11.5">right = 10: next valid window "CODEBA", also length 6 - no improvement</text>
  <!-- row 3: BANC [9..12] -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="70" y="186" width="34" height="30"/><rect x="106" y="186" width="34" height="30"/><rect x="142" y="186" width="34" height="30"/><rect x="178" y="186" width="34" height="30"/><rect x="214" y="186" width="34" height="30"/><rect x="250" y="186" width="34" height="30"/><rect x="286" y="186" width="34" height="30"/><rect x="322" y="186" width="34" height="30"/><rect x="358" y="186" width="34" height="30"/><rect x="394" y="186" width="34" height="30"/><rect x="430" y="186" width="34" height="30"/><rect x="466" y="186" width="34" height="30"/><rect x="502" y="186" width="34" height="30"/>
  </g>
  <rect x="394" y="186" width="142" height="30" fill="#4169E1" fill-opacity="0.85" stroke="#1a2026" stroke-width="1.8"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="87" y="206">A</text><text x="123" y="206">D</text><text x="159" y="206">O</text><text x="195" y="206">B</text><text x="231" y="206">E</text><text x="267" y="206">C</text><text x="303" y="206">O</text><text x="339" y="206">D</text><text x="375" y="206">E</text><text x="411" y="206" fill="#ffffff">B</text><text x="447" y="206" fill="#ffffff">A</text><text x="483" y="206">N</text><text x="519" y="206" fill="#ffffff">C</text>
  </g>
  <text x="300" y="240" fill="#4169E1" font-size="11.5" font-weight="600">right = 12: "BANC", length 4 - every kept character is needed; this is the answer</text>
  <text x="20" y="262" fill="#5b6470" font-size="11">Each valid window is shrunk only while its leftmost character is surplus (need &lt; 0), then that required character is evicted to resume the scan.</text>
</svg>
