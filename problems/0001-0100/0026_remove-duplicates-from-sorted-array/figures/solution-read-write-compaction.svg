<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums = [0,0,1,1,1,2,2,3,3,4]; cells 44x40 pitch 48 from x=80; top row is mid-scan (read = 5, write = 2), bottom row the final array; prefix bracket spans x 80..320 -->
  <text x="320" y="20" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums = [0,0,1,1,1,2,2,3,3,4] — read and write both start at index 1</text>
  <text x="80" y="50" fill="#5c6b76" font-size="12">mid-scan — read has reached index 5</text>
  <path d="M 342 30 V 56" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="46" fill="#4169E1" font-size="12" font-weight="600">read</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="80" y="60" width="44" height="40" fill="#dbe4fb"/>
    <rect x="128" y="60" width="44" height="40" fill="#dbe4fb"/>
    <rect x="176" y="60" width="44" height="40" fill="#ffffff"/>
    <rect x="224" y="60" width="44" height="40" fill="#ffffff"/>
    <rect x="272" y="60" width="44" height="40" fill="#ffffff"/>
    <rect x="320" y="60" width="44" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
    <rect x="368" y="60" width="44" height="40" fill="#ffffff"/>
    <rect x="416" y="60" width="44" height="40" fill="#ffffff"/>
    <rect x="464" y="60" width="44" height="40" fill="#ffffff"/>
    <rect x="512" y="60" width="44" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="102" y="86">0</text>
    <text x="150" y="86">1</text>
    <text x="198" y="86">1</text>
    <text x="246" y="86">1</text>
    <text x="294" y="86">1</text>
    <text x="342" y="86">2</text>
    <text x="390" y="86">2</text>
    <text x="438" y="86">3</text>
    <text x="486" y="86">3</text>
    <text x="534" y="86">4</text>
  </g>
  <path d="M 198 140 V 104" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="132" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">write</text>
  <path d="M 342 108 Q 272 150 206 108" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="164" text-anchor="middle" fill="#1a2026" font-size="12.5">nums[5] = 2 ≠ last kept nums[1] = 1 → copy 2 into nums[write]</text>
  <path d="M 320 178 V 196" fill="none" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="332" y="192" fill="#5c6b76" font-size="12">scan finishes</text>
  <text x="80" y="216" fill="#5c6b76" font-size="12">after the scan — write stopped at 5</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="80" y="222" width="44" height="40" fill="#dbe4fb"/>
    <rect x="128" y="222" width="44" height="40" fill="#dbe4fb"/>
    <rect x="176" y="222" width="44" height="40" fill="#dbe4fb"/>
    <rect x="224" y="222" width="44" height="40" fill="#dbe4fb"/>
    <rect x="272" y="222" width="44" height="40" fill="#dbe4fb"/>
    <rect x="320" y="222" width="44" height="40" fill="#f0f3f7"/>
    <rect x="368" y="222" width="44" height="40" fill="#f0f3f7"/>
    <rect x="416" y="222" width="44" height="40" fill="#f0f3f7"/>
    <rect x="464" y="222" width="44" height="40" fill="#f0f3f7"/>
    <rect x="512" y="222" width="44" height="40" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="102" y="248" fill="#1a2026">0</text>
    <text x="150" y="248" fill="#1a2026">1</text>
    <text x="198" y="248" fill="#1a2026">2</text>
    <text x="246" y="248" fill="#1a2026">3</text>
    <text x="294" y="248" fill="#1a2026">4</text>
    <text x="342" y="248" fill="#9aa7b2">2</text>
    <text x="390" y="248" fill="#9aa7b2">2</text>
    <text x="438" y="248" fill="#9aa7b2">3</text>
    <text x="486" y="248" fill="#9aa7b2">3</text>
    <text x="534" y="248" fill="#9aa7b2">4</text>
  </g>
  <path d="M 80 268 V 276 H 320 V 268" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="200" y="294" text-anchor="middle" fill="#1a2026" font-size="12.5">k = write = <tspan fill="#4169E1" font-weight="600">5</tspan> — return [0,1,2,3,4]</text>
  <text x="438" y="294" text-anchor="middle" fill="#9aa7b2" font-size="12">beyond k — ignored</text>
  <text x="320" y="320" text-anchor="middle" fill="#1a2026" font-size="13">read sweeps right while write lags; each value that differs from the last kept</text>
  <text x="320" y="338" text-anchor="middle" fill="#1a2026" font-size="13">one is copied down, so the unique prefix <tspan fill="#4169E1" font-weight="600">0,1,2,3,4</tspan> compacts in place.</text>
</svg>
