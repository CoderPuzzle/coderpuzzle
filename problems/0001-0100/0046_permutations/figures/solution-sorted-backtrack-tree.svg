<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,2,3] sorted; backtracking tree: depth-1 nodes at x=124,316,508 (y 76-102),
       pair nodes w56 at x=76,172,268,364,460,556 (y 146-170), leaf boxes w88 h36 (y 216-252);
       accented path root -> 2 -> [2,1] -> [2,1,3] shows the shared buffer and used marks -->
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 302 40 L 138 76" marker-end="url(#arrow)"/>
    <path d="M 330 40 L 494 76" marker-end="url(#arrow)"/>
    <path d="M 112 102 L 84 146" marker-end="url(#arrow)"/>
    <path d="M 136 102 L 164 146" marker-end="url(#arrow)"/>
    <path d="M 330 102 L 364 146" marker-end="url(#arrow)"/>
    <path d="M 496 102 L 468 146" marker-end="url(#arrow)"/>
    <path d="M 520 102 L 548 146" marker-end="url(#arrow)"/>
    <path d="M 76 170 V 216" marker-end="url(#arrow)"/>
    <path d="M 172 170 V 216" marker-end="url(#arrow)"/>
    <path d="M 364 170 V 216" marker-end="url(#arrow)"/>
    <path d="M 460 170 V 216" marker-end="url(#arrow)"/>
    <path d="M 556 170 V 216" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.4" fill="none">
    <path d="M 316 40 L 316 76" marker-end="url(#arrowB)"/>
    <path d="M 316 102 L 282 146" marker-end="url(#arrowB)"/>
    <path d="M 268 170 V 216" marker-end="url(#arrowB)"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="292" y="16" width="48" height="24" rx="6"/>
    <rect x="110" y="76" width="28" height="26" rx="6"/>
    <rect x="302" y="76" width="28" height="26" rx="6"/>
    <rect x="494" y="76" width="28" height="26" rx="6"/>
    <rect x="48" y="146" width="56" height="24" rx="6"/>
    <rect x="144" y="146" width="56" height="24" rx="6"/>
    <rect x="336" y="146" width="56" height="24" rx="6"/>
    <rect x="432" y="146" width="56" height="24" rx="6"/>
    <rect x="528" y="146" width="56" height="24" rx="6"/>
    <rect x="32" y="216" width="88" height="36" rx="6"/>
    <rect x="128" y="216" width="88" height="36" rx="6"/>
    <rect x="320" y="216" width="88" height="36" rx="6"/>
    <rect x="416" y="216" width="88" height="36" rx="6"/>
    <rect x="512" y="216" width="88" height="36" rx="6"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <rect x="240" y="146" width="56" height="24" rx="6"/>
    <rect x="224" y="216" width="88" height="36" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="316" y="33" font-size="12.5">start</text>
    <text x="124" y="94" font-weight="600">1</text>
    <text x="316" y="94" font-weight="600" fill="#4169E1">2</text>
    <text x="508" y="94" font-weight="600">3</text>
    <g font-size="12.5">
      <text x="76" y="162">[1,2]</text><text x="172" y="162">[1,3]</text>
      <text x="268" y="162" fill="#4169E1" font-weight="600">[2,1]</text>
      <text x="364" y="162">[2,3]</text><text x="460" y="162">[3,1]</text><text x="556" y="162">[3,2]</text>
    </g>
    <g font-size="13.5" font-weight="600">
      <text x="76" y="239">1 2 3</text><text x="172" y="239">1 3 2</text>
      <text x="268" y="239" fill="#4169E1">2 1 3</text>
      <text x="364" y="239">2 3 1</text><text x="460" y="239">3 1 2</text><text x="556" y="239">3 2 1</text>
    </g>
  </g>
  <g fill="#5c6b76" font-size="11" text-anchor="middle">
    <text x="344" y="88" text-anchor="start">current [2] · used {2}</text>
    <text x="316" y="186">append 1</text>
    <text x="316" y="199">used {1, 2}</text>
  </g>
  <text x="320" y="278" text-anchor="middle" fill="#1a2026" font-size="13">The walk appends one unused element per level and pops on return; at each leaf,</text>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">current = <tspan fill="#4169E1" font-weight="600">[2, 1, 3]</tspan> is copied. Leaves emerge in ascending lexicographic order.</text>
</svg>
