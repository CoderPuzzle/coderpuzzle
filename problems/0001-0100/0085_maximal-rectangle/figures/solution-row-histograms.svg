<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="600" height="260" fill="#ffffff"/>
  <text x="20" y="24" fill="#1a2026" font-weight="600">Each row becomes a histogram of consecutive 1s ending there; the row-2 histogram holds a 2 x 3 rectangle</text>
  <!-- matrix 4x5, cell 26 -->
  <g stroke="#1a2026" stroke-width="1.2" fill="#ffffff">
    <rect x="44" y="44" width="26" height="26"/><rect x="70" y="44" width="26" height="26"/><rect x="96" y="44" width="26" height="26"/><rect x="122" y="44" width="26" height="26"/><rect x="148" y="44" width="26" height="26"/>
    <rect x="44" y="70" width="26" height="26"/><rect x="70" y="70" width="26" height="26"/><rect x="96" y="70" width="26" height="26"/><rect x="122" y="70" width="26" height="26"/><rect x="148" y="70" width="26" height="26"/>
    <rect x="44" y="96" width="26" height="26"/><rect x="70" y="96" width="26" height="26"/><rect x="96" y="96" width="26" height="26"/><rect x="122" y="96" width="26" height="26"/><rect x="148" y="96" width="26" height="26"/>
    <rect x="44" y="122" width="26" height="26"/><rect x="70" y="122" width="26" height="26"/><rect x="96" y="122" width="26" height="26"/><rect x="122" y="122" width="26" height="26"/><rect x="148" y="122" width="26" height="26"/>
  </g>
  <!-- 1s -->
  <g fill="#1a2026" text-anchor="middle" font-weight="600" font-size="12">
    <text x="57" y="62">1</text><text x="109" y="62">1</text>
    <text x="57" y="88">1</text><text x="109" y="88">1</text><text x="135" y="88">1</text><text x="161" y="88">1</text>
    <text x="57" y="114">1</text><text x="83" y="114">1</text><text x="109" y="114">1</text><text x="135" y="114">1</text><text x="161" y="114">1</text>
    <text x="57" y="140">1</text><text x="135" y="140">1</text>
  </g>
  <!-- highlight rectangle rows 1-2, cols 2-4 -->
  <rect x="96" y="70" width="78" height="52" fill="#4169E1" fill-opacity="0.3" stroke="#4169E1" stroke-width="2.2"/>
  <text x="135" y="186" fill="#4169E1" font-size="11.5" text-anchor="middle" font-weight="700">the 6-cell rectangle</text>
  <text x="135" y="202" fill="#5b6470" font-size="11" text-anchor="middle">rows 1-2, cols 2-4</text>
  <!-- per-row heights -->
  <g font-size="11.5">
    <text x="260" y="62" fill="#5b6470">row 0 heights: [1, 0, 1, 0, 0]</text>
    <text x="260" y="88" fill="#5b6470">row 1 heights: [2, 0, 2, 1, 1]</text>
    <text x="260" y="114" fill="#1a2026" font-weight="600">row 2 heights: [3, 1, 3, 2, 2]</text>
    <text x="260" y="140" fill="#5b6470">row 3 heights: [4, 0, 0, 3, 0]</text>
  </g>
  <!-- bracket over cols 2-4 of row 2 -->
  <path d="M 367 122 L 367 132 L 403 132 L 403 122" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <text x="385" y="148" fill="#4169E1" font-size="11" text-anchor="middle" font-weight="600">min 2 x width 3 = 6</text>
  <text x="260" y="178" fill="#5b6470" font-size="11">A '0' resets its column's height to 0, so no</text>
  <text x="260" y="194" fill="#5b6470" font-size="11">rectangle can span it; each row's heights are</text>
  <text x="260" y="210" fill="#5b6470" font-size="11">fed to the same monotonic-stack scan as 0084.</text>
  <text x="20" y="246" fill="#5b6470" font-size="11.5">Every all-ones rectangle is a histogram rectangle in the row where it ends, so scanning all rows finds it.</text>
</svg>
