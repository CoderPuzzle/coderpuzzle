<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="620" height="320" fill="#ffffff"/>
  <text x="20" y="26" fill="#1a2026" font-weight="600">s = ")()())" - the stack after each character (bottom value is the current base)</text>
  <!-- string -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="40" y="42" width="34" height="30"/><rect x="74" y="42" width="34" height="30"/><rect x="108" y="42" width="34" height="30"/><rect x="142" y="42" width="34" height="30"/><rect x="176" y="42" width="34" height="30"/><rect x="210" y="42" width="34" height="30"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="57" y="62">)</text><text x="91" y="62">(</text><text x="125" y="62">)</text><text x="159" y="62">(</text><text x="193" y="62">)</text><text x="227" y="62">)</text>
  </g>
  <g fill="#8a94a0" font-size="10.5" text-anchor="middle">
    <text x="57" y="36">0</text><text x="91" y="36">1</text><text x="125" y="36">2</text><text x="159" y="36">3</text><text x="193" y="36">4</text><text x="227" y="36">5</text>
  </g>
  <!-- six stack panels -->
  <!-- i=0: [0] -->
  <g>
    <text x="40" y="112" fill="#5b6470" font-size="11.5" font-weight="600">i=0 ')'</text>
    <rect x="40" y="170" width="34" height="22" fill="#e9eefb" stroke="#4169E1" stroke-width="1.6"/>
    <text x="57" y="186" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12">0</text>
    <text x="40" y="216" fill="#5b6470" font-size="10.5">pop empties stack -</text>
    <text x="40" y="230" fill="#5b6470" font-size="10.5">unmatched ')' is the</text>
    <text x="40" y="244" fill="#5b6470" font-size="10.5">new base</text>
  </g>
  <!-- i=1: [0,1] -->
  <g>
    <text x="134" y="112" fill="#5b6470" font-size="11.5" font-weight="600">i=1 '('</text>
    <rect x="134" y="148" width="34" height="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
    <rect x="134" y="170" width="34" height="22" fill="#e9eefb" stroke="#4169E1" stroke-width="1.6"/>
    <text x="151" y="164" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12">1</text>
    <text x="151" y="186" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12">0</text>
    <text x="134" y="216" fill="#5b6470" font-size="10.5">push its index</text>
  </g>
  <!-- i=2: [0], len 2 -->
  <g>
    <text x="228" y="112" fill="#5b6470" font-size="11.5" font-weight="600">i=2 ')'</text>
    <rect x="228" y="170" width="34" height="22" fill="#e9eefb" stroke="#4169E1" stroke-width="1.6"/>
    <text x="245" y="186" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12">0</text>
    <text x="228" y="216" fill="#5b6470" font-size="10.5">pop 1; length 2-0 = 2</text>
    <text x="228" y="230" fill="#4169E1" font-size="10.5" font-weight="600">best = 2</text>
  </g>
  <!-- i=3: [0,3] -->
  <g>
    <text x="322" y="112" fill="#5b6470" font-size="11.5" font-weight="600">i=3 '('</text>
    <rect x="322" y="148" width="34" height="22" fill="#ffffff" stroke="#1a2026" stroke-width="1.4"/>
    <rect x="322" y="170" width="34" height="22" fill="#e9eefb" stroke="#4169E1" stroke-width="1.6"/>
    <text x="339" y="164" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12">3</text>
    <text x="339" y="186" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12">0</text>
    <text x="322" y="216" fill="#5b6470" font-size="10.5">push its index</text>
  </g>
  <!-- i=4: [0], len 4 -->
  <g>
    <text x="416" y="112" fill="#5b6470" font-size="11.5" font-weight="600">i=4 ')'</text>
    <rect x="416" y="170" width="34" height="22" fill="#e9eefb" stroke="#4169E1" stroke-width="2.2"/>
    <text x="433" y="186" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12">0</text>
    <text x="416" y="216" fill="#5b6470" font-size="10.5">pop 3; length 4-0 = 4</text>
    <text x="416" y="230" fill="#4169E1" font-size="10.5" font-weight="600">best = 4</text>
  </g>
  <!-- i=5: [5] -->
  <g>
    <text x="510" y="112" fill="#5b6470" font-size="11.5" font-weight="600">i=5 ')'</text>
    <rect x="510" y="170" width="34" height="22" fill="#e9eefb" stroke="#4169E1" stroke-width="1.6"/>
    <text x="527" y="186" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12">5</text>
    <text x="510" y="216" fill="#5b6470" font-size="10.5">pop empties stack -</text>
    <text x="510" y="230" fill="#5b6470" font-size="10.5">new base fences off</text>
    <text x="510" y="244" fill="#5b6470" font-size="10.5">everything left of 5</text>
  </g>
  <line x1="40" y1="164" x2="544" y2="164" stroke="#8a94a0" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="20" y="286" fill="#1a2026">After a match, i - stack[-1] measures the whole stretch back to the closest barrier - here "()()" at indices 1..4, so the answer is <tspan fill="#4169E1" font-weight="700">4</tspan>.</text>
  <text x="20" y="306" fill="#5b6470" font-size="11.5">Blue cells are the base; white cells are unmatched '(' indices still on the stack.</text>
</svg>
