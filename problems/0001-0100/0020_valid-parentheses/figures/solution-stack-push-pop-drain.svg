<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = ()[]{}; char cells 48x40 pitch 72 from x=116; stack boxes 48x36 at y=132 show the stack after each character -->
  <text x="320" y="26" text-anchor="middle" fill="#5c6b76" font-size="12.5">s = "()[]{}" scanned left to right</text>
  <text x="100" y="70" text-anchor="end" fill="#5c6b76" font-size="12.5">s</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="116" y="44" width="48" height="40" fill="#dbe4fb"/>
    <rect x="188" y="44" width="48" height="40" fill="#ffffff"/>
    <rect x="260" y="44" width="48" height="40" fill="#dbe4fb"/>
    <rect x="332" y="44" width="48" height="40" fill="#ffffff"/>
    <rect x="404" y="44" width="48" height="40" fill="#dbe4fb"/>
    <rect x="476" y="44" width="48" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="140" y="70">(</text><text x="212" y="70">)</text><text x="284" y="70">[</text>
    <text x="356" y="70">]</text><text x="428" y="70">{</text><text x="500" y="70">}</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="140" y="110" fill="#5c6b76">push (</text>
    <text x="212" y="110" fill="#4169E1" font-weight="600">pop (</text>
    <text x="284" y="110" fill="#5c6b76">push [</text>
    <text x="356" y="110" fill="#4169E1" font-weight="600">pop [</text>
    <text x="428" y="110" fill="#5c6b76">push {</text>
    <text x="500" y="110" fill="#4169E1" font-weight="600">pop {</text>
  </g>
  <text x="100" y="156" text-anchor="end" fill="#5c6b76" font-size="12.5">stack</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#dbe4fb">
    <rect x="116" y="132" width="48" height="36"/>
    <rect x="260" y="132" width="48" height="36"/>
    <rect x="404" y="132" width="48" height="36"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#f0f3f7" stroke-dasharray="4 3">
    <rect x="188" y="132" width="48" height="36"/>
    <rect x="332" y="132" width="48" height="36"/>
    <rect x="476" y="132" width="48" height="36"/>
  </g>
  <g text-anchor="middle">
    <text x="140" y="156" font-weight="600" fill="#1a2026">(</text>
    <text x="212" y="156" font-size="11" fill="#9aa7b2">empty</text>
    <text x="284" y="156" font-weight="600" fill="#1a2026">[</text>
    <text x="356" y="156" font-size="11" fill="#9aa7b2">empty</text>
    <text x="428" y="156" font-weight="600" fill="#1a2026">{</text>
    <text x="500" y="156" font-size="11" fill="#9aa7b2">empty</text>
  </g>
  <path d="M 512 176 Q 512 204 450 204" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="210" y="190" width="232" height="28" rx="6" fill="#dbe4fb"/>
  <text x="326" y="209" text-anchor="middle" fill="#1a2026">return not stack → <tspan fill="#4169E1" font-weight="600">true</tspan></text>
  <text x="320" y="256" text-anchor="middle" fill="#1a2026" font-size="13">Each closer pops its own opener — ')' pops '(', ']' pops '[', '}' pops '{' — so the</text>
  <text x="320" y="276" text-anchor="middle" fill="#1a2026" font-size="13">stack drains to empty and the final not stack check returns <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
