<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="560" height="430" fill="#ffffff"/>
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <text x="20" y="24" fill="#1a2026" font-weight="600">height = [0,1,0,2,1,0,1,3,2,1,2,1] - the smaller side is settled by its own running max</text>
  <!-- ===== panel A: left=2, right=10 ===== -->
  <line x1="40" y1="180" x2="440" y2="180" stroke="#1a2026" stroke-width="1.4"/>
  <g fill="#1a2026">
    <rect x="76" y="158" width="24" height="22"/>
    <rect x="140" y="136" width="24" height="44"/>
    <rect x="172" y="158" width="24" height="22"/>
    <rect x="236" y="158" width="24" height="22"/>
    <rect x="268" y="114" width="24" height="66"/>
    <rect x="300" y="136" width="24" height="44"/>
    <rect x="332" y="158" width="24" height="22"/>
    <rect x="364" y="136" width="24" height="44"/>
    <rect x="396" y="158" width="24" height="22"/>
  </g>
  <!-- water on index 2 at level 1 -->
  <rect x="108" y="158" width="24" height="22" fill="#4169E1" fill-opacity="0.45"/>
  <text x="120" y="152" fill="#4169E1" font-size="11" text-anchor="middle" font-weight="600">+1</text>
  <!-- running max line (both are 1 here) -->
  <line x1="40" y1="158" x2="440" y2="158" stroke="#4169E1" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="446" y="162" fill="#4169E1" font-size="10.5">left_max = 1</text>
  <text x="446" y="176" fill="#8a94a0" font-size="10.5">right_max = 1</text>
  <!-- pointers -->
  <line x1="120" y1="66" x2="120" y2="90" stroke="#4169E1" stroke-width="2" marker-end="url(#dn)"/>
  <text x="120" y="58" fill="#4169E1" font-size="11.5" text-anchor="middle" font-weight="700">left = 2</text>
  <line x1="376" y1="66" x2="376" y2="90" stroke="#4169E1" stroke-width="2" marker-end="url(#dn)"/>
  <text x="376" y="58" fill="#4169E1" font-size="11.5" text-anchor="middle" font-weight="700">right = 10</text>
  <text x="40" y="112" fill="#5b6470" font-size="11.5">h[2] = 0 &lt; h[10] = 2, so index 2 is settled now: it traps 1 - 0 = 1 unit and left advances.</text>
  <g fill="#8a94a0" font-size="10" text-anchor="middle">
    <text x="56" y="196">0</text><text x="88" y="196">1</text><text x="120" y="196">2</text><text x="152" y="196">3</text><text x="184" y="196">4</text><text x="216" y="196">5</text><text x="248" y="196">6</text><text x="280" y="196">7</text><text x="312" y="196">8</text><text x="344" y="196">9</text><text x="376" y="196">10</text><text x="408" y="196">11</text>
  </g>
  <!-- ===== panel B: left=5, right=8 ===== -->
  <line x1="40" y1="380" x2="440" y2="380" stroke="#1a2026" stroke-width="1.4"/>
  <g fill="#1a2026">
    <rect x="76" y="358" width="24" height="22"/>
    <rect x="140" y="336" width="24" height="44"/>
    <rect x="172" y="358" width="24" height="22"/>
    <rect x="236" y="358" width="24" height="22"/>
    <rect x="268" y="314" width="24" height="66"/>
    <rect x="300" y="336" width="24" height="44"/>
    <rect x="332" y="358" width="24" height="22"/>
    <rect x="364" y="336" width="24" height="44"/>
    <rect x="396" y="358" width="24" height="22"/>
  </g>
  <!-- water on index 5 at level 2 -->
  <rect x="204" y="336" width="24" height="44" fill="#4169E1" fill-opacity="0.45"/>
  <text x="216" y="330" fill="#4169E1" font-size="11" text-anchor="middle" font-weight="600">+2</text>
  <line x1="40" y1="336" x2="440" y2="336" stroke="#4169E1" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="446" y="340" fill="#4169E1" font-size="10.5">left_max = 2</text>
  <text x="446" y="354" fill="#8a94a0" font-size="10.5">right_max = 2</text>
  <line x1="216" y1="264" x2="216" y2="288" stroke="#4169E1" stroke-width="2" marker-end="url(#dn)"/>
  <text x="216" y="256" fill="#4169E1" font-size="11.5" text-anchor="middle" font-weight="700">left = 5</text>
  <line x1="312" y1="264" x2="312" y2="288" stroke="#4169E1" stroke-width="2" marker-end="url(#dn)"/>
  <text x="312" y="256" fill="#4169E1" font-size="11.5" text-anchor="middle" font-weight="700">right = 8</text>
  <text x="40" y="222" fill="#5b6470" font-size="11.5">h[5] = 0 &lt; h[8] = 3, so the taller right side cannot matter: index 5 traps 2 - 0 = 2 units,</text>
  <text x="40" y="238" fill="#5b6470" font-size="11.5">the largest single fill of the walk, decided entirely by left_max.</text>
  <g fill="#8a94a0" font-size="10" text-anchor="middle">
    <text x="56" y="396">0</text><text x="88" y="396">1</text><text x="120" y="396">2</text><text x="152" y="396">3</text><text x="184" y="396">4</text><text x="216" y="396">5</text><text x="248" y="396">6</text><text x="280" y="396">7</text><text x="312" y="396">8</text><text x="344" y="396">9</text><text x="376" y="396">10</text><text x="408" y="396">11</text>
  </g>
  <text x="20" y="420" fill="#5b6470" font-size="11.5">Each step retires one index; the five fills 1 + 1 + 1 + 2 + 1 total the 6 trapped units.</text>
</svg>
