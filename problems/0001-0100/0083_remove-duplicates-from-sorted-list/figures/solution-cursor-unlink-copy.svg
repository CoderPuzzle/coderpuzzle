<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 248" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="520" height="248" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- head = [1,1,2]; cells 48x44 at y=90, gaps 22; the kept 1 is accent, its duplicate muted and crossed out -->
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="216" y1="112" x2="227" y2="112" marker-end="url(#arrowg)"/>
    <line x1="286" y1="112" x2="297" y2="112" marker-end="url(#arrowg)"/>
  </g>
  <!-- the redirect: current.next = current.next.next jumps past the duplicate -->
  <path d="M 190 86 Q 260 26 330 86" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="40" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">current.next = current.next.next</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="166" y="90" width="48" height="44" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="236" y="90" width="48" height="44" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="306" y="90" width="48" height="44" fill="#ffffff"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5">
    <line x1="245" y1="99" x2="275" y2="125"/>
    <line x1="275" y1="99" x2="245" y2="125"/>
  </g>
  <g text-anchor="middle">
    <text x="190" y="117" font-weight="600">1</text>
    <text x="260" y="117" fill="#9aa7b2" font-weight="600">1</text>
    <text x="330" y="117" font-weight="600">2</text>
  </g>
  <line x1="190" y1="164" x2="190" y2="141" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="190" y="182" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">current</text>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="260" y="214">current stays on the kept 1 while one redirect unlinks the copy;</text>
    <text x="260" y="232">only a differing successor (2) advances it — [1,1,2] becomes <tspan fill="#4169E1" font-weight="600">[1,2]</tspan>.</text>
  </g>
</svg>
