<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- head = [1,2,3,4,5], n = 2; nodes r=20 at x 70,150,230,310,390,470 -->
  <text x="40" y="34" fill="#5c6b76" font-size="12.5">after the head start — fast is n = 2 nodes ahead:</text>
  <circle cx="70" cy="70" r="20" fill="#f0f3f7" stroke="#1a2026" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.5">
    <circle cx="150" cy="70" r="20"/><circle cx="230" cy="70" r="20"/><circle cx="310" cy="70" r="20"/><circle cx="390" cy="70" r="20"/><circle cx="470" cy="70" r="20"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="70" y="75" font-size="11.5">d</text>
    <text x="150" y="75">1</text><text x="230" y="75">2</text><text x="310" y="75">3</text><text x="390" y="75">4</text><text x="470" y="75">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 90 70 H 126" marker-end="url(#arrow)"/>
    <path d="M 170 70 H 206" marker-end="url(#arrow)"/>
    <path d="M 250 70 H 286" marker-end="url(#arrow)"/>
    <path d="M 330 70 H 366" marker-end="url(#arrow)"/>
    <path d="M 410 70 H 446" marker-end="url(#arrow)"/>
  </g>
  <path d="M 70 104 V 112 H 230 V 104" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <text x="150" y="128" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">gap = n = 2</text>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <text x="70" y="152" fill="#1a2026">slow</text>
    <text x="230" y="152" fill="#4169E1">fast</text>
  </g>
  <!-- lockstep result: slow on 3 (the predecessor), fast on 5 -->
  <text x="40" y="192" fill="#5c6b76" font-size="12.5">after the lockstep walk:</text>
  <circle cx="70" cy="226" r="20" fill="#f0f3f7" stroke="#1a2026" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.5">
    <circle cx="150" cy="226" r="20"/><circle cx="230" cy="226" r="20"/>
  </g>
  <circle cx="310" cy="226" r="20" fill="#ffffff" stroke="#4169E1" stroke-width="2.4"/>
  <circle cx="390" cy="226" r="20" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="470" cy="226" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600">
    <text x="70" y="231" font-size="11.5" fill="#1a2026">d</text>
    <text x="150" y="231" fill="#1a2026">1</text>
    <text x="230" y="231" fill="#1a2026">2</text>
    <text x="310" y="231" fill="#4169E1">3</text>
    <text x="390" y="231" fill="#9aa7b2">4</text>
    <text x="470" y="231" fill="#1a2026">5</text>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <text x="310" y="264" fill="#4169E1">slow</text>
    <text x="470" y="264" fill="#1a2026">fast</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 90 226 H 126" marker-end="url(#arrow)"/>
    <path d="M 170 226 H 206" marker-end="url(#arrow)"/>
    <path d="M 250 226 H 286" marker-end="url(#arrow)"/>
    <path d="M 330 226 H 366" stroke-dasharray="4 3"/>
  </g>
  <text x="348" y="212" text-anchor="middle" fill="#5c6b76" font-size="11.5">dropped</text>
  <path d="M 322 210 Q 390 168 464 212" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="396" y="182" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">slow.next = slow.next.next</text>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">slow walked sz − n = 3 steps past the dummy; the relink drops 4 and returns <tspan fill="#4169E1" font-weight="600">[1, 2, 3, 5]</tspan>.</text>
</svg>
