<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="324" fill="#ffffff"/>
  <!-- height = [1,8,6,2,5,4,8,3,7]; bars 40 wide at x = 60 + 60i, 15 px per height unit, baseline y=200 -->
  <text x="320" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">height = [1,8,6,2,5,4,8,3,7]</text>
  <rect x="120" y="95" width="460" height="105" fill="#dbe4fb"/>
  <line x1="50" y1="200" x2="590" y2="200" stroke="#42525e" stroke-width="1.5"/>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4">
    <rect x="60" y="185" width="40" height="15"/><rect x="180" y="110" width="40" height="90"/><rect x="240" y="170" width="40" height="30"/><rect x="300" y="125" width="40" height="75"/><rect x="360" y="140" width="40" height="60"/><rect x="420" y="80" width="40" height="120"/><rect x="480" y="155" width="40" height="45"/>
  </g>
  <g fill="#ffffff" stroke="#4169E1" stroke-width="1.8">
    <rect x="120" y="80" width="40" height="120"/><rect x="540" y="95" width="40" height="105"/>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="80" y="179" fill="#9aa7b2">1</text><text x="140" y="74" fill="#1a2026">8</text><text x="200" y="104" fill="#9aa7b2">6</text><text x="260" y="164" fill="#9aa7b2">2</text><text x="320" y="119" fill="#9aa7b2">5</text><text x="380" y="134" fill="#9aa7b2">4</text><text x="440" y="74" fill="#9aa7b2">8</text><text x="500" y="149" fill="#9aa7b2">3</text><text x="560" y="89" fill="#1a2026">7</text>
  </g>
  <text x="262" y="130" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="700">7 × 7 = 49</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="80" y="216">0</text><text x="140" y="216">1</text><text x="200" y="216">2</text><text x="260" y="216">3</text><text x="320" y="216">4</text><text x="380" y="216">5</text><text x="440" y="216">6</text><text x="500" y="216">7</text><text x="560" y="216">8</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="13" font-weight="700">
    <text x="140" y="234">L</text><text x="560" y="234">R</text>
  </g>
  <text x="320" y="262" text-anchor="middle" font-size="12.5"><tspan fill="#5c6b76">measured: </tspan><tspan fill="#1a2026">(0,8) </tspan><tspan fill="#5c6b76">8</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026">(1,8) </tspan><tspan fill="#4169E1" font-weight="700">49</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026">(1,7) </tspan><tspan fill="#5c6b76">18</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026">(1,6) </tspan><tspan fill="#5c6b76">40</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026">(1,5) </tspan><tspan fill="#5c6b76">16</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026">(1,4) </tspan><tspan fill="#5c6b76">15</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026">(1,3) </tspan><tspan fill="#5c6b76">4</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026">(1,2) </tspan><tspan fill="#5c6b76">6</tspan></text>
  <text x="320" y="288" text-anchor="middle" fill="#1a2026" font-size="13">Each step measures width × shorter wall, then retires that shorter wall —</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">the 1, 7, 3, the tied 8, then 4, 5, 2 … nothing beats <tspan fill="#4169E1" font-weight="600">7 × 7 = 49</tspan> at (1, 8).</text>
</svg>
