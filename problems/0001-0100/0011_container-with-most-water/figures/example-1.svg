<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
  <rect width="560" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <!-- water between indices 1 and 8, up to min(8, 7) = 7 -->
  <rect x="114" y="70" width="308" height="182" fill="#4169E1" fill-opacity="0.15"/>
  <line x1="114" y1="70" x2="422" y2="70" stroke="#4169E1" stroke-width="1.6"/>
  <text x="268" y="172" text-anchor="middle" fill="#4169E1" stroke="none" font-size="21" font-weight="600">49</text>
  <!-- vertical lines at each index; accent marks the optimal pair (1 and 8) -->
  <g stroke="#1a2026" stroke-width="2">
    <line x1="70" y1="252" x2="70" y2="226"/>
    <line x1="158" y1="252" x2="158" y2="44"/>
    <line x1="202" y1="252" x2="202" y2="96"/>
    <line x1="246" y1="252" x2="246" y2="200"/>
    <line x1="290" y1="252" x2="290" y2="122"/>
    <line x1="334" y1="252" x2="334" y2="148"/>
    <line x1="378" y1="252" x2="378" y2="44"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.4">
    <line x1="114" y1="252" x2="114" y2="44"/>
    <line x1="422" y1="252" x2="422" y2="70"/>
  </g>
  <!-- axes with unit ticks -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="70" y1="252" x2="470" y2="252" marker-end="url(#arrow)"/>
    <line x1="70" y1="252" x2="70" y2="34" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#1a2026" stroke-width="1.2">
    <line x1="70" y1="252" x2="70" y2="256"/><line x1="114" y1="252" x2="114" y2="256"/>
    <line x1="158" y1="252" x2="158" y2="256"/><line x1="202" y1="252" x2="202" y2="256"/>
    <line x1="246" y1="252" x2="246" y2="256"/><line x1="290" y1="252" x2="290" y2="256"/>
    <line x1="334" y1="252" x2="334" y2="256"/><line x1="378" y1="252" x2="378" y2="256"/>
    <line x1="422" y1="252" x2="422" y2="256"/>
    <line x1="66" y1="252" x2="70" y2="252"/><line x1="66" y1="226" x2="70" y2="226"/>
    <line x1="66" y1="200" x2="70" y2="200"/><line x1="66" y1="174" x2="70" y2="174"/>
    <line x1="66" y1="148" x2="70" y2="148"/><line x1="66" y1="122" x2="70" y2="122"/>
    <line x1="66" y1="96" x2="70" y2="96"/><line x1="66" y1="70" x2="70" y2="70"/>
    <line x1="66" y1="44" x2="70" y2="44"/>
  </g>
  <g fill="#5c6b76">
    <g text-anchor="middle">
      <text x="70" y="274">0</text><text x="114" y="274">1</text><text x="158" y="274">2</text>
      <text x="202" y="274">3</text><text x="246" y="274">4</text><text x="290" y="274">5</text>
      <text x="334" y="274">6</text><text x="378" y="274">7</text><text x="422" y="274">8</text>
    </g>
    <g text-anchor="end">
      <text x="60" y="256">0</text><text x="60" y="230">1</text><text x="60" y="204">2</text>
      <text x="60" y="178">3</text><text x="60" y="152">4</text><text x="60" y="126">5</text>
      <text x="60" y="100">6</text><text x="60" y="74">7</text><text x="60" y="48">8</text>
    </g>
  </g>
</svg>
