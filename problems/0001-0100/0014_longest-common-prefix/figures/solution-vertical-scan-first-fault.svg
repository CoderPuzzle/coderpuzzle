<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- strs = ["flower","flow","flight"]; cells 40x34, column x = 170 + 40j, row y = 78 + 34i; columns 0-1 prefix, column 2 fault -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="190" y="64">0</text><text x="230" y="64">1</text><text x="270" y="64">2</text>
    <text x="310" y="64">3</text><text x="350" y="64">4</text><text x="390" y="64">5</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="152" y="100">strs[0]</text>
    <text x="152" y="134">strs[1]</text>
    <text x="152" y="168">strs[2]</text>
  </g>
  <!-- prefix columns 0-1 -->
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
    <rect x="170" y="78" width="40" height="34"/><rect x="210" y="78" width="40" height="34"/>
    <rect x="170" y="112" width="40" height="34"/><rect x="210" y="112" width="40" height="34"/>
    <rect x="170" y="146" width="40" height="34"/><rect x="210" y="146" width="40" height="34"/>
  </g>
  <!-- fault column 2 -->
  <g fill="#ffffff" stroke="#4169E1" stroke-width="2">
    <rect x="250" y="78" width="40" height="34"/>
    <rect x="250" y="112" width="40" height="34"/>
    <rect x="250" y="146" width="40" height="34"/>
  </g>
  <!-- columns 3-5: never scanned -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2">
    <rect x="290" y="78" width="40" height="34"/><rect x="330" y="78" width="40" height="34"/><rect x="370" y="78" width="40" height="34"/>
    <rect x="290" y="112" width="40" height="34"/><rect x="330" y="112" width="40" height="34"/><rect x="370" y="112" width="40" height="34"/>
    <rect x="290" y="146" width="40" height="34"/><rect x="330" y="146" width="40" height="34"/><rect x="370" y="146" width="40" height="34"/>
  </g>
  <g text-anchor="middle">
    <g fill="#4169E1" font-weight="600">
      <text x="190" y="101">f</text><text x="230" y="101">l</text>
      <text x="190" y="135">f</text><text x="230" y="135">l</text>
      <text x="190" y="169">f</text><text x="230" y="169">l</text>
    </g>
    <text x="270" y="101" fill="#1a2026">o</text>
    <text x="270" y="135" fill="#1a2026">o</text>
    <text x="270" y="169" fill="#4169E1" font-weight="600">i</text>
    <g fill="#9aa7b2">
      <text x="310" y="101">w</text><text x="350" y="101">e</text><text x="390" y="101">r</text>
      <text x="310" y="135">w</text>
      <text x="310" y="169">g</text><text x="350" y="169">h</text><text x="390" y="169">t</text>
    </g>
  </g>
  <text x="350" y="208" text-anchor="middle" fill="#9aa7b2" font-size="12">never reached</text>
  <path d="M 270 204 L 270 186" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="228" text-anchor="middle" fill="#1a2026" font-size="12.5">column 2: 'o' meets 'i' — first fault</text>
  <text x="310" y="266" text-anchor="middle" fill="#1a2026" font-size="13">Columns 0-1 agree across all three strings; the scan stops at the first fault</text>
  <text x="310" y="288" text-anchor="middle" fill="#1a2026" font-size="13">and returns first[:2] = <tspan fill="#4169E1" font-weight="600">"fl"</tspan>.</text>
</svg>
