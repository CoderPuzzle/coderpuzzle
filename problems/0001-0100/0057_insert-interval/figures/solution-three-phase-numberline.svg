<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- intervals [[1,2],[3,5],[6,7],[8,10],[12,16]], newInterval [4,8]; x = 46 + 30·v; gray bands = the three phases -->
  <g fill="#f0f3f7">
    <rect x="64" y="86" width="54" height="32" rx="4"/>
    <rect x="124" y="86" width="230" height="32" rx="4"/>
    <rect x="394" y="86" width="144" height="32" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="91" y="66">copy</text>
    <text x="239" y="66">absorb &#8212; min / max</text>
    <text x="466" y="66">copy</text>
  </g>
  <!-- original intervals -->
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.2">
    <rect x="76" y="96" width="30" height="14"/><rect x="136" y="96" width="60" height="14"/>
    <rect x="226" y="96" width="30" height="14"/><rect x="286" y="96" width="60" height="14"/>
    <rect x="406" y="96" width="120" height="14"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="10.5">
    <text x="91" y="90">[1,2]</text><text x="166" y="90">[3,5]</text><text x="241" y="90">[6,7]</text>
    <text x="316" y="90">[8,10]</text><text x="466" y="90">[12,16]</text>
  </g>
  <!-- newInterval and the widened pair -->
  <text x="226" y="124" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">new</text>
  <rect x="166" y="128" width="120" height="14" fill="#4169E1"/>
  <text x="226" y="138" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">[4,8]</text>
  <g stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="3 3">
    <path d="M 136 110 V 152"/><path d="M 346 110 V 152"/>
    <path d="M 166 142 V 152"/><path d="M 286 142 V 152"/>
  </g>
  <rect x="136" y="152" width="210" height="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="241" y="162" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">[3,10]</text>
  <!-- number line -->
  <path d="M 46 186 H 560" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.2">
    <path d="M 46 181 V 191"/><path d="M 106 181 V 191"/><path d="M 166 181 V 191"/><path d="M 226 181 V 191"/>
    <path d="M 286 181 V 191"/><path d="M 346 181 V 191"/><path d="M 406 181 V 191"/><path d="M 466 181 V 191"/>
    <path d="M 526 181 V 191"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="46" y="208">0</text><text x="106" y="208">2</text><text x="166" y="208">4</text><text x="226" y="208">6</text>
    <text x="286" y="208">8</text><text x="346" y="208">10</text><text x="406" y="208">12</text><text x="466" y="208">14</text>
    <text x="526" y="208">16</text>
  </g>
  <text x="320" y="244" text-anchor="middle" fill="#1a2026" font-size="13">Phase 1 copies [1,2] through; phase 2 absorbs [3,5], [6,7], [8,10] into <tspan fill="#4169E1" font-weight="600">[3,10]</tspan>.</text>
  <text x="320" y="264" text-anchor="middle" fill="#1a2026" font-size="13">Phase 3 copies [12,16] unchanged &#8212; the output is [[1,2], [3,10], [12,16]].</text>
</svg>
