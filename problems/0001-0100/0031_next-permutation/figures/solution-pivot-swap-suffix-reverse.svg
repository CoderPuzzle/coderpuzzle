<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="392" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,2,3]; cells 72x44 at x = 250 + 80i; step rows y = 56, 164, 272 -->
  <text x="36" y="46" fill="#5c6b76" font-size="12.5" font-weight="600">1 · scan right to left for the pivot</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="250" y="56" width="72" height="44"/>
    <rect x="410" y="56" width="72" height="44"/>
  </g>
  <rect x="330" y="56" width="72" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="286" y="84">1</text><text x="366" y="84">2</text><text x="446" y="84">3</text>
  </g>
  <g font-size="12" fill="#4169E1">
    <text x="36" y="118" font-weight="600">pivot: 2 (2 &lt; 3)</text>
    <text x="36" y="136">successor: rightmost value &gt; 2</text>
  </g>
  <text x="36" y="154" fill="#5c6b76" font-size="12.5" font-weight="600">2 · swap pivot and successor</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="250" y="164" width="72" height="44"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="330" y="164" width="72" height="44"/><rect x="410" y="164" width="72" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="286" y="192">1</text><text x="366" y="192">3</text><text x="446" y="192">2</text>
  </g>
  <path d="M 366 104 C 366 132, 446 132, 446 156" fill="none" stroke="#4169E1" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M 446 104 C 446 132, 366 132, 366 156" fill="none" stroke="#4169E1" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="480" y="136" fill="#4169E1" font-size="12" font-weight="600">swap</text>
  <text x="36" y="262" fill="#5c6b76" font-size="12.5" font-weight="600">3 · reverse the suffix after the pivot</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="250" y="272" width="72" height="44"/><rect x="330" y="272" width="72" height="44"/>
    <rect x="410" y="272" width="72" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="286" y="300">1</text><text x="366" y="300">3</text><text x="446" y="300">2</text>
  </g>
  <path d="M 410 322 L 410 328 L 482 328 L 482 322" fill="none" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="446" y="346" text-anchor="middle" fill="#5c6b76" font-size="12">one element — no change</text>
  <text x="40" y="368" fill="#1a2026" font-size="13">Pivot 2 swaps with successor 3; the one-element suffix reverses to itself, so</text>
  <text x="40" y="386" fill="#1a2026" font-size="13">[1, 2, 3] becomes <tspan fill="#4169E1" font-weight="600">[1, 3, 2]</tspan> — the very next permutation.</text>
</svg>
