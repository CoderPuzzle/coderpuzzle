<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- obstacleGrid = [[0,0,0],[0,1,0],[0,0,0]]; cells 52x36 at (80,70) and (344,70);
       dp rows after each grid row: [1,1,1] [1,0,1] [1,1,2] -->
  <text x="158" y="50" text-anchor="middle" fill="#5c6b76" font-size="12.5">obstacleGrid</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="80" y="70" width="52" height="36"/><rect x="132" y="70" width="52" height="36"/><rect x="184" y="70" width="52" height="36"/>
    <rect x="80" y="106" width="52" height="36"/><rect x="184" y="106" width="52" height="36"/>
    <rect x="80" y="142" width="52" height="36"/><rect x="132" y="142" width="52" height="36"/><rect x="184" y="142" width="52" height="36"/>
    <rect x="132" y="106" width="52" height="36" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="106" y="93">0</text><text x="158" y="93">0</text><text x="210" y="93">0</text>
    <text x="106" y="129">0</text><text x="210" y="129">0</text>
    <text x="106" y="165">0</text><text x="158" y="165">0</text><text x="210" y="165">0</text>
    <text x="158" y="129" fill="#5c6b76">1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 252 124 H 334" marker-end="url(#arrow)"/>
  </g>
  <text x="292" y="108" text-anchor="middle" fill="#5c6b76" font-size="11.5">row by row</text>
  <text x="422" y="50" text-anchor="middle" fill="#5c6b76" font-size="12.5">ways to reach each cell</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="344" y="70" width="52" height="36"/><rect x="396" y="70" width="52" height="36"/><rect x="448" y="70" width="52" height="36"/>
    <rect x="344" y="106" width="52" height="36"/><rect x="448" y="106" width="52" height="36"/>
    <rect x="344" y="142" width="52" height="36"/><rect x="396" y="142" width="52" height="36"/><rect x="448" y="142" width="52" height="36"/>
    <rect x="396" y="106" width="52" height="36" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="370" y="93" fill="#1a2026">1</text><text x="422" y="93" fill="#1a2026">1</text><text x="474" y="93" fill="#1a2026">1</text>
    <text x="370" y="129" fill="#1a2026">1</text><text x="474" y="129" fill="#1a2026">1</text>
    <text x="370" y="165" fill="#1a2026">1</text><text x="422" y="165" fill="#1a2026">1</text>
    <text x="474" y="166" fill="#4169E1" font-size="15">2</text>
    <text x="422" y="129" fill="#9aa7b2">0</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 490 118 V 138" marker-end="url(#arrowB)"/>
    <path d="M 452 160 H 462" marker-end="url(#arrowB)"/>
  </g>
  <text x="422" y="198" text-anchor="middle" fill="#9aa7b2" font-size="11.5">the obstacle pins its cell to 0</text>
  <text x="320" y="234" text-anchor="middle" fill="#1a2026" font-size="13">Each cell adds its counts from the left and from above; the obstacle pins its cell to <tspan fill="#4169E1" font-weight="600">0</tspan>,</text>
  <text x="320" y="256" text-anchor="middle" fill="#1a2026" font-size="13">so the blocked middle passes nothing on and the bottom-right settles at <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
