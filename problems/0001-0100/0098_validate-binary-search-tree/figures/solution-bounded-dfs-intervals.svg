<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- root = [5,1,4,null,null,3,6]; every node carries the open interval it must sit in -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="320" y1="82" x2="200" y2="146"/>
    <line x1="320" y1="82" x2="440" y2="146"/>
    <line x1="440" y1="178" x2="360" y2="234"/>
    <line x1="440" y1="178" x2="520" y2="234"/>
  </g>
  <!-- validated nodes: white fill, dark ring; the failing node: accent ring -->
  <g stroke-width="1.6">
    <circle cx="320" cy="64" r="24" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="200" cy="164" r="24" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="440" cy="164" r="24" fill="#ffffff" stroke="#4169E1" stroke-width="2.4"/>
    <circle cx="360" cy="246" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-dasharray="4 3"/>
    <circle cx="520" cy="246" r="21" fill="#f0f3f7" stroke="#9aa7b2" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="320" y="70" fill="#1a2026">5</text>
    <text x="200" y="170" fill="#1a2026">1</text>
    <text x="440" y="170" fill="#4169E1">4</text>
    <text x="360" y="251" fill="#9aa7b2">3</text>
    <text x="520" y="251" fill="#9aa7b2">6</text>
  </g>
  <!-- the interval each node must land strictly inside -->
  <g text-anchor="middle" font-size="12.5">
    <text x="320" y="24" fill="#5c6b76">must sit in (−∞, +∞)</text>
    <text x="176" y="212" fill="#5c6b76">(−∞, 5) ✓</text>
    <text x="530" y="164" fill="#4169E1" font-weight="600">(5, +∞) ✗</text>
    <text x="330" y="288" fill="#9aa7b2">never reached</text>
    <text x="545" y="288" fill="#9aa7b2">never reached</text>
  </g>
  <!-- the inheritance rule, as a side note -->
  <g font-size="12.5" fill="#1a2026">
    <text x="40" y="60">each node lands strictly</text>
    <text x="40" y="78">inside its interval,</text>
    <text x="40" y="96">then tightens it for</text>
    <text x="40" y="114">its children:</text>
    <text x="40" y="140" fill="#5c6b76">left gets (lo, val)</text>
    <text x="40" y="158" fill="#5c6b76">right gets (val, hi)</text>
  </g>
  <path d="M 468 192 Q 498 202 514 212" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">Node 4 must exceed every ancestor it hangs under — but 4 &lt; 5 — so the</text>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">walk answers <tspan fill="#4169E1" font-weight="600">false</tspan> at 4, never reaching 3 or 6.</text>
</svg>
