<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- l1 = [2,4,3], l2 = [5,6,4]; digit cells 64x40, columns at x = 240 + 80i -->
  <text x="196" y="89" text-anchor="end" fill="#5c6b76" font-size="12.5">l1</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="240" y="64" width="64" height="40"/><rect x="320" y="64" width="64" height="40"/><rect x="400" y="64" width="64" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="272" y="89">2</text><text x="352" y="89">4</text><text x="432" y="89">3</text>
  </g>
  <text x="196" y="121" text-anchor="middle" fill="#5c6b76" font-size="16">+</text>
  <text x="196" y="145" text-anchor="end" fill="#5c6b76" font-size="12.5">l2</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="240" y="120" width="64" height="40"/><rect x="320" y="120" width="64" height="40"/><rect x="400" y="120" width="64" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="272" y="145">5</text><text x="352" y="145">6</text><text x="432" y="145">4</text>
  </g>
  <!-- carry out of the 4+6 column into the final column -->
  <path d="M 352 58 Q 390 34 426 54" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="390" y="28" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">carry 1</text>
  <line x1="226" y1="176" x2="478" y2="176" stroke="#1a2026" stroke-width="1.6"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="272" y="190">2 + 5</text><text x="352" y="190">4 + 6</text><text x="432" y="190">3 + 4 + 1</text>
  </g>
  <text x="196" y="225" text-anchor="end" fill="#5c6b76" font-size="12.5">result</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="240" y="200" width="64" height="40"/><rect x="320" y="200" width="64" height="40"/><rect x="400" y="200" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="272" y="225" fill="#1a2026">7</text><text x="352" y="225" fill="#1a2026">0</text><text x="432" y="225" fill="#4169E1">8</text>
  </g>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Every column keeps the ones digit of digit + digit + carry:</text>
  <text x="320" y="292" text-anchor="middle" fill="#1a2026" font-size="13">4 + 6 = 10 carries 1, so <tspan fill="#4169E1" font-weight="600">3 + 4 + 1 = 8</tspan> — 342 + 465 = 807 reads out <tspan fill="#4169E1" font-weight="600">[7, 0, 8]</tspan>.</text>
</svg>
