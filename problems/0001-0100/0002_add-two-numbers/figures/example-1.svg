<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g stroke="#42525e" fill="none" stroke-width="1.6">
    <!-- top list: 2 -> 4 -> 3 -->
    <rect x="40" y="28" width="46" height="34" rx="4"/>
    <rect x="126" y="28" width="46" height="34" rx="4"/>
    <rect x="212" y="28" width="46" height="34" rx="4"/>
    <line x1="86" y1="45" x2="122" y2="45" marker-end="url(#arrow)"/>
    <line x1="172" y1="45" x2="208" y2="45" marker-end="url(#arrow)"/>
    <line x1="258" y1="45" x2="300" y2="45" marker-end="url(#arrow)"/>
    <text x="63" y="50" text-anchor="middle" fill="#16232b" stroke="none" font-weight="600">2</text>
    <text x="149" y="50" text-anchor="middle" fill="#16232b" stroke="none" font-weight="600">4</text>
    <text x="235" y="50" text-anchor="middle" fill="#16232b" stroke="none" font-weight="600">3</text>
    <text x="322" y="50" fill="#5c6b76" stroke="none">None</text>
    <!-- bottom list: 5 -> 6 -> 4 -->
    <rect x="40" y="128" width="46" height="34" rx="4"/>
    <rect x="126" y="128" width="46" height="34" rx="4"/>
    <rect x="212" y="128" width="46" height="34" rx="4"/>
    <line x1="86" y1="145" x2="122" y2="145" marker-end="url(#arrow)"/>
    <line x1="172" y1="145" x2="208" y2="145" marker-end="url(#arrow)"/>
    <line x1="258" y1="145" x2="300" y2="145" marker-end="url(#arrow)"/>
    <text x="63" y="150" text-anchor="middle" fill="#16232b" stroke="none" font-weight="600">5</text>
    <text x="149" y="150" text-anchor="middle" fill="#16232b" stroke="none" font-weight="600">6</text>
    <text x="235" y="150" text-anchor="middle" fill="#16232b" stroke="none" font-weight="600">4</text>
    <text x="322" y="150" fill="#5c6b76" stroke="none">None</text>
    <!-- carries into the result -->
    <line x1="404" y1="45" x2="404" y2="86" stroke="#b57f30" stroke-dasharray="4 3"/>
    <line x1="404" y1="128" x2="404" y2="86" stroke="#b57f30" stroke-dasharray="4 3"/>
  </g>
  <g fill="#7a5a1e" font-size="12.5">
    <text x="416" y="90">(2) + (5) = 7</text>
  </g>
</svg>
