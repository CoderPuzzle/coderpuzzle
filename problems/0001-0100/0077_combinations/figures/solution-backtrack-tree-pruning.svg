<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowMute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- n = 4, k = 2; root = shared current buffer before any pick; depth-1 boxes = buffer after the first value (bound v <= n - remaining + 1 = 3); leaves = the six combinations in emit order -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="365" y="41" width="110" height="30" rx="6"/>
    <rect x="180" y="126" width="40" height="28" rx="6"/>
    <rect x="366" y="126" width="40" height="28" rx="6"/>
    <rect x="484" y="126" width="40" height="28" rx="6"/>
  </g>
  <rect x="570" y="126" width="40" height="28" rx="6" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="420" y="61" font-size="13">current = [ ]</text>
    <text x="200" y="145">[1]</text><text x="386" y="145">[2]</text><text x="504" y="145">[3]</text>
  </g>
  <text x="590" y="145" text-anchor="middle" fill="#9aa7b2" font-weight="600">4</text>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 420 71 L 200 126" marker-end="url(#arrow)"/>
    <path d="M 420 71 L 386 126" marker-end="url(#arrow)"/>
    <path d="M 420 71 L 504 126" marker-end="url(#arrow)"/>
  </g>
  <path d="M 420 71 L 590 126" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowMute)"/>
  <g text-anchor="middle" fill="#5c6b76">
    <text x="590" y="176" font-size="11.5" font-weight="600">dead branch: 4 &gt; 3</text>
    <text x="590" y="192" font-size="10.5" fill="#9aa7b2">(n - remaining + 1 = 3)</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="104" y="222" width="56" height="34"/><rect x="172" y="222" width="56" height="34"/>
    <rect x="240" y="222" width="56" height="34"/><rect x="324" y="222" width="56" height="34"/>
    <rect x="392" y="222" width="56" height="34"/><rect x="476" y="222" width="56" height="34"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 200 154 L 132 222" marker-end="url(#arrow)"/>
    <path d="M 200 154 L 200 222" marker-end="url(#arrow)"/>
    <path d="M 200 154 L 268 222" marker-end="url(#arrow)"/>
    <path d="M 386 154 L 352 222" marker-end="url(#arrow)"/>
    <path d="M 386 154 L 420 222" marker-end="url(#arrow)"/>
    <path d="M 504 154 L 504 222" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="132" y="243">[1,2]</text><text x="200" y="243">[1,3]</text><text x="268" y="243">[1,4]</text>
    <text x="352" y="243">[2,3]</text><text x="420" y="243">[2,4]</text><text x="504" y="243">[3,4]</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12">
    <text x="132" y="276">1</text><text x="200" y="276">2</text><text x="268" y="276">3</text>
    <text x="352" y="276">4</text><text x="420" y="276">5</text><text x="504" y="276">6</text>
  </g>
  <text x="330" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Starts 1, 2, 3 in ascending order emit all <tspan fill="#4169E1" font-weight="600">C(4,2) = 6</tspan> combinations in lexicographic order;</text>
  <text x="330" y="326" text-anchor="middle" fill="#1a2026" font-size="13">start 4 is pruned (4 &gt; n - remaining + 1 = 3), so every leaf copies a full k = 2 buffer.</text>
</svg>
