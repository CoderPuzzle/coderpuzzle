<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[1,3,1],[1,5,1],[4,2,1]]; cells 64x40 at (90,70) and (380,70) -->
  <text x="186" y="54" text-anchor="middle" fill="#5c6b76" font-size="12.5">grid</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="90" y="70" width="64" height="40"/><rect x="154" y="70" width="64" height="40"/><rect x="218" y="70" width="64" height="40"/>
    <rect x="90" y="110" width="64" height="40"/><rect x="154" y="110" width="64" height="40"/><rect x="218" y="110" width="64" height="40"/>
    <rect x="90" y="150" width="64" height="40"/><rect x="154" y="150" width="64" height="40"/><rect x="218" y="150" width="64" height="40"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="122" y="95">1</text><text x="186" y="95">3</text><text x="250" y="95">1</text>
    <text x="122" y="135">1</text><text x="186" y="135">5</text><text x="250" y="135">1</text>
    <text x="122" y="175">4</text><text x="186" y="175">2</text><text x="250" y="175">1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 288 130 H 356" marker-end="url(#arrow)"/>
  </g>
  <text x="312" y="112" text-anchor="middle" fill="#5c6b76" font-size="12">one row-major</text>
  <text x="312" y="152" text-anchor="middle" fill="#5c6b76" font-size="12">scan, overwrite</text>
  <!-- dp table: original value small gray in the corner, running sum bold -->
  <text x="476" y="54" text-anchor="middle" fill="#5c6b76" font-size="12.5">cheapest sum reaching each cell</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="380" y="70" width="64" height="40"/><rect x="444" y="70" width="64" height="40"/><rect x="508" y="70" width="64" height="40"/>
    <rect x="380" y="110" width="64" height="40"/><rect x="444" y="110" width="64" height="40"/><rect x="508" y="110" width="64" height="40"/>
    <rect x="380" y="150" width="64" height="40"/><rect x="444" y="150" width="64" height="40"/><rect x="508" y="150" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="418" y="96" fill="#1a2026">1</text><text x="480" y="96" fill="#1a2026">4</text><text x="544" y="96" fill="#1a2026">5</text>
    <text x="418" y="136" fill="#1a2026">2</text><text x="480" y="136" fill="#4169E1">7</text><text x="544" y="136" fill="#1a2026">6</text>
    <text x="418" y="176" fill="#1a2026">6</text><text x="480" y="176" fill="#1a2026">8</text><text x="544" y="176" fill="#4169E1">7</text>
  </g>
  <g text-anchor="start" fill="#5c6b76" font-size="10.5">
    <text x="384" y="82">1</text><text x="448" y="82">3</text><text x="512" y="82">1</text>
    <text x="384" y="122">1</text><text x="448" y="122">5</text><text x="512" y="122">1</text>
    <text x="384" y="162">4</text><text x="448" y="162">2</text><text x="512" y="162">1</text>
  </g>
  <!-- cheapest path 1-3-1-1-1 through cells (0,0)(0,1)(0,2)(1,2)(2,2) -->
  <polyline points="412,90 540,90 540,170" fill="none" stroke="#4169E1" stroke-width="3"/>
  <g fill="#4169E1">
    <circle cx="412" cy="90" r="3.5"/><circle cx="540" cy="90" r="3.5"/><circle cx="540" cy="170" r="3.5"/>
  </g>
  <!-- the one nontrivial transition into the centre cell -->
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 480 112 V 122" marker-end="url(#arrow)"/>
    <path d="M 446 138 H 438" marker-end="url(#arrow)"/>
  </g>
  <text x="320" y="216" text-anchor="middle" fill="#1a2026" font-size="13">dp[i][j] = cell + min(dp above, dp left) — the centre: 5 + min(<tspan fill="#4169E1" font-weight="600">4</tspan>, <tspan fill="#4169E1" font-weight="600">2</tspan>) = <tspan fill="#4169E1" font-weight="600">7</tspan></text>
  <text x="320" y="248" text-anchor="middle" fill="#1a2026" font-size="13">After the scan the bottom-right corner holds the answer:</text>
  <text x="320" y="270" text-anchor="middle" fill="#1a2026" font-size="13">the accented path 1 → 3 → 1 → 1 → 1 sums to <tspan fill="#4169E1" font-weight="600">7</tspan>.</text>
</svg>
