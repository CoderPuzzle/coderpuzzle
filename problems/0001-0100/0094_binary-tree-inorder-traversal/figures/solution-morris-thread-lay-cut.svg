<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="410" fill="#ffffff"/>
  <!-- root = [1,null,2,3] (1 -> right 2, 2 -> left 3); left panel = thread 3.right = 2 laid,
       right panel = the same thread cut after carrying the walk home; tinted = already emitted -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <text x="190" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">Lay — pred(2) = 3: thread 3 → 2, descend</text>
  <text x="530" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">Cut — thread home: emit 2, cut, go right</text>
  <!-- left panel -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="185" y1="94" x2="266" y2="156"/>
    <line x1="266" y1="184" x2="214" y2="246"/>
  </g>
  <path d="M 222 264 Q 302 262 288 198" fill="none" stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <circle cx="170" cy="80" r="20" fill="#dbe4fb" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="280" cy="170" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="200" cy="260" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="170" y="85">1</text>
    <text x="280" y="175">2</text>
    <text x="200" y="265">3</text>
  </g>
  <text x="144" y="84" text-anchor="end" fill="#9aa7b2" font-size="11">1 read, step right</text>
  <line x1="152" y1="268" x2="174" y2="262" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="146" y="272" text-anchor="end" fill="#4169E1" font-size="12" font-weight="600">cur</text>
  <text x="250" y="302" text-anchor="middle" fill="#4169E1" font-size="12">3.right = 2</text>
  <text x="190" y="336" text-anchor="middle" fill="#5c6b76" font-size="12.5">emitted so far: 1</text>
  <!-- right panel -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="545" y1="94" x2="626" y2="156"/>
    <line x1="626" y1="184" x2="574" y2="246"/>
  </g>
  <path d="M 582 264 Q 662 262 648 198" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="5 4"/>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="631" y1="240" x2="643" y2="252"/>
    <line x1="643" y1="240" x2="631" y2="252"/>
  </g>
  <circle cx="530" cy="80" r="20" fill="#dbe4fb" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="640" cy="170" r="20" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="560" cy="260" r="20" fill="#dbe4fb" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="530" y="85">1</text>
    <text x="640" y="175">2</text>
    <text x="560" y="265">3</text>
  </g>
  <line x1="640" y1="130" x2="640" y2="144" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="122" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">cur</text>
  <text x="637" y="272" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">cut</text>
  <text x="560" y="302" text-anchor="middle" fill="#9aa7b2" font-size="11">3 read, thread walked home</text>
  <text x="530" y="336" text-anchor="middle" fill="#5c6b76" font-size="12.5">emitted: 1, 3, <tspan fill="#4169E1" font-weight="600">2</tspan> — done</text>
  <!-- caption -->
  <text x="340" y="372" text-anchor="middle" fill="#1a2026" font-size="13">Predecessor 3's free right pointer is threaded back to 2, walked home, and cut again —</text>
  <text x="340" y="392" text-anchor="middle" fill="#1a2026" font-size="13">the tree itself carries the return path, so inorder <tspan fill="#4169E1" font-weight="600">[1, 3, 2]</tspan> never touches a stack.</text>
</svg>
