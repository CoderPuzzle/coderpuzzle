<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [1,3,null,null,2]; inorder 3,2,1; strip cells 50x44 at x=80/135/190 (before) and 410/465/520 (after); tree circles r=19 -->
  <text x="160" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">before the swap</text>
  <text x="490" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">after the swap</text>
  <!-- before tree: [1,3,null,null,2] -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="160" y1="62" x2="118" y2="114"/>
    <line x1="118" y1="114" x2="160" y2="166"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="160" cy="62" r="19"/><circle cx="118" cy="114" r="19"/><circle cx="160" cy="166" r="19"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">
    <text x="160" y="67">1</text><text x="118" y="119">3</text><text x="160" y="171">2</text>
  </g>
  <!-- before inorder strip: 3 2 1, endpoints misplaced -->
  <text x="48" y="254" text-anchor="middle" fill="#5c6b76" font-size="11.5">inorder</text>
  <rect x="80" y="228" width="50" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.2"/>
  <rect x="135" y="228" width="50" height="44" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <rect x="190" y="228" width="50" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.2"/>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="105" y="255" fill="#4169E1">3</text>
    <text x="160" y="255" fill="#1a2026">2</text>
    <text x="215" y="255" fill="#4169E1">1</text>
  </g>
  <!-- swap arc between the two misplaced cells -->
  <path d="M 105 222 Q 160 190 215 222" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- descent marks under the gaps -->
  <g stroke="#4169E1" stroke-width="1.5">
    <line x1="132.5" y1="276" x2="132.5" y2="282"/>
    <line x1="187.5" y1="276" x2="187.5" y2="282"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="132" y="296">3 &gt; 2</text>
    <text x="187" y="296">2 &gt; 1</text>
  </g>
  <!-- middle arrow -->
  <text x="300" y="136" text-anchor="middle" fill="#1a2026" font-size="12.5">swap the two values</text>
  <line x1="255" y1="150" x2="345" y2="150" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- after tree: [3,1,null,null,2] -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="490" y1="62" x2="448" y2="114"/>
    <line x1="448" y1="114" x2="490" y2="166"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="490" cy="62" r="19"/><circle cx="448" cy="114" r="19"/><circle cx="490" cy="166" r="19"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">
    <text x="490" y="67">3</text><text x="448" y="119">1</text><text x="490" y="171">2</text>
  </g>
  <!-- after inorder strip: 1 2 3 -->
  <text x="378" y="254" text-anchor="middle" fill="#5c6b76" font-size="11.5">inorder</text>
  <rect x="410" y="228" width="50" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.2"/>
  <rect x="465" y="228" width="50" height="44" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <rect x="520" y="228" width="50" height="44" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.2"/>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="435" y="255" fill="#4169E1">1</text>
    <text x="490" y="255" fill="#1a2026">2</text>
    <text x="545" y="255" fill="#4169E1">3</text>
  </g>
  <text x="490" y="296" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">1 &lt; 2 &lt; 3 — a valid BST</text>
  <text x="330" y="320" text-anchor="middle" fill="#1a2026" font-size="13">The broken inorder 3, 2, 1 descends twice — 3 &gt; 2 and 2 &gt; 1 — so the endpoints</text>
  <text x="330" y="338" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">3 and 1</tspan> trade values, repairing [1, 3, null, null, 2] into [3, 1, null, null, 2].</text>
</svg>
