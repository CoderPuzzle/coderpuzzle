<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a0"/>
    </marker>
  </defs>
  <text x="20" y="22" fill="#1a2026" font-weight="600">Backtracking tree for n = 3 - guards "open &lt; n" and "close &lt; open" prune every invalid prefix</text>
  <!-- edges (levels drawn 48px apart; leaves at y=356) -->
  <g stroke="#8a94a0" stroke-width="1.3" fill="none">
    <line x1="340" y1="46" x2="340" y2="74" marker-end="url(#arr)"/>
    <line x1="336" y1="94" x2="216" y2="122" marker-end="url(#arr)"/>
    <line x1="344" y1="94" x2="531" y2="122" marker-end="url(#arr)"/>
    <line x1="212" y1="142" x2="84" y2="170" marker-end="url(#arr)"/>
    <line x1="220" y1="142" x2="271" y2="170" marker-end="url(#arr)"/>
    <line x1="531" y1="142" x2="531" y2="170" marker-end="url(#arr)"/>
    <line x1="84" y1="190" x2="84" y2="218" marker-end="url(#arr)"/>
    <line x1="271" y1="190" x2="214" y2="218" marker-end="url(#arr)"/>
    <line x1="279" y1="190" x2="334" y2="218" marker-end="url(#arr)"/>
    <line x1="527" y1="190" x2="474" y2="218" marker-end="url(#arr)"/>
    <line x1="535" y1="190" x2="597" y2="218" marker-end="url(#arr)"/>
    <line x1="84" y1="238" x2="84" y2="266" marker-end="url(#arr)"/>
    <line x1="214" y1="238" x2="214" y2="266" marker-end="url(#arr)"/>
    <line x1="340" y1="238" x2="340" y2="266" marker-end="url(#arr)"/>
    <line x1="474" y1="238" x2="474" y2="266" marker-end="url(#arr)"/>
    <line x1="600" y1="238" x2="600" y2="266" marker-end="url(#arr)"/>
    <line x1="84" y1="286" x2="84" y2="344" marker-end="url(#arr)"/>
    <line x1="214" y1="286" x2="214" y2="344" marker-end="url(#arr)"/>
    <line x1="340" y1="286" x2="340" y2="344" marker-end="url(#arr)"/>
    <line x1="474" y1="286" x2="474" y2="344" marker-end="url(#arr)"/>
    <line x1="600" y1="286" x2="600" y2="344" marker-end="url(#arr)"/>
  </g>
  <!-- guard labels -->
  <text x="352" y="118" fill="#4169E1" font-size="11">open &lt; 3</text>
  <text x="296" y="212" fill="#4169E1" font-size="11">close &lt; open</text>
  <!-- internal nodes -->
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="340" y="42">start</text>
    <text x="340" y="90">(</text>
    <text x="212" y="138">((</text>
    <text x="535" y="138">()</text>
    <text x="84" y="186">(((</text>
    <text x="275" y="186">(()</text>
    <text x="531" y="186">()(</text>
    <text x="84" y="234">((()</text>
    <text x="214" y="234">(()(</text>
    <text x="340" y="234">(())</text>
    <text x="474" y="234">()((</text>
    <text x="600" y="234">()()</text>
    <text x="84" y="282">((())</text>
    <text x="214" y="282">(()()</text>
    <text x="340" y="282">(())(</text>
    <text x="474" y="282">()(()</text>
    <text x="600" y="282">()()(</text>
  </g>
  <!-- leaves -->
  <g stroke="#4169E1" stroke-width="1.6" fill="#e9eefb">
    <rect x="24" y="356" width="120" height="26" rx="13"/>
    <rect x="154" y="356" width="120" height="26" rx="13"/>
    <rect x="280" y="356" width="120" height="26" rx="13"/>
    <rect x="414" y="356" width="120" height="26" rx="13"/>
    <rect x="540" y="356" width="120" height="26" rx="13"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="84" y="374">((()))</text>
    <text x="214" y="374">(()())</text>
    <text x="340" y="374">(())()</text>
    <text x="474" y="374">()(())</text>
    <text x="600" y="374">()()()</text>
  </g>
  <text x="20" y="394" fill="#5b6470" font-size="11.5">Every internal node is the prefix of a valid string, so the whole tree of 22 prefixes leads to the C(3) = 5 leaves.</text>
</svg>
