<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="580" height="240" fill="#ffffff"/>
  <text x="20" y="24" fill="#1a2026" font-weight="600">nums = [-2,1,-3,4,-1,2,1,-5,4] - best subarray sum ending at each index (current)</text>
  <!-- nums row -->
  <text x="20" y="70" fill="#5b6470" font-size="11.5">nums</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="70" y="50" width="52" height="30"/><rect x="122" y="50" width="52" height="30"/><rect x="174" y="50" width="52" height="30"/><rect x="226" y="50" width="52" height="30"/><rect x="278" y="50" width="52" height="30"/><rect x="330" y="50" width="52" height="30"/><rect x="382" y="50" width="52" height="30"/><rect x="434" y="50" width="52" height="30"/><rect x="486" y="50" width="52" height="30"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="96" y="70">-2</text><text x="148" y="70">1</text><text x="200" y="70">-3</text><text x="252" y="70">4</text><text x="304" y="70">-1</text><text x="356" y="70">2</text><text x="408" y="70">1</text><text x="460" y="70">-5</text><text x="512" y="70">4</text>
  </g>
  <!-- current row -->
  <text x="20" y="130" fill="#5b6470" font-size="11.5">current</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="#e9eefb">
    <rect x="70" y="110" width="52" height="30"/><rect x="122" y="110" width="52" height="30"/><rect x="174" y="110" width="52" height="30"/><rect x="226" y="110" width="52" height="30"/><rect x="278" y="110" width="52" height="30"/><rect x="330" y="110" width="52" height="30"/><rect x="382" y="110" width="52" height="30"/><rect x="434" y="110" width="52" height="30"/><rect x="486" y="110" width="52" height="30"/>
  </g>
  <rect x="382" y="110" width="52" height="30" fill="none" stroke="#4169E1" stroke-width="2.6"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="96" y="130">-2</text><text x="148" y="130">1</text><text x="200" y="130">-2</text><text x="252" y="130">4</text><text x="304" y="130">3</text><text x="356" y="130">5</text><text x="408" y="130" fill="#4169E1">6</text><text x="460" y="130">1</text><text x="512" y="130">5</text>
  </g>
  <!-- restart separators -->
  <line x1="122" y1="44" x2="122" y2="146" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="226" y1="44" x2="226" y2="146" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="130" y="40" fill="#4169E1" font-size="10.5">restart: prefix sum -2 &lt; 0, dropped</text>
  <text x="234" y="40" fill="#4169E1" font-size="10.5">restart: prefix sum -2 &lt; 0, dropped</text>
  <!-- best bracket under cells 3..6 -->
  <path d="M 226 156 L 226 166 L 434 166 L 434 156" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <text x="330" y="186" fill="#4169E1" text-anchor="middle" font-size="11.5" font-weight="600">best = 6, the subarray [4, -1, 2, 1]</text>
  <text x="20" y="216" fill="#5b6470" font-size="11.5">Everywhere else current = previous current + value; a negative running sum can only drag down what follows, so it is replaced by a fresh start.</text>
  <text x="20" y="232" fill="#5b6470" font-size="11.5">The answer is the largest current ever seen, not the final one.</text>
</svg>
