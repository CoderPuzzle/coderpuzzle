<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="640" height="250" fill="#ffffff"/>
  <text x="20" y="26" fill="#1a2026" font-weight="600">nums = [4,5,6,7,0,1,2], target = 0 - each window halves after picking its sorted half</text>
  <!-- row 1: window [0..6], mid=3 -->
  <g>
    <text x="24" y="66" fill="#5b6470" font-size="11.5" font-weight="600">window [0..6]</text>
    <g stroke="#1a2026" stroke-width="1.4">
      <rect x="140" y="48" width="44" height="32" fill="#e9eefb"/><rect x="184" y="48" width="44" height="32" fill="#e9eefb"/><rect x="228" y="48" width="44" height="32" fill="#e9eefb"/><rect x="272" y="48" width="44" height="32" fill="#e9eefb"/><rect x="316" y="48" width="44" height="32" fill="#ffffff"/><rect x="360" y="48" width="44" height="32" fill="#ffffff"/><rect x="404" y="48" width="44" height="32" fill="#ffffff"/>
    </g>
    <rect x="272" y="48" width="44" height="32" fill="#4169E1" fill-opacity="0.85" stroke="#1a2026" stroke-width="1.4"/>
    <g fill="#1a2026" text-anchor="middle" font-weight="600">
      <text x="162" y="69">4</text><text x="206" y="69">5</text><text x="250" y="69">6</text><text x="294" y="69" fill="#ffffff">7</text><text x="338" y="69">0</text><text x="382" y="69">1</text><text x="426" y="69">2</text>
    </g>
    <text x="294" y="40" fill="#4169E1" font-size="11" text-anchor="middle" font-weight="600">mid = 3</text>
    <path d="M 142 92 L 315 92" stroke="#4169E1" stroke-width="1.4" fill="none"/>
    <path d="M 142 88 L 142 96 M 315 88 L 315 96" stroke="#4169E1" stroke-width="1.4"/>
    <text x="150" y="108" fill="#4169E1" font-size="11">left half sorted [4..7]</text>
    <text x="470" y="66" fill="#5b6470" font-size="11.5">0 not in [4, 7]</text>
    <text x="470" y="82" fill="#5b6470" font-size="11.5">-&gt; keep right half</text>
  </g>
  <!-- row 2: window [4..6], mid=5 -->
  <g>
    <text x="24" y="146" fill="#5b6470" font-size="11.5" font-weight="600">window [4..6]</text>
    <g stroke="#8a94a0" stroke-width="1">
      <rect x="140" y="128" width="44" height="32" fill="#f4f6f9"/><rect x="184" y="128" width="44" height="32" fill="#f4f6f9"/><rect x="228" y="128" width="44" height="32" fill="#f4f6f9"/><rect x="272" y="128" width="44" height="32" fill="#f4f6f9"/>
    </g>
    <g stroke="#1a2026" stroke-width="1.4">
      <rect x="316" y="128" width="44" height="32" fill="#e9eefb"/><rect x="360" y="128" width="44" height="32" fill="#e9eefb"/><rect x="404" y="128" width="44" height="32" fill="#e9eefb"/>
    </g>
    <rect x="360" y="128" width="44" height="32" fill="#4169E1" fill-opacity="0.85" stroke="#1a2026" stroke-width="1.4"/>
    <g text-anchor="middle" font-weight="600">
      <text x="162" y="149" fill="#8a94a0">4</text><text x="206" y="149" fill="#8a94a0">5</text><text x="250" y="149" fill="#8a94a0">6</text><text x="294" y="149" fill="#8a94a0">7</text><text x="338" y="149" fill="#1a2026">0</text><text x="382" y="149" fill="#ffffff">1</text><text x="426" y="149" fill="#1a2026">2</text>
    </g>
    <text x="382" y="120" fill="#4169E1" font-size="11" text-anchor="middle" font-weight="600">mid = 5</text>
    <path d="M 318 172 L 403 172" stroke="#4169E1" stroke-width="1.4" fill="none"/>
    <path d="M 318 168 L 318 176 M 403 168 L 403 176" stroke="#4169E1" stroke-width="1.4"/>
    <text x="318" y="188" fill="#4169E1" font-size="11">left half sorted [0..1]</text>
    <text x="470" y="146" fill="#5b6470" font-size="11.5">0 in [0, 1]</text>
    <text x="470" y="162" fill="#5b6470" font-size="11.5">-&gt; keep left half</text>
  </g>
  <!-- row 3: window [4..4] found -->
  <g>
    <text x="24" y="226" fill="#5b6470" font-size="11.5" font-weight="600">window [4..4]</text>
    <rect x="316" y="208" width="44" height="32" fill="#4169E1" fill-opacity="0.85" stroke="#1a2026" stroke-width="1.4"/>
    <text x="338" y="229" fill="#ffffff" text-anchor="middle" font-weight="600">0</text>
    <text x="338" y="200" fill="#4169E1" font-size="11" text-anchor="middle" font-weight="600">mid = 4</text>
    <text x="380" y="229" fill="#1a2026" font-size="12">nums[4] = 0 = target -&gt; return 4</text>
  </g>
</svg>
