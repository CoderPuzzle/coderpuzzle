<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- nums = [5,7,7,8,8,10], target = 8; cells 60x36 at x=140, y=70 -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="140" y="70" width="60" height="36"/><rect x="200" y="70" width="60" height="36"/><rect x="260" y="70" width="60" height="36"/>
    <rect x="440" y="70" width="60" height="36"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="2">
    <rect x="320" y="70" width="60" height="36"/><rect x="380" y="70" width="60" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="170" y="93">5</text><text x="230" y="93">7</text><text x="290" y="93">7</text>
    <text x="350" y="93" fill="#0b3eb0">8</text><text x="410" y="93" fill="#0b3eb0">8</text><text x="470" y="93">10</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="170" y="122">0</text><text x="230" y="122">1</text><text x="290" y="122">2</text>
    <text x="350" y="122">3</text><text x="410" y="122">4</text><text x="470" y="122">5</text>
  </g>
  <path d="M 320 62 V 56 H 440 V 62" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="380" y="48" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">the run of 8s — answer [3, 4]</text>
  <!-- bisection walkthroughs -->
  <g font-size="12.5" fill="#1a2026">
    <text x="52" y="164">first index ≥ 8:</text>
    <text x="180" y="164">[0,6) mid 3 — 8 ≥ 8, keep left</text>
    <text x="180" y="184">[0,3) mid 1 — 7 &lt; 8, keep right</text>
    <text x="180" y="204">[2,3) mid 2 — 7 &lt; 8, keep right → lands on <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="52" y="244">first index ≥ 9:</text>
    <text x="180" y="244">[0,6) mid 3 — 8 &lt; 9, keep right</text>
    <text x="180" y="264">[4,6) mid 5 — 10 ≥ 9, keep left</text>
    <text x="180" y="284">[4,5) mid 4 — 8 &lt; 9, keep right → lands on 5, minus one = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  </g>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">The run of targets is exactly [bound(8), bound(9)) — two bisections,</text>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">no scan, and the second bound doubles as the run's last index.</text>
</svg>
