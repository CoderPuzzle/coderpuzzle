<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- head = [1,4,3,2,5,2], x = 3; walk appends 1,2,2 to before and 4,3,5 to after; cells 46x44 (chains 42x58-wide dummies) -->
  <text x="60" y="32" fill="#5c6b76" font-size="12.5">head = [1,4,3,2,5,2], x = 3</text>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="109" y1="66" x2="120" y2="66" marker-end="url(#arrowg)"/>
    <line x1="177" y1="66" x2="188" y2="66" marker-end="url(#arrowg)"/>
    <line x1="245" y1="66" x2="256" y2="66" marker-end="url(#arrowg)"/>
    <line x1="313" y1="66" x2="324" y2="66" marker-end="url(#arrowg)"/>
    <line x1="381" y1="66" x2="392" y2="66" marker-end="url(#arrowg)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="60" y="44" width="46" height="44" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="128" y="44" width="46" height="44" fill="#ffffff"/>
    <rect x="196" y="44" width="46" height="44" fill="#ffffff"/>
    <rect x="264" y="44" width="46" height="44" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="332" y="44" width="46" height="44" fill="#ffffff"/>
    <rect x="400" y="44" width="46" height="44" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="83" y="71">1</text><text x="151" y="71">4</text><text x="219" y="71">3</text>
    <text x="287" y="71">2</text><text x="355" y="71">5</text><text x="423" y="71">2</text>
  </g>
  <g font-size="12" fill="#5c6b76">
    <line x1="486" y1="54" x2="510" y2="54" stroke="#dbe4fb" stroke-width="6"/>
    <text x="518" y="58">&lt; 3 → before</text>
    <rect x="487" y="71" width="22" height="10" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="518" y="80">≥ 3 → after</text>
  </g>
  <!-- before chain -->
  <text x="80" y="142" fill="#5c6b76" font-size="12">before (&lt; 3), walk order</text>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="141" y1="172" x2="150" y2="172" marker-end="url(#arrowg)"/>
    <line x1="203" y1="172" x2="212" y2="172" marker-end="url(#arrowg)"/>
    <line x1="265" y1="172" x2="274" y2="172" marker-end="url(#arrowg)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="80" y="150" width="58" height="44" fill="#ffffff"/>
    <rect x="158" y="150" width="42" height="44" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="220" y="150" width="42" height="44" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="282" y="150" width="42" height="44" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle">
    <text x="109" y="177" fill="#5c6b76" font-size="10.5">dummy</text>
    <text x="179" y="177" font-weight="600">1</text>
    <text x="241" y="177" font-weight="600">2</text>
    <text x="303" y="177" font-weight="600">2</text>
  </g>
  <!-- after chain -->
  <text x="80" y="226" fill="#5c6b76" font-size="12">after (≥ 3), walk order</text>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="141" y1="262" x2="150" y2="262" marker-end="url(#arrowg)"/>
    <line x1="203" y1="262" x2="212" y2="262" marker-end="url(#arrowg)"/>
    <line x1="265" y1="262" x2="274" y2="262" marker-end="url(#arrowg)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="80" y="240" width="58" height="44" fill="#ffffff"/>
    <rect x="158" y="240" width="42" height="44" fill="#ffffff"/>
    <rect x="220" y="240" width="42" height="44" fill="#ffffff"/>
    <rect x="282" y="240" width="42" height="44" fill="#ffffff"/>
  </g>
  <g text-anchor="middle">
    <text x="109" y="267" fill="#5c6b76" font-size="10.5">dummy</text>
    <text x="179" y="267" font-weight="600">4</text>
    <text x="241" y="267" font-weight="600">3</text>
    <text x="303" y="267" font-weight="600">5</text>
  </g>
  <!-- splice joins the chains; the cut keeps 5 from pointing back into the low chain -->
  <path d="M 303 197 Q 270 230 192 236" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="228" fill="#4169E1" font-size="11.5" font-weight="600">splice: before_tail.next = after_head.next</text>
  <line x1="328" y1="262" x2="346" y2="262" stroke="#9aa7b2" stroke-width="1.5"/>
  <g stroke="#9aa7b2" stroke-width="1.5">
    <line x1="344" y1="257" x2="354" y2="267"/>
    <line x1="344" y1="267" x2="354" y2="257"/>
  </g>
  <text x="362" y="266" fill="#5c6b76" font-size="11.5">after_tail.next = null</text>
  <g font-size="13" fill="#1a2026">
    <text x="40" y="316">Walk order builds before = [1,2,2] and after = [4,3,5]; the splice joins them and</text>
    <text x="40" y="334">after_tail.next = null cuts 5's old link to 2 — result <tspan fill="#4169E1" font-weight="600">[1,2,2,4,3,5]</tspan>, no cycle.</text>
  </g>
</svg>
