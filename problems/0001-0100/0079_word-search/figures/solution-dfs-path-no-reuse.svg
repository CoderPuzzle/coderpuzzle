<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="296" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- board = [[A,B,C,E],[S,F,C,S],[A,D,E,E]], word = "ABCCED"; walk (0,0)-(0,1)-(0,2)-(1,2)-(2,2)-(2,1): each visited cell is overwritten with # (old letter small gray, step number accent); cells 64x48 at (60,70) -->
  <text x="188" y="56" text-anchor="middle" fill="#5c6b76" font-size="12.5">board</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="70" width="64" height="48" fill="#dbe4fb"/><rect x="124" y="70" width="64" height="48" fill="#dbe4fb"/>
    <rect x="188" y="70" width="64" height="48" fill="#dbe4fb"/><rect x="252" y="70" width="64" height="48" fill="#ffffff"/>
    <rect x="60" y="118" width="64" height="48" fill="#ffffff"/><rect x="124" y="118" width="64" height="48" fill="#ffffff"/>
    <rect x="188" y="118" width="64" height="48" fill="#dbe4fb"/><rect x="252" y="118" width="64" height="48" fill="#ffffff"/>
    <rect x="60" y="166" width="64" height="48" fill="#ffffff"/><rect x="124" y="166" width="64" height="48" fill="#dbe4fb"/>
    <rect x="188" y="166" width="64" height="48" fill="#dbe4fb"/><rect x="252" y="166" width="64" height="48" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="14">
    <text x="284" y="99">E</text>
    <text x="92" y="147">S</text><text x="156" y="147">F</text><text x="284" y="147">S</text>
    <text x="92" y="195">A</text><text x="284" y="195">E</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="15" font-weight="700">
    <text x="92" y="99">#</text><text x="156" y="99">#</text><text x="220" y="99">#</text>
    <text x="220" y="147">#</text><text x="220" y="195">#</text><text x="156" y="195">#</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="66" y="83">A</text><text x="130" y="83">B</text><text x="194" y="83">C</text>
    <text x="194" y="131">C</text><text x="194" y="179">E</text><text x="130" y="179">D</text>
  </g>
  <g text-anchor="end" fill="#4169E1" font-size="10.5" font-weight="700">
    <text x="118" y="113">1</text><text x="182" y="113">2</text><text x="246" y="113">3</text>
    <text x="246" y="161">4</text><text x="182" y="209">6</text><text x="246" y="209">5</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 116 94 L 132 94" marker-end="url(#arrowB)"/>
    <path d="M 180 94 L 196 94" marker-end="url(#arrowB)"/>
    <path d="M 220 110 L 220 126" marker-end="url(#arrowB)"/>
    <path d="M 220 158 L 220 174" marker-end="url(#arrowB)"/>
    <path d="M 196 190 L 180 190" marker-end="url(#arrowB)"/>
  </g>
  <text x="336" y="90" fill="#1a2026" font-size="13" font-weight="600">word = "ABCCED"</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="336" y="102" width="32" height="28"/><rect x="374" y="102" width="32" height="28"/>
    <rect x="412" y="102" width="32" height="28"/><rect x="450" y="102" width="32" height="28"/>
    <rect x="488" y="102" width="32" height="28"/><rect x="526" y="102" width="32" height="28"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">
    <text x="352" y="121">A</text><text x="390" y="121">B</text><text x="428" y="121">C</text>
    <text x="466" y="121">C</text><text x="504" y="121">E</text><text x="542" y="121">D</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="352" y="146">1</text><text x="390" y="146">2</text><text x="428" y="146">3</text>
    <text x="466" y="146">4</text><text x="504" y="146">5</text><text x="542" y="146">6</text>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="336" y="172">Leaving the second C, the cell above</text>
    <text x="336" y="190">is already '#' — visited cells cannot</text>
    <text x="336" y="208">be reused — so the walk drops to</text>
    <text x="336" y="226">E, then D. Found: <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
  </g>
  <text x="320" y="258" text-anchor="middle" fill="#1a2026" font-size="13">Each level overwrites its cell with '#' and restores it on retreat; the path</text>
  <text x="320" y="278" text-anchor="middle" fill="#1a2026" font-size="13">A-B-C-C-E-D <tspan fill="#4169E1" font-weight="600">never folds back</tspan>, so "ABCCED" is found from the top-left A.</text>
</svg>
