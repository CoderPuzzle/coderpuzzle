<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 3: one row per root 1/2/3; circles r=13 (shapes) and r=14 (root); null pill = an empty range's single shape; counts 2 + 1 + 2 = 5 -->
  <text x="330" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">build(1, 3): every root pairs every left shape with every right shape</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="52" y="52">root</text>
    <text x="165" y="52">left choices</text>
    <text x="392" y="52">right choices</text>
    <text x="585" y="52">trees</text>
  </g>
  <!-- row: root = 1 -->
  <circle cx="52" cy="118" r="14" fill="#4169E1"/>
  <text x="52" y="123" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">1</text>
  <text x="165" y="96" text-anchor="middle" fill="#5c6b76" font-size="12">build(1, 0)</text>
  <rect x="133" y="106" width="64" height="26" rx="7" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="165" y="123" text-anchor="middle" fill="#5c6b76" font-size="12.5">null</text>
  <text x="262" y="124" text-anchor="middle" fill="#5c6b76" font-size="16">×</text>
  <text x="392" y="96" text-anchor="middle" fill="#5c6b76" font-size="12">build(2, 3)</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="352" y1="118" x2="369" y2="152"/>
    <line x1="430" y1="118" x2="413" y2="152"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="352" cy="118" r="13"/><circle cx="369" cy="152" r="13"/>
    <circle cx="430" cy="118" r="13"/><circle cx="413" cy="152" r="13"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="352" y="122">2</text><text x="369" y="156">3</text>
    <text x="430" y="122">3</text><text x="413" y="156">2</text>
  </g>
  <text x="585" y="124" text-anchor="middle" font-size="13.5">= <tspan fill="#4169E1" font-weight="600">2</tspan> trees</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="585" y="146">[1, null, 2, null, 3]</text>
    <text x="585" y="161">[1, null, 3, 2]</text>
  </g>
  <!-- row: root = 2 -->
  <circle cx="52" cy="226" r="14" fill="#4169E1"/>
  <text x="52" y="231" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">2</text>
  <text x="165" y="204" text-anchor="middle" fill="#5c6b76" font-size="12">build(1, 1)</text>
  <circle cx="165" cy="232" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="165" y="236" text-anchor="middle" fill="#1a2026" font-size="12.5">1</text>
  <text x="262" y="232" text-anchor="middle" fill="#5c6b76" font-size="16">×</text>
  <text x="392" y="204" text-anchor="middle" fill="#5c6b76" font-size="12">build(3, 3)</text>
  <circle cx="392" cy="232" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="392" y="236" text-anchor="middle" fill="#1a2026" font-size="12.5">3</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="585" y1="222" x2="563" y2="254"/>
    <line x1="585" y1="222" x2="607" y2="254"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="585" cy="222" r="13"/><circle cx="563" cy="254" r="13"/><circle cx="607" cy="254" r="13"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="585" y="226">2</text><text x="563" y="258">1</text><text x="607" y="258">3</text>
  </g>
  <text x="585" y="290" text-anchor="middle" fill="#5c6b76" font-size="11">[2, 1, 3]</text>
  <!-- row: root = 3 -->
  <circle cx="52" cy="342" r="14" fill="#4169E1"/>
  <text x="52" y="347" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">3</text>
  <text x="165" y="312" text-anchor="middle" fill="#5c6b76" font-size="12">build(1, 2)</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="130" y1="334" x2="147" y2="368"/>
    <line x1="200" y1="334" x2="183" y2="368"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="130" cy="334" r="13"/><circle cx="147" cy="368" r="13"/>
    <circle cx="200" cy="334" r="13"/><circle cx="183" cy="368" r="13"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="130" y="338">1</text><text x="147" y="372">2</text>
    <text x="200" y="338">2</text><text x="183" y="372">1</text>
  </g>
  <text x="262" y="348" text-anchor="middle" fill="#5c6b76" font-size="16">×</text>
  <text x="392" y="312" text-anchor="middle" fill="#5c6b76" font-size="12">build(4, 3)</text>
  <rect x="360" y="324" width="64" height="26" rx="7" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="392" y="341" text-anchor="middle" fill="#5c6b76" font-size="12.5">null</text>
  <text x="585" y="348" text-anchor="middle" font-size="13.5">= <tspan fill="#4169E1" font-weight="600">2</tspan> trees</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="585" y="370">[3, 1, null, null, 2]</text>
    <text x="585" y="385">[3, 2, null, 1]</text>
  </g>
  <text x="330" y="404" text-anchor="middle" fill="#1a2026" font-size="13">Every root contributes (left shapes) × (right shapes): 2 + 1 + 2 = <tspan fill="#4169E1" font-weight="600">5</tspan> BSTs —</text>
  <text x="330" y="422" text-anchor="middle" fill="#1a2026" font-size="13">exactly Example 1's five outputs, in order; an empty range yields the null shape.</text>
</svg>
