<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="364" fill="#ffffff"/>
  <!-- nums = [1,2,3]; rows are masks 0..7; bit cells b2 b1 b0 gate elements 3, 2, 1; the subset for mask m lands at output index m; tinted rows = mask 011 then 100 -->
  <text x="36" y="44" fill="#1a2026" font-size="13" font-weight="600">nums = [1,2,3]</text>
  <g fill="#5c6b76" font-size="12.5">
    <text x="204" y="44" text-anchor="middle">mask</text>
    <text x="296" y="44">subset</text>
    <text x="436" y="44" text-anchor="middle">index</text>
  </g>
  <g fill="#9aa7b2" font-size="10.5" text-anchor="middle">
    <text x="156" y="58">3</text><text x="204" y="58">2</text><text x="252" y="58">1</text>
  </g>
  <!-- tinted full-row bands for masks 3 and 4 -->
  <rect x="100" y="153" width="372" height="28" fill="#dbe4fb"/>
  <rect x="100" y="183" width="372" height="28" fill="#dbe4fb"/>
  <!-- row k: band y = 63+30k, bit cells 44x22 at x=134/182/230, y = 66+30k -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="134" y="66" width="44" height="22"/><rect x="182" y="66" width="44" height="22"/><rect x="230" y="66" width="44" height="22"/>
    <rect x="134" y="96" width="44" height="22"/><rect x="182" y="96" width="44" height="22"/><rect x="230" y="96" width="44" height="22"/>
    <rect x="134" y="126" width="44" height="22"/><rect x="182" y="126" width="44" height="22"/><rect x="230" y="126" width="44" height="22"/>
    <rect x="134" y="156" width="44" height="22"/><rect x="182" y="156" width="44" height="22"/><rect x="230" y="156" width="44" height="22"/>
    <rect x="134" y="186" width="44" height="22"/><rect x="182" y="186" width="44" height="22"/><rect x="230" y="186" width="44" height="22"/>
    <rect x="134" y="216" width="44" height="22"/><rect x="182" y="216" width="44" height="22"/><rect x="230" y="216" width="44" height="22"/>
    <rect x="134" y="246" width="44" height="22"/><rect x="182" y="246" width="44" height="22"/><rect x="230" y="246" width="44" height="22"/>
    <rect x="134" y="276" width="44" height="22"/><rect x="182" y="276" width="44" height="22"/><rect x="230" y="276" width="44" height="22"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="156" y="82">0</text><text x="204" y="82">0</text><text x="252" y="82">0</text>
    <text x="156" y="112">0</text><text x="204" y="112">0</text><text x="252" y="112">1</text>
    <text x="156" y="142">0</text><text x="204" y="142">1</text><text x="252" y="142">0</text>
    <text x="156" y="172">0</text><text x="204" y="172">1</text><text x="252" y="172">1</text>
    <text x="156" y="202">1</text><text x="204" y="202">0</text><text x="252" y="202">0</text>
    <text x="156" y="232">1</text><text x="204" y="232">0</text><text x="252" y="232">1</text>
    <text x="156" y="262">1</text><text x="204" y="262">1</text><text x="252" y="262">0</text>
    <text x="156" y="292">1</text><text x="204" y="292">1</text><text x="252" y="292">1</text>
  </g>
  <g text-anchor="end" font-size="12.5" fill="#5c6b76">
    <text x="120" y="82">0</text><text x="120" y="112">1</text><text x="120" y="142">2</text><text x="120" y="172">3</text>
    <text x="120" y="202">4</text><text x="120" y="232">5</text><text x="120" y="262">6</text><text x="120" y="292">7</text>
  </g>
  <text x="120" y="172" text-anchor="end" font-size="12.5" fill="#4169E1" font-weight="700">3</text>
  <text x="120" y="202" text-anchor="end" font-size="12.5" fill="#4169E1" font-weight="700">4</text>
  <g font-size="13" fill="#1a2026">
    <text x="296" y="82">[]</text><text x="296" y="112">[1]</text><text x="296" y="142">[2]</text><text x="296" y="172">[1,2]</text>
    <text x="296" y="202">[3]</text><text x="296" y="232">[1,3]</text><text x="296" y="262">[2,3]</text><text x="296" y="292">[1,2,3]</text>
  </g>
  <text x="296" y="172" font-size="13" fill="#4169E1" font-weight="700">[1,2]</text>
  <text x="296" y="202" font-size="13" fill="#4169E1" font-weight="700">[3]</text>
  <g text-anchor="middle" font-size="13" fill="#5c6b76">
    <text x="436" y="82">0</text><text x="436" y="112">1</text><text x="436" y="142">2</text><text x="436" y="172">3</text>
    <text x="436" y="202">4</text><text x="436" y="232">5</text><text x="436" y="262">6</text><text x="436" y="292">7</text>
  </g>
  <text x="436" y="172" text-anchor="middle" font-size="13" fill="#4169E1" font-weight="700">3</text>
  <text x="436" y="202" text-anchor="middle" font-size="13" fill="#4169E1" font-weight="700">4</text>
  <text x="280" y="326" text-anchor="middle" fill="#1a2026" font-size="13">Counting masks 000 to 111 emits the example's order: mask <tspan fill="#4169E1" font-weight="600">011</tspan> picks [1,2]</text>
  <text x="280" y="346" text-anchor="middle" fill="#1a2026" font-size="13">before mask <tspan fill="#4169E1" font-weight="600">100</tspan> picks [3] — each subset lands at output index = its own mask.</text>
</svg>
