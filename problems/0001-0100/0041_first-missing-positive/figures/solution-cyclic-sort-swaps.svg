<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="560" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <text x="20" y="26" fill="#1a2026" font-weight="600">nums = [3,4,-1,1] - value v swaps into its home slot v-1 until every slot holds its own value</text>
  <!-- home labels -->
  <g fill="#8a94a0" font-size="10.5" text-anchor="middle">
    <text x="150" y="310">home: 1</text><text x="220" y="310">home: 2</text><text x="290" y="310">home: 3</text><text x="360" y="310">home: 4</text>
  </g>
  <g fill="#8a94a0" font-size="10.5" text-anchor="middle">
    <text x="150" y="56">0</text><text x="220" y="56">1</text><text x="290" y="56">2</text><text x="360" y="56">3</text>
  </g>
  <!-- row 0 -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="120" y="64" width="60" height="32"/><rect x="190" y="64" width="60" height="32"/><rect x="260" y="64" width="60" height="32"/><rect x="330" y="64" width="60" height="32"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="150" y="85">3</text><text x="220" y="85">4</text><text x="290" y="85">-1</text><text x="360" y="85">1</text>
  </g>
  <text x="410" y="85" fill="#5b6470" font-size="11.5">start: i = 0</text>
  <!-- arrow 3 -> idx2 -->
  <path d="M 150 100 C 150 130, 290 130, 290 106" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="192" y="128" fill="#4169E1" font-size="11">3 -&gt; home index 2</text>
  <!-- row 1 -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="120" y="140" width="60" height="32"/><rect x="190" y="140" width="60" height="32"/><rect x="260" y="140" width="60" height="32" fill="#e9eefb"/><rect x="330" y="140" width="60" height="32"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="150" y="161">-1</text><text x="220" y="161">4</text><text x="290" y="161">3</text><text x="360" y="161">1</text>
  </g>
  <text x="410" y="161" fill="#5b6470" font-size="11.5">-1 out of range - skip; 4 swaps</text>
  <!-- arrow 4 -> idx3 -->
  <path d="M 220 176 C 220 206, 360 206, 360 182" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="242" y="204" fill="#4169E1" font-size="11">4 -&gt; home index 3</text>
  <!-- row 2 -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="120" y="216" width="60" height="32"/><rect x="190" y="216" width="60" height="32"/><rect x="260" y="216" width="60" height="32"/><rect x="330" y="216" width="60" height="32" fill="#e9eefb"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="150" y="237">-1</text><text x="220" y="237">1</text><text x="290" y="237">3</text><text x="360" y="237">4</text>
  </g>
  <!-- arrow 1 -> idx0 -->
  <path d="M 205 216 C 190 200, 155 200, 152 212" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="40" y="205" fill="#4169E1" font-size="11">1 -&gt; home 0</text>
  <!-- row 3 -->
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="120" y="262" width="60" height="32" fill="#e9eefb"/><rect x="190" y="262" width="60" height="32"/><rect x="260" y="262" width="60" height="32" fill="#e9eefb"/><rect x="330" y="262" width="60" height="32" fill="#e9eefb"/>
  </g>
  <rect x="190" y="262" width="60" height="32" fill="none" stroke="#4169E1" stroke-width="2.4"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="150" y="283">1</text><text x="220" y="283">-1</text><text x="290" y="283">3</text><text x="360" y="283">4</text>
  </g>
  <text x="410" y="283" fill="#1a2026" font-size="11.5">index 1 holds -1, not 2</text>
  <text x="410" y="299" fill="#4169E1" font-size="11.5" font-weight="600">-&gt; answer = 2</text>
</svg>
