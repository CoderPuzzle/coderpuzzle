<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- sorted nums = [-4,-1,-1,0,1,2]; cells 84x46 at (68,84); hit state i=1, left=3, right=4; i-skip arc hops index 2 -->
  <text x="68" y="48" fill="#5c6b76" font-size="12.5">sorted nums</text>
  <g text-anchor="middle" font-size="12.5">
    <text x="194" y="48" fill="#4169E1" font-weight="600">i = 1</text>
    <text x="362" y="48" fill="#1a2026">left = 3</text>
    <text x="446" y="48" fill="#1a2026">right = 4</text>
  </g>
  <path d="M 194 54 L 194 78" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <path d="M 362 54 L 362 78" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 446 54 L 446 78" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="68" y="84" width="84" height="46"/>
    <rect x="236" y="84" width="84" height="46"/>
    <rect x="488" y="84" width="84" height="46"/>
  </g>
  <g stroke="#1a2026" stroke-width="1.4" fill="#dbe4fb">
    <rect x="152" y="84" width="84" height="46"/>
    <rect x="320" y="84" width="84" height="46"/>
    <rect x="404" y="84" width="84" height="46"/>
  </g>
  <g text-anchor="middle">
    <text x="110" y="113" fill="#1a2026" font-size="15">-4</text>
    <text x="194" y="113" fill="#4169E1" font-size="15" font-weight="600">-1</text>
    <text x="278" y="113" fill="#1a2026" font-size="15">-1</text>
    <text x="362" y="113" fill="#4169E1" font-size="15" font-weight="600">0</text>
    <text x="446" y="113" fill="#4169E1" font-size="15" font-weight="600">1</text>
    <text x="530" y="113" fill="#1a2026" font-size="15">2</text>
  </g>
  <g fill="#5c6b76" font-size="10.5">
    <text x="75" y="98">0</text><text x="159" y="98">1</text><text x="243" y="98">2</text>
    <text x="327" y="98">3</text><text x="411" y="98">4</text><text x="495" y="98">5</text>
  </g>
  <text x="320" y="162" text-anchor="middle" fill="#1a2026" font-size="13">nums[1] + nums[3] + nums[4] = -1 + 0 + 1 = 0 → record <tspan fill="#4169E1" font-weight="600">[-1, 0, 1]</tspan></text>
  <path d="M 278 180 Q 320 210 362 180" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="320" y="228" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">i skips the duplicate -1</text>
  <text x="320" y="258" text-anchor="middle" fill="#1a2026" font-size="13">Anchor -1 first closed <tspan fill="#4169E1" font-weight="600">[-1, -1, 2]</tspan> at left 2, right 5, then the accented [-1, 0, 1];</text>
  <text x="320" y="280" text-anchor="middle" fill="#1a2026" font-size="13">when i steps onto the second -1 the skip arc jumps it, so no triplet repeats.</text>
</svg>
