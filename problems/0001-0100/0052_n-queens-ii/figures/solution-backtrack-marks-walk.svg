<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- solutions [1,3,0,2] and [2,0,3,1]; cells 40px at (64,76) and (432,76); gray cells pruned by the marks; badges = placement order -->
  <text x="144" y="60" text-anchor="middle" fill="#5c6b76" font-size="12.5">first branch: row 0 &#8594; col 1</text>
  <text x="512" y="60" text-anchor="middle" fill="#5c6b76" font-size="12.5">mirror branch: row 0 &#8594; col 2</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="64" y="76" width="40" height="40"/><rect x="104" y="76" width="40" height="40"/><rect x="144" y="76" width="40" height="40"/><rect x="184" y="76" width="40" height="40"/>
    <rect x="64" y="116" width="40" height="40"/><rect x="104" y="116" width="40" height="40"/><rect x="144" y="116" width="40" height="40"/><rect x="184" y="116" width="40" height="40"/>
    <rect x="64" y="156" width="40" height="40"/><rect x="104" y="156" width="40" height="40"/><rect x="144" y="156" width="40" height="40"/><rect x="184" y="156" width="40" height="40"/>
    <rect x="64" y="196" width="40" height="40"/><rect x="104" y="196" width="40" height="40"/><rect x="144" y="196" width="40" height="40"/><rect x="184" y="196" width="40" height="40"/>
  </g>
  <g fill="#f0f3f7">
    <rect x="64" y="116" width="40" height="40"/><rect x="104" y="116" width="40" height="40"/><rect x="144" y="116" width="40" height="40"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="432" y="76" width="40" height="40"/><rect x="472" y="76" width="40" height="40"/><rect x="512" y="76" width="40" height="40"/><rect x="552" y="76" width="40" height="40"/>
    <rect x="432" y="116" width="40" height="40"/><rect x="472" y="116" width="40" height="40"/><rect x="512" y="116" width="40" height="40"/><rect x="552" y="116" width="40" height="40"/>
    <rect x="432" y="156" width="40" height="40"/><rect x="472" y="156" width="40" height="40"/><rect x="512" y="156" width="40" height="40"/><rect x="552" y="156" width="40" height="40"/>
    <rect x="432" y="196" width="40" height="40"/><rect x="472" y="196" width="40" height="40"/><rect x="512" y="196" width="40" height="40"/><rect x="552" y="196" width="40" height="40"/>
  </g>
  <g fill="#f0f3f7">
    <rect x="472" y="116" width="40" height="40"/><rect x="512" y="116" width="40" height="40"/><rect x="552" y="116" width="40" height="40"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="16">
    <text x="124" y="107">Q</text><text x="204" y="147">Q</text><text x="84" y="187">Q</text><text x="164" y="227">Q</text>
    <text x="532" y="107">Q</text><text x="452" y="147">Q</text><text x="572" y="187">Q</text><text x="492" y="227">Q</text>
  </g>
  <g fill="#9aa7b2" font-size="10" text-anchor="middle">
    <text x="84" y="145">r+c</text><text x="124" y="145">col</text><text x="164" y="145">r&#8722;c</text>
    <text x="492" y="145">col</text><text x="532" y="145">col</text><text x="572" y="145">r&#8722;c</text>
  </g>
  <g>
    <circle cx="111" cy="109" r="7" fill="#4169E1"/><text x="111" y="112.5" text-anchor="middle" fill="#ffffff" font-size="9.5">1</text>
    <circle cx="191" cy="149" r="7" fill="#4169E1"/><text x="191" y="152.5" text-anchor="middle" fill="#ffffff" font-size="9.5">2</text>
    <circle cx="71" cy="189" r="7" fill="#4169E1"/><text x="71" y="192.5" text-anchor="middle" fill="#ffffff" font-size="9.5">3</text>
    <circle cx="151" cy="229" r="7" fill="#4169E1"/><text x="151" y="232.5" text-anchor="middle" fill="#ffffff" font-size="9.5">4</text>
    <circle cx="519" cy="109" r="7" fill="#4169E1"/><text x="519" y="112.5" text-anchor="middle" fill="#ffffff" font-size="9.5">1</text>
    <circle cx="439" cy="149" r="7" fill="#4169E1"/><text x="439" y="152.5" text-anchor="middle" fill="#ffffff" font-size="9.5">2</text>
    <circle cx="559" cy="189" r="7" fill="#4169E1"/><text x="559" y="192.5" text-anchor="middle" fill="#ffffff" font-size="9.5">3</text>
    <circle cx="479" cy="229" r="7" fill="#4169E1"/><text x="479" y="232.5" text-anchor="middle" fill="#ffffff" font-size="9.5">4</text>
  </g>
  <!-- marks held when the first branch reaches row 4 -->
  <text x="328" y="100" text-anchor="middle" fill="#5c6b76" font-size="12.5">marks when row 4 is reached</text>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="328" y="126"><tspan fill="#5c6b76">cols </tspan>{1, 3, 0, 2}</text>
    <text x="328" y="150"><tspan fill="#5c6b76">r&#8722;c </tspan>{&#8722;1, &#8722;2, 2, 1}</text>
    <text x="328" y="174"><tspan fill="#5c6b76">r+c </tspan>{1, 4, 2, 5}</text>
  </g>
  <text x="144" y="258" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">count 1</text>
  <text x="512" y="258" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">count 2</text>
  <text x="326" y="246" text-anchor="middle" fill="#5c6b76" font-size="11.5">mirror branch</text>
  <path d="M 196 254 H 448" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Each queen marks its column, r&#8722;c, r+c &#8212; attacked squares are pruned at once.</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">The dead first try (col 0) is undone; each branch shown completes at <tspan fill="#4169E1" font-weight="600">row 4 = n</tspan>.</text>
</svg>
