<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 212" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- highlight: rectangle of height 5 spanning the bars of heights 5 and 6 -->
  <rect x="168" y="60" width="106" height="110" fill="#e5ebfa" stroke="#4169E1" stroke-width="2"/>
  <!-- bars: heights = [2,1,5,6,2,3] -->
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <rect x="48" y="126" width="46" height="44"/>
    <rect x="108" y="148" width="46" height="22"/>
    <rect x="168" y="60" width="46" height="110"/>
    <rect x="228" y="38" width="46" height="132"/>
    <rect x="288" y="126" width="46" height="44"/>
    <rect x="348" y="104" width="46" height="66"/>
  </g>
  <line x1="40" y1="170" x2="410" y2="170" stroke="#1a2026" stroke-width="1.6"/>
  <g fill="#5c6b76" text-anchor="middle" font-size="13">
    <text x="71" y="190">2</text>
    <text x="131" y="190">1</text>
    <text x="191" y="190">5</text>
    <text x="251" y="190">6</text>
    <text x="311" y="190">2</text>
    <text x="371" y="190">3</text>
  </g>
  <text x="221" y="46" text-anchor="middle" fill="#1a2026" font-weight="600">area = 5 x 2 = 10</text>
</svg>
