<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 212" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- highlight: the full bar of height 4 -->
  <rect x="150" y="82" width="46" height="88" fill="#e5ebfa" stroke="#4169E1" stroke-width="2"/>
  <!-- bars: heights = [2,4] -->
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <rect x="70" y="126" width="46" height="44"/>
    <rect x="150" y="82" width="46" height="88"/>
  </g>
  <line x1="56" y1="170" x2="230" y2="170" stroke="#1a2026" stroke-width="1.6"/>
  <g fill="#5c6b76" text-anchor="middle" font-size="13">
    <text x="93" y="190">2</text>
    <text x="173" y="190">4</text>
  </g>
  <text x="173" y="66" text-anchor="middle" fill="#1a2026" font-weight="600">area = 4</text>
</svg>
