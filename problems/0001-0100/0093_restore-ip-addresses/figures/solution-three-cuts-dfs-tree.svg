  <!-- legend and caption -->
  <text x="20" y="596" fill="#5c6b76" font-size="11.5">✗ = leading zero, or a remainder that cannot feed the segments still missing (1-3 digits each)</text>
  <text x="340" y="622" text-anchor="middle" fill="#1a2026" font-size="13">Five leaves in walk order — 1.0.10.23, 1.0.102.3, 10.1.0.23, 10.10.2.3, 101.0.2.3 —</text>
  <text x="340" y="642" text-anchor="middle" fill="#1a2026" font-size="13">are already the statement's lexicographic answer; shortest-first visiting is what sorts them.</text>
