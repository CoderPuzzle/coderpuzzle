<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="396" fill="#ffffff"/>
  <!-- example 2 tree, signalSpeed = 3; nodes r=16 at 0(90,170) 6(240,90) 5(390,90)
       3(240,250) 2(390,200) 1(390,250) 4(390,300); edges [0,6,3] [6,5,3] [0,3,1]
       [3,2,7] [3,1,6] [3,4,2]; accent nodes = distance from 0 divisible by 3 -->
  <!-- branch enclosures -->
  <rect x="212" y="56" width="226" height="86" rx="10" fill="none" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="212" y="170" width="226" height="176" rx="10" fill="none" stroke="#5c6b76" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="438" y="50" text-anchor="end" fill="#4169E1" font-weight="600" font-size="12.5">cnt 2</text>
  <text x="438" y="164" text-anchor="end" fill="#5c6b76" font-weight="600" font-size="12.5">cnt 1</text>
  <!-- tree edges -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="102" y1="159" x2="228" y2="101"/>
    <line x1="256" y1="90" x2="374" y2="90"/>
    <line x1="102" y1="181" x2="228" y2="239"/>
    <line x1="252" y1="238" x2="378" y2="212"/>
    <line x1="256" y1="250" x2="374" y2="250"/>
    <line x1="252" y1="262" x2="378" y2="288"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="152" y="124">3</text>
    <text x="315" y="78">3</text>
    <text x="152" y="222">1</text>
    <text x="308" y="214">7</text>
    <text x="315" y="268">6</text>
    <text x="308" y="292">2</text>
  </g>
  <!-- servers -->
  <g stroke-width="2">
    <circle cx="90" cy="170" r="16" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="240" cy="90" r="16" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="390" cy="90" r="16" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="240" cy="250" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="390" cy="200" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="390" cy="250" r="16" fill="#ffffff" stroke="#42525e"/>
    <circle cx="390" cy="300" r="16" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="90" y="175">0</text>
    <text x="240" y="95">6</text>
    <text x="390" y="95">5</text>
    <text x="240" y="255">3</text>
    <text x="390" y="205">2</text>
    <text x="390" y="255">1</text>
    <text x="390" y="305">4</text>
  </g>
  <text x="90" y="208" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">cut at 0</text>
  <g text-anchor="middle" font-size="11.5">
    <text x="240" y="122" fill="#4169E1">d=3</text>
    <text x="390" y="122" fill="#4169E1">d=6</text>
    <text x="240" y="282" fill="#9aa7b2">d=1</text>
    <text x="390" y="232" fill="#9aa7b2">d=8</text>
    <text x="390" y="282" fill="#9aa7b2">d=7</text>
    <text x="390" y="332" fill="#4169E1">d=3</text>
  </g>
  <!-- tally panel -->
  <text x="470" y="96" fill="#5c6b76" font-size="11.5">pairing through server 0</text>
  <g font-size="12.5" fill="#1a2026">
    <text x="470" y="124">via 6: d = 3, 6 → <tspan fill="#4169E1" font-weight="600">cnt 2</tspan></text>
    <text x="470" y="148">via 3: d = 1, 8, 7, 3 → <tspan fill="#4169E1" font-weight="600">cnt 1</tspan></text>
    <text x="470" y="176">pairs = 2 × 1 = 2</text>
    <text x="470" y="200" fill="#4169E1" font-weight="600">(4, 5) and (4, 6)</text>
    <text x="470" y="224" fill="#5c6b76" font-size="11.5">(5, 6): same branch, not counted</text>
  </g>
  <text x="340" y="368" text-anchor="middle" fill="#1a2026" font-size="13">Cut at 0, the branches via 6 and via 3 hold 2 and 1 servers at distance ≡ 0 (mod 3);</text>
  <text x="340" y="386" text-anchor="middle" fill="#1a2026" font-size="13">cross-branch pairs are 2 × 1 = <tspan fill="#4169E1" font-weight="600">2</tspan>, so count[0] = 2: (4, 5) and (4, 6).</text>
</svg>
