<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="372" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- example 1 pair: rect 0 [1,1]-[3,3], rect 1 [2,2]-[4,4]; 70 px per unit,
       plane px = 80 + 70(x-1), py = 292 - 70(y-1); clamped overlap [2,2]-[3,3] = white square -->
  <g stroke="#42525e" stroke-width="2" fill="none">
    <rect x="150" y="82" width="140" height="140"/>
  </g>
  <rect x="80" y="152" width="140" height="140" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <!-- clamped 1x1 intersection = largest square -->
  <rect x="150" y="152" width="70" height="70" fill="#ffffff" stroke="#1a2026" stroke-width="2.5"/>
  <text x="185" y="192" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">1 × 1</text>
  <text x="115" y="270" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">rect 0</text>
  <text x="115" y="287" text-anchor="middle" fill="#5c6b76" font-size="11">[1,1]–[3,3]</text>
  <text x="255" y="112" text-anchor="middle" fill="#42525e" font-weight="600" font-size="12.5">rect 1</text>
  <text x="255" y="129" text-anchor="middle" fill="#5c6b76" font-size="11">[2,2]–[4,4]</text>
  <!-- axis ticks -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="80" y="308">1</text><text x="150" y="308">2</text><text x="220" y="308">3</text><text x="290" y="308">4</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="58" y="296">1</text><text x="58" y="226">2</text><text x="58" y="156">3</text><text x="58" y="86">4</text>
  </g>
  <path d="M 222 187 H 352" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- clamp arithmetic panel -->
  <text x="368" y="100" fill="#5c6b76" font-size="11.5">clamp the pair on each axis</text>
  <g font-size="12.5" fill="#1a2026">
    <text x="368" y="126">left = max(1, 2) = 2</text>
    <text x="368" y="150">right = min(3, 4) = 3</text>
    <text x="368" y="174">bottom = max(1, 2) = 2</text>
    <text x="368" y="198">top = min(3, 4) = 3</text>
    <text x="368" y="230">w = 3 − 2 = 1,  h = 3 − 2 = 1</text>
    <text x="368" y="258" fill="#4169E1">side = min(w, h) = 1</text>
    <text x="368" y="282" fill="#4169E1" font-weight="600">area = 1 × 1 = 1</text>
  </g>
  <text x="300" y="344" text-anchor="middle" fill="#1a2026" font-size="13">Rects 0 [1,1]–[3,3] and 1 [2,2]–[4,4] clamp to the 1 × 1 overlap [2,2]–[3,3];</text>
  <text x="300" y="362" text-anchor="middle" fill="#1a2026" font-size="13">the square takes side min(w, h) = <tspan fill="#4169E1" font-weight="600">1</tspan> from a corner, so the pair contributes area <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
