<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="308" fill="#ffffff"/>
  <!-- nums = [8,4,2,30,15]; popcounts 1,1,1,4,4; cells 96x56 at x = 40 + 104i, y 70 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="190" y="48">segment: equal popcount, freely permutable</text>
    <text x="453" y="48">next popcount segment</text>
  </g>
  <rect x="40" y="70" width="96" height="56" fill="#dbe4fb" stroke="#42525e" stroke-width="1.5"/>
  <rect x="144" y="70" width="96" height="56" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="248" y="70" width="96" height="56" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="352" y="70" width="96" height="56" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="456" y="70" width="96" height="56" fill="#dbe4fb" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="88" y="96">8</text><text x="192" y="96">4</text><text x="296" y="96">2</text>
    <text x="400" y="96">30</text><text x="504" y="96">15</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="88" y="115">1000</text><text x="192" y="115">100</text><text x="296" y="115">10</text>
    <text x="400" y="115">11110</text><text x="504" y="115">1111</text>
  </g>
  <rect x="34" y="62" width="312" height="96" fill="none" stroke="#42525e" stroke-width="1.5"/>
  <rect x="348" y="62" width="210" height="96" fill="none" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="88" y="150">1 set bit</text><text x="192" y="150">1 set bit</text><text x="296" y="150">1 set bit</text>
    <text x="400" y="150">4 set bits</text><text x="504" y="150">4 set bits</text>
  </g>
  <!-- the one boundary: shaded cells 8 and 15 are the compared values -->
  <text x="296" y="210" text-anchor="middle" fill="#1a2026" font-size="13">boundary check: <tspan fill="#4169E1" font-weight="600">8</tspan> (max left) ≤ <tspan fill="#4169E1" font-weight="600">15</tspan> (min right)</text>
  <text x="296" y="268" text-anchor="middle" fill="#1a2026" font-size="13">Segments are sealed, so sorting reduces to the boundaries: the only</text>
  <text x="296" y="288" text-anchor="middle" fill="#1a2026" font-size="13">check is 8 ≤ 15, which passes — the array can be sorted (<tspan fill="#4169E1" font-weight="600">true</tspan>).</text>
</svg>
