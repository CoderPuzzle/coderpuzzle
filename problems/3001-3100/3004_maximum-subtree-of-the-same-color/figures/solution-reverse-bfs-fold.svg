<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="476" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- colors = [1,2,3,3,3]; edges 0-1, 0-2, 2-3, 2-4; BFS order [0,1,2,3,4] folded in reverse -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="200" y1="84" x2="110" y2="180"/>
    <line x1="200" y1="84" x2="310" y2="180"/>
    <line x1="310" y1="180" x2="250" y2="276"/>
    <line x1="310" y1="180" x2="370" y2="276"/>
  </g>
  <!-- accent = the monochrome subtree of color 3 rooted at node 2 -->
  <circle cx="200" cy="84" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="200" y="89" text-anchor="middle" font-weight="600">0</text>
  <circle cx="110" cy="180" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <text x="110" y="185" text-anchor="middle" font-weight="600">1</text>
  <circle cx="310" cy="180" r="20" fill="#4169E1"/>
  <text x="310" y="185" text-anchor="middle" fill="#ffffff" font-weight="600">2</text>
  <circle cx="250" cy="276" r="20" fill="#4169E1"/>
  <text x="250" y="281" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
  <circle cx="370" cy="276" r="20" fill="#4169E1"/>
  <text x="370" y="281" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="200" y="124">c=1</text>
    <text x="110" y="220">c=2</text>
    <text x="310" y="220">c=3</text>
    <text x="250" y="316">c=3</text>
    <text x="370" y="316">c=3</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="200" y="140" fill="#9aa7b2">mixed</text>
    <text x="110" y="236" fill="#5c6b76">mono 1</text>
    <text x="310" y="236" fill="#4169E1" font-weight="600">mono 3</text>
    <text x="250" y="332" fill="#5c6b76">mono 1</text>
    <text x="370" y="332" fill="#5c6b76">mono 1</text>
  </g>
  <!-- fold arrows along the tree edges -->
  <line x1="378" y1="258" x2="342" y2="206" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="386" y="236" font-size="11.5" fill="#4169E1">+1</text>
  <line x1="242" y1="258" x2="278" y2="206" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="236" text-anchor="end" font-size="11.5" fill="#4169E1">+1</text>
  <line x1="330" y1="186" x2="242" y2="102" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="336" y="140" font-size="11.5" fill="#5c6b76">3 ≠ 1: poisoned</text>
  <!-- BFS order strip, walked in reverse -->
  <text x="456" y="80" font-size="12.5" fill="#5c6b76">BFS order</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="456" y="92" width="32" height="30"/><rect x="494" y="92" width="32" height="30"/>
    <rect x="532" y="92" width="32" height="30"/><rect x="570" y="92" width="32" height="30"/>
    <rect x="608" y="92" width="32" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="472" y="112">0</text><text x="510" y="112">1</text><text x="548" y="112">2</text>
    <text x="586" y="112">3</text><text x="624" y="112">4</text>
  </g>
  <line x1="626" y1="146" x2="466" y2="146" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="548" y="168" text-anchor="middle" font-size="12.5" fill="#1a2026">reverse walk: 4, 3, 2, 1, 0</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="456" y="196">each node starts monochrome,</text>
    <text x="456" y="214">run = 1</text>
    <text x="456" y="246">a parent is folded only</text>
    <text x="456" y="264">after its children are final</text>
  </g>
  <g font-size="13" fill="#1a2026">
    <text x="40" y="360">Reverse fold: 4 → 2 — color 3 = 3, clean + clean: run[2] = 1 + 1 = 2</text>
    <text x="40" y="380">3 → 2 — color 3 = 3: run[2] = 2 + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="40" y="400">2 → 0 — subtree clean but color 3 ≠ 1: node 0 poisoned</text>
    <text x="40" y="420">1 → 0 — color 2 ≠ 1: node 0 stays poisoned</text>
  </g>
  <text x="340" y="446" text-anchor="middle" fill="#1a2026" font-size="13">Node 2 ends as the largest monochrome subtree, size <tspan fill="#4169E1" font-weight="600">3</tspan>;</text>
  <text x="340" y="464" text-anchor="middle" fill="#1a2026" font-size="13">node 0 is poisoned by the color mismatches, so the answer is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
