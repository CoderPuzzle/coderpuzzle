<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="286" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- pattern = [1,1,0,1], fail = [0,1,0,1]; stream prefix 1,0,1,1,0,1,... ;
       matched after each read: 1, 0 (fallback), 1, 2, 3, 4 -> return read-m = 6-4 = 2;
       columns centered at x=88+86i; bit and state cells w=48 h=36 -->
  <text x="100" y="28" text-anchor="end" fill="#5c6b76" font-size="12">pattern</text>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="110" y="8" width="40" height="30" fill="#dbe4fb"/><rect x="154" y="8" width="40" height="30" fill="#dbe4fb"/>
    <rect x="198" y="8" width="40" height="30" fill="#dbe4fb"/><rect x="242" y="8" width="40" height="30" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="130" y="28">1</text><text x="174" y="28">1</text><text x="218" y="28">0</text><text x="262" y="28">1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="130" y="52">fail 0</text><text x="174" y="52">fail 1</text><text x="218" y="52">fail 0</text><text x="262" y="52">fail 1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="88" y="80">index 0</text><text x="174" y="80">index 1</text><text x="260" y="80">index 2</text>
    <text x="346" y="80">index 3</text><text x="432" y="80">index 4</text><text x="518" y="80">index 5</text>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2" stroke-dasharray="6 4">
    <rect x="233" y="85" width="312" height="42" rx="6"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="64" y="88" width="48" height="36"/><rect x="150" y="88" width="48" height="36"/><rect x="236" y="88" width="48" height="36"/>
    <rect x="322" y="88" width="48" height="36"/><rect x="408" y="88" width="48" height="36"/><rect x="494" y="88" width="48" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="88" y="111">1</text><text x="174" y="111">0</text><text x="260" y="111">1</text>
    <text x="346" y="111">1</text><text x="432" y="111">0</text><text x="518" y="111">1</text>
  </g>
  <text x="566" y="111" fill="#9aa7b2" font-size="16">&#8230;</text>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 88 128 V 144" marker-end="url(#arrow)"/><path d="M 174 128 V 144" marker-end="url(#arrow)"/><path d="M 260 128 V 144" marker-end="url(#arrow)"/>
    <path d="M 346 128 V 144" marker-end="url(#arrow)"/><path d="M 432 128 V 144" marker-end="url(#arrow)"/><path d="M 518 128 V 144" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="64" y="148" width="48" height="36"/><rect x="150" y="148" width="48" height="36"/><rect x="236" y="148" width="48" height="36"/>
    <rect x="322" y="148" width="48" height="36"/><rect x="408" y="148" width="48" height="36"/><rect x="494" y="148" width="48" height="36" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="88" y="171">1</text><text x="174" y="171">0</text><text x="260" y="171">1</text>
    <text x="346" y="171">2</text><text x="432" y="171">3</text><text x="518" y="171" fill="#4169E1">4</text>
  </g>
  <text x="88" y="204" text-anchor="middle" fill="#9aa7b2" font-size="10.5">extend 0&#8594;1</text>
  <text x="174" y="204" text-anchor="middle" fill="#9aa7b2" font-size="10.5">p[1] = 1 &#8800; 0: fall</text>
  <text x="174" y="219" text-anchor="middle" fill="#9aa7b2" font-size="10.5">1&#8594;0 (retry fails)</text>
  <text x="260" y="204" text-anchor="middle" fill="#9aa7b2" font-size="10.5">extend 0&#8594;1</text>
  <text x="346" y="204" text-anchor="middle" fill="#9aa7b2" font-size="10.5">extend 1&#8594;2</text>
  <text x="432" y="204" text-anchor="middle" fill="#9aa7b2" font-size="10.5">extend 2&#8594;3</text>
  <text x="518" y="204" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">matched = 4 = m</text>
  <text x="518" y="219" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">return 5 &#8722; 4 + 1 = 2</text>
  <text x="320" y="252" text-anchor="middle" fill="#1a2026" font-size="13">Streaming KMP on [1, 0, 1, 1, 0, 1, &#8230;]: the matched length walks 1, 0, 1, 2, 3, 4 &#8212;</text>
  <text x="320" y="270" text-anchor="middle" fill="#1a2026" font-size="13">full at read 6, so the first occurrence of [1, 1, 0, 1] starts at index <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
