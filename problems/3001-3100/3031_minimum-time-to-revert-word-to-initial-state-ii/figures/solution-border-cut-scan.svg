<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- word = "abacaba" (n=7), k=3; fail = [0,0,1,0,1,2,3]; borders 3 ("aba") and 1 ("a");
       row A cells 52x44 at x=152+52i, y=62; mini strips 24x26 at x=110+26i, rows y=168 and y=206 -->
  <text x="334" y="22" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">border length 3: prefix "aba" = suffix "aba"</text>
  <path d="M 178 56 Q 334 12 490 56" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="152" y="62" width="52" height="44" fill="#dbe4fb"/><rect x="204" y="62" width="52" height="44" fill="#dbe4fb"/><rect x="256" y="62" width="52" height="44" fill="#dbe4fb"/>
    <rect x="308" y="62" width="52" height="44" fill="#ffffff"/>
    <rect x="360" y="62" width="52" height="44" fill="#dbe4fb"/><rect x="412" y="62" width="52" height="44" fill="#dbe4fb"/><rect x="464" y="62" width="52" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="178" y="89">a</text><text x="230" y="89">b</text><text x="282" y="89">a</text>
    <text x="334" y="89">c</text><text x="386" y="89">a</text><text x="438" y="89">b</text><text x="490" y="89">a</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="178" y="122">0</text><text x="230" y="122">1</text><text x="282" y="122">2</text>
    <text x="334" y="122">3</text><text x="386" y="122">4</text><text x="438" y="122">5</text><text x="490" y="122">6</text>
  </g>
  <text x="334" y="144" text-anchor="middle" fill="#5c6b76" font-size="12.5">fail chain: fail[6] = 3 &#8594; "aba", fail[2] = 1 &#8594; "a" &#8195; (border lengths: 3, 1)</text>
  <!-- candidate t = 1: cut 3, keep 4, not a border -->
  <text x="76" y="185" text-anchor="middle" font-weight="600">t = 1</text>
  <text x="147" y="158" text-anchor="middle" fill="#9aa7b2" font-size="10.5">remove</text>
  <text x="234" y="158" text-anchor="middle" fill="#9aa7b2" font-size="10.5">keep</text>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="110" y="168" width="24" height="26" fill="#f0f3f7"/><rect x="136" y="168" width="24" height="26" fill="#f0f3f7"/><rect x="162" y="168" width="24" height="26" fill="#f0f3f7"/>
    <rect x="188" y="168" width="24" height="26" fill="#ffffff"/><rect x="214" y="168" width="24" height="26" fill="#ffffff"/><rect x="240" y="168" width="24" height="26" fill="#ffffff"/><rect x="266" y="168" width="24" height="26" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="122" y="185" fill="#9aa7b2">a</text><text x="148" y="185" fill="#9aa7b2">b</text><text x="174" y="185" fill="#9aa7b2">a</text>
    <text x="200" y="185">c</text><text x="226" y="185">a</text><text x="252" y="185">b</text><text x="278" y="185">a</text>
  </g>
  <line x1="187" y1="164" x2="187" y2="198" stroke="#4169E1" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="310" y="185" fill="#5c6b76" font-size="12.5">cut 3, keep 4 &#8212; 4 is not a border</text>
  <g stroke="#9aa7b2" stroke-width="2">
    <line x1="556" y1="176" x2="568" y2="188"/><line x1="568" y1="176" x2="556" y2="188"/>
  </g>
  <!-- candidate t = 2: cut 6, keep 1, "a" = prefix "a" -->
  <text x="76" y="223" text-anchor="middle" font-weight="600">t = 2</text>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="110" y="206" width="24" height="26" fill="#f0f3f7"/><rect x="136" y="206" width="24" height="26" fill="#f0f3f7"/><rect x="162" y="206" width="24" height="26" fill="#f0f3f7"/>
    <rect x="188" y="206" width="24" height="26" fill="#f0f3f7"/><rect x="214" y="206" width="24" height="26" fill="#f0f3f7"/><rect x="240" y="206" width="24" height="26" fill="#f0f3f7"/>
    <rect x="266" y="206" width="24" height="26" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="122" y="223" fill="#9aa7b2">a</text><text x="148" y="223" fill="#9aa7b2">b</text><text x="174" y="223" fill="#9aa7b2">a</text>
    <text x="200" y="223" fill="#9aa7b2">c</text><text x="226" y="223" fill="#9aa7b2">a</text><text x="252" y="223" fill="#9aa7b2">b</text>
    <text x="278" y="223" fill="#1a2026" font-weight="600">a</text>
  </g>
  <line x1="265" y1="202" x2="265" y2="236" stroke="#4169E1" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="310" y="223" fill="#1a2026" font-size="12.5">cut 6, <tspan fill="#4169E1" font-weight="600">keep 1</tspan> &#8212; "a" = prefix "a"</text>
  <polyline points="554,222 560,228 571,213" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <text x="310" y="272" text-anchor="middle" fill="#1a2026" font-size="13">First t with n &#8722; t&#183;k a border length: t = 2 &#8212; the cut of 6 leaves suffix "a",</text>
  <text x="310" y="290" text-anchor="middle" fill="#1a2026" font-size="13">and word[:1] == word[6:] == "a", so the answer is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
