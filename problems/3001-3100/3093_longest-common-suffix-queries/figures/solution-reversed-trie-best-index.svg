<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- wordsContainer = ["abcd","bcd","xbcd"] inserted reversed: "dcba"(0) "dcb"(1) "dcbx"(2); spine x=430, circles r=22 at y=110+80i; leaves r=20 at y=448; numbers in circles = best index -->
  <!-- legend -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="24" y="40">insert reversed, best index stored at every node:</text>
    <text x="24" y="62">"abcd" → "dcba" · idx 0</text>
    <text x="24" y="84">"bcd" → "dcb" · idx 1</text>
    <text x="24" y="106">"xbcd" → "dcbx" · idx 2</text>
  </g>
  <!-- fork edges to leaves -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="414" y1="365" x2="344" y2="434"/>
    <line x1="446" y1="365" x2="516" y2="434"/>
  </g>
  <!-- query walk along the spine -->
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="430" y1="136" x2="430" y2="162" marker-end="url(#arrow)"/>
    <line x1="430" y1="216" x2="430" y2="242" marker-end="url(#arrow)"/>
    <line x1="430" y1="296" x2="430" y2="322" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13.5" fill="#5c6b76">
    <text x="448" y="154">d</text>
    <text x="448" y="234">c</text>
    <text x="448" y="314">b</text>
    <text x="368" y="398">a</text>
    <text x="492" y="398">x</text>
  </g>
  <text x="430" y="78" text-anchor="middle" font-size="12" fill="#5c6b76">root</text>
  <!-- suffix labels (left) -->
  <g font-size="12" fill="#5c6b76" text-anchor="end">
    <text x="396" y="115">empty suffix</text>
    <text x="396" y="195">suffix "d"</text>
    <text x="396" y="275">suffix "cd"</text>
    <text x="396" y="355">suffix "bcd"</text>
  </g>
  <g font-size="12" fill="#5c6b76">
    <text x="298" y="453" text-anchor="end">suffix "abcd"</text>
    <text x="560" y="453">suffix "xbcd"</text>
  </g>
  <!-- nodes; number = best index, accent = where the walk stops -->
  <circle cx="430" cy="110" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="430" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">1</text>
  <circle cx="430" cy="190" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="430" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">1</text>
  <circle cx="430" cy="270" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="430" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">1</text>
  <circle cx="430" cy="350" r="22" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="430" y="355" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">1</text>
  <circle cx="330" cy="448" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="330" y="453" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">0</text>
  <circle cx="530" cy="448" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="530" y="453" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">2</text>
  <!-- query callout -->
  <text x="470" y="346" font-size="12.5" font-weight="600" fill="#4169E1">query "bcd" walks "dcb"</text>
  <text x="470" y="364" font-size="12.5" fill="#1a2026">stops at depth 3 → best 1</text>
  <text x="340" y="496" text-anchor="middle" font-size="13" fill="#1a2026">Every node keeps the best index — shortest word first, then earliest — so walking "dcb",</text>
  <text x="340" y="516" text-anchor="middle" font-size="13" fill="#1a2026">"bcd" reversed, to depth 3 reads off <tspan fill="#4169E1" font-weight="600">index 1</tspan>; even "xyz" stops at the root and answers 1.</text>
</svg>
