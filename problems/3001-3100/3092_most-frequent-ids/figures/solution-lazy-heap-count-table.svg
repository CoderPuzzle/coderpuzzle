<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="396" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums=[2,3,2,1], freq=[3,2,-3,1]; count-table cols x=104+56c (w 56), step rows y=92+60i; heap chips 48x32 at x=296+58j, chip text = (count,id) -->
  <!-- count table grid -->
  <g stroke="#42525e" stroke-width="1" fill="none">
    <rect x="104" y="68" width="168" height="264"/>
    <line x1="160" y1="68" x2="160" y2="332"/>
    <line x1="216" y1="68" x2="216" y2="332"/>
    <line x1="104" y1="92" x2="272" y2="92"/>
    <line x1="104" y1="152" x2="272" y2="152"/>
    <line x1="104" y1="212" x2="272" y2="212"/>
    <line x1="104" y1="272" x2="272" y2="272"/>
  </g>
  <!-- per-step touched cell -->
  <g fill="#dbe4fb">
    <rect x="162" y="94" width="52" height="56"/>
    <rect x="218" y="154" width="52" height="56"/>
    <rect x="162" y="214" width="52" height="56"/>
    <rect x="106" y="274" width="52" height="56"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="132" y="85">id 1</text><text x="188" y="85">id 2</text><text x="244" y="85">id 3</text>
    <text x="430" y="85">max-heap (count, id), top first</text>
    <text x="612" y="85">ans</text>
  </g>
  <!-- step labels and deltas -->
  <g text-anchor="middle">
    <text x="56" y="119" font-size="13" font-weight="600" fill="#1a2026">step 0</text>
    <text x="56" y="137" font-size="11.5" fill="#5c6b76">+3 × id 2</text>
    <text x="56" y="179" font-size="13" font-weight="600" fill="#1a2026">step 1</text>
    <text x="56" y="197" font-size="11.5" fill="#5c6b76">+2 × id 3</text>
    <text x="56" y="239" font-size="13" font-weight="600" fill="#1a2026">step 2</text>
    <text x="56" y="257" font-size="11.5" fill="#5c6b76">-3 × id 2</text>
    <text x="56" y="299" font-size="13" font-weight="600" fill="#1a2026">step 3</text>
    <text x="56" y="317" font-size="11.5" fill="#5c6b76">+1 × id 1</text>
  </g>
  <!-- live counts (zeros muted) -->
  <g text-anchor="middle" font-size="14">
    <text x="132" y="130" fill="#9aa7b2">0</text><text x="188" y="130" font-weight="600" fill="#1a2026">3</text><text x="244" y="130" fill="#9aa7b2">0</text>
    <text x="132" y="190" fill="#9aa7b2">0</text><text x="188" y="190" font-weight="600" fill="#1a2026">3</text><text x="244" y="190" font-weight="600" fill="#1a2026">2</text>
    <text x="132" y="250" fill="#9aa7b2">0</text><text x="188" y="250" fill="#9aa7b2">0</text><text x="244" y="250" font-weight="600" fill="#1a2026">2</text>
    <text x="132" y="310" font-weight="600" fill="#1a2026">1</text><text x="188" y="310" fill="#9aa7b2">0</text><text x="244" y="310" font-weight="600" fill="#1a2026">2</text>
  </g>
  <!-- heap chips; leftmost alive chip is the top (accent) -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="296" y="114" width="48" height="32" rx="5" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="320" y="135" font-weight="600" fill="#1a2026">(3,2)</text>
    <rect x="296" y="174" width="48" height="32" rx="5" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="320" y="195" font-weight="600" fill="#1a2026">(3,2)</text>
    <rect x="354" y="174" width="48" height="32" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="378" y="195" fill="#1a2026">(2,3)</text>
    <rect x="296" y="234" width="48" height="32" rx="5" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="320" y="255" fill="#9aa7b2">(3,2)</text>
    <line x1="301" y1="250.5" x2="339" y2="250.5" stroke="#9aa7b2" stroke-width="1.4"/>
    <rect x="354" y="234" width="48" height="32" rx="5" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="378" y="255" font-weight="600" fill="#1a2026">(2,3)</text>
    <rect x="412" y="234" width="48" height="32" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="436" y="255" fill="#1a2026">(0,2)</text>
    <rect x="296" y="294" width="48" height="32" rx="5" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="320" y="315" font-weight="600" fill="#1a2026">(2,3)</text>
    <rect x="354" y="294" width="48" height="32" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="378" y="315" fill="#1a2026">(1,1)</text>
    <rect x="412" y="294" width="48" height="32" rx="5" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
    <text x="436" y="315" fill="#1a2026">(0,2)</text>
  </g>
  <!-- the stale top of step 2 is popped -->
  <path d="M 320 232 Q 338 210 358 218" fill="none" stroke="#9aa7b2" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="366" y="222" font-size="11.5" fill="#5c6b76">pop</text>
  <!-- answers -->
  <g text-anchor="middle" font-size="16" font-weight="700" fill="#4169E1">
    <text x="612" y="135">3</text><text x="612" y="195">3</text><text x="612" y="255">2</text><text x="612" y="315">2</text>
  </g>
  <text x="330" y="358" text-anchor="middle" font-size="13" fill="#1a2026">Step 2 pushes (0,2); the stale top (3,2) no longer matches the counts and is popped,</text>
  <text x="330" y="376" text-anchor="middle" font-size="13" fill="#1a2026">so the true maximum (2,3) surfaces — ans = <tspan fill="#4169E1" font-weight="600">[3, 3, 2, 2]</tspan>.</text>
</svg>
