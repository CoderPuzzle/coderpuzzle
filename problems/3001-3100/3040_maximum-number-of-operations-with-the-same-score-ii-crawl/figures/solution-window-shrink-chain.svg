<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- nums = [3,2,1,2,3,4], candidate score 5;
       chain: op1 first two 3+2=5 -> window [2..5]; op2 ends 1+4=5 -> [3..4]; op3 ends 2+3=5 -> empty;
       dp[0..5]=3, dp[2..5]=2, dp[3..4]=1; cells 40x40, gap 6 (spacing 46), x = 60 + 46*index;
       rows y = 40, 104, 168, 232; muted fill #f0f3f7 marks the deleted pair -->
  <text x="60" y="24" fill="#5c6b76" font-size="12.5">nums = [3, 2, 1, 2, 3, 4], candidate score 5</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="40" width="40" height="40" fill="#f0f3f7"/><rect x="106" y="40" width="40" height="40" fill="#f0f3f7"/>
    <rect x="152" y="40" width="40" height="40" fill="#ffffff"/><rect x="198" y="40" width="40" height="40" fill="#ffffff"/>
    <rect x="244" y="40" width="40" height="40" fill="#ffffff"/><rect x="290" y="40" width="40" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="80" y="65" fill="#9aa7b2">3</text><text x="126" y="65" fill="#9aa7b2">2</text>
    <text x="172" y="65">1</text><text x="218" y="65">2</text><text x="264" y="65">3</text><text x="310" y="65">4</text>
  </g>
  <text x="60" y="96" fill="#9aa7b2" font-size="11">window [0..5]</text>
  <text x="392" y="57" fill="#1a2026" font-size="12">op 1: delete first two &#8212; <tspan fill="#4169E1" font-weight="600">3+2 = 5</tspan></text>
  <text x="392" y="74" fill="#9aa7b2" font-size="12">dp[0..5] = 1 + dp[2..5]</text>
  <path d="M 241 84 V 100" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="152" y="104" width="40" height="40" fill="#f0f3f7"/><rect x="198" y="104" width="40" height="40" fill="#ffffff"/>
    <rect x="244" y="104" width="40" height="40" fill="#ffffff"/><rect x="290" y="104" width="40" height="40" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="172" y="129" fill="#9aa7b2">1</text><text x="218" y="129">2</text><text x="264" y="129">3</text><text x="310" y="129" fill="#9aa7b2">4</text>
  </g>
  <text x="152" y="160" fill="#9aa7b2" font-size="11">window [2..5]</text>
  <text x="392" y="121" fill="#1a2026" font-size="12">op 2: delete both ends &#8212; <tspan fill="#4169E1" font-weight="600">1+4 = 5</tspan></text>
  <text x="392" y="138" fill="#9aa7b2" font-size="12">dp[2..5] = 1 + dp[3..4]</text>
  <path d="M 241 148 V 164" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="198" y="168" width="40" height="40" fill="#f0f3f7"/><rect x="244" y="168" width="40" height="40" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="218" y="193" fill="#9aa7b2">2</text><text x="264" y="193" fill="#9aa7b2">3</text>
  </g>
  <text x="140" y="224" fill="#9aa7b2" font-size="11">window [3..4]</text>
  <text x="392" y="185" fill="#1a2026" font-size="12">op 3: delete both ends &#8212; <tspan fill="#4169E1" font-weight="600">2+3 = 5</tspan></text>
  <text x="392" y="202" fill="#9aa7b2" font-size="12">dp[3..4] = 1 + dp[empty]</text>
  <path d="M 241 212 V 228" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="198" y="232" width="86" height="40" fill="none" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="241" y="256" text-anchor="middle" fill="#9aa7b2" font-size="11.5">empty</text>
  <text x="310" y="300" text-anchor="middle" fill="#1a2026" font-size="13">The chain 3+2, 1+4, 2+3 gives dp[0..5] = 3 for score 5; score 7 reaches only</text>
  <text x="310" y="318" text-anchor="middle" fill="#1a2026" font-size="13">1 &#8212; the answer is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
