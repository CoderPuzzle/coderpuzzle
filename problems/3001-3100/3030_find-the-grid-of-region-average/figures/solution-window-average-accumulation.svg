<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="444" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- image = [[10,20,30],[15,25,35],[20,30,40],[25,35,45]], threshold 12; windows A rows 0-2 (avg 25), B rows 1-3 (avg 30) -->
  <text x="118" y="50" text-anchor="middle" font-size="12.5" fill="#5c6b76">image</text>
  <text x="525" y="50" text-anchor="middle" font-size="12.5" fill="#5c6b76">sum · count</text>
  <g text-anchor="end" fill="#5c6b76" font-size="11.5">
    <text x="32" y="85">r0</text><text x="32" y="119">r1</text><text x="32" y="153">r2</text><text x="32" y="187">r3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="40" y="64" width="52" height="34"/><rect x="92" y="64" width="52" height="34"/><rect x="144" y="64" width="52" height="34"/>
    <rect x="40" y="98" width="52" height="34"/><rect x="92" y="98" width="52" height="34"/><rect x="144" y="98" width="52" height="34"/>
    <rect x="40" y="132" width="52" height="34"/><rect x="92" y="132" width="52" height="34"/><rect x="144" y="132" width="52" height="34"/>
    <rect x="40" y="166" width="52" height="34"/><rect x="92" y="166" width="52" height="34"/><rect x="144" y="166" width="52" height="34"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="66" y="85">10</text><text x="118" y="85">20</text><text x="170" y="85">30</text>
    <text x="66" y="119">15</text><text x="118" y="119">25</text><text x="170" y="119">35</text>
    <text x="66" y="153">20</text><text x="118" y="153">30</text><text x="170" y="153">40</text>
    <text x="66" y="187">25</text><text x="118" y="187">35</text><text x="170" y="187">45</text>
  </g>
  <rect x="38" y="62" width="160" height="106" fill="none" stroke="#4169E1" stroke-width="2"/>
  <rect x="38" y="96" width="160" height="106" fill="none" stroke="#42525e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="202" y1="112" x2="220" y2="84" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="202" y1="152" x2="220" y2="128" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="416" y1="116" x2="444" y2="112" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-size="13">
    <text x="226" y="80" fill="#4169E1" font-weight="600">A covers rows 0–2:</text>
    <text x="226" y="98" fill="#1a2026">sum 225 → floor(225 / 9) = 25</text>
    <text x="226" y="128" fill="#42525e" font-weight="600">B covers rows 1–3:</text>
    <text x="226" y="146" fill="#1a2026">sum 270 → floor(270 / 9) = 30</text>
    <text x="226" y="178" fill="#5c6b76" font-size="12.5">every adjacent pair inside</text>
    <text x="226" y="196" fill="#5c6b76" font-size="12.5">each window differs by ≤ 12</text>
  </g>
  <!-- overlap rows r1, r2 land in both windows: sum 25 + 30 = 55, count 2 -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="450" y="64" width="50" height="34" fill="#ffffff"/><rect x="500" y="64" width="50" height="34" fill="#ffffff"/><rect x="550" y="64" width="50" height="34" fill="#ffffff"/>
    <rect x="450" y="98" width="50" height="34" fill="#dbe4fb"/><rect x="500" y="98" width="50" height="34" fill="#dbe4fb"/><rect x="550" y="98" width="50" height="34" fill="#dbe4fb"/>
    <rect x="450" y="132" width="50" height="34" fill="#dbe4fb"/><rect x="500" y="132" width="50" height="34" fill="#dbe4fb"/><rect x="550" y="132" width="50" height="34" fill="#dbe4fb"/>
    <rect x="450" y="166" width="50" height="34" fill="#ffffff"/><rect x="500" y="166" width="50" height="34" fill="#ffffff"/><rect x="550" y="166" width="50" height="34" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="475" y="85">25 · 1</text><text x="525" y="85">25 · 1</text><text x="575" y="85">25 · 1</text>
    <text x="475" y="119">55 · 2</text><text x="525" y="119">55 · 2</text><text x="575" y="119">55 · 2</text>
    <text x="475" y="153">55 · 2</text><text x="525" y="153">55 · 2</text><text x="575" y="153">55 · 2</text>
    <text x="475" y="187">30 · 1</text><text x="525" y="187">30 · 1</text><text x="575" y="187">30 · 1</text>
  </g>
  <line x1="525" y1="208" x2="525" y2="238" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="537" y="226" font-size="12" fill="#5c6b76">divide and floor</text>
  <text x="438" y="320" text-anchor="end" font-size="12.5" fill="#5c6b76">result</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="450" y="248" width="50" height="34"/><rect x="500" y="248" width="50" height="34"/><rect x="550" y="248" width="50" height="34"/>
    <rect x="450" y="282" width="50" height="34"/><rect x="500" y="282" width="50" height="34"/><rect x="550" y="282" width="50" height="34"/>
    <rect x="450" y="316" width="50" height="34"/><rect x="500" y="316" width="50" height="34"/><rect x="550" y="316" width="50" height="34"/>
    <rect x="450" y="350" width="50" height="34"/><rect x="500" y="350" width="50" height="34"/><rect x="550" y="350" width="50" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="475" y="269" fill="#1a2026">25</text><text x="525" y="269" fill="#1a2026">25</text><text x="575" y="269" fill="#1a2026">25</text>
    <text x="475" y="303" fill="#4169E1">27</text><text x="525" y="303" fill="#4169E1">27</text><text x="575" y="303" fill="#4169E1">27</text>
    <text x="475" y="337" fill="#4169E1">27</text><text x="525" y="337" fill="#4169E1">27</text><text x="575" y="337" fill="#4169E1">27</text>
    <text x="475" y="371" fill="#1a2026">30</text><text x="525" y="371" fill="#1a2026">30</text><text x="575" y="371" fill="#1a2026">30</text>
  </g>
  <text x="340" y="412" text-anchor="middle" fill="#1a2026" font-size="13">Each qualifying window drops its floored average into every pixel it covers:</text>
  <text x="340" y="432" text-anchor="middle" fill="#1a2026" font-size="13">the overlap sums 25 + 30 = 55 over 2 visits — floor(55 / 2) = <tspan fill="#4169E1" font-weight="600">27</tspan>.</text>
</svg>
