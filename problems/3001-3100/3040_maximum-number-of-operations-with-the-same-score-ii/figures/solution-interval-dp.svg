<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
  <text x="60" y="24" fill="#1a2026" font-weight="600">dp[l][r] for score 5 · nums = [3,2,1,2,3,4]</text>
  <!-- column headers -->
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="160" y="44">r=0</text><text x="200" y="44">1</text><text x="240" y="44">2</text>
    <text x="280" y="44">3</text><text x="320" y="44">4</text><text x="360" y="44">5</text>
  </g>
  <g fill="#5c6b76" font-size="12.5" text-anchor="end">
    <text x="132" y="66">l=0</text><text x="132" y="106">1</text><text x="132" y="146">2</text>
    <text x="132" y="186">3</text><text x="132" y="226">4</text><text x="132" y="266">5</text>
  </g>
  <!-- cells: filled only for r >= l -->
  <g stroke="#98a2ac" stroke-width="1.1">
    <rect x="140" y="50" width="40" height="40" fill="#f3f5f7"/>
    <rect x="180" y="50" width="40" height="40" fill="#ffffff"/><rect x="220" y="50" width="40" height="40" fill="#ffffff"/><rect x="260" y="50" width="40" height="40" fill="#ffffff"/><rect x="300" y="50" width="40" height="40" fill="#ffffff"/><rect x="340" y="50" width="40" height="40" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
    <rect x="180" y="90" width="40" height="40" fill="#f3f5f7"/><rect x="220" y="90" width="40" height="40" fill="#ffffff"/><rect x="260" y="90" width="40" height="40" fill="#ffffff"/><rect x="300" y="90" width="40" height="40" fill="#ffffff"/><rect x="340" y="90" width="40" height="40" fill="#ffffff"/>
    <rect x="220" y="130" width="40" height="40" fill="#f3f5f7"/><rect x="260" y="130" width="40" height="40" fill="#ffffff"/><rect x="300" y="130" width="40" height="40" fill="#ffffff"/><rect x="340" y="130" width="40" height="40" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
    <rect x="260" y="170" width="40" height="40" fill="#f3f5f7"/><rect x="300" y="170" width="40" height="40" fill="#ffffff"/><rect x="340" y="170" width="40" height="40" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
    <rect x="300" y="210" width="40" height="40" fill="#f3f5f7"/><rect x="340" y="210" width="40" height="40" fill="#ffffff"/>
    <rect x="340" y="250" width="40" height="40" fill="#f3f5f7"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="200" y="76">1</text><text x="240" y="76">1</text><text x="280" y="76">1</text><text x="320" y="76">2</text><text x="360" y="76" fill="#4169E1">3</text>
    <text x="240" y="116">0</text><text x="280" y="116">0</text><text x="320" y="116">1</text><text x="360" y="116">0</text>
    <text x="280" y="156">0</text><text x="320" y="156">1</text><text x="360" y="156" fill="#4169E1">2</text>
    <text x="320" y="196">1</text><text x="360" y="196">1</text>
    <text x="360" y="236">0</text>
  </g>
  <!-- transition arrows -->
  <g stroke="#4169E1" stroke-width="1.7" fill="none">
    <path d="M 368 82 Q 392 110 374 128" marker-end="url(#arrow)"/>
    <path d="M 356 172 Q 330 176 326 192" marker-end="url(#arrow)"/>
    <path d="M 316 214 Q 290 226 288 240" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="430" y="80">dp[0][5] = 3 — delete the left pair 3 + 2 = 5,</text>
    <text x="450" y="98">take 1 + dp[2][5]</text>
    <text x="430" y="160">dp[2][5] = 2 — match the outer pair 1 + 4 = 5,</text>
    <text x="450" y="178">take 1 + dp[3][4]</text>
    <text x="430" y="230">dp[3][4] = 1 — length-2 interval whose left</text>
    <text x="450" y="248">pair 2 + 3 = 5 is deletable</text>
    <text x="430" y="292" fill="#4169E1" font-weight="600">table filled by increasing length;</text>
    <text x="450" y="310" fill="#4169E1" font-weight="600">answer = dp[0][5] = 3</text>
  </g>
</svg>
