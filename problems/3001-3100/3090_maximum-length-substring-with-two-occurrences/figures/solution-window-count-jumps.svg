<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="384" fill="#ffffff"/>
  <!-- s = "bcbbbcba"; char cells 44x36 at x = 60 + 50i, y=40; shaded cells 4..7 are the
       final window; trace rows baseline y = 186 + 19i, counts are (b, c, a) inside the window -->
  <text x="40" y="63" text-anchor="middle" fill="#5c6b76" font-size="12.5">s</text>
  <g stroke-width="1.5">
    <rect x="60" y="40" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="110" y="40" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="160" y="40" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="210" y="40" width="44" height="36" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="260" y="40" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="310" y="40" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="360" y="40" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="410" y="40" width="44" height="36" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="82" y="63">b</text><text x="132" y="63">c</text><text x="182" y="63">b</text><text x="232" y="63">b</text>
    <text x="282" y="63">b</text><text x="332" y="63">c</text><text x="382" y="63">b</text><text x="432" y="63">a</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="82" y="92">0</text><text x="132" y="92">1</text><text x="182" y="92">2</text><text x="232" y="92">3</text>
    <text x="282" y="92">4</text><text x="332" y="92">5</text><text x="382" y="92">6</text><text x="432" y="92">7</text>
  </g>
  <path d="M 260 104 h 194 M 260 104 v 7 M 454 104 v 7" stroke="#4169E1" stroke-width="1.5" fill="none"/>
  <text x="357" y="128" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">longest valid window "bcba" — length 4</text>
  <!-- window trace -->
  <g fill="#5c6b76" font-size="11.5">
    <text x="40" y="164">right</text>
    <text x="120" y="164">b c a</text>
    <text x="205" y="164">left edge</text>
    <text x="350" y="164">window</text>
    <text x="455" y="164">len</text>
    <text x="515" y="164">best</text>
  </g>
  <rect x="30" y="304" width="540" height="22" fill="#dbe4fb"/>
  <g font-size="12.5">
    <text x="40" y="186" fill="#1a2026">0 · b</text><text x="120" y="186" fill="#5c6b76">1 0 0</text>
    <text x="205" y="186" fill="#5c6b76">0</text><text x="350" y="186" fill="#1a2026">"b"</text>
    <text x="455" y="186" fill="#1a2026">1</text><text x="515" y="186" fill="#4169E1" font-weight="600">1</text>
    <text x="40" y="205" fill="#1a2026">1 · c</text><text x="120" y="205" fill="#5c6b76">1 1 0</text>
    <text x="205" y="205" fill="#5c6b76">0</text><text x="350" y="205" fill="#1a2026">"bc"</text>
    <text x="455" y="205" fill="#1a2026">2</text><text x="515" y="205" fill="#4169E1" font-weight="600">2</text>
    <text x="40" y="224" fill="#1a2026">2 · b</text><text x="120" y="224" fill="#5c6b76">2 1 0</text>
    <text x="205" y="224" fill="#5c6b76">0</text><text x="350" y="224" fill="#1a2026">"bcb"</text>
    <text x="455" y="224" fill="#1a2026">3</text><text x="515" y="224" fill="#4169E1" font-weight="600">3</text>
    <text x="40" y="243" fill="#1a2026">3 · b</text><text x="120" y="243" fill="#5c6b76">2 1 0</text>
    <text x="205" y="243" fill="#4169E1" font-weight="600">0 → 1 (3rd b)</text><text x="350" y="243" fill="#1a2026">"cbb"</text>
    <text x="455" y="243" fill="#1a2026">3</text><text x="515" y="243" fill="#5c6b76">3</text>
    <text x="40" y="262" fill="#1a2026">4 · b</text><text x="120" y="262" fill="#5c6b76">2 0 0</text>
    <text x="205" y="262" fill="#4169E1" font-weight="600">1 → 3 (3rd b)</text><text x="350" y="262" fill="#1a2026">"bb"</text>
    <text x="455" y="262" fill="#1a2026">2</text><text x="515" y="262" fill="#5c6b76">3</text>
    <text x="40" y="281" fill="#1a2026">5 · c</text><text x="120" y="281" fill="#5c6b76">2 1 0</text>
    <text x="205" y="281" fill="#5c6b76">3</text><text x="350" y="281" fill="#1a2026">"bbc"</text>
    <text x="455" y="281" fill="#1a2026">3</text><text x="515" y="281" fill="#5c6b76">3</text>
    <text x="40" y="300" fill="#1a2026">6 · b</text><text x="120" y="300" fill="#5c6b76">2 1 0</text>
    <text x="205" y="300" fill="#4169E1" font-weight="600">3 → 4 (3rd b)</text><text x="350" y="300" fill="#1a2026">"bcb"</text>
    <text x="455" y="300" fill="#1a2026">3</text><text x="515" y="300" fill="#5c6b76">3</text>
    <text x="40" y="319" fill="#1a2026" font-weight="600">7 · a</text><text x="120" y="319" fill="#5c6b76">2 1 1</text>
    <text x="205" y="319" fill="#5c6b76">4</text><text x="350" y="319" fill="#1a2026" font-weight="600">"bcba"</text>
    <text x="455" y="319" fill="#1a2026" font-weight="600">4</text><text x="515" y="319" fill="#4169E1" font-weight="700">4</text>
  </g>
  <text x="310" y="352" text-anchor="middle" fill="#1a2026" font-size="13">A third b forces the left edge forward until the count returns to two;</text>
  <text x="310" y="370" text-anchor="middle" fill="#1a2026" font-size="13">the final step ends the length-4 window "bcba" — the answer is <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
