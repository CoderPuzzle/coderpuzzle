<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="318" fill="#ffffff"/>
  <!-- example 2: nums=[1,1,2,4,9], k=20; heap cells 36x32 pitch 44 from x=310,
       row baselines y=67..251; accent cell = the value that row's merge pushed -->
  <text x="24" y="34" fill="#5c6b76" font-size="12.5">min-heap after each forced merge</text>
  <text x="620" y="34" text-anchor="middle" fill="#4169E1" font-weight="600">k = 20</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <!-- row 0: heapify -->
    <rect x="310" y="46" width="36" height="32"/><rect x="354" y="46" width="36" height="32"/>
    <rect x="398" y="46" width="36" height="32"/><rect x="442" y="46" width="36" height="32"/>
    <rect x="486" y="46" width="36" height="32"/>
    <!-- row 1: pop 1,1 push 3 -->
    <rect x="310" y="92" width="36" height="32"/>
    <rect x="354" y="92" width="36" height="32" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="398" y="92" width="36" height="32"/><rect x="442" y="92" width="36" height="32"/>
    <!-- row 2: pop 2,3 push 7 -->
    <rect x="310" y="138" width="36" height="32"/>
    <rect x="354" y="138" width="36" height="32" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="398" y="138" width="36" height="32"/>
    <!-- row 3: pop 4,7 push 15 -->
    <rect x="310" y="184" width="36" height="32"/>
    <rect x="354" y="184" width="36" height="32" fill="#dbe4fb" stroke="#4169E1"/>
    <!-- row 4: pop 9,15 push 33 -->
    <rect x="310" y="230" width="36" height="32" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle">
    <text x="328" y="67">1</text><text x="372" y="67">1</text><text x="416" y="67">2</text>
    <text x="460" y="67">4</text><text x="504" y="67">9</text>
    <text x="328" y="113">2</text><text x="372" y="113" fill="#4169E1" font-weight="600">3</text>
    <text x="416" y="113">4</text><text x="460" y="113">9</text>
    <text x="328" y="159">4</text><text x="372" y="159" fill="#4169E1" font-weight="600">7</text>
    <text x="416" y="159">9</text>
    <text x="328" y="205">9</text><text x="372" y="205" fill="#4169E1" font-weight="600">15</text>
    <text x="328" y="251" fill="#4169E1" font-weight="600">33</text>
  </g>
  <g font-size="12.5">
    <text x="24" y="66" fill="#5c6b76">heapify</text>
    <text x="100" y="66" fill="#5c6b76">nums = [1, 1, 2, 4, 9]</text>
    <text x="556" y="66" fill="#5c6b76">ops 0</text>
    <text x="24" y="112" font-weight="600" fill="#1a2026">op 1</text>
    <text x="100" y="112" fill="#5c6b76">pop 1, 1 → push 2·1+1 = 3</text>
    <text x="556" y="112" fill="#5c6b76">ops 1</text>
    <text x="24" y="158" font-weight="600" fill="#1a2026">op 2</text>
    <text x="100" y="158" fill="#5c6b76">pop 2, 3 → push 2·2+3 = 7</text>
    <text x="556" y="158" fill="#5c6b76">ops 2</text>
    <text x="24" y="204" font-weight="600" fill="#1a2026">op 3</text>
    <text x="100" y="204" fill="#5c6b76">pop 4, 7 → push 2·4+7 = 15</text>
    <text x="556" y="204" fill="#5c6b76">ops 3</text>
    <text x="24" y="250" font-weight="600" fill="#1a2026">op 4</text>
    <text x="100" y="250" fill="#5c6b76">pop 9, 15 → push 2·9+15 = 33</text>
    <text x="556" y="250" fill="#4169E1" font-weight="600">ops 4</text>
  </g>
  <text x="360" y="250" fill="#4169E1" font-weight="600" font-size="12.5">33 ≥ 20 → stop</text>
  <text x="340" y="288" text-anchor="middle" fill="#1a2026" font-size="13">Every merge pops the two smallest x ≤ y and pushes x·2 + y back into the heap;</text>
  <text x="340" y="306" text-anchor="middle" fill="#1a2026" font-size="13">after 4 merges the lone <tspan fill="#4169E1" font-weight="600">33</tspan> clears k = 20, so the answer is <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
