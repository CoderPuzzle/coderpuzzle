  </g>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="532" y="28">1</text><text x="558" y="28">0</text><text x="584" y="28">-1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="96" y="56" width="52" height="40"/><rect x="148" y="56" width="52" height="40"/><rect x="200" y="56" width="52" height="40"/><rect x="252" y="56" width="52" height="40"/>
    <rect x="304" y="56" width="52" height="40"/><rect x="356" y="56" width="52" height="40"/><rect x="408" y="56" width="52" height="40"/><rect x="460" y="56" width="52" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600">
