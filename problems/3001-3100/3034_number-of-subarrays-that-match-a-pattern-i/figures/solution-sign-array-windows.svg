  <text x="408" y="252" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">match</text>
  <text x="320" y="286" text-anchor="middle" fill="#1a2026" font-size="13">Signs [1, 0, -1, 1, 1, 0, -1]; the pattern window matches at offsets <tspan fill="#4169E1" font-weight="600">0</tspan> and <tspan fill="#4169E1" font-weight="600">4</tspan> &#8212;</text>
  <text x="320" y="304" text-anchor="middle" fill="#1a2026" font-size="13">the subarrays [1, 4, 4, 1] and [3, 5, 5, 3], so the count is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
