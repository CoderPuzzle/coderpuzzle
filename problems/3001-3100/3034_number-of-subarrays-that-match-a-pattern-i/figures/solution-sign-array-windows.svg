      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- nums = [1,4,4,1,3,5,5,3], pattern = [1,0,-1]; signs = [1,0,-1,1,1,0,-1];
