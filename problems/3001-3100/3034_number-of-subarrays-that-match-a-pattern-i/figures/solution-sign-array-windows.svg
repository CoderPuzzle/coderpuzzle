    <rect x="278" y="140" width="52" height="44" fill="#ffffff"/><rect x="330" y="140" width="52" height="44" fill="#ffffff"/><rect x="382" y="140" width="52" height="44" fill="#ffffff"/>
    <rect x="434" y="140" width="52" height="44" fill="#ffffff"/>
