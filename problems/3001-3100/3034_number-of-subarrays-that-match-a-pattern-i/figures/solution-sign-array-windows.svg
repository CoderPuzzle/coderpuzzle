  </g>
  <polyline points="193,226 199,232 210,216" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <polyline points="401,226 407,232 418,216" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <g stroke="#9aa7b2" stroke-width="2">
    <line x1="246" y1="218" x2="258" y2="230"/><line x1="258" y1="218" x2="246" y2="230"/>
