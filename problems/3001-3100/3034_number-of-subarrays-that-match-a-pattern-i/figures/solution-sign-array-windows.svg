       dashed match rects at offsets 0 (x=119) and 4 (x=327), w=162 -->
  <text x="96" y="44" fill="#5c6b76" font-size="12.5">nums</text>
  <text x="514" y="28" text-anchor="end" fill="#5c6b76" font-size="12">pattern</text>
