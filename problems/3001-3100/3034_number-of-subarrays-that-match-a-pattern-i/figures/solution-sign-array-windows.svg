  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 148 100 V 132" marker-end="url(#arrow)"/><path d="M 200 100 V 132" marker-end="url(#arrow)"/><path d="M 252 100 V 132" marker-end="url(#arrow)"/>
    <path d="M 304 100 V 132" marker-end="url(#arrow)"/><path d="M 356 100 V 132" marker-end="url(#arrow)"/><path d="M 408 100 V 132" marker-end="url(#arrow)"/><path d="M 460 100 V 132" marker-end="url(#arrow)"/>
