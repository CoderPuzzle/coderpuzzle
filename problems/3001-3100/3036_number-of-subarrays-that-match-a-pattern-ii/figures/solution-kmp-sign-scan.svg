<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="296" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- s = [1,0,-1,1,1,0,-1], pattern = [1,0,-1], failure = [0,0,0];
       KMP trace: matched after step t = 1,2,3(match,reset 0),1,1(via fallback),2,3(match,reset 0);
       columns centered at x=84+76t; s cells and state cells w=44 h=36 -->
  <text x="100" y="28" text-anchor="end" fill="#5c6b76" font-size="12">pattern</text>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="110" y="8" width="38" height="30" fill="#dbe4fb"/><rect x="152" y="8" width="38" height="30" fill="#dbe4fb"/><rect x="194" y="8" width="38" height="30" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="129" y="28">1</text><text x="171" y="28">0</text><text x="213" y="28">-1</text>
  </g>
  <text x="252" y="28" fill="#5c6b76" font-size="12">failure = [0, 0, 0] &#8212; every mismatch resets to 0</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="84" y="76">t = 0</text><text x="160" y="76">t = 1</text><text x="236" y="76">t = 2</text><text x="312" y="76">t = 3</text>
    <text x="388" y="76">t = 4</text><text x="464" y="76">t = 5</text><text x="540" y="76">t = 6</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#dbe4fb">
    <rect x="62" y="88" width="44" height="36"/><rect x="138" y="88" width="44" height="36"/><rect x="214" y="88" width="44" height="36"/>
    <rect x="290" y="88" width="44" height="36"/><rect x="366" y="88" width="44" height="36"/><rect x="442" y="88" width="44" height="36"/>
    <rect x="518" y="88" width="44" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="84" y="111">1</text><text x="160" y="111">0</text><text x="236" y="111">-1</text>
    <text x="312" y="111">1</text><text x="388" y="111">1</text><text x="464" y="111">0</text><text x="540" y="111">-1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 84 128 V 144" marker-end="url(#arrow)"/><path d="M 160 128 V 144" marker-end="url(#arrow)"/><path d="M 236 128 V 144" marker-end="url(#arrow)"/>
    <path d="M 312 128 V 144" marker-end="url(#arrow)"/><path d="M 388 128 V 144" marker-end="url(#arrow)"/><path d="M 464 128 V 144" marker-end="url(#arrow)"/>
    <path d="M 540 128 V 144" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="62" y="150" width="44" height="36"/><rect x="138" y="150" width="44" height="36"/><rect x="214" y="150" width="44" height="36" stroke="#4169E1" stroke-width="2"/>
    <rect x="290" y="150" width="44" height="36"/><rect x="366" y="150" width="44" height="36"/><rect x="442" y="150" width="44" height="36"/>
    <rect x="518" y="150" width="44" height="36" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="84" y="173">1</text><text x="160" y="173">2</text><text x="236" y="173" fill="#4169E1">3</text>
    <text x="312" y="173">1</text><text x="388" y="173">1</text><text x="464" y="173">2</text><text x="540" y="173" fill="#4169E1">3</text>
  </g>
  <text x="236" y="206" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">match #1</text>
  <text x="236" y="221" text-anchor="middle" fill="#9aa7b2" font-size="10.5">reset &#8594; 0</text>
  <text x="388" y="206" text-anchor="middle" fill="#9aa7b2" font-size="10.5">1&#8800;0: fall 1&#8594;0,</text>
  <text x="388" y="221" text-anchor="middle" fill="#9aa7b2" font-size="10.5">retry 1=1 &#8594; 1</text>
  <text x="540" y="206" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">match #2</text>
  <text x="540" y="221" text-anchor="middle" fill="#9aa7b2" font-size="10.5">reset &#8594; 0</text>
  <text x="320" y="258" text-anchor="middle" fill="#1a2026" font-size="13">KMP over the signs [1, 0, -1, 1, 1, 0, -1]: the matched length runs 1, 2, 3 and hits</text>
  <text x="320" y="276" text-anchor="middle" fill="#1a2026" font-size="13">a full match at t = 2 and again at t = 6 &#8212; offsets 0 and 4, count <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
