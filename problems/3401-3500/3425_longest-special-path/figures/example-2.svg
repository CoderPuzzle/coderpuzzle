<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[1,0,8]], nums = [2,2]; only single-node paths are special, answer [0,1] (verified by brute force) -->
  <line x1="240" y1="78" x2="400" y2="78" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="240" cy="78" r="21"/>
    <circle cx="400" cy="78" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="240" y="83">0</text>
    <text x="400" y="83">1</text>
  </g>
  <text x="320" y="64" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">8</text>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="240" y="30">val 2</text>
    <text x="400" y="30">val 2</text>
  </g>
  <text x="320" y="128" text-anchor="middle" fill="#1a2026" font-size="13.5">both nodes have value 2, so the edge joins no special path —</text>
  <text x="320" y="150" text-anchor="middle" fill="#1a2026" font-size="13.5">the longest special path is a single node: length <tspan fill="#4169E1" font-weight="700">0</tspan>, minimum <tspan fill="#4169E1" font-weight="700">1</tspan> node</text>
</svg>
