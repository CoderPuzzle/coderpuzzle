<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[0,1,2],[1,2,3],[1,3,5],[1,4,4],[2,5,6]], nums = [2,1,2,1,3,1]; answer [6,2], winning paths 0-1-4 and 2-5 (verified by brute force) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="260" y1="50" x2="260" y2="136"/>
    <line x1="260" y1="136" x2="120" y2="224"/>
    <line x1="260" y1="136" x2="260" y2="224"/>
    <line x1="260" y1="136" x2="400" y2="224"/>
    <line x1="120" y1="224" x2="120" y2="312"/>
  </g>
  <!-- path 0 -> 1 -> 4, length 2 + 4 = 6 -->
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="260" y1="50" x2="260" y2="136"/>
    <line x1="260" y1="136" x2="400" y2="224"/>
  </g>
  <!-- path 2 -> 5, length 6 -->
  <line x1="120" y1="224" x2="120" y2="312" stroke="#b57f30" stroke-width="3.2"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="260" cy="50" r="21"/>
    <circle cx="260" cy="136" r="21"/>
    <circle cx="400" cy="224" r="21"/>
  </g>
  <g stroke="#b57f30" stroke-width="2" fill="#f6ecd9">
    <circle cx="120" cy="224" r="21"/>
    <circle cx="120" cy="312" r="21"/>
  </g>
  <circle cx="260" cy="224" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="260" y="55">0</text>
    <text x="260" y="141">1</text>
    <text x="120" y="229">2</text>
    <text x="260" y="229">3</text>
    <text x="400" y="229">4</text>
    <text x="120" y="317">5</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="260" y="16">val 2</text>
    <text x="306" y="132">val 1</text>
    <text x="120" y="200">val 2</text>
    <text x="306" y="228">val 1</text>
    <text x="400" y="198">val 3</text>
    <text x="82" y="294">val 1</text>
  </g>
  <g fill="#5c6b76" font-size="12" font-weight="600" text-anchor="middle">
    <text x="281" y="98">2</text>
    <text x="176" y="166">3</text>
    <text x="281" y="186">5</text>
    <text x="322" y="162">4</text>
    <text x="97" y="272">6</text>
  </g>
  <text x="260" y="352" text-anchor="middle" fill="#1a2026" font-size="13.5">longest special paths, both length <tspan fill="#4169E1" font-weight="700">6</tspan>: <tspan fill="#4169E1" font-weight="700">0 → 1 → 4</tspan> (2 + 4) and <tspan fill="#7a5a1e" font-weight="700">2 → 5</tspan> (6) — fewest nodes is <tspan fill="#4169E1" font-weight="700">2</tspan></text>
</svg>
