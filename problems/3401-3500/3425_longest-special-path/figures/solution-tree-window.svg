<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="560" height="300" fill="#ffffff"/>
  <!-- plain edges -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="280" y1="122" x2="280" y2="152"/>
    <line x1="280" y1="122" x2="160" y2="152"/>
  </g>
  <!-- highlighted edges: 0-1 (2), 1-4 (4), 2-5 (6) -->
  <g stroke="#4169E1" stroke-width="2.6">
    <line x1="280" y1="58" x2="280" y2="92"/>
    <line x1="280" y1="122" x2="400" y2="152"/>
    <line x1="160" y1="192" x2="160" y2="232"/>
  </g>
  <!-- nodes -->
  <circle cx="280" cy="40" r="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="280" cy="110" r="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="160" cy="170" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.7"/>
  <circle cx="280" cy="170" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.7"/>
  <circle cx="400" cy="170" r="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="160" cy="250" r="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="280" y="45">0</text><text x="280" y="115">1</text><text x="160" y="175">2</text>
    <text x="280" y="175">3</text><text x="400" y="175">4</text><text x="160" y="255">5</text>
  </g>
  <!-- node values -->
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="308" y="34">val 2</text><text x="308" y="104">val 1</text><text x="132" y="164">val 2</text>
    <text x="308" y="164">val 1</text><text x="428" y="164">val 3</text><text x="132" y="270">val 1</text>
  </g>
  <!-- edge weights -->
  <g fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="290" y="80">2</text>
    <text x="352" y="128">4</text>
    <text x="170" y="220">6</text>
  </g>
  <g fill="#1a2026" font-size="12.5">
    <text x="290" y="142">5</text>
    <text x="212" y="140">3</text>
  </g>
  <!-- annotations -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="452" y="60">0 → 1 → 4: length 2 + 4 = 6,</text>
    <text x="452" y="78">values {2, 1, 3} distinct</text>
    <text x="452" y="116">2 → 5: length 6,</text>
    <text x="452" y="134">values {2, 1} distinct</text>
    <text x="452" y="172">→ only 2 nodes, so</text>
    <text x="452" y="190">result = [6, 2]</text>
    <text x="280" y="292" text-anchor="middle">descending DFS keeps the root path; the window start jumps past a repeated value,</text>
    <text x="280" y="292" dy="16" text-anchor="middle">and every downward suffix of the path is a special-path candidate.</text>
  </g>
</svg>
