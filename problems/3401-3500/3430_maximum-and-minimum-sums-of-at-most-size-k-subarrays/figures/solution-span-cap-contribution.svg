<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="356" fill="#ffffff"/>
  <!-- nums = [1,2,3], k = 2 (K = 1); cells 56x36 at x = 36 + 60i, y = 56;
       L_max = [0,1,2], R_max = [0,0,0]; L_min = [0,0,0], R_min = [2,1,0];
       dot grid: i = 0 as min, a in 0..L=0, b in 0..R=2, cap a+b &lt;= 1 keeps [1] and [1,2] -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="64" y="48">0</text><text x="124" y="48">1</text><text x="184" y="48">2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="36" y="56" width="56" height="36"/><rect x="96" y="56" width="56" height="36"/>
    <rect x="156" y="56" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="64" y="79" fill="#1a2026">1</text><text x="124" y="79" fill="#1a2026">2</text>
    <text x="184" y="79" fill="#1a2026">3</text>
  </g>
  <text x="36" y="118" fill="#5c6b76" font-size="11.5">max spans (L, R)</text>
  <g stroke="#5c6b76" stroke-width="1.4" fill="none">
    <path d="M 36 119 v 5 H 92 v -5"/>
    <path d="M 36 141 v 5 H 152 v -5"/>
    <path d="M 36 163 v 5 H 212 v -5"/>
  </g>
  <g fill="#42525e">
    <circle cx="64" cy="124" r="2.5"/><circle cx="124" cy="146" r="2.5"/><circle cx="184" cy="168" r="2.5"/>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="104" y="128">L=0, R=0 &#8594; [1] &#8594; 1</text>
    <text x="164" y="150">L=1, R=0 &#8594; 2</text>
    <text x="224" y="172">L=2, R=0 &#8594; cap drops [1,2,3] &#8594; 2</text>
  </g>
  <text x="36" y="194" fill="#4169E1" font-size="11.5">min spans (L, R)</text>
  <g stroke="#4169E1" stroke-width="1.4" fill="none">
    <path d="M 36 195 v 5 H 212 v -5"/>
    <path d="M 36 217 v 5 H 152 v -5"/>
    <path d="M 156 239 v 5 H 212 v -5"/>
  </g>
  <g fill="#4169E1">
    <circle cx="64" cy="200" r="2.5"/><circle cx="124" cy="222" r="2.5"/><circle cx="184" cy="244" r="2.5"/>
  </g>
  <g fill="#4169E1" font-size="11.5">
    <text x="224" y="204">L=0, R=2 &#8594; cap keeps 2 of 3</text>
    <text x="164" y="226">L=0, R=1 &#8594; 2</text>
    <text x="224" y="248">L=0, R=0 &#8594; 1</text>
  </g>
  <!-- the clipped case, i = 0 as min -->
  <text x="400" y="64" fill="#5c6b76" font-size="11.5">counting i = 0 as min:</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="434" y="76">b=0</text><text x="498" y="76">b=1</text><text x="562" y="76">b=2</text>
  </g>
  <text x="398" y="104" text-anchor="end" fill="#5c6b76" font-size="10.5">a=0</text>
  <rect x="406" y="82" width="56" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="470" y="82" width="56" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <rect x="534" y="82" width="56" height="38" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-size="11.5" font-weight="600">
    <text x="434" y="105" fill="#4169E1">[1]</text><text x="498" y="105" fill="#4169E1">[1,2]</text>
    <text x="562" y="105" fill="#9aa7b2">[1,2,3]</text>
  </g>
  <text x="498" y="140" text-anchor="middle" fill="#5c6b76" font-size="11">a + b &#8804; k - 1 = 1 keeps 2 of the 3</text>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">Each element contributes value &#215; (max pairs + min pairs):</text>
  <text x="320" y="306" text-anchor="middle" fill="#1a2026" font-size="13">1&#183;(1+2) + 2&#183;(2+2) + 3&#183;(2+1) = 3 + 8 + 9 = <tspan fill="#4169E1" font-weight="600">20</tspan></text>
  <text x="320" y="332" text-anchor="middle" fill="#1a2026" font-size="13">The k = 2 cap clips long spans, yet every subarray's max and min are credited once.</text>
</svg>
