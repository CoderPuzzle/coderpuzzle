<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="384" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- baskets = [3,5,4]; leaves hold capacities, internal nodes hold range max; fruit q=4 descends root -> [0-1] -> [1-1] -->
  <text x="320" y="28" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">baskets = [3,5,4] — max segment tree, fruit 4 descends</text>
  <!-- plain (non-path) edges -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 344 98 L 431 162"/>
    <path d="M 166 203 L 124 257"/>
  </g>
  <!-- descent path root -> [0-1] -> [1-1] -->
  <g stroke="#4169E1" stroke-width="2.4" fill="none">
    <path d="M 296 98 L 209 162" marker-end="url(#arrow)"/>
    <path d="M 204 203 L 246 257" marker-end="url(#arrow)"/>
  </g>
  <!-- nodes: range label + range max -->
  <g text-anchor="middle">
    <circle cx="320" cy="80" r="30" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="320" y="76" fill="#5c6b76" font-size="10.5">0–2</text>
    <text x="320" y="96" font-size="17" font-weight="600" fill="#1a2026">5</text>
    <circle cx="185" cy="180" r="30" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="185" y="176" fill="#5c6b76" font-size="10.5">0–1</text>
    <text x="185" y="196" font-size="17" font-weight="600" fill="#1a2026">5</text>
    <circle cx="455" cy="180" r="30" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="455" y="176" fill="#5c6b76" font-size="10.5">2–2</text>
    <text x="455" y="196" font-size="17" font-weight="600" fill="#1a2026">4</text>
    <circle cx="105" cy="280" r="30" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
    <text x="105" y="276" fill="#9aa7b2" font-size="10.5">0–0</text>
    <text x="105" y="296" font-size="17" font-weight="600" fill="#9aa7b2">3</text>
    <circle cx="265" cy="280" r="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
    <text x="265" y="276" fill="#4169E1" font-size="10.5">1–1</text>
    <text x="265" y="296" font-size="17" font-weight="600" fill="#4169E1">5</text>
  </g>
  <text x="390" y="76" text-anchor="start" fill="#4169E1" font-size="12" font-weight="600">5 ≥ 4 → descend</text>
  <text x="252" y="120" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">5 ≥ 4</text>
  <text x="188" y="240" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">5 ≥ 4</text>
  <text x="105" y="332" text-anchor="middle" fill="#9aa7b2" font-size="12">3 &lt; 4 — reject</text>
  <text x="455" y="230" text-anchor="middle" fill="#5c6b76" font-size="11.5">leaf: basket 2 (cap 4)</text>
  <text x="265" y="332" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">basket 1 (cap 5) ← fruit 4</text>
  <text x="320" y="358" text-anchor="middle" fill="#1a2026" font-size="13">Fruit 4 rejects the max-3 left child, lands on basket 1; fruit 2 then takes basket 0.</text>
  <text x="320" y="376" text-anchor="middle" fill="#1a2026" font-size="13">Fruit 5 then meets root max <tspan fill="#4169E1" font-weight="600">4 &lt; 5</tspan> — unplaced, so the answer is <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
