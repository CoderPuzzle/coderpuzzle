<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="300" fill="#ffffff"/>
  <!-- path 0-1-3-6-8 of example 1; edge weights 1,1,5,3; dist = prefix distance; nums values 1,1,3,1,0; best window [second..depth] = path[1..4] -->
  <text x="340" y="28" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">example 1 — DFS root path 0→1→3→6→8 with prefix distances</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="70" y="64">node 0</text><text x="190" y="64">node 1</text><text x="310" y="64">node 3</text><text x="430" y="64">node 6</text><text x="550" y="64">node 8</text>
  </g>
  <!-- path arrows -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 104 98 H 156" marker-end="url(#arrow)"/>
    <path d="M 224 98 H 276" marker-end="url(#arrow)"/>
    <path d="M 344 98 H 396" marker-end="url(#arrow)"/>
    <path d="M 464 98 H 516" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="130" y="88">w 1</text><text x="250" y="88">w 1</text><text x="370" y="88">w 5</text><text x="490" y="88">w 3</text>
  </g>
  <!-- node boxes: nums value + prefix distance -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="38" y="74" width="64" height="48"/><rect x="158" y="74" width="64" height="48"/><rect x="278" y="74" width="64" height="48"/>
    <rect x="398" y="74" width="64" height="48"/><rect x="518" y="74" width="64" height="48"/>
  </g>
  <g text-anchor="middle">
    <text x="70" y="95" font-size="15" font-weight="600" fill="#1a2026">1</text><text x="70" y="112" fill="#5c6b76" font-size="10.5">dist 0</text>
    <text x="190" y="95" font-size="15" font-weight="600" fill="#4169E1">1</text><text x="190" y="112" fill="#5c6b76" font-size="10.5">dist 1</text>
    <text x="310" y="95" font-size="15" font-weight="600" fill="#1a2026">3</text><text x="310" y="112" fill="#5c6b76" font-size="10.5">dist 2</text>
    <text x="430" y="95" font-size="15" font-weight="600" fill="#4169E1">1</text><text x="430" y="112" fill="#5c6b76" font-size="10.5">dist 7</text>
    <text x="550" y="95" font-size="15" font-weight="600" fill="#1a2026">0</text><text x="550" y="112" fill="#5c6b76" font-size="10.5">dist 10</text>
  </g>
  <text x="340" y="148" text-anchor="middle" fill="#5c6b76" font-size="12">value 1 repeats at node 1: second=0, top=1 → repeats again at node 6: second=1, top=2</text>
  <!-- window [second..depth] = path[1..4] -->
  <path d="M 190 176 L 190 168 L 550 168 L 550 176" fill="none" stroke="#4169E1" stroke-width="2"/>
  <path d="M 310 168 L 310 184" fill="none" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="190" y="196" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">second = 1</text>
  <text x="316" y="198" text-anchor="start" fill="#9aa7b2" font-size="12">top = 2</text>
  <text x="370" y="224" text-anchor="middle" fill="#1a2026" font-size="12.5">window [second..depth] = path[1..4]: nodes 1,3,6,8</text>
  <text x="370" y="242" text-anchor="middle" fill="#1a2026" font-size="12.5">values 1,3,1,0 — one duplicate; length = 10 − 1 = <tspan fill="#4169E1" font-weight="600">9</tspan> with 4 nodes</text>
  <text x="340" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Each repeat of 1 pushes top past itself; window [second..depth] tolerates one duplicate.</text>
  <text x="340" y="290" text-anchor="middle" fill="#1a2026" font-size="13">It ends at node 8 with length 9; the tie 1→2→4 uses fewer nodes, so the answer is <tspan fill="#4169E1" font-weight="600">[9, 3]</tspan>.</text>
</svg>
