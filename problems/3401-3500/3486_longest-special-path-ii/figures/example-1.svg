<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[0,1,1],[1,2,3],[1,3,1],[2,4,6],[4,7,2],[3,5,2],[3,6,5],[6,8,3]], nums = [1,1,0,3,1,2,1,1,0]; answer [9,3], winning paths 1-2-4 and 1-3-6-8 (verified by brute force) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="320" y1="44" x2="320" y2="116"/>
    <line x1="320" y1="116" x2="190" y2="188"/>
    <line x1="320" y1="116" x2="450" y2="188"/>
    <line x1="190" y1="188" x2="110" y2="260"/>
    <line x1="110" y1="260" x2="110" y2="332"/>
    <line x1="450" y1="188" x2="390" y2="260"/>
    <line x1="450" y1="188" x2="530" y2="260"/>
    <line x1="530" y1="260" x2="530" y2="332"/>
  </g>
  <!-- path 1 -> 2 -> 4, length 3 + 6 = 9 -->
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="320" y1="116" x2="190" y2="188"/>
    <line x1="190" y1="188" x2="110" y2="260"/>
  </g>
  <!-- path 1 -> 3 -> 6 -> 8, length 1 + 5 + 3 = 9 -->
  <g stroke="#b57f30" stroke-width="3.2">
    <line x1="320" y1="116" x2="450" y2="188"/>
    <line x1="450" y1="188" x2="530" y2="260"/>
    <line x1="530" y1="260" x2="530" y2="332"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="320" cy="44" r="21"/>
    <circle cx="320" cy="116" r="21"/>
    <circle cx="190" cy="188" r="21"/>
    <circle cx="110" cy="260" r="21"/>
  </g>
  <g stroke="#b57f30" stroke-width="2" fill="#f6ecd9">
    <circle cx="450" cy="188" r="21"/>
    <circle cx="530" cy="260" r="21"/>
    <circle cx="530" cy="332" r="21"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="390" cy="260" r="21"/>
    <circle cx="110" cy="332" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="320" y="49">0</text>
    <text x="320" y="121">1</text>
    <text x="190" y="193">2</text>
    <text x="450" y="193">3</text>
    <text x="110" y="265">4</text>
    <text x="390" y="265">5</text>
    <text x="530" y="265">6</text>
    <text x="110" y="337">7</text>
    <text x="530" y="337">8</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="320" y="12">val 1</text>
    <text x="366" y="112">val 1</text>
    <text x="190" y="164">val 0</text>
    <text x="496" y="184">val 3</text>
    <text x="66" y="264">val 1</text>
    <text x="390" y="298">val 2</text>
    <text x="576" y="264">val 1</text>
    <text x="156" y="336">val 1</text>
    <text x="576" y="336">val 0</text>
  </g>
  <g fill="#5c6b76" font-size="12" font-weight="600" text-anchor="middle">
    <text x="338" y="84">1</text>
    <text x="238" y="150">3</text>
    <text x="438" y="160">1</text>
    <text x="138" y="216">6</text>
    <text x="92" y="300">2</text>
    <text x="406" y="216">2</text>
    <text x="500" y="216">5</text>
    <text x="512" y="300">3</text>
  </g>
  <text x="184" y="304" fill="#5c6b76" font-size="11.5">value 1 repeats here — one repeat is allowed</text>
  <text x="320" y="388" text-anchor="middle" fill="#1a2026" font-size="13.5">longest special paths (length <tspan fill="#4169E1" font-weight="700">9</tspan>): <tspan fill="#4169E1" font-weight="700">1 → 2 → 4</tspan> and <tspan fill="#7a5a1e" font-weight="700">1 → 3 → 6 → 8</tspan> — fewest nodes <tspan fill="#4169E1" font-weight="700">3</tspan></text>
</svg>
