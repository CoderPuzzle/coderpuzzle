<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="348" fill="#ffffff"/>
  <!-- sets = [[1,2],[1],[3,4],[4,5],[5,6],[7]], k = 1; an edge joins two rows whose sets share a value -->
  <!-- component blobs -->
  <g fill="#dbe4fb">
    <rect x="32" y="74" width="120" height="182" rx="14"/>
    <rect x="234" y="74" width="408" height="76" rx="14"/>
    <rect x="234" y="190" width="120" height="84" rx="14"/>
  </g>
  <!-- edges: 0-1 share 1; 2-3 share 4; 3-4 share 5 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="92" y1="134" x2="92" y2="196"/>
    <line x1="338" y1="112" x2="394" y2="112"/>
    <line x1="482" y1="112" x2="538" y2="112"/>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600">
    <text x="100" y="170">share 1</text>
    <text x="366" y="105" text-anchor="middle">share 4</text>
    <text x="510" y="105" text-anchor="middle">share 5</text>
  </g>
  <!-- row nodes -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="48" y="90" width="88" height="44" rx="8"/>
    <rect x="48" y="196" width="88" height="44" rx="8"/>
    <rect x="250" y="90" width="88" height="44" rx="8"/>
    <rect x="394" y="90" width="88" height="44" rx="8"/>
    <rect x="538" y="90" width="88" height="44" rx="8"/>
    <rect x="250" y="206" width="88" height="44" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="92" y="107" fill="#5c6b76" font-size="11.5">row 0</text>
    <text x="92" y="125" fill="#1a2026" font-size="13.5" font-weight="600">{1, 2}</text>
    <text x="92" y="213" fill="#5c6b76" font-size="11.5">row 1</text>
    <text x="92" y="231" fill="#1a2026" font-size="13.5" font-weight="600">{1}</text>
    <text x="294" y="107" fill="#5c6b76" font-size="11.5">row 2</text>
    <text x="294" y="125" fill="#1a2026" font-size="13.5" font-weight="600">{3, 4}</text>
    <text x="438" y="107" fill="#5c6b76" font-size="11.5">row 3</text>
    <text x="438" y="125" fill="#1a2026" font-size="13.5" font-weight="600">{4, 5}</text>
    <text x="582" y="107" fill="#5c6b76" font-size="11.5">row 4</text>
    <text x="582" y="125" fill="#1a2026" font-size="13.5" font-weight="600">{5, 6}</text>
    <text x="294" y="223" fill="#5c6b76" font-size="11.5">row 5</text>
    <text x="294" y="241" fill="#1a2026" font-size="13.5" font-weight="600">{7}</text>
  </g>
  <text x="294" y="264" text-anchor="middle" fill="#9aa7b2" font-size="11.5">shares no value</text>
  <g fill="#4169E1" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="92" y="282">component 1</text>
    <text x="438" y="172">component 2</text>
    <text x="294" y="292">component 3</text>
  </g>
  <text x="330" y="316" text-anchor="middle" fill="#1a2026" font-size="13">Every pair of rows whose sets share a value gets an edge; the sweep marks</text>
  <text x="330" y="334" text-anchor="middle" fill="#1a2026" font-size="13"><tspan fill="#4169E1" font-weight="600">3</tspan> components: {0, 1}, {2, 3, 4}, {5} — the answer is the component count.</text>
</svg>
