<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="364" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- t = "1" + "0100" + "1" = 101001; runs 1|0|1|00|1; cells 52x40, pitch 58, x0=122 -->
  <!-- step arrows -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="486" y1="100" x2="486" y2="146" marker-end="url(#arrow)"/>
    <line x1="486" y1="196" x2="486" y2="242" marker-end="url(#arrow)"/>
  </g>
  <!-- row labels -->
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="112" y="72">augment</text>
    <text x="112" y="168">flip</text>
    <text x="112" y="264">fill</text>
  </g>
  <!-- row A: t -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="122" y="56" width="52" height="40" fill="#f0f3f7" stroke-dasharray="4 3" stroke="#9aa7b2"/>
    <rect x="180" y="56" width="52" height="40" fill="#dbe4fb"/>
    <rect x="238" y="56" width="52" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
    <rect x="296" y="56" width="52" height="40" fill="#dbe4fb"/>
    <rect x="354" y="56" width="52" height="40" fill="#dbe4fb"/>
    <rect x="412" y="56" width="52" height="40" fill="#f0f3f7" stroke-dasharray="4 3" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="148" y="81" fill="#9aa7b2">1</text>
    <text x="206" y="81">0</text>
    <text x="264" y="81">1</text>
    <text x="322" y="81">0</text>
    <text x="380" y="81">0</text>
    <text x="438" y="81" fill="#9aa7b2">1</text>
  </g>
  <g text-anchor="middle" font-size="11.5">
    <text x="148" y="114" fill="#9aa7b2">added</text>
    <text x="206" y="114" fill="#4169E1" font-weight="600">len 1</text>
    <text x="351" y="114" fill="#4169E1" font-weight="600">len 2</text>
    <text x="438" y="114" fill="#9aa7b2">added</text>
  </g>
  <!-- row B: flip the internal 1-run -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="122" y="152" width="52" height="40" fill="#f0f3f7" stroke-dasharray="4 3" stroke="#9aa7b2"/>
    <rect x="180" y="152" width="52" height="40" fill="#dbe4fb"/>
    <rect x="238" y="152" width="52" height="40" fill="#dbe4fb"/>
    <rect x="296" y="152" width="52" height="40" fill="#dbe4fb"/>
    <rect x="354" y="152" width="52" height="40" fill="#dbe4fb"/>
    <rect x="412" y="152" width="52" height="40" fill="#f0f3f7" stroke-dasharray="4 3" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="148" y="177" fill="#9aa7b2">1</text>
    <text x="206" y="177">0</text>
    <text x="264" y="177">0</text>
    <text x="322" y="177">0</text>
    <text x="380" y="177">0</text>
    <text x="438" y="177" fill="#9aa7b2">1</text>
  </g>
  <text x="293" y="212" text-anchor="middle" fill="#5c6b76" font-size="11.5">one merged zero run of 1 + 1 + 2 = 4</text>
  <!-- row C: fill with 1s -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="122" y="248" width="52" height="40" fill="#f0f3f7" stroke-dasharray="4 3" stroke="#9aa7b2"/>
    <rect x="180" y="248" width="52" height="40" fill="#dbe4fb"/>
    <rect x="238" y="248" width="52" height="40" fill="#dbe4fb"/>
    <rect x="296" y="248" width="52" height="40" fill="#dbe4fb"/>
    <rect x="354" y="248" width="52" height="40" fill="#dbe4fb"/>
    <rect x="412" y="248" width="52" height="40" fill="#f0f3f7" stroke-dasharray="4 3" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="148" y="273" fill="#9aa7b2">1</text>
    <text x="206" y="273">1</text>
    <text x="264" y="273">1</text>
    <text x="322" y="273">1</text>
    <text x="380" y="273">1</text>
    <text x="438" y="273" fill="#9aa7b2">1</text>
  </g>
  <text x="293" y="308" text-anchor="middle" fill="#5c6b76" font-size="11.5">the restored 1-run: lasting gain = 1 + 2 = 3</text>
  <text x="310" y="336" text-anchor="middle" fill="#1a2026" font-size="13">Step 1 merges the 1-run into both zero runs; step 2 fills the merged run with 1s.</text>
  <text x="310" y="354" text-anchor="middle" fill="#1a2026" font-size="13">The 1-run comes back, so the gain is <tspan fill="#4169E1" font-weight="600">1 + 2 = 3</tspan> and the answer is 1 + 3 = <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
