<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "12936", d = 3 pass; rows = positions with cnt[0..2] after the remap; banked = cnt[0] + 1 where digit = 3 -->
  <text x="28" y="30" fill="#5c6b76" font-size="12.5">d = 3 pass over s = "12936"</text>
  <!-- accent row = the banking position -->
  <rect x="96" y="170" width="354" height="32" fill="#dbe4fb"/>
  <!-- grid -->
  <g fill="none" stroke="#42525e">
    <rect x="96" y="48" width="354" height="186" stroke-width="1.4"/>
    <line x1="96" y1="74" x2="450" y2="74" stroke-width="1.2"/>
    <g stroke-width="0.7">
      <line x1="96" y1="106" x2="450" y2="106"/><line x1="96" y1="138" x2="450" y2="138"/>
      <line x1="96" y1="170" x2="450" y2="170"/><line x1="96" y1="202" x2="450" y2="202"/>
      <line x1="140" y1="48" x2="140" y2="234"/><line x1="194" y1="48" x2="194" y2="234"/>
      <line x1="254" y1="48" x2="254" y2="234"/><line x1="314" y1="48" x2="314" y2="234"/>
    </g>
    <line x1="374" y1="48" x2="374" y2="234" stroke-width="1"/>
  </g>
  <!-- headers -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="118" y="66">pos</text><text x="167" y="66">digit</text>
    <text x="224" y="66">cnt[0]</text><text x="284" y="66">cnt[1]</text><text x="344" y="66">cnt[2]</text>
    <text x="412" y="66">banked</text>
  </g>
  <!-- rows -->
  <g text-anchor="middle">
    <text x="118" y="95" fill="#9aa7b2" font-size="12">1</text>
    <text x="167" y="95" fill="#1a2026" font-size="14">1</text>
    <text x="224" y="95" fill="#1a2026" font-size="14">0</text><text x="284" y="95" fill="#1a2026" font-size="14">1</text><text x="344" y="95" fill="#1a2026" font-size="14">0</text>
    <text x="412" y="95" fill="#9aa7b2" font-size="13">0</text>
    <text x="118" y="127" fill="#9aa7b2" font-size="12">2</text>
    <text x="167" y="127" fill="#1a2026" font-size="14">2</text>
    <text x="224" y="127" fill="#1a2026" font-size="14">1</text><text x="284" y="127" fill="#1a2026" font-size="14">0</text><text x="344" y="127" fill="#1a2026" font-size="14">1</text>
    <text x="412" y="127" fill="#9aa7b2" font-size="13">0</text>
    <text x="118" y="159" fill="#9aa7b2" font-size="12">3</text>
    <text x="167" y="159" fill="#1a2026" font-size="14">9</text>
    <text x="224" y="159" fill="#1a2026" font-size="14">2</text><text x="284" y="159" fill="#1a2026" font-size="14">0</text><text x="344" y="159" fill="#1a2026" font-size="14">1</text>
    <text x="412" y="159" fill="#9aa7b2" font-size="13">0</text>
    <text x="118" y="191" fill="#5c6b76" font-size="12">4</text>
    <text x="167" y="191" fill="#4169E1" font-size="14" font-weight="600">3</text>
    <text x="224" y="191" fill="#1a2026" font-size="14" font-weight="600">3</text><text x="284" y="191" fill="#1a2026" font-size="14" font-weight="600">0</text><text x="344" y="191" fill="#1a2026" font-size="14" font-weight="600">1</text>
    <text x="412" y="191" fill="#4169E1" font-size="14" font-weight="600">+3</text>
    <text x="118" y="223" fill="#9aa7b2" font-size="12">5</text>
    <text x="167" y="223" fill="#1a2026" font-size="14">6</text>
    <text x="224" y="223" fill="#1a2026" font-size="14">4</text><text x="284" y="223" fill="#1a2026" font-size="14">0</text><text x="344" y="223" fill="#1a2026" font-size="14">1</text>
    <text x="412" y="223" fill="#9aa7b2" font-size="13">0</text>
  </g>
  <!-- side notes -->
  <g font-size="12.5">
    <text x="478" y="92" fill="#5c6b76">each position remaps</text>
    <text x="478" y="110" fill="#1a2026" font-weight="600">r &#8594; (10r + digit) mod 3</text>
    <text x="478" y="160" fill="#5c6b76">bank where digit = 3:</text>
    <text x="478" y="178" fill="#1a2026" font-weight="600">add cnt[0] + 1</text>
    <text x="478" y="196" fill="#5c6b76" font-size="12">(10r) mod 3 = r, so</text>
    <text x="478" y="212" fill="#5c6b76" font-size="12">only r = 0 qualifies</text>
  </g>
  <line x1="474" y1="174" x2="456" y2="186" stroke="#4169E1" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrowA)"/>
  <text x="40" y="300" fill="#1a2026" font-size="13">At each position the table remaps r &#8594; (10r + digit) mod 3; where the digit is 3 it</text>
  <text x="40" y="318" fill="#1a2026" font-size="13">banks <tspan fill="#4169E1" font-weight="600">cnt[0] + 1 = 3</tspan>, and the nine per-digit passes sum to the answer <tspan fill="#4169E1" font-weight="600">11</tspan>.</text>
</svg>
