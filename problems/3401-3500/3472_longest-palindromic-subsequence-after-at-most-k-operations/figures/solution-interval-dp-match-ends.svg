<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = a b c e d, indices 0-4; cells 40px from x=198; ends s[1]=b and s[4]=d match at dist(b,d)=2;
       funnel rows = intervals by length, dp values at budget c = 2 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="198" y="36" width="40" height="40"/><rect x="290" y="36" width="40" height="40"/><rect x="336" y="36" width="40" height="40"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <rect x="244" y="36" width="40" height="40"/><rect x="382" y="36" width="40" height="40"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#1a2026">
    <text x="218" y="61">a</text><text x="264" y="61" font-weight="600">b</text><text x="310" y="61">c</text><text x="356" y="61">e</text><text x="402" y="61" font-weight="600">d</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#9aa7b2">
    <text x="218" y="90">0</text><text x="264" y="90">1</text><text x="310" y="90">2</text><text x="356" y="90">3</text><text x="402" y="90">4</text>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="1.8">
    <path d="M 262 96 Q 280 130 294 82" marker-end="url(#arrow)"/>
    <path d="M 402 96 Q 350 134 326 82" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="11.5" font-weight="600" text-anchor="middle">
    <text x="277" y="128">1</text><text x="357" y="130">1</text>
  </g>
  <text x="452" y="112" fill="#1a2026" font-size="12">dist(b, d) = 1 + 1 = 2 &#8804; k = 2</text>
  <text x="310" y="152" text-anchor="middle" fill="#1a2026" font-size="13">match ends: dp[1][4][2] = dp[2][3][0] + 2 = 1 + 2 = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="310" y="172" text-anchor="middle" fill="#5c6b76" font-size="11.5">inner ce with no budget left keeps one char &#8212; dp[2][3][0] = 1</text>
  <g text-anchor="end" font-size="11" fill="#5c6b76">
    <text x="100" y="204">len 1</text><text x="100" y="228">len 2</text><text x="100" y="252">len 3</text><text x="100" y="276">len 4</text><text x="100" y="300">len 5</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#1a2026">
    <text x="192" y="204">a:1</text><text x="256" y="204">b:1</text><text x="320" y="204">c:1</text><text x="384" y="204">e:1</text><text x="448" y="204">d:1</text>
    <text x="224" y="228">ab:2</text><text x="288" y="228">bc:2</text><text x="352" y="228">ce:2</text><text x="416" y="228">ed:2</text>
    <text x="256" y="252">abc:3</text><text x="320" y="252">bce:2</text><text x="384" y="252">ced:3</text>
    <text x="288" y="276">abce:3</text><text x="352" y="276" fill="#4169E1" font-weight="600">bced:3</text>
    <text x="320" y="300" fill="#4169E1" font-weight="600" font-size="13">abced:3</text>
  </g>
  <text x="398" y="276" fill="#4169E1" font-size="11">&#8592; +2 match at c = 2</text>
  <text x="310" y="336" text-anchor="middle" fill="#1a2026" font-size="13">dp[i][j][c] gains +2 exactly when the two ends can be bought together within budget c:</text>
  <text x="310" y="356" text-anchor="middle" fill="#1a2026" font-size="13">b and d cost dist = 2 &#8804; k = 2, so dp[1][4][2] = <tspan fill="#4169E1" font-weight="600">1 + 2 = 3</tspan> &#8212; the c&#183;c&#183;c answer.</text>
</svg>
