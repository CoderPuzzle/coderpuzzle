<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="240" fill="#ffffff"/>
  <!-- number line: coord -> x = 60 + 44*coord -->
  <line x1="60" y1="170" x2="560" y2="170" stroke="#1a2026" stroke-width="1.5"/>
  <g stroke="#98a2ac" stroke-width="1.1">
    <line x1="104" y1="164" x2="104" y2="176"/><line x1="148" y1="164" x2="148" y2="176"/>
    <line x1="192" y1="164" x2="192" y2="176"/><line x1="236" y1="164" x2="236" y2="176"/>
    <line x1="280" y1="164" x2="280" y2="176"/><line x1="324" y1="164" x2="324" y2="176"/>
    <line x1="368" y1="164" x2="368" y2="176"/><line x1="412" y1="164" x2="412" y2="176"/>
    <line x1="456" y1="164" x2="456" y2="176"/><line x1="500" y1="164" x2="500" y2="176"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="104" y="190">1</text><text x="148" y="190">2</text><text x="192" y="190">3</text>
    <text x="236" y="190">4</text><text x="280" y="190">5</text><text x="324" y="190">6</text>
    <text x="368" y="190">7</text><text x="412" y="190">8</text><text x="456" y="190">9</text><text x="500" y="190">10</text>
  </g>
  <!-- winning window [3,7) : bags 3..6 -->
  <rect x="192" y="46" width="176" height="124" fill="#e8edfa" opacity="0.55"/>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="192" y1="46" x2="192" y2="170"/>
    <line x1="368" y1="46" x2="368" y2="170"/>
  </g>
  <text x="280" y="40" text-anchor="middle" fill="#4169E1" font-weight="600">window k = 4 ending at r = 6: 2 + 0 + 4 + 4 = 10</text>
  <!-- segments as density bars -->
  <g stroke="#1a2026" stroke-width="1.5">
    <rect x="104" y="130" width="88" height="40" fill="#ffffff"/>
    <rect x="280" y="90" width="44" height="80" fill="#ffffff"/>
    <rect x="412" y="150" width="88" height="20" fill="#ffffff"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="148" y="124" text-anchor="middle">c = 2</text>
    <text x="302" y="84" text-anchor="middle">c = 4</text>
    <text x="456" y="144" text-anchor="middle">c = 1</text>
  </g>
  <!-- second candidate: window starting at l = 5 -->
  <g stroke="#98a2ac" stroke-width="1.4" stroke-dasharray="5 3">
    <line x1="280" y1="60" x2="280" y2="170"/>
    <line x1="456" y1="60" x2="456" y2="170"/>
  </g>
  <text x="368" y="212" text-anchor="middle" fill="#5c6b76" font-size="12.5">candidate starting at l = 5: 4 + 4 + 0 + 0 = 8</text>
  <text x="368" y="230" text-anchor="middle" fill="#5c6b76" font-size="12.5">each segment contributes two alignments — right end at ri, or left end at li</text>
</svg>
