<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="240" fill="#ffffff"/>
  <!-- lanes -->
  <rect x="70" y="34" width="500" height="52" rx="6" fill="#f3f5f7" stroke="#98a2ac"/>
  <rect x="70" y="146" width="500" height="52" rx="6" fill="#f3f5f7" stroke="#98a2ac"/>
  <text x="30" y="64" fill="#5c6b76">lane 1</text>
  <text x="30" y="176" fill="#5c6b76">lane 2</text>
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="140" y="26">mile 0</text><text x="260" y="26">mile 1</text><text x="380" y="26">mile 2</text><text x="500" y="26">mile 3</text>
  </g>
  <!-- mile values -->
  <g text-anchor="middle" fill="#1a2026">
    <text x="140" y="66">1</text><text x="260" y="66">−2</text><text x="380" y="66">−10</text><text x="500" y="66">3</text>
    <text x="140" y="178">−5</text><text x="260" y="178">10</text><text x="380" y="178">0</text><text x="500" y="178">1</text>
  </g>
  <!-- route -->
  <path d="M 140 60 L 214 60 L 246 152 L 354 152 L 466 60 L 500 60" fill="none" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrowA)"/>
  <g fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="150" y="50">enter: +1</text>
    <text x="266" y="128">switch 1: +10</text>
    <text x="392" y="142">stay: +0</text>
    <text x="470" y="94">switch 2: +3</text>
  </g>
  <text x="320" y="226" text-anchor="middle" fill="#4169E1" font-weight="600">both switches spent — total 1 + 10 + 0 + 3 = 14</text>
</svg>
