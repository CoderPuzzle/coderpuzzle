<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[2,2,1,2,2],[2,0,2,2,0],[2,0,1,1,0],[1,0,2,2,2],[2,0,0,2,2]]; cells 36px at (40,48);
       V path = (0,2)(1,3)(2,4) then clockwise turn to (3,3)(4,2); chain boxes 132x32 at x=300 -->
  <g fill="#9aa7b2" font-size="10.5" text-anchor="middle">
    <text x="58" y="42">0</text><text x="94" y="42">1</text><text x="130" y="42">2</text><text x="166" y="42">3</text><text x="202" y="42">4</text>
  </g>
  <g fill="#9aa7b2" font-size="10.5" text-anchor="end">
    <text x="32" y="70">0</text><text x="32" y="106">1</text><text x="32" y="142">2</text><text x="32" y="178">3</text><text x="32" y="214">4</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="40" y="48" width="36" height="36"/><rect x="76" y="48" width="36" height="36"/><rect x="148" y="48" width="36" height="36"/><rect x="184" y="48" width="36" height="36"/>
    <rect x="40" y="84" width="36" height="36"/><rect x="76" y="84" width="36" height="36"/><rect x="112" y="84" width="36" height="36"/><rect x="184" y="84" width="36" height="36"/>
    <rect x="40" y="120" width="36" height="36"/><rect x="76" y="120" width="36" height="36"/><rect x="112" y="120" width="36" height="36"/><rect x="148" y="120" width="36" height="36"/>
    <rect x="40" y="156" width="36" height="36"/><rect x="76" y="156" width="36" height="36"/><rect x="112" y="156" width="36" height="36"/><rect x="184" y="156" width="36" height="36"/>
    <rect x="40" y="192" width="36" height="36"/><rect x="76" y="192" width="36" height="36"/><rect x="148" y="192" width="36" height="36"/><rect x="184" y="192" width="36" height="36"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <rect x="112" y="48" width="36" height="36"/><rect x="148" y="84" width="36" height="36"/><rect x="184" y="120" width="36" height="36"/>
    <rect x="148" y="156" width="36" height="36"/><rect x="112" y="192" width="36" height="36"/>
  </g>
  <polyline points="130,66 166,102 202,138 166,174 130,210" fill="none" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g text-anchor="middle" font-size="13">
    <text x="58" y="71">2</text><text x="94" y="71">2</text><text x="130" y="71" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1</text><text x="166" y="71">2</text><text x="202" y="71">2</text>
    <text x="58" y="107">2</text><text x="94" y="107">0</text><text x="130" y="107">2</text><text x="166" y="107" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2</text><text x="202" y="107">0</text>
    <text x="58" y="143">2</text><text x="94" y="143">0</text><text x="130" y="143">1</text><text x="166" y="143">1</text><text x="202" y="143" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0</text>
    <text x="58" y="179">1</text><text x="94" y="179">0</text><text x="130" y="179">2</text><text x="166" y="179" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2</text><text x="202" y="179">2</text>
    <text x="58" y="215">2</text><text x="94" y="215">0</text><text x="130" y="215" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0</text><text x="166" y="215">2</text><text x="202" y="215">2</text>
  </g>
  <text x="366" y="32" text-anchor="middle" fill="#5c6b76" font-size="11.5">the walk and its S / M table entries</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="300" y="44" width="132" height="32"/><rect x="300" y="96" width="132" height="32"/><rect x="300" y="148" width="132" height="32"/>
    <rect x="300" y="200" width="132" height="32"/><rect x="300" y="252" width="132" height="32"/>
  </g>
  <rect x="300" y="44" width="132" height="32" fill="#dbe4fb" stroke="#1a2026" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="12.5">
    <text x="366" y="64">r0c2 = <tspan font-weight="600">1</tspan></text>
    <text x="366" y="116">r1c3 = <tspan font-weight="600">2</tspan></text>
    <text x="366" y="168">r2c4 = <tspan font-weight="600">0</tspan></text>
    <text x="366" y="220">r3c3 = <tspan font-weight="600">2</tspan></text>
    <text x="366" y="272">r4c2 = <tspan font-weight="600">0</tspan></text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 366 76 L 366 94" marker-end="url(#arrow)"/>
    <path d="M 366 128 L 366 146" marker-end="url(#arrow)"/>
    <path d="M 366 180 L 366 198" marker-end="url(#arrow)"/>
    <path d="M 366 232 L 366 250" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600">
    <text x="374" y="90">2</text><text x="374" y="142">0</text><text x="374" y="194">2</text><text x="374" y="246">0</text>
  </g>
  <text x="356" y="194" text-anchor="end" fill="#5c6b76" font-size="10.5">clockwise turn</text>
  <g font-size="12" fill="#4169E1">
    <text x="442" y="64" fill="#1a2026">head</text>
    <text x="442" y="116">M[2][SE] = <tspan font-weight="600">4</tspan></text>
    <text x="442" y="168">M[0][SE] = <tspan font-weight="600">3</tspan></text>
    <text x="442" y="220">S[2][SW] = <tspan font-weight="600">2</tspan></text>
    <text x="442" y="272">S[0][SW] = <tspan font-weight="600">1</tspan></text>
  </g>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">The 1 head at (0,2) finds M[2][SE] = 4 at its (1,3) neighbor: <tspan fill="#4169E1" font-weight="600">1 + 4 = 5</tspan>.</text>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">The longest V walks values 1, 2, 0, 2, 0, turning clockwise once at (2,4).</text>
</svg>
