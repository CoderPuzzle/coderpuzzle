<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="312" fill="#ffffff"/>
  <!-- nums = [2,0,2]; queries q0 = [0,2,1], q1 = [0,2,1], q2 = [1,1,3]; cells = reachable subset sums 0..target; accent = target reached, gray = already done -->
  <text x="330" y="28" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">nums = [2,0,2] — reachable subset sums per index as queries stream</text>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">
    <text x="187" y="52">k = 0</text><text x="317" y="52">after q0</text><text x="447" y="52">after q1</text><text x="577" y="52">after q2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="187" y="68">no items</text><text x="317" y="68">[0,2] val 1</text><text x="447" y="68">[0,2] val 1</text><text x="577" y="68">[1,1] val 3</text>
  </g>
  <g text-anchor="start" fill="#5c6b76" font-size="12">
    <text x="16" y="106">idx 0 (target 2)</text>
    <text x="16" y="158">idx 1 (target 0)</text>
    <text x="16" y="210">idx 2 (target 2)</text>
  </g>
  <!-- row idx 0 -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="128" y="80" width="118" height="44" fill="#ffffff"/>
    <rect x="258" y="80" width="118" height="44" fill="#ffffff"/>
    <rect x="388" y="80" width="118" height="44" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="518" y="80" width="118" height="44" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="187" y="107" fill="#1a2026">{0}</text>
    <text x="317" y="107" fill="#1a2026">{0,1}</text>
    <text x="447" y="107" fill="#4169E1" font-weight="600">{0,1,2}</text>
    <text x="577" y="107" fill="#9aa7b2" font-size="12">done</text>
  </g>
  <!-- row idx 1 -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="128" y="132" width="118" height="44" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="258" y="132" width="118" height="44" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="388" y="132" width="118" height="44" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="518" y="132" width="118" height="44" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="187" y="159" fill="#4169E1" font-weight="600">{0}</text>
    <text x="317" y="159" fill="#9aa7b2" font-size="12">done</text>
    <text x="447" y="159" fill="#9aa7b2" font-size="12">done</text>
    <text x="577" y="159" fill="#9aa7b2" font-size="12">done</text>
  </g>
  <!-- row idx 2 -->
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="128" y="184" width="118" height="44" fill="#ffffff"/>
    <rect x="258" y="184" width="118" height="44" fill="#ffffff"/>
    <rect x="388" y="184" width="118" height="44" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="518" y="184" width="118" height="44" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="187" y="211" fill="#1a2026">{0}</text>
    <text x="317" y="211" fill="#1a2026">{0,1}</text>
    <text x="447" y="211" fill="#4169E1" font-weight="600">{0,1,2}</text>
    <text x="577" y="211" fill="#9aa7b2" font-size="12">done</text>
  </g>
  <!-- answer bracket under the after-q1 column -->
  <path d="M 388 236 L 388 244 L 506 244 L 506 236" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="447" y="263" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">answer k = 2</text>
  <text x="330" y="288" text-anchor="middle" fill="#1a2026" font-size="13">Index 1's target 0 is reachable from the start; indices 0 and 2 complete exactly at k = 2.</text>
  <text x="330" y="306" text-anchor="middle" fill="#1a2026" font-size="13">The first all-done prefix is <tspan fill="#4169E1" font-weight="600">k = 2</tspan>; query 2 [1,1,3] is never needed.</text>
</svg>
