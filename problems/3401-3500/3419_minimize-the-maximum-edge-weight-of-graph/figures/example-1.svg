<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="440" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- kept edges -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="107" y1="71" x2="193" y2="129" marker-end="url(#arrowI)"/>
    <line x1="313" y1="209" x2="227" y2="151" marker-end="url(#arrowI)"/>
    <line x1="110" y1="220" x2="310" y2="220" marker-end="url(#arrowI)"/>
    <line x1="310" y1="60" x2="110" y2="60" marker-end="url(#arrowI)"/>
  </g>
  <!-- removed edge -->
  <line x1="313" y1="71" x2="227" y2="129" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrowA)"/>
  <!-- nodes -->
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <circle cx="90" cy="60" r="17"/>
    <circle cx="330" cy="60" r="17"/>
    <circle cx="330" cy="220" r="17"/>
    <circle cx="90" cy="220" r="17"/>
  </g>
  <circle cx="210" cy="140" r="17" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="90" y="65">1</text>
    <text x="330" y="65">2</text>
    <text x="330" y="225">3</text>
    <text x="90" y="225">4</text>
    <text x="210" y="145" fill="#4169E1">0</text>
  </g>
  <!-- weights -->
  <g font-size="13" fill="#1a2026">
    <text x="140" y="94">1</text>
    <text x="278" y="192">1</text>
    <text x="204" y="212">1</text>
    <text x="204" y="52">1</text>
  </g>
  <text x="268" y="90" font-size="13" fill="#4169E1" font-weight="600">2</text>
  <text x="292" y="114" font-size="12" fill="#4169E1">removed</text>
  <text x="220" y="272" text-anchor="middle" font-size="12.5" fill="#5c6b76">Removing 2 → 0 leaves only weight-1 edges;</text>
  <text x="220" y="288" text-anchor="middle" font-size="12.5" fill="#5c6b76">every node still reaches 0 with at most 2 outgoing edges.</text>
</svg>
