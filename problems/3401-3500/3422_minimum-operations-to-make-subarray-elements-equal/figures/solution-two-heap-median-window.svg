<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <!-- nums = [4,-3,2,1,-4,6], k = 3; cells 64x40 at x = 108 + 72i, y = 54;
       best window nums[1..3] = [-3,2,1]: low max-heap {-3, 1}, high min-heap {2} -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="108" y="54" width="64" height="40"/><rect x="396" y="54" width="64" height="40"/>
    <rect x="468" y="54" width="64" height="40"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="180" y="54" width="64" height="40"/><rect x="252" y="54" width="64" height="40"/>
    <rect x="324" y="54" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="140" y="79" fill="#1a2026">4</text><text x="212" y="79" fill="#1a2026">-3</text>
    <text x="284" y="79" fill="#1a2026">2</text><text x="356" y="79" fill="#1a2026">1</text>
    <text x="428" y="79" fill="#1a2026">-4</text><text x="500" y="79" fill="#1a2026">6</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.4" fill="none">
    <path d="M 180 100 v 6 H 388 v -6"/>
  </g>
  <text x="284" y="124" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">best window [-3, 2, 1]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="250" y="158">low &#8212; max-heap</text>
    <text x="450" y="158">high &#8212; min-heap</text>
  </g>
  <rect x="222" y="166" width="56" height="30" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="222" y="198" width="56" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <rect x="422" y="166" width="56" height="30" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <g text-anchor="middle" font-weight="600">
    <text x="250" y="186" fill="#4169E1">1</text><text x="250" y="218" fill="#1a2026">-3</text>
    <text x="450" y="186" fill="#1a2026">2</text>
  </g>
  <text x="288" y="186" fill="#4169E1" font-size="11.5" font-weight="600">median = top of low</text>
  <text x="320" y="260" text-anchor="middle" fill="#1a2026" font-size="13">cost = (median&#183;|low| - sumLow) + (sumHigh - median&#183;|high|)</text>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">= (1&#183;2 - (-2)) + (2 - 1&#183;1) = 4 + 1 = <tspan fill="#4169E1" font-weight="600">5</tspan></text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">The four windows cost 7, 5, 6, 10 &#8212; the cheapest equalizes at its median for <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
</svg>
