<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="350" fill="#ffffff"/>
  <!-- words = [jump,run,run,jump,run], k = 2; top chain = jump subtree (cnt 2, top1), bottom chain = run subtree (cnt 3, top2); dashed box = struck path of one removed 'run' -->
  <text x="20" y="26" text-anchor="start" fill="#1a2026" font-size="13" font-weight="600">words = [jump, run, run, jump, run], k = 2 — circles show cnt</text>
  <g>
    <circle cx="452" cy="18" r="8" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="466" y="22" text-anchor="start" fill="#5c6b76" font-size="11.5">top1[d] — best cnt ≥ k node</text>
    <circle cx="452" cy="38" r="8" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="466" y="42" text-anchor="start" fill="#5c6b76" font-size="11.5">top2[d] — next cnt ≥ k node</text>
  </g>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 126 156 L 199 112"/>
    <path d="M 126 180 L 199 220"/>
    <path d="M 244 100 H 311"/>
    <path d="M 359 100 H 426"/>
    <path d="M 474 100 H 541"/>
    <path d="M 244 232 H 311"/>
    <path d="M 359 232 H 426"/>
  </g>
  <!-- struck path of the removed word -->
  <rect x="186" y="200" width="300" height="64" rx="10" fill="none" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="186" y="192" text-anchor="start" fill="#9aa7b2" font-size="11.5">strike one 'run' (words[1]): cnt −1 along this path</text>
  <!-- root -->
  <g text-anchor="middle">
    <circle cx="105" cy="168" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="105" y="164" fill="#5c6b76" font-size="10.5">root</text>
    <text x="105" y="182" font-size="15" font-weight="600" fill="#1a2026">5</text>
  </g>
  <!-- depth labels, jump chain -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="220" y="58">d1</text><text x="335" y="58">d2</text><text x="450" y="58">d3</text><text x="565" y="58">d4</text>
  </g>
  <!-- jump chain: top1, cnt 2 -->
  <g text-anchor="middle">
    <circle cx="220" cy="100" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <circle cx="335" cy="100" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <circle cx="450" cy="100" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <circle cx="565" cy="100" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.5"/>
    <text x="220" y="96" fill="#4169E1" font-size="10.5">j</text><text x="220" y="112" font-size="15" font-weight="600" fill="#4169E1">2</text>
    <text x="335" y="96" fill="#4169E1" font-size="10.5">u</text><text x="335" y="112" font-size="15" font-weight="600" fill="#4169E1">2</text>
    <text x="450" y="96" fill="#4169E1" font-size="10.5">m</text><text x="450" y="112" font-size="15" font-weight="600" fill="#4169E1">2</text>
    <text x="565" y="96" fill="#4169E1" font-size="10.5">p</text><text x="565" y="112" font-size="15" font-weight="600" fill="#4169E1">2</text>
  </g>
  <text x="565" y="142" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">deepest witness: answer 4</text>
  <!-- run chain: top2, cnt 3 -->
  <g text-anchor="middle">
    <circle cx="220" cy="232" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <circle cx="335" cy="232" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <circle cx="450" cy="232" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="220" y="228" fill="#5c6b76" font-size="10.5">r</text><text x="220" y="244" font-size="15" font-weight="600" fill="#1a2026">3</text>
    <text x="335" y="228" fill="#5c6b76" font-size="10.5">u</text><text x="335" y="244" font-size="15" font-weight="600" fill="#1a2026">3</text>
    <text x="450" y="228" fill="#5c6b76" font-size="10.5">n</text><text x="450" y="244" font-size="15" font-weight="600" fill="#1a2026">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="220" y="282">d1</text><text x="335" y="282">d2</text><text x="450" y="282">d3</text>
  </g>
  <text x="340" y="316" text-anchor="middle" fill="#1a2026" font-size="13">Removing a 'run' strikes its r-u-n path; top1 (cnt 2 ≥ k) stays off it at every depth 1–4.</text>
  <text x="340" y="334" text-anchor="middle" fill="#1a2026" font-size="13">The deepest witness is jump at <tspan fill="#4169E1" font-weight="600">d4</tspan> → answer <tspan fill="#4169E1" font-weight="600">4</tspan>; removing a jump instead gives 3 via run.</text>
</svg>
