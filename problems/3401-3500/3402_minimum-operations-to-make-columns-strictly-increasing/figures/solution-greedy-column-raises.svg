<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="338" fill="#ffffff"/>
  <!-- grid = [[3,2],[1,3],[3,4],[0,1]]; greedy finals (3,4,5,6) and (2,3,4,5); cells 88x44 at rows y = 60+50i -->
  <text x="320" y="28" text-anchor="middle" fill="#5c6b76" font-size="13">grid = [[3,2],[1,3],[3,4],[0,1]] — greedy per column, top to bottom</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="244" y="50">col 0</text><text x="434" y="50">col 1</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="12">
    <text x="188" y="86">row 0</text><text x="188" y="136">row 1</text>
    <text x="188" y="186">row 2</text><text x="188" y="236">row 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="200" y="60" width="88" height="44" fill="#ffffff"/>
    <rect x="200" y="110" width="88" height="44" fill="#dbe4fb"/>
    <rect x="200" y="160" width="88" height="44" fill="#dbe4fb"/>
    <rect x="200" y="210" width="88" height="44" fill="#dbe4fb"/>
    <rect x="390" y="60" width="88" height="44" fill="#ffffff"/>
    <rect x="390" y="110" width="88" height="44" fill="#ffffff"/>
    <rect x="390" y="160" width="88" height="44" fill="#ffffff"/>
    <rect x="390" y="210" width="88" height="44" fill="#dbe4fb"/>
  </g>
  <!-- cell text: original → final, raise count beneath -->
  <g text-anchor="middle" font-size="14">
    <text x="244" y="80"><tspan fill="#5c6b76">3</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026" font-weight="600">3</tspan></text>
    <text x="244" y="130"><tspan fill="#5c6b76">1</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026" font-weight="600">4</tspan></text>
    <text x="244" y="180"><tspan fill="#5c6b76">3</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026" font-weight="600">5</tspan></text>
    <text x="244" y="230"><tspan fill="#5c6b76">0</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026" font-weight="600">6</tspan></text>
    <text x="434" y="80"><tspan fill="#5c6b76">2</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026" font-weight="600">2</tspan></text>
    <text x="434" y="130"><tspan fill="#5c6b76">3</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026" font-weight="600">3</tspan></text>
    <text x="434" y="180"><tspan fill="#5c6b76">4</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026" font-weight="600">4</tspan></text>
    <text x="434" y="230"><tspan fill="#5c6b76">1</tspan><tspan fill="#9aa7b2"> → </tspan><tspan fill="#1a2026" font-weight="600">5</tspan></text>
  </g>
  <g text-anchor="middle" font-size="11.5">
    <text x="244" y="97" fill="#9aa7b2">+0</text><text x="244" y="147" fill="#4169E1">+3</text>
    <text x="244" y="197" fill="#4169E1">+2</text><text x="244" y="247" fill="#4169E1">+6</text>
    <text x="434" y="97" fill="#9aa7b2">+0</text><text x="434" y="147" fill="#9aa7b2">+0</text>
    <text x="434" y="197" fill="#9aa7b2">+0</text><text x="434" y="247" fill="#4169E1">+4</text>
  </g>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">raise counts 3 + 2 + 6 + 4 = <tspan fill="#4169E1" font-weight="600">15</tspan> operations</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">each cell ends at max(value, final above + 1); the greedy finals (3,4,5,6) and</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">(2,3,4,5) are the pointwise-minimum strictly increasing columns.</text>
</svg>
