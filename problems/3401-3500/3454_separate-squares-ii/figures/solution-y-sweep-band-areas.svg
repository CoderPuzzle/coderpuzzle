<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- squares=[[0,0,1],[2,2,1]]; events: y=0 add [0,1] (w 1), y=1 remove [0,1] (w 0), y=2 add [2,3] (w 1), y=3 remove;
       bands: (0,1) += 1, (1,2) += 0, (2,3) += 1 -> total 2; half is hit in band (0,1): y = 0 + (2-0)/(2*1) = 1;
       70 px per unit, world (0,0) at px (62,280) -->
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="62" y1="60" x2="62" y2="286"/>
    <line x1="62" y1="286" x2="300" y2="286"/>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="54" y="214">1</text>
    <text x="54" y="144">2</text>
    <text x="54" y="74">3</text>
  </g>
  <!-- band separators at y = 2 and y = 3 -->
  <g stroke="#9aa7b2" stroke-width="1" stroke-dasharray="5 4">
    <line x1="62" y1="140" x2="300" y2="140"/>
    <line x1="62" y1="70" x2="300" y2="70"/>
  </g>
  <rect x="70" y="210" width="70" height="70" fill="#dbe4fb" stroke="#42525e" stroke-width="1.5"/>
  <rect x="210" y="70" width="70" height="70" fill="#dbe4fb" stroke="#42525e" stroke-width="1.5"/>
  <!-- halving line at y = 1 (top of band (0,1)) -->
  <line x1="55" y1="210" x2="300" y2="210" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="202" fill="#4169E1" font-size="12.5" font-weight="600">halving y = 1</text>
  <text x="172" y="248" fill="#5c6b76" font-size="12">width 1 &#8594; area 1</text>
  <text x="180" y="180" text-anchor="middle" fill="#9aa7b2" font-size="12">width 0</text>
  <text x="66" y="100" fill="#5c6b76" font-size="12">width 1 &#8594; area 1</text>
  <!-- sweep table -->
  <text x="340" y="64" fill="#1a2026" font-size="13" font-weight="600">y-sweep: apply events, then measure the band</text>
  <g fill="#5c6b76" font-size="12.5">
    <text x="340" y="94">y = 0: add [0,1] &#8594; width 1</text>
    <text x="340" y="142">y = 1: remove [0,1] &#8594; width 0</text>
    <text x="340" y="190">y = 2: add [2,3] &#8594; width 1</text>
  </g>
  <g fill="#9aa7b2" font-size="12">
    <text x="340" y="116">band (0,1): area += 1&#183;1 = 1 &#8594; running 1</text>
    <text x="340" y="164">band (1,2): +0 &#8594; running 1</text>
    <text x="340" y="212">band (2,3): area += 1 &#8594; running 2 = total</text>
  </g>
  <text x="340" y="252" fill="#4169E1" font-size="13" font-weight="600">half of 2 is reached in band (0, 1):</text>
  <text x="340" y="274" fill="#1a2026" font-size="12.5">y = 0 + (2 &#8722; 2&#183;0) / (2&#183;1) = 1.00000</text>
  <text x="320" y="322" text-anchor="middle" fill="#1a2026" font-size="13">The sweep applies each bottom/top event and holds the union width per band &#8212; 1, 0, 1 &#8212;</text>
  <text x="320" y="340" text-anchor="middle" fill="#1a2026" font-size="13">so the running area first reaches half of 2 at <tspan fill="#4169E1" font-weight="600">y = 1.00000</tspan>, the top of band (0, 1).</text>
</svg>
