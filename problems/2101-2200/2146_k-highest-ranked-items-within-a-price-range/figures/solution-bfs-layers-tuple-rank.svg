<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="292" fill="#ffffff"/>
  <!-- grid = [[1,2,0,1],[1,3,0,1],[0,2,5,1]]; start (0,0), pricing [2,5], k = 3; cells 62x46 at (40,64); cells show grid values, in-range items annotated with BFS distance + price; ranked by (distance, price, row, col), first 3 kept -->
  <text x="40" y="38" fill="#5c6b76" font-size="12.5">start (<tspan fill="#1a2026" font-weight="600">0,0</tspan>) · pricing [<tspan fill="#4169E1" font-weight="600">2,5</tspan>] · <tspan fill="#1a2026" font-weight="600">k = 3</tspan></text>
  <g stroke="#42525e" stroke-width="1.4">
    <g fill="#ffffff">
      <rect x="40" y="64" width="62" height="46"/>
      <rect x="226" y="64" width="62" height="46"/>
      <rect x="40" y="110" width="62" height="46"/>
      <rect x="226" y="110" width="62" height="46"/>
      <rect x="226" y="156" width="62" height="46"/>
    </g>
    <g fill="#dbe4fb">
      <rect x="102" y="64" width="62" height="46"/>
      <rect x="102" y="110" width="62" height="46"/>
      <rect x="102" y="156" width="62" height="46"/>
      <rect x="164" y="156" width="62" height="46"/>
    </g>
    <g fill="#9aa7b2">
      <rect x="164" y="64" width="62" height="46"/>
      <rect x="164" y="110" width="62" height="46"/>
      <rect x="40" y="156" width="62" height="46"/>
    </g>
  </g>
  <text x="71" y="94" text-anchor="middle" fill="#4169E1" font-size="16" font-weight="700">S</text>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#5c6b76">
    <text x="257" y="92">1</text>
    <text x="71" y="138">1</text>
    <text x="257" y="138">1</text>
    <text x="257" y="184">1</text>
  </g>
  <g text-anchor="middle">
    <g font-size="15" font-weight="600" fill="#1a2026">
      <text x="133" y="85">1</text>
      <text x="133" y="131">2</text>
      <text x="133" y="177">3</text>
      <text x="195" y="177">4</text>
    </g>
    <g font-size="10.5" fill="#4169E1">
      <text x="133" y="102">price 2</text>
      <text x="133" y="148">price 3</text>
      <text x="133" y="194">price 2</text>
      <text x="195" y="194">price 5</text>
    </g>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="700">
    <circle cx="108" cy="70" r="9" fill="#4169E1"/><text x="108" y="74" fill="#ffffff">1</text>
    <circle cx="108" cy="116" r="9" fill="#4169E1"/><text x="108" y="120" fill="#ffffff">2</text>
    <circle cx="108" cy="162" r="9" fill="#4169E1"/><text x="108" y="166" fill="#ffffff">3</text>
    <circle cx="170" cy="162" r="9" fill="#9aa7b2"/><text x="170" y="166" fill="#ffffff">4</text>
  </g>
  <rect x="40" y="210" width="12" height="12" fill="#9aa7b2"/>
  <text x="58" y="220" fill="#5c6b76" font-size="11.5">wall</text>
  <rect x="104" y="210" width="12" height="12" fill="#dbe4fb" stroke="#42525e" stroke-width="1"/>
  <text x="122" y="220" fill="#5c6b76" font-size="11.5">item, price in [2,5]</text>
  <!-- rank tuples, sorted -->
  <text x="330" y="56" fill="#1a2026" font-size="12.5" font-weight="600">rank tuples (distance, price, row, col)</text>
  <g font-size="13">
    <text x="334" y="84" fill="#5c6b76" font-weight="600">1.</text><text x="358" y="84" fill="#1a2026">(1, 2, 0, 1)</text><text x="496" y="84" fill="#4169E1" font-weight="600">→ (0, 1)</text>
    <text x="334" y="112" fill="#5c6b76" font-weight="600">2.</text><text x="358" y="112" fill="#1a2026">(2, 3, 1, 1)</text><text x="496" y="112" fill="#4169E1" font-weight="600">→ (1, 1)</text>
    <text x="334" y="140" fill="#5c6b76" font-weight="600">3.</text><text x="358" y="140" fill="#1a2026">(3, 2, 2, 1)</text><text x="496" y="140" fill="#4169E1" font-weight="600">→ (2, 1)</text>
    <text x="334" y="180" fill="#9aa7b2" font-weight="600">4.</text><text x="358" y="180" fill="#9aa7b2">(4, 5, 2, 2)</text><text x="496" y="180" fill="#9aa7b2">→ (2, 2)</text>
  </g>
  <path d="M 330 154 H 600" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <text x="600" y="149" text-anchor="end" fill="#4169E1" font-size="11.5" font-weight="600">k = 3</text>
  <text x="340" y="250" text-anchor="middle" fill="#1a2026" font-size="13">BFS from (0,0) layers the grid by distance; the four in-range items yield tuples</text>
  <text x="340" y="270" text-anchor="middle" fill="#1a2026" font-size="13">sorted by (distance, price, row, col); the first k = 3 kept are <tspan fill="#4169E1" font-weight="600">(0,1), (1,1), (2,1)</tspan>.</text>
</svg>
