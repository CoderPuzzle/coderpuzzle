<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 8, edges 0->3, 0->4, 1->3, 2->4, 2->7, 3->5, 3->6, 3->7, 4->6; circles r=16 at 0:(90,58) 1:(185,58) 2:(300,58) 3:(130,140) 4:(230,140) 5:(80,222) 6:(180,222) 7:(300,222); right panel lists each node's ancestor set at dequeue time, Kahn FIFO order 0,1,2,3,4,5,7,6 -->
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 98.8 76.0 L 119.9 119.3" marker-end="url(#arrow)"/>
    <path d="M 107.3 68.1 L 210.2 128.4" marker-end="url(#arrow)"/>
    <path d="M 173.9 74.6 L 142.8 120.9" marker-end="url(#arrow)"/>
    <path d="M 287.0 73.2 L 244.9 122.5" marker-end="url(#arrow)"/>
    <path d="M 300.0 78.0 L 300.0 199.0" marker-end="url(#arrow)"/>
    <path d="M 119.6 157.1 L 92.0 202.4" marker-end="url(#arrow)"/>
    <path d="M 148.0 148.7 L 279.3 212.0" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 140.4 157.1 L 168.0 202.4" marker-end="url(#arrowB)"/>
    <path d="M 219.6 157.1 L 192.0 202.4" marker-end="url(#arrowB)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="90" cy="58" r="16"/><circle cx="185" cy="58" r="16"/><circle cx="300" cy="58" r="16"/>
    <circle cx="130" cy="140" r="16"/><circle cx="230" cy="140" r="16"/>
    <circle cx="80" cy="222" r="16"/><circle cx="300" cy="222" r="16"/>
  </g>
  <circle cx="130" cy="140" r="16" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="230" cy="140" r="16" fill="#ffffff" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="180" cy="222" r="16" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600">
    <text x="90" y="63">0</text><text x="185" y="63">1</text><text x="300" y="63">2</text>
    <text x="130" y="145" fill="#4169E1">3</text><text x="230" y="145" fill="#4169E1">4</text>
    <text x="80" y="227">5</text><text x="180" y="227" fill="#4169E1">6</text><text x="300" y="227">7</text>
  </g>
  <!-- fold panel -->
  <line x1="448" y1="46" x2="448" y2="208" stroke="#dbe4fb" stroke-width="1.5"/>
  <text x="470" y="58" fill="#5c6b76" font-size="12.5">fold in Kahn order</text>
  <g font-size="13">
    <text x="470" y="84"><tspan font-weight="600" fill="#1a2026">0</tspan><tspan fill="#5c6b76">  ∅</tspan></text>
    <text x="470" y="101"><tspan font-weight="600" fill="#1a2026">1</tspan><tspan fill="#5c6b76">  ∅</tspan></text>
    <text x="470" y="118"><tspan font-weight="600" fill="#1a2026">2</tspan><tspan fill="#5c6b76">  ∅</tspan></text>
    <text x="470" y="135"><tspan font-weight="600" fill="#1a2026">3</tspan><tspan fill="#1a2026">  {0,1}</tspan></text>
    <text x="470" y="152"><tspan font-weight="600" fill="#1a2026">4</tspan><tspan fill="#1a2026">  {0,2}</tspan></text>
    <text x="470" y="169"><tspan font-weight="600" fill="#1a2026">5</tspan><tspan fill="#1a2026">  {0,1,3}</tspan></text>
    <text x="470" y="186"><tspan font-weight="600" fill="#1a2026">7</tspan><tspan fill="#1a2026">  {0,1,2,3}</tspan></text>
    <text x="470" y="203" font-weight="600" fill="#4169E1">6  {0,1,2,3,4}</text>
  </g>
  <text x="320" y="286" text-anchor="middle" fill="#1a2026" font-size="13">Dequeuing in Kahn order 0,1,2,3,4,5,7,6 — node 6 unions {3} ∪ {0,1} ∪ {4} ∪ {0,2}</text>
  <text x="320" y="306" text-anchor="middle" fill="#1a2026" font-size="13">into <tspan fill="#4169E1" font-weight="600">{0,1,2,3,4}</tspan>: one topological sweep finishes every ancestor row.</text>
</svg>
