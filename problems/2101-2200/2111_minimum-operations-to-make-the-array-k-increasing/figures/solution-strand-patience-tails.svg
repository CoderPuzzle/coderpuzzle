<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- arr [4,1,5,2,6,2], k=3; top cells 48x34 at x=40+52i, tag = strand s = i mod 3; strand rows y=128+52s place each
       element under its own index; rewritten cells arr[3], arr[5] accented; tails pills 26x24 at x=412:
       s0 [4,2]: tails [4]->[2], LNDS 1; s1 [1,6]: [1]->[1,6], LNDS 2; s2 [5,2]: [5]->[2], LNDS 1; total ops 1+0+1 = 2 -->
  <text x="340" y="28" text-anchor="middle" fill="#5c6b76" font-size="12.5">arr = [4, 1, 5, 2, 6, 2], k = 3 — indices split into k strands by i mod 3</text>
  <!-- arr row -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="40" y="44" width="48" height="34"/><rect x="92" y="44" width="48" height="34"/><rect x="144" y="44" width="48" height="34"/>
    <rect x="248" y="44" width="48" height="34"/><rect x="300" y="44" width="48" height="34"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="196" y="44" width="48" height="34"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="300" y="44" width="48" height="34"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600">
    <text x="64" y="66">4</text><text x="116" y="66">1</text><text x="168" y="66">5</text>
    <text x="220" y="66">2</text><text x="272" y="66">6</text><text x="324" y="66">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="64" y="96">s0</text><text x="116" y="96">s1</text><text x="168" y="96">s2</text>
    <text x="220" y="96">s0</text><text x="272" y="96">s1</text><text x="324" y="96">s2</text>
  </g>
  <!-- strand s0: indices 0,3 -->
  <text x="40" y="120" fill="#5c6b76" font-size="12">arr[0::3]</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="40" y="128" width="48" height="30"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="196" y="128" width="48" height="30"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="64" y="148">4</text><text x="220" y="148">2</text>
  </g>
  <text x="370" y="148" fill="#5c6b76" font-size="12">tails</text>
  <rect x="412" y="131" width="26" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <text x="425" y="148" text-anchor="middle" font-size="12.5" fill="#5c6b76">4</text>
  <path d="M 444 143 H 460" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="466" y="131" width="26" height="24" fill="#dbe4fb" stroke="#4169E1"/>
  <text x="479" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">2</text>
  <text x="535" y="148" fill="#1a2026" font-size="12.5">LNDS 1 · rewrite <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <!-- strand s1: indices 1,4 -->
  <text x="92" y="172" fill="#5c6b76" font-size="12">arr[1::3]</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="92" y="180" width="48" height="30"/><rect x="248" y="180" width="48" height="30"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="116" y="200">1</text><text x="272" y="200">6</text>
  </g>
  <text x="370" y="200" fill="#5c6b76" font-size="12">tails</text>
  <rect x="412" y="183" width="26" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <text x="425" y="200" text-anchor="middle" font-size="12.5" fill="#5c6b76">1</text>
  <path d="M 444 195 H 460" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="466" y="183" width="26" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <text x="479" y="200" text-anchor="middle" font-size="12.5" fill="#5c6b76">1</text>
  <rect x="496" y="183" width="26" height="24" fill="#dbe4fb" stroke="#4169E1"/>
  <text x="509" y="200" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">6</text>
  <text x="535" y="200" fill="#1a2026" font-size="12.5">LNDS 2 · rewrite <tspan fill="#9aa7b2">0</tspan></text>
  <!-- strand s2: indices 2,5 -->
  <text x="144" y="224" fill="#5c6b76" font-size="12">arr[2::3]</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="144" y="232" width="48" height="30"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="300" y="232" width="48" height="30"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="168" y="252">5</text><text x="324" y="252">2</text>
  </g>
  <text x="370" y="252" fill="#5c6b76" font-size="12">tails</text>
  <rect x="412" y="235" width="26" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <text x="425" y="252" text-anchor="middle" font-size="12.5" fill="#5c6b76">5</text>
  <path d="M 444 247 H 460" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="466" y="235" width="26" height="24" fill="#dbe4fb" stroke="#4169E1"/>
  <text x="479" y="252" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2026">2</text>
  <text x="535" y="252" fill="#1a2026" font-size="12.5">LNDS 1 · rewrite <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <text x="340" y="290" text-anchor="middle" fill="#1a2026" font-size="13">Each strand keeps its longest non-decreasing subsequence: [4] in [4, 2], [1, 6], [5] in [5, 2].</text>
  <text x="340" y="310" text-anchor="middle" fill="#1a2026" font-size="13">Only arr[3] and arr[5] are rewritten: 1 + 0 + 1 = <tspan fill="#4169E1" font-weight="600">2</tspan> operations.</text>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">A new value replaces the first strictly greater tail (bisect_right), so equal values extend.</text>
</svg>
