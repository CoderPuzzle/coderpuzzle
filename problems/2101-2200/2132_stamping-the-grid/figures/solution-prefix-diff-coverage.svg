<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 278" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="278" fill="#ffffff"/>
  <!-- grid = [[1,0,0,0] x 5 rows], stamp 4x3; cells 34x28; panels at x=70, 265, 460, y=60; occupied-sum test passes only at (0,1) and (1,1); diff-array coverage is 1-2 on every empty cell -->
  <text x="138" y="44" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">grid</text>
  <text x="333" y="44" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">valid 4x3 stamps</text>
  <text x="528" y="44" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">coverage (diff → prefix)</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="87" y="54">0</text><text x="121" y="54">1</text><text x="155" y="54">2</text><text x="189" y="54">3</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="62" y="78">0</text><text x="62" y="106">1</text><text x="62" y="134">2</text><text x="62" y="162">3</text><text x="62" y="190">4</text>
  </g>
  <!-- panel 1: the grid -->
  <g stroke="#42525e" stroke-width="1.2">
    <g fill="#dbe4fb">
      <rect x="70" y="60" width="34" height="28"/><rect x="70" y="88" width="34" height="28"/>
      <rect x="70" y="116" width="34" height="28"/><rect x="70" y="144" width="34" height="28"/>
      <rect x="70" y="172" width="34" height="28"/>
    </g>
    <g fill="#ffffff">
      <rect x="104" y="60" width="34" height="28"/><rect x="138" y="60" width="34" height="28"/><rect x="172" y="60" width="34" height="28"/>
      <rect x="104" y="88" width="34" height="28"/><rect x="138" y="88" width="34" height="28"/><rect x="172" y="88" width="34" height="28"/>
      <rect x="104" y="116" width="34" height="28"/><rect x="138" y="116" width="34" height="28"/><rect x="172" y="116" width="34" height="28"/>
      <rect x="104" y="144" width="34" height="28"/><rect x="138" y="144" width="34" height="28"/><rect x="172" y="144" width="34" height="28"/>
      <rect x="104" y="172" width="34" height="28"/><rect x="138" y="172" width="34" height="28"/><rect x="172" y="172" width="34" height="28"/>
    </g>
  </g>
  <g text-anchor="middle" font-size="13">
    <g fill="#1a2026" font-weight="600">
      <text x="87" y="79">1</text><text x="87" y="107">1</text><text x="87" y="135">1</text><text x="87" y="163">1</text><text x="87" y="191">1</text>
    </g>
    <g fill="#9aa7b2">
      <text x="121" y="79">0</text><text x="155" y="79">0</text><text x="189" y="79">0</text>
      <text x="121" y="107">0</text><text x="155" y="107">0</text><text x="189" y="107">0</text>
      <text x="121" y="135">0</text><text x="155" y="135">0</text><text x="189" y="135">0</text>
      <text x="121" y="163">0</text><text x="155" y="163">0</text><text x="189" y="163">0</text>
      <text x="121" y="191">0</text><text x="155" y="191">0</text><text x="189" y="191">0</text>
    </g>
  </g>
  <!-- panel 2: the two sum-0 top-left corners -->
  <g stroke="#42525e" stroke-width="1.2">
    <g fill="#dbe4fb">
      <rect x="265" y="60" width="34" height="28"/><rect x="265" y="88" width="34" height="28"/>
      <rect x="265" y="116" width="34" height="28"/><rect x="265" y="144" width="34" height="28"/>
      <rect x="265" y="172" width="34" height="28"/>
    </g>
    <g fill="#ffffff">
      <rect x="299" y="60" width="34" height="28"/><rect x="333" y="60" width="34" height="28"/><rect x="367" y="60" width="34" height="28"/>
      <rect x="299" y="88" width="34" height="28"/><rect x="333" y="88" width="34" height="28"/><rect x="367" y="88" width="34" height="28"/>
      <rect x="299" y="116" width="34" height="28"/><rect x="333" y="116" width="34" height="28"/><rect x="367" y="116" width="34" height="28"/>
      <rect x="299" y="144" width="34" height="28"/><rect x="333" y="144" width="34" height="28"/><rect x="367" y="144" width="34" height="28"/>
      <rect x="299" y="172" width="34" height="28"/><rect x="333" y="172" width="34" height="28"/><rect x="367" y="172" width="34" height="28"/>
    </g>
  </g>
  <rect x="299" y="60" width="102" height="112" fill="none" stroke="#4169E1" stroke-width="2.2"/>
  <rect x="299" y="88" width="102" height="112" fill="none" stroke="#5c6b76" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="305" y="76" fill="#4169E1" font-size="12" font-weight="700">A</text>
  <text x="305" y="104" fill="#5c6b76" font-size="12" font-weight="700">B</text>
  <text x="282" y="79" text-anchor="middle" fill="#5c6b76" font-size="13" font-weight="700">×</text>
  <text x="282" y="107" text-anchor="middle" fill="#5c6b76" font-size="13" font-weight="700">×</text>
  <text x="333" y="218" text-anchor="middle" fill="#5c6b76" font-size="11.5">A and B pass the sum-0 test; (0,0) and (1,0) hit occupied cells</text>
  <!-- panel 3: coverage after prefixing the difference array -->
  <g stroke="#42525e" stroke-width="1.2">
    <g fill="#f0f3f7">
      <rect x="460" y="60" width="34" height="28"/><rect x="460" y="88" width="34" height="28"/>
      <rect x="460" y="116" width="34" height="28"/><rect x="460" y="144" width="34" height="28"/>
      <rect x="460" y="172" width="34" height="28"/>
    </g>
    <g fill="#ffffff">
      <rect x="494" y="60" width="34" height="28"/><rect x="528" y="60" width="34" height="28"/><rect x="562" y="60" width="34" height="28"/>
      <rect x="494" y="172" width="34" height="28"/><rect x="528" y="172" width="34" height="28"/><rect x="562" y="172" width="34" height="28"/>
    </g>
    <g fill="#dbe4fb">
      <rect x="494" y="88" width="34" height="28"/><rect x="528" y="88" width="34" height="28"/><rect x="562" y="88" width="34" height="28"/>
      <rect x="494" y="116" width="34" height="28"/><rect x="528" y="116" width="34" height="28"/><rect x="562" y="116" width="34" height="28"/>
      <rect x="494" y="144" width="34" height="28"/><rect x="528" y="144" width="34" height="28"/><rect x="562" y="144" width="34" height="28"/>
    </g>
  </g>
  <g text-anchor="middle" font-size="14">
    <g fill="#9aa7b2">
      <text x="477" y="79">·</text><text x="477" y="107">·</text><text x="477" y="135">·</text><text x="477" y="163">·</text><text x="477" y="191">·</text>
    </g>
    <g fill="#1a2026" font-weight="600">
      <text x="511" y="79">1</text><text x="545" y="79">1</text><text x="579" y="79">1</text>
      <text x="511" y="191">1</text><text x="545" y="191">1</text><text x="579" y="191">1</text>
    </g>
    <g fill="#4169E1" font-weight="700">
      <text x="511" y="107">2</text><text x="545" y="107">2</text><text x="579" y="107">2</text>
      <text x="511" y="135">2</text><text x="545" y="135">2</text><text x="579" y="135">2</text>
      <text x="511" y="163">2</text><text x="545" y="163">2</text><text x="579" y="163">2</text>
    </g>
  </g>
  <text x="330" y="244" text-anchor="middle" fill="#1a2026" font-size="13">Prefix sums pass only at (0,1) and (1,1); both 4x3 stamps avoid the occupied column.</text>
  <text x="330" y="264" text-anchor="middle" fill="#1a2026" font-size="13">The difference-array coverage is <tspan fill="#4169E1" font-weight="600">1</tspan> or <tspan fill="#4169E1" font-weight="600">2</tspan> on every empty cell — all covered, return <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
