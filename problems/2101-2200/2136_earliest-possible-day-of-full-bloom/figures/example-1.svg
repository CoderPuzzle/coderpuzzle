<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">
  <rect width="560" height="220" fill="#ffffff"/>
  <!-- day axis 0..9; column c spans x = 80 + 36c .. 80 + 36c + 36 -->
  <g stroke="#1a2026" stroke-width="1.4">
    <line x1="80" y1="48" x2="446" y2="48"/>
  </g>
  <g fill="#5c6b76" text-anchor="middle">
    <text x="98" y="40">0</text><text x="134" y="40">1</text><text x="170" y="40">2</text>
    <text x="206" y="40">3</text><text x="242" y="40">4</text><text x="278" y="40">5</text>
    <text x="314" y="40">6</text><text x="350" y="40">7</text><text x="386" y="40">8</text>
    <text x="422" y="40">9</text>
  </g>
  <!-- seed 0: plant day 0, grow days 1-2, bloom day 3 -->
  <g>
    <rect x="82" y="62" width="32" height="32" fill="#c9d2d9"/>
    <rect x="118" y="62" width="32" height="32" fill="#c98a2e" fill-opacity="0.35"/>
    <rect x="154" y="62" width="32" height="32" fill="#c98a2e" fill-opacity="0.35"/>
  </g>
  <!-- seed 1: plant days 1-4, grow days 5-7, bloom day 8 -->
  <g>
    <rect x="118" y="107" width="32" height="32" fill="#c9d2d9"/>
    <rect x="154" y="107" width="32" height="32" fill="#c9d2d9"/>
    <rect x="190" y="107" width="32" height="32" fill="#c9d2d9"/>
    <rect x="226" y="107" width="32" height="32" fill="#c9d2d9"/>
    <rect x="262" y="107" width="32" height="32" fill="#c98a2e" fill-opacity="0.35"/>
    <rect x="298" y="107" width="32" height="32" fill="#c98a2e" fill-opacity="0.35"/>
    <rect x="334" y="107" width="32" height="32" fill="#c98a2e" fill-opacity="0.35"/>
  </g>
  <!-- seed 2: plant days 5-7, grow day 8, bloom day 9 -->
  <g>
    <rect x="262" y="152" width="32" height="32" fill="#c9d2d9"/>
    <rect x="298" y="152" width="32" height="32" fill="#c9d2d9"/>
    <rect x="334" y="152" width="32" height="32" fill="#c9d2d9"/>
    <rect x="370" y="152" width="32" height="32" fill="#c98a2e" fill-opacity="0.35"/>
  </g>
  <!-- blooms on days 3, 8, and 9 -->
  <g fill="#e6b84c" stroke="#8a5a2a" stroke-width="0.8">
    <g transform="translate(204,78)">
      <circle cx="0" cy="-6" r="3.4"/><circle cx="5.7" cy="-1.9" r="3.4"/><circle cx="3.5" cy="4.9" r="3.4"/>
      <circle cx="-3.5" cy="4.9" r="3.4"/><circle cx="-5.7" cy="-1.9" r="3.4"/>
      <circle cx="0" cy="0" r="3" fill="#8a5a2a" stroke="none"/>
    </g>
    <g transform="translate(384,123)">
      <circle cx="0" cy="-6" r="3.4"/><circle cx="5.7" cy="-1.9" r="3.4"/><circle cx="3.5" cy="4.9" r="3.4"/>
      <circle cx="-3.5" cy="4.9" r="3.4"/><circle cx="-5.7" cy="-1.9" r="3.4"/>
      <circle cx="0" cy="0" r="3" fill="#8a5a2a" stroke="none"/>
    </g>
    <g transform="translate(420,168)">
      <circle cx="0" cy="-6" r="3.4"/><circle cx="5.7" cy="-1.9" r="3.4"/><circle cx="3.5" cy="4.9" r="3.4"/>
      <circle cx="-3.5" cy="4.9" r="3.4"/><circle cx="-5.7" cy="-1.9" r="3.4"/>
      <circle cx="0" cy="0" r="3" fill="#8a5a2a" stroke="none"/>
    </g>
  </g>
  <g fill="#5c6b76" text-anchor="end">
    <text x="70" y="82">seed 0</text>
    <text x="70" y="127">seed 1</text>
    <text x="70" y="172">seed 2</text>
  </g>
</svg>
