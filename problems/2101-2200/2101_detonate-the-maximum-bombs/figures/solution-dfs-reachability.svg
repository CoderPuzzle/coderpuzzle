<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="292" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="mmute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- bombs = [[1,2,3],[2,3,1],[3,4,2],[4,5,3],[5,6,4]]; nodes: 0 (110,80), 2 (320,80), 4 (530,80), 1 (215,195), 3 (425,195), r = 17; accent = DFS tree from bomb 0 (visit order 1st-5th), muted = the other five edges (2->1, 3->1, 3->2, 4->2, 4->3) -->
  <!-- non-tree edges -->
  <g stroke="#9aa7b2" stroke-width="1.6" marker-end="url(#mmute)">
    <line x1="308" y1="93" x2="227" y2="182"/>
    <line x1="408" y1="195" x2="232" y2="195"/>
    <line x1="411" y1="185" x2="329" y2="95"/>
    <line x1="513" y1="80" x2="337" y2="80"/>
    <line x1="516" y1="91" x2="434" y2="181"/>
  </g>
  <!-- DFS tree edges -->
  <g stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrow)">
    <line x1="122" y1="93" x2="204" y2="183"/>
    <line x1="127" y1="80" x2="303" y2="80"/>
    <line x1="334" y1="91" x2="416" y2="180"/>
    <line x1="439" y1="185" x2="521" y2="95"/>
  </g>
  <!-- bomb nodes, all five reached -->
  <g stroke="#4169E1" stroke-width="1.8" fill="#dbe4fb">
    <circle cx="215" cy="195" r="17"/><circle cx="320" cy="80" r="17"/>
    <circle cx="425" cy="195" r="17"/><circle cx="530" cy="80" r="17"/>
  </g>
  <circle cx="110" cy="80" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.8"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="110" y="85">0</text><text x="215" y="200">1</text><text x="320" y="85">2</text>
    <text x="425" y="200">3</text><text x="530" y="85">4</text>
  </g>
  <!-- visit order -->
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="110" y="48">1st</text><text x="215" y="232">2nd</text><text x="320" y="48">3rd</text>
    <text x="425" y="232">4th</text><text x="530" y="48">5th</text>
  </g>
  <text x="320" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Edge i→j when dist(i,j)² ≤ radius(i)². Starting from bomb 0 the search reaches</text>
  <text x="320" y="280" text-anchor="middle" fill="#1a2026" font-size="13">1 and 2, then 3 via 2, then 4 via 3 — <tspan fill="#4169E1" font-weight="600">all 5 bombs</tspan>, the maximum.</text>
</svg>
