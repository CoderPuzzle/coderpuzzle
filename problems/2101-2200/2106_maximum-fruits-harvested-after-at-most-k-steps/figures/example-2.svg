<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 185" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12">
  <rect width="560" height="185" fill="#ffffff"/>
  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
    <marker id="step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <text x="60" y="34" fill="#5c6b76">count:</text>
  <!-- fruits at positions 0, 4, 5, 6, 7, 10 -->
  <g stroke="#8d99a3" stroke-width="1">
    <line x1="60" y1="90" x2="60" y2="104"/><line x1="220" y1="90" x2="220" y2="104"/>
    <line x1="260" y1="90" x2="260" y2="104"/><line x1="300" y1="90" x2="300" y2="104"/>
    <line x1="340" y1="90" x2="340" y2="104"/><line x1="460" y1="90" x2="460" y2="104"/>
  </g>
  <g fill="#c05046">
    <circle cx="60" cy="76" r="12"/><circle cx="220" cy="76" r="12"/><circle cx="260" cy="76" r="12"/>
    <circle cx="300" cy="76" r="12"/><circle cx="340" cy="76" r="12"/><circle cx="460" cy="76" r="12"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-weight="600" font-size="11">
    <text x="60" y="80">9</text><text x="220" y="80">1</text><text x="260" y="80">7</text>
    <text x="300" y="80">2</text><text x="340" y="80">4</text><text x="460" y="80">9</text>
  </g>
  <!-- number line 0..10 -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="50" y1="110" x2="480" y2="110" marker-end="url(#axis)"/>
  </g>
  <g stroke="#1a2026" stroke-width="1.2">
    <line x1="60" y1="110" x2="60" y2="115"/><line x1="100" y1="110" x2="100" y2="115"/>
    <line x1="140" y1="110" x2="140" y2="115"/><line x1="180" y1="110" x2="180" y2="115"/>
    <line x1="220" y1="110" x2="220" y2="115"/><line x1="260" y1="110" x2="260" y2="115"/>
    <line x1="300" y1="110" x2="300" y2="115"/><line x1="340" y1="110" x2="340" y2="115"/>
    <line x1="380" y1="110" x2="380" y2="115"/><line x1="420" y1="110" x2="420" y2="115"/>
    <line x1="460" y1="110" x2="460" y2="115"/>
  </g>
  <g fill="#5c6b76" text-anchor="middle">
    <text x="60" y="132">0</text><text x="100" y="132">1</text><text x="140" y="132">2</text>
    <text x="180" y="132">3</text><text x="220" y="132">4</text><text x="260" y="132">5</text>
    <text x="300" y="132">6</text><text x="340" y="132">7</text><text x="380" y="132">8</text>
    <text x="420" y="132">9</text><text x="460" y="132">10</text>
  </g>
  <text x="60" y="168" fill="#5c6b76">position:</text>
  <!-- walker at startPos = 5 covering positions 4 through 7 within k = 4 steps -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="260" y1="93" x2="260" y2="104"/>
    <line x1="254" y1="97" x2="266" y2="97"/>
    <line x1="260" y1="104" x2="255" y2="110"/><line x1="260" y1="104" x2="265" y2="110"/>
  </g>
  <circle cx="260" cy="87" r="5" fill="#4169E1"/>
  <line x1="220" y1="140" x2="340" y2="140" stroke="#4169E1" stroke-width="2" marker-start="url(#step)" marker-end="url(#step)"/>
</svg>
