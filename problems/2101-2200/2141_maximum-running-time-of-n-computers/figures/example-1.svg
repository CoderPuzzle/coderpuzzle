<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">
  <rect width="560" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- computer glyphs -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <rect x="52" y="26" width="44" height="32" rx="3"/><rect x="120" y="26" width="44" height="32" rx="3"/>
    <rect x="228" y="26" width="44" height="32" rx="3"/><rect x="296" y="26" width="44" height="32" rx="3"/>
    <rect x="404" y="26" width="44" height="32" rx="3"/><rect x="472" y="26" width="44" height="32" rx="3"/>
  </g>
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="66" y1="58" x2="66" y2="66"/><line x1="82" y1="66" x2="50" y2="66"/>
    <line x1="134" y1="58" x2="134" y2="66"/><line x1="150" y1="66" x2="118" y2="66"/>
    <line x1="242" y1="58" x2="242" y2="66"/><line x1="258" y1="66" x2="226" y2="66"/>
    <line x1="310" y1="58" x2="310" y2="66"/><line x1="326" y1="66" x2="294" y2="66"/>
    <line x1="418" y1="58" x2="418" y2="66"/><line x1="434" y1="66" x2="402" y2="66"/>
    <line x1="486" y1="58" x2="486" y2="66"/><line x1="502" y1="66" x2="470" y2="66"/>
  </g>
  <!-- inserted batteries: charge shown as fill; battery 0 and 2 start at 3, battery 1 keeps 1 -->
  <g stroke="#1a2026" stroke-width="1.4">
    <rect x="50" y="84" width="48" height="18" rx="2" fill="#ffffff"/>
    <rect x="52" y="86" width="44" height="14" fill="#4f9d69"/>
    <rect x="118" y="84" width="48" height="18" rx="2" fill="#ffffff"/>
    <rect x="120" y="86" width="44" height="14" fill="#4f9d69"/>
    <rect x="226" y="84" width="48" height="18" rx="2" fill="#ffffff"/>
    <rect x="228" y="86" width="15" height="14" fill="#4f9d69"/>
    <rect x="294" y="84" width="48" height="18" rx="2" fill="#ffffff"/>
    <rect x="296" y="86" width="44" height="14" fill="#4f9d69"/>
    <rect x="402" y="84" width="48" height="18" rx="2" fill="#ffffff"/>
    <rect x="404" y="86" width="15" height="14" fill="#4f9d69"/>
    <rect x="470" y="84" width="48" height="18" rx="2" fill="#ffffff"/>
    <rect x="472" y="86" width="15" height="14" fill="#4f9d69"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="74" y="97" fill="#ffffff">3</text><text x="142" y="97" fill="#ffffff">3</text>
    <text x="258" y="97" fill="#1a2026">1</text><text x="308" y="97" fill="#ffffff">3</text>
    <text x="434" y="97" fill="#1a2026">1</text><text x="502" y="97" fill="#1a2026">1</text>
  </g>
  <g fill="#5c6b76" text-anchor="middle" font-size="10">
    <text x="74" y="118">battery 0</text><text x="142" y="118">battery 1</text>
    <text x="250" y="118">battery 0</text><text x="318" y="118">battery 2</text>
    <text x="426" y="118">battery 1</text><text x="494" y="118">battery 2</text>
  </g>
  <!-- swaps over time -->
  <g stroke="#4169E1" stroke-width="2">
    <line x1="176" y1="93" x2="218" y2="93" marker-end="url(#arrow)"/>
    <line x1="352" y1="93" x2="394" y2="93" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" text-anchor="middle">
    <text x="197" y="82">2 min</text>
    <text x="373" y="82">1 min</text>
  </g>
  <text x="280" y="160" text-anchor="middle" fill="#4169E1" font-size="12.5">Both computers run simultaneously for 4 minutes</text>
</svg>
