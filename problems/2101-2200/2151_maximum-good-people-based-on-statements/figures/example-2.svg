<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">
  <rect width="560" height="290" fill="#ffffff"/>
  <g stroke="#c8d1d9" stroke-width="1">
    <line x1="186" y1="20" x2="186" y2="270"/>
    <line x1="373" y1="20" x2="373" y2="270"/>
  </g>
  <g fill="#5c6b76" text-anchor="middle">
    <text x="93" y="32">Person 0 is good</text>
    <text x="279" y="32">Person 0 is bad,</text><text x="279" y="46">told the truth</text>
    <text x="466" y="32">Person 0 is bad, lied</text>
  </g>
  <!-- panel 1: person 0 good, person 1 bad -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="93" y1="82" x2="93" y2="108"/><line x1="83" y1="90" x2="103" y2="90"/>
    <line x1="93" y1="108" x2="84" y2="122"/><line x1="93" y1="108" x2="102" y2="122"/>
    <line x1="93" y1="192" x2="93" y2="218"/><line x1="83" y1="200" x2="103" y2="200"/>
    <line x1="93" y1="218" x2="84" y2="232"/><line x1="93" y1="218" x2="102" y2="232"/>
  </g>
  <circle cx="93" cy="68" r="10" fill="#4f9d69"/>
  <circle cx="93" cy="178" r="10" fill="#c05046"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="93" y="142">person 0</text>
    <text x="93" y="256">person 1</text>
  </g>
  <!-- panel 2: person 0 bad and truthful, person 1 bad -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="279" y1="82" x2="279" y2="108"/><line x1="269" y1="90" x2="289" y2="90"/>
    <line x1="279" y1="108" x2="270" y2="122"/><line x1="279" y1="108" x2="288" y2="122"/>
    <line x1="279" y1="192" x2="279" y2="218"/><line x1="269" y1="200" x2="289" y2="200"/>
    <line x1="279" y1="218" x2="270" y2="232"/><line x1="279" y1="218" x2="288" y2="232"/>
  </g>
  <circle cx="279" cy="68" r="10" fill="#c05046"/>
  <circle cx="279" cy="178" r="10" fill="#c05046"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="279" y="142">person 0</text>
    <text x="279" y="256">person 1</text>
  </g>
  <!-- panel 3: person 0 bad and lying, person 1 good -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="466" y1="82" x2="466" y2="108"/><line x1="456" y1="90" x2="476" y2="90"/>
    <line x1="466" y1="108" x2="457" y2="122"/><line x1="466" y1="108" x2="475" y2="122"/>
    <line x1="466" y1="192" x2="466" y2="218"/><line x1="456" y1="200" x2="476" y2="200"/>
    <line x1="466" y1="218" x2="457" y2="232"/><line x1="466" y1="218" x2="475" y2="232"/>
  </g>
  <circle cx="466" cy="68" r="10" fill="#c05046"/>
  <circle cx="466" cy="178" r="10" fill="#4f9d69"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="466" y="142">person 0</text>
    <text x="466" y="256">person 1</text>
  </g>
</svg>
