<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11">
  <rect width="560" height="270" fill="#ffffff"/>
  <g stroke="#c8d1d9" stroke-width="1">
    <line x1="186" y1="20" x2="186" y2="250"/>
    <line x1="373" y1="20" x2="373" y2="250"/>
  </g>
  <g fill="#5c6b76" text-anchor="middle">
    <text x="93" y="32">Person 2 is good</text>
    <text x="279" y="32">Person 2 is bad,</text><text x="279" y="46">told the truth</text>
    <text x="466" y="32">Person 2 is bad, lied</text>
  </g>
  <!-- panel 1: person 2 good, persons 0 and 1 bad -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="93" y1="92" x2="93" y2="118"/><line x1="83" y1="100" x2="103" y2="100"/>
    <line x1="93" y1="118" x2="84" y2="132"/><line x1="93" y1="118" x2="102" y2="132"/>
    <line x1="58" y1="192" x2="58" y2="218"/><line x1="48" y1="200" x2="68" y2="200"/>
    <line x1="58" y1="218" x2="49" y2="232"/><line x1="58" y1="218" x2="67" y2="232"/>
    <line x1="128" y1="192" x2="128" y2="218"/><line x1="118" y1="200" x2="138" y2="200"/>
    <line x1="128" y1="218" x2="119" y2="232"/><line x1="128" y1="218" x2="137" y2="232"/>
  </g>
  <circle cx="93" cy="78" r="10" fill="#4f9d69"/>
  <circle cx="58" cy="178" r="10" fill="#c05046"/>
  <circle cx="128" cy="178" r="10" fill="#c05046"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="93" y="152">person 2</text>
    <text x="58" y="256">person 0</text><text x="128" y="256">person 1</text>
  </g>
  <!-- panel 2: person 2 bad and truthful, persons 0 and 1 bad -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="279" y1="92" x2="279" y2="118"/><line x1="269" y1="100" x2="289" y2="100"/>
    <line x1="279" y1="118" x2="270" y2="132"/><line x1="279" y1="118" x2="288" y2="132"/>
    <line x1="244" y1="192" x2="244" y2="218"/><line x1="234" y1="200" x2="254" y2="200"/>
    <line x1="244" y1="218" x2="235" y2="232"/><line x1="244" y1="218" x2="253" y2="232"/>
    <line x1="314" y1="192" x2="314" y2="218"/><line x1="304" y1="200" x2="324" y2="200"/>
    <line x1="314" y1="218" x2="305" y2="232"/><line x1="314" y1="218" x2="323" y2="232"/>
  </g>
  <circle cx="279" cy="78" r="10" fill="#c05046"/>
  <circle cx="244" cy="178" r="10" fill="#c05046"/>
  <circle cx="314" cy="178" r="10" fill="#c05046"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="279" y="152">person 2</text>
    <text x="244" y="256">person 0</text><text x="314" y="256">person 1</text>
  </g>
  <!-- panel 3: person 2 bad and lying, persons 0 and 1 good -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="466" y1="92" x2="466" y2="118"/><line x1="456" y1="100" x2="476" y2="100"/>
    <line x1="466" y1="118" x2="457" y2="132"/><line x1="466" y1="118" x2="475" y2="132"/>
    <line x1="431" y1="192" x2="431" y2="218"/><line x1="421" y1="200" x2="441" y2="200"/>
    <line x1="431" y1="218" x2="422" y2="232"/><line x1="431" y1="218" x2="440" y2="232"/>
    <line x1="501" y1="192" x2="501" y2="218"/><line x1="491" y1="200" x2="511" y2="200"/>
    <line x1="501" y1="218" x2="492" y2="232"/><line x1="501" y1="218" x2="510" y2="232"/>
  </g>
  <circle cx="466" cy="78" r="10" fill="#c05046"/>
  <circle cx="431" cy="178" r="10" fill="#4f9d69"/>
  <circle cx="501" cy="178" r="10" fill="#4f9d69"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="466" y="152">person 2</text>
    <text x="431" y="256">person 0</text><text x="501" y="256">person 1</text>
  </g>
</svg>
