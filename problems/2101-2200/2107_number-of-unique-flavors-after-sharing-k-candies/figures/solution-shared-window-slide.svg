<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="344" fill="#ffffff"/>
  <!-- candies [1,2,2,3,4,3], k=3; cells 44x30 at x=40+48j; window rows y=64+58r, row r shares candies r..r+2 (dashed outline);
       kept counts: r0 {3:2,4:1} d2; r1 restore 1, drop 3 -> {1,3,4} d3; r2 restore 2, drop 4 (zero) -> {1,2,3} d3; r3 restore 2, drop 3 (zero) -> {1,2} d2; best 3 -->
  <text x="300" y="28" text-anchor="middle" fill="#5c6b76" font-size="12.5">candies [1, 2, 2, 3, 4, 3], k = 3 — the shared window slides one candy per step</text>
  <!-- window outlines -->
  <g fill="none" stroke="#5c6b76" stroke-width="1.4" stroke-dasharray="5 4">
    <rect x="35" y="59" width="150" height="40" rx="8"/>
    <rect x="83" y="117" width="150" height="40" rx="8"/>
    <rect x="131" y="175" width="150" height="40" rx="8"/>
    <rect x="179" y="233" width="150" height="40" rx="8"/>
  </g>
  <!-- row 0: shared 1,2,2 / kept 3,4,3 -->
  <g stroke-width="1.4">
    <rect x="40" y="64" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="88" y="64" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="136" y="64" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="184" y="64" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
    <rect x="232" y="64" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
    <rect x="280" y="64" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="62" y="84" fill="#9aa7b2">1</text><text x="110" y="84" fill="#9aa7b2">2</text><text x="158" y="84" fill="#9aa7b2">2</text>
    <text x="206" y="84" fill="#1a2026">3</text><text x="254" y="84" fill="#1a2026">4</text><text x="302" y="84" fill="#1a2026">3</text>
  </g>
  <text x="346" y="84" fill="#1a2026" font-size="13">distinct 2 · best <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="40" y="110" fill="#5c6b76" font-size="10.5">flavor 1 back: 0 → 1 (+1 distinct) · flavor 3 handed over: 2 → 1 (still positive)</text>
  <!-- row 1: shared 2,2,3 / kept 1,4,3 -->
  <g stroke-width="1.4">
    <rect x="40" y="122" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
    <rect x="88" y="122" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="136" y="122" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="184" y="122" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="232" y="122" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
    <rect x="280" y="122" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="62" y="142" fill="#1a2026">1</text><text x="110" y="142" fill="#9aa7b2">2</text><text x="158" y="142" fill="#9aa7b2">2</text>
    <text x="206" y="142" fill="#9aa7b2">3</text><text x="254" y="142" fill="#1a2026">4</text><text x="302" y="142" fill="#1a2026">3</text>
  </g>
  <text x="346" y="142" fill="#1a2026" font-size="13">distinct 3 · best <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="40" y="168" fill="#5c6b76" font-size="10.5">flavor 2 back: 0 → 1 (+1) · flavor 4 handed over: 1 → 0 (zero crossing, −1)</text>
  <!-- row 2: shared 2,3,4 / kept 1,2,3 -->
  <g stroke-width="1.4">
    <rect x="40" y="180" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
    <rect x="88" y="180" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
    <rect x="136" y="180" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="184" y="180" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="232" y="180" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="280" y="180" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="62" y="200" fill="#1a2026">1</text><text x="110" y="200" fill="#1a2026">2</text><text x="158" y="200" fill="#9aa7b2">2</text>
    <text x="206" y="200" fill="#9aa7b2">3</text><text x="254" y="200" fill="#9aa7b2">4</text><text x="302" y="200" fill="#1a2026">3</text>
  </g>
  <text x="346" y="200" fill="#1a2026" font-size="13">distinct 3 · best <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="40" y="226" fill="#5c6b76" font-size="10.5">flavor 2 back: 1 → 2 (still positive) · flavor 3 handed over: 1 → 0 (zero crossing, −1)</text>
  <!-- row 3: shared 3,4,3 / kept 1,2,2 -->
  <g stroke-width="1.4">
    <rect x="40" y="238" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
    <rect x="88" y="238" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
    <rect x="136" y="238" width="44" height="30" fill="#ffffff" stroke="#42525e"/>
    <rect x="184" y="238" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="232" y="238" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="280" y="238" width="44" height="30" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="62" y="258" fill="#1a2026">1</text><text x="110" y="258" fill="#1a2026">2</text><text x="158" y="258" fill="#1a2026">2</text>
    <text x="206" y="258" fill="#9aa7b2">3</text><text x="254" y="258" fill="#9aa7b2">4</text><text x="302" y="258" fill="#9aa7b2">3</text>
  </g>
  <text x="346" y="258" fill="#1a2026" font-size="13">distinct 2 · best <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="62" y="284">0</text><text x="110" y="284">1</text><text x="158" y="284">2</text>
    <text x="206" y="284">3</text><text x="254" y="284">4</text><text x="302" y="284">5</text>
  </g>
  <text x="300" y="310" text-anchor="middle" fill="#1a2026" font-size="13">The best slice hands over [2, 2, 3] and keeps {1, 3, 4} — <tspan fill="#4169E1" font-weight="600">3</tspan> distinct flavors;</text>
  <text x="300" y="330" text-anchor="middle" fill="#1a2026" font-size="13">the running best, accented, never beats 3.</text>
</svg>
