<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="300" fill="#ffffff"/>
  <!-- round table seating employees 0, 1, 3, and 4 -->
  <circle cx="280" cy="150" r="75" fill="#f4cdd0"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="280" cy="55" r="20"/>
    <circle cx="375" cy="150" r="20"/>
    <circle cx="280" cy="245" r="20"/>
    <circle cx="185" cy="150" r="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="280" y="61">4</text>
    <text x="375" y="156">1</text>
    <text x="280" y="251">0</text>
    <text x="185" y="156">3</text>
  </g>
</svg>
