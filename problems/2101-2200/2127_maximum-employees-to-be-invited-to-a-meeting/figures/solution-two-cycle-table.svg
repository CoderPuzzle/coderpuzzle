<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a97a2"/>
    </marker>
  </defs>
  <!-- table -->
  <ellipse cx="320" cy="150" rx="160" ry="72" fill="#f2f5f9" stroke="#dbe4f6" stroke-width="2"/>
  <text x="320" y="156" text-anchor="middle" fill="#8a97a2" font-size="13">table</text>
  <!-- seated nodes: 0 left, 1 top, 2 right -->
  <circle cx="140" cy="150" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/>
  <text x="140" y="155" text-anchor="middle" font-weight="600">0</text>
  <circle cx="320" cy="66" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/>
  <text x="320" y="71" text-anchor="middle" font-weight="600">1</text>
  <circle cx="500" cy="150" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/>
  <text x="500" y="155" text-anchor="middle" font-weight="600">2</text>
  <!-- favorite arrows: 0->2, 2->1, 1->0 -->
  <path d="M 164 142 Q 320 96 476 142" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 486 130 Q 420 70 342 62" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 298 62 Q 210 70 156 130" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- excluded node 3 -->
  <circle cx="320" cy="268" r="22" fill="#ffffff" stroke="#8a97a2" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="320" y="273" text-anchor="middle" fill="#8a97a2" font-weight="600">3</text>
  <path d="M 340 258 Q 440 220 492 172" fill="none" stroke="#8a97a2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <g stroke="#8a97a2" stroke-width="1.8">
    <line x1="486" y1="128" x2="514" y2="152"/>
  </g>
  <!-- annotations -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="40" y="60">favorite = [2, 2, 1, 2]:</text>
    <text x="40" y="78">1 and 2 are mutual favorites</text>
    <text x="40" y="96">(a 2-cycle), so both seats</text>
    <text x="40" y="114">next to 2 go to 1 and to the</text>
    <text x="40" y="132">longest chain into it — here</text>
    <text x="40" y="150">the single node 0.</text>
    <text x="40" y="196">Employee 3 also favorites 2,</text>
    <text x="40" y="214">but both neighboring seats</text>
    <text x="40" y="232">are taken, so 3 stays out.</text>
  </g>
  <text x="40" y="308" fill="#1a2026" font-size="13">The 2-cycle contributes depth[1] + depth[2] = 1 + 2 = <tspan fill="#4169E1" font-weight="600">3</tspan> seated employees.</text>
</svg>
