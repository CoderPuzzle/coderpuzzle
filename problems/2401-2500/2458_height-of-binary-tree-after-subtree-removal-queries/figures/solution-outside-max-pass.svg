<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="404" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 1 tree [1,3,4,2,null,6,5,null,null,null,null,null,7]; circles r=21 at (320,62),(185,146),(455,146),(115,232),(400,232),(510,232),(460,318); muted = subtree removed by query 4 -->
  <rect x="16" y="14" width="14" height="14" rx="3" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="36" y="25" fill="#1a2026" font-size="12">kept</text>
  <rect x="80" y="14" width="14" height="14" rx="3" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="100" y="25" fill="#5c6b76" font-size="12">removed by query 4</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="302" y1="73" x2="203" y2="135"/>
    <line x1="338" y1="73" x2="437" y2="135"/>
    <line x1="172" y1="162" x2="128" y2="216"/>
    <line x1="444" y1="164" x2="411" y2="214"/>
    <line x1="466" y1="164" x2="499" y2="214"/>
    <line x1="412" y1="249" x2="448" y2="301"/>
  </g>
  <!-- surviving deepest path 1 -> 3 -> 2 after removing 4's subtree -->
  <g stroke="#4169E1" stroke-width="3" stroke-linecap="round">
    <line x1="302" y1="73" x2="203" y2="135"/>
    <line x1="172" y1="162" x2="128" y2="216"/>
  </g>
  <path d="M 338 51 Q 390 18 445 126" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="391" y="32" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">outside(4) = 0 + 1 + h(3) = 2</text>
  <g stroke-width="2">
    <circle cx="320" cy="62" r="21" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="185" cy="146" r="21" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="455" cy="146" r="21" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="115" cy="232" r="21" fill="#dbe4fb" stroke="#4169E1"/>
    <circle cx="400" cy="232" r="21" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="510" cy="232" r="21" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="460" cy="318" r="21" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="320" y="67" fill="#1a2026">1</text><text x="185" y="151" fill="#1a2026">3</text>
    <text x="455" y="151" fill="#5c6b76">4</text><text x="115" y="237" fill="#1a2026">2</text>
    <text x="400" y="237" fill="#5c6b76">6</text><text x="510" y="237" fill="#5c6b76">5</text>
    <text x="460" y="323" fill="#5c6b76">7</text>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="320" y="100" fill="#5c6b76">d 0, h 3</text>
    <text x="185" y="184" fill="#5c6b76">d 1, h 1</text>
    <text x="455" y="184" fill="#9aa7b2">d 1, h 2</text>
    <text x="115" y="270" fill="#5c6b76">d 2, h 0</text>
    <text x="400" y="270" fill="#9aa7b2">d 2, h 1</text>
    <text x="510" y="270" fill="#9aa7b2">d 2, h 0</text>
    <text x="460" y="356" fill="#9aa7b2">d 3, h 0</text>
  </g>
  <text x="494" y="116" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">query 4</text>
  <text x="320" y="382" text-anchor="middle" fill="#1a2026" font-size="13">The outside maximum descends parent → child and routes through the sibling:</text>
  <text x="320" y="400" text-anchor="middle" fill="#1a2026" font-size="13">removing 4's subtree leaves the path <tspan fill="#4169E1" font-weight="600">1→3→2</tspan> at depth 2, so query 4 answers <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
