<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="330" fill="#ffffff"/>
  <!-- left: full tree [1,3,4,2,null,6,5,...,7] -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="150" y1="67" x2="92" y2="108"/>
    <line x1="150" y1="67" x2="222" y2="108"/>
    <line x1="85" y1="142" x2="54" y2="183"/>
    <line x1="230" y1="142" x2="199" y2="183"/>
    <line x1="230" y1="142" x2="263" y2="183"/>
    <line x1="270" y1="217" x2="270" y2="248"/>
  </g>
  <!-- dashed enclosure: subtree rooted at 4 -->
  <rect x="168" y="96" width="152" height="200" rx="14" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="244" y="88" text-anchor="middle" font-size="12.5" fill="#4169E1" font-weight="600">removed subtree (query 4)</text>
  <g text-anchor="middle" font-weight="600">
    <circle cx="150" cy="50" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="150" y="55" fill="#1a2026">1</text>
    <circle cx="85" cy="125" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="85" y="130" fill="#1a2026">3</text>
    <circle cx="45" cy="200" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="45" y="205" fill="#1a2026">2</text>
    <g fill="#5c6b76" font-weight="600">
      <circle cx="230" cy="125" r="17" fill="#eef1f5" stroke="#42525e" stroke-width="1.4" stroke-dasharray="4 3"/><text x="230" y="130">4</text>
      <circle cx="195" cy="200" r="17" fill="#eef1f5" stroke="#42525e" stroke-width="1.4" stroke-dasharray="4 3"/><text x="195" y="205">6</text>
      <circle cx="270" cy="200" r="17" fill="#eef1f5" stroke="#42525e" stroke-width="1.4" stroke-dasharray="4 3"/><text x="270" y="205">5</text>
      <circle cx="270" cy="265" r="17" fill="#eef1f5" stroke="#42525e" stroke-width="1.4" stroke-dasharray="4 3"/><text x="270" y="270">7</text>
    </g>
  </g>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <line x1="336" y1="145" x2="364" y2="145" stroke="#42525e" stroke-width="1.8" marker-end="url(#a1)"/>
  <!-- right: tree after removal -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="490" y1="67" x2="432" y2="108"/>
    <line x1="425" y1="142" x2="394" y2="183"/>
  </g>
  <g stroke="#4169E1" stroke-width="3" fill="none">
    <line x1="490" y1="67" x2="432" y2="108"/>
    <line x1="425" y1="142" x2="394" y2="183"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <circle cx="490" cy="50" r="17" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="490" y="55" fill="#1a2026">1</text>
    <circle cx="425" cy="125" r="17" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="425" y="130" fill="#1a2026">3</text>
    <circle cx="385" cy="200" r="17" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="385" y="205" fill="#1a2026">2</text>
  </g>
  <text x="540" y="130" font-size="12.5" fill="#5c6b76">height 2:</text>
  <text x="540" y="148" font-size="12.5" fill="#4169E1" font-weight="600">1 → 3 → 2</text>
</svg>
