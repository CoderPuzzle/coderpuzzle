<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="396" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [4,3,2,1,2,3,1]; cells 44x34; layer 1 y=46 x=90, layer 2 y=150 x=134, layer 3 y=254 x=178 -->
  <!-- tinted cells are the current front/back blocks; arcs mark the one merge spent on the deficit side -->
  <text x="60" y="68" text-anchor="middle" fill="#5c6b76" font-size="12.5">nums</text>
  <!-- layer 1: front [4] vs back [3,1] -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="90" y="46" width="44" height="34"/><rect x="134" y="46" width="44" height="34"/>
    <rect x="178" y="46" width="44" height="34"/><rect x="222" y="46" width="44" height="34"/>
    <rect x="266" y="46" width="44" height="34"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.4" fill="#dbe4fb">
    <rect x="90" y="46" width="44" height="34"/>
    <rect x="310" y="46" width="44" height="34"/><rect x="354" y="46" width="44" height="34"/>
  </g>
  <path d="M 374 44 Q 355 26 336 44" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" font-weight="600">
    <text x="112" y="68">4</text><text x="156" y="68">3</text><text x="200" y="68">2</text>
    <text x="244" y="68">1</text><text x="288" y="68">2</text><text x="332" y="68">3</text><text x="376" y="68">1</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="112" y="94">front</text><text x="354" y="94">back</text>
  </g>
  <text x="90" y="112" fill="#1a2026" font-size="13">front <tspan font-weight="600">4</tspan> · back 1 + 3 = 4 — retire · <tspan fill="#4169E1" font-weight="600">1 merge</tspan></text>
  <text x="470" y="67" fill="#5c6b76" font-size="12.5">merges so far: <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  <!-- layer 2: inside layer 1, front [3] vs back [1,2] -->
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="178" y="150" width="44" height="34"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.4" fill="#dbe4fb">
    <rect x="134" y="150" width="44" height="34"/>
    <rect x="222" y="150" width="44" height="34"/><rect x="266" y="150" width="44" height="34"/>
  </g>
  <path d="M 286 148 Q 265 130 246 148" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" font-weight="600">
    <text x="156" y="172">3</text><text x="200" y="172">2</text><text x="244" y="172">1</text><text x="288" y="172">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="156" y="198">front</text><text x="266" y="198">back</text>
  </g>
  <text x="134" y="216" fill="#1a2026" font-size="13">front <tspan font-weight="600">3</tspan> · back 2 + 1 = 3 — retire · <tspan fill="#4169E1" font-weight="600">1 merge</tspan></text>
  <text x="470" y="171" fill="#5c6b76" font-size="12.5">merges so far: <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <!-- layer 3: the lone middle element -->
  <rect x="178" y="254" width="44" height="34" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <text x="200" y="276" text-anchor="middle" font-weight="600" fill="#9aa7b2">2</text>
  <text x="200" y="302" text-anchor="middle" fill="#5c6b76" font-size="11.5">middle</text>
  <text x="178" y="320" fill="#1a2026" font-size="13">middle 2 alone — already a palindrome · <tspan fill="#4169E1" font-weight="600">0 merges</tspan></text>
  <text x="470" y="275" fill="#5c6b76" font-size="12.5">merges so far: <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="320" y="352" text-anchor="middle" fill="#1a2026" font-size="13">Only the two absorptions, 1 + 3 and 2 + 1, spend a merge; matched pairs retire free.</text>
  <text x="320" y="372" text-anchor="middle" fill="#1a2026" font-size="13">The 7 elements keep 5 palindrome blocks, so the answer is 7 − 5 = <tspan fill="#4169E1" font-weight="600">2</tspan> operations.</text>
</svg>
