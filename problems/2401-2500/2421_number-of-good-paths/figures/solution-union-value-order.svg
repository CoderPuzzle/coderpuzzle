<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="322" fill="#ffffff"/>
  <!-- vals = [1,3,2,1,3], edges 0-1, 0-2, 2-3, 2-4; three activation stages (values 1, 2, 3);
       stage 2 unions 0-2 and 2-3, stage 3 unions 1-0 and 4-2 (accent);
       value-3 nodes 1 and 4 end in one component: C(2,2) = 1 pair; total 5 + 1 = 6 -->
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="105" y="26">activate value 1</text>
    <text x="335" y="26">activate value 2</text>
    <text x="565" y="26">activate value 3</text>
  </g>
  <!-- tree edges (stage-3 accent unions drawn on top) -->
  <g stroke="#9aa7b2" stroke-width="1.4">
    <line x1="90" y1="68" x2="40" y2="118"/><line x1="90" y1="68" x2="140" y2="118"/>
    <line x1="140" y1="118" x2="110" y2="168"/><line x1="140" y1="118" x2="170" y2="168"/>
    <line x1="320" y1="68" x2="270" y2="118"/><line x1="320" y1="68" x2="370" y2="118"/>
    <line x1="370" y1="118" x2="340" y2="168"/><line x1="370" y1="118" x2="400" y2="168"/>
    <line x1="550" y1="68" x2="500" y2="118"/><line x1="600" y1="118" x2="570" y2="168"/><line x1="600" y1="118" x2="630" y2="168"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="320" y1="68" x2="370" y2="118"/>
    <line x1="370" y1="118" x2="340" y2="168"/>
    <line x1="550" y1="68" x2="600" y2="118"/>
    <line x1="600" y1="118" x2="570" y2="168"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.4">
    <line x1="550" y1="68" x2="500" y2="118"/>
    <line x1="600" y1="118" x2="630" y2="168"/>
  </g>
  <!-- node id labels -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="90" y="48">0</text><text x="40" y="98">1</text><text x="140" y="98">2</text><text x="110" y="148">3</text><text x="170" y="148">4</text>
    <text x="320" y="48">0</text><text x="270" y="98">1</text><text x="370" y="98">2</text><text x="340" y="148">3</text><text x="400" y="148">4</text>
    <text x="550" y="48">0</text><text x="500" y="98">1</text><text x="600" y="98">2</text><text x="570" y="148">3</text><text x="630" y="148">4</text>
  </g>
  <!-- stage 1: 0 and 3 active -->
  <g stroke-width="1.5">
    <circle cx="90" cy="68" r="14" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="40" cy="118" r="14" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="140" cy="118" r="14" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="110" cy="168" r="14" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="170" cy="168" r="14" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <!-- stage 2: 2 activating, 0,3 active -->
  <g stroke-width="1.5">
    <circle cx="320" cy="68" r="14" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="270" cy="118" r="14" fill="#f0f3f7" stroke="#9aa7b2"/>
    <circle cx="370" cy="118" r="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <circle cx="340" cy="168" r="14" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="400" cy="168" r="14" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <!-- stage 3: 1 and 4 activating, rest active -->
  <g stroke-width="1.5">
    <circle cx="550" cy="68" r="14" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="500" cy="118" r="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
    <circle cx="600" cy="118" r="14" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="570" cy="168" r="14" fill="#ffffff" stroke="#1a2026"/>
    <circle cx="630" cy="168" r="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  </g>
  <!-- node values -->
  <g text-anchor="middle" font-weight="600" font-size="12.5">
    <text x="90" y="72">1</text><text x="40" y="122" fill="#9aa7b2">3</text><text x="140" y="122" fill="#9aa7b2">2</text>
    <text x="110" y="172">1</text><text x="170" y="172" fill="#9aa7b2">3</text>
    <text x="320" y="72">1</text><text x="270" y="122" fill="#9aa7b2">3</text>
    <text x="370" y="122" fill="#4169E1" font-weight="700">2</text>
    <text x="340" y="172">1</text><text x="400" y="172" fill="#9aa7b2">3</text>
    <text x="550" y="72">1</text>
    <text x="500" y="122" fill="#4169E1" font-weight="700">3</text>
    <text x="600" y="122">2</text><text x="570" y="172">1</text>
    <text x="630" y="172" fill="#4169E1" font-weight="700">3</text>
  </g>
  <!-- per-stage notes -->
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="105" y="204">0 and 3 activate; no edge</text>
    <text x="105" y="220">has both ends active yet</text>
    <text x="105" y="240">value-1 pairs: 0 → answer 5</text>
    <text x="335" y="204">2 activates: union(0,2),</text>
    <text x="335" y="220">union(2,3) → {0,2,3}</text>
    <text x="335" y="240">value 2 is alone: +0 → 5</text>
    <text x="565" y="204">1 and 4 activate: union(1,0),</text>
    <text x="565" y="220">union(4,2) → all one component</text>
    <text x="565" y="240">C(2,2) = 1 → answer 6</text>
  </g>
  <text x="40" y="268" fill="#5c6b76" font-size="12">white = already active · blue = activating now · gray = not yet active</text>
  <text x="40" y="290" fill="#1a2026" font-size="13">Merging in value order keeps every interior node &lt;= v, so the two 3s meet</text>
  <text x="40" y="308" fill="#1a2026" font-size="13">through 1-0-2-4: 5 single nodes + 1 pair = <tspan fill="#4169E1" font-weight="600">6</tspan> good paths.</text>
</svg>
