<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 322" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- vals = [1,1,2,2,3], edges = [[0,1],[1,2],[2,3],[2,4]]; good paths 0 -> 1 and 2 -> 3 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="190" y1="116" x2="280" y2="190"/>
    <line x1="280" y1="190" x2="350" y2="254"/>
  </g>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="100" y1="42" x2="190" y2="116"/>
    <line x1="280" y1="190" x2="210" y2="254"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="100" cy="42" r="21"/>
    <circle cx="190" cy="116" r="21"/>
    <circle cx="280" cy="190" r="21"/>
    <circle cx="210" cy="254" r="21"/>
  </g>
  <circle cx="350" cy="254" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="100" y="47">0</text>
    <text x="190" y="121">1</text>
    <text x="280" y="195">2</text>
    <text x="210" y="259">3</text>
    <text x="350" y="259">4</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="100" y="12">val 1</text>
    <text x="224" y="112">val 1</text>
    <text x="316" y="186">val 2</text>
    <text x="210" y="292">val 2</text>
    <text x="350" y="292">val 3</text>
  </g>
  <text x="235" y="314" text-anchor="middle" fill="#1a2026" font-size="13.5">good paths 0 → 1 and 2 → 3, plus the five single nodes → <tspan fill="#4169E1" font-weight="700">7</tspan></text>
</svg>
