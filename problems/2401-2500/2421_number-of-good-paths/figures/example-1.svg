<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 258" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- vals = [1,3,2,1,3], edges = [[0,1],[0,2],[2,3],[2,4]]; good path 1 -> 0 -> 2 -> 4 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="250" y1="42" x2="160" y2="124"/>
    <line x1="250" y1="42" x2="340" y2="124"/>
    <line x1="340" y1="124" x2="260" y2="206"/>
    <line x1="340" y1="124" x2="420" y2="206"/>
  </g>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="250" y1="42" x2="160" y2="124"/>
    <line x1="250" y1="42" x2="340" y2="124"/>
    <line x1="340" y1="124" x2="420" y2="206"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="250" cy="42" r="21"/>
    <circle cx="160" cy="124" r="21"/>
    <circle cx="340" cy="124" r="21"/>
    <circle cx="420" cy="206" r="21"/>
  </g>
  <circle cx="260" cy="206" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="250" y="47">0</text>
    <text x="160" y="129">1</text>
    <text x="340" y="129">2</text>
    <text x="260" y="211">3</text>
    <text x="420" y="211">4</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="250" y="14">val 1</text>
    <text x="126" y="128">val 3</text>
    <text x="376" y="128">val 2</text>
    <text x="226" y="210" text-anchor="end">val 1</text>
    <text x="454" y="210">val 3</text>
  </g>
  <text x="250" y="250" text-anchor="middle" fill="#1a2026" font-size="13.5">good path 1 → 0 → 2 → 4: both ends have value 3, nothing larger between</text>
</svg>
