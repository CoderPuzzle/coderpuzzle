<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 368" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="368" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- Example 1: roads [[1,2,4],[2,3,2],[2,4,5],[3,4,1],[1,3,4]], appleCost [56,42,102,301], k=2; Dijkstra from city 1 gives d=(0,4,4,5); table = appleCost[j] + 3*d(j) -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="134" y1="80" x2="286" y2="80"/>
    <line x1="110" y1="104" x2="110" y2="236"/>
    <line x1="310" y1="104" x2="310" y2="236"/>
    <line x1="134" y1="260" x2="286" y2="260"/>
    <line x1="292" y1="96" x2="128" y2="244"/>
  </g>
  <g text-anchor="middle" fill="#42525e" font-size="12.5">
    <text x="210" y="68">4</text>
    <text x="90" y="175">4</text>
    <text x="330" y="175">5</text>
    <text x="210" y="282">1</text>
    <text x="230" y="135">2</text>
  </g>
  <circle cx="110" cy="80" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="310" cy="80" r="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="110" cy="260" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="310" cy="260" r="24" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="110" y="85">1</text><text x="310" y="85">2</text><text x="110" y="265">3</text><text x="310" y="265">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="110" y="40">d = 0 · apples 56</text>
    <text x="310" y="40">d = 4 · apples 42</text>
    <text x="110" y="306">d = 4 · apples 102</text>
    <text x="310" y="306">d = 5 · apples 301</text>
  </g>
  <text x="540" y="60" text-anchor="middle" fill="#5c6b76" font-size="12.5">start city 1: appleCost[j] + 3·d(j)</text>
  <rect x="436" y="102" width="208" height="22" rx="5" fill="#dbe4fb"/>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="526" y="92">j = 1:  56 + 3·0 = 56</text>
    <text x="526" y="118">j = 2:  42 + 3·4 = <tspan fill="#4169E1" font-weight="600">54</tspan></text>
    <text x="526" y="144">j = 3:  102 + 3·4 = 114</text>
    <text x="526" y="170">j = 4:  301 + 3·5 = 316</text>
  </g>
  <text x="626" y="118" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">min</text>
  <text x="330" y="334" text-anchor="middle" fill="#1a2026" font-size="13">From city 1 the candidate costs are 56, 54, 114, 316: buying at city 2 wins,</text>
  <text x="330" y="352" text-anchor="middle" fill="#1a2026" font-size="13">42 + 3·4 = <tspan fill="#4169E1" font-weight="600">54</tspan> — the apple plus the 1 → 2 → 1 round trip with roads doubled.</text>
</svg>
