<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 296" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="296" fill="#ffffff"/>
  <!-- group bands -->
  <g fill="#f3f5f7">
    <rect x="86" y="20" width="454" height="56"/>
    <rect x="86" y="84" width="454" height="56"/>
    <rect x="86" y="148" width="454" height="56"/>
    <rect x="86" y="212" width="454" height="56"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="20" y="52">group 1</text>
    <text x="20" y="116">group 2</text>
    <text x="20" y="180">group 3</text>
    <text x="20" y="244">group 4</text>
    <text x="558" y="52" text-anchor="end">depth 0</text>
    <text x="558" y="116" text-anchor="end">depth 1</text>
    <text x="558" y="180" text-anchor="end">depth 2</text>
    <text x="558" y="244" text-anchor="end">depth 3</text>
  </g>
  <!-- edges -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <line x1="300" y1="65" x2="300" y2="103"/>
    <line x1="300" y1="129" x2="214" y2="161"/>
    <line x1="300" y1="129" x2="394" y2="161"/>
    <line x1="200" y1="193" x2="150" y2="225"/>
    <line x1="200" y1="193" x2="292" y2="229"/>
    <line x1="400" y1="193" x2="310" y2="229"/>
  </g>
  <!-- nodes -->
  <g stroke="#4169E1" stroke-width="1.8" fill="#e8edfa">
    <circle cx="300" cy="48" r="17"/>
  </g>
  <g stroke="#1a2026" stroke-width="1.6" fill="#ffffff">
    <circle cx="300" cy="112" r="17"/>
    <circle cx="200" cy="176" r="17"/>
    <circle cx="400" cy="176" r="17"/>
    <circle cx="140" cy="240" r="17"/>
    <circle cx="300" cy="240" r="17"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="300" y="53">5</text>
    <text x="300" y="117">1</text>
    <text x="200" y="181">2</text>
    <text x="400" y="181">4</text>
    <text x="140" y="245">3</text>
    <text x="300" y="245">6</text>
  </g>
  <text x="300" y="286" text-anchor="middle" fill="#5c6b76" font-size="12.5">BFS from node 5: each node sits at its depth, every edge crosses exactly one band, 4 groups.</text>
</svg>
