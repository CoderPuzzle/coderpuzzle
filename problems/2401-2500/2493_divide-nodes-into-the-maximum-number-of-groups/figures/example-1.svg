<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="320" fill="#ffffff"/>
  <!-- group frames -->
  <g fill="none" stroke="#4169E1" stroke-width="1.5">
    <rect x="52" y="100" width="76" height="140" rx="12"/>
    <rect x="182" y="100" width="76" height="140" rx="12"/>
    <rect x="312" y="100" width="76" height="140" rx="12"/>
    <rect x="442" y="100" width="76" height="140" rx="12"/>
  </g>
  <g font-size="12.5" fill="#4169E1" text-anchor="middle" font-weight="600">
    <text x="90" y="90">group 1</text>
    <text x="220" y="90">group 2</text>
    <text x="350" y="90">group 3</text>
    <text x="480" y="90">group 4</text>
  </g>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="107" y1="170" x2="203" y2="170"/>
    <line x1="237" y1="160" x2="333" y2="126"/>
    <line x1="237" y1="180" x2="333" y2="214"/>
    <line x1="367" y1="120" x2="463" y2="120"/>
    <line x1="367" y1="120" x2="463" y2="214"/>
    <line x1="367" y1="220" x2="463" y2="220"/>
  </g>
  <!-- nodes -->
  <g text-anchor="middle" font-weight="600">
    <circle cx="90" cy="170" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="90" y="175" fill="#1a2026">5</text>
    <circle cx="220" cy="170" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="220" y="175" fill="#1a2026">1</text>
    <circle cx="350" cy="120" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="350" y="125" fill="#1a2026">2</text>
    <circle cx="350" cy="220" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="350" y="225" fill="#1a2026">4</text>
    <circle cx="480" cy="120" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="480" y="125" fill="#1a2026">3</text>
    <circle cx="480" cy="220" r="17" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="480" y="225" fill="#1a2026">6</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="52" y="280">Every edge connects nodes in adjacent groups, so 4 groups</text>
    <text x="52" y="298">is achievable — and no fifth group fits any node.</text>
  </g>
</svg>
