<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="376" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = abcabcdabc (n = 10); dp cells 40x36 at x = 100 + 40i, y=70; dp[10] = 0 sentinel -->
  <!-- lcp rows for k = 2..9 at x = 200 + 40(k-2): row i=1 y=220 (0 0 2 0 0 0 2 0), row i=0 y=256 (0 3 0 0 0 3 0 0) -->
  <!-- accent: lcp(0,3) = 3 >= L = 3 feeds dp[0] = 1 + dp[3] = 2 -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="120" y="34">0</text><text x="160" y="34">1</text><text x="200" y="34">2</text>
    <text x="240" y="34">3</text><text x="280" y="34">4</text><text x="320" y="34">5</text>
    <text x="360" y="34">6</text><text x="400" y="34">7</text><text x="440" y="34">8</text>
    <text x="480" y="34">9</text><text x="520" y="34">10</text>
  </g>
  <text x="76" y="34" text-anchor="middle" fill="#9aa7b2" font-size="11">i</text>
  <g fill="#f0f3f7">
    <rect x="100" y="42" width="40" height="24"/><rect x="140" y="42" width="40" height="24"/>
    <rect x="180" y="42" width="40" height="24"/><rect x="220" y="42" width="40" height="24"/>
    <rect x="260" y="42" width="40" height="24"/><rect x="300" y="42" width="40" height="24"/>
    <rect x="340" y="42" width="40" height="24"/><rect x="380" y="42" width="40" height="24"/>
    <rect x="420" y="42" width="40" height="24"/><rect x="460" y="42" width="40" height="24"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="120" y="59">a</text><text x="160" y="59">b</text><text x="200" y="59">c</text>
    <text x="240" y="59">a</text><text x="280" y="59">b</text><text x="320" y="59">c</text>
    <text x="360" y="59">d</text><text x="400" y="59">a</text><text x="440" y="59">b</text>
    <text x="480" y="59">c</text>
  </g>
  <text x="76" y="59" text-anchor="middle" fill="#5c6b76" font-size="11">s</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="100" y="70" width="40" height="36"/><rect x="140" y="70" width="40" height="36"/>
    <rect x="180" y="70" width="40" height="36"/>
    <rect x="260" y="70" width="40" height="36"/><rect x="300" y="70" width="40" height="36"/>
    <rect x="340" y="70" width="40" height="36"/><rect x="380" y="70" width="40" height="36"/>
    <rect x="420" y="70" width="40" height="36"/><rect x="460" y="70" width="40" height="36"/>
    <rect x="500" y="70" width="40" height="36"/>
  </g>
  <rect x="220" y="70" width="40" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="120" y="93" fill="#4169E1">2</text><text x="160" y="93" fill="#1a2026">1</text>
    <text x="200" y="93" fill="#1a2026">1</text><text x="240" y="93" fill="#4169E1">1</text>
    <text x="280" y="93" fill="#1a2026">1</text><text x="320" y="93" fill="#1a2026">1</text>
    <text x="360" y="93" fill="#1a2026">1</text><text x="400" y="93" fill="#1a2026">1</text>
    <text x="440" y="93" fill="#1a2026">1</text><text x="480" y="93" fill="#1a2026">1</text>
    <text x="520" y="93" fill="#9aa7b2">0</text>
  </g>
  <text x="76" y="93" text-anchor="middle" fill="#5c6b76" font-size="11">dp</text>
  <path d="M 240 108 Q 180 132 122 108" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="122" fill="#1a2026" font-size="12.5">split L = 3: dp[0] = 1 + dp[3] = 2</text>
  <!-- lcp table: the two kept rows -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="220" y="186">2</text><text x="260" y="186">3</text><text x="300" y="186">4</text>
    <text x="340" y="186">5</text><text x="380" y="186">6</text><text x="420" y="186">7</text>
    <text x="460" y="186">8</text><text x="500" y="186">9</text>
  </g>
  <text x="192" y="186" text-anchor="end" fill="#9aa7b2" font-size="10.5">k</text>
  <g fill="#f0f3f7">
    <rect x="200" y="192" width="40" height="20"/><rect x="240" y="192" width="40" height="20"/>
    <rect x="280" y="192" width="40" height="20"/><rect x="320" y="192" width="40" height="20"/>
    <rect x="360" y="192" width="40" height="20"/><rect x="400" y="192" width="40" height="20"/>
    <rect x="440" y="192" width="40" height="20"/><rect x="480" y="192" width="40" height="20"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="220" y="206">c</text><text x="260" y="206">a</text><text x="300" y="206">b</text>
    <text x="340" y="206">c</text><text x="380" y="206">d</text><text x="420" y="206">a</text>
    <text x="460" y="206">b</text><text x="500" y="206">c</text>
  </g>
  <text x="192" y="206" text-anchor="end" fill="#5c6b76" font-size="11">s[k]</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="200" y="220" width="40" height="32"/><rect x="240" y="220" width="40" height="32"/>
    <rect x="280" y="220" width="40" height="32"/><rect x="320" y="220" width="40" height="32"/>
    <rect x="360" y="220" width="40" height="32"/><rect x="400" y="220" width="40" height="32"/>
    <rect x="440" y="220" width="40" height="32"/><rect x="480" y="220" width="40" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="220" y="240">0</text><text x="260" y="240">0</text><text x="300" y="240">2</text>
    <text x="340" y="240">0</text><text x="380" y="240">0</text><text x="420" y="240">0</text>
    <text x="460" y="240">2</text><text x="500" y="240">0</text>
  </g>
  <text x="192" y="240" text-anchor="end" fill="#5c6b76" font-size="11.5">lcp(1, k)</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="200" y="256" width="40" height="32"/><rect x="280" y="256" width="40" height="32"/>
    <rect x="320" y="256" width="40" height="32"/><rect x="360" y="256" width="40" height="32"/>
    <rect x="400" y="256" width="40" height="32"/><rect x="440" y="256" width="40" height="32"/>
    <rect x="480" y="256" width="40" height="32"/>
  </g>
  <rect x="240" y="256" width="40" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="220" y="276">0</text>
    <text x="300" y="276">0</text><text x="340" y="276">0</text>
    <text x="380" y="276">0</text><text x="420" y="276">3</text>
    <text x="460" y="276">0</text><text x="500" y="276">0</text>
  </g>
  <text x="260" y="277" text-anchor="middle" font-weight="600" font-size="15" fill="#4169E1">3</text>
  <text x="192" y="276" text-anchor="end" fill="#5c6b76" font-size="11.5">lcp(0, k)</text>
  <g fill="#5c6b76" font-size="11">
    <text x="528" y="234">no entry reaches its</text>
    <text x="528" y="248">L = k − 1: dp[1] = 1</text>
    <text x="528" y="270">k = 7: lcp = 3 but</text>
    <text x="528" y="284">L = 7 fails 2·7 ≤ 10</text>
  </g>
  <text x="320" y="330" text-anchor="middle" fill="#1a2026" font-size="13">lcp(j, k) = 1 + lcp(j + 1, k + 1) when s[j] = s[k]; rows fill bottom-up, two kept.</text>
  <text x="320" y="352" text-anchor="middle" fill="#1a2026" font-size="13">At i = 0: lcp(0, 3) = 3 ≥ L = 3 matches abc = abc, so dp[0] = 1 + dp[3] = <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
