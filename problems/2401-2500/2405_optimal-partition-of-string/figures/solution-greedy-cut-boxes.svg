<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="230" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "abacaba", cells 44x40 at x 130+50i; cuts after i1, i3, i5; each cut's repeat letter (second a of its part) is accent-filled -->
  <text x="302" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">s = "abacaba"</text>
  <g text-anchor="middle" fill="#4169E1" font-size="10.5">
    <text x="227" y="68">a repeats</text><text x="327" y="68">a repeats</text><text x="427" y="68">a repeats</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 3">
    <line x1="227" y1="76" x2="227" y2="130"/>
    <line x1="327" y1="76" x2="327" y2="130"/>
    <line x1="427" y1="76" x2="427" y2="130"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="130" y="84" width="44" height="40"/><rect x="180" y="84" width="44" height="40"/>
    <rect x="280" y="84" width="44" height="40"/>
    <rect x="380" y="84" width="44" height="40"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <rect x="230" y="84" width="44" height="40"/>
    <rect x="330" y="84" width="44" height="40"/>
    <rect x="430" y="84" width="44" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="152" y="109">a</text><text x="202" y="109">b</text><text x="252" y="109">a</text>
    <text x="302" y="109">c</text><text x="352" y="109">a</text><text x="402" y="109">b</text><text x="452" y="109">a</text>
  </g>
  <!-- part brackets -->
  <g fill="none" stroke="#5c6b76" stroke-width="1.2">
    <path d="M 130 136 V 142 H 224 V 136"/>
    <path d="M 230 136 V 142 H 324 V 136"/>
    <path d="M 330 136 V 142 H 424 V 136"/>
    <path d="M 430 136 V 142 H 474 V 136"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="177" y="162">ab</text><text x="277" y="162">ac</text><text x="377" y="162">ab</text><text x="452" y="162">a</text>
  </g>
  <text x="302" y="194" text-anchor="middle" fill="#1a2026" font-size="13">Extend the open substring until its next letter already sits inside it — each cut</text>
  <text x="302" y="212" text-anchor="middle" fill="#1a2026" font-size="13">is a repeated a: [ab][ac][ab][a] = <tspan fill="#4169E1" font-weight="600">4</tspan> parts, the minimum for "abacaba".</text>
</svg>
