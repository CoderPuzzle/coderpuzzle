  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="86" y="36" width="52" height="52"/><rect x="138" y="36" width="52" height="52"/>
    <rect x="190" y="36" width="52" height="52"/><rect x="242" y="36" width="52" height="52"/>
    <rect x="86" y="88" width="52" height="52"/><rect x="138" y="88" width="52" height="52"/>
    <rect x="190" y="88" width="52" height="52"/><rect x="242" y="88" width="52" height="52"/>
    <rect x="86" y="140" width="52" height="52"/><rect x="138" y="140" width="52" height="52"/>
