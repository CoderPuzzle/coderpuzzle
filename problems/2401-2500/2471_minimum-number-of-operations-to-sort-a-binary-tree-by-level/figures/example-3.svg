<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="300" fill="#ffffff"/>
  <!-- tree [1,2,3,4,5,6] -->
