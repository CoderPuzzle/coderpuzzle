<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 276" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="276" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- Example 1 levels: [7,6,8,5] cells x=44+104i w100 y52 h44 (cx 94,198,302,406); [4,3] cells x=524,598 w66 (cx 557,631); arcs follow perm pos -> target pos -->
  <text x="250" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">level [7, 6, 8, 5]</text>
  <text x="594" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">level [4, 3]</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="44" y="52" width="100" height="44"/><rect x="148" y="52" width="100" height="44" fill="#dbe4fb"/>
    <rect x="252" y="52" width="100" height="44"/><rect x="356" y="52" width="100" height="44"/>
    <rect x="524" y="52" width="66" height="44"/><rect x="598" y="52" width="66" height="44"/>
  </g>
  <g text-anchor="middle">
    <text x="94" y="72" font-weight="600" font-size="15">7</text><text x="198" y="72" font-weight="600" font-size="15">6</text>
    <text x="302" y="72" font-weight="600" font-size="15">8</text><text x="406" y="72" font-weight="600" font-size="15">5</text>
    <text x="557" y="72" font-weight="600" font-size="15">4</text><text x="631" y="72" font-weight="600" font-size="15">3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="94" y="88">pos 0</text><text x="198" y="88">pos 1</text><text x="302" y="88">pos 2</text><text x="406" y="88">pos 3</text>
    <text x="557" y="88">pos 0</text><text x="631" y="88">pos 1</text>
  </g>
  <!-- cycle arcs: 0 -> 2, 2 -> 3, 3 -> 0 (7, 8, 5); pos 1 is a fixed point -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 94 96 Q 198 148 292 96" marker-end="url(#arrow)"/>
    <path d="M 310 96 Q 356 140 398 96" marker-end="url(#arrow)"/>
    <path d="M 414 96 Q 250 204 110 96" marker-end="url(#arrow)"/>
    <path d="M 557 96 Q 594 130 623 96" marker-end="url(#arrow)"/>
    <path d="M 631 96 Q 594 158 565 96" marker-end="url(#arrow)"/>
  </g>
  <text x="250" y="178" text-anchor="middle" fill="#42525e" font-size="12.5">7 → pos 2 · 8 → pos 3 · 5 → pos 0 · 6 already in place</text>
  <text x="594" y="178" text-anchor="middle" fill="#42525e" font-size="12.5">4 → pos 1 · 3 → pos 0</text>
  <text x="250" y="200" text-anchor="middle" fill="#1a2026" font-size="13">cycle 7 → 8 → 5 has length 3: 3 − 1 = <tspan fill="#4169E1" font-weight="600">2</tspan> swaps</text>
  <text x="594" y="200" text-anchor="middle" fill="#1a2026" font-size="13">length 2: 2 − 1 = <tspan fill="#4169E1" font-weight="600">1</tspan> swap</text>
  <text x="340" y="238" text-anchor="middle" fill="#1a2026" font-size="13">Each cycle of length c costs c − 1 swaps: level [7, 6, 8, 5] gives 2,</text>
  <text x="340" y="256" text-anchor="middle" fill="#1a2026" font-size="13">level [4, 3] gives 1, so the tree needs 2 + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan> operations.</text>
</svg>
