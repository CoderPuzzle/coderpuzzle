  <!-- swap badges -->
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">
    <circle cx="234" cy="117" r="10" fill="#4169E1"/><text x="234" y="121">1</text>
    <circle cx="386" cy="117" r="10" fill="#4169E1"/><text x="386" y="121">1</text>
    <circle cx="132" cy="233" r="10" fill="#4169E1"/><text x="132" y="237">2</text>
    <circle cx="473" cy="233" r="10" fill="#4169E1"/><text x="473" y="237">2</text>
    <circle cx="317" cy="233" r="10" fill="#4169E1"/><text x="317" y="237">3</text>
    <circle cx="168" cy="233" r="10" fill="#4169E1"/><text x="168" y="237">3</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="530" y="120">1  swap 4 and 3</text>
    <text x="530" y="138">level 2 becomes [3,4]</text>
    <text x="530" y="180">2  swap 7 and 5</text>
    <text x="530" y="222">3  swap 8 and 7</text>
    <text x="530" y="240">level 3 becomes</text>
    <text x="530" y="256">[5,6,7,8]</text>
    <text x="530" y="300" fill="#4169E1" font-weight="600">3 operations</text>
