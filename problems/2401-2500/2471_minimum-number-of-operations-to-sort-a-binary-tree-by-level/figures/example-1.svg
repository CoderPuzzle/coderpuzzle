    <circle cx="215" cy="135" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="215" y="141" fill="#1a2026">4</text>
    <circle cx="405" cy="135" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="405" y="141" fill="#1a2026">3</text>
    <circle cx="150" cy="215" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="150" y="221" fill="#1a2026">7</text>
    <circle cx="262" cy="215" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="262" y="221" fill="#1a2026">6</text>
    <circle cx="335" cy="215" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="335" y="221" fill="#1a2026">8</text>
    <circle cx="455" cy="215" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="455" y="221" fill="#1a2026">5</text>
    <circle cx="370" cy="296" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="370" y="302" fill="#1a2026">9</text>
    <circle cx="420" cy="296" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="420" y="302" fill="#1a2026">10</text>
