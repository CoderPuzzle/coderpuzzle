<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="380" fill="#ffffff"/>
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b57f30"/>
    </marker>
  </defs>
  <!-- edges: 0-1, 1-2, 1-3, 3-4 -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="300" y1="82" x2="300" y2="128"/>
    <line x1="284" y1="164" x2="204" y2="222"/>
    <line x1="316" y1="164" x2="396" y2="222"/>
    <line x1="420" y1="262" x2="420" y2="298"/>
  </g>
  <!-- Alice path 0-1-3-4 -->
  <g stroke="#4169E1" stroke-width="3.2" fill="none">
    <line x1="300" y1="82" x2="300" y2="128"/>
    <line x1="316" y1="164" x2="396" y2="222"/>
    <line x1="420" y1="262" x2="420" y2="298"/>
  </g>
  <!-- nodes -->
  <g text-anchor="middle" font-weight="600">
    <circle cx="300" cy="60" r="22" fill="#4169E1" stroke="#42525e" stroke-width="1.6"/><text x="300" y="66" fill="#ffffff">0</text>
    <circle cx="300" cy="150" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="300" y="156" fill="#1a2026">1</text>
    <circle cx="180" cy="244" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="180" y="250" fill="#1a2026">2</text>
    <circle cx="420" cy="244" r="22" fill="#f6dede" stroke="#42525e" stroke-width="1.6"/><text x="420" y="250" fill="#1a2026">3</text>
    <circle cx="420" cy="320" r="22" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="420" y="326" fill="#1a2026">4</text>
  </g>
  <!-- amounts -->
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="300" y="26">−2</text><text x="300" y="118">+4</text><text x="180" y="212">+2</text><text x="420" y="212">−4</text><text x="464" y="324" text-anchor="start">+6</text>
  </g>
  <text x="312" y="100" font-size="11.5" fill="#4169E1">Alice 0 → 1 → 3 → 4</text>
  <!-- Bob arrows 3 -> 1 -> 0 -->
  <g stroke="#b57f30" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
    <path d="M 398 232 Q 336 196 314 168" marker-end="url(#b1)"/>
    <path d="M 292 132 Q 286 108 292 88" marker-end="url(#b1)"/>
  </g>
  <text x="238" y="196" font-size="11.5" fill="#b57f30">Bob 3 → 1 → 0</text>
  <!-- income note -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="500" y="60" text-anchor="middle">Alice's net income</text>
    <text x="500" y="92">t=0: pays −2 → −2</text>
    <text x="500" y="124">t=1: shares +4 → 0</text>
    <text x="500" y="156">t=2: node 3 free → 0</text>
    <text x="500" y="188" fill="#4169E1" font-weight="600">t=3: +6 → 6</text>
  </g>
</svg>
