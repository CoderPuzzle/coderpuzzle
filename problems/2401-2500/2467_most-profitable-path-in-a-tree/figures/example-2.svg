<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="240" fill="#ffffff"/>
  <defs>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b57f30"/>
    </marker>
  </defs>
  <line x1="242" y1="140" x2="338" y2="140" stroke="#42525e" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600">
    <circle cx="220" cy="140" r="22" fill="#4169E1" stroke="#42525e" stroke-width="1.6"/><text x="220" y="146" fill="#ffffff">0</text>
    <circle cx="360" cy="140" r="22" fill="#f6dede" stroke="#42525e" stroke-width="1.6"/><text x="360" y="146" fill="#1a2026">1</text>
  </g>
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="220" y="100">−7280</text><text x="360" y="100">+2350</text>
  </g>
  <line x1="244" y1="166" x2="330" y2="166" stroke="#4169E1" stroke-width="2" marker-end="url(#b2)"/>
  <text x="290" y="190" font-size="12" fill="#4169E1" text-anchor="middle">Alice heads for 1</text>
  <path d="M 336 116 Q 290 86 250 112" stroke="#b57f30" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#b2)"/>
  <text x="290" y="70" font-size="12" fill="#b57f30" text-anchor="middle">Bob reaches 0 at t = 1</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="60" y="220">Alice is ahead of Bob on node 0, and node 1's gate</text>
    <text x="60" y="236">was already opened by Bob — so her income is</text>
    <text x="292" y="236" fill="#4169E1" font-weight="600">−7280.</text>
  </g>
</svg>
