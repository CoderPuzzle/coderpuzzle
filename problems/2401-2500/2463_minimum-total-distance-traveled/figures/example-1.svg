<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="500" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- number line 0..6 -->
  <line x1="46" y1="175" x2="442" y2="175" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="70" y1="169" x2="70" y2="181"/><line x1="128" y1="169" x2="128" y2="181"/><line x1="186" y1="169" x2="186" y2="181"/><line x1="244" y1="169" x2="244" y2="181"/><line x1="302" y1="169" x2="302" y2="181"/><line x1="360" y1="169" x2="360" y2="181"/><line x1="418" y1="169" x2="418" y2="181"/>
  </g>
  <g font-size="12.5" fill="#5c6b76" text-anchor="middle">
    <text x="70" y="200">0</text><text x="128" y="200">1</text><text x="186" y="200">2</text><text x="244" y="200">3</text><text x="302" y="200">4</text><text x="360" y="200">5</text><text x="418" y="200">6</text>
  </g>
  <!-- factories -->
  <g fill="#eef1f5" stroke="#42525e" stroke-width="1.5">
    <path d="M 168 254 L 168 236 L 178 244 L 188 236 L 198 244 L 208 236 L 204 236 L 204 222 L 210 222 L 210 254 Z"/>
    <path d="M 400 254 L 400 236 L 410 244 L 420 236 L 430 244 L 440 236 L 436 236 L 436 222 L 442 222 L 442 254 Z"/>
  </g>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="186" y="272">factory, limit 2</text>
    <text x="418" y="272">factory, limit 2</text>
  </g>
  <!-- robots -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="70" cy="82" r="5.5"/>
    <rect x="62" y="90" width="16" height="13" rx="3"/>
    <circle cx="302" cy="82" r="5.5"/>
    <rect x="294" y="90" width="16" height="13" rx="3"/>
    <circle cx="418" cy="82" r="5.5"/>
    <rect x="410" y="90" width="16" height="13" rx="3"/>
  </g>
  <!-- movement arrows -->
  <line x1="92" y1="112" x2="176" y2="146" stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <line x1="292" y1="112" x2="198" y2="146" stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <text x="418" y="122" font-size="12" fill="#5c6b76" text-anchor="middle">repaired in place</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="28" y="70">robot at 0 moves right</text>
    <text x="205" y="70">robot at 4 moves left</text>
  </g>
  <text x="418" y="70" font-size="12.5" fill="#5c6b76" text-anchor="middle">robot at 6 stays</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="46" y="34">Both left robots are repaired at position 2, the right robot at 6:</text>
    <text x="46" y="52" fill="#4169E1" font-weight="600">|2-0| + |2-4| + |6-6| = 4</text>
  </g>
</svg>
