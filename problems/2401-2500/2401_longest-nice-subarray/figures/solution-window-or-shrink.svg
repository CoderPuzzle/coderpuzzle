<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,3,8,48,10]; bit cells 18x14 at col centers 92+72i, rows b5..b0 top to bottom; running OR after each include: 1, 3, 11, 59 (10 conflicts -> shrink -> 58) -->
  <path d="M 132 58 V 52 H 340 V 58" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="236" y="44" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">best = [3, 8, 48], length 3</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="64" width="64" height="36"/><rect x="132" y="64" width="64" height="36"/><rect x="204" y="64" width="64" height="36"/>
    <rect x="276" y="64" width="64" height="36"/><rect x="348" y="64" width="64" height="36"/>
  </g>
  <rect x="346" y="60" width="68" height="44" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-weight="600">
    <text x="92" y="87">1</text><text x="164" y="87">3</text><text x="236" y="87">8</text>
    <text x="308" y="87">48</text><text x="380" y="87">10</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="92" y="114">i = 0</text><text x="164" y="114">i = 1</text><text x="236" y="114">i = 2</text>
    <text x="308" y="114">i = 3</text><text x="380" y="114">i = 4</text>
  </g>
  <!-- bit rows: unset #f0f3f7, set accent; dashed boxes mark the two conflicting bits -->
  <g fill="#f0f3f7">
    <g>
      <rect x="83" y="128" width="18" height="14"/><rect x="155" y="128" width="18" height="14"/><rect x="227" y="128" width="18" height="14"/><rect x="299" y="128" width="18" height="14"/><rect x="371" y="128" width="18" height="14"/>
      <rect x="83" y="146" width="18" height="14"/><rect x="155" y="146" width="18" height="14"/><rect x="227" y="146" width="18" height="14"/><rect x="371" y="146" width="18" height="14"/>
      <rect x="83" y="164" width="18" height="14"/><rect x="155" y="164" width="18" height="14"/><rect x="299" y="164" width="18" height="14"/><rect x="371" y="164" width="18" height="14"/>
      <rect x="83" y="182" width="18" height="14"/><rect x="155" y="182" width="18" height="14"/><rect x="227" y="182" width="18" height="14"/><rect x="299" y="182" width="18" height="14"/><rect x="371" y="182" width="18" height="14"/>
      <rect x="83" y="200" width="18" height="14"/><rect x="227" y="200" width="18" height="14"/><rect x="299" y="200" width="18" height="14"/><rect x="371" y="200" width="18" height="14"/>
      <rect x="83" y="218" width="18" height="14"/><rect x="155" y="218" width="18" height="14"/><rect x="227" y="218" width="18" height="14"/><rect x="299" y="218" width="18" height="14"/><rect x="371" y="218" width="18" height="14"/>
    </g>
    <g fill="#4169E1">
      <rect x="83" y="218" width="18" height="14"/>
      <rect x="155" y="200" width="18" height="14"/><rect x="155" y="218" width="18" height="14"/>
      <rect x="227" y="164" width="18" height="14"/>
      <rect x="299" y="128" width="18" height="14"/><rect x="299" y="146" width="18" height="14"/>
      <rect x="371" y="164" width="18" height="14"/><rect x="371" y="200" width="18" height="14"/>
    </g>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="1.4" stroke-dasharray="3 2">
    <rect x="152" y="198" width="24" height="18"/>
    <rect x="224" y="162" width="24" height="18"/>
    <rect x="368" y="198" width="24" height="18"/>
    <rect x="368" y="162" width="24" height="18"/>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="10.5">
    <text x="48" y="139">b5</text><text x="48" y="157">b4</text><text x="48" y="175">b3</text>
    <text x="48" y="193">b2</text><text x="48" y="211">b1</text><text x="48" y="229">b0</text>
  </g>
  <!-- running window OR under each column -->
  <text x="48" y="254" text-anchor="end" fill="#5c6b76" font-size="10.5">OR</text>
  <g text-anchor="middle" font-size="10" fill="#5c6b76">
    <text x="92" y="254">000001</text><text x="164" y="254">000011</text><text x="236" y="254">001011</text>
    <text x="308" y="254">111011</text>
  </g>
  <text x="380" y="254" text-anchor="middle" font-size="10.5" fill="#4169E1" font-weight="600">conflict</text>
  <!-- shrink narration -->
  <text x="434" y="126" fill="#5c6b76" font-size="12">when 10 arrives (r = 4)</text>
  <g fill="#1a2026" font-size="11.5">
    <text x="434" y="148">window_or = 59 (111011)</text>
    <text x="434" y="166">59 &amp; 10 = 10 ≠ 0 → conflict</text>
    <text x="434" y="184">drop 3 → or = 56 (111000)</text>
    <text x="434" y="202">56 &amp; 10 = 8 → still conflict</text>
    <text x="434" y="220">drop 8 → or = 48 (110000)</text>
    <text x="434" y="238">48 &amp; 10 = <tspan fill="#4169E1" font-weight="600">0</tspan> → window [48, 10]</text>
  </g>
  <text x="340" y="290" text-anchor="middle" fill="#1a2026" font-size="13">A value joins only if window_or &amp; v = 0: 10 hits b1 (owned by 3) and b3 (owned by 8),</text>
  <text x="340" y="308" text-anchor="middle" fill="#1a2026" font-size="13">so the window shrinks to [48, 10]; the longest nice window is [3, 8, 48], <tspan fill="#4169E1" font-weight="600">length 3</tspan>.</text>
</svg>
