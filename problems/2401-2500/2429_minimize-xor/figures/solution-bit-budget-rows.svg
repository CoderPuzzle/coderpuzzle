<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="390" fill="#ffffff"/>
  <!-- num1 = 3 = 0011, num2 = 5 = 0101; bit cells 44x34 at x = 120 + 44b, bit 3 leftmost -->
  <!-- rows top to bottom: num1 y=58, num2 y=114, x y=170, x XOR num1 y=228 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="142" y="48">bit 3</text><text x="186" y="48">bit 2</text>
    <text x="230" y="48">bit 1</text><text x="274" y="48">bit 0</text>
  </g>
  <!-- num1 row -->
  <text x="84" y="83" text-anchor="middle" fill="#5c6b76" font-size="12.5">num1</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="120" y="58" width="44" height="34"/><rect x="164" y="58" width="44" height="34"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#dbe4fb">
    <rect x="208" y="58" width="44" height="34"/><rect x="252" y="58" width="44" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="142" y="79" fill="#9aa7b2">0</text><text x="186" y="79" fill="#9aa7b2">0</text>
    <text x="230" y="79">1</text><text x="274" y="79">1</text>
  </g>
  <text x="340" y="79" fill="#1a2026" font-size="13">= 3 — set bits at positions 1 and 0</text>
  <!-- num2 row -->
  <text x="84" y="139" text-anchor="middle" fill="#5c6b76" font-size="12.5">num2</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="120" y="114" width="44" height="34"/><rect x="164" y="114" width="44" height="34"/>
    <rect x="208" y="114" width="44" height="34"/><rect x="252" y="114" width="44" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="142" y="135" fill="#9aa7b2">0</text><text x="186" y="135">1</text>
    <text x="230" y="135" fill="#9aa7b2">0</text><text x="274" y="135">1</text>
  </g>
  <text x="340" y="135" fill="#1a2026" font-size="13">= 5 — budget = popcount = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <!-- x row -->
  <text x="84" y="195" text-anchor="middle" fill="#5c6b76" font-size="12.5">x</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="120" y="170" width="44" height="34"/><rect x="164" y="170" width="44" height="34"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.4" fill="#dbe4fb">
    <rect x="208" y="170" width="44" height="34"/><rect x="252" y="170" width="44" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="142" y="191" fill="#9aa7b2">0</text><text x="186" y="191" fill="#9aa7b2">0</text>
    <text x="230" y="191" fill="#4169E1">1</text><text x="274" y="191" fill="#4169E1">1</text>
  </g>
  <text x="340" y="191" fill="#1a2026" font-size="13">= 0011₂ = <tspan fill="#4169E1" font-weight="600">3</tspan> — both of num1's set bits kept</text>
  <!-- xor row -->
  <text x="84" y="253" text-anchor="middle" fill="#5c6b76" font-size="12.5">x ⊕ num1</text>
  <g stroke="#9aa7b2" stroke-width="1.4" fill="#f0f3f7">
    <rect x="120" y="228" width="44" height="34"/><rect x="164" y="228" width="44" height="34"/>
    <rect x="208" y="228" width="44" height="34"/><rect x="252" y="228" width="44" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#9aa7b2">
    <text x="142" y="249">0</text><text x="186" y="249">0</text>
    <text x="230" y="249">0</text><text x="274" y="249">0</text>
  </g>
  <text x="340" y="249" fill="#1a2026" font-size="13">= 0 — nothing left to cancel: the minimum</text>
  <!-- phases -->
  <text x="90" y="300" fill="#1a2026" font-size="13">phase 1 — keep num1's set bits, highest first (bit 1, bit 0): budget 2 spent</text>
  <text x="90" y="322" fill="#1a2026" font-size="13">phase 2 — any surplus bit would take the lowest zero slot; here none remain</text>
  <text x="320" y="354" text-anchor="middle" fill="#1a2026" font-size="13">Both set bits of num1 survive into x, so the xor cancels completely:</text>
  <text x="320" y="374" text-anchor="middle" fill="#1a2026" font-size="13">x = 0011₂ = <tspan fill="#4169E1" font-weight="600">3</tspan> gives x XOR num1 = <tspan fill="#4169E1" font-weight="600">0</tspan>, the best a 2-set-bit x can do.</text>
</svg>
