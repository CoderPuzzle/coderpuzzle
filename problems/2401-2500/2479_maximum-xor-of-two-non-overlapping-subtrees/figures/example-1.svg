<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="770" height="340" fill="#ffffff"/>
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="284" y1="76" x2="196" y2="128"/>
    <line x1="316" y1="76" x2="404" y2="128"/>
    <line x1="164" y1="166" x2="122" y2="218"/>
    <line x1="196" y1="166" x2="238" y2="218"/>
    <line x1="420" y1="166" x2="420" y2="218"/>
  </g>
  <!-- dashed subtree enclosures -->
  <rect x="82" y="118" width="196" height="150" rx="16" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="392" y="118" width="58" height="150" rx="16" fill="none" stroke="#b57f30" stroke-width="1.6" stroke-dasharray="6 4"/>
  <g text-anchor="middle" font-weight="600">
    <circle cx="300" cy="60" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="300" y="66" fill="#1a2026">2</text>
    <circle cx="180" cy="150" r="20" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="180" y="156" fill="#1a2026">8</text>
    <circle cx="420" cy="150" r="20" fill="#f6dede" stroke="#42525e" stroke-width="1.6"/><text x="420" y="156" fill="#1a2026">3</text>
    <circle cx="110" cy="240" r="20" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="110" y="246" fill="#1a2026">6</text>
    <circle cx="250" cy="240" r="20" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="250" y="246" fill="#1a2026">2</text>
    <circle cx="420" cy="240" r="20" fill="#f6dede" stroke="#42525e" stroke-width="1.6"/><text x="420" y="246" fill="#1a2026">5</text>
  </g>
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="300" y="30">node 0</text>
    <text x="180" y="120" fill="#4169E1" font-weight="600" stroke="#ffffff" stroke-width="4" paint-order="stroke">sum 16</text>
    <text x="424" y="120" fill="#8c6a2e" font-weight="600" stroke="#ffffff" stroke-width="4" paint-order="stroke" text-anchor="start">sum 8</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="500" y="240">The subtree at node 1 sums to 8+6+2 = 16,</text>
    <text x="500" y="258">the subtree at node 2 to 3+5 = 8:</text>
    <text x="500" y="280" fill="#4169E1" font-weight="600">16 XOR 8 = 24</text>
  </g>
</svg>
