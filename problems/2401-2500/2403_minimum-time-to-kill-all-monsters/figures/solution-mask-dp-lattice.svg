<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- power = [3,1,4]; cube of the 2^3 masks: outer square 000 001 011 010, inner 100 101 111 110;
       dp: 000:0 001:3 010:1 011:3 100:4 101:5 110:3 111:4; optimal path 000-010-110-111 accent -->
  <text x="340" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">power = [3, 1, 4] · mask bit j = monster j defeated · gain = popcount(mask) + 1</text>
  <text x="340" y="50" text-anchor="middle" fill="#5c6b76" font-size="11.5">edge label ⌈power[j] / gain⌉ = days to defeat monster j next</text>
  <!-- gray edges -->
  <g stroke="#9aa7b2" stroke-width="1.4" fill="none">
    <path d="M 184 90 L 496 90" marker-end="url(#arrowG)"/>
    <path d="M 530 112 L 530 308" marker-end="url(#arrowG)"/>
    <path d="M 184 330 L 496 330" marker-end="url(#arrowG)"/>
    <path d="M 182 110 L 229 137" marker-end="url(#arrowG)"/>
    <path d="M 498 110 L 451 137" marker-end="url(#arrowG)"/>
    <path d="M 498 310 L 451 283" marker-end="url(#arrowG)"/>
    <path d="M 299 160 L 381 160" marker-end="url(#arrowG)"/>
    <path d="M 415 182 L 415 238" marker-end="url(#arrowG)"/>
    <path d="M 265 182 L 265 238" marker-end="url(#arrowG)"/>
  </g>
  <!-- optimal path -->
  <g stroke="#4169E1" stroke-width="2.2" fill="none">
    <path d="M 150 112 L 150 308" marker-end="url(#arrowB)"/>
    <path d="M 182 310 L 230 282" marker-end="url(#arrowB)"/>
    <path d="M 299 260 L 381 260" marker-end="url(#arrowB)"/>
  </g>
  <!-- nodes: outer 000 001 011 010, inner 100 101 111 110 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="118" y="70" width="64" height="40"/><rect x="498" y="70" width="64" height="40"/>
    <rect x="498" y="310" width="64" height="40"/>
    <rect x="233" y="140" width="64" height="40"/><rect x="383" y="140" width="64" height="40"/>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
    <rect x="118" y="310" width="64" height="40"/><rect x="233" y="240" width="64" height="40"/>
  </g>
  <rect x="383" y="240" width="64" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="150" y="87">000</text><text x="530" y="87">001</text><text x="530" y="327">011</text><text x="150" y="327">010</text>
    <text x="265" y="157">100</text><text x="415" y="157">101</text><text x="415" y="257">111</text><text x="265" y="257">110</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="150" y="103">dp 0</text><text x="530" y="103">dp 3</text><text x="530" y="343">dp 3</text>
    <text x="150" y="343">dp <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="265" y="173">dp 4</text><text x="415" y="173">dp 5</text>
    <text x="265" y="273">dp <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="415" y="273">dp <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  </g>
  <!-- edge labels -->
  <g text-anchor="middle" font-size="10.5" fill="#5c6b76">
    <text x="340" y="82">⌈3/1⌉=3</text>
    <text x="340" y="350">⌈3/2⌉=2</text>
    <text x="340" y="152">⌈3/2⌉=2</text>
  </g>
  <g font-size="10.5" fill="#5c6b76">
    <text x="540" y="214">⌈1/2⌉=1</text>
    <text x="215" y="114">⌈4/1⌉=4</text>
    <text x="465" y="114" text-anchor="end">⌈4/2⌉=2</text>
    <text x="461" y="306" text-anchor="end">⌈4/3⌉=2</text>
    <text x="425" y="214">⌈1/3⌉=1</text>
    <text x="255" y="214" text-anchor="end">⌈1/2⌉=1</text>
  </g>
  <text x="140" y="214" text-anchor="end" font-size="10.5" fill="#4169E1" font-weight="600">⌈1/1⌉=1</text>
  <text x="221" y="306" font-size="10.5" fill="#4169E1" font-weight="600">⌈4/2⌉=2</text>
  <text x="340" y="280" text-anchor="middle" font-size="10.5" fill="#4169E1" font-weight="600">⌈3/3⌉=1</text>
  <text x="340" y="398" text-anchor="middle" fill="#1a2026" font-size="13">Every edge relaxes dp[mask | 1&lt;&lt;j] with ⌈power[j]/gain⌉ days; the accent path</text>
  <text x="340" y="416" text-anchor="middle" fill="#1a2026" font-size="13">000 → 010 → 110 → 111 defeats powers 1, 4, 3 at gains 1, 2, 3 — dp[111] = <tspan fill="#4169E1" font-weight="600">4 days</tspan>.</text>
</svg>
