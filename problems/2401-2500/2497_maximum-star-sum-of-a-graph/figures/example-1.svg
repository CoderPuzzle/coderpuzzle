<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="222" y1="126" x2="118" y2="82"/>
    <line x1="204" y1="140" x2="132" y2="196"/>
    <line x1="228" y1="126" x2="358" y2="162"/>
    <line x1="396" y1="150" x2="470" y2="96"/>
    <line x1="404" y1="160" x2="478" y2="160"/>
    <line x1="396" y1="172" x2="470" y2="226"/>
  </g>
  <!-- winning star edges -->
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="228" y1="126" x2="358" y2="162"/>
    <line x1="396" y1="150" x2="470" y2="96"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <circle cx="100" cy="72" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="100" y="78" fill="#1a2026">1</text>
    <circle cx="210" cy="120" r="20" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="210" y="126" fill="#1a2026">2</text>
    <circle cx="110" cy="210" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="110" y="216" fill="#1a2026">3</text>
    <circle cx="380" cy="160" r="20" fill="#4169E1" stroke="#42525e" stroke-width="1.6"/><text x="380" y="166" fill="#ffffff">4</text>
    <circle cx="488" cy="86" r="20" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="488" y="92" fill="#1a2026">10</text>
    <circle cx="496" cy="160" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="496" y="166" fill="#5c6b76">-10</text>
    <circle cx="488" cy="234" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="488" y="240" fill="#5c6b76">-20</text>
  </g>
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="100" y="44">0</text><text x="210" y="158">1</text><text x="110" y="248">2</text>
    <text x="345" y="196">3</text><text x="488" y="58">4</text><text x="530" y="166">5</text><text x="522" y="240">6</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="60" y="274">With k = 2, the star at node 3 keeps neighbours 1 and 4:</text>
    <text x="60" y="292" fill="#4169E1" font-weight="600">4 + 2 + 10 = 16</text>
  </g>
</svg>
