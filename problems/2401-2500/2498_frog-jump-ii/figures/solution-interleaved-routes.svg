<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 1: stones [0,2,5,6,7] at x = 80 + 70*pos on line y 150; outbound leg (indices 0,2,4) arcs above, return leg (indices 0,1,3,4) arcs below; hop lengths labeled -->
  <text x="80" y="40" fill="#4169E1" font-size="12.5" font-weight="600">outbound: indices 0, 2, 4</text>
  <line x1="56" y1="150" x2="600" y2="150" stroke="#9aa7b2" stroke-width="1.2"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="80" cy="150" r="13"/><circle cx="220" cy="150" r="13"/><circle cx="430" cy="150" r="13"/>
    <circle cx="500" cy="150" r="13"/><circle cx="570" cy="150" r="13"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12.5" fill="#1a2026">
    <text x="80" y="155">0</text><text x="220" y="155">2</text><text x="430" y="155">5</text>
    <text x="500" y="155">6</text><text x="570" y="155">7</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 80 133 Q 255 44 424 133" marker-end="url(#arrowB)"/>
    <path d="M 430 133 Q 500 84 564 133" marker-end="url(#arrowB)"/>
  </g>
  <text x="252" y="74" text-anchor="middle" fill="#4169E1" font-size="14" font-weight="600">5</text>
  <text x="497" y="94" text-anchor="middle" fill="#42525e" font-size="13">2</text>
  <g stroke="#5c6b76" stroke-width="1.8" fill="none">
    <path d="M 80 167 Q 148 220 214 167" marker-end="url(#arrow)"/>
    <path d="M 220 167 Q 360 252 494 167" marker-end="url(#arrow)"/>
    <path d="M 500 167 Q 535 196 564 167" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="13">
    <text x="146" y="222">2</text>
    <text x="357" y="238">4</text>
    <text x="540" y="204">1</text>
  </g>
  <text x="80" y="272" fill="#5c6b76" font-size="12.5" font-weight="600">return: indices 1, 3, 4 (drawn left to right)</text>
  <text x="330" y="298" text-anchor="middle" fill="#1a2026" font-size="13">Both legs hop only second neighbors, so the answer is the largest</text>
  <text x="330" y="316" text-anchor="middle" fill="#1a2026" font-size="13">second-neighbor gap: stones[2] − stones[0] = 5 − 0 = <tspan fill="#4169E1" font-weight="600">5</tspan>, the 0 → 5 jump.</text>
</svg>
