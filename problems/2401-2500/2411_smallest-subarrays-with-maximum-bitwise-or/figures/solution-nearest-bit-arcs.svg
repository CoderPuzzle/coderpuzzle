<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="284" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums = [1,0,2,1,3]; cells 94x44 at x = 70 + 110i, y = 50; centers 117,227,337,447,557;
       nearest bit-1 (value 2) at [2,2,2,4,4]; nearest bit-0 (value 1) at [0,3,3,3,4];
       answer = [3,3,2,2,1]; accent arc = longest reach per index, gray = other bit -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="70" y="50" width="94" height="44"/><rect x="180" y="50" width="94" height="44"/>
    <rect x="290" y="50" width="94" height="44"/><rect x="400" y="50" width="94" height="44"/>
    <rect x="510" y="50" width="94" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="117" y="77">1</text><text x="227" y="77">0</text><text x="337" y="77">2</text>
    <text x="447" y="77">1</text><text x="557" y="77">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="117" y="40">i = 0</text><text x="227" y="40">i = 1</text><text x="337" y="40">i = 2</text>
    <text x="447" y="40">i = 3</text><text x="557" y="40">i = 4</text>
  </g>
  <!-- bit-1 (value 2) arcs: 0->2 decides i=0, 1->2, 3->4 decides i=3 -->
  <g fill="none" stroke-width="1.8">
    <path d="M 117 96 Q 227 156 330 96" stroke="#4169E1" marker-end="url(#arrow)"/>
    <path d="M 227 96 Q 282 180 344 96" stroke="#5c6b76" marker-end="url(#arrowg)"/>
    <path d="M 447 96 Q 502 156 557 96" stroke="#4169E1" marker-end="url(#arrow)"/>
  </g>
  <!-- bit-0 (value 1) arcs: 1->3 decides i=1, 2->3 decides i=2 -->
  <g fill="none" stroke-width="1.8">
    <path d="M 227 96 Q 337 228 440 96" stroke="#4169E1" marker-end="url(#arrow)"/>
    <path d="M 337 96 Q 392 204 454 96" stroke="#4169E1" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="40" y="126">bit 1 (value 2)</text>
    <text x="40" y="162">bit 0 (value 1)</text>
  </g>
  <text x="40" y="200" fill="#5c6b76" font-size="12.5">answer</text>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#4169E1">
    <text x="117" y="200">3</text><text x="227" y="200">3</text><text x="337" y="200">2</text>
    <text x="447" y="200">2</text><text x="557" y="200">1</text>
  </g>
  <text x="40" y="228" fill="#5c6b76" font-size="12.5">accent = the arc that fixes answer[i]; gray = the other bit's nearest position; own bits: length 1</text>
  <text x="40" y="250" fill="#1a2026" font-size="13">answer[i] is simply the longest arc: at i = 1 bit 0 is first set again at index 3,</text>
  <text x="40" y="268" fill="#1a2026" font-size="13">so the shortest maximum-OR subarray there is [0,2,1] — the answers are <tspan fill="#4169E1" font-weight="600">[3,3,2,2,1]</tspan>.</text>
</svg>
