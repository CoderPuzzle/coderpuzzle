<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 504" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="504" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- columns = value axis v = 1..8 then 15 (cells 52x26, pitch 56x44, first cell at (152,52));
       rows = scan steps over nums = [4,2,1,4,3,4,5,8,15], k = 3;
       accented cell = best[x] just written; arc = range-max window [x-3, x-1] feeding it -->
  <text x="40" y="40" fill="#5c6b76" font-size="12.5">value v</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="178" y="40">1</text><text x="234" y="40">2</text><text x="290" y="40">3</text>
    <text x="346" y="40">4</text><text x="402" y="40">5</text><text x="458" y="40">6</text>
    <text x="514" y="40">7</text><text x="570" y="40">8</text>
    <text x="601" y="40">···</text><text x="638" y="40">15</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="138" y="70">x = 4</text><text x="138" y="114">x = 2</text><text x="138" y="158">x = 1</text>
    <text x="138" y="202">x = 4</text><text x="138" y="246">x = 3</text><text x="138" y="290">x = 4</text>
    <text x="138" y="334">x = 5</text><text x="138" y="378">x = 8</text><text x="138" y="422">x = 15</text>
  </g>
  <!-- inactive (not yet written) cells -->
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1">
    <rect x="152" y="52" width="52" height="26"/><rect x="208" y="52" width="52" height="26"/><rect x="264" y="52" width="52" height="26"/><rect x="376" y="52" width="52" height="26"/><rect x="432" y="52" width="52" height="26"/><rect x="488" y="52" width="52" height="26"/><rect x="544" y="52" width="52" height="26"/><rect x="612" y="52" width="52" height="26"/>
    <rect x="152" y="96" width="52" height="26"/><rect x="264" y="96" width="52" height="26"/><rect x="376" y="96" width="52" height="26"/><rect x="432" y="96" width="52" height="26"/><rect x="488" y="96" width="52" height="26"/><rect x="544" y="96" width="52" height="26"/><rect x="612" y="96" width="52" height="26"/>
    <rect x="376" y="140" width="52" height="26"/><rect x="432" y="140" width="52" height="26"/><rect x="488" y="140" width="52" height="26"/><rect x="544" y="140" width="52" height="26"/><rect x="612" y="140" width="52" height="26"/>
    <rect x="264" y="184" width="52" height="26"/><rect x="376" y="184" width="52" height="26"/><rect x="432" y="184" width="52" height="26"/><rect x="488" y="184" width="52" height="26"/><rect x="544" y="184" width="52" height="26"/><rect x="612" y="184" width="52" height="26"/>
    <rect x="376" y="228" width="52" height="26"/><rect x="432" y="228" width="52" height="26"/><rect x="488" y="228" width="52" height="26"/><rect x="544" y="228" width="52" height="26"/><rect x="612" y="228" width="52" height="26"/>
    <rect x="376" y="272" width="52" height="26"/><rect x="432" y="272" width="52" height="26"/><rect x="488" y="272" width="52" height="26"/><rect x="544" y="272" width="52" height="26"/><rect x="612" y="272" width="52" height="26"/>
    <rect x="432" y="316" width="52" height="26"/><rect x="488" y="316" width="52" height="26"/><rect x="544" y="316" width="52" height="26"/><rect x="612" y="316" width="52" height="26"/>
    <rect x="432" y="360" width="52" height="26"/><rect x="488" y="360" width="52" height="26"/><rect x="612" y="360" width="52" height="26"/>
    <rect x="432" y="404" width="52" height="26"/><rect x="488" y="404" width="52" height="26"/>
  </g>
  <!-- cells written on earlier steps -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1">
    <rect x="208" y="96" width="52" height="26"/><rect x="320" y="96" width="52" height="26"/>
    <rect x="152" y="140" width="52" height="26"/><rect x="208" y="140" width="52" height="26"/><rect x="320" y="140" width="52" height="26"/>
    <rect x="152" y="184" width="52" height="26"/><rect x="208" y="184" width="52" height="26"/>
    <rect x="152" y="228" width="52" height="26"/><rect x="208" y="228" width="52" height="26"/><rect x="320" y="228" width="52" height="26"/>
    <rect x="152" y="272" width="52" height="26"/><rect x="208" y="272" width="52" height="26"/><rect x="264" y="272" width="52" height="26"/>
    <rect x="152" y="316" width="52" height="26"/><rect x="208" y="316" width="52" height="26"/><rect x="264" y="316" width="52" height="26"/><rect x="320" y="316" width="52" height="26"/>
    <rect x="152" y="360" width="52" height="26"/><rect x="208" y="360" width="52" height="26"/><rect x="264" y="360" width="52" height="26"/><rect x="320" y="360" width="52" height="26"/><rect x="376" y="360" width="52" height="26"/>
    <rect x="152" y="404" width="52" height="26"/><rect x="208" y="404" width="52" height="26"/><rect x="264" y="404" width="52" height="26"/><rect x="320" y="404" width="52" height="26"/><rect x="376" y="404" width="52" height="26"/><rect x="544" y="404" width="52" height="26"/>
  </g>
  <!-- the cell each step writes -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="320" y="52" width="52" height="26"/>
    <rect x="208" y="96" width="52" height="26"/>
    <rect x="152" y="140" width="52" height="26"/>
    <rect x="320" y="184" width="52" height="26"/>
    <rect x="264" y="228" width="52" height="26"/>
    <rect x="320" y="272" width="52" height="26"/>
    <rect x="376" y="316" width="52" height="26"/>
    <rect x="544" y="360" width="52" height="26"/>
    <rect x="612" y="404" width="52" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="346" y="114">1</text>
    <text x="234" y="158">1</text><text x="346" y="158">1</text>
    <text x="178" y="202">1</text><text x="234" y="202">1</text>
    <text x="178" y="246">1</text><text x="234" y="246">1</text><text x="346" y="246">2</text>
    <text x="178" y="290">1</text><text x="234" y="290">1</text><text x="290" y="290">2</text>
    <text x="178" y="334">1</text><text x="234" y="334">1</text><text x="290" y="334">2</text><text x="346" y="334">3</text>
    <text x="178" y="378">1</text><text x="234" y="378">1</text><text x="290" y="378">2</text><text x="346" y="378">3</text><text x="402" y="378">4</text>
    <text x="178" y="422">1</text><text x="234" y="422">1</text><text x="290" y="422">2</text><text x="346" y="422">3</text><text x="402" y="422">4</text><text x="570" y="422">5</text>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#4169E1">
    <text x="346" y="70">1</text>
    <text x="234" y="114">1</text>
    <text x="178" y="158">1</text>
    <text x="346" y="202">2</text>
    <text x="290" y="246">2</text>
    <text x="346" y="290">3</text>
    <text x="402" y="334">4</text>
    <text x="570" y="378">5</text>
    <text x="638" y="422">1</text>
  </g>
  <!-- window arcs: row4 [1,3]->4, row5 [1,2]->3, row6 [1,3]->4, row7 [2,4]->5, row8 [5,7]->8 -->
  <g fill="none" stroke="#4169E1" stroke-width="1.8">
    <path d="M 178 212 Q 262 226 343 211" marker-end="url(#arrow)"/>
    <path d="M 178 256 Q 234 270 287 255" marker-end="url(#arrow)"/>
    <path d="M 178 300 Q 262 314 343 299" marker-end="url(#arrow)"/>
    <path d="M 234 344 Q 318 358 399 343" marker-end="url(#arrow)"/>
    <path d="M 402 388 Q 486 402 567 387" marker-end="url(#arrow)"/>
  </g>
  <text x="40" y="452" fill="#5c6b76" font-size="12.5">arc = range-max over [x - 3, x - 1]; empty window gives 1; accented cell = just written</text>
  <text x="40" y="474" fill="#1a2026" font-size="13">Scanning nums = [4,2,1,4,3,4,5,8,15] with k = 3, each best[x] = 1 + its window max;</text>
  <text x="40" y="492" fill="#1a2026" font-size="13">the largest value ever written is <tspan fill="#4169E1" font-weight="600">best[8] = 5</tspan> — the length of [1,3,4,5,8].</text>
</svg>
