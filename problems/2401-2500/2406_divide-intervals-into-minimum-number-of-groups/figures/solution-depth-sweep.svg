<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <!-- time axis t -> 60 + 48*t -->
  <line x1="60" y1="176" x2="636" y2="176" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="60" y1="176" x2="60" y2="184"/><line x1="156" y1="176" x2="156" y2="184"/>
    <line x1="252" y1="176" x2="252" y2="184"/><line x1="348" y1="176" x2="348" y2="184"/>
    <line x1="444" y1="176" x2="444" y2="184"/><line x1="540" y1="176" x2="540" y2="184"/>
    <line x1="636" y1="176" x2="636" y2="184"/>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="60" y="200">0</text><text x="156" y="200">2</text><text x="252" y="200">4</text>
    <text x="348" y="200">6</text><text x="444" y="200">8</text><text x="540" y="200">10</text><text x="636" y="200">12</text>
  </g>
  <!-- interval bars -->
  <g fill="#4169E1">
    <rect x="108" y="52" width="240" height="16" rx="7"/>
    <rect x="108" y="74" width="528" height="16" rx="7"/>
    <rect x="156" y="96" width="48" height="16" rx="7"/>
    <rect x="300" y="118" width="240" height="16" rx="7"/>
    <rect x="348" y="140" width="96" height="16" rx="7"/>
  </g>
  <g fill="#ffffff" font-size="11.5" font-weight="600">
    <text x="228" y="64">[1,5]</text><text x="372" y="86">[1,10]</text>
    <text x="180" y="108">[2,3]</text><text x="420" y="130">[5,10]</text><text x="396" y="152">[6,8]</text>
  </g>
  <!-- depth steps: y = 252 - 20*d -->
  <path d="M 60 252 L 108 252 L 108 212 L 156 212 L 156 192 L 252 192 L 252 212 L 300 212 L 300 192 L 492 192 L 492 212 L 588 212 L 588 252" fill="none" stroke="#4169E1" stroke-width="2.4"/>
  <!-- depth axis -->
  <g fill="#5c6b76" font-size="12" text-anchor="end">
    <text x="52" y="256">0</text><text x="52" y="236">1</text><text x="52" y="216">2</text><text x="52" y="196">3</text>
  </g>
  <line x1="156" y1="192" x2="492" y2="192" stroke="#4169E1" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="324" y="184" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">peak depth 3</text>
  <text x="60" y="300" fill="#1a2026" font-size="13">Depth hits 3 where [1,5], [1,10], [2,3] coincide and again at the touching point t = 5 and beyond —</text>
  <text x="60" y="318" fill="#1a2026" font-size="13">the sweep counts a start before an equal end, so [1,5] and [5,10] intersect. Answer <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
