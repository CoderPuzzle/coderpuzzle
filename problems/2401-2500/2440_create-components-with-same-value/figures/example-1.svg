<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 278" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- nums = [6,2,2,2,6], edges = [[0,1],[1,2],[1,3],[3,4]]; delete [0,1] and [3,4] -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="230" y1="112" x2="140" y2="190"/>
    <line x1="230" y1="112" x2="320" y2="190"/>
  </g>
  <g stroke="#8b96a0" stroke-width="1.6" stroke-dasharray="5 4">
    <line x1="230" y1="38" x2="230" y2="112"/>
    <line x1="320" y1="190" x2="430" y2="190"/>
  </g>
  <circle cx="230" cy="38" r="20" fill="#e6ecfb" stroke="#4169E1" stroke-width="1.8"/>
  <g stroke="#b57f30" stroke-width="1.6" fill="#f6ecd9">
    <circle cx="230" cy="112" r="20"/>
    <circle cx="140" cy="190" r="20"/>
    <circle cx="320" cy="190" r="20"/>
  </g>
  <circle cx="430" cy="190" r="20" fill="#dff0e6" stroke="#3f8f5f" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="230" y="43">0</text>
    <text x="230" y="117">1</text>
    <text x="140" y="195">2</text>
    <text x="320" y="195">3</text>
    <text x="430" y="195">4</text>
  </g>
  <g font-size="12.5" font-weight="600">
    <text x="262" y="42" fill="#4169E1">6</text>
    <text x="262" y="116" fill="#7a5a1e">2</text>
    <text x="108" y="194" fill="#7a5a1e" text-anchor="end">2</text>
    <text x="320" y="224" fill="#7a5a1e" text-anchor="middle">2</text>
    <text x="466" y="194" fill="#3f8f5f">6</text>
  </g>
  <text x="230" y="262" text-anchor="middle" fill="#1a2026" font-size="13.5">delete the dashed edges → components [0], [1,2,3], [4] each sum to <tspan fill="#4169E1" font-weight="700">6</tspan></text>
</svg>
