<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="364" fill="#ffffff"/>
  <!-- nums = [6,2,2,2,6], edges 0-1, 1-2, 1-3, 3-4, rooted at 0; total = 18 -->
  <!-- subtree sums: n0 18, n1 12, n2 2, n3 8, n4 6; greedy v = 6 cuts edges 0-1 and 3-4 (dashed) -->
  <!-- circles r=22; tint #dbe4fb = piece {0}, #f0f3f7 = piece {4}, white = piece {1,2,3} -->
  <text x="150" y="26" text-anchor="middle" fill="#5c6b76" font-size="11.5">subtree sums (total 18)</text>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="150" y1="138" x2="70" y2="212"/>
    <line x1="150" y1="138" x2="230" y2="212"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4">
    <line x1="150" y1="64" x2="150" y2="138"/>
    <line x1="230" y1="212" x2="310" y2="286"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <circle cx="150" cy="138" r="22" fill="#ffffff"/>
    <circle cx="70" cy="212" r="22" fill="#ffffff"/>
    <circle cx="230" cy="212" r="22" fill="#ffffff"/>
  </g>
  <circle cx="150" cy="64" r="22" fill="#dbe4fb" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="310" cy="286" r="22" fill="#f0f3f7" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="150" y="63">6</text><text x="150" y="137">2</text><text x="70" y="211">2</text>
    <text x="230" y="211">2</text><text x="310" y="285">6</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#9aa7b2">
    <text x="150" y="77">n0</text><text x="150" y="151">n1</text><text x="70" y="225">n2</text>
    <text x="230" y="225">n3</text><text x="310" y="299">n4</text>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="176" y="60">Σ 18</text>
    <text x="176" y="134">Σ 12</text>
    <text x="70" y="252" text-anchor="middle">Σ 2</text>
    <text x="230" y="252" text-anchor="middle">Σ 8</text>
    <text x="338" y="290">Σ 6</text>
  </g>
  <g fill="#4169E1" font-size="10.5" font-weight="600">
    <text x="158" y="98">cut</text>
    <text x="252" y="228">cut</text>
  </g>
  <text x="150" y="300" text-anchor="middle" fill="#9aa7b2" font-size="10.5">tints mark pieces {0} and {4}</text>
  <!-- greedy trace -->
  <text x="400" y="58" fill="#1a2026" font-size="12.5" font-weight="600">greedy cut, v = 6 (bottom-up)</text>
  <g fill="#1a2026" font-size="12.5">
    <text x="400" y="82">node 2: running 2 — pass up</text>
    <text x="400" y="104">node 4: running <tspan fill="#4169E1" font-weight="600">6 = v</tspan> — cut 3–4</text>
    <text x="400" y="126">node 3: 2 left — pass up</text>
    <text x="400" y="148">node 1: running <tspan fill="#4169E1" font-weight="600">6 = v</tspan> — cut 0–1</text>
    <text x="400" y="170">node 0: <tspan fill="#4169E1" font-weight="600">6 = v</tspan> at the root — done</text>
    <text x="400" y="200">divisor sweep: v = 1, 2, 3 die on</text>
    <text x="400" y="218">the guard v ≥ max node = 6</text>
    <text x="400" y="242">v = 6: divisible sums {18, 12, 6},</text>
    <text x="400" y="260">count 3 = k — accept, k = 3</text>
  </g>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">The cut reaches v = 6 three times: pieces {0}, {1, 2, 3}, {4}, and 3 × 6 = 18.</text>
  <text x="320" y="338" text-anchor="middle" fill="#1a2026" font-size="13">k = 3 components → 3 − 1 = <tspan fill="#4169E1" font-weight="600">2</tspan> deleted edges (0–1 and 3–4).</text>
</svg>
