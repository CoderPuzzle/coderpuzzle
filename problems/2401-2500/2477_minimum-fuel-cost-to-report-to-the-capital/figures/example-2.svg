<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="380" fill="#ffffff"/>
  <!-- edges: 3-1, 3-2, 1-0, 0-4, 0-5, 4-6 -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="300" y1="82" x2="300" y2="128"/>
    <line x1="284" y1="74" x2="176" y2="160"/>
    <line x1="316" y1="74" x2="424" y2="160"/>
    <line x1="148" y1="190" x2="110" y2="250"/>
    <line x1="448" y1="190" x2="490" y2="250"/>
    <line x1="500" y1="262" x2="556" y2="322"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <circle cx="300" cy="60" r="20" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="300" y="66" fill="#1a2026">0</text>
    <circle cx="300" cy="150" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="300" y="156" fill="#1a2026">5</text>
    <circle cx="160" cy="174" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="160" y="180" fill="#1a2026">4</text>
    <circle cx="440" cy="174" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="440" y="180" fill="#1a2026">1</text>
    <circle cx="100" cy="268" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="100" y="274" fill="#1a2026">6</text>
    <circle cx="500" cy="268" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="500" y="274" fill="#1a2026">3</text>
    <circle cx="566" cy="340" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/><text x="566" y="346" fill="#1a2026">2</text>
  </g>
  <text x="300" y="28" font-size="12" fill="#5c6b76" text-anchor="middle">capital</text>
  <!-- liters per edge -->
  <g font-size="12" fill="#5c6b76">
    <text x="310" y="112">1 L</text>
    <text x="240" y="134">1 L</text>
    <text x="390" y="130" fill="#4169E1" font-weight="600">2 L</text>
    <text x="118" y="234">1 L</text>
    <text x="478" y="234">1 L</text>
    <text x="548" y="300">1 L</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="60" y="332">With seats = 2, reps 1, 2 and 3 share the</text>
    <text x="60" y="350">edge 1 -&gt; 0 (3 people, 2 cars):</text>
    <text x="60" y="372" fill="#4169E1" font-weight="600">total 1+1+1+2+1+1 = 7 liters</text>
  </g>
</svg>
