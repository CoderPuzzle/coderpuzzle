<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 386" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="386" fill="#ffffff"/>
  <!-- n = 3, x = 5; logs sorted by time: [1,3],[1,5],[2,6]; axis x(t) = 80 + 45(t-3) for t = 3..11; bands: q = 10 -> [5,10] x 170..395, q = 11 -> [6,11] x 215..440 -->
  <text x="22" y="22" fill="#5c6b76" font-size="12.5">logs sorted by time &#8212; s1@3, s1@5, s2@6 &#183; x = 5 &#183; n = 3</text>
  <text x="22" y="46" fill="#1a2026" font-size="13" font-weight="600">q = 10 &#8594; band [5, 10]</text>
  <text x="490" y="46" fill="#5c6b76" font-size="12.5">in band: s1 &#215;1, s2 &#215;1</text>
  <text x="490" y="68" fill="#1a2026" font-size="14" font-weight="600">distinct 2 &#8594; 3 &#8722; 2 = <tspan fill="#4169E1">1</tspan></text>
  <rect x="170" y="74" width="225" height="28" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="11.5" font-weight="600">
    <text x="80" y="66" fill="#9aa7b2">s1</text>
    <text x="170" y="66" fill="#1a2026">s1</text>
    <text x="215" y="66" fill="#1a2026">s2</text>
  </g>
  <line x1="60" y1="112" x2="460" y2="112" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="80" y1="112" x2="80" y2="117"/><line x1="125" y1="112" x2="125" y2="117"/>
    <line x1="170" y1="112" x2="170" y2="117"/><line x1="215" y1="112" x2="215" y2="117"/>
    <line x1="260" y1="112" x2="260" y2="117"/><line x1="305" y1="112" x2="305" y2="117"/>
    <line x1="350" y1="112" x2="350" y2="117"/><line x1="395" y1="112" x2="395" y2="117"/>
    <line x1="440" y1="112" x2="440" y2="117"/>
  </g>
  <g fill="#9aa7b2" font-size="11" text-anchor="middle">
    <text x="80" y="132">3</text><text x="125" y="132">4</text><text x="170" y="132">5</text>
    <text x="215" y="132">6</text><text x="260" y="132">7</text><text x="305" y="132">8</text>
    <text x="350" y="132">9</text><text x="395" y="132">10</text><text x="440" y="132">11</text>
  </g>
  <circle cx="80" cy="112" r="5.5" fill="#9aa7b2"/>
  <circle cx="170" cy="112" r="5.5" fill="#4169E1"/>
  <circle cx="215" cy="112" r="5.5" fill="#4169E1"/>
  <text x="22" y="156" fill="#5c6b76" font-size="12.5">right pointer swept all logs with t &#8804; 10; left pointer drops s1@3 (t = 3 &lt; 5)</text>
  <text x="22" y="206" fill="#1a2026" font-size="13" font-weight="600">q = 11 &#8594; band [6, 11]</text>
  <text x="490" y="206" fill="#5c6b76" font-size="12.5">in band: s2 &#215;1</text>
  <text x="490" y="228" fill="#1a2026" font-size="14" font-weight="600">distinct 1 &#8594; 3 &#8722; 1 = <tspan fill="#4169E1">2</tspan></text>
  <rect x="215" y="234" width="225" height="28" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="11.5" font-weight="600">
    <text x="80" y="226" fill="#9aa7b2">s1</text>
    <text x="170" y="226" fill="#9aa7b2">s1</text>
    <text x="215" y="226" fill="#1a2026">s2</text>
  </g>
  <line x1="60" y1="272" x2="460" y2="272" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="80" y1="272" x2="80" y2="277"/><line x1="125" y1="272" x2="125" y2="277"/>
    <line x1="170" y1="272" x2="170" y2="277"/><line x1="215" y1="272" x2="215" y2="277"/>
    <line x1="260" y1="272" x2="260" y2="277"/><line x1="305" y1="272" x2="305" y2="277"/>
    <line x1="350" y1="272" x2="350" y2="277"/><line x1="395" y1="272" x2="395" y2="277"/>
    <line x1="440" y1="272" x2="440" y2="277"/>
  </g>
  <g fill="#9aa7b2" font-size="11" text-anchor="middle">
    <text x="80" y="292">3</text><text x="125" y="292">4</text><text x="170" y="292">5</text>
    <text x="215" y="292">6</text><text x="260" y="292">7</text><text x="305" y="292">8</text>
    <text x="350" y="292">9</text><text x="395" y="292">10</text><text x="440" y="292">11</text>
  </g>
  <circle cx="80" cy="272" r="5.5" fill="#9aa7b2"/>
  <circle cx="170" cy="272" r="5.5" fill="#9aa7b2"/>
  <circle cx="215" cy="272" r="5.5" fill="#4169E1"/>
  <text x="22" y="316" fill="#5c6b76" font-size="12.5">left pointer drops s1@5 (t = 5 &lt; 6); the inclusive edge keeps s2@6 at t = 6</text>
  <text x="22" y="348" fill="#1a2026" font-size="13">Sorted logs make each band one contiguous run: q = 10 keeps s1@5 + s2@6,</text>
  <text x="22" y="366" fill="#1a2026" font-size="13">q = 11 only s2@6 &#8212; the answers n &#8722; distinct are <tspan fill="#4169E1" font-weight="600">1</tspan> and <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
