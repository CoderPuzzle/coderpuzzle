<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- n = 4, edges = [[0,1,1],[1,2,3],[2,3,2],[0,3,4]], s = 0, marked = [2,3]; nodes r=21 at 0:(150,130) 1:(320,62) 2:(490,130) 3:(320,205) -->
  <g stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="171" y1="121" x2="296" y2="72"/>
    <line x1="344" y1="72" x2="469" y2="121"/>
    <line x1="171" y1="139" x2="296" y2="194"/>
    <line x1="469" y1="139" x2="344" y2="194"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="218" y="86">1</text>
    <text x="422" y="86">3</text>
    <text x="218" y="194">4</text>
    <text x="422" y="194">2</text>
  </g>
  <circle cx="150" cy="130" r="21" fill="#4169E1"/>
  <text x="150" y="135" text-anchor="middle" fill="#ffffff" font-weight="600">0</text>
  <circle cx="320" cy="62" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="320" y="67" text-anchor="middle" fill="#1a2026" font-weight="600">1</text>
  <circle cx="490" cy="130" r="21" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="490" y="135" text-anchor="middle" fill="#1a2026" font-weight="600">2</text>
  <circle cx="320" cy="205" r="21" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="320" y="210" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <g text-anchor="middle" font-size="12">
    <text x="150" y="98" fill="#5c6b76">s</text>
    <text x="490" y="98" fill="#4169E1">marked</text>
    <text x="320" y="248" fill="#4169E1">marked</text>
  </g>
  <!-- pops in order: (0,0), (1,1), (4,3), (4,2); relaxing 2->3 gives 6 > 4 so nothing is pushed -->
  <text x="88" y="276" fill="#5c6b76" font-size="12.5">min-heap pops (distance, node), in order:</text>
  <g font-size="13">
    <text x="88" y="300" fill="#1a2026">pop (0, 0)</text>
    <text x="185" y="300" fill="#5c6b76">&#8594;</text>
    <text x="208" y="300" fill="#1a2026">dist[0] = 0 &#183; push (1, 1), (4, 3)</text>
    <text x="88" y="324" fill="#1a2026">pop (1, 1)</text>
    <text x="185" y="324" fill="#5c6b76">&#8594;</text>
    <text x="208" y="324" fill="#1a2026">dist[1] = 1 &#183; push (4, 2)</text>
    <text x="88" y="348" fill="#1a2026">pop (4, 3)</text>
    <text x="185" y="348" fill="#5c6b76">&#8594;</text>
    <text x="208" y="348" fill="#1a2026">dist[3] = <tspan fill="#4169E1" font-weight="600">4</tspan> (marked)</text>
    <text x="88" y="372" fill="#1a2026">pop (4, 2)</text>
    <text x="185" y="372" fill="#5c6b76">&#8594;</text>
    <text x="208" y="372" fill="#1a2026">dist[2] = <tspan fill="#4169E1" font-weight="600">4</tspan> (marked) &#183; <tspan fill="#5c6b76">2&#8594;3: 4 + 2 = 6 &gt; 4, no push</tspan></text>
  </g>
  <text x="40" y="408" fill="#1a2026" font-size="13">Both marked nodes settle at 4 &#8212; 0&#8594;3 directly, and 0&#8594;1&#8594;2 at 1 + 3 = 4 &#8212;</text>
  <text x="40" y="426" fill="#1a2026" font-size="13">so the minimum marked distance is <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
