<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 202" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- positions=[5,4,3,2,1], healths=[2,17,9,15,10], directions="RRRRR"; no robot ever meets another (verified by stack simulation) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <line x1="40" y1="134" x2="560" y2="134" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="70" y1="129" x2="70" y2="139"/>
    <line x1="185" y1="129" x2="185" y2="139"/>
    <line x1="300" y1="129" x2="300" y2="139"/>
    <line x1="415" y1="129" x2="415" y2="139"/>
    <line x1="530" y1="129" x2="530" y2="139"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="70" cy="62" r="18"/>
    <circle cx="185" cy="62" r="18"/>
    <circle cx="300" cy="62" r="18"/>
    <circle cx="415" cy="62" r="18"/>
    <circle cx="530" cy="62" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="70" y="67">10</text>
    <text x="185" y="67">15</text>
    <text x="300" y="67">9</text>
    <text x="415" y="67">17</text>
    <text x="530" y="67">2</text>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="70" y="22">robot 5</text>
    <text x="185" y="22">robot 4</text>
    <text x="300" y="22">robot 3</text>
    <text x="415" y="22">robot 2</text>
    <text x="530" y="22">robot 1</text>
    <text x="70" y="162">pos 1</text>
    <text x="185" y="162">pos 2</text>
    <text x="300" y="162">pos 3</text>
    <text x="415" y="162">pos 4</text>
    <text x="530" y="162">pos 5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="52" y1="102" x2="86" y2="102" marker-end="url(#arrow)"/>
    <line x1="167" y1="102" x2="201" y2="102" marker-end="url(#arrow)"/>
    <line x1="282" y1="102" x2="316" y2="102" marker-end="url(#arrow)"/>
    <line x1="397" y1="102" x2="431" y2="102" marker-end="url(#arrow)"/>
    <line x1="512" y1="102" x2="546" y2="102" marker-end="url(#arrow)"/>
  </g>
  <text x="300" y="192" text-anchor="middle" fill="#1a2026" font-size="13.5">all five robots move right — nobody collides, healths stay <tspan fill="#4169E1" font-weight="700">[2, 17, 9, 15, 10]</tspan></text>
</svg>
