<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <!-- number line -->
  <line x1="40" y1="80" x2="600" y2="80" stroke="#98a2ac" stroke-width="1.4"/>
  <g stroke="#98a2ac" stroke-width="1.2">
    <line x1="160" y1="74" x2="160" y2="86"/>
    <line x1="260" y1="74" x2="260" y2="86"/>
    <line x1="460" y1="74" x2="460" y2="86"/>
    <line x1="560" y1="74" x2="560" y2="86"/>
  </g>
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="160" y="104">2</text><text x="260" y="104">3</text><text x="460" y="104">5</text><text x="560" y="104">6</text>
  </g>
  <!-- robots -->
  <g text-anchor="middle">
    <circle cx="160" cy="52" r="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
    <text x="160" y="57" fill="#1a2026" font-weight="600">15</text>
    <line x1="182" y1="52" x2="208" y2="52" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
    <circle cx="260" cy="52" r="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
    <text x="260" y="57" fill="#1a2026" font-weight="600">10</text>
    <line x1="282" y1="52" x2="308" y2="52" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
    <circle cx="460" cy="52" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
    <text x="460" y="57" fill="#1a2026" font-weight="600">10</text>
    <line x1="438" y1="52" x2="412" y2="52" stroke="#1a2026" stroke-width="1.8" marker-end="url(#arrow)"/>
    <circle cx="560" cy="52" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.8"/>
    <text x="560" y="57" fill="#1a2026" font-weight="600">12</text>
    <line x1="538" y1="52" x2="512" y2="52" stroke="#1a2026" stroke-width="1.8" marker-end="url(#arrow)"/>
  </g>
  <text x="320" y="22" text-anchor="middle" fill="#5c6b76" font-size="12.5">sorted by position: R 15 · R 10 · L 10 · L 12 (health inside)</text>
  <!-- stack snapshots -->
  <text x="320" y="136" text-anchor="middle" fill="#1a2026" font-weight="600">stack of right-movers</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="72" y="196" width="52" height="30" rx="4" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/>
    <text x="98" y="216" fill="#1a2026" font-weight="600">15</text>
    <text x="98" y="250" fill="#5c6b76">pos 2 (R) pushed</text>
    <rect x="202" y="226" width="52" height="30" rx="4" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/>
    <rect x="202" y="196" width="52" height="30" rx="4" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/>
    <text x="228" y="246" fill="#1a2026" font-weight="600">10</text>
    <text x="228" y="216" fill="#1a2026" font-weight="600">15</text>
    <text x="228" y="272" fill="#5c6b76">pos 3 (R) pushed</text>
    <rect x="332" y="196" width="52" height="30" rx="4" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6"/>
    <text x="358" y="216" fill="#1a2026" font-weight="600">15</text>
    <rect x="322" y="226" width="72" height="30" rx="4" fill="none" stroke="#98a2ac" stroke-dasharray="4 3"/>
    <text x="358" y="246" fill="#98a2ac">10 = 10</text>
    <text x="358" y="272" fill="#5c6b76">pos 5 (L): equal →</text>
    <text x="358" y="288" fill="#5c6b76">both removed</text>
    <rect x="472" y="196" width="52" height="30" rx="4" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
    <text x="498" y="216" fill="#1a2026" font-weight="600">14</text>
    <text x="498" y="190" fill="#98a2ac">15 → 14</text>
    <rect x="462" y="226" width="72" height="30" rx="4" fill="none" stroke="#98a2ac" stroke-dasharray="4 3"/>
    <text x="498" y="246" fill="#98a2ac">12 &lt; 15</text>
    <text x="498" y="272" fill="#5c6b76">pos 6 (L) dies,</text>
    <text x="498" y="288" fill="#5c6b76">top survives → [14]</text>
  </g>
  <g stroke="#98a2ac" stroke-width="1.2" fill="none">
    <line x1="140" y1="211" x2="196" y2="211"/>
    <line x1="270" y1="211" x2="326" y2="211"/>
    <line x1="396" y1="211" x2="462" y2="211"/>
  </g>
</svg>
