<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 268" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- positions=[3,5,2,6], healths=[10,10,15,12], directions="RLRL"; robots 1&2 (10=10) both removed, robot 4 removed, robot 3: 15 -> 14 (verified by simulation) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <line x1="36" y1="134" x2="448" y2="134" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="70" y1="129" x2="70" y2="139"/>
    <line x1="185" y1="129" x2="185" y2="139"/>
    <line x1="300" y1="129" x2="300" y2="139"/>
    <line x1="415" y1="129" x2="415" y2="139"/>
  </g>
  <circle cx="70" cy="62" r="18" fill="#e6ecfb" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="185" cy="62" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="300" cy="62" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="415" cy="62" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="70" y="67">15</text>
    <text x="185" y="67">10</text>
    <text x="300" y="67">10</text>
    <text x="415" y="67">12</text>
  </g>
  <g stroke="#b57f30" stroke-width="2.4">
    <line x1="172" y1="49" x2="198" y2="75"/>
    <line x1="172" y1="75" x2="198" y2="49"/>
    <line x1="287" y1="49" x2="313" y2="75"/>
    <line x1="287" y1="75" x2="313" y2="49"/>
    <line x1="402" y1="49" x2="428" y2="75"/>
    <line x1="402" y1="75" x2="428" y2="49"/>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="70" y="22">robot 3</text>
    <text x="185" y="22">robot 1</text>
    <text x="300" y="22">robot 2</text>
    <text x="415" y="22">robot 4</text>
    <text x="70" y="162">pos 2</text>
    <text x="185" y="162">pos 3</text>
    <text x="300" y="162">pos 5</text>
    <text x="415" y="162">pos 6</text>
  </g>
  <text x="100" y="67" fill="#4169E1" font-size="12" font-weight="600">→ 14</text>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="52" y1="102" x2="86" y2="102" marker-end="url(#arrow)"/>
    <line x1="167" y1="102" x2="201" y2="102" marker-end="url(#arrow)"/>
    <line x1="318" y1="102" x2="284" y2="102" marker-end="url(#arrow)"/>
    <line x1="433" y1="102" x2="399" y2="102" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#b57f30" stroke-width="2.4">
    <line x1="236" y1="128" x2="248" y2="140"/>
    <line x1="236" y1="140" x2="248" y2="128"/>
  </g>
  <g fill="#7a5a1e" font-size="12.5" text-anchor="middle">
    <text x="250" y="188">10 = 10 → robots 1 and 2 remove each other</text>
    <text x="250" y="208">15 &gt; 12 → robot 4 removed, robot 3 keeps going: 15 → <tspan fill="#4169E1" font-weight="700">14</tspan></text>
  </g>
  <text x="270" y="252" text-anchor="middle" fill="#1a2026" font-size="13.5">both collisions happen at position 4 — only robot 3 survives: <tspan fill="#4169E1" font-weight="700">[14]</tspan></text>
</svg>
