<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="420" fill="#ffffff"/>
  <!-- nums = [0,1,0,0,1]; cells 64x44 at x = 40+76i, y = 44; cut slots at x = 186, 262, 338; strips 40x26 at x = 150+46j, y = 180+48k; cut bars at x = 239, 285, 331 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="40" y="44" width="64" height="44" fill="#ffffff"/>
    <rect x="116" y="44" width="64" height="44" fill="#4169E1" stroke="#4169E1"/>
    <rect x="192" y="44" width="64" height="44" fill="#dbe4fb"/>
    <rect x="268" y="44" width="64" height="44" fill="#dbe4fb"/>
    <rect x="344" y="44" width="64" height="44" fill="#4169E1" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="72" y="72" fill="#1a2026">0</text>
    <text x="148" y="72" fill="#ffffff">1</text>
    <text x="224" y="72" fill="#1a2026">0</text>
    <text x="300" y="72" fill="#1a2026">0</text>
    <text x="376" y="72" fill="#ffffff">1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="72" y="106">0</text><text x="148" y="106">1</text><text x="224" y="106">2</text>
    <text x="300" y="106">3</text><text x="376" y="106">4</text>
  </g>
  <line x1="186" y1="126" x2="338" y2="126" stroke="#4169E1" stroke-width="1.5"/>
  <g fill="#4169E1">
    <circle cx="186" cy="126" r="10"/><circle cx="262" cy="126" r="10"/><circle cx="338" cy="126" r="10"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">
    <text x="186" y="130">1</text><text x="262" y="130">2</text><text x="338" y="130">3</text>
  </g>
  <text x="262" y="154" text-anchor="middle" fill="#5c6b76" font-size="12.5">one mandatory cut between the 1s &#8212; 2 zeros &#8594; 2 + 1 = 3 slots</text>
  <g fill="#5c6b76" font-size="12.5" font-weight="600">
    <text x="24" y="198">slot 1</text>
    <text x="24" y="246">slot 2</text>
    <text x="24" y="294">slot 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="150" y="180" width="40" height="26"/><rect x="196" y="180" width="40" height="26"/><rect x="242" y="180" width="40" height="26"/><rect x="288" y="180" width="40" height="26"/><rect x="334" y="180" width="40" height="26"/>
    <rect x="150" y="228" width="40" height="26"/><rect x="196" y="228" width="40" height="26"/><rect x="242" y="228" width="40" height="26"/><rect x="288" y="228" width="40" height="26"/><rect x="334" y="228" width="40" height="26"/>
    <rect x="150" y="276" width="40" height="26"/><rect x="196" y="276" width="40" height="26"/><rect x="242" y="276" width="40" height="26"/><rect x="288" y="276" width="40" height="26"/><rect x="334" y="276" width="40" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="170" y="198" fill="#1a2026">0</text><text x="216" y="198" fill="#1a2026">1</text><text x="262" y="198" fill="#1a2026">0</text><text x="308" y="198" fill="#1a2026">0</text><text x="354" y="198" fill="#1a2026">1</text>
    <text x="170" y="246" fill="#1a2026">0</text><text x="216" y="246" fill="#1a2026">1</text><text x="262" y="246" fill="#1a2026">0</text><text x="308" y="246" fill="#1a2026">0</text><text x="354" y="246" fill="#1a2026">1</text>
    <text x="170" y="294" fill="#1a2026">0</text><text x="216" y="294" fill="#1a2026">1</text><text x="262" y="294" fill="#1a2026">0</text><text x="308" y="294" fill="#1a2026">0</text><text x="354" y="294" fill="#1a2026">1</text>
  </g>
  <g stroke="#4169E1" stroke-width="3">
    <line x1="239" y1="176" x2="239" y2="210"/>
    <line x1="285" y1="224" x2="285" y2="258"/>
    <line x1="331" y1="272" x2="331" y2="306"/>
  </g>
  <g font-size="13" fill="#1a2026">
    <text x="394" y="198">[0,1] <tspan fill="#4169E1" font-weight="600">|</tspan> [0,0,1]</text>
    <text x="394" y="246">[0,1,0] <tspan fill="#4169E1" font-weight="600">|</tspan> [0,1]</text>
    <text x="394" y="294">[0,1,0,0] <tspan fill="#4169E1" font-weight="600">|</tspan> [1]</text>
  </g>
  <text x="150" y="336" fill="#1a2026" font-size="14" font-weight="600">product of (g + 1) over all gaps = 2 + 1 = <tspan fill="#4169E1">3</tspan></text>
  <text x="150" y="360" fill="#5c6b76" font-size="12.5">the 0 at index 0 always rides in the first piece &#8212; no extra choice.</text>
  <text x="40" y="390" fill="#1a2026" font-size="13">Exactly one cut is forced between the 1s at indices 1 and 4; the gap of</text>
  <text x="40" y="408" fill="#1a2026" font-size="13">g = 2 zeros offers g + 1 = 3 slots &#8212; the whole product, so the answer is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
