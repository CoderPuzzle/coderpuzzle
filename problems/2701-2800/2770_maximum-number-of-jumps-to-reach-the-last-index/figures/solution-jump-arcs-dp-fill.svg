<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [1,3,6,4,1,2], target = 2; value cells 70x36 at x = 120+70i, y = 130; jump arcs leave/land on cell tops, apex 26-100 px above; dp row cells at y = 224 -->
  <text x="40" y="26" fill="#5c6b76" font-size="12.5">nums = [1,3,6,4,1,2], target = 2</text>
  <!-- non-path jump arcs (muted): (0,4) (0,5) (1,4) (1,5) (2,3) (4,5) -->
  <g fill="none" stroke="#9aa7b2" stroke-width="1.5">
    <path d="M 155 126 Q 283 -30 412 126" marker-end="url(#arrow-m)"/>
    <path d="M 172 126 Q 348 -74 472 126" marker-end="url(#arrow-m)"/>
    <path d="M 236 126 Q 332 -2 428 126" marker-end="url(#arrow-m)"/>
    <path d="M 250 126 Q 370 -38 490 126" marker-end="url(#arrow-m)"/>
    <path d="M 290 126 Q 326 74 362 126" marker-end="url(#arrow-m)"/>
    <path d="M 445 126 Q 484 74 524 126" marker-end="url(#arrow-m)"/>
  </g>
  <!-- longest-path jump arcs (accent): 0->1, 1->3, 3->5 -->
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 140 126 Q 172 70 205 126" marker-end="url(#arrow)"/>
    <path d="M 222 126 Q 283 34 345 126" marker-end="url(#arrow)"/>
    <path d="M 378 126 Q 443 34 508 126" marker-end="url(#arrow)"/>
  </g>
  <!-- value cells; path indices 0,1,3,5 tinted -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="120" y="130" width="70" height="36" fill="#dbe4fb"/>
    <rect x="190" y="130" width="70" height="36" fill="#dbe4fb"/>
    <rect x="260" y="130" width="70" height="36" fill="#ffffff"/>
    <rect x="330" y="130" width="70" height="36" fill="#dbe4fb"/>
    <rect x="400" y="130" width="70" height="36" fill="#ffffff"/>
    <rect x="470" y="130" width="70" height="36" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="155" y="153">1</text><text x="225" y="153">3</text><text x="295" y="153">6</text>
    <text x="365" y="153">4</text><text x="435" y="153">1</text><text x="505" y="153">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="155" y="184">0</text><text x="225" y="184">1</text><text x="295" y="184">2</text>
    <text x="365" y="184">3</text><text x="435" y="184">4</text><text x="505" y="184">5</text>
  </g>
  <text x="330" y="210" text-anchor="middle" fill="#5c6b76" font-size="12.5">dp[j] = 1 + best dp[i] over arcs i &#8594; j</text>
  <!-- dp row -->
  <text x="98" y="247" fill="#5c6b76" font-size="12.5" text-anchor="end">dp</text>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="120" y="224" width="70" height="34" fill="#ffffff"/>
    <rect x="190" y="224" width="70" height="34" fill="#ffffff"/>
    <rect x="260" y="224" width="70" height="34" fill="#f0f3f7"/>
    <rect x="330" y="224" width="70" height="34" fill="#ffffff"/>
    <rect x="400" y="224" width="70" height="34" fill="#ffffff"/>
    <rect x="470" y="224" width="70" height="34" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="155" y="246">0</text><text x="225" y="246">1</text>
    <text x="295" y="246" fill="#9aa7b2" font-weight="400">&#8211;</text>
    <text x="365" y="246">2</text><text x="435" y="246">2</text>
    <text x="505" y="246" fill="#4169E1">3</text>
  </g>
  <text x="295" y="274" text-anchor="middle" fill="#9aa7b2" font-size="11.5">unreached</text>
  <text x="330" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Every arc joins two values at most target = 2 apart; the accented path</text>
  <text x="330" y="324" text-anchor="middle" fill="#1a2026" font-size="13">0 &#8594; 1 &#8594; 3 &#8594; 5 is the longest chain, so the answer is <tspan fill="#4169E1" font-weight="600">dp[5] = 3</tspan>.</text>
</svg>
