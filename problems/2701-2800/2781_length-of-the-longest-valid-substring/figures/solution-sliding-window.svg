<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
  <!-- word cells -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <rect x="40" y="30" width="56" height="44" rx="4"/>
    <rect x="96" y="30" width="56" height="44" rx="4"/>
    <rect x="152" y="30" width="56" height="44" rx="4"/>
    <rect x="208" y="30" width="56" height="44" rx="4"/>
    <rect x="264" y="30" width="56" height="44" rx="4"/>
    <rect x="320" y="30" width="56" height="44" rx="4"/>
    <rect x="376" y="30" width="56" height="44" rx="4"/>
    <rect x="432" y="30" width="56" height="44" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="68" y="58">c</text><text x="124" y="58">b</text><text x="180" y="58">a</text>
    <text x="236" y="58">a</text><text x="292" y="58">a</text><text x="348" y="58">a</text>
    <text x="404" y="58">b</text><text x="460" y="58">c</text>
  </g>
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="68" y="22">0</text><text x="124" y="22">1</text><text x="180" y="22">2</text>
    <text x="236" y="22">3</text><text x="292" y="22">4</text><text x="348" y="22">5</text>
    <text x="404" y="22">6</text><text x="460" y="22">7</text>
  </g>
  <!-- final window -->
  <path d="M 320 104 L 320 90 L 488 90 L 488 104" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="404" y="126" text-anchor="middle" fill="#4169E1" font-weight="600">final window “aabc” — length 4</text>
  <!-- banned hits -->
  <g stroke="#98a2ac" stroke-width="1.4" fill="none" stroke-dasharray="5 3">
    <path d="M 40 172 L 40 158 L 152 158 L 152 172"/>
    <path d="M 96 216 L 96 202 L 264 202 L 264 216"/>
    <path d="M 208 216 L 208 202 L 376 202 L 376 216"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="96" y="190" text-anchor="middle">right = 1: “cb” ends here → left = 1</text>
    <text x="180" y="234" text-anchor="middle">right = 4: “aaa” (1..3) → left = 3</text>
    <text x="292" y="246" text-anchor="middle">right = 5: “aaa” (3..5) → left = 4</text>
  </g>
  <line x1="320" y1="104" x2="320" y2="140" stroke="#4169E1" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
