  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <rect x="60" y="30" width="56" height="42" rx="4"/>
    <rect x="116" y="30" width="56" height="42" rx="4"/>
    <rect x="172" y="30" width="56" height="42" rx="4"/>
    <rect x="228" y="30" width="56" height="42" rx="4"/>
    <rect x="284" y="30" width="56" height="42" rx="4"/>
    <rect x="340" y="30" width="56" height="42" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="88" y="57">2</text><text x="144" y="57">2</text><text x="200" y="57">3</text>
    <text x="256" y="57">1</text><text x="312" y="57">1</text><text x="368" y="57">0</text>
  </g>
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="88" y="22">i=0</text><text x="144" y="22">1</text><text x="200" y="22">2</text>
    <text x="256" y="22">3</text><text x="312" y="22">4</text><text x="368" y="22">5</text>
  </g>
  <!-- windows started -->
  <path d="M 60 122 L 60 108 L 228 108 L 228 122" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <text x="144" y="144" text-anchor="middle" fill="#4169E1">i = 0: residual 2 → start 2 windows · running += 2, diff[3] −= 2</text>
  <path d="M 172 176 L 172 162 L 340 162 L 340 176" fill="none" stroke="#1a2026" stroke-width="1.6"/>
  <text x="256" y="198" text-anchor="middle" fill="#1a2026">i = 2: residual 3 − 2 = 1 → start 1 window · running += 1, diff[5] −= 1</text>
  <!-- coverage -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="88" y="222">2</text><text x="144" y="222">2</text><text x="200" y="222">3</text>
    <text x="256" y="222">1</text><text x="312" y="222">1</text><text x="368" y="222">0</text>
    <text x="470" y="222">running coverage = nums → all zero</text>
  </g>
  <g stroke="#98a2ac" stroke-width="1" stroke-dasharray="3 3">
    <line x1="60" y1="206" x2="396" y2="206"/>
  </g>
