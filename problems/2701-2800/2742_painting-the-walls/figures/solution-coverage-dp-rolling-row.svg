<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 434" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="434" fill="#ffffff"/>
  <!-- cost = [1,2,3,2], time = [1,2,3,2]; weights time[i]+1 = [2,3,4,3]; items 102x46 at x = 110+118i; dp columns j = 0..4 at x = 150,240,330,420,510 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="110" y="44" width="102" height="46"/><rect x="228" y="44" width="102" height="46"/>
    <rect x="346" y="44" width="102" height="46"/><rect x="464" y="44" width="102" height="46"/>
  </g>
  <g text-anchor="middle">
    <text x="161" y="65" font-weight="600">cost 1</text>
    <text x="161" y="81" fill="#5c6b76" font-size="12">covers 2</text>
    <text x="279" y="65" font-weight="600">cost 2</text>
    <text x="279" y="81" fill="#5c6b76" font-size="12">covers 3</text>
    <text x="397" y="65" font-weight="600">cost 3</text>
    <text x="397" y="81" fill="#5c6b76" font-size="12">covers 4</text>
    <text x="515" y="65" font-weight="600">cost 2</text>
    <text x="515" y="81" fill="#5c6b76" font-size="12">covers 3</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="161" y="108">wall 0</text><text x="279" y="108">wall 1</text>
    <text x="397" y="108">wall 2</text><text x="515" y="108">wall 3</text>
  </g>
  <text x="320" y="150" text-anchor="middle" fill="#1a2026" font-size="13">dp[j] = min(dp[j], dp[max(j &#8722; (time[i] + 1), 0)] + cost[i]), j descending</text>
  <g fill="#5c6b76" font-size="12.5">
    <text x="88" y="192">j</text>
    <text x="150" y="192" text-anchor="middle">0</text><text x="240" y="192" text-anchor="middle">1</text>
    <text x="330" y="192" text-anchor="middle">2</text><text x="420" y="192" text-anchor="middle">3</text>
    <text x="510" y="192" text-anchor="middle">4</text>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="22" y="224">after wall 0</text>
    <text x="22" y="258">after wall 1</text>
    <text x="22" y="292">after wall 2</text>
    <text x="22" y="326">after wall 3</text>
  </g>
  <rect x="468" y="305" width="84" height="30" rx="6" fill="#dbe4fb"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="150" y="224" fill="#1a2026">0</text>
    <text x="240" y="224" fill="#4169E1">1</text><text x="330" y="224" fill="#4169E1">1</text>
    <text x="420" y="224" fill="#9aa7b2" font-weight="400">&#8734;</text><text x="510" y="224" fill="#9aa7b2" font-weight="400">&#8734;</text>
    <text x="150" y="258" fill="#1a2026">0</text><text x="240" y="258" fill="#1a2026">1</text><text x="330" y="258" fill="#1a2026">1</text>
    <text x="420" y="258" fill="#4169E1">2</text><text x="510" y="258" fill="#4169E1">3</text>
    <text x="150" y="292" fill="#1a2026">0</text><text x="240" y="292" fill="#1a2026">1</text><text x="330" y="292" fill="#1a2026">1</text>
    <text x="420" y="292" fill="#1a2026">2</text><text x="510" y="292" fill="#1a2026">3</text>
    <text x="150" y="326" fill="#1a2026">0</text><text x="240" y="326" fill="#1a2026">1</text><text x="330" y="326" fill="#1a2026">1</text>
    <text x="420" y="326" fill="#1a2026">2</text><text x="510" y="326" fill="#4169E1">3</text>
  </g>
  <text x="40" y="360" fill="#5c6b76" font-size="12.5">clamp at work: wall 0 at j = 1 reads dp[max(1 &#8722; 2, 0)] = dp[0], giving 0 + 1 = 1</text>
  <text x="40" y="398" fill="#1a2026" font-size="13">Paying walls 0 and 1 costs 1 + 2 = 3 and covers 2 + 3 = 5 &#8805; 4 walls,</text>
  <text x="40" y="416" fill="#1a2026" font-size="13">so <tspan fill="#4169E1" font-weight="600">dp[4] = 3</tspan> &#8212; walls 2 and 3 ride free with the free painter.</text>
</svg>
