<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 326" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="326" fill="#ffffff"/>
  <!-- s = "abab"; rows = endpoint i with window [L..i] filled; slots 34x26 at x = 150+40j; rows y = 58+48i -->
  <text x="22" y="26" fill="#5c6b76" font-size="12.5">for each right endpoint i, the window [L, i] holds only distinct letters:</text>
  <g fill="#9aa7b2" font-size="11" text-anchor="middle">
    <text x="167" y="46">0</text><text x="207" y="46">1</text><text x="247" y="46">2</text><text x="287" y="46">3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#dbe4fb">
    <rect x="150" y="58" width="34" height="26"/>
  </g>
  <g fill="#f0f3f7">
    <rect x="190" y="58" width="34" height="26"/><rect x="230" y="58" width="34" height="26"/><rect x="270" y="58" width="34" height="26"/>
    <rect x="230" y="106" width="34" height="26"/><rect x="270" y="106" width="34" height="26"/>
    <rect x="150" y="154" width="34" height="26"/><rect x="270" y="154" width="34" height="26"/>
    <rect x="150" y="202" width="34" height="26"/><rect x="190" y="202" width="34" height="26"/>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#dbe4fb">
    <rect x="150" y="106" width="34" height="26"/><rect x="190" y="106" width="34" height="26"/>
    <rect x="190" y="154" width="34" height="26"/><rect x="230" y="154" width="34" height="26"/>
    <rect x="230" y="202" width="34" height="26"/><rect x="270" y="202" width="34" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13.5">
    <text x="100" y="76" fill="#1a2026">i = 0</text>
    <text x="167" y="76" fill="#1a2026">a</text><text x="207" y="76" fill="#9aa7b2">b</text>
    <text x="247" y="76" fill="#9aa7b2">a</text><text x="287" y="76" fill="#9aa7b2">b</text>
    <text x="100" y="124" fill="#1a2026">i = 1</text>
    <text x="167" y="124" fill="#1a2026">a</text><text x="207" y="124" fill="#1a2026">b</text>
    <text x="247" y="124" fill="#9aa7b2">a</text><text x="287" y="124" fill="#9aa7b2">b</text>
    <text x="100" y="172" fill="#1a2026">i = 2</text>
    <text x="167" y="172" fill="#9aa7b2">a</text><text x="207" y="172" fill="#1a2026">b</text>
    <text x="247" y="172" fill="#1a2026">a</text><text x="287" y="172" fill="#9aa7b2">b</text>
    <text x="100" y="220" fill="#1a2026">i = 3</text>
    <text x="167" y="220" fill="#9aa7b2">a</text><text x="207" y="220" fill="#9aa7b2">b</text>
    <text x="247" y="220" fill="#1a2026">a</text><text x="287" y="220" fill="#1a2026">b</text>
  </g>
  <g font-size="13" fill="#1a2026">
    <text x="330" y="76">a is new: L stays 0 &#183; adds <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="330" y="124">b is new: L stays 0 &#183; adds <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="330" y="172">a last at 0 &#8594; L = max(0, 0 + 1) = 1 &#183; adds <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="330" y="220">b last at 1 &#8594; L = max(1, 1 + 1) = 2 &#183; adds <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  </g>
  <text x="150" y="262" fill="#1a2026" font-size="14" font-weight="600">total: 1 + 2 + 2 + 2 = <tspan fill="#4169E1">7</tspan> special substrings</text>
  <text x="22" y="292" fill="#1a2026" font-size="13">L only ever jumps forward &#8212; to just past the arriving letter's previous copy &#8212;</text>
  <text x="22" y="310" fill="#1a2026" font-size="13">so endpoint i contributes exactly i &#8722; L + 1 new substrings.</text>
</svg>
