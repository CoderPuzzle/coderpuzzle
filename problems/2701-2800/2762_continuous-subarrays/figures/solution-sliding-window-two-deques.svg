<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="280" fill="#ffffff"/>
  <!-- nums = [5,4,2,4]; window strip cells 34x26 at x=96, rows y=76/124/172/220; deques listed front to back, front = accent border -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="52" y="48">right</text>
    <text x="170" y="48">window</text>
    <text x="310" y="48">max-deque</text>
    <text x="310" y="62" font-size="10.5">(front = max)</text>
    <text x="400" y="48">min-deque</text>
    <text x="400" y="62" font-size="10.5">(front = min)</text>
    <text x="480" y="48">max-min</text>
    <text x="545" y="48">add</text>
    <text x="596" y="48">total</text>
  </g>
  <!-- row right = 0 -->
  <g stroke-width="1.2">
    <rect x="96" y="76" width="34" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="134" y="76" width="34" height="26" fill="#ffffff" stroke="#9aa7b2"/>
    <rect x="172" y="76" width="34" height="26" fill="#ffffff" stroke="#9aa7b2"/>
    <rect x="210" y="76" width="34" height="26" fill="#ffffff" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="113" y="94" fill="#1a2026" font-weight="600">5</text>
    <text x="151" y="94" fill="#9aa7b2">4</text>
    <text x="189" y="94" fill="#9aa7b2">2</text>
    <text x="227" y="94" fill="#9aa7b2">4</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <rect x="270" y="78" width="26" height="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="283" y="93" fill="#1a2026">5</text>
    <rect x="356" y="78" width="26" height="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="369" y="93" fill="#1a2026">5</text>
    <text x="52" y="94" fill="#1a2026">0</text>
    <text x="480" y="94" fill="#1a2026">0</text>
    <text x="545" y="94" fill="#4169E1" font-weight="600">+1</text>
    <text x="596" y="94" fill="#1a2026">1</text>
  </g>
  <!-- row right = 1 -->
  <g stroke-width="1.2">
    <rect x="96" y="124" width="34" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="134" y="124" width="34" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="172" y="124" width="34" height="26" fill="#ffffff" stroke="#9aa7b2"/>
    <rect x="210" y="124" width="34" height="26" fill="#ffffff" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="113" y="142" fill="#1a2026" font-weight="600">5</text>
    <text x="151" y="142" fill="#1a2026" font-weight="600">4</text>
    <text x="189" y="142" fill="#9aa7b2">2</text>
    <text x="227" y="142" fill="#9aa7b2">4</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <rect x="270" y="126" width="26" height="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="283" y="141" fill="#1a2026">5</text>
    <rect x="300" y="126" width="26" height="22" fill="#ffffff" stroke="#42525e"/>
    <text x="313" y="141" fill="#1a2026">4</text>
    <rect x="356" y="126" width="26" height="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="369" y="141" fill="#1a2026">4</text>
    <text x="52" y="142" fill="#1a2026">1</text>
    <text x="480" y="142" fill="#1a2026">1</text>
    <text x="545" y="142" fill="#4169E1" font-weight="600">+2</text>
    <text x="596" y="142" fill="#1a2026">3</text>
  </g>
  <!-- row right = 2: spread 3 > 2, left jumps 0 -> 1 -->
  <g stroke-width="1.2">
    <rect x="96" y="172" width="34" height="26" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="134" y="172" width="34" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="172" y="172" width="34" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="210" y="172" width="34" height="26" fill="#ffffff" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="113" y="190" fill="#9aa7b2">5</text>
    <text x="151" y="190" fill="#1a2026" font-weight="600">4</text>
    <text x="189" y="190" fill="#1a2026" font-weight="600">2</text>
    <text x="227" y="190" fill="#9aa7b2">4</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <rect x="270" y="174" width="26" height="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="283" y="189" fill="#1a2026">4</text>
    <rect x="300" y="174" width="26" height="22" fill="#ffffff" stroke="#42525e"/>
    <text x="313" y="189" fill="#1a2026">2</text>
    <rect x="356" y="174" width="26" height="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="369" y="189" fill="#1a2026">2</text>
    <text x="52" y="190" fill="#1a2026">2</text>
    <text x="480" y="190" fill="#1a2026">3&#8594;2</text>
    <text x="545" y="190" fill="#4169E1" font-weight="600">+2</text>
    <text x="596" y="190" fill="#1a2026">5</text>
  </g>
  <text x="96" y="214" fill="#5c6b76" font-size="11.5">spread 3 &gt; 2: left jumps 0&#8594;1, index 0 expires from the max-deque</text>
  <!-- row right = 3 -->
  <g stroke-width="1.2">
    <rect x="96" y="220" width="34" height="26" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="134" y="220" width="34" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="172" y="220" width="34" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <rect x="210" y="220" width="34" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="113" y="238" fill="#9aa7b2">5</text>
    <text x="151" y="238" fill="#1a2026" font-weight="600">4</text>
    <text x="189" y="238" fill="#1a2026" font-weight="600">2</text>
    <text x="227" y="238" fill="#1a2026" font-weight="600">4</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <rect x="270" y="222" width="26" height="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="283" y="237" fill="#1a2026">4</text>
    <rect x="300" y="222" width="26" height="22" fill="#ffffff" stroke="#42525e"/>
    <text x="313" y="237" fill="#1a2026">4</text>
    <rect x="356" y="222" width="26" height="22" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
    <text x="369" y="237" fill="#1a2026">2</text>
    <rect x="386" y="222" width="26" height="22" fill="#ffffff" stroke="#42525e"/>
    <text x="399" y="237" fill="#1a2026">4</text>
    <text x="52" y="238" fill="#1a2026">3</text>
    <text x="480" y="238" fill="#1a2026">2</text>
    <text x="545" y="238" fill="#4169E1" font-weight="600">+3</text>
    <text x="596" y="238" fill="#4169E1" font-weight="600" font-size="13.5">8</text>
  </g>
  <text x="320" y="260" text-anchor="middle" fill="#1a2026" font-size="13">Each right contributes right - left + 1: 1 + 2 + 2 + 3 = <tspan fill="#4169E1" font-weight="600">8</tspan> continuous subarrays;</text>
  <text x="320" y="277" text-anchor="middle" fill="#1a2026" font-size="13">when the fronts report spread 3 &gt; 2, left jumps forward until the band is legal again.</text>
</svg>
