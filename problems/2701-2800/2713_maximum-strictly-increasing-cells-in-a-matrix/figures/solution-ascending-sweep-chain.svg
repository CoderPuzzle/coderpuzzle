<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="334" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- mat = [[3,1,6],[-9,5,7]]; sweep ascending: -9(1,0)=1, 1(0,1)=1, 3(0,0)=2, 5(1,1)=2, 6(0,2)=3, 7(1,2)=4; chain cells 64x44 at (60,66); final rowMax=[3,4], colMax=[1,2,4] -->
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="92" y="58">c0</text><text x="156" y="58">c1</text><text x="220" y="58">c2</text>
  </g>
  <text x="52" y="92" text-anchor="end" font-size="11" fill="#9aa7b2">r0</text>
  <text x="52" y="136" text-anchor="end" font-size="11" fill="#9aa7b2">r1</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="124" y="66" width="64" height="44"/><rect x="124" y="110" width="64" height="44"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="60" y="66" width="64" height="44"/><rect x="188" y="66" width="64" height="44"/>
    <rect x="60" y="110" width="64" height="44"/><rect x="188" y="110" width="64" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="92" y="93">3</text><text x="156" y="93">1</text><text x="220" y="93">6</text>
    <text x="92" y="137">−9</text><text x="156" y="137">5</text><text x="220" y="137">7</text>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="92" y="107" fill="#4169E1" font-weight="600">len 2</text>
    <text x="156" y="107" fill="#5c6b76">len 1</text>
    <text x="220" y="107" fill="#4169E1" font-weight="600">len 3</text>
    <text x="92" y="151" fill="#4169E1" font-weight="600">len 1</text>
    <text x="156" y="151" fill="#5c6b76">len 2</text>
    <text x="220" y="151" fill="#4169E1" font-weight="600">len 4</text>
  </g>
  <text x="60" y="180" font-size="12.5"><tspan fill="#5c6b76">rowMax</tspan> = [3, 4]&#160;&#160;&#160;<tspan fill="#5c6b76">colMax</tspan> = [1, 2, 4]</text>
  <!-- ascending sweep -->
  <text x="280" y="62" font-size="13" font-weight="600" fill="#1a2026">ascending sweep</text>
  <text x="280" y="80" fill="#5c6b76" font-size="11.5">each cell: 1 + max(rowMax[r], colMax[c])</text>
  <g font-size="12.5">
    <text x="280" y="100" fill="#4169E1" font-weight="600">−9 (1,0): 1 + max(0, 0) = 1</text>
    <text x="280" y="120" fill="#1a2026">1 (0,1): 1 + max(0, 0) = 1</text>
    <text x="280" y="140" fill="#4169E1" font-weight="600">3 (0,0): 1 + max(1, 1) = 2</text>
    <text x="280" y="160" fill="#1a2026">5 (1,1): 1 + max(1, 1) = 2</text>
    <text x="280" y="180" fill="#4169E1" font-weight="600">6 (0,2): 1 + max(2, 0) = 3</text>
    <text x="280" y="200" fill="#4169E1" font-weight="600">7 (1,2): 1 + max(2, 3) = 4</text>
  </g>
  <!-- best chain strip -->
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="132" y="218">col 0</text><text x="228" y="218">row 0</text><text x="324" y="218">col 2</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="60" y="226" width="48" height="32"/><rect x="156" y="226" width="48" height="32"/>
    <rect x="252" y="226" width="48" height="32"/><rect x="348" y="226" width="48" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="84" y="247">−9</text><text x="180" y="247">3</text><text x="276" y="247">6</text><text x="372" y="247">7</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 112 242 L 150 242" marker-end="url(#arrow)"/>
    <path d="M 208 242 L 246 242" marker-end="url(#arrow)"/>
    <path d="M 304 242 L 342 242" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="84" y="274" fill="#5c6b76">len 1</text><text x="180" y="274" fill="#5c6b76">len 2</text>
    <text x="276" y="274" fill="#5c6b76">len 3</text><text x="372" y="274" fill="#4169E1" font-weight="600">len 4</text>
  </g>
  <text x="40" y="302" fill="#1a2026" font-size="13">Processing values smallest-first, each cell scores 1 + the better of its running row</text>
  <text x="40" y="320" fill="#1a2026" font-size="13">and column maxima; the chain −9 → 3 → 6 → 7 visits <tspan fill="#4169E1" font-weight="600">4 cells</tspan> — the answer.</text>
</svg>
