<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="230" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "leetscode", dictionary = [leet, code, leetcode]; dp = [0,1,2,3,0,1,2,3,4,1] over prefix ends 0..9; free word jumps: 0->4 (leet), 5->9 (code); paid skip: 4->5 (the lone s); columns 58 wide, pitch 62 from x=32 -->
  <g text-anchor="middle">
    <text x="61" y="64" font-weight="600">l</text><text x="123" y="64" font-weight="600">e</text>
    <text x="185" y="64" font-weight="600">e</text><text x="247" y="64" font-weight="600">t</text>
    <text x="309" y="64" font-weight="600">s</text><text x="371" y="64" font-weight="600">c</text>
    <text x="433" y="64" font-weight="600">o</text><text x="495" y="64" font-weight="600">d</text>
    <text x="557" y="64" font-weight="600">e</text>
    <text x="619" y="64" fill="#5c6b76" font-size="11.5">end</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="94" y="84" width="58" height="32"/><rect x="156" y="84" width="58" height="32"/>
    <rect x="218" y="84" width="58" height="32"/><rect x="280" y="84" width="58" height="32"/>
    <rect x="342" y="84" width="58" height="32"/><rect x="404" y="84" width="58" height="32"/>
    <rect x="466" y="84" width="58" height="32"/><rect x="528" y="84" width="58" height="32"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="32" y="84" width="58" height="32"/><rect x="280" y="84" width="58" height="32"/>
    <rect x="342" y="84" width="58" height="32"/><rect x="590" y="84" width="58" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="61" y="100">0</text><text x="123" y="100">1</text><text x="185" y="100">2</text>
    <text x="247" y="100">3</text><text x="309" y="100">0</text><text x="371" y="100">1</text>
    <text x="433" y="100">2</text><text x="495" y="100">3</text><text x="557" y="100">4</text>
    <text x="619" y="100" fill="#4169E1">1</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#9aa7b2">
    <text x="61" y="112">i=0</text><text x="123" y="112">i=1</text><text x="185" y="112">i=2</text>
    <text x="247" y="112">i=3</text><text x="309" y="112">i=4</text><text x="371" y="112">i=5</text>
    <text x="433" y="112">i=6</text><text x="495" y="112">i=7</text><text x="557" y="112">i=8</text>
    <text x="619" y="112">i=9</text>
  </g>
  <!-- +1 skip arcs between neighbours -->
  <g fill="none" stroke="#9aa7b2" stroke-width="1.3">
    <path d="M 61 120 Q 92 136 123 120"/>
    <path d="M 123 120 Q 154 136 185 120"/>
    <path d="M 185 120 Q 216 136 247 120"/>
    <path d="M 247 120 Q 278 136 309 120"/>
    <path d="M 309 120 Q 340 136 371 120" stroke="#4169E1" stroke-width="1.8"/>
    <path d="M 371 120 Q 402 136 433 120"/>
    <path d="M 433 120 Q 464 136 495 120"/>
    <path d="M 495 120 Q 526 136 557 120"/>
    <path d="M 557 120 Q 588 136 619 120"/>
  </g>
  <!-- free word-jump arcs -->
  <path d="M 61 120 Q 185 172 309 120" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 371 120 Q 495 172 619 120" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="185" y="168">leet (free)</text>
    <text x="340" y="160">skip s: +1</text>
    <text x="495" y="168">code (free)</text>
  </g>
  <text x="40" y="196" fill="#1a2026" font-size="13">dp[i] counts the cheapest mix of +1 skips and free word jumps; the chain here is</text>
  <text x="40" y="214" fill="#1a2026" font-size="13">leet (0→4), one paid skip of the lone s (4→5), code (5→9): <tspan fill="#4169E1" font-weight="600">dp[9] = 1</tspan>.</text>
</svg>
