<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="368" fill="#ffffff"/>
  <!-- nums = [3,4,6,6,6,6,7], target = 6; cells 40x34 at x = 130+42i, probe rows y = 64/140/216/292; muted cells = already discarded; accent cell = mid probe (rows 1-3) / returned index (row 4); hi = 7 sits past the last cell because hi is exclusive -->
  <text x="36" y="24" fill="#5c6b76" font-size="12.5">nums = [3,4,6,6,6,6,7], target = 6</text>
  <!-- probe 1: lo=0 hi=7 mid=3 -->
  <text x="150" y="55" text-anchor="middle" fill="#5c6b76" font-size="11" font-weight="600">lo</text>
  <text x="276" y="55" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">mid</text>
  <text x="424" y="55" text-anchor="middle" fill="#5c6b76" font-size="11" font-weight="600">hi</text>
  <g stroke-width="1.3">
    <rect x="130" y="64" width="40" height="34" fill="#ffffff" stroke="#42525e"/><rect x="172" y="64" width="40" height="34" fill="#ffffff" stroke="#42525e"/>
    <rect x="214" y="64" width="40" height="34" fill="#ffffff" stroke="#42525e"/>
    <rect x="256" y="64" width="40" height="34" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="298" y="64" width="40" height="34" fill="#ffffff" stroke="#42525e"/><rect x="340" y="64" width="40" height="34" fill="#ffffff" stroke="#42525e"/>
    <rect x="382" y="64" width="40" height="34" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle">
    <text x="150" y="86">3</text><text x="192" y="86">4</text><text x="234" y="86">6</text>
    <text x="276" y="86" fill="#4169E1" font-weight="600">6</text>
    <text x="318" y="86">6</text><text x="360" y="86">6</text><text x="402" y="86">7</text>
  </g>
  <text x="36" y="85" fill="#5c6b76" font-size="12.5">probe 1</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="150" y="111">0</text><text x="192" y="111">1</text><text x="234" y="111">2</text>
    <text x="276" y="111">3</text><text x="318" y="111">4</text><text x="360" y="111">5</text><text x="402" y="111">6</text>
  </g>
  <text x="440" y="85" fill="#5c6b76" font-size="12.5">nums[3] = 6 &#8804; 6 &#8594; lo = 4</text>
  <!-- probe 2: lo=4 hi=7 mid=5 -->
  <text x="318" y="131" text-anchor="middle" fill="#5c6b76" font-size="11" font-weight="600">lo</text>
  <text x="360" y="131" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">mid</text>
  <text x="424" y="131" text-anchor="middle" fill="#5c6b76" font-size="11" font-weight="600">hi</text>
  <g stroke-width="1.3">
    <rect x="130" y="140" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="172" y="140" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="214" y="140" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="256" y="140" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="298" y="140" width="40" height="34" fill="#ffffff" stroke="#42525e"/>
    <rect x="340" y="140" width="40" height="34" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="382" y="140" width="40" height="34" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2">
    <text x="150" y="162">3</text><text x="192" y="162">4</text><text x="234" y="162">6</text><text x="276" y="162">6</text>
  </g>
  <text x="318" y="162">6</text>
  <text x="360" y="162" text-anchor="middle" fill="#4169E1" font-weight="600">6</text>
  <text x="402" y="162" text-anchor="middle">7</text>
  <text x="36" y="161" fill="#5c6b76" font-size="12.5">probe 2</text>
  <text x="440" y="161" fill="#5c6b76" font-size="12.5">nums[5] = 6 &#8804; 6 &#8594; lo = 6</text>
  <!-- probe 3: lo=6 hi=7 mid=6 -->
  <text x="402" y="194" text-anchor="middle" fill="#5c6b76" font-size="11" font-weight="600">lo</text>
  <text x="402" y="207" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">mid</text>
  <text x="424" y="207" text-anchor="middle" fill="#5c6b76" font-size="11" font-weight="600">hi</text>
  <g stroke-width="1.3">
    <rect x="130" y="216" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="172" y="216" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="214" y="216" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="256" y="216" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="298" y="216" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="340" y="216" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="382" y="216" width="40" height="34" fill="#dbe4fb" stroke="#4169E1"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2">
    <text x="150" y="238">3</text><text x="192" y="238">4</text><text x="234" y="238">6</text>
    <text x="276" y="238">6</text><text x="318" y="238">6</text><text x="360" y="238">6</text>
  </g>
  <text x="402" y="238" text-anchor="middle" fill="#4169E1" font-weight="600">7</text>
  <text x="36" y="237" fill="#5c6b76" font-size="12.5">probe 3</text>
  <text x="440" y="237" fill="#5c6b76" font-size="12.5">nums[6] = 7 &gt; 6 &#8594; hi = 6</text>
  <!-- meet: lo = hi = 6, answer index 5 -->
  <text x="382" y="283" text-anchor="middle" fill="#5c6b76" font-size="11" font-weight="600">lo = hi</text>
  <g stroke-width="1.3">
    <rect x="130" y="292" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="172" y="292" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="214" y="292" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/><rect x="256" y="292" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="298" y="292" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
    <rect x="340" y="292" width="40" height="34" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="382" y="292" width="40" height="34" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2">
    <text x="150" y="314">3</text><text x="192" y="314">4</text><text x="234" y="314">6</text>
    <text x="276" y="314">6</text><text x="318" y="314">6</text>
    <text x="402" y="314">7</text>
  </g>
  <text x="360" y="314" text-anchor="middle" fill="#4169E1" font-weight="600">6</text>
  <text x="36" y="313" fill="#5c6b76" font-size="12.5">meet</text>
  <text x="440" y="313" fill="#5c6b76" font-size="12.5">lo = hi &#8212; stop</text>
  <text x="320" y="342" text-anchor="middle" fill="#1a2026" font-size="13">The pointers meet at lo = hi = 6, just past the target's run; the final</text>
  <text x="320" y="360" text-anchor="middle" fill="#1a2026" font-size="13">check nums[lo - 1] = nums[5] = 6 equals the target, so the answer is <tspan fill="#4169E1" font-weight="600">lo - 1 = 5</tspan>.</text>
</svg>
