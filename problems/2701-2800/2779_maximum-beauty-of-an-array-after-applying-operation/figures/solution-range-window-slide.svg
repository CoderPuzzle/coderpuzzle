<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <!-- sorted nums = [1,2,4,6], k = 2; bar for value v spans [v-k, v+k] on the axis x = 150+55*(v+1), rows y = 74/108/142/176; tinted band = values shared by ranges of 1, 2, 4 (the intersection [2,3]); bracket = the widest window -->
  <text x="30" y="24" fill="#5c6b76" font-size="12.5">nums = [4,6,1,2], k = 2 &#8594; sorted [1,2,4,6]; each bar is the value &#177; k</text>
  <!-- shared-value band for the window [1,2,4] -->
  <rect x="315" y="56" width="55" height="136" fill="#dbe4fb"/>
  <text x="342" y="52" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">shared value 2 or 3</text>
  <!-- range bars: 1, 2, 4 accent (one window), 6 muted -->
  <g stroke-linecap="round">
    <text x="30" y="78" font-size="12.5"><tspan fill="#1a2026" font-weight="600">1</tspan><tspan fill="#5c6b76">: [-1, 3]</tspan></text>
    <line x1="150" y1="74" x2="370" y2="74" stroke="#4169E1" stroke-width="5"/>
    <text x="30" y="112" font-size="12.5"><tspan fill="#1a2026" font-weight="600">2</tspan><tspan fill="#5c6b76">: [0, 4]</tspan></text>
    <line x1="205" y1="108" x2="425" y2="108" stroke="#4169E1" stroke-width="5"/>
    <text x="30" y="146" font-size="12.5"><tspan fill="#1a2026" font-weight="600">4</tspan><tspan fill="#5c6b76">: [2, 6]</tspan></text>
    <line x1="315" y1="142" x2="535" y2="142" stroke="#4169E1" stroke-width="5"/>
    <text x="30" y="180" font-size="12.5"><tspan fill="#1a2026" font-weight="600">6</tspan><tspan fill="#5c6b76">: [4, 8]</tspan></text>
    <line x1="425" y1="176" x2="645" y2="176" stroke="#9aa7b2" stroke-width="5"/>
  </g>
  <!-- number line -->
  <line x1="140" y1="210" x2="660" y2="210" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="150" y1="210" x2="150" y2="204"/><line x1="205" y1="210" x2="205" y2="204"/>
    <line x1="260" y1="210" x2="260" y2="204"/><line x1="315" y1="210" x2="315" y2="204"/>
    <line x1="370" y1="210" x2="370" y2="204"/><line x1="425" y1="210" x2="425" y2="204"/>
    <line x1="480" y1="210" x2="480" y2="204"/><line x1="535" y1="210" x2="535" y2="204"/>
    <line x1="590" y1="210" x2="590" y2="204"/><line x1="645" y1="210" x2="645" y2="204"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="150" y="228">-1</text><text x="205" y="228">0</text><text x="260" y="228">1</text>
    <text x="315" y="228">2</text><text x="370" y="228">3</text><text x="425" y="228">4</text>
    <text x="480" y="228">5</text><text x="535" y="228">6</text><text x="590" y="228">7</text>
    <text x="645" y="228">8</text>
  </g>
  <!-- window bracket over sorted values 1..4 -->
  <path d="M 260 246 L 260 252 L 425 252 L 425 246" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <text x="342" y="272" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">window [1, 2, 4]: 4 - 1 = 3 &#8804; 2k = 4, length 3</text>
  <text x="340" y="302" text-anchor="middle" fill="#1a2026" font-size="13">Growing the window to 6 gives 6 - 1 = 5 &gt; 2k, so left advances and</text>
  <text x="340" y="320" text-anchor="middle" fill="#1a2026" font-size="13">[2, 4, 6] also spans 3 values &#8212; the best beauty is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
