    <g transform="translate(440 40)"><text x="15" y="20">1</text><text x="45" y="20">4</text><text x="75" y="20">4</text><text x="15" y="50">1</text><text x="45" y="50">2</text><text x="75" y="50">2</text><text x="15" y="80">1</text><text x="45" y="80">0</text><text x="75" y="80">0</text></g>
