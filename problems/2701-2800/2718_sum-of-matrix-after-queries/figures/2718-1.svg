    <g transform="translate(305 40)"><text x="15" y="20">1</text><text x="45" y="20">1</text><text x="75" y="20">2</text><text x="15" y="50">0</text><text x="45" y="50">0</text><text x="75" y="50">2</text><text x="15" y="80">0</text><text x="45" y="80">0</text><text x="75" y="80">2</text></g>
