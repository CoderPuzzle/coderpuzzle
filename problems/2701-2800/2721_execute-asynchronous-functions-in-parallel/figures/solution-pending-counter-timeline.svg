<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- ex3: functions resolve 4 @ 50ms, 10 @ 150ms, 16 @ 100ms on the virtual clock; timeline = settlements, rows = preallocated results array + pending counter after each settlement; each value writes its own index -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 96 70 L 600 70" marker-end="url(#arrow)"/>
    <path d="M 110 62 L 110 78"/><path d="M 265 62 L 265 78"/><path d="M 420 62 L 420 78"/><path d="M 575 62 L 575 78"/>
  </g>
  <g fill="#4169E1">
    <circle cx="265" cy="70" r="4.5"/><circle cx="420" cy="70" r="4.5"/><circle cx="575" cy="70" r="4.5"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="110" y="94">0</text><text x="265" y="94">50 ms</text><text x="420" y="94">100 ms</text><text x="575" y="94">150 ms</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="265" y="50">f0 → 4</text><text x="420" y="50">f2 → 16</text><text x="575" y="50">f1 → 10</text>
  </g>
  <text x="244" y="114" text-anchor="middle" fill="#5c6b76" font-size="11.5">results (preallocated)</text>
  <!-- t = 0 -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2">
    <rect x="160" y="122" width="56" height="32"/><rect x="216" y="122" width="56" height="32"/><rect x="272" y="122" width="56" height="32"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="13">
    <text x="188" y="143">·</text><text x="244" y="143">·</text><text x="300" y="143">·</text>
  </g>
  <text x="148" y="143" text-anchor="end" fill="#5c6b76" font-size="12.5">t = 0</text>
  <text x="400" y="143" fill="#5c6b76" font-size="12.5">pending = 3</text>
  <!-- t = 50: f0 writes index 0 -->
  <rect x="160" y="164" width="56" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2">
    <rect x="216" y="164" width="56" height="32"/><rect x="272" y="164" width="56" height="32"/>
  </g>
  <text x="188" y="185" text-anchor="middle" font-weight="600" font-size="14" fill="#4169E1">4</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="13">
    <text x="244" y="185">·</text><text x="300" y="185">·</text>
  </g>
  <text x="148" y="185" text-anchor="end" fill="#5c6b76" font-size="12.5">t = 50</text>
  <text x="400" y="185" fill="#5c6b76" font-size="12.5">pending = 2</text>
  <!-- t = 100: f2 writes index 2 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="160" y="206" width="56" height="32"/>
  </g>
  <rect x="272" y="206" width="56" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="216" y="206" width="56" height="32" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="188" y="227" text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">4</text>
  <text x="300" y="227" text-anchor="middle" font-weight="600" font-size="14" fill="#4169E1">16</text>
  <text x="244" y="227" text-anchor="middle" fill="#9aa7b2" font-size="13">·</text>
  <text x="148" y="227" text-anchor="end" fill="#5c6b76" font-size="12.5">t = 100</text>
  <text x="400" y="227" fill="#5c6b76" font-size="12.5">pending = 1</text>
  <!-- t = 150: f1 writes index 1, counter hits 0 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="160" y="248" width="56" height="32"/><rect x="272" y="248" width="56" height="32"/>
  </g>
  <rect x="216" y="248" width="56" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="188" y="269" text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">4</text>
  <text x="300" y="269" text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">16</text>
  <text x="244" y="269" text-anchor="middle" font-weight="600" font-size="14" fill="#4169E1">10</text>
  <text x="148" y="269" text-anchor="end" fill="#5c6b76" font-size="12.5">t = 150</text>
  <text x="400" y="269" fill="#5c6b76" font-size="12.5">pending = 0 → resolves <tspan fill="#4169E1" font-weight="600">[4, 10, 16]</tspan></text>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="188" y="296">index 0</text><text x="244" y="296">index 1</text><text x="300" y="296">index 2</text>
  </g>
  <text x="320" y="322" text-anchor="middle" fill="#1a2026" font-size="13">Settlements arrive out of order (f0, f2, f1) but each value writes its own slot;</text>
  <text x="320" y="342" text-anchor="middle" fill="#1a2026" font-size="13">the counter hits 0 at <tspan fill="#4169E1" font-weight="600">150 ms</tspan> and the aggregate resolves <tspan fill="#4169E1" font-weight="600">[4, 10, 16]</tspan>.</text>
</svg>
