<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="338" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- ex2: street = [1,0,1,1,0], k = 5, n = 5; left circle = closing sweep over the initial doors (1 open, 0 closed), right circle = all shut with the reopened start door as landmark; 1..5 mark the houses counted walking right back to it -->
  <text x="160" y="38" text-anchor="middle" fill="#5c6b76" font-size="12.5">1. close k = 5 doors moving right</text>
  <text x="480" y="38" text-anchor="middle" fill="#5c6b76" font-size="12.5">2. reopen start, count a lap right</text>
  <!-- left: initial doors 1,0,1,1,0 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <circle cx="234" cy="144" r="22"/><circle cx="86" cy="144" r="22"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6">
    <circle cx="160" cy="90" r="22"/><circle cx="206" cy="231" r="22"/><circle cx="114" cy="231" r="22"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="160" y="95" fill="#4169E1">1</text><text x="234" y="149" fill="#5c6b76">0</text>
    <text x="206" y="236" fill="#4169E1">1</text><text x="114" y="236" fill="#4169E1">1</text><text x="86" y="149" fill="#5c6b76">0</text>
  </g>
  <text x="160" y="134" text-anchor="middle" fill="#5c6b76" font-size="10.5">start</text>
  <path d="M 160 52 A 116 116 0 1 1 147.9 52.6" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- right: all shut, landmark reopened -->
  <g fill="#ffffff" stroke="#9aa7b2" stroke-width="1.4">
    <circle cx="554" cy="144" r="22"/><circle cx="526" cy="231" r="22"/><circle cx="434" cy="231" r="22"/><circle cx="406" cy="144" r="22"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#9aa7b2">
    <text x="554" y="149">0</text><text x="526" y="236">0</text><text x="434" y="236">0</text><text x="406" y="149">0</text>
  </g>
  <circle cx="480" cy="90" r="27" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <circle cx="480" cy="90" r="22" fill="#4169E1"/>
  <text x="480" y="95" text-anchor="middle" font-weight="600" font-size="14" fill="#ffffff">1</text>
  <text x="480" y="136" text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">landmark</text>
  <path d="M 480 52 A 116 116 0 1 1 467.9 52.6" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="526" y="109">1</text><text x="554" y="196">2</text><text x="480" y="250">3</text>
    <text x="406" y="196">4</text><text x="434" y="109">5</text>
  </g>
  <path d="M 284 168 L 356 168" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="320" y="156" text-anchor="middle" fill="#5c6b76" font-size="11.5">all shut</text>
  <text x="320" y="306" text-anchor="middle" fill="#1a2026" font-size="13">Closing k = 5 doors wraps the whole circle (n = 5 ≤ k), so every door ends shut;</text>
  <text x="320" y="326" text-anchor="middle" fill="#1a2026" font-size="13">reopening the start door and walking right counts <tspan fill="#4169E1" font-weight="600">5 houses</tspan> back to it — n = <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
</svg>
