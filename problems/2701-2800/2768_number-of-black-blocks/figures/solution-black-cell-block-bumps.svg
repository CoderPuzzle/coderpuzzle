<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="380" fill="#ffffff"/>
  <!-- m = n = 3, black = [[0,0],[1,1],[0,2]]; cells 56px at (70,80); badges at block centres (126/182, 136/192) -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="98" y="70">y=0</text><text x="154" y="70">y=1</text><text x="210" y="70">y=2</text>
    <text x="58" y="113">x=0</text><text x="58" y="169">x=1</text><text x="58" y="225">x=2</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="80" width="56" height="56"/><rect x="126" y="80" width="56" height="56"/>
    <rect x="126" y="136" width="56" height="56"/><rect x="182" y="136" width="56" height="56"/>
    <rect x="70" y="192" width="56" height="56"/><rect x="126" y="192" width="56" height="56"/><rect x="182" y="192" width="56" height="56"/>
  </g>
  <g fill="#1a2026" stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="80" width="56" height="56"/><rect x="126" y="136" width="56" height="56"/><rect x="182" y="80" width="56" height="56"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">
    <text x="98" y="113">a</text><text x="154" y="169">b</text><text x="210" y="113">c</text>
  </g>
  <!-- per-block tallies at each block's centre point -->
  <g fill="#ffffff" stroke="#4169E1" stroke-width="1.6">
    <circle cx="126" cy="136" r="12"/><circle cx="182" cy="136" r="12"/>
    <circle cx="126" cy="192" r="12"/><circle cx="182" cy="192" r="12"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="126" y="140.5">2</text><text x="182" y="140.5">2</text>
    <text x="126" y="196.5">1</text><text x="182" y="196.5">1</text>
  </g>
  <text x="154" y="260" text-anchor="middle" fill="#5c6b76" font-size="11.5">counts = black cells in each 2x2 block</text>
  <g font-size="12.5" fill="#1a2026">
    <text x="300" y="92"><tspan fill="#4169E1" font-weight="600">a</tspan> = (0,0): bumps block corner (0,0)</text>
    <text x="300" y="116"><tspan fill="#4169E1" font-weight="600">b</tspan> = (1,1): bumps (0,0), (0,1), (1,0), (1,1)</text>
    <text x="300" y="140"><tspan fill="#4169E1" font-weight="600">c</tspan> = (0,2): bumps (0,1)</text>
  </g>
  <text x="300" y="164" fill="#5c6b76" font-size="11.5">edge cells touch fewer corners (0 &lt;= x &lt; m-1, 0 &lt;= y &lt; n-1)</text>
  <g font-size="12.5" fill="#1a2026">
    <text x="300" y="200">touched blocks: (0,0) = 2, (0,1) = 2,</text>
    <text x="300" y="220">(1,0) = 1, (1,1) = 1 — so arr[2] = 2, arr[1] = 2</text>
  </g>
  <text x="300" y="252" fill="#4169E1" font-size="14.5" font-weight="600">&#8594; arr = [0, 2, 2, 0, 0]</text>
  <text x="340" y="340" text-anchor="middle" fill="#1a2026" font-size="13">Only touched blocks are ever stored - here all 4 of them - and the zero bucket is</text>
  <text x="340" y="358" text-anchor="middle" fill="#1a2026" font-size="13">pure arithmetic: (m-1)(n-1) - map entries = <tspan fill="#4169E1" font-weight="600">4 - 4 = 0</tspan>.</text>
</svg>
