<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- ex2: nums = [2,4,1,3], n=4; value 1 at index 2 (2 swaps to the front), value 4 at index 1 (2 swaps to the back); they start adjacent, so their crossing swap is shared: 2+2-1=3 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="112" y="100" width="96" height="48"/><rect x="472" y="100" width="96" height="48"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8">
    <rect x="232" y="100" width="96" height="48"/><rect x="352" y="100" width="96" height="48"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="160" y="130" fill="#9aa7b2">2</text>
    <text x="280" y="130" fill="#4169E1">4</text>
    <text x="400" y="130" fill="#4169E1">1</text>
    <text x="520" y="130" fill="#9aa7b2">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="160" y="172">index 0</text><text x="280" y="172">index 1</text>
    <text x="400" y="172">index 2</text><text x="520" y="172">index 3</text>
  </g>
  <!-- value 1 marches from index 2 to the front -->
  <path d="M 388 94 Q 280 30 172 94" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="46" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">value 1: 2 swaps left</text>
  <!-- value 4 marches from index 1 to the back -->
  <path d="M 292 154 Q 400 220 490 150" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="212" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">value 4: 2 swaps right</text>
  <!-- the one shared swap between the adjacent pair 4,1 -->
  <g stroke="#4169E1" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 331 108 L 349 138"/>
    <path d="M 349 108 L 331 138"/>
  </g>
  <text x="340" y="158" text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">shared swap</text>
  <text x="320" y="250" text-anchor="middle" fill="#1a2026" font-size="13">Value 1 needs 2 swaps to the front, value 4 needs 2 to the back — and they start adjacent:</text>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">the swap where they cross moves both at once, so <tspan fill="#4169E1" font-weight="600">2</tspan> + <tspan fill="#4169E1" font-weight="600">2</tspan> − <tspan fill="#4169E1" font-weight="600">1</tspan> = <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
