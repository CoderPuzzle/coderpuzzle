<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <!-- parent = [-1,0,0,1,1,2], s = "acaabc"; bit string abc = a's, b's, c's parity bit.
       Tree: 0 at (120,66); 1 (70,156); 2 (170,156); 3 (44,246); 4 (128,246); 5 (196,246); r=17.
       mask[0]=000, mask[1]=001(c), mask[2]=100(a), mask[3]=101(a,c), mask[4]=011(b,c), mask[5]=101(a,c). -->
  <text x="40" y="32" fill="#5c6b76" font-size="12.5">mask[v] = parity (bits a&#183;b&#183;c) of the letters on the path root &#8594; v</text>
  <!-- tree edges -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="120" y1="66" x2="70" y2="156"/>
    <line x1="120" y1="66" x2="170" y2="156"/>
    <line x1="70" y1="156" x2="44" y2="246"/>
    <line x1="70" y1="156" x2="128" y2="246"/>
    <line x1="170" y1="156" x2="196" y2="246"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#4169E1" text-anchor="middle">
    <text x="82" y="110">c</text>
    <text x="161" y="110">a</text>
    <text x="40" y="206">a</text>
    <text x="108" y="206">b</text>
    <text x="196" y="206">c</text>
  </g>
  <!-- demo-pair nodes 3 and 5: light accent; others white -->
  <circle cx="120" cy="66" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="120" y="71" text-anchor="middle" fill="#1a2026">0</text>
  <circle cx="70" cy="156" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="70" y="161" text-anchor="middle" fill="#1a2026">1</text>
  <circle cx="170" cy="156" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="170" y="161" text-anchor="middle" fill="#1a2026">2</text>
  <circle cx="44" cy="246" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="44" y="251" text-anchor="middle" fill="#1a2026" font-weight="600">3</text>
  <circle cx="128" cy="246" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="128" y="251" text-anchor="middle" fill="#1a2026">4</text>
  <circle cx="196" cy="246" r="17" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="196" y="251" text-anchor="middle" fill="#1a2026" font-weight="600">5</text>
  <!-- masks under each node -->
  <g text-anchor="end" font-size="12.5" fill="#5c6b76">
    <text x="94" y="71">000</text>
    <text x="46" y="161">001</text>
  </g>
  <text x="194" y="161" font-size="12.5" fill="#5c6b76">100</text>
  <g text-anchor="middle" font-size="12.5" fill="#5c6b76">
    <text x="44" y="282" fill="#4169E1" font-weight="600">101</text>
    <text x="128" y="282">011</text>
    <text x="196" y="282" fill="#4169E1" font-weight="600">101</text>
  </g>
  <!-- accented working: pair (3,5) -->
  <rect x="300" y="88" width="348" height="80" rx="8" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="316" y="112" fill="#1a2026" font-weight="600">pair (3, 5):&#160;&#160;mask[3] &#8853; mask[5]</text>
  <text x="316" y="136" fill="#4169E1" font-size="15" font-weight="600">101 &#8853; 101 = 000</text>
  <text x="316" y="158" fill="#1a2026" font-size="12.5">path acac &#8212; every letter even, valid</text>
  <!-- plain working: pair (3,4) shows the shared prefix cancelling -->
  <rect x="300" y="188" width="348" height="80" rx="8" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="316" y="212" fill="#1a2026" font-weight="600">pair (3, 4):&#160;&#160;101 &#8853; 011 = 110</text>
  <text x="316" y="234" fill="#5c6b76" font-size="12.5">both masks carry bit c from edge 0&#8594;1 &#8212; it cancels;</text>
  <text x="316" y="252" fill="#5c6b76" font-size="12.5">a and b stay odd, so this pair is invalid.</text>
  <text x="40" y="304" fill="#1a2026" font-size="13">mask[u] &#8853; mask[v] is exactly the u&#8594;v path parity &#8212; the shared root</text>
  <text x="40" y="322" fill="#1a2026" font-size="13">prefix cancels: 8 of the 15 pairs are valid, (3,5) with zero odd bits among them.</text>
</svg>
