<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="330" fill="#ffffff"/>
  <!-- tree: parent = [-1,0,0,1,1,2], s = "acaabc" -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="300" y1="92" x2="300" y2="140"/>
    <line x1="282" y1="176" x2="232" y2="222"/>
    <line x1="318" y1="176" x2="384" y2="218"/>
    <line x1="176" y1="186" x2="146" y2="230"/>
    <line x1="204" y1="186" x2="240" y2="230"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <circle cx="300" cy="70" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="300" y="76" fill="#1a2026">a</text>
    <circle cx="300" cy="162" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="300" y="168" fill="#1a2026">c</text>
    <circle cx="410" cy="162" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="410" y="168" fill="#1a2026">a</text>
    <circle cx="130" cy="252" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="130" y="258" fill="#1a2026">a</text>
    <circle cx="250" cy="252" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="250" y="258" fill="#1a2026">b</text>
    <circle cx="410" cy="252" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="410" y="258" fill="#1a2026">c</text>
  </g>
  <!-- node indices -->
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="300" y="40">0</text>
    <text x="300" y="204">1</text>
    <text x="448" y="162">2</text>
    <text x="130" y="296">3</text>
    <text x="250" y="296">4</text>
    <text x="410" y="296">5</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="60" y="70">Letters sit on the nodes; a pair is valid when</text>
    <text x="60" y="88">the letters on its path can form a palindrome.</text>
    <text x="60" y="120" fill="#4169E1" font-weight="600">8 of the 15 pairs qualify — every edge plus</text>
    <text x="60" y="138" fill="#4169E1" font-weight="600">(2,3), (1,5) and (3,5).</text>
  </g>
</svg>
