<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 456" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="456" fill="#ffffff"/>
  <!-- points (4,2)+6 (3,4)+7 (2,5)+7 (1,9)+10 swept by x desc; map chips 68x26 at x = 180+74c, rows at y = 100+42r -->
  <text x="330" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">points by x desc: (4,2)+6 (3,4)+7 (2,5)+7 (1,9)+10</text>
  <text x="330" y="64" text-anchor="middle" fill="#5c6b76" font-size="12.5">queries by x desc (index kept): [4,1]→q0 [2,5]→q2 [1,3]→q1</text>
  <text x="180" y="88" fill="#9aa7b2" font-size="11.5">map: y → x+y (keys ascend, sums descend)</text>
  <!-- row 1: insert (4,2) -->
  <text x="165" y="124" text-anchor="end" fill="#5c6b76" font-size="12.5">insert (4, 2)</text>
  <rect x="180" y="106" width="68" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="214" y="124" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">2 → 6</text>
  <text x="500" y="124" fill="#5c6b76" font-size="12.5">empty map → append</text>
  <!-- row 2: query [4,1] -->
  <text x="165" y="166" text-anchor="end" fill="#4169E1" font-size="12.5" font-weight="600">query [4, 1] · q0</text>
  <rect x="180" y="148" width="68" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="214" y="166" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">2 → 6</text>
  <text x="500" y="166" fill="#5c6b76" font-size="12.5">first y ≥ 1 → <tspan fill="#4169E1" font-weight="600">6</tspan></text>
  <!-- row 3: insert (3,4) -->
  <text x="165" y="208" text-anchor="end" fill="#5c6b76" font-size="12.5">insert (3, 4)</text>
  <rect x="180" y="190" width="68" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="214" y="208" text-anchor="middle" fill="#9aa7b2" font-size="13" font-weight="600">2 → 6</text>
  <rect x="254" y="190" width="68" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="288" y="208" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">4 → 7</text>
  <text x="500" y="208" fill="#5c6b76" font-size="12.5">7 ≥ 6 prunes 2 → 6</text>
  <!-- row 4: insert (2,5) -->
  <text x="165" y="250" text-anchor="end" fill="#5c6b76" font-size="12.5">insert (2, 5)</text>
  <rect x="254" y="232" width="68" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="288" y="250" text-anchor="middle" fill="#9aa7b2" font-size="13" font-weight="600">4 → 7</text>
  <rect x="328" y="232" width="68" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="362" y="250" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">5 → 7</text>
  <text x="500" y="250" fill="#5c6b76" font-size="12.5">7 ≥ 7 prunes 4 → 7</text>
  <!-- row 5: query [2,5] -->
  <text x="165" y="292" text-anchor="end" fill="#4169E1" font-size="12.5" font-weight="600">query [2, 5] · q2</text>
  <rect x="328" y="274" width="68" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="362" y="292" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">5 → 7</text>
  <text x="500" y="292" fill="#5c6b76" font-size="12.5">first y ≥ 5 → <tspan fill="#4169E1" font-weight="600">7</tspan></text>
  <!-- row 6: insert (1,9) -->
  <text x="165" y="334" text-anchor="end" fill="#5c6b76" font-size="12.5">insert (1, 9)</text>
  <rect x="328" y="316" width="68" height="26" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="362" y="334" text-anchor="middle" fill="#9aa7b2" font-size="13" font-weight="600">5 → 7</text>
  <rect x="402" y="316" width="68" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="436" y="334" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">9 → 10</text>
  <text x="500" y="334" fill="#5c6b76" font-size="12.5">10 ≥ 7 prunes 5 → 7</text>
  <!-- row 7: query [1,3] -->
  <text x="165" y="376" text-anchor="end" fill="#4169E1" font-size="12.5" font-weight="600">query [1, 3] · q1</text>
  <rect x="402" y="358" width="68" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="436" y="376" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">9 → 10</text>
  <text x="500" y="376" fill="#5c6b76" font-size="12.5">first y ≥ 3 → <tspan fill="#4169E1" font-weight="600">10</tspan></text>
  <text x="330" y="420" text-anchor="middle" fill="#1a2026" font-size="13">The first map key ≥ yi carries the largest eligible sum:</text>
  <text x="330" y="440" text-anchor="middle" fill="#1a2026" font-size="13">the sweep reads 6, 7, 10 — answers <tspan fill="#4169E1" font-weight="600">[6, 10, 7]</tspan> in the queries' original order.</text>
</svg>
