<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [-2,0,2], s = RLL, d = 3; number line X(v) = 320 + 70v, axes y=96/190; sorted cells 56x36 at (170,252) -->
  <text x="330" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">Ignoring bounces: R bodies move to x + d, L bodies to x - d, here d = 3</text>
  <text x="70" y="100" text-anchor="end" fill="#5c6b76" font-size="12">t = 0</text>
  <line x1="80" y1="96" x2="530" y2="96" stroke="#9aa7b2" stroke-width="1.2"/>
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="110" y1="91" x2="110" y2="101"/><line x1="180" y1="91" x2="180" y2="101"/>
    <line x1="250" y1="91" x2="250" y2="101"/><line x1="320" y1="91" x2="320" y2="101"/>
    <line x1="390" y1="91" x2="390" y2="101"/><line x1="460" y1="91" x2="460" y2="101"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="110" y="114">-3</text><text x="180" y="114">-2</text><text x="250" y="114">-1</text>
    <text x="320" y="114">0</text><text x="390" y="114">1</text><text x="460" y="114">2</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="none">
    <path d="M 168 72 L 196 72" marker-end="url(#arrow)"/>
    <path d="M 332 72 L 304 72" marker-end="url(#arrow)"/>
    <path d="M 472 72 L 444 72" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="5 4" fill="none">
    <path d="M 180 96 L 390 190"/>
    <path d="M 320 96 L 110 190"/>
    <path d="M 460 96 L 250 190"/>
  </g>
  <circle cx="250" cy="127.3" r="3.5" fill="#4169E1"/>
  <circle cx="320" cy="158.7" r="3.5" fill="#4169E1"/>
  <text x="84" y="126" fill="#4169E1" font-size="11" font-weight="600">pass through at t = 1</text>
  <line x1="208" y1="123" x2="245" y2="127" stroke="#4169E1" stroke-width="1.2"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="180" cy="96" r="10"/><circle cx="320" cy="96" r="10"/><circle cx="460" cy="96" r="10"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="10.5" fill="#1a2026">
    <text x="180" y="100">0</text><text x="320" y="100">1</text><text x="460" y="100">2</text>
  </g>
  <text x="70" y="194" text-anchor="end" fill="#5c6b76" font-size="12">t = 3</text>
  <line x1="80" y1="190" x2="530" y2="190" stroke="#9aa7b2" stroke-width="1.2"/>
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="110" y1="185" x2="110" y2="195"/><line x1="180" y1="185" x2="180" y2="195"/>
    <line x1="250" y1="185" x2="250" y2="195"/><line x1="320" y1="185" x2="320" y2="195"/>
    <line x1="390" y1="185" x2="390" y2="195"/><line x1="460" y1="185" x2="460" y2="195"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="110" y="208">-3</text><text x="180" y="208">-2</text><text x="250" y="208">-1</text>
    <text x="320" y="208">0</text><text x="390" y="208">1</text><text x="460" y="208">2</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <circle cx="110" cy="190" r="10"/><circle cx="250" cy="190" r="10"/><circle cx="390" cy="190" r="10"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="10.5" fill="#1a2026">
    <text x="110" y="194">1</text><text x="250" y="194">2</text><text x="390" y="194">0</text>
  </g>
  <!-- sorted positions and the pairing arcs -->
  <text x="160" y="275" text-anchor="end" fill="#5c6b76" font-size="12">sorted</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="170" y="252" width="56" height="36"/><rect x="226" y="252" width="56" height="36"/>
    <rect x="282" y="252" width="56" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="198" y="275">-3</text><text x="254" y="275">-1</text><text x="310" y="275">1</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 198 294 Q 226 316 254 294"/>
    <path d="M 254 294 Q 282 316 310 294"/>
    <path d="M 198 294 Q 254 344 310 294"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="370" y="262">d(0,1) = |-3 - (-1)| = <tspan fill="#1a2026" font-weight="600">2</tspan></text>
    <text x="370" y="284">d(0,2) = |-3 - 1| = <tspan fill="#1a2026" font-weight="600">4</tspan></text>
    <text x="370" y="306">d(1,2) = |-1 - 1| = <tspan fill="#1a2026" font-weight="600">2</tspan></text>
  </g>
  <text x="370" y="336" fill="#1a2026" font-size="14">2 + 4 + 2 = <tspan fill="#4169E1" font-weight="600">8</tspan></text>
  <text x="330" y="406" text-anchor="middle" fill="#1a2026" font-size="13">Collisions only swap identities: bodies pass through and keep walking for d = 3.</text>
  <text x="330" y="426" text-anchor="middle" fill="#1a2026" font-size="13">The prefix sweep adds each robot's distance to all earlier ones: 2 + 4 + 2 = <tspan fill="#4169E1" font-weight="600">8</tspan>.</text>
</svg>
