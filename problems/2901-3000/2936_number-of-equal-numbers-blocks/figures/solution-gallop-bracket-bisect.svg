<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="292" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,1,1,3,9,9,9,2,10,10]; block 1 gallop from i = 0: at(1), at(2) hit, at(4)=9 miss; bracket [2, 4]; bisect at(3)=3 miss; block 1 = [0, 2]; probes per block 4, 1, 4, 1, 1 -->
  <!-- array, shaded by block -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="33" y="110" width="52" height="40" fill="#dbe4fb"/><rect x="91" y="110" width="52" height="40" fill="#dbe4fb"/><rect x="149" y="110" width="52" height="40" fill="#dbe4fb"/>
    <rect x="207" y="110" width="52" height="40" fill="#f0f3f7"/>
    <rect x="265" y="110" width="52" height="40" fill="#dbe4fb"/><rect x="323" y="110" width="52" height="40" fill="#dbe4fb"/><rect x="381" y="110" width="52" height="40" fill="#dbe4fb"/>
    <rect x="439" y="110" width="52" height="40" fill="#f0f3f7"/>
    <rect x="497" y="110" width="52" height="40" fill="#dbe4fb"/><rect x="555" y="110" width="52" height="40" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="59" y="135">1</text><text x="117" y="135">1</text><text x="175" y="135">1</text><text x="233" y="135">3</text><text x="291" y="135">9</text><text x="349" y="135">9</text><text x="407" y="135">9</text><text x="465" y="135">2</text><text x="523" y="135">10</text><text x="581" y="135">10</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="59" y="170">0</text><text x="117" y="170">1</text><text x="175" y="170">2</text><text x="233" y="170">3</text><text x="291" y="170">4</text><text x="349" y="170">5</text><text x="407" y="170">6</text><text x="465" y="170">7</text><text x="523" y="170">8</text><text x="581" y="170">9</text>
  </g>
  <!-- gallop probes over block 1 -->
  <text x="59" y="40" text-anchor="middle" fill="#5c6b76" font-size="12">i = 0</text>
  <path d="M 59 46 L 59 104" fill="none" stroke="#9aa7b2" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="117" y="40" text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">at(1) ✓</text>
  <path d="M 117 46 L 117 104" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="40" text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">at(2) ✓</text>
  <path d="M 175 46 L 175 104" fill="none" stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="291" y="64" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">at(4) ✗</text>
  <path d="M 291 70 L 291 104" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <!-- bisect bracket between last hit and first miss -->
  <path d="M 175 176 L 175 190 L 291 190 L 291 176" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <text x="233" y="210" text-anchor="middle" fill="#1a2026" font-size="12.5">bisect <tspan fill="#4169E1" font-weight="600">at(3) = 3 ✗</tspan> → block 1 ends at index <tspan fill="#4169E1" font-weight="600">2</tspan></text>
  <text x="320" y="234" text-anchor="middle" fill="#1a2026" font-size="12.5">probes per block: 4, 1, 4, 1, 1 — about <tspan fill="#4169E1" font-weight="600">2·log₂(c)</tspan> each, not 2·log₂(n)</text>
  <text x="320" y="262" text-anchor="middle" fill="#1a2026" font-size="13">Galloping from i = 0: at(1), at(2) hit, at(4) = 9 misses — bracket [2, 4]; bisect</text>
  <text x="320" y="280" text-anchor="middle" fill="#1a2026" font-size="13">at(3) misses too, so block 1 is [0, 2] — <tspan fill="#4169E1" font-weight="600">five blocks</tspan> in all, answer <tspan fill="#4169E1" font-weight="600">5</tspan>.</text>
</svg>
