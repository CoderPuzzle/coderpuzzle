<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="316" fill="#ffffff"/>
  <!-- prices = [3,1,2] (1-indexed), dp[0] = 0; per i the deque keeps dp[l-1]+prices[l] for l in [ceil(i/2), i];
       i=1: [(1,3)] -> dp[1]=3; i=2: [(1,3),(2,4)] -> dp[2]=3; i=3: window [2,3] drops l=1, [(2,4),(3,5)] -> dp[3]=4.
       candidate boxes w 76 at x = 150 + 84k, rows y = 60/130/200 -->
  <text x="40" y="36" fill="#5c6b76" font-size="12">deque holds dp[l−1] + prices[l] for l in the window</text>
  <g font-weight="600" font-size="13.5" fill="#1a2026">
    <text x="40" y="79">i = 1</text><text x="40" y="149">i = 2</text><text x="40" y="219">i = 3</text>
  </g>
  <g font-size="12" fill="#5c6b76">
    <text x="40" y="97">l ∈ [1, 1]</text><text x="40" y="167">l ∈ [1, 2]</text><text x="40" y="237">l ∈ [2, 3]</text>
  </g>
  <!-- row 1 -->
  <text x="188" y="54" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">front</text>
  <rect x="150" y="60" width="76" height="44" rx="4" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="188" y="79" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">3</text>
  <text x="188" y="96" text-anchor="middle" font-size="10.5" fill="#5c6b76">l = 1 · 0+3</text>
  <text x="612" y="86" text-anchor="end" font-size="13.5" fill="#1a2026">dp[1] = 3</text>
  <!-- row 2 -->
  <text x="188" y="124" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">front</text>
  <rect x="150" y="130" width="76" height="44" rx="4" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="188" y="149" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">3</text>
  <text x="188" y="166" text-anchor="middle" font-size="10.5" fill="#5c6b76">l = 1 · 0+3</text>
  <rect x="234" y="130" width="76" height="44" rx="4" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="272" y="149" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">4</text>
  <text x="272" y="166" text-anchor="middle" font-size="10.5" fill="#5c6b76">l = 2 · 3+1</text>
  <text x="612" y="156" text-anchor="end" font-size="13.5" fill="#1a2026">dp[2] = 3</text>
  <!-- row 3 -->
  <text x="272" y="194" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">front</text>
  <rect x="150" y="200" width="76" height="44" rx="4" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="188" y="219" text-anchor="middle" font-weight="600" font-size="15" fill="#9aa7b2">3</text>
  <text x="188" y="236" text-anchor="middle" font-size="10.5" fill="#9aa7b2">l = 1 · 0+3</text>
  <line x1="154" y1="204" x2="222" y2="240" stroke="#9aa7b2" stroke-width="1.5"/>
  <rect x="234" y="200" width="76" height="44" rx="4" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="272" y="219" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">4</text>
  <text x="272" y="236" text-anchor="middle" font-size="10.5" fill="#5c6b76">l = 2 · 3+1</text>
  <rect x="318" y="200" width="76" height="44" rx="4" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="356" y="219" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">5</text>
  <text x="356" y="236" text-anchor="middle" font-size="10.5" fill="#5c6b76">l = 3 · 3+2</text>
  <text x="188" y="262" text-anchor="middle" font-size="11" fill="#9aa7b2">l = 1 &lt; ⌈3/2⌉: dropped</text>
  <text x="612" y="226" text-anchor="end" font-size="13.5" font-weight="600" fill="#4169E1">dp[3] = 4</text>
  <text x="320" y="288" text-anchor="middle" fill="#1a2026" font-size="13">The window [⌈i/2⌉, i] slides with i, so l = 1 drops out at i = 3;</text>
  <text x="320" y="306" text-anchor="middle" fill="#1a2026" font-size="13">the front l = 2 answers dp[3] = dp[1] + prices[2] = 3 + 1 = <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
