<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="288" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [6,5,7,8]; maximal increasing prefix [6] (x=0), suffix [5,7,8] (y=1);
       p=0: s=1, n-s+1=4; p=1 (keep [6]): s advances to 2, n-s+1=3; total 7. cells x = 170 + 110i, w 90 -->
  <path d="M 170 60 L 170 54 L 260 54 L 260 60" fill="none" stroke="#4169E1" stroke-width="2"/>
  <path d="M 280 60 L 280 54 L 590 54 L 590 60" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="215" y="44" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">increasing prefix [6]</text>
  <text x="435" y="44" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">increasing suffix [5, 7, 8]</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="170" y="64" width="90" height="46"/><rect x="280" y="64" width="90" height="46"/>
    <rect x="390" y="64" width="90" height="46"/><rect x="500" y="64" width="90" height="46"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="215" y="93">6</text><text x="325" y="93">5</text><text x="435" y="93">7</text><text x="545" y="93">8</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="215" y="132">i = 0</text><text x="325" y="132">i = 1</text>
    <text x="435" y="132">i = 2</text><text x="545" y="132">i = 3</text>
  </g>
  <path d="M 325 158 L 325 140" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="154" text-anchor="end" fill="#4169E1" font-size="12.5" font-weight="600">s = 1 when p = 0</text>
  <path d="M 435 176 L 435 140" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="172" fill="#4169E1" font-size="12.5" font-weight="600">s = 2 when p = 1</text>
  <text x="320" y="200" text-anchor="middle" fill="#1a2026" font-size="13">p = 0, keep nothing: s = 1, count 4 − 1 + 1 = 4 removals</text>
  <text x="320" y="222" text-anchor="middle" fill="#1a2026" font-size="13">p = 1, keep [6]: need nums[s] &gt; 6 → s = 2, count 4 − 2 + 1 = 3</text>
  <text x="320" y="248" text-anchor="middle" fill="#1a2026" font-size="13">The seam pointer s only moves right as the kept prefix grows —</text>
  <text x="320" y="266" text-anchor="middle" fill="#1a2026" font-size="13">suffix ranges give <tspan fill="#4169E1" font-weight="600">4 + 3 = 7</tspan> incremovable subarrays for [6, 5, 7, 8].</text>
</svg>
