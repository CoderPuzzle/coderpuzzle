<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- prices = [3,1,2]; fruit cells 130x46 at x=100,245,390; dp filled right to left: dp[2]=2, dp[1]=1, dp[0]=3+min(dp[1],dp[2])=4 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="100" y="40" width="130" height="46"/>
    <rect x="390" y="40" width="130" height="46" fill="#dbe4fb"/>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="#ffffff">
    <rect x="100" y="40" width="130" height="46"/>
    <rect x="245" y="40" width="130" height="46"/>
  </g>
  <g text-anchor="middle">
    <text x="165" y="61" font-weight="600">price 3</text>
    <text x="165" y="78" fill="#5c6b76" font-size="12">buy</text>
    <text x="310" y="61" font-weight="600">price 1</text>
    <text x="310" y="78" fill="#5c6b76" font-size="12">buy though free</text>
    <text x="455" y="61" font-weight="600">price 2</text>
    <text x="455" y="78" fill="#5c6b76" font-size="12">take free</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="165" y="106">i = 0</text><text x="310" y="106">i = 1</text><text x="455" y="106">i = 2</text>
  </g>
  <!-- free windows: buying fruit i makes fruits i+1..2i+1 free -->
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 168 114 Q 237 154 302 114" marker-end="url(#arrow)"/>
    <path d="M 318 114 Q 386 154 452 114" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="235" y="176">covers fruit 1</text>
    <text x="385" y="176">covers fruit 2, 3</text>
  </g>
  <!-- dp[0] pulls the cheaper continuation dp[1] -->
  <path d="M 174 222 Q 245 194 306 222" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="198" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">dp[0] = 3 + min(dp[1], dp[2]) = 3 + 1 = 4</text>
  <text x="40" y="234" fill="#5c6b76" font-size="12.5">dp</text>
  <g text-anchor="middle" font-weight="600">
    <text x="165" y="234" fill="#4169E1" font-size="17">4</text>
    <text x="310" y="234" font-size="15">1</text>
    <text x="455" y="234" font-size="15">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="165" y="254">dp[0]</text><text x="310" y="254">dp[1]</text><text x="455" y="254">dp[2]</text>
  </g>
  <text x="312" y="272" text-anchor="middle" fill="#5c6b76" font-size="12">fill dp right to left</text>
  <path d="M 470 282 L 155 282" fill="none" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="308" fill="#1a2026" font-size="13">Buy fruit 0 (3 coins); although fruit 1 is free, buy it too (1 coin) so its</text>
  <text x="40" y="326" fill="#1a2026" font-size="13">reward covers fruit 2 — take fruit 2 free. Total 3 + 1 = <tspan fill="#4169E1" font-weight="600">4</tspan>, the minimum.</text>
</svg>
