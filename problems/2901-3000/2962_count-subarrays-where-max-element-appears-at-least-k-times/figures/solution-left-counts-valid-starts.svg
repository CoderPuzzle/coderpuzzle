<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums = [1,3,2,3,3], k = 2, M = 3; cells 64x42 at x=170+76i; r=3: count hits 2, left moves 0 to 2, add 2; r=4: left moves 0 to 4, add 4, ans 6 -->
  <text x="40" y="20" fill="#5c6b76" font-size="12">nums = [1, 3, 2, 3, 3], M = 3, k = 2</text>
  <!-- r = 3 -->
  <path d="M 170 34 L 462 34 M 170 34 L 170 40 M 462 34 L 462 40" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="170" y="44" width="64" height="42" fill="#ffffff"/><rect x="246" y="44" width="64" height="42" fill="#ffffff"/>
    <rect x="322" y="44" width="64" height="42" fill="#ffffff"/><rect x="398" y="44" width="64" height="42" fill="#ffffff"/>
  </g>
  <rect x="474" y="44" width="64" height="42" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="146" y="70" text-anchor="end" fill="#5c6b76" font-size="12.5">r = 3</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="202" y="70">1</text><text x="278" y="70" fill="#4169E1">3</text><text x="354" y="70">2</text>
    <text x="430" y="70" fill="#4169E1">3</text><text x="506" y="70" fill="#9aa7b2">3</text>
  </g>
  <path d="M 178 104 L 314 104" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="354" y="126" text-anchor="middle" fill="#1a2026" font-size="12.5">count(3) = 2 = k → shrink until one 3 remains</text>
  <text x="354" y="146" text-anchor="middle" fill="#1a2026" font-size="12.5">ans += <tspan fill="#4169E1" font-weight="600">left = 2</tspan> → ans = 2</text>
  <!-- r = 4 -->
  <path d="M 170 172 L 538 172 M 170 172 L 170 178 M 538 172 L 538 178" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="170" y="182" width="64" height="42"/><rect x="246" y="182" width="64" height="42"/>
    <rect x="322" y="182" width="64" height="42"/><rect x="398" y="182" width="64" height="42"/>
    <rect x="474" y="182" width="64" height="42"/>
  </g>
  <text x="146" y="208" text-anchor="end" fill="#5c6b76" font-size="12.5">r = 4</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="202" y="208">1</text><text x="278" y="208" fill="#4169E1">3</text><text x="354" y="208">2</text>
    <text x="430" y="208" fill="#4169E1">3</text><text x="506" y="208" fill="#4169E1">3</text>
  </g>
  <path d="M 178 242 L 466 242" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="354" y="264" text-anchor="middle" fill="#1a2026" font-size="12.5">count(3) = 2 = k again → left sweeps to index 4, one 3 remains</text>
  <text x="354" y="284" text-anchor="middle" fill="#1a2026" font-size="12.5">ans += <tspan fill="#4169E1" font-weight="600">left = 4</tspan> → ans = 2 + 4 = 6</text>
  <text x="40" y="314" fill="#1a2026" font-size="13">Each right end adds its leftover left: 0 + 0 + 0 + 2 + 4 = <tspan fill="#4169E1" font-weight="600">6</tspan> subarrays</text>
  <text x="40" y="332" fill="#1a2026" font-size="13">contain two 3s, each counted once at its right end.</text>
</svg>
