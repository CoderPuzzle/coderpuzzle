<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="318" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- grid = [[1,2],[3,4]]; flat = [1,2,3,4] with k = 2i+j; prefix = [1,1,2,6], suffix = [24,24,12,4] plus suffix[4] = 1 -->
  <!-- answer[k] = prefix[k] * suffix[k+1] mod 12345: 1*24=24, 1*12=12, 2*4=8, 6*1=6 -> [[24,12],[8,6]] -->
  <text x="50" y="62" fill="#5c6b76" font-size="12.5">grid</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="50" y="70" width="56" height="40"/><rect x="106" y="70" width="56" height="40"/>
    <rect x="50" y="110" width="56" height="40"/><rect x="106" y="110" width="56" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="78" y="95">1</text><text x="134" y="95">2</text>
    <text x="78" y="135">3</text><text x="134" y="135">4</text>
  </g>
  <g fill="#9aa7b2" font-size="10.5">
    <text x="56" y="83">0</text><text x="112" y="83">1</text>
    <text x="56" y="123">2</text><text x="112" y="123">3</text>
  </g>
  <path d="M 168 90 H 214" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="248" y="62">k = 0</text><text x="304" y="62">k = 1</text><text x="360" y="62">k = 2</text><text x="416" y="62">k = 3</text>
  </g>
  <text x="210" y="78" text-anchor="end" fill="#5c6b76" font-size="12.5">flat</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="220" y="70" width="56" height="40"/><rect x="276" y="70" width="56" height="40"/>
    <rect x="332" y="70" width="56" height="40"/><rect x="388" y="70" width="56" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="248" y="95">1</text><text x="304" y="95">2</text><text x="360" y="95">3</text><text x="416" y="95">4</text>
  </g>
  <text x="210" y="155" text-anchor="end" fill="#5c6b76" font-size="12.5">prefix</text>
  <rect x="220" y="130" width="56" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="276" y="130" width="56" height="40"/><rect x="332" y="130" width="56" height="40"/><rect x="388" y="130" width="56" height="40"/>
  </g>
  <rect x="332" y="130" width="56" height="40" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="248" y="155" fill="#9aa7b2">1</text><text x="304" y="155">1</text><text x="360" y="155">2</text><text x="416" y="155">6</text>
  </g>
  <text x="210" y="215" text-anchor="end" fill="#5c6b76" font-size="12.5">suffix</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="220" y="190" width="56" height="40"/><rect x="276" y="190" width="56" height="40"/>
    <rect x="332" y="190" width="56" height="40"/><rect x="388" y="190" width="56" height="40"/>
  </g>
  <rect x="388" y="190" width="56" height="40" fill="none" stroke="#4169E1" stroke-width="2"/>
  <rect x="444" y="190" width="56" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="248" y="215">24</text><text x="304" y="215">24</text><text x="360" y="215">12</text><text x="416" y="215">4</text>
    <text x="472" y="215" fill="#9aa7b2">1</text>
  </g>
  <text x="472" y="244" text-anchor="middle" fill="#9aa7b2" font-size="10.5">empty product</text>
  <path d="M 340 172 V 180 H 396 V 188" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="440" y="184" fill="#4169E1" font-size="12.5" font-weight="600">2 × 4 = 8</text>
  <text x="616" y="62" text-anchor="middle" fill="#5c6b76" font-size="12.5">answer</text>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.3">
    <rect x="560" y="70" width="56" height="40"/><rect x="616" y="70" width="56" height="40"/>
    <rect x="560" y="110" width="56" height="40"/><rect x="616" y="110" width="56" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#4169E1">
    <text x="588" y="95">24</text><text x="644" y="95">12</text>
    <text x="588" y="135">8</text><text x="644" y="135">6</text>
  </g>
  <text x="340" y="284" text-anchor="middle" fill="#1a2026" font-size="13">p[i][j] = prefix[k] · suffix[k+1] with k = 2i + j; the empty products are seeded 1 — no division.</text>
  <text x="340" y="304" text-anchor="middle" fill="#1a2026" font-size="13">k = 0..3 then give <tspan fill="#4169E1" font-weight="600">24, 12, 8, 6</tspan> — the answer [[24, 12], [8, 6]].</text>
</svg>
