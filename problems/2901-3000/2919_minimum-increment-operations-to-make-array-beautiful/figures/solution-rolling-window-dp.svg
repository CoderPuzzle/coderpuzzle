<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums=[2,3,0,0,2], k=4; cost=[2,1,4,4,2]; dp=[2,1,4,5,3];
       cells x=140+90i w=80, nums h=40, cost/dp h=34; accented cells = the chosen plan and its min reads -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="140" y="44" width="80" height="40"/><rect x="230" y="44" width="80" height="40"/>
    <rect x="320" y="44" width="80" height="40"/><rect x="410" y="44" width="80" height="40"/>
    <rect x="500" y="44" width="80" height="40"/>
    <rect x="140" y="122" width="80" height="34"/><rect x="320" y="122" width="80" height="34"/>
    <rect x="410" y="122" width="80" height="34"/>
    <rect x="140" y="186" width="80" height="34"/><rect x="320" y="186" width="80" height="34"/>
    <rect x="410" y="186" width="80" height="34"/>
  </g>
  <rect x="230" y="122" width="80" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <rect x="500" y="122" width="80" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <rect x="230" y="186" width="80" height="34" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <rect x="500" y="186" width="80" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <text x="126" y="70" text-anchor="end" fill="#5c6b76" font-size="12.5">nums (k = 4)</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="180" y="70">2</text><text x="270" y="70">3</text><text x="360" y="70">0</text>
    <text x="450" y="70">0</text><text x="540" y="70">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="180" y="106">0</text><text x="270" y="106">1</text><text x="360" y="106">2</text>
    <text x="450" y="106">3</text><text x="540" y="106">4</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="126" y="139">cost</text>
    <text x="126" y="154" font-size="10.5">max(0, k - nums[i])</text>
    <text x="126" y="209">dp</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="180" y="145">2</text><text x="270" y="145">1</text><text x="360" y="145">4</text>
    <text x="450" y="145">4</text><text x="540" y="145">2</text>
    <text x="180" y="209">2</text>
    <text x="270" y="209">1</text>
    <text x="360" y="209">4</text><text x="450" y="209">5</text>
    <text x="540" y="209" fill="#4169E1">3</text>
  </g>
  <path d="M 276 224 Q 360 248 446 222" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M 276 230 Q 405 262 536 222" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">dp[0..2] start at their costs; then dp[i] = cost(i) + min of the previous three:</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">dp[3] = 4 + 1 = 5 and dp[4] = 2 + 1 = 3 — the answer is min(4, 5, 3) <tspan fill="#4169E1" font-weight="600">= 3</tspan>.</text>
</svg>
