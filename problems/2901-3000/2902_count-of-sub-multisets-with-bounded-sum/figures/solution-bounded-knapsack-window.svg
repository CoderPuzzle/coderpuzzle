<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="356" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- nums = [2,1,4,2,7], l=1, r=5; dp rows over sums 0..5, cells 64x34 at x=150+64j, rows y=60+34i -->
  <!-- rows: start [1,0,0,0,0,0] -> v=1 [1,1,0,0,0,0] -> v=2 [1,1,1,1,1,1] -> v=4 [1,1,1,1,2,2]; answer dp[1..5] = 7 -->
  <text x="140" y="52" text-anchor="end" fill="#5c6b76" font-size="12.5">sum</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="182" y="52">0</text><text x="246" y="52">1</text><text x="310" y="52">2</text>
    <text x="374" y="52">3</text><text x="438" y="52">4</text><text x="502" y="52">5</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="140" y="82">start</text>
    <text x="140" y="116">value 1 (c=1)</text>
    <text x="140" y="150">value 2 (c=2)</text>
    <text x="140" y="184">value 4 (c=1)</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="150" y="60" width="64" height="34"/><rect x="214" y="60" width="64" height="34"/><rect x="278" y="60" width="64" height="34"/><rect x="342" y="60" width="64" height="34"/><rect x="406" y="60" width="64" height="34"/><rect x="470" y="60" width="64" height="34"/>
    <rect x="150" y="94" width="64" height="34"/><rect x="214" y="94" width="64" height="34"/><rect x="278" y="94" width="64" height="34"/><rect x="342" y="94" width="64" height="34"/><rect x="406" y="94" width="64" height="34"/><rect x="470" y="94" width="64" height="34"/>
    <rect x="150" y="128" width="64" height="34"/><rect x="214" y="128" width="64" height="34"/><rect x="278" y="128" width="64" height="34"/><rect x="342" y="128" width="64" height="34"/><rect x="406" y="128" width="64" height="34"/><rect x="470" y="128" width="64" height="34"/>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.3">
    <rect x="214" y="162" width="64" height="34"/><rect x="278" y="162" width="64" height="34"/><rect x="342" y="162" width="64" height="34"/><rect x="406" y="162" width="64" height="34"/><rect x="470" y="162" width="64" height="34"/>
  </g>
  <rect x="150" y="162" width="64" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="182" y="82">1</text><text x="246" y="82">0</text><text x="310" y="82">0</text><text x="374" y="82">0</text><text x="438" y="82">0</text><text x="502" y="82">0</text>
    <text x="182" y="116">1</text><text x="246" y="116">1</text><text x="310" y="116">0</text><text x="374" y="116">0</text><text x="438" y="116">0</text><text x="502" y="116">0</text>
    <text x="182" y="150">1</text><text x="246" y="150">1</text><text x="310" y="150">1</text><text x="374" y="150">1</text><text x="438" y="150">1</text><text x="502" y="150">1</text>
    <text x="182" y="184">1</text><text x="246" y="184">1</text><text x="310" y="184">1</text><text x="374" y="184">1</text><text x="438" y="184">2</text><text x="502" y="184">2</text>
  </g>
  <text x="548" y="184" fill="#4169E1" font-weight="600" font-size="14.5">dp[1..5] = 7</text>
  <!-- the value-2 pass: three-cell window new[4] = dp[4] + dp[2] + dp[0] -->
  <text x="340" y="226" text-anchor="middle" fill="#5c6b76" font-size="12.5">value-2 pass (c = 2): a 3-cell window slides down each residue class mod 2</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="120" y="240" width="88" height="32"/><rect x="216" y="240" width="88" height="32"/><rect x="312" y="240" width="88" height="32"/>
    <rect x="454" y="240" width="118" height="32" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="164" y="261">dp[4] = 0</text><text x="260" y="261">dp[2] = 0</text><text x="356" y="261">dp[0] = <tspan font-weight="600">1</tspan></text>
    <text x="513" y="261" font-weight="600">new[4] = 1</text>
  </g>
  <path d="M 414 256 H 446" fill="none" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="340" y="310" text-anchor="middle" fill="#1a2026" font-size="13">Each pass refills the row from windows into the row above; value 7 is skipped (7 &gt; r = 5).</text>
  <text x="340" y="332" text-anchor="middle" fill="#1a2026" font-size="13">After the value-4 pass the in-range cells hold 1+1+1+2+2 = <tspan fill="#4169E1" font-weight="600">7</tspan> sub-multisets.</text>
</svg>
