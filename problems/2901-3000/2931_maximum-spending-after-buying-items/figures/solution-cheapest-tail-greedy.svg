<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 366" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="366" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- values=[[8,5,2],[6,4,1],[9,7,3]]; shop rows: cells 72x46 at x=120+76c, y=60+58r,
       each cell shows its value and the day it is bought with credit value x day;
       day strip: 9 cells 54x44 at x=104+60k, y=250 -->
  <text x="232" y="40" text-anchor="middle" fill="#5c6b76" font-size="12">cheapest remaining item = some shop's rightmost tail</text>
  <g text-anchor="middle" font-weight="600" fill="#1a2026" font-size="13.5">
    <text x="76" y="84">shop 0</text><text x="76" y="142">shop 1</text><text x="76" y="200">shop 2</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="120" y="60" width="72" height="46"/><rect x="196" y="60" width="72" height="46"/><rect x="272" y="60" width="72" height="46"/>
    <rect x="120" y="118" width="72" height="46"/><rect x="196" y="118" width="72" height="46"/><rect x="272" y="118" width="72" height="46"/>
    <rect x="120" y="176" width="72" height="46"/><rect x="196" y="176" width="72" height="46"/><rect x="272" y="176" width="72" height="46"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="156" y="80">8</text><text x="232" y="80">5</text><text x="308" y="80">2</text>
    <text x="156" y="138">6</text><text x="232" y="138">4</text><text x="308" y="138">1</text>
    <text x="156" y="196">9</text><text x="232" y="196">7</text><text x="308" y="196">3</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#5c6b76">
    <text x="156" y="98">day 8 · +64</text><text x="232" y="98">day 5 · +25</text><text x="308" y="98">day 2 · +4</text>
    <text x="156" y="156">day 6 · +36</text><text x="232" y="156">day 4 · +16</text><text x="308" y="156">day 1 · +1</text>
    <text x="156" y="214">day 9 · +81</text><text x="232" y="214">day 7 · +49</text><text x="308" y="214">day 3 · +9</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 398 83 L 356 83" marker-end="url(#arrow)"/>
    <path d="M 398 141 L 356 141" marker-end="url(#arrow)"/>
    <path d="M 398 199 L 356 199" marker-end="url(#arrow)"/>
  </g>
  <text x="412" y="141" transform="rotate(-90 412 141)" text-anchor="middle" font-size="11.5" fill="#5c6b76">pop right to left</text>
  <text x="46" y="277" fill="#5c6b76" font-size="12">day</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.2">
    <rect x="104" y="250" width="54" height="44"/><rect x="164" y="250" width="54" height="44"/>
    <rect x="224" y="250" width="54" height="44"/><rect x="284" y="250" width="54" height="44"/>
    <rect x="344" y="250" width="54" height="44"/><rect x="404" y="250" width="54" height="44"/>
    <rect x="464" y="250" width="54" height="44"/><rect x="524" y="250" width="54" height="44"/>
    <rect x="584" y="250" width="54" height="44"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1a2026">
    <text x="131" y="268">d1</text><text x="191" y="268">d2</text><text x="251" y="268">d3</text>
    <text x="311" y="268">d4</text><text x="371" y="268">d5</text><text x="431" y="268">d6</text>
    <text x="491" y="268">d7</text><text x="551" y="268">d8</text><text x="611" y="268">d9</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="131" y="286">1</text><text x="191" y="286">4</text><text x="251" y="286">9</text>
    <text x="311" y="286">16</text><text x="371" y="286">25</text><text x="431" y="286">36</text>
    <text x="491" y="286">49</text><text x="551" y="286">64</text><text x="611" y="286">81</text>
  </g>
  <text x="330" y="326" text-anchor="middle" font-size="13" fill="#1a2026">Each day buys the globally cheapest tail, so the biggest values land on the</text>
  <text x="330" y="344" text-anchor="middle" font-size="13" fill="#1a2026">biggest days: 1+4+9+16+25+36+49+64+81 = <tspan fill="#4169E1" font-weight="600">285</tspan>.</text>
</svg>
