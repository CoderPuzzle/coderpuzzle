<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums=[8,6,1,5,3]; left_min=[8,6,1,1,1], right_min=[1,1,1,3,3];
       cells x=140+90i w=80; shaded column = peak j=3; accented cells = the read shoulders -->
  <rect x="406" y="40" width="88" height="226" rx="8" fill="#dbe4fb"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="140" y="48" width="80" height="40"/><rect x="230" y="48" width="80" height="40"/>
    <rect x="320" y="48" width="80" height="40"/><rect x="410" y="48" width="80" height="40"/>
    <rect x="500" y="48" width="80" height="40"/>
    <rect x="140" y="146" width="80" height="36"/><rect x="230" y="146" width="80" height="36"/>
    <rect x="410" y="146" width="80" height="36"/><rect x="500" y="146" width="80" height="36"/>
    <rect x="140" y="218" width="80" height="36"/><rect x="230" y="218" width="80" height="36"/>
    <rect x="320" y="218" width="80" height="36"/><rect x="410" y="218" width="80" height="36"/>
  </g>
  <rect x="320" y="146" width="80" height="36" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <rect x="500" y="218" width="80" height="36" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="126" y="74" text-anchor="end" fill="#5c6b76" font-size="12.5">nums</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="180" y="74">8</text><text x="270" y="74">6</text><text x="360" y="74">1</text>
    <text x="450" y="74" fill="#4169E1">5</text><text x="540" y="74">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="180" y="110">0</text><text x="270" y="110">1</text><text x="360" y="110">2</text>
    <text x="450" y="110">3</text><text x="540" y="110">4</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="126" y="166">left_min</text>
    <text x="126" y="182" font-size="10.5">min so far →</text>
    <text x="126" y="238">right_min</text>
    <text x="126" y="254" font-size="10.5">← min ahead</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="180" y="170">8</text><text x="270" y="170">6</text>
    <text x="360" y="170" fill="#4169E1">1</text>
    <text x="450" y="170">1</text><text x="540" y="170">1</text>
    <text x="180" y="242">1</text><text x="270" y="242">1</text><text x="360" y="242">1</text>
    <text x="450" y="242">3</text>
    <text x="540" y="242" fill="#4169E1">3</text>
  </g>
  <path d="M 372 142 Q 400 106 438 90" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M 528 214 Q 520 128 466 92" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="320" y="320" text-anchor="middle" fill="#1a2026" font-size="13">left_min = [8, 6, 1, 1, 1] and right_min = [1, 1, 1, 3, 3]; j = 1 and j = 2 fail</text>
  <text x="320" y="338" text-anchor="middle" fill="#1a2026" font-size="13">the strictly-smaller side check, so peak j = 3 gives the minimum <tspan fill="#4169E1" font-weight="600">1 + 5 + 3 = 9</tspan>.</text>
</svg>
