<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="240" fill="#ffffff"/>
  <!-- number line -->
  <line x1="40" y1="36" x2="612" y2="36" stroke="#98a2ac" stroke-width="1.3"/>
  <g stroke="#98a2ac" stroke-width="1.1">
    <line x1="40" y1="30" x2="40" y2="42"/><line x1="84" y1="30" x2="84" y2="42"/>
    <line x1="128" y1="30" x2="128" y2="42"/><line x1="172" y1="30" x2="172" y2="42"/>
    <line x1="216" y1="30" x2="216" y2="42"/><line x1="260" y1="30" x2="260" y2="42"/>
    <line x1="304" y1="30" x2="304" y2="42"/><line x1="348" y1="30" x2="348" y2="42"/>
    <line x1="392" y1="30" x2="392" y2="42"/><line x1="436" y1="30" x2="436" y2="42"/>
    <line x1="480" y1="30" x2="480" y2="42"/><line x1="524" y1="30" x2="524" y2="42"/>
    <line x1="568" y1="30" x2="568" y2="42"/><line x1="612" y1="30" x2="612" y2="42"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="40" y="22">0</text><text x="84" y="22">2</text><text x="128" y="22">4</text>
    <text x="172" y="22">6</text><text x="216" y="22">8</text><text x="260" y="22">10</text>
    <text x="304" y="22">12</text><text x="348" y="22">14</text><text x="392" y="22">16</text>
    <text x="436" y="22">18</text><text x="480" y="22">20</text><text x="524" y="22">22</text>
    <text x="568" y="22">24</text><text x="612" y="22">26</text>
  </g>
  <!-- coverage ladder: reach values 1,3,7,15,25 ; x(p) = 40 + 22 p -->
  <g font-size="12.5">
    <rect x="40" y="56" width="22" height="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.4"/>
    <text x="16" y="70" fill="#5c6b76">1..1</text>
    <text x="72" y="70" fill="#5c6b76">absorb coin 1</text>
    <rect x="40" y="88" width="66" height="18" fill="#f3f5f7"/>
    <rect x="62" y="88" width="44" height="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="16" y="102" fill="#5c6b76">1..3</text>
    <text x="116" y="102" fill="#4169E1">coin 4 &gt; reach+1 → add 2 (reach doubles+1)</text>
    <rect x="40" y="120" width="154" height="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.4"/>
    <rect x="106" y="120" width="88" height="18" fill="#e8edfa" stroke="#1a2026" stroke-width="1.2"/>
    <text x="16" y="134" fill="#5c6b76">1..7</text>
    <text x="204" y="134" fill="#5c6b76">absorb coin 4</text>
    <rect x="40" y="152" width="330" height="18" fill="#f3f5f7"/>
    <rect x="194" y="152" width="176" height="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="16" y="166" fill="#5c6b76">1..15</text>
    <text x="380" y="166" fill="#4169E1">coin 10 &gt; reach+1 → add 8</text>
    <rect x="40" y="184" width="550" height="18" fill="#e8edfa" stroke="#4169E1" stroke-width="1.4"/>
    <rect x="370" y="184" width="220" height="18" fill="#e8edfa" stroke="#1a2026" stroke-width="1.2"/>
    <text x="16" y="198" fill="#5c6b76">1..25</text>
    <text x="600" y="176" fill="#5c6b76" text-anchor="end">absorb coin 10</text>
  </g>
  <!-- target marker -->
  <line x1="436" y1="48" x2="436" y2="208" stroke="#1a2026" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="436" y="228" text-anchor="middle" fill="#1a2026" font-size="12.5">target 19 covered → 2 coins added</text>
</svg>
