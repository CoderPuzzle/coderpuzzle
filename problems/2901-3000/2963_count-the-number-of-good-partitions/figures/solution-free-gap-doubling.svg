<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="268" fill="#ffffff"/>
  <!-- nums = [1,2,3,4]; each value occurs once so its first-to-last span is one cell; cells x = 130 + 120i, w 96, gaps at x = 238/358/478 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="178" y="52">span [0,0]</text><text x="298" y="52">span [1,1]</text>
    <text x="418" y="52">span [2,2]</text><text x="538" y="52">span [3,3]</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="130" y="64" width="96" height="48"/><rect x="250" y="64" width="96" height="48"/>
    <rect x="370" y="64" width="96" height="48"/><rect x="490" y="64" width="96" height="48"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="178" y="94">1</text><text x="298" y="94">2</text><text x="418" y="94">3</text><text x="538" y="94">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="178" y="134">i = 0</text><text x="298" y="134">i = 1</text>
    <text x="418" y="134">i = 2</text><text x="538" y="134">i = 3</text>
  </g>
  <!-- the three free gaps between the four maximal blocks -->
  <g stroke="#4169E1" stroke-width="2" stroke-dasharray="5 4">
    <line x1="238" y1="58" x2="238" y2="122"/>
    <line x1="358" y1="58" x2="358" y2="122"/>
    <line x1="478" y1="58" x2="478" y2="122"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="15">
    <text x="238" y="158">×2</text><text x="358" y="158">×2</text><text x="478" y="158">×2</text>
  </g>
  <text x="320" y="178" text-anchor="middle" fill="#5c6b76" font-size="12">each gap is an independent cut-or-not choice</text>
  <text x="320" y="204" text-anchor="middle" fill="#1a2026" font-size="14">3 independent gaps → 2 × 2 × 2 = <tspan fill="#4169E1" font-weight="600">8 good partitions</tspan></text>
  <text x="320" y="230" text-anchor="middle" fill="#1a2026" font-size="13">Every value occurs once, so each first-to-last span is one cell;</text>
  <text x="320" y="248" text-anchor="middle" fill="#1a2026" font-size="13">the four cells are four maximal blocks, and every gap doubles the count.</text>
</svg>
