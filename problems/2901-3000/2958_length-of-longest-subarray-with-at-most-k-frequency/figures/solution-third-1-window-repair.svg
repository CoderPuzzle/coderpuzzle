<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="268" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums = [1,2,3,1,2,3,1,2], k = 2; cells 60x46 at x=60+68i; top bracket window [0..5] length 6; at r=6 count(1)=3>2 so left moves 0 to 1, bottom bracket window [1..6] still length 6 -->
  <path d="M 60 42 L 460 42 M 60 42 L 60 48 M 460 42 L 460 48" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="260" y="30" text-anchor="middle" fill="#1a2026" font-size="12.5">after index 5: good window, <tspan fill="#4169E1" font-weight="600">length 6</tspan>, best = 6</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="60" y="56" width="60" height="46"/><rect x="128" y="56" width="60" height="46"/>
    <rect x="196" y="56" width="60" height="46"/><rect x="264" y="56" width="60" height="46"/>
    <rect x="332" y="56" width="60" height="46"/><rect x="400" y="56" width="60" height="46"/>
    <rect x="536" y="56" width="60" height="46"/>
  </g>
  <rect x="468" y="56" width="60" height="46" fill="#ffffff" stroke="#4169E1" stroke-width="2" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="90" y="84">1</text><text x="158" y="84">2</text><text x="226" y="84">3</text>
    <text x="294" y="84">1</text><text x="362" y="84">2</text><text x="430" y="84">3</text>
    <text x="498" y="84">1</text><text x="566" y="84">2</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="90" y="120">0</text><text x="158" y="120">1</text><text x="226" y="120">2</text>
    <text x="294" y="120">3</text><text x="362" y="120">4</text><text x="430" y="120">5</text>
    <text x="498" y="120">6</text><text x="566" y="120">7</text>
  </g>
  <text x="320" y="142" text-anchor="middle" fill="#1a2026" font-size="12.5">index 6 adds a third 1 — count(1) = 3 &gt; k = 2, shrink</text>
  <path d="M 84 172 L 122 172" fill="none" stroke="#5c6b76" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 128 172 L 528 172 M 128 172 L 128 178 M 528 172 L 528 178" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="328" y="194" text-anchor="middle" fill="#1a2026" font-size="12.5">repaired window: [2, 3, 1, 2, 3, 1] — still <tspan fill="#4169E1" font-weight="600">length 6</tspan>, counts all ≤ 2</text>
  <text x="40" y="232" fill="#1a2026" font-size="13">The third 1 at index 6 breaks the window; left hops past the old 1 at</text>
  <text x="40" y="250" fill="#1a2026" font-size="13">index 0, every count drops to ≤ 2, and the best length stays <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
