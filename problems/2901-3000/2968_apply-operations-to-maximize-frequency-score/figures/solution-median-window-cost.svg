<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="264" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- sorted nums = [1,2,4,6], k = 3; window [0,2] flattened onto median 2 (index 1); cells x = 150 + 110i, w 90 -->
  <text x="305" y="38" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">window [1, 2, 4] — flatten onto its <tspan fill="#4169E1">median 2</tspan></text>
  <path d="M 195 76 Q 248 46 297 74" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 415 76 Q 362 46 313 74" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="52" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">+1</text>
  <text x="372" y="52" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">−2</text>
  <rect x="144" y="74" width="322" height="58" rx="6" fill="none" stroke="#4169E1" stroke-width="2"/>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="150" y="80" width="90" height="46" fill="#dbe4fb"/>
    <rect x="260" y="80" width="90" height="46" fill="#dbe4fb"/>
    <rect x="370" y="80" width="90" height="46" fill="#dbe4fb"/>
    <rect x="480" y="80" width="90" height="46" fill="#ffffff" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="195" y="109">1</text><text x="305" y="109">2</text><text x="415" y="109">4</text><text x="525" y="109">6</text>
  </g>
  <line x1="262" y1="138" x2="348" y2="138" stroke="#4169E1" stroke-width="2.5"/>
  <text x="230" y="142" text-anchor="end" fill="#4169E1" font-size="11" font-weight="600">median</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="195" y="156">i = 0</text><text x="305" y="156">i = 1</text>
    <text x="415" y="156">i = 2</text><text x="525" y="156">i = 3</text>
  </g>
  <path d="M 468 103 L 476 103" fill="none" stroke="#5c6b76" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrowgray)"/>
  <text x="525" y="178" text-anchor="middle" fill="#5c6b76" font-size="12">adding 6: +4 → 7 &gt; 3</text>
  <text x="320" y="204" text-anchor="middle" fill="#1a2026" font-size="13">cost = (2−1) + 0 + (4−2) = <tspan fill="#4169E1" font-weight="600">3 ≤ k = 3</tspan></text>
  <text x="320" y="230" text-anchor="middle" fill="#1a2026" font-size="13">Growing the window to all of [1, 2, 4, 6] costs 7 &gt; k = 3,</text>
  <text x="320" y="248" text-anchor="middle" fill="#1a2026" font-size="13">so the widest affordable window is [1, 2, 4]: score <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
