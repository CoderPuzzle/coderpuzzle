<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="432" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- words = ["bab","dab","cab"], groups = [1,2,2]; boxes 110x48; all three pairs have hamming 1, dab-cab is same-group so blocked; dp = [1,2,2], prev = [-,0,0] -->
  <!-- compatibility edges: bab-dab and bab-cab allowed, dab-cab dashed/blocked -->
  <g stroke="#4169E1" stroke-width="1.8">
    <line x1="300" y1="90" x2="172" y2="188"/>
    <line x1="380" y1="90" x2="508" y2="188"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.8" stroke-dasharray="5 4">
    <line x1="205" y1="226" x2="235" y2="226"/>
    <line x1="445" y1="226" x2="475" y2="226"/>
  </g>
  <text x="340" y="230" text-anchor="middle" fill="#9aa7b2" font-size="12.5">ham 1 but groups 2 = 2 — blocked</text>
  <text x="165" y="140" text-anchor="middle" fill="#4169E1" font-size="12.5">ham 1, groups 1≠2</text>
  <text x="515" y="140" text-anchor="middle" fill="#4169E1" font-size="12.5">ham 1, groups 1≠2</text>
  <!-- word boxes with corner index -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.5">
    <rect x="285" y="40" width="110" height="48"/>
    <rect x="90" y="190" width="110" height="48"/>
    <rect x="490" y="190" width="110" height="48"/>
  </g>
  <g text-anchor="middle">
    <text x="340" y="62" font-weight="600">bab</text>
    <text x="340" y="80" fill="#5c6b76" font-size="12">group 1</text>
    <text x="145" y="212" font-weight="600">dab</text>
    <text x="145" y="230" fill="#5c6b76" font-size="12">group 2</text>
    <text x="545" y="212" font-weight="600">cab</text>
    <text x="545" y="230" fill="#5c6b76" font-size="12">group 2</text>
  </g>
  <g fill="#9aa7b2" font-size="10.5">
    <text x="292" y="53">0</text>
    <text x="97" y="203">1</text>
    <text x="497" y="203">2</text>
  </g>
  <!-- dp and prev rows aligned under the boxes -->
  <text x="44" y="286" fill="#5c6b76" font-size="12.5">dp</text>
  <text x="30" y="314" fill="#5c6b76" font-size="12.5">prev</text>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="145" y="286" fill="#1a2026">1</text>
    <text x="340" y="286" fill="#1a2026">2</text>
    <text x="545" y="286" fill="#4169E1">2</text>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="145" y="314" fill="#9aa7b2">—</text>
    <text x="340" y="314" fill="#1a2026" font-weight="600">0</text>
    <text x="545" y="314" fill="#1a2026" font-weight="600">0</text>
  </g>
  <!-- backtrace from index 2 via prev[2] = 0 -->
  <path d="M 535 324 Q 340 372 145 298" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="366" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">answer starts at the latest dp max (index 2): prev 2 → 0 gives bab → cab</text>
  <text x="340" y="398" text-anchor="middle" fill="#1a2026" font-size="13">All three pairs differ in one letter; the same-group pair dab–cab is blocked,</text>
  <text x="340" y="418" text-anchor="middle" fill="#1a2026" font-size="13">so dp = [<tspan fill="#4169E1" font-weight="600">1, 2, 2</tspan>] and the backtrace returns <tspan fill="#4169E1" font-weight="600">bab → cab</tspan>.</text>
</svg>
