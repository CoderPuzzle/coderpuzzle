<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="326" fill="#ffffff"/>
  <!-- s = "100011001", k = 3; cells 60x36 at x=70+60k, y=40; window bars 22px at y=100+30i -->
  <!-- i=0 -> s[0..5] 100011 (6), i=1 -> s[1..8] 00011001 (8), i=2 -> 0011001 (7), i=3 -> 011001 (6), i=4 -> 11001 (5) best, i=5 -> none -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="70" y="40" width="60" height="36"/><rect x="130" y="40" width="60" height="36"/><rect x="190" y="40" width="60" height="36"/>
    <rect x="250" y="40" width="60" height="36"/><rect x="310" y="40" width="60" height="36"/><rect x="370" y="40" width="60" height="36"/>
    <rect x="430" y="40" width="60" height="36"/><rect x="490" y="40" width="60" height="36"/><rect x="550" y="40" width="60" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="100" y="63">1</text><text x="160" y="63">0</text><text x="220" y="63">0</text><text x="280" y="63">0</text>
    <text x="340" y="63">1</text><text x="400" y="63">1</text><text x="460" y="63">0</text><text x="520" y="63">0</text><text x="580" y="63">1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="100" y="92">0</text><text x="160" y="92">1</text><text x="220" y="92">2</text><text x="280" y="92">3</text>
    <text x="340" y="92">4</text><text x="400" y="92">5</text><text x="460" y="92">6</text><text x="520" y="92">7</text><text x="580" y="92">8</text>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.2">
    <rect x="70" y="100" width="360" height="22"/>
    <rect x="130" y="130" width="480" height="22"/>
    <rect x="190" y="160" width="420" height="22"/>
    <rect x="250" y="190" width="360" height="22"/>
  </g>
  <rect x="310" y="220" width="300" height="22" fill="#4169E1" stroke="#4169E1" stroke-width="1.2"/>
  <g text-anchor="end" fill="#5c6b76" font-size="12">
    <text x="64" y="115">i = 0</text>
    <text x="64" y="145">i = 1</text>
    <text x="64" y="175">i = 2</text>
    <text x="64" y="205">i = 3</text>
    <text x="64" y="235">i = 4</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="250" y="115" fill="#1a2026">100011 — len 6</text>
    <text x="370" y="145" fill="#1a2026">00011001 — len 8</text>
    <text x="400" y="175" fill="#1a2026">0011001 — len 7</text>
    <text x="430" y="205" fill="#1a2026">011001 — len 6</text>
    <text x="460" y="235" fill="#ffffff" font-weight="600">11001 — len 5</text>
  </g>
  <text x="64" y="258" fill="#9aa7b2" font-size="12">i = 5: only 2 ones remain before the end — no candidate</text>
  <text x="340" y="292" text-anchor="middle" fill="#1a2026" font-size="13">Each start's first window with three ones is its only shortest candidate; only shorter</text>
  <text x="340" y="312" text-anchor="middle" fill="#1a2026" font-size="13">or lexicographically smaller survives: 100011 → 011001 → <tspan fill="#4169E1" font-weight="600">11001</tspan> (len 5), the answer.</text>
</svg>
