<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- path 0-1-2-3, coins=[10,10,3,3], k=5; dp rows node 0..3 over states t=0..3 then t=14;
       table x 40..600, rows 40px tall from y=90, t columns centered at 200,280,360,440,560 -->
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="100" y="78">state t</text>
    <text x="200" y="78">0</text><text x="280" y="78">1</text><text x="360" y="78">2</text><text x="440" y="78">3</text>
    <text x="500" y="78">…</text><text x="560" y="78">14</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="40" y="90" width="560" height="40"/>
    <rect x="40" y="130" width="560" height="40"/>
    <rect x="40" y="170" width="560" height="40"/>
    <rect x="40" y="210" width="560" height="40"/>
  </g>
  <rect x="160" y="90" width="80" height="40" fill="#dbe4fb"/>
  <g stroke="#42525e" stroke-width="1">
    <line x1="160" y1="90" x2="160" y2="250"/><line x1="240" y1="90" x2="240" y2="250"/>
    <line x1="320" y1="90" x2="320" y2="250"/><line x1="400" y1="90" x2="400" y2="250"/>
    <line x1="480" y1="90" x2="480" y2="250"/><line x1="520" y1="90" x2="520" y2="250"/>
  </g>
  <g text-anchor="middle">
    <text x="100" y="107" font-size="13.5" font-weight="600" fill="#1a2026">node 0</text>
    <text x="100" y="122" font-size="11.5" fill="#5c6b76">coin 10 · -k</text>
    <text x="100" y="147" font-size="13.5" font-weight="600" fill="#1a2026">node 1</text>
    <text x="100" y="162" font-size="11.5" fill="#5c6b76">coin 10 · -k</text>
    <text x="100" y="187" font-size="13.5" font-weight="600" fill="#1a2026">node 2</text>
    <text x="100" y="202" font-size="11.5" fill="#5c6b76">coin 3 · halve</text>
    <text x="100" y="227" font-size="13.5" font-weight="600" fill="#1a2026">node 3</text>
    <text x="100" y="242" font-size="11.5" fill="#5c6b76">coin 3 · halve</text>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">
    <text x="200" y="115" fill="#4169E1">11</text><text x="280" y="115">3</text><text x="360" y="115">1</text><text x="440" y="115">0</text>
    <text x="560" y="115" fill="#9aa7b2">0</text>
    <text x="200" y="155">6</text><text x="280" y="155">2</text><text x="360" y="155">1</text><text x="440" y="155">0</text>
    <text x="560" y="155" fill="#9aa7b2">0</text>
    <text x="200" y="195">1</text><text x="280" y="195">0</text><text x="360" y="195">0</text><text x="440" y="195">0</text>
    <text x="560" y="195" fill="#9aa7b2">0</text>
    <text x="200" y="235">1</text><text x="280" y="235">0</text><text x="360" y="235">0</text><text x="440" y="235">0</text>
    <text x="560" y="235" fill="#9aa7b2">0</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="13">
    <text x="500" y="115">…</text><text x="500" y="155">…</text><text x="500" y="195">…</text><text x="500" y="235">…</text>
  </g>
  <line x1="24" y1="246" x2="24" y2="104" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="14" y="175" transform="rotate(-90 14 175)" text-anchor="middle" font-size="11.5" fill="#5c6b76">children first</text>
  <text x="320" y="280" text-anchor="middle" font-size="12.5" fill="#1a2026">plan: nodes 0 and 1 pay -k (5 + 5), nodes 2 and 3 halve (1 + 0)</text>
  <text x="320" y="308" text-anchor="middle" font-size="13" fill="#1a2026">Filling children first, dp[0][0] = max(10 - 5 + 6, 5 + 2) = <tspan fill="#4169E1" font-weight="600">11</tspan>: pay -k at</text>
  <text x="320" y="326" text-anchor="middle" font-size="13" fill="#1a2026">nodes 0 and 1, halve nodes 2 and 3 — the expected output.</text>
</svg>
