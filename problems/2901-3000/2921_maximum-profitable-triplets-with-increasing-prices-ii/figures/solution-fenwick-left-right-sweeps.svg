<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="330" fill="#ffffff"/>
  <!-- prices=[10,2,3,4], profits=[100,2,7,10]; ranks from sorted unique prices [2,3,4,10];
       table x 40..625, rows 40px tall from y=92, columns at 110,190,260,340,430,510 -->
  <text x="332" y="44" text-anchor="middle" fill="#5c6b76" font-size="12">left[j]: best profit earlier &amp; cheaper · right[j]: best profit later &amp; pricier</text>
  <g fill="#5c6b76" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="75" y="80">item</text><text x="150" y="80">price</text><text x="225" y="80">rank</text>
    <text x="300" y="80">profit</text><text x="385" y="80">left[]</text><text x="470" y="80">right[]</text>
    <text x="567" y="80">candidate</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.3">
    <rect x="40" y="92" width="585" height="40"/>
    <rect x="40" y="132" width="585" height="40"/>
    <rect x="40" y="172" width="585" height="40" fill="#dbe4fb"/>
    <rect x="40" y="212" width="585" height="40"/>
  </g>
  <g stroke="#42525e" stroke-width="1">
    <line x1="110" y1="92" x2="110" y2="252"/><line x1="190" y1="92" x2="190" y2="252"/>
    <line x1="260" y1="92" x2="260" y2="252"/><line x1="340" y1="92" x2="340" y2="252"/>
    <line x1="430" y1="92" x2="430" y2="252"/><line x1="510" y1="92" x2="510" y2="252"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#1a2026">
    <text x="75" y="117">0</text><text x="150" y="117">10</text><text x="225" y="117">4</text><text x="300" y="117">100</text>
    <text x="75" y="157">1</text><text x="150" y="157">2</text><text x="225" y="157">1</text><text x="300" y="157">2</text>
    <text x="75" y="197">2</text><text x="150" y="197">3</text><text x="225" y="197">2</text><text x="300" y="197">7</text>
    <text x="75" y="237">3</text><text x="150" y="237">4</text><text x="225" y="237">3</text><text x="300" y="237">10</text>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="385" y="117" fill="#9aa7b2">0</text><text x="470" y="117" fill="#9aa7b2">0</text>
    <text x="385" y="157" fill="#9aa7b2">0</text><text x="470" y="157" fill="#1a2026">10</text>
    <text x="385" y="197" fill="#4169E1">2</text><text x="470" y="197" fill="#4169E1">10</text>
    <text x="385" y="237" fill="#1a2026">7</text><text x="470" y="237" fill="#9aa7b2">0</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="567" y="117" fill="#9aa7b2">—</text><text x="567" y="157" fill="#9aa7b2">—</text>
    <text x="567" y="197" fill="#4169E1" font-weight="600">2 + 7 + 10 = 19</text>
    <text x="567" y="237" fill="#9aa7b2">—</text>
  </g>
  <text x="332" y="284" text-anchor="middle" font-size="13" fill="#1a2026">Only item 2 has both sides — left 2 (item 1) and right 10 (item 3),</text>
  <text x="332" y="302" text-anchor="middle" font-size="13" fill="#1a2026">so the middle j = 2 sums 2 + 7 + 10 = <tspan fill="#4169E1" font-weight="600">19</tspan>, the answer.</text>
</svg>
