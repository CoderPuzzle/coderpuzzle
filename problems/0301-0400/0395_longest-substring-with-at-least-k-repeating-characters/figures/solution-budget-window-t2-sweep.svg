<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="344" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- s = "ababbc", k = 2, budget t = 2; cells 56x44 at x = 132+64i, y = 56;
       bracket rows (window spans) at y = 150 / 200 / 250 -->
  <text x="320" y="32" text-anchor="middle" fill="#1a2026" font-weight="600">s = "ababbc", k = 2, budget t = 2</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="132" y="56" width="56" height="44" fill="#dbe4fb"/>
    <rect x="196" y="56" width="56" height="44" fill="#dbe4fb"/>
    <rect x="260" y="56" width="56" height="44" fill="#dbe4fb"/>
    <rect x="324" y="56" width="56" height="44" fill="#dbe4fb"/>
    <rect x="388" y="56" width="56" height="44" fill="#dbe4fb"/>
    <rect x="452" y="56" width="56" height="44" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="160" y="84">a</text><text x="224" y="84">b</text><text x="288" y="84">a</text>
    <text x="352" y="84">b</text><text x="416" y="84">b</text><text x="480" y="84" fill="#9aa7b2">c</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="160" y="120">0</text><text x="224" y="120">1</text><text x="288" y="120">2</text>
    <text x="352" y="120">3</text><text x="416" y="120">4</text><text x="480" y="120">5</text>
  </g>
  <!-- r = 3: window [0..3] "abab" -->
  <path d="M 132 144 L 132 150 L 380 150 L 380 144" fill="none" stroke="#5c6b76" stroke-width="1.5"/>
  <text x="40" y="172" fill="#1a2026" font-size="12.5">r = 3 — window "abab": a:2, b:2, qualified 2 → record 4</text>
  <!-- r = 4: window [0..4] "ababb" -->
  <path d="M 132 194 L 132 200 L 444 200 L 444 194" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="40" y="222" fill="#1a2026" font-size="12.5">r = 4 — window "ababb": a:2, b:3 → <tspan fill="#4169E1" font-weight="600">record 5</tspan>, the answer</text>
  <!-- r = 5: 'c' busts the budget, shrink drops indices 0-2, window [3..5] "bbc" -->
  <path d="M 324 244 L 324 250 L 508 250 L 508 244" fill="none" stroke="#5c6b76" stroke-width="1.5"/>
  <path d="M 316 250 L 148 250" fill="none" stroke="#5c6b76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="272" fill="#1a2026" font-size="12.5">r = 5 — 'c' busts t: shrink to "bbc" (indices 3–5) — legal, but c:1 &lt; k, no record</text>
  <text x="320" y="312" text-anchor="middle" fill="#1a2026" font-size="13">With t = 2 the sweep records "ababb" at length <tspan fill="#4169E1" font-weight="600">5</tspan> — a:2 and b:3 both clear k = 2 —</text>
  <text x="320" y="330" text-anchor="middle" fill="#1a2026" font-size="13">and after 'c' busts the budget the shrunk "bbc" never beats it.</text>
</svg>
