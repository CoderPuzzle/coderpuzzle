<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="318" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- nums=[1,5,1,1,6,4] -> sorted=[1,1,1,4,5,6], m=3; lower half reversed into
       even slots 0,2,4 (accent arrows), upper half reversed into odd slots 1,3,5
       (gray arrows); cells 70x40 at x=120+70i, top row y=56, result row y=216 -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="155" y="48">0</text><text x="225" y="48">1</text><text x="295" y="48">2</text>
    <text x="365" y="48">3</text><text x="435" y="48">4</text><text x="505" y="48">5</text>
  </g>
  <text x="330" y="32" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">m = 3</text>
  <line x1="330" y1="42" x2="330" y2="110" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- sorted row -->
  <text x="40" y="80" fill="#5c6b76" font-size="12.5">sorted</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="120" y="56" width="70" height="40" fill="#dbe4fb"/>
    <rect x="190" y="56" width="70" height="40" fill="#dbe4fb"/>
    <rect x="260" y="56" width="70" height="40" fill="#dbe4fb"/>
    <rect x="330" y="56" width="70" height="40" fill="#f0f3f7"/>
    <rect x="400" y="56" width="70" height="40" fill="#f0f3f7"/>
    <rect x="470" y="56" width="70" height="40" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="155" y="81">1</text><text x="225" y="81">1</text><text x="295" y="81">1</text>
    <text x="365" y="81">4</text><text x="435" y="81">5</text><text x="505" y="81">6</text>
  </g>
  <text x="295" y="124" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">lower</text>
  <text x="365" y="124" text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">upper</text>
  <!-- reversal arrows: lower half reversed into even slots, upper into odd; the two long
       arrows run high and dive steeply so they clear the wiggle-sign band at y 200-214 -->
  <g fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 295 100 Q 185 160 155 212"/>
    <path d="M 225 100 Q 230 160 295 212"/>
    <path d="M 155 100 C 155 135 415 125 434 212"/>
  </g>
  <g fill="none" stroke="#5c6b76" stroke-width="2" marker-end="url(#arrowg)">
    <path d="M 505 100 C 505 135 245 125 226 212"/>
    <path d="M 435 100 Q 395 160 365 212"/>
    <path d="M 365 100 Q 460 165 505 212"/>
  </g>
  <!-- result row with wiggle signs -->
  <g text-anchor="middle" fill="#4169E1" font-size="14" font-weight="600">
    <text x="190" y="210">&lt;</text><text x="260" y="210">&gt;</text><text x="330" y="210">&lt;</text>
    <text x="400" y="210">&gt;</text><text x="470" y="210">&lt;</text>
  </g>
  <text x="40" y="240" fill="#5c6b76" font-size="12.5">result</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="120" y="216" width="70" height="40" fill="#dbe4fb"/>
    <rect x="190" y="216" width="70" height="40" fill="#ffffff"/>
    <rect x="260" y="216" width="70" height="40" fill="#dbe4fb"/>
    <rect x="330" y="216" width="70" height="40" fill="#ffffff"/>
    <rect x="400" y="216" width="70" height="40" fill="#dbe4fb"/>
    <rect x="470" y="216" width="70" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="155" y="241">1</text><text x="225" y="241">6</text><text x="295" y="241">1</text>
    <text x="365" y="241">5</text><text x="435" y="241">1</text><text x="505" y="241">4</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="155" y="272">0</text><text x="225" y="272">1</text><text x="295" y="272">2</text>
    <text x="365" y="272">3</text><text x="435" y="272">4</text><text x="505" y="272">5</text>
  </g>
  <text x="40" y="292" fill="#1a2026" font-size="13">Each half is written out reversed: the three 1s land on the even valleys 0, 2, 4, held apart.</text>
  <text x="40" y="310" fill="#1a2026" font-size="13">Result: <tspan fill="#4169E1" font-weight="600">[1, 6, 1, 5, 1, 4]</tspan> — every adjacent pair wiggles the right way.</text>
</svg>
