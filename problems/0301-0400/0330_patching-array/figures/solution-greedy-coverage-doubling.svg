<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="340" fill="#ffffff"/>
  <!-- nums = [1, 3], n = 6; cells 62x28 from x=100; shaded cell = a sum coverable in [1, reachable), accent border = the value added this step -->
  <path d="M 100 58 v -6 h 372 v 6" fill="none" stroke="#9aa7b2" stroke-width="1.4"/>
  <text x="286" y="42" text-anchor="middle" fill="#5c6b76" font-size="12.5">target [1, n] with n = 6</text>

  <!-- step 1: consume nums[0] = 1 -->
  <text x="100" y="92" fill="#5c6b76" font-size="12">consume nums[0] = 1 — 1 ≤ reachable 1</text>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="100" y="100" width="62" height="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.4"/>
    <rect x="162" y="100" width="62" height="28" fill="#ffffff"/>
    <rect x="224" y="100" width="62" height="28" fill="#ffffff"/>
    <rect x="286" y="100" width="62" height="28" fill="#ffffff"/>
    <rect x="348" y="100" width="62" height="28" fill="#ffffff"/>
    <rect x="410" y="100" width="62" height="28" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="131" y="119">1</text><text x="193" y="119">2</text><text x="255" y="119">3</text>
    <text x="317" y="119">4</text><text x="379" y="119">5</text><text x="441" y="119">6</text>
  </g>
  <text x="482" y="119" fill="#1a2026" font-size="12.5">reachable = 2</text>

  <!-- step 2: patch 2 -->
  <text x="100" y="162" fill="#5c6b76" font-size="12">gap at 2 — patch 2, coverage doubles</text>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="100" y="170" width="62" height="28" fill="#dbe4fb"/>
    <rect x="162" y="170" width="62" height="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.4"/>
    <rect x="224" y="170" width="62" height="28" fill="#dbe4fb"/>
    <rect x="286" y="170" width="62" height="28" fill="#ffffff"/>
    <rect x="348" y="170" width="62" height="28" fill="#ffffff"/>
    <rect x="410" y="170" width="62" height="28" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="131" y="189">1</text><text x="193" y="189">2</text><text x="255" y="189">3</text>
    <text x="317" y="189">4</text><text x="379" y="189">5</text><text x="441" y="189">6</text>
  </g>
  <text x="482" y="189" fill="#1a2026" font-size="12.5">reachable = 4</text>

  <!-- step 3: consume nums[1] = 3 -->
  <text x="100" y="232" fill="#5c6b76" font-size="12">consume nums[1] = 3 — 3 ≤ reachable 4</text>
  <g stroke="#42525e" stroke-width="1.3">
    <rect x="100" y="240" width="62" height="28" fill="#dbe4fb"/>
    <rect x="162" y="240" width="62" height="28" fill="#dbe4fb"/>
    <rect x="224" y="240" width="62" height="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="2.4"/>
    <rect x="286" y="240" width="62" height="28" fill="#dbe4fb"/>
    <rect x="348" y="240" width="62" height="28" fill="#dbe4fb"/>
    <rect x="410" y="240" width="62" height="28" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="131" y="259">1</text><text x="193" y="259">2</text><text x="255" y="259">3</text>
    <text x="317" y="259">4</text><text x="379" y="259">5</text><text x="441" y="259">6</text>
  </g>
  <text x="482" y="259" fill="#1a2026" font-size="12.5">reachable = <tspan fill="#4169E1" font-weight="600">7</tspan> &gt; n</text>

  <text x="330" y="302" text-anchor="middle" fill="#1a2026" font-size="13">Coverage tracks [1, reachable): consume 1 → [1, 2), the patch 2 doubles it to [1, 4),</text>
  <text x="330" y="322" text-anchor="middle" fill="#1a2026" font-size="13">then consume 3 → [1, 7) is already past n = 6 — <tspan fill="#4169E1" font-weight="600">one patch</tspan> suffices.</text>
</svg>
