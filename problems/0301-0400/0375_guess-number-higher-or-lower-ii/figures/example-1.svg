<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- worst-case branches (paying 7 then 9) in blue -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="294" y1="69" x2="206" y2="125" marker-end="url(#arrowA)"/>
    <line x1="152" y1="171" x2="108" y2="227" marker-end="url(#arrowA)"/>
    <line x1="188" y1="171" x2="232" y2="227" marker-end="url(#arrowA)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="366" y1="69" x2="454" y2="125" marker-end="url(#arrow)"/>
    <line x1="469.7" y1="171" x2="420.3" y2="227" marker-end="url(#arrow)"/>
    <line x1="510.3" y1="171" x2="559.7" y2="227" marker-end="url(#arrow)"/>
    <line x1="385.9" y1="273" x2="359.1" y2="317" marker-end="url(#arrow)"/>
    <line x1="414.1" y1="273" x2="440.9" y2="317" marker-end="url(#arrow)"/>
    <line x1="580" y1="273" x2="580" y2="317" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="11.5">
    <text x="234" y="92">higher</text>
    <text x="412" y="92">lower</text>
    <text x="112" y="193">higher</text>
    <text x="222" y="193">lower</text>
    <text x="428" y="193">higher</text>
    <text x="530" y="193">lower</text>
    <text x="340" y="290">higher</text>
    <text x="452" y="290">lower</text>
    <text x="590" y="290">higher</text>
  </g>
  <!-- internal nodes: remaining range and the guess to make -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <rect x="295" y="23" width="70" height="46" rx="7"/>
    <rect x="135" y="125" width="70" height="46" rx="7"/>
    <rect x="455" y="125" width="70" height="46" rx="7"/>
    <rect x="365" y="227" width="70" height="46" rx="7"/>
    <rect x="545" y="227" width="70" height="46" rx="7"/>
  </g>
  <g text-anchor="middle">
    <text x="330" y="42" fill="#1a2026" font-weight="600">[1, 10]</text><text x="330" y="60" fill="#4169E1" font-size="12">guess 7</text>
    <text x="170" y="144" fill="#1a2026" font-weight="600">[8, 10]</text><text x="170" y="162" fill="#4169E1" font-size="12">guess 9</text>
    <text x="490" y="144" fill="#1a2026" font-weight="600">[1, 6]</text><text x="490" y="162" fill="#4169E1" font-size="12">guess 3</text>
    <text x="400" y="246" fill="#1a2026" font-weight="600">[4, 6]</text><text x="400" y="264" fill="#4169E1" font-size="12">guess 5</text>
    <text x="580" y="246" fill="#1a2026" font-weight="600">[1, 2]</text><text x="580" y="264" fill="#4169E1" font-size="12">guess 1</text>
  </g>
  <!-- leaves: the picked number and the total paid if the game ends there -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <rect x="55" y="227" width="64" height="46" rx="23"/>
    <rect x="215" y="227" width="64" height="46" rx="23"/>
    <rect x="310" y="317" width="64" height="46" rx="23"/>
    <rect x="420" y="317" width="64" height="46" rx="23"/>
    <rect x="545" y="317" width="64" height="46" rx="23"/>
  </g>
  <g text-anchor="middle">
    <text x="87" y="246" fill="#1a2026" font-weight="600">10</text><text x="87" y="264" fill="#4169E1" font-weight="600" font-size="12">$16</text>
    <text x="247" y="246" fill="#1a2026" font-weight="600">8</text><text x="247" y="264" fill="#4169E1" font-weight="600" font-size="12">$16</text>
    <text x="342" y="336" fill="#1a2026" font-weight="600">6</text><text x="342" y="354" fill="#5c6b76" font-size="12">$15</text>
    <text x="452" y="336" fill="#1a2026" font-weight="600">4</text><text x="452" y="354" fill="#5c6b76" font-size="12">$15</text>
    <text x="577" y="336" fill="#1a2026" font-weight="600">2</text><text x="577" y="354" fill="#5c6b76" font-size="12">$11</text>
  </g>
  <text x="330" y="388" text-anchor="middle" fill="#5c6b76" font-size="12.5">the worst branch pays $7 + $9 = $16, so $16 guarantees a win</text>
</svg>
