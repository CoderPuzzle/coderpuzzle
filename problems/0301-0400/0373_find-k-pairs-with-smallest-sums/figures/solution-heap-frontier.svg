<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums1 = [1,7,11] rows, nums2 = [2,4,6] cols; sums; cells 72x40 at (150,80) -->
  <text x="110" y="66" text-anchor="middle" fill="#5c6b76" font-size="12">nums1 \ nums2</text>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="186" y="70">2</text><text x="258" y="70">4</text><text x="330" y="70">6</text>
    <text x="122" y="105">1</text><text x="122" y="145">7</text><text x="122" y="185">11</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="222" y="80" width="72" height="40"/><rect x="294" y="80" width="72" height="40"/>
    <rect x="150" y="120" width="72" height="40"/><rect x="222" y="120" width="72" height="40"/><rect x="294" y="120" width="72" height="40"/>
    <rect x="150" y="160" width="72" height="40"/><rect x="222" y="160" width="72" height="40"/><rect x="294" y="160" width="72" height="40"/>
  </g>
  <!-- seeded frontier: the row minima in column 0 -->
  <g fill="#dbe4fb" stroke="#1a2026" stroke-width="1.4">
    <rect x="150" y="80" width="72" height="40"/>
  </g>
  <g text-anchor="middle">
    <text x="186" y="97" font-weight="600" fill="#1a2026">3</text><text x="186" y="113" font-size="10.5" fill="#5c6b76">(1,2)</text>
    <text x="258" y="97" font-weight="600" fill="#1a2026">5</text><text x="258" y="113" font-size="10.5" fill="#5c6b76">(1,4)</text>
    <text x="330" y="97" font-weight="600" fill="#1a2026">7</text><text x="330" y="113" font-size="10.5" fill="#5c6b76">(1,6)</text>
    <text x="186" y="137" font-weight="600" fill="#1a2026">9</text><text x="186" y="153" font-size="10.5" fill="#5c6b76">(7,2)</text>
    <text x="258" y="137" font-weight="600" fill="#1a2026">11</text><text x="258" y="153" font-size="10.5" fill="#5c6b76">(7,4)</text>
    <text x="330" y="137" font-weight="600" fill="#1a2026">13</text><text x="330" y="153" font-size="10.5" fill="#5c6b76">(7,6)</text>
    <text x="186" y="177" font-weight="600" fill="#1a2026">13</text><text x="186" y="193" font-size="10.5" fill="#5c6b76">(11,2)</text>
    <text x="258" y="177" font-weight="600" fill="#1a2026">15</text><text x="258" y="193" font-size="10.5" fill="#5c6b76">(11,4)</text>
    <text x="330" y="177" font-weight="600" fill="#1a2026">17</text><text x="330" y="193" font-size="10.5" fill="#5c6b76">(11,6)</text>
  </g>
  <!-- emit order badges on the popped row -->
  <g text-anchor="middle" font-size="11" font-weight="600">
    <text x="150" y="50" fill="#4169E1">pop 1 ↘</text>
    <text x="222" y="50" fill="#4169E1">pop 2 ↘</text>
    <text x="294" y="50" fill="#4169E1">pop 3 ↘</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 122 90 H 146" marker-end="url(#arrow)"/>
    <path d="M 122 130 H 146" marker-end="url(#arrow)"/>
    <path d="M 122 170 H 146" marker-end="url(#arrow)"/>
  </g>
  <text x="412" y="105" fill="#5c6b76" font-size="12">seeded: each row's</text>
  <text x="412" y="121" fill="#5c6b76" font-size="12">smallest pair (i, 0)</text>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 222 92 H 290" marker-end="url(#arrowB)"/>
    <path d="M 294 92 H 362" marker-end="url(#arrowB)"/>
  </g>
  <text x="320" y="230" text-anchor="middle" fill="#1a2026" font-size="13">Each pop emits the smallest frontier pair and pulls in only its right neighbour (i, j + 1):</text>
  <text x="320" y="250" text-anchor="middle" fill="#1a2026" font-size="13">3, then 5, then 7 — so k = 3 pops return exactly the first row, <tspan fill="#4169E1" font-weight="600">[[1,2],[1,4],[1,6]]</tspan>.</text>
</svg>
