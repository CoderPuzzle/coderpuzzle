<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- stream 1, 3, 7, 2, 6; one row per addNum; value v occupies the cell x = 170 + 44(v-1), w 44, h 26; accent bar = new/merged interval -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="192" y="48">1</text><text x="236" y="48">2</text><text x="280" y="48">3</text><text x="324" y="48">4</text><text x="368" y="48">5</text><text x="412" y="48">6</text><text x="456" y="48">7</text>
  </g>
  <g font-size="13" fill="#1a2026">
    <text x="40" y="78">addNum(1)</text>
    <text x="40" y="128">addNum(3)</text>
    <text x="40" y="178">addNum(7)</text>
    <text x="40" y="228">addNum(2)</text>
    <text x="40" y="278">addNum(6)</text>
  </g>
  <!-- row 1: [[1,1]] -->
  <line x1="192" y1="48" x2="192" y2="58" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="170" y="60" width="44" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="192" y="77" text-anchor="middle" font-size="12" fill="#1a2026">[1, 1]</text>
  <!-- row 2: [[1,1],[3,3]] -->
  <line x1="280" y1="98" x2="280" y2="108" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="170" y="110" width="44" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="192" y="127" text-anchor="middle" font-size="12" fill="#1a2026">[1, 1]</text>
  <rect x="258" y="110" width="44" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="280" y="127" text-anchor="middle" font-size="12" fill="#1a2026">[3, 3]</text>
  <!-- row 3: [[1,1],[3,3],[7,7]] -->
  <line x1="456" y1="148" x2="456" y2="158" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="170" y="160" width="44" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="192" y="177" text-anchor="middle" font-size="12" fill="#1a2026">[1, 1]</text>
  <rect x="258" y="160" width="44" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="280" y="177" text-anchor="middle" font-size="12" fill="#1a2026">[3, 3]</text>
  <rect x="434" y="160" width="44" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="456" y="177" text-anchor="middle" font-size="12" fill="#1a2026">[7, 7]</text>
  <!-- row 4: addNum(2) welds [1,1]+[3,3] into [1,3] -->
  <line x1="236" y1="198" x2="236" y2="208" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="170" y="210" width="132" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="236" y="227" text-anchor="middle" font-size="12" fill="#1a2026">[1, 3]</text>
  <rect x="434" y="210" width="44" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="456" y="227" text-anchor="middle" font-size="12" fill="#1a2026">[7, 7]</text>
  <text x="490" y="227" fill="#5c6b76" font-size="12">weld [1, 1] + [3, 3]</text>
  <!-- row 5: addNum(6) extends [7,7] to [6,7] -->
  <line x1="412" y1="248" x2="412" y2="258" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="170" y="260" width="132" height="26" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="236" y="277" text-anchor="middle" font-size="12" fill="#1a2026">[1, 3]</text>
  <rect x="390" y="260" width="88" height="26" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="434" y="277" text-anchor="middle" font-size="12" fill="#1a2026">[6, 7]</text>
  <text x="490" y="277" fill="#5c6b76" font-size="12">extend [7, 7] down</text>
  <text x="40" y="320" fill="#1a2026" font-size="13">addNum(2) welds the touching [1, 1] and [3, 3] into <tspan fill="#4169E1" font-weight="600">[1, 3]</tspan>; addNum(6) extends</text>
  <text x="40" y="338" fill="#1a2026" font-size="13">[7, 7] down to [6, 7] — the list stays sorted and disjoint after every add.</text>
</svg>
