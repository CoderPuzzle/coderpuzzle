<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 232" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="232" fill="#ffffff"/>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="130" y="24" fill="#4169E1" font-weight="600">root = 3</text>
    <text x="400" y="24" fill="#4169E1" font-weight="600">root = 4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <!-- rooted at 3: children 0, 1, 2, 4; node 4 has child 5 -->
    <line x1="117.5" y1="52.3" x2="52.5" y2="95.7"/>
    <line x1="122.4" y1="57" x2="112.6" y2="91"/>
    <line x1="134.7" y1="58.2" x2="145.3" y2="89.8"/>
    <line x1="141.7" y1="53.4" x2="193.3" y2="94.6"/>
    <line x1="205" y1="119" x2="205" y2="149"/>
    <!-- rooted at 4: children 3, 5; node 3 has children 0, 1, 2 -->
    <line x1="396.8" y1="51.2" x2="313.2" y2="96.8"/>
    <line x1="422.9" y1="51.7" x2="497.1" y2="96.3"/>
    <line x1="288" y1="113" x2="232" y2="155"/>
    <line x1="295.3" y1="118.2" x2="273.7" y2="149.8"/>
    <line x1="308.3" y1="116.5" x2="331.7" y2="151.5"/>
  </g>
  <!-- both centroids are MHT roots -->
  <circle cx="130" cy="44" r="15" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <circle cx="410" cy="44" r="15" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="130" y="49">3</text>
    <text x="410" y="49">4</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="40" cy="104" r="15"/><circle cx="95" cy="104" r="15"/><circle cx="150" cy="104" r="15"/><circle cx="205" cy="104" r="15"/>
    <circle cx="205" cy="164" r="15"/>
    <circle cx="300" cy="104" r="15"/><circle cx="510" cy="104" r="15"/>
    <circle cx="220" cy="164" r="15"/><circle cx="280" cy="164" r="15"/><circle cx="340" cy="164" r="15"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="40" y="109">0</text><text x="95" y="109">1</text><text x="150" y="109">2</text><text x="205" y="109">4</text>
    <text x="205" y="169">5</text>
    <text x="300" y="109">3</text><text x="510" y="109">5</text>
    <text x="220" y="169">0</text><text x="280" y="169">1</text><text x="340" y="169">2</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="130" y="200">h = 2</text>
    <text x="410" y="200">h = 2</text>
  </g>
  <text x="280" y="224" text-anchor="middle" fill="#5c6b76" font-size="12.5">the two centroids both give height 2, and every other root gives height 3 → output [3, 4]</text>
</svg>
