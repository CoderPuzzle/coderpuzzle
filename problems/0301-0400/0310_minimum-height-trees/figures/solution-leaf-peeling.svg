<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="304" y1="116" x2="163" y2="68"/>
    <line x1="302" y1="125" x2="116" y2="133"/>
    <line x1="308" y1="138" x2="204" y2="196"/>
    <line x1="338" y1="130" x2="450" y2="130"/>
    <line x1="488" y1="130" x2="576" y2="130"/>
  </g>
  <!-- round 1 leaves: dashed, faded -->
  <g>
    <circle cx="146" cy="62" r="18" fill="#ffffff" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="146" y="67" text-anchor="middle" fill="#5c6b76">0</text>
    <circle cx="98" cy="138" r="18" fill="#ffffff" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="98" y="143" text-anchor="middle" fill="#5c6b76">1</text>
    <circle cx="220" cy="208" r="18" fill="#ffffff" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="220" y="213" text-anchor="middle" fill="#5c6b76">2</text>
    <circle cx="594" cy="130" r="18" fill="#ffffff" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="594" y="135" text-anchor="middle" fill="#5c6b76">5</text>
  </g>
  <!-- round 2 survivors: accent -->
  <g>
    <circle cx="320" cy="130" r="20" fill="#4169E1"/>
    <text x="320" y="136" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
    <circle cx="470" cy="130" r="20" fill="#4169E1"/>
    <text x="470" y="136" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
  </g>
  <!-- annotations -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="96" y="26">degree-1 leaves</text>
    <text x="96" y="41" fill="#4169E1">peeled in round 1</text>
    <text x="556" y="96">leaf</text>
    <text x="272" y="176" fill="#1a2026" font-weight="600">round 2:</text>
    <text x="272" y="192" fill="#1a2026" font-weight="600">3 and 4 remain</text>
  </g>
  <g fill="#1a2026" font-size="13">
    <text x="40" y="248">Round 1 removes every degree-1 node (0, 1, 2, 5) at once;</text>
    <text x="40" y="265">degrees drop, and 3 and 4 become the final leaves — the two centroids.</text>
  </g>
</svg>
