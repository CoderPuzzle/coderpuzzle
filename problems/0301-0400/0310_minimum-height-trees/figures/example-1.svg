<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 232" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="570" height="232" fill="#ffffff"/>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="80" y="24">root = 0</text>
    <text x="220" y="24" fill="#4169E1" font-weight="600">root = 1</text>
    <text x="360" y="24">root = 2</text>
    <text x="500" y="24">root = 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6">
    <!-- rooted at 0: height 2 -->
    <line x1="80" y1="59" x2="80" y2="89"/>
    <line x1="73.3" y1="117.4" x2="56.7" y2="150.6"/>
    <line x1="86.7" y1="117.4" x2="103.3" y2="150.6"/>
    <!-- rooted at 1: height 1 -->
    <line x1="212.3" y1="56.5" x2="188.3" y2="91.5"/>
    <line x1="220" y1="59" x2="220" y2="89"/>
    <line x1="227.7" y1="56.5" x2="251.7" y2="91.5"/>
    <!-- rooted at 2: height 2 -->
    <line x1="360" y1="59" x2="360" y2="89"/>
    <line x1="353.3" y1="117.4" x2="336.7" y2="150.6"/>
    <line x1="366.7" y1="117.4" x2="383.3" y2="150.6"/>
    <!-- rooted at 3: height 2 -->
    <line x1="500" y1="59" x2="500" y2="89"/>
    <line x1="493.3" y1="117.4" x2="476.7" y2="150.6"/>
    <line x1="506.7" y1="117.4" x2="523.3" y2="150.6"/>
  </g>
  <!-- roots; node 1 is the unique MHT root -->
  <circle cx="80" cy="44" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="220" cy="44" r="15" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <circle cx="360" cy="44" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <circle cx="500" cy="44" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="80" y="49">0</text>
    <text x="220" y="49">1</text>
    <text x="360" y="49">2</text>
    <text x="500" y="49">3</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="80" cy="104" r="15"/>
    <circle cx="50" cy="164" r="15"/><circle cx="110" cy="164" r="15"/>
    <circle cx="180" cy="104" r="15"/><circle cx="220" cy="104" r="15"/><circle cx="260" cy="104" r="15"/>
    <circle cx="360" cy="104" r="15"/>
    <circle cx="330" cy="164" r="15"/><circle cx="390" cy="164" r="15"/>
    <circle cx="500" cy="104" r="15"/>
    <circle cx="470" cy="164" r="15"/><circle cx="530" cy="164" r="15"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="80" y="109">1</text>
    <text x="50" y="169">2</text><text x="110" y="169">3</text>
    <text x="180" y="109">0</text><text x="220" y="109">2</text><text x="260" y="109">3</text>
    <text x="360" y="109">1</text>
    <text x="330" y="169">0</text><text x="390" y="169">3</text>
    <text x="500" y="109">1</text>
    <text x="470" y="169">0</text><text x="530" y="169">2</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="80" y="200" fill="#5c6b76">h = 2</text>
    <text x="220" y="200" fill="#4169E1" font-weight="600">h = 1</text>
    <text x="360" y="200" fill="#5c6b76">h = 2</text>
    <text x="500" y="200" fill="#5c6b76">h = 2</text>
  </g>
  <text x="285" y="224" text-anchor="middle" fill="#5c6b76" font-size="12.5">the same tree rooted at each node; only root 1 achieves the minimum height</text>
</svg>
