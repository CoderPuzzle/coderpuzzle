<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 284" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="284" fill="#ffffff"/>
  <!-- nestedList = [1,[4,[6]]]; rows baseline y = 90/140/190; columns: level 50, frontier 88 (left), new 272, flat 366, total 474 (centers) -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="50" y="44">level</text>
    <text x="88" y="44" text-anchor="start">frontier</text>
    <text x="272" y="44">new ints</text>
    <text x="366" y="44">flat</text>
    <text x="474" y="44">total</text>
  </g>
  <line x1="30" y1="56" x2="530" y2="56" stroke="#dbe4fb" stroke-width="1.5"/>
  <!-- highlight the final level -->
  <rect x="24" y="166" width="512" height="40" rx="6" fill="#dbe4fb"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="13">
    <text x="50" y="90">1</text>
    <text x="50" y="140">2</text>
    <text x="50" y="190">3</text>
  </g>
  <g fill="#1a2026">
    <text x="88" y="90">[1, [4,[6]]]</text>
    <text x="88" y="140">[4, [6]]</text>
    <text x="88" y="190">[6]</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="15">
    <text x="272" y="90">1</text>
    <text x="272" y="140">4</text>
    <text x="272" y="190">6</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13.5">
    <text x="366" y="90">1</text>
    <text x="366" y="140">1 + 4 = <tspan font-weight="600">5</tspan></text>
    <text x="366" y="190">5 + 6 = <tspan font-weight="600">11</tspan></text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13.5">
    <text x="474" y="90">0 + 1 = 1</text>
    <text x="474" y="140">1 + 5 = 6</text>
    <text x="474" y="190">6 + 11 = <tspan fill="#4169E1" font-weight="600">17</tspan></text>
  </g>
  <text x="30" y="244" fill="#1a2026" font-size="13">Re-adding flat once per level counts 1 three times, 4 twice,</text>
  <text x="30" y="262" fill="#1a2026" font-size="13">6 once: 1×3 + 4×2 + 6×1 = <tspan fill="#4169E1" font-weight="600">17</tspan>, with no depth pre-pass.</text>
</svg>
