<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 284" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5">
  <rect width="560" height="284" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- five tickets over three airports; badges give the lexicographically smallest itinerary -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 253 189 Q 150 150 122 90" marker-end="url(#arrow)"/>
    <path d="M 132 86 Q 210 130 266 186" marker-end="url(#arrow)"/>
    <path d="M 307 189 Q 410 150 438 90" marker-end="url(#arrow)"/>
    <path d="M 428 52 Q 280 8 132 52" marker-end="url(#arrow)"/>
    <path d="M 130 74 Q 280 140 430 74" marker-end="url(#arrow)"/>
  </g>
  <g>
    <circle cx="169" cy="145" r="10.5" fill="#4169E1"/><text x="169" y="149.5" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">1</text>
    <circle cx="205" cy="133" r="10.5" fill="#4169E1"/><text x="205" y="137.5" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">2</text>
    <circle cx="391" cy="145" r="10.5" fill="#4169E1"/><text x="391" y="149.5" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">3</text>
    <circle cx="280" cy="30" r="10.5" fill="#4169E1"/><text x="280" y="34.5" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">4</text>
    <circle cx="280" cy="107" r="10.5" fill="#4169E1"/><text x="280" y="111.5" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">5</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="105" cy="64" r="25"/>
    <circle cx="455" cy="64" r="25"/>
    <circle cx="280" cy="208" r="25"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="105" y="69">ATL</text>
    <text x="455" y="69">SFO</text>
    <text x="280" y="213">JFK</text>
  </g>
  <text x="280" y="258" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="14">JFK → ATL → JFK → SFO → ATL → SFO</text>
  <text x="280" y="278" text-anchor="middle" fill="#5c6b76" font-size="12.5">each arrow is one ticket, used in numbered order</text>
</svg>
