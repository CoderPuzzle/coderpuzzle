<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 176" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5">
  <rect width="580" height="176" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- the four tickets form one path starting at JFK -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="94" y1="76" x2="148" y2="76" marker-end="url(#arrow)"/>
    <line x1="208" y1="76" x2="262" y2="76" marker-end="url(#arrow)"/>
    <line x1="322" y1="76" x2="376" y2="76" marker-end="url(#arrow)"/>
    <line x1="436" y1="76" x2="490" y2="76" marker-end="url(#arrow)"/>
  </g>
  <g>
    <circle cx="121" cy="54" r="10.5" fill="#4169E1"/><text x="121" y="58.5" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">1</text>
    <circle cx="235" cy="54" r="10.5" fill="#4169E1"/><text x="235" y="58.5" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">2</text>
    <circle cx="349" cy="54" r="10.5" fill="#4169E1"/><text x="349" y="58.5" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">3</text>
    <circle cx="463" cy="54" r="10.5" fill="#4169E1"/><text x="463" y="58.5" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">4</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="64" cy="76" r="24"/>
    <circle cx="178" cy="76" r="24"/>
    <circle cx="292" cy="76" r="24"/>
    <circle cx="406" cy="76" r="24"/>
    <circle cx="520" cy="76" r="24"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="64" y="81">JFK</text>
    <text x="178" y="81">MUC</text>
    <text x="292" y="81">LHR</text>
    <text x="406" y="81">SFO</text>
    <text x="520" y="81">SJC</text>
  </g>
  <text x="290" y="140" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="14">JFK → MUC → LHR → SFO → SJC</text>
  <text x="290" y="162" text-anchor="middle" fill="#5c6b76" font-size="12.5">each arrow is one ticket, used in numbered order</text>
</svg>
