<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="660" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <path d="M 128 138 Q 220 60 300 82" marker-end="url(#arrow)"/>
    <path d="M 296 100 Q 210 168 130 152" marker-end="url(#arrow)"/>
    <path d="M 366 82 Q 460 70 542 128" marker-end="url(#arrow)"/>
    <path d="M 540 148 Q 460 190 368 104" marker-end="url(#arrow)"/>
  </g>
  <!-- unused-until-last edge JFK -> SFO drawn below -->
  <path d="M 110 162 Q 330 268 552 158" stroke="#42525e" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <!-- edge order badges -->
  <g font-size="11.5" text-anchor="middle">
    <circle cx="212" cy="76" r="10" fill="#4169E1"/><text x="212" y="80" fill="#ffffff">1</text>
    <circle cx="212" cy="152" r="10" fill="#4169E1"/><text x="212" y="156" fill="#ffffff">2</text>
    <circle cx="345" cy="238" r="10" fill="#4169E1"/><text x="345" y="242" fill="#ffffff">3</text>
    <circle cx="462" cy="80" r="10" fill="#4169E1"/><text x="462" y="84" fill="#ffffff">4</text>
    <circle cx="462" cy="164" r="10" fill="#4169E1"/><text x="462" y="168" fill="#ffffff">5</text>
  </g>
  <!-- edge labels -->
  <g fill="#5c6b76" font-size="11.5">
    <text x="240" y="58">JFK→ATL</text>
    <text x="160" y="182">ATL→JFK</text>
    <text x="435" y="58">SFO→ATL</text>
    <text x="500" y="196">ATL→SFO</text>
    <text x="300" y="218">JFK→SFO (saved for last — taking it first strands ATL)</text>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="108" cy="150" r="26" fill="#4169E1"/>
    <text x="108" y="155" text-anchor="middle" fill="#ffffff" font-weight="600">JFK</text>
    <circle cx="330" cy="92" r="26" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="330" y="97" text-anchor="middle" fill="#1a2026" font-weight="600">ATL</text>
    <circle cx="560" cy="143" r="26" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="560" y="148" text-anchor="middle" fill="#1a2026" font-weight="600">SFO</text>
  </g>
  <g fill="#1a2026" font-size="13">
    <text x="40" y="30">Numbers show the order the depth-first walk consumes each ticket;</text>
    <text x="40" y="47">reversing the postorder airports gives JFK → ATL → JFK → SFO → ATL → SFO.</text>
  </g>
</svg>
