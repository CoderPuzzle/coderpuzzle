<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="17">
  <rect width="520" height="220" fill="#ffffff"/>
  <!-- the 2x2 rectangle covering columns 1..2 sums to 2, the max sum <= k -->
  <rect x="106" y="44" width="132" height="132" fill="#4169E1" fill-opacity="0.10"/>
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="40" y="44" width="66" height="66" fill="#ffffff"/><rect x="106" y="44" width="66" height="66" fill="#ffffff"/><rect x="172" y="44" width="66" height="66" fill="#ffffff"/>
    <rect x="40" y="110" width="66" height="66" fill="#ffffff"/><rect x="106" y="110" width="66" height="66" fill="#ffffff"/><rect x="172" y="110" width="66" height="66" fill="#ffffff"/>
  </g>
  <rect x="105" y="43" width="134" height="134" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="73" y="82">1</text><text x="139" y="82">0</text><text x="205" y="82">1</text>
    <text x="73" y="148">0</text><text x="139" y="148">-2</text><text x="205" y="148">3</text>
  </g>
  <g font-size="14">
    <text x="280" y="88" fill="#1a2026">shaded rectangle [[0, 1], [-2, 3]]:</text>
    <text x="280" y="114" fill="#4169E1" font-weight="600" font-size="16">0 + 1 + (-2) + 3 = 2</text>
    <text x="280" y="140" fill="#5c6b76">2 is the largest sum ≤ k = 2</text>
  </g>
</svg>
