<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="296" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- shuffle of nums = [1, 2, 3] via Fisher-Yates: i = 2 draws j = 1 from [0, 2] (swap slots 2,1
       -> [1, 3, 2], slot 2 fixed), i = 1 draws j = 0 from [0, 1] (swap slots 1,0 -> [3, 1, 2]).
       Cells 50x44 at y = 120; array x starts 40 / 270 / 500 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="40" y="120" width="50" height="44" fill="#ffffff"/><rect x="90" y="120" width="50" height="44" fill="#ffffff"/><rect x="140" y="120" width="50" height="44" fill="#ffffff"/>
    <rect x="270" y="120" width="50" height="44" fill="#ffffff"/><rect x="320" y="120" width="50" height="44" fill="#ffffff"/><rect x="370" y="120" width="50" height="44" fill="#dbe4fb"/>
    <rect x="500" y="120" width="50" height="44" fill="#ffffff"/><rect x="550" y="120" width="50" height="44" fill="#dbe4fb"/><rect x="600" y="120" width="50" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600">
    <text x="65" y="147" fill="#1a2026">1</text><text x="115" y="147" fill="#1a2026">2</text><text x="165" y="147" fill="#1a2026">3</text>
    <text x="295" y="147" fill="#1a2026">1</text><text x="345" y="147" fill="#1a2026">3</text><text x="395" y="147" fill="#4169E1">2</text>
    <text x="525" y="147" fill="#1a2026">3</text><text x="575" y="147" fill="#4169E1">1</text><text x="625" y="147" fill="#1a2026">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="65" y="182">0</text><text x="115" y="182">1</text><text x="165" y="182">2</text>
    <text x="295" y="182">0</text><text x="345" y="182">1</text><text x="395" y="182">2</text>
    <text x="525" y="182">0</text><text x="575" y="182">1</text><text x="625" y="182">2</text>
  </g>
  <!-- swap arcs above each source array, j-range brackets below it -->
  <path d="M 115 114 Q 140 84 165 114" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="140" y="76" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">i = 2: j = 1</text>
  <path d="M 295 114 Q 320 84 345 114" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="320" y="76" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">i = 1: j = 0</text>
  <path d="M 40 192 L 40 197 L 190 197 L 190 192" fill="none" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="115" y="213" text-anchor="middle" fill="#5c6b76" font-size="12">j ∈ [0, 2]</text>
  <path d="M 270 192 L 270 197 L 370 197 L 370 192" fill="none" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="320" y="213" text-anchor="middle" fill="#5c6b76" font-size="12">j ∈ [0, 1]</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="395" y="213">fixed</text>
    <text x="575" y="213">fixed</text>
    <text x="625" y="213">fixed</text>
  </g>
  <path d="M 198 142 L 262 142" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 428 142 L 492 142" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="250" fill="#1a2026" font-size="13">With draws j = 1 then j = 0 the shuffle yields [3, 1, 2] — one of the 3! = 6</text>
  <text x="40" y="268" fill="#1a2026" font-size="13">equally likely orderings, each reachable through exactly one choice sequence.</text>
</svg>
