<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="286" fill="#ffffff"/>
  <!-- nums = [1,3,5]; tree[1] = nums[1..1] = 1, tree[2] = nums[1..2] = 4, tree[3] = nums[3..3] = 5 -->
  <!-- prefix(3) = tree[3] + tree[2] = 5 + 4 = 9 (i: 3 -&gt; 2 -&gt; 0); cells 64x36 at (150,50) and (150,140) -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="182" y="44">1</text><text x="246" y="44">2</text><text x="310" y="44">3</text>
  </g>
  <text x="136" y="73" text-anchor="end" fill="#5c6b76" font-size="13">nums</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="150" y="50" width="64" height="36"/><rect x="214" y="50" width="64" height="36"/><rect x="278" y="50" width="64" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="182" y="73">1</text><text x="246" y="73">3</text><text x="310" y="73">5</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1" fill="none">
    <line x1="182" y1="86" x2="182" y2="140"/>
    <line x1="246" y1="86" x2="246" y2="140"/>
    <line x1="182" y1="86" x2="246" y2="140"/>
    <line x1="310" y1="86" x2="310" y2="140"/>
  </g>
  <text x="136" y="163" text-anchor="end" fill="#5c6b76" font-size="13">tree</text>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="150" y="140" width="64" height="36" fill="#ffffff"/><rect x="214" y="140" width="64" height="36" fill="#4169E1"/><rect x="278" y="140" width="64" height="36" fill="#4169E1"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="182" y="163" fill="#5c6b76">1</text><text x="246" y="163" fill="#ffffff">4</text><text x="310" y="163" fill="#ffffff">5</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="182" y="192">i = 1</text><text x="246" y="192">i = 2</text><text x="310" y="192">i = 3</text>
    <text x="182" y="208">nums[1..1]</text>
    <text x="246" y="208" fill="#4169E1" font-weight="600">nums[1..2]</text>
    <text x="310" y="208" fill="#4169E1" font-weight="600">nums[3..3]</text>
  </g>
  <g font-size="12.5">
    <text x="400" y="66" font-weight="600" font-size="14.5" fill="#1a2026">prefix(3)</text>
    <text x="400" y="94" fill="#1a2026">i = 3: take tree[3] = 5</text>
    <text x="400" y="116" fill="#9aa7b2">i -= 1, so i = 2</text>
    <text x="400" y="144" fill="#1a2026">i = 2: take tree[2] = 4</text>
    <text x="400" y="166" fill="#9aa7b2">i -= 2, so i = 0, stop</text>
    <text x="400" y="196" font-weight="600" font-size="15" fill="#1a2026">5 + 4 = <tspan fill="#4169E1">9</tspan></text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="320" y="244">Each tree[i] stores the block of length i &amp; -i ending at i: tree[2] holds nums[1..2] = 4,</text>
    <text x="320" y="262">so prefix(3) gathers two disjoint blocks, 5 + 4 = <tspan fill="#4169E1" font-weight="600">9</tspan>, as i walks 3 -&gt; 2 -&gt; 0.</text>
  </g>
</svg>
