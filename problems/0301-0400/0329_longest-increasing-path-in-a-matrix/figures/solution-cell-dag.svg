<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="240" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <text x="130" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">matrix</text>
  <text x="420" y="34" text-anchor="middle" fill="#5c6b76" font-size="12.5">dp — path length starting at the cell</text>
  <!-- left grid: values -->
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <rect x="70" y="50" width="60" height="60"/>
    <rect x="130" y="50" width="60" height="60"/>
    <rect x="190" y="50" width="60" height="60"/>
    <rect x="70" y="110" width="60" height="60"/>
    <rect x="130" y="110" width="60" height="60"/>
    <rect x="190" y="110" width="60" height="60"/>
    <rect x="70" y="170" width="60" height="60"/>
    <rect x="130" y="170" width="60" height="60"/>
    <rect x="190" y="170" width="60" height="60"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="100" y="85">9</text><text x="160" y="85">9</text><text x="220" y="85">4</text>
    <text x="100" y="145">6</text><text x="160" y="145">6</text><text x="220" y="145">8</text>
    <text x="100" y="205">2</text><text x="160" y="205">1</text><text x="220" y="205">1</text>
  </g>
  <!-- right grid: dp with path highlighted (2,1) (2,0) (1,0) (0,0) -->
  <g fill="#4169E1">
    <rect x="360" y="50" width="60" height="60"/>
    <rect x="360" y="110" width="60" height="60"/>
    <rect x="360" y="170" width="60" height="60"/>
    <rect x="420" y="170" width="60" height="60"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <rect x="360" y="50" width="60" height="60"/>
    <rect x="420" y="50" width="60" height="60"/>
    <rect x="480" y="50" width="60" height="60"/>
    <rect x="360" y="110" width="60" height="60"/>
    <rect x="420" y="110" width="60" height="60"/>
    <rect x="480" y="110" width="60" height="60"/>
    <rect x="360" y="170" width="60" height="60"/>
    <rect x="420" y="170" width="60" height="60"/>
    <rect x="480" y="170" width="60" height="60"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="450" y="85">3</text><text x="510" y="85">1</text>
    <text x="450" y="145">2</text><text x="510" y="145">3</text>
    <text x="510" y="205">1</text>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-weight="600">
    <text x="390" y="85">4</text>
    <text x="390" y="145">3</text>
    <text x="390" y="205">2</text>
    <text x="450" y="205">1</text>
  </g>
  <!-- path arrows along the accent cells -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="448" y1="200" x2="416" y2="200" marker-end="url(#arrow)"/>
    <line x1="390" y1="168" x2="390" y2="138" marker-end="url(#arrow)"/>
    <line x1="390" y1="108" x2="390" y2="78" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="40" y="245">Cells are visited in ascending value order, so every smaller</text>
    <text x="40" y="261" fill="#1a2026">neighbor is final. Accent cells trace 1 → 2 → 6 → 9: dp grows 1, 2, 3, 4.</text>
  </g>
</svg>
