<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="396" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- root = [3,9,20,null,null,15,7]; columns -1..2 at x = 215/320/425/530; nodes r=17 rows y=80/145/210; column boxes 96x50 at y=262 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="215" y="32">col -1</text><text x="320" y="32">col 0</text>
    <text x="425" y="32">col +1</text><text x="530" y="32">col +2</text>
  </g>
  <g stroke="#dbe4fb" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="215" y1="40" x2="215" y2="246"/><line x1="320" y1="40" x2="320" y2="246"/>
    <line x1="425" y1="40" x2="425" y2="246"/><line x1="530" y1="40" x2="530" y2="246"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="320" y1="80" x2="215" y2="145"/><line x1="320" y1="80" x2="425" y2="145"/>
    <line x1="425" y1="145" x2="320" y2="210"/><line x1="425" y1="145" x2="530" y2="210"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="320" cy="80" r="17"/><circle cx="215" cy="145" r="17"/>
    <circle cx="425" cy="145" r="17"/><circle cx="320" cy="210" r="17"/>
    <circle cx="530" cy="210" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="320" y="85">3</text><text x="215" y="150">9</text><text x="425" y="150">20</text>
    <text x="320" y="215">15</text><text x="530" y="215">7</text>
  </g>
  <g stroke="#4169E1" stroke-width="1" fill="#4169E1">
    <circle cx="342" cy="62" r="8.5"/><circle cx="193" cy="129" r="8.5"/>
    <circle cx="447" cy="127" r="8.5"/><circle cx="298" cy="192" r="8.5"/>
    <circle cx="552" cy="194" r="8.5"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">
    <text x="342" y="65.5">1</text><text x="193" y="132.5">2</text><text x="447" y="130.5">3</text>
    <text x="298" y="195.5">4</text><text x="552" y="197.5">5</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="215" y="254">col -1</text><text x="320" y="254">col 0</text>
    <text x="425" y="254">col +1</text><text x="530" y="254">col +2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="167" y="262" width="96" height="50"/><rect x="377" y="262" width="96" height="50"/>
    <rect x="482" y="262" width="96" height="50"/>
  </g>
  <rect x="272" y="262" width="96" height="50" stroke="#4169E1" stroke-width="2" fill="#dbe4fb"/>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="215" y="292">9</text><text x="320" y="292">3, 15</text>
    <text x="425" y="292">20</text><text x="530" y="292">7</text>
  </g>
  <text x="320" y="348" text-anchor="middle" fill="#1a2026" font-size="13">Dequeued in badge order — 3, 9, 20, 15, 7 — each value appends to its</text>
  <text x="320" y="368" text-anchor="middle" fill="#1a2026" font-size="13">column's list: <tspan fill="#4169E1" font-weight="600">[[9], [3, 15], [20], [7]]</tspan>; ties in a column keep queue order.</text>
</svg>
