<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 254" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="254" fill="#ffffff"/>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="266.7" y1="50.6" x2="203.3" y2="101.4"/>
    <line x1="293.3" y1="50.6" x2="356.7" y2="101.4"/>
    <line x1="182.4" y1="127.2" x2="157.6" y2="176.8"/>
    <line x1="197.6" y1="127.2" x2="222.4" y2="176.8"/>
    <line x1="370" y1="129" x2="370" y2="175"/>
  </g>
  <!-- robbed houses: 4 and 5 on the middle level -->
  <circle cx="190" cy="112" r="17" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <circle cx="370" cy="112" r="17" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="280" cy="40" r="17"/>
