    <circle cx="230" cy="192" r="17"/>
    <circle cx="370" cy="192" r="17"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="280" y="45">3</text>
    <text x="190" y="117">4</text>
    <text x="370" y="117">5</text>
    <text x="150" y="197">1</text>
    <text x="230" y="197">3</text>
    <text x="370" y="197">1</text>
  </g>
  <text x="280" y="236" text-anchor="middle" fill="#4169E1" font-weight="600">robbed: 4 + 5 = 9</text>
  <text x="280" y="252" text-anchor="middle" fill="#5c6b76" font-size="12.5">robbing the root 3 would forbid both of its children</text>
</svg>
