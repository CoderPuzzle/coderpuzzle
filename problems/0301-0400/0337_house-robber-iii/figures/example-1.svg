<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 254" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="254" fill="#ffffff"/>
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="266.2" y1="49.9" x2="193.8" y2="102.1"/>
    <line x1="293.8" y1="49.9" x2="366.2" y2="102.1"/>
    <line x1="180" y1="129" x2="180" y2="175"/>
    <line x1="380" y1="129" x2="380" y2="175"/>
  </g>
  <!-- robbed houses: the root 3, the left leaf 3 and the right leaf 1 -->
  <circle cx="280" cy="40" r="17" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <circle cx="180" cy="192" r="17" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <circle cx="380" cy="192" r="17" fill="#4169E1" fill-opacity="0.18" stroke="#4169E1" stroke-width="2"/>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="180" cy="112" r="17"/>
    <circle cx="380" cy="112" r="17"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="280" y="45">3</text>
    <text x="180" y="117">2</text>
    <text x="380" y="117">3</text>
    <text x="180" y="197">3</text>
    <text x="380" y="197">1</text>
  </g>
  <text x="280" y="236" text-anchor="middle" fill="#4169E1" font-weight="600">robbed: 3 + 3 + 1 = 7</text>
  <text x="280" y="252" text-anchor="middle" fill="#5c6b76" font-size="12.5">no two robbed houses are directly linked</text>
</svg>
