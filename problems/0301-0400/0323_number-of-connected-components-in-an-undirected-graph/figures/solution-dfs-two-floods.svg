<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="344" fill="#ffffff"/>
  <!-- n=5, edges=[[0,1],[1,2],[3,4]]; left panel: the sweep finds 0 unvisited and
       floods {0,1,2} (pop order under the nodes); right panel: 1 and 2 are already
       visited, the sweep finds 3 and floods {3,4}; count settles at 2 -->
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#1a2026">
    <text x="180" y="40">sweep i = 0: <tspan fill="#4169E1">count = 1</tspan></text>
    <text x="520" y="40">sweep i = 3: <tspan fill="#4169E1">count = 2</tspan></text>
  </g>
  <text x="340" y="64" text-anchor="middle" fill="#5c6b76" font-size="12">shaded = visited · plain = unvisited</text>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="120" y1="110" x2="160" y2="110"/>
    <line x1="200" y1="110" x2="240" y2="110"/>
    <line x1="160" y1="210" x2="200" y2="210"/>
    <line x1="460" y1="110" x2="500" y2="110"/>
    <line x1="540" y1="110" x2="580" y2="110"/>
    <line x1="500" y1="210" x2="540" y2="210"/>
  </g>
  <!-- left panel: 0,1,2 flooded; 3,4 untouched -->
  <g>
    <circle cx="100" cy="110" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="180" cy="110" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="260" cy="110" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="140" cy="210" r="20" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
    <circle cx="220" cy="210" r="20" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle">
    <text x="100" y="115" fill="#1a2026" font-weight="600">0</text>
    <text x="180" y="115" fill="#1a2026" font-weight="600">1</text>
    <text x="260" y="115" fill="#1a2026" font-weight="600">2</text>
    <text x="140" y="215" fill="#9aa7b2">3</text>
    <text x="220" y="215" fill="#9aa7b2">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="100" y="148">pop 1st</text>
    <text x="180" y="148">pop 2nd</text>
    <text x="260" y="148">pop 3rd</text>
  </g>
  <text x="180" y="284" text-anchor="middle" fill="#5c6b76" font-size="12.5">stack: [0] → [1] → [2] → [ ]</text>
  <!-- right panel: 0,1,2 already claimed; 3,4 flooded -->
  <g>
    <circle cx="440" cy="110" r="20" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <circle cx="520" cy="110" r="20" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <circle cx="600" cy="110" r="20" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
    <circle cx="480" cy="210" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <circle cx="560" cy="210" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle">
    <text x="440" y="115" fill="#9aa7b2">0</text>
    <text x="520" y="115" fill="#9aa7b2">1</text>
    <text x="600" y="115" fill="#9aa7b2">2</text>
    <text x="480" y="215" fill="#1a2026" font-weight="600">3</text>
    <text x="560" y="215" fill="#1a2026" font-weight="600">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="480" y="250">pop 1st</text>
    <text x="560" y="250">pop 2nd</text>
  </g>
  <text x="520" y="284" text-anchor="middle" fill="#5c6b76" font-size="12.5">stack: [3] → [4] → [ ]</text>
  <text x="40" y="312" fill="#1a2026" font-size="13">Each unvisited node launches one flood: 0 claims {0, 1, 2}, then 3 claims {3, 4} —</text>
  <text x="40" y="330" fill="#1a2026" font-size="13">the count settles at <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
