<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 168" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="570" height="168" fill="#ffffff"/>
  <!-- component groupings -->
  <g fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4">
    <rect x="62" y="56" width="236" height="62" rx="31"/>
    <rect x="362" y="56" width="136" height="62" rx="31"/>
  </g>
  <g fill="#4169E1" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="180" y="44">component 1</text>
    <text x="430" y="44">component 2</text>
  </g>
  <!-- undirected edges 0-1, 1-2 and 3-4 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="108" y1="87" x2="162" y2="87"/>
    <line x1="198" y1="87" x2="252" y2="87"/>
    <line x1="408" y1="87" x2="462" y2="87"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="90" cy="87" r="18"/><circle cx="180" cy="87" r="18"/><circle cx="270" cy="87" r="18"/>
    <circle cx="390" cy="87" r="18"/><circle cx="480" cy="87" r="18"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="90" y="92">0</text><text x="180" y="92">1</text><text x="270" y="92">2</text>
    <text x="390" y="92">3</text><text x="480" y="92">4</text>
  </g>
  <text x="285" y="152" text-anchor="middle" fill="#5c6b76" font-size="12.5">edges [0,1], [1,2], [3,4] form two components → output 2</text>
</svg>
