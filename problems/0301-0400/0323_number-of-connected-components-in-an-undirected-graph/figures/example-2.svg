<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 216" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="570" height="216" fill="#ffffff"/>
  <!-- one component containing all five nodes -->
  <rect x="80" y="26" width="450" height="158" rx="40" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="305" y="18" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">one component</text>
  <!-- undirected edges 0-1, 1-2, 2-3, 3-4 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="232.4" y1="76.2" x2="127.6" y2="53.8"/>
    <line x1="240.5" y1="95.3" x2="209.5" y2="144.7"/>
    <line x1="216.7" y1="153.3" x2="383.3" y2="86.7"/>
    <line x1="415.4" y1="89.3" x2="484.6" y2="130.7"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="110" cy="50" r="18"/>
    <circle cx="250" cy="80" r="18"/>
    <circle cx="200" cy="160" r="18"/>
    <circle cx="400" cy="80" r="18"/>
    <circle cx="500" cy="140" r="18"/>
  </g>
  <g fill="#1a2026" font-weight="600" text-anchor="middle">
    <text x="110" y="55">0</text>
    <text x="250" y="85">1</text>
    <text x="200" y="165">2</text>
    <text x="400" y="85">3</text>
    <text x="500" y="145">4</text>
  </g>
  <text x="285" y="206" text-anchor="middle" fill="#5c6b76" font-size="12.5">edges [0,1], [1,2], [2,3], [3,4] chain all five nodes together → output 1</text>
</svg>
