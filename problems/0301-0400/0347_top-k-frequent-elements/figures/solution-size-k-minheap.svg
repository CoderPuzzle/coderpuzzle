<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [1,1,1,2,2,3], k = 2; pairs are (value, count); item boxes at x=70 w=115, heap cells at x=410 and x=516 w=98; rows y=50,130,210 -->
  <text x="127" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">stream (value, count)</text>
  <text x="512" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">min-heap, root = weakest keeper</text>

  <!-- step 1: push (1,3) -->
  <rect x="70" y="50" width="115" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="127" y="75" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">(1, 3)</text>
  <line x1="190" y1="70" x2="402" y2="70" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="295" y="62" text-anchor="middle" fill="#5c6b76" font-size="12">push: size 0 &lt; 2</text>
  <rect x="410" y="50" width="98" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="459" y="75" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">(1, 3)</text>
  <rect x="516" y="50" width="98" height="40" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- step 2: push (2,2) -->
  <rect x="70" y="130" width="115" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="127" y="155" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">(2, 2)</text>
  <line x1="190" y1="150" x2="402" y2="150" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="295" y="142" text-anchor="middle" fill="#5c6b76" font-size="12">push: size 1 &lt; 2</text>
  <rect x="410" y="130" width="98" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="459" y="155" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">(2, 2)</text>
  <rect x="516" y="130" width="98" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="565" y="155" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">(1, 3)</text>

  <!-- step 3: (3,1) rejected -->
  <rect x="70" y="210" width="115" height="40" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="127" y="235" text-anchor="middle" font-weight="600" font-size="15" fill="#5c6b76">(3, 1)</text>
  <line x1="190" y1="230" x2="402" y2="230" stroke="#9aa7b2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowmuted)"/>
  <text x="285" y="222" text-anchor="middle" fill="#5c6b76" font-size="12">size 2 = k, count 1 &lt; 2 — no evict</text>
  <rect x="410" y="210" width="98" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="459" y="235" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">(2, 2)</text>
  <rect x="516" y="210" width="98" height="40" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="565" y="235" text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">(1, 3)</text>

  <text x="40" y="278" fill="#1a2026" font-size="13">Survivors (1, 3) and (2, 2) are the two most frequent: (3, 1)'s count 1</text>
  <text x="40" y="296" fill="#1a2026" font-size="13">loses to the root's count 2, so the top-2 answer is <tspan fill="#4169E1" font-weight="600">[1, 2]</tspan>.</text>
</svg>
