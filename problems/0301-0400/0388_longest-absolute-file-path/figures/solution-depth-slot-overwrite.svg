<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="356" fill="#ffffff"/>
  <!-- input = "dir\n\tsubdir1\n\t\tfile1.ext\n\t\tsubsubdir1\n\tsubdir2\n\t\tsubsubdir2\n\t\t\tfile2.ext" (example 2); slot d holds the latest path length at depth d; cells 46x24 at x = 210 + 52j, rows 32px from y=72; the written cell of each row is accented -->
  <g fill="#5c6b76" font-size="11.5">
    <text x="20" y="60">line</text>
    <text x="233" y="60" text-anchor="middle">slot 0</text>
    <text x="285" y="60" text-anchor="middle">slot 1</text>
    <text x="337" y="60" text-anchor="middle">slot 2</text>
    <text x="389" y="60" text-anchor="middle">slot 3</text>
    <text x="463" y="60" text-anchor="middle">max</text>
  </g>
  <!-- row 1: dir -->
  <text x="20" y="93" fill="#1a2026" font-size="12.5">dir</text>
  <rect x="210" y="76" width="46" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="262" y="76" width="46" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <rect x="314" y="76" width="46" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <rect x="366" y="76" width="46" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <rect x="436" y="76" width="54" height="24" fill="#ffffff" stroke="#42525e"/>
  <text x="233" y="92" text-anchor="middle" font-size="12.5" font-weight="600">3</text>
  <text x="285" y="92" text-anchor="middle" fill="#9aa7b2" font-size="12.5">·</text>
  <text x="337" y="92" text-anchor="middle" fill="#9aa7b2" font-size="12.5">·</text>
  <text x="389" y="92" text-anchor="middle" fill="#9aa7b2" font-size="12.5">·</text>
  <text x="463" y="92" text-anchor="middle" fill="#5c6b76" font-size="12.5">0</text>
  <text x="506" y="92" fill="#5c6b76" font-size="11.5">slot 0 = 3 (no separator)</text>
  <!-- row 2: subdir1 -->
  <text x="36" y="125" fill="#1a2026" font-size="12.5">subdir1</text>
  <rect x="210" y="108" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="262" y="108" width="46" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="314" y="108" width="46" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <rect x="366" y="108" width="46" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <rect x="436" y="108" width="54" height="24" fill="#ffffff" stroke="#42525e"/>
  <text x="233" y="124" text-anchor="middle" font-size="12.5">3</text>
  <text x="285" y="124" text-anchor="middle" font-size="12.5" font-weight="600">11</text>
  <text x="337" y="124" text-anchor="middle" fill="#9aa7b2" font-size="12.5">·</text>
  <text x="389" y="124" text-anchor="middle" fill="#9aa7b2" font-size="12.5">·</text>
  <text x="463" y="124" text-anchor="middle" fill="#5c6b76" font-size="12.5">0</text>
  <text x="506" y="124" fill="#5c6b76" font-size="11.5">slot 1 = 3 + 1 + 7</text>
  <!-- row 3: file1.ext -->
  <text x="52" y="157" fill="#1a2026" font-size="12.5" font-weight="600">file1.ext</text>
  <rect x="210" y="140" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="262" y="140" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="314" y="140" width="46" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="366" y="140" width="46" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <rect x="436" y="140" width="54" height="24" fill="#ffffff" stroke="#42525e"/>
  <text x="233" y="156" text-anchor="middle" font-size="12.5">3</text>
  <text x="285" y="156" text-anchor="middle" font-size="12.5">11</text>
  <text x="337" y="156" text-anchor="middle" font-size="12.5" font-weight="600">21</text>
  <text x="389" y="156" text-anchor="middle" fill="#9aa7b2" font-size="12.5">·</text>
  <text x="463" y="156" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">21</text>
  <text x="506" y="156" fill="#5c6b76" font-size="11.5">11 + 1 + 9 — file: max 21</text>
  <!-- row 4: subsubdir1 -->
  <text x="52" y="189" fill="#1a2026" font-size="12.5">subsubdir1</text>
  <rect x="210" y="172" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="262" y="172" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="314" y="172" width="46" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="366" y="172" width="46" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <rect x="436" y="172" width="54" height="24" fill="#ffffff" stroke="#42525e"/>
  <text x="233" y="188" text-anchor="middle" font-size="12.5">3</text>
  <text x="285" y="188" text-anchor="middle" font-size="12.5">11</text>
  <text x="337" y="188" text-anchor="middle" font-size="12.5" font-weight="600">22</text>
  <text x="389" y="188" text-anchor="middle" fill="#9aa7b2" font-size="12.5">·</text>
  <text x="463" y="188" text-anchor="middle" font-size="12.5">21</text>
  <text x="506" y="188" fill="#5c6b76" font-size="11.5">11 + 1 + 10 overwrites 21</text>
  <!-- row 5: subdir2 -->
  <text x="36" y="221" fill="#1a2026" font-size="12.5">subdir2</text>
  <rect x="210" y="204" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="262" y="204" width="46" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="314" y="204" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="366" y="204" width="46" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <rect x="436" y="204" width="54" height="24" fill="#ffffff" stroke="#42525e"/>
  <text x="233" y="220" text-anchor="middle" font-size="12.5">3</text>
  <text x="285" y="220" text-anchor="middle" font-size="12.5" font-weight="600">11</text>
  <text x="337" y="220" text-anchor="middle" font-size="12.5">22</text>
  <text x="389" y="220" text-anchor="middle" fill="#9aa7b2" font-size="12.5">·</text>
  <text x="463" y="220" text-anchor="middle" font-size="12.5">21</text>
  <text x="506" y="220" fill="#5c6b76" font-size="11.5">3 + 1 + 7 overwrites 11</text>
  <!-- row 6: subsubdir2 -->
  <text x="52" y="253" fill="#1a2026" font-size="12.5">subsubdir2</text>
  <rect x="210" y="236" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="262" y="236" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="314" y="236" width="46" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="366" y="236" width="46" height="24" fill="#f0f3f7" stroke="#9aa7b2"/>
  <rect x="436" y="236" width="54" height="24" fill="#ffffff" stroke="#42525e"/>
  <text x="233" y="252" text-anchor="middle" font-size="12.5">3</text>
  <text x="285" y="252" text-anchor="middle" font-size="12.5">11</text>
  <text x="337" y="252" text-anchor="middle" font-size="12.5" font-weight="600">22</text>
  <text x="389" y="252" text-anchor="middle" fill="#9aa7b2" font-size="12.5">·</text>
  <text x="463" y="252" text-anchor="middle" font-size="12.5">21</text>
  <text x="506" y="252" fill="#5c6b76" font-size="11.5">11 + 1 + 10 overwrites 22</text>
  <!-- row 7: file2.ext -->
  <text x="68" y="285" fill="#1a2026" font-size="12.5" font-weight="600">file2.ext</text>
  <rect x="210" y="268" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="262" y="268" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="314" y="268" width="46" height="24" fill="#ffffff" stroke="#42525e"/>
  <rect x="366" y="268" width="46" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <rect x="436" y="268" width="54" height="24" fill="#ffffff" stroke="#42525e"/>
  <text x="233" y="284" text-anchor="middle" font-size="12.5">3</text>
  <text x="285" y="284" text-anchor="middle" font-size="12.5">11</text>
  <text x="337" y="284" text-anchor="middle" font-size="12.5">22</text>
  <text x="389" y="284" text-anchor="middle" font-size="12.5" font-weight="600">32</text>
  <text x="463" y="284" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">32</text>
  <text x="506" y="284" fill="#5c6b76" font-size="11.5">22 + 1 + 9 — file: max 32</text>
  <text x="340" y="322" text-anchor="middle" fill="#1a2026" font-size="13">Each depth keeps one slot; same-depth siblings overwrite it (11 → 11, 22 → 22 here),</text>
  <text x="340" y="340" text-anchor="middle" fill="#1a2026" font-size="13">and dotted names update the max: 21 at file1.ext, then 22 + 1 + 9 = <tspan fill="#4169E1" font-weight="600">32</tspan> at file2.ext.</text>
</svg>
