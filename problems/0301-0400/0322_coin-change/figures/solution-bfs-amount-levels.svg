<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="384" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- coins=[1,2,5], amount=11; BFS columns are levels, x=70/235/420/590, r=17;
       levels {0} | {1,2,5} | {3,4,6,7,10} | {8,9,11}; only discovery edges drawn -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="70" y="24">level 0</text>
    <text x="235" y="24">level 1</text>
    <text x="420" y="24">level 2</text>
    <text x="590" y="24">level 3</text>
  </g>
  <!-- discovery edges -->
  <g stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="84.8" y1="169.7" x2="220.2" y2="94.3"/>
    <line x1="87" y1="178" x2="218" y2="178"/>
    <line x1="84.8" y1="186.3" x2="220.2" y2="261.7"/>
    <line x1="251.7" y1="82.8" x2="403.3" y2="53.2"/>
    <line x1="250.2" y1="93.6" x2="404.8" y2="170.4"/>
    <line x1="251.1" y1="172.4" x2="403.9" y2="119.6"/>
    <line x1="251.1" y1="183.6" x2="403.9" y2="240.4"/>
    <line x1="251.7" y1="273.2" x2="403.3" y2="302.8"/>
    <line x1="436.6" y1="53.5" x2="573.4" y2="82.5"/>
    <line x1="435.9" y1="120" x2="574.1" y2="172"/>
  </g>
  <line x1="434.9" y1="186.1" x2="575.1" y2="261.9" stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrow)"/>
  <!-- coin-step labels -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="150" y="120">+1</text>
    <text x="152" y="168">+2</text>
    <text x="150" y="246">+5</text>
  </g>
  <text x="500" y="210" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">+5</text>
  <!-- level 0-2 amounts -->
  <g>
    <circle cx="70" cy="178" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="235" cy="86" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="235" cy="178" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="235" cy="270" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="420" cy="50" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="420" cy="114" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="420" cy="178" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="420" cy="242" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="420" cy="306" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="590" cy="86" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
    <circle cx="590" cy="178" r="17" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="70" y="183">0</text>
    <text x="235" y="91">1</text>
    <text x="235" y="183">2</text>
    <text x="235" y="275">5</text>
    <text x="420" y="55">3</text>
    <text x="420" y="119">4</text>
    <text x="420" y="183">6</text>
    <text x="420" y="247">7</text>
    <text x="420" y="311">10</text>
    <text x="590" y="91">8</text>
    <text x="590" y="183">9</text>
  </g>
  <!-- the target -->
  <circle cx="590" cy="270" r="17" fill="#4169E1"/>
  <text x="590" y="275" text-anchor="middle" fill="#ffffff" font-weight="600">11</text>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="590" y="222">11 first dequeued</text>
    <text x="590" y="236">here: answer 3</text>
  </g>
  <text x="40" y="352" fill="#1a2026" font-size="13">Each BFS level is one more coin: 0 | 1, 2, 5 | 3, 4, 6, 7, 10 | 8, 9, 11.</text>
  <text x="40" y="370" fill="#1a2026" font-size="13">11 first comes off the queue at level 3, so the minimum is <tspan fill="#4169E1" font-weight="600">3 coins</tspan> (1 + 5 + 5).</text>
</svg>
