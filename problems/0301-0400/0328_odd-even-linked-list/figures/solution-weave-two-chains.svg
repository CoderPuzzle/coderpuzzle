<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="384" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- head=[1,2,3,4,5]; pass 1 relinks 1->3 and 2->4, pass 2 relinks 3->5 and 4->null;
       odd chain 1-3-5 (accent nodes), even chain 2-4 (light nodes); dashed ring =
       the even head 2 remembered before the walk; accent arc = the final splice
       odd.next = evenHead; result row 1-3-5-2-4, r=20/16 -->
  <text x="40" y="44" fill="#5c6b76" font-size="12.5">Pass 1 relinks 1→3 and 2→4; pass 2 relinks 3→5 and leaves 4 with no next.</text>
  <text x="60" y="125" fill="#5c6b76" font-size="12.5">odd</text>
  <text x="60" y="230" fill="#5c6b76" font-size="12.5">even</text>
  <!-- chain links -->
  <g stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="162" y1="120" x2="256" y2="120"/>
    <line x1="302" y1="120" x2="396" y2="120"/>
    <line x1="308" y1="225" x2="396" y2="225"/>
  </g>
  <!-- final splice -->
  <path d="M 437.6 129.6 Q 560 170 289 200" fill="none" stroke="#4169E1" stroke-width="2.2" marker-end="url(#arrowa)"/>
  <g text-anchor="middle">
    <text x="560" y="156" fill="#5c6b76" font-size="12.5">final splice:</text>
    <text x="560" y="172" fill="#4169E1" font-size="13" font-weight="600">5 → 2</text>
  </g>
  <!-- odd chain -->
  <circle cx="140" cy="120" r="20" fill="#4169E1"/>
  <circle cx="280" cy="120" r="20" fill="#4169E1"/>
  <circle cx="420" cy="120" r="20" fill="#4169E1"/>
  <g text-anchor="middle" fill="#ffffff" font-weight="600">
    <text x="140" y="125">1</text><text x="280" y="125">3</text><text x="420" y="125">5</text>
  </g>
  <!-- even chain, head 2 ringed -->
  <circle cx="280" cy="225" r="26" fill="none" stroke="#1a2026" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="280" cy="225" r="20" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <circle cx="420" cy="225" r="20" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="280" y="230">2</text><text x="420" y="230">4</text>
  </g>
  <text x="280" y="270" text-anchor="middle" fill="#5c6b76" font-size="12.5">remembered even head</text>
  <!-- result row -->
  <text x="60" y="317" fill="#5c6b76" font-size="12.5">result</text>
  <g stroke="#42525e" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="178" y1="312" x2="220" y2="312"/>
    <line x1="258" y1="312" x2="300" y2="312"/>
    <line x1="418" y1="312" x2="460" y2="312"/>
  </g>
  <line x1="338" y1="312" x2="380" y2="312" stroke="#4169E1" stroke-width="2" marker-end="url(#arrowa)"/>
  <circle cx="160" cy="312" r="16" fill="#4169E1"/>
  <circle cx="240" cy="312" r="16" fill="#4169E1"/>
  <circle cx="320" cy="312" r="16" fill="#4169E1"/>
  <circle cx="400" cy="312" r="16" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <circle cx="480" cy="312" r="16" fill="#dbe4fb" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600">
    <text x="160" y="317" fill="#ffffff">1</text>
    <text x="240" y="317" fill="#ffffff">3</text>
    <text x="320" y="317" fill="#ffffff">5</text>
    <text x="400" y="317" fill="#1a2026">2</text>
    <text x="480" y="317" fill="#1a2026">4</text>
  </g>
  <text x="40" y="356" fill="#1a2026" font-size="13">Two tails weave the original nodes in place while the even head 2 is remembered aside;</text>
  <text x="40" y="374" fill="#1a2026" font-size="13">one splice from 5 finishes <tspan fill="#4169E1" font-weight="600">[1, 3, 5, 2, 4]</tspan>.</text>
</svg>
