<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 234" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="672" height="234" fill="#ffffff"/>
  <!-- positions [[0,0],[0,1],[1,2],[2,1]] on 3x3; counts 1,1,2,3; dashed ring = the set's root -->
  <!-- new land: light accent cell; earlier land: accent cell; water: white with muted 0 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="81" y="54">addLand(0, 0)</text>
    <text x="251" y="54">addLand(0, 1)</text>
    <text x="421" y="54">addLand(1, 2)</text>
    <text x="591" y="54">addLand(2, 1)</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="30" y="70" width="34" height="30" fill="#dbe4fb"/><rect x="64" y="70" width="34" height="30" fill="#ffffff"/><rect x="98" y="70" width="34" height="30" fill="#ffffff"/>
    <rect x="30" y="100" width="34" height="30" fill="#ffffff"/><rect x="64" y="100" width="34" height="30" fill="#ffffff"/><rect x="98" y="100" width="34" height="30" fill="#ffffff"/>
    <rect x="30" y="130" width="34" height="30" fill="#ffffff"/><rect x="64" y="130" width="34" height="30" fill="#ffffff"/><rect x="98" y="130" width="34" height="30" fill="#ffffff"/>
    <rect x="200" y="70" width="34" height="30" fill="#4169E1"/><rect x="234" y="70" width="34" height="30" fill="#dbe4fb"/><rect x="268" y="70" width="34" height="30" fill="#ffffff"/>
    <rect x="200" y="100" width="34" height="30" fill="#ffffff"/><rect x="234" y="100" width="34" height="30" fill="#ffffff"/><rect x="268" y="100" width="34" height="30" fill="#ffffff"/>
    <rect x="200" y="130" width="34" height="30" fill="#ffffff"/><rect x="234" y="130" width="34" height="30" fill="#ffffff"/><rect x="268" y="130" width="34" height="30" fill="#ffffff"/>
    <rect x="370" y="70" width="34" height="30" fill="#4169E1"/><rect x="404" y="70" width="34" height="30" fill="#4169E1"/><rect x="438" y="70" width="34" height="30" fill="#ffffff"/>
    <rect x="370" y="100" width="34" height="30" fill="#ffffff"/><rect x="404" y="100" width="34" height="30" fill="#ffffff"/><rect x="438" y="100" width="34" height="30" fill="#dbe4fb"/>
    <rect x="370" y="130" width="34" height="30" fill="#ffffff"/><rect x="404" y="130" width="34" height="30" fill="#ffffff"/><rect x="438" y="130" width="34" height="30" fill="#ffffff"/>
    <rect x="540" y="70" width="34" height="30" fill="#4169E1"/><rect x="574" y="70" width="34" height="30" fill="#4169E1"/><rect x="608" y="70" width="34" height="30" fill="#ffffff"/>
    <rect x="540" y="100" width="34" height="30" fill="#ffffff"/><rect x="574" y="100" width="34" height="30" fill="#ffffff"/><rect x="608" y="100" width="34" height="30" fill="#4169E1"/>
    <rect x="540" y="130" width="34" height="30" fill="#ffffff"/><rect x="574" y="130" width="34" height="30" fill="#dbe4fb"/><rect x="608" y="130" width="34" height="30" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="47" y="90" fill="#1a2026">1</text><text x="81" y="90" fill="#9aa7b2">0</text><text x="115" y="90" fill="#9aa7b2">0</text>
    <text x="47" y="120" fill="#9aa7b2">0</text><text x="81" y="120" fill="#9aa7b2">0</text><text x="115" y="120" fill="#9aa7b2">0</text>
    <text x="47" y="150" fill="#9aa7b2">0</text><text x="81" y="150" fill="#9aa7b2">0</text><text x="115" y="150" fill="#9aa7b2">0</text>
    <text x="217" y="90" fill="#ffffff">1</text><text x="251" y="90" fill="#1a2026">1</text><text x="285" y="90" fill="#9aa7b2">0</text>
    <text x="217" y="120" fill="#9aa7b2">0</text><text x="251" y="120" fill="#9aa7b2">0</text><text x="285" y="120" fill="#9aa7b2">0</text>
    <text x="217" y="150" fill="#9aa7b2">0</text><text x="251" y="150" fill="#9aa7b2">0</text><text x="285" y="150" fill="#9aa7b2">0</text>
    <text x="387" y="90" fill="#ffffff">1</text><text x="421" y="90" fill="#ffffff">1</text><text x="455" y="90" fill="#9aa7b2">0</text>
    <text x="387" y="120" fill="#9aa7b2">0</text><text x="421" y="120" fill="#9aa7b2">0</text><text x="455" y="120" fill="#1a2026">1</text>
    <text x="387" y="150" fill="#9aa7b2">0</text><text x="421" y="150" fill="#9aa7b2">0</text><text x="455" y="150" fill="#9aa7b2">0</text>
    <text x="557" y="90" fill="#ffffff">1</text><text x="591" y="90" fill="#ffffff">1</text><text x="625" y="90" fill="#9aa7b2">0</text>
    <text x="557" y="120" fill="#9aa7b2">0</text><text x="591" y="120" fill="#9aa7b2">0</text><text x="625" y="120" fill="#ffffff">1</text>
    <text x="557" y="150" fill="#9aa7b2">0</text><text x="591" y="150" fill="#1a2026">1</text><text x="625" y="150" fill="#9aa7b2">0</text>
  </g>
  <!-- set roots: s1 {(0,0)}; s2 {(0,0),(0,1)}; s3 + {(1,2)}; s4 + {(2,1)} -->
  <g fill="none" stroke="#1a2026" stroke-width="1.5" stroke-dasharray="4 3">
    <circle cx="47" cy="85" r="13"/>
    <circle cx="217" cy="85" r="13"/>
    <circle cx="387" cy="85" r="13"/><circle cx="455" cy="115" r="13"/>
    <circle cx="557" cy="85" r="13"/><circle cx="625" cy="115" r="13"/><circle cx="591" cy="145" r="13"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#5c6b76">
    <text x="81" y="182">islands = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="251" y="182">islands = <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="421" y="182">islands = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="591" y="182">islands = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="336" y="206">A new cell starts its own island (+1); each distinct neighboring island merged away is -1,</text>
    <text x="336" y="224">so addLand(0, 1) just unions into (0, 0)'s set and the count steps <tspan fill="#4169E1" font-weight="600">1, 1, 2, 3</tspan>.</text>
  </g>
</svg>
