<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 196" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="560" height="196" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="63" y="44">start</text>
    <text x="171" y="44">addLand(0, 0)</text>
    <text x="279" y="44">addLand(0, 1)</text>
    <text x="387" y="44">addLand(1, 2)</text>
    <text x="495" y="44">addLand(2, 1)</text>
  </g>
  <!-- panel 0: all water -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="24" y="52" width="26" height="26" fill="#ffffff"/><rect x="50" y="52" width="26" height="26" fill="#ffffff"/><rect x="76" y="52" width="26" height="26" fill="#ffffff"/>
    <rect x="24" y="78" width="26" height="26" fill="#ffffff"/><rect x="50" y="78" width="26" height="26" fill="#ffffff"/><rect x="76" y="78" width="26" height="26" fill="#ffffff"/>
    <rect x="24" y="104" width="26" height="26" fill="#ffffff"/><rect x="50" y="104" width="26" height="26" fill="#ffffff"/><rect x="76" y="104" width="26" height="26" fill="#ffffff"/>
  </g>
  <line x1="108" y1="91" x2="124" y2="91" stroke="#42525e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- panel 1: land at (0,0) -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="132" y="52" width="26" height="26" fill="#4169E1"/><rect x="158" y="52" width="26" height="26" fill="#ffffff"/><rect x="184" y="52" width="26" height="26" fill="#ffffff"/>
    <rect x="132" y="78" width="26" height="26" fill="#ffffff"/><rect x="158" y="78" width="26" height="26" fill="#ffffff"/><rect x="184" y="78" width="26" height="26" fill="#ffffff"/>
    <rect x="132" y="104" width="26" height="26" fill="#ffffff"/><rect x="158" y="104" width="26" height="26" fill="#ffffff"/><rect x="184" y="104" width="26" height="26" fill="#ffffff"/>
  </g>
  <line x1="216" y1="91" x2="232" y2="91" stroke="#42525e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- panel 2: land at (0,0), (0,1) -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="240" y="52" width="26" height="26" fill="#4169E1" fill-opacity="0.18"/><rect x="266" y="52" width="26" height="26" fill="#4169E1"/><rect x="292" y="52" width="26" height="26" fill="#ffffff"/>
    <rect x="240" y="78" width="26" height="26" fill="#ffffff"/><rect x="266" y="78" width="26" height="26" fill="#ffffff"/><rect x="292" y="78" width="26" height="26" fill="#ffffff"/>
    <rect x="240" y="104" width="26" height="26" fill="#ffffff"/><rect x="266" y="104" width="26" height="26" fill="#ffffff"/><rect x="292" y="104" width="26" height="26" fill="#ffffff"/>
  </g>
  <line x1="324" y1="91" x2="340" y2="91" stroke="#42525e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- panel 3: land at (0,0), (0,1), (1,2) -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="348" y="52" width="26" height="26" fill="#4169E1" fill-opacity="0.18"/><rect x="374" y="52" width="26" height="26" fill="#4169E1" fill-opacity="0.18"/><rect x="400" y="52" width="26" height="26" fill="#ffffff"/>
    <rect x="348" y="78" width="26" height="26" fill="#ffffff"/><rect x="374" y="78" width="26" height="26" fill="#ffffff"/><rect x="400" y="78" width="26" height="26" fill="#4169E1"/>
    <rect x="348" y="104" width="26" height="26" fill="#ffffff"/><rect x="374" y="104" width="26" height="26" fill="#ffffff"/><rect x="400" y="104" width="26" height="26" fill="#ffffff"/>
  </g>
  <line x1="432" y1="91" x2="448" y2="91" stroke="#42525e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- panel 4: land at (0,0), (0,1), (1,2), (2,1) -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="456" y="52" width="26" height="26" fill="#4169E1" fill-opacity="0.18"/><rect x="482" y="52" width="26" height="26" fill="#4169E1" fill-opacity="0.18"/><rect x="508" y="52" width="26" height="26" fill="#ffffff"/>
    <rect x="456" y="78" width="26" height="26" fill="#ffffff"/><rect x="482" y="78" width="26" height="26" fill="#ffffff"/><rect x="508" y="78" width="26" height="26" fill="#4169E1" fill-opacity="0.18"/>
    <rect x="456" y="104" width="26" height="26" fill="#ffffff"/><rect x="482" y="104" width="26" height="26" fill="#4169E1"/><rect x="508" y="104" width="26" height="26" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="63" y="158">0 islands</text>
    <text x="171" y="158">1</text>
    <text x="279" y="158">1</text>
    <text x="387" y="158">2</text>
    <text x="495" y="158">3</text>
  </g>
  <text x="280" y="184" text-anchor="middle" fill="#5c6b76" font-size="12.5">answer = [1, 1, 2, 3]; solid blue marks the cell just added</text>
</svg>
