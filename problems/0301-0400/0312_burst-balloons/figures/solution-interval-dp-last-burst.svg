<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="388" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [3,1,5,8] padded to [1,3,1,5,8,1]; cells 64x40 at (120,56) stride 72; dp chips 112x30 at x=130 stride 124 -->
  <path d="M 152 50 Q 332 8 512 50" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="20" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">last burst in dp[1][4]: 1 · 8 · 1 = 8</text>
  <text x="30" y="81" fill="#5c6b76" font-size="12.5">padded</text>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="#f0f3f7">
    <rect x="120" y="56" width="64" height="40"/><rect x="480" y="56" width="64" height="40"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="192" y="56" width="64" height="40"/><rect x="264" y="56" width="64" height="40"/>
    <rect x="336" y="56" width="64" height="40"/><rect x="408" y="56" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="152" y="81" fill="#9aa7b2">1</text><text x="224" y="81">3</text><text x="296" y="81">1</text>
    <text x="368" y="81">5</text><text x="440" y="81">8</text><text x="512" y="81" fill="#9aa7b2">1</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="152" y="110">0</text><text x="224" y="110">1</text><text x="296" y="110">2</text>
    <text x="368" y="110">3</text><text x="440" y="110">4</text><text x="512" y="110">5</text>
  </g>
  <g text-anchor="start" fill="#5c6b76" font-size="12.5">
    <text x="30" y="159">length 1</text><text x="30" y="201">length 2</text>
    <text x="30" y="243">length 3</text><text x="30" y="297">length 4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="130" y="140" width="112" height="30"/><rect x="254" y="140" width="112" height="30"/>
    <rect x="378" y="140" width="112" height="30"/><rect x="502" y="140" width="112" height="30"/>
    <rect x="130" y="182" width="112" height="30"/><rect x="254" y="182" width="112" height="30"/>
    <rect x="378" y="182" width="112" height="30"/>
    <rect x="254" y="224" width="112" height="30"/>
  </g>
  <rect x="130" y="224" width="112" height="30" stroke="#42525e" stroke-width="1.2" fill="#dbe4fb"/>
  <rect x="130" y="278" width="112" height="30" stroke="#4169E1" stroke-width="2" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="186" y="160">dp[1][1] = <tspan font-weight="600">3</tspan></text>
    <text x="310" y="160">dp[2][2] = <tspan font-weight="600">15</tspan></text>
    <text x="434" y="160">dp[3][3] = <tspan font-weight="600">40</tspan></text>
    <text x="558" y="160">dp[4][4] = <tspan font-weight="600">40</tspan></text>
    <text x="186" y="202">dp[1][2] = <tspan font-weight="600">30</tspan></text>
    <text x="310" y="202">dp[2][3] = <tspan font-weight="600">135</tspan></text>
    <text x="434" y="202">dp[3][4] = <tspan font-weight="600">48</tspan></text>
    <text x="186" y="244">dp[1][3] = <tspan font-weight="600">159</tspan></text>
    <text x="310" y="244">dp[2][4] = <tspan font-weight="600">159</tspan></text>
    <text x="186" y="298" fill="#4169E1" font-weight="600">dp[1][4] = 167</text>
  </g>
  <path d="M 186 276 L 186 256" fill="none" stroke="#4169E1" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="262" y="297" font-size="13" fill="#1a2026">dp[1][4] = 1·8·1 + dp[1][3]<tspan fill="#4169E1" font-weight="600"> = 8 + 159</tspan></text>
  <text x="320" y="344" text-anchor="middle" fill="#1a2026" font-size="13">Filling shortest intervals first, the final split keeps 8 for last:</text>
  <text x="320" y="364" text-anchor="middle" fill="#1a2026" font-size="13">dp[1][4] = 1·8·1 + dp[1][3] + dp[5][4] = 8 + 159 + 0 = <tspan fill="#4169E1" font-weight="600">167</tspan>, the statement's coins.</text>
</svg>
