    <rect x="40" y="102" width="44" height="32" fill="#ffffff"/><rect x="84" y="102" width="44" height="32" fill="#ffffff"/><rect x="128" y="102" width="44" height="32" fill="#ffffff"/><rect x="172" y="102" width="44" height="32" fill="#ffffff"/><rect x="216" y="102" width="44" height="32" fill="#ffffff"/>
