  </defs>
  <!-- matrix [[3,0,1,4,2],[5,6,3,2,1],[1,2,0,1,5],[4,1,0,1,7],[1,0,3,0,5]]; query sumRegion(2,1,4,3), shaded -->
  <!-- prefix[r][c] = sum rows 0..r-1 cols 0..c-1; corners used: prefix[5][4]=38, prefix[2][4]=24, prefix[5][1]=14, prefix[2][1]=8 -->
  <text x="40" y="46" fill="#5c6b76" font-size="12.5">matrix</text>
  <text x="330" y="46" fill="#5c6b76" font-size="12.5">prefix table (extra zero row and column)</text>
