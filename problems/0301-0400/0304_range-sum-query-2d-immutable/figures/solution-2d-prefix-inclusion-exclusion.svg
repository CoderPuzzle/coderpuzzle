    <rect x="330" y="98" width="40" height="28" fill="#ffffff"/><rect x="370" y="98" width="40" height="28" fill="#ffffff"/><rect x="410" y="98" width="40" height="28" fill="#ffffff"/><rect x="450" y="98" width="40" height="28" fill="#ffffff"/><rect x="490" y="98" width="40" height="28" fill="#ffffff"/><rect x="530" y="98" width="40" height="28" fill="#ffffff"/>
