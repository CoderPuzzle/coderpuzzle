  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12.5">
    <text x="350" y="89">0</text><text x="390" y="89">0</text><text x="430" y="89">0</text><text x="470" y="89">0</text><text x="510" y="89">0</text><text x="550" y="89">0</text>
    <text x="350" y="117">0</text><text x="390" y="117">3</text><text x="430" y="117">3</text><text x="470" y="117">4</text><text x="510" y="117">8</text><text x="550" y="117">10</text>
    <text x="350" y="145">0</text><text x="430" y="145">14</text><text x="470" y="145">18</text><text x="550" y="145">27</text>
    <text x="350" y="173">0</text><text x="390" y="173">9</text><text x="430" y="173">17</text><text x="470" y="173">21</text><text x="510" y="173">28</text><text x="550" y="173">36</text>
    <text x="350" y="201">0</text><text x="390" y="201">13</text><text x="430" y="201">22</text><text x="470" y="201">26</text><text x="510" y="201">34</text><text x="550" y="201">49</text>
    <text x="350" y="229">0</text><text x="430" y="229">23</text><text x="470" y="229">30</text><text x="550" y="229">58</text>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-weight="600" font-size="12.5">
    <text x="390" y="145">+8</text><text x="510" y="145">-24</text><text x="390" y="229">-14</text><text x="510" y="229">+38</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="310" y="284">sumRegion(2, 1, 4, 3) = prefix[5][4] - prefix[2][4] - prefix[5][1] + prefix[2][1]</text>
    <text x="310" y="302">= 38 - 24 - 14 + 8 = <tspan fill="#4169E1" font-weight="600">8</tspan>, the nine shaded cells and nothing else.</text>
