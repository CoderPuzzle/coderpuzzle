    <text x="62" y="155">1</text><text x="106" y="155">2</text><text x="150" y="155">0</text><text x="194" y="155">1</text><text x="238" y="155">5</text>
    <text x="62" y="187">4</text><text x="106" y="187">1</text><text x="150" y="187">0</text><text x="194" y="187">1</text><text x="238" y="187">7</text>
    <text x="62" y="219">1</text><text x="106" y="219">0</text><text x="150" y="219">3</text><text x="194" y="219">0</text><text x="238" y="219">5</text>
