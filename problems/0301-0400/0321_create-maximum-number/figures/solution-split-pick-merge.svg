<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums1 = [3,4,6,5] take1=2 picks [6,5]; nums2 = [9,1,2,5,8,3] take2=3 picks [9,8,3]; merge -> [9,8,6,5,3]; cells 42/46 wide, input rows y=58, pick rows y=140, result y=230 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">
    <text x="123" y="46">nums1, take1 = 2</text><text x="475" y="46">nums2, take2 = 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="40" y="58" width="42" height="34"/><rect x="88" y="58" width="42" height="34"/>
    <rect x="387" y="58" width="42" height="34"/>
    <rect x="432" y="58" width="42" height="34"/><rect x="477" y="58" width="42" height="34"/>
  </g>
  <rect x="136" y="58" width="42" height="34" stroke="#42525e" stroke-width="1.2" fill="#dbe4fb"/>
  <rect x="184" y="58" width="42" height="34" stroke="#42525e" stroke-width="1.2" fill="#dbe4fb"/>
  <rect x="342" y="58" width="42" height="34" stroke="#42525e" stroke-width="1.2" fill="#dbe4fb"/>
  <rect x="522" y="58" width="42" height="34" stroke="#42525e" stroke-width="1.2" fill="#dbe4fb"/>
  <rect x="567" y="58" width="42" height="34" stroke="#42525e" stroke-width="1.2" fill="#dbe4fb"/>
  <g text-anchor="middle" font-size="14" fill="#9aa7b2">
    <text x="61" y="80">3</text><text x="109" y="80">4</text>
    <text x="408" y="80">1</text><text x="453" y="80">2</text><text x="498" y="80">5</text>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="157" y="80">6</text><text x="205" y="80">5</text>
    <text x="363" y="80">9</text><text x="543" y="80">8</text><text x="588" y="80">3</text>
  </g>
  <path d="M 114 98 L 114 134" fill="none" stroke="#4169E1" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M 486 98 L 486 134" fill="none" stroke="#4169E1" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="124" y="121" font-size="11.5" fill="#5c6b76">monotonic stack, drop 2</text>
  <text x="476" y="121" text-anchor="end" font-size="11.5" fill="#5c6b76">monotonic stack, drop 3</text>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="70" y="140" width="42" height="34"/><rect x="116" y="140" width="42" height="34"/>
    <rect x="420" y="140" width="42" height="34"/><rect x="465" y="140" width="42" height="34"/>
    <rect x="510" y="140" width="42" height="34"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="91" y="162">6</text><text x="137" y="162">5</text>
    <text x="441" y="162">9</text><text x="486" y="162">8</text><text x="531" y="162">3</text>
  </g>
  <text x="320" y="212" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">merge: larger head wins</text>
  <path d="M 114 182 Q 150 216 203 228" fill="none" stroke="#4169E1" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M 486 182 Q 450 216 417 228" fill="none" stroke="#4169E1" stroke-width="1.75" marker-end="url(#arrow)"/>
  <g stroke="#4169E1" stroke-width="1.5" fill="#ffffff">
    <rect x="197" y="230" width="46" height="40"/><rect x="247" y="230" width="46" height="40"/>
    <rect x="397" y="230" width="46" height="40"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="297" y="230" width="46" height="40"/><rect x="347" y="230" width="46" height="40"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="600" fill="#1a2026">
    <text x="220" y="256">9</text><text x="270" y="256">8</text><text x="320" y="256">6</text>
    <text x="370" y="256">5</text><text x="420" y="256">3</text>
  </g>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">The winning split of k = 5 has the stack pick <tspan fill="#4169E1" font-weight="600">[6, 5]</tspan> from nums1 and <tspan fill="#4169E1" font-weight="600">[9, 8, 3]</tspan> from nums2;</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">merged head-to-head they form <tspan fill="#4169E1" font-weight="600">[9, 8, 6, 5, 3]</tspan> — shaded cells come from nums1.</text>
</svg>
