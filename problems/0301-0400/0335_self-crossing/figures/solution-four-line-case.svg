<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="650" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <!-- distance = [2,1,1,2]; 60 px = 1 unit; world origin at (220, 250), north = up; accent dot = the crossing at (0, 1); the box is the i = 3 case check -->
  <g stroke="#9aa7b2" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="250" x2="360" y2="250"/>
    <line x1="220" y1="70" x2="220" y2="250"/>
  </g>
  <g stroke="#1a2026" stroke-width="2.4" fill="none">
    <path d="M 220 250 V 130" marker-end="url(#arrow)"/>
    <path d="M 220 130 H 160" marker-end="url(#arrow)"/>
    <path d="M 160 130 V 190" marker-end="url(#arrow)"/>
    <path d="M 160 190 H 280" marker-end="url(#arrow)"/>
  </g>
  <circle cx="220" cy="250" r="4.5" fill="#1a2026"/>
  <text x="220" y="274" text-anchor="middle" fill="#5c6b76" font-size="12">(0, 0)</text>
  <circle cx="220" cy="190" r="5.5" fill="#4169E1"/>
  <text x="232" y="180" fill="#4169E1" font-size="12.5" font-weight="600">(0, 1)</text>
  <g fill="#5c6b76" font-size="12">
    <text x="208" y="216" text-anchor="end">d[0] = 2</text>
    <text x="190" y="118" text-anchor="middle">d[1] = 1</text>
    <text x="148" y="166" text-anchor="end">d[2] = 1</text>
    <text x="255" y="214" text-anchor="middle">d[3] = 2</text>
  </g>

  <rect x="380" y="96" width="240" height="122" fill="#f0f3f7" rx="6"/>
  <text x="396" y="124" fill="#1a2026" font-size="13" font-weight="600">i = 3: the four-line case</text>
  <g fill="#1a2026" font-size="12.5">
    <text x="396" y="152">d[3] = 2 ≥ d[1] = 1 — true</text>
    <text x="396" y="178">d[2] = 1 ≤ d[0] = 2 — true</text>
    <text x="396" y="204">→ the east side <tspan fill="#4169E1" font-weight="600">crosses</tspan> d[0]</text>
  </g>

  <text x="325" y="302" text-anchor="middle" fill="#1a2026" font-size="13">The new east side (d[3] = 2) reaches past the first north side while d[2] = 1 stayed</text>
  <text x="325" y="322" text-anchor="middle" fill="#1a2026" font-size="13">inside d[0] = 2 — the four-line case fires and the path crosses itself at <tspan fill="#4169E1" font-weight="600">(0, 1)</tspan>.</text>
</svg>
