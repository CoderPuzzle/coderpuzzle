<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="316" fill="#ffffff"/>
  <!-- Android dot grid 1..9; skip pairs drawn as lines: 1-3, 7-9, 1-7, 3-9, 1-9, 3-7, 2-8, 4-6; middles 2,4,6,8,5 accent; dashed rings = symmetry starts 1, 2, 5; right column = per-start counts for m = 1, n = 2 -->
  <g stroke="#9aa7b2" stroke-width="1.3">
    <line x1="100" y1="78" x2="224" y2="78"/>
    <line x1="100" y1="202" x2="224" y2="202"/>
    <line x1="100" y1="78" x2="100" y2="202"/>
    <line x1="224" y1="78" x2="224" y2="202"/>
    <line x1="100" y1="78" x2="224" y2="202"/>
    <line x1="224" y1="78" x2="100" y2="202"/>
    <line x1="162" y1="78" x2="162" y2="202"/>
    <line x1="100" y1="140" x2="224" y2="140"/>
  </g>
  <g fill="none" stroke="#5c6b76" stroke-width="1.2" stroke-dasharray="3 3">
    <circle cx="100" cy="78" r="17"/>
    <circle cx="162" cy="78" r="17"/>
    <circle cx="162" cy="140" r="17"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <circle cx="100" cy="78" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/><text x="100" y="82.5" fill="#1a2026">1</text>
    <circle cx="162" cy="78" r="13" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/><text x="162" y="82.5" fill="#1a2026">2</text>
    <circle cx="224" cy="78" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/><text x="224" y="82.5" fill="#1a2026">3</text>
    <circle cx="100" cy="140" r="13" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/><text x="100" y="144.5" fill="#1a2026">4</text>
    <circle cx="162" cy="140" r="13" fill="#4169E1" stroke="#4169E1" stroke-width="1.5"/><text x="162" y="144.5" fill="#ffffff">5</text>
    <circle cx="224" cy="140" r="13" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/><text x="224" y="144.5" fill="#1a2026">6</text>
    <circle cx="100" cy="202" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/><text x="100" y="206.5" fill="#1a2026">7</text>
    <circle cx="162" cy="202" r="13" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/><text x="162" y="206.5" fill="#1a2026">8</text>
    <circle cx="224" cy="202" r="13" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/><text x="224" y="206.5" fill="#1a2026">9</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="162" y="238">each line's middle dot must be visited first</text>
    <text x="162" y="256">dashed rings mark the three search starts</text>
  </g>
  <text x="330" y="56" fill="#5c6b76" font-size="12.5">three searches cover the nine starts (m = 1, n = 2)</text>
  <g>
    <text x="330" y="80" fill="#1a2026" font-size="13.5" font-weight="600">start 1, corner (x4)</text>
    <text x="330" y="98" fill="#5c6b76" font-size="12.5">next 3, 7, 9 are skip-blocked</text>
    <text x="330" y="116" fill="#1a2026" font-size="13.5">1 + 5 next = 6 <tspan fill="#4169E1" font-weight="600">→ 24</tspan></text>
    <text x="330" y="136" fill="#1a2026" font-size="13.5" font-weight="600">start 2, edge (x4)</text>
    <text x="330" y="154" fill="#5c6b76" font-size="12.5">next 8 is skip-blocked</text>
    <text x="330" y="172" fill="#1a2026" font-size="13.5">1 + 7 next = 8 <tspan fill="#4169E1" font-weight="600">→ 32</tspan></text>
    <text x="330" y="192" fill="#1a2026" font-size="13.5" font-weight="600">start 5, center (x1)</text>
    <text x="330" y="210" fill="#5c6b76" font-size="12.5">no next is ever blocked</text>
    <text x="330" y="228" fill="#1a2026" font-size="13.5">1 + 8 next = 9 <tspan fill="#4169E1" font-weight="600">→ 9</tspan></text>
  </g>
  <text x="330" y="256" fill="#1a2026" font-size="13.5" font-weight="600">4 x 6 + 4 x 8 + 9 = <tspan fill="#4169E1">65</tspan> patterns</text>
  <text x="40" y="284" fill="#1a2026" font-size="13">The eight skip pairs gate every DFS step; symmetry folds the nine start</text>
  <text x="40" y="302" fill="#1a2026" font-size="13">dots into corner 1, edge 2, and center 5, and 4 x 6 + 4 x 8 + 9 = 65 for m = 1, n = 2.</text>
</svg>
