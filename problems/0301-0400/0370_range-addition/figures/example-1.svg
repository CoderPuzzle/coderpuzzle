<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 338" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15">
  <rect width="540" height="338" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- row 0: all zeros -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="24" width="50" height="42" fill="#ffffff"/><rect x="120" y="24" width="50" height="42" fill="#ffffff"/><rect x="170" y="24" width="50" height="42" fill="#ffffff"/><rect x="220" y="24" width="50" height="42" fill="#ffffff"/><rect x="270" y="24" width="50" height="42" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76">
    <text x="95" y="50">0</text><text x="145" y="50">0</text><text x="195" y="50">0</text><text x="245" y="50">0</text><text x="295" y="50">0</text>
  </g>
  <text x="336" y="50" fill="#5c6b76" font-size="12.5">arr starts as all zeros</text>
  <line x1="195" y1="74" x2="195" y2="94" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- row 1: +2 on indices 1..3 -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="100" width="50" height="42" fill="#ffffff"/><rect x="120" y="100" width="50" height="42" fill="#4169E1" fill-opacity="0.15"/><rect x="170" y="100" width="50" height="42" fill="#4169E1" fill-opacity="0.15"/><rect x="220" y="100" width="50" height="42" fill="#4169E1" fill-opacity="0.15"/><rect x="270" y="100" width="50" height="42" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="95" y="126" fill="#5c6b76">0</text><text x="145" y="126">2</text><text x="195" y="126">2</text><text x="245" y="126">2</text><text x="295" y="126" fill="#5c6b76">0</text>
  </g>
  <text x="336" y="126" fill="#4169E1" font-size="12.5" font-weight="600">+2 on indices 1..3</text>
  <line x1="195" y1="150" x2="195" y2="170" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- row 2: +3 on indices 2..4 -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="176" width="50" height="42" fill="#ffffff"/><rect x="120" y="176" width="50" height="42" fill="#ffffff"/><rect x="170" y="176" width="50" height="42" fill="#4169E1" fill-opacity="0.15"/><rect x="220" y="176" width="50" height="42" fill="#4169E1" fill-opacity="0.15"/><rect x="270" y="176" width="50" height="42" fill="#4169E1" fill-opacity="0.15"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="95" y="202" fill="#5c6b76">0</text><text x="145" y="202" fill="#5c6b76">2</text><text x="195" y="202">5</text><text x="245" y="202">5</text><text x="295" y="202">3</text>
  </g>
  <text x="336" y="202" fill="#4169E1" font-size="12.5" font-weight="600">+3 on indices 2..4</text>
  <line x1="195" y1="226" x2="195" y2="246" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- row 3: -2 on indices 0..2 -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="70" y="252" width="50" height="42" fill="#4169E1" fill-opacity="0.15"/><rect x="120" y="252" width="50" height="42" fill="#4169E1" fill-opacity="0.15"/><rect x="170" y="252" width="50" height="42" fill="#4169E1" fill-opacity="0.15"/><rect x="220" y="252" width="50" height="42" fill="#ffffff"/><rect x="270" y="252" width="50" height="42" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="95" y="278">-2</text><text x="145" y="278" fill="#5c6b76">0</text><text x="195" y="278">3</text><text x="245" y="278">5</text><text x="295" y="278">3</text>
  </g>
  <text x="336" y="278" fill="#4169E1" font-size="12.5" font-weight="600">-2 on indices 0..2</text>
  <text x="195" y="326" text-anchor="middle" fill="#5c6b76" font-size="12.5">final arr = [-2, 0, 3, 5, 3]</text>
</svg>
