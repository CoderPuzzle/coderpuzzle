<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="328" fill="#ffffff"/>
  <!-- length = 5, updates = [[1,3,2],[2,4,3],[0,2,-2]]; 6 slots (0-5, slot 5 spare), cells x = 120 + 78i, w 64; sweep running totals -2, 0, 3, 5, 3 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="152" y="48">0</text><text x="230" y="48">1</text><text x="308" y="48">2</text>
    <text x="386" y="48">3</text><text x="464" y="48">4</text><text x="542" y="48">5</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="120" y="58" width="64" height="34"/><rect x="198" y="58" width="64" height="34"/><rect x="276" y="58" width="64" height="34"/><rect x="354" y="58" width="64" height="34"/><rect x="432" y="58" width="64" height="34"/><rect x="510" y="58" width="64" height="34"/>
    <rect x="120" y="100" width="64" height="34"/><rect x="198" y="100" width="64" height="34"/><rect x="276" y="100" width="64" height="34"/><rect x="354" y="100" width="64" height="34"/><rect x="432" y="100" width="64" height="34"/><rect x="510" y="100" width="64" height="34"/>
    <rect x="120" y="142" width="64" height="34"/><rect x="198" y="142" width="64" height="34"/><rect x="276" y="142" width="64" height="34"/><rect x="354" y="142" width="64" height="34"/><rect x="432" y="142" width="64" height="34"/><rect x="510" y="142" width="64" height="34"/>
    <rect x="120" y="184" width="64" height="34" fill="#dbe4fb"/><rect x="198" y="184" width="64" height="34" fill="#dbe4fb"/><rect x="276" y="184" width="64" height="34" fill="#dbe4fb"/><rect x="354" y="184" width="64" height="34" fill="#dbe4fb"/><rect x="432" y="184" width="64" height="34" fill="#dbe4fb"/><rect x="510" y="184" width="64" height="34" fill="#dbe4fb"/>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="12.5">
    <text x="110" y="80">[1,3,2]</text>
    <text x="110" y="122">[2,4,3]</text>
    <text x="110" y="164">[0,2,-2]</text>
    <text x="110" y="206">diff</text>
    <text x="110" y="256" fill="#1a2026" font-weight="600">sweep</text>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600">
    <text x="230" y="80">+2</text><text x="464" y="80">-2</text>
    <text x="308" y="122">+3</text><text x="542" y="122">-3</text>
    <text x="152" y="164">-2</text><text x="386" y="164">+2</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="152" y="206">-2</text><text x="230" y="206">+2</text><text x="308" y="206">+3</text>
    <text x="386" y="206">+2</text><text x="464" y="206">-2</text><text x="542" y="206" fill="#9aa7b2">-3</text>
  </g>
  <rect x="120" y="232" width="454" height="38" rx="6" fill="#dbe4fb"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="152" y="256">-2</text><text x="230" y="256">0</text><text x="308" y="256">3</text>
    <text x="386" y="256">5</text><text x="464" y="256">3</text><text x="542" y="256" fill="#9aa7b2" font-size="13">0</text>
  </g>
  <text x="30" y="298" fill="#1a2026" font-size="13">Each update writes two markers; one left-to-right sweep accumulates them</text>
  <text x="30" y="316" fill="#1a2026" font-size="13">into <tspan fill="#4169E1" font-weight="600">[-2, 0, 3, 5, 3]</tspan> — ranges are never touched element by element.</text>
</svg>
