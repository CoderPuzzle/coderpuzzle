<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "0101", k = 3: state z = zero count; even row 0,2,4 at y=80, odd row 1,3 at y=200 (r=24).
       Edge z -> z' = z + 3 - 2i for each legal i: 0-3 (i=0), 1-2 (i=2 at 1, i=1 at 2), 2-3 (i=2 at 3, i=1 at 2), 1-4 (i=0). BFS dist: d(2)=0, d(1)=d(3)=1, d(0)=d(4)=2. -->
  <g fill="#9aa7b2" font-size="12">
    <text x="18" y="84">even z</text>
    <text x="18" y="204">odd z</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none">
    <path d="M 315.4 98.4 L 384.6 181.6"/>
    <path d="M 414.4 180.8 L 475.6 99.2"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <path d="M 284.6 98.4 L 217.9 178.5" marker-end="url(#arrow)"/>
    <path d="M 185.6 180.8 L 126.8 102.4" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="12" font-weight="600" text-anchor="middle">
    <text x="272" y="158">i = 1</text>
    <text x="190" y="144">i = 3</text>
  </g>
  <g fill="#9aa7b2" font-size="12" text-anchor="middle">
    <text x="370" y="124">i = 2</text>
    <text x="424" y="126">i = 0</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="110" cy="80" r="24"/><circle cx="300" cy="80" r="24"/><circle cx="490" cy="80" r="24"/>
    <circle cx="200" cy="200" r="24"/><circle cx="400" cy="200" r="24"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="110" y="86">0</text><text x="300" y="86">2</text><text x="490" y="86">4</text>
    <text x="200" y="206">3</text><text x="400" y="206">1</text>
  </g>
  <text x="300" y="40" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">start (d = 0)</text>
  <text x="110" y="40" text-anchor="middle" fill="#1a2026" font-size="12.5" font-weight="600">goal (d = 2)</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="490" y="124">d = 2</text>
    <text x="200" y="242">d = 1</text>
    <text x="400" y="242">d = 1</text>
  </g>
  <text x="300" y="278" text-anchor="middle" fill="#1a2026" font-size="13">From z = 2 one operation reaches any odd count in [1, 3];</text>
  <text x="300" y="296" text-anchor="middle" fill="#1a2026" font-size="13">from z = 3 the even interval [0, 2] hits the goal — <tspan fill="#4169E1" font-weight="600">2</tspan> operations.</text>
</svg>
