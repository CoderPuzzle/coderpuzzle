<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- m=2 n=3 waitCost=[[6,1,4],[3,2,5]]; cells 92x58 at x=116,260,404 / y=64,166; e = entry (i+1)(j+1), w = waitCost[i][j]; tinted cells = optimal path; arrows charge predecessor wait + own entry -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="162" y="52">j = 0</text><text x="306" y="52">j = 1</text><text x="450" y="52">j = 2</text>
    <text x="100" y="97" text-anchor="end">i = 0</text>
    <text x="100" y="199" text-anchor="end">i = 1</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="404" y="64" width="92" height="58"/>
    <rect x="116" y="166" width="92" height="58"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="116" y="64" width="92" height="58"/>
    <rect x="260" y="64" width="92" height="58"/>
    <rect x="404" y="166" width="92" height="58"/>
    <rect x="260" y="166" width="92" height="58"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="162" y="81">e 1 &#183; w 6</text>
    <text x="306" y="81">e 2 &#183; w 1</text>
    <text x="450" y="81">e 3 &#183; w 4</text>
    <text x="162" y="183">e 2 &#183; w 3</text>
    <text x="306" y="183">e 4 &#183; w 2</text>
    <text x="450" y="183">e 6 &#183; w 5</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="17">
    <text x="162" y="107" fill="#4169E1">1</text>
    <text x="306" y="107" fill="#4169E1">3</text>
    <text x="450" y="107" fill="#1a2026">7</text>
    <text x="162" y="209" fill="#1a2026">3</text>
    <text x="306" y="209" fill="#4169E1">8</text>
    <text x="450" y="209" fill="#4169E1">16</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M 210 93 L 256 93" stroke="#4169E1" marker-end="url(#arrow)"/>
    <path d="M 306 124 L 306 162" stroke="#4169E1" marker-end="url(#arrow)"/>
    <path d="M 354 93 L 400 93" stroke="#5c6b76" marker-end="url(#arrowg)"/>
    <path d="M 162 124 L 162 162" stroke="#5c6b76" marker-end="url(#arrowg)"/>
    <path d="M 210 195 L 256 195" stroke="#5c6b76" marker-end="url(#arrowg)"/>
    <path d="M 354 195 L 400 195" stroke="#4169E1" marker-end="url(#arrow)"/>
    <path d="M 450 124 L 450 162" stroke="#5c6b76" marker-end="url(#arrowg)"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12">
    <text x="233" y="79" fill="#4169E1">+2</text>
    <text x="233" y="111" fill="#5c6b76" font-weight="400" font-size="10.5">e only</text>
    <text x="377" y="79" fill="#5c6b76">+4</text>
    <text x="377" y="111" fill="#5c6b76" font-weight="400" font-size="10.5">w1+e3</text>
    <text x="320" y="138" fill="#4169E1" text-anchor="start">+5</text>
    <text x="320" y="152" fill="#5c6b76" font-weight="400" font-size="10.5" text-anchor="start">w1+e4</text>
    <text x="176" y="138" fill="#5c6b76" text-anchor="start">+2</text>
    <text x="176" y="152" fill="#5c6b76" font-weight="400" font-size="10.5" text-anchor="start">e only</text>
    <text x="233" y="181" fill="#5c6b76">+7</text>
    <text x="233" y="213" fill="#5c6b76" font-weight="400" font-size="10.5">w3+e4</text>
    <text x="377" y="181" fill="#4169E1">+8</text>
    <text x="377" y="213" fill="#5c6b76" font-weight="400" font-size="10.5">w2+e6</text>
    <text x="464" y="138" fill="#5c6b76" text-anchor="start">+10</text>
    <text x="464" y="152" fill="#5c6b76" font-weight="400" font-size="10.5" text-anchor="start">w4+e6</text>
  </g>
  <text x="280" y="266" text-anchor="middle" fill="#1a2026" font-size="13">Charging each move its predecessor's wait plus its own entry, dp fills to</text>
  <text x="280" y="284" text-anchor="middle" fill="#1a2026" font-size="13">dp[1][2] = 8 + w 2 + e 6 = <tspan fill="#4169E1" font-weight="600">16</tspan> &#8212; waits are paid on departure, never at the start.</text>
</svg>
