<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums=[1,2,3], swaps=[[0,2],[1,2]]; graph nodes r=26 at (95,95),(245,95),(170,185); slots 72x58 at y=118, x=360/440/520 -->
  <text x="170" y="46" text-anchor="middle" fill="#5c6b76" font-size="12.5">swap graph of indices</text>
  <text x="476" y="46" text-anchor="middle" fill="#5c6b76" font-size="12.5">best arrangement in the component</text>
  <g stroke="#4169E1" stroke-width="2">
    <line x1="111" y1="114" x2="154" y2="166"/>
    <line x1="229" y1="114" x2="186" y2="166"/>
  </g>
  <text x="130" y="160" text-anchor="end" fill="#5c6b76" font-size="11.5">swap [0,2]</text>
  <text x="215" y="160" text-anchor="start" fill="#5c6b76" font-size="11.5">swap [1,2]</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <circle cx="95" cy="95" r="26"/><circle cx="245" cy="95" r="26"/><circle cx="170" cy="185" r="26"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="16" fill="#1a2026">
    <text x="95" y="100">1</text><text x="245" y="100">2</text><text x="170" y="190">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="76" y="140">i=0</text><text x="264" y="140">i=1</text><text x="208" y="190">i=2</text>
  </g>
  <rect x="88" y="216" width="164" height="28" rx="14" fill="#dbe4fb"/>
  <text x="170" y="235" text-anchor="middle" fill="#1a2026" font-size="12.5">one component {0, 1, 2}</text>
  <line x1="283" y1="150" x2="333" y2="150" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="309" y="172" text-anchor="middle" fill="#5c6b76" font-size="11.5">rearrange</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="396" y="108">i=0</text><text x="476" y="108">i=1</text><text x="556" y="108">i=2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="360" y="118" width="72" height="58" fill="#dbe4fb"/>
    <rect x="440" y="118" width="72" height="58" fill="#ffffff"/>
    <rect x="520" y="118" width="72" height="58" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="17">
    <text x="396" y="146" fill="#4169E1">2</text><text x="476" y="146" fill="#1a2026">1</text>
    <text x="556" y="146" fill="#4169E1">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="396" y="166">+ even</text><text x="476" y="166">&#8722; odd</text><text x="556" y="166">+ even</text>
  </g>
  <text x="476" y="208" text-anchor="middle" fill="#1a2026" font-size="14">2 &#8722; 1 + 3 = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  <text x="476" y="230" text-anchor="middle" fill="#5c6b76" font-size="11.5">2&#183;(3+2) &#8722; (1+2+3) = 10 &#8722; 6 = 4</text>
  <text x="320" y="276" text-anchor="middle" fill="#1a2026" font-size="13">Edges (0,2) and (1,2) merge all three indices, so values {1,2,3} rearrange freely;</text>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">the E = 2 largest values 3 and 2 take the even slots: 2 &#8722; 1 + 3 = <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
