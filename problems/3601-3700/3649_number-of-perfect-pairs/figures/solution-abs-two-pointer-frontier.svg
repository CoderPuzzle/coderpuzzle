<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 388" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="388" fill="#ffffff"/>
  <!-- sorted |nums| = [0,1,2,3]; slots 92x40, cols x = 188,280,372,464; anchor rows y = 136,184,232,280; accent dot = index counted for that anchor -->
  <text x="330" y="30" text-anchor="middle" fill="#5c6b76" font-size="13">sorted |nums| = [0, 1, 2, 3]</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="188" y="52" width="92" height="40"/><rect x="280" y="52" width="92" height="40"/><rect x="372" y="52" width="92" height="40"/><rect x="464" y="52" width="92" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="234" y="77">0</text><text x="326" y="77">1</text><text x="418" y="77">2</text><text x="510" y="77">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="234" y="110">k = 0</text><text x="326" y="110">k = 1</text><text x="418" y="110">k = 2</text><text x="510" y="110">k = 3</text>
  </g>
  <!-- anchor i = 0: bound 0, frontier j = 1, adds 0 -->
  <g font-size="12.5">
    <text x="30" y="153" fill="#1a2026" font-weight="600">i = 0</text>
    <text x="30" y="169" fill="#5c6b76" font-size="11">bound 2&#183;0 = 0</text>
  </g>
  <rect x="188" y="136" width="92" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2.2"/>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1">
    <rect x="280" y="136" width="92" height="40"/><rect x="372" y="136" width="92" height="40"/><rect x="464" y="136" width="92" height="40"/>
  </g>
  <text x="564" y="160" fill="#5c6b76" font-size="12.5">j = 1 &#183; +0</text>
  <!-- anchor i = 1: bound 2, frontier j = 3, adds 1 (k = 2) -->
  <g font-size="12.5">
    <text x="30" y="201" fill="#1a2026" font-weight="600">i = 1</text>
    <text x="30" y="217" fill="#5c6b76" font-size="11">bound 2&#183;1 = 2</text>
  </g>
  <rect x="188" y="184" width="92" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1"/>
  <rect x="280" y="184" width="92" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2.2"/>
  <rect x="372" y="184" width="92" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <circle cx="418" cy="204" r="4" fill="#4169E1"/>
  <rect x="464" y="184" width="92" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1"/>
  <text x="564" y="208" fill="#5c6b76" font-size="12.5">j = 3 &#183; <tspan fill="#4169E1" font-weight="600">+1</tspan></text>
  <!-- anchor i = 2: bound 4, frontier j = 4, adds 1 (k = 3) -->
  <g font-size="12.5">
    <text x="30" y="249" fill="#1a2026" font-weight="600">i = 2</text>
    <text x="30" y="265" fill="#5c6b76" font-size="11">bound 2&#183;2 = 4</text>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1">
    <rect x="188" y="232" width="92" height="40"/><rect x="280" y="232" width="92" height="40"/>
  </g>
  <rect x="372" y="232" width="92" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2.2"/>
  <rect x="464" y="232" width="92" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <circle cx="510" cy="252" r="4" fill="#4169E1"/>
  <text x="564" y="256" fill="#5c6b76" font-size="12.5">j = 4 &#183; <tspan fill="#4169E1" font-weight="600">+1</tspan></text>
  <!-- anchor i = 3: bound 6, frontier already at end, adds 0 -->
  <g font-size="12.5">
    <text x="30" y="297" fill="#1a2026" font-weight="600">i = 3</text>
    <text x="30" y="313" fill="#5c6b76" font-size="11">bound 2&#183;3 = 6</text>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1">
    <rect x="188" y="280" width="92" height="40"/><rect x="280" y="280" width="92" height="40"/><rect x="372" y="280" width="92" height="40"/>
  </g>
  <rect x="464" y="280" width="92" height="40" fill="#ffffff" stroke="#4169E1" stroke-width="2.2"/>
  <text x="564" y="304" fill="#5c6b76" font-size="12.5">j = 4 &#183; +0</text>
  <text x="330" y="352" text-anchor="middle" fill="#1a2026" font-size="13">Anchors i = 1 and i = 2 each add one pair &#8212; (1,2) and (2,3) &#8212;</text>
  <text x="330" y="372" text-anchor="middle" fill="#1a2026" font-size="13">so the sorted absolute values [0,1,2,3] hold <tspan fill="#4169E1" font-weight="600">2</tspan> perfect pairs.</text>
</svg>
