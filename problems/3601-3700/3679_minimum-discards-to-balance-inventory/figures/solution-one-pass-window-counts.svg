<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="310" fill="#ffffff"/>
  <!-- arrivals = [1,2,3,3,3,4], w = 3, m = 2. Day cells 64x50 at x = 70 + 82i (centers 102..512), y = 140.
       Greedy sweep: day 5 arrives with count(type 3) = 2 = m in window [3,5] -> discarded; day 6 enters after day 3 slides out (count 2 -> 1) -> kept. One discard total. -->
  <rect x="30" y="28" width="16" height="16" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="52" y="41" fill="#5c6b76" font-size="11">kept type-3 item</text>
  <rect x="180" y="28" width="16" height="16" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="202" y="41" fill="#5c6b76" font-size="11">discarded</text>
  <g stroke="#42525e" stroke-width="1.4" fill="none">
    <path d="M 234 92 H 462 M 234 92 V 98 M 462 92 V 98"/>
    <path d="M 316 118 H 544 M 316 118 V 124 M 544 118 V 124"/>
  </g>
  <text x="348" y="82" text-anchor="middle" fill="#5c6b76" font-size="11.5">window at day 5: days 3-5</text>
  <text x="430" y="110" text-anchor="middle" fill="#5c6b76" font-size="11.5">window at day 6: days 4-6</text>
  <text x="266" y="110" text-anchor="middle" fill="#9aa7b2" font-size="11">3 slides out: 2 → 1</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="102" y="136">day 1</text><text x="184" y="136">day 2</text><text x="266" y="136">day 3</text>
    <text x="348" y="136">day 4</text><text x="430" y="136">day 5</text><text x="512" y="136">day 6</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="70" y="140" width="64" height="50"/>
    <rect x="152" y="140" width="64" height="50"/>
    <rect x="480" y="140" width="64" height="50"/>
  </g>
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="234" y="140" width="64" height="50"/>
    <rect x="316" y="140" width="64" height="50"/>
  </g>
  <rect x="398" y="140" width="64" height="50" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-weight="600" font-size="16">
    <text x="102" y="171" fill="#1a2026">1</text>
    <text x="184" y="171" fill="#1a2026">2</text>
    <text x="266" y="171" fill="#1a2026">3</text>
    <text x="348" y="171" fill="#1a2026">3</text>
    <text x="430" y="171" fill="#9aa7b2">3</text>
    <text x="512" y="171" fill="#1a2026">4</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="102" y="210" fill="#5c6b76">keep</text>
    <text x="184" y="210" fill="#5c6b76">keep</text>
    <text x="266" y="210" fill="#5c6b76">keep</text>
    <text x="348" y="210" fill="#5c6b76">keep</text>
    <text x="430" y="210" fill="#4169E1" font-weight="600">discarded</text>
    <text x="512" y="210" fill="#5c6b76">keep</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="266" y="230">kept 3s: 0</text>
    <text x="348" y="230">kept 3s: 1</text>
    <text x="430" y="230">kept 3s: 2 = m</text>
    <text x="512" y="230">kept 3s: 1</text>
  </g>
  <text x="310" y="272" text-anchor="middle" fill="#1a2026" font-size="13">Day 5's window already holds two kept 3s (days 3-4), so the third 3 is</text>
  <text x="310" y="290" text-anchor="middle" fill="#1a2026" font-size="13">discarded; once day 3 slides out, day 6 keeps its type 4 — just <tspan fill="#4169E1" font-weight="600">1</tspan> discard.</text>
</svg>
