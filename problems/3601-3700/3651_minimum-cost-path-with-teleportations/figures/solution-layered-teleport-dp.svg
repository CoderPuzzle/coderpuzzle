<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[1,3,3],[2,5,4],[4,3,5]], k = 2; cells 50x38; layer0 = d[0], layer1 = d[1];
       walk (0,0)->(1,0)->(1,1) pays 2+5=7, teleport (1,1)->(2,2) free since 5 <= 5 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="117" y="82">grid</text>
    <text x="327" y="82">layer 0 · no teleport</text>
    <text x="527" y="82">layer 1 · one teleport</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="67" y="98">0</text><text x="117" y="98">1</text><text x="167" y="98">2</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="11">
    <text x="34" y="128">0</text><text x="34" y="166">1</text><text x="34" y="204">2</text>
  </g>
  <!-- grid values -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="42" y="104" width="50" height="38"/><rect x="92" y="104" width="50" height="38"/><rect x="142" y="104" width="50" height="38"/>
    <rect x="42" y="142" width="50" height="38"/><rect x="92" y="142" width="50" height="38"/><rect x="142" y="142" width="50" height="38"/>
    <rect x="42" y="180" width="50" height="38"/><rect x="92" y="180" width="50" height="38"/><rect x="142" y="180" width="50" height="38"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="67" y="128">1</text><text x="117" y="128">3</text><text x="167" y="128">3</text>
    <text x="67" y="166">2</text><text x="117" y="166">5</text><text x="167" y="166">4</text>
    <text x="67" y="204">4</text><text x="117" y="204">3</text><text x="167" y="204">5</text>
  </g>
  <!-- accented walk down then right, landing circle on (2,2) -->
  <polyline points="52,112 52,149 102,149" fill="none" stroke="#4169E1" stroke-width="3"/>
  <circle cx="52" cy="112" r="3" fill="#4169E1"/>
  <circle cx="102" cy="149" r="3" fill="#4169E1"/>
  <circle cx="167" cy="199" r="13" fill="none" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="3 3"/>
  <!-- free teleport arc, grid bottom under col 1 to (2,2) -->
  <path d="M 117 224 Q 142 258 167 222" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="117" cy="224" r="3" fill="#4169E1"/>
  <text x="142" y="274" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">teleport (1,1) → (2,2): 5 ≤ 5, cost 0</text>
  <!-- layer 0: d[0] = 0,3,6 / 2,7,10 / 6,9,14 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="252" y="104" width="50" height="38"/><rect x="302" y="104" width="50" height="38"/><rect x="352" y="104" width="50" height="38"/>
    <rect x="252" y="142" width="50" height="38"/><rect x="302" y="142" width="50" height="38"/><rect x="352" y="142" width="50" height="38"/>
    <rect x="252" y="180" width="50" height="38"/><rect x="302" y="180" width="50" height="38"/><rect x="352" y="180" width="50" height="38"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="277" y="128">0</text><text x="327" y="128">3</text><text x="377" y="128">6</text>
    <text x="277" y="166">2</text><text x="327" y="166" fill="#4169E1">7</text><text x="377" y="166">10</text>
    <text x="277" y="204">6</text><text x="327" y="204">9</text><text x="377" y="204">14</text>
  </g>
  <!-- layer 1: d[1] = 0,3,3 / 2,7,6 / 6,3,7 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="452" y="104" width="50" height="38"/><rect x="502" y="104" width="50" height="38"/><rect x="552" y="104" width="50" height="38"/>
    <rect x="452" y="142" width="50" height="38"/><rect x="502" y="142" width="50" height="38"/><rect x="552" y="142" width="50" height="38"/>
    <rect x="452" y="180" width="50" height="38"/><rect x="502" y="180" width="50" height="38"/><rect x="552" y="180" width="50" height="38"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="477" y="128">0</text><text x="527" y="128">3</text><text x="577" y="128">3</text>
    <text x="477" y="166">2</text><text x="527" y="166">7</text><text x="577" y="166">6</text>
    <text x="477" y="204">6</text><text x="527" y="204">3</text><text x="577" y="204" fill="#4169E1">7</text>
  </g>
  <text x="320" y="304" text-anchor="middle" fill="#1a2026" font-size="13">Layer 0 walks down then right to (1,1), paying <tspan fill="#4169E1" font-weight="600">2 + 5 = 7</tspan> along the accented route.</text>
  <text x="320" y="323" text-anchor="middle" fill="#1a2026" font-size="13">Layer 1 opens with the free teleport (5 ≤ 5) from (1,1) to (2,2), so d1(2,2) = <tspan fill="#4169E1" font-weight="600">7</tspan>;</text>
  <text x="320" y="342" text-anchor="middle" fill="#1a2026" font-size="13">layer 2 repeats layer 1, so the answer is <tspan fill="#4169E1" font-weight="600">7</tspan>.</text>
</svg>
