<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="348" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 3: n=4, edges 0-2, 0-3, 3-1, label = "bbac"; the DP seeds at centre 3 and appends the matching pair (0, 1); mask bits n3..n0 = 1,0,1,1 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="108" y1="98" x2="68" y2="142"/>
    <line x1="132" y1="97" x2="177" y2="143"/>
    <line x1="178" y1="167" x2="133" y2="209"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="56" cy="155" r="16"/><circle cx="120" cy="90" r="16"/><circle cx="120" cy="220" r="16"/>
    <circle cx="190" cy="155" r="16" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">
    <text x="56" y="160">2</text><text x="120" y="95">0</text><text x="120" y="225">1</text><text x="190" y="160">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="120" y="124">b</text><text x="56" y="189">a</text><text x="120" y="254">b</text><text x="190" y="189">c</text>
  </g>
  <text x="190" y="126" text-anchor="middle" fill="#4169E1" font-size="10.5">center</text>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 200 140 Q 218 100 141 86" marker-end="url(#arrow)"/>
    <path d="M 200 170 Q 218 210 141 224" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="10.5">
    <text x="232" y="104">new left end</text>
    <text x="232" y="220">new right end</text>
  </g>
  <!-- DP states -->
  <rect x="310" y="56" width="290" height="62" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="455" y="82" text-anchor="middle" fill="#1a2026">seed: mask {3}, endpoints l = r = 3</text>
  <text x="455" y="104" text-anchor="middle" fill="#5c6b76" font-size="12.5">path so far: "c" (length 1)</text>
  <line x1="370" y1="124" x2="370" y2="168" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g fill="#1a2026" font-size="12">
    <text x="392" y="140">append 0 (b) at the left end and</text>
    <text x="392" y="158">1 (b) at the right: labels <tspan fill="#4169E1" font-weight="600">b = b</tspan></text>
  </g>
  <rect x="310" y="176" width="290" height="62" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="455" y="202" text-anchor="middle" fill="#1a2026" font-weight="600">move: mask {0, 1, 3}, l = 0, r = 1</text>
  <text x="455" y="224" text-anchor="middle" fill="#1a2026">reads "<tspan fill="#4169E1" font-weight="600">bcb</tspan>" — a palindrome of length <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <!-- mask bits -->
  <text x="455" y="256" text-anchor="middle" fill="#5c6b76" font-size="10.5">mask bits for nodes 3, 2, 1, 0</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="385" y="264" width="26" height="22"/><rect x="423" y="264" width="26" height="22"/><rect x="461" y="264" width="26" height="22"/><rect x="499" y="264" width="26" height="22"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <text x="398" y="280" fill="#4169E1">1</text><text x="436" y="280" fill="#9aa7b2">0</text><text x="474" y="280" fill="#4169E1">1</text><text x="512" y="280" fill="#4169E1">1</text>
  </g>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">From centre 3 ("c") the DP appends the matching pair of b's, nodes 0 and 1:</text>
  <text x="320" y="336" text-anchor="middle" fill="#1a2026" font-size="13">mask {0, 1, 3} reads "<tspan fill="#4169E1" font-weight="600">bcb</tspan>" both ways, so the answer is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
