  <g font-size="12" text-anchor="middle">
    <text x="118" y="66" fill="#5c6b76">7</text>
    <text x="262" y="178" fill="#7a5a1e" font-weight="600">6</text>
    <text x="425" y="147" fill="#7a5a1e" font-weight="600">2</text>
    <text x="118" y="156" fill="#4169E1" font-weight="600">6</text>
  </g>
  <text x="355" y="62" fill="#5c6b76" font-size="12" text-anchor="middle">7 + 5 = 12, score 5</text>
  <text x="270" y="140" fill="#4169E1" font-weight="600" font-size="12" text-anchor="middle">6 + 6 = 12, score 6</text>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="60" y="148">src</text>
    <text x="500" y="78">dest</text>
  </g>
  <text x="350" y="242" fill="#7a5a1e" font-size="12" text-anchor="middle" font-weight="600">offline</text>
  <text x="310" y="266" text-anchor="middle" fill="#1a2026" font-size="13.5">0 → 2 → 4 costs 6 + 6 = 12 ≤ k and scores min(6, 6) = <tspan fill="#4169E1" font-weight="700">6</tspan>; node 3 is offline</text>
</svg>
