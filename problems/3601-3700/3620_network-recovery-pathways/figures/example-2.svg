<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 272" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[0,1,7],[1,4,5],[0,2,6],[2,3,6],[3,4,2],[2,4,6]], online = [t,t,t,f,t], k = 12; valid paths score 5 and 6, node 3 offline (verified by path enumeration) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b57f30"/>
    </marker>
  </defs>
  <line x1="79" y1="101.1" x2="191" y2="48.9" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="230.4" y1="44.9" x2="479.6" y2="105.1" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="230.8" y1="183" x2="329.2" y2="197" stroke="#b57f30" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowW)"/>
  <line x1="368" y1="189.2" x2="482" y2="120.8" stroke="#b57f30" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowW)"/>
