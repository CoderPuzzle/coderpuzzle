<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="304" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- n=3, edges [0,1,2] and [1,2,4], k=3; panels for t=4, t=2, t=0 centred at x=110,320,530; nodes r=15 at y=118; counts checked just before each time group merges -->
  <g text-anchor="middle" fill="#1a2026" font-size="14" font-weight="600">
    <text x="110" y="64">t = 4</text><text x="320" y="64">t = 2</text><text x="530" y="64">t = 0</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="110" y="84">both edges removed</text><text x="320" y="84">edge 0-1 removed</text><text x="530" y="84">nothing removed</text>
  </g>
  <!-- panel graphs -->
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="48" cy="118" r="15"/><circle cx="110" cy="118" r="15"/><circle cx="172" cy="118" r="15"/>
    <circle cx="258" cy="118" r="15"/><circle cx="320" cy="118" r="15"/><circle cx="382" cy="118" r="15"/>
    <circle cx="468" cy="118" r="15"/><circle cx="530" cy="118" r="15"/><circle cx="592" cy="118" r="15"/>
  </g>
  <g stroke="#42525e" stroke-width="2">
    <line x1="335" y1="118" x2="367" y2="118"/>
    <line x1="483" y1="118" x2="515" y2="118"/>
    <line x1="545" y1="118" x2="577" y2="118"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="351" y="108">4</text><text x="499" y="108">2</text><text x="561" y="108">4</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13.5" font-weight="600">
    <text x="48" y="123">0</text><text x="110" y="123">1</text><text x="172" y="123">2</text>
    <text x="258" y="123">0</text><text x="320" y="123">1</text><text x="382" y="123">2</text>
    <text x="468" y="123">0</text><text x="530" y="123">1</text><text x="592" y="123">2</text>
  </g>
  <!-- union arrows between panels -->
  <g stroke="#5c6b76" stroke-width="1.6" fill="none">
    <line x1="190" y1="118" x2="240" y2="118" marker-end="url(#arrow)"/>
    <line x1="400" y1="118" x2="450" y2="118" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="10.5">
    <text x="215" y="148">union 1-2 (t = 4)</text><text x="425" y="148">union 0-1 (t = 2)</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="110" y="176">components: <tspan font-weight="600">3</tspan></text>
    <text x="320" y="176">components: <tspan font-weight="600">2</tspan></text>
    <text x="530" y="176">components: <tspan font-weight="600">1</tspan></text>
  </g>
  <text x="110" y="198" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">3 ≥ k = 3 → answer 4</text>
  <text x="320" y="198" text-anchor="middle" fill="#9aa7b2" font-size="12.5">2 &lt; k = 3 → not feasible</text>
  <text x="530" y="198" text-anchor="middle" fill="#9aa7b2" font-size="12.5">1 &lt; k = 3 → answer stays 4</text>
  <text x="320" y="256" text-anchor="middle" fill="#1a2026" font-size="13">Edges union by descending time; the count is checked before each time group merges:</text>
  <text x="320" y="276" text-anchor="middle" fill="#1a2026" font-size="13">it first reaches k = 3 at <tspan fill="#4169E1" font-weight="600">t = 4</tspan> (three singletons), so the answer is <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
