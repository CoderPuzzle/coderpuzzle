<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="278" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- robots = [10,2], distance = [5,1], walls = [5,2,7]; sorted robots: 2 (d=1), 10 (d=5);
       left shots: robot 10 -> [max(10-5, 2+1), 10] = [5,10] (walls 5,7); robot 2 -> [1,2] (wall 2);
       number line: position p at x = 80 + 40p, line y = 170 -->
  <!-- leftward shots -->
  <text x="380" y="100" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">robot 10 fires left: [5, 10]</text>
  <rect x="280" y="108" width="200" height="14" fill="#dbe4fb"/>
  <path d="M 472 115 L 288 115" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="100" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">robot 2 fires left: [1, 2]</text>
  <rect x="120" y="108" width="40" height="14" fill="#dbe4fb"/>
  <path d="M 152 115 L 128 115" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="135" text-anchor="middle" fill="#5c6b76" font-size="11">clip: range p − d = 10 − 5 = 5 binds (prev robot + 1 = 3 looser)</text>
  <!-- walls (destroyed, all three) -->
  <g text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">
    <text x="160" y="146">2</text>
    <text x="280" y="146">5</text>
    <text x="360" y="146">7</text>
  </g>
  <g fill="#4169E1">
    <polygon points="153,151 167,151 160,162"/>
    <polygon points="273,151 287,151 280,162"/>
    <polygon points="353,151 367,151 360,162"/>
  </g>
  <!-- number line -->
  <line x1="80" y1="170" x2="570" y2="170" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1">
    <line x1="80" y1="166" x2="80" y2="174"/><line x1="160" y1="166" x2="160" y2="174"/>
    <line x1="240" y1="166" x2="240" y2="174"/><line x1="320" y1="166" x2="320" y2="174"/>
    <line x1="400" y1="166" x2="400" y2="174"/><line x1="480" y1="166" x2="480" y2="174"/>
    <line x1="560" y1="166" x2="560" y2="174"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="80" y="190">0</text><text x="160" y="190">2</text><text x="240" y="190">4</text>
    <text x="320" y="190">6</text><text x="400" y="190">8</text><text x="480" y="190">10</text>
    <text x="560" y="190">12</text>
  </g>
  <!-- robots -->
  <rect x="154" y="164" width="12" height="12" fill="#1a2026"/>
  <rect x="474" y="164" width="12" height="12" fill="#1a2026"/>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="160" y="212">robot 2 (d = 1)</text>
    <text x="480" y="212">robot 10 (d = 5)</text>
  </g>
  <text x="320" y="240" text-anchor="middle" fill="#1a2026" font-size="13">Robot 10 fires left over [5, 10] — range p − d = 5 binds (prev robot + 1 = 3 looser):</text>
  <text x="320" y="260" text-anchor="middle" fill="#1a2026" font-size="13">walls 5, 7 fall; robot 2 covers [1, 2], its own wall included — all <tspan fill="#4169E1" font-weight="600">3</tspan> walls fall.</text>
</svg>
