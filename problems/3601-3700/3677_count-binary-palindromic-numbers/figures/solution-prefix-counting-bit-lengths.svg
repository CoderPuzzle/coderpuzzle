<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="330" fill="#ffffff"/>
  <!-- n = 9 = "1001". Palindromes grouped by bit length L; cells 24x24 starting x=120 (pitch 28): accent = root (first ceil(L/2) bits), shaded = mirrored half.
       L1: 0 (special), 1; L2: 11 = 3; L3: 101 = 5, 111 = 7; L4: 1001 = 9 <= 9 (root 10 = n's root), 1111 = 15 > 9 out. Total 6. -->
  <rect x="420" y="24" width="16" height="16" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="442" y="37" fill="#5c6b76" font-size="11">root (first half, ceil(L/2) bits)</text>
  <rect x="420" y="46" width="16" height="16" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <text x="442" y="59" fill="#5c6b76" font-size="11">mirrored half</text>
  <g fill="#5c6b76" font-size="12.5">
    <text x="30" y="64">L = 1</text>
    <text x="30" y="124">L = 2</text>
    <text x="30" y="184">L = 3</text>
    <text x="30" y="244">L = 4</text>
  </g>
  <rect x="120" y="48" width="24" height="24" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="132" y="65" text-anchor="middle" font-weight="600" font-size="13" fill="#9aa7b2">0</text>
  <rect x="200" y="48" width="24" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
  <text x="212" y="65" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">1</text>
  <text x="152" y="65" text-anchor="middle" font-size="12.5" fill="#1a2026">0</text>
  <text x="232" y="65" text-anchor="middle" font-size="12.5" fill="#1a2026">1</text>
  <text x="120" y="90" fill="#9aa7b2" font-size="11">zero counts as a binary palindrome too</text>
  <g>
    <rect x="120" y="108" width="24" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="132" y="125" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">1</text>
    <rect x="148" y="108" width="24" height="24" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
    <text x="160" y="125" text-anchor="middle" font-weight="600" font-size="13" fill="#5c6b76">1</text>
    <text x="196" y="125" font-size="12.5" fill="#1a2026">= 3</text>
  </g>
  <g>
    <rect x="120" y="168" width="24" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="132" y="185" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">1</text>
    <rect x="148" y="168" width="24" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="160" y="185" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">0</text>
    <rect x="176" y="168" width="24" height="24" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
    <text x="188" y="185" text-anchor="middle" font-weight="600" font-size="13" fill="#5c6b76">1</text>
    <text x="224" y="185" font-size="12.5" fill="#1a2026">= 5</text>
    <rect x="320" y="168" width="24" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="332" y="185" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">1</text>
    <rect x="348" y="168" width="24" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="360" y="185" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">1</text>
    <rect x="376" y="168" width="24" height="24" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
    <text x="388" y="185" text-anchor="middle" font-weight="600" font-size="13" fill="#5c6b76">1</text>
    <text x="424" y="185" font-size="12.5" fill="#1a2026">= 7</text>
  </g>
  <g>
    <rect x="120" y="228" width="24" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="132" y="245" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">1</text>
    <rect x="148" y="228" width="24" height="24" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4"/>
    <text x="160" y="245" text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">0</text>
    <rect x="176" y="228" width="24" height="24" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
    <text x="188" y="245" text-anchor="middle" font-weight="600" font-size="13" fill="#5c6b76">0</text>
    <rect x="204" y="228" width="24" height="24" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
    <text x="216" y="245" text-anchor="middle" font-weight="600" font-size="13" fill="#5c6b76">1</text>
    <text x="252" y="245" font-size="12.5" font-weight="600" fill="#4169E1">= 9 ≤ 9</text>
    <rect x="320" y="228" width="24" height="24" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="332" y="245" text-anchor="middle" font-weight="600" font-size="13" fill="#9aa7b2">1</text>
    <rect x="348" y="228" width="24" height="24" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="360" y="245" text-anchor="middle" font-weight="600" font-size="13" fill="#9aa7b2">1</text>
    <rect x="376" y="228" width="24" height="24" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="388" y="245" text-anchor="middle" font-weight="600" font-size="13" fill="#9aa7b2">1</text>
    <rect x="404" y="228" width="24" height="24" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="416" y="245" text-anchor="middle" font-weight="600" font-size="13" fill="#9aa7b2">1</text>
    <text x="452" y="245" font-size="12.5" fill="#9aa7b2">= 15 &gt; 9</text>
  </g>
  <g fill="#9aa7b2" font-size="11">
    <text x="120" y="270">root 10 = n's root</text>
    <text x="320" y="270">root 11, out of range</text>
  </g>
  <text x="310" y="298" text-anchor="middle" fill="#1a2026" font-size="13">Zero, then 1 + 1 + 2 palindromes across lengths 1-3; at n's own length the</text>
  <text x="310" y="316" text-anchor="middle" fill="#1a2026" font-size="13">root 10 mirrors to 1001 = 9 ≤ 9 while 11 gives 15 — the count is <tspan fill="#4169E1" font-weight="600">6</tspan>.</text>
</svg>
