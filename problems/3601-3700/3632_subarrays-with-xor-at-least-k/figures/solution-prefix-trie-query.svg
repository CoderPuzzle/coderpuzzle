<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 374" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="374" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- prefix XORs of [3,1,2,3] are 0,3,2,0,3; trie shown after all five inserts (counts per node); levels are bits 2,1,0 (bits 29..3 all zero); accent walk = last query P=3 vs k=2: charge flipped subtree 000 (+2), branch 001 missing -->
  <text x="150" y="42" text-anchor="middle" fill="#5c6b76" font-size="11">root</text>
  <!-- edges -->
  <g stroke="#42525e" stroke-width="1.4">
    <line x1="150" y1="74" x2="150" y2="119"/>
    <line x1="137" y1="149" x2="107" y2="193"/>
    <line x1="163" y1="149" x2="213" y2="193"/>
    <line x1="83" y1="220" x2="72" y2="261"/>
    <line x1="213" y1="220" x2="194" y2="261"/>
    <line x1="237" y1="220" x2="256" y2="261"/>
  </g>
  <line x1="107" y1="220" x2="126" y2="258" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="160" y1="61" x2="236" y2="124" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 4"/>
  <g fill="#9aa7b2" font-size="10">
    <text x="158" y="98">0</text>
    <text x="112" y="166">0</text>
    <text x="196" y="166">1</text>
    <text x="64" y="244" text-anchor="end">0</text>
    <text x="123" y="241">1</text>
    <text x="190" y="246" text-anchor="end">0</text>
    <text x="256" y="246">1</text>
    <text x="203" y="87">1</text>
  </g>
  <g fill="#9aa7b2" font-size="12">
    <text x="133" y="272" text-anchor="middle">∅</text>
    <text x="246" y="133">∅</text>
  </g>
  <!-- query walk overlay -->
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <line x1="150" y1="74" x2="150" y2="119"/>
    <line x1="137" y1="149" x2="107" y2="193"/>
    <line x1="83" y1="220" x2="73" y2="255" marker-end="url(#arrow)"/>
  </g>
  <!-- nodes -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="150" cy="64" r="10"/>
    <circle cx="150" cy="136" r="17"/>
    <circle cx="95" cy="206" r="17"/>
    <circle cx="65" cy="276" r="17" stroke="#4169E1" stroke-width="2"/>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6">
    <circle cx="225" cy="206" r="17"/>
    <circle cx="185" cy="276" r="17"/>
    <circle cx="265" cy="276" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="150" y="68" font-size="10.5">5</text>
    <text x="150" y="140.5" font-size="12.5">5</text>
    <text x="95" y="210.5" font-size="12.5">2</text>
    <text x="65" y="280.5" font-size="12.5">2</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#9aa7b2" font-size="12.5">
    <text x="225" y="210.5">3</text>
    <text x="185" y="280.5">1</text>
    <text x="265" y="280.5">2</text>
  </g>
  <g fill="#5c6b76" font-size="10.5">
    <text x="186" y="140">0</text>
    <text x="66" y="211" text-anchor="end">00</text>
  </g>
  <g fill="#9aa7b2" font-size="10.5">
    <text x="250" y="211">01</text>
    <text x="65" y="310" text-anchor="middle">000</text>
    <text x="185" y="310" text-anchor="middle">010</text>
    <text x="265" y="310" text-anchor="middle">011</text>
  </g>
  <text x="28" y="274" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">+2</text>
  <g fill="#9aa7b2" font-size="11">
    <text x="300" y="140">bit 2</text>
    <text x="300" y="210">bit 1</text>
    <text x="300" y="280">bit 0</text>
  </g>
  <!-- legend for the last query -->
  <text x="340" y="88" fill="#1a2026" font-size="13.5" font-weight="600">query P[4] = 3 (011), k = 2 (010):</text>
  <g fill="#1a2026" font-size="12">
    <text x="340" y="112">bit 2 (k=0): flipped branch missing → +0</text>
    <text x="340" y="132">bit 1 (k=1): only branch 0 survives; the</text>
    <text x="340" y="152">    01 subtree gives XOR bit 0 &lt; 1 → 0</text>
    <text x="340" y="172">bit 0 (k=0): charge subtree 000 → <tspan font-weight="600">+2</tspan></text>
    <text x="340" y="192">    (prefix 0 twice: 0 ^ 3 = 3 ≥ 2)</text>
    <text x="340" y="212">branch 001 is missing → walk ends: +2</text>
  </g>
  <text x="340" y="236" fill="#5c6b76" font-size="11.5">counts per query: 0 + 1 + 1 + 2 + 2 = <tspan fill="#4169E1" font-weight="600">6</tspan></text>
  <text x="340" y="258" fill="#9aa7b2" font-size="10.5">(bits 29-3 are all zero here; bits 2-0 drawn)</text>
  <text x="320" y="332" text-anchor="middle" fill="#1a2026" font-size="13">Inserting each prefix then querying it: 0 + 1 + 1 + 2 + 2 = <tspan fill="#4169E1" font-weight="600">6</tspan> subarrays</text>
  <text x="320" y="354" text-anchor="middle" fill="#1a2026" font-size="13">with XOR ≥ k = 2 among nums = [3, 1, 2, 3].</text>
</svg>
