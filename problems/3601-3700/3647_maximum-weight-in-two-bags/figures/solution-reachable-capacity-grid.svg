<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="600" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- reachable (bag1, bag2) states for weights [1,4,3,2], w1=5, w2=4; cell = first item reaching it, 0 = start, dash = unreachable; 6x5 grid, cells 64x44 at (96,76) -->
  <text x="96" y="46" fill="#5c6b76" font-size="12.5">bag 1 used (i) &#8594;</text>
  <text x="40" y="186" text-anchor="middle" transform="rotate(-90 40 186)" fill="#5c6b76" font-size="12.5">bag 2 used (j) &#8595;</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="128" y="70">0</text><text x="192" y="70">1</text><text x="256" y="70">2</text><text x="320" y="70">3</text><text x="384" y="70">4</text><text x="448" y="70">5</text>
    <text x="82" y="102">0</text><text x="82" y="146">1</text><text x="82" y="190">2</text><text x="82" y="234">3</text><text x="82" y="278">4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2" fill="#dbe4fb">
    <rect x="96" y="76" width="64" height="44"/><rect x="160" y="76" width="64" height="44"/><rect x="224" y="76" width="64" height="44"/><rect x="288" y="76" width="64" height="44"/><rect x="352" y="76" width="64" height="44"/><rect x="416" y="76" width="64" height="44"/>
    <rect x="96" y="120" width="64" height="44"/><rect x="224" y="120" width="64" height="44"/><rect x="288" y="120" width="64" height="44"/><rect x="352" y="120" width="64" height="44"/><rect x="416" y="120" width="64" height="44"/>
    <rect x="96" y="164" width="64" height="44"/><rect x="160" y="164" width="64" height="44"/><rect x="288" y="164" width="64" height="44"/><rect x="352" y="164" width="64" height="44"/><rect x="416" y="164" width="64" height="44"/>
    <rect x="96" y="208" width="64" height="44"/><rect x="160" y="208" width="64" height="44"/><rect x="224" y="208" width="64" height="44"/><rect x="288" y="208" width="64" height="44"/><rect x="352" y="208" width="64" height="44"/><rect x="416" y="208" width="64" height="44"/>
    <rect x="96" y="252" width="64" height="44"/><rect x="160" y="252" width="64" height="44"/><rect x="224" y="252" width="64" height="44"/><rect x="288" y="252" width="64" height="44"/><rect x="352" y="252" width="64" height="44"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.2" fill="#f0f3f7">
    <rect x="160" y="120" width="64" height="44"/>
    <rect x="224" y="164" width="64" height="44"/>
  </g>
  <rect x="416" y="252" width="64" height="44" fill="#4169E1" stroke="#4169E1" stroke-width="1.2"/>
  <!-- cell numbers = first item to reach the state -->
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="128" y="103" fill="#5c6b76">0</text><text x="192" y="103" fill="#1a2026">1</text><text x="256" y="103" fill="#1a2026">4</text><text x="320" y="103" fill="#1a2026">3</text><text x="384" y="103" fill="#1a2026">2</text><text x="448" y="103" fill="#1a2026">2</text>
    <text x="128" y="147" fill="#1a2026">1</text><text x="256" y="147" fill="#1a2026">4</text><text x="320" y="147" fill="#1a2026">3</text><text x="384" y="147" fill="#1a2026">2</text><text x="448" y="147" fill="#1a2026">4</text>
    <text x="128" y="191" fill="#1a2026">4</text><text x="192" y="191" fill="#1a2026">4</text><text x="320" y="191" fill="#1a2026">4</text><text x="384" y="191" fill="#1a2026">4</text><text x="448" y="191" fill="#1a2026">4</text>
    <text x="128" y="235" fill="#1a2026">3</text><text x="192" y="235" fill="#1a2026">3</text><text x="256" y="235" fill="#1a2026">4</text><text x="320" y="235" fill="#1a2026">4</text><text x="384" y="235" fill="#1a2026">3</text><text x="448" y="235" fill="#1a2026">3</text>
    <text x="128" y="279" fill="#1a2026">2</text><text x="192" y="279" fill="#1a2026">2</text><text x="256" y="279" fill="#1a2026">4</text><text x="320" y="279" fill="#1a2026">3</text><text x="384" y="279" fill="#1a2026">3</text>
  </g>
  <g text-anchor="middle" font-size="15" fill="#9aa7b2">
    <text x="192" y="147">&#8211;</text>
    <text x="256" y="191">&#8211;</text>
  </g>
  <text x="448" y="279" text-anchor="middle" font-weight="600" font-size="15" fill="#ffffff">4</text>
  <path d="M 484 274 H 508" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrowA)"/>
  <text x="514" y="270" fill="#4169E1" font-size="12.5" font-weight="600">state (5,4)</text>
  <text x="514" y="286" fill="#1a2026" font-size="12.5">5 + 4 = 9</text>
  <text x="288" y="318" text-anchor="middle" fill="#5c6b76" font-size="12">each item: leave it out &#183; i + w &#8804; 5 into bag 1 &#183; j + w &#8804; 4 into bag 2</text>
  <text x="300" y="344" text-anchor="middle" fill="#1a2026" font-size="13">After all of [1,4,3,2], every capacity pair except (1,1) and (2,2) is reachable;</text>
  <text x="300" y="364" text-anchor="middle" fill="#1a2026" font-size="13">the far corner (bag 1 = 5, bag 2 = 4) sums to the answer <tspan fill="#4169E1" font-weight="600">9</tspan>.</text>
</svg>
