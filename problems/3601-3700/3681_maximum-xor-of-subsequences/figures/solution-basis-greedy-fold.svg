<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="322" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [1,2,3] = 01,10,11; basis: slot bit 1 = 10 (from 2), slot bit 0 = 01 (from 1);
       3 = 11 reduces 11^10 = 01 then 01^01 = 00; greedy fold ans 0 -> 2 -> 3 -->
  <text x="40" y="48" fill="#5c6b76" font-size="12">nums</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="40" y="56" width="56" height="44"/><rect x="104" y="56" width="56" height="44"/><rect x="168" y="56" width="56" height="44"/>
  </g>
  <g text-anchor="middle">
    <text x="68" y="77" font-weight="600">1</text><text x="132" y="77" font-weight="600">2</text><text x="196" y="77" font-weight="600">3</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="68" y="94">01</text><text x="132" y="94">10</text><text x="196" y="94">11</text>
  </g>
  <text x="300" y="48" fill="#5c6b76" font-size="12">basis slots (bits 29-2 stay empty)</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="300" y="56" width="110" height="40"/><rect x="440" y="56" width="110" height="40"/>
  </g>
  <g fill="#5c6b76" font-size="10.5">
    <text x="308" y="70">bit 1</text><text x="448" y="70">bit 0</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="355" y="82">10</text><text x="495" y="82">01</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="355" y="112">insert 2 lands here</text><text x="495" y="112">insert 1 lands here</text>
  </g>
  <!-- inserting 3 = 11 -->
  <text x="40" y="163" fill="#5c6b76" font-size="12">insert 3 = 11:</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="170" y="140" width="46" height="36"/><rect x="280" y="140" width="46" height="36"/><rect x="390" y="140" width="46" height="36"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="193" y="163">11</text><text x="303" y="163">01</text><text x="413" y="163">00</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 222 158 H 277" marker-end="url(#arrow)"/>
    <path d="M 332 158 H 387" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="248" y="148">&#8853; 10</text><text x="358" y="148">&#8853; 01</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="303" y="192">leading bit 0</text><text x="413" y="192">collapses: nothing new</text>
  </g>
  <!-- greedy fold -->
  <text x="40" y="231" fill="#5c6b76" font-size="12">greedy fold:</text>
  <rect x="170" y="208" width="46" height="36" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="280" y="208" width="46" height="36" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="390" y="208" width="46" height="36" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="193" y="231">0</text><text x="303" y="231">2</text><text x="413" y="231" fill="#4169E1">3</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 222 226 H 277" marker-end="url(#arrow)"/>
    <path d="M 332 226 H 387" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="11.5" font-weight="600">
    <text x="248" y="216">&#8853; 10</text><text x="358" y="216">&#8853; 01</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="248" y="260">2 &gt; 0: absorb</text><text x="358" y="260">3 &gt; 2: absorb</text>
  </g>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">Folding the basis greedily from the top bit, absorbing a slot only when it</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">grows ans: 0 &#8594; 2 &#8594; 3. The maximum subset XOR of [1, 2, 3] is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
