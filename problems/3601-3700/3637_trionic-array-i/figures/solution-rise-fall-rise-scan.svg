<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="310" fill="#ffffff"/>
  <!-- nums = [1,3,5,4,2,6]; points x = 70 + 104i, y = 210 - 32*(v-1); rise #4169E1, fall #42525e -->
  <text x="70" y="24" fill="#5c6b76" font-size="12.5">nums = [1, 3, 5, 4, 2, 6]</text>
  <!-- axis -->
  <line x1="50" y1="222" x2="610" y2="222" stroke="#9aa7b2" stroke-width="1"/>
  <!-- drop lines from peak and valley -->
  <line x1="278" y1="82" x2="278" y2="222" stroke="#9aa7b2" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="486" y1="178" x2="486" y2="222" stroke="#9aa7b2" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- rises in accent, falls in dark gray -->
  <line x1="70" y1="210" x2="174" y2="146" stroke="#4169E1" stroke-width="2.5"/>
  <line x1="174" y1="146" x2="278" y2="82" stroke="#4169E1" stroke-width="2.5"/>
  <line x1="278" y1="82" x2="382" y2="114" stroke="#42525e" stroke-width="2.5"/>
  <line x1="382" y1="114" x2="486" y2="178" stroke="#42525e" stroke-width="2.5"/>
  <line x1="486" y1="178" x2="590" y2="50" stroke="#4169E1" stroke-width="2.5"/>
  <!-- stretch labels -->
  <g text-anchor="middle" font-size="12">
    <text x="112" y="164" fill="#4169E1">rise</text>
    <text x="330" y="86" fill="#5c6b76">fall</text>
    <text x="434" y="166" fill="#5c6b76">fall</text>
    <text x="538" y="100" fill="#4169E1">rise</text>
  </g>
  <!-- values -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="70" y="198">1</text><text x="174" y="134">3</text><text x="382" y="102">4</text><text x="590" y="38">6</text>
    <text x="298" y="86">5</text><text x="464" y="182">2</text>
  </g>
  <!-- points -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="70" cy="210" r="4"/><circle cx="174" cy="146" r="4"/><circle cx="382" cy="114" r="4"/><circle cx="590" cy="50" r="4"/>
  </g>
  <circle cx="278" cy="82" r="5.5" fill="#4169E1"/>
  <circle cx="486" cy="178" r="5.5" fill="#4169E1"/>
  <text x="278" y="62" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">peak p = 2</text>
  <text x="486" y="206" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">valley q = 4</text>
  <!-- indices -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="70" y="244">0</text><text x="174" y="244">1</text><text x="382" y="244">3</text><text x="590" y="244">5</text>
  </g>
  <text x="278" y="245" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">2</text>
  <text x="486" y="245" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">4</text>
  <text x="320" y="276" text-anchor="middle" fill="#1a2026" font-size="13">One scan: the rise ends at the peak <tspan fill="#4169E1" font-weight="600">p = 2</tspan> (value 5), the fall ends at</text>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">the valley <tspan fill="#4169E1" font-weight="600">q = 4</tspan> (value 2), and the final rise reaches the last index — trionic.</text>
</svg>
