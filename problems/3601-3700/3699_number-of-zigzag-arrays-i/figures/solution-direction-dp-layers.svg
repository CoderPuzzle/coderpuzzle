<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="332" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- n=3, l=1, r=3; rows = up[1..3] then down[1..3] at len 1/2/3; cells 44x34 at x=150/194/238 and 330/374/418 -->
  <text x="216" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">up</text>
  <text x="376" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5" font-weight="600">down</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="172" y="62">1</text><text x="216" y="62">2</text><text x="260" y="62">3</text>
    <text x="352" y="62">1</text><text x="396" y="62">2</text><text x="440" y="62">3</text>
  </g>
  <text x="104" y="93" text-anchor="middle" fill="#5c6b76" font-size="12">len 1</text>
  <text x="104" y="171" text-anchor="middle" fill="#5c6b76" font-size="12">len 2</text>
  <text x="104" y="249" text-anchor="middle" fill="#5c6b76" font-size="12">len 3</text>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="150" y="72" width="44" height="34"/><rect x="194" y="72" width="44" height="34"/><rect x="238" y="72" width="44" height="34"/>
    <rect x="330" y="72" width="44" height="34"/><rect x="374" y="72" width="44" height="34"/><rect x="418" y="72" width="44" height="34"/>
    <rect x="150" y="150" width="44" height="34"/><rect x="194" y="150" width="44" height="34"/><rect x="238" y="150" width="44" height="34"/>
    <rect x="330" y="150" width="44" height="34"/><rect x="374" y="150" width="44" height="34"/><rect x="418" y="150" width="44" height="34"/>
    <rect x="150" y="228" width="44" height="34"/><rect x="194" y="228" width="44" height="34"/><rect x="238" y="228" width="44" height="34"/>
    <rect x="330" y="228" width="44" height="34"/><rect x="374" y="228" width="44" height="34"/><rect x="418" y="228" width="44" height="34"/>
  </g>
  <g text-anchor="middle" font-size="14">
    <text x="172" y="94" fill="#1a2026">1</text><text x="216" y="94" fill="#1a2026">1</text><text x="260" y="94" fill="#1a2026">1</text>
    <text x="352" y="94" fill="#1a2026">1</text><text x="396" y="94" fill="#1a2026">1</text><text x="440" y="94" fill="#1a2026">1</text>
    <text x="172" y="172" fill="#9aa7b2">0</text><text x="216" y="172" fill="#1a2026">1</text><text x="260" y="172" fill="#1a2026">2</text>
    <text x="352" y="172" fill="#1a2026">2</text><text x="396" y="172" fill="#1a2026">1</text><text x="440" y="172" fill="#9aa7b2">0</text>
    <text x="172" y="250" fill="#9aa7b2">0</text><text x="216" y="250" fill="#4169E1" font-weight="600">2</text><text x="260" y="250" fill="#4169E1" font-weight="600">3</text>
    <text x="352" y="250" fill="#4169E1" font-weight="600">3</text><text x="396" y="250" fill="#4169E1" font-weight="600">2</text><text x="440" y="250" fill="#9aa7b2">0</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="286" y1="117" x2="324" y2="117" marker-end="url(#arrow)"/>
    <line x1="324" y1="139" x2="286" y2="139" marker-end="url(#arrow)"/>
    <line x1="286" y1="195" x2="324" y2="195" marker-end="url(#arrow)"/>
    <line x1="324" y1="217" x2="286" y2="217" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="305" y="111">x &gt; y</text><text x="305" y="133">x &lt; y</text>
    <text x="305" y="189">x &gt; y</text><text x="305" y="211">x &lt; y</text>
  </g>
  <line x1="464" y1="249" x2="484" y2="249" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <rect x="492" y="236" width="90" height="26" rx="13" fill="#dbe4fb"/>
  <text x="537" y="254" text-anchor="middle" fill="#1a2026" font-size="13">total = <tspan fill="#4169E1" font-weight="600">10</tspan></text>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Every value seeds both tables at length 1; each layer reapplies the two range sums,</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">and the last layer holds 0+2+3 rising-ending and 3+2+0 falling-ending arrays: <tspan fill="#4169E1" font-weight="600">10</tspan> zigzags.</text>
</svg>
