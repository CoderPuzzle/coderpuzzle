<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="440" fill="#ffffff"/>
  <!-- n=5, m=5, k=1, s = 2k+1 = 3; cells 60x60 at (60,70); sensors at strip centers (1,1),(1,4),(4,1),(4,4); coverage squares clip at the borders -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="90" y="62">0</text><text x="150" y="62">1</text><text x="210" y="62">2</text><text x="270" y="62">3</text><text x="330" y="62">4</text>
    <text x="48" y="104">0</text><text x="48" y="164">1</text><text x="48" y="224">2</text><text x="48" y="284">3</text><text x="48" y="344">4</text>
  </g>
  <rect x="60" y="70" width="300" height="300" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.2">
    <path d="M 120 70 V 370 M 180 70 V 370 M 240 70 V 370 M 300 70 V 370"/>
    <path d="M 60 130 H 360 M 60 190 H 360 M 60 250 H 360 M 60 310 H 360"/>
  </g>
  <!-- clipped side-3 coverage squares, one per strip intersection -->
  <g fill="#dbe4fb" fill-opacity="0.55" stroke="#4169E1" stroke-width="2">
    <rect x="60" y="70" width="180" height="180"/>
    <rect x="240" y="70" width="120" height="180"/>
    <rect x="60" y="250" width="180" height="120"/>
    <rect x="240" y="250" width="120" height="120"/>
  </g>
  <g>
    <circle cx="150" cy="160" r="10" fill="#4169E1" stroke="#ffffff" stroke-width="2"/><circle cx="150" cy="160" r="3.5" fill="#ffffff"/>
    <circle cx="330" cy="160" r="10" fill="#4169E1" stroke="#ffffff" stroke-width="2"/><circle cx="330" cy="160" r="3.5" fill="#ffffff"/>
    <circle cx="150" cy="340" r="10" fill="#4169E1" stroke="#ffffff" stroke-width="2"/><circle cx="150" cy="340" r="3.5" fill="#ffffff"/>
    <circle cx="330" cy="340" r="10" fill="#4169E1" stroke="#ffffff" stroke-width="2"/><circle cx="330" cy="340" r="3.5" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="10.5" font-weight="600">
    <text x="150" y="184">(1,1)</text><text x="330" y="184">(1,4)</text>
    <text x="150" y="364">(4,1)</text><text x="330" y="364">(4,4)</text>
  </g>
  <text x="400" y="112" fill="#1a2026" font-size="13.5">s = 2&#183;k + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="400" y="142" fill="#5c6b76" font-size="12.5">row strips 0-2, 3-4</text>
  <text x="400" y="166" fill="#5c6b76" font-size="12.5">col strips 0-2, 3-4</text>
  <text x="400" y="202" fill="#1a2026" font-size="13.5">ceil(5/3) &#183; ceil(5/3) = 2 &#183; 2 = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  <text x="400" y="238" fill="#5c6b76" font-size="12">dot = sensor at a strip</text>
  <text x="400" y="258" fill="#5c6b76" font-size="12">center; squares clip at borders</text>
  <text x="320" y="404" text-anchor="middle" fill="#1a2026" font-size="13">Four side-3 sensor squares tile the 5 &#215; 5 grid of Example 1,</text>
  <text x="320" y="424" text-anchor="middle" fill="#1a2026" font-size="13">clipped at the borders &#8212; the minimum is <tspan fill="#4169E1" font-weight="600">4</tspan> sensors.</text>
</svg>
