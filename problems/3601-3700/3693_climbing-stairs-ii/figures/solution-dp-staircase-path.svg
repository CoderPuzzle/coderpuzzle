<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="322" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- n = 4, costs = [1,2,3,4]; step boxes 88x40 at x = 44 + 108j, y = 190 - 34j;
       dp fills 0, 2, 5, 9, 13; optimal path 0->1->2->4 with jump costs 2, 3, 8 -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="44" y="190" width="88" height="40"/><rect x="152" y="156" width="88" height="40"/><rect x="260" y="122" width="88" height="40"/>
    <rect x="368" y="88" width="88" height="40"/><rect x="476" y="54" width="88" height="40"/>
  </g>
  <g text-anchor="middle">
    <text x="88" y="206" fill="#5c6b76" font-size="11">step 0</text><text x="196" y="172" fill="#5c6b76" font-size="11">step 1</text>
    <text x="304" y="138" fill="#5c6b76" font-size="11">step 2</text><text x="412" y="104" fill="#5c6b76" font-size="11">step 3</text>
    <text x="520" y="70" fill="#5c6b76" font-size="11">step 4</text>
    <text x="88" y="223" font-weight="600">free</text><text x="196" y="189" font-weight="600">cost 1</text>
    <text x="304" y="155" font-weight="600">cost 2</text><text x="412" y="121" font-weight="600">cost 3</text>
    <text x="520" y="87" font-weight="600">cost 4</text>
  </g>
  <!-- optimal jumps -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 88 184 Q 142 126, 196 150" marker-end="url(#arrow)"/>
    <path d="M 196 150 Q 250 92, 304 116" marker-end="url(#arrow)"/>
    <path d="M 304 116 Q 412 12, 520 48" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="142" y="136">costs[1] + 1&#178; = 2</text>
    <text x="250" y="102">costs[2] + 1&#178; = 3</text>
    <text x="412" y="36">costs[4] + 2&#178; = 8</text>
  </g>
  <!-- dp row -->
  <g text-anchor="middle" font-size="13">
    <text x="88" y="252"><tspan fill="#5c6b76">dp = </tspan><tspan fill="#4169E1" font-weight="600">0</tspan></text>
    <text x="196" y="218"><tspan fill="#5c6b76">dp = </tspan><tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="304" y="184"><tspan fill="#5c6b76">dp = </tspan><tspan fill="#4169E1" font-weight="600">5</tspan></text>
    <text x="412" y="150"><tspan fill="#5c6b76">dp = </tspan><tspan fill="#4169E1" font-weight="600">9</tspan></text>
    <text x="520" y="116"><tspan fill="#5c6b76">dp = </tspan><tspan fill="#4169E1" font-weight="600">13</tspan></text>
  </g>
  <text x="520" y="136" text-anchor="middle" fill="#5c6b76" font-size="11">(min of 14, 13, 15)</text>
  <text x="320" y="290" text-anchor="middle" fill="#1a2026" font-size="13">dp[j] = min over d = 1..3 of dp[j&#8722;d] + costs[j] + d&#178;, filled left to right;</text>
  <text x="320" y="308" text-anchor="middle" fill="#1a2026" font-size="13">the accented hops 0 &#8594; 1 &#8594; 2 &#8594; 4 with jumps 1, 1, 2 pay 2 + 3 + 8 = <tspan fill="#4169E1" font-weight="600">13</tspan>.</text>
</svg>
