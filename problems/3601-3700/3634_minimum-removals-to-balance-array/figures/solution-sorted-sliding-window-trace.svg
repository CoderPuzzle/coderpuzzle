<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <!-- sorted nums = [1,2,6,9], k = 3; snapshot cells 52x34 at x = 60 + 58col, rows y = 56/136/216; window cells #dbe4fb -->
  <text x="320" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">sorted nums = [1, 2, 6, 9],  k = 3</text>
  <!-- snapshot j = 1: window [1, 2] -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="56" width="52" height="34" fill="#dbe4fb"/><rect x="118" y="56" width="52" height="34" fill="#dbe4fb"/>
    <rect x="176" y="56" width="52" height="34" fill="#f0f3f7"/><rect x="234" y="56" width="52" height="34" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="86" y="78" fill="#1a2026">1</text><text x="144" y="78" fill="#1a2026">2</text>
    <text x="202" y="78" fill="#9aa7b2">6</text><text x="260" y="78" fill="#9aa7b2">9</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="86" y="106">i = 0</text><text x="144" y="106">j = 1</text>
  </g>
  <text x="320" y="78" fill="#1a2026" font-size="12.5">2 ≤ 1·3 = 3 ✓  length 2</text>
  <!-- snapshot j = 2: 6 > 1*3 so i advances; window [2, 6] -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="136" width="52" height="34" fill="#f0f3f7"/><rect x="118" y="136" width="52" height="34" fill="#dbe4fb"/>
    <rect x="176" y="136" width="52" height="34" fill="#dbe4fb"/><rect x="234" y="136" width="52" height="34" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="86" y="158" fill="#9aa7b2">1</text><text x="144" y="158" fill="#1a2026">2</text>
    <text x="202" y="158" fill="#1a2026">6</text><text x="260" y="158" fill="#9aa7b2">9</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="144" y="186">i = 1</text><text x="202" y="186">j = 2</text>
  </g>
  <text x="320" y="156" fill="#5c6b76" font-size="12.5">6 > 1·3 = 3 ✗ → i advances</text>
  <text x="320" y="176" fill="#1a2026" font-size="12.5">6 ≤ 2·3 = 6 ✓  length 2</text>
  <!-- snapshot j = 3: 9 > 2*3 so i advances; window [6, 9] -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="60" y="216" width="52" height="34" fill="#f0f3f7"/><rect x="118" y="216" width="52" height="34" fill="#f0f3f7"/>
    <rect x="176" y="216" width="52" height="34" fill="#dbe4fb"/><rect x="234" y="216" width="52" height="34" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="86" y="238" fill="#9aa7b2">1</text><text x="144" y="238" fill="#9aa7b2">2</text>
    <text x="202" y="238" fill="#1a2026">6</text><text x="260" y="238" fill="#1a2026">9</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11">
    <text x="202" y="266">i = 2</text><text x="260" y="266">j = 3</text>
  </g>
  <text x="320" y="236" fill="#5c6b76" font-size="12.5">9 > 2·3 = 6 ✗ → i advances</text>
  <text x="320" y="256" fill="#1a2026" font-size="12.5">9 ≤ 6·3 = 18 ✓  length 2</text>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">No window of sorted [1,2,6,9] balances past 2 elements (6 > 1·3, 9 > 2·3):</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">the longest balanced window is <tspan fill="#4169E1" font-weight="600">[2,6]</tspan>, so the answer is 4 − 2 = <tspan fill="#4169E1" font-weight="600">2</tspan> deletions.</text>
</svg>
