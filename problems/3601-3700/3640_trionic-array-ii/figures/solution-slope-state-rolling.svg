<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [0,-2,-1,-3,0,2,-1]; cols x = 90 + 72i (centers 126 + 72i); rows s0/s1/s2/best at y = 150/182/214/246; "-" = sentinel-unreachable -->
  <text x="342" y="38" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">trionic [1..5]: rise, fall, rise</text>
  <path d="M 162 58 v -6 h 360 v 6" stroke="#4169E1" stroke-width="2" fill="none"/>
  <!-- nums row with index inside each cell -->
  <g stroke="#42525e" stroke-width="1.4">
    <rect x="90" y="60" width="72" height="44" fill="#f0f3f7"/><rect x="162" y="60" width="72" height="44" fill="#dbe4fb"/>
    <rect x="234" y="60" width="72" height="44" fill="#dbe4fb"/><rect x="306" y="60" width="72" height="44" fill="#dbe4fb"/>
    <rect x="378" y="60" width="72" height="44" fill="#dbe4fb"/><rect x="450" y="60" width="72" height="44" fill="#dbe4fb"/>
    <rect x="522" y="60" width="72" height="44" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="126" y="76">i = 0</text><text x="198" y="76">i = 1</text><text x="270" y="76">i = 2</text><text x="342" y="76">i = 3</text>
    <text x="414" y="76">i = 4</text><text x="486" y="76">i = 5</text><text x="558" y="76">i = 6</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14.5">
    <text x="126" y="98" fill="#9aa7b2">0</text><text x="198" y="98" fill="#1a2026">-2</text><text x="270" y="98" fill="#1a2026">-1</text>
    <text x="342" y="98" fill="#1a2026">-3</text><text x="414" y="98" fill="#1a2026">0</text><text x="486" y="98" fill="#1a2026">2</text>
    <text x="558" y="98" fill="#9aa7b2">-1</text>
  </g>
  <!-- step slopes: rise accent, fall muted -->
  <g stroke-width="1.8" fill="none">
    <line x1="138" y1="115" x2="186" y2="115" stroke="#9aa7b2" marker-end="url(#arrowB)"/>
    <line x1="210" y1="115" x2="258" y2="115" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <line x1="282" y1="115" x2="330" y2="115" stroke="#9aa7b2" marker-end="url(#arrowB)"/>
    <line x1="354" y1="115" x2="402" y2="115" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <line x1="426" y1="115" x2="474" y2="115" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <line x1="498" y1="115" x2="546" y2="115" stroke="#9aa7b2" marker-end="url(#arrowB)"/>
  </g>
  <!-- rolling state rows -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="70" y="150">s0</text><text x="70" y="182">s1</text><text x="70" y="214">s2</text><text x="70" y="246">best</text>
  </g>
  <g stroke="#dbe4fb" stroke-width="1">
    <line x1="90" y1="160" x2="594" y2="160"/><line x1="90" y1="192" x2="594" y2="192"/>
    <line x1="90" y1="224" x2="594" y2="224"/><line x1="90" y1="256" x2="594" y2="256"/>
  </g>
  <rect x="442" y="197" width="88" height="26" rx="6" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="126" y="150" fill="#9aa7b2">-</text><text x="198" y="150" fill="#9aa7b2">-</text><text x="270" y="150" fill="#1a2026">-3</text><text x="342" y="150" fill="#9aa7b2">-</text><text x="414" y="150" fill="#1a2026">-3</text><text x="486" y="150" fill="#1a2026">2</text><text x="558" y="150" fill="#9aa7b2">-</text>
    <text x="126" y="182" fill="#9aa7b2">-</text><text x="198" y="182" fill="#9aa7b2">-</text><text x="270" y="182" fill="#9aa7b2">-</text><text x="342" y="182" fill="#1a2026">-6</text><text x="414" y="182" fill="#9aa7b2">-</text><text x="486" y="182" fill="#9aa7b2">-</text><text x="558" y="182" fill="#1a2026">1</text>
    <text x="126" y="214" fill="#9aa7b2">-</text><text x="198" y="214" fill="#9aa7b2">-</text><text x="270" y="214" fill="#9aa7b2">-</text><text x="342" y="214" fill="#9aa7b2">-</text><text x="414" y="214" fill="#1a2026">-6</text><text x="486" y="214" fill="#4169E1">-4</text><text x="558" y="214" fill="#9aa7b2">-</text>
    <text x="126" y="246" fill="#9aa7b2">-</text><text x="198" y="246" fill="#9aa7b2">-</text><text x="270" y="246" fill="#9aa7b2">-</text><text x="342" y="246" fill="#9aa7b2">-</text><text x="414" y="246" fill="#1a2026">-6</text><text x="486" y="246" fill="#4169E1">-4</text><text x="558" y="246" fill="#1a2026">-4</text>
  </g>
  <text x="320" y="288" text-anchor="middle" fill="#1a2026" font-size="13">The rolling states complete the trionic [-2,-1,-3,0,2] with <tspan fill="#4169E1" font-weight="600">s2 = -4</tspan> at i = 5,</text>
  <text x="320" y="310" text-anchor="middle" fill="#1a2026" font-size="13">and no later state beats it — the maximum trionic sum is <tspan fill="#4169E1" font-weight="600">-4</tspan>.</text>
</svg>
