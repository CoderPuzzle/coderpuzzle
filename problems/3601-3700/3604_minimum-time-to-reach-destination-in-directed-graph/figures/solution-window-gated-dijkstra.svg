<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- n=4 edges [[0,1,0,3],[1,3,7,8],[0,2,1,5],[2,3,4,7]]; graph on top, time axis below (60px per unit from x=80); tinted bars = open windows of the winning edges; accent dots = arrivals Dijkstra settles (t=2 node 2, t=5 node 3) -->
  <g fill="none" stroke-width="2">
    <path d="M 80 80 L 218 80" stroke="#4169E1" marker-end="url(#arrow)"/>
    <path d="M 240 80 L 378 80" stroke="#4169E1" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#5c6b76" stroke-width="1.5">
    <path d="M 97 91 L 223 169" marker-end="url(#arrowg)"/>
    <path d="M 257 169 L 383 91" marker-end="url(#arrowg)"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="80" cy="80" r="20"/>
    <circle cx="240" cy="80" r="20"/>
  </g>
  <circle cx="400" cy="80" r="20" fill="#4169E1"/>
  <circle cx="240" cy="180" r="20" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="80" y="85" fill="#1a2026">0</text>
    <text x="240" y="85" fill="#1a2026">2</text>
    <text x="400" y="85" fill="#ffffff">3</text>
    <text x="240" y="185" fill="#5c6b76">1</text>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="160" y="62" fill="#4169E1" font-weight="600">0&#8594;2 [1,5]</text>
    <text x="320" y="62" fill="#4169E1" font-weight="600">2&#8594;3 [4,7]</text>
    <text x="128" y="148" fill="#5c6b76">0&#8594;1 [0,3]</text>
    <text x="365" y="140" fill="#5c6b76">1&#8594;3 [7,8]</text>
    <text x="80" y="116" fill="#5c6b76">t = 0</text>
    <text x="240" y="116" fill="#4169E1" font-weight="600">settled t = 2</text>
    <text x="400" y="116" fill="#4169E1" font-weight="600">settled t = 5</text>
    <text x="240" y="216" fill="#5c6b76">reached t = 1</text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="300" y="178">1&#8594;3 from node 1: depart max(1, 7) = 7, land 8 &#8212;</text>
    <text x="300" y="194">node 3 settles at 5 first, so the stale entry dies.</text>
  </g>
  <!-- time axis -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5">
    <rect x="140" y="230" width="240" height="10"/>
    <rect x="320" y="246" width="180" height="10"/>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="388" y="239">0&#8594;2 open [1,5]</text>
    <text x="508" y="255">2&#8594;3 open [4,7]</text>
  </g>
  <g fill="#4169E1" font-size="12" font-weight="600" text-anchor="middle">
    <text x="170" y="272">go 0&#8594;2, land t = 2</text>
    <text x="350" y="272">go 2&#8594;3, land t = 5</text>
  </g>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 142 282 L 198 282" marker-end="url(#arrow)"/>
    <path d="M 322 282 L 378 282" marker-end="url(#arrow)"/>
  </g>
  <line x1="70" y1="302" x2="600" y2="302" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#9aa7b2" stroke-width="5">
    <line x1="80" y1="302" x2="140" y2="302"/>
    <line x1="200" y1="302" x2="320" y2="302"/>
  </g>
  <g fill="#42525e">
    <circle cx="80" cy="302" r="3.5"/>
    <circle cx="140" cy="302" r="3.5"/>
    <circle cx="320" cy="302" r="3.5"/>
  </g>
  <g fill="#4169E1">
    <circle cx="200" cy="302" r="5"/>
    <circle cx="380" cy="302" r="5"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="80" y1="299" x2="80" y2="305"/><line x1="140" y1="299" x2="140" y2="305"/><line x1="200" y1="299" x2="200" y2="305"/><line x1="260" y1="299" x2="260" y2="305"/><line x1="320" y1="299" x2="320" y2="305"/><line x1="380" y1="299" x2="380" y2="305"/><line x1="440" y1="299" x2="440" y2="305"/><line x1="500" y1="299" x2="500" y2="305"/><line x1="560" y1="299" x2="560" y2="305"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="80" y="334">0</text><text x="140" y="334">1</text><text x="200" y="334">2</text><text x="260" y="334">3</text><text x="320" y="334">4</text><text x="380" y="334">5</text><text x="440" y="334">6</text><text x="500" y="334">7</text><text x="560" y="334">8</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="110" y="318">wait at node 0</text>
    <text x="260" y="318">wait at node 2</text>
  </g>
  <text x="340" y="386" text-anchor="middle" fill="#1a2026" font-size="13">Dijkstra pops node 2 at t = 2 and departs on 2&#8594;3 the moment its window opens</text>
  <text x="340" y="404" text-anchor="middle" fill="#1a2026" font-size="13">at t = 4, settling node 3 at <tspan fill="#4169E1" font-weight="600">t = 5</tspan> &#8212; the <tspan fill="#4169E1" font-weight="600">t = 8</tspan> route through node 1 never wins.</text>
</svg>
