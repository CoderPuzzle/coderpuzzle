<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [2,1,3]; suffix minima sufmin = [1,1,3]; segment [0,1] has max 2 > sufmin[2] = 3,
       cut before index 2; ans = [2,2,3]; bars 100 wide at x 140/280/420, baseline y = 200 -->
  <!-- cut: left running max 2 <= suffix min 3 -->
  <text x="400" y="58" text-anchor="middle" fill="#42525e" font-size="12.5" font-weight="600">cut: left max 2 ≤ right min 3</text>
  <line x1="400" y1="68" x2="400" y2="195" stroke="#42525e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- value bars -->
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.4">
    <rect x="140" y="120" width="100" height="80"/>
    <rect x="280" y="160" width="100" height="40"/>
    <rect x="420" y="80" width="100" height="120"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="190" y="142">2</text>
    <text x="330" y="182">1</text>
    <text x="470" y="102">3</text>
  </g>
  <!-- inverted pair 2 > 1 mutually reachable -->
  <path d="M 195 116 Q 260 74 325 154" fill="none" stroke="#4169E1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="260" y="86" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">inverted pair 2 &gt; 1 — mutually reachable</text>
  <!-- baseline and indices -->
  <line x1="120" y1="200" x2="560" y2="200" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="95" y="222">index</text>
    <text x="190" y="222">0</text><text x="330" y="222">1</text><text x="470" y="222">2</text>
  </g>
  <!-- segment brackets reporting maxima -->
  <path d="M 140 236 L 140 242 L 380 242 L 380 236" fill="none" stroke="#42525e" stroke-width="1.2"/>
  <path d="M 420 236 L 420 242 L 520 242 L 520 236" fill="none" stroke="#42525e" stroke-width="1.2"/>
  <text x="260" y="262" text-anchor="middle" fill="#1a2026" font-size="12.5">segment max <tspan fill="#4169E1" font-weight="600">2</tspan> → ans[0] = ans[1] = 2</text>
  <text x="470" y="262" text-anchor="middle" fill="#1a2026" font-size="12.5">max <tspan fill="#4169E1" font-weight="600">3</tspan> → ans[2] = 3</text>
  <text x="310" y="290" text-anchor="middle" fill="#1a2026" font-size="13">Each segment reports its maximum: ans = <tspan fill="#4169E1" font-weight="600">[2, 2, 3]</tspan>.</text>
</svg>
