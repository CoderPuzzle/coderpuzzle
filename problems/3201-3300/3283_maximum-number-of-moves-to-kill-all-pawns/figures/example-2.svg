<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="560" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <!-- board window x=0..4, y=1..4 ; cell (x,y) at (60+44x, 30+44(4-y)) -->
  <g stroke="#98a2ac" stroke-width="1.1">
    <rect x="60" y="30" width="44" height="44" fill="#ffffff"/><rect x="104" y="30" width="44" height="44" fill="#e9eef4"/><rect x="148" y="30" width="44" height="44" fill="#ffffff"/><rect x="192" y="30" width="44" height="44" fill="#e9eef4"/><rect x="236" y="30" width="44" height="44" fill="#ffffff"/>
    <rect x="60" y="74" width="44" height="44" fill="#e9eef4"/><rect x="104" y="74" width="44" height="44" fill="#ffffff"/><rect x="148" y="74" width="44" height="44" fill="#e9eef4"/><rect x="192" y="74" width="44" height="44" fill="#ffffff"/><rect x="236" y="74" width="44" height="44" fill="#e9eef4"/>
    <rect x="60" y="118" width="44" height="44" fill="#ffffff"/><rect x="104" y="118" width="44" height="44" fill="#e9eef4"/><rect x="148" y="118" width="44" height="44" fill="#ffffff"/><rect x="192" y="118" width="44" height="44" fill="#e9eef4"/><rect x="236" y="118" width="44" height="44" fill="#ffffff"/>
    <rect x="60" y="162" width="44" height="44" fill="#e9eef4"/><rect x="104" y="162" width="44" height="44" fill="#ffffff"/><rect x="148" y="162" width="44" height="44" fill="#e9eef4"/><rect x="192" y="162" width="44" height="44" fill="#ffffff"/><rect x="236" y="162" width="44" height="44" fill="#e9eef4"/>
  </g>
  <!-- path cells -->
  <g fill="#e8edfa" stroke="#4169E1" stroke-width="1.8">
    <rect x="60" y="118" width="44" height="44"/>
    <rect x="104" y="30" width="44" height="44"/>
    <rect x="148" y="118" width="44" height="44"/>
    <rect x="236" y="162" width="44" height="44"/>
    <rect x="192" y="74" width="44" height="44"/>
    <rect x="60" y="74" width="44" height="44"/>
    <rect x="104" y="162" width="44" height="44"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="82" y="222">0</text><text x="126" y="222">1</text><text x="170" y="222">2</text><text x="214" y="222">3</text><text x="258" y="222">4</text>
    <text x="48" y="56">4</text><text x="48" y="100">3</text><text x="48" y="144">2</text><text x="48" y="188">1</text>
  </g>
  <!-- hops -->
  <g fill="none" stroke-width="1.8">
    <path d="M 89 108 L 120 61" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 133 59 L 162 108" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 181 123 Q 208 151 247 157" stroke="#1a2026" stroke-dasharray="5 3" marker-end="url(#arrowB)"/>
    <path d="M 251 155 Q 224 124 221 87" stroke="#1a2026" stroke-dasharray="5 3" marker-end="url(#arrowB)"/>
    <path d="M 220 86 Q 248 112 252 149" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 249 158 Q 220 127 184 123" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 158 112 L 93 80" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 86 85 L 119 170" stroke="#4169E1" marker-end="url(#arrowA)"/>
  </g>
  <!-- move numbers -->
  <g font-size="11.5" font-weight="600">
    <text x="134" y="52" fill="#4169E1">1</text><text x="176" y="100" fill="#4169E1">2</text>
    <text x="206" y="154" fill="#1a2026">3</text><text x="232" y="82" fill="#1a2026">4</text>
    <text x="262" y="142" fill="#4169E1">5</text><text x="192" y="140" fill="#4169E1">6</text>
    <text x="96" y="92" fill="#4169E1">7</text><text x="136" y="182" fill="#4169E1">8</text>
  </g>
  <!-- knight start and pawns -->
  <circle cx="82" cy="118" r="9" fill="#4169E1"/>
  <text x="82" y="122.5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">K</text>
  <g fill="#1a2026">
    <circle cx="126" cy="184" r="9"/><circle cx="170" cy="118" r="9"/><circle cx="214" cy="74" r="9"/>
  </g>
  <g fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">
    <text x="126" y="188.5">1</text><text x="170" y="122.5">2</text><text x="214" y="78.5">3</text>
  </g>
  <!-- legend -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="320" y="48">Alice (solid blue) takes pawn 2</text>
    <text x="320" y="66">with moves 1–2, then pawn 1</text>
    <text x="320" y="84">with moves 5–8.</text>
    <text x="320" y="116">Bob (dashed black) takes pawn 3</text>
    <text x="320" y="134">with moves 3–4.</text>
    <text x="320" y="166" fill="#1a2026" font-weight="600">Total: 2 + 2 + 4 = 8 moves.</text>
    <text x="320" y="196">Pawns are numbered by their</text>
    <text x="320" y="214">order in positions.</text>
  </g>
</svg>
