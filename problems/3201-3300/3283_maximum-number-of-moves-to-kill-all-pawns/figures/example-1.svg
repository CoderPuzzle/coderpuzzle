<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 284" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="300" height="284" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- board window x=0..3, y=0..3 ; cell (x,y) at (60+44x, 30+44(3-y)) -->
  <g stroke="#98a2ac" stroke-width="1.1">
    <rect x="60" y="30" width="44" height="44" fill="#e9eef4"/><rect x="104" y="30" width="44" height="44" fill="#ffffff"/><rect x="148" y="30" width="44" height="44" fill="#e9eef4"/><rect x="192" y="30" width="44" height="44" fill="#ffffff"/>
    <rect x="60" y="74" width="44" height="44" fill="#ffffff"/><rect x="104" y="74" width="44" height="44" fill="#e9eef4"/><rect x="148" y="74" width="44" height="44" fill="#ffffff"/><rect x="192" y="74" width="44" height="44" fill="#e9eef4"/>
    <rect x="60" y="118" width="44" height="44" fill="#e9eef4"/><rect x="104" y="118" width="44" height="44" fill="#ffffff"/><rect x="148" y="118" width="44" height="44" fill="#e9eef4"/><rect x="192" y="118" width="44" height="44" fill="#ffffff"/>
    <rect x="60" y="162" width="44" height="44" fill="#ffffff"/><rect x="104" y="162" width="44" height="44" fill="#e9eef4"/><rect x="148" y="162" width="44" height="44" fill="#ffffff"/><rect x="192" y="162" width="44" height="44" fill="#e9eef4"/>
  </g>
  <!-- path cells -->
  <g fill="#e8edfa" stroke="#4169E1" stroke-width="1.8">
    <rect x="104" y="118" width="44" height="44"/>
    <rect x="192" y="74" width="44" height="44"/>
    <rect x="104" y="30" width="44" height="44"/>
    <rect x="148" y="118" width="44" height="44"/>
    <rect x="60" y="162" width="44" height="44"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="82" y="224">0</text><text x="126" y="224">1</text><text x="170" y="224">2</text><text x="214" y="224">3</text>
    <text x="48" y="188">0</text><text x="48" y="144">1</text><text x="48" y="100">2</text><text x="48" y="56">3</text>
  </g>
  <!-- 4 hops -->
  <g fill="none" stroke="#4169E1" stroke-width="1.8">
    <path d="M 138 134 L 200 103" marker-end="url(#arrowA)"/>
    <path d="M 205 92 L 141 59" marker-end="url(#arrowA)"/>
    <path d="M 130 61 L 162 126" marker-end="url(#arrowA)"/>
    <path d="M 161 144 L 97 177" marker-end="url(#arrowA)"/>
  </g>
  <g font-size="11.5" fill="#4169E1" font-weight="600">
    <text x="176" y="126">1</text><text x="180" y="78">2</text><text x="140" y="98">3</text><text x="126" y="170">4</text>
  </g>
  <!-- knight and pawn -->
  <circle cx="126" cy="140" r="9" fill="#4169E1"/>
  <text x="126" y="144.5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">K</text>
  <circle cx="82" cy="184" r="9" fill="#1a2026"/>
  <text x="82" y="188.5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">P</text>
  <text x="148" y="256" text-anchor="middle" fill="#5c6b76" font-size="12.5">The knight at (1, 1) reaches the</text>
  <text x="148" y="272" text-anchor="middle" fill="#5c6b76" font-size="12.5">pawn at (0, 0) in 4 moves.</text>
</svg>
