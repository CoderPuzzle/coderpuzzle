<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
  <!-- board x=0..4, y=1..4 ; cell (x,y) at (100+44x, 30+44(4-y)) -->
  <g stroke="#98a2ac" stroke-width="1.1" fill="#ffffff">
    <rect x="100" y="30" width="44" height="44"/><rect x="144" y="30" width="44" height="44"/><rect x="188" y="30" width="44" height="44"/><rect x="232" y="30" width="44" height="44"/><rect x="276" y="30" width="44" height="44"/>
    <rect x="100" y="74" width="44" height="44"/><rect x="144" y="74" width="44" height="44"/><rect x="188" y="74" width="44" height="44"/><rect x="232" y="74" width="44" height="44"/><rect x="276" y="74" width="44" height="44"/>
    <rect x="100" y="118" width="44" height="44"/><rect x="144" y="118" width="44" height="44"/><rect x="188" y="118" width="44" height="44"/><rect x="232" y="118" width="44" height="44"/><rect x="276" y="118" width="44" height="44"/>
    <rect x="100" y="162" width="44" height="44"/><rect x="144" y="162" width="44" height="44"/><rect x="188" y="162" width="44" height="44"/><rect x="232" y="162" width="44" height="44"/><rect x="276" y="162" width="44" height="44"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="122" y="222">0</text><text x="166" y="222">1</text><text x="210" y="222">2</text><text x="254" y="222">3</text><text x="298" y="222">4</text>
    <text x="88" y="56">4</text><text x="88" y="100">3</text><text x="88" y="144">2</text><text x="88" y="188">1</text>
  </g>
  <!-- path cells -->
  <rect x="100" y="118" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="144" y="30" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="188" y="118" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="276" y="162" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="232" y="74" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="100" y="74" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="144" y="162" width="44" height="44" fill="#e8edfa" stroke="#4169E1" stroke-width="1.8"/>
  <!-- hops -->
  <g fill="none" stroke-width="1.8">
    <path d="M 134 126 L 154 62" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 158 60 L 202 126" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 222 148 L 288 172" stroke="#1a2026" stroke-dasharray="5 3" marker-end="url(#arrowB)"/>
    <path d="M 292 168 L 262 106" stroke="#1a2026" stroke-dasharray="5 3" marker-end="url(#arrowB)"/>
    <path d="M 260 104 Q 300 130 294 164" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 292 180 Q 250 164 218 150" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 200 134 L 132 104" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 128 100 L 160 176" stroke="#4169E1" marker-end="url(#arrowA)"/>
  </g>
  <!-- move numbers -->
  <g font-size="11.5" fill="#4169E1" font-weight="600">
    <text x="130" y="92">1</text><text x="194" y="92">2</text><text x="256" y="166">3</text>
    <text x="286" y="130">4</text><text x="306" y="146">5</text><text x="248" y="182">6</text>
    <text x="160" y="114">7</text><text x="132" y="150">8</text>
  </g>
  <!-- markers: knight start and pawns -->
  <circle cx="122" cy="140" r="9" fill="#4169E1"/>
  <text x="122" y="145" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">K</text>
  <g>
    <circle cx="210" cy="140" r="9" fill="#1a2026"/>
    <circle cx="254" cy="96" r="9" fill="#1a2026"/>
    <circle cx="166" cy="184" r="9" fill="#1a2026"/>
  </g>
  <g fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">
    <text x="210" y="145">2</text><text x="254" y="101">3</text><text x="166" y="189">1</text>
  </g>
  <!-- legend -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="360" y="46">Alice (maximizing): hops 1–2</text>
    <text x="360" y="64">capture pawn at (2,2);</text>
    <text x="360" y="82">hops 5–8 recapture the</text>
    <text x="360" y="100">knight's square to reach</text>
    <text x="360" y="118">(1,1) — 4 moves.</text>
    <text x="360" y="146">Bob (minimizing): hops 3–4</text>
    <text x="360" y="164">take (3,3) in 2 moves.</text>
    <text x="360" y="192" fill="#1a2026" font-weight="600">BFS from each pawn gives</text>
    <text x="360" y="210" fill="#1a2026" font-weight="600">all pairwise knight</text>
    <text x="360" y="228" fill="#1a2026" font-weight="600">distances — total 8.</text>
  </g>
</svg>
