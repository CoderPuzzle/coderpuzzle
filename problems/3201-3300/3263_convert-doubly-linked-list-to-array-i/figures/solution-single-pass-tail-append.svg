<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- head = [1,2,3,4,3,2,1]; input nodes 48x34 at x 96+62k, y 50; answer nodes 52x40 at x 120+86k, y 186; snapshot after appending 1,2,3,4 -->
  <text x="320" y="36" text-anchor="middle" fill="#5c6b76" font-size="12.5">input: head = [1,2,3,4,3,2,1] — nodes carry val and next</text>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4">
    <rect x="96" y="50" width="48" height="34" rx="6"/><rect x="158" y="50" width="48" height="34" rx="6"/><rect x="220" y="50" width="48" height="34" rx="6"/>
  </g>
  <rect x="282" y="50" width="48" height="34" rx="6" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="344" y="50" width="48" height="34" rx="6"/><rect x="406" y="50" width="48" height="34" rx="6"/><rect x="468" y="50" width="48" height="34" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="120" y="71" fill="#9aa7b2">1</text><text x="182" y="71" fill="#9aa7b2">2</text><text x="244" y="71" fill="#9aa7b2">3</text>
    <text x="306" y="71" fill="#4169E1" font-weight="600">4</text>
    <text x="368" y="71" fill="#1a2026">3</text><text x="430" y="71" fill="#1a2026">2</text><text x="492" y="71" fill="#1a2026">1</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.3" fill="none">
    <path d="M 146 67 L 156 67" marker-end="url(#arrowG)"/><path d="M 208 67 L 218 67" marker-end="url(#arrowG)"/>
    <path d="M 270 67 L 280 67" marker-end="url(#arrowG)"/><path d="M 332 67 L 342 67" marker-end="url(#arrowG)"/>
    <path d="M 394 67 L 404 67" marker-end="url(#arrowG)"/><path d="M 456 67 L 466 67" marker-end="url(#arrowG)"/>
  </g>
  <!-- the walked node's value becomes the fresh answer node -->
  <path d="M 306 88 C 306 140 404 136 404 182" fill="none" stroke="#5c6b76" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <text x="430" y="126" fill="#5c6b76" font-size="12">value 4 becomes the fresh node</text>
  <text x="96" y="166" fill="#5c6b76" font-size="12.5">answer chain after four appends</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="120" y="186" width="52" height="40"/><rect x="206" y="186" width="52" height="40"/><rect x="292" y="186" width="52" height="40"/>
  </g>
  <rect x="378" y="186" width="52" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600">
    <text x="146" y="210" fill="#1a2026">1</text><text x="232" y="210" fill="#1a2026">2</text><text x="318" y="210" fill="#1a2026">3</text>
    <text x="404" y="210" fill="#4169E1">4</text>
  </g>
  <!-- head's prev is the one null -->
  <path d="M 118 206 L 98 206" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="92" y="210" text-anchor="end" fill="#5c6b76" font-size="12" font-style="italic">null</text>
  <!-- next arrows forward -->
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 176 206 L 198 206" marker-end="url(#arrowG)"/><path d="M 262 206 L 284 206" marker-end="url(#arrowG)"/>
  </g>
  <path d="M 348 206 L 370 206" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- prev arrows backward -->
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 220 230 Q 189 248 158 230" marker-end="url(#arrowG)"/><path d="M 306 230 Q 275 248 244 230" marker-end="url(#arrowG)"/>
  </g>
  <path d="M 392 230 Q 361 248 330 230" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <text x="448" y="196" fill="#5c6b76" font-size="12">wired in the same step:</text>
    <text x="448" y="218" fill="#4169E1" font-size="12.5" font-weight="600">tail.next →</text>
    <text x="448" y="242" fill="#4169E1" font-size="12.5" font-weight="600">← fresh.prev</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="146" y="258" fill="#5c6b76">head</text>
    <text x="318" y="258" fill="#1a2026" font-weight="600">tail</text>
    <text x="404" y="258" fill="#1a2026" font-weight="600">fresh</text>
  </g>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Each iteration consumes one input node and wires tail.next and fresh.prev in the same</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">step and slides both handles right; the first append is the one special case: <tspan fill="#4169E1" font-weight="600">prev = null</tspan>.</text>
</svg>
