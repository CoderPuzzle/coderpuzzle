<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- n = 3; backtracking tries 0 before 1 and prunes append-0-after-0 (gray dashed nodes);
       surviving leaves numbered in DFS order = ["010","011","101","110","111"] -->
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 316 55 L 196 97" marker-end="url(#arrow)"/>
    <path d="M 344 55 L 464 97" marker-end="url(#arrow)"/>
    <path d="M 194 125 L 244 167" marker-end="url(#arrow)"/>
    <path d="M 466 125 L 436 167" marker-end="url(#arrow)"/>
    <path d="M 494 125 L 544 167" marker-end="url(#arrow)"/>
    <path d="M 246 196 L 234 237" marker-end="url(#arrow)"/>
    <path d="M 274 196 L 306 237" marker-end="url(#arrow)"/>
    <path d="M 434 196 L 452 237" marker-end="url(#arrow)"/>
    <path d="M 548 196 L 536 237" marker-end="url(#arrow)"/>
    <path d="M 574 196 L 600 237" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <path d="M 166 125 L 118 167" marker-end="url(#arrow)"/>
    <path d="M 406 196 L 394 237" marker-end="url(#arrow)"/>
  </g>
  <!-- root -->
  <rect x="304" y="29" width="52" height="26" rx="6" fill="#ffffff" stroke="#9aa7b2" stroke-width="1.4"/>
  <text x="330" y="46" text-anchor="middle" fill="#5c6b76" font-size="12">start</text>
  <!-- depth 1 -->
  <rect x="165" y="99" width="30" height="26" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="180" y="116" text-anchor="middle" fill="#1a2026" font-size="13">0</text>
  <rect x="465" y="99" width="30" height="26" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="480" y="116" text-anchor="middle" fill="#1a2026" font-size="13">1</text>
  <!-- depth 2 -->
  <rect x="82" y="169" width="36" height="26" rx="6" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="100" y="186" text-anchor="middle" fill="#9aa7b2" font-size="13">00</text>
  <text x="100" y="212" text-anchor="middle" fill="#9aa7b2" font-size="11">pruned</text>
  <rect x="242" y="169" width="36" height="26" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="260" y="186" text-anchor="middle" fill="#1a2026" font-size="13">01</text>
  <rect x="402" y="169" width="36" height="26" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="420" y="186" text-anchor="middle" fill="#1a2026" font-size="13">10</text>
  <rect x="542" y="169" width="36" height="26" rx="6" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <text x="560" y="186" text-anchor="middle" fill="#1a2026" font-size="13">11</text>
  <!-- depth 3: valid leaves accent, one pruned -->
  <rect x="198" y="239" width="44" height="26" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="220" y="256" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="13">010</text>
  <rect x="298" y="239" width="44" height="26" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="320" y="256" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="13">011</text>
  <rect x="358" y="239" width="44" height="26" rx="6" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="380" y="256" text-anchor="middle" fill="#9aa7b2" font-size="13">100</text>
  <text x="380" y="282" text-anchor="middle" fill="#9aa7b2" font-size="11">pruned</text>
  <rect x="444" y="239" width="44" height="26" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="466" y="256" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="13">101</text>
  <rect x="506" y="239" width="44" height="26" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="528" y="256" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="13">110</text>
  <rect x="592" y="239" width="44" height="26" rx="6" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="614" y="256" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="13">111</text>
  <!-- DFS emit order -->
  <g text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">
    <text x="220" y="282">1st</text><text x="320" y="282">2nd</text><text x="466" y="282">3rd</text>
    <text x="528" y="282">4th</text><text x="614" y="282">5th</text>
  </g>
  <text x="330" y="318" text-anchor="middle" fill="#1a2026" font-size="13">Pruning the two append-0-after-0 branches (gray) leaves exactly <tspan fill="#4169E1" font-weight="600">5</tspan> valid strings,</text>
  <text x="330" y="338" text-anchor="middle" fill="#1a2026" font-size="13">and the DFS leaf order <tspan fill="#4169E1" font-weight="600">010, 011, 101, 110, 111</tspan> is already the sorted output.</text>
</svg>
