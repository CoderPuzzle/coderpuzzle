<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="316" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- coordinates=[[3,1],[2,2],[4,1],[0,0],[5,3]], k=1, pivot (2,2); px = 110 + 82x, py = 230 - 55y;
       usable quadrants shaded; chain (0,0)->(2,2)->(5,3); y-LIS tails [0] and [3] give 1 + 1 + 1 = 3 -->
  <rect x="90" y="120" width="184" height="110" fill="#dbe4fb"/>
  <rect x="274" y="50" width="306" height="70" fill="#dbe4fb"/>
  <g stroke="#9aa7b2" stroke-width="1.25" stroke-dasharray="4 4">
    <line x1="274" y1="50" x2="274" y2="245"/>
    <line x1="70" y1="120" x2="580" y2="120"/>
  </g>
  <!-- axes -->
  <line x1="70" y1="230" x2="580" y2="230" stroke="#42525e" stroke-width="1.5"/>
  <line x1="90" y1="245" x2="90" y2="50" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.25">
    <line x1="110" y1="230" x2="110" y2="235"/><line x1="192" y1="230" x2="192" y2="235"/><line x1="274" y1="230" x2="274" y2="235"/>
    <line x1="356" y1="230" x2="356" y2="235"/><line x1="438" y1="230" x2="438" y2="235"/><line x1="520" y1="230" x2="520" y2="235"/>
    <line x1="85" y1="175" x2="90" y2="175"/><line x1="85" y1="120" x2="90" y2="120"/><line x1="85" y1="65" x2="90" y2="65"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="110" y="250">0</text><text x="192" y="250">1</text><text x="274" y="250">2</text>
    <text x="356" y="250">3</text><text x="438" y="250">4</text><text x="520" y="250">5</text>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="end">
    <text x="80" y="234">0</text><text x="80" y="179">1</text><text x="80" y="124">2</text><text x="80" y="69">3</text>
  </g>
  <text x="588" y="234" fill="#5c6b76" font-size="12">x</text>
  <text x="86" y="44" fill="#5c6b76" font-size="12">y</text>
  <!-- chain through the pivot -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 110 230 L 264.9 126.1" marker-end="url(#arrow)"/>
    <path d="M 282.8 118 L 509.3 67.4" marker-end="url(#arrow)"/>
  </g>
  <!-- points -->
  <circle cx="110" cy="230" r="6" fill="#4169E1"/>
  <circle cx="274" cy="120" r="6" fill="#4169E1"/>
  <circle cx="520" cy="65" r="6" fill="#4169E1"/>
  <circle cx="356" cy="175" r="6" fill="#9aa7b2"/>
  <circle cx="438" cy="175" r="6" fill="#9aa7b2"/>
  <g font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="84" y="212" text-anchor="end">(0,0)</text>
    <text x="266" y="106" text-anchor="end">(2,2) pivot</text>
    <text x="530" y="60">(5,3)</text>
  </g>
  <g font-size="12.5" fill="#9aa7b2">
    <text x="368" y="170">(3,1)</text>
    <text x="450" y="170">(4,1)</text>
    <text x="397" y="196" text-anchor="middle">outside both quadrants</text>
  </g>
  <text x="182" y="150" text-anchor="middle" font-size="12" fill="#4169E1">x &lt; 2, y &lt; 2</text>
  <text x="210" y="222" text-anchor="middle" font-size="12" fill="#1a2026">y-LIS tails [0] &#8594; 1</text>
  <text x="410" y="66" text-anchor="middle" font-size="12" fill="#4169E1">x &gt; 2, y &gt; 2</text>
  <text x="460" y="100" text-anchor="middle" font-size="12" fill="#1a2026">y-LIS tails [3] &#8594; 1</text>
  <text x="40" y="282" fill="#1a2026" font-size="13">The pivot (2,2) splits the points: (0,0) below-left and (5,3) above-right are</text>
  <text x="40" y="300" fill="#1a2026" font-size="13">usable; (3,1) and (4,1) fall outside both quadrants. 1 + 1 + 1 = <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
