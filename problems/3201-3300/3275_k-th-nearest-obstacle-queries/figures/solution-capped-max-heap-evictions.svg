<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="292" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- queries [[1,2],[3,4],[2,3],[-3,0]], k=2; distances 3,7,5,3; columns at x=85+160i; root box y=92, child y=140 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="85" y="24">queries[0]</text><text x="245" y="24">queries[1]</text>
    <text x="405" y="24">queries[2]</text><text x="565" y="24">queries[3]</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13" fill="#1a2026">
    <text x="85" y="41">[1, 2]</text><text x="245" y="41">[3, 4]</text>
    <text x="405" y="41">[2, 3]</text><text x="565" y="41">[-3, 0]</text>
  </g>
  <g>
    <rect x="35" y="52" width="100" height="25" rx="6" fill="#dbe4fb"/><rect x="195" y="52" width="100" height="25" rx="6" fill="#dbe4fb"/>
    <rect x="355" y="52" width="100" height="25" rx="6" fill="#dbe4fb"/><rect x="515" y="52" width="100" height="25" rx="6" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12" fill="#1a2026">
    <text x="85" y="69">|1|+|2| = 3</text><text x="245" y="69">|3|+|4| = 7</text>
    <text x="405" y="69">|2|+|3| = 5</text><text x="565" y="69">|-3|+|0| = 3</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="none">
    <path d="M 85 77 V 90" marker-end="url(#arrow)"/><path d="M 245 77 V 90" marker-end="url(#arrow)"/>
    <path d="M 405 77 V 90" marker-end="url(#arrow)"/><path d="M 565 77 V 90" marker-end="url(#arrow)"/>
  </g>
  <!-- heap roots (max on top) and second entries -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="58" y="92" width="54" height="32"/><rect x="218" y="92" width="54" height="32"/>
    <rect x="378" y="92" width="54" height="32"/><rect x="538" y="92" width="54" height="32"/>
    <rect x="218" y="140" width="54" height="32"/><rect x="378" y="140" width="54" height="32"/>
    <rect x="538" y="140" width="54" height="32"/>
  </g>
  <g stroke="#42525e" stroke-width="1.2">
    <path d="M 245 124 V 140"/><path d="M 405 124 V 140"/><path d="M 565 124 V 140"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="85" y="113" fill="#1a2026">3</text><text x="245" y="113" fill="#1a2026">7</text>
    <text x="405" y="113" fill="#4169E1">5</text><text x="565" y="113" fill="#4169E1">3</text>
    <text x="245" y="161" fill="#1a2026">3</text><text x="405" y="161" fill="#1a2026">3</text>
    <text x="565" y="161" fill="#1a2026">3</text>
  </g>
  <g text-anchor="end" fill="#5c6b76" font-size="10.5">
    <text x="210" y="112">top</text><text x="370" y="112">top</text><text x="530" y="112">top</text>
  </g>
  <!-- evicted worst distances -->
  <g fill="none" stroke="#9aa7b2" stroke-width="1.3" stroke-dasharray="4 3">
    <rect x="439" y="92" width="40" height="32"/><rect x="595" y="92" width="40" height="32"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#9aa7b2">
    <text x="459" y="113">7</text><text x="615" y="113">5</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10">
    <text x="459" y="137">out</text><text x="615" y="137">out</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="85" y="196">size &lt; 2: insert 3</text><text x="245" y="196">size &lt; 2: insert 7</text>
    <text x="405" y="196">5 &lt; top 7: evict 7,</text><text x="405" y="211">insert 5</text>
    <text x="565" y="196">3 &lt; top 5: evict 5,</text><text x="565" y="211">insert 3</text>
  </g>
  <g>
    <rect x="49" y="216" width="72" height="26" rx="6" fill="#f0f3f7"/><rect x="209" y="216" width="72" height="26" rx="6" fill="#dbe4fb"/>
    <rect x="369" y="216" width="72" height="26" rx="6" fill="#dbe4fb"/><rect x="529" y="216" width="72" height="26" rx="6" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="85" y="233" fill="#9aa7b2">ans -1</text><text x="245" y="233" fill="#4169E1">ans 7</text>
    <text x="405" y="233" fill="#4169E1">ans 5</text><text x="565" y="233" fill="#4169E1">ans 3</text>
  </g>
  <text x="320" y="264" text-anchor="middle" fill="#1a2026" font-size="13">The capped max-heap holds the k = 2 nearest distances; the answer is -1 until it</text>
  <text x="320" y="282" text-anchor="middle" fill="#1a2026" font-size="13">fills, then its top answers: <tspan fill="#4169E1" font-weight="600">7</tspan>, then <tspan fill="#4169E1" font-weight="600">5</tspan> displaces 7, then <tspan fill="#4169E1" font-weight="600">3</tspan> displaces 5.</text>
</svg>
