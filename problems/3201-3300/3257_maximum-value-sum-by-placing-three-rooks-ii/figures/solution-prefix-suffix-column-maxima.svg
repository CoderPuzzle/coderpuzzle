<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="312" fill="#ffffff"/>
  <!-- board = [[-3,1,1,1],[-3,1,-3,1],[-3,2,1,1]], middle row i = 1; strips 78x44 at x 169/251/333/415, y 62/124/186 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="208" y="54">0</text><text x="290" y="54">1</text><text x="372" y="54">2</text><text x="454" y="54">3</text>
  </g>
  <text x="156" y="80" text-anchor="end" fill="#1a2026" font-weight="600">top[j]</text>
  <text x="156" y="97" text-anchor="end" fill="#5c6b76" font-size="11">best of rows above</text>
  <text x="156" y="142" text-anchor="end" fill="#1a2026" font-weight="600">row i = 1</text>
  <text x="156" y="159" text-anchor="end" fill="#5c6b76" font-size="11">the middle row</text>
  <text x="156" y="204" text-anchor="end" fill="#1a2026" font-weight="600">bottom[j]</text>
  <text x="156" y="221" text-anchor="end" fill="#5c6b76" font-size="11">best of rows below</text>
  <!-- top[j] = [-3,1,1,1] -->
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.4">
    <rect x="251" y="62" width="78" height="44"/><rect x="333" y="62" width="78" height="44"/><rect x="415" y="62" width="78" height="44"/>
  </g>
  <rect x="169" y="62" width="78" height="44" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle">
    <text x="208" y="89" fill="#1a2026">-3</text><text x="290" y="89" fill="#1a2026">1</text><text x="372" y="89" fill="#1a2026">1</text><text x="454" y="89" fill="#1a2026">1</text>
  </g>
  <!-- middle row = [-3,1,-3,1] -->
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.4">
    <rect x="251" y="124" width="78" height="44"/><rect x="415" y="124" width="78" height="44"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="169" y="124" width="78" height="44"/><rect x="333" y="124" width="78" height="44"/>
  </g>
  <g text-anchor="middle">
    <text x="208" y="151" fill="#1a2026">-3</text><text x="290" y="151" fill="#1a2026">1</text><text x="372" y="151" fill="#1a2026">-3</text><text x="454" y="151" fill="#1a2026">1</text>
  </g>
  <!-- bottom[j] = [-3,2,1,1] -->
  <g fill="#f0f3f7" stroke="#42525e" stroke-width="1.4">
    <rect x="251" y="186" width="78" height="44"/><rect x="333" y="186" width="78" height="44"/><rect x="415" y="186" width="78" height="44"/>
  </g>
  <rect x="169" y="186" width="78" height="44" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle">
    <text x="208" y="213" fill="#1a2026">-3</text><text x="290" y="213" fill="#1a2026">2</text><text x="372" y="213" fill="#1a2026">1</text><text x="454" y="213" fill="#1a2026">1</text>
  </g>
  <!-- the winning pick: col 2 from top, col 3 from the row, col 1 from bottom -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="2">
    <rect x="333" y="62" width="78" height="44"/><rect x="415" y="124" width="78" height="44"/><rect x="251" y="186" width="78" height="44"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600">
    <text x="372" y="89">1</text><text x="372" y="101" font-size="10.5">col 2</text>
    <text x="454" y="151">1</text><text x="454" y="163" font-size="10.5">col 3</text>
    <text x="290" y="213">2</text><text x="290" y="225" font-size="10.5">col 1</text>
  </g>
  <g font-size="12" fill="#5c6b76">
    <rect x="150" y="240" width="14" height="14" fill="#f0f3f7" stroke="#42525e" stroke-width="1"/>
    <text x="172" y="252">a strip's top three columns</text>
    <rect x="352" y="240" width="14" height="14" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
    <text x="374" y="252">the winning pick</text>
  </g>
  <text x="320" y="282" text-anchor="middle" fill="#1a2026" font-size="13">With middle row 1 fixed, the winner takes col 2 from top, col 3 from the row, col 1</text>
  <text x="320" y="302" text-anchor="middle" fill="#1a2026" font-size="13">from bottom — three pairwise-distinct columns: <tspan fill="#4169E1" font-weight="600">1 + 1 + 2 = 4</tspan>, all in the top threes.</text>
</svg>
