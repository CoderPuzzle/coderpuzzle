<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="308" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- target = "aabcdabc" from words ["abc","aaaaa","bcdef"]; cells x = 110 + 52i, w 48;
       reach = [2,3,3,0,0,3,2,0] = longest word-prefix starting at i; layers: aa [0..1], bcd [2..4], abc [5..7] -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="110" y="96" width="48" height="44"/><rect x="162" y="96" width="48" height="44"/>
    <rect x="214" y="96" width="48" height="44"/><rect x="266" y="96" width="48" height="44"/>
    <rect x="318" y="96" width="48" height="44"/><rect x="370" y="96" width="48" height="44"/>
    <rect x="422" y="96" width="48" height="44"/><rect x="474" y="96" width="48" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="134" y="124">a</text><text x="186" y="124">a</text><text x="238" y="124">b</text><text x="290" y="124">c</text>
    <text x="342" y="124">d</text><text x="394" y="124">a</text><text x="446" y="124">b</text><text x="498" y="124">c</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="134" y="158">0</text><text x="186" y="158">1</text><text x="238" y="158">2</text><text x="290" y="158">3</text>
    <text x="342" y="158">4</text><text x="394" y="158">5</text><text x="446" y="158">6</text><text x="498" y="158">7</text>
  </g>
  <!-- reach arcs -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 140 92 Q 186 80 232 92" marker-end="url(#arrow)"/>
    <path d="M 192 92 Q 264 52 336 92" marker-end="url(#arrow)"/>
    <path d="M 244 92 Q 316 30 388 92" marker-end="url(#arrow)"/>
    <path d="M 400 92 Q 450 50 514 93" marker-end="url(#arrow)"/>
    <path d="M 452 92 Q 464 78 482 93" marker-end="url(#arrow)"/>
  </g>
  <!-- reach row -->
  <text x="96" y="184" text-anchor="end" fill="#5c6b76" font-size="12.5">reach</text>
  <g text-anchor="middle" font-weight="600" font-size="13">
    <text x="134" y="184" fill="#4169E1">2</text><text x="186" y="184" fill="#4169E1">3</text>
    <text x="238" y="184" fill="#4169E1">3</text><text x="290" y="184" fill="#9aa7b2">0</text>
    <text x="342" y="184" fill="#9aa7b2">0</text><text x="394" y="184" fill="#4169E1">3</text>
    <text x="446" y="184" fill="#4169E1">2</text><text x="498" y="184" fill="#9aa7b2">0</text>
  </g>
  <!-- committed piece layers -->
  <g stroke="#4169E1" stroke-width="1.75" fill="none">
    <path d="M 110 194 L 110 200 L 210 200 L 210 194"/>
    <path d="M 214 194 L 214 200 L 366 200 L 366 194"/>
    <path d="M 370 194 L 370 200 L 522 200 L 522 194"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="160" y="220">piece 1: "aa"</text><text x="290" y="220">piece 2: "bcd"</text><text x="446" y="220">piece 3: "abc"</text>
  </g>
  <text x="40" y="266" fill="#1a2026" font-size="13">Each reach[i] is the longest word-prefix starting at i; folding them into the jump-game</text>
  <text x="40" y="284" fill="#1a2026" font-size="13">frontier commits pieces aa, bcd, abc in three layers &#8212; the answer is <tspan fill="#4169E1" font-weight="600">3</tspan>.</text>
</svg>
