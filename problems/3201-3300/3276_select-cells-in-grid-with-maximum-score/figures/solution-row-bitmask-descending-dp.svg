<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="326" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid [[1,2,3],[4,3,2],[1,1,1]]; value rows: 4->{1}, 3->{0,1}, 2->{0,1}, 1->{0,2}; chain boxes 170x38 at x=340, y=44+64i -->
  <text x="40" y="36" fill="#5c6b76" font-size="12.5">values descending, rows holding each</text>
  <g fill="#9aa7b2" font-size="11">
    <text x="56" y="60" text-anchor="middle">value</text>
    <text x="100" y="60">rows</text>
    <text x="190" y="60">mask</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="56" y="90" fill="#1a2026">4</text><text x="56" y="122" fill="#1a2026">3</text>
    <text x="56" y="154" fill="#9aa7b2">2</text><text x="56" y="186" fill="#1a2026">1</text>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="100" y="90">{1}</text><text x="100" y="122">{0, 1}</text>
    <text x="100" y="154">{0, 1}</text><text x="100" y="186">{0, 2}</text>
  </g>
  <g font-weight="600" font-size="13.5">
    <text x="190" y="90" fill="#4169E1">010</text><text x="190" y="122" fill="#4169E1">011</text>
    <text x="190" y="154" fill="#9aa7b2">011</text><text x="190" y="186" fill="#4169E1">101</text>
  </g>
  <text x="40" y="212" fill="#9aa7b2" font-size="10.5">bit i of a mask = row i</text>
  <text x="425" y="32" text-anchor="middle" fill="#5c6b76" font-size="12">dp[mask] as values 4, 3, 2, 1 are offered</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="340" y="44" width="170" height="38"/><rect x="340" y="108" width="170" height="38"/>
    <rect x="340" y="172" width="170" height="38"/>
  </g>
  <rect x="340" y="236" width="170" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="425" y="68" fill="#1a2026">dp[000] = 0</text><text x="425" y="132" fill="#1a2026">dp[010] = 4</text>
    <text x="425" y="196" fill="#1a2026">dp[011] = 7</text><text x="425" y="260" fill="#4169E1">dp[111] = 8</text>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" fill="none">
    <path d="M 425 82 V 106" marker-end="url(#arrow)"/><path d="M 425 146 V 170" marker-end="url(#arrow)"/>
    <path d="M 425 210 V 234" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-weight="600" font-size="12.5">
    <text x="438" y="98">+4 · row 1</text><text x="438" y="162">+3 · row 0</text>
    <text x="438" y="226">+1 · row 2</text>
  </g>
  <g fill="#9aa7b2" font-size="11.5">
    <text x="528" y="176">value 2 adds</text>
    <text x="528" y="191">nothing (≤ 6)</text>
  </g>
  <text x="320" y="298" text-anchor="middle" fill="#1a2026" font-size="13">Taking 4 in row 1, then 3 in row 0, then 1 in row 2 or-rows the mask to 111 — score 8;</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">value 2 improves no mask, so the best score is <tspan fill="#4169E1" font-weight="600">dp[111] = 8</tspan>.</text>
</svg>
