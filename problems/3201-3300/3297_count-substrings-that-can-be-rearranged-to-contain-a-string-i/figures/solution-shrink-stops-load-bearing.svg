<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="336" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- word1 = "bcca" (indices 0-3), word2 = "abc" -> need a1 b1 c1; sweep: r=0 b1, r=1 b1 c1, r=2 b1 c2 (all miss a), r=3 b1 c2 a1 covers; shrink test: dropping the left 'b' gives b0 &lt; b1 so left stays 0; total += left + 1 = 1; cells 58x40 at x = 84 + 66i -->
  <text x="311" y="32" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">right = 3</text>
  <path d="M 311 38 L 311 49" fill="none" stroke="#4169E1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4fb">
    <rect x="84" y="52" width="58" height="40"/><rect x="150" y="52" width="58" height="40"/>
    <rect x="216" y="52" width="58" height="40"/><rect x="282" y="52" width="58" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="113" y="77">b</text><text x="179" y="77">c</text><text x="245" y="77">c</text><text x="311" y="77">a</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="113" y="112">0</text><text x="179" y="112">1</text><text x="245" y="112">2</text><text x="311" y="112">3</text>
  </g>
  <text x="420" y="64" fill="#5c6b76" font-size="12">word2 "abc"</text>
  <text x="420" y="82" fill="#5c6b76" font-size="12">need a1 b1 c1</text>
  <path d="M 84 118 L 84 126 L 340 126 L 340 118" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="212" y="146" text-anchor="middle" fill="#1a2026" font-size="12.5">at right = 3, window [0..3] = "bcca" first covers</text>
  <g fill="#9aa7b2" font-size="11.5">
    <text x="84" y="172">right</text><text x="150" y="172">window</text>
    <text x="260" y="172">counts</text><text x="420" y="172">coverage</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="84" y="194">r = 0</text><text x="150" y="194">b</text><text x="260" y="194">b1</text>
    <text x="420" y="194" fill="#9aa7b2">misses a c</text>
    <text x="84" y="216">r = 1</text><text x="150" y="216">bc</text><text x="260" y="216">b1 c1</text>
    <text x="420" y="216" fill="#9aa7b2">misses a</text>
    <text x="84" y="238">r = 2</text><text x="150" y="238">bcc</text><text x="260" y="238">b1 c2</text>
    <text x="420" y="238" fill="#9aa7b2">misses a</text>
    <text x="84" y="260" font-weight="600" fill="#4169E1">r = 3</text>
    <text x="150" y="260" font-weight="600" fill="#1a2026">bcca</text>
    <text x="260" y="260" font-weight="600" fill="#1a2026">b1 c2 a1</text>
    <text x="420" y="260" font-weight="600" fill="#4169E1">covers every need</text>
  </g>
  <text x="330" y="292" text-anchor="middle" fill="#1a2026" font-size="13">Only right = 3 covers, so the sweep shrinks: dropping the left 'b' leaves</text>
  <text x="330" y="312" text-anchor="middle" fill="#1a2026" font-size="13">b0 &lt; b1 — load-bearing, so left stays 0 and the end adds <tspan fill="#4169E1" font-weight="600">left + 1 = 1</tspan>.</text>
</svg>
