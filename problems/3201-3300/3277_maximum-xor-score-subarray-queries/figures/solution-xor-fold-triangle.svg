<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="336" fill="#ffffff"/>
  <!-- nums = [2,8,4,32,16,1]; subarray [2,8,4]; row0 boxes 64x40 at (188,56),(288,56),(388,56); fold 2^8=10, 8^4=12, 10^12=6 -->
  <text x="320" y="30" text-anchor="middle" fill="#5c6b76" font-size="12.5">XOR score of nums[0..2] = [2, 8, 4]</text>
  <g text-anchor="end" fill="#9aa7b2" font-size="11.5">
    <text x="150" y="80">length 1</text><text x="150" y="166">length 2</text><text x="150" y="252">length 3</text>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="188" y="56" width="64" height="40"/><rect x="288" y="56" width="64" height="40"/>
    <rect x="388" y="56" width="64" height="40"/><rect x="238" y="142" width="64" height="40"/>
    <rect x="338" y="142" width="64" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="220" y="82">2</text><text x="320" y="82">8</text><text x="420" y="82">4</text>
    <text x="270" y="168">10</text><text x="370" y="168">12</text>
  </g>
  <g stroke="#42525e" stroke-width="1.4">
    <path d="M 220 96 L 270 142"/><path d="M 320 96 L 270 142"/>
    <path d="M 320 96 L 370 142"/><path d="M 420 96 L 370 142"/>
    <path d="M 270 182 L 320 228"/><path d="M 370 182 L 320 228"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="240" y="126" text-anchor="end">2⊕8 = 10</text>
    <text x="400" y="126">8⊕4 = 12</text>
    <text x="288" y="214" text-anchor="end">10⊕12 = 6</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="250" y="200">[2, 8]</text><text x="392" y="200">[8, 4]</text>
  </g>
  <rect x="288" y="228" width="64" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.5"/>
  <text x="320" y="254" text-anchor="middle" font-weight="600" font-size="16" fill="#4169E1">6</text>
  <text x="364" y="253" fill="#5c6b76" font-size="12">score[0][2]</text>
  <text x="320" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Each row XORs neighbours: 2⊕8 = 10, 8⊕4 = 12, 10⊕12 = <tspan fill="#4169E1" font-weight="600">6</tspan> — the score of [2, 8, 4].</text>
  <text x="320" y="318" text-anchor="middle" fill="#1a2026" font-size="13">The recurrence score[l][r] = score[l][r-1] ⊕ score[l+1][r] precomputes every subarray.</text>
</svg>
