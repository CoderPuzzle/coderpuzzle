<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- start = [6,0,3], d = 2; sorted intervals [0,2],[3,5],[6,8]; px = 90 + 56*c; greedy points 0,4,8 at x = 4 -->
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="146" y="46">[0,2]</text><text x="314" y="46">[3,5]</text><text x="482" y="46">[6,8]</text>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.25">
    <rect x="90" y="56" width="112" height="18"/><rect x="258" y="56" width="112" height="18"/><rect x="426" y="56" width="112" height="18"/>
  </g>
  <!-- number line, one px per 56 units -->
  <line x1="70" y1="112" x2="560" y2="112" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.25">
    <line x1="90" y1="107" x2="90" y2="117"/><line x1="146" y1="107" x2="146" y2="117"/><line x1="202" y1="107" x2="202" y2="117"/>
    <line x1="258" y1="107" x2="258" y2="117"/><line x1="314" y1="107" x2="314" y2="117"/><line x1="370" y1="107" x2="370" y2="117"/>
    <line x1="426" y1="107" x2="426" y2="117"/><line x1="482" y1="107" x2="482" y2="117"/><line x1="538" y1="107" x2="538" y2="117"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="90" y="134" fill="#4169E1" font-weight="600">0</text><text x="146" y="134">1</text><text x="202" y="134">2</text>
    <text x="258" y="134">3</text><text x="314" y="134" fill="#4169E1" font-weight="600">4</text><text x="370" y="134">5</text>
    <text x="426" y="134">6</text><text x="482" y="134">7</text><text x="538" y="134" fill="#4169E1" font-weight="600">8</text>
  </g>
  <g fill="#4169E1">
    <circle cx="90" cy="112" r="5.5"/><circle cx="314" cy="112" r="5.5"/><circle cx="538" cy="112" r="5.5"/>
  </g>
  <!-- gap arrows between consecutive chosen points -->
  <g stroke="#4169E1" stroke-width="1.75" fill="none">
    <path d="M 98 152 H 306" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 322 152 H 530" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="202" y="174">gap = x = 4</text><text x="426" y="174">gap = x = 4</text>
  </g>
  <!-- the two binary-search probes -->
  <circle cx="52" cy="210" r="3.5" fill="#4169E1"/>
  <text x="64" y="215" font-size="13" fill="#1a2026">check x = 4:  0 &#8594; 4 &#8594; 8, every max(start[i], last + 4) fits &#8212; <tspan fill="#4169E1" font-weight="600">feasible</tspan></text>
  <circle cx="52" cy="240" r="3.5" fill="#9aa7b2"/>
  <text x="64" y="245" font-size="13" fill="#1a2026">check x = 5:  0 &#8594; 5, then max(6, 5 + 5) = 10 &#8713; [6,8] &#8212; <tspan fill="#5c6b76" font-weight="600">infeasible</tspan></text>
  <text x="40" y="288" fill="#1a2026" font-size="13">The greedy takes the smallest legal value at least last + x in each sorted</text>
  <text x="40" y="306" fill="#1a2026" font-size="13">interval; x = 4 survives, x = 5 fails, so the binary search returns <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
