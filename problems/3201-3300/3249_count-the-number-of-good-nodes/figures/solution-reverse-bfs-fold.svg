<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="368" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 1: edges [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]]; nodes 0(320,64) 1(180,160) 2(460,160) 3(110,256) 4(250,256) 5(390,256) 6(530,256); sizes [7,3,3,1,1,1,1]; badges = reverse-BFS fold steps -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="28" y="48">badge: fold step</text>
    <text x="28" y="66">arrow: toward parent</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)">
    <line x1="518" y1="239" x2="472" y2="177"/>
    <line x1="402" y1="239" x2="448" y2="177"/>
    <line x1="238" y1="239" x2="192" y2="177"/>
    <line x1="122" y1="239" x2="168" y2="177"/>
    <line x1="443" y1="148" x2="337" y2="76"/>
    <line x1="197" y1="148" x2="303" y2="76"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="320" cy="64" r="21"/><circle cx="180" cy="160" r="21"/><circle cx="460" cy="160" r="21"/>
    <circle cx="110" cy="256" r="21"/><circle cx="250" cy="256" r="21"/>
    <circle cx="390" cy="256" r="21"/><circle cx="530" cy="256" r="21"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="320" y="69">0</text><text x="180" y="165">1</text><text x="460" y="165">2</text>
    <text x="110" y="261">3</text><text x="250" y="261">4</text><text x="390" y="261">5</text><text x="530" y="261">6</text>
  </g>
  <g fill="#4169E1">
    <circle cx="501" cy="216" r="9"/><circle cx="419" cy="216" r="9"/>
    <circle cx="221" cy="216" r="9"/><circle cx="139" cy="216" r="9"/>
    <circle cx="401" cy="120" r="9"/><circle cx="239" cy="120" r="9"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-weight="600" font-size="11">
    <text x="501" y="220">1</text><text x="419" y="220">2</text><text x="221" y="220">3</text>
    <text x="139" y="220">4</text><text x="401" y="124">5</text><text x="239" y="124">6</text>
  </g>
  <g font-size="13">
    <text x="292" y="68" text-anchor="end">children: <tspan fill="#4169E1" font-weight="600">3 = 3</tspan></text>
    <text x="348" y="68">size <tspan fill="#4169E1" font-weight="600">7</tspan></text>
    <text x="152" y="165" text-anchor="end">size <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="152" y="185" text-anchor="end" fill="#5c6b76" font-size="12">children: <tspan fill="#4169E1" font-weight="600">1 = 1</tspan></text>
    <text x="488" y="165">size <tspan fill="#4169E1" font-weight="600">3</tspan></text>
    <text x="488" y="185" fill="#5c6b76" font-size="12">children: <tspan fill="#4169E1" font-weight="600">1 = 1</tspan></text>
    <text x="110" y="296" text-anchor="end">size <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="250" y="296" text-anchor="end">size <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="390" y="296">size <tspan fill="#4169E1" font-weight="600">1</tspan></text>
    <text x="530" y="296">size <tspan fill="#4169E1" font-weight="600">1</tspan></text>
  </g>
  <text x="320" y="316" text-anchor="middle" fill="#5c6b76" font-size="12.5">reverse-BFS fold order: 6, 5, 4, 3, 2, 1, 0</text>
  <text x="320" y="336" text-anchor="middle" fill="#1a2026" font-size="13">sizes fold up child-first; children tie at every branch (3 = 3, 1 = 1, 1 = 1),</text>
  <text x="320" y="354" text-anchor="middle" fill="#1a2026" font-size="13">and leaves are good outright — all <tspan fill="#4169E1" font-weight="600">7</tspan> nodes are good.</text>
</svg>
