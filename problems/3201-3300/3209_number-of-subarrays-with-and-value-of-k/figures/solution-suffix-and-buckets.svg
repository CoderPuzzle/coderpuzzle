<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="344" fill="#ffffff"/>
  <!-- nums = [1,1,2], k = 1; suffix-AND (value, count) buckets after each right end r:
       (1,1) -> (1,2) -> (0,2)+(2,1); chips 64x38 at x=190,262; rows y=64,144,224 -->
  <text x="40" y="48" font-size="12.5" font-weight="600" fill="#1a2026">nums = [1, 1, 2], k = 1</text>
  <g font-size="12" fill="#5c6b76">
    <text x="190" y="48">buckets (value, count)</text>
    <text x="400" y="48">matches k = 1</text>
    <text x="540" y="48">running total</text>
  </g>
  <!-- r = 0 -->
  <text x="40" y="80" font-size="13.5" font-weight="600" fill="#1a2026">r = 0</text>
  <text x="40" y="96" font-size="12" fill="#5c6b76">x = 1</text>
  <rect x="190" y="64" width="64" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="222" y="81" text-anchor="middle" font-size="15" font-weight="600" fill="#4169E1">1</text>
  <text x="222" y="96" text-anchor="middle" font-size="10.5" fill="#4169E1">&#215; 1</text>
  <text x="400" y="88" font-size="16" font-weight="600" fill="#4169E1">+1</text>
  <text x="555" y="88" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2026">1</text>
  <text x="190" y="128" font-size="11.5" fill="#5c6b76">old (1, 1) &amp; 1 = (1, 1), fresh (1, 1) merges in</text>
  <!-- r = 1 -->
  <text x="40" y="160" font-size="13.5" font-weight="600" fill="#1a2026">r = 1</text>
  <text x="40" y="176" font-size="12" fill="#5c6b76">x = 1</text>
  <rect x="190" y="144" width="64" height="38" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="222" y="161" text-anchor="middle" font-size="15" font-weight="600" fill="#4169E1">1</text>
  <text x="222" y="176" text-anchor="middle" font-size="10.5" fill="#4169E1">&#215; 2</text>
  <text x="400" y="168" font-size="16" font-weight="600" fill="#4169E1">+2</text>
  <text x="555" y="168" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2026">3</text>
  <text x="190" y="208" font-size="11.5" fill="#5c6b76">old (1, 2) &amp; 2 = (0, 2); fresh (2, 1)</text>
  <!-- r = 2 -->
  <text x="40" y="240" font-size="13.5" font-weight="600" fill="#1a2026">r = 2</text>
  <text x="40" y="256" font-size="12" fill="#5c6b76">x = 2</text>
  <rect x="190" y="224" width="64" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="222" y="241" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">0</text>
  <text x="222" y="256" text-anchor="middle" font-size="10.5" fill="#9aa7b2">&#215; 2</text>
  <rect x="262" y="224" width="64" height="38" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="294" y="241" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2026">2</text>
  <text x="294" y="256" text-anchor="middle" font-size="10.5" fill="#9aa7b2">&#215; 1</text>
  <text x="400" y="248" font-size="16" font-weight="600" fill="#9aa7b2">+0</text>
  <text x="555" y="248" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2026">3</text>
  <text x="340" y="300" text-anchor="middle" font-size="13" fill="#1a2026">Suffix-AND buckets (value, count) merge as bits clear; where the value hits k = 1,</text>
  <text x="340" y="320" text-anchor="middle" font-size="13" fill="#1a2026">the bucket count joins the answer: <tspan fill="#4169E1" font-weight="600">1 + 2 + 0 = 3</tspan>.</text>
</svg>
