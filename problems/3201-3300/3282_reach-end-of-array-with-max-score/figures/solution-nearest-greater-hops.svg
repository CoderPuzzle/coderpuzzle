<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="292" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [1,3,1,5]; cell centers x = 142 + 120i; nearest greater: 0->1, 1->3, 2->3; chain 0->1->3 = 1 + 6 = 7 -->
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="90" y="60" width="104" height="44"/><rect x="210" y="60" width="104" height="44"/>
    <rect x="330" y="60" width="104" height="44"/><rect x="450" y="60" width="104" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="142" y="88" fill="#4169E1">1</text><text x="262" y="88" fill="#4169E1">3</text>
    <text x="382" y="88" fill="#9aa7b2">1</text><text x="502" y="88" fill="#4169E1">5</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="142" y="124">i = 0</text><text x="262" y="124">i = 1</text><text x="382" y="124">i = 2</text><text x="502" y="124">i = 3</text>
  </g>
  <!-- chain hops to the nearest strictly greater value -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 150 54 Q 202 32 254 54" marker-end="url(#arrow)"/>
    <path d="M 270 54 Q 382 10 490 52" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="202" y="30">1&#183;1 = 1</text><text x="382" y="20">2&#183;3 = 6</text>
  </g>
  <!-- index 2's nearest-greater hop, not on the chain -->
  <path d="M 390 132 Q 442 158 492 134" fill="none" stroke="#9aa7b2" stroke-width="1.75" marker-end="url(#arrowMuted)"/>
  <text x="442" y="180" text-anchor="middle" fill="#9aa7b2" font-size="12.5">index 2's hop, off the chain: 1&#183;1 = 1</text>
  <text x="40" y="254" fill="#1a2026" font-size="13">Each index's optimal hop is to its nearest strictly greater value; from</text>
  <text x="40" y="272" fill="#1a2026" font-size="13">index 0 the chain 0 &#8594; 1 &#8594; 3 pays 1&#183;1 + 2&#183;3 = <tspan fill="#4169E1" font-weight="600">7</tspan>, the maximum score.</text>
</svg>
