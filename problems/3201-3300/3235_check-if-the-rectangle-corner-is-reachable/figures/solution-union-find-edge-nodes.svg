<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="380" fill="#ffffff"/>
  <!-- Example 3: xCorner=yCorner=3, circles [[2,1,1],[1,2,1]]; left: 56px per unit, rect (44,76)-(212,244); right: union-find nodes, accent = left-bottom pinning chain -->
  <text x="44" y="36" fill="#5c6b76" font-size="13">Example 3: xCorner = 3, yCorner = 3, circles = [[2,1,1], [1,2,1]]</text>
  <!-- left panel: the geometry -->
  <circle cx="156" cy="188" r="56" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <circle cx="100" cy="132" r="56" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="44" y="76" width="168" height="168" fill="none"/>
  <line x1="44" y1="76" x2="44" y2="244" stroke="#4169E1" stroke-width="3"/>
  <line x1="44" y1="244" x2="212" y2="244" stroke="#4169E1" stroke-width="3"/>
  <line x1="44" y1="76" x2="212" y2="76" stroke="#42525e" stroke-width="1.6"/>
  <line x1="212" y1="76" x2="212" y2="244" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="156" cy="244" r="3.5" fill="#4169E1"/>
  <circle cx="44" cy="132" r="3.5" fill="#4169E1"/>
  <circle cx="212" cy="188" r="3.5" fill="#42525e"/>
  <circle cx="100" cy="76" r="3.5" fill="#42525e"/>
  <text x="156" y="193" text-anchor="middle" fill="#1a2026" font-weight="600">A</text>
  <text x="100" y="137" text-anchor="middle" fill="#1a2026" font-weight="600">B</text>
  <text x="44" y="266" text-anchor="middle" fill="#1a2026" font-size="12.5">(0, 0)</text>
  <text x="44" y="282" text-anchor="middle" fill="#5c6b76" font-size="12">start</text>
  <text x="218" y="68" text-anchor="middle" fill="#1a2026" font-size="12.5">(3, 3)</text>
  <text x="218" y="52" text-anchor="middle" fill="#5c6b76" font-size="12">goal</text>
  <!-- right panel: union-find graph -->
  <text x="500" y="40" text-anchor="middle" fill="#5c6b76" font-size="12.5">union-find graph</text>
  <line x1="450" y1="140" x2="450" y2="85" stroke="#42525e" stroke-width="1.6"/>
  <line x1="433" y1="149" x2="364" y2="215" stroke="#4169E1" stroke-width="2.4"/>
  <line x1="470" y1="160" x2="540" y2="160" stroke="#4169E1" stroke-width="2.4"/>
  <line x1="560" y1="180" x2="560" y2="245" stroke="#4169E1" stroke-width="2.4"/>
  <line x1="575" y1="147" x2="623" y2="105" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="450" cy="160" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="450" y="166" text-anchor="middle" fill="#1a2026" font-weight="600">B</text>
  <text x="450" y="198" text-anchor="middle" fill="#5c6b76" font-size="11.5">(1,2,1)</text>
  <circle cx="560" cy="160" r="20" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="560" y="166" text-anchor="middle" fill="#1a2026" font-weight="600">A</text>
  <text x="560" y="127" text-anchor="middle" fill="#5c6b76" font-size="11.5">(2,1,1)</text>
  <rect x="418" y="55" width="64" height="30" rx="6" fill="#f0f3f7" stroke="#42525e" stroke-width="1.4"/>
  <text x="450" y="75" text-anchor="middle" fill="#1a2026" font-size="13">top</text>
  <rect x="308" y="215" width="64" height="30" rx="6" fill="#f0f3f7" stroke="#42525e" stroke-width="1.4"/>
  <text x="340" y="235" text-anchor="middle" fill="#1a2026" font-size="13">left</text>
  <rect x="528" y="245" width="64" height="30" rx="6" fill="#f0f3f7" stroke="#42525e" stroke-width="1.4"/>
  <text x="560" y="265" text-anchor="middle" fill="#1a2026" font-size="13">bottom</text>
  <rect x="608" y="75" width="64" height="30" rx="6" fill="#f0f3f7" stroke="#42525e" stroke-width="1.4"/>
  <text x="640" y="95" text-anchor="middle" fill="#1a2026" font-size="13">right</text>
  <text x="540" y="302" text-anchor="middle" fill="#5c6b76" font-size="12">all six land in one set</text>
  <text x="340" y="348" text-anchor="middle" fill="#1a2026" font-size="13">Circle A touches bottom and right, circle B left and top, and A and B overlap:</text>
  <text x="340" y="366" text-anchor="middle" fill="#1a2026" font-size="13">the accented left–B–A–bottom chain walls the start corner in — <tspan fill="#4169E1" font-weight="600">false</tspan>.</text>
</svg>
