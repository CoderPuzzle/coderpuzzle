<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="404" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- nums = [2,3,2]; dp cells 60x34 at x = 130+70v; rows at y = 74 (i=0), 168 (i=1), 262 (i=2);
       brackets mark the prefix window of row i-1 read by the accented entry of row i -->
  <text x="340" y="30" text-anchor="middle" fill="#5c6b76" font-size="13">nums = [2, 3, 2] — one dp row per position i, over arr1 values v</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="128" y="62" text-anchor="end">v</text>
    <text x="160" y="62">0</text><text x="230" y="62">1</text><text x="300" y="62">2</text><text x="370" y="62">3</text>
  </g>
  <!-- row i = 0 : base, all ones -->
  <text x="44" y="90" fill="#1a2026" font-size="13">i = 0</text>
  <text x="44" y="104" fill="#5c6b76" font-size="11">nums 2</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="130" y="74" width="60" height="34"/><rect x="200" y="74" width="60" height="34"/><rect x="270" y="74" width="60" height="34"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="160" y="96">1</text><text x="230" y="96">1</text><text x="300" y="96">1</text>
  </g>
  <text x="420" y="95" fill="#5c6b76" font-size="12">dp[0][v] = 1 for v = 0..2</text>
  <!-- window of row 0 read by dp[1][2]: v = 0..1, sum 1+1 = 2 -->
  <path d="M 130 112 L 130 124 L 260 124 L 260 112" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <path d="M 262 127 Q 298 138 300 160" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- row i = 1 : d = 1, window stops at v-1 -->
  <text x="44" y="184" fill="#1a2026" font-size="13">i = 1</text>
  <text x="44" y="198" fill="#5c6b76" font-size="11">nums 3</text>
  <rect x="130" y="168" width="60" height="34" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <rect x="200" y="168" width="60" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="270" y="168" width="60" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <rect x="340" y="168" width="60" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600">
    <text x="160" y="190" fill="#9aa7b2">0</text><text x="230" y="190" fill="#1a2026">1</text>
    <text x="300" y="190" fill="#4169E1" font-size="15">2</text><text x="370" y="190" fill="#1a2026">3</text>
  </g>
  <text x="420" y="178" fill="#1a2026" font-size="12.5">d₁ = max(0, 3−2) = 1</text>
  <text x="420" y="196" fill="#5c6b76" font-size="11.5">entry v reads pref through v − 1</text>
  <!-- window of row 1 read by dp[2][2]: v = 0..2, sum 0+1+2 = 3 -->
  <path d="M 130 206 L 130 218 L 330 218 L 330 206" fill="none" stroke="#4169E1" stroke-width="1.8"/>
  <path d="M 318 221 Q 312 242 302 256" fill="none" stroke="#4169E1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- row i = 2 : d = 0, window reaches v itself -->
  <text x="44" y="278" fill="#1a2026" font-size="13">i = 2</text>
  <text x="44" y="292" fill="#5c6b76" font-size="11">nums 2</text>
  <rect x="130" y="262" width="60" height="34" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <rect x="200" y="262" width="60" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
  <rect x="270" y="262" width="60" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600">
    <text x="160" y="284" fill="#9aa7b2">0</text><text x="230" y="284" fill="#1a2026">1</text>
    <text x="300" y="284" fill="#4169E1" font-size="15">3</text>
  </g>
  <text x="420" y="272" fill="#1a2026" font-size="12.5">d₂ = max(0, 2−3) = 0</text>
  <text x="420" y="290" fill="#5c6b76" font-size="11.5">entry v reads pref through v</text>
  <!-- answer: inclusive prefix of row 2 -->
  <path d="M 130 300 L 130 312 L 330 312 L 330 300" fill="none" stroke="#42525e" stroke-width="1.5"/>
  <text x="230" y="330" text-anchor="middle" fill="#1a2026" font-size="13">inclusive prefix = 0 + 1 + 3 = <tspan fill="#4169E1" font-weight="600">4</tspan></text>
  <text x="340" y="364" text-anchor="middle" fill="#1a2026" font-size="13">Each entry reads a prefix window of the row above, shifted left by the rise d₁ = 1.</text>
  <text x="340" y="384" text-anchor="middle" fill="#1a2026" font-size="13">The fall back to 2 gives d₂ = 0; prefixing row 2 yields 0 + 1 + 3 = <tspan fill="#4169E1" font-weight="600">4</tspan> pairs.</text>
</svg>
