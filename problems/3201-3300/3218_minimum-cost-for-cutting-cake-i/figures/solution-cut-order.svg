<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
  <!-- panel 1: whole cake with cut lines -->
  <g fill="#fdf6ec" stroke="#1a2026" stroke-width="1.6">
    <rect x="60" y="50" width="140" height="180"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" stroke-dasharray="6 4" fill="none">
    <line x1="130" y1="50" x2="130" y2="230"/>
    <line x1="60" y1="110" x2="200" y2="110"/>
    <line x1="60" y1="170" x2="200" y2="170"/>
  </g>
  <g font-size="12.5" fill="#4169E1">
    <text x="136" y="66">V0 = 5</text>
    <text x="70" y="104">H0 = 1</text>
    <text x="70" y="164">H1 = 3</text>
  </g>
  <text x="130" y="36" text-anchor="middle" fill="#1a2026" font-weight="600">3 × 2 cake</text>
  <text x="130" y="254" text-anchor="middle" fill="#5c6b76" font-size="12.5">cut V0 once — ×1</text>
  <!-- panel 2: two strips, horizontal cuts repeated -->
  <g fill="#fdf6ec" stroke="#1a2026" stroke-width="1.6">
    <rect x="300" y="50" width="70" height="180"/>
    <rect x="440" y="50" width="70" height="180"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.8" stroke-dasharray="6 4" fill="none">
    <line x1="300" y1="110" x2="370" y2="110"/>
    <line x1="300" y1="170" x2="370" y2="170"/>
    <line x1="440" y1="110" x2="510" y2="110"/>
    <line x1="440" y1="170" x2="510" y2="170"/>
  </g>
  <g font-size="12.5" fill="#4169E1">
    <text x="306" y="104">H1</text><text x="306" y="164">H0</text>
    <text x="446" y="104">H1</text><text x="446" y="164">H0</text>
  </g>
  <text x="405" y="36" text-anchor="middle" fill="#1a2026" font-weight="600">after the vertical cut: 2 strips</text>
  <text x="405" y="254" text-anchor="middle" fill="#5c6b76" font-size="12.5">each H line is cut once per strip — ×2</text>
  <text x="280" y="274" text-anchor="middle" fill="#4169E1" font-weight="600">total = 5·1 + 3·2 + 1·2 = 13</text>
</svg>
