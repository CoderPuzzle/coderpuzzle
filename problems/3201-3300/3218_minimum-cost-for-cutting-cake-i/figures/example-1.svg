<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 374" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- m = 3, n = 2, horizontalCut = [1,3], verticalCut = [5]; optimal: vertical 5 first, then each horizontal paid twice: 5 + 2*1 + 2*3 = 13 (verified by DP) -->
  <rect x="200" y="50" width="180" height="270" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="290" y1="50" x2="290" y2="320"/>
    <line x1="200" y1="140" x2="380" y2="140"/>
    <line x1="200" y1="230" x2="380" y2="230"/>
  </g>
  <g font-size="11" fill="#5c6b76" text-anchor="middle">
    <text x="245" y="99">1 x 1</text>
    <text x="335" y="99">1 x 1</text>
    <text x="245" y="189">1 x 1</text>
    <text x="335" y="189">1 x 1</text>
    <text x="245" y="279">1 x 1</text>
    <text x="335" y="279">1 x 1</text>
  </g>
  <g font-size="12" font-weight="600" fill="#5c6b76">
    <text x="188" y="144" text-anchor="end">cut 2 · cost 1 × 2</text>
    <text x="188" y="234" text-anchor="end">cut 3 · cost 3 × 2</text>
    <text x="302" y="182">cut 1 · cost 5</text>
  </g>
  <text x="290" y="358" text-anchor="middle" fill="#1a2026" font-size="13.5">cut the vertical line first (5), then each horizontal line is paid on both 3 x 1 pieces: 5 + 2·1 + 2·3 = <tspan fill="#4169E1" font-weight="700">13</tspan></text>
</svg>
