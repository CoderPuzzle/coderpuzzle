<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="320" fill="#ffffff"/>
  <!-- edges 0-1: 0.5, 1-2: 0.5, 0-2: 0.2; nodes 0(75,190), 1(185,70), 2(185,190), r 20; pops at 1.0, 0.5, 0.25 -->
  <g stroke="#9aa7b2" stroke-width="2" stroke-dasharray="5 4">
    <line x1="95" y1="190" x2="165" y2="190"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="90" y1="175" x2="170" y2="85"/>
    <line x1="185" y1="90" x2="185" y2="170"/>
  </g>
  <text x="108" y="126" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">0.5</text>
  <text x="198" y="134" fill="#4169E1" font-size="12" font-weight="600">0.5</text>
  <text x="130" y="184" text-anchor="middle" fill="#9aa7b2" font-size="12">0.2</text>
  <text x="130" y="208" text-anchor="middle" fill="#9aa7b2" font-size="11">loses</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="75" cy="190" r="20"/><circle cx="185" cy="70" r="20"/><circle cx="185" cy="190" r="20"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="75" y="195">0</text><text x="185" y="75">1</text><text x="185" y="195">2</text>
  </g>
  <g fill="#5c6b76" font-size="11">
    <text x="75" y="230" text-anchor="middle">start</text>
    <text x="212" y="195">end</text>
  </g>
  <!-- pop log: max-heap extraction order with the best label each node pops at -->
  <text x="300" y="78" fill="#5c6b76" font-size="12.5">max-heap pops:</text>
  <circle cx="308" cy="101" r="9" fill="#4169E1"/>
  <text x="308" y="105" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">1</text>
  <text x="326" y="106" fill="#1a2026" font-size="12.5">pop 0 @ 1.0: node 1 = 0.5, node 2 = 0.2</text>
  <text x="326" y="124" fill="#9aa7b2" font-size="11">heap: 1 @ 0.5, 2 @ 0.2</text>
  <circle cx="308" cy="151" r="9" fill="#4169E1"/>
  <text x="308" y="155" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">2</text>
  <text x="326" y="156" fill="#1a2026" font-size="12.5">pop 1 @ 0.5: node 2 ← 0.5 × 0.5 = 0.25</text>
  <text x="326" y="174" fill="#9aa7b2" font-size="11">0.2 → 0.25; heap: 2 @ 0.25, 2 @ 0.2 (stale)</text>
  <circle cx="308" cy="201" r="9" fill="#4169E1"/>
  <text x="308" y="205" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">3</text>
  <text x="326" y="206" fill="#1a2026" font-size="12.5">pop 2 @ 0.25 — end node: stop, return <tspan fill="#4169E1" font-weight="600">0.25</tspan></text>
  <text x="326" y="224" fill="#9aa7b2" font-size="11">the stale 2 @ 0.2 entry is never popped</text>
  <text x="320" y="272" text-anchor="middle" fill="#1a2026" font-size="13">The heap always pops the highest probability so far: 0 @ 1.0, then 1 @ 0.5.</text>
  <text x="320" y="292" text-anchor="middle" fill="#1a2026" font-size="13">Node 2 pops at <tspan fill="#4169E1" font-weight="600">0.25</tspan> = 0.5 × 0.5; the direct 0.2 edge loses.</text>
</svg>
