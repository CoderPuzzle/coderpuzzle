<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="404" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = 84532 (pos 0..4 = 8,4,5,3,2), t = 34852; s/t cells w56 at x = 150+66i; queue boxes w52 at x = 24+62d -->
  <text x="138" y="76" text-anchor="end" fill="#5c6b76" font-size="12.5">s</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="150" y="48" width="56" height="40"/><rect x="216" y="48" width="56" height="40"/>
    <rect x="282" y="48" width="56" height="40"/><rect x="414" y="48" width="56" height="40"/>
  </g>
  <rect x="348" y="48" width="56" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="178" y="74">8</text><text x="244" y="74">4</text><text x="310" y="74">5</text>
    <text x="376" y="74" fill="#4169E1">3</text><text x="442" y="74">2</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="138" y="112">pos</text>
    <text x="178" y="112">0</text><text x="244" y="112">1</text><text x="310" y="112">2</text>
    <text x="376" y="112">3</text><text x="442" y="112">4</text>
  </g>
  <!-- blocker check: the 2 sits right of pos 3 -->
  <path d="M 376 120 Q 409 144 442 120" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="409" y="168">only digit smaller than 3 is the 2 at pos 4 —</text>
    <text x="409" y="186">it sits <tspan fill="#4169E1" font-weight="600">right</tspan> of pos 3, so <tspan fill="#4169E1" font-weight="600">0 blockers</tspan> → legal</text>
  </g>
  <text x="138" y="238" text-anchor="end" fill="#5c6b76" font-size="12.5">t</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="150" y="214" width="56" height="40"/><rect x="216" y="214" width="56" height="40"/>
    <rect x="282" y="214" width="56" height="40"/><rect x="348" y="214" width="56" height="40"/>
    <rect x="414" y="214" width="56" height="40"/>
  </g>
  <rect x="150" y="214" width="56" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="178" y="240" fill="#4169E1">3</text><text x="244" y="240">4</text><text x="310" y="240">8</text>
    <text x="376" y="240">5</text><text x="442" y="240">2</text>
  </g>
  <!-- pop arrow: t[0] = '3' takes queue 3's earliest position 3 -->
  <path d="M 178 260 C 178 276 206 284 226 288" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ten per-digit FIFO queues; box d holds s's remaining positions of digit d -->
  <g text-anchor="middle" fill="#9aa7b2" font-size="11">
    <text x="50" y="284">0</text><text x="112" y="284">1</text><text x="174" y="284">2</text>
    <text x="236" y="284">3</text><text x="298" y="284">4</text><text x="360" y="284">5</text>
    <text x="422" y="284">6</text><text x="484" y="284">7</text><text x="546" y="284">8</text>
    <text x="608" y="284">9</text>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2">
    <rect x="24" y="290" width="52" height="34"/><rect x="86" y="290" width="52" height="34"/>
    <rect x="396" y="290" width="52" height="34"/><rect x="458" y="290" width="52" height="34"/>
    <rect x="582" y="290" width="52" height="34"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="148" y="290" width="52" height="34"/><rect x="272" y="290" width="52" height="34"/>
    <rect x="334" y="290" width="52" height="34"/><rect x="520" y="290" width="52" height="34"/>
  </g>
  <rect x="210" y="290" width="52" height="34" fill="#dbe4fb" stroke="#4169E1" stroke-width="2"/>
  <g text-anchor="middle" font-weight="600">
    <text x="50" y="312" fill="#9aa7b2">–</text><text x="112" y="312" fill="#9aa7b2">–</text>
    <text x="174" y="312">4</text><text x="236" y="312" fill="#4169E1">3</text><text x="298" y="312">1</text>
    <text x="360" y="312">2</text><text x="422" y="312" fill="#9aa7b2">–</text>
    <text x="484" y="312" fill="#9aa7b2">–</text><text x="546" y="312">0</text><text x="608" y="312" fill="#9aa7b2">–</text>
  </g>
  <text x="330" y="346" text-anchor="middle" fill="#5c6b76" font-size="12">queue d lists the positions of digit d in s, earliest first</text>
  <text x="330" y="372" text-anchor="middle" fill="#1a2026" font-size="13">t[0] = '3' pops queue 3's earliest position 3; the blocker check counts unconsumed</text>
  <text x="330" y="390" text-anchor="middle" fill="#1a2026" font-size="13">smaller digits left of pos 3 — the lone 2 sits at pos 4, so nothing blocks → <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
