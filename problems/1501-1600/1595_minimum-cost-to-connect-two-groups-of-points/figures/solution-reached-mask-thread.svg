<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="322" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- cost = [[1,3,5],[4,1,1],[1,5,3]]; forward thread: row 0 -> A, row 1 -> B, row 2 -> A (one link each), then the base case force-connects still-unreached C via minToReach[2] = cost[1][2] = 1; mask bits left-to-right = C B A: 000, 001, 011, 011, 111; total 1+1+1+1 = 4 -->
  <text x="120" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">group 1</text>
  <text x="300" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">group 2</text>
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 137 84 H 283" marker-end="url(#arrow)"/>
    <path d="M 137 144 H 283" marker-end="url(#arrow)"/>
    <path d="M 134 195 L 286 93" marker-end="url(#arrow)"/>
    <path d="M 136 149 L 284 199" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>
  <text x="210" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026" stroke="#ffffff" stroke-width="4" paint-order="stroke">1</text>
  <text x="210" y="148" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026" stroke="#ffffff" stroke-width="4" paint-order="stroke">1</text>
  <text x="253" y="119" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026" stroke="#ffffff" stroke-width="4" paint-order="stroke">1</text>
  <text x="247" y="187" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2026" stroke="#ffffff" stroke-width="4" paint-order="stroke">1</text>
  <text x="252" y="216" text-anchor="middle" fill="#5c6b76" font-size="10.5">forced</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <circle cx="120" cy="84" r="17"/><circle cx="120" cy="144" r="17"/><circle cx="120" cy="204" r="17"/>
    <circle cx="300" cy="84" r="17"/><circle cx="300" cy="144" r="17"/><circle cx="300" cy="204" r="17"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="120" y="89">0</text><text x="120" y="149">1</text><text x="120" y="209">2</text>
    <text x="300" y="89">A</text><text x="300" y="149">B</text><text x="300" y="209">C</text>
  </g>
  <!-- mask evolution panel -->
  <rect x="348" y="44" width="312" height="220" rx="6" fill="#f0f3f7"/>
  <text x="504" y="66" text-anchor="middle" fill="#5c6b76" font-size="12.5">reached mask (bits C B A)</text>
  <g text-anchor="start" fill="#1a2026" font-size="12.5">
    <text x="362" y="98">start</text>
    <text x="362" y="128">row 0 → A   +1</text>
    <text x="362" y="158">row 1 → B   +1</text>
    <text x="362" y="188">row 2 → A   +1 (A already in)</text>
    <text x="362" y="218">force C (base case)   +1</text>
  </g>
  <g text-anchor="end" font-weight="600" font-size="13" fill="#1a2026">
    <text x="638" y="98">000</text>
    <text x="638" y="128">001</text>
    <text x="638" y="158">011</text>
    <text x="638" y="188" fill="#9aa7b2">011</text>
    <text x="638" y="218" fill="#4169E1">111</text>
  </g>
  <text x="362" y="250" text-anchor="start" fill="#1a2026" font-size="13" font-weight="600">total</text>
  <text x="638" y="252" text-anchor="end" fill="#4169E1" font-size="15" font-weight="600">4</text>
  <text x="340" y="292" text-anchor="middle" fill="#1a2026" font-size="13">One link per row advances the mask 000 → 001 → 011; the base case then force-connects</text>
  <text x="340" y="310" text-anchor="middle" fill="#1a2026" font-size="13">unreached C at minToReach[2] = cost[1][2] = <tspan fill="#4169E1" font-weight="600">1</tspan>, so point 1 serves both B and C — total <tspan fill="#4169E1" font-weight="600">4</tspan>.</text>
</svg>
