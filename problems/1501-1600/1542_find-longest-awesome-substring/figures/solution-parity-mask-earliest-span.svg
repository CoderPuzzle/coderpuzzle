<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 275" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="275" fill="#ffffff"/>
  <!-- s = 3242415; prefix parity masks 8,12,28,24,8,10,42; mask 10 XOR bit 1 = 8 first seen at prefix 0 gives span 5 -->
  <text x="242" y="30" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="13">s[1..5] = 24241, length 5</text>
  <path d="M 112 46 L 112 40 L 372 40 L 372 46" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="60" y="54" width="52" height="40" fill="#f0f3f7"/><rect x="112" y="54" width="52" height="40" fill="#dbe4fb"/>
    <rect x="164" y="54" width="52" height="40" fill="#dbe4fb"/><rect x="216" y="54" width="52" height="40" fill="#dbe4fb"/>
    <rect x="268" y="54" width="52" height="40" fill="#dbe4fb"/><rect x="320" y="54" width="52" height="40" fill="#dbe4fb"/>
    <rect x="372" y="54" width="52" height="40" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="86" y="79" fill="#9aa7b2">3</text><text x="138" y="79" fill="#1a2026">2</text>
    <text x="190" y="79" fill="#1a2026">4</text><text x="242" y="79" fill="#1a2026">2</text>
    <text x="294" y="79" fill="#1a2026">4</text><text x="346" y="79" fill="#1a2026">1</text>
    <text x="398" y="79" fill="#9aa7b2">5</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14">
    <text x="86" y="120" fill="#5c6b76">8</text><text x="138" y="120" fill="#5c6b76">12</text>
    <text x="190" y="120" fill="#5c6b76">28</text><text x="242" y="120" fill="#5c6b76">24</text>
    <text x="294" y="120" fill="#5c6b76">8</text><text x="346" y="120" fill="#4169E1">10</text>
    <text x="398" y="120" fill="#5c6b76">42</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#9aa7b2">
    <text x="86" y="138">j = 0</text><text x="138" y="138">j = 1</text><text x="190" y="138">j = 2</text>
    <text x="242" y="138">j = 3</text><text x="294" y="138">j = 4</text><text x="346" y="138">j = 5</text>
    <text x="398" y="138">j = 6</text>
  </g>
  <text x="346" y="158" text-anchor="middle" fill="#5c6b76" font-size="12.5">⊕ bit 1 → 8</text>
  <text x="60" y="170" fill="#5c6b76" font-size="12.5">mask → earliest index:</text>
  <g stroke="#42525e" stroke-width="1.2" fill="#ffffff">
    <rect x="60" y="180" width="66" height="24" rx="6" stroke="#4169E1"/>
    <rect x="138" y="180" width="66" height="24" rx="6"/>
    <rect x="216" y="180" width="66" height="24" rx="6"/>
    <rect x="294" y="180" width="66" height="24" rx="6"/>
    <rect x="372" y="180" width="66" height="24" rx="6"/>
    <rect x="450" y="180" width="66" height="24" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="12.5">
    <text x="93" y="196" fill="#4169E1" font-weight="600">8 → 0</text>
    <text x="171" y="196" fill="#1a2026">12 → 1</text>
    <text x="249" y="196" fill="#1a2026">28 → 2</text>
    <text x="327" y="196" fill="#1a2026">24 → 3</text>
    <text x="405" y="196" fill="#1a2026">10 → 5</text>
    <text x="483" y="196" fill="#1a2026">42 → 6</text>
  </g>
  <text x="320" y="240" text-anchor="middle" fill="#1a2026" font-size="13">Each digit flips its parity bit; at j = 5 the mask 10 ⊕ bit 1 = 8 is first seen</text>
  <text x="320" y="258" text-anchor="middle" fill="#1a2026" font-size="13">after index 0, so s[1..5] = 24241 (one odd digit) is the <tspan fill="#4169E1" font-weight="600">answer 5</tspan>.</text>
</svg>
