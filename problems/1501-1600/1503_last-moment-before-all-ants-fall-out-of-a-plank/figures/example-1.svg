<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="620" height="350" fill="#ffffff"/>
  <!-- t = 0 -->
  <text x="38" y="79" fill="#5c6b76" font-size="12.5">t = 0</text>
  <line x1="70" y1="90" x2="470" y2="90" stroke="#b08968" stroke-width="5" stroke-linecap="round"/>
  <g fill="#5c6b76" font-size="10.5" text-anchor="middle">
    <text x="70" y="112">0</text><text x="170" y="112">1</text><text x="270" y="112">2</text><text x="370" y="112">3</text><text x="470" y="112">4</text>
  </g>
  <g>
    <circle cx="70" cy="81" r="5.5" fill="#42525e"/><line x1="77" y1="81" x2="92" y2="81" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
    <circle cx="170" cy="81" r="5.5" fill="#42525e"/><line x1="177" y1="81" x2="192" y2="81" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
    <circle cx="370" cy="81" r="5.5" fill="#42525e"/><line x1="363" y1="81" x2="348" y2="81" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
    <circle cx="470" cy="81" r="5.5" fill="#42525e"/><line x1="463" y1="81" x2="448" y2="81" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1a2026">
    <text x="70" y="62">A</text><text x="170" y="62">B</text><text x="370" y="62">C</text><text x="470" y="62">D</text>
  </g>
  <!-- t = 1 -->
  <text x="34" y="154" fill="#5c6b76" font-size="12.5">t = 1</text>
  <line x1="70" y1="165" x2="470" y2="165" stroke="#b08968" stroke-width="5" stroke-linecap="round"/>
  <circle cx="170" cy="156" r="5.5" fill="#42525e"/><line x1="177" y1="156" x2="192" y2="156" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <circle cx="258" cy="156" r="5.5" fill="#42525e"/><line x1="251" y1="156" x2="236" y2="156" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <circle cx="282" cy="156" r="5.5" fill="#42525e"/><line x1="289" y1="156" x2="304" y2="156" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <circle cx="370" cy="156" r="5.5" fill="#42525e"/><line x1="363" y1="156" x2="348" y2="156" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <g text-anchor="middle" font-size="11" fill="#1a2026">
    <text x="170" y="137">A</text><text x="258" y="137">B</text><text x="282" y="137">C</text><text x="370" y="137">D</text>
  </g>
  <text x="270" y="184" text-anchor="middle" fill="#c0392b" font-size="11">B and C meet at 2 — both turn around</text>
  <!-- t = 1.5 -->
  <text x="28" y="229" fill="#5c6b76" font-size="12.5">t = 1.5</text>
  <line x1="70" y1="240" x2="470" y2="240" stroke="#b08968" stroke-width="5" stroke-linecap="round"/>
  <circle cx="208" cy="231" r="5.5" fill="#42525e"/><line x1="201" y1="231" x2="186" y2="231" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <circle cx="232" cy="231" r="5.5" fill="#42525e"/><line x1="239" y1="231" x2="254" y2="231" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <circle cx="308" cy="231" r="5.5" fill="#42525e"/><line x1="301" y1="231" x2="286" y2="231" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <circle cx="332" cy="231" r="5.5" fill="#42525e"/><line x1="339" y1="231" x2="354" y2="231" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <g text-anchor="middle" font-size="11" fill="#1a2026">
    <text x="208" y="212">A</text><text x="232" y="212">B</text><text x="308" y="212">C</text><text x="332" y="212">D</text>
  </g>
  <text x="220" y="259" text-anchor="middle" fill="#c0392b" font-size="11">A meets B at 1.5</text>
  <text x="320" y="259" text-anchor="middle" fill="#c0392b" font-size="11">C meets D at 2.5</text>
  <!-- t = 2 -->
  <text x="34" y="304" fill="#5c6b76" font-size="12.5">t = 2</text>
  <line x1="70" y1="315" x2="470" y2="315" stroke="#b08968" stroke-width="5" stroke-linecap="round"/>
  <circle cx="170" cy="306" r="5.5" fill="#42525e"/><line x1="163" y1="306" x2="148" y2="306" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <circle cx="258" cy="306" r="5.5" fill="#42525e"/><line x1="251" y1="306" x2="236" y2="306" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <circle cx="282" cy="306" r="5.5" fill="#42525e"/><line x1="289" y1="306" x2="304" y2="306" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <circle cx="370" cy="306" r="5.5" fill="#42525e"/><line x1="377" y1="306" x2="392" y2="306" stroke="#42525e" stroke-width="1.4" marker-end="url(#r)"/>
  <g text-anchor="middle" font-size="11" fill="#1a2026">
    <text x="170" y="287">A</text><text x="258" y="287">B</text><text x="282" y="287">C</text><text x="370" y="287">D</text>
  </g>
  <text x="270" y="334" text-anchor="middle" fill="#c0392b" font-size="11">B and C meet again at 2</text>
  <text x="310" y="348" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12.5">A and D fall at t = 3; B and C fall at t = 4 → answer 4</text>
</svg>
