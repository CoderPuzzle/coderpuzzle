<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- stick 0..7, boundaries 0,1,3,4,5,7; x(p) = 60 + 80*p -->
  <rect x="60" y="44" width="560" height="14" fill="#dbe4f6" stroke="#42525e" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="60" y1="38" x2="60" y2="64"/><line x1="140" y1="38" x2="140" y2="64"/>
    <line x1="300" y1="38" x2="300" y2="64"/><line x1="380" y1="38" x2="380" y2="64"/>
    <line x1="460" y1="38" x2="460" y2="64"/><line x1="620" y1="38" x2="620" y2="64"/>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="60" y="30">0</text><text x="140" y="30">1</text><text x="300" y="30">3</text>
    <text x="380" y="30">4</text><text x="460" y="30">5</text><text x="620" y="30">7</text>
  </g>
  <text x="40" y="56" fill="#5c6b76" font-size="12.5">stick</text>
  <!-- recursion rows: each bar = one dp[i][j] segment -->
  <!-- row 1: [0,7], first cut 3 -->
  <rect x="60" y="96" width="560" height="18" fill="#dbe4f6" stroke="#42525e" stroke-width="1.5"/>
  <line x1="300" y1="92" x2="300" y2="118" stroke="#4169E1" stroke-width="2.5"/>
  <text x="300" y="88" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">first cut 3 · cost 7</text>
  <line x1="300" y1="114" x2="300" y2="154" stroke="#5c6b76" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- row 2: [0,3] cut 1 ; [3,7] cut 5 -->
  <rect x="60" y="158" width="240" height="18" fill="#dbe4f6" stroke="#42525e" stroke-width="1.5"/>
  <line x1="140" y1="154" x2="140" y2="180" stroke="#4169E1" stroke-width="2.5"/>
  <text x="140" y="150" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">cut 1 · cost 3</text>
  <rect x="300" y="158" width="320" height="18" fill="#dbe4f6" stroke="#42525e" stroke-width="1.5"/>
  <line x1="460" y1="154" x2="460" y2="180" stroke="#4169E1" stroke-width="2.5"/>
  <text x="460" y="150" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">cut 5 · cost 4</text>
  <line x1="140" y1="176" x2="140" y2="216" stroke="#5c6b76" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="460" y1="176" x2="460" y2="216" stroke="#5c6b76" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- row 3: leaves + [3,5] cut 4 -->
  <rect x="60" y="220" width="80" height="18" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="140" y="220" width="160" height="18" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <rect x="300" y="220" width="160" height="18" fill="#dbe4f6" stroke="#42525e" stroke-width="1.5"/>
  <line x1="380" y1="216" x2="380" y2="242" stroke="#4169E1" stroke-width="2.5"/>
  <text x="380" y="212" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">cut 4 · cost 2</text>
  <rect x="460" y="220" width="160" height="18" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="100" y="262" text-anchor="middle" fill="#5c6b76" font-size="12">no cuts left</text>
  <text x="220" y="262" text-anchor="middle" fill="#5c6b76" font-size="12">no cuts left</text>
  <text x="540" y="262" text-anchor="middle" fill="#5c6b76" font-size="12">no cuts left</text>
  <!-- totals -->
  <text x="60" y="300" fill="#1a2026" font-size="13">Each bar is one interval dp[i][j]; the blue mark is the boundary k that achieves the minimum.</text>
  <text x="60" y="320" fill="#1a2026" font-size="13">Optimal order 3, 5, 1, 4 pays 7 + 4 + 3 + 2 = <tspan fill="#4169E1" font-weight="600">16</tspan>, the value of dp[0][5] over positions [0, 1, 3, 4, 5, 7].</text>
</svg>
