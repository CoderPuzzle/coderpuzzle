<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="224" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">input order [1, 3, 4, 5]</text>
  <text x="664" y="32" text-anchor="middle" fill="#5c6b76" font-size="12.5">rearranged [3, 5, 1, 4] (optimal)</text>
  <!-- ===== left panel: cut order 1, 3, 4, 5 ===== -->
  <g>
    <!-- row 1: whole stick, cut 1 -->
    <rect x="70" y="60" width="308" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <line x1="114" y1="56" x2="114" y2="80" stroke="#c0392b" stroke-width="1.8"/>
    <line x1="202" y1="56" x2="202" y2="80" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="246" y1="56" x2="246" y2="80" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="290" y1="56" x2="290" y2="80" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <g fill="#5c6b76" font-size="10.5" text-anchor="middle">
      <text x="70" y="94">0</text><text x="114" y="94">1</text><text x="158" y="94">2</text><text x="202" y="94">3</text><text x="246" y="94">4</text><text x="290" y="94">5</text><text x="334" y="94">6</text><text x="378" y="94">7</text>
    </g>
    <text x="400" y="72" fill="#1a2026" font-size="12">rod 7</text>
    <!-- row 2: cut 3 -->
    <rect x="70" y="118" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="114" y="118" width="264" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <line x1="202" y1="114" x2="202" y2="138" stroke="#c0392b" stroke-width="1.8"/>
    <line x1="246" y1="114" x2="246" y2="138" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="290" y1="114" x2="290" y2="138" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="400" y="130" fill="#1a2026" font-size="12">rod 6</text>
    <!-- row 3: cut 4 -->
    <rect x="70" y="176" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="114" y="176" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="202" y="176" width="176" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <line x1="246" y1="172" x2="246" y2="196" stroke="#c0392b" stroke-width="1.8"/>
    <line x1="290" y1="172" x2="290" y2="196" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="400" y="188" fill="#1a2026" font-size="12">rod 4</text>
    <!-- row 4: cut 5 -->
    <rect x="70" y="234" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="114" y="234" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="202" y="234" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="246" y="234" width="132" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <line x1="290" y1="230" x2="290" y2="254" stroke="#c0392b" stroke-width="1.8"/>
    <text x="400" y="246" fill="#1a2026" font-size="12">rod 3</text>
    <!-- row 5: done -->
    <rect x="70" y="292" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="114" y="292" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="202" y="292" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="246" y="292" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="290" y="292" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <text x="400" y="304" fill="#5c6b76" font-size="12">done</text>
    <text x="224" y="366" text-anchor="middle" fill="#1a2026" font-weight="600">7 + 6 + 4 + 3 = 20</text>
  </g>
  <!-- ===== right panel: cut order 3, 5, 1, 4 ===== -->
  <g transform="translate(440,0)">
    <!-- row 1: whole stick, cut 3 -->
    <rect x="70" y="60" width="308" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <line x1="202" y1="56" x2="202" y2="80" stroke="#c0392b" stroke-width="1.8"/>
    <line x1="114" y1="56" x2="114" y2="80" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="246" y1="56" x2="246" y2="80" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="290" y1="56" x2="290" y2="80" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <g fill="#5c6b76" font-size="10.5" text-anchor="middle">
      <text x="70" y="94">0</text><text x="114" y="94">1</text><text x="158" y="94">2</text><text x="202" y="94">3</text><text x="246" y="94">4</text><text x="290" y="94">5</text><text x="334" y="94">6</text><text x="378" y="94">7</text>
    </g>
    <text x="400" y="72" fill="#1a2026" font-size="12">rod 7</text>
    <!-- row 2: cut 5 -->
    <rect x="70" y="118" width="132" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="202" y="118" width="176" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <line x1="114" y1="114" x2="114" y2="138" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="290" y1="114" x2="290" y2="138" stroke="#c0392b" stroke-width="1.8"/>
    <text x="400" y="130" fill="#1a2026" font-size="12">rod 4</text>
    <!-- row 3: cut 1 -->
    <rect x="70" y="176" width="132" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="202" y="176" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="290" y="176" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <line x1="114" y1="172" x2="114" y2="196" stroke="#c0392b" stroke-width="1.8"/>
    <line x1="246" y1="172" x2="246" y2="196" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="400" y="188" fill="#1a2026" font-size="12">rod 3</text>
    <!-- row 4: cut 4 -->
    <rect x="70" y="234" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="114" y="234" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="202" y="234" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="290" y="234" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <line x1="246" y1="230" x2="246" y2="254" stroke="#c0392b" stroke-width="1.8"/>
    <text x="400" y="246" fill="#1a2026" font-size="12">rod 2</text>
    <!-- row 5: done -->
    <rect x="70" y="292" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="114" y="292" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="202" y="292" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="246" y="292" width="44" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <rect x="290" y="292" width="88" height="16" fill="#e8d5b7" stroke="#b08968" stroke-width="1.2"/>
    <text x="400" y="304" fill="#5c6b76" font-size="12">done</text>
    <text x="224" y="366" text-anchor="middle" fill="#1a2026" font-weight="600">7 + 4 + 3 + 2 = 16</text>
  </g>
  <text x="440" y="404" text-anchor="middle" fill="#5c6b76" font-size="12.5">cutting near the middle first keeps the later rods short — 16 is the minimum</text>
</svg>
