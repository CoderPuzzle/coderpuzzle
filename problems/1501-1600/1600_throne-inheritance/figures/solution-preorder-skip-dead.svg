<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- example 1 family: king > (andy, bob, catherine); andy > matthew; bob > (alex, asha); badges = pre-order visit numbers 1..7; bob is dead: struck out and grayed, yet popped normally so his children keep positions 5 and 6 -->
  <g stroke="#42525e" stroke-width="1.4">
    <path d="M 320 76 L 140 122" fill="none"/>
    <path d="M 320 76 L 320 122" fill="none"/>
    <path d="M 320 76 L 500 122" fill="none"/>
    <path d="M 140 156 L 140 202" fill="none"/>
    <path d="M 320 156 L 262 202" fill="none"/>
    <path d="M 320 156 L 378 202" fill="none"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="270" y="42" width="100" height="34" rx="8"/>
    <rect x="90" y="122" width="100" height="34" rx="8"/>
    <rect x="450" y="122" width="100" height="34" rx="8"/>
    <rect x="90" y="202" width="100" height="34" rx="8"/>
    <rect x="212" y="202" width="100" height="34" rx="8"/>
    <rect x="328" y="202" width="100" height="34" rx="8"/>
  </g>
  <rect x="270" y="122" width="100" height="34" rx="8" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4"/>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#1a2026">
    <text x="320" y="64">king</text>
    <text x="140" y="144">andy</text>
    <text x="500" y="144">catherine</text>
    <text x="140" y="224">matthew</text>
    <text x="262" y="224">alex</text>
    <text x="378" y="224">asha</text>
  </g>
  <text x="320" y="144" text-anchor="middle" font-weight="600" font-size="14" fill="#9aa7b2">bob</text>
  <path d="M 278 139 H 362" stroke="#9aa7b2" stroke-width="1.5" fill="none"/>
  <text x="262" y="144" text-anchor="end" fill="#9aa7b2" font-size="10.5">dead</text>
  <g>
    <circle cx="374" cy="42" r="9.5" fill="#dbe4fb"/><text x="374" y="46" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">1</text>
    <circle cx="194" cy="122" r="9.5" fill="#dbe4fb"/><text x="194" y="126" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">2</text>
    <circle cx="374" cy="122" r="9.5" fill="#dbe4fb"/><text x="374" y="126" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">4</text>
    <circle cx="554" cy="122" r="9.5" fill="#dbe4fb"/><text x="554" y="126" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">7</text>
    <circle cx="194" cy="202" r="9.5" fill="#dbe4fb"/><text x="194" y="206" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">3</text>
    <circle cx="316" cy="202" r="9.5" fill="#dbe4fb"/><text x="316" y="206" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">5</text>
    <circle cx="432" cy="202" r="9.5" fill="#dbe4fb"/><text x="432" y="206" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">6</text>
  </g>
  <text x="320" y="264" text-anchor="middle" fill="#1a2026" font-size="13">Pre-order visit numbers 1–7 run king, andy, matthew, bob, alex, asha, catherine; dead bob</text>
  <text x="320" y="284" text-anchor="middle" fill="#1a2026" font-size="13">is still visited at <tspan fill="#4169E1" font-weight="600">4</tspan> and his children keep <tspan fill="#4169E1" font-weight="600">5</tspan> and <tspan fill="#4169E1" font-weight="600">6</tspan> — the order skips only bob.</text>
</svg>
