<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="560" height="200" fill="#ffffff"/>
  <!-- number line -->
  <line x1="50" y1="130" x2="490" y2="130" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.2">
    <line x1="50" y1="125" x2="50" y2="135"/><line x1="105" y1="125" x2="105" y2="135"/><line x1="160" y1="125" x2="160" y2="135"/>
    <line x1="215" y1="125" x2="215" y2="135"/><line x1="270" y1="125" x2="270" y2="135"/><line x1="325" y1="125" x2="325" y2="135"/>
    <line x1="380" y1="125" x2="380" y2="135"/><line x1="435" y1="125" x2="435" y2="135"/><line x1="490" y1="125" x2="490" y2="135"/>
  </g>
  <g fill="#5c6b76" font-size="11" text-anchor="middle">
    <text x="50" y="152">0</text><text x="105" y="152">1</text><text x="160" y="152">2</text><text x="215" y="152">3</text>
    <text x="270" y="152">4</text><text x="325" y="152">5</text><text x="380" y="152">6</text><text x="435" y="152">7</text><text x="490" y="152">8</text>
  </g>
  <!-- baskets -->
  <g fill="#f3e9d2" stroke="#b08968" stroke-width="1.4">
    <path d="M 91 126 L 119 126 L 114 106 L 96 106 Z"/>
    <path d="M 146 126 L 174 126 L 169 106 L 151 106 Z"/>
    <path d="M 201 126 L 229 126 L 224 106 L 206 106 Z"/>
    <path d="M 256 126 L 284 126 L 279 106 L 261 106 Z"/>
    <path d="M 421 126 L 449 126 L 444 106 L 426 106 Z"/>
  </g>
  <!-- balls in baskets 1, 4, 7 -->
  <g fill="#4169E1" stroke="#274db1" stroke-width="1.4">
    <circle cx="105" cy="96" r="9"/>
    <circle cx="270" cy="96" r="9"/>
    <circle cx="435" cy="96" r="9"/>
  </g>
  <!-- force arrows -->
  <line x1="118" y1="62" x2="257" y2="62" stroke="#c0392b" stroke-width="1.6" marker-start="url(#f)" marker-end="url(#f)"/>
  <line x1="283" y1="62" x2="422" y2="62" stroke="#c0392b" stroke-width="1.6" marker-start="url(#f)" marker-end="url(#f)"/>
  <text x="187" y="50" text-anchor="middle" fill="#c0392b" font-size="12">force 3</text>
  <text x="352" y="50" text-anchor="middle" fill="#c0392b" font-size="12">force 3</text>
  <text x="270" y="185" text-anchor="middle" fill="#1a2026" font-weight="600">balls at 1, 4, 7 — gaps |1−4| = |4−7| = 3, the best minimum force</text>
</svg>
