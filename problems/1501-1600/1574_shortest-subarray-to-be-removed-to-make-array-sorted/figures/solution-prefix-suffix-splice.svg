<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="284" fill="#ffffff"/>
  <!-- arr = [1,2,3,10,4,2,3,5]; sorted prefix arr[0..2] = [1,2,3], sorted suffix arr[5..7] = [2,3,5];
       two-pointer splice at i = 2, j = 6 (arr[2] = 3 &lt;= arr[6] = 3) removes arr[3..5] = [10,4,2];
       cells 56w, pitch 62, x = 72 + 62k, y = 96 -->
  <text x="162" y="78" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">sorted prefix arr[0..2] = [1, 2, 3]</text>
  <path d="M 72 92 L 72 88 L 252 88 L 252 92" fill="none" stroke="#4169E1" stroke-width="1.5"/>
  <text x="472" y="78" text-anchor="middle" fill="#5c6b76" font-weight="600" font-size="12.5">sorted suffix arr[5..7] = [2, 3, 5]</text>
  <path d="M 382 92 L 382 88 L 562 88 L 562 92" fill="none" stroke="#5c6b76" stroke-width="1.5"/>
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="72" y="96" width="56" height="44" fill="#dbe4fb"/><rect x="134" y="96" width="56" height="44" fill="#dbe4fb"/>
    <rect x="196" y="96" width="56" height="44" fill="#dbe4fb"/><rect x="258" y="96" width="56" height="44" fill="#ffffff"/>
    <rect x="320" y="96" width="56" height="44" fill="#ffffff"/>
  </g>
  <g fill="#ffffff" stroke="#4169E1" stroke-width="1.6">
    <rect x="382" y="96" width="56" height="44"/><rect x="444" y="96" width="56" height="44"/><rect x="506" y="96" width="56" height="44"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13.5">
    <text x="100" y="123">1</text><text x="162" y="123">2</text><text x="224" y="123">3</text>
    <text x="286" y="123">10</text><text x="348" y="123">4</text><text x="410" y="123">2</text>
    <text x="472" y="123">3</text><text x="534" y="123">5</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="12">
    <text x="100" y="158">0</text><text x="162" y="158">1</text><text x="224" y="158">2</text>
    <text x="286" y="158">3</text><text x="348" y="158">4</text><text x="410" y="158">5</text>
    <text x="472" y="158">6</text><text x="534" y="158">7</text>
  </g>
  <path d="M 258 172 L 438 172" fill="none" stroke="#9aa7b2" stroke-width="1.5"/>
  <path d="M 258 172 L 258 178 M 438 172 L 438 178" stroke="#9aa7b2" stroke-width="1.5"/>
  <path d="M 224 166 L 218 178 L 230 178 Z" fill="#4169E1"/>
  <path d="M 472 166 L 466 178 L 478 178 Z" fill="#4169E1"/>
  <g text-anchor="middle" font-size="12.5" font-weight="600" fill="#4169E1">
    <text x="224" y="196">i = 2</text><text x="472" y="196">j = 6</text>
  </g>
  <text x="348" y="218" text-anchor="middle" fill="#1a2026" font-size="12.5">removed arr[3..5] = [10, 4, 2], length <tspan fill="#4169E1" font-weight="600">3</tspan></text>
  <text x="320" y="248" text-anchor="middle" fill="#1a2026" font-size="13">A splice with arr[i] ≤ arr[j] joins the two runs; here arr[2] = 3 ≤ arr[6] = 3,</text>
  <text x="320" y="266" text-anchor="middle" fill="#1a2026" font-size="13">removing [10, 4, 2] between them — the <tspan fill="#4169E1" font-weight="600">shortest</tspan> such removal, length 3.</text>
</svg>
