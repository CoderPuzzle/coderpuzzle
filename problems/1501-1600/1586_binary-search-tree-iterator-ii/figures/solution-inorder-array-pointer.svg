<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- tree [7,3,15,null,null,9,20]; in-order array [3,7,9,15,20]; cells w66 at x = 140+82i, sentinel at x = 54 -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="330" y1="58" x2="222" y2="134"/><line x1="330" y1="58" x2="438" y2="134"/>
    <line x1="438" y1="134" x2="386" y2="210"/><line x1="438" y1="134" x2="490" y2="210"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="330" cy="58" r="21"/><circle cx="222" cy="134" r="21"/><circle cx="438" cy="134" r="21"/>
    <circle cx="386" cy="210" r="21"/><circle cx="490" cy="210" r="21"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="330" y="63">7</text><text x="222" y="139">3</text><text x="438" y="139">15</text>
    <text x="386" y="215">9</text><text x="490" y="215">20</text>
  </g>
  <!-- next(): one slot right, from index 0 to index 1 -->
  <text x="214" y="240" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">next()</text>
  <path d="M 173 282 Q 214 246 255 282" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="278" text-anchor="middle" fill="#5c6b76" font-size="12">in-order array</text>
  <!-- array: sentinel -1 plus the five values -->
  <rect x="54" y="286" width="66" height="40" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.2"/>
  <text x="87" y="316" text-anchor="middle" fill="#9aa7b2" font-size="12">−1</text>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <rect x="222" y="286" width="66" height="40"/><rect x="304" y="286" width="66" height="40"/>
    <rect x="386" y="286" width="66" height="40"/><rect x="468" y="286" width="66" height="40"/>
  </g>
  <rect x="140" y="286" width="66" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <text x="173" y="310" fill="#4169E1">3</text><text x="255" y="310">7</text><text x="337" y="310">9</text>
    <text x="419" y="310">15</text><text x="501" y="310">20</text>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-size="9.5">
    <text x="173" y="323">0</text><text x="255" y="323">1</text><text x="337" y="323">2</text>
    <text x="419" y="323">3</text><text x="501" y="323">4</text>
  </g>
  <!-- prev(): one slot left, from index 1 back to index 0 -->
  <path d="M 255 332 Q 214 366 173 332" fill="none" stroke="#5c6b76" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="286" y="358" text-anchor="start" fill="#5c6b76" font-size="12" font-weight="600">prev()</text>
  <text x="330" y="402" text-anchor="middle" fill="#1a2026" font-size="13">next() twice reaches 3 then 7, prev() retreats one slot to 3 — after the three</text>
  <text x="330" y="422" text-anchor="middle" fill="#1a2026" font-size="13">calls the pointer rests at index 0 (value 3), with 9, 15, 20 still ahead.</text>
</svg>
