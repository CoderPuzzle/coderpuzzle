<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 1: s = "adefaddaccc" (indices 0-10). Cells: x = 140 + 42i, 38 wide.
       Ranges: a [0,7], d [1,6] (dead: the a inside first occurs at 0), e [2,2],
       f [3,3], c [8,10]. Greedy keeps e, f, ccc. -->
  <text x="40" y="44" font-size="12.5" fill="#5c6b76">each character's [first, last] range over s = "adefaddaccc":</text>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="140" y="56" width="332" height="13"/>
    <rect x="224" y="92" width="38" height="13"/>
    <rect x="266" y="110" width="38" height="13"/>
    <rect x="476" y="128" width="122" height="13"/>
  </g>
  <rect x="182" y="74" width="248" height="13" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <g font-size="11.5">
    <text x="134" y="66.5" text-anchor="end" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">a</tspan> [0,7]</text>
    <text x="134" y="84.5" text-anchor="end" fill="#9aa7b2">d [1,6]</text>
    <text x="134" y="102.5" text-anchor="end" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">e</tspan> [2,2]</text>
    <text x="134" y="120.5" text-anchor="end" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">f</tspan> [3,3]</text>
    <text x="134" y="138.5" text-anchor="end" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">c</tspan> [8,10]</text>
  </g>
  <text x="306" y="84" text-anchor="middle" font-size="10.5" fill="#9aa7b2">a occurs first at 0</text>
  <g stroke="#9aa7b2" stroke-width="1.8" stroke-linecap="round">
    <line x1="410" y1="76.5" x2="418" y2="84.5"/>
    <line x1="418" y1="76.5" x2="410" y2="84.5"/>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="140" y="162" width="38" height="34"/><rect x="182" y="162" width="38" height="34"/>
    <rect x="224" y="162" width="38" height="34"/><rect x="266" y="162" width="38" height="34"/>
    <rect x="308" y="162" width="38" height="34"/><rect x="350" y="162" width="38" height="34"/>
    <rect x="392" y="162" width="38" height="34"/><rect x="434" y="162" width="38" height="34"/>
    <rect x="476" y="162" width="38" height="34"/><rect x="518" y="162" width="38" height="34"/>
    <rect x="560" y="162" width="38" height="34"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="159" y="184">a</text><text x="201" y="184">d</text><text x="243" y="184">e</text>
    <text x="285" y="184">f</text><text x="327" y="184">a</text><text x="369" y="184">d</text>
    <text x="411" y="184">d</text><text x="453" y="184">a</text><text x="495" y="184">c</text>
    <text x="537" y="184">c</text><text x="579" y="184">c</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#9aa7b2">
    <text x="159" y="212">0</text><text x="201" y="212">1</text><text x="243" y="212">2</text>
    <text x="285" y="212">3</text><text x="327" y="212">4</text><text x="369" y="212">5</text>
    <text x="411" y="212">6</text><text x="453" y="212">7</text><text x="495" y="212">8</text>
    <text x="537" y="212">9</text><text x="579" y="212">10</text>
  </g>
  <text x="40" y="244" font-size="12.5" fill="#5c6b76">then end-sorted greedy (keep when start &gt; lastEnd):</text>
  <g stroke="#4169E1" stroke-width="1.5" fill="#dbe4fb">
    <rect x="60" y="254" width="64" height="24" rx="4"/>
    <rect x="136" y="254" width="64" height="24" rx="4"/>
    <rect x="342" y="254" width="80" height="24" rx="4"/>
  </g>
  <rect x="212" y="254" width="118" height="24" rx="4" fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="12.5">
    <text x="92" y="270" fill="#1a2026">e [2,2]</text>
    <text x="168" y="270" fill="#1a2026">f [3,3]</text>
    <text x="271" y="270" fill="#5c6b76">adefadda [0,7]</text>
    <text x="382" y="270" fill="#1a2026">ccc [8,10]</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="92" y="292" fill="#4169E1" font-weight="600">keep</text>
    <text x="168" y="292" fill="#4169E1" font-weight="600">keep</text>
    <text x="271" y="292" fill="#9aa7b2">skip &#8212; 0 &#8804; 3</text>
    <text x="382" y="292" fill="#4169E1" font-weight="600">keep</text>
  </g>
  <g font-size="12.5">
    <text x="470" y="258" fill="#1a2026">lastEnd climbs 2 &#8594; 3</text>
    <text x="470" y="276" fill="#5c6b76">adefadda starts at 0 &#8804; 3</text>
    <text x="470" y="294" fill="#1a2026">ccc starts at 8 &gt; 3</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="340" y="318">Fixed-point expansion gives the good substrings e, f, adefadda, ccc; the end-sorted greedy</text>
    <text x="340" y="336">keeps <tspan fill="#4169E1" font-weight="600">e, f, ccc</tspan> &#8212; <tspan fill="#4169E1" font-weight="600">3</tspan> non-overlapping substrings, the answer ["e","f","ccc"].</text>
  </g>
</svg>
