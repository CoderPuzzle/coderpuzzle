<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree root = [1,2,3,null,4], distance = 3; tables count leaves by depth below each node -->
  <g stroke="#4169E1" stroke-width="2.5" fill="none">
    <line x1="138.2" y1="226.5" x2="91.8" y2="173.5" marker-end="url(#arrow)"/>
    <line x1="91.8" y1="146.5" x2="138.2" y2="93.5" marker-end="url(#arrow)"/>
    <line x1="255" y1="150" x2="165" y2="90" marker-end="url(#arrow)"/>
  </g>
  <circle cx="150" cy="80" r="18" fill="#4169E1"/>
  <text x="150" y="85" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <circle cx="80" cy="160" r="18" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <text x="80" y="165" text-anchor="middle" fill="#1a2026">2</text>
  <circle cx="270" cy="160" r="18" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="270" y="165" text-anchor="middle" fill="#1a2026">3</text>
  <circle cx="150" cy="240" r="18" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
  <text x="150" y="245" text-anchor="middle" fill="#1a2026">4</text>
  <g font-size="12" fill="#9aa7b2" text-anchor="middle">
    <text x="270" y="196">leaf 3</text>
    <text x="150" y="276">leaf 4</text>
  </g>
  <!-- bottom-up table flow -->
  <g font-size="13">
    <text x="350" y="62" fill="#1a2026">leaf 3 → <tspan fill="#4169E1" font-weight="600">{0: 1}</tspan></text>
    <text x="350" y="96" fill="#1a2026">leaf 4 → <tspan fill="#4169E1" font-weight="600">{0: 1}</tspan></text>
    <text x="350" y="130" fill="#1a2026">node 2: child 4's {0: 1} shifts to <tspan fill="#4169E1" font-weight="600">{1: 1}</tspan></text>
  </g>
  <rect x="350" y="152" width="286" height="96" rx="8" fill="#dbe4fb"/>
  <text x="362" y="178" fill="#1a2026" font-weight="600">merge at root 1</text>
  <text x="362" y="202" fill="#1a2026">left {1: 1} × right {0: 1}: 1 + 0 + 2 = 3 ≤ 3</text>
  <text x="362" y="226" fill="#4169E1" font-weight="600">pairs += 1 × 1 = 1</text>
  <text x="330" y="300" text-anchor="middle" fill="#1a2026" font-size="13">Leaf 4 sits depth 1 below node 2, leaf 3 depth 0 below itself:</text>
  <text x="330" y="318" text-anchor="middle" fill="#1a2026" font-size="13">through the root 1 + 0 + 2 = 3 ≤ 3, so 1 × 1 = <tspan fill="#4169E1" font-weight="600">1 good pair</tspan>.</text>
</svg>
