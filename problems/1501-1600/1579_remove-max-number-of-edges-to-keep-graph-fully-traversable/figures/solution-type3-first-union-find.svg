<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="352" fill="#ffffff"/>
  <!-- n = 4; edges = [[3,1,2],[3,2,3],[1,1,3],[1,2,4],[1,1,2],[2,3,4]];
       pass 1 (type 3) unions in both DSUs: [3,1,2] and [3,2,3] used;
       pass 2 (type 1) unions Alice only: [1,2,4] used, [1,1,3] and [1,1,2] redundant;
       pass 3 (type 2) unions Bob only: [2,3,4] used; used = 4, removable = 6 - 4 = 2 -->
  <g fill="#9aa7b2" font-size="12" font-weight="600">
    <text x="52" y="40">edge</text><text x="170" y="40">Alice's union-find</text>
    <text x="400" y="40">Bob's union-find</text><text x="560" y="40">verdict</text>
  </g>
  <text x="52" y="66" fill="#4169E1" font-size="12.5" font-weight="600">pass 1 · type 3 edges (union in both DSUs)</text>
  <g font-size="13">
    <text x="52" y="90" fill="#1a2026">[<tspan fill="#4169E1" font-weight="600">3</tspan>, 1, 2]</text>
    <text x="170" y="90" fill="#1a2026">unions 1, 2</text>
    <text x="400" y="90" fill="#1a2026">unions 1, 2</text>
    <text x="560" y="90" fill="#4169E1" font-weight="600">used</text>
    <text x="52" y="120" fill="#1a2026">[<tspan fill="#4169E1" font-weight="600">3</tspan>, 2, 3]</text>
    <text x="170" y="120" fill="#1a2026">unions 2, 3</text>
    <text x="400" y="120" fill="#1a2026">unions 2, 3</text>
    <text x="560" y="120" fill="#4169E1" font-weight="600">used</text>
  </g>
  <text x="52" y="148" fill="#5c6b76" font-size="12.5" font-weight="600">pass 2 · type 1 edges (Alice only)</text>
  <g font-size="13">
    <text x="52" y="172" fill="#1a2026">[<tspan fill="#5c6b76" font-weight="600">1</tspan>, 1, 3]</text>
    <text x="170" y="172" fill="#1a2026">1, 3 already joined</text>
    <text x="400" y="172" fill="#9aa7b2">—</text>
    <text x="560" y="172" fill="#9aa7b2">skip</text>
    <text x="52" y="202" fill="#1a2026">[<tspan fill="#5c6b76" font-weight="600">1</tspan>, 2, 4]</text>
    <text x="170" y="202" fill="#1a2026">unions 2, 4</text>
    <text x="400" y="202" fill="#9aa7b2">—</text>
    <text x="560" y="202" fill="#4169E1" font-weight="600">used</text>
    <text x="52" y="232" fill="#1a2026">[<tspan fill="#5c6b76" font-weight="600">1</tspan>, 1, 2]</text>
    <text x="170" y="232" fill="#1a2026">already joined</text>
    <text x="400" y="232" fill="#9aa7b2">—</text>
    <text x="560" y="232" fill="#9aa7b2">skip</text>
  </g>
  <text x="52" y="260" fill="#5c6b76" font-size="12.5" font-weight="600">pass 3 · type 2 edges (Bob only)</text>
  <g font-size="13">
    <text x="52" y="284" fill="#1a2026">[<tspan fill="#5c6b76" font-weight="600">2</tspan>, 3, 4]</text>
    <text x="170" y="284" fill="#9aa7b2">—</text>
    <text x="400" y="284" fill="#1a2026">unions 3, 4</text>
    <text x="560" y="284" fill="#4169E1" font-weight="600">used</text>
  </g>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">Only edges that merge a component are kept: 4 of the 6 edges are used,</text>
  <text x="320" y="334" text-anchor="middle" fill="#1a2026" font-size="13">so the redundant [1, 1, 3] and [1, 1, 2] are removable — answer <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
