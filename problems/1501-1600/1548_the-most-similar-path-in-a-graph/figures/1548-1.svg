<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="16" y="15" width="588" height="290" rx="9" fill="#f4f6f7" stroke="#bfc8cf" stroke-width="2"/>
<text x="38" y="71" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">define editDistance(targetPath, myPath) {</text>
<text x="38" y="98" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    dis := 0</text>
<text x="38" y="125" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    a := targetPath.length</text>
<text x="38" y="152" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    b := myPath.length</text>
<text x="38" y="179" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    if (a != b) { return 1000000000 }</text>
<text x="38" y="206" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    for (i := 0; i &lt; a; i := i + 1) {</text>
<text x="38" y="233" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">        if (targetPath[i] != myPath[i]) { dis += 1 }</text>
<text x="38" y="260" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    }</text>
<text x="38" y="287" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    return dis</text>
<text x="38" y="314" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">}</text>
</svg>
