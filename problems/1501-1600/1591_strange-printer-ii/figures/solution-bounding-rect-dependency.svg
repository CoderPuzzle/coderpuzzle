<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[1,1,1,1],[1,2,2,1],[1,2,2,1],[1,1,1,1]]; cells 46px at (64,64); 1's rect = whole grid, 2's rect = inner 2x2 -->
  <g stroke="#42525e" stroke-width="1.2">
    <rect x="64" y="64" width="46" height="46" fill="#f0f3f7"/><rect x="110" y="64" width="46" height="46" fill="#f0f3f7"/>
    <rect x="156" y="64" width="46" height="46" fill="#f0f3f7"/><rect x="202" y="64" width="46" height="46" fill="#f0f3f7"/>
    <rect x="64" y="110" width="46" height="46" fill="#f0f3f7"/><rect x="110" y="110" width="46" height="46" fill="#dbe4fb"/>
    <rect x="156" y="110" width="46" height="46" fill="#dbe4fb"/><rect x="202" y="110" width="46" height="46" fill="#f0f3f7"/>
    <rect x="64" y="156" width="46" height="46" fill="#f0f3f7"/><rect x="110" y="156" width="46" height="46" fill="#dbe4fb"/>
    <rect x="156" y="156" width="46" height="46" fill="#dbe4fb"/><rect x="202" y="156" width="46" height="46" fill="#f0f3f7"/>
    <rect x="64" y="202" width="46" height="46" fill="#f0f3f7"/><rect x="110" y="202" width="46" height="46" fill="#f0f3f7"/>
    <rect x="156" y="202" width="46" height="46" fill="#f0f3f7"/><rect x="202" y="202" width="46" height="46" fill="#f0f3f7"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="13">
    <text x="87" y="92">1</text><text x="133" y="92">1</text><text x="179" y="92">1</text><text x="225" y="92">1</text>
    <text x="87" y="138">1</text><text x="133" y="138">2</text><text x="179" y="138">2</text><text x="225" y="138">1</text>
    <text x="87" y="184">1</text><text x="133" y="184">2</text><text x="179" y="184">2</text><text x="225" y="184">1</text>
    <text x="87" y="230">1</text><text x="133" y="230">1</text><text x="179" y="230">1</text><text x="225" y="230">1</text>
  </g>
  <rect x="57" y="57" width="202" height="202" fill="none" stroke="#5c6b76" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="110" y="110" width="92" height="92" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <!-- legend and bounding rectangles -->
  <rect x="306" y="64" width="16" height="16" fill="#f0f3f7" stroke="#42525e" stroke-width="1.2"/>
  <text x="330" y="77" fill="#5c6b76" font-size="12">cells showing 1</text>
  <rect x="306" y="88" width="16" height="16" fill="#dbe4fb" stroke="#42525e" stroke-width="1.2"/>
  <text x="330" y="101" fill="#5c6b76" font-size="12">cells showing 2</text>
  <text x="306" y="138" fill="#1a2026" font-size="12.5">dashed: 1's bounding rect = the whole 4×4</text>
  <text x="306" y="160" fill="#1a2026" font-size="12.5">solid: 2's bounding rect = rows 1–2, cols 1–2</text>
  <!-- dependency edge 1 -> 2 -->
  <text x="306" y="196" fill="#5c6b76" font-size="12">scanning 1's rect finds 2's cells → edge</text>
  <rect x="306" y="206" width="36" height="32" fill="#f0f3f7" stroke="#42525e" stroke-width="1.5"/>
  <text x="324" y="227" text-anchor="middle" font-weight="600">1</text>
  <line x1="348" y1="222" x2="400" y2="222" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="406" y="206" width="36" height="32" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="424" y="227" text-anchor="middle" font-weight="600" fill="#4169E1">2</text>
  <text x="320" y="296" text-anchor="middle" fill="#1a2026" font-size="13">Color 1's bounding rectangle contains cells showing 2, so the graph gets</text>
  <text x="320" y="316" text-anchor="middle" fill="#1a2026" font-size="13">edge 1 → 2; stamping in topological order 1, then 2 works — <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
