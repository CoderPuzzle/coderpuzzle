<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="390" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 1: n = 7, edges = [[0,1],[0,2],[1,4],[1,5],[2,3],[2,6]], labels = "abaedcd".
       Circles r=15; the letter beside each circle is its label. BFS order [0,1,2,4,5,3,6],
       processed backwards: child counters fold into parents; table shows parent's counter
       after each fold. -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="40" y="60">BFS order <tspan fill="#1a2026">[0,1,2,4,5,3,6]</tspan>;</text>
    <text x="40" y="78">read backwards, every child</text>
    <text x="40" y="96">folds its finished 26-slot</text>
    <text x="40" y="114">counter into its parent.</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="360" y1="48" x2="240" y2="104"/>
    <line x1="360" y1="48" x2="440" y2="104"/>
    <line x1="240" y1="104" x2="180" y2="160"/>
    <line x1="240" y1="104" x2="300" y2="160"/>
    <line x1="440" y1="104" x2="400" y2="160"/>
    <line x1="440" y1="104" x2="520" y2="160"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5">
    <circle cx="240" cy="104" r="15"/><circle cx="440" cy="104" r="15"/>
    <circle cx="180" cy="160" r="15"/><circle cx="300" cy="160" r="15"/>
    <circle cx="400" cy="160" r="15"/><circle cx="520" cy="160" r="15"/>
  </g>
  <circle cx="360" cy="48" r="15" fill="#dbe4fb" stroke="#42525e" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="360" y="53">0</text><text x="240" y="109">1</text><text x="440" y="109">2</text>
    <text x="180" y="165">4</text><text x="300" y="165">5</text><text x="400" y="165">3</text>
    <text x="520" y="165">6</text>
  </g>
  <g font-size="12" font-weight="600" fill="#4169E1">
    <text x="262" y="108">b</text><text x="462" y="108">a</text>
    <text x="202" y="164">d</text><text x="322" y="164">c</text>
    <text x="422" y="164">e</text><text x="542" y="164">d</text>
  </g>
  <text x="384" y="52" font-size="12" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">a2</tspan> b1 c1 d1 e1</text>
  <g font-size="11.5" fill="#5c6b76">
    <text x="90" y="200" text-anchor="middle">step</text>
    <text x="170" y="200" text-anchor="middle">fold</text>
    <text x="250" y="200">parent's counter after</text>
  </g>
  <line x1="60" y1="208" x2="430" y2="208" stroke="#dbe4fb" stroke-width="1"/>
  <g font-size="12.5">
    <g fill="#4169E1" font-weight="600" text-anchor="middle">
      <text x="90" y="222">1</text><text x="90" y="244">2</text><text x="90" y="266">3</text>
      <text x="90" y="288">4</text><text x="90" y="310">5</text><text x="90" y="332">6</text>
    </g>
    <g fill="#1a2026" text-anchor="middle">
      <text x="170" y="222">6 &#8594; 2</text><text x="170" y="244">3 &#8594; 2</text><text x="170" y="266">5 &#8594; 1</text>
      <text x="170" y="288">4 &#8594; 1</text><text x="170" y="310">2 &#8594; 0</text><text x="170" y="332">1 &#8594; 0</text>
    </g>
    <g fill="#1a2026">
      <text x="250" y="222">a1 d1</text>
      <text x="250" y="244">a1 d1 e1</text>
      <text x="250" y="266">b1 c1</text>
      <text x="250" y="288">b1 c1 d1</text>
      <text x="250" y="310">a2 d1 e1</text>
      <text x="250" y="332"><tspan fill="#4169E1" font-weight="600">a2</tspan> b1 c1 d1 e1</text>
    </g>
  </g>
  <g font-size="12" fill="#5c6b76">
    <text x="470" y="222">counters hold 26 slots,</text>
    <text x="470" y="240">one per letter &#8212; only the</text>
    <text x="470" y="258">nonzero slots are shown.</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="340" y="356">Every counter starts seeded with its own label, and the <tspan fill="#4169E1" font-weight="600">reversed BFS order</tspan> guarantees</text>
    <text x="340" y="374">each is final when its parent absorbs it; node 0's slot a ends at <tspan fill="#4169E1" font-weight="600">2</tspan> &#8212; ans = <tspan fill="#4169E1" font-weight="600">[2,1,1,1,1,1,1]</tspan>.</text>
  </g>
</svg>
