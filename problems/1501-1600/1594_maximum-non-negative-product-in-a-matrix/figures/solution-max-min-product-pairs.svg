<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 304" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="304" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[1,-2,1],[1,-2,1],[3,-4,1]]; each cell: small gray grid value top-left, fill order 1..9 top-right, dp pair "max - min" centred; cells 108x54 at (56,58), 6px gaps; dp[2][1] = (8,-16): min(-2) above x (-4) = +8 -->
  <text x="224" y="44" text-anchor="middle" fill="#5c6b76" font-size="12.5">dp cell = max · min product, filled row-major</text>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.4">
    <rect x="56" y="58" width="108" height="54"/><rect x="170" y="58" width="108" height="54"/><rect x="284" y="58" width="108" height="54"/>
    <rect x="56" y="118" width="108" height="54"/><rect x="170" y="118" width="108" height="54"/><rect x="284" y="118" width="108" height="54"/>
    <rect x="56" y="178" width="108" height="54"/><rect x="170" y="178" width="108" height="54" fill="#dbe4fb"/><rect x="284" y="178" width="108" height="54"/>
  </g>
  <g text-anchor="start" fill="#5c6b76" font-size="10.5">
    <text x="64" y="74">1</text><text x="178" y="74">-2</text><text x="292" y="74">1</text>
    <text x="64" y="134">1</text><text x="178" y="134">-2</text><text x="292" y="134">1</text>
    <text x="64" y="194">3</text><text x="178" y="194">-4</text><text x="292" y="194">1</text>
  </g>
  <g text-anchor="end" fill="#9aa7b2" font-size="9.5">
    <text x="156" y="74">1</text><text x="270" y="74">2</text><text x="384" y="74">3</text>
    <text x="156" y="134">4</text><text x="270" y="134">5</text><text x="384" y="134">6</text>
    <text x="156" y="194">7</text><text x="270" y="194">8</text><text x="384" y="194">9</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="110" y="98">1 · 1</text><text x="224" y="98">-2 · -2</text><text x="338" y="98">-2 · -2</text>
    <text x="110" y="158">1 · 1</text><text x="224" y="158">4 · -2</text><text x="338" y="158">4 · -2</text>
    <text x="110" y="218">3 · 3</text>
  </g>
  <text x="224" y="218" text-anchor="middle" font-weight="600" font-size="15"><tspan fill="#4169E1">8</tspan><tspan fill="#1a2026"> · -16</tspan></text>
  <text x="338" y="218" text-anchor="middle" font-weight="600" font-size="15"><tspan fill="#4169E1">8</tspan><tspan fill="#1a2026"> · -16</tspan></text>
  <path d="M 396 205 H 416" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- callout: the four candidates at the -4 cell -->
  <rect x="420" y="58" width="214" height="174" fill="#ffffff" stroke="#42525e" stroke-width="1.2"/>
  <text x="527" y="82" text-anchor="middle" fill="#4169E1" font-size="13" font-weight="600">the -4 flip at cell (2, 1)</text>
  <g text-anchor="start" fill="#1a2026" font-size="12">
    <text x="432" y="106">from above (4, -2):</text>
    <text x="446" y="124">4 × -4 = -16</text>
    <text x="446" y="142">-2 × -4 = +8  (min flips)</text>
    <text x="432" y="164">from left (3, 3): 3 × -4 = -12</text>
    <text x="432" y="196" font-weight="600">max = <tspan fill="#4169E1">+8</tspan>, min = -16</text>
  </g>
  <text x="330" y="266" text-anchor="middle" fill="#1a2026" font-size="13">Carrying both signs pays off: at the -4 cell the running minimum -2 flips to the</text>
  <text x="330" y="286" text-anchor="middle" fill="#1a2026" font-size="13">maximum <tspan fill="#4169E1" font-weight="600">+8</tspan>, and the corner keeps max <tspan fill="#4169E1" font-weight="600">8</tspan> — example 2's answer is <tspan fill="#4169E1" font-weight="600">8</tspan>.</text>
</svg>
