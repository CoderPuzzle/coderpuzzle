<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 352" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="352" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid = [[a,a,a,a],[a,b,b,a],[a,b,b,a],[a,a,a,a]]; cells 54x42 at (110,64); small numerals are push order; DFS pops walk the ring, pop (2,0) meets visited non-parent (1,0) -->
  <g stroke="#42525e" stroke-width="1.3" fill="#dbe4fb">
    <rect x="110" y="64" width="54" height="42"/><rect x="164" y="64" width="54" height="42"/><rect x="218" y="64" width="54" height="42"/><rect x="272" y="64" width="54" height="42"/>
    <rect x="110" y="106" width="54" height="42"/>
    <rect x="272" y="106" width="54" height="42"/>
    <rect x="110" y="148" width="54" height="42"/>
    <rect x="272" y="148" width="54" height="42"/>
    <rect x="110" y="190" width="54" height="42"/><rect x="164" y="190" width="54" height="42"/><rect x="218" y="190" width="54" height="42"/><rect x="272" y="190" width="54" height="42"/>
  </g>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="164" y="106" width="54" height="42"/><rect x="218" y="106" width="54" height="42"/>
    <rect x="164" y="148" width="54" height="42"/><rect x="218" y="148" width="54" height="42"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="137" y="91">a</text><text x="191" y="91">a</text><text x="245" y="91">a</text><text x="299" y="91">a</text>
    <text x="299" y="133">a</text>
    <text x="299" y="175">a</text>
    <text x="137" y="217">a</text><text x="191" y="217">a</text><text x="245" y="217">a</text><text x="299" y="217">a</text>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#9aa7b2">
    <text x="191" y="133">b</text><text x="245" y="133">b</text>
    <text x="191" y="175">b</text><text x="245" y="175">b</text>
  </g>
  <text x="137" y="133" text-anchor="middle" font-weight="600" fill="#4169E1">a</text>
  <text x="137" y="175" text-anchor="middle" font-weight="600" fill="#4169E1">a</text>
  <!-- push order -->
  <g fill="#5c6b76" font-size="9.5">
    <text x="114" y="77">1</text><text x="114" y="119">2</text><text x="168" y="77">3</text>
    <text x="222" y="77">4</text><text x="276" y="77">5</text><text x="276" y="119">6</text>
    <text x="276" y="161">7</text><text x="276" y="203">8</text><text x="222" y="203">9</text>
    <text x="168" y="203">10</text><text x="112" y="203">11</text><text x="112" y="161">12</text>
  </g>
  <!-- parent arrows of the walk -->
  <g stroke="#5c6b76" stroke-width="1.6" fill="none">
    <path d="M 137 96 V 112" marker-end="url(#arrow)"/>
    <path d="M 147 91 H 163" marker-end="url(#arrow)"/>
    <path d="M 201 91 H 217" marker-end="url(#arrow)"/>
    <path d="M 255 91 H 271" marker-end="url(#arrow)"/>
    <path d="M 299 96 V 112" marker-end="url(#arrow)"/>
    <path d="M 299 138 V 154" marker-end="url(#arrow)"/>
    <path d="M 299 180 V 196" marker-end="url(#arrow)"/>
    <path d="M 289 217 H 273" marker-end="url(#arrow)"/>
    <path d="M 235 217 H 219" marker-end="url(#arrow)"/>
    <path d="M 181 217 H 165" marker-end="url(#arrow)"/>
    <path d="M 137 202 V 186" marker-end="url(#arrow)"/>
  </g>
  <!-- detection edge: (2,0) back to (1,0) -->
  <path d="M 137 158 V 144" fill="none" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <g text-anchor="end" fill="#4169E1" font-weight="600" font-size="11.5">
    <text x="100" y="143">visited,</text>
    <text x="100" y="157">not parent</text>
  </g>
  <!-- stack contents with parents -->
  <text x="370" y="70" fill="#5c6b76" font-size="11.5">stack (cell ← parent)</text>
  <g fill="#5c6b76" font-size="12">
    <text x="370" y="90">(0,0) seed</text>
    <text x="370" y="107">(1,0) ← (0,0)</text>
    <text x="370" y="124">(0,1) ← (0,0)</text>
    <text x="370" y="141">(0,2) ← (0,1)</text>
    <text x="370" y="158">(0,3) ← (0,2)</text>
    <text x="370" y="175">(1,3) ← (0,3)</text>
    <text x="370" y="192">(2,3) ← (1,3)</text>
    <text x="370" y="209">(3,3) ← (2,3)</text>
    <text x="370" y="226">(3,2) ← (3,3)</text>
    <text x="370" y="243">(3,1) ← (3,2)</text>
    <text x="370" y="260">(3,0) ← (3,1)</text>
  </g>
  <g fill="#4169E1" font-weight="600" font-size="12">
    <text x="370" y="277">(2,0) ← (3,0)</text>
    <text x="370" y="294">neighbor (1,0): visited, not parent</text>
  </g>
  <text x="310" y="322" text-anchor="middle" fill="#1a2026" font-size="13">Cells are marked when pushed, so meeting (1,0) again from (2,0), whose</text>
  <text x="310" y="340" text-anchor="middle" fill="#1a2026" font-size="13">parent (3,0) is elsewhere, closes the a-ring and the DFS returns <tspan fill="#4169E1" font-weight="600">true</tspan>.</text>
</svg>
