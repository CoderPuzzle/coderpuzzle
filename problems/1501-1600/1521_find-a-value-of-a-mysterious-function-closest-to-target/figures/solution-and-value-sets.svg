<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="312" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- Example 1: arr = [9,12,3,7,15], target = 5. Columns at x = 94 + 124i; set boxes
       56 wide, 24 tall, rows y = 108/136/164/192. Sets: {9}, {12,8}, {3,0}, {7,3,0},
       {15,7,3,0} (top box = arr[i] alone). Accent values 3, 7, 7 sit |v-5| = 2 from
       target. Bottom row: global best distance after each index. -->
  <text x="40" y="28" font-size="12.5" fill="#5c6b76">distinct AND-values over subarrays ending at i:</text>
  <text x="360" y="28" font-size="11.5" fill="#5c6b76">top box = arr[i] alone</text>
  <text x="56" y="78" text-anchor="end" font-size="11.5" fill="#5c6b76">arr</text>
  <g text-anchor="middle" font-size="12" fill="#5c6b76">
    <text x="94" y="52">i = 0</text><text x="218" y="52">i = 1</text><text x="342" y="52">i = 2</text>
    <text x="466" y="52">i = 3</text><text x="590" y="52">i = 4</text>
  </g>
  <g fill="#f0f3f7">
    <rect x="62" y="60" width="64" height="26"/><rect x="186" y="60" width="64" height="26"/>
    <rect x="310" y="60" width="64" height="26"/><rect x="434" y="60" width="64" height="26"/>
    <rect x="558" y="60" width="64" height="26"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1a2026">
    <text x="94" y="78">9</text><text x="218" y="78">12</text><text x="342" y="78">3</text>
    <text x="466" y="78">7</text><text x="590" y="78">15</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="66" y="108" width="56" height="24"/>
    <rect x="190" y="108" width="56" height="24"/><rect x="190" y="136" width="56" height="24"/>
    <rect x="314" y="108" width="56" height="24"/><rect x="314" y="136" width="56" height="24"/>
    <rect x="438" y="108" width="56" height="24"/><rect x="438" y="136" width="56" height="24"/><rect x="438" y="164" width="56" height="24"/>
    <rect x="562" y="108" width="56" height="24"/><rect x="562" y="136" width="56" height="24"/><rect x="562" y="164" width="56" height="24"/><rect x="562" y="192" width="56" height="24"/>
  </g>
  <g fill="#dbe4fb" stroke="#42525e" stroke-width="1.5">
    <rect x="66" y="108" width="56" height="24"/>
    <rect x="190" y="108" width="56" height="24"/>
    <rect x="314" y="108" width="56" height="24"/>
    <rect x="438" y="108" width="56" height="24"/>
    <rect x="562" y="108" width="56" height="24"/>
  </g>
  <g text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a2026">
    <text x="94" y="124.5">9</text>
    <text x="218" y="124.5">12</text><text x="218" y="152.5">8</text>
    <text x="342" y="124.5" fill="#4169E1">3</text><text x="342" y="152.5">0</text>
    <text x="466" y="124.5" fill="#4169E1">7</text><text x="466" y="152.5">3</text><text x="466" y="180.5">0</text>
    <text x="590" y="124.5">15</text><text x="590" y="152.5" fill="#4169E1">7</text><text x="590" y="180.5">3</text><text x="590" y="208.5">0</text>
  </g>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 128 150 L 184 150" marker-end="url(#arrow)"/>
    <path d="M 252 150 L 308 150" marker-end="url(#arrow)"/>
    <path d="M 376 150 L 432 150" marker-end="url(#arrow)"/>
    <path d="M 500 150 L 556 150" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5c6b76">
    <text x="156" y="142">&amp; 12</text><text x="280" y="142">&amp; 3</text>
    <text x="404" y="142">&amp; 7</text><text x="528" y="142">&amp; 15</text>
  </g>
  <text x="342" y="228" text-anchor="middle" font-size="10.5" fill="#9aa7b2">12&amp;3 = 8&amp;3 = 0</text>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="94" y="252" fill="#5c6b76">best 4</text>
    <text x="218" y="252" fill="#5c6b76">best 3</text>
    <text x="342" y="252" fill="#4169E1">best 2</text>
    <text x="466" y="252" fill="#4169E1">best 2</text>
    <text x="590" y="252" fill="#4169E1">best 2</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#1a2026">
    <text x="340" y="280">Each set holds every distinct AND-value over subarrays ending at i, so it never outgrows</text>
    <text x="340" y="298">~log2(max(arr)) entries; the closest to <tspan fill="#4169E1" font-weight="600">5</tspan> bottoms out at <tspan fill="#4169E1" font-weight="600">2</tspan> (accented values) &#8212; answer 2.</text>
  </g>
</svg>
