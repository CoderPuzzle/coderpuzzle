<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="16" y="15" width="328" height="236" rx="9" fill="#f4f6f7" stroke="#bfc8cf" stroke-width="2"/>
<text x="38" y="71" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">func(arr, l, r) {</text>
<text x="38" y="98" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    if (r &lt; l) { return -1000000000 }</text>
<text x="38" y="125" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    ans = arr[l]</text>
<text x="38" y="152" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    for (i = l + 1; i &lt;= r; i++) {</text>
<text x="38" y="179" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">        ans = ans &amp; arr[i]</text>
<text x="38" y="206" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    }</text>
<text x="38" y="233" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    return ans</text>
<text x="38" y="260" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">}</text>
</svg>
