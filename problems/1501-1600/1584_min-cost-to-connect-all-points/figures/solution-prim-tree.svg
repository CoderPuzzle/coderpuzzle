<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="360" fill="#ffffff"/>
  <!-- points: A(0,0) B(2,2) C(3,10) D(5,2) E(7,0); x = 70 + 60*u, y = 290 - 22*v -->
  <!-- MST edges: A-B 4, B-D 3, D-E 4, B-C 9 -->
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="70" y1="290" x2="190" y2="246"/>
    <line x1="190" y1="246" x2="370" y2="246"/>
    <line x1="370" y1="246" x2="490" y2="290"/>
    <line x1="190" y1="246" x2="250" y2="70"/>
  </g>
  <!-- edge weight labels -->
  <g fill="#4169E1" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="118" y="256">4</text>
    <text x="280" y="240">3</text>
    <text x="438" y="256">4</text>
    <text x="206" y="152">9</text>
  </g>
  <!-- order badges on picked edges -->
  <g font-size="11" text-anchor="middle">
    <circle cx="130" cy="268" r="9" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
    <text x="130" y="272" fill="#4169E1">1</text>
    <circle cx="280" cy="262" r="9" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
    <text x="280" y="266" fill="#4169E1">2</text>
    <circle cx="430" cy="272" r="9" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
    <text x="430" y="276" fill="#4169E1">3</text>
    <circle cx="235" cy="140" r="9" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
    <text x="235" y="144" fill="#4169E1">4</text>
  </g>
  <!-- points -->
  <g fill="#1a2026">
    <circle cx="70" cy="290" r="7"/><circle cx="190" cy="246" r="7"/>
    <circle cx="250" cy="70" r="7"/><circle cx="370" cy="246" r="7"/>
    <circle cx="490" cy="290" r="7"/>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="70" y="316">(0,0)</text><text x="190" y="272">(2,2)</text><text x="250" y="52">(3,10)</text>
    <text x="370" y="272">(5,2)</text><text x="490" y="316">(7,0)</text>
  </g>
  <!-- narration -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="470" y="110">Prim grows one tree:</text>
    <text x="470" y="128">each round adds the</text>
    <text x="470" y="146">cheapest edge leaving</text>
    <text x="470" y="164">it — badge 1..4 is the</text>
    <text x="470" y="182">order the edges are</text>
    <text x="470" y="200">picked in this example.</text>
  </g>
  <text x="60" y="345" fill="#1a2026" font-size="13">The four tree edges cost 4 + 3 + 4 + 9 = <tspan fill="#4169E1" font-weight="600">20</tspan>; every point keeps exactly one path to every other.</text>
</svg>
