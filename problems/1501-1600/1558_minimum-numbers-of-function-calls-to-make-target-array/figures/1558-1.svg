<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 347" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="16" y="15" width="618" height="317" rx="9" fill="#f4f6f7" stroke="#bfc8cf" stroke-width="2"/>
<text x="38" y="71" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">func modify(arr, op, idx) {</text>
<text x="38" y="98" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    // op 0: increment one element</text>
<text x="38" y="125" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    if (op == 0) { arr[idx] = arr[idx] + 1 }</text>
<text x="38" y="152" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026"></text>
<text x="38" y="179" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    // op 1: double every element</text>
<text x="38" y="206" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    if (op == 1) {</text>
<text x="38" y="233" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">        for (i = 0; i &lt; arr.length; i++) {</text>
<text x="38" y="260" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">            arr[i] = arr[i] * 2</text>
<text x="38" y="287" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">        }</text>
<text x="38" y="314" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">    }</text>
<text x="38" y="341" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#1a2026">}</text>
</svg>
