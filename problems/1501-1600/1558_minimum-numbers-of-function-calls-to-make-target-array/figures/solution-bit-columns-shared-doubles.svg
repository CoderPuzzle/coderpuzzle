<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="362" fill="#ffffff"/>
  <!-- nums = [4,2,5]; columns cx = 200,310,420, cells 64x34; bit rows bottom-up: bit0 y=252, bit1 y=176, bit2 y=100; shaded bands y=214 and y=138 are the two shared doublings; each 1-bit is one increment -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="158" y="56" width="84" height="30" rx="6"/><rect x="268" y="56" width="84" height="30" rx="6"/><rect x="378" y="56" width="84" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="200" y="76">4 = 100</text><text x="310" y="76">2 = 10</text><text x="420" y="76">5 = 101</text>
  </g>
  <!-- bit 2 row -->
  <text x="140" y="121" text-anchor="end" fill="#5c6b76" font-size="11.5">bit 2</text>
  <rect x="168" y="100" width="64" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1.3"/>
  <rect x="278" y="100" width="64" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <rect x="388" y="100" width="64" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1.3"/>
  <text x="200" y="117" text-anchor="middle" font-weight="600" fill="#4169E1">1</text>
  <text x="310" y="117" text-anchor="middle" font-weight="600" fill="#9aa7b2">0</text>
  <text x="420" y="117" text-anchor="middle" font-weight="600" fill="#4169E1">1</text>
  <g text-anchor="middle" fill="#4169E1" font-size="10">
    <text x="200" y="130">+1</text><text x="420" y="130">+1</text>
  </g>
  <!-- shared double band 2 -->
  <rect x="154" y="138" width="312" height="32" rx="6" fill="#f0f3f7" stroke="#dbe4fb" stroke-width="1"/>
  <text x="310" y="158" text-anchor="middle" fill="#5c6b76" font-size="12">double (shared)</text>
  <!-- bit 1 row -->
  <text x="140" y="197" text-anchor="end" fill="#5c6b76" font-size="11.5">bit 1</text>
  <rect x="168" y="176" width="64" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <rect x="278" y="176" width="64" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1.3"/>
  <rect x="388" y="176" width="64" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <text x="200" y="193" text-anchor="middle" font-weight="600" fill="#9aa7b2">0</text>
  <text x="310" y="193" text-anchor="middle" font-weight="600" fill="#4169E1">1</text>
  <text x="420" y="193" text-anchor="middle" font-weight="600" fill="#9aa7b2">0</text>
  <text x="310" y="206" text-anchor="middle" fill="#4169E1" font-size="10">+1</text>
  <!-- shared double band 1 -->
  <rect x="154" y="214" width="312" height="32" rx="6" fill="#f0f3f7" stroke="#dbe4fb" stroke-width="1"/>
  <text x="310" y="234" text-anchor="middle" fill="#5c6b76" font-size="12">double (shared)</text>
  <!-- bit 0 row -->
  <text x="140" y="273" text-anchor="end" fill="#5c6b76" font-size="11.5">bit 0</text>
  <rect x="168" y="252" width="64" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <rect x="278" y="252" width="64" height="34" fill="#ffffff" stroke="#42525e" stroke-width="1.3"/>
  <rect x="388" y="252" width="64" height="34" fill="#dbe4fb" stroke="#42525e" stroke-width="1.3"/>
  <text x="200" y="269" text-anchor="middle" font-weight="600" fill="#9aa7b2">0</text>
  <text x="310" y="269" text-anchor="middle" font-weight="600" fill="#9aa7b2">0</text>
  <text x="420" y="269" text-anchor="middle" font-weight="600" fill="#4169E1">1</text>
  <text x="420" y="282" text-anchor="middle" fill="#4169E1" font-size="10">+1</text>
  <!-- tally -->
  <g fill="#5c6b76" font-size="12.5">
    <text x="500" y="170">increments 4</text>
    <text x="500" y="195">doublings 2</text>
  </g>
  <text x="500" y="225" fill="#4169E1" font-weight="600" font-size="14">calls 6</text>
  <text x="320" y="330" text-anchor="middle" fill="#1a2026" font-size="13">Reading bottom-up, the four 1-bits are increments (1 + 1 + 2) and the two shared</text>
  <text x="320" y="348" text-anchor="middle" fill="#1a2026" font-size="13">doublings between max = 5's three bits give 4 + 2 = <tspan fill="#4169E1" font-weight="600">6</tspan> calls.</text>
</svg>
