<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="700" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- products sorted: mobile moneypot monitor mouse mousepad; cursor path for "mouse" = m,o,u,s,e (accent); collapsed tails: b-ile>mobile, n-eypot>moneypot, n-itor>monitor, e-pad>mousepad -->
  <!-- non-path edges -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="166" y1="95" x2="117" y2="157"/>
    <line x1="182" y1="97" x2="184" y2="153"/>
    <line x1="103" y1="181" x2="81" y2="241"/>
    <line x1="174" y1="181" x2="151" y2="241"/>
    <line x1="202" y1="181" x2="250" y2="241"/>
    <line x1="315" y1="336" x2="403" y2="336"/>
  </g>
  <!-- cursor edges root->m->o->u->s->e -->
  <g fill="none" stroke="#4169E1" stroke-width="2">
    <path d="M 49 84 L 84 84" marker-end="url(#arrow)"/>
    <path d="M 119 84 L 157 84" marker-end="url(#arrow)"/>
    <path d="M 188 92 L 285 158" marker-end="url(#arrow)"/>
    <path d="M 300 183 L 300 233" marker-end="url(#arrow)"/>
    <path d="M 300 267 L 300 317" marker-end="url(#arrow)"/>
  </g>
  <!-- root -->
  <circle cx="44" cy="84" r="5" fill="#42525e"/>
  <!-- branch nodes -->
  <circle cx="110" cy="168" r="15" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <circle cx="188" cy="168" r="15" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <!-- word-end dots -->
  <circle cx="78" cy="252" r="5" fill="#4169E1"/>
  <circle cx="150" cy="252" r="5" fill="#4169E1"/>
  <circle cx="250" cy="252" r="5" fill="#4169E1"/>
  <circle cx="408" cy="336" r="5" fill="#4169E1"/>
  <!-- cursor-path nodes -->
  <g fill="#ffffff" stroke="#4169E1" stroke-width="2">
    <circle cx="104" cy="84" r="15"/><circle cx="176" cy="84" r="15"/>
    <circle cx="300" cy="168" r="15"/><circle cx="300" cy="252" r="15"/><circle cx="300" cy="336" r="15"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600">
    <text x="104" y="89" fill="#4169E1">m</text><text x="176" y="89" fill="#4169E1">o</text>
    <text x="110" y="173" fill="#1a2026">b</text><text x="188" y="173" fill="#1a2026">n</text>
    <text x="300" y="173" fill="#4169E1">u</text><text x="300" y="257" fill="#4169E1">s</text><text x="300" y="341" fill="#4169E1">e</text>
  </g>
  <!-- word labels under dots -->
  <g text-anchor="middle" font-size="12" fill="#1a2026">
    <text x="78" y="272">mobile</text><text x="150" y="272">moneypot</text>
    <text x="250" y="272">monitor</text><text x="408" y="356">mousepad</text>
  </g>
  <!-- collapsed tail labels -->
  <g font-size="11.5" fill="#5c6b76">
    <text x="90" y="202" text-anchor="end">ile</text>
    <text x="146" y="196" text-anchor="end">eypot</text>
    <text x="230" y="196" text-anchor="start">itor</text>
    <text x="352" y="328" text-anchor="middle">pad</text>
  </g>
  <!-- cached top-3 shared by m and o -->
  <rect x="52" y="26" width="280" height="22" fill="#f0f3f7"/>
  <text x="192" y="41" text-anchor="middle" fill="#5c6b76" font-size="11.5">m, o cache: mobile moneypot monitor</text>
  <text x="300" y="372" text-anchor="middle" fill="#5c6b76" font-size="11.5">word mouse ends here · cache: mouse mousepad</text>
  <!-- per-keystroke emissions -->
  <text x="470" y="100" fill="#5c6b76" font-size="12">typed &#8594; cached top 3 emitted</text>
  <g font-size="12.5">
    <text x="470" y="134" fill="#4169E1" font-weight="600">m</text><text x="534" y="134" fill="#1a2026">mobile moneypot monitor</text>
    <text x="470" y="172" fill="#4169E1" font-weight="600">mo</text><text x="534" y="172" fill="#1a2026">mobile moneypot monitor</text>
    <text x="470" y="210" fill="#4169E1" font-weight="600">mou</text><text x="534" y="210" fill="#1a2026">mouse mousepad</text>
    <text x="470" y="248" fill="#4169E1" font-weight="600">mous</text><text x="534" y="248" fill="#1a2026">mouse mousepad</text>
    <text x="470" y="286" fill="#4169E1" font-weight="600">mouse</text><text x="534" y="286" fill="#1a2026">mouse mousepad</text>
  </g>
  <text x="350" y="404" text-anchor="middle" fill="#1a2026" font-size="13">Typing 'mouse' walks m, o, u, s, e — every node is alive and emits its cached</text>
  <text x="350" y="422" text-anchor="middle" fill="#1a2026" font-size="13">top 3: <tspan fill="#4169E1" font-weight="600">[mobile, moneypot, monitor]</tspan> twice, then <tspan fill="#4169E1" font-weight="600">[mouse, mousepad]</tspan> three times.</text>
</svg>
