<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 244" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <pattern id="brick" width="14" height="8" patternUnits="userSpaceOnUse">
      <rect width="14" height="8" fill="#f3d9d5"/>
      <path d="M 0 8 L 8 0 M 6 8 L 14 0" stroke="#cf8b80" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- 3x3 grid, start top-left, goal bottom-right -->
  <g stroke="#c8cfd6" stroke-width="1">
    <rect x="60" y="20" width="64" height="64" fill="#e8edfb" stroke="#4169E1" stroke-width="2"/>
    <rect x="124" y="20" width="64" height="64" fill="url(#brick)"/>
    <rect x="188" y="20" width="64" height="64" fill="url(#brick)"/>
    <rect x="60" y="84" width="64" height="64" fill="url(#brick)"/>
    <rect x="124" y="84" width="64" height="64" fill="url(#brick)"/>
    <rect x="188" y="84" width="64" height="64" fill="url(#brick)"/>
    <rect x="60" y="148" width="64" height="64" fill="url(#brick)"/>
    <rect x="124" y="148" width="64" height="64" fill="#ffffff"/>
    <rect x="188" y="148" width="64" height="64" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  </g>
  <circle cx="92" cy="52" r="6" fill="#4169E1"/>
  <circle cx="220" cy="180" r="8" fill="none" stroke="#4169E1" stroke-width="2.5"/>
  <text x="92" y="38" text-anchor="middle" fill="#5c6b76" font-size="12">start</text>
  <text x="220" y="164" text-anchor="middle" fill="#5c6b76" font-size="12">goal</text>
  <g fill="#1a2026">
    <text x="300" y="56" font-weight="600">every route to the goal</text>
    <text x="300" y="76" font-weight="600">crosses at least 2 obstacles</text>
    <text x="300" y="106" fill="#4169E1" font-weight="700">k = 1 → -1</text>
  </g>
  <g font-size="12.5" fill="#1a2026">
    <rect x="300" y="132" width="14" height="14" fill="url(#brick)" stroke="#cf8b80"/>
    <text x="322" y="144">obstacle (1)</text>
    <rect x="300" y="154" width="14" height="14" fill="#ffffff" stroke="#c8cfd6"/>
    <text x="322" y="166">free cell (0)</text>
  </g>
</svg>
