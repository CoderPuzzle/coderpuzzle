<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 346" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="620" height="346" fill="#ffffff"/>
  <defs>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- nums = [1,1,2,1,1], k = 3; cells 44x40 at x = 110 + 52j;
       per-step added windows = right - left + 1:
       atMost(3): adds 1,2,3,4,4 (left 0,0,0,0,1 - retires idx 0 at the last step)
       atMost(2): adds 1,2,3,3,3 (left 0,0,0,1,2 - retires idx 0 then idx 1);
       14 - 12 = 2 nice subarrays -->
  <text x="310" y="40" text-anchor="middle" fill="#5c6b76" font-size="11.5">windows added at each right = right &#8722; left + 1</text>
  <!-- sweep for cap = 3 -->
  <text x="100" y="90" text-anchor="end" fill="#1a2026" font-weight="600" font-size="13">atMost(3)</text>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="110" y="66" width="44" height="40"/><rect x="162" y="66" width="44" height="40"/>
    <rect x="214" y="66" width="44" height="40"/><rect x="266" y="66" width="44" height="40"/>
    <rect x="318" y="66" width="44" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="132" y="91" fill="#4169E1">1</text><text x="184" y="91" fill="#4169E1">1</text>
    <text x="236" y="91" fill="#9aa7b2">2</text><text x="288" y="91" fill="#4169E1">1</text>
    <text x="340" y="91" fill="#4169E1">1</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#4169E1">
    <text x="132" y="126">1</text><text x="184" y="126">2</text><text x="236" y="126">3</text>
    <text x="288" y="126">4</text><text x="340" y="126">4</text>
  </g>
  <text x="378" y="126" fill="#1a2026" font-weight="600" font-size="14">&#931; = 14</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="132" y="141">l=0</text><text x="184" y="141">l=0</text><text x="236" y="141">l=0</text>
    <text x="288" y="141">l=0</text><text x="340" y="141">l=1</text>
  </g>
  <path d="M 118 153 H 158" fill="none" stroke="#9aa7b2" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
  <text x="166" y="157" fill="#9aa7b2" font-size="10.5">retire idx 0</text>
  <!-- sweep for cap = 2 -->
  <text x="100" y="204" text-anchor="end" fill="#1a2026" font-weight="600" font-size="13">atMost(2)</text>
  <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
    <rect x="110" y="180" width="44" height="40"/><rect x="162" y="180" width="44" height="40"/>
    <rect x="214" y="180" width="44" height="40"/><rect x="266" y="180" width="44" height="40"/>
    <rect x="318" y="180" width="44" height="40"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="132" y="205" fill="#4169E1">1</text><text x="184" y="205" fill="#4169E1">1</text>
    <text x="236" y="205" fill="#9aa7b2">2</text><text x="288" y="205" fill="#4169E1">1</text>
    <text x="340" y="205" fill="#4169E1">1</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="14" fill="#4169E1">
    <text x="132" y="240">1</text><text x="184" y="240">2</text><text x="236" y="240">3</text>
    <text x="288" y="240">3</text><text x="340" y="240">3</text>
  </g>
  <text x="378" y="240" fill="#1a2026" font-weight="600" font-size="14">&#931; = 12</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="10.5">
    <text x="132" y="255">l=0</text><text x="184" y="255">l=0</text><text x="236" y="255">l=0</text>
    <text x="288" y="255">l=1</text><text x="340" y="255">l=2</text>
  </g>
  <path d="M 118 267 H 158" fill="none" stroke="#9aa7b2" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
  <text x="166" y="271" fill="#9aa7b2" font-size="10.5">retire idx 0</text>
  <path d="M 170 283 H 210" fill="none" stroke="#9aa7b2" stroke-width="1.4" marker-end="url(#arrowMuted)"/>
  <text x="218" y="287" fill="#9aa7b2" font-size="10.5">retire idx 1</text>
  <text x="310" y="312" text-anchor="middle" fill="#1a2026" font-size="13">atMost(3) adds 1+2+3+4+4 = 14; atMost(2) adds 1+2+3+3+3 = 12;</text>
  <text x="310" y="330" text-anchor="middle" fill="#1a2026" font-size="13">the difference 14 &#8722; 12 = <tspan fill="#4169E1" font-weight="600">2</tspan> counts exactly [1,1,2,1] and [1,2,1,1].</text>
</svg>
