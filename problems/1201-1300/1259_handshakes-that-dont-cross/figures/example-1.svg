<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 238" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- way 1: (1,2) and (3,4) -->
  <g stroke="#4169E1" stroke-width="3">
    <line x1="85" y1="75" x2="175" y2="75"/>
    <line x1="85" y1="155" x2="175" y2="155"/>
  </g>
  <!-- way 2: (2,3) and (4,1) -->
  <g stroke="#4169E1" stroke-width="3">
    <line x1="435" y1="75" x2="435" y2="155"/>
    <line x1="345" y1="75" x2="345" y2="155"/>
  </g>
  <!-- people: TL=1, TR=2, BR=3, BL=4 in each panel -->
  <g stroke="#1a2026" stroke-width="2">
    <circle cx="85" cy="75" r="16" fill="#ffffff"/><circle cx="175" cy="75" r="16" fill="#ffffff"/>
    <circle cx="85" cy="155" r="16" fill="#ffffff"/><circle cx="175" cy="155" r="16" fill="#ffffff"/>
    <circle cx="345" cy="75" r="16" fill="#ffffff"/><circle cx="435" cy="75" r="16" fill="#ffffff"/>
    <circle cx="345" cy="155" r="16" fill="#ffffff"/><circle cx="435" cy="155" r="16" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="85" y="80">1</text><text x="175" y="80">2</text><text x="175" y="160">3</text><text x="85" y="160">4</text>
    <text x="345" y="80">1</text><text x="435" y="80">2</text><text x="435" y="160">3</text><text x="345" y="160">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="130" y="212">way 1: (1,2) and (3,4)</text>
    <text x="390" y="212">way 2: (2,3) and (4,1)</text>
  </g>
</svg>
