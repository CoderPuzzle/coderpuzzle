<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="440" fill="#ffffff"/>
  <!-- parent = [-1,0,0,1,2,2,2], value = [1,-2,4,0,-2,-1,-1]; circles r=26 at
       n0 (350,64) n1 (200,178) n2 (500,178) n3 (200,300) n4 (395,300) n5 (490,300) n6 (590,300) -->
  <!-- edges: kept 0-1 accent; zero-sum hand-ups 0-2 and 1-3 dashed; removed-subtree edges muted -->
  <line x1="329" y1="80" x2="221" y2="162" stroke="#4169E1" stroke-width="2.2"/>
  <line x1="371" y1="80" x2="479" y2="162" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="200" y1="204" x2="200" y2="274" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g stroke="#9aa7b2" stroke-width="1.4">
    <line x1="483" y1="198" x2="412" y2="280"/>
    <line x1="498" y1="204" x2="492" y2="274"/>
    <line x1="515" y1="199" x2="575" y2="279"/>
  </g>
  <text x="400" y="155" text-anchor="middle" fill="#9aa7b2" font-size="11.5">hands up nothing</text>
  <text x="214" y="242" text-anchor="start" fill="#9aa7b2" font-size="11.5">hands up nothing</text>
  <!-- kept nodes 0 and 1 -->
  <circle cx="350" cy="64" r="26" fill="#4169E1"/>
  <text x="350" y="69" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
  <circle cx="200" cy="178" r="26" fill="#4169E1"/>
  <text x="200" y="183" text-anchor="middle" fill="#ffffff" font-weight="600">-2</text>
  <!-- zero-sum nodes 2 and 3, struck; their subtrees muted -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.6">
    <circle cx="500" cy="178" r="26"/>
    <circle cx="200" cy="300" r="26"/>
    <circle cx="395" cy="300" r="26" stroke-dasharray="4 3"/>
    <circle cx="490" cy="300" r="26" stroke-dasharray="4 3"/>
    <circle cx="590" cy="300" r="26" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" fill="#9aa7b2" font-weight="600">
    <text x="500" y="183">4</text>
    <text x="200" y="305">0</text>
    <text x="395" y="305">-2</text>
    <text x="490" y="305">-1</text>
    <text x="590" y="305">-1</text>
  </g>
  <g stroke="#9aa7b2" stroke-width="1.8">
    <line x1="479" y1="183" x2="521" y2="173"/>
    <line x1="179" y1="305" x2="221" y2="295"/>
  </g>
  <!-- per-node fold annotations -->
  <g font-size="12">
    <text x="388" y="58" fill="#1a2026">sum 1 + (-2) = -1</text>
    <text x="388" y="74" fill="#1a2026">kept 1 + 1 = <tspan fill="#4169E1" font-weight="600">2</tspan></text>
    <text x="234" y="182" fill="#5c6b76">sum -2, kept 1</text>
    <text x="464" y="182" text-anchor="end" fill="#9aa7b2">sum 4-2-1-1 = 0</text>
    <text x="234" y="304" fill="#9aa7b2">sum 0</text>
    <text x="395" y="346" text-anchor="middle" fill="#9aa7b2">sum -2</text>
    <text x="490" y="346" text-anchor="middle" fill="#9aa7b2">sum -1</text>
    <text x="590" y="346" text-anchor="middle" fill="#9aa7b2">sum -1</text>
  </g>
  <text x="340" y="400" text-anchor="middle" fill="#1a2026" font-size="13">Zero-sum subtrees hand up nothing: node 3 (sum 0) and node 2 (4 - 2 - 1 - 1 = 0) are struck,</text>
  <text x="340" y="420" text-anchor="middle" fill="#1a2026" font-size="13">so only the root (sum 1 + (-2) = -1) and node 1 survive - <tspan fill="#4169E1" font-weight="600">2</tspan> kept nodes.</text>
</svg>
