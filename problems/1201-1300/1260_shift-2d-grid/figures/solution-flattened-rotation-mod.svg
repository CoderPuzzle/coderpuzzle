<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="424" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- grid = [[1,2,3],[4,5,6],[7,8,9]], k = 1; flat = [1..9] at index p, dest = (p+1) mod 9 -->
  <text x="122" y="32" text-anchor="middle" fill="#5c6b76" font-size="12">grid</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="56" y="44" width="44" height="44"/><rect x="100" y="44" width="44" height="44"/><rect x="144" y="44" width="44" height="44"/>
    <rect x="56" y="88" width="44" height="44"/><rect x="100" y="88" width="44" height="44"/><rect x="144" y="88" width="44" height="44"/>
    <rect x="56" y="132" width="44" height="44"/><rect x="100" y="132" width="44" height="44"/><rect x="144" y="132" width="44" height="44" fill="#dbe4fb"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="78" y="71">1</text><text x="122" y="71">2</text><text x="166" y="71">3</text>
    <text x="78" y="115">4</text><text x="122" y="115">5</text><text x="166" y="115">6</text>
    <text x="78" y="159">7</text><text x="122" y="159">8</text><text x="166" y="159">9</text>
  </g>
  <text x="546" y="32" text-anchor="middle" fill="#5c6b76" font-size="12">after k = 1</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="480" y="44" width="44" height="44" fill="#dbe4fb"/><rect x="524" y="44" width="44" height="44"/><rect x="568" y="44" width="44" height="44"/>
    <rect x="480" y="88" width="44" height="44"/><rect x="524" y="88" width="44" height="44"/><rect x="568" y="88" width="44" height="44"/>
    <rect x="480" y="132" width="44" height="44"/><rect x="524" y="132" width="44" height="44"/><rect x="568" y="132" width="44" height="44"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="502" y="71">9</text><text x="546" y="71">1</text><text x="590" y="71">2</text>
    <text x="502" y="115">3</text><text x="546" y="115">4</text><text x="590" y="115">5</text>
    <text x="502" y="159">6</text><text x="546" y="159">7</text><text x="590" y="159">8</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.5" fill="none">
    <path d="M 140 180 L 124 210" marker-end="url(#arrowGray)"/>
    <path d="M 556 210 L 502 180" marker-end="url(#arrowGray)"/>
  </g>
  <text x="108" y="200" text-anchor="end" fill="#5c6b76" font-size="12">flatten</text>
  <text x="568" y="200" text-anchor="start" fill="#5c6b76" font-size="12">reshape</text>
  <!-- flat row: cells 40 wide, pitch 54, x0=104 -->
  <g stroke="#42525e" stroke-width="1.5">
    <rect x="104" y="216" width="40" height="40" fill="#ffffff"/>
    <rect x="158" y="216" width="40" height="40" fill="#ffffff"/>
    <rect x="212" y="216" width="40" height="40" fill="#ffffff"/>
    <rect x="266" y="216" width="40" height="40" fill="#ffffff"/>
    <rect x="320" y="216" width="40" height="40" fill="#ffffff"/>
    <rect x="374" y="216" width="40" height="40" fill="#ffffff"/>
    <rect x="428" y="216" width="40" height="40" fill="#ffffff"/>
    <rect x="482" y="216" width="40" height="40" fill="#ffffff"/>
    <rect x="536" y="216" width="40" height="40" fill="#dbe4fb"/>
  </g>
  <g fill="#9aa7b2" font-size="9.5">
    <text x="111" y="228">0</text><text x="165" y="228">1</text><text x="219" y="228">2</text>
    <text x="273" y="228">3</text><text x="327" y="228">4</text><text x="381" y="228">5</text>
    <text x="435" y="228">6</text><text x="489" y="228">7</text><text x="543" y="228">8</text>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15" fill="#1a2026">
    <text x="124" y="245">1</text><text x="178" y="245">2</text><text x="232" y="245">3</text>
    <text x="286" y="245">4</text><text x="340" y="245">5</text><text x="394" y="245">6</text>
    <text x="448" y="245">7</text><text x="502" y="245">8</text><text x="556" y="245">9</text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.25" fill="none">
    <path d="M 138 212 Q 151 198 164 212" marker-end="url(#arrowGray)"/>
    <path d="M 192 212 Q 205 198 218 212" marker-end="url(#arrowGray)"/>
    <path d="M 246 212 Q 259 198 272 212" marker-end="url(#arrowGray)"/>
    <path d="M 300 212 Q 313 198 326 212" marker-end="url(#arrowGray)"/>
    <path d="M 354 212 Q 367 198 380 212" marker-end="url(#arrowGray)"/>
    <path d="M 408 212 Q 421 198 434 212" marker-end="url(#arrowGray)"/>
    <path d="M 462 212 Q 475 198 488 212" marker-end="url(#arrowGray)"/>
    <path d="M 516 212 Q 529 198 542 212" marker-end="url(#arrowGray)"/>
  </g>
  <text x="340" y="194" text-anchor="middle" fill="#5c6b76" font-size="12.5">p → p + 1</text>
  <path d="M 556 260 Q 340 336 124 260" fill="none" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="318" text-anchor="middle" fill="#4169E1" font-size="12.5" font-weight="600">index 8 wraps back to 0</text>
  <text x="340" y="388" text-anchor="middle" fill="#1a2026" font-size="13">Flattened row-major, each source index p lands at <tspan fill="#4169E1" font-weight="600">(p + 1) mod 9</tspan> — one cyclic</text>
  <text x="340" y="406" text-anchor="middle" fill="#1a2026" font-size="13">right-rotation; only <tspan fill="#4169E1" font-weight="600">value 9</tspan> wraps, giving [[9,1,2],[3,4,5],[6,7,8]].</text>
</svg>
