<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 282" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- edges: 0-1 plain, the diameter path 3-2-1-4-5 highlighted -->
  <line x1="70" y1="70" x2="200" y2="70" stroke="#1a2026" stroke-width="1.8"/>
  <g stroke="#4169E1" stroke-width="3">
    <line x1="200" y1="70" x2="330" y2="45"/>
    <line x1="330" y1="45" x2="425" y2="95"/>
    <line x1="200" y1="70" x2="330" y2="170"/>
    <line x1="330" y1="170" x2="425" y2="225"/>
  </g>
  <circle cx="70" cy="70" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="2"/>
  <g fill="#e8edfb" stroke="#4169E1" stroke-width="2.5">
    <circle cx="200" cy="70" r="18"/>
    <circle cx="330" cy="45" r="18"/>
    <circle cx="425" cy="95" r="18"/>
    <circle cx="330" cy="170" r="18"/>
    <circle cx="425" cy="225" r="18"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="70" y="75">0</text>
    <text x="200" y="75">1</text>
    <text x="330" y="50">2</text>
    <text x="425" y="100">3</text>
    <text x="330" y="175">4</text>
    <text x="425" y="230">5</text>
  </g>
  <text x="260" y="270" text-anchor="middle" fill="#5c6b76" font-size="12.5">longest path: 3 – 2 – 1 – 4 – 5 (4 edges)</text>
</svg>
