<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 232" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- edges on the diameter path -->
  <g stroke="#4169E1" stroke-width="3">
    <line x1="210" y1="55" x2="120" y2="165"/>
    <line x1="210" y1="55" x2="300" y2="165"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.5">
    <circle cx="210" cy="55" r="19" fill="#e8edfb"/>
    <circle cx="120" cy="165" r="19" fill="#e8edfb"/>
    <circle cx="300" cy="165" r="19" fill="#e8edfb"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1a2026">
    <text x="210" y="60">0</text>
    <text x="120" y="170">1</text>
    <text x="300" y="170">2</text>
  </g>
  <text x="210" y="218" text-anchor="middle" fill="#5c6b76" font-size="12.5">longest path: 1 – 0 – 2 (2 edges)</text>
</svg>
