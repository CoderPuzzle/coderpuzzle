<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 366" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<line x1="180" y1="50" x2="180" y2="130" stroke="#42525e" stroke-width="1.5"/>
  <line x1="180" y1="130" x2="100" y2="210" stroke="#4169E1" stroke-width="3"/>
  <line x1="100" y1="210" x2="60" y2="290" stroke="#4169E1" stroke-width="3"/>
  <line x1="180" y1="130" x2="260" y2="210" stroke="#4169E1" stroke-width="3"/>
  <line x1="260" y1="210" x2="300" y2="290" stroke="#4169E1" stroke-width="3"/>
  <circle cx="180" cy="50" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="180" y="55" text-anchor="middle" font-weight="600">0</text>
  <text x="160" y="30" text-anchor="middle" fill="#5c6b76" font-size="10.5">0|3</text>
  <circle cx="180" cy="130" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="180" y="135" text-anchor="middle" font-weight="600">1</text>
  <text x="160" y="110" text-anchor="middle" fill="#5c6b76" font-size="10.5">1|2</text>
  <circle cx="100" cy="210" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="100" y="215" text-anchor="middle" font-weight="600">2</text>
  <text x="80" y="190" text-anchor="middle" fill="#5c6b76" font-size="10.5">2|1</text>
  <circle cx="60" cy="290" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="60" y="295" text-anchor="middle" font-weight="600">3</text>
  <text x="40" y="270" text-anchor="middle" fill="#5c6b76" font-size="10.5">3|0</text>
  <circle cx="260" cy="210" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="260" y="215" text-anchor="middle" font-weight="600">4</text>
  <text x="240" y="190" text-anchor="middle" fill="#5c6b76" font-size="10.5">2|3</text>
  <circle cx="300" cy="290" r="16" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="300" y="295" text-anchor="middle" font-weight="600">5</text>
  <text x="280" y="270" text-anchor="middle" fill="#5c6b76" font-size="10.5">3|4</text>
  <text x="360" y="60" fill="#5c6b76" font-size="12">labels: dist from 0 | dist from 3</text>
  <text x="40" y="330" fill="#5c6b76" font-size="12">BFS from 0 lands farthest at node 3; BFS from 3 (blue path) reaches node 5 at</text>
  <text x="40" y="348" fill="#5c6b76" font-size="12">distance 4 &#8212; the diameter 3&#8211;2&#8211;1&#8211;4&#8211;5.</text>
</svg>
