<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b2"/>
    </marker>
  </defs>
  <!-- s = "abc", k = 2; cost cells 44x32 at (108,92); dp cells 56x32 at (424,92) -->
  <text x="174" y="48" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">cost[i][j]</text>
  <text x="174" y="66" text-anchor="middle" fill="#5c6b76" font-size="11">one change per mismatched pair</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="130" y="84">a</text><text x="174" y="84">b</text><text x="218" y="84">c</text>
    <text x="100" y="113" text-anchor="end">a</text><text x="100" y="145" text-anchor="end">b</text><text x="100" y="177" text-anchor="end">c</text>
  </g>
  <!-- upper triangle; lower cells inactive -->
  <g stroke-width="1.2">
    <rect x="108" y="92" width="44" height="32" fill="#f0f3f7" stroke="#ffffff"/>
    <rect x="108" y="124" width="44" height="32" fill="#f0f3f7" stroke="#ffffff"/>
    <rect x="152" y="124" width="44" height="32" fill="#f0f3f7" stroke="#ffffff"/>
    <rect x="108" y="156" width="44" height="32" fill="#f0f3f7" stroke="#ffffff"/>
    <rect x="152" y="156" width="44" height="32" fill="#f0f3f7" stroke="#ffffff"/>
    <rect x="196" y="156" width="44" height="32" fill="#f0f3f7" stroke="#ffffff"/>
    <rect x="108" y="92" width="44" height="32" fill="#ffffff" stroke="#42525e"/>
    <rect x="152" y="92" width="44" height="32" fill="#ffffff" stroke="#42525e"/>
    <rect x="196" y="92" width="44" height="32" fill="#dbe4fb" stroke="#42525e"/>
    <rect x="152" y="124" width="44" height="32" fill="#ffffff" stroke="#42525e"/>
    <rect x="196" y="124" width="44" height="32" fill="#ffffff" stroke="#42525e"/>
    <rect x="196" y="156" width="44" height="32" fill="#ffffff" stroke="#42525e"/>
  </g>
  <g text-anchor="middle">
    <text x="130" y="113" fill="#9aa7b2">0</text><text x="174" y="113" fill="#1a2026">1</text><text x="218" y="113" fill="#4169E1" font-weight="600">1</text>
    <text x="174" y="145" fill="#9aa7b2">0</text><text x="218" y="145" fill="#1a2026">1</text>
    <text x="218" y="177" fill="#9aa7b2">0</text>
  </g>
  <text x="248" y="100" fill="#4169E1" font-size="11.5" font-weight="600">a != c</text>
  <!-- feeds arrow -->
  <line x1="300" y1="134" x2="372" y2="134" stroke="#9aa7b2" stroke-width="1.4" marker-end="url(#arrowF)"/>
  <text x="336" y="124" text-anchor="middle" fill="#5c6b76" font-size="10.5">cost feeds dp</text>
  <text x="494" y="48" text-anchor="middle" fill="#1a2026" font-size="13" font-weight="600">dp[c][i]</text>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="452" y="84">i=1</text><text x="508" y="84">i=2</text><text x="564" y="84">i=3</text>
    <text x="416" y="113" text-anchor="end">c=1</text><text x="416" y="145" text-anchor="end">c=2</text>
  </g>
  <g stroke-width="1.2">
    <rect x="424" y="92" width="56" height="32" fill="#ffffff" stroke="#42525e"/>
    <rect x="480" y="92" width="56" height="32" fill="#ffffff" stroke="#42525e"/>
    <rect x="536" y="92" width="56" height="32" fill="#ffffff" stroke="#42525e"/>
    <rect x="424" y="124" width="56" height="32" fill="#f0f3f7" stroke="#42525e"/>
    <rect x="480" y="124" width="56" height="32" fill="#ffffff" stroke="#42525e"/>
    <rect x="536" y="124" width="56" height="32" fill="#dbe4fb" stroke="#42525e"/>
  </g>
  <g text-anchor="middle">
    <text x="452" y="113" fill="#1a2026">0</text><text x="508" y="113" fill="#1a2026">1</text><text x="564" y="113" fill="#1a2026">1</text>
    <text x="452" y="145" fill="#9aa7b2">-</text><text x="508" y="145" fill="#1a2026">0</text><text x="564" y="145" fill="#4169E1" font-weight="600">1</text>
  </g>
  <text x="508" y="182" text-anchor="middle" fill="#5c6b76" font-size="11.5">split a|bc or ab|c: one change</text>
  <text x="340" y="236" text-anchor="middle" fill="#1a2026" font-size="13">cost flags one mismatched pair per interval - for s[0..2] the outer pair (a, c) costs 1;</text>
  <text x="340" y="256" text-anchor="middle" fill="#1a2026" font-size="13">dp[2][3] = min(dp[1][1] + cost[1][2], dp[1][2] + cost[2][2]) = min(0 + 1, 1 + 0) = <tspan fill="#4169E1" font-weight="600">1</tspan>.</text>
</svg>
