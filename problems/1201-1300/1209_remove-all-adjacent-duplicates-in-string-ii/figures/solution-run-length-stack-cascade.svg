<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="288" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- s = "deeedbbcccbdaa", k = 3; stack of (char x run) pairs, snapshots in reading
       order: d | eee | d b b | ccc | b | d,aa. Boxes 46x24; column centers
       65,175,285,395,505,615; stack levels y=170 (bottom), 140; popped run y=56. -->
  <text x="340" y="18" text-anchor="middle" fill="#5c6b76" font-size="12.5">stack of (char × run) pairs — pop a run the moment it reaches k = 3</text>
  <g text-anchor="middle" fill="#9aa7b2" font-size="11.5">
    <text x="65" y="40">d</text>
    <text x="175" y="40">e e e</text>
    <text x="285" y="40">d b b</text>
    <text x="395" y="40">c c c</text>
    <text x="505" y="40">b</text>
    <text x="615" y="40">d · a a</text>
  </g>
  <!-- popped runs -->
  <g fill="#dbe4fb" stroke="#4169E1" stroke-width="1.4" stroke-dasharray="4 3">
    <rect x="152" y="56" width="46" height="24" rx="3"/>
    <rect x="372" y="56" width="46" height="24" rx="3"/>
    <rect x="482" y="56" width="46" height="24" rx="3"/>
    <rect x="592" y="56" width="46" height="24" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12">
    <text x="175" y="72">e ×3</text>
    <text x="395" y="72">c ×3</text>
    <text x="505" y="72">b ×3</text>
    <text x="615" y="72">d ×3</text>
  </g>
  <!-- pop arrows -->
  <g stroke="#4169E1" stroke-width="1.6" fill="none">
    <line x1="175" y1="84" x2="175" y2="162" marker-end="url(#arrow)"/>
    <line x1="395" y1="84" x2="395" y2="132" marker-end="url(#arrow)"/>
    <line x1="505" y1="84" x2="505" y2="162" marker-end="url(#arrow)"/>
    <line x1="615" y1="84" x2="615" y2="162" marker-end="url(#arrow)"/>
  </g>
  <g fill="#4169E1" font-size="10.5">
    <text x="184" y="126">pop</text>
    <text x="404" y="112">pop</text>
    <text x="514" y="112">pop</text>
    <text x="624" y="126">pop</text>
  </g>
  <!-- baselines -->
  <g stroke="#9aa7b2" stroke-width="1.2">
    <line x1="35" y1="198" x2="95" y2="198"/>
    <line x1="145" y1="198" x2="205" y2="198"/>
    <line x1="255" y1="198" x2="315" y2="198"/>
    <line x1="365" y1="198" x2="425" y2="198"/>
    <line x1="475" y1="198" x2="535" y2="198"/>
    <line x1="585" y1="198" x2="645" y2="198"/>
  </g>
  <!-- stack boxes: white = live runs, accent = final survivor -->
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.4">
    <rect x="42" y="170" width="46" height="24" rx="3"/>
    <rect x="152" y="170" width="46" height="24" rx="3"/>
    <rect x="262" y="170" width="46" height="24" rx="3"/>
    <rect x="262" y="140" width="46" height="24" rx="3"/>
    <rect x="372" y="170" width="46" height="24" rx="3"/>
    <rect x="372" y="140" width="46" height="24" rx="3"/>
    <rect x="482" y="170" width="46" height="24" rx="3"/>
    <rect x="592" y="170" width="46" height="24" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12">
    <text x="65" y="186">d ×1</text>
    <text x="175" y="186">d ×1</text>
    <text x="285" y="186">d ×2</text>
    <text x="285" y="156">b ×2</text>
    <text x="395" y="186">d ×2</text>
    <text x="395" y="156">b ×2</text>
    <text x="505" y="186">d ×2</text>
  </g>
  <rect x="592" y="170" width="46" height="24" rx="3" fill="#4169E1"/>
  <text x="615" y="186" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="12">a ×2</text>
  <text x="615" y="220" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">= "aa"</text>
  <text x="340" y="248" text-anchor="middle" fill="#1a2026" font-size="13">Each pop exposes a new top, so the next characters merge with it: <tspan fill="#4169E1" font-weight="600">bbb</tspan> and <tspan fill="#4169E1" font-weight="600">ddd</tspan> pop in the same pass.</text>
  <text x="340" y="270" text-anchor="middle" fill="#1a2026" font-size="13">Only the a-run survives; expanding the final stack gives <tspan fill="#4169E1" font-weight="600">"aa"</tspan>.</text>
</svg>
