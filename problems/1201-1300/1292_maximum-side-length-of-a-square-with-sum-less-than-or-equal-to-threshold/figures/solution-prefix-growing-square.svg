  <rect x="440" y="76" width="96" height="78" fill="none" stroke="#9aa7b2" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="472" y="172" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">side 2: 4</text>
  <text x="556" y="172" text-anchor="middle" fill="#9aa7b2" font-size="12">side 3: 15 &gt; 4</text>
  <g fill="#5c6b76" font-size="12">
    <text x="60" y="212">corner (0,0), side 2: prefix[2][2] − 0 − 0 + 0 = 4 ≤ 4 → ans = 2</text>
    <text x="60" y="232">corner (0,0), side 3: prefix[3][3] − 0 − 0 + 0 = 15 &gt; 4 → stop</text>
  </g>
  <text x="340" y="264" text-anchor="middle" fill="#1a2026" font-size="13">With threshold 4 the scan's only winning extension is the side-2 square</text>
  <text x="340" y="283" text-anchor="middle" fill="#1a2026" font-size="13">of 1s at the top-left corner — sum exactly 4 — so the answer is <tspan fill="#4169E1" font-weight="600">2</tspan>.</text>
</svg>
