  <rect x="186" y="160" width="42" height="28" fill="#ffffff" stroke="#4169E1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="600">
    <g fill="#9aa7b2">
      <text x="81" y="95">0</text><text x="123" y="95">0</text><text x="165" y="95">0</text><text x="207" y="95">0</text><text x="249" y="95">0</text><text x="291" y="95">0</text><text x="333" y="95">0</text><text x="375" y="95">0</text>
    </g>
    <g fill="#1a2026">
      <text x="81" y="123">0</text><text x="123" y="123">1</text><text x="165" y="123">2</text><text x="207" y="123">5</text><text x="249" y="123">7</text><text x="291" y="123">11</text><text x="333" y="123">14</text><text x="375" y="123">16</text>
