    <rect x="60" y="132" width="42" height="28"/><rect x="102" y="132" width="42" height="28"/><rect x="144" y="132" width="42" height="28"/><rect x="186" y="132" width="42" height="28"/><rect x="228" y="132" width="42" height="28"/><rect x="270" y="132" width="42" height="28"/><rect x="312" y="132" width="42" height="28"/><rect x="354" y="132" width="42" height="28"/>
