    <rect x="440" y="128" width="32" height="26"/><rect x="472" y="128" width="32" height="26"/><rect x="504" y="128" width="32" height="26"/><rect x="536" y="128" width="32" height="26"/><rect x="568" y="128" width="32" height="26"/><rect x="600" y="128" width="32" height="26"/><rect x="632" y="128" width="32" height="26"/>
