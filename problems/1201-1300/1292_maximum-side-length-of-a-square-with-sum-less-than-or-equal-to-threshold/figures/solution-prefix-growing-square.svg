       prefix is the (m+1)x(n+1) table, cells 42x28 at (60,76), mat cells 32x26 at (440,76);
       shaded prefix[2][2] = 4 passes the side-2 lookup, boxed prefix[3][3] = 15 fails side 3 -->
  <text x="228" y="58" text-anchor="middle" fill="#5c6b76" font-size="12.5">prefix (4 x 8)</text>
