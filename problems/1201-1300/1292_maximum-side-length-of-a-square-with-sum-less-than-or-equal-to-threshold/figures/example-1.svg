<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 3x7 matrix -->
  <g stroke="#c8cfd6" stroke-width="1">
    <rect x="24" y="24" width="44" height="44" fill="#e8edfb"/>
    <rect x="68" y="24" width="44" height="44" fill="#e8edfb"/>
    <rect x="112" y="24" width="44" height="44" fill="#ffffff"/>
    <rect x="156" y="24" width="44" height="44" fill="#ffffff"/>
    <rect x="200" y="24" width="44" height="44" fill="#ffffff"/>
    <rect x="244" y="24" width="44" height="44" fill="#ffffff"/>
    <rect x="288" y="24" width="44" height="44" fill="#ffffff"/>
    <rect x="24" y="68" width="44" height="44" fill="#e8edfb"/>
    <rect x="68" y="68" width="44" height="44" fill="#e8edfb"/>
    <rect x="112" y="68" width="44" height="44" fill="#ffffff"/>
    <rect x="156" y="68" width="44" height="44" fill="#ffffff"/>
    <rect x="200" y="68" width="44" height="44" fill="#ffffff"/>
    <rect x="244" y="68" width="44" height="44" fill="#ffffff"/>
    <rect x="288" y="68" width="44" height="44" fill="#ffffff"/>
    <rect x="24" y="112" width="44" height="44" fill="#ffffff"/>
    <rect x="68" y="112" width="44" height="44" fill="#ffffff"/>
    <rect x="112" y="112" width="44" height="44" fill="#ffffff"/>
    <rect x="156" y="112" width="44" height="44" fill="#ffffff"/>
    <rect x="200" y="112" width="44" height="44" fill="#ffffff"/>
    <rect x="244" y="112" width="44" height="44" fill="#ffffff"/>
    <rect x="288" y="112" width="44" height="44" fill="#ffffff"/>
  </g>
  <rect x="24" y="24" width="88" height="88" fill="none" stroke="#4169E1" stroke-width="2.8"/>
  <g text-anchor="middle" fill="#1a2026">
    <text x="46" y="51">1</text><text x="90" y="51">1</text><text x="134" y="51">3</text><text x="178" y="51">2</text><text x="222" y="51">4</text><text x="266" y="51">3</text><text x="310" y="51">2</text>
    <text x="46" y="95">1</text><text x="90" y="95">1</text><text x="134" y="95">3</text><text x="178" y="95">2</text><text x="222" y="95">4</text><text x="266" y="95">3</text><text x="310" y="95">2</text>
    <text x="46" y="139">1</text><text x="90" y="139">1</text><text x="134" y="139">3</text><text x="178" y="139">2</text><text x="222" y="139">4</text><text x="266" y="139">3</text><text x="310" y="139">2</text>
  </g>
  <g fill="#1a2026">
    <text x="356" y="56" font-weight="600">largest square: side 2</text>
    <text x="356" y="80" fill="#4169E1" font-weight="700">1 + 1 + 1 + 1 = 4 ≤ 4</text>
    <text x="356" y="106" fill="#5c6b76" font-size="12.5">every 3 × 3 square sums to 15,</text>
    <text x="356" y="123" fill="#5c6b76" font-size="12.5">so side 3 is too large</text>
  </g>
