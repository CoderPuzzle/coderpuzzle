<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 328" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="328" fill="#ffffff"/>
  <!-- synonyms [[happy,joy],[sad,sorrow],[joy,cheerful]]; boxes y 48..74; edges y 61 -->
  <g fill="#5c6b76" font-size="11" text-anchor="middle">
    <text x="149" y="42">pair 1</text><text x="262" y="42">pair 3</text><text x="544" y="42">pair 2</text>
  </g>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="122" y1="61" x2="176" y2="61"/>
    <line x1="224" y1="61" x2="301" y2="61"/>
    <line x1="513" y1="61" x2="576" y2="61"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="58" y="48" width="64" height="26" rx="5"/>
    <rect x="176" y="48" width="48" height="26" rx="5"/>
    <rect x="301" y="48" width="78" height="26" rx="5"/>
    <rect x="467" y="48" width="46" height="26" rx="5"/>
    <rect x="576" y="48" width="68" height="26" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="90" y="66">happy</text><text x="200" y="66">joy</text><text x="340" y="66">cheerful</text>
    <text x="490" y="66">sad</text><text x="610" y="66">sorrow</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="218" y="94">group {cheerful, happy, joy}</text>
    <text x="555" y="94">group {sad, sorrow}</text>
  </g>
  <text x="340" y="140" text-anchor="middle" font-size="12.5"><tspan fill="#5c6b76">text: </tspan><tspan fill="#1a2026">I am </tspan><tspan fill="#5c6b76">[</tspan><tspan fill="#4169E1" font-weight="600"> happy | joy | cheerful </tspan><tspan fill="#5c6b76">]</tspan><tspan fill="#1a2026"> today but was </tspan><tspan fill="#5c6b76">[</tspan><tspan fill="#4169E1" font-weight="600"> sad | sorrow </tspan><tspan fill="#5c6b76">]</tspan><tspan fill="#1a2026"> yesterday</tspan></text>
  <text x="40" y="176" fill="#1a2026" font-size="12.5">expanding both slots gives 3 × 2 = 6 sentences, sorted:</text>
  <g font-size="12.5">
    <text x="40" y="208" fill="#1a2026">1  I am <tspan fill="#4169E1" font-weight="600">cheerful</tspan> today but was <tspan fill="#4169E1" font-weight="600">sad</tspan> yesterday</text>
    <text x="40" y="234" fill="#1a2026">2  I am <tspan fill="#4169E1" font-weight="600">cheerful</tspan> today but was <tspan fill="#4169E1" font-weight="600">sorrow</tspan> yesterday</text>
    <text x="40" y="260" fill="#1a2026">3  I am <tspan fill="#4169E1" font-weight="600">happy</tspan> today but was <tspan fill="#4169E1" font-weight="600">sad</tspan> yesterday</text>
    <text x="368" y="208" fill="#1a2026">4  I am <tspan fill="#4169E1" font-weight="600">happy</tspan> today but was <tspan fill="#4169E1" font-weight="600">sorrow</tspan> yesterday</text>
    <text x="368" y="234" fill="#1a2026">5  I am <tspan fill="#4169E1" font-weight="600">joy</tspan> today but was <tspan fill="#4169E1" font-weight="600">sad</tspan> yesterday</text>
    <text x="368" y="260" fill="#1a2026">6  I am <tspan fill="#4169E1" font-weight="600">joy</tspan> today but was <tspan fill="#4169E1" font-weight="600">sorrow</tspan> yesterday</text>
  </g>
  <text x="40" y="296" fill="#1a2026" font-size="13">Union-find merges the pairs into two groups, so only the happy and sad</text>
  <text x="40" y="314" fill="#1a2026" font-size="13">positions branch — <tspan fill="#4169E1" font-weight="600">3 × 2 = 6</tspan> synonymous sentences, sorted lexicographically.</text>
</svg>
