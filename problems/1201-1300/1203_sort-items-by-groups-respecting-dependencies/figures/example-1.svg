<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 378" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- table: item | group | must come after -->
  <g stroke="#d5dbe1" stroke-width="1">
    <rect x="30" y="20" width="270" height="28" fill="#f2f4f6" stroke="#c3cad1"/>
    <line x1="86" y1="20" x2="86" y2="281"/>
    <line x1="150" y1="20" x2="150" y2="281"/>
    <rect x="30" y="20" width="270" height="261" fill="none" stroke="#c3cad1"/>
    <line x1="30" y1="48" x2="300" y2="48"/>
    <line x1="30" y1="77" x2="300" y2="77"/>
    <line x1="30" y1="106" x2="300" y2="106"/>
    <line x1="30" y1="135" x2="300" y2="135"/>
    <line x1="30" y1="164" x2="300" y2="164"/>
    <line x1="30" y1="193" x2="300" y2="193"/>
    <line x1="30" y1="222" x2="300" y2="222"/>
    <line x1="30" y1="251" x2="300" y2="251"/>
  </g>
  <g fill="#5c6b76" font-weight="600" font-size="12.5">
    <text x="40" y="39">item</text>
    <text x="96" y="39">group</text>
    <text x="160" y="39">before it</text>
  </g>
  <g fill="#1a2026">
    <text x="58" y="66.5" text-anchor="middle">0</text><text x="118" y="66.5" text-anchor="middle">-1</text><text x="160" y="66.5">—</text>
    <text x="58" y="95.5" text-anchor="middle">1</text><text x="118" y="95.5" text-anchor="middle">-1</text><text x="160" y="95.5">6</text>
    <text x="58" y="124.5" text-anchor="middle">2</text><text x="118" y="124.5" text-anchor="middle">1</text><text x="160" y="124.5">5</text>
    <text x="58" y="153.5" text-anchor="middle">3</text><text x="118" y="153.5" text-anchor="middle">0</text><text x="160" y="153.5">6</text>
    <text x="58" y="182.5" text-anchor="middle">4</text><text x="118" y="182.5" text-anchor="middle">0</text><text x="160" y="182.5">3, 6</text>
    <text x="58" y="211.5" text-anchor="middle">5</text><text x="118" y="211.5" text-anchor="middle">1</text><text x="160" y="211.5">—</text>
    <text x="58" y="240.5" text-anchor="middle">6</text><text x="118" y="240.5" text-anchor="middle">0</text><text x="160" y="240.5">—</text>
    <text x="58" y="269.5" text-anchor="middle">7</text><text x="118" y="269.5" text-anchor="middle">-1</text><text x="160" y="269.5">—</text>
  </g>
  <!-- one valid sorted order, tinted by group -->
  <text x="30" y="312" fill="#1a2026" font-weight="600" font-size="13">one valid order:</text>
  <g text-anchor="middle" font-size="13" stroke-width="1.4">
    <rect x="140" y="296" width="30" height="28" rx="5" fill="#e8edfb" stroke="#4169E1"/><text x="155" y="315" fill="#1a2026">6</text>
    <rect x="174" y="296" width="30" height="28" rx="5" fill="#e8edfb" stroke="#4169E1"/><text x="189" y="315" fill="#1a2026">3</text>
    <rect x="208" y="296" width="30" height="28" rx="5" fill="#e8edfb" stroke="#4169E1"/><text x="223" y="315" fill="#1a2026">4</text>
    <rect x="242" y="296" width="30" height="28" rx="5" fill="#ffffff" stroke="#9aa5ae"/><text x="257" y="315" fill="#1a2026">1</text>
    <rect x="276" y="296" width="30" height="28" rx="5" fill="#fdf1e3" stroke="#c99a4b"/><text x="291" y="315" fill="#1a2026">5</text>
    <rect x="310" y="296" width="30" height="28" rx="5" fill="#fdf1e3" stroke="#c99a4b"/><text x="325" y="315" fill="#1a2026">2</text>
    <rect x="344" y="296" width="30" height="28" rx="5" fill="#ffffff" stroke="#9aa5ae"/><text x="359" y="315" fill="#1a2026">0</text>
    <rect x="378" y="296" width="30" height="28" rx="5" fill="#ffffff" stroke="#9aa5ae"/><text x="393" y="315" fill="#1a2026">7</text>
  </g>
  <g font-size="12.5" fill="#1a2026">
    <rect x="140" y="344" width="14" height="14" fill="#e8edfb" stroke="#4169E1" stroke-width="1"/>
    <text x="162" y="356">group 0</text>
    <rect x="228" y="344" width="14" height="14" fill="#fdf1e3" stroke="#c99a4b" stroke-width="1"/>
    <text x="250" y="356">group 1</text>
    <rect x="316" y="344" width="14" height="14" fill="#ffffff" stroke="#9aa5ae" stroke-width="1"/>
    <text x="338" y="356">no group</text>
  </g>
</svg>
