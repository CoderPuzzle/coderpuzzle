  <line x1="286.10810972600865" y1="147.93822301370935" x2="177.36486284248917" y2="210.07722123286334" stroke="#4169E1" stroke-width="1.7" marker-end="url(#arrowB)"/>
  <line x1="173.89189027399135" y1="212.06177698629065" x2="282.6351371575108" y2="149.92277876713666" stroke="#4169E1" stroke-width="1.7" marker-end="url(#arrowB)"/>
