  <circle cx="240" cy="250" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="240" y="255" text-anchor="middle" font-weight="600">u</text>
  <text x="40" y="310" fill="#5c6b76" font-size="12">New strings ending in each vowel come from the arrows into it; the counters update</text>
  <text x="40" y="328" fill="#5c6b76" font-size="12">simultaneously: a &#8592; e + i + u, e &#8592; a + i, i &#8592; e + o, o &#8592; i, u &#8592; i + o.</text>
