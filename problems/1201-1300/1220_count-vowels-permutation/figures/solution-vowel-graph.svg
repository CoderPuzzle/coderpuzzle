  <circle cx="160" cy="60" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="160" y="65" text-anchor="middle" font-weight="600">a</text>
  <circle cx="300" cy="140" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="300" y="145" text-anchor="middle" font-weight="600">e</text>
  <circle cx="160" cy="220" r="15" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="160" y="225" text-anchor="middle" font-weight="600">i</text>
