<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 3x5 grid: 1 = water (blue tint), 0 = land, closed island in gray -->
  <g stroke="#c8cfd6" stroke-width="1">
    <rect x="24" y="20" width="48" height="48" fill="#ffffff"/>
    <rect x="72" y="20" width="48" height="48" fill="#ffffff"/>
    <rect x="120" y="20" width="48" height="48" fill="#dce7f7"/>
    <rect x="168" y="20" width="48" height="48" fill="#ffffff"/>
    <rect x="216" y="20" width="48" height="48" fill="#ffffff"/>
    <rect x="24" y="68" width="48" height="48" fill="#ffffff"/>
    <rect x="72" y="68" width="48" height="48" fill="#dce7f7"/>
    <rect x="120" y="68" width="48" height="48" fill="#c9ced6"/>
    <rect x="168" y="68" width="48" height="48" fill="#dce7f7"/>
    <rect x="216" y="68" width="48" height="48" fill="#ffffff"/>
    <rect x="24" y="116" width="48" height="48" fill="#ffffff"/>
    <rect x="72" y="116" width="48" height="48" fill="#dce7f7"/>
    <rect x="120" y="116" width="48" height="48" fill="#dce7f7"/>
    <rect x="168" y="116" width="48" height="48" fill="#dce7f7"/>
    <rect x="216" y="116" width="48" height="48" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026">
    <text x="48" y="49">0</text><text x="96" y="49">0</text><text x="144" y="49">1</text><text x="192" y="49">0</text><text x="240" y="49">0</text>
    <text x="48" y="97">0</text><text x="96" y="97">1</text><text x="144" y="97" fill="#444c55">0</text><text x="192" y="97">1</text><text x="240" y="97">0</text>
    <text x="48" y="145">0</text><text x="96" y="145">1</text><text x="144" y="145">1</text><text x="192" y="145">1</text><text x="240" y="145">0</text>
  </g>
  <g font-size="12.5" fill="#1a2026">
    <rect x="300" y="44" width="14" height="14" fill="#dce7f7" stroke="#c8cfd6"/>
    <text x="322" y="56">water (1)</text>
    <rect x="300" y="68" width="14" height="14" fill="#c9ced6" stroke="#c8cfd6"/>
    <text x="322" y="80">closed island (0)</text>
    <rect x="300" y="92" width="14" height="14" fill="#ffffff" stroke="#c8cfd6"/>
    <text x="322" y="104">land touching the edge</text>
  </g>
  <text x="300" y="138" fill="#4169E1" font-weight="700" font-size="15">1 closed island</text>
  <text x="300" y="158" fill="#5c6b76" font-size="12.5">only the cell at (1, 2) is fully</text>
  <text x="300" y="175" fill="#5c6b76" font-size="12.5">surrounded by water</text>
</svg>
