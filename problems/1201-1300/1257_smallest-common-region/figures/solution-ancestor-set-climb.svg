<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="364" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- regions Example 1; parent arrows child -> head; blue = ancestors of Quebec -->
  <text x="20" y="18" fill="#5c6b76" font-size="11.5">arrows point child → parent (parent[child] = list head)</text>
  <g stroke="#42525e" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="50" y1="208" x2="80" y2="176"/>
    <line x1="140" y1="208" x2="100" y2="176"/>
    <line x1="240" y1="208" x2="272" y2="176"/>
    <line x1="330" y1="208" x2="290" y2="176"/>
    <line x1="90" y1="148" x2="160" y2="116"/>
    <line x1="280" y1="148" x2="202" y2="116"/>
    <line x1="560" y1="148" x2="560" y2="116"/>
    <line x1="180" y1="88" x2="346" y2="57"/>
    <line x1="560" y1="88" x2="376" y2="57"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#dbe4fb">
    <rect x="338" y="28" width="44" height="24" rx="5"/>
    <rect x="132" y="88" width="96" height="24" rx="5"/>
    <rect x="253" y="148" width="54" height="24" rx="5"/>
    <rect x="303" y="208" width="54" height="24" rx="5"/>
  </g>
  <g stroke="#42525e" stroke-width="1.4" fill="#ffffff">
    <rect x="514" y="88" width="92" height="24" rx="5"/>
    <rect x="44" y="148" width="92" height="24" rx="5"/>
    <rect x="537" y="148" width="46" height="24" rx="5"/>
    <rect x="17" y="208" width="66" height="24" rx="5"/>
    <rect x="114" y="208" width="52" height="24" rx="5"/>
    <rect x="212" y="208" width="56" height="24" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#1a2026">
    <text x="360" y="45">Earth</text>
    <text x="180" y="105">North America</text>
    <text x="560" y="105">South America</text>
    <text x="90" y="165">United States</text>
    <text x="280" y="165">Canada</text>
    <text x="560" y="165">Brazil</text>
    <text x="50" y="225">New York</text>
    <text x="140" y="225">Boston</text>
    <text x="240" y="225">Ontario</text>
    <text x="330" y="225">Quebec</text>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="600">
    <text x="330" y="248" fill="#4169E1">region1</text>
    <text x="50" y="248" fill="#5c6b76">region2</text>
  </g>
  <text x="40" y="270" fill="#1a2026" font-size="12.5">climb from region2, first ancestor lying in region1's set wins:</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="280" width="165" height="28" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="122" y="298" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">1</tspan>  New York — not in set</text>
    <rect x="235" y="280" width="200" height="28" fill="#ffffff" stroke="#42525e" stroke-width="1.4"/>
    <text x="335" y="298" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">2</tspan>  United States — not in set</text>
    <rect x="465" y="280" width="180" height="28" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <text x="555" y="298" fill="#1a2026"><tspan fill="#4169E1" font-weight="600">3</tspan>  North America — in set <tspan fill="#4169E1" font-weight="600">✓</tspan></text>
  </g>
  <g stroke="#5c6b76" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="207" y1="294" x2="231" y2="294"/>
    <line x1="437" y1="294" x2="461" y2="294"/>
  </g>
  <text x="40" y="334" fill="#1a2026" font-size="13">Quebec's ancestor set is {Quebec, Canada, North America, Earth}; climbing</text>
  <text x="40" y="352" fill="#1a2026" font-size="13">from New York, the first hit is <tspan fill="#4169E1" font-weight="600">North America</tspan> — the smallest common region.</text>
</svg>
