<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- intervals [[1,4],[3,6],[2,8]] sorted to [1,4],[2,8],[3,6]; x(t) = 90 + 50t; bars y = 66,126,186, h 26 -->
  <text x="340" y="36" text-anchor="middle" fill="#5c6b76" font-size="12.5">sorted by start ascending, ties by end descending: [1,4], [2,8], [3,6]</text>
  <!-- sweep arrow -->
  <line x1="104" y1="70" x2="104" y2="204" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="104" y="224" text-anchor="middle" fill="#5c6b76" font-size="11.5">sweep</text>
  <!-- best_end marker at 8 -->
  <text x="498" y="60" text-anchor="start" fill="#4169E1" font-size="12.5" font-weight="600">best_end = 8</text>
  <line x1="490" y1="66" x2="490" y2="188" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="490" y1="210" x2="490" y2="232" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- bars -->
  <g stroke-width="1.5">
    <rect x="140" y="66" width="150" height="26" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="190" y="126" width="300" height="26" fill="#dbe4fb" stroke="#4169E1"/>
    <rect x="240" y="186" width="150" height="26" fill="#f0f3f7" stroke="#9aa7b2"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="215" y="84" fill="#1a2026">[1,4]</text>
    <text x="340" y="144" fill="#1a2026">[2,8]</text>
    <text x="315" y="204" fill="#9aa7b2">[3,6]</text>
  </g>
  <g font-size="12.5">
    <text x="302" y="84" fill="#4169E1" font-weight="600">keep</text>
    <text x="502" y="144" fill="#4169E1" font-weight="600">keep</text>
    <text x="402" y="204" fill="#9aa7b2">6 &lt;= 8: covered</text>
  </g>
  <!-- axis -->
  <line x1="90" y1="236" x2="590" y2="236" stroke="#9aa7b2" stroke-width="1"/>
  <g stroke="#9aa7b2" stroke-width="1">
    <line x1="90" y1="236" x2="90" y2="242"/><line x1="140" y1="236" x2="140" y2="242"/>
    <line x1="190" y1="236" x2="190" y2="242"/><line x1="240" y1="236" x2="240" y2="242"/>
    <line x1="290" y1="236" x2="290" y2="242"/><line x1="340" y1="236" x2="340" y2="242"/>
    <line x1="390" y1="236" x2="390" y2="242"/><line x1="440" y1="236" x2="440" y2="242"/>
    <line x1="490" y1="236" x2="490" y2="242"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="90" y="258">0</text><text x="140" y="258">1</text><text x="190" y="258">2</text>
    <text x="240" y="258">3</text><text x="290" y="258">4</text><text x="340" y="258">5</text>
    <text x="390" y="258">6</text><text x="440" y="258">7</text><text x="490" y="258">8</text>
  </g>
  <text x="340" y="290" text-anchor="middle" fill="#1a2026" font-size="13">The sweep keeps [1,4] (4 &gt; -inf) and [2,8] (8 &gt; 4); [3,6]'s end 6 never</text>
  <text x="340" y="310" text-anchor="middle" fill="#1a2026" font-size="13">passes best_end 8, so it is covered - <tspan fill="#4169E1" font-weight="600">2</tspan> intervals survive.</text>
</svg>
