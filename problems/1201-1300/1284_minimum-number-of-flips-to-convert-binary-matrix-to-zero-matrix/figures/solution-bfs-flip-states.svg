<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="372" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- mat = [[0,0],[0,1]] packed as bits (0,0),(0,1),(1,0),(1,1): start 0001, target 0000
       masks: (0,0)=1110 (0,1)=1101 (1,0)=1011 (1,1)=0111; chips 58x30, path column x=410 -->
  <g font-size="11.5" fill="#5c6b76" text-anchor="end">
    <text x="96" y="32">depth 0</text>
    <text x="96" y="108">depth 1 · 4 new</text>
    <text x="96" y="184">depth 2 · 6 new</text>
    <text x="96" y="260">depth 3 · 4 new</text>
  </g>
  <!-- BFS path arrows with the flip masks -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <line x1="410" y1="74" x2="410" y2="111" marker-end="url(#arrow)"/>
    <line x1="410" y1="150" x2="410" y2="187" marker-end="url(#arrow)"/>
    <line x1="410" y1="226" x2="410" y2="263" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#4169E1" font-weight="600">
    <text x="424" y="96">flip (1,0) · XOR 1011</text>
    <text x="424" y="172">flip (0,1) · XOR 1101</text>
    <text x="424" y="248">flip (1,1) · XOR 0111</text>
  </g>
  <!-- depth 0 -->
  <rect x="381" y="40" width="58" height="30" rx="6" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="410" y="60" text-anchor="middle" font-weight="600" fill="#1a2026">0001</text>
  <!-- depth 1: 1111 1100 1010 0110 -->
  <g font-size="12" fill="#5c6b76">
    <text x="185" y="135">flip (0,0)</text>
    <text x="315" y="135">flip (0,1)</text>
    <text x="575" y="135">flip (1,1)</text>
  </g>
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4">
    <rect x="121" y="116" width="58" height="30" rx="6"/>
    <rect x="251" y="116" width="58" height="30" rx="6"/>
    <rect x="511" y="116" width="58" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76">
    <text x="150" y="136">1111</text><text x="280" y="136">1100</text><text x="540" y="136">0110</text>
  </g>
  <rect x="381" y="116" width="58" height="30" rx="6" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="410" y="136" text-anchor="middle" font-weight="600" fill="#1a2026">1010</text>
  <!-- depth 2: 0010 0100 1000 0111 1011 1101 -->
  <g fill="#f0f3f7" stroke="#9aa7b2" stroke-width="1.4">
    <rect x="81" y="192" width="58" height="30" rx="6"/>
    <rect x="181" y="192" width="58" height="30" rx="6"/>
    <rect x="281" y="192" width="58" height="30" rx="6"/>
    <rect x="481" y="192" width="58" height="30" rx="6"/>
    <rect x="581" y="192" width="58" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#5c6b76">
    <text x="110" y="212">0010</text><text x="210" y="212">0100</text><text x="310" y="212">1000</text>
    <text x="510" y="212">1011</text><text x="610" y="212">1101</text>
  </g>
  <rect x="381" y="192" width="58" height="30" rx="6" fill="#ffffff" stroke="#4169E1" stroke-width="2"/>
  <text x="410" y="212" text-anchor="middle" font-weight="600" fill="#1a2026">0111</text>
  <!-- depth 3: 0000 reached -->
  <rect x="381" y="268" width="58" height="30" rx="6" fill="#4169E1"/>
  <text x="410" y="288" text-anchor="middle" font-weight="600" fill="#ffffff">0000</text>
  <text x="446" y="288" fill="#5c6b76" font-size="11.5">+3 more new states</text>
  <text x="410" y="314" text-anchor="middle" fill="#4169E1" font-size="11" font-weight="600">target</text>
  <text x="340" y="336" text-anchor="middle" fill="#1a2026" font-size="13">BFS from 0001 expands each state by the four cell flip masks (XOR) and first reaches</text>
  <text x="340" y="356" text-anchor="middle" fill="#1a2026" font-size="13">0000 at depth 3 - flip (1,0), then (0,1), then (1,1) - so <tspan fill="#4169E1" font-weight="600">3</tspan> flips is optimal.</text>
</svg>
