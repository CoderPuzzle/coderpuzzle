<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="348" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- arr = [1,3,4,1,5]; dp[i][j] cells 62x40, col j at x = 120 + 62j, row i at y = 80 + 40i;
       lower triangle (j < i) unused; dp[0][3] = dp[1][2] = 2 (equal ends 1...1),
       dp[0][4] = dp[0][3] + dp[4][4] = 2 + 1 = 3 (split k = 3) -->
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="151" y="72">j=0</text><text x="213" y="72">j=1</text><text x="275" y="72">j=2</text>
    <text x="337" y="72">j=3</text><text x="399" y="72">j=4</text>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="end">
    <text x="112" y="104">i=0</text><text x="112" y="144">i=1</text><text x="112" y="184">i=2</text>
    <text x="112" y="224">i=3</text><text x="112" y="264">i=4</text>
  </g>
  <g stroke="#42525e" stroke-width="1.2">
    <g fill="#f0f3f7">
      <rect x="120" y="120" width="62" height="40"/><rect x="120" y="160" width="62" height="40"/>
      <rect x="182" y="160" width="62" height="40"/><rect x="120" y="200" width="62" height="40"/>
      <rect x="182" y="200" width="62" height="40"/><rect x="244" y="200" width="62" height="40"/>
      <rect x="120" y="240" width="62" height="40"/><rect x="182" y="240" width="62" height="40"/>
      <rect x="244" y="240" width="62" height="40"/><rect x="306" y="240" width="62" height="40"/>
    </g>
    <g fill="#ffffff">
      <rect x="120" y="80" width="62" height="40"/><rect x="182" y="80" width="62" height="40"/>
      <rect x="244" y="80" width="62" height="40"/><rect x="306" y="80" width="62" height="40"/>
      <rect x="182" y="120" width="62" height="40"/><rect x="244" y="120" width="62" height="40"/>
      <rect x="306" y="120" width="62" height="40"/>
      <rect x="244" y="160" width="62" height="40"/><rect x="306" y="160" width="62" height="40"/>
      <rect x="306" y="200" width="62" height="40"/>
    </g>
    <rect x="368" y="80" width="62" height="40" fill="#dbe4fb" stroke="#4169E1" stroke-width="1.6"/>
    <rect x="368" y="240" width="62" height="40" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="15">
    <g fill="#1a2026">
      <text x="151" y="105">1</text><text x="213" y="105">2</text><text x="275" y="105">3</text>
      <text x="213" y="145">1</text><text x="337" y="145">3</text><text x="399" y="145">4</text>
      <text x="275" y="185">1</text><text x="337" y="185">2</text><text x="399" y="185">3</text>
      <text x="337" y="225">1</text><text x="399" y="225">2</text>
      <text x="399" y="265">1</text>
    </g>
    <g fill="#4169E1">
      <text x="337" y="105">2</text>
      <text x="399" y="105">3</text>
      <text x="275" y="145">2</text>
    </g>
  </g>
  <!-- dp[1][2] wraps into dp[0][3]; dp[0][3] + dp[4][4] splits into dp[0][4] -->
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 288 130 L 322 110" marker-end="url(#arrow)"/>
    <path d="M 354 100 H 382" marker-end="url(#arrow)"/>
    <path d="M 430 260 H 452 V 100 H 436" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5c6b76" font-size="12.5">
    <text x="470" y="88">fill by increasing length;</text>
    <text x="470" y="108">diagonal (len 1): all 1,</text>
    <text x="470" y="128">len 2: 1 if equal, else 2.</text>
    <text x="470" y="156" fill="#1a2026" font-weight="600">equal ends 1...1 at [0..3]:</text>
    <text x="470" y="176">dp[0][3] = dp[1][2] = 2 &#8212;</text>
    <text x="470" y="196">the ends ride the interior's</text>
    <text x="470" y="216">last move, no extra cost.</text>
    <text x="470" y="244" fill="#1a2026" font-weight="600">split k = 3 at [0..4]:</text>
    <text x="470" y="264">dp[0][4] = 2 + dp[4][4]</text>
    <text x="478" y="284">= 2 + 1 = 3</text>
  </g>
  <text x="340" y="312" text-anchor="middle" fill="#1a2026" font-size="13">Equal ends ride the interior's last move for free: dp[0][3] = dp[1][2] = 2,</text>
  <text x="340" y="330" text-anchor="middle" fill="#1a2026" font-size="13">then dp[0][4] = dp[0][3] + dp[4][4] = <tspan fill="#4169E1" font-weight="600">3</tspan> &#8212; the statement's [4], [1,3,1], [5].</text>
</svg>
