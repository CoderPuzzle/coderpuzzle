<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- 3x3 grid, minimum falling path highlighted -->
  <g stroke="#c8cfd6" stroke-width="1">
    <rect x="40" y="24" width="60" height="60" fill="#e8edfb" stroke="#4169E1" stroke-width="2.2"/>
    <rect x="100" y="24" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="24" width="60" height="60" fill="#ffffff"/>
    <rect x="40" y="84" width="60" height="60" fill="#ffffff"/>
    <rect x="100" y="84" width="60" height="60" fill="#e8edfb" stroke="#4169E1" stroke-width="2.2"/>
    <rect x="160" y="84" width="60" height="60" fill="#ffffff"/>
    <rect x="40" y="144" width="60" height="60" fill="#e8edfb" stroke="#4169E1" stroke-width="2.2"/>
    <rect x="100" y="144" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="144" width="60" height="60" fill="#ffffff"/>
  </g>
  <g text-anchor="middle">
    <text x="70" y="60" font-weight="700" fill="#4169E1">1</text>
    <text x="130" y="60" fill="#1a2026">2</text>
    <text x="190" y="60" fill="#1a2026">3</text>
    <text x="70" y="120" fill="#1a2026">4</text>
    <text x="130" y="120" font-weight="700" fill="#4169E1">5</text>
    <text x="190" y="120" fill="#1a2026">6</text>
    <text x="70" y="180" font-weight="700" fill="#4169E1">7</text>
    <text x="130" y="180" fill="#1a2026">8</text>
    <text x="190" y="180" fill="#1a2026">9</text>
  </g>
  <g stroke="#4169E1" stroke-width="2.6" fill="none">
    <path d="M 70 54 L 122 100" marker-end="url(#a)"/>
    <path d="M 130 114 L 78 160" marker-end="url(#a)"/>
  </g>
  <text x="252" y="100" fill="#1a2026" font-weight="600" font-size="14">minimum path: 1 → 5 → 7</text>
  <text x="252" y="124" fill="#4169E1" font-weight="700" font-size="15">1 + 5 + 7 = 13</text>
  <text x="252" y="150" fill="#5c6b76" font-size="12.5">each step goes one row down,</text>
  <text x="252" y="167" fill="#5c6b76" font-size="12.5">never straight below the previous cell</text>
</svg>
