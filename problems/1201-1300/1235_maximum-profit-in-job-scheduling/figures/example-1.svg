<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 252" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="505" y="26" text-anchor="end" fill="#4169E1" font-weight="600">chosen profit: 50 + 70 = 120</text>
  <!-- timeline -->
  <line x1="40" y1="212" x2="512" y2="212" stroke="#1a2026" stroke-width="1.5"/>
  <g stroke="#1a2026">
    <line x1="50" y1="212" x2="50" y2="218"/><line x1="135" y1="212" x2="135" y2="218"/>
    <line x1="220" y1="212" x2="220" y2="218"/><line x1="305" y1="212" x2="305" y2="218"/>
    <line x1="390" y1="212" x2="390" y2="218"/><line x1="475" y1="212" x2="475" y2="218"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="50" y="233">1</text><text x="135" y="233">2</text><text x="220" y="233">3</text>
    <text x="305" y="233">4</text><text x="390" y="233">5</text><text x="475" y="233">6</text>
    <text x="530" y="233" fill="#5c6b76">time</text>
  </g>
  <!-- job bars: chosen = accent -->
  <rect x="50" y="40" width="170" height="30" rx="4" fill="#e8edfb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="60" y="60" fill="#1a2026" font-weight="600">job 1 — profit 50</text>
  <rect x="135" y="82" width="170" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <text x="145" y="102" fill="#5c6b76">job 2 — profit 10</text>
  <rect x="220" y="124" width="170" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <text x="230" y="144" fill="#5c6b76">job 3 — profit 40</text>
  <rect x="220" y="166" width="255" height="30" rx="4" fill="#e8edfb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="230" y="186" fill="#1a2026" font-weight="600">job 4 — profit 70</text>
</svg>
