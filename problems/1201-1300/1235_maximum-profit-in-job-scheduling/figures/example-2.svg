<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="560" y="26" text-anchor="end" fill="#4169E1" font-weight="600">chosen profit: 20 + 70 + 60 = 150</text>
  <!-- timeline -->
  <line x1="36" y1="260" x2="566" y2="260" stroke="#1a2026" stroke-width="1.5"/>
  <g stroke="#1a2026">
    <line x1="45" y1="260" x2="45" y2="266"/><line x1="97" y1="260" x2="97" y2="266"/>
    <line x1="149" y1="260" x2="149" y2="266"/><line x1="201" y1="260" x2="201" y2="266"/>
    <line x1="253" y1="260" x2="253" y2="266"/><line x1="305" y1="260" x2="305" y2="266"/>
    <line x1="357" y1="260" x2="357" y2="266"/><line x1="409" y1="260" x2="409" y2="266"/>
    <line x1="461" y1="260" x2="461" y2="266"/><line x1="513" y1="260" x2="513" y2="266"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="45" y="281">1</text><text x="97" y="281">2</text><text x="149" y="281">3</text>
    <text x="201" y="281">4</text><text x="253" y="281">5</text><text x="305" y="281">6</text>
    <text x="357" y="281">7</text><text x="409" y="281">8</text><text x="461" y="281">9</text>
    <text x="513" y="281">10</text><text x="572" y="281" fill="#5c6b76">time</text>
  </g>
  <!-- job bars: chosen = accent -->
  <rect x="45" y="40" width="104" height="30" rx="4" fill="#e8edfb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="55" y="60" fill="#1a2026" font-weight="600">job 1 — 20</text>
  <rect x="97" y="82" width="156" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <text x="107" y="102" fill="#5c6b76">job 2 — 20</text>
  <rect x="149" y="124" width="364" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <text x="159" y="144" fill="#5c6b76">job 3 — 100</text>
  <rect x="201" y="166" width="104" height="30" rx="4" fill="#e8edfb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="211" y="186" fill="#1a2026" font-weight="600">job 4 — 70</text>
  <rect x="305" y="208" width="156" height="30" rx="4" fill="#e8edfb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="315" y="228" fill="#1a2026" font-weight="600">job 5 — 60</text>
</svg>
