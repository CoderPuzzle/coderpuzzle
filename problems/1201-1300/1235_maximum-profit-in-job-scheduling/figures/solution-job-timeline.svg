<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 338" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<rect x="100" y="60" width="120" height="26" rx="4" fill="#e8edf8" stroke="#4169E1" stroke-width="2"/>
  <text x="92" y="78" text-anchor="end" fill="#5c6b76" font-size="11">job 0</text>
  <text x="160" y="78" text-anchor="middle" fill="#1a2026" font-weight="600">70</text>
  <rect x="160" y="106" width="120" height="26" rx="4" fill="#ffffff" stroke="#1a2026" stroke-width="1.2"/>
  <text x="152" y="124" text-anchor="end" fill="#5c6b76" font-size="11">job 1</text>
  <text x="220" y="124" text-anchor="middle" fill="#1a2026" font-weight="600">10</text>
  <rect x="220" y="152" width="120" height="26" rx="4" fill="#ffffff" stroke="#1a2026" stroke-width="1.2"/>
  <text x="212" y="170" text-anchor="end" fill="#5c6b76" font-size="11">job 2</text>
  <text x="280" y="170" text-anchor="middle" fill="#1a2026" font-weight="600">40</text>
  <rect x="220" y="198" width="180" height="26" rx="4" fill="#e8edf8" stroke="#4169E1" stroke-width="2"/>
  <text x="212" y="216" text-anchor="end" fill="#5c6b76" font-size="11">job 3</text>
  <text x="310" y="216" text-anchor="middle" fill="#1a2026" font-weight="600">70</text>
  <line x1="40" y1="240" x2="40" y2="248" stroke="#42525e"/><text x="40" y="266" text-anchor="middle" fill="#5c6b76" font-size="11">0</text>
  <line x1="100" y1="240" x2="100" y2="248" stroke="#42525e"/><text x="100" y="266" text-anchor="middle" fill="#5c6b76" font-size="11">1</text>
  <line x1="160" y1="240" x2="160" y2="248" stroke="#42525e"/><text x="160" y="266" text-anchor="middle" fill="#5c6b76" font-size="11">2</text>
  <line x1="220" y1="240" x2="220" y2="248" stroke="#42525e"/><text x="220" y="266" text-anchor="middle" fill="#5c6b76" font-size="11">3</text>
  <line x1="280" y1="240" x2="280" y2="248" stroke="#42525e"/><text x="280" y="266" text-anchor="middle" fill="#5c6b76" font-size="11">4</text>
  <line x1="340" y1="240" x2="340" y2="248" stroke="#42525e"/><text x="340" y="266" text-anchor="middle" fill="#5c6b76" font-size="11">5</text>
  <line x1="400" y1="240" x2="400" y2="248" stroke="#42525e"/><text x="400" y="266" text-anchor="middle" fill="#5c6b76" font-size="11">6</text>
  <line x1="460" y1="240" x2="460" y2="248" stroke="#42525e"/><text x="460" y="266" text-anchor="middle" fill="#5c6b76" font-size="11">7</text>
  <line x1="40" y1="244" x2="460" y2="244" stroke="#42525e"/>
  <text x="40" y="300" fill="#5c6b76" font-size="12">Sorted by end time, jobs 0 and 3 (shaded) do not overlap and yield 50 + 70 = 120;</text>
  <text x="40" y="318" fill="#5c6b76" font-size="12">sharing time 3 is allowed since a job starting at X fits after one ending at X.</text>
</svg>
