name: Publish runner image

# Builds runner/ and pushes it to GHCR. This is the published home of
# the authoring toolchain (openoj format / gen-starters / judge — see
# docs/AUTHORING.md); a tag push publishes that version, and every
# merge to main refreshes :latest.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["runner/**", ".github/workflows/publish-runner.yml"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # arm64 builds run under QEMU emulation on the amd64 runner; only the
      # native arch would be built without this (see TODO.md, multi-arch).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: runner
          file: runner/Dockerfile
          # Both the x86_64 VM and Apple-Silicon authoring hosts are served
          # by the published manifest list; arm64 is cross-built under QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
