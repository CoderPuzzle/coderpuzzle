name: Check fallback problems

# The offline fallback set bundled in this repo (coderpuzzle/problems/, used
# when OPENOJ_PROBLEMS is unset). The pinned image runs the two gates that
# apply to a one-bundle set — format check and a full judge of every
# solution against every case (coderpuzzle judge refuses a zero-case bundle) —
# on every push touching it. The bank repo's schema/static tier is not
# duplicated here. (problems-originals lives in the problems repo and is
# frozen; it is not covered by CI.)

on:
  push:
    branches: [main]
    paths: ["problems/**", ".github/workflows/check-fallback.yml"]
  pull_request:
    paths: ["problems/**", ".github/workflows/check-fallback.yml"]
  workflow_dispatch:

permissions:
  contents: read
  # the container job's ghcr auto-login needs this: without it the
  # GITHUB_TOKEN has no package access and the pull is DENIED
  packages: read

concurrency:
  group: check-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coderpuzzle/coderpuzzle:latest
      options: --user 0:0
    steps:
      - uses: actions/checkout@v5
      - name: Format check
        run: coderpuzzle format --check problems
      - name: Judge every bundle
        run: |
          set -e
          failures=0
          for bundle in problems/*/*/; do
            if ! coderpuzzle judge "$bundle"; then failures=$((failures + 1)); fi
          done
          echo "fallback bundles with failures: $failures"
          exit $((failures > 0))
