name: Tests

# The repo's own test suite — the automated execution judge, api and
# tooling changes get before landing, inside the same pinned image the
# judge uses.
#
# Bundle gates are deliberately NOT part of CI any more: the problem bank
# is pluggable (the full corpus lives in the standalone lc-original /
# lc-adapt repositories), so bundle validation is an on-demand authoring
# tool instead. From a checkout of the problem repo, run the image with
# the repo mounted at /tools:
#
#   docker run --rm --user 0:0 -v "$PWD":/tools \
#     ghcr.io/coderpuzzle/coderpuzzle:latest \
#     coderpuzzle check  --tree /tools/problems            # static gate
#   docker run --rm --user 0:0 -v "$PWD":/tools \
#     ghcr.io/coderpuzzle/coderpuzzle:latest \
#     coderpuzzle judge  /tools/problems/0001-0100/0001_pair-sum
#                                                          # solution correctness
# Both are documented as steps of docs/AUTHORING.md's authoring loop.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/coderpuzzle/coderpuzzle:latest
      options: --user 0:0
    steps:
      - uses: actions/checkout@v5
      # The image is the judge toolchain; the api test tier needs the app's
      # pinned deps, and the suite needs pytest plus httpx (starlette's
      # TestClient). Installed at job time so the image stays
      # publish-independent.
      - name: Install test deps
        run: pip install -q -r api/requirements.txt pytest httpx
      - name: Run the test suite
        run: python3 -m pytest tests/ -q
